<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Social App</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1877f2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f0f2f5;
  color:#222;
}

.hidden{
  display:none!important;
}

.container{
  width:100%;
  max-width:600px;
  margin:auto;
}

/* LOGIN */

.auth{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.auth-box{
  width:100%;
  max-width:400px;
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 4px 20px rgba(0,0,0,.12);
}

.logo{
  text-align:center;
  color:#1877f2;
  font-size:34px;
  font-weight:bold;
  margin-bottom:20px;
}

input,
textarea{
  width:100%;
  padding:13px;
  margin:7px 0;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:15px;
  outline:none;
}

textarea{
  resize:vertical;
  min-height:80px;
}

button{
  border:0;
  border-radius:8px;
  padding:12px 16px;
  cursor:pointer;
  font-weight:bold;
  font-size:14px;
}

.blue{
  background:#1877f2;
  color:white;
}

.green{
  background:#42b72a;
  color:white;
}

.gray{
  background:#e4e6eb;
  color:#222;
}

.danger{
  background:#e41e3f;
  color:white;
}

.auth button{
  width:100%;
  margin-top:8px;
}

.msg{
  color:#e41e3f;
  text-align:center;
  margin-top:10px;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:20;
  background:#1877f2;
  color:white;
  padding:12px;
  box-shadow:0 2px 6px rgba(0,0,0,.2);
}

.header-inner{
  max-width:900px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.header-title{
  font-size:20px;
  font-weight:bold;
}

.logout{
  background:white;
  color:#1877f2;
  padding:8px 12px;
}

/* NAV */

nav{
  position:sticky;
  top:54px;
  z-index:19;
  background:white;
  border-bottom:1px solid #ddd;
  overflow-x:auto;
}

.nav-inner{
  max-width:900px;
  margin:auto;
  display:flex;
  gap:5px;
  padding:7px;
}

.nav-inner button{
  background:white;
  white-space:nowrap;
}

.nav-inner button:hover{
  background:#f0f2f5;
}

/* MAIN */

main{
  max-width:900px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  border-radius:12px;
  padding:15px;
  margin-bottom:15px;
  box-shadow:0 1px 4px rgba(0,0,0,.1);
}

.card h2{
  margin-bottom:10px;
}

/* POST */

.post-user{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:10px;
}

.avatar{
  width:45px;
  height:45px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd;
}

.post-image{
  width:100%;
  max-height:500px;
  object-fit:cover;
  border-radius:10px;
  margin-top:10px;
}

.post-actions{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
  margin-top:10px;
}

.post-actions button{
  flex:1;
  min-width:70px;
  background:#f0f2f5;
}

.comment-box{
  display:flex;
  gap:5px;
  margin-top:10px;
}

.comment-box input{
  margin:0;
}

.comment{
  background:#f0f2f5;
  padding:8px;
  border-radius:10px;
  margin-top:6px;
}

/* PROFILE */

.cover{
  width:100%;
  height:220px;
  object-fit:cover;
  border-radius:12px 12px 0 0;
  background:#ddd;
}

.profile-head{
  text-align:center;
  margin-top:-50px;
  position:relative;
}

.profile-avatar{
  width:100px;
  height:100px;
  border-radius:50%;
  border:5px solid white;
  object-fit:cover;
  background:#ddd;
}

.profile-name{
  font-size:24px;
  font-weight:bold;
  margin-top:8px;
}

/* FILE */

.file{
  margin:8px 0;
}

/* LOADING */

.loading{
  text-align:center;
  padding:30px;
  font-size:18px;
}

/* MOBILE */

@media(max-width:600px){

  main{
    padding:8px;
  }

  .card{
    border-radius:8px;
  }

  .header-title{
    font-size:17px;
  }

  .nav-inner button{
    padding:9px 11px;
  }

  .cover{
    height:170px;
  }

}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginPage" class="auth">

  <div class="auth-box">

    <div class="logo">
      My Social App
    </div>

    <div id="loginBox">

      <h2 style="text-align:center;margin-bottom:15px">
        Login
      </h2>

      <input
        id="email"
        type="email"
        placeholder="Email"
      >

      <input
        id="password"
        type="password"
        placeholder="Password"
      >

      <button
        class="blue"
        onclick="login()"
      >
        Login
      </button>

      <button
        class="green"
        onclick="showRegister()"
      >
        Create new account
      </button>

      <div id="loginMsg" class="msg"></div>

    </div>


    <div id="registerBox" class="hidden">

      <h2 style="text-align:center;margin-bottom:15px">
        Create Account
      </h2>

      <input
        id="regName"
        type="text"
        placeholder="Your Name"
      >

      <input
        id="regEmail"
        type="email"
        placeholder="Email"
      >

      <input
        id="regPassword"
        type="password"
        placeholder="Password"
      >

      <button
        class="green"
        onclick="registerUser()"
      >
        Register
      </button>

      <button
        class="gray"
        onclick="showLogin()"
      >
        Back to Login
      </button>

      <div id="regMsg" class="msg"></div>

    </div>

  </div>

</div>


<!-- APP -->

<div id="app" class="hidden">

<header id="header">

  <div class="header-inner">

    <div class="header-title">
      My Social App
    </div>

    <button
      class="logout"
      onclick="logout()"
    >
      Logout
    </button>

  </div>

</header>


<nav>

  <div class="nav-inner">

    <button onclick="section('home')">
      🏠 Home
    </button>

    <button onclick="section('profile')">
      👤 Profile
    </button>

    <button onclick="section('friends')">
      👥 Friends
    </button>

    <button onclick="section('messages')">
      💬 Messenger
    </button>

    <button onclick="section('notifications')">
      🔔 Notifications
    </button>

    <button onclick="section('creator')">
      💰 Creator
    </button>

    <button onclick="section('admin')">
      👑 Admin
    </button>

  </div>

</nav>


<main>

<!-- HOME -->

<section id="homeSection">

  <div class="card">

    <h2>Create Post</h2>

    <textarea
      id="postText"
      placeholder="What's on your mind?"
    ></textarea>

    <input
      id="postImage"
      class="file"
      type="file"
      accept="image/*"
    >

    <button
      class="blue"
      onclick="createPost()"
    >
      Post
    </button>

    <div id="postMsg" class="msg"></div>

  </div>

  <div id="feed">
    <div class="loading">
      Loading...
    </div>
  </div>

</section>


<!-- PROFILE -->

<section id="profileSection" class="hidden">

  <div id="profileView"></div>

  <div class="card">

    <h2>Edit Profile</h2>

    <input
      id="editName"
      placeholder="Name"
    >

    <textarea
      id="editBio"
      placeholder="Bio"
    ></textarea>

    <label>Profile Photo</label>

    <input
      id="editProfilePhoto"
      type="file"
      accept="image/*"
    >

    <label>Cover Photo</label>

    <input
      id="editCoverPhoto"
      type="file"
      accept="image/*"
    >

    <button
      class="blue"
      onclick="saveProfile()"
    >
      Save Profile
    </button>

    <div id="profileMsg" class="msg"></div>

  </div>

</section>


<!-- FRIENDS -->

<section id="friendsSection" class="hidden">

  <div class="card">

    <h2>Friends</h2>

    <input
      id="friendSearch"
      placeholder="Search users..."
      oninput="searchUsers()"
    >

  </div>

  <div id="usersList"></div>

  <div class="card">

    <h2>Friend Requests</h2>

    <div id="friendRequests"></div>

  </div>

  <div class="card">

    <h2>My Friends</h2>

    <div id="friendsList"></div>

  </div>

</section>


<!-- MESSAGES -->

<section id="messagesSection" class="hidden">

  <div class="card">

    <h2>Messenger</h2>

    <input
      id="messageUser"
      placeholder="Receiver User ID"
    >

    <input
      id="messageText"
      placeholder="Write message..."
    >

    <button
      class="blue"
      onclick="sendMessage()"
    >
      Send
    </button>

  </div>

  <div
    id="messagesList"
    class="card"
  >
    No messages
  </div>

</section>


<!-- NOTIFICATIONS -->

<section id="notificationsSection" class="hidden">

  <div class="card">

    <h2>Notifications</h2>

    <div id="notificationsList">
      Loading...
    </div>

  </div>

</section>


<!-- CREATOR -->

<section id="creatorSection" class="hidden">

  <div class="card">

    <h2>Creator Dashboard</h2>

    <p>
      Total Earnings:
      <strong id="earnings">
        $0.00
      </strong>
    </p>

  </div>

  <div class="card">

    <h2>Upload Reel</h2>

    <input
      id="reelVideo"
      type="file"
      accept="video/*"
    >

    <input
      id="reelCaption"
      placeholder="Caption"
    >

    <button
      class="blue"
      onclick="uploadReel()"
    >
      Upload Reel
    </button>

    <div id="reelMsg" class="msg"></div>

  </div>

  <div id="reelsList"></div>

</section>


<!-- ADMIN -->

<section id="adminSection" class="hidden">

  <div class="card">

    <h2>Admin Panel</h2>

    <p>
      Admin:
      <strong id="adminName">
        -
      </strong>
    </p>

  </div>

  <div class="card">

    <h2>Users</h2>

    <div id="adminUsers">
      Loading...
    </div>

  </div>

  <div class="card">

    <h2>Reports</h2>

    <div id="reportsList">
      Loading...
    </div>

  </div>

</section>

</main>

</div>


<script>

/* SUPABASE */

const SUPABASE_URL =
"https://skereuaizdczbvjplisi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_3R2otJA1zIlsMsTYxe1ocw_NAPY5O9x";

const db =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* HELPER */

const $ = id =>
document.getElementById(id);


/* GLOBAL */

let me = null;
let profile = null;


/* LOGIN PAGE */

function showRegister(){

  $("loginBox").classList.add("hidden");

  $("registerBox").classList.remove("hidden");

  $("loginMsg").textContent = "";

}


function showLogin(){

  $("registerBox").classList.add("hidden");

  $("loginBox").classList.remove("hidden");

  $("regMsg").textContent = "";

}


/* LOGIN */

async function login(){

  const email =
    $("email").value.trim();

  const password =
    $("password").value;

  $("loginMsg").textContent =
    "Logging in...";

  if(!email || !password){

    $("loginMsg").textContent =
      "Email এবং Password দিন।";

    return;
  }

  try{

    const {data,error} =
      await db.auth.signInWithPassword({
        email,
        password
      });

    if(error){

      $("loginMsg").textContent =
        error.message;

      return;
    }

    await start(data.user);

  }catch(err){

    console.error(err);

    $("loginMsg").textContent =
      "Login error: " + err.message;

  }

}


/* REGISTER */

async function registerUser(){

  const name =
    $("regName").value.trim();

  const email =
    $("regEmail").value.trim();

  const password =
    $("regPassword").value;

  $("regMsg").textContent =
    "Creating account...";

  if(!name || !email || !password){

    $("regMsg").textContent =
      "সব তথ্য দিন।";

    return;
  }

  if(password.length < 6){

    $("regMsg").textContent =
      "Password কমপক্ষে ৬ অক্ষরের হতে হবে।";

    return;
  }

  try{

    const {data,error} =
      await db.auth.signUp({
        email,
        password
      });

    if(error){

      $("regMsg").textContent =
        error.message;

      return;
    }

    if(data.session && data.user){

      await db
        .from("profiles")
        .upsert({
          id:data.user.id,
          name:name,
          bio:"",
          role:"user"
        });

      $("regMsg").textContent =
        "Account তৈরি হয়েছে।";

      await start(data.user);

    }else{

      $("regMsg").textContent =
        "Account তৈরি হয়েছে। Email verification লাগতে পারে। Email check করে Login করুন।";

    }

  }catch(err){

    console.error(err);

    $("regMsg").textContent =
      err.message;

  }

}


/* START APP */

async function start(user){

  try{

    me = user;

    await loadProfile();

    $("loginPage").classList.add("hidden");

    $("app").classList.remove("hidden");

    $("header").classList.remove("hidden");

    section("home");

  }catch(err){

    console.error(err);

    $("loginPage").classList.remove("hidden");

    $("app").classList.add("hidden");

    $("loginMsg").textContent =
      "App start error: " + err.message;

  }

}


/* PROFILE LOAD */

async function loadProfile(){

  if(!me) return;

  let {data,error} =
    await db
      .from("profiles")
      .select("*")
      .eq("id",me.id)
      .maybeSingle();

  if(error){

    console.error(error);

    throw new Error(
      "Profile load error: " +
      error.message
    );

  }

  if(!data){

    const name =
      me.email
        ? me.email.split("@")[0]
        : "User";

    const result =
      await db
        .from("profiles")
        .insert({
          id:me.id,
          name:name,
          bio:"",
          role:"user"
        })
        .select()
        .single();

    if(result.error){

      throw new Error(
        "Profile create error: " +
        result.error.message
      );

    }

    data = result.data;

  }

  profile = data;

}


/* LOGOUT */

async function logout(){

  await db.auth.signOut();

  me = null;

  profile = null;

  location.reload();

}


/* SECTION */

function section(name){

  const sections = [
    "home",
    "profile",
    "friends",
    "messages",
    "notifications",
    "creator",
    "admin"
  ];

  sections.forEach(x => {

    const el =
      $(x + "Section");

    if(el){

      el.classList.add("hidden");

    }

  });

  const selected =
    $(name + "Section");

  if(selected){

    selected.classList.remove("hidden");

  }


  if(name === "home")
    loadFeed();

  if(name === "profile")
    renderProfile();

  if(name === "friends"){
    loadFriendRequests();
    loadFriends();
    searchUsers();
  }

  if(name === "messages")
    loadMessages();

  if(name === "notifications")
    loadNotifications();

  if(name === "creator"){
    loadEarnings();
    loadReels();
  }

  if(name === "admin")
    loadAdmin();

}


/* UPLOAD MEDIA */

async function uploadMedia(file){

  if(!file)
    return "";

  const ext =
    file.name.split(".").pop();

  const path =
    me.id + "/" +
    Date.now() + "." +
    ext;

  const {error} =
    await db.storage
      .from("media")
      .upload(path,file,{
        upsert:false
      });

  if(error)
    throw error;

  const {data} =
    db.storage
      .from("media")
      .getPublicUrl(path);

  return data.publicUrl;

}


/* CREATE POST */

async function createPost(){

  const text =
    $("postText").value.trim();

  const file =
    $("postImage").files[0];

  $("postMsg").textContent =
    "Posting...";

  try{

    let imageUrl = "";

    if(file){

      imageUrl =
        await uploadMedia(file);

    }

    const {error} =
      await db
        .from("posts")
        .insert({
          user_id:me.id,
          text:text,
          image_url:imageUrl
        });

    if(error)
      throw error;

    $("postText").value = "";

    $("postImage").value = "";

    $("postMsg").textContent =
      "Post published!";

    loadFeed();

  }catch(err){

    console.error(err);

    $("postMsg").textContent =
      err.message;

  }

}


/* FEED */

async function loadFeed(){

  const feed =
    $("feed");

  feed.innerHTML =
    "<div class='loading'>Loading...</div>";

  const {data,error} =
    await db
      .from("posts")
      .select("*")
      .order("created_at",{
        ascending:false
      });

  if(error){

    feed.innerHTML =
      "<div class='card'>"+
      error.message+
      "</div>";

    return;
  }

  if(!data || !data.length){

    feed.innerHTML =
      "<div class='card'>No posts yet.</div>";

    return;
  }

  feed.innerHTML = "";

  for(const post of data){

    let author = {
      name:"User",
      profile_photo:""
    };

    const result =
      await db
        .from("profiles")
        .select("name,profile_photo")
        .eq("id",post.user_id)
        .maybeSingle();

    if(result.data)
      author = result.data;

    const div =
      document.createElement("div");

    div.className = "card";

    const avatar =
      author.profile_photo ||
      "https://via.placeholder.com/100";

    div.innerHTML = `

      <div class="post-user">

        <img
          class="avatar"
          src="${avatar}"
        >

        <div>

          <strong>
            ${escapeHTML(author.name || "User")}
          </strong>

          <div style="font-size:12px;color:#777">
            ${new Date(post.created_at).toLocaleString()}
          </div>

        </div>

      </div>

      <div>
        ${escapeHTML(post.text || "")}
      </div>

      ${
        post.image_url
        ?
        `<img
          class="post-image"
          src="${post.image_url}"
        >`
        :
        ""
      }

      <div class="post-actions">

        <button onclick="reactPost(${post.id},'like')">
          👍 Like
        </button>

        <button onclick="reactPost(${post.id},'love')">
          ❤️ Love
        </button>

        <button onclick="sharePost(${post.id})">
          ↗ Share
        </button>

        ${
          post.user_id === me.id
          ?
          `<button onclick="deletePost(${post.id})">
            🗑 Delete
          </button>`
          :
          `<button onclick="reportPost(${post.id})">
            🚩 Report
          </button>`
        }

      </div>

      <div
        id="comments-${post.id}"
      >
        Loading comments...
      </div>

      <div class="comment-box">

        <input
          id="comment-${post.id}"
          placeholder="Write a comment..."
        >

        <button
          class="blue"
          onclick="addComment(${post.id})"
        >
          Send
        </button>

      </div>

    `;

    feed.appendChild(div);

    loadComments(post.id);

  }

}


/* ESCAPE */

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* REACTION */

async function reactPost(postId,reaction){

  const {data} =
    await db
      .from("post_reactions")
      .select("id")
      .eq("post_id",postId)
      .eq("user_id",me.id)
      .maybeSingle();

  if(data){

    await db
      .from("post_reactions")
      .update({
        reaction:reaction
      })
      .eq("id",data.id);

  }else{

    await db
      .from("post_reactions")
      .insert({
        post_id:postId,
        user_id:me.id,
        reaction:reaction
      });

  }

}


/* COMMENTS */

async function loadComments(postId){

  const box =
    $("comments-" + postId);

  if(!box)
    return;

  const {data} =
    await db
      .from("comments")
      .select("*")
      .eq("post_id",postId)
      .order("created_at");

  box.innerHTML = "";

  if(!data || !data.length){

    box.innerHTML =
      "<small>No comments yet.</small>";

    return;
  }

  for(const c of data){

    let name = "User";

    const p =
      await db
        .from("profiles")
        .select("name")
        .eq("id",c.user_id)
        .maybeSingle();

    if(p.data)
      name = p.data.name;

    const div =
      document.createElement("div");

    div.className =
      "comment";

    div.innerHTML =
      "<strong>" +
      escapeHTML(name) +
      "</strong>: " +
      escapeHTML(c.text);

    box.appendChild(div);

  }

}


/* ADD COMMENT */

async function addComment(postId){

  const input =
    $("comment-" + postId);

  const text =
    input.value.trim();

  if(!text)
    return;

  const {error} =
    await db
      .from("comments")
      .insert({
        post_id:postId,
        user_id:me.id,
        text:text
      });

  if(error){

/* SHARE */

async function sharePost(id){

  const url =
    location.href +
    "?post=" +
    id;

  if(navigator.share){

    await navigator.share({
      title:"My Social App",
      url:url
    });

  }else{

    await navigator.clipboard.writeText(url);

    alert("Post link copied!");

  }

}


/* DELETE POST */

async function deletePost(id){

  if(!confirm("Delete this post?"))
    return;

  const {error} =
    await db
      .from("posts")
      .delete()
      .eq("id",id)
      .eq("user_id",me.id);

  if(error){

    alert(error.message);

    return;
  }

  loadFeed();

}


/* REPORT */

async function reportPost(id){

  const reason =
    prompt("Report reason?");

  if(!reason)
    return;

  const {error} =
    await db
      .from("reports")
      .insert({
        reporter_id:me.id,

/* PROFILE VIEW */

function renderProfile(){

  const name =
    profile?.name || "User";

  const bio =
    profile?.bio || "";

  const photo =
    profile?.profile_photo ||
    "https://via.placeholder.com/200";

  const cover =
    profile?.cover_photo ||
    "https://via.placeholder.com/900x300";

  $("profileView").innerHTML = `

    <div class="card">

      <img
        class="cover"
        src="${cover}"
      >

      <div class="profile-head">

        <img
          class="profile-avatar"
          src="${photo}"
        >

        <div class="profile-name">
          ${escapeHTML(name)}
        </div>

        <p style="margin-top:6px">
          ${escapeHTML(bio)}
        </p>

      </div>

    </div>

  `;

  $("editName").value =
    profile?.name || "";

  $("editBio").value =
    profile?.bio || "";

}


/* SAVE PROFILE */

async function saveProfile(){

  $("profileMsg").textContent =
    "Saving...";

  try{

    let profilePhoto =
      profile?.profile_photo || "";

    let coverPhoto =
      profile?.cover_photo || "";

    const pFile =
      $("editProfilePhoto").files[0];

    const cFile =
      $("editCoverPhoto").files[0];

    if(pFile)
      profilePhoto =
        await uploadMedia(pFile);

    if(cFile)
      coverPhoto =
        await uploadMedia(cFile);

    const {data,error} =
      await db
        .from("profiles")
        .update({
          name:$("editName").value.trim(),
          bio:$("editBio").value.trim(),
          profile_photo:profilePhoto,
          cover_photo:coverPhoto
        })
        .eq("id",me.id)
        .select()
        .single();

    if(error)
      throw error;

    profile = data;

    $("profileMsg").textContent =
      "Profile updated!";

    renderProfile();

  }catch(err){

    $("profileMsg").textContent =
      err.message;

  }

}


/* USER SEARCH */

async function searchUsers(){

  const q =
    $("friendSearch").value.trim();

  let query =
    db
      .from("profiles")
      .select("*")
      .neq("id",me.id)
      .limit(20);

  if(q){

    query =
      query.ilike(
        "name",
        "%" + q + "%"
      );

  }

  const {data,error} =
    await query;

  const box =
    $("usersList");

  box.innerHTML = "";

  if(error){

    box.innerHTML =
      "<div class='card'>" +
      error.message +
      "</div>";

    return;
  }

  for(const u of data || []){

    const div =
      document.createElement("div");

    div.className = "card";

    div.innerHTML = `

      <strong>
        ${escapeHTML(u.name || "User")}
      </strong>

      <p>
        ${escapeHTML(u.bio || "")}
      </p>

      <button
        class="blue"
        onclick="sendFriendRequest('${u.id}')"
      >
        Add Friend
      </button>

    `;

    box.appendChild(div);

  }

}


/* FRIEND REQUEST */

async function sendFriendRequest(receiver){

  const {error} =
    await db
      .from("friend_requests")
      .insert({
        sender_id:me.id,
        receiver_id:receiver,
        status:"pending"
      });

  if(error){

    alert(error.message);

    return;
  }

  await db
    .from("notifications")
    .insert({
      receiver_id:receiver,
      text:"You received a friend request."
    });

  alert("Friend request sent.");

}


/* REQUESTS */

async function loadFriendRequests(){

  const {data} =
    await db
      .from("friend_requests")
      .select("*")
      .eq("receiver_id",me.id)
      .eq("status","pending")
      .order("created_at",{
        ascending:false
      });

  const box =
    $("friendRequests");

  box.innerHTML = "";

  for(const r of data || []){

    let name = "User";

    const p =
      await db
        .from("profiles")
        .select("name")
        .eq("id",r.sender_id)
        .maybeSingle();

    if(p.data)
      name = p.data.name;

    const div =
      document.createElement("div");

    div.className =
      "card";

    div.innerHTML = `

      <strong>
        ${escapeHTML(name)}
      </strong>

      <br><br>

      <button
        class="green"
        onclick="acceptRequest(${r.id},'${r.sender_id}')"
      >
        Accept
      </button>

      <button
        class="danger"
        onclick="rejectRequest(${r.id})"
      >
        Reject
      </button>

    `;

    box.appendChild(div);

  }

}


/* ACCEPT */

async function acceptRequest(id,friendId){

  await db
    .from("friend_requests")
    .update({
      status:"accepted"
    })
    .eq("id",id);

  await db
    .from("friends")
    .insert([
      {
        user_id:me.id,
        friend_id:friendId
      },
      {
        user_id:friendId,
        friend_id:me.id
      }
    ]);

  await db
    .from("notifications")
    .insert({
      receiver_id:friendId,
      text:"Your friend request was accepted."
    });

  loadFriendRequests();
  loadFriends();

}


/* REJECT */

async function rejectRequest(id){

  await db
    .from("friend_requests")
    .update({
      status:"rejected"
    })
    .eq("id",id);

  loadFriendRequests();

}

/* SEND MESSAGE */

async function sendMessage(){

  const receiver =
    $("messageUser").value.trim();

  const text =
    $("messageText").value.trim();

  if(!receiver || !text){

    alert("Receiver ID এবং message দিন।");

    return;
  }

  const {error} =
    await db
      .from("messages")
      .insert({
        sender_id:me.id,
        receiver_id:receiver,
        text:text
      });

  if(error){

    alert(error.message);

    return;
  }

  $("messageText").value = "";

  loadMessages();

}


/* LOAD MESSAGES */

async function loadMessages(){

  const {data,error} =
    await db
      .from("messages")
      .select("*")
      .or(
        "sender_id.eq." +
        me.id +
        ",receiver_id.eq." +
        me.id
      )
      .order("created_at",{
        ascending:true
      });

  const box =
    $("messagesList");

  if(error){

    box.innerHTML =
      error.message;

    return;
  }

  box.innerHTML = "";

  for(const m of data || []){

    const div =
      document.createElement("div");

    div.className =
      "comment";

    div.innerHTML = `

      <strong>
        ${m.sender_id === me.id ? "You" : "User"}
      </strong>

      : ${escapeHTML(m.text || "")}

      <small>
        ${new Date(m.created_at).toLocaleString()}
      </small>

    `;

    box.appendChild(div);

  }

}

/* REEL UPLOAD */

async function uploadReel(){

  const file =
    $("reelVideo").files[0];

  const caption =
    $("reelCaption").value.trim();

  if(!file){

    $("reelMsg").textContent =
      "Video নির্বাচন করুন।";

    return;
  }

  $("reelMsg").textContent =
    "Uploading...";

  try{

    const url =
      await uploadMedia(file);

    const {error} =
      await db
        .from("reels")
        .insert({
          user_id:me.id,
          video_url:url,
          caption:caption
        });

    if(error)
      throw error;

    $("reelMsg").textContent =
      "Reel uploaded!";

    $("reelVideo").value = "";

    $("reelCaption").value = "";

    loadReels();

  }catch(err){

    $("reelMsg").textContent =
      err.message;

  }

}

async function loadReels(){

  const {data,error} =
    await db
      .from("reels")
      .select("*")
      .order("created_at",{
        ascending:false
      });

  const box =
    $("reelsList");

  box.innerHTML = "";

    box.innerHTML =
      "<div class='card'>" +
      error.message +
      "</div>";

    return;
  }

  for(const r of data || []){

    const div =

    div.className =
