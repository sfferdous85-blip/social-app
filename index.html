<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#1877f2">

<style>
:root{
 --primary:#1877f2;
 --primary2:#0d65d9;
 --bg:#f0f2f5;
 --card:#fff;
 --text:#111;
 --muted:#65676b;
 --border:#ddd;
 --danger:#e41e3f;
 --success:#20a464;
 --shadow:0 2px 12px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
 font-family:Arial,Helvetica,sans-serif;
 background:var(--bg);
 color:var(--text);
 transition:.2s;
}
body.dark{
 --bg:#101214;
 --card:#1b1e22;
 --text:#f5f5f5;
 --muted:#aaa;
 --border:#34383d;
 --shadow:0 2px 12px rgba(0,0,0,.3);
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.top{
 position:sticky;
 top:0;
 z-index:1000;
 height:60px;
 background:var(--card);
 border-bottom:1px solid var(--border);
 display:flex;
 align-items:center;
 padding:8px 12px;
 gap:10px;
}
.logo{
 font-size:21px;
 font-weight:800;
 color:var(--primary);
 white-space:nowrap;
}
.search{
 flex:1;
 max-width:480px;
 background:var(--bg);
 border-radius:22px;
 padding:10px 15px;
 border:0;
 outline:0;
 color:var(--text);
}
.top-actions{
 margin-left:auto;
 display:flex;
 gap:7px;
}
.icon{
 width:40px;
 height:40px;
 border:0;
 border-radius:50%;
 background:var(--bg);
 color:var(--text);
 font-size:18px;
}
.icon:hover{background:#dfe2e6}

.layout{
 max-width:1400px;
 margin:auto;
 display:grid;
 grid-template-columns:250px minmax(0,680px) 280px;
 gap:18px;
 padding:18px;
}
.left,.right{
 position:sticky;
 top:78px;
 height:max-content;
}
.main{min-width:0}

.side-card,.card{
 background:var(--card);
 border-radius:14px;
 box-shadow:var(--shadow);
 border:1px solid var(--border);
 margin-bottom:14px;
 overflow:hidden;
}
.side-item{
 padding:12px 14px;
 display:flex;
 gap:12px;
 align-items:center;
 border:0;
 background:none;
 color:var(--text);
 width:100%;
 text-align:left;
 border-radius:10px;
}
.side-item:hover{background:var(--bg)}
.side-item b{font-size:14px}
.side-icon{font-size:20px;width:28px;text-align:center}

.profile-mini{
 padding:15px;
 display:flex;
 align-items:center;
 gap:10px;
}
.avatar{
 width:44px;
 height:44px;
 border-radius:50%;
 object-fit:cover;
 background:#ddd;
}
.avatar.big{width:76px;height:76px}
.avatar.small{width:34px;height:34px}

.btn{
 border:0;
 border-radius:8px;
 padding:9px 14px;
 background:var(--primary);
 color:white;
 font-weight:700;
}
.btn:hover{background:var(--primary2)}
.btn.gray{background:var(--bg);color:var(--text)}
.btn.red{background:var(--danger)}
.btn.green{background:var(--success)}
.btn.outline{
 background:transparent;
 color:var(--primary);
 border:1px solid var(--primary);
}

.auth{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
}
.auth-box{
 width:100%;
 max-width:420px;
 background:var(--card);
 padding:28px;
 border-radius:18px;
 box-shadow:var(--shadow);
}
.auth-box h1{
 color:var(--primary);
 text-align:center;
}
.field{
 width:100%;
 padding:12px;
 border:1px solid var(--border);

textarea.field{resize:vertical;min-height:90px}

.tabs{

.tab{

 border:0;
 background:none;

}

.composer{

.composer-row{

}
.composer-input{

}
.story.add{

}

.post-head{

}
.post-head .info{flex:1}

.post-body{padding:0 14px 12px}
.post-media{

.post-actions{

 border-bottom:1px solid var(--border);
}
.post-action{
 flex:1;

}
.post-action:hover{background:var(--bg)}
.post-action.active{color:var(--primary)}
.comment-box{

 padding:10px 14px;
}
.comment-box input{

 border:0;
 background:var(--bg);

.comment{

.comment-bubble{
 background:var(--bg);

 padding:8px 12px;
}

.section-title{
 padding:15px;
 font-size:18px;

}
.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px;
 padding:12px;
}
.option{

 border:1px solid var(--border);

 padding:15px;

}
.option .emoji{font-size:28px;display:block;margin-bottom:7px}

.reels{

.reel{

.reel video{

.reel-overlay{

}
.reel-btn{

 border:0;

 background:rgba(0,0,0,.55);

}
.reel-top{

.profile-cover{

.profile-info{

.modal{

 background:rgba(0,0,0,.65);

 display:flex;
 align-items:center;
 justify-content:center;
 padding:15px;
}
.modal-box{
 width:100%;

 max-height:90vh;
 overflow:auto;
 background:var(--card);
 border-radius:16px;

}
.modal-head{

 align-items:center;
 padding:15px;
 border-bottom:1px solid var(--border);
}
.modal-body{padding:15px}

.toast{
 position:fixed;
 left:50%;
 bottom:25px;
 transform:translateX(-50%);
 background:#111;

 padding:12px 18px;
 border-radius:10px;
 z-index:5000;
 opacity:0;
 pointer-events:none;
 transition:.25s;
}
.toast.show{opacity:1}

.notification{

 gap:10px;
 padding:12px;
 border-bottom:1px solid var(--border);
}
.notification.unread{background:#eaf3ff}
body.dark .notification.unread{background:#15283f}

.friend{
 display:flex;
 gap:10px;
 padding:12px;
 align-items:center;
 border-bottom:1px solid var(--border);
}
.friend-info{flex:1}

.stat-grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px;
 padding:12px;
}
.stat{
 background:var(--bg);
 border-radius:12px;
 padding:15px;
}
.stat b{
 display:block;
 font-size:24px;
 margin-top:5px;
}

.setting{

 border-bottom:1px solid var(--border);
 display:flex;
 align-items:center;
 gap:12px;
}
.setting-info{flex:1}
.setting small{display:block;color:var(--muted);margin-top:3px}

.switch{
 width:48px;
 height:27px;
 border-radius:20px;
 background:#aaa;

}
.switch i{
 display:block;
 width:21px;
 height:21px;

 background:#fff;
 transition:.2s;
}
.switch.on{background:var(--primary)}
.switch.on i{margin-left:21px}

.chat-list{max-height:550px;overflow:auto}
.chat-user{
 padding:12px;
 display:flex;
 gap:10px;
 border-bottom:1px solid var(--border);
 cursor:pointer;
}
.chat-user:hover{background:var(--bg)}
.chat-window{
 height:500px;
 display:flex;
 flex-direction:column;
}
.messages{
 flex:1;
 overflow:auto;
 padding:15px;
}
.message{
 max-width:75%;
 padding:9px 12px;
 border-radius:15px;
 margin:6px 0;
 background:var(--bg);
}
.message.mine{
 margin-left:auto;
 background:var(--primary);
 color:#fff;

@media(max-width:1000px){
 .layout{grid-template-columns:70px minmax(0,1fr)}
 .right{display:none}

}
</style>
</head>

<script>
/* =========================================================
   CONFIG
========================================================= */

const SUPABASE_URL="https://skereuaizdczbvjplisi.supabase.co";

const SUPABASE_KEY="sb_publishable_3R2otJA1zIlsMsTYxe1ocw_NAPY5O9x";

const FUNCTION_URL=
"https://skereuaizdczbvjplisi.supabase.co/functions/v1/super-function";

const {createClient}=supabase;

const db=createClient(SUPABASE_URL,SUPABASE_KEY);

let USER=null;
let PROFILE=null;
let currentPage="home";
let currentChatUser=null;
let currentSearch="";
let reelsData=[];
let notificationsData=[];

/* =========================================================
   HELPERS
========================================================= */

function toast(msg){
 const t=document.getElementById("toast");
 t.textContent=msg;
 t.classList.add("show");
 setTimeout(()=>t.classList.remove("show"),2500);
}

function esc(v){
 if(v===null||v===undefined)return "";
 return String(v)
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;");
}

function avatar(url,name="User"){
 return url||
 "https://ui-avatars.com/api/?name="+encodeURIComponent(name)+"&background=1877f2&color=fff";
}

function timeAgo(date){
 if(!date)return "";
 const sec=Math.floor((Date.now()-new Date(date).getTime())/1000);
 if(sec<60)return "এখন";
 if(sec<3600)return Math.floor(sec/60)+" মিনিট";
 if(sec<86400)return Math.floor(sec/3600)+" ঘণ্টা";
 return Math.floor(sec/86400)+" দিন";
}

async function api(path,options={}){
 try{
  const session=(await db.auth.getSession()).data.session;

  const headers={
   "Content-Type":"application/json",
   ...(options.headers||{})
  };

  if(session?.access_token){
   headers.Authorization="Bearer "+session.access_token;
  }

  const res=await fetch(FUNCTION_URL+path,{
   ...options,
   headers
  });

  let data=null;
  try{data=await res.json()}catch{}

  if(!res.ok){
   throw new Error(data?.error||data?.message||"Request failed");
  }

  return data;
 }catch(e){
  console.error(path,e);
  throw e;
}

}

async function uploadFile(bucket,file){
 if(!file) return null;

 const ext=file.name.split(".").pop();
 const path=USER.id+"/"+Date.now()+"_"+Math.random().toString(36).slice(2)+"."+ext;

 const {error}=await db.storage
  .from(bucket)
  .upload(path,file,{upsert:false});

 if(error)throw error;

 const {data}=db.storage
  .from(bucket)
  .getPublicUrl(path);

 return data.publicUrl;
}

/* =========================================================
   AUTH
========================================================= */

function authTab(type,btn){
 document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
 btn.classList.add("active");

 document.getElementById("loginBox").classList.toggle("hidden",type!=="login");
 document.getElementById("registerBox").classList.toggle("hidden",type!=="register");
}

async function login(){
 const email=document.getElementById("loginEmail").value.trim();
 const password=document.getElementById("loginPassword").value;

 if(!email||!password){
  toast("Email ও Password দিন");
  return;
 }

 const {error}=await db.auth.signInWithPassword({
  email,password
 });

 if(error){
  document.getElementById("authMsg").textContent=error.message;
  return;
 }

 toast("Login successful");
}

async function register(){
 const name=document.getElementById("regName").value.trim();
 const username=document.getElementById("regUsername").value.trim();
 const email=document.getElementById("regEmail").value.trim();
 const password=document.getElementById("regPassword").value;

 if(!name||!email||!password){
  toast("সব তথ্য দিন");
  return;
 }

 const {data,error}=await db.auth.signUp({
  email,password,
  options:{
   data:{name,username}
  }
 });

 if(error){
  document.getElementById("authMsg").textContent=error.message;
  return;
 }

 toast("Account তৈরি হয়েছে");

 if(data.session){
  await startApp(data.session.user);
 }
}

async function logout(){
 await db.auth.signOut();
 location.reload();
}

async function startApp(user){
 USER=user;

 document.getElementById("auth").classList.add("hidden");
 document.getElementById("app").classList.remove("hidden");

 await loadProfile();

 openPage("home");
 subscribeRealtime();
}

db.auth.onAuthStateChange(async(event,session)=>{
 if(session && !USER){
  await startApp(session.user);
 }
});

/* =========================================================
   PROFILE
========================================================= */

async function loadProfile(){
 try{
  const r=await api("/profile");
  PROFILE=r.profile||r;

  document.getElementById("miniName").textContent=
   PROFILE.name||USER.email?.split("@")[0]||"User";

  document.getElementById("miniAvatar").src=
   avatar(PROFILE.profile_photo,PROFILE.name);
 }catch(e){

  PROFILE={
   id:USER.id,
   name:USER.user_metadata?.name||USER.email?.split("@")[0]||"User",
   username:USER.user_metadata?.username||"user"
  };

  document.getElementById("miniName").textContent=PROFILE.name;
  document.getElementById("miniAvatar").src=avatar("",PROFILE.name);
 }
}

/* =========================================================
   PAGE ROUTER
========================================================= */

function openPage(page){
 currentPage=page;

 const pages={
  home:renderHome,
  reels:renderReelsPage,
  friends:renderFriends,
  messages:renderMessages,
  profile:renderProfile,
  notifications:renderNotifications,
  settings:renderSettings,
  creator:renderCreator,
  admin:renderAdmin,
  search:renderSearch,
  groups:renderGroups,
  pages:renderPages,
  marketplace:renderMarketplace,
  events:renderEvents,
  saved:renderSaved,
  memories:renderMemories,
  live:renderLive,
  calls:renderCalls,
  coins:renderCoins,
  subscriptions:renderSubscriptions
 };

 if(pages[page])pages[page]();
 else renderHome();
}

/* =========================================================
   HOME
========================================================= */

async function renderHome(){
 const main=document.getElementById("main");

 main.innerHTML=`
 <div class="card">
  <div class="tabs">
   <button class="tab active" onclick="feedMode('home',this)">🏠 Home</button>

async function loadReels(){
 const box=document.getElementById("reelsList");
 if(!box)return;

 box.innerHTML=`<div style="padding:40px;text-align:center;background:#000;color:#fff">Loading Reels...</div>`;

 try{
  const r=await api("/reels");
  reelsData=r.reels||r.data||[];

  if(!reelsData.length){
   box.innerHTML=`<div style="padding:50px;text-align:center;background:#000;color:#fff">No Reels yet 🎬</div>`;
   return;
  }

  box.innerHTML=reelsData.map(reelHTML).join("");

  document.querySelectorAll(".reel video").forEach(v=>{
   v.muted=true;

   const observer=new IntersectionObserver(entries=>{
    entries.forEach(e=>{
     if(e.isIntersecting){
      v.play().catch(()=>{});
      const id=v.dataset.id;
      api("/reels/"+id+"/view",{method:"POST"}).catch(()=>{});
     }else{
      v.pause();
     }
    });
   },{threshold:.7});

   observer.observe(v);
  });

 }catch(e){
  box.innerHTML=`<div style="padding:40px;background:#000;color:#fff;text-align:center">${esc(e.message)}</div>`;
 }
}

async function friendsTab(type,btn){
 if(btn){
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");
 }

 const box=document.getElementById("friendsBox");
 if(!box)return;

 box.innerHTML=`<div class="card" style="padding:30px">Loading...</div>`;

 try{
  if(type==="requests"){
   const {data,error}=await db
    .from("friend_requests")
    .select("*")
    .eq("receiver_id",USER.id)
    .eq("status","pending");

   if(error)throw error;

   box.innerHTML=(data||[]).map(r=>`
    <div class="card friend">
     <img class="avatar" src="${avatar("",r.sender_id)}">
     <div class="friend-info"><b>Friend Request</b><br><small>${r.sender_id}</small></div>
     <button class="btn green" onclick="respondFriend(${r.id},'accepted')">Accept</button>
     <button class="btn red" onclick="respondFriend(${r.id},'rejected')">Reject</button>
    </div>
   `).join("")||emptyBox("No friend requests");
  }

  if(type==="friends"){
   const {data,error}=await db
    .from("friends")
    .select("*")
    .or("user_id.eq."+USER.id+",friend_id.eq."+USER.id);

   if(error)throw error;

   box.innerHTML=(data||[]).map(f=>{
    const id=f.user_id===USER.id?f.friend_id:f.user_id;
    return`
     <div class="card friend">
      <img class="avatar" src="${avatar("",id)}">
      <div class="friend-info"><b>Friend</b><br><small>${id}</small></div>
      <button class="btn outline" onclick="openUserProfile('${id}')">Profile</button>
     </div>`;
   }).join("")||emptyBox("No friends yet");
  }

  if(type==="suggestions"){
   const r=await api("/search?q=");
   const users=r.users||r.profiles||[];

   box.innerHTML=users
    .filter(u=>u.id!==USER.id)
    .map(u=>`
     <div class="card friend">
      <img class="avatar" src="${avatar(u.profile_photo,u.name)}">
      <div class="friend-info">
       <b>${esc(u.name)}</b><br>
       <small>@${esc(u.username||"user")}</small>
      </div>
      <button class="btn" onclick="sendFriend('${u.id}')">Add Friend</button>
     </div>
    `).join("")||emptyBox("No suggestions");
  }

 }catch(e){
  box.innerHTML=`<div class="card" style="padding:25px">${esc(e.message)}</div>`;
 }
}

  <input id="chatUserId" class="field" placeholder="Friend User ID">
  <button class="btn" onclick="openChat(document.getElementById('chatUserId').value)">Open Chat</button>
 `);
}

async function openChat(id){
 if(!id)return;

 currentChatUser=id;
 hideModal();

 const area=document.getElementById("chatArea");

 area.innerHTML=`
  <div style="padding:12px;border-bottom:1px solid var(--border)">
   <b>💬 Chat</b>
   <button class="btn gray" style="float:right" onclick="callUser('${id}','video')">📹</button>
  </div>
  <div id="messages" class="messages">Loading...</div>
  <div class="comment-box">
   <input id="messageText" placeholder="Write a message..."
    onkeydown="if(event.key==='Enter')sendMessage()">
   <input id="messageFile" type="file" hidden>
   <button class="icon" onclick="document.getElementById('messageFile').click()">📎</button>
   <button class="btn" onclick="sendMessage()">Send</button>
  </div>
 `;

 await loadMessages(id);
}

async function loadMessages(id){
 const box=document.getElementById("messages");
 if(!box)return;

 try{
  const {data,error}=await db
   .from("messages")
   .select("*")
   .or(
    "and(sender_id.eq."+USER.id+",receiver_id.eq."+id+"),"+
    "and(sender_id.eq."+id+",receiver_id.eq."+USER.id+")"
   )
   .order("created_at",{ascending:true});

  if(error)throw error;

  box.innerHTML=(data||[]).map(m=>`
   <div class="message ${m.sender_id===USER.id?"mine":""}">
    ${esc(m.text||"")}
    <small style="display:block;opacity:.7">${timeAgo(m.created_at)}</small>
   </div>
  `).join("");

  box.scrollTop=box.scrollHeight;

 }catch(e){
  box.innerHTML=`
   <div style="padding:20px;text-align:center">
    Messages table/backend এখনো configure হয়নি।
   </div>`;
 }
}

async function sendMessage(){
 const input=document.getElementById("messageText");
 const text=input?.value.trim();

 if(!text||!currentChatUser)return;

 try{
  const {error}=await db.from("messages").insert({
   sender_id:USER.id,
   receiver_id:currentChatUser,
   text
  });

  if(error)throw error;

  input.value="";
  await loadMessages(currentChatUser);
 }catch(e){
  toast("Message backend configure করুন");
 }
}

  <button class="btn" style="width:100%" onclick="saveProfile()">Save Changes</button>
 `);
}

async function saveProfile(){
 try{
  let photo=PROFILE.profile_photo;
  let cover=PROFILE.cover_photo;

  const pf=document.getElementById("editPhoto").files[0];
  const cf=document.getElementById("editCover").files[0];

  if(pf)photo=await uploadFile("profile-photos",pf);
  if(cf)cover=await uploadFile("profile-photos",cf);

  await api("/profile",{
   method:"PATCH",
   body:JSON.stringify({
    name:document.getElementById("editName").value,
    username:document.getElementById("editUsername").value,
    bio:document.getElementById("editBio").value,
    profile_photo:photo,
    cover_photo:cover
   })
  });

  hideModal();
  await loadProfile();
  toast("Profile updated");
  renderProfile();
 }catch(e){toast(e.message)}
}

function openUserProfile(id){

}

async function toggleSetting(type,el){
 if(type==="dark"){
  setTheme(!document.body.classList.contains("dark"));
  return;
 }

 el.classList.toggle("on");

 try{
  await api("/settings",{
   method:"PATCH",
   body:JSON.stringify({
    [type]:el.classList.contains("on")
   })
  });
 }catch{}
}

 localStorage.setItem("theme",dark?"dark":"light");
}

function subscribeRealtime(){

 try{
  db.channel("notifications-"+USER.id)
   .on(
    "postgres_changes",
    {
     event:"INSERT",
     schema:"public",
     table:"notifications",
     filter:"receiver_id=eq."+USER.id
    },
    payload=>{
     toast("🔔 New notification");
    }
   )
   .subscribe();
 }catch{}

 try{
  db.channel("messages-"+USER.id)
   .on(
    "postgres_changes",
    {
     event:"INSERT",
     schema:"public",
     table:"messages",
     filter:"receiver_id=eq."+USER.id
    },
    payload=>{
     toast("💬 New message");
     if(currentPage==="messages"&&currentChatUser){
      loadMessages(currentChatUser);
     }
    }
   )
   .subscribe();
 }catch{}
}

   <button class="option"><span class="emoji">🪙</span>Coins</button>

function callUser(id,type){
 showModal(type==="video"?"📹 Video Call":"📞 Voice Call",`
  <div style="text-align:center;padding:30px">
   <div style="font-size:70px">👤</div>
   <h2>${type==="video"?"Video":"Voice"} Call</h2>
   <p style="color:var(--muted)">Call interface ready</p>
   <button class="btn red" onclick="hideModal()">End Call</button>
  </div>
 `);
}

/* keyboard shortcuts */
document.addEventListener("keydown",e=>{
 if(e.key==="/" && document.activeElement.tagName!=="INPUT"){
  e.preventDefault();
  document.getElementById("globalSearch").focus();
 }
});

/* make top logo clickable */
document.querySelector(".logo")?.addEventListener("click",()=>openPage("home"));
