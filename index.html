<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1877f2">
<meta name="description" content="My Social App - Premium Social Network">
<title>My Social App</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --blue:#1877f2;
  --blue2:#0866ff;
  --bg:#f0f2f5;
  --card:#fff;
  --text:#1c1e21;
  --muted:#65676b;
  --border:#dddfe2;
  --soft:#eef3f8;
  --danger:#e41e3f;
  --green:#31a24c;
  --shadow:0 2px 12px rgba(0,0,0,.08);
  --radius:16px;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}

body.dark{
  --bg:#101114;
  --card:#18191c;
  --text:#f5f6f7;
  --muted:#b0b3b8;
  --border:#303236;
  --soft:#242526;
  --shadow:0 2px 14px rgba(0,0,0,.35);
}

.hidden{display:none!important}
.app{min-height:100vh}

/* TOPBAR */
.topbar{
  position:sticky;
  top:0;
  z-index:1000;
  height:62px;
  background:var(--card);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  padding:0 14px;
  gap:12px;
}
.logo{
  color:var(--blue);
  font-size:25px;
  font-weight:800;
  white-space:nowrap;
}
.searchbox{
  flex:1;
  max-width:430px;
  position:relative;
}
.searchbox input{
  width:100%;
  border:0;
  outline:0;
  background:var(--soft);
  color:var(--text);
  border-radius:25px;
  padding:11px 16px 11px 40px;
}
.searchicon{
  position:absolute;
  left:14px;
  top:10px;
  font-size:17px;
}
.top-actions{
  margin-left:auto;
  display:flex;
  gap:7px;
}
.iconbtn{
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:var(--soft);
  color:var(--text);
  font-size:19px;
}
.iconbtn:hover{background:#dfe3e8}

.layout{
  max-width:1250px;
  margin:auto;
  display:grid;
  grid-template-columns:230px minmax(0,650px) 260px;
  gap:18px;
  padding:18px 12px 90px;
}

.sidebar,.rightbar{
  position:sticky;
  top:78px;
  align-self:start;
}
.navbtn{
  width:100%;
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 13px;
  border:0;
  background:transparent;
  color:var(--text);
  border-radius:12px;
  text-align:left;
  margin-bottom:3px;
  font-weight:600;
}
.navbtn:hover,.navbtn.active{background:var(--soft)}
.navicon{font-size:21px;width:25px;text-align:center}

.card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  border:1px solid var(--border);
  margin-bottom:15px;
}
.cardpad{padding:15px}

.section-title{
  font-size:18px;
  font-weight:800;
  margin:0 0 12px;
}

/* AUTH */
.auth{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  background:linear-gradient(135deg,#e7f0ff,#f0f2f5);
}
.auth-card{
  width:100%;
  max-width:420px;
  background:var(--card);
  border-radius:22px;
  box-shadow:0 10px 40px rgba(0,0,0,.15);
  padding:28px;
}
.auth-title{
  color:var(--blue);
  font-size:34px;
  font-weight:900;
  text-align:center;
  margin-bottom:5px;
}
.auth-sub{
  color:var(--muted);
  text-align:center;
  margin-bottom:25px;
}
.field{
  margin-bottom:12px;
}
.field label{
  display:block;
  font-size:13px;
  color:var(--muted);
  margin-bottom:5px;
}
.field input,.field textarea,.field select{
  width:100%;
  border:1px solid var(--border);
  border-radius:10px;
  padding:12px;
  outline:0;
  background:var(--card);
  color:var(--text);
}
.field textarea{resize:vertical;min-height:90px}

.primary{
  border:0;
  background:var(--blue);
  color:white;
  padding:11px 18px;
  border-radius:10px;
  font-weight:700;
}
.primary:hover{background:var(--blue2)}
.secondary{
  border:1px solid var(--border);
  background:var(--soft);
  color:var(--text);
  padding:10px 15px;
  border-radius:10px;
  font-weight:700;
}
.danger{
  background:var(--danger);
  color:white;
  border:0;
  padding:10px 15px;
  border-radius:10px;
}

/* PROFILE MINI */
.mini-profile{
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px;
  border-radius:12px;
  cursor:pointer;
}
.mini-profile:hover{background:var(--soft)}
.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd;
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:800;
  overflow:hidden;
}
.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.avatar.big{
  width:105px;
  height:105px;
  border:4px solid var(--card);
}
.name{font-weight:800}
.muted{color:var(--muted);font-size:13px}

/* STORIES */
.stories{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:5px 0 10px;
}
.story{
  min-width:110px;
  height:175px;
  border-radius:14px;
  overflow:hidden;
  position:relative;
  background:linear-gradient(160deg,#1877f2,#7b61ff);
  color:#fff;
  cursor:pointer;
}
.story img,.story video{
  width:100%;
  height:100%;
  object-fit:cover;
}
.story-overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(transparent 45%,rgba(0,0,0,.7));
}
.story-name{
  position:absolute;
  bottom:9px;
  left:9px;
  right:5px;
  font-size:12px;
  font-weight:700;
}
.add-story{
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:8px;
  font-weight:700;
}
.add-story .plus{
  width:45px;
  height:45px;
  background:white;
  color:var(--blue);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
}

/* COMPOSER */
.composer{
  display:flex;
  gap:10px;
  align-items:center;
}
.composer textarea{
  flex:1;
  border:0;
  background:var(--soft);
  color:var(--text);
  border-radius:24px;
  padding:12px 16px;
  resize:none;
  outline:0;
  min-height:44px;
}
.composer-actions{
  display:flex;
  gap:8px;
  margin-top:12px;
  border-top:1px solid var(--border);
  padding-top:10px;
}
.actionbtn{
  flex:1;
  border:0;
  background:transparent;
  color:var(--muted);
  padding:9px;
  border-radius:9px;
  font-weight:700;
}
.actionbtn:hover{background:var(--soft)}

/* POSTS */
.post-head{
  display:flex;
  align-items:center;
  gap:10px;
  padding:15px 15px 8px;
}
.post-head .more{
  margin-left:auto;
  border:0;
  background:transparent;
  color:var(--muted);
  font-size:22px;
}
.post-body{
  padding:8px 15px 10px;
}
.post-text{
  white-space:pre-wrap;
  line-height:1.5;
}
.post-image{
  width:100%;
  max-height:600px;
  object-fit:cover;
  display:block;
  margin-top:10px;
}
.post-meta{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:13px;
  padding:8px 15px;
}
.post-actions{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
  margin:0 15px;
}
.post-action{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:10px 4px;
  font-weight:700;
}
.post-action:hover{background:var(--soft)}
.post-action.liked{color:var(--blue)}
.comment-box{
  display:flex;
  gap:8px;
  padding:10px 15px;
}
.comment-box input{
  flex:1;
  border:0;
  outline:0;
  background:var(--soft);
  color:var(--text);
  border-radius:20px;
  padding:10px 14px;
}
.comments-list{
  padding:0 15px 10px;
}
.comment{
  display:flex;
  gap:8px;
  margin:8px 0;
}
.comment-bubble{
  background:var(--soft);
  padding:8px 12px;
  border-radius:14px;
  max-width:85%;
}

/* REELS */
.reels-wrap{
  display:flex;
  flex-direction:column;
  gap:15px;
}
.reel{
  height:720px;
  max-height:calc(100vh - 100px);
  min-height:520px;
  background:#000;
  border-radius:18px;
  overflow:hidden;
  position:relative;
}
.reel video{
  width:100%;
  height:100%;
  object-fit:cover;
}
.reel-gradient{
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(
    transparent 35%,
    transparent 50%,
    rgba(0,0,0,.8)
  );
}
.reel-info{
  position:absolute;
  bottom:15px;
  left:15px;
  right:85px;
  color:white;
}
.reel-user{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:8px;
}
.reel-caption{line-height:1.45}
.reel-actions{
  position:absolute;
  right:12px;
  bottom:90px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.reel-btn{
  width:50px;
  height:50px;
  border-radius:50%;
  border:0;
  background:rgba(0,0,0,.55);
  color:white;
  font-size:20px;
}
.reel-count{
  font-size:11px;
  display:block;
  margin-top:-7px;
  text-align:center;
  color:#fff;
}
.reel-mute{
  position:absolute;
  right:15px;
  top:15px;
  width:42px;
  height:42px;
  border-radius:50%;
  border:0;
  background:rgba(0,0,0,.5);
  color:white;
  font-size:19px;
}

/* PROFILE */
.cover{
  height:230px;
  border-radius:18px 18px 0 0;
  background:linear-gradient(135deg,#1877f2,#7b61ff);
  overflow:hidden;
}
.cover img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.profile-main{
  padding:0 20px 20px;
  position:relative;
}
.profile-avatar{
  margin-top:-55px;
  position:relative;
}
.profile-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}
.profile-stats{
  display:flex;
  gap:25px;
  margin-top:15px;
}
.stat strong{font-size:18px}
.stat span{display:block;color:var(--muted);font-size:12px}

/* SEARCH */
.search-result{
  display:flex;
  gap:12px;
  align-items:center;
  padding:10px;
  border-radius:12px;
  cursor:pointer;
}
.search-result:hover{background:var(--soft)}

/* RIGHT */
.suggestion{
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 0;
}
.suggestion-info{flex:1}
.smallbtn{
  border:0;
  background:var(--blue);
  color:white;
  border-radius:8px;
  padding:6px 9px;
  font-size:12px;
  font-weight:700;
}

/* SETTINGS */
.setting-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 0;
  border-bottom:1px solid var(--border);
}
.setting-row:last-child{border-bottom:0}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  z-index:3000;
  background:rgba(0,0,0,.65);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
}
.modal-card{
  width:100%;
  max-width:560px;
  max-height:90vh;
  overflow:auto;
  background:var(--card);
  color:var(--text);
  border-radius:18px;
  box-shadow:0 15px 50px rgba(0,0,0,.3);
}
.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:15px;
  border-bottom:1px solid var(--border);
}
.modal-body{padding:15px}
.close{
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:var(--soft);
  color:var(--text);
  font-size:20px;
}

/* TOAST */
.toast{
  position:fixed;
  bottom:25px;
  left:50%;
  transform:translateX(-50%) translateY(20px);
  background:#222;
  color:white;
  padding:11px 18px;
  border-radius:25px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:5000;
}
.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* LOADING */
.loader{
  text-align:center;
  padding:30px;
  color:var(--muted);
}

/* MOBILE */
.mobile-nav{
  display:none;
}

@media(max-width:1000px){
  .layout{
    grid-template-columns:190px minmax(0,1fr);
  }
  .rightbar{display:none}
}

@media(max-width:700px){
  .topbar{
    height:58px;
    padding:0 8px;
  }
  .logo{font-size:20px}
  .searchbox{max-width:none}
  .top-actions .desktop-only{display:none}
  .layout{
    display:block;
    padding:8px 7px 75px;
  }
  .sidebar{display:none}
  .mobile-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:62px;
    background:var(--card);
    border-top:1px solid var(--border);
    z-index:2000;
    display:grid;
    grid-template-columns:repeat(5,1fr);
  }
  .mobile-nav button{
    border:0;
    background:transparent;
    color:var(--muted);
    font-size:20px;
  }
  .mobile-nav button.active{color:var(--blue)}
  .card{border-radius:13px}
  .reel{
    height:calc(100vh - 80px);
    min-height:500px;
    border-radius:12px;
  }
  .cover{height:180px}
  .profile-row{
    align-items:flex-start;
    flex-direction:column;
  }
}

/* PREMIUM */
.badge{
  display:inline-flex;
  align-items:center;
  gap:4px;
  background:#e7f3ff;
  color:var(--blue);
  padding:3px 7px;
  border-radius:20px;
  font-size:11px;
  font-weight:700;
}
.online{
  width:10px;
  height:10px;
  background:#31a24c;
  border-radius:50%;
  display:inline-block;
  border:2px solid var(--card);
}
.divider{
  height:1px;
  background:var(--border);
  margin:12px 0;
}
.empty{
  text-align:center;
  color:var(--muted);
  padding:30px 10px;
}
.upload-label{
  display:inline-flex;
  align-items:center;
  gap:8px;
  cursor:pointer;
}
input[type=file]{display:none}
</style>
</head>

<body>

<!-- =========================================================
     AUTH
========================================================= -->

<div id="authScreen" class="auth">
  <div class="auth-card">

    <div class="auth-title">My Social App</div>
    <div class="auth-sub">Connect • Share • Discover</div>

    <div id="loginBox">

      <div class="field">
        <label>Email</label>
        <input id="loginEmail" type="email" placeholder="আপনার Email">
      </div>

      <div class="field">
        <label>Password</label>
        <input id="loginPassword" type="password" placeholder="Password">
      </div>

      <button class="primary" style="width:100%" onclick="login()">
        Login
      </button>

      <div style="text-align:center;margin-top:15px">
        <button class="secondary" onclick="showRegister()">
          নতুন Account তৈরি করুন
        </button>
      </div>

    </div>

    <div id="registerBox" class="hidden">

      <div class="field">
        <label>Name</label>
        <input id="registerName" type="text" placeholder="আপনার নাম">
      </div>

      <div class="field">
        <label>Username</label>
        <input id="registerUsername" type="text" placeholder="username">
      </div>

      <div class="field">
        <label>Email</label>
        <input id="registerEmail" type="email" placeholder="Email">
      </div>

      <div class="field">
        <label>Password</label>
        <input id="registerPassword" type="password" placeholder="কমপক্ষে 6 অক্ষর">
      </div>

      <button class="primary" style="width:100%" onclick="registerUser()">
        Create Account
      </button>

      <div style="text-align:center;margin-top:15px">
        <button class="secondary" onclick="showLogin()">
          Login-এ ফিরে যান
        </button>
      </div>

    </div>

  </div>
</div>


<!-- =========================================================
     MAIN APP
========================================================= -->

<div id="app" class="app hidden">

  <!-- TOPBAR -->

  <header class="topbar">

    <div class="logo">My Social</div>

    <div class="searchbox">
      <span class="searchicon">🔎</span>
      <input
        id="globalSearch"
        placeholder="Search people..."
        oninput="searchUsers(this.value)"
      >
    </div>

    <div class="top-actions">

      <button class="iconbtn" onclick="openPage('notifications')">
        🔔
      </button>

      <button class="iconbtn desktop-only" onclick="openPage('messages')">
        💬
      </button>

      <button class="iconbtn" onclick="toggleTheme()">
        🌙
      </button>

    </div>

  </header>


  <div class="layout">

    <!-- LEFT SIDEBAR -->

    <aside class="sidebar">

      <div class="card cardpad">

        <div id="sideProfile"></div>

        <div class="divider"></div>

        <button class="navbtn active" onclick="openPage('home')">
          <span class="navicon">🏠</span>
          Home
        </button>

        <button class="navbtn" onclick="openPage('reels')">
          <span class="navicon">🎬</span>
          Reels
        </button>

        <button class="navbtn" onclick="openPage('profile')">
          <span class="navicon">👤</span>
          Profile
        </button>

        <button class="navbtn" onclick="openPage('friends')">
          <span class="navicon">👥</span>
          Friends
        </button>

        <button class="navbtn" onclick="openPage('search')">
          <span class="navicon">🔎</span>
          Search
        </button>

        <button class="navbtn" onclick="openPage('notifications')">
          <span class="navicon">🔔</span>
          Notifications
        </button>

        <button class="navbtn" onclick="openPage('settings')">
          <span class="navicon">⚙️</span>
          Settings
        </button>

        <button class="navbtn" onclick="logout()">
          <span class="navicon">🚪</span>
          Logout
        </button>

      </div>

    </aside>


    <!-- MAIN -->

    <main id="main"></main>


    <!-- RIGHT SIDEBAR -->

    <aside class="rightbar">

      <div class="card cardpad">

        <div class="section-title">People you may know</div>

        <div id="suggestions">
          <div class="loader">Loading...</div>
        </div>

      </div>

      <div class="card cardpad">

        <div class="section-title">My Social App</div>

        <div class="muted">
          Connect with friends, share posts,
          watch Reels and discover new people.
        </div>

      </div>

    </aside>

  </div>


  <!-- MOBILE NAV -->

  <nav class="mobile-nav">

    <button onclick="openPage('home')">🏠</button>
    <button onclick="openPage('reels')">🎬</button>
    <button onclick="openPage('profile')">👤</button>
    <button onclick="openPage('notifications')">🔔</button>
    <button onclick="openPage('settings')">☰</button>

  </nav>

</div>


<!-- =========================================================
     MODAL
========================================================= -->

<div id="modal" class="modal hidden" onclick="closeModalOutside(event)">
  <div id="modalCard" class="modal-card"></div>
</div>


<div id="toast" class="toast"></div>


<script>
/* ============================================================
   SUPABASE
============================================================ */

const SUPABASE_URL =
"https://skereuaizdczbvjplisi.supabase.co";

/*
  এখানে আপনার Supabase Publishable/Anon Key ব্যবহার করা হয়েছে।
  Service Role Key কখনো frontend-এ ব্যবহার করবেন না।
*/

const SUPABASE_ANON_KEY =
"sb_publishable_3R2otJA1zIlsMsTYxe1ocw_NAPY5O9x";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


/* ============================================================
   GLOBAL STATE
============================================================ */

let currentUser = null;
let currentProfile = null;
let currentPage = "home";

let posts = [];
let reels = [];
let stories = [];
let suggestions = [];

let mutedReels = true;


/* ============================================================
   HELPERS
============================================================ */

function toast(message){
  const t = document.getElementById("toast");
  t.textContent = message;
  t.classList.add("show");

  setTimeout(()=>{
    t.classList.remove("show");
  },2500);
}

function escapeHTML(value){
  if(value === null || value === undefined) return "";

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function avatarHTML(profile,size="42"){
  const name =
    profile?.name ||
    profile?.username ||
    "User";

  if(profile?.profile_photo){
    return `
      <div class="avatar" style="width:${size}px;height:${size}px">
        <img src="${escapeHTML(profile.profile_photo)}">
      </div>
    `;
  }

  return `
    <div class="avatar"
      style="width:${size}px;height:${size}px">
      ${escapeHTML(name.charAt(0).toUpperCase())}
    </div>
  `;
}

function formatDate(date){
  if(!date) return "";

  const d = new Date(date);

  return d.toLocaleString("bn-BD",{
    day:"numeric",
    month:"short",
    hour:"numeric",
    minute:"2-digit"
  });
}

function getInitial(name){
  return (name || "U").charAt(0).toUpperCase();
}


/* ============================================================
   AUTH INIT
============================================================ */

async function init(){

  const {
    data:{session}
  } = await supabaseClient.auth.getSession();

  if(session){
    currentUser = session.user;

    await loadProfile();

    showApp();

    await loadEverything();

  }else{
    showAuth();
  }

  supabaseClient.auth.onAuthStateChange(
    async(event,session)=>{

      if(session){

        currentUser = session.user;

        await loadProfile();

        showApp();

      }else{

        currentUser = null;
        currentProfile = null;

        showAuth();

      }

    }
  );
}


/* ============================================================
   AUTH UI
============================================================ */

function showAuth(){
  document.getElementById("authScreen")
    .classList.remove("hidden");

  document.getElementById("app")
    .classList.add("hidden");
}

function showApp(){
  document.getElementById("authScreen")
    .classList.add("hidden");

  document.getElementById("app")
    .classList.remove("hidden");
}

function showRegister(){
  document.getElementById("loginBox")
    .classList.add("hidden");

  document.getElementById("registerBox")
    .classList.remove("hidden");
}

function showLogin(){
  document.getElementById("registerBox")
    .classList.add("hidden");

  document.getElementById("loginBox")
    .classList.remove("hidden");
}


/* ============================================================
   LOGIN
============================================================ */

async function login(){

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  if(!email || !password){
    toast("Email ও Password দিন");
    return;
  }

  const {error} =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

  if(error){
    toast(error.message);
    return;
  }

  toast("Login successful");

  await loadProfile();
  showApp();
  await loadEverything();
}


/* ============================================================
   REGISTER
============================================================ */

async function registerUser(){

  const name =
    document.getElementById("registerName").value.trim();

  const username =
    document.getElementById("registerUsername").value
      .trim()
      .toLowerCase();

  const email =
    document.getElementById("registerEmail").value.trim();

  const password =
    document.getElementById("registerPassword").value;

  if(!name || !username || !email || !password){
    toast("সব তথ্য পূরণ করুন");
    return;
  }

  if(password.length < 6){
    toast("Password কমপক্ষে 6 অক্ষরের হতে হবে");
    return;
  }

  const {data,error} =
    await supabaseClient.auth.signUp({
      email,
      password
    });

  if(error){
    toast(error.message);
    return;
  }

  if(!data.user){
    toast("Registration failed");
    return;
  }

  const {error:profileError} =
    await supabaseClient
      .from("profiles")
      .upsert({
        id:data.user.id,
        name,
        username,
        bio:"",
        followers_count:0,
        following_count:0,
        verified:false,
        is_deactivated:false,
        online_status:true,
        allow_friend_requests:true,
        allow_followers:true,
        default_post_privacy:"public"
      });

  if(profileError){
    console.error(profileError);
    toast("Account হয়েছে, কিন্তু profile তৈরি করতে সমস্যা হয়েছে");
    return;
  }

  currentUser = data.user;

  await loadProfile();

  showApp();

  await loadEverything();

  toast("Account তৈরি হয়েছে");
}


/* ============================================================
   LOGOUT
============================================================ */

async function logout(){

  await supabaseClient.auth.signOut();

  currentUser = null;
  currentProfile = null;

}


/* ============================================================
   PROFILE
============================================================ */

async function loadProfile(){

  if(!currentUser) return;

  const {data,error} =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id",currentUser.id)
      .maybeSingle();

  if(error){
    console.error(error);
    return;
  }

  if(!data){

    const fallback = {
      id:currentUser.id,
      name:
        currentUser.email?.split("@")[0] ||
        "User",
      username:
        "user" +
        Math.floor(Math.random()*100000)
    };

    const {data:newProfile} =
      await supabaseClient
        .from("profiles")
        .insert(fallback)
        .select()
        .single();

    currentProfile = newProfile;

  }else{

    currentProfile = data;

  }

  updateSideProfile();
}


function updateSideProfile(){

  if(!currentProfile) return;

  const box =
    document.getElementById("sideProfile");

  box.innerHTML = `
    <div class="mini-profile"
      onclick="openPage('profile')">

      ${avatarHTML(currentProfile)}

      <div>
        <div class="name">
          ${escapeHTML(currentProfile.name || "User")}
        </div>

        <div class="muted">
          @${escapeHTML(currentProfile.username || "")}
        </div>
      </div>

    </div>
  `;
}


/* ============================================================
   LOAD EVERYTHING
============================================================ */

async function loadEverything(){

  updateSideProfile();

  await Promise.all([
    loadPosts(),
    loadReels(),
    loadStories(),
    loadSuggestions()
  ]);

  openPage("home");
}


/* ============================================================
   NAVIGATION
============================================================ */

async function openPage(page){

  currentPage = page;

  document
    .querySelectorAll(".navbtn")
    .forEach(btn=>btn.classList.remove("active"));

  const main =
    document.getElementById("main");

  if(page==="home"){
    await renderHome();
  }

  if(page==="reels"){
    await renderReelsPage();
  }

  if(page==="profile"){
    await renderProfile(currentUser.id);
  }

  if(page==="friends"){
    await renderFriends();
  }

  if(page==="search"){
    renderSearchPage();
  }

  if(page==="notifications"){
    await renderNotifications();
  }

  if(page==="settings"){
    await renderSettings();
  }

  if(page==="messages"){
    renderMessages();
  }

  if(page==="creator"){
    await renderCreator();
  }

  if(page==="admin"){
    await renderAdmin();
  }
}

/* ============================================================
   STORIES
============================================================ */

async function loadStories(){

  const {data,error} =
    await supabaseClient
      .from("stories")
      .select("*")
      .gt("expires_at",new Date().toISOString())
      .order("created_at",{ascending:false});

  if(error){
    console.error(error);
    stories=[];
    return;
  }

  stories = data || [];
}


function renderStoriesHTML(){

  let html = `

    <div class="stories">

      <div class="story add-story"
        onclick="openStoryUpload()">

        <div class="plus">+</div>

        <span>Add Story</span>

      </div>
  `;

  stories.forEach(story=>{

    html += `
      <div
        class="story"
        onclick='viewStory(${JSON.stringify(story)})'
      >

        ${
          story.media_url
          ?
          (
            story.media_type === "video"
            ?
            `<video src="${escapeHTML(story.media_url)}"></video>`
            :
            `<img src="${escapeHTML(story.media_url)}">`
          )
          :
          `<div style="
            height:100%;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:15px;
            text-align:center;
          ">
            ${escapeHTML(story.caption || "Story")}
          </div>`
        }

        <div class="story-overlay"></div>

        <div class="story-name">
          ${escapeHTML(story.caption || "Story")}
        </div>

      </div>
    `;

  });

  html += `</div>`;

  return html;
}


function openStoryUpload(){

  openModal(`
    <div class="modal-head">
      <strong>Create Story</strong>
      <button class="close" onclick="closeModal()">×</button>
    </div>

    <div class="modal-body">

      <div class="field">
        <label>Story photo/video</label>

        <input
          id="storyFile"
          type="file"
          accept="image/*,video/*"
          style="display:block"
        >
      </div>

      <div class="field">
        <label>Caption</label>
        <textarea id="storyCaption"></textarea>
      </div>

      <button class="primary" onclick="uploadStory()">
        Publish Story
      </button>

    </div>
  `);
}


async function uploadStory(){

  const file =
    document.getElementById("storyFile").files[0];

  const caption =
    document.getElementById("storyCaption").value.trim();

  if(!file){
    toast("Photo অথবা video নির্বাচন করুন");
    return;
  }

  toast("Story upload হচ্ছে...");

  const path =
    `${currentUser.id}/${Date.now()}_${file.name}`;

  const {error:uploadError} =
    await supabaseClient.storage
      .from("stories")
      .upload(path,file);

  if(uploadError){
    toast(uploadError.message);
    return;
  }

  const {data:urlData} =
    supabaseClient.storage
      .from("stories")
      .getPublicUrl(path);

  const mediaType =
    file.type.startsWith("video")
    ? "video"
    : "image";

  const expires =
    new Date(Date.now()+24*60*60*1000)
      .toISOString();

  const {error} =
    await supabaseClient
      .from("stories")
      .insert({
        user_id:currentUser.id,
        media_url:urlData.publicUrl,
        media_type:mediaType,
        caption,
        expires_at:expires
      });

  if(error){
    toast(error.message);
    return;
  }

  closeModal();

  await loadStories();

  if(currentPage==="home")
    renderHome();

  toast("Story published");
}


function viewStory(story){

  openModal(`
    <div class="modal-head">
      <strong>Story</strong>
      <button class="close" onclick="closeModal()">×</button>
    </div>

    <div class="modal-body" style="text-align:center">

      ${
        story.media_type==="video"
        ?
        `<video
          src="${escapeHTML(story.media_url)}"
          controls
          autoplay
          style="width:100%;max-height:70vh">
        </video>`
        :
        `<img
          src="${escapeHTML(story.media_url)}"
          style="width:100%;max-height:70vh;object-fit:contain">
        `
      }

      <p>${escapeHTML(story.caption || "")}</p>

    </div>
  `);
}


/* ============================================================
   CREATE POST
============================================================ */

async function createPost(){

  const text =
    document.getElementById("postText").value.trim();

  const file =
    document.getElementById("postImage").files[0];

  if(!text && !file){
    toast("Post-এর জন্য কিছু লিখুন অথবা ছবি দিন");
    return;
  }

  toast("Post তৈরি হচ্ছে...");

  let image_url = null;

  if(file){

    const path =
      `${currentUser.id}/${Date.now()}_${file.name}`;

    const {error:uploadError} =
      await supabaseClient.storage
        .from("post-images")
        .upload(path,file);

    if(uploadError){
      toast(uploadError.message);
      return;
    }

    const {data:urlData} =
      supabaseClient.storage
        .from("post-images")
        .getPublicUrl(path);

    image_url = urlData.publicUrl;
  }

  const {error} =
    await supabaseClient
      .from("posts")
      .insert({
        user_id:currentUser.id,
        text:text || "",
        image_url,
        privacy:"public",
        feeling:null,
        location:null,
        promoted:false,
        view_count:0
      });

  if(error){
    toast(error.message);
    return;
  }

  await loadPosts();

  renderHome();

  toast("Post published");
}


/* ============================================================
   LOAD POSTS
============================================================ */

async function loadPosts(){

  const {data,error} =
    await supabaseClient
      .from("posts")
      .select(`
        *,
        profiles:user_id (
          id,
          name,
          username,
          profile_photo,
          verified
        )
      `)
      .order("created_at",{ascending:false})
      .limit(50);

  if(error){

    console.error(error);

    const fallback =
      await supabaseClient
        .from("posts")
        .select("*")
        .order("created_at",{ascending:false})
        .limit(50);

    posts = fallback.data || [];

    return;
  }

  posts = data || [];
}


/* ============================================================
   RENDER FEED
============================================================ */

async function renderFeed(){

  const box =
    document.getElementById("feed");

  if(!box) return;

  if(!posts.length){

    box.innerHTML = `
      <div class="card empty">
        এখনো কোনো Post নেই।
        প্রথম Post আপনিই করুন।
      </div>
    `;

    return;
  }

  box.innerHTML = "";

  for(const post of posts){

    const article =
      document.createElement("div");

    article.className = "card";

    const profile =
      post.profiles || {};

    let likeCount = 0;
    let commentCount = 0;
    let liked = false;
    let saved = false;

    const likes =
      await supabaseClient
        .from("post_likes")
        .select("user_id",{count:"exact"})
        .eq("post_id",post.id);

    likeCount = likes.count || 0;

    const mineLike =
      await supabaseClient
        .from("post_likes")
        .select("id")
        .eq("post_id",post.id)
        .eq("user_id",currentUser.id)
        .maybeSingle();

    liked = !!mineLike.data;

    const comments =
      await supabaseClient
        .from("comments")
        .select(`
          *,
          profiles:user_id(name,username,profile_photo)
        `)
        .eq("post_id",post.id)
        .order("created_at",{ascending:true})
        .limit(20);

    const commentRows =
      comments.data || [];

    commentCount = commentRows.length;

    const mineSaved =
      await supabaseClient
        .from("saved_posts")
        .select("id")
        .eq("post_id",post.id)
        .eq("user_id",currentUser.id)
        .maybeSingle();

    saved = !!mineSaved.data;

    article.innerHTML = `

      <div class="post-head">

        ${avatarHTML(profile)}

        <div>
          <div class="name">
            ${escapeHTML(profile.name || "User")}

            ${
              profile.verified
              ? `<span class="badge">✓ Verified</span>`
              : ""
            }

          </div>

          <div class="muted">
            @${escapeHTML(profile.username || "")}
            • ${formatDate(post.created_at)}
          </div>
        </div>

        <button
          class="more"
          onclick="postMenu(${post.id})">
          ⋯
        </button>

      </div>

      <div class="post-body">

        ${
          post.text
          ?
          `<div class="post-text">
            ${escapeHTML(post.text)}
          </div>`
          :
          ""
        }

        ${
          post.image_url
          ?
          `<img
            class="post-image"
            src="${escapeHTML(post.image_url)}"
            loading="lazy">
          `
          :
          ""
        }

        ${
          post.location
          ?
          `<div class="muted" style="margin-top:8px">
            📍 ${escapeHTML(post.location)}
          </div>`
          :
          ""
        }

      </div>

      <div class="post-meta">

        <span>
          ❤️ ${likeCount}
        </span>

        <span>
          ${commentCount} comments
          • ${post.view_count || 0} views
        </span>

      </div>

      <div class="post-actions">

        <button
          class="post-action ${liked ? "liked":""}"
          onclick="togglePostLike(${post.id},this)">

          ${liked ? "❤️ Liked" : "♡ Like"}

        </button>

        <button
          class="post-action"
          onclick="focusComment(${post.id})">

          💬 Comment

        </button>

        <button
          class="post-action"
          onclick="sharePost(${post.id})">

          ↗ Share

        </button>

        <button
          class="post-action"
          onclick="toggleSavePost(${post.id},this)">

          ${saved ? "🔖 Saved" : "🔖 Save"}

        </button>

      </div>

      <div class="comments-list">

        ${
          commentRows.map(c=>`

            <div class="comment">

              ${avatarHTML(c.profiles || {})}

              <div class="comment-bubble">

                <strong>
                  ${escapeHTML(
                    c.profiles?.name || "User"
                  )}
                </strong>

                <div>
                  ${escapeHTML(c.text)}
                </div>

              </div>

            </div>

          `).join("")
        }

      </div>

      <div class="comment-box">

        ${avatarHTML(currentProfile,"36")}

        <input
          id="comment-${post.id}"
          placeholder="Comment লিখুন..."
          onkeydown="commentEnter(event,${post.id})">

        <button
          class="primary"
          onclick="addComment(${post.id})">
          Send
        </button>

      </div>
    `;

    box.appendChild(article);
  }
}


/* ============================================================
   POST LIKE
============================================================ */

async function togglePostLike(postId,button){

  const existing =
    await supabaseClient
      .from("post_likes")
      .select("id")
      .eq("post_id",postId)
      .eq("user_id",currentUser.id)
      .maybeSingle();

  if(existing.data){

    await supabaseClient
      .from("post_likes")
      .delete()
      .eq("id",existing.data.id);

  }else{

    await supabaseClient
      .from("post_likes")
      .insert({
        post_id:postId,
        user_id:currentUser.id
      });

  }

  await loadPosts();
  renderFeed();
}


/* ============================================================
   COMMENT
============================================================ */

function focusComment(postId){

  const input =
    document.getElementById(`comment-${postId}`);

  if(input){
    input.focus();
  }
}

function commentEnter(event,postId){

  if(event.key==="Enter"){
    event.preventDefault();
    addComment(postId);
  }
}

async function addComment(postId){

  const input =
    document.getElementById(`comment-${postId}`);

  if(!input) return;

  const text =
    input.value.trim();

  if(!text) return;

  const {error} =
    await supabaseClient
      .from("comments")
      .insert({
        post_id:postId,
        user_id:currentUser.id,
        text
      });

  if(error){
    toast(error.message);
    return;
  }

  input.value = "";

  await renderFeed();

  toast("Comment added");
}


/* ============================================================
   SAVE POST
============================================================ */

async function toggleSavePost(postId,button){

  const existing =
    await supabaseClient
      .from("saved_posts")
      .select("id")
      .eq("post_id",postId)
      .eq("user_id",currentUser.id)
      .maybeSingle();

  if(existing.data){

    await supabaseClient
      .from("saved_posts")
      .delete()
      .eq("id",existing.data.id);

    toast("Post unsaved");

  }else{

    const {error} =
      await supabaseClient
        .from("saved_posts")
        .insert({
          post_id:postId,
          user_id:currentUser.id
        });

    if(error){
      toast(error.message);
      return;
    }

    toast("Post saved");
  }

  renderFeed();
}


/* ============================================================
   SHARE POST
============================================================ */

async function sharePost(postId){

  const url =
    location.origin +
    location.pathname +
    "?post=" +
    postId;

  if(navigator.share){

    try{

      await navigator.share({
        title:"My Social App",
        text:"এই Post টি দেখুন",
        url
      });

    }catch(e){}

  }else{

    await navigator.clipboard.writeText(url);

    toast("Post link copied");

  }
}


/* ============================================================
   POST MENU
============================================================ */

function postMenu(postId){

  const post =
    posts.find(p=>p.id===postId);

  if(!post) return;

  const own =
    post.user_id===currentUser.id;

  openModal(`

    <div class="modal-head">

      <strong>Post options</strong>

      <button
        class="close"
        onclick="closeModal()">
        ×
      </button>

    </div>

    <div class="modal-body">

      ${
        own
        ?
        `
        <button
          class="navbtn"
          onclick="editPost(${postId})">
          ✏️ Edit Post
        </button>

        <button
          class="navbtn"
          onclick="deletePost(${postId})">
          🗑 Delete Post
        </button>
        `
        :
        ""
      }

      <button
        class="navbtn"
        onclick="reportPost(${postId})">
        🚩 Report Post
      </button>

    </div>
  `);
}


/* ============================================================
   DELETE POST
============================================================ */

async function deletePost(postId){

  const ok =
    confirm("এই Post delete করবেন?");

  if(!ok) return;

  const {error} =
    await supabaseClient
      .from("posts")
      .delete()
      .eq("id",postId)
      .eq("user_id",currentUser.id);

  if(error){
    toast(error.message);
    return;
  }

  closeModal();

  await loadPosts();

  renderHome();

  toast("Post deleted");
}


/* ============================================================
   EDIT POST
============================================================ */

function editPost(postId){

  const post =
    posts.find(p=>p.id===postId);

  if(!post) return;

async function loadReels(){

      .from("reels")
      .select(`

          id,
          name,
          username,
          profile_photo,

        )

function toggleReelVideo(video){

  if(video.paused){
    video.play();
  }else{
    video.pause();
  }
}


function toggleMuteAllReels(button){

  mutedReels = !mutedReels;

  document
    .querySelectorAll(".reel video")
    .forEach(v=>{
      v.muted = mutedReels;
    });

  button.textContent =
    mutedReels ? "🔇" : "🔊";
}


async function registerReelView(reelId){

  if(!currentUser) return;

  const {error} =
    await supabaseClient
      .from("reel_views")
      .insert({
        reel_id:reelId,
        user_id:currentUser.id,
        viewed_at:new Date().toISOString()
      });

  if(error){
    console.log("view:",error.message);
  }

  await supabaseClient
    .from("reels")
    .update({
      views:
        (
          reels.find(r=>r.id===reelId)?.views || 0
        ) + 1
    })
    .eq("id",reelId);
}

async function uploadReel(){

  const file =
    document.getElementById("reelFile").files[0];

  const caption =
    document.getElementById("reelCaption").value.trim();

  const audio =
    document.getElementById("reelAudio").value.trim();

  if(!file){
    toast("Video নির্বাচন করুন");
    return;
  }

  toast("Reel upload হচ্ছে...");

  const path =
    `${currentUser.id}/${Date.now()}_${file.name}`;

  const {error:uploadError} =
    await supabaseClient.storage
      .from("reels")
      .upload(path,file);

  if(uploadError){
    toast(uploadError.message);
    return;
  }

  const {data:urlData} =
    supabaseClient.storage
      .from("reels")
      .getPublicUrl(path);

  const {error} =
    await supabaseClient
      .from("reels")
      .insert({
        user_id:currentUser.id,
        video_url:urlData.publicUrl,
        caption,
        views:0,
        audio_name:audio
      });

  if(error){
    toast(error.message);
    return;
  }

  closeModal();

  await loadReels();

  await renderReelsPage();

  toast("Reel published");
}

async function toggleFriend(userId){

  if(userId===currentUser.id) return;

  const existing =
    await supabaseClient
      .from("friends")
      .select("id")
      .or(
        `and(user_id.eq.${currentUser.id},friend_id.eq.${userId}),and(user_id.eq.${userId},friend_id.eq.${currentUser.id})`
      )
      .maybeSingle();

  if(existing.data){

    await removeFriend(userId);

  }else{

    const {error} =
      await supabaseClient
        .from("friends")
        .insert({
          user_id:currentUser.id,
          friend_id:userId
        });

    if(error){
      toast(error.message);
      return;
    }

    await updateFriendCounters(
      currentUser.id,
      userId
    );

    toast("Friend added");

    await renderProfile(userId);
  }
}


async function removeFriend(userId){

  const result =
    await supabaseClient
      .from("friends")
      .delete()
      .or(
        `and(user_id.eq.${currentUser.id},friend_id.eq.${userId}),and(user_id.eq.${userId},friend_id.eq.${currentUser.id})`
      );

  if(result.error){
    toast(result.error.message);
    return;
  }

  toast("Friend removed");

  if(currentPage==="friends")
    renderFriends();
}


async function updateFriendCounters(
  userA,
  userB
){

  // এখানে সরাসরি count update না করে
  // বর্তমান profile values থেকে নিরাপদভাবে refresh করা হচ্ছে।

  const countA =
    await supabaseClient
      .from("friends")
      .select("id",{count:"exact"})
      .or(
        `user_id.eq.${userA},friend_id.eq.${userA}`
      );

  const countB =
    await supabaseClient
      .from("friends")
      .select("id",{count:"exact"})
      .or(
        `user_id.eq.${userB},friend_id.eq.${userB}`
      );

  await supabaseClient
    .from("profiles")
    .update({
      followers_count:countA.count || 0
    })
    .eq("id",userA);

  await supabaseClient
    .from("profiles")
    .update({

/* ============================================================

============================================================ */

async function searchUsers(query){

  if(!query || query.trim().length<2)
    return;

  const {data,error} =
    await supabaseClient
      .from("profiles")
      .select("*")
      .or(
        `name.ilike.%${query}%,username.ilike.%${query}%`
      )
      .limit(20);

  if(error){
    console.error(error);
    return;
  }

  if(currentPage!=="search")
    return;

  renderSearchResults(data || []);
}


function renderSearchPage(){

  const main =
    document.getElementById("main");

  main.innerHTML = `

    <div class="card cardpad">

      <div class="section-title">

          border-radius:10px;

      <div class="empty">

async function runSearch(query){

  if(query.trim().length<2){

    document.getElementById("searchResults")
      .innerHTML =
      `<div class="empty">Search করুন।</div>`;

    return;
  }

  const {data,error} =
    await supabaseClient
      .from("profiles")
      .select("*")
      .or(
        `name.ilike.%${query}%,username.ilike.%${query}%`
      )
      .limit(30);

  if(error){
    toast(error.message);
    return;
  }

  renderSearchResults(data || []);
}


function renderSearchResults(results){

  const box =
    document.getElementById("searchResults");

  if(!box) return;

  if(!results.length){

    box.innerHTML =
      `<div class="empty">কোনো user পাওয়া যায়নি।</div>`;

    return;
  }

  box.innerHTML =
    results.map(p=>`

      <div
        class="search-result"
        onclick="renderProfile('${p.id}')">

        ${avatarHTML(p)}

        <div style="flex:1">

          <div class="name">
            ${escapeHTML(p.name || "User")}
          </div>

          <div class="muted">
            @${escapeHTML(p.username || "")}
          </div>

        </div>

        ${
          p.verified
          ?
          `<span class="badge">✓ Verified</span>`
          :
          ""
        }

      </div>

    `).join("");
}

async function updateSetting(column,value){

  const existing =
    await supabaseClient
      .from("user_settings")
      .select("user_id")
      .eq("user_id",currentUser.id)
      .maybeSingle();

  if(existing.data){

    const {error} =
      await supabaseClient
        .from("user_settings")
        .update({
          [column]:value,
          updated_at:new Date().toISOString()
        })
        .eq("user_id",currentUser.id);

    if(error)
      toast(error.message);

  }else{

    const defaults = {
      user_id:currentUser.id,
      dark_mode:false,
      online_status:true,
      post_privacy:"public",
      friend_requests:true,
      followers:true,
      [column]:value
    };

    const {error} =
      await supabaseClient
        .from("user_settings")
        .insert(defaults);

    if(error)
      toast(error.message);
  }
}


async function setDarkMode(value){

  document.body.classList.toggle("dark",value);

  await updateSetting("dark_mode",value);
}

/* ============================================================
   DOWNLOAD DATA
============================================================ */

async function downloadMyData(){

  const [
    profile,
    myPosts,
    myReels,
    myComments,
    myFriends
  ] = await Promise.all([

    supabaseClient
      .from("profiles")
      .select("*")
      .eq("id",currentUser.id),

    supabaseClient
      .from("posts")
      .select("*")
      .eq("user_id",currentUser.id),

    supabaseClient
      .from("reels")
      .select("*")
      .eq("user_id",currentUser.id),

    supabaseClient
      .from("comments")
      .select("*")
      .eq("user_id",currentUser.id),

    supabaseClient
      .from("friends")
      .select("*")
      .or(
        `user_id.eq.${currentUser.id},friend_id.eq.${currentUser.id}`
      )

  ]);

  const data = {

    profile:profile.data || [],

    posts:myPosts.data || [],

    reels:myReels.data || [],

    comments:myComments.data || [],

    friends:myFriends.data || []

  };

  const blob =
    new Blob(
      [JSON.stringify(data,null,2)],
      {type:"application/json"}
    );

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;
  a.download =
    "my-social-app-data.json";

  a.click();

  URL.revokeObjectURL(url);

  toast("Your data downloaded");
}

function closeModal(){

  document

function closeModalOutside(event){
