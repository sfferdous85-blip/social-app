<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>My Social App</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --bg:#fff;
  --card:#fff;
  --text:#111;
  --muted:#737373;
  --border:#dbdbdb;
  --input:#f2f2f2;
  --blue:#0095f6;
}

body.dark{
  --bg:#000;
  --card:#000;
  --text:#f5f5f5;
  --muted:#aaa;
  --border:#292929;
  --input:#1c1c1c;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

button,input,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* ================= LOGIN ================= */

#authScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:var(--bg);
}

.authBox{
  width:100%;
  max-width:390px;
}

.logo{
  text-align:center;
  font-size:38px;
  font-weight:800;
  margin-bottom:30px;
  letter-spacing:-2px;
}

.authCard{
  border:1px solid var(--border);
  padding:30px 25px;
  background:var(--card);
}

.authInput{
  width:100%;
  border:1px solid var(--border);
  background:var(--input);
  color:var(--text);
  padding:13px;
  margin-bottom:10px;
  border-radius:5px;
  outline:none;
}

.primaryBtn{
  width:100%;
  border:0;
  background:var(--blue);
  color:white;
  font-weight:bold;
  padding:12px;
  border-radius:7px;
  margin-top:5px;
}

.secondaryBtn{
  width:100%;
  border:0;
  background:transparent;
  color:var(--blue);
  padding:12px;
  font-weight:bold;
}

.authMsg{
  text-align:center;
  margin:12px 0;
  font-size:14px;
  color:#e53935;
}

/* ================= APP ================= */

#app{
  min-height:100vh;
}

.topbar{
  height:60px;
  position:fixed;
  left:0;
  right:0;
  top:0;
  z-index:100;
  border-bottom:1px solid var(--border);
  background:var(--card);
  display:flex;
  align-items:center;
  justify-content:center;
}

.topbarInner{
  width:100%;
  max-width:1000px;
  padding:0 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  font-size:25px;
  font-weight:800;
  letter-spacing:-1px;
}

.topIcons{
  display:flex;
  gap:18px;
  align-items:center;
}

.iconBtn{
  border:0;
  background:transparent;
  color:var(--text);
  font-size:24px;
  padding:4px;
}

.page{
  max-width:1000px;
  margin:auto;
  padding:75px 15px 90px;
}

/* ================= STORIES ================= */

.stories{
  display:flex;
  gap:16px;
  overflow-x:auto;
  border:1px solid var(--border);
  background:var(--card);
  padding:15px;
  scrollbar-width:none;
  margin-bottom:20px;
}

.stories::-webkit-scrollbar{
  display:none;
}

.story{
  min-width:70px;
  text-align:center;
  font-size:12px;
}

.storyAvatar{
  width:64px;
  height:64px;
  border-radius:50%;
  padding:2px;
  background:linear-gradient(45deg,#feda75,#d62976,#4f5bd5);
  margin:auto;
}

.storyAvatar img,
.avatar{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
  background:#ddd;
}

.storyName{
  margin-top:5px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* ================= FEED ================= */

.feed{
  max-width:620px;
  margin:auto;
}

.post{
  border:1px solid var(--border);
  background:var(--card);
  margin-bottom:20px;
}

.postHeader{
  display:flex;
  align-items:center;
  padding:12px;
  gap:10px;
}

.postAvatar{
  width:38px;
  height:38px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd;
}

.postUser{
  flex:1;
  font-weight:bold;
}

.postMore{
  border:0;
  background:transparent;
  color:var(--text);
  font-size:20px;
}

.postMedia{
  width:100%;
  max-height:700px;
  object-fit:cover;
  display:block;
  background:#111;
}

.postActions{
  display:flex;
  align-items:center;
  padding:10px 12px;
  gap:16px;
}

.actionBtn{
  border:0;
  background:transparent;
  color:var(--text);
  font-size:24px;
  padding:0;
}

.actionBtn.save{
  margin-left:auto;
}

.liked{
  color:#ed4956!important;
}

.postBody{
  padding:0 12px 15px;
}

.likes{
  font-weight:bold;
  margin-bottom:7px;
}

.caption{
  line-height:1.45;
}

.caption b{
  margin-right:5px;
}

.commentsPreview{
  color:var(--muted);
  margin-top:8px;
}

.commentForm{
  display:flex;
  border-top:1px solid var(--border);
  padding:10px;
}

.commentInput{
  flex:1;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
}

.commentSubmit{
  border:0;
  background:transparent;
  color:var(--blue);
  font-weight:bold;
}

/* ================= NAV ================= */

.bottomNav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:62px;
  z-index:100;
  border-top:1px solid var(--border);
  background:var(--card);
  display:flex;
  justify-content:center;
}

.navInner{
  width:100%;
  max-width:650px;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.navBtn{
  border:0;
  background:transparent;
  color:var(--text);
  font-size:25px;
  padding:8px 15px;
}

.navBtn.active{
  font-weight:bold;
}

/* ================= SEARCH ================= */

.searchBox{
  max-width:600px;
  margin:0 auto 20px;
}

.searchInput{
  width:100%;
  padding:13px 16px;
  border:0;
  border-radius:10px;
  background:var(--input);
  color:var(--text);
  outline:none;
}

.searchResults{
  display:grid;
  gap:10px;
}

.userResult{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  border-bottom:1px solid var(--border);
}

.userResult .avatar{
  width:45px;
  height:45px;
}

.followBtn{
  margin-left:auto;
  border:0;
  background:var(--blue);
  color:white;
  border-radius:6px;
  padding:8px 14px;
  font-weight:bold;
}

/* ================= PROFILE ================= */

.profile{
  max-width:800px;
  margin:auto;
}

.profileTop{
  display:flex;
  gap:35px;
  align-items:center;
  padding:20px 5px 30px;
}

.profileAvatar{
  width:110px;
  height:110px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd;
}

.profileInfo{
  flex:1;
}

.profileName{
  font-size:22px;
  font-weight:bold;
  margin-bottom:15px;
}

.profileStats{
  display:flex;
  gap:28px;
  margin-bottom:15px;
}

.profileStats b{
  display:block;
  text-align:center;
}

.profileBio{
  line-height:1.5;
}

.editProfileBtn{
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  padding:8px 20px;
  border-radius:7px;
  font-weight:bold;
}

.profileTabs{
  display:flex;
  border-top:1px solid var(--border);
  justify-content:center;
}

.profileTab{
  padding:15px 35px;
  border:0;
  background:transparent;
  color:var(--text);
  font-weight:bold;
}

.profileGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:3px;
}

.gridItem{
  aspect-ratio:1/1;
  overflow:hidden;
  background:#111;
}

.gridItem img,
.gridItem video{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* ================= EXPLORE ================= */

.exploreGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:4px;
}

.exploreItem{
  aspect-ratio:1/1;
  background:#111;
  overflow:hidden;
  position:relative;
}

.exploreItem img,
.exploreItem video{
  width:100%;
  height:100%;
  object-fit:cover;
}

.reelBadge{
  position:absolute;
  right:8px;
  bottom:8px;
  color:white;
  font-size:20px;
}

/* ================= REELS ================= */

.reelsContainer{
  max-width:500px;
  margin:auto;
}

.reel{
  height:calc(100vh - 135px);
  min-height:500px;
  position:relative;
  background:#111;
  margin-bottom:12px;
  overflow:hidden;
}

.reel video{
  width:100%;
  height:100%;
  object-fit:cover;
}

.reelOverlay{
  position:absolute;
  left:15px;
  right:15px;
  bottom:20px;
  color:white;
  z-index:2;
}

.reelUser{
  font-weight:bold;
  font-size:17px;
}

.reelCaption{
  margin-top:8px;
}

.reelActions{
  position:absolute;
  right:12px;
  bottom:25px;
  display:flex;
  flex-direction:column;
  gap:18px;
  z-index:3;
}

.reelAction{
  color:white;
  background:rgba(0,0,0,.25);
  border:0;
  font-size:28px;
}

/* ================= CREATE ================= */

.createCard{
  max-width:600px;
  margin:auto;
  border:1px solid var(--border);
  padding:20px;
}

.createTextarea{
  width:100%;
  min-height:130px;
  border:1px solid var(--border);
  background:var(--input);
  color:var(--text);
  border-radius:8px;
  padding:15px;
  resize:vertical;
  outline:none;
}

.fileInput{
  margin:15px 0;
  width:100%;
}

.preview{
  max-width:100%;
  max-height:400px;
  display:block;
  margin:auto;
}

/* ================= SETTINGS ================= */

.settings{
  max-width:650px;
  margin:auto;
}

.settingGroup{
  border:1px solid var(--border);
  margin-bottom:15px;
}

.settingItem{
  width:100%;
  border:0;
  border-bottom:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  padding:18px;
  text-align:left;
  display:flex;
  justify-content:space-between;
}

.settingItem:last-child{
  border-bottom:0;
}

.danger{
  color:#ed4956;
}

/* ================= MODAL ================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  z-index:500;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modalCard{
  width:100%;
  max-width:500px;
  max-height:90vh;
  overflow:auto;
  background:var(--card);
  color:var(--text);
  border-radius:12px;
  padding:20px;
}

.modalTitle{
  font-size:20px;
  font-weight:bold;
  margin-bottom:15px;
}

.closeBtn{
  float:right;
  border:0;
  background:transparent;
  color:var(--text);
  font-size:24px;
}

/* ================= RESPONSIVE ================= */

@media(max-width:600px){

  .topbar{
    height:55px;
  }

  .brand{
    font-size:22px;
  }

  .page{
    padding:65px 0 75px;
  }

  .stories{
    border-left:0;
    border-right:0;
  }

  .post{
    border-left:0;
    border-right:0;
  }

  .profileTop{
    padding:20px 15px;
    gap:20px;
  }

  .profileAvatar{
    width:85px;
    height:85px;
  }

  .profileStats{
    gap:14px;
    justify-content:space-between;
  }

  .profileName{
    font-size:18px;
  }

  .profileTabs button{
    padding:14px 22px;
  }
}
</style>
</head>

<body>

<!-- ================= AUTH ================= -->

<section id="authScreen">

  <div class="authBox">

    <div class="logo">My Social App</div>

    <div class="authCard">

      <input id="authEmail"
             class="authInput"
             type="email"
             placeholder="Email">

      <input id="authPassword"
             class="authInput"
             type="password"
             placeholder="Password">

      <input id="authName"
             class="authInput"
             type="text"
             placeholder="নাম"
             style="display:none">

      <button id="loginBtn"
              class="primaryBtn"
              onclick="login()">
        Login
      </button>

      <button id="registerBtn"
              class="primaryBtn"
              onclick="register()"
              style="display:none">
        Register
      </button>

      <div id="authMsg" class="authMsg"></div>

      <button class="secondaryBtn"
              onclick="toggleAuth()">
        <span id="toggleText">নতুন অ্যাকাউন্ট তৈরি করুন</span>
      </button>

    </div>

  </div>

</section>


<!-- ================= APP ================= -->

<section id="app" class="hidden">

<header class="topbar">

  <div class="topbarInner">

    <div class="brand">
      My Social
    </div>

    <div class="topIcons">

      <button class="iconBtn"
              onclick="showPage('search')">
        🔍
      </button>

      <button class="iconBtn"
              onclick="showPage('notifications')">
        ♡
      </button>

      <button class="iconBtn"
              onclick="showPage('messages')">
        ✈
      </button>

    </div>

  </div>

</header>


<main id="page" class="page"></main>


<nav class="bottomNav">

  <div class="navInner">

    <button class="navBtn"
            onclick="showPage('home')">
      🏠
    </button>

    <button class="navBtn"
            onclick="showPage('explore')">
      🔍
    </button>

    <button class="navBtn"
            onclick="showPage('create')">
      ➕
    </button>

    <button class="navBtn"
            onclick="showPage('reels')">
      ▶
    </button>

    <button class="navBtn"
            onclick="showPage('profile')">
      👤
    </button>

  </div>

</nav>

</section>


<!-- ================= MODAL ================= -->

<div id="modal"
     class="modal hidden">

  <div class="modalCard">

    <button class="closeBtn"
            onclick="closeModal()">
      ×
    </button>

    <div id="modalContent"></div>

  </div>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://skereuaizdczbvjplisi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_3R2otJA1zIlsMsTYxe1ocw_NAPY5O9x";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================================
   GLOBAL
========================================================= */

let currentUser = null;
let currentProfile = null;
let authMode = "login";
let currentPage = "home";


/* =========================================================
   START
========================================================= */

document.addEventListener("DOMContentLoaded", async()=>{

  const {data,error} =
    await supabaseClient.auth.getSession();

  if(data && data.session){

    currentUser =
      data.session.user;

    await loadProfile();

    openApp();

  }else{

    document
      .getElementById("authScreen")
      .classList.remove("hidden");

  }

});


supabaseClient.auth.onAuthStateChange(
  async(event,session)=>{

    if(session){

      currentUser =
        session.user;

      await loadProfile();

      openApp();

    }

  }
);


/* =========================================================
   AUTH
========================================================= */

function toggleAuth(){

  authMode =
    authMode==="login"
      ? "register"
      : "login";

  const name =
    document.getElementById("authName");

  const login =
    document.getElementById("loginBtn");

  const register =
    document.getElementById("registerBtn");

  const text =
    document.getElementById("toggleText");

  if(authMode==="register"){

    name.style.display="block";
    login.style.display="none";
    register.style.display="block";

    text.innerText =
      "আগে থেকেই অ্যাকাউন্ট আছে? Login";

  }else{

    name.style.display="none";
    login.style.display="block";
    register.style.display="none";

    text.innerText =
      "নতুন অ্যাকাউন্ট তৈরি করুন";

  }

}


async function login(){

  const email =
    document.getElementById("authEmail")
      .value.trim();

  const password =
    document.getElementById("authPassword")
      .value;

  showAuthMessage("Login হচ্ছে...");

  if(!email || !password){

    showAuthMessage(
      "Email এবং Password দিন"
    );

    return;
  }

  const {data,error} =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

  if(error){

    showAuthMessage(
      error.message
    );

    return;
  }

  currentUser =
    data.user;

  await loadProfile();

  openApp();

}


async function register(){

  const email =
    document.getElementById("authEmail")
      .value.trim();

  const password =
    document.getElementById("authPassword")
      .value;

  const name =
    document.getElementById("authName")
      .value.trim();

  showAuthMessage("Account তৈরি হচ্ছে...");

  if(!email || !password || !name){

    showAuthMessage(
      "সব তথ্য পূরণ করুন"
    );

    return;
  }

  const {data,error} =
    await supabaseClient.auth.signUp({

      email,
      password,

      options:{
        data:{
          name:name
        }
      }

    });

  if(error){

    showAuthMessage(
      error.message
    );

    return;
  }

  if(data.user){

    await supabaseClient
      .from("profiles")
      .upsert({

        id:data.user.id,
        name:name,
        bio:"",

      });

  }

  showAuthMessage(
    "Account তৈরি হয়েছে। Email verification লাগতে পারে।"
  );

}


function showAuthMessage(message){

  document
    .getElementById("authMsg")
    .innerText=message;

}


/* =========================================================
   PROFILE
========================================================= */

async function loadProfile(){

  if(!currentUser)
    return;

  let {data,error} =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id",currentUser.id)
      .maybeSingle();

  if(!data){

    const name =
      currentUser.user_metadata?.name ||
      currentUser.email?.split("@")[0] ||
      "User";

    const result =
      await supabaseClient
        .from("profiles")
        .insert({

          id:currentUser.id,
          name:name,
          bio:""

        })
        .select()
        .maybeSingle();

    data =
      result.data;

  }

  currentProfile =
    data || {

      id:currentUser.id,
      name:
        currentUser.email?.split("@")[0] ||
        "User"

    };

}


function avatarUrl(profile){

  if(profile?.profile_photo)
    return profile.profile_photo;

  return "https://ui-avatars.com/api/?name="+
    encodeURIComponent(
      profile?.name || "User"
    )+
    "&background=random";

}


/* =========================================================
   APP OPEN
========================================================= */

function openApp(){

  document
    .getElementById("authScreen")
    .classList.add("hidden");

  document
    .getElementById("app")
    .classList.remove("hidden");

  showPage("home");

}


/* =========================================================
   PAGE ROUTER
========================================================= */

async function showPage(page){

  currentPage=page;

  const container =
    document.getElementById("page");

  container.innerHTML =
    "<div style='text-align:center;padding:50px'>লোড হচ্ছে...</div>";

  if(page==="home")
    await renderHome();

  else if(page==="explore")
    await renderExplore();

  else if(page==="reels")
    await renderReels();

  else if(page==="profile")
    await renderProfile();

  else if(page==="search")
    renderSearch();

  else if(page==="create")
    renderCreate();

  else if(page==="settings")
    renderSettings();

  else if(page==="notifications")
    renderNotifications();

  else if(page==="messages")
    renderMessages();

}


/* =========================================================
   HOME
========================================================= */

async function renderHome(){

  const page =
    document.getElementById("page");

  page.innerHTML = `

    <div class="stories">

      <div class="story"
           onclick="showPage('create')">

        <div class="storyAvatar">
          <img src="${avatarUrl(currentProfile)}">
        </div>

        <div class="storyName">
          আপনার Story
        </div>

      </div>

      ${await storyHTML()}

    </div>

    <div class="feed"
         id="feed">
      পোস্ট লোড হচ্ছে...
    </div>

  `;

  await loadPosts();

}


async function storyHTML(){

  try{

    const {data} =
      await supabaseClient
        .from("profiles")
        .select("id,name,profile_photo")
        .limit(15);

    if(!data)
      return "";

    return data
      .filter(p=>p.id!==currentUser.id)
      .map(p=>`

        <div class="story"
             onclick="openUser('${p.id}')">

          <div class="storyAvatar">

            <img
              src="${avatarUrl(p)}"
              alt="profile">

          </div>

          <div class="storyName">
            ${escapeHTML(p.name || "User")}
          </div>

        </div>

      `)
      .join("");

  }catch(e){

    return "";

  }

}


/* =========================================================
   LOAD POSTS
========================================================= */

async function loadPosts(){

  const feed =
    document.getElementById("feed");

  try{

        </button>

          class="actionBtn"

========================================================= */

async function toggleLike(postId){

  const {data:existing} =
    await supabaseClient
      .from("post_likes")
      .select("*")
      .eq("post_id",postId)
      .eq("user_id",currentUser.id)
      .maybeSingle();

  if(existing){

    await supabaseClient
      .from("post_likes")
      .delete()
      .eq("post_id",postId)
      .eq("user_id",currentUser.id);

  }else{

    await supabaseClient
      .from("post_likes")
      .insert({

        post_id:postId,
        user_id:currentUser.id

      });

  }

  const btn =
    document.getElementById(
      "like-"+postId
    );

  if(btn){

    const {data} =
      await supabaseClient
        .from("post_likes")
        .select("id")
        .eq("post_id",postId)
        .eq("user_id",currentUser.id)
        .maybeSingle();

    if(data){

      btn.innerText="♥";
      btn.classList.add("liked");

    }else{

      btn.innerText="♡";
      btn.classList.remove("liked");

    }

  }

}


async function refreshLikeStates(posts){

  for(const post of posts){

    const {data} =
      await supabaseClient
        .from("post_likes")
        .select("id")
        .eq("post_id",post.id)
        .eq("user_id",currentUser.id)
        .maybeSingle();

    const btn =
      document.getElementById(
        "like-"+post.id
      );

    if(btn && data){

      btn.innerText="♥";
      btn.classList.add("liked");

    }

  }

}

function renderCreate(){

  document.getElementById("page").innerHTML=`

    <div class="createCard">

      <h2>Create New Post</h2>

      <textarea
        id="postText"
        class="createTextarea"
        placeholder="আপনি কী ভাবছেন?">
      </textarea>

      <input
        id="postFile"
        class="fileInput"
        type="file"
        accept="image/*,video/*"
        onchange="previewFile(event)">

      <div id="filePreview"></div>

      <button
        class="primaryBtn"
        onclick="createPost()">

        Publish

      </button>

    </div>

  `;

function previewFile(event){

  const file =
    event.target.files[0];

  if(!file)
    return;

  const url =
    URL.createObjectURL(file);

  const box =
    document.getElementById(
      "filePreview"
    );

  if(file.type.startsWith("video/")){

    box.innerHTML=`
      <video
        class="preview"
        controls
        src="${url}">
      </video>`;

  }else{

    box.innerHTML=`
      <img
        class="preview"
        src="${url}">`;

  }

}


async function createPost(){

  const text =
    document.getElementById(
      "postText"
    ).value.trim();

  const file =
    document.getElementById(
      "postFile"
    ).files[0];

  if(!text && !file){

    alert("Post-এর জন্য text অথবা media দিন");
    return;

  }

  let image_url=null;

  if(file){

    const extension =
      file.name.split(".").pop();

    const path =
      currentUser.id+
      "/"+
      Date.now()+
      "."+
      extension;

    const {error:uploadError} =
      await supabaseClient
        .storage
        .from("post-images")
        .upload(
          path,
          file,
          {
            upsert:false,
            contentType:file.type
          }
        );

    if(uploadError){

      alert(
        "Upload error: "+
        uploadError.message
      );

      return;

    }

    const {data:urlData} =
      supabaseClient
        .storage
        .from("post-images")
        .getPublicUrl(path);

    image_url =
      urlData.publicUrl;

  }

  const {error} =
    await supabaseClient
      .from("posts")
      .insert({

        user_id:currentUser.id,
        text:text,
        image_url:image_url,
        created_at:new Date().toISOString(),
        view_count:0

      });

  if(error){

    alert(error.message);
    return;

  }

  alert("Post সফলভাবে Publish হয়েছে");

  showPage("home");

}

async function sharePost(id){

  const url =
    location.href.split("#")[0]+
    "?post="+id;

  if(navigator.share){

    try{

      await navigator.share({
        title:"My Social App",
        url:url
      });

    }catch(e){}

  }else{

    await navigator.clipboard.writeText(url);

    alert("Post link copied");

  }

}

/* =========================================================
   OPEN POST
========================================================= */

async function openPost(id){

  const {data:post} =
    await supabaseClient
      .from("posts")
      .select("*")
      .eq("id",id)
      .maybeSingle();

  if(!post)
    return;

  openModal(
    await postHTML(post)
  );

}


/* =========================================================
   MODAL
========================================================= */

function openModal(content){

  document
    .getElementById("modalContent")
    .innerHTML=content;

  document
    .getElementById("modal")
    .classList.remove("hidden");

}


function closeModal(){

  document
    .getElementById("modal")
    .classList.add("hidden");

}


/* =========================================================
   HELPERS
========================================================= */

function isVideo(url){

  if(!url)
    return false;

  return /\.(mp4|webm|mov|m4v|ogg)(\?|$)/i
    .test(url);

}


function escapeHTML(value){

  return String(value||"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function escapeAttr(value){

  return escapeHTML(value);

}
