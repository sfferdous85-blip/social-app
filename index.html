<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>My Social App</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f0f2f5;color:#222}
button,input,textarea{font-family:inherit}
button{cursor:pointer}

.topbar{
 position:sticky;top:0;z-index:100;height:60px;background:#1877f2;color:#fff;
 display:flex;align-items:center;justify-content:space-between;padding:0 14px;
 box-shadow:0 2px 8px #0002
}
.logo{font-size:22px;font-weight:bold}
.top-actions{display:flex;gap:7px}
.icon-btn{
 border:0;background:#ffffff22;color:#fff;border-radius:50%;
 width:40px;height:40px;font-size:19px
}

.container{max-width:650px;margin:auto;padding:12px}
.card{
 background:#fff;border-radius:12px;margin-bottom:12px;padding:14px;
 box-shadow:0 1px 4px #0001
}

.auth{
 min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px
}
.auth-box{
 width:100%;max-width:400px;background:#fff;padding:25px;
 border-radius:15px;box-shadow:0 5px 25px #0002
}
.auth-box h1{text-align:center;color:#1877f2}

input,textarea{
 width:100%;border:1px solid #ddd;border-radius:9px;padding:12px;margin:6px 0;outline:none
}
textarea{resize:none}

.primary{
 width:100%;border:0;background:#1877f2;color:#fff;padding:12px;
 border-radius:9px;font-size:16px;font-weight:bold
}
.secondary{
 border:0;background:#e4e6eb;padding:10px 14px;border-radius:8px
}
.danger{
 border:0;background:#e53935;color:#fff;padding:9px 12px;border-radius:8px
}
.success{
 border:0;background:#2e7d32;color:#fff;padding:9px 12px;border-radius:8px
}

.nav{
 position:fixed;bottom:0;left:0;right:0;z-index:100;background:#fff;
 border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:7px 2px
}
.nav button{border:0;background:none;font-size:11px;color:#555}
.nav span{display:block;font-size:22px}

.badge{
 background:red;color:#fff;border-radius:20px;padding:2px 6px;font-size:10px
}

.post-head{display:flex;align-items:center;gap:10px}
.avatar{
 width:45px;height:45px;border-radius:50%;object-fit:cover;background:#ddd
}
.name{font-weight:bold}
.time{font-size:12px;color:#777}
.post-text{margin:12px 0;white-space:pre-wrap}
.post-image{
 width:100%;max-height:600px;object-fit:cover;border-radius:10px
}
.post-video{
 width:100%;max-height:600px;border-radius:10px;background:#000
}
.post-actions{
 display:flex;justify-content:space-around;border-top:1px solid #eee;
 border-bottom:1px solid #eee;margin-top:10px
}
.post-actions button{
 flex:1;border:0;background:none;padding:10px 4px;color:#555
}

.comment{
 background:#f0f2f5;padding:8px 10px;border-radius:10px;margin:6px 0
}
.comment b{margin-right:5px}

.profile-cover{
 height:220px;background:#ddd center/cover no-repeat;
 border-radius:12px 12px 0 0
}
.profile-main{text-align:center;margin-top:-55px}
.profile-main .avatar{
 width:110px;height:110px;border:4px solid #fff
}
.profile-name{font-size:24px;font-weight:bold;margin:8px 0 3px}
.bio{color:#666;margin:5px}
.stats{display:flex;justify-content:center;gap:25px;margin:15px 0}
.stat{text-align:center}
.stat b{display:block;font-size:19px}

.reel-card video{width:100%;max-height:650px;border-radius:12px;background:#000}

.user-row{
 display:flex;align-items:center;gap:10px;padding:10px 0;
 border-bottom:1px solid #eee
}
.user-info{flex:1}

.empty{text-align:center;padding:30px;color:#777}
.hidden{display:none!important}

.modal{
 position:fixed;inset:0;background:#0008;z-index:200;
 display:flex;align-items:center;justify-content:center;padding:15px
}
.modal-box{
 background:#fff;width:100%;max-width:500px;max-height:90vh;
 overflow:auto;border-radius:15px;padding:18px
}
.preview{
 width:100%;max-height:350px;object-fit:contain;border-radius:10px;margin-top:8px
}
.search-box{display:flex;gap:7px}
.search-box input{margin:0}

.request-box{
 display:flex;align-items:center;gap:10px;
 padding:10px 0;border-bottom:1px solid #eee
}
.request-buttons{display:flex;gap:5px}

@media(max-width:500px){
 .container{padding:8px}
 .profile-cover{height:180px}
 .request-buttons button{padding:7px}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="auth">
<div class="auth-box">
<h1>My Social App</h1>
<input id="loginEmail" type="email" placeholder="Email">
<input id="loginPassword" type="password" placeholder="Password">
<button class="primary" onclick="login()">Login</button>
<p style="text-align:center">অ্যাকাউন্ট নেই?</p>
<button class="secondary" style="width:100%" onclick="showRegister()">Create New Account</button>
</div>
</div>

<!-- REGISTER -->
<div id="registerPage" class="auth hidden">
<div class="auth-box">
<h1>Create Account</h1>
<input id="regName" placeholder="আপনার নাম">
<input id="regEmail" type="email" placeholder="Email">
<input id="regPassword" type="password" placeholder="Password">
<button class="primary" onclick="register()">Create Account</button>
<p style="text-align:center">
<button class="secondary" onclick="showLogin()">Already have an account?</button>
</p>
</div>
</div>

<!-- APP -->
<div id="app" class="hidden">

<header class="topbar">
<div class="logo">My Social</div>

<div class="top-actions">
<button class="icon-btn" onclick="showSearch()">🔍</button>
<button class="icon-btn" onclick="showFriends()">👥</button>
<button class="icon-btn" onclick="toggleNotifications()">🔔</button>
<button class="icon-btn" onclick="showProfile()">👤</button>
</div>
</header>

<main class="container">

<!-- HOME -->
<section id="homePage">

<div class="card">
<textarea id="postText" rows="3" placeholder="What's on your mind?"></textarea>

<input id="postPhoto" type="file" accept="image/*" onchange="previewPostPhoto()">

<img id="postPreview" class="preview hidden">

<button class="primary" style="margin-top:8px" onclick="createPost()">📝 Post</button>
</div>

<div id="feed"></div>
</section>

<!-- REELS -->
<section id="reelsPage" class="hidden">

<div class="card">
<h2>🎬 Create Reel</h2>

<textarea id="reelText" rows="2" placeholder="Reel সম্পর্কে কিছু লিখুন..."></textarea>

<input id="reelVideo" type="file" accept="video/*" onchange="previewReel()">

<video id="reelPreview" class="preview hidden" controls></video>

<button class="primary" style="margin-top:8px" onclick="createReel()">
⬆️ Upload Reel
</button>
</div>

<div id="reels"></div>
</section>

<!-- PROFILE -->
<section id="profilePage" class="hidden">

<div class="card" style="padding:0;overflow:hidden">

<div id="myCover" class="profile-cover"></div>

<div class="profile-main">

<img id="myProfilePhoto" class="avatar">

<div id="myName" class="profile-name"></div>
<div id="myBio" class="bio"></div>

<div class="stats">

<div class="stat">
<b id="myFriends">0</b>
Friends
</div>

<div class="stat">
<b id="myFollowers">0</b>
Followers
</div>

<div class="stat">
<b id="myFollowing">0</b>
Following
</div>

</div>

<button class="primary" style="width:auto;margin-bottom:8px" onclick="openEditProfile()">
✏️ Edit Profile
</button>

<br>

<button class="secondary" onclick="showFriends()">👥 My Friends</button>

</div>
</div>

<div id="myContent"></div>
</section>

<!-- OTHER PROFILE -->
<section id="userProfilePage" class="hidden">
<div id="otherProfile"></div>
<div id="otherContent"></div>
</section>

<!-- SEARCH -->
<section id="searchPage" class="hidden">

<div class="card">

<div class="search-box">
<input id="searchInput" placeholder="Search users...">
<button class="primary" style="width:auto" onclick="searchUsers()">Search</button>
</div>

</div>

<div class="card">
<div id="searchResults"></div>
</div>

</section>

<!-- FRIENDS -->
<section id="friendsPage" class="hidden">

<div class="card">

<h2>👥 Friends</h2>

<div style="display:flex;gap:5px;flex-wrap:wrap">

<button class="secondary" onclick="showFriends()">My Friends</button>

<button class="secondary" onclick="showFriendRequests()">Requests</button>

<button class="secondary" onclick="showSentRequests()">Sent</button>

</div>

</div>

<div class="card">
<div id="friendsContent"></div>
</div>

</section>

<!-- CHAT PREVIEW PAGE -->
<section id="chatPage" class="hidden">

<div class="card">

<button class="secondary" onclick="showFriends()">← Friends</button>

<h2 id="chatTitle">Chat</h2>

<div id="chatMessages"
style="min-height:300px;background:#f0f2f5;padding:10px;border-radius:10px">
</div>

<input id="chatInput" placeholder="Message লিখুন...">

<button class="primary" onclick="sendMessage()">Send</button>

</div>

</section>

</main>

<!-- NAV -->
<nav class="nav">

<button onclick="showHome()">
<span>🏠</span>Home
</button>

<button onclick="showReels()">
<span>🎬</span>Reels
</button>

<button onclick="showFriends()">
<span>👥</span>Friends
</button>

<button onclick="showSearch()">
<span>🔍</span>Search
</button>

<button onclick="showProfile()">
<span>👤</span>Profile
</button>

</nav>

</div>

<!-- EDIT PROFILE -->
<div id="editModal" class="modal hidden">

<div class="modal-box">

<h2>Edit Profile</h2>

<input id="editName" placeholder="Name">

<textarea id="editBio" rows="3" placeholder="Bio"></textarea>

<label>Profile Photo</label>
<input type="file" id="editProfilePhoto" accept="image/*">

<label>Cover Photo</label>
<input type="file" id="editCoverPhoto" accept="image/*">

<br><br>

<button class="primary" onclick="saveProfile()">Save Changes</button>

<button class="secondary" style="width:100%;margin-top:8px"
onclick="closeEditProfile()">Cancel</button>

</div>
</div>

<script>

let users=JSON.parse(localStorage.getItem("users")||"[]");
let posts=JSON.parse(localStorage.getItem("posts")||"[]");
let reels=JSON.parse(localStorage.getItem("reels")||"[]");
let notifications=JSON.parse(localStorage.getItem("notifications")||"[]");
let messages=JSON.parse(localStorage.getItem("messages")||"[]");

let currentUserId=localStorage.getItem("currentUserId");
let selectedChatUserId=null;

function saveAll(){
localStorage.setItem("users",JSON.stringify(users));
localStorage.setItem("posts",JSON.stringify(posts));
localStorage.setItem("reels",JSON.stringify(reels));
localStorage.setItem("notifications",JSON.stringify(notifications));
localStorage.setItem("messages",JSON.stringify(messages));
}

function escapeHTML(str){
return String(str||"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

function currentUser(){
return users.find(u=>u.id===currentUserId);
}

/* AUTH */

function showRegister(){
document.getElementById("loginPage").classList.add("hidden");
document.getElementById("registerPage").classList.remove("hidden");
}

function showLogin(){
document.getElementById("registerPage").classList.add("hidden");
document.getElementById("loginPage").classList.remove("hidden");
}

function register(){

let name=document.getElementById("regName").value.trim();
let email=document.getElementById("regEmail").value.trim();
let password=document.getElementById("regPassword").value;

if(!name||!email||!password){
alert("সব তথ্য পূরণ করুন");
return;
}

if(users.some(u=>u.email===email)){
alert("এই Email দিয়ে আগে অ্যাকাউন্ট আছে");
return;
}

users.push({
id:Date.now().toString(),
name,
email,
password,
bio:"",
profilePhoto:"",
coverPhoto:"",
followers:[],
following:[],
friends:[],
friendRequests:[],
sentRequests:[]
});

saveAll();
alert("Account তৈরি হয়েছে");
showLogin();
}

function login(){

let email=document.getElementById("loginEmail").value.trim();
let password=document.getElementById("loginPassword").value;

let user=users.find(u=>u.email===email&&u.password===password);

if(!user){
alert("Email অথবা Password ভুল");
return;
}

currentUserId=user.id;
localStorage.setItem("currentUserId",currentUserId);

openApp();
}

function logout(){

localStorage.removeItem("currentUserId");
currentUserId=null;

document.getElementById("app").classList.add("hidden");
document.getElementById("loginPage").classList.remove("hidden");
}

/* PAGE */

function hideAllPages(){

[
"homePage",
"reelsPage",
"profilePage",
"userProfilePage",
"searchPage",
"friendsPage",
"chatPage"
].forEach(id=>{
document.getElementById(id).classList.add("hidden");
});
}

function showHome(){
hideAllPages();
document.getElementById("homePage").classList.remove("hidden");
loadFeed();
}

function showReels(){
hideAllPages();
document.getElementById("reelsPage").classList.remove("hidden");
loadReels();
}

function showProfile(){
hideAllPages();
document.getElementById("profilePage").classList.remove("hidden");
loadProfile();
}

/* PROFILE */

function loadProfile(){

let u=currentUser();

if(!u)return;

document.getElementById("myName").textContent=u.name;
document.getElementById("myBio").textContent=u.bio||"No bio yet";

document.getElementById("myFriends").textContent=u.friends.length;
document.getElementById("myFollowers").textContent=u.followers.length;
document.getElementById("myFollowing").textContent=u.following.length;

document.getElementById("myProfilePhoto").src=
u.profilePhoto||"https://via.placeholder.com/200";

document.getElementById("myCover").style.backgroundImage=
u.coverPhoto?`url(${u.coverPhoto})`:"none";

loadMyContent();
}

function loadMyContent(){

let box=document.getElementById("myContent");

let myPosts=posts.filter(p=>p.userId===currentUserId);

if(!myPosts.length){
box.innerHTML=`<div class="card empty">আপনার কোনো Post নেই</div>`;
return;
}

box.innerHTML=myPosts.map(renderPost).join("");
}

function openEditProfile(){

let u=currentUser();

document.getElementById("editName").value=u.name;
document.getElementById("editBio").value=u.bio||"";

document.getElementById("editModal").classList.remove("hidden");
}

function closeEditProfile(){
document.getElementById("editModal").classList.add("hidden");
}

function readFile(file){

return new Promise((resolve,reject)=>{

if(!file){
resolve("");
return;
}

let reader=new FileReader();

reader.onload=e=>resolve(e.target.result);
reader.onerror=reject;

reader.readAsDataURL(file);

});
}

async function saveProfile(){

let u=currentUser();

u.name=document.getElementById("editName").value.trim();
u.bio=document.getElementById("editBio").value.trim();

let p=document.getElementById("editProfilePhoto").files[0];
let c=document.getElementById("editCoverPhoto").files[0];

if(p)u.profilePhoto=await readFile(p);
if(c)u.coverPhoto=await readFile(c);

saveAll();

closeEditProfile();
loadProfile();

alert("Profile আপডেট হয়েছে");
}

/* POST */

function previewPostPhoto(){

let f=document.getElementById("postPhoto").files[0];
let img=document.getElementById("postPreview");

if(!f){
img.classList.add("hidden");
return;
}

img.src=URL.createObjectURL(f);
img.classList.remove("hidden");
}

async function createPost(){

let text=document.getElementById("postText").value.trim();
let file=document.getElementById("postPhoto").files[0];

if(!text&&!file){
alert("কিছু লিখুন অথবা ছবি দিন");
return;
}

let image=file?await readFile(file):"";
let u=currentUser();

posts.unshift({
id:Date.now().toString(),
userId:u.id,
name:u.name,
text,
image,
likes:0,
likedBy:[],
comments:[],
shares:0
});

saveAll();

document.getElementById("postText").value="";
document.getElementById("postPhoto").value="";
document.getElementById("postPreview").classList.add("hidden");

loadFeed();
}

function loadFeed(){

let box=document.getElementById("feed");

if(!posts.length){
box.innerHTML=`<div class="card empty">এখনো কোনো Post নেই</div>`;
return;
}

box.innerHTML=posts.map(renderPost).join("");
}

function renderPost(p){

let u=users.find(x=>x.id===p.userId);

let liked=(p.likedBy||[]).includes(currentUserId);

let comments=(p.comments||[]).map(c=>`
<div class="comment">
<b>${escapeHTML(c.name)}</b>${escapeHTML(c.text)}
</div>`).join("");

return `
<div class="card">

<div class="post-head">

<img class="avatar"
src="${u?.profilePhoto||"https://via.placeholder.com/100"}">

<div class="user-info">
<div class="name">${escapeHTML(p.name)}</div>
<div class="time">My Social App</div>
</div>

</div>

<div class="post-text">${escapeHTML(p.text)}</div>

${p.image?`<img class="post-image" src="${p.image}">`:""}

<div class="post-actions">

<button onclick="likePost('${p.id}')">
${liked?"❤️":"👍"} ${p.likes}
</button>

<button onclick="toggleComment('${p.id}')">
💬 ${p.comments.length}
</button>

<button onclick="sharePost('${p.id}')">
↗️ ${p.shares}
</button>

</div>

<div id="comment-${p.id}" class="hidden">

<input id="commentInput-${p.id}" placeholder="Write a comment">

<button class="primary" onclick="addComment('${p.id}')">
Comment
</button>

${comments}

</div>

</div>
`;
}

function likePost(id){

let p=posts.find(x=>x.id===id);

if(!p.likedBy)p.likedBy=[];

if(p.likedBy.includes(currentUserId)){
p.likedBy=p.likedBy.filter(x=>x!==currentUserId);
p.likes--;
}else{
p.likedBy.push(currentUserId);
p.likes++;

if(p.userId!==currentUserId){
addNotification(p.userId,currentUser().name+" আপনার Post Like করেছেন ❤️");
}
}

saveAll();
loadFeed();
}

function toggleComment(id){
document.getElementById("comment-"+id).classList.toggle("hidden");
}

function addComment(id){

let input=document.getElementById("commentInput-"+id);
let text=input.value.trim();

if(!text)return;

let p=posts.find(x=>x.id===id);

p.comments.push({
name:currentUser().name,
userId:currentUserId,
text
});

saveAll();
loadFeed();
}

async function sharePost(id){

let p=posts.find(x=>x.id===id);
p.shares++;

if(navigator.share){
try{
await navigator.share({
title:"My Social App",
text:p.text||"Check this post"
});
}catch(e){}
}else{
alert("Post share করা হয়েছে");
}

saveAll();
loadFeed();
}

/* REELS */

function previewReel(){

let f=document.getElementById("reelVideo").files[0];
let v=document.getElementById("reelPreview");

if(!f){
v.classList.add("hidden");
return;
}

v.src=URL.createObjectURL(f);
v.classList.remove("hidden");
}

async function createReel(){

let f=document.getElementById("reelVideo").files[0];

if(!f){
alert("ভিডিও নির্বাচন করুন");
return;
}

if(f.size>15*1024*1024){
alert("পরীক্ষার জন্য 15MB-এর ছোট ভিডিও ব্যবহার করুন");
return;
}

let u=currentUser();

reels.unshift({
id:Date.now().toString(),
userId:u.id,
name:u.name,
text:document.getElementById("reelText").value.trim(),
video:await readFile(f),
likes:0,
likedBy:[],
comments:[],
shares:0
});

try{
saveAll();
}catch(e){
alert("Storage পূর্ণ হয়েছে। ছোট ভিডিও ব্যবহার করুন");
return;
}

document.getElementById("reelVideo").value="";
document.getElementById("reelText").value="";
document.getElementById("reelPreview").classList.add("hidden");

loadReels();
alert("Reel Upload হয়েছে 🎉");
}

function loadReels(){

let box=document.getElementById("reels");

if(!reels.length){
box.innerHTML=`<div class="card empty">কোনো Reel নেই</div>`;
return;
}

box.innerHTML=reels.map(renderReel).join("");
}

function renderReel(r){

let liked=(r.likedBy||[]).includes(currentUserId);

return `
<div class="card reel-card">

<div class="post-head">

<div class="avatar"
style="display:flex;align-items:center;justify-content:center">
🎬
</div>

<div class="user-info">
<div class="name">${escapeHTML(r.name)}</div>
<div class="time">Reel</div>
</div>

</div>

<div class="post-text">${escapeHTML(r.text)}</div>

<video controls playsinline class="post-video">
<source src="${r.video}">
</video>

<div class="post-actions">

<button onclick="likeReel('${r.id}')">
${liked?"❤️":"👍"} ${r.likes}
</button>

<button onclick="addReelComment('${r.id}')">
💬 ${r.comments.length}
</button>

<button onclick="shareReel('${r.id}')">
↗️ ${r.shares}
</button>

</div>

</div>
`;
}

function likeReel(id){

let r=reels.find(x=>x.id===id);

if(r.likedBy.includes(currentUserId)){
r.likedBy=r.likedBy.filter(x=>x!==currentUserId);
r.likes--;
}else{
r.likedBy.push(currentUserId);
r.likes++;
}

saveAll();
loadReels();
}

function addReelComment(id){

let text=prompt("Comment লিখুন");

if(!text)return;

let r=reels.find(x=>x.id===id);

r.comments.push({
name:currentUser().name,
userId:currentUserId,
text
});

saveAll();
loadReels();
}

async function shareReel(id){

let r=reels.find(x=>x.id===id);

r.shares++;

if(navigator.share){
try{
await navigator.share({
title:"My Social App",
text:r.text||"Check this Reel"
});
}catch(e){}
}else{
alert("Reel share করা হয়েছে");
}

saveAll();
loadReels();
}

/* SEARCH */

function showSearch(){

hideAllPages();
document.getElementById("searchPage").classList.remove("hidden");
}

function searchUsers(){

let q=document.getElementById("searchInput").value.trim().toLowerCase();

let result=users.filter(u=>
u.id!==currentUserId &&
u.name.toLowerCase().includes(q)
);

let box=document.getElementById("searchResults");

if(!result.length){
box.innerHTML=`<div class="empty">User পাওয়া যায়নি</div>`;
return;
}

box.innerHTML=result.map(renderSearchUser).join("");
}

function renderSearchUser(u){

let me=currentUser();

let isFriend=me.friends.includes(u.id);
let sent=me.sentRequests.includes(u.id);
let received=me.friendRequests.includes(u.id);

let action="";

if(isFriend){
action=`<button class="secondary" onclick="openChat('${u.id}')">💬 Chat</button>`;
}else if(received){
action=`<button class="success" onclick="acceptFriendRequest('${u.id}')">Accept</button>`;
}else if(sent){
action=`<button class="secondary">Request Sent</button>`;
}else{
action=`<button class="primary" style="width:auto" onclick="sendFriendRequest('${u.id}')">Add Friend</button>`;
}

return `
<div class="user-row">

<img class="avatar"
src="${u.profilePhoto||"https://via.placeholder.com/100"}">

<div class="user-info">
<b>${escapeHTML(u.name)}</b>
<div>${u.friends.length} Friends</div>
</div>

${action}

<button class="secondary" onclick="openUserProfile('${u.id}')">
View
</button>

</div>
`;
}

/* FRIEND SYSTEM */

function ensureFriendFields(){

users.forEach(u=>{

if(!u.friends)u.friends=[];
if(!u.friendRequests)u.friendRequests=[];
if(!u.sentRequests)u.sentRequests=[];
if(!u.followers)u.followers=[];
if(!u.following)u.following=[];

});

saveAll();
}

function sendFriendRequest(id){

let me=currentUser();
let target=users.find(u=>u.id===id);

if(!target)return;

if(me.friends.includes(id)){
alert("আপনারা ইতিমধ্যে Friends");
return;
}

if(me.sentRequests.includes(id)){
alert("Friend Request আগেই পাঠানো হয়েছে");
return;
}

me.sentRequests.push(id);
target.friendRequests.push(me.id);

addNotification(
target.id,
me.name+" আপনাকে Friend Request পাঠিয়েছেন 👥"
);

saveAll();

alert("Friend Request পাঠানো হয়েছে");

searchUsers();
}

function acceptFriendRequest(id){

let me=currentUser();
let sender=users.find(u=>u.id===id);

if(!sender)return;

me.friendRequests=me.friendRequests.filter(x=>x!==id);
sender.sentRequests=sender.sentRequests.filter(x=>x!==me.id);

if(!me.friends.includes(id))me.friends.push(id);
if(!sender.friends.includes(me.id))sender.friends.push(me.id);

addNotification(
sender.id,
me.name+" আপনার Friend Request Accept করেছেন 🎉"
);

saveAll();

showFriendRequests();
}

function rejectFriendRequest(id){

let me=currentUser();
let sender=users.find(u=>u.id===id);

me.friendRequests=me.friendRequests.filter(x=>x!==id);

if(sender){
sender.sentRequests=
sender.sentRequests.filter(x=>x!==me.id);
}

saveAll();

showFriendRequests();
}

function cancelFriendRequest(id){

let me=currentUser();
let target=users.find(u=>u.id===id);

me.sentRequests=
me.sentRequests.filter(x=>x!==id);

if(target){
target.friendRequests=
target.friendRequests.filter(x=>x!==me.id);
}

saveAll();

showSentRequests();
}

function unfriend(id){

let me=currentUser();
let other=users.find(u=>u.id===id);

if(!other)return;

if(!confirm("এই ব্যক্তিকে Unfriend করবেন?"))return;

me.friends=me.friends.filter(x=>x!==id);
other.friends=other.friends.filter(x=>x!==me.id);

saveAll();

showFriends();
}

/* FRIENDS PAGE */

function showFriends(){

hideAllPages();

document.getElementById("friendsPage").classList.remove("hidden");

renderFriends();
}

function renderFriends(){

let me=currentUser();

let box=document.getElementById("friendsContent");

if(!me.friends.length){
box.innerHTML=`
<div class="empty">
আপনার এখনো কোনো Friend নেই।<br><br>
Search থেকে নতুন Friend Add করুন।
</div>`;
return;
}

box.innerHTML=me.friends.map(id=>{

let u=users.find(x=>x.id===id);

if(!u)return "";

return `
<div class="user-row">

<img class="avatar"
src="${u.profilePhoto||"https://via.placeholder.com/100"}">

<div class="user-info">
<b>${escapeHTML(u.name)}</b>
<div>Friend</div>
</div>

<button class="secondary" onclick="openChat('${u.id}')">
💬
</button>

<button class="danger" onclick="unfriend('${u.id}')">
Unfriend
</button>

</div>
`;

}).join("");
}

function showFriendRequests(){

hideAllPages();
document.getElementById("friendsPage").classList.remove("hidden");

let me=currentUser();
let box=document.getElementById("friendsContent");

if(!me.friendRequests.length){

box.innerHTML=`<div class="empty">কোনো Friend Request নেই</div>`;
return;
}

box.innerHTML=me.friendRequests.map(id=>{

let u=users.find(x=>x.id===id);

if(!u)return "";

return `
<div class="request-box">

<img class="avatar"
src="${u.profilePhoto||"https://via.placeholder.com/100"}">

<div class="user-info">
<b>${escapeHTML(u.name)}</b>
<div>Friend Request</div>
</div>

<div class="request-buttons">

<button class="success"
onclick="acceptFriendRequest('${u.id}')">
✓
</button>

<button class="danger"
onclick="rejectFriendRequest('${u.id}')">
✕
</button>

</div>

</div>
`;

}).join("");
}

function showSentRequests(){

hideAllPages();
document.getElementById("friendsPage").classList.remove("hidden");

let me=currentUser();
let box=document.getElementById("friendsContent");

if(!me.sentRequests.length){
box.innerHTML=`<div class="empty">কোনো Sent Request নেই</div>`;
return;
}

box.innerHTML=me.sentRequests.map(id=>{

let u=users.find(x=>x.id===id);

if(!u)return "";

return `
<div class="request-box">

<img class="avatar"
src="${u.profilePhoto||"https://via.placeholder.com/100"}">

<div class="user-info">
<b>${escapeHTML(u.name)}</b>
<div>Request Sent</div>
</div>

<button class="secondary"
onclick="cancelFriendRequest('${u.id}')">
Cancel
</button>

</div>
`;

}).join("");
}

/* OTHER PROFILE */

function openUserProfile(id){

if(id===currentUserId){
showProfile();
return;
}

hideAllPages();
document.getElementById("userProfilePage").classList.remove("hidden");

loadOtherProfile(id);
}

function loadOtherProfile(id){

let u=users.find(x=>x.id===id);
let me=currentUser();

if(!u)return;

let isFriend=me.friends.includes(id);
let sent=me.sentRequests.includes(id);
let received=me.friendRequests.includes(id);

let action="";

if(isFriend){

action=`
<button class="success" onclick="openChat('${id}')">
💬 Message
</button>

<button class="danger" onclick="unfriend('${id}')">
Unfriend
</button>
`;

}else if(received){

action=`
<button class="success" onclick="acceptFriendRequest('${id}')">
Accept Friend Request
</button>

<button class="danger" onclick="rejectFriendRequest('${id}')">
Reject
</button>
`;

}else if(sent){

action=`
<button class="secondary" onclick="cancelFriendRequest('${id}')">
Cancel Request
</button>
`;

}else{

action=`
<button class="primary" style="width:auto"
onclick="sendFriendRequest('${id}')">
👥 Add Friend
</button>
`;
}

document.getElementById("otherProfile").innerHTML=`

<div class="card" style="padding:0;overflow:hidden">

<div class="profile-cover"
style="background-image:url('${u.coverPhoto||""}')">
</div>

<div class="profile-main">

<img class="avatar"
src="${u.profilePhoto||"https://via.placeholder.com/100"}">

<div class="profile-name">${escapeHTML(u.name)}</div>

<div class="bio">${escapeHTML(u.bio||"No bio yet")}</div>

<div class="stats">

<div class="stat">
<b>${u.friends.length}</b>
Friends
</div>

<div class="stat">
<b>${u.followers.length}</b>
Followers
</div>

</div>

<div style="display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-bottom:15px">
${action}
</div>

</div>
</div>
`;

let content=posts.filter(p=>p.userId===id);

document.getElementById("otherContent").innerHTML=
content.map(renderPost).join("")||
`<div class="card empty">কোনো Post নেই</div>`;
}

/* CHAT */

function openChat(id){

let me=currentUser();

if(!me.friends.includes(id)){
alert("শুধু Friends-এর সাথে Chat করা যাবে");
return;
}

selectedChatUserId=id;

let u=users.find(x=>x.id===id);

hideAllPages();
document.getElementById("chatPage").classList.remove("hidden");

document.getElementById("chatTitle").textContent=
"💬 "+u.name;

loadMessages();
}

function loadMessages(){

let box=document.getElementById("chatMessages");

let list=messages.filter(m=>
(m.senderId===currentUserId&&m.receiverId===selectedChatUserId)||
(m.senderId===selectedChatUserId&&m.receiverId===currentUserId)
);

if(!list.length){
box.innerHTML=
`<div class="empty">এখনো কোনো Message নেই</div>`;
return;
}

box.innerHTML=list.map(m=>{

let mine=m.senderId===currentUserId;

return `
<div style="
text-align:${mine?"right":"left"};
margin:8px 0">

<span style="
display:inline-block;
background:${mine?"#1877f2":"#fff"};
color:${mine?"#fff":"#222"};
padding:9px 12px;
border-radius:15px;
max-width:80%;
">
${escapeHTML(m.text)}
</span>

</div>
`;

}).join("");

box.scrollTop=box.scrollHeight;
}

function sendMessage(){

let input=document.getElementById("chatInput");
let text=input.value.trim();

if(!text)return;

messages.push({
id:Date.now().toString(),
senderId:currentUserId,
receiverId:selectedChatUserId,
text,
time:new Date().toISOString()
});

addNotification(
selectedChatUserId,
currentUser().name+" আপনাকে Message পাঠিয়েছেন 💬"
);

input.value="";

saveAll();
loadMessages();
}

/* NOTIFICATIONS */

function addNotification(receiverId,text){

notifications.unshift({
id:Date.now().toString()+Math.random(),
receiverId,
text,
read:false,
time:new Date().toLocaleString()
});

saveAll();
}

function toggleNotifications(){

let list=notifications.filter(
n=>n.receiverId===currentUserId
);

if(!list.length){
alert("কোনো Notification নেই");
return;
}

alert(list.map(n=>n.text).join("\n\n"));

list.forEach(n=>n.read=true);

saveAll();
}

/* MIGRATION */

function migrate(){

users.forEach(u=>{

if(!u.friends)u.friends=[];
if(!u.friendRequests)u.friendRequests=[];
if(!u.sentRequests)u.sentRequests=[];
if(!u.followers)u.followers=[];
if(!u.following)u.following=[];
if(!u.bio)u.bio="";
if(!u.profilePhoto)u.profilePhoto="";
if(!u.coverPhoto)u.coverPhoto="";

});

posts.forEach(p=>{
if(!p.likedBy)p.likedBy=[];
if(!p.comments)p.comments=[];
if(!p.likes)p.likes=0;
if(!p.shares)p.shares=0;
});

reels.forEach(r=>{
if(!r.likedBy)r.likedBy=[];
if(!r.comments)r.comments=[];
if(!r.likes)r.likes=0;
if(!r.shares)r.shares=0;
});

saveAll();
}

/* START */

function openApp(){

document.getElementById("loginPage").classList.add("hidden");
document.getElementById("registerPage").classList.add("hidden");
document.getElementById("app").classList.remove("hidden");

migrate();
showHome();
}

window.onload=function(){

migrate();

if(currentUserId&&currentUser()){
openApp();
}else{
showLogin();
}

};

</script>
