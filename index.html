<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1877f2">
<meta name="app-version" content="1.1.0">
<meta name="description" content="FriendBook - Connect, Share, Reels and Chat">

<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
<link rel="apple-touch-icon" href="./icon-192.png">

<title>FriendBook v1.1.0</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
:root{
 --blue:#1877f2;
 --blue2:#0866ff;
 --bg:#f0f2f5;
 --card:#fff;
 --text:#111827;
 --muted:#65676b;
 --border:#e4e6eb;
 --shadow:0 8px 30px rgba(0,0,0,.08);
 --radius:18px;
}
body.dark{
 --bg:#101114;
 --card:#18191d;
 --text:#f5f6f7;
 --muted:#b7bac0;
 --border:#303238;
 --shadow:0 8px 30px rgba(0,0,0,.35);
}
*{scrollbar-width:thin}
body{
 margin:0;
 background:var(--bg);
 color:var(--text);
 font-family:Arial,"Noto Sans Bengali",sans-serif;
 transition:.2s;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.top{
 position:sticky;
 top:0;
 z-index:1000;
 height:64px;
 background:var(--card);
 border-bottom:1px solid var(--border);
 display:flex;
 align-items:center;
 gap:12px;
 padding:8px 16px;
 backdrop-filter:blur(20px);
}
.logo{
 font-size:24px;
 font-weight:900;
 color:var(--blue);
 white-space:nowrap;
}
.search{
 flex:1;
 max-width:500px;
}
.search input{
 width:100%;
 border:0;
 outline:0;
 background:var(--bg);
 color:var(--text);
 border-radius:24px;
 padding:12px 18px;
}
.top-actions{
 margin-left:auto;
 display:flex;
 gap:8px;
}
.icon-btn,.btn{
 border:0;
 border-radius:13px;
 padding:10px 13px;
 background:var(--bg);
 color:var(--text);
}
.icon-btn:hover,.btn:hover{filter:brightness(.95)}
.primary{
 background:var(--blue);
 color:white;
}
.layout{
 max-width:1450px;
 margin:auto;
 display:grid;
 grid-template-columns:250px minmax(0,650px) 280px;
 gap:18px;
 padding:18px;
}
.sidebar{
 position:sticky;
 top:82px;
 height:max-content;
}
.menu{
 background:var(--card);
 border:1px solid var(--border);
 border-radius:var(--radius);
 padding:10px;
 box-shadow:var(--shadow);
}
.menu button{
 width:100%;
 border:0;
 background:transparent;
 color:var(--text);
 text-align:left;
 padding:13px;
 border-radius:12px;
 margin:2px 0;
}
.menu button:hover{background:var(--bg)}
.card{
 background:var(--card);
 border:1px solid var(--border);
 border-radius:var(--radius);
 box-shadow:var(--shadow);
 margin-bottom:15px;
 overflow:hidden;
}
.card-pad{padding:16px}
.stories{
 display:flex;
 gap:10px;
 overflow-x:auto;
 padding:12px;
}
.story{
 min-width:100px;
 height:145px;
 border-radius:16px;
 overflow:hidden;
 position:relative;
 background:linear-gradient(145deg,#1877f2,#7c3aed);
}
.story img{
 width:100%;
 height:100%;
 object-fit:cover;
}
.story-name{
 position:absolute;
 bottom:7px;
 left:7px;
 right:7px;
 color:white;
 font-size:12px;
 font-weight:bold;
 text-shadow:0 1px 4px #000;
}
.composer{
 display:flex;
 gap:10px;
 align-items:center;
}
.avatar{
 width:42px;
 height:42px;
 border-radius:50%;
 object-fit:cover;
 background:#ddd;
 flex:none;
}
.fake-input{
 flex:1;
 background:var(--bg);
 color:var(--muted);
 border-radius:25px;
 padding:13px 17px;
 cursor:pointer;
}
.post-head{
 display:flex;
 gap:10px;
 padding:15px 15px 5px;
}
.post-user{font-weight:800}
.post-time{
 color:var(--muted);
 font-size:12px;
 margin-top:3px;
}
.post-body{padding:10px 15px}
.post-image{
 width:100%;
 max-height:650px;
 object-fit:cover;
 display:block;
}
.stats{
 display:flex;
 justify-content:space-between;
 color:var(--muted);
 padding:10px 15px;
 font-size:14px;
}
.actions{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 border-top:1px solid var(--border);
 border-bottom:1px solid var(--border);
}
.actions button{
 border:0;
 background:transparent;
 color:var(--text);
 padding:12px 5px;
}
.actions button:hover{background:var(--bg)}
.liked{color:#1877f2!important;font-weight:bold}
.comments{padding:10px 15px}
.comment{
 display:flex;
 gap:8px;
 margin:8px 0;
}
.comment-box{
 display:flex;
 gap:8px;
 margin-top:10px;
}
.comment-box input{
 flex:1;
 border:0;
 outline:0;
 background:var(--bg);
 color:var(--text);
 border-radius:20px;
 padding:10px 14px;
}
.right-title{
 font-weight:800;
 margin-bottom:10px;
}
.online{
 display:flex;
 align-items:center;
 gap:10px;
 padding:8px 0;
}
.dot{
 width:10px;
 height:10px;
 border-radius:50%;
 background:#31a24c;
}
.profile-cover{
 height:220px;
 background:linear-gradient(135deg,#1877f2,#7c3aed);
}
.profile-main{
 padding:0 20px 20px;
 position:relative;
}
.profile-main .avatar{
 width:100px;
 height:100px;
 margin-top:-50px;
 border:4px solid var(--card);
}
.profile-actions{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
 margin-top:12px;
}
.modal{
 position:fixed;
 inset:0;
 z-index:3000;
 background:rgba(0,0,0,.65);
 display:none;
 align-items:center;
 justify-content:center;
 padding:15px;
}
.modal.show{display:flex}
.modal-box{
 width:min(650px,100%);
 max-height:90vh;
 overflow:auto;
 background:var(--card);
 color:var(--text);
 border-radius:22px;
 box-shadow:0 20px 70px rgba(0,0,0,.4);
}
.modal-head{
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:16px;
 border-bottom:1px solid var(--border);
}
.modal-body{padding:16px}
.field{
 width:100%;
 border:1px solid var(--border);
 outline:0;
 background:var(--bg);
 color:var(--text);
 border-radius:13px;
 padding:12px;
 margin-bottom:10px;
}
textarea.field{min-height:120px;resize:vertical}
.auth{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
 background:linear-gradient(135deg,#1877f2,#6d28d9);
}
.auth-box{
 width:min(430px,100%);
 background:white;
 color:#111;
 padding:28px;
 border-radius:25px;
 box-shadow:0 20px 70px rgba(0,0,0,.3);
}
.auth-box h1{
 color:#1877f2;
 text-align:center;
}
.auth-box input{
 width:100%;
 padding:13px;
 margin:7px 0;
 border:1px solid #ddd;
 border-radius:12px;
}
.bottom-nav{
 display:none;
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 z-index:2000;
 background:var(--card);
 border-top:1px solid var(--border);
 padding:7px 5px calc(7px + env(safe-area-inset-bottom));
}
.bottom-nav button{
 flex:1;
 border:0;
 background:transparent;
 color:var(--muted);
 font-size:11px;
}
.bottom-nav span{
 display:block;
 font-size:20px;
}
.reels-page{
 position:fixed;
 inset:0;
 z-index:2500;
 background:#000;
 display:none;
 overflow-y:auto;
 scroll-snap-type:y mandatory;
}
.reels-page.show{display:block}
.reel{
 position:relative;
 width:100%;
 height:100vh;
 max-width:650px;
 margin:auto;
 scroll-snap-align:start;
 background:#000;
}
.reel video{
 width:100%;
 height:100%;
 object-fit:cover;
}
.reel-info{
 position:absolute;
 left:15px;
 right:80px;
 bottom:30px;
 color:white;
 text-shadow:0 1px 4px #000;
}
.reel-actions{
 position:absolute;
 right:12px;
 bottom:100px;
 display:flex;
 flex-direction:column;
 gap:14px;
}
.reel-actions button{
 width:50px;
 height:50px;
 border-radius:50%;
 border:0;
 background:rgba(0,0,0,.5);
 color:#fff;
 font-size:21px;
}
.reel-close{
 position:fixed;
 top:15px;
 right:15px;
 z-index:2600;
}
.progress{
 height:5px;
 background:#ddd;
 border-radius:5px;
 overflow:hidden;
 margin:10px 0;
}
.progress i{
 display:block;
 height:100%;
 width:0;
 background:var(--blue);
}
.hidden{display:none!important}
.empty{
 text-align:center;
 color:var(--muted);
 padding:30px;
}
.row{
 display:flex;
 gap:10px;
 align-items:center;
}
.space{justify-content:space-between}
hr{border:0;border-top:1px solid var(--border)}
.toast{
 position:fixed;
 left:50%;
 bottom:90px;
 transform:translateX(-50%);
 background:#111;
 color:#fff;
 padding:12px 18px;
 border-radius:25px;
 z-index:5000;
 display:none;
}
.toast.show{display:block}
.badge{
 display:inline-block;
 background:#e7f0ff;
 color:#1877f2;
 padding:4px 8px;
 border-radius:10px;
 font-size:11px;
 font-weight:bold;
}
.list-item{
 display:flex;
 gap:10px;
 align-items:center;
 padding:11px 0;
 border-bottom:1px solid var(--border);
}
.list-item:last-child{border:0}
@media(max-width:1000px){
 .layout{grid-template-columns:200px minmax(0,1fr)}
 .right-sidebar{display:none}
}
@media(max-width:700px){
 .top{height:58px;padding:7px 10px}
 .logo{font-size:20px}
 .search{display:none}
 .layout{
  display:block;
  padding:10px;
  padding-bottom:80px;
 }
 .left-sidebar{display:none}
 .bottom-nav{display:flex}
 .card{border-radius:15px}
 .profile-cover{height:170px}
}
</style>
</head>

<body>

<div id="authScreen" class="auth">
 <div class="auth-box">
  <h1>FriendBook</h1>
  <p style="text-align:center;color:#666">Connect • Share • Reels • Chat</p>

  <input id="authEmail" type="email" placeholder="Email">
  <input id="authPassword" type="password" placeholder="Password">

  <button id="authBtn" class="btn primary" style="width:100%" onclick="authAction()">
   Login
  </button>

  <button class="btn" style="width:100%;margin-top:8px" onclick="switchAuth()">
   Create new account
  </button>

  <p id="authMsg" style="text-align:center;color:#d00"></p>
 </div>
</div>

<div id="app" class="hidden">

<header class="top">
 <div class="logo">FriendBook</div>

 <div class="search">
  <input id="searchInput" placeholder="Search FriendBook..." onkeydown="if(event.key==='Enter')doSearch()">
 </div>

 <div class="top-actions">
  <button class="icon-btn" onclick="doSearch()">🔎</button>
  <button class="icon-btn" onclick="openNotifications()">🔔</button>
  <button class="icon-btn" onclick="toggleDark()">🌙</button>
 </div>
</header>

<div class="layout">

<aside class="sidebar left-sidebar">
 <div class="menu">

  <button onclick="showHome()">🏠 Home</button>
  <button onclick="openProfile(me?.id)">👤 Profile</button>
  <button onclick="openReels()">🎬 Reels</button>
  <button onclick="openMessenger()">💬 Messenger</button>
  <button onclick="openFriends()">👥 Friends</button>
  <button onclick="openPages()">📄 Pages</button>
  <button onclick="openGroups()">👨‍👩‍👧 Groups</button>
  <button onclick="openMarketplace()">🛒 Marketplace</button>
  <button onclick="openEvents()">📅 Events</button>
  <button onclick="openCreator()">💰 Creator Studio</button>
  <button onclick="openSettings()">⚙️ Settings</button>

  <hr>

  <button onclick="logout()">🚪 Logout</button>
 </div>
</aside>

<main id="main"></main>

<aside class="sidebar right-sidebar">

 <div class="card card-pad">
  <div class="right-title">Quick Actions</div>
  <button class="btn primary" style="width:100%;margin-bottom:7px" onclick="openCreatePost()">➕ Create Post</button>
  <button class="btn" style="width:100%;margin-bottom:7px" onclick="openCreateReel()">🎬 Create Reel</button>
  <button class="btn" style="width:100%" onclick="openCreateStory()">📖 Create Story</button>
 </div>

 <div class="card card-pad">
  <div class="right-title">Online Friends</div>
  <div id="onlineFriends"></div>
 </div>

</aside>

</div>

<nav class="bottom-nav">
 <button onclick="showHome()"><span>🏠</span>Home</button>
 <button onclick="openReels()"><span>🎬</span>Reels</button>
 <button onclick="openCreatePost()"><span>➕</span>Create</button>
 <button onclick="openMessenger()"><span>💬</span>Chat</button>
 <button onclick="openProfile(me?.id)"><span>👤</span>Profile</button>
</nav>

</div>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()">
 <div id="modalBox" class="modal-box"></div>
</div>

<div id="reelsPage" class="reels-page">
 <button class="reel-close icon-btn" onclick="closeReels()">✕</button>
 <div id="reelsContainer"></div>
</div>

<div id="toast" class="toast"></div>

<script>
const SUPABASE_URL="https://skereuaizdczbvjplisi.supabase.co";
const SUPABASE_KEY="sb_publishable_3R2otJA1zIlsMsTYxe1ocw_NAPY5O9x";

const {createClient}=supabase;
const sb=createClient(SUPABASE_URL,SUPABASE_KEY);

let me=null;
let myProfile=null;
let authMode="login";
let currentPostId=null;
let currentReelId=null;
let currentReels=[];
let darkMode=localStorage.getItem("fb_dark")==="1";

const $=id=>document.getElementById(id);

function esc(v){
 return String(v??"").replace(/[&<>"']/g,m=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
 }[m]));
}

function toast(msg){
 $("toast").textContent=msg;
 $("toast").classList.add("show");
 setTimeout(()=>$("toast").classList.remove("show"),2500);
}

function openModal(html){
 $("modalBox").innerHTML=html;
 $("modal").classList.add("show");
}

function closeModal(){
 $("modal").classList.remove("show");
}

function avatarURL(url,name="U"){
 return url || "https://ui-avatars.com/api/?name="+encodeURIComponent(name)+"&background=1877f2&color=fff";
}

function timeAgo(date){
 const d=(Date.now()-new Date(date).getTime())/1000;
 if(d<60)return "Just now";
 if(d<3600)return Math.floor(d/60)+"m";
 if(d<86400)return Math.floor(d/3600)+"h";
 if(d<604800)return Math.floor(d/86400)+"d";
 return new Date(date).toLocaleDateString();
}

function toggleDark(){
 darkMode=!darkMode;
 document.body.classList.toggle("dark",darkMode);
 localStorage.setItem("fb_dark",darkMode?"1":"0");
}

if(darkMode)document.body.classList.add("dark");

async function init(){
 const {data}=await sb.auth.getSession();

 if(data.session){
  me=data.session.user;
  await loadMyProfile();
  showApp();
 }else{
  $("authScreen").classList.remove("hidden");
 }
}

async function loadMyProfile(){
 if(!me)return;

 const {data,error}=await sb
  .from("profiles")
  .select("*")
  .eq("id",me.id)
  .maybeSingle();

 if(error){
  console.log(error);
 }

 myProfile=data||{
  id:me.id,
  full_name:me.email?.split("@")[0]||"User",
  bio:"",
  avatar_url:""
 };
}

function showApp(){
 $("authScreen").classList.add("hidden");
 $("app").classList.remove("hidden");
 showHome();
 loadOnlineFriends();
 updateLastSeen();
}

function switchAuth(){
 authMode=authMode==="login"?"register":"login";
 $("authBtn").textContent=authMode==="login"?"Login":"Create account";
 $("authMsg").textContent="";
}

async function authAction(){
 const email=$("authEmail").value.trim();
 const password=$("authPassword").value;

 if(!email||!password){
  $("authMsg").textContent="Email এবং Password দিন";
  return;
 }

 $("authMsg").textContent="Please wait...";

 if(authMode==="login"){
  const {data,error}=await sb.auth.signInWithPassword({email,password});

  if(error){
   $("authMsg").textContent=error.message;
   return;
  }

  me=data.user;
  await loadMyProfile();
  showApp();

 }else{

  const {data,error}=await sb.auth.signUp({email,password});

  if(error){
   $("authMsg").textContent=error.message;
   return;
  }

  if(data.user){
   me=data.user;

   await sb.from("profiles").upsert({
    id:me.id,
    full_name:email.split("@")[0],
    bio:"",
    avatar_url:""
   });

   await loadMyProfile();

   toast("Account created");
   showApp();
  }
 }
}

async function logout(){
 await sb.auth.signOut();
 location.reload();
}

function showHome(){
 $("main").innerHTML=`
  <section>

   <div class="card">
    <div class="stories" id="stories"></div>
   </div>

   <div class="card card-pad">
    <div class="composer">
     <img class="avatar" src="${avatarURL(myProfile?.avatar_url,myProfile?.full_name)}">
     <div class="fake-input" onclick="openCreatePost()">
      What's on your mind, ${esc(myProfile?.full_name||"User")}?
     </div>
    </div>
   </div>

   <div id="feed"></div>

  </section>
 `;

 loadStories();
 loadFeed();
}

async function loadStories(){
 const box=$("stories");
 if(!box)return;

 const {data}=await sb
  .from("stories")
  .select("*,profiles(full_name,avatar_url)")
  .gt("expires_at",new Date().toISOString())
  .order("created_at",{ascending:false})
  .limit(20);

 let html=`
 <div class="story" onclick="openCreateStory()" style="display:flex;align-items:end;padding:10px;color:white;font-weight:bold">
  ➕<br>Create Story
 </div>`;

 (data||[]).forEach(s=>{
  html+=`
   <div class="story" onclick="viewStory('${s.id}')">
    <img src="${esc(s.image_url)}">
    <div class="story-name">${esc(s.profiles?.full_name||"Story")}</div>
   </div>`;
 });

 box.innerHTML=html;
}

async function loadFeed(){
 const box=$("feed");
 if(!box)return;

 box.innerHTML=`<div class="card empty">Loading posts...</div>`;

 const {data,error}=await sb
  .from("posts")
  .select("*,profiles(full_name,avatar_url)")
  .order("created_at",{ascending:false})
  .limit(50);

 if(error){
  box.innerHTML=`<div class="card empty">Feed error: ${esc(error.message)}</div>`;
  return;
 }

 if(!data?.length){
  box.innerHTML=`<div class="card empty">No posts yet. Create your first post.</div>`;
  return;
 }

 box.innerHTML=data.map(renderPost).join("");

 for(const p of data){
  await hydratePostStats(p.id);
 }
}

function renderPost(p){
 const name=p.profiles?.full_name||"User";
 const avatar=avatarURL(p.profiles?.avatar_url,name);

 return `
 <article class="card" id="post-${p.id}">

  <div class="post-head">
   <img class="avatar" src="${avatar}">
   <div style="flex:1">
    <div class="post-user" onclick="openProfile('${p.user_id}')">${esc(name)}</div>
    <div class="post-time">${timeAgo(p.created_at)}</div>
   </div>

   ${p.user_id===me.id?
    `<button class="icon-btn" onclick="openPostMenu('${p.id}')">⋮</button>`:
    `<button class="icon-btn" onclick="reportItem('post','${p.id}')">⚑</button>`
   }
  </div>

  <div class="post-body">${esc(p.content||"")}</div>

  ${p.image_url?`<img class="post-image" src="${esc(p.image_url)}">`:""}

  <div class="stats">
   <span id="likes-${p.id}">❤️ 0</span>
   <span id="comments-count-${p.id}">💬 0</span>
  </div>

  <div class="actions">
   <button id="like-btn-${p.id}" onclick="toggleLike('${p.id}')">❤️ Like</button>
   <button onclick="toggleComments('${p.id}')">💬 Comment</button>
   <button onclick="sharePost('${p.id}')">↗ Share</button>
  </div>

  <div id="comments-${p.id}" class="comments hidden">
   <div id="comment-list-${p.id}"></div>

   <div class="comment-box">
    <input id="comment-input-${p.id}" placeholder="Write a comment..."
     onkeydown="if(event.key==='Enter')addComment('${p.id}')">
    <button class="btn primary" onclick="addComment('${p.id}')">Send</button>
   </div>
  </div>

 </article>`;
}

async function hydratePostStats(postId){
 const {count:likes}=await sb
  .from("post_likes")
  .select("*",{count:"exact",head:true})
  .eq("post_id",postId);

 const {count:comments}=await sb
  .from("comments")
  .select("*",{count:"exact",head:true})
  .eq("post_id",postId);

 const l=$("likes-"+postId);
 const c=$("comments-count-"+postId);

 if(l)l.textContent="❤️ "+(likes||0);
 if(c)c.textContent="💬 "+(comments||0);

 const {data:mine}=await sb
  .from("post_likes")
  .select("post_id")
  .eq("post_id",postId)
  .eq("user_id",me.id)
  .maybeSingle();

 const b=$("like-btn-"+postId);
 if(b&&mine)b.classList.add("liked");
}

async function toggleLike(postId){
 const {data:existing}=await sb
  .from("post_likes")
  .select("*")
  .eq("post_id",postId)
  .eq("user_id",me.id)
  .maybeSingle();

 if(existing){
  await sb.from("post_likes").delete().eq("post_id",postId).eq("user_id",me.id);
 }else{

function publicStorageURL(bucket,path){

}

function toggleReelSound(event,el){
 if(event.target.tagName==="BUTTON")return;

 const video=el.querySelector("video");
 if(!video)return;

 video.muted=!video.muted;
 toast(video.muted?"Sound off":"Sound on");
}

function reelAction(event,type,id){
 event.stopPropagation();

 if(type==="like")toggleReelLike(id);
 if(type==="comment")openReelComments(id);
 if(type==="share")shareReel(id);
 if(type==="save")saveReel(id);

 if(type==="mute"){
  const el=document.querySelector(`[data-reel="${id}"]`);
  const video=el?.querySelector("video");
  if(video){
   video.muted=!video.muted;
   toast(video.muted?"Sound off":"Sound on");
  }
 }
}

function editMyProfile(){
 openModal(`
  <div class="modal-head">
   <b>Edit Profile</b>
   <button class="icon-btn" onclick="closeModal()">✕</button>
  </div>

  <div class="modal-body">
   <input id="profileName" class="field"
    value="${esc(myProfile?.full_name||"")}"
    placeholder="Full name">

   <textarea id="profileBio" class="field"
    placeholder="Bio">${esc(myProfile?.bio||"")}</textarea>

   <input id="profileAvatar" class="field" type="file" accept="image/*">

   <button class="btn primary" style="width:100%" onclick="saveProfile()">
    Save Profile
   </button>
  </div>
 `);
}

async function saveProfile(){
 const name=$("profileName").value.trim();
 const bio=$("profileBio").value.trim();
 const file=$("profileAvatar").files[0];

 let avatar_url=myProfile?.avatar_url||"";

 if(file){
  const path=`${me.id}/${Date.now()}-${safeFileName(file.name)}`;

  const {error}=await sb.storage.from("avatars").upload(
   path,file,{
    upsert:true,
    contentType:file.type
   }
  );

  if(error){
   toast(error.message);
   return;
  }

  avatar_url=publicStorageURL("avatars",path);
 }

 const {error}=await sb.from("profiles").upsert({
  id:me.id,
  full_name:name,
  bio,
  avatar_url,
  last_seen:new Date().toISOString()
 });

 if(error){
  toast(error.message);
  return;
 }

 await loadMyProfile();
 closeModal();
 toast("Profile updated");
 openProfile(me.id);
}

async function updateLastSeen(){
 if(!me)return;

 await sb.from("profiles")
  .update({last_seen:new Date().toISOString()})
  .eq("id",me.id);
}

async function loadOnlineFriends(){
 const box=$("onlineFriends");
 if(!box)return;

 const {data}=await sb.from("profiles")
  .select("id,full_name,avatar_url,last_seen")
  .neq("id",me.id)
  .order("last_seen",{ascending:false})
  .limit(10);

 box.innerHTML=(data||[]).map(p=>`
  <div class="online" onclick="openProfile('${p.id}')">
   <img class="avatar" style="width:34px;height:34px"
    src="${avatarURL(p.avatar_url,p.full_name)}">
   <span style="flex:1">${esc(p.full_name)}</span>
   <i class="dot"></i>
  </div>
 `).join("")||`<div class="empty">No friends online</div>`;
}

async function reportItem(type,id){
 const reason=prompt("Report reason:");

 if(!reason)return;

 const {error}=await sb.from("fb_reports").insert({
  reporter_id:me.id,
  target_type:type,
  target_id:id,
  reason,
  status:"pending"
 });

 toast(error?"Report failed":"Report submitted");
}
