<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1877f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>My Social App</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --primary:#1877f2;
  --primary2:#0866ff;
  --bg:#f0f2f5;
  --card:#fff;
  --text:#17202a;
  --muted:#65676b;
  --border:#dddfe2;
  --hover:#f2f3f5;
  --danger:#e41e3f;
  --success:#18a558;
  --shadow:0 3px 14px rgba(0,0,0,.08);
  --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:var(--bg);
  color:var(--text);
}
body.dark{
  --bg:#101214;
  --card:#181a1d;
  --text:#f1f3f5;
  --muted:#aeb4bb;
  --border:#30343a;
  --hover:#25282d;
  --shadow:0 3px 15px rgba(0,0,0,.35);
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
button:disabled{opacity:.5;cursor:not-allowed}

.topbar{
  position:sticky;
  top:0;
  z-index:1000;
  height:62px;
  background:var(--card);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 14px;
}
.logo{
  color:var(--primary);
  font-size:25px;
  font-weight:900;
  white-space:nowrap;
}
.searchbox{
  display:flex;
  align-items:center;
  gap:7px;
  background:var(--hover);
  border-radius:24px;
  padding:7px 13px;
  width:260px;
}
.searchbox input{
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  width:100%;
}
.top-actions{
  margin-left:auto;
  display:flex;
  gap:7px;
}
.iconbtn{
  border:0;
  background:var(--hover);
  color:var(--text);
  width:42px;
  height:42px;
  border-radius:50%;
  font-size:19px;
}
.iconbtn:hover{background:var(--border)}
.badge{
  position:absolute;
  top:-3px;
  right:-3px;
  background:var(--danger);
  color:white;
  font-size:10px;
  min-width:17px;
  height:17px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.iconwrap{position:relative}

.app{
  max-width:1450px;
  margin:auto;
  display:grid;
  grid-template-columns:230px minmax(0,680px) 280px;
  gap:18px;
  padding:18px;
}

.sidebar,.rightbar{
  position:sticky;
  top:80px;
  height:max-content;
}
.side-card,.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.side-card{padding:10px}
.navitem{
  width:100%;
  border:0;
  background:transparent;
  color:var(--text);
  text-align:left;
  padding:12px;
  border-radius:11px;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:10px;
}
.navitem:hover,.navitem.active{background:var(--hover)}
.navicon{width:24px;text-align:center}

.section-title{
  font-size:20px;
  font-weight:800;
  margin:4px 0 14px;
}
.card{padding:15px;margin-bottom:15px}

.auth{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:linear-gradient(135deg,#eaf3ff,#f7f9fc);
}
.dark .auth{background:#0d1117}
.auth-box{
  width:100%;
  max-width:430px;
  background:var(--card);
  padding:28px;
  border-radius:22px;
  box-shadow:0 12px 45px rgba(0,0,0,.14);
}
.auth-logo{
  text-align:center;
  font-size:34px;
  font-weight:900;
  color:var(--primary);
  margin-bottom:5px;
}
.auth-sub{
  text-align:center;
  color:var(--muted);
  margin-bottom:25px;
}
.field{
  margin-bottom:12px;
}
.field label{
  display:block;
  margin-bottom:5px;
  font-size:13px;
  font-weight:700;
}
.input,.textarea,.select{
  width:100%;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  border-radius:11px;
  padding:11px 12px;
  outline:none;
}
.input:focus,.textarea:focus,.select:focus{
  border-color:var(--primary);
}
.textarea{min-height:90px;resize:vertical}
.primary{
  width:100%;
  border:0;
  background:var(--primary);
  color:white;
  padding:12px 15px;
  border-radius:10px;
  font-weight:800;
}
.secondary{
  border:1px solid var(--border);
  background:var(--hover);
  color:var(--text);
  padding:9px 13px;
  border-radius:9px;
  font-weight:700;
}
.danger{
  border:0;
  background:var(--danger);
  color:white;
  padding:9px 13px;
  border-radius:9px;
}
.success{
  border:0;
  background:var(--success);
  color:white;
  padding:9px 13px;
  border-radius:9px;
}
.auth-switch{
  text-align:center;
  margin-top:15px;
  color:var(--primary);
  font-weight:700;
  cursor:pointer;
}
.errorbox{
  background:#ffe7eb;
  color:#a90020;
  padding:10px;
  border-radius:9px;
  margin-bottom:12px;
  font-size:14px;
}
.dark .errorbox{background:#39131c;color:#ff9bad}

.stories{
  display:flex;
  gap:10px;
  overflow:auto;
  padding-bottom:4px;
}
.story{
  min-width:105px;
  height:155px;
  border-radius:15px;
  overflow:hidden;
  position:relative;
  background:linear-gradient(145deg,#1877f2,#8c52ff);
  color:white;
  border:0;
  flex-shrink:0;
}
.story img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.story::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(transparent 45%,rgba(0,0,0,.75));
}
.story-name{
  position:absolute;
  z-index:2;
  bottom:9px;
  left:8px;
  right:5px;
  font-size:12px;
  font-weight:800;
}
.story-avatar{
  position:absolute;
  z-index:3;
  top:8px;
  left:8px;
  width:34px;
  height:34px;
  border:3px solid var(--primary);
  border-radius:50%;
  object-fit:cover;
  background:#fff;
}

.composer-row{
  display:flex;
  gap:10px;
  align-items:center;
}
.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
  background:var(--hover);
}
.fake-input{
  flex:1;
  background:var(--hover);
  border-radius:24px;
  padding:12px 15px;
  color:var(--muted);
  cursor:pointer;
}
.composer-tools{
  display:flex;
  border-top:1px solid var(--border);
  margin-top:13px;
  padding-top:8px;
  gap:5px;
}
.tool{
  flex:1;
  border:0;
  background:transparent;
  color:var(--muted);
  padding:9px;
  border-radius:9px;
  font-weight:700;
}
.tool:hover{background:var(--hover)}

.post-head{
  display:flex;
  gap:10px;
  align-items:center;
}
.post-user{
  flex:1;
}
.post-user strong{display:block}
.post-time{font-size:12px;color:var(--muted)}
.post-menu{
  border:0;
  background:transparent;
  color:var(--muted);
  font-size:22px;
}
.post-text{
  white-space:pre-wrap;
  margin:13px 0;
  line-height:1.5;
}
.post-img{
  width:100%;
  max-height:650px;
  object-fit:cover;
  border-radius:12px;
  display:block;
}
.post-stats{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:13px;
  padding:9px 2px;
}
.post-actions{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
}
.post-action{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:10px 3px;
  font-weight:700;
}
.post-action:hover{background:var(--hover)}
.post-action.active{color:var(--primary)}
.comment-box{
  display:flex;
  gap:7px;
  margin-top:10px;
}
.comment-box input{
  flex:1;
  border:0;
  outline:0;
  background:var(--hover);
  border-radius:20px;
  padding:9px 13px;
  color:var(--text);
}
.comments{margin-top:9px}
.comment{
  background:var(--hover);
  border-radius:11px;
  padding:8px 10px;
  margin-top:6px;
}
.comment-name{font-size:12px;font-weight:800}
.comment-text{font-size:14px;margin-top:3px}

.profile-cover{
  height:230px;
  border-radius:16px 16px 0 0;
  background:linear-gradient(135deg,#1877f2,#7c3aed);
  overflow:hidden;
}
.profile-cover img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.profile-info{
  position:relative;
  padding:0 20px 20px;
}
.profile-main-avatar{
  width:120px;
  height:120px;
  border-radius:50%;
  border:5px solid var(--card);
  object-fit:cover;
  margin-top:-60px;
  background:var(--hover);
}
.profile-name{
  font-size:27px;
  font-weight:900;
  margin-top:6px;
}
.profile-username{color:var(--muted)}
.profile-bio{
  margin-top:10px;
  color:var(--muted);
}
.profile-stats{
  display:flex;
  gap:22px;
  margin-top:15px;
}
.stat strong{display:block}
.stat span{color:var(--muted);font-size:13px}

.reels{
  display:flex;
  flex-direction:column;
  gap:15px;
}
.reel{
  height:min(78vh,760px);
  min-height:550px;
  border-radius:18px;
  overflow:hidden;
  position:relative;
  background:#000;
  color:white;
}
.reel video{
  width:100%;
  height:100%;
  object-fit:cover;
}
.reel-gradient{
  position:absolute;
  inset:0;
  background:linear-gradient(transparent 45%,rgba(0,0,0,.8));
  pointer-events:none;
}
.reel-info{
  position:absolute;
  bottom:18px;
  left:15px;
  right:75px;
}
.reel-actions{
  position:absolute;
  right:10px;
  bottom:25px;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.reel-action{
  width:48px;
  height:48px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.55);
  color:#fff;
  font-size:19px;
}
.reel-action.active{background:var(--primary)}

.search-results,.user-list{
  display:flex;
  flex-direction:column;
  gap:9px;
}
.user-row{
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px;
  border-radius:11px;
}
.user-row:hover{background:var(--hover)}
.user-row-info{flex:1}
.user-row-name{font-weight:800}
.user-row-sub{font-size:12px;color:var(--muted)}

.notification{
  padding:11px;
  border-radius:11px;
  display:flex;
  gap:10px;
}
.notification:hover{background:var(--hover)}
.notification.unread{background:#eaf3ff}
.dark .notification.unread{background:#15243a}

.chat-layout{
  display:grid;
  grid-template-columns:220px 1fr;
  min-height:600px;
  overflow:hidden;
}
.chat-list{
  border-right:1px solid var(--border);
  padding:10px;
}
.chat-window{
  display:flex;
  flex-direction:column;
}
.chat-head{
  padding:13px;
  border-bottom:1px solid var(--border);
  font-weight:800;
}
.messages{
  flex:1;
  overflow:auto;
  padding:15px;
}
.message{
  max-width:75%;
  padding:9px 12px;
  border-radius:16px;
  margin:5px 0;
  background:var(--hover);
}
.message.mine{
  margin-left:auto;
  background:var(--primary);
  color:#fff;
}
.chat-compose{
  display:flex;
  gap:7px;
  padding:10px;
  border-top:1px solid var(--border);
}
.chat-compose input{
  flex:1;
  border:0;
  background:var(--hover);
  border-radius:20px;
  padding:10px 13px;
  color:var(--text);
  outline:0;
}

.settings-item{
  padding:14px 5px;
  border-bottom:1px solid var(--border);
}
.settings-item:last-child{border-bottom:0}
.settings-item strong{display:block}
.settings-item small{color:var(--muted)}
.switch{
  float:right;
  width:45px;
  height:25px;
}
.switch input{display:none}
.slider{
  display:block;
  width:45px;
  height:25px;
  border-radius:20px;
  background:#999;
  position:relative;
  cursor:pointer;
}
.slider:before{
  content:"";
  position:absolute;
  width:19px;
  height:19px;
  background:#fff;
  border-radius:50%;
  top:3px;
  left:3px;
  transition:.2s;
}
.switch input:checked+.slider{background:var(--primary)}
.switch input:checked+.slider:before{left:23px}

.dashboard-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}
.metric{
  background:var(--hover);
  padding:15px;
  border-radius:13px;
}
.metric b{
  display:block;
  font-size:25px;
}
.metric span{color:var(--muted);font-size:12px}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  z-index:2000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
}
.modal-box{
  width:100%;
  max-width:600px;
  max-height:90vh;
  overflow:auto;
  background:var(--card);
  border-radius:18px;
  padding:18px;
}
.modal-head{
  display:flex;
  align-items:center;
  margin-bottom:14px;
}
.modal-head h3{margin:0;flex:1}
.close{
  border:0;
  background:var(--hover);
  color:var(--text);
  width:35px;
  height:35px;
  border-radius:50%;
}
.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#111;
  color:#fff;
  padding:11px 17px;
  border-radius:22px;
  z-index:5000;
  opacity:0;
  pointer-events:none;
  transition:.25s;
}
.toast.show{opacity:1}

.loading{
  text-align:center;
  padding:30px;
  color:var(--muted);
}
.empty{
  text-align:center;
  padding:30px 15px;
  color:var(--muted);
}
.cover-preview{
  width:100%;
  height:130px;
  object-fit:cover;
  border-radius:12px;
}
.file-label{
  display:inline-block;
  background:var(--hover);
  border:1px dashed var(--border);
  padding:10px;
  border-radius:10px;
  cursor:pointer;
}
.file-label input{display:none}

.right-card-title{
  font-weight:900;
  margin-bottom:10px;
}
.trend{
  padding:8px 0;
  border-bottom:1px solid var(--border);
}
.trend:last-child{border:0}
.trend small{color:var(--muted)}

@media(max-width:1100px){
  .app{grid-template-columns:70px minmax(0,680px)}
  .rightbar{display:none}
  .navitem span:not(.navicon){display:none}
  .navitem{justify-content:center}
  .side-card{padding:7px}
}
@media(max-width:760px){
  .topbar{height:56px;padding:7px}
  .logo{font-size:21px}
  .searchbox{width:auto;flex:1;max-width:190px}
  .top-actions .iconbtn:nth-child(3),
  .top-actions .iconbtn:nth-child(4){display:none}
  .app{
    display:block;
    padding:8px;
  }
  .sidebar{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    top:auto;
    z-index:1200;
    background:var(--card);
    border-top:1px solid var(--border);
    padding:5px;
  }
  .sidebar .side-card{
    display:flex;
    justify-content:space-around;
    box-shadow:none;
    border:0;
  }
  .navitem{
    width:auto;
    padding:9px;
    font-size:20px;
  }
  .main{padding-bottom:70px}
  .chat-layout{grid-template-columns:1fr}
  .chat-list{display:none}
  .dashboard-grid{grid-template-columns:repeat(2,1fr)}
  .profile-cover{height:180px}
  .profile-main-avatar{width:95px;height:95px;margin-top:-48px}
  .reel{height:75vh;min-height:500px}
}
</style>
</head>

<body>

<!-- AUTH -->
<section id="authScreen" class="auth">
  <div class="auth-box">
    <div class="auth-logo">My Social App</div>
    <div class="auth-sub">আপনার নিজের Social Network</div>

    <div id="authError" class="errorbox hidden"></div>

    <div id="loginForm">
      <div class="field">
        <label>Email</label>
        <input id="loginEmail" class="input" type="email" placeholder="আপনার Email">
      </div>

      <div class="field">
        <label>Password</label>
        <input id="loginPassword" class="input" type="password" placeholder="Password">
      </div>

      <button class="primary" onclick="login()">Login</button>

      <div class="auth-switch" onclick="showRegister()">
        নতুন account তৈরি করুন
      </div>
    </div>

    <div id="registerForm" class="hidden">
      <div class="field">
        <label>নাম</label>
        <input id="registerName" class="input" placeholder="আপনার নাম">
      </div>

      <div class="field">
        <label>Username</label>
        <input id="registerUsername" class="input" placeholder="username">
      </div>

      <div class="field">
        <label>Email</label>
        <input id="registerEmail" class="input" type="email">
      </div>

      <div class="field">
        <label>Password</label>
        <input id="registerPassword" class="input" type="password" minlength="6">
      </div>

      <button class="primary" onclick="register()">Create account</button>

      <div class="auth-switch" onclick="showLogin()">
        আগে থেকেই account আছে? Login
      </div>
    </div>
  </div>
</section>

<!-- APP -->
<div id="appScreen" class="hidden">

<header class="topbar">
  <div class="logo">My Social App</div>

  <div class="searchbox">
    🔎
    <input id="globalSearch" placeholder="Search..." onkeydown="searchKey(event)">
  </div>

  <div class="top-actions">

    <div class="iconwrap">
      <button class="iconbtn" onclick="openPage('notifications')">🔔</button>
      <span id="notificationBadge" class="badge hidden">0</span>
    </div>

    <div class="iconwrap">
      <button class="iconbtn" onclick="openPage('messages')">💬</button>
      <span id="messageBadge" class="badge hidden">0</span>
    </div>

    <button class="iconbtn" onclick="toggleTheme()">🌙</button>
    <button class="iconbtn" onclick="openPage('profile')">👤</button>
  </div>
</header>

<div class="app">

<aside class="sidebar">
  <div class="side-card">

    <button class="navitem active" data-page="home" onclick="openPage('home')">
      <span class="navicon">🏠</span><span>Home</span>
    </button>

    <button class="navitem" data-page="reels" onclick="openPage('reels')">
      <span class="navicon">🎬</span><span>Reels</span>
    </button>

    <button class="navitem" data-page="friends" onclick="openPage('friends')">
      <span class="navicon">👥</span><span>Friends</span>
    </button>

    <button class="navitem" data-page="messages" onclick="openPage('messages')">
      <span class="navicon">💬</span><span>Messages</span>
    </button>

    <button class="navitem" data-page="search" onclick="openPage('search')">
      <span class="navicon">🔎</span><span>Search</span>
    </button>

    <button class="navitem" data-page="profile" onclick="openPage('profile')">
      <span class="navicon">👤</span><span>Profile</span>
    </button>

    <button class="navitem" data-page="creator" onclick="openPage('creator')">
      <span class="navicon">💰</span><span>Creator</span>
    </button>

    <button class="navitem" data-page="settings" onclick="openPage('settings')">
      <span class="navicon">⚙️</span><span>Settings</span>
    </button>

    <button id="adminNav" class="navitem hidden" data-page="admin" onclick="openPage('admin')">
      <span class="navicon">🛡️</span><span>Admin</span>
    </button>

  </div>
</aside>

<main id="mainContent" class="main"></main>

<aside class="rightbar">
  <div class="card">
    <div class="right-card-title">🔥 Trending</div>
    <div class="trend"><b>#MySocialApp</b><br><small>Trending now</small></div>
    <div class="trend"><b>#Bangladesh</b><br><small>Popular</small></div>
    <div class="trend"><b>#Reels</b><br><small>Popular</small></div>
    <div class="trend"><b>#Creator</b><br><small>Popular</small></div>
  </div>

/* ============================================================
   API
   ============================================================ */

async function api(path,options={}){
  const {
    data:{session}
  } = await db.auth.getSession();

  const headers = {
    "Content-Type":"application/json",
    ...(options.headers || {})
  };

  if(session?.access_token){
    headers.Authorization = "Bearer " + session.access_token;
  }

  const response = await fetch(
    FUNCTION_URL + path,
    {
      ...options,
      headers
    }
  );

  const textData = await response.text();

  let data;
  try{
    data = textData ? JSON.parse(textData) : {};
  }catch(e){
    data = {raw:textData};
  }

  if(!response.ok){
    throw new Error(
      data?.error ||
      data?.message ||
      "API request failed"
    );
  }

  return data;
}

      <div class="story-name">Add Story</div>

        ? `<video src="${esc(story.media_url)}" controls autoplay style="max-width:100%;max-height:100vh"></video>`
        : `<img src="${esc(story.media_url)}" style="max-width:100%;max-height:100vh">`
      }

function observeReels(){
  const videos = document.querySelectorAll(".reel video");

  if(!("IntersectionObserver" in window)){
    videos.forEach(v=>v.play().catch(()=>{}));
    return;
  }

  const observer = new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      const v = entry.target;

      if(entry.isIntersecting){
        v.play().catch(()=>{});
      }else{
        v.pause();
      }
    });
  },{threshold:.65});

  videos.forEach(v=>observer.observe(v));
}

function toggleReelSound(id){
  const video = $("video-"+id);
  if(!video) return;

  video.muted = !video.muted;

  const article = $("reel-"+id);
  const btn = article?.querySelector(".reel-actions button:last-child");

  if(btn) btn.textContent = video.muted ? "🔇" : "🔊";
}

async function loadMyPosts(){

    .from("posts")
    .select("*")

    .order("created_at",{ascending:false})
    .limit(30);

  if(error){
    box.innerHTML =
      `<div class="errorbox">${esc(error.message)}</div>`;
    return;
  }

  box.innerHTML = data?.length

function openEditProfile(){
  $("editName").value =
    currentProfile?.name || "";

  $("editUsername").value =
    currentProfile?.username || "";

  $("editBio").value =
    currentProfile?.bio || "";

  openModal("profileModal");
}

async function saveProfile(){
  try{
    let profile_photo =
      currentProfile?.profile_photo || null;

    let cover_photo =
      currentProfile?.cover_photo || null;

    const profileFile =
      $("profilePhotoFile").files?.[0];

    const coverFile =
      $("coverPhotoFile").files?.[0];

    if(profileFile){
      profile_photo = await uploadFile(
        "profile-photos",
        profileFile,
        currentUser.id+"/profile_"+Date.now()+"_"+profileFile.name
      );
    }

    if(coverFile){
      cover_photo = await uploadFile(
        "profile-photos",
        coverFile,
        currentUser.id+"/cover_"+Date.now()+"_"+coverFile.name
      );
    }

    const updates = {
      name:$("editName").value.trim(),
      username:$("editUsername").value.trim().toLowerCase(),
      bio:$("editBio").value.trim(),
      profile_photo,
      cover_photo
    };

    const {error} = await db
      .from("profiles")
      .update(updates)
      .eq("id",currentUser.id);

    if(error) throw error;

    await loadMyProfile();

    closeModal("profileModal");

    toast("Profile updated!");

    await renderProfile();

  }catch(error){
    toast(error.message);
  }
}

async function loadNotifications(){
  const box = $("notificationsBox");

  const {data,error} = await db
    .from("notifications")
    .select("*")
    .eq("receiver_id",currentUser.id)
    .order("created_at",{ascending:false})
    .limit(100);

  if(error){
    box.innerHTML =
      `<div class="errorbox">${esc(error.message)}</div>`;
    return;
  }

  box.innerHTML = data?.length
    ? data.map(n=>`
      <div class="notification ${!n.read?"unread":""}">
        <div style="font-size:22px">🔔</div>
        <div>
          <div>${esc(n.text || "")}</div>

    : `<div class="empty">কোনো notification নেই।</div>`;

    .eq("receiver_id",currentUser.id);

async function loadNotificationBadge(){
  if(!currentUser) return;

  const {count} = await db
    .from("notifications")
    .select("id",{count:"exact",head:true})
    .eq("receiver_id",currentUser.id)
    .eq("read",false);

  const badge = $("notificationBadge");

  if(count){
    badge.textContent = count > 99 ? "99+" : count;
    badge.classList.remove("hidden");
  }else{
    badge.classList.add("hidden");
  }
}

async function saveSetting(column,value){
  try{
    await db.from("user_settings").upsert({
      user_id:currentUser.id,
      [column]:value,
      updated_at:new Date().toISOString()
    },{
      onConflict:"user_id"
    });

    if(column==="online_status"){
      await db.from("profiles")
        .update({online_status:value})
        .eq("id",currentUser.id);
    }

    toast("Setting saved");
  }catch(error){
    toast(error.message);
  }
}

function setDarkMode(value){
  document.body.classList.toggle("dark",value);

  localStorage.setItem(
    "my_social_dark",
    value ? "1":"0"

}

async function uploadFile(bucket,file,path){
  const {error} = await db.storage
    .from(bucket)
    .upload(path,file,{
      upsert:true,
      contentType:file.type
    });

  if(error) throw error;

  const {data} = db.storage
    .from(bucket)
    .getPublicUrl(path);

  return data.publicUrl;
}

   ============================================================ */

async function downloadData(){
  try{
    const [
      profile,
      posts,
      reels
    ] = await Promise.all([
      db.from("profiles")
        .select("*")
        .eq("id",currentUser.id)
        .maybeSingle(),

      db.from("posts")
        .select("*")
        .eq("user_id",currentUser.id),

      db.from("reels")
        .select("*")
        .eq("user_id",currentUser.id)
    ]);

    const data = {
      exported_at:new Date().toISOString(),
      profile:profile.data,
      posts:posts.data,
      reels:reels.data
    };

    const blob = new Blob(
      [JSON.stringify(data,null,2)],
      {type:"application/json"}
    );

    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href=url;
    a.download="my-social-app-data.json";
    a.click();

    URL.revokeObjectURL(url);

    toast("Data downloaded");
  }catch(error){
    toast(error.message);
  }
}

function setupRealtime(){
  if(!currentUser) return;

  if(realtimeChannel){
    db.removeChannel(realtimeChannel);
  }

  realtimeChannel = db
    .channel("my-social-app-realtime-"+currentUser.id)

    .on(
      "postgres_changes",
      {
        event:"INSERT",
        schema:"public",
        table:"notifications",
        filter:"receiver_id=eq."+currentUser.id
      },
      payload=>{
        loadNotificationBadge();

        if(currentPage==="notifications"){
          loadNotifications();
        }else{
          toast("🔔 নতুন notification");
        }
      }
    )

    .on(
      "postgres_changes",
      {
        event:"INSERT",
        schema:"public",
        table:"messages",
        filter:"receiver_id=eq."+currentUser.id
      },
      payload=>{
        if(currentPage==="messages"){
          loadMessages();
        }else{
          toast("💬 নতুন message");
        }
      }
    )

    .subscribe();
}
