function escapeHTML(value){
  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function formatDate(date){
  return new Date(date).toLocaleString("bn-BD",{
    dateStyle:"medium",
    timeStyle:"short"
  });
}

function avatar(url){

    return;
  }

  if(password.length<6){
    $("regMsg").textContent="Password কমপক্ষে ৬ অক্ষরের হতে হবে";
    return;
  }

  $("regMsg").textContent="Account তৈরি হচ্ছে...";

  const {data,error}=await db.auth.signUp({
    email,
    password
  });

  if(error){
    $("regMsg").textContent=error.message;
    return;
  }

  if(data.user){
    await db.from("profiles").upsert({
      id:data.user.id,
      name,
      bio:"",
      role:"user",
      last_seen:new Date().toISOString()
    });
  }

  $("regMsg").textContent=
    "Account তৈরি হয়েছে। Email verification চাইলে Email দেখুন।";

}

  content.innerHTML=`

      <img class="avatar" src="${avatar(profile?.profile_photo)}">
      <div>

    <button class="primary" onclick="createPost()">
      Post
    </button>
  </div>

  <div class="card">
    <div class="row space">
      <b>Stories</b>
      <button class="secondary" onclick="section('stories')">See all</button>
    </div>

async function createPost(){
  const text=$("postText").value.trim();
  const file=$("postImage").files[0];

  if(!text&&!file){
    alert("Post-এ কিছু লিখুন অথবা ছবি দিন");
    return;
  }

  let image_url="";

  if(file){
    const path=`posts/${me.id}/${Date.now()}_${file.name}`;

    const {error}=await db.storage
      .from("media")
      .upload(path,file);

    if(error){
      alert("ছবি upload হয়নি: "+error.message);
      return;
    }

    const {data}=db.storage
      .from("media")
      .getPublicUrl(path);

    image_url=data.publicUrl;
  }

  const {error}=await db.from("posts").insert({
    user_id:me.id,
    text,
    image_url
  });

  if(error){
    alert(error.message);
    return;
  }

  $("postText").value="";
  $("postImage").value="";

  await loadFeed();
}

async function loadFeed(){
  const feed=$("feed");
  if(!feed)return;

  const {data:posts,error}=await db
    .from("posts")
    .select("*")
    .order("created_at",{ascending:false})
    .limit(100);

  if(error){
    feed.innerHTML=`<div class="card">${escapeHTML(error.message)}</div>`;
    return;
  }

  if(!posts?.length){
    feed.innerHTML=`<div class="card">এখনও কোনো post নেই।</div>`;
    return;
  }

  const userIds=[...new Set(posts.map(p=>p.user_id))];

  const {data:profiles}=await db
    .from("profiles")
    .select("*")
    .in("id",userIds);

  const profileMap={};
  (profiles||[]).forEach(p=>profileMap[p.id]=p);

  const postIds=posts.map(p=>p.id);

  const {data:reactions}=await db
    .from("post_reactions")
    .select("post_id,user_id,reaction")
    .in("post_id",postIds);

  const {data:comments}=await db
    .from("comments")
    .select("post_id")
    .in("post_id",postIds);

  const {data:follows}=await db
    .from("follows")
    .select("following_id")
    .eq("follower_id",me.id);

  const followingSet=new Set(
    (follows||[]).map(x=>x.following_id)
  );

  const reactionCount={};
  const myReaction={};

  (reactions||[]).forEach(r=>{
    reactionCount[r.post_id]=(reactionCount[r.post_id]||0)+1;

    if(r.user_id===me.id){
      myReaction[r.post_id]=r.reaction;
    }
  });

  const commentCount={};

  (comments||[]).forEach(c=>{
    commentCount[c.post_id]=(commentCount[c.post_id]||0)+1;
  });

  /*
    Initial feed ranking.

    Score =
    recency + reactions + comments + following bonus + own post bonus

    এটি Facebook-এর আসল algorithm নয়।
    এটি আমাদের app-এর প্রথম ranking system।
  */

  const now=Date.now();

  const ranked=posts.map(post=>{
    const ageHours=Math.max(
      0.1,
      (now-new Date(post.created_at).getTime())/3600000
    );

    const recencyScore=50/(1+ageHours);

    const reactionScore=(reactionCount[post.id]||0)*4;
    const commentScore=(commentCount[post.id]||0)*5;

    const followingBonus=
      followingSet.has(post.user_id)?25:0;

    const ownBonus=
      post.user_id===me.id?10:0;

    const score=
      recencyScore+
      reactionScore+
      commentScore+
      followingBonus+
      ownBonus;

    return {
      ...post,
      score,
      reactionTotal:reactionCount[post.id]||0,
      commentTotal:commentCount[post.id]||0,
      myReaction:myReaction[post.id]||null,
      author:profileMap[post.user_id]
    };
  }).sort((a,b)=>b.score-a.score);

  feed.innerHTML=ranked.map(renderPost).join("");

  await loadCommentsForPosts(postIds);
}

function renderPost(post){

    name:"User",
    profile_photo:""
  };

  const verified=author.verified
    ? `<span class="badge">✓</span>`

      <div class="row">
        <img class="avatar"
          src="${avatar(author.profile_photo)}"
          onclick="section('profile','${post.user_id}')">

        <div>
          <b onclick="section('profile','${post.user_id}')"
             style="cursor:pointer">
             ${escapeHTML(author.name||"User")} ${verified}
          </b>
          <div class="muted">${formatDate(post.created_at)}</div>
        </div>
      </div>

      ${
        post.user_id===me.id || profile.role==="admin"
        ? `<button class="danger"
             onclick="deletePost(${post.id})">Delete</button>`
        : ""
      }
    </div>

    ${
      post.text
      ? `<div style="margin-top:10px;white-space:pre-wrap">
          ${escapeHTML(post.text)}
         </div>`
      : ""
    }

    ${
      post.image_url
      ? `<img class="postimg"
           src="${escapeHTML(post.image_url)}">`
      : ""
    }

    <div class="score">
      Feed score: ${post.score.toFixed(1)}
    </div>

    <div class="actions">
      <button class="secondary"
        onclick="reactPost(${post.id},'like')">
        👍 Like ${post.myReaction==="like"?"✓":""}
      </button>

      <button class="secondary"
        onclick="reactPost(${post.id},'love')">
        ❤️ Love ${post.myReaction==="love"?"✓":""}
      </button>

      <button class="secondary"
        onclick="sharePost(${post.id})">
        ↗ Share
      </button>

      ${
        post.user_id!==me.id
        ? `<button class="secondary"
             onclick="reportPost(${post.id})">
             Report
           </button>`
        : ""
      }
    </div>

    <div class="muted" style="margin-top:8px">
      ❤️ ${post.reactionTotal}
      &nbsp; 💬 ${post.commentTotal}
    </div>

    <div id="comments-${post.id}"></div>

    <div class="row" style="margin-top:8px">
      <input id="comment-${post.id}"
        placeholder="Comment লিখুন..."
        style="margin:0">

      <button class="primary"
        onclick="addComment(${post.id})">
        Send
      </button>
    </div>
  </article>`;
}

async function reactPost(postId,reaction){
  const {data:old}=await db
    .from("post_reactions")
    .select("*")
    .eq("post_id",postId)
    .eq("user_id",me.id)
    .maybeSingle();

  if(old){
    if(old.reaction===reaction){
      await db.from("post_reactions")
        .delete()
        .eq("id",old.id);
    }else{
      await db.from("post_reactions")
        .update({reaction})
        .eq("id",old.id);
    }
  }else{
    await db.from("post_reactions").insert({
      post_id:postId,
      user_id:me.id,
      reaction
    });
  }

  await loadFeed();
}

async function addComment(postId){
  const input=$("comment-"+postId);
  const text=input.value.trim();

  if(!text)return;

  const {error}=await db.from("comments").insert({
    post_id:postId,
    user_id:me.id,
    text
  });

  if(error){
    alert(error.message);
    return;
  }

  input.value="";
  await loadFeed();
}

async function loadCommentsForPosts(postIds){
  if(!postIds.length)return;

  const {data:comments}=await db
    .from("comments")
    .select("*")
    .in("post_id",postIds)
    .order("created_at",{ascending:true});

  const ids=[...new Set((comments||[]).map(c=>c.user_id))];

  let users=[];

  if(ids.length){
    const res=await db.from("profiles")
      .select("id,name,profile_photo")
      .in("id",ids);

    users=res.data||[];
  }

  const map={};
  users.forEach(u=>map[u.id]=u);

  (comments||[]).forEach(c=>{
    const box=$("comments-"+c.post_id);
    if(!box)return;

    const u=map[c.user_id]||{name:"User"};

    box.innerHTML+=`
      <div class="comment">
        <b>${escapeHTML(u.name)}</b>
        <div>${escapeHTML(c.text)}</div>
      </div>`;
  });
}

async function deletePost(id){
  if(!confirm("এই post delete করবেন?"))return;

  const {error}=await db
    .from("posts")
    .delete()
    .eq("id",id);

  if(error){
    alert(error.message);
    return;
  }

  await loadFeed();
}

async function sharePost(id){
  const url=location.href;

  if(navigator.share){
    await navigator.share({
      title:"My Social App",
      text:"এই post দেখুন",
      url
    });
  }else{
    await navigator.clipboard.writeText(url);
    alert("Link copy হয়েছে");
  }
}

async function reportPost(postId){
  const reason=prompt("Report করার কারণ লিখুন");

  if(!reason)return;

  const {error}=await db.from("reports").insert({
    reporter_id:me.id,
    post_id:postId,
    reason
  });

  if(error)alert(error.message);
  else alert("Report পাঠানো হয়েছে");
}

/* =========================
   FOLLOW SYSTEM
========================= */

async function isFollowing(userId){
  const {data}=await db
    .from("follows")
    .select("id")
    .eq("follower_id",me.id)
    .eq("following_id",userId)
    .maybeSingle();

  return !!data;
}

async function toggleFollow(userId){
  if(userId===me.id)return;

  const following=await isFollowing(userId);

  if(following){
    await db.from("follows")
      .delete()
      .eq("follower_id",me.id)
      .eq("following_id",userId);
  }else{
    const {error}=await db.from("follows").insert({
      follower_id:me.id,
      following_id:userId
    });

    if(error){
      alert(error.message);
      return;
    }

    const {data:p}=await db
      .from("profiles")
      .select("name")
      .eq("id",me.id)
      .maybeSingle();

    await db.from("notifications").insert({
      receiver_id:userId,
      text:`${p?.name||"Someone"} আপনাকে follow করেছে`
    });
  }

  await updateFollowCounts(userId);
  await renderSearchResults();
}

async function updateFollowCounts(userId){
  const {count:followers}=await db
    .from("follows")
    .select("*",{count:"exact",head:true})
    .eq("following_id",userId);

  const {count:following}=await db
    .from("follows")
    .select("*",{count:"exact",head:true})
    .eq("follower_id",userId);

  await db.from("profiles")
    .update({
      followers_count:followers||0,
      following_count:following||0
    })
    .eq("id",userId);
}

function userSearchCard(user){

async function renderSearchResults(){

function editProfile(){
  $("modalRoot").innerHTML=`
  <div class="modal">
    <div class="modalbox">
      <button class="close"
        onclick="closeModal()">×</button>

      <h3>Edit Profile</h3>

      <input id="editName"
        value="${escapeHTML(profile.name||"")}"
        placeholder="Name">

      <textarea id="editBio"
        placeholder="Bio">${escapeHTML(profile.bio||"")}</textarea>

      <label>Profile Photo</label>
      <input id="editProfilePhoto" type="file" accept="image/*">

      <label>Cover Photo</label>
      <input id="editCoverPhoto" type="file" accept="image/*">

      <button class="primary"
        onclick="saveProfile()">
        Save
      </button>
    </div>
  </div>`;
}

function closeModal(){
  $("modalRoot").innerHTML="";
}

async function saveProfile(){
  const name=$("editName").value.trim();
  const bio=$("editBio").value.trim();

  let profile_photo=profile.profile_photo||"";
  let cover_photo=profile.cover_photo||"";

  const profileFile=$("editProfilePhoto").files[0];
  const coverFile=$("editCoverPhoto").files[0];

  if(profileFile){
    const path=`profiles/${me.id}/profile_${Date.now()}_${profileFile.name}`;

    const {error}=await db.storage
      .from("media")
      .upload(path,profileFile);

    if(error){
      alert(error.message);
      return;
    }

    profile_photo=db.storage
      .from("media")
      .getPublicUrl(path).data.publicUrl;
  }

  if(coverFile){
    const path=`profiles/${me.id}/cover_${Date.now()}_${coverFile.name}`;

    const {error}=await db.storage
      .from("media")
      .upload(path,coverFile);

    if(error){
      alert(error.message);
      return;
    }

    cover_photo=db.storage
      .from("media")
      .getPublicUrl(path).data.publicUrl;
  }

  const {data,error}=await db
    .from("profiles")
    .update({
      name,
      bio,
      profile_photo,
      cover_photo
    })
    .eq("id",me.id)
    .select()
    .single();

  if(error){
    alert(error.message);
    return;
  }

  profile=data;

  closeModal();

  await renderApp();
  await section("profile");
}

async function createStory(){
  const file=$("storyFile").files[0];
  const caption=$("storyCaption").value.trim();

  if(!file){
    alert("ছবি অথবা ভিডিও নির্বাচন করুন");
    return;
  }

  const isVideo=file.type.startsWith("video/");
  const media_type=isVideo?"video":"image";

  const path=
    `stories/${me.id}/${Date.now()}_${file.name}`;

  const {error}=await db.storage
    .from("media")
    .upload(path,file);

  if(error){
    alert(error.message);
    return;
  }

  const media_url=db.storage
    .from("media")
    .getPublicUrl(path).data.publicUrl;

  const expires=new Date(
    Date.now()+24*60*60*1000
  ).toISOString();

  const {error:insertError}=await db
    .from("stories")
    .insert({
      user_id:me.id,
      media_url,
      media_type,
      caption,
      expires_at:expires
    });

  if(insertError){
    alert(insertError.message);
    return;
  }

  alert("Story যোগ হয়েছে");

  await renderStories();
}

async function viewStory(id){
  const story=allStories.find(s=>s.id===id);

  if(!story)return;

  await db.from("story_views").upsert({
    story_id:id,
    viewer_id:me.id
  },{
    onConflict:"story_id,viewer_id"
  });

  const {data:user}=await db
    .from("profiles")
    .select("name,profile_photo")
    .eq("id",story.user_id)
    .maybeSingle();

  $("modalRoot").innerHTML=`
  <div class="modal">
    <div class="modalbox">
      <button class="close"
        onclick="closeModal()">×</button>

      <div class="row">
        <img class="avatar"
          src="${avatar(user?.profile_photo)}">

        <b>${escapeHTML(user?.name||"User")}</b>
      </div>

      ${
        story.media_type==="video"
        ? `<video class="story-view"
             src="${escapeHTML(story.media_url)}"
             controls autoplay></video>`
        : `<img class="story-view"
             src="${escapeHTML(story.media_url)}">`
      }

      ${
        story.caption
        ? `<p>${escapeHTML(story.caption)}</p>`
        : ""
      }

      <div class="muted">
        ${formatDate(story.created_at)}
      </div>

      ${
        story.user_id===me.id
        ? `<button class="danger"
             onclick="deleteStory(${story.id})">
             Delete Story
           </button>`
        : ""
      }
    </div>
  </div>`;
}

async function deleteStory(id){
  if(!confirm("Story delete করবেন?"))return;

  const {error}=await db
    .from("stories")
    .delete()
    .eq("id",id);

  if(error){
    alert(error.message);
    return;
  }

  closeModal();
  await renderStories();
}

      পরে backend/admin system দিয়ে তৈরি করতে হবে।
    </p>
  </div>`;
}

/* =========================
   ADMIN
========================= */

async function renderAdmin(){
  if(profile.role!=="admin"){
    $("content").innerHTML=
      `<div class="card">Access denied</div>`;
    return;
  }

  const {data:users}=await db
    .from("profiles")
    .select("*")
    .order("created_at",{ascending:false});

  const {data:reports}=await db
    .from("reports")
    .select("*")
    .order("created_at",{ascending:false});

  $("content").innerHTML=`
  <div class="card">
    <h2>Admin Panel</h2>

    <p>
      Total users:
      <b>${users?.length||0}</b>
    </p>
  </div>

  <div class="card">
    <h3>Users</h3>

    ${
      users?.map(u=>`
      <div class="user">
        <img class="avatar"
          src="${avatar(u.profile_photo)}">

        <div style="flex:1">
          <b>
            ${escapeHTML(u.name)}
            ${u.verified?`<span class="badge">✓</span>`:""}
          </b>

          <div class="muted">
            ${escapeHTML(u.id)}
          </div>

          <div class="muted">
            Role: ${escapeHTML(u.role||"user")}
          </div>
        </div>

        <button class="secondary"
          onclick="toggleVerification('${u.id}',${!!u.verified})">
          ${u.verified?"Unverify":"Verify"}
        </button>
      </div>
      `).join("")||""
    }
  </div>

  <div class="card">
    <h3>Reports</h3>

    ${
      reports?.length
      ? reports.map(r=>`
        <div class="comment">
          <b>Post ID: ${r.post_id||"-"}</b>
          <div>${escapeHTML(r.reason)}</div>
          <div class="muted">
            Status: ${escapeHTML(r.status||"pending")}
          </div>
        </div>
      `).join("")
      : `<div class="muted">No reports</div>`
    }
  </div>`;
}

async function toggleVerification(userId,current){
  const {error}=await db
    .from("profiles")
    .update({verified:!current})
    .eq("id",userId);

  if(error){
    alert(error.message);
    return;
  }

  alert(current?"Verification removed":"User verified");
  await renderAdmin();
}
