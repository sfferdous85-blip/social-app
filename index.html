<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#1877f2">
<title>FriendBook</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
:root{
 --blue:#1877f2;
 --bg:#f0f2f5;
 --card:#fff;
 --text:#17202a;
 --muted:#65676b;
 --border:#dddfe2;
 --danger:#e41e3f;
}
body.dark{
 --bg:#18191a;
 --card:#242526;
 --text:#e4e6eb;
 --muted:#b0b3b8;
 --border:#3a3b3c;
}
body{
 margin:0;
 background:var(--bg);
 color:var(--text);
 font-family:Arial,Helvetica,sans-serif;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

header{
 position:sticky;
 top:0;
 z-index:100;
 background:var(--card);
 border-bottom:1px solid var(--border);
}
.topbar{
 height:58px;
 display:flex;
 align-items:center;
 gap:10px;
 padding:8px 12px;
}
.logo{
 color:var(--blue);
 font-size:25px;
 font-weight:800;
 white-space:nowrap;
}
.searchBox{
 flex:1;
 max-width:500px;
}
.searchBox input{
 width:100%;
 border:0;
 outline:0;
 background:var(--bg);
 border-radius:22px;
 padding:11px 15px;
 color:var(--text);
}
.topActions{
 margin-left:auto;
 display:flex;
 gap:7px;
}
.iconBtn{
 width:40px;
 height:40px;
 border:0;
 border-radius:50%;
 background:var(--bg);
 color:var(--text);
 font-size:19px;
}

.nav{
 display:flex;
 border-top:1px solid var(--border);
}
.nav button{
 flex:1;
 border:0;
 background:transparent;
 color:var(--muted);
 padding:11px 5px;
 font-weight:700;
}
.nav button.active{
 color:var(--blue);
 border-bottom:3px solid var(--blue);
}

.container{
 width:min(720px,100%);
 margin:auto;
 padding:12px 8px 90px;
}

.card{
 background:var(--card);
 border-radius:10px;
 margin-bottom:10px;
 padding:12px;
 box-shadow:0 1px 2px rgba(0,0,0,.12);
}
.row{
 display:flex;
 align-items:center;
 gap:10px;
}
.avatar{
 width:44px;
 height:44px;
 border-radius:50%;
 object-fit:cover;
 background:#ddd;
}
.avatar.big{
 width:85px;
 height:85px;
}
.name{
 font-weight:700;
}
.muted{
 color:var(--muted);
 font-size:13px;
}
.spacer{flex:1}

.primary{
 border:0;
 background:var(--blue);
 color:white;
 border-radius:7px;
 padding:10px 15px;
 font-weight:700;
}
.secondary{
 border:0;
 background:var(--bg);
 color:var(--text);
 border-radius:7px;
 padding:10px 15px;
 font-weight:700;
}
.danger{
 background:var(--danger);
 color:#fff;
}

textarea,input,select{
 width:100%;
 border:1px solid var(--border);
 border-radius:8px;
 padding:11px;
 outline:none;
 background:var(--card);
 color:var(--text);
}
textarea{
 resize:vertical;
 min-height:85px;
}

.composerTop{
 display:flex;
 gap:10px;
 align-items:center;
 margin-bottom:10px;
}
.composerBtns{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
 margin-top:8px;
}
.fileLabel{
 text-align:center;
 padding:10px;
 background:var(--bg);
 border-radius:7px;
 font-weight:700;
 cursor:pointer;
}
.fileLabel input{display:none}

.postImage{
 width:100%;
 max-height:600px;
 object-fit:cover;
 border-radius:8px;
 margin-top:10px;
}
.postText{
 white-space:pre-wrap;
 line-height:1.45;
 margin-top:10px;
}
.postActions{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:5px;
 margin-top:10px;
 border-top:1px solid var(--border);
 padding-top:7px;
}
.postActions button{
 border:0;
 background:transparent;
 color:var(--muted);
 padding:9px 3px;
 border-radius:7px;
 font-weight:700;
}
.postActions button:hover{
 background:var(--bg);
}
.liked{
 color:var(--blue)!important;
}

.comments{
 margin-top:10px;
 border-top:1px solid var(--border);
 padding-top:8px;
}
.comment{
 display:flex;
 gap:8px;
 margin:8px 0;
}
.commentBubble{
 background:var(--bg);
 border-radius:15px;
 padding:7px 10px;
 flex:1;
}
.commentInput{
 display:flex;
 gap:6px;
 margin-top:8px;
}
.commentInput input{
 border-radius:20px;
}

.profileCover{
 height:190px;
 border-radius:10px 10px 0 0;
 object-fit:cover;
 width:100%;
 background:#aaa;
}
.profileHead{
 padding:0 14px 14px;
 position:relative;
}
.profileAvatar{
 margin-top:-45px;
 border:5px solid var(--card);
}
.profileName{
 font-size:24px;
 font-weight:800;
 margin-top:5px;
}
.profileBio{
 color:var(--muted);
 margin:7px 0;
 white-space:pre-wrap;
}
.profileButtons{
 display:flex;
 gap:8px;
 margin-top:10px;
}

.reels{
 display:flex;
 flex-direction:column;
 gap:10px;
}
.reel{
 height:calc(100vh - 80px);
 min-height:520px;
 background:#000;
 border-radius:10px;
 overflow:hidden;
 position:relative;
}
.reel video{
 width:100%;
 height:100%;
 object-fit:cover;
}
.reelInfo{
 position:absolute;
 left:12px;
 right:65px;
 bottom:15px;
 color:white;
 text-shadow:0 1px 4px #000;
}
.reelActions{
 position:absolute;
 right:10px;
 bottom:70px;
 display:flex;
 flex-direction:column;
 gap:10px;
}
.reelActions button{
 width:48px;
 height:48px;
 border:0;
 border-radius:50%;
 background:rgba(0,0,0,.5);
 color:white;
 font-size:20px;
}
.soundBtn{
 position:absolute;
 top:12px;
 right:12px;
 z-index:2;
 width:44px;
 height:44px;
 border:0;
 border-radius:50%;
 background:rgba(0,0,0,.5);
 color:white;
}

.modal{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.6);
 z-index:500;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:12px;
}
.modalBox{
 width:min(600px,100%);
 max-height:90vh;
 overflow:auto;
 background:var(--card);
 border-radius:12px;
 padding:16px;
}
.modalHeader{
 display:flex;
 align-items:center;
 margin-bottom:12px;
}
.close{
 border:0;
 background:var(--bg);
 color:var(--text);
 width:36px;
 height:36px;
 border-radius:50%;
}

.auth{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
 background:var(--bg);
}
.authBox{
 width:min(420px,100%);
 background:var(--card);
 padding:25px;
 border-radius:15px;
 box-shadow:0 5px 25px rgba(0,0,0,.15);
}
.authLogo{
 text-align:center;
 color:var(--blue);
 font-size:34px;
 font-weight:900;
 margin-bottom:20px;
}
.authTabs{
 display:flex;
 margin-bottom:15px;
}
.authTabs button{
 flex:1;
 padding:11px;
 border:0;
 background:var(--bg);
 color:var(--muted);
 font-weight:700;
}
.authTabs button.active{
 background:var(--blue);
 color:white;
}
.formGroup{
 margin-bottom:10px;
}
.formGroup label{
 display:block;
 font-size:13px;
 font-weight:700;
 margin-bottom:5px;
}
.authMsg{
 margin-top:10px;
 padding:9px;
 border-radius:7px;
 background:var(--bg);
 font-size:14px;
}
.success{color:#15803d}
.error{color:#dc2626}

.settingsItem{
 padding:13px 0;
 border-bottom:1px solid var(--border);
}
.settingsItem:last-child{border-bottom:0}
.switch{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
}
.empty{
 text-align:center;
 color:var(--muted);
 padding:30px 10px;
}
.searchResult{
 display:flex;
 align-items:center;
 gap:10px;
 padding:10px 0;
 border-bottom:1px solid var(--border);
}
.toast{
 position:fixed;
 bottom:20px;
 left:50%;
 transform:translateX(-50%);
 background:#222;
 color:white;
 padding:11px 16px;
 border-radius:20px;
 z-index:1000;
 display:none;
}
.loader{
 text-align:center;
 padding:20px;
 color:var(--muted);
}
@media(max-width:600px){
 .logo{font-size:21px}
 .searchBox{max-width:none}
 .container{padding-left:5px;padding-right:5px}
 .reel{border-radius:0}
}
</style>
</head>

<body>

<!-- AUTH -->
<section id="authPage" class="auth">
 <div class="authBox">
   <div class="authLogo">FriendBook</div>

   <div class="authTabs">
     <button id="loginTab" class="active" onclick="showLogin()">Log In</button>
     <button id="signupTab" onclick="showSignup()">Create Account</button>
   </div>

   <div id="loginForm">
     <div class="formGroup">
       <label>Email</label>
       <input id="loginEmail" type="email" placeholder="Email">
     </div>

     <div class="formGroup">
       <label>Password</label>
       <input id="loginPassword" type="password" placeholder="Password">
     </div>

     <button class="primary" style="width:100%" onclick="login()">Log In</button>
   </div>

   <div id="signupForm" class="hidden">
     <div class="formGroup">
       <label>Name</label>
       <input id="signupName" placeholder="Your name">
     </div>

     <div class="formGroup">
       <label>Email</label>
       <input id="signupEmail" type="email" placeholder="Email">
     </div>

     <div class="formGroup">
       <label>Password</label>
       <input id="signupPassword" type="password" placeholder="Minimum 6 characters">
     </div>

     <button class="primary" style="width:100%" onclick="signup()">Create Account</button>
   </div>

   <div id="authMsg" class="authMsg hidden"></div>
 </div>
</section>

<!-- APP -->
<section id="app" class="hidden">

<header>
 <div class="topbar">
   <div class="logo">FriendBook</div>

   <div class="searchBox">
     <input id="searchInput"
       placeholder="Search people..."
       onkeydown="if(event.key==='Enter')searchPeople()">
   </div>

   <div class="topActions">
     <button class="iconBtn" onclick="showNotifications()">🔔</button>
     <button class="iconBtn" onclick="showMessenger()">💬</button>
     <button class="iconBtn" onclick="showSettings()">⚙️</button>
   </div>
 </div>

 <nav class="nav">
   <button id="navHome" onclick="showHome()">🏠<br>Home</button>
   <button id="navReels" onclick="showReels()">🎬<br>Reels</button>
   <button id="navSearch" onclick="showSearch()">🔎<br>Search</button>
   <button id="navProfile" onclick="showProfile(currentUser.id)">👤<br>Profile</button>
 </nav>
</header>

<main id="main" class="container"></main>

</section>

<div id="modal" class="modal hidden">
 <div id="modalBox" class="modalBox"></div>
</div>

<div id="toast" class="toast"></div>

<script>
/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL = "https://skereuaizdczbvjplisi.supabase.co";
const SUPABASE_KEY = "sb_publishable_3R2otJA1zIlsMsTYxe1ocw_NAPY5O9x";

const sb = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let session = null;
let currentUser = null;
let currentProfile = null;


/* =========================================================
   HELPERS
========================================================= */

const $ = id => document.getElementById(id);

function esc(value){
 if(value === null || value === undefined) return "";
 return String(value)
   .replace(/&/g,"&amp;")
   .replace(/</g,"&lt;")
   .replace(/>/g,"&gt;")
   .replace(/"/g,"&quot;")
   .replace(/'/g,"&#039;");
}

function toast(message){
 const t=$("toast");
 t.innerText=message;
 t.style.display="block";
 clearTimeout(window.toastTimer);
 window.toastTimer=setTimeout(()=>{
   t.style.display="none";
 },2500);
}

function openModal(html){
 $("modalBox").innerHTML=html;
 $("modal").classList.remove("hidden");
}

function closeModal(){
 $("modal").classList.add("hidden");
}

$("modal").addEventListener("click",e=>{
 if(e.target.id==="modal") closeModal();
});

function timeAgo(date){
 if(!date)return "";
 const diff=Math.floor((Date.now()-new Date(date).getTime())/1000);
 if(diff<60)return "Just now";
 if(diff<3600)return Math.floor(diff/60)+"m";
 if(diff<86400)return Math.floor(diff/3600)+"h";
 if(diff<604800)return Math.floor(diff/86400)+"d";
 return new Date(date).toLocaleDateString();
}

function setActive(id){
 ["navHome","navReels","navSearch","navProfile"].forEach(x=>{
   $(x)?.classList.remove("active");
 });
 $(id)?.classList.add("active");
}

function avatar(url,name){
 return url || "https://ui-avatars.com/api/?name="+encodeURIComponent(name||"User");
}


/* =========================================================
   AUTH
========================================================= */

function showLogin(){
 $("loginForm").classList.remove("hidden");
 $("signupForm").classList.add("hidden");
 $("loginTab").classList.add("active");
 $("signupTab").classList.remove("active");
 clearAuthMsg();
}

function showSignup(){
 $("loginForm").classList.add("hidden");
 $("signupForm").classList.remove("hidden");
 $("loginTab").classList.remove("active");
 $("signupTab").classList.add("active");
 clearAuthMsg();
}

function clearAuthMsg(){
 $("authMsg").className="authMsg hidden";
 $("authMsg").innerText="";
}

function authMessage(msg,type="error"){
 $("authMsg").className="authMsg "+type;
 $("authMsg").innerText=msg;
}

async function login(){

 clearAuthMsg();

 const email=$("loginEmail").value.trim();
 const password=$("loginPassword").value;

 if(!email || !password){
   authMessage("Email এবং Password দিন।");
   return;
 }

 try{

   const {data,error}=await sb.auth.signInWithPassword({
     email,
     password
   });

   if(error) throw error;

   if(!data.session){
     throw new Error("Login session তৈরি হয়নি।");
   }

   session=data.session;
   currentUser=data.user;

   await loadApp();

 }catch(error){

   console.error(error);

   let msg=error.message || "Login failed";

   if(msg.toLowerCase().includes("invalid login credentials")){
     msg="Email অথবা Password ভুল।";
   }

   if(msg.toLowerCase().includes("email not confirmed")){
     msg="Email confirm করা হয়নি।";
   }

   if(msg.toLowerCase().includes("failed to fetch")){
     msg="Internet অথবা Supabase connection সমস্যা।";
   }

   authMessage(msg);
 }
}

async function signup(){

 clearAuthMsg();

 const name=$("signupName").value.trim();
 const email=$("signupEmail").value.trim();
 const password=$("signupPassword").value;

 if(!name || !email || !password){
   authMessage("সব তথ্য পূরণ করুন।");
   return;
 }

 if(password.length<6){
   authMessage("Password কমপক্ষে ৬ অক্ষরের হতে হবে।");
   return;
 }

 try{

   const {data,error}=await sb.auth.signUp({
     email,
     password,
     options:{
       data:{name:name}
     }
   });

   if(error) throw error;

   if(data.session){

     session=data.session;
     currentUser=data.user;

     await ensureProfile(name);
     await loadApp();

   }else{

     authMessage(
       "Account তৈরি হয়েছে। আপনার Email confirm করে তারপর Login করুন।",
       "success"
     );
   }

 }catch(error){

   console.error(error);

   let msg=error.message || "Signup failed";

   if(msg.toLowerCase().includes("already registered")){
     msg="এই Email দিয়ে আগে থেকেই Account আছে।";
   }

   authMessage(msg);
 }
}

async function logout(){

 await sb.auth.signOut();

 session=null;
 currentUser=null;
 currentProfile=null;

 $("app").classList.add("hidden");
 $("authPage").classList.remove("hidden");

 showLogin();
}


/* =========================================================
   PROFILE
========================================================= */

async function ensureProfile(name="User"){

 if(!currentUser)return;

 const {data,error}=await sb
   .from("fb_profiles")
   .select("*")
   .eq("id",currentUser.id)
   .maybeSingle();

 if(error){
   console.error(error);
   return;
 }

 if(!data){

   const {data:created,error:createError}=await sb
     .from("fb_profiles")
     .insert({
       id:currentUser.id,
       name:name || currentUser.user_metadata?.name || "User",
       username:null,
       bio:"",
       profile_photo:"",
       cover_photo:""
     })
     .select()
     .single();

   if(!createError){
     currentProfile=created;
   }

 }else{

   currentProfile=data;

 }
}

async function loadCurrentProfile(){

 const {data,error}=await sb
   .from("fb_profiles")
   .select("*")
   .eq("id",currentUser.id)
   .maybeSingle();

 if(!error && data){
   currentProfile=data;
 }
}

async function getProfile(userId){

 const {data}=await sb
   .from("fb_profiles")
   .select("*")
   .eq("id",userId)
   .maybeSingle();

 return data;
}


/* =========================================================
   APP START
========================================================= */

async function loadApp(){

 $("authPage").classList.add("hidden");
 $("app").classList.remove("hidden");

 await ensureProfile(
   currentUser.user_metadata?.name || "User"
 );

 await loadCurrentProfile();

 showHome();
}

async function start(){

 try{

   const {data}=await sb.auth.getSession();

   if(data.session){

     session=data.session;
     currentUser=data.session.user;

     await loadApp();

   }else{

     $("authPage").classList.remove("hidden");
     $("app").classList.add("hidden");

   }

 }catch(error){

   console.error(error);
   authMessage("Supabase connection error।");

 }
}

sb.auth.onAuthStateChange((event,newSession)=>{

 if(newSession && !currentUser){

   session=newSession;
   currentUser=newSession.user;

   setTimeout(()=>loadApp(),0);
 }
});


/* =========================================================
   HOME
========================================================= */

function showHome(){

 setActive("navHome");

 $("main").innerHTML=`

 <div class="card">
   <div class="composerTop">
     <img class="avatar"
       src="${avatar(currentProfile?.profile_photo,currentProfile?.name)}">

     <div>
       <div class="name">${esc(currentProfile?.name||"User")}</div>
       <div class="muted">Create a post</div>
     </div>
   </div>

   <textarea id="postText" placeholder="What's on your mind?"></textarea>

   <div style="margin-top:8px">
     <select id="postPrivacy">
       <option value="public">🌎 Public</option>
       <option value="friends">👥 Friends</option>
       <option value="private">🔒 Only me</option>
     </select>
   </div>

   <div style="margin-top:8px">
     <input id="postFeeling" placeholder="Feeling / Activity (optional)">
   </div>

   <div class="composerBtns">

     <label class="fileLabel">
       📷 Photo
       <input id="postImage" type="file" accept="image/*">
     </label>

     <button class="primary" onclick="submitPost()">
       📝 Post
     </button>

   </div>
 </div>

 <div id="feed">
   <div class="loader">Loading Feed...</div>
 </div>
 `;

 loadPosts();
}

async function submitPost(){

 const text=$("postText").value.trim();
 const file=$("postImage").files[0];
 const privacy=$("postPrivacy").value;
 const feeling=$("postFeeling").value.trim();

 if(!text && !file){
   toast("Post-এ কিছু লিখুন অথবা Photo দিন।");
   return;
 }

 let image_url=null;

 try{

   if(file){

     const ext=file.name.split(".").pop();
     const path=currentUser.id+"/"+Date.now()+"."+ext;

     const {error:uploadError}=await sb.storage
       .from("post-images")
       .upload(path,file,{
         upsert:false
       });

     if(uploadError)throw uploadError;

     const {data:urlData}=sb.storage
       .from("post-images")
       .getPublicUrl(path);

     image_url=urlData.publicUrl;
   }

   const {error}=await sb
     .from("fb_posts")
     .insert({
       user_id:currentUser.id,
       text:text || null,
       image_url:image_url,
       privacy:privacy,
       feeling:feeling || null,
       location:null
     });

   if(error)throw error;

   toast("Post published!");

   showHome();

 }catch(error){

   console.error(error);

   toast("Post করা যায়নি: "+error.message);
 }
}


/* =========================================================
   POSTS
========================================================= */

async function loadPosts(){

 const feed=$("feed");

 const {data:posts,error}=await sb
   .from("fb_posts")
   .select("*")
   .order("created_at",{ascending:false})
   .limit(50);

 if(error){

   feed.innerHTML=
     `<div class="card error">Feed error: ${esc(error.message)}</div>`;

   return;
 }

 if(!posts || posts.length===0){

   feed.innerHTML=
     `<div class="card empty">এখনো কোনো Post নেই। প্রথম Post আপনিই করুন।</div>`;

   return;
 }

 let html="";

 for(const post of posts){

   const profile=await getProfile(post.user_id);

   const {count:reactionCount}=await sb
     .from("fb_post_reactions")
     .select("*",{count:"exact",head:true})
     .eq("post_id",post.id);

   const {data:myReaction}=await sb
     .from("fb_post_reactions")
     .select("id,reaction")
     .eq("post_id",post.id)
     .eq("user_id",currentUser.id)
     .maybeSingle();

   const {count:commentCount}=await sb
     .from("fb_comments")
     .select("*",{count:"exact",head:true})
     .eq("post_id",post.id);

   html+=`

   <article class="card">

     <div class="row">

       <img class="avatar"
         src="${avatar(profile?.profile_photo,profile?.name)}">

       <div>

 let html="";

 for(const p of data||[]){

   if(p.id===currentUser.id)continue;

   html+=`

   <div class="searchResult">

     <img class="avatar"
       src="${avatar(p.profile_photo,p.name)}">

     <div>
       <div class="name">${esc(p.name)}</div>
       <div class="muted">@${esc(p.username||"")}</div>
     </div>

     <div class="spacer"></div>

     <button class="primary"
       onclick="openMessage('${p.id}')">
       Message
     </button>

   </div>
   `;
 }

 $("messageUsers").innerHTML=
   html || `<div class="empty">No users found.</div>`;
}

async function openMessage(userId){

 const p=await getProfile(userId);

 if(!p)return;

 const {data:messages,error}=await sb
   .from("fb_messages")
   .select("*")
   .or(
     `and(sender_id.eq.${currentUser.id},receiver_id.eq.${userId}),and(sender_id.eq.${userId},receiver_id.eq.${currentUser.id})`
   )
   .order("created_at",{ascending:true})
   .limit(100);

 if(error){
   toast(error.message);
   return;
 }

 let html=`

 <div class="modalHeader">
   <img class="avatar"
     src="${avatar(p.profile_photo,p.name)}">

   <div style="margin-left:8px">
     <div class="name">${esc(p.name)}</div>
     <div class="muted">Messenger</div>
   </div>

   <div class="spacer"></div>

   <button class="close" onclick="closeModal()">✕</button>
 </div>

 <div id="messageList"
   style="max-height:50vh;overflow:auto;padding:5px">
 `;

 for(const m of messages||[]){

   const mine=m.sender_id===currentUser.id;

   html+=`

   <div style="
     display:flex;
     justify-content:${mine?"flex-end":"flex-start"};
     margin:6px 0">

     <div style="
       max-width:75%;
       padding:9px 12px;
       border-radius:16px;
       background:${mine?"var(--blue)":"var(--bg)"};
       color:${mine?"white":"var(--text)"}
     ">
       ${esc(m.text||"")}
       <div style="font-size:10px;opacity:.7;margin-top:3px">
         ${timeAgo(m.created_at)}
       </div>
     </div>

   </div>
   `;
 }

 html+=`

 </div>

 <div class="commentInput">

   <input id="messageInput"
     placeholder="Write message..."
     onkeydown="if(event.key==='Enter')sendMessage('${userId}')">

   <button class="primary"
     onclick="sendMessage('${userId}')">
     Send
   </button>

 </div>
 `;

 openModal(html);

 setTimeout(()=>{
   const list=$("messageList");
   if(list)list.scrollTop=list.scrollHeight;
 },100);
}

async function sendMessage(receiverId){

 const input=$("messageInput");
 const text=input.value.trim();

 if(!text)return;

 const {error}=await sb
   .from("fb_messages")
   .insert({
     sender_id:currentUser.id,
     receiver_id:receiverId,
     text:text,
     image_url:null,
     seen:false
   });

 if(error){
   toast(error.message);
   return;
 }

 await sb.from("fb_notifications").insert({
   receiver_id:receiverId,
   sender_id:currentUser.id,
   type:"message",
   message:(currentProfile?.name||"Someone")+" sent you a message",
   read:false
 });

 openMessage(receiverId);
}

async function showSettings(){

 const {data:creator}=await sb
   .from("fb_creator_settings")
   .select("*")
   .eq("user_id",currentUser.id)
   .maybeSingle();

 $("main").innerHTML=`

 <div class="card">

   <h2>⚙️ Settings</h2>

   <div class="settingsItem">

     <div class="switch">

       <div>
         <b>🌙 Dark Mode</b>
         <div class="muted">
           Switch between light and dark theme
         </div>
       </div>

       <input type="checkbox"
         ${document.body.classList.contains("dark")?"checked":""}
         onchange="toggleDarkMode(this.checked)">
     </div>

   </div>

   <div class="settingsItem">

     <b>👤 Account</b>

     <div style="margin-top:8px">
       <button class="secondary"
         onclick="showProfile(currentUser.id)">
         View Profile
       </button>
     </div>

   </div>

   <div class="settingsItem">

     <b>💰 Creator Monetization</b>

     <div class="muted" style="margin:5px 0">
       ${creator?.monetization_enabled?"Enabled":"Not enabled"}
     </div>

     <button class="primary"
       onclick="showMonetization()">
       Monetization Settings
     </button>

   </div>

   <div class="settingsItem">

     <button class="secondary danger"
       onclick="logout()">
       🚪 Log Out
     </button>

   </div>

 </div>
 `;
}

function toggleDarkMode(enabled){

 document.body.classList.toggle("dark",enabled);

 localStorage.setItem(
   "friendbook_dark",
   enabled?"1":"0"
 );
}

async function showMonetization(){

 const {data}=await sb
   .from("fb_creator_settings")
   .select("*")
   .eq("user_id",currentUser.id)
   .maybeSingle();

 openModal(`

 <div class="modalHeader">
   <h3 style="margin:0">💰 Creator Monetization</h3>
   <div class="spacer"></div>
   <button class="close" onclick="closeModal()">✕</button>
 </div>

 <div class="formGroup">

   <label>Monetization</label>

   <select id="monetizationEnabled">

     <option value="false"
       ${!data?.monetization_enabled?"selected":""}>
       Disabled
     </option>

     <option value="true"
       ${data?.monetization_enabled?"selected":""}>
       Enabled
     </option>

   </select>

 </div>

 <div class="formGroup">
   <label>Payout Method</label>

   <input id="payoutMethod"
     value="${esc(data?.payout_method||"")}"
     placeholder="bKash / Bank / PayPal">
 </div>

 <div class="formGroup">
   <label>Payout Email</label>

   <input id="payoutEmail"
     value="${esc(data?.payout_email||"")}"
     placeholder="Payment email">
 </div>

 <button class="primary"
   style="width:100%"
   onclick="saveMonetization()">
   Save
 </button>

 `);
}

async function saveMonetization(){

 const values={
   user_id:currentUser.id,
   monetization_enabled:
     $("monetizationEnabled").value==="true",
   payout_method:
     $("payoutMethod").value.trim() || null,
   payout_email:
     $("payoutEmail").value.trim() || null,
   updated_at:new Date().toISOString()
 };

 const {error}=await sb
   .from("fb_creator_settings")
   .upsert(values,{onConflict:"user_id"});

 if(error){
   toast(error.message);
   return;
 }

 toast("Monetization settings saved");
 closeModal();
 showSettings();
}
