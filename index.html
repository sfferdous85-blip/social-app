<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Social App</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f0f2f5;
    color:#111;
}

button{
    cursor:pointer;
}

.header{
    display:none;
    position:sticky;
    top:0;
    z-index:100;
    background:#1877f2;
    color:white;
    padding:12px 15px;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:22px;
    font-weight:bold;
}

.header button{
    border:0;
    background:white;
    color:#1877f2;
    padding:8px 12px;
    border-radius:6px;
    font-weight:bold;
}

.container{
    max-width:700px;
    margin:20px auto;
    padding:0 10px;
}

.card{
    background:white;
    border-radius:10px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 1px 4px rgba(0,0,0,.12);
}

.auth{
    max-width:400px;
    margin:60px auto;
    padding:20px;
}

.auth h1{
    text-align:center;
    color:#1877f2;
}

input,
textarea{
    width:100%;
    padding:12px;
    margin:7px 0;
    border:1px solid #ddd;
    border-radius:7px;
    font-size:15px;
}

textarea{
    min-height:90px;
    resize:vertical;
}

.primary{
    width:100%;
    border:0;
    background:#1877f2;
    color:white;
    padding:12px;
    border-radius:7px;
    font-size:16px;
    font-weight:bold;
    margin-top:8px;
}

.secondary{
    width:100%;
    border:0;
    background:#42b72a;
    color:white;
    padding:12px;
    border-radius:7px;
    font-size:16px;
    font-weight:bold;
    margin-top:8px;
}

.friend-button{
    border:0;
    background:#1877f2;
    color:white;
    padding:9px 14px;
    border-radius:6px;
    font-weight:bold;
}

.accept-button{
    border:0;
    background:#42b72a;
    color:white;
    padding:9px 14px;
    border-radius:6px;
    font-weight:bold;
}

.reject-button,
.remove-button{
    border:0;
    background:#eee;
    color:#333;
    padding:9px 14px;
    border-radius:6px;
    font-weight:bold;
}

.link{
    color:#1877f2;
    text-align:center;
    display:block;
    margin-top:15px;
    cursor:pointer;
}

.profile{
    overflow:hidden;
    padding:0;
}

.cover{
    width:100%;
    height:200px;
    background:#ddd;
    object-fit:cover;
}

.profile-info{
    text-align:center;
    padding:15px;
}

.profile-photo{
    width:110px;
    height:110px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid white;
    margin-top:-65px;
    background:#ddd;
}

.profile-name{
    font-size:23px;
    font-weight:bold;
    margin-top:8px;
}

.small{
    color:#666;
    font-size:14px;
}

.post-user{
    display:flex;
    align-items:center;
    gap:10px;
}

.post-user img{
    width:45px;
    height:45px;
    border-radius:50%;
    object-fit:cover;
}

.post-name{
    font-weight:bold;
}

.post-date{
    color:#777;
    font-size:12px;
}

.post-text{
    margin:15px 0;
    white-space:pre-wrap;
    word-break:break-word;
}

.post-image{
    width:100%;
    max-height:600px;
    object-fit:contain;
    border-radius:8px;
    background:#eee;
}

.actions{
    display:flex;
    gap:5px;
    border-top:1px solid #eee;
    margin-top:12px;
    padding-top:8px;
}

.actions button{
    flex:1;
    border:0;
    background:#f0f2f5;
    padding:10px;
    border-radius:6px;
    font-weight:bold;
}

.comment-box{
    display:none;
    margin-top:10px;
}

.comment{
    background:#f0f2f5;
    padding:8px;
    border-radius:8px;
    margin-top:5px;
}

.user-result{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px;
    border-bottom:1px solid #eee;
}

.user-result img{
    width:50px;
    height:50px;
    border-radius:50%;
    object-fit:cover;
    background:#ddd;
}

.user-result-info{
    flex:1;
}

.user-result-name{
    font-weight:bold;
    font-size:16px;
}

.request-item,
.friend-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 0;
    border-bottom:1px solid #eee;
}

.request-item img,
.friend-item img{
    width:50px;
    height:50px;
    border-radius:50%;
    object-fit:cover;
}

.request-info,
.friend-info{
    flex:1;
}

.request-name,
.friend-name{
    font-weight:bold;
}

.request-buttons{
    display:flex;
    gap:5px;
    flex-wrap:wrap;
}

.hidden{
    display:none !important;
}

.message{
    text-align:center;
    margin-top:10px;
    font-weight:bold;
}

.file-label{
    display:block;
    background:#f0f2f5;
    padding:12px;
    border-radius:7px;
    margin:7px 0;
    text-align:center;
    cursor:pointer;
}

hr{
    border:0;
    border-top:1px solid #eee;
    margin:15px 0;
}

.loading{
    text-align:center;
    padding:20px;
    color:#666;
}

.empty{
    text-align:center;
    color:#777;
    padding:15px;
}

@media(max-width:600px){

    .container{
        margin:10px auto;
    }

    .cover{
        height:150px;
    }

    .profile-photo{
        width:95px;
        height:95px;
    }

    .actions button{
        font-size:12px;
        padding:9px 4px;
    }

}

</style>

</head>

<body>


<!-- ================= AUTH ================= -->

<div id="authPage">

    <div class="card auth">

        <h1>My Social App</h1>

        <div id="loginBox">

            <h2>Login</h2>

            <input
                type="email"
                id="loginEmail"
                placeholder="Email"
            >

            <input
                type="password"
                id="loginPassword"
                placeholder="Password"
            >

            <button
                class="primary"
                onclick="login()"
            >
                Login
            </button>

            <div
                class="link"
                onclick="showRegister()"
            >
                Create new account
            </div>

            <div
                id="loginMessage"
                class="message"
            ></div>

        </div>


        <div
            id="registerBox"
            class="hidden"
        >

            <h2>Create Account</h2>

            <input
                type="text"
                id="registerName"
                placeholder="Your name"
            >

            <input
                type="email"
                id="registerEmail"
                placeholder="Email"
            >

            <input
                type="password"
                id="registerPassword"
                placeholder="Password"
            >

            <button
                class="secondary"
                onclick="register()"
            >
                Create Account
            </button>

            <div
                class="link"
                onclick="showLogin()"
            >
                Already have an account? Login
            </div>

            <div
                id="registerMessage"
                class="message"
            ></div>

        </div>

    </div>

</div>


<!-- ================= HEADER ================= -->

<div
    id="appHeader"
    class="header"
>

    <div class="logo">
        My Social App
    </div>

    <button onclick="logout()">
        Logout
    </button>

</div>


<!-- ================= APP ================= -->

<div
    id="appPage"
    class="container hidden"
>


    <!-- PROFILE -->

    <div class="card profile">

        <img
            id="coverPhoto"
            class="cover"
            src=""
            alt="Cover"
        >

        <div class="profile-info">

            <img
                id="profilePhoto"
                class="profile-photo"
                src=""
                alt="Profile"
            >

            <div
                id="profileName"
                class="profile-name"
            >
                User
            </div>

            <div
                id="profileBio"
                class="small"
            >
                Welcome!
            </div>

        </div>

    </div>


    <!-- PROFILE EDIT -->

    <div class="card">

        <h3>✏️ Edit Profile</h3>

        <input
            id="editName"
            placeholder="Name"
        >

        <input
            id="editBio"
            placeholder="Bio"
        >

        <label class="file-label">
            📷 Select Profile Photo
            <input
                type="file"
                id="profileImage"
                accept="image/*"
                hidden
            >
        </label>

        <label class="file-label">
            🖼️ Select Cover Photo
            <input
                type="file"
                id="coverImage"
                accept="image/*"
                hidden
            >
        </label>

        <button
            class="primary"
            onclick="updateProfile()"
        >
            Save Profile
        </button>

        <div
            id="profileMessage"
            class="message"
        ></div>

    </div>


    <!-- ================= FRIEND SEARCH ================= -->

    <div class="card">

        <h3>👥 Find Friends</h3>

        <input
            id="userSearchInput"
            placeholder="Search people by name..."
        >

        <button
            class="primary"
            onclick="searchUsers()"
        >
            🔍 Search
        </button>

        <div id="searchResults"></div>

    </div>


    <!-- ================= FRIEND REQUESTS ================= -->

    <div class="card">

        <h3>📨 Friend Requests</h3>

        <div id="friendRequests">

            <div class="loading">
                Loading...
            </div>

        </div>

    </div>


    <!-- ================= FRIENDS ================= -->

    <div class="card">

        <h3>👫 My Friends</h3>

        <div id="friendsList">

            <div class="loading">
                Loading...
            </div>

        </div>

    </div>


    <!-- CREATE POST -->

    <div class="card">

        <h3>📝 Create Post</h3>

        <textarea
            id="postText"
            placeholder="What's on your mind?"
        ></textarea>

        <label class="file-label">
            📷 Add Photo
            <input
                type="file"
                id="postImage"
                accept="image/*"
                hidden
            >
        </label>

        <button
            class="primary"
            onclick="createPost()"
        >
            Post
        </button>

        <div
            id="postMessage"
            class="message"
        ></div>

    </div>


    <!-- FEED -->

    <h2>🏠 Home Feed</h2>

    <div id="feed">

        <div class="loading">
            Loading posts...
        </div>

    </div>

</div>


<script>


/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://skereuaizdczbvjplisi.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_3R2otJA1zIlsMsTYxe1ocw_NAPY5O9x";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);

let currentUser = null;


/* =====================================================
   DEFAULT IMAGES
===================================================== */

const DEFAULT_PROFILE =
"https://via.placeholder.com/200?text=Profile";

const DEFAULT_COVER =
"https://via.placeholder.com/900x250?text=Cover";


/* =====================================================
   AUTH PAGE
===================================================== */

function showRegister(){

    document.getElementById("loginBox")
        .classList.add("hidden");

    document.getElementById("registerBox")
        .classList.remove("hidden");

}


function showLogin(){

    document.getElementById("registerBox")
        .classList.add("hidden");

    document.getElementById("loginBox")
        .classList.remove("hidden");

}


/* =====================================================
   REGISTER
===================================================== */

async function register(){

    const name =
        document.getElementById("registerName")
        .value.trim();

    const email =
        document.getElementById("registerEmail")
        .value.trim();

    const password =
        document.getElementById("registerPassword")
        .value;

    const message =
        document.getElementById("registerMessage");


    if(!name || !email || !password){

        message.style.color="red";
        message.innerText="সব তথ্য পূরণ করুন।";
        return;

    }


    if(password.length < 6){

        message.style.color="red";
        message.innerText="Password কমপক্ষে ৬ অক্ষরের হতে হবে।";
        return;

    }


    message.style.color="#1877f2";
    message.innerText="Account তৈরি হচ্ছে...";


    const {
        data,
        error
    } =
    await supabaseClient.auth.signUp({

        email:email,
        password:password

    });


    if(error){

        message.style.color="red";
        message.innerText=error.message;
        return;

    }


    if(!data.user){

        message.style.color="red";
        message.innerText="Account তৈরি হয়নি।";
        return;

    }


    const {
        error:profileError
    } =
    await supabaseClient
    .from("profiles")
    .upsert({

        id:data.user.id,
        name:name,
        bio:"",
        profile_photo:"",
        cover_photo:""

    });


    if(profileError){

        console.error(profileError);

        message.style.color="red";

        message.innerText =
        "Profile তৈরি হয়নি: " +
        profileError.message;

        return;

    }


    message.style.color="green";

    message.innerText =
    "Account তৈরি হয়েছে। এখন Login করুন।";

}


/* =====================================================
   LOGIN
===================================================== */

async function login(){

    const email =
        document.getElementById("loginEmail")
        .value.trim();

    const password =
        document.getElementById("loginPassword")
        .value;

    const message =
        document.getElementById("loginMessage");


    if(!email || !password){

        message.style.color="red";

        message.innerText =
        "Email এবং Password দিন।";

        return;

    }


    message.style.color="#1877f2";

    message.innerText =
    "Login হচ্ছে...";


    const {
        data,
        error
    } =
    await supabaseClient.auth.signInWithPassword({

        email:email,
        password:password

    });


    if(error){

        message.style.color="red";

        message.innerText =
        error.message;

        return;

    }


    currentUser =
        data.user;

    startApp();

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

    await supabaseClient.auth.signOut();

    currentUser=null;

    document
        .getElementById("appPage")
        .classList.add("hidden");

    document
        .getElementById("appHeader")
        .style.display="none";

    document
        .getElementById("authPage")
        .style.display="block";

}


/* =====================================================
   SESSION
===================================================== */

async function checkSession(){

    const {
        data
    } =
    await supabaseClient.auth.getSession();


    if(
        data &&
        data.session &&
        data.session.user
    ){

        currentUser =
        data.session.user;

        startApp();

    }

}


/* =====================================================
   AUTH STATE
===================================================== */

supabaseClient.auth.onAuthStateChange(

    function(event,session){

        if(
            session &&
            session.user
        ){

            currentUser =
            session.user;

        }

    }

);


/* =====================================================
   START APP
===================================================== */

async function startApp(){

    document
        .getElementById("authPage")
        .style.display="none";

    document
        .getElementById("appHeader")
        .style.display="flex";

    document
        .getElementById("appPage")
        .classList.remove("hidden");


    await loadProfile();

    await loadFriends();

    await loadFriendRequests();

    await loadFeed();

}


/* =====================================================
   UPLOAD MEDIA
===================================================== */

async function uploadMedia(file,folder){

    if(!file || !currentUser){

        return "";

    }


    const extension =
        file.name
        .split(".")
        .pop()
        .toLowerCase();


    const fileName =
        folder +
        "/" +
        currentUser.id +
        "_" +
        Date.now() +
        "." +
        extension;


    const {
        error
    } =
    await supabaseClient
    .storage
    .from("media")
    .upload(

        fileName,
        file,

        {
            cacheControl:"3600",
            upsert:false
        }

    );


    if(error){

        console.error(
            "UPLOAD ERROR:",
            error
        );

        return "";

    }


    const {
        data
    } =
    supabaseClient
    .storage
    .from("media")
    .getPublicUrl(fileName);


    return data.publicUrl;

}


/* =====================================================
   LOAD PROFILE
===================================================== */

async function loadProfile(){

    if(!currentUser){

        return;

    }


    let {
        data,
        error
    } =
    await supabaseClient
    .from("profiles")
    .select("*")
    .eq(
        "id",
        currentUser.id
    )
    .maybeSingle();


    if(error){

        console.error(
            "PROFILE ERROR:",
            error
        );

        return;

    }


    if(!data){

        const result =
        await supabaseClient
        .from("profiles")
        .insert({

            id:currentUser.id,

            name:
            currentUser.email
            ? currentUser.email.split("@")[0]
            : "User",

            bio:"",
            profile_photo:"",
            cover_photo:""

        })
        .select()
        .single();


        if(result.error){

            console.error(
                result.error
            );

            return;

        }


        data=result.data;

    }


    document
        .getElementById("profileName")
        .innerText =
        data.name || "User";


    document
        .getElementById("profileBio")
        .innerText =
        data.bio || "Welcome!";


    document
        .getElementById("editName")
        .value =
        data.name || "";


    document
        .getElementById("editBio")
        .value =
        data.bio || "";


    document
        .getElementById("profilePhoto")
        .src =
        data.profile_photo ||
        DEFAULT_PROFILE;


    document
        .getElementById("coverPhoto")
        .src =
        data.cover_photo ||
        DEFAULT_COVER;

}


/* =====================================================
   UPDATE PROFILE
===================================================== */

async function updateProfile(){

    if(!currentUser){

        return;

    }


    const message =
        document.getElementById("profileMessage");


    message.style.color="#1877f2";

    message.innerText =
    "Profile save হচ্ছে...";


    const name =
        document.getElementById("editName")
        .value.trim();


    const bio =
        document.getElementById("editBio")
        .value.trim();


    let profilePhoto="";

    let coverPhoto="";


    const profileFile =
        document.getElementById("profileImage")
        .files[0];


    const coverFile =
        document.getElementById("coverImage")
        .files[0];


    if(profileFile){

        profilePhoto =
        await uploadMedia(
            profileFile,
            "profiles"
        );


        if(!profilePhoto){

            message.style.color="red";

            message.innerText =
            "Profile photo upload হয়নি।";

            return;

        }

    }


    if(coverFile){

        coverPhoto =
        await uploadMedia(
            coverFile,
            "covers"
        );


        if(!coverPhoto){

            message.style.color="red";

            message.innerText =
            "Cover photo upload হয়নি।";

            return;

        }

    }


    const updateData={
        name:name,
        bio:bio
    };


    if(profilePhoto){

        updateData.profile_photo =
        profilePhoto;

    }


    if(coverPhoto){

        updateData.cover_photo =
        coverPhoto;

    }


    const {
        error
    } =
    await supabaseClient
    .from("profiles")
    .update(updateData)
    .eq(
        "id",
        currentUser.id
    );


    if(error){

        message.style.color="red";

        message.innerText =
        error.message;

        return;

    }


    message.style.color="green";

    message.innerText =
    "Profile updated!";


    document.getElementById("profileImage")
        .value="";

    document.getElementById("coverImage")
        .value="";


    await loadProfile();

}


/* =====================================================
   SEARCH USERS
===================================================== */

async function searchUsers(){

    const input =
        document
        .getElementById("userSearchInput");

    const results =
        document
        .getElementById("searchResults");


    const query =
        input.value.trim();


    if(!query){

        results.innerHTML =
        '<div class="empty">নাম লিখে Search করুন।</div>';

        return;

    }


    results.innerHTML =
    '<div class="loading">Searching...</div>';


    const {
        data:users,
        error
    } =
    await supabaseClient
    .from("profiles")
    .select("*")
    .ilike(
        "name",
        "%" + query + "%"
    )
    .neq(
        "id",
        currentUser.id
    )
    .limit(20);


    if(error){

        results.innerHTML =
        '<div class="empty">Search Error: ' +
        escapeHtml(error.message) +
        '</div>';

        return;

    }


    if(!users || users.length===0){

        results.innerHTML =
        '<div class="empty">কোনো User পাওয়া যায়নি।</div>';

        return;

    }


    results.innerHTML="";


    for(const user of users){

        const div =
        document.createElement("div");

        div.className="user-result";


        const photo =
        user.profile_photo ||
        DEFAULT_PROFILE;


        div.innerHTML=`

            <img src="${escapeHtml(photo)}">

            <div class="user-result-info">

                <div class="user-result-name">
                    ${escapeHtml(user.name || "User")}
                </div>

                <div class="small">
                    ${escapeHtml(user.bio || "")}
                </div>

            </div>

            <div id="user-action-${user.id}">
                Loading...
            </div>

        `;


        results.appendChild(div);


        await showUserAction(
            user.id
        );

    }

}


/* =====================================================
   SHOW USER ACTION
===================================================== */

async function showUserAction(userId){

    const box =
        document.getElementById(
            "user-action-" + userId
        );
