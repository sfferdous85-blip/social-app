<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1877f2">
<title>FriendBook</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f0f2f5;
  color:#111;
}
body.dark{
  background:#18191a;
  color:#eee;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.top{
  position:sticky;
  top:0;
  z-index:50;
  background:#fff;
  border-bottom:1px solid #ddd;
  padding:10px;
  display:flex;
  align-items:center;
  gap:10px;
}
.dark .top{background:#242526;border-color:#444}
.logo{
  color:#1877f2;
  font-size:25px;
  font-weight:bold;
}
.search{
  flex:1;
  max-width:420px;
}
.search input{
  width:100%;
  border:0;
  background:#f0f2f5;
  border-radius:25px;
  padding:11px 15px;
  outline:0;
}
.dark .search input{background:#3a3b3c;color:white}
.topUser{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:8px;
}
.avatar{
  width:40px;
  height:40px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd;
}
.nav{
  position:sticky;
  top:61px;
  z-index:40;
  background:white;
  border-bottom:1px solid #ddd;
  display:flex;
  justify-content:center;
  gap:4px;
  padding:5px;
}
.dark .nav{background:#242526;border-color:#444}
.nav button{
  border:0;
  background:transparent;
  padding:10px 16px;
  border-radius:8px;
  font-weight:bold;
}
.nav button:hover{background:#eee}
.dark .nav button{color:white}
.dark .nav button:hover{background:#3a3b3c}

.container{
  width:min(700px,100%);
  margin:auto;
  padding:12px;
}
.card{
  background:#fff;
  border-radius:10px;
  padding:14px;
  margin-bottom:12px;
  box-shadow:0 1px 3px #0001;
}
.dark .card{background:#242526;color:#eee}

.auth{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.authBox{
  width:min(420px,100%);
  background:#fff;
  padding:25px;
  border-radius:15px;
  box-shadow:0 4px 25px #0002;
}
.dark .authBox{background:#242526;color:white}
.authBox h1{
  text-align:center;
  color:#1877f2;
}
.field{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:8px;
  margin:6px 0;
  outline:0;
}
.dark .field{background:#3a3b3c;color:white;border-color:#555}

.mainBtn{
  width:100%;
  border:0;
  background:#1877f2;
  color:#fff;
  padding:12px;
  border-radius:8px;
  font-weight:bold;
  margin-top:8px;
}
.greenBtn{background:#42b72a}
.redBtn{background:#e41e3f}
.grayBtn{background:#65676b;color:#fff}
.authSwitch{
  text-align:center;
  margin-top:15px;
  color:#1877f2;
  cursor:pointer;
}
.msg{
  margin:10px 0;
  padding:10px;
  border-radius:8px;
  background:#fee;
  color:#c00;
}
.success{
  background:#e8f8e8;
  color:green;
}

.composer textarea{
  width:100%;
  resize:none;
  min-height:80px;
  border:0;
  background:#f0f2f5;
  border-radius:10px;
  padding:12px;
  outline:0;
}
.dark .composer textarea{background:#3a3b3c;color:white}

.row{
  display:flex;
  align-items:center;
  gap:10px;
}
.between{
  justify-content:space-between;
}
.small{
  font-size:13px;
  color:#65676b;
}
.dark .small{color:#bbb}

.postImg{
  width:100%;
  max-height:600px;
  object-fit:cover;
  border-radius:8px;
  margin-top:10px;
}
.postText{
  white-space:pre-wrap;
  font-size:16px;
  line-height:1.5;
  margin-top:10px;
}
.actions{
  display:flex;
  gap:4px;
  border-top:1px solid #ddd;
  margin-top:10px;
  padding-top:5px;
}
.dark .actions{border-color:#444}
.actions button{
  flex:1;
  border:0;
  background:transparent;
  padding:10px;
  border-radius:7px;
}
.actions button:hover{background:#eee}
.dark .actions button{color:#eee}
.dark .actions button:hover{background:#3a3b3c}

.commentBox{
  display:flex;
  gap:5px;
  margin-top:10px;
}
.commentBox input{
  flex:1;
  padding:10px;
  border:1px solid #ccc;
  border-radius:20px;
}
.comment{
  background:#f0f2f5;
  border-radius:15px;
  padding:8px 12px;
  margin:5px 0;
}
.dark .comment{background:#3a3b3c}

.profileCover{
  height:230px;
  background:#1877f2;
  border-radius:10px 10px 0 0;
  overflow:hidden;
}
.profileCover img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.profileInfo{
  text-align:center;
  margin-top:-45px;
}
.profileInfo .bigAvatar{
  width:100px;
  height:100px;
  border-radius:50%;
  border:5px solid white;
  object-fit:cover;
  background:#ddd;
}
.dark .profileInfo .bigAvatar{border-color:#242526}
.profileName{
  font-size:24px;
  font-weight:bold;
  margin:8px;
}

.reels{
  position:fixed;
  inset:0;
  background:#000;
  z-index:100;
  overflow-y:auto;
  scroll-snap-type:y mandatory;
}
.reel{
  height:100vh;
  position:relative;
  scroll-snap-align:start;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#000;
}
.reel video{
  width:100%;
  height:100%;
  object-fit:contain;
}
.reelInfo{
  position:absolute;
  left:15px;
  bottom:25px;
  color:#fff;
  max-width:70%;
  text-shadow:0 1px 4px #000;
}
.reelButtons{
  position:absolute;
  right:15px;
  bottom:80px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.reelButtons button{
  width:50px;
  height:50px;
  border-radius:50%;
  border:0;
  background:#ffffff30;
  color:#fff;
  font-size:20px;
}
.closeReels{
  position:fixed;
  right:15px;
  top:15px;
  z-index:110;
  width:45px;
  height:45px;
  border:0;
  border-radius:50%;
  background:#ffffff30;
  color:#fff;
  font-size:25px;
}

.settingsItem{
  padding:15px;
  border-bottom:1px solid #ddd;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.dark .settingsItem{border-color:#444}

.hidden{display:none!important}

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%);
  background:#222;
  color:#fff;
  padding:12px 18px;
  border-radius:25px;
  z-index:300;
  display:none;
}

@media(max-width:600px){
  .logo{font-size:21px}
  .topUser span{display:none}
  .nav button{
    padding:9px 10px;
    font-size:13px;
  }
  .profileCover{height:180px}
}
</style>
</head>

<body>

<!-- AUTH -->
<section id="authPage" class="auth">
  <div class="authBox">
    <h1>FriendBook</h1>

    <div id="loginBox">
      <h2>Login</h2>

      <input id="loginEmail"
             class="field"
             type="email"
             placeholder="Email">

      <input id="loginPassword"
             class="field"
             type="password"
             placeholder="Password">

      <button class="mainBtn" onclick="login()">Log In</button>

      <div id="loginMsg"></div>

      <div class="authSwitch" onclick="showSignup()">
        Create new account
      </div>
    </div>

    <div id="signupBox" class="hidden">
      <h2>Create Account</h2>

      <input id="signupName"
             class="field"
             placeholder="Your Name">

      <input id="signupEmail"
             class="field"
             type="email"
             placeholder="Email">

      <input id="signupPassword"
             class="field"
             type="password"
             placeholder="Password">

      <button class="mainBtn greenBtn"
              onclick="signup()">Sign Up</button>

      <div id="signupMsg"></div>

      <div class="authSwitch" onclick="showLogin()">
        Already have an account? Login
      </div>
    </div>
  </div>
</section>

<!-- APP -->
<div id="app" class="hidden">

  <header class="top">
    <div class="logo">FriendBook</div>

    <div class="search">
      <input id="searchInput"
             placeholder="Search people..."
             onkeydown="if(event.key==='Enter')searchPeople()">
    </div>

    <div class="topUser">
      <img id="topAvatar" class="avatar">
      <span id="topName"></span>
    </div>
  </header>

  <nav class="nav">
    <button onclick="showHome()">🏠 Home</button>
    <button onclick="showReels()">🎬 Reels</button>
    <button onclick="showProfile()">👤 Profile</button>
    <button onclick="showNotifications()">🔔</button>
    <button onclick="showSettings()">⚙️</button>
  </nav>

  <main id="main" class="container"></main>
</div>

<div id="toast" class="toast"></div>

<!-- REELS -->
<div id="reelsLayer" class="reels hidden">
  <button class="closeReels" onclick="closeReels()">×</button>
  <div id="reelsList"></div>
</div>

<script>
const SUPABASE_URL =
"https://skereuaizdczbvjplisi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_3R2otJA1zIlsMsTYxe1ocw_NAPY5O9x";

const sb = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser = null;
let currentProfile = null;
let darkMode =
  localStorage.getItem("friendbook_dark") === "1";

const $ = id => document.getElementById(id);

function toast(message){
  const t=$("toast");
  t.innerText=message;
  t.style.display="block";
  setTimeout(()=>t.style.display="none",2200);
}

function showLogin(){
  $("loginBox").classList.remove("hidden");
  $("signupBox").classList.add("hidden");
}

function showSignup(){
  $("loginBox").classList.add("hidden");
  $("signupBox").classList.remove("hidden");
}

function authMsg(id,text,success=false){
  $(id).innerHTML =
    text
    ? `<div class="msg ${success?"success":""}">${text}</div>`
    : "";
}

/* LOGIN */
async function login(){

  const email=$("loginEmail").value.trim();
  const password=$("loginPassword").value;

  authMsg("loginMsg","");

  if(!email || !password){
    authMsg("loginMsg","Email এবং Password দিন।");
    return;
  }

  try{

    const {data,error} =
      await sb.auth.signInWithPassword({
        email,
        password
      });

    if(error) throw error;

    if(!data.session)
      throw new Error("Login session তৈরি হয়নি।");

    currentUser=data.user;

    await loadApp();

  }catch(error){

    console.error(error);

    let message=error.message || "Login failed";

    if(
      message.toLowerCase()
      .includes("invalid login credentials")
    ){
      message="Email অথবা Password ভুল।";
    }

    if(
      message.toLowerCase()
      .includes("email not confirmed")
    ){
      message="আপনার Email এখনো Confirm করা হয়নি।";
    }

    if(
      message.toLowerCase()
      .includes("failed to fetch")
    ){
      message="Internet অথবা Supabase connection সমস্যা।";
    }

    authMsg("loginMsg",message);
  }
}

/* SIGNUP */
async function signup(){

  const name=$("signupName").value.trim();
  const email=$("signupEmail").value.trim();
  const password=$("signupPassword").value;

  authMsg("signupMsg","");

  if(!name || !email || !password){
    authMsg("signupMsg","সব তথ্য পূরণ করুন।");
    return;
  }

  if(password.length<6){
    authMsg(
      "signupMsg",
      "Password কমপক্ষে 6 অক্ষরের হতে হবে।"
    );
    return;
  }

  try{

    const {data,error} =
      await sb.auth.signUp({
        email,
        password,
        options:{
          data:{name:name}
        }
      });

    if(error) throw error;

    if(data.session){
      currentUser=data.user;
      await loadApp();
    }else{
      authMsg(
        "signupMsg",
        "Account তৈরি হয়েছে। Email Confirm করে Login করুন।",
        true
      );
    }

  }catch(error){

    console.error(error);
    authMsg("signupMsg",error.message);
  }
}

/* LOAD APP */
async function loadApp(){

  $("authPage").classList.add("hidden");
  $("app").classList.remove("hidden");

  if(darkMode)
    document.body.classList.add("dark");

  await ensureProfile();
  await loadCurrentProfile();

  showHome();
}

/* PROFILE */
async function ensureProfile(){

  if(!currentUser)return;

  try{

    const {data,error} =
      await sb
      .from("my social app")
      .select("*")
      .eq("id",currentUser.id)
      .maybeSingle();

    if(error)throw error;

    if(!data){

      const name =
        currentUser.user_metadata?.name ||
        currentUser.email?.split("@")[0] ||
        "User";

      await sb
        .from("my social app")
        .insert({
          id:currentUser.id,
          name:name
        });
    }

  }catch(error){
    console.log("Profile:",error.message);
  }
}

async function loadCurrentProfile(){

  if(!currentUser)return;

  const {data} =
    await sb
    .from("my social app")
    .select("*")
    .eq("id",currentUser.id)
    .maybeSingle();

  currentProfile=data || {
    name:currentUser.email?.split("@")[0]
  };

  $("topName").innerText =
    currentProfile.name || "User";

  $("topAvatar").src =
    currentProfile.profile_photo ||
    "https://placehold.co/100x100?text=User";
}

/* HOME */
async function showHome(){

  $("main").innerHTML=`

    <div class="card composer">

      <div class="row">
        <img class="avatar"
             src="${currentProfile?.profile_photo ||
             "https://placehold.co/100x100?text=User"}">

        <strong>
          ${currentProfile?.name || "You"}
        </strong>
      </div>

      <textarea
        id="postText"
        placeholder="What's on your mind?"></textarea>

      <input
        id="postImage"
        class="field"
        type="file"
        accept="image/*">

      <select id="postPrivacy" class="field">
        <option value="public">🌎 Public</option>
        <option value="friends">👥 Friends</option>
        <option value="only_me">🔒 Only Me</option>
      </select>

      <input
        id="postFeeling"
        class="field"
        placeholder="Feeling / Activity (optional)">

      <button
        class="mainBtn"
        onclick="submitPost()">
        Post
      </button>

    </div>

    <div id="feed">
      <div class="card">Loading posts...</div>
    </div>
  `;

  await loadPosts();
}

/* CREATE POST */
async function submitPost(){

  const text=$("postText").value.trim();
  const file=$("postImage").files[0];
  const privacy=$("postPrivacy").value;
  const feeling=$("postFeeling").value.trim();

  if(!text && !file){
    toast("Text অথবা Photo দিন।");
    return;
  }

  try{

    let image_url=null;

    if(file){

      const fileName =
        `${currentUser.id}/${Date.now()}_${file.name}`;

      const {error:uploadError} =
        await sb.storage
        .from("post-images")
        .upload(fileName,file);

      if(uploadError)throw uploadError;

      const {data:urlData} =
        sb.storage
        .from("post-images")
        .getPublicUrl(fileName);

      image_url=urlData.publicUrl;
    }

    const {error} =
      await sb
      .from("posts")
      .insert({
        user_id:currentUser.id,
        text:text,
        image_url:image_url,
        privacy:privacy,
        feeling:feeling || null
      });

    if(error)throw error;

    toast("Post published!");

    await showHome();

  }catch(error){

    console.error(error);
    toast(error.message);
  }
}

/* LOAD POSTS */
async function loadPosts(){

  const feed=$("feed");

  try{

    const {data,error} =
      await sb
      .from("posts")
      .select("*")
      .order("created_at",{ascending:false})
      .limit(50);

    if(error)throw error;

    if(!data || data.length===0){
      feed.innerHTML=
        `<div class="card">এখনো কোনো Post নেই।</div>`;
      return;
    }

    feed.innerHTML="";

    for(const post of data){

      let profile=null;

      try{

        const result=
          await sb
          .from("my social app")
          .select("*")
          .eq("id",post.user_id)
          .maybeSingle();

        profile=result.data;

      }catch(e){}

      let likeCount=0;
      let liked=false;

      try{

        const countResult =
          await sb
          .from("post_reactions")
          .select("*",{count:"exact",head:true})
          .eq("post_id",post.id);

        likeCount=countResult.count || 0;

        const mine =
          await sb
          .from("post_reactions")
          .select("id")
          .eq("post_id",post.id)
          .eq("user_id",currentUser.id)
          .maybeSingle();

        liked=!!mine.data;

      }catch(e){}

      const article=document.createElement("div");
      article.className="card";

      article.innerHTML=`

        <div class="row between">

          <div class="row">

            <img class="avatar"
              src="${profile?.profile_photo ||
              "https://placehold.co/100x100?text=User"}">

            <div>
              <strong>
                ${escapeHTML(
                  profile?.name || "User"
                )}
              </strong>

              <div class="small">
                ${formatDate(post.created_at)}
              </div>
            </div>

          </div>

          ${
            post.user_id===currentUser.id
            ? `
              <button
                class="grayBtn"
                style="border:0;padding:7px;border-radius:6px"
                onclick="deletePost(${post.id})">
                🗑️
              </button>
            `
            :""
          }

        </div>

        ${
          post.feeling
          ? `<div class="small">
              ${escapeHTML(post.feeling)}
             </div>`
          :""
        }

        ${
          post.text
          ? `<div class="postText">
              ${escapeHTML(post.text)}
             </div>`
          :""
        }

        ${
          post.image_url
          ? `<img class="postImg"
                  src="${post.image_url}">
             `
          :""
        }

        <div class="actions">

          <button
            onclick="likePost(${post.id})">
            ${liked?"❤️":"👍"}
            ${likeCount}
          </button>

          <button
            onclick="toggleComments(${post.id})">
            💬 Comment
          </button>

          <button
            onclick="sharePost('${escapeAttribute(
              post.text || "FriendBook Post"
            )}')">
            ↗ Share
          </button>

        </div>

        <div
          id="comments-${post.id}"
          class="hidden">
        </div>
      `;

      feed.appendChild(article);
    }

  }catch(error){

    console.error(error);

    feed.innerHTML=
      `<div class="card">
        Feed Error: ${escapeHTML(error.message)}
      </div>`;
  }
}

/* LIKE */
async function likePost(postId){

  try{

    const {data} =
      await sb
      .from("post_reactions")
      .select("id")
      .eq("post_id",postId)
      .eq("user_id",currentUser.id)
      .maybeSingle();

    if(data){

      await sb
      .from("post_reactions")
      .delete()
      .eq("id",data.id);

    }else{

      await sb
      .from("post_reactions")
      .insert({
        post_id:postId,
        user_id:currentUser.id,
        reaction:"like"
      });
    }

    await loadPosts();

  }catch(error){

    toast(error.message);
  }
}

/* COMMENTS */
async function toggleComments(postId){

  const box=$(`comments-${postId}`);

  if(!box.classList.contains("hidden")){
    box.classList.add("hidden");
    return;
  }

  box.classList.remove("hidden");

  box.innerHTML=`
    <div class="commentBox">
      <input
        id="commentInput-${postId}"
        placeholder="Write a comment...">

      <button
        class="mainBtn"
        style="width:auto;margin:0"
        onclick="addComment(${postId})">
        Send
      </button>
    </div>

    <div id="commentList-${postId}">
      Loading...
    </div>
  `;

  await loadComments(postId);
}

async function loadComments(postId){

  const list=$(`commentList-${postId}`);

  try{

    const {data,error} =
      await sb
      .from("comments")
      .select("*")
      .eq("post_id",postId)
      .order("created_at",{ascending:true});

    if(error)throw error;

    if(!data?.length){
      list.innerHTML=
        `<div class="small">No comments yet.</div>`;
      return;
    }

    list.innerHTML="";

    for(const comment of data){

      let name="User";

      try{

        const p =
          await sb
          .from("my social app")
          .select("name")
          .eq("id",comment.user_id)
          .maybeSingle();

        name=p.data?.name || "User";

      }catch(e){}

      const div=document.createElement("div");
      div.className="comment";

      div.innerHTML=
        `<strong>${escapeHTML(name)}</strong>
         <br>
         ${escapeHTML(comment.text)}`;

      list.appendChild(div);
    }

  }catch(error){

    list.innerText=error.message;
  }
}

async function addComment(postId){

  const input=$(`commentInput-${postId}`);
  const text=input.value.trim();

  if(!text)return;

  try{

    const {error} =
      await sb
      .from("comments")
      .insert({
        post_id:postId,
        user_id:currentUser.id,
        text:text
      });

    if(error)throw error;

    input.value="";

    await loadComments(postId);

  }catch(error){

    toast(error.message);
  }
}

/* SHARE */
async function sharePost(text){

  try{

    if(navigator.share){

      await navigator.share({
        title:"FriendBook",
        text:text
      });

    }else{

      await navigator.clipboard.writeText(text);
      toast("Post copied!");
    }

  }catch(e){}
}

/* DELETE */
async function deletePost(id){

  if(!confirm("এই Post Delete করবেন?"))
    return;

  try{

    const {error} =
      await sb
      .from("posts")
      .delete()
      .eq("id",id)
      .eq("user_id",currentUser.id);

    if(error)throw error;

    toast("Post deleted");
    await loadPosts();

  }catch(error){

    toast(error.message);
  }
}

/* PROFILE */

  await loadCurrentProfile();

    const a =
      await sb
      .from("follows")

    const b =
      await sb
      .from("follows")
      .select("*",{count:"exact",head:true})
      .eq("follower_id",currentUser.id);

  }catch(e){}

  $("main").innerHTML=`

    <div class="card" style="padding:0;overflow:hidden">

      <div class="profileCover">

        ${
          currentProfile?.cover_photo

          class="bigAvatar"

          ${escapeHTML(
            currentProfile?.name || "User"
          )}
        </div>

          ${currentUser.email}
        </div>

          <strong>${followers} Followers</strong>

async function editProfile(){

  const name=prompt(
    "Your Name:",
    currentProfile?.name || ""
  );

  if(name===null)return;

  const bio=prompt(
    "Bio:",
    currentProfile?.bio || ""
  );

  try{

    const {error} =
      await sb
      .from("my social app")
      .update({
        name:name,
        bio:bio
      })
      .eq("id",currentUser.id);

    if(error)throw error;

    await loadCurrentProfile();
    toast("Profile updated");
    await showProfile();

  }catch(error){

    toast(error.message);
  }
}

async function loadMyPosts(){

  const box=$("myPosts");

  const {data} =
    await sb
    .from("posts")
    .select("*")
    .eq("user_id",currentUser.id)
    .order("created_at",{ascending:false});

  if(!data?.length){

    box.innerHTML=
      `<div class="card">
        You haven't posted anything yet.
       </div>`;

    return;
  }

  box.innerHTML="";

  data.forEach(post=>{

    const div=document.createElement("div");
    div.className="card";

    div.innerHTML=`
      <div class="small">
        ${formatDate(post.created_at)}
      </div>

      ${
        post.text
        ? `<div class="postText">
             ${escapeHTML(post.text)}
           </div>`
        :""
      }

      ${
        post.image_url
        ? `<img class="postImg"
                 src="${post.image_url}">`
        :""
      }
    `;

    box.appendChild(div);
  });
}

/* SEARCH */
async function searchPeople(){

  const q=$("searchInput").value.trim();

  if(!q){
    showHome();
    return;
  }

  $("main").innerHTML=
    `<div class="card">Searching...</div>`;

  try{

    const {data,error} =
      await sb
      .from("my social app")
      .select("*")
      .ilike("name",`%${q}%`)
      .limit(30);

    if(error)throw error;

    $("main").innerHTML=`
      <div class="card">
        <h3>Search: ${escapeHTML(q)}</h3>
      </div>
    `;

    if(!data?.length){

      $("main").innerHTML+=
        `<div class="card">
          No people found.
         </div>`;

      return;
    }

    for(const person of data){

      const div=document.createElement("div");
      div.className="card";

      div.innerHTML=`

        <div class="row between">

          <div class="row">

            <img
              class="avatar"
              src="${person.profile_photo ||
              "https://placehold.co/100x100?text=User"}">

            <strong>
              ${escapeHTML(person.name || "User")}
            </strong>

          </div>

          ${
            person.id!==currentUser.id
            ? `<button
                 class="mainBtn"
                 style="width:auto"
                 onclick="toggleFollow('${person.id}')">
                 Follow
               </button>`
            :""
          }

        </div>
      `;

      $("main").appendChild(div);
    }

  }catch(error){

    $("main").innerHTML=
      `<div class="card">
        ${escapeHTML(error.message)}
       </div>`;
  }
}

/* FOLLOW */

      .from("follows")

/* REELS */
async function showReels(){

  $("reelsLayer").classList.remove("hidden");

  $("reelsList").innerHTML=
    `<div style="color:white;padding:30px">
      Loading Reels...
     </div>`;

  try{

    const {data,error} =
      await sb
      .from("reels")
      .select("*")
      .order("created_at",{ascending:false})
      .limit(30);

    if(error)throw error;

    if(!data?.length){

      $("reelsList").innerHTML=
        `<div style="color:white;padding:30px">
          No Reels available.
         </div>`;

      return;
    }

    $("reelsList").innerHTML="";

    data.forEach(reel=>{

      const div=document.createElement("div");
      div.className="reel";

      div.innerHTML=`

        <video
          src="${reel.video_url}"
          controls
          loop
          playsinline
          onclick="toggleVideoSound(this)">
        </video>

        <div class="reelInfo">

          <strong>FriendBook</strong>

          <div>
            ${escapeHTML(
              reel.caption || ""
            )}
          </div>

            ? `<div>🎵 ${

               }</div>`
            :""
          }

        </div>

          <button onclick="likeReel(${reel.id})">
            ❤️
          </button>

          <button onclick="sharePost('Check this Reel on FriendBook')">
            ↗
          </button>

          <button onclick="toggleVideoSound(this.closest('.reel').querySelector('video'))">
            🔊
          </button>

        </div>
      `;

      $("reelsList").appendChild(div);
    });

    observeReels();

  }catch(error){

    $("reelsList").innerHTML=
      `<div style="color:white;padding:30px">
        ${escapeHTML(error.message)}
       </div>`;
  }
}

function closeReels(){

  document
    .querySelectorAll(".reel video")
    .forEach(v=>{
      v.pause();
    });

  $("reelsLayer").classList.add("hidden");
}

function toggleVideoSound(video){

  video.muted=!video.muted;

  if(video.paused)
    video.play().catch(()=>{});
}

function observeReels(){

  const videos=
    document.querySelectorAll(".reel video");

  const observer=
    new IntersectionObserver(
      entries=>{
        entries.forEach(entry=>{

          if(entry.isIntersecting){

            entry.target.play()
              .catch(()=>{});

          }else{

            entry.target.pause();
          }

        });
      },
      {threshold:.7}
    );

  videos.forEach(v=>observer.observe(v));
}

/* MONETIZATION */
async function showMonetization(){

  $("main").innerHTML=`

    <div class="card">

      <h2>💰 Creator Dashboard</h2>

      <p>
        Creator Monetization
      </p>

      <button
        class="mainBtn"

      <div id="creatorStatus"

        Loading...

  `;

  try{

      await sb
      .from("creator_settings")
      .select("*")
      .eq("user_id",currentUser.id)
      .maybeSingle();

    $("creatorStatus").innerHTML=
      data?.monetization_enabled
      ? "✅ Monetization Enabled"
      : "❌ Monetization Disabled";

  }catch(error){

async function toggleMonetization(){

  try{

    const {data} =
      await sb
      .from("creator_settings")
      .select("*")
      .eq("user_id",currentUser.id)
      .maybeSingle();

    const enabled=
      !(data?.monetization_enabled);

    const {error} =
      await sb
      .from("creator_settings")
      .upsert({
        user_id:currentUser.id,
        monetization_enabled:enabled,
        updated_at:new Date().toISOString()
      });

    if(error)throw error;

    toast(
      enabled
      ? "Monetization Enabled"
      : "Monetization Disabled"
    );

    showMonetization();

  }catch(error){

    toast(error.message);
  }
}

/* LOGOUT */
async function logout(){

  await sb.auth.signOut();

  currentUser=null;
  currentProfile=null;

  $("app").classList.add("hidden");
  $("authPage").classList.remove("hidden");

  showLogin();
}

/* AUTH STATE */
sb.auth.onAuthStateChange(
  async (event,session)=>{

    if(session && !currentUser){

      currentUser=session.user;

      await loadApp();
    }

  }
);

/* START */
async function start(){

  if(darkMode)
    document.body.classList.add("dark");

  try{

    const {data} =
      await sb.auth.getSession();

    if(data.session){

      currentUser=data.session.user;

      await loadApp();

    }else{

      $("authPage").classList.remove("hidden");
    }

  }catch(error){

    console.error(error);

    $("authPage").classList.remove("hidden");
  }
}

/* HELPERS */
function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function escapeAttribute(value){

  return String(value ?? "")
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'")
    .replace(/"/g,"&quot;")
    .replace(/\n/g," ");
}

function formatDate(value){

  if(!value)return "";

  try{

    return new Date(value)
      .toLocaleString("bn-BD",{
        dateStyle:"medium",
        timeStyle:"short"
      });

  }catch(e){

    return "";
  }
}

start();
