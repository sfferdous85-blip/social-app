<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1877f2">
<title>FriendBook</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;background:#f0f2f5;color:#050505}
body.dark{background:#18191a;color:#e4e6eb}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
img,video{max-width:100%}

:root{
 --blue:#1877f2;
 --green:#42b72a;
 --bg:#f0f2f5;
 --card:#fff;
 --text:#050505;
 --muted:#65676b;
 --border:#dddfe2;
}

.dark{
 --bg:#18191a;
 --card:#242526;
 --text:#e4e6eb;
 --muted:#b0b3b8;
 --border:#3e4042;
}

.hidden{display:none!important}

.top{
 position:sticky;
 top:0;
 z-index:1000;
 height:58px;
 background:var(--card);
 border-bottom:1px solid var(--border);
 display:flex;
 align-items:center;
 gap:10px;
 padding:7px 12px;
}

.logo{
 font-size:25px;
 font-weight:800;
 color:var(--blue);
 white-space:nowrap;
}

.search{
 flex:1;
 max-width:420px;
 position:relative;
}

.search input{
 width:100%;
 border:0;
 outline:0;
 border-radius:22px;
 padding:11px 15px;
 background:#f0f2f5;
 color:#111;
}

.dark .search input{
 background:#3a3b3c;
 color:white;
}

.top-actions{
 margin-left:auto;
 display:flex;
 gap:7px;
}

.iconbtn{
 width:40px;
 height:40px;
 border:0;
 border-radius:50%;
 background:#e4e6eb;
}

.dark .iconbtn{background:#3a3b3c;color:white}

.layout{
 max-width:1400px;
 margin:auto;
 display:grid;
 grid-template-columns:230px minmax(300px,650px) 280px;
 gap:18px;
 padding:15px;
}

.left,.right{
 position:sticky;
 top:73px;
 height:max-content;
}

.menu{
 background:var(--card);
 border-radius:12px;
 overflow:hidden;
}

.menu button{
 width:100%;
 padding:13px 15px;
 border:0;
 background:none;
 text-align:left;
 color:var(--text);
 font-weight:600;
}

.menu button:hover{background:#e4e6eb}
.dark .menu button:hover{background:#3a3b3c}

.card{
 background:var(--card);
 border-radius:12px;
 margin-bottom:15px;
 padding:14px;
 box-shadow:0 1px 2px #0001;
}

.composer{
 display:flex;
 gap:10px;
}

.avatar{
 width:42px;
 height:42px;
 border-radius:50%;
 object-fit:cover;
 background:#ddd;
 flex:none;
}

.avatar.big{
 width:90px;
 height:90px;
}

.composer textarea{
 flex:1;
 border:0;
 resize:none;
 outline:0;
 border-radius:20px;
 padding:12px 15px;
 background:#f0f2f5;
 min-height:44px;
}

.dark .composer textarea{
 background:#3a3b3c;
 color:white;
}

.actionrow{
 display:flex;
 flex-wrap:wrap;
 gap:6px;
 margin-top:10px;
 border-top:1px solid var(--border);
 padding-top:10px;
}

.action{
 border:0;
 background:none;
 color:var(--muted);
 padding:8px 10px;
 border-radius:7px;
 font-weight:600;
}

.action:hover{background:#f0f2f5}
.dark .action:hover{background:#3a3b3c}

.primary{
 background:var(--blue)!important;
 color:white!important;
 border:0;
 border-radius:8px;
 padding:10px 16px;
 font-weight:700;
}

.green{
 background:var(--green)!important;
 color:white!important;
}

.post-head{
 display:flex;
 align-items:center;
 gap:10px;
}

.post-name{
 font-weight:700;
}

.post-time{
 color:var(--muted);
 font-size:12px;
}

.post-text{
 white-space:pre-wrap;
 margin:12px 0;
 line-height:1.5;
}

.post-image{
 width:100%;
 max-height:650px;
 object-fit:cover;
 border-radius:8px;
}

.stats{
 display:flex;
 justify-content:space-between;
 color:var(--muted);
 font-size:13px;
 padding:8px 2px;
 border-bottom:1px solid var(--border);
}

.post-actions{
 display:grid;
 grid-template-columns:repeat(3,1fr);
}

.commentbox{
 display:flex;
 gap:7px;
 margin-top:10px;
}

.commentbox input{
 flex:1;
 border:0;
 border-radius:20px;
 background:#f0f2f5;
 padding:10px 13px;
 outline:0;
}

.dark .commentbox input{
 background:#3a3b3c;
 color:white;
}

.comment{
 padding:8px 0;
 border-bottom:1px solid var(--border);
}

.comment b{display:block}
.comment small{color:var(--muted)}

.tabs{
 display:flex;
 gap:5px;
 overflow:auto;
 margin-bottom:10px;
}

.tab{
 border:0;
 padding:10px 15px;
 border-radius:8px;
 background:var(--card);
 color:var(--text);
 font-weight:700;
 white-space:nowrap;
}

.tab.active{
 background:var(--blue);
 color:white;
}

.page-title{
 font-size:22px;
 font-weight:800;
 margin-bottom:12px;
}

.profile-cover{
 height:190px;
 border-radius:12px 12px 0 0;
 background:linear-gradient(135deg,#1877f2,#7c4dff);
 background-size:cover;
 background-position:center;
}

.profile-main{
 background:var(--card);
 padding:15px;
 border-radius:0 0 12px 12px;
 margin-bottom:15px;
}

.profile-row{
 display:flex;
 gap:15px;
 align-items:center;
 margin-top:-55px;
}

.profile-info h2{margin:0}
.profile-info p{color:var(--muted)}

.grid2{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:12px;
}

.grid3{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:10px;
}

.statbox{
 background:var(--card);
 padding:18px;
 border-radius:10px;
 text-align:center;
}

.statbox strong{
 display:block;
 font-size:22px;
}

.form input,.form textarea,.form select{
 width:100%;
 margin-bottom:10px;
 padding:11px;
 border:1px solid var(--border);
 border-radius:8px;
 background:var(--card);
 color:var(--text);
}

.modal{
 position:fixed;
 inset:0;
 background:#0008;
 z-index:2000;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:15px;
}

.modalbox{
 width:min(600px,100%);
 max-height:90vh;
 overflow:auto;
 background:var(--card);
 color:var(--text);
 border-radius:12px;
 padding:18px;
}

.modalhead{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:15px;
}

.close{
 border:0;
 border-radius:50%;
 width:35px;
 height:35px;
 background:#e4e6eb;
}

.login{
 min-height:100vh;
 display:flex;
 justify-content:center;
 align-items:center;
 padding:20px;
 background:linear-gradient(135deg,#e8f1ff,#f0f2f5);
}

.dark .login{background:#18191a}

.loginbox{
 width:min(420px,100%);
 background:var(--card);
 padding:25px;
 border-radius:15px;
 box-shadow:0 5px 30px #0002;
}

.loginlogo{
 text-align:center;
 font-size:40px;
 font-weight:900;
 color:var(--blue);
 margin-bottom:5px;
}

.loginbox h2{text-align:center}

.reels{
 height:calc(100vh - 90px);
 overflow-y:auto;
 scroll-snap-type:y mandatory;
 border-radius:12px;
}

.reel{
 position:relative;
 height:calc(100vh - 90px);
 min-height:500px;
 background:#000;
 scroll-snap-align:start;
 overflow:hidden;
 margin-bottom:10px;
 border-radius:12px;
}

.reel video{
 width:100%;
 height:100%;
 object-fit:cover;
}

.reel-gradient{
 position:absolute;
 inset:0;
 background:linear-gradient(transparent 50%,#000b);
 pointer-events:none;
}

.reel-info{
 position:absolute;
 bottom:20px;
 left:15px;
 right:80px;
 color:white;
 z-index:3;
}

.reel-info b{font-size:17px}

.reel-caption{
 margin-top:8px;
 line-height:1.4;
}

.reel-buttons{
 position:absolute;
 right:12px;
 bottom:30px;
 z-index:4;
 display:flex;
 flex-direction:column;
 gap:14px;
}

.reel-buttons button{
 width:50px;
 height:50px;
 border:0;
 border-radius:50%;
 background:#0009;
 color:white;
 font-size:20px;
}

.reel-sound{
 position:absolute;
 right:15px;
 top:15px;
 z-index:4;
}

.reel-sound button{
 width:42px;
 height:42px;
 border:0;
 border-radius:50%;
 background:#0008;
 color:white;
}

.storyrow{
 display:flex;
 gap:10px;
 overflow:auto;
}

.story{
 width:105px;
 height:155px;
 flex:none;
 border-radius:12px;
 background:linear-gradient(135deg,#1877f2,#8e44ad);
 color:white;
 padding:10px;
 display:flex;
 align-items:flex-end;
 font-weight:bold;
}

.notice{
 background:#fff3cd;
 color:#664d03;
 padding:10px;
 border-radius:8px;
 margin-bottom:10px;
}

.dark .notice{
 background:#4d421d;
 color:#ffe69c;
}

.empty{
 text-align:center;
 color:var(--muted);
 padding:30px;
}

.chatlist{
 display:flex;
 flex-direction:column;
 gap:5px;
}

.chat{
 display:flex;
 align-items:center;
 gap:10px;
 padding:10px;
 border-radius:8px;
 cursor:pointer;
}

.chat:hover{background:#e4e6eb}
.dark .chat:hover{background:#3a3b3c}

.message{
 max-width:75%;
 padding:10px 13px;
 border-radius:16px;
 margin:5px;
}

.message.mine{
 margin-left:auto;
 background:var(--blue);
 color:white;
}

.message.theirs{
 background:#e4e6eb;
 color:#111;
}

.dark .message.theirs{
 background:#3a3b3c;
 color:white;
}

.toast{
 position:fixed;
 left:50%;
 bottom:25px;
 transform:translateX(-50%);
 background:#111;
 color:white;
 padding:12px 18px;
 border-radius:8px;
 z-index:5000;
 display:none;
}

.file-preview{
 max-height:250px;
 overflow:hidden;
 border-radius:10px;
 margin:8px 0;
}

.file-preview img,
.file-preview video{
 width:100%;
 max-height:250px;
 object-fit:contain;
}

@media(max-width:1050px){
 .layout{grid-template-columns:190px minmax(300px,1fr)}
 .right{display:none}
}

@media(max-width:700px){
 .top{height:55px}
 .logo{font-size:20px}
 .search{max-width:none}
 .top-actions .optional{display:none}
 .layout{
  display:block;
  padding:8px;
 }
 .left{display:none}
 .card{border-radius:9px}
 .reel,.reels{height:calc(100vh - 70px)}
 .grid2,.grid3{grid-template-columns:1fr}
 .profile-cover{height:150px}
}
</style>
</head>

<body>

<!-- =====================================================
 LOGIN
===================================================== -->

<div id="loginScreen" class="login">

<div class="loginbox">

<div class="loginlogo">FriendBook</div>
<p style="text-align:center;color:#65676b">
বন্ধু, Reels এবং Social Network
</p>

<div class="tabs">
<button class="tab active" onclick="showLoginTab('login')">Login</button>
<button class="tab" onclick="showLoginTab('signup')">Create Account</button>
</div>

<div id="loginForm" class="form">

<input id="loginEmail" type="email" placeholder="Email">

<input id="loginPassword" type="password" placeholder="Password">

<button class="primary" style="width:100%" onclick="login()">
Login
</button>

</div>

<div id="signupForm" class="form hidden">

<input id="signupName" placeholder="আপনার নাম">

<input id="signupUsername" placeholder="Username">

<input id="signupEmail" type="email" placeholder="Email">

<input id="signupPassword" type="password" placeholder="Password">

<button class="primary green" style="width:100%" onclick="signup()">
Create Account
</button>

</div>

</div>
</div>


<!-- =====================================================
APP
===================================================== -->

<div id="app" class="hidden">

<header class="top">

<div class="logo">FriendBook</div>

<div class="search">
<input id="searchInput"
placeholder="Search FriendBook..."
onkeydown="if(event.key==='Enter')doSearch()">
</div>

<div class="top-actions">

<button class="iconbtn optional" onclick="showPage('home')">🏠</button>

<button class="iconbtn" onclick="showPage('notifications')">🔔</button>

<button class="iconbtn" onclick="showPage('messages')">💬</button>

<button class="iconbtn" onclick="toggleDark()">🌙</button>

<button class="iconbtn" onclick="logout()">🚪</button>

</div>

</header>


<div class="layout">

<!-- LEFT -->

<aside class="left">

<div class="menu">

<button onclick="showPage('home')">🏠 Home</button>

<button onclick="showPage('reels')">🎬 Reels</button>

<button onclick="showPage('friends')">👥 Friends</button>

<button onclick="showPage('messages')">💬 Messenger</button>

<button onclick="showPage('notifications')">🔔 Notifications</button>

<button onclick="showPage('profile')">👤 Profile</button>

<button onclick="showPage('groups')">👨‍👩‍👧 Groups</button>

<button onclick="showPage('pages')">📄 Pages</button>

<button onclick="showPage('marketplace')">🛒 Marketplace</button>

<button onclick="showPage('events')">📅 Events</button>

<button onclick="showPage('creator')">💰 Creator</button>

<button onclick="showPage('settings')">⚙️ Settings</button>

</div>

</aside>


<!-- CENTER -->

<main id="content"></main>


<!-- RIGHT -->

<aside class="right">

<div class="card">

<div style="font-weight:800;margin-bottom:10px">
Shortcuts
</div>

<button class="action" onclick="openPostModal()">➕ Create Post</button>

<button class="action" onclick="openReelModal()">🎬 Create Reel</button>

<button class="action" onclick="showPage('friends')">👥 Find Friends</button>

<button class="action" onclick="showPage('marketplace')">🛒 Marketplace</button>

</div>

<div class="card">

<b>FriendBook</b>

<p style="color:var(--muted);font-size:13px">
আপনার Social Network।
</p>

</div>

</aside>

</div>
</div>


<!-- =====================================================
MODAL
===================================================== -->

<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()">

<div id="modalBox" class="modalbox"></div>

</div>

<div id="toast" class="toast"></div>


<script>

/* =====================================================
SUPABASE
===================================================== */

const SUPABASE_URL =
"https://skereuaizdczbvjplisi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_3R2otJA1zIlsMsTYxe1ocw_NAPY5O9x";

const db =
supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let me=null;
let currentPage="home";
let selectedChat=null;


/* =====================================================
HELPERS
===================================================== */

const $ = id => document.getElementById(id);

function toast(msg){

 const t=$("toast");

 t.textContent=msg;

 t.style.display="block";

 setTimeout(()=>{
  t.style.display="none";
 },2500);

}

function escapeHTML(str=""){

 return String(str)
 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;")
 .replaceAll("'","&#039;");

}

function formatDate(date){

 if(!date)return "";

 return new Date(date).toLocaleString("bn-BD",{
  dateStyle:"medium",
  timeStyle:"short"
 });

}

function avatarURL(p){

 return p?.profile_photo ||
 "https://ui-avatars.com/api/?name="+
 encodeURIComponent(p?.name||"User")+
 "&background=1877f2&color=fff";

}


/* =====================================================
AUTH
===================================================== */

async function signup(){

 const name=$("signupName").value.trim();
 const username=$("signupUsername").value.trim();
 const email=$("signupEmail").value.trim();
 const password=$("signupPassword").value;

 if(!name||!email||!password){

  toast("সব তথ্য দিন");

  return;
 }

 const {data,error}=await db.auth.signUp({
  email,
  password
 });

 if(error){

  toast(error.message);

  return;
 }

 if(data.user){

  await db.from("fb_profiles").insert({
   id:data.user.id,
   name,
   username:username||("user"+Date.now()),
   bio:"",
   profile_photo:"",
   cover_photo:""
  });

 }

 toast("Account তৈরি হয়েছে");

}

async function login(){

 const email=$("loginEmail").value.trim();
 const password=$("loginPassword").value;

 if(!email||!password){

  toast("Email এবং Password দিন");

  return;
 }

 const {error}=await db.auth.signInWithPassword({
  email,
  password
 });

 if(error){

  toast(error.message);

  return;
 }

 await init();

}

async function logout(){

 await db.auth.signOut();

 me=null;

 $("app").classList.add("hidden");

 $("loginScreen").classList.remove("hidden");

}

async function init(){

 const {data}=await db.auth.getSession();

 if(!data.session){

  $("loginScreen").classList.remove("hidden");
  $("app").classList.add("hidden");

  return;
 }

 me=data.session.user;

 $("loginScreen").classList.add("hidden");
 $("app").classList.remove("hidden");

 await loadMyProfile();

 showPage("home");

}

async function loadMyProfile(){

 const {data,error}=await db
 .from("fb_profiles")
 .select("*")
 .eq("id",me.id)
 .maybeSingle();

 if(!data && !error){

  await db.from("fb_profiles").insert({
   id:me.id,
   name:me.email?.split("@")[0]||"User",
   username:"user"+Date.now()
  });

 }

 window.myProfile=data;

}


/* =====================================================
LOGIN TABS
===================================================== */

function showLoginTab(type){

 if(type==="login"){

  $("loginForm").classList.remove("hidden");
  $("signupForm").classList.add("hidden");

 }else{

  $("loginForm").classList.add("hidden");
  $("signupForm").classList.remove("hidden");

 }

}


/* =====================================================
PAGE ROUTER
===================================================== */

function showPage(page){

 currentPage=page;

 if(page==="home")loadHome();
 else if(page==="reels")loadReels();
 else if(page==="friends")loadFriends();
 else if(page==="messages")loadMessages();
 else if(page==="notifications")loadNotifications();
 else if(page==="profile")loadProfile(me.id);
 else if(page==="groups")loadGroups();
 else if(page==="pages")loadPages();
 else if(page==="marketplace")loadMarketplace();
 else if(page==="events")loadEvents();
 else if(page==="creator")loadCreator();
 else if(page==="settings")loadSettings();
 else if(page==="search")doSearch();

 window.scrollTo(0,0);

}


/* =====================================================
HOME
===================================================== */

async function loadHome(){

 $("content").innerHTML=`

 <div class="tabs">

 <button class="tab active">Home</button>

 <button class="tab" onclick="showPage('reels')">🎬 Reels</button>

 <button class="tab" onclick="showPage('friends')">👥 Friends</button>

 <button class="tab" onclick="showPage('marketplace')">🛒 Marketplace</button>

 </div>

 <div class="card">

 <div class="composer">

 <img class="avatar"
 src="${avatarURL(window.myProfile)}">

 <textarea id="quickPost"
 placeholder="আপনার মনে কী আছে?"></textarea>

 </div>

 <div id="quickPreview"></div>

 <div class="actionrow">

 <button class="action" onclick="choosePostImage()">📷 Photo</button>

 <button class="action" onclick="openPostModal()">📝 Create Post</button>

 <button class="action" onclick="openPollModal()">📊 Poll</button>

 <button class="action" onclick="openFeelingModal()">😊 Feeling</button>

 <button class="primary" onclick="quickPost()">Post</button>

 </div>

 <input id="quickFile"
 type="file"
 accept="image/*,video/*"
 hidden
 onchange="previewQuickFile()">

 </div>

 <div class="card">

 <div class="storyrow">

 <div class="story" onclick="storyInfo()">
 ➕ Add Story
 </div>

 <div class="story">👤 Friends Story</div>

 <div class="story">🎨 Creator Story</div>

 <div class="story">📸 Photo Story</div>

 </div>

 </div>

 <div id="feed">
 <div class="empty">Feed loading...</div>
 </div>
 `;

 await loadFeed();

}


/* =====================================================
POST IMAGE
===================================================== */

function choosePostImage(){

 $("quickFile").click();

}

function previewQuickFile(){

 const file=$("quickFile").files[0];

 if(!file)return;

 const url=URL.createObjectURL(file);

 $("quickPreview").innerHTML=

 file.type.startsWith("video/")

 ? `<div class="file-preview">
 <video src="${url}" controls></video>
 </div>`

 : `<div class="file-preview">
 <img src="${url}">
 </div>`;

}


/* =====================================================
UPLOAD POST MEDIA
===================================================== */

async function uploadPostFile(file){

 if(!file)return null;

 const ext=(file.name.split(".").pop()||"jpg").toLowerCase();

 const path=
 `${me.id}/${Date.now()}-${crypto.randomUUID()}.${ext}`;

 const {error}=await db.storage
 .from("post-images")
 .upload(path,file,{
  contentType:file.type,
  upsert:false
 });

 if(error){

  toast("Upload failed: "+error.message);

  return null;
 }

 const {data}=db.storage
 .from("post-images")
 .getPublicUrl(path);

 return data.publicUrl;

}


/* =====================================================
QUICK POST
===================================================== */

async function quickPost(){

 const text=$("quickPost").value.trim();

 const file=$("quickFile").files[0];

 if(!text&&!file){

  toast("কিছু লিখুন অথবা ছবি দিন");

  return;
 }

 let image_url=null;

 if(file){

  image_url=await uploadPostFile(file);

  if(!image_url)return;

 }

 const {error}=await db.from("fb_posts").insert({
  user_id:me.id,
  text,
  image_url,
  privacy:"public",
  feeling:"",
  location:""
 });

 if(error){

  toast("Post failed: "+error.message);

  return;
 }

 toast("Post হয়েছে");

 loadHome();

}


/* =====================================================
POST MODAL
===================================================== */

function openPostModal(){

 $("modalBox").innerHTML=`

 <div class="modalhead">

 <h2>Create Post</h2>

 <button class="close" onclick="closeModal()">✕</button>

 </div>

 <div class="form">

 <textarea id="modalPostText"

async function reactPost(postId,reaction){

 const {data:old}=await db
 .from("fb_post_reactions")
 .select("*")
 .eq("post_id",postId)
 .eq("user_id",me.id)
 .maybeSingle();

 if(old){

  if(old.reaction===reaction){

   await db.from("fb_post_reactions")
   .delete()
   .eq("id",old.id);

  }else{

   await db.from("fb_post_reactions")
   .update({reaction})
   .eq("id",old.id);

  }

 }else{

  const {error}=await db.from("fb_post_reactions").insert({
   post_id:postId,
   user_id:me.id,
   reaction
  });

  if(error){

   return;
  }

 }

 loadHome();

}

/* =====================================================
REEL VIDEO
===================================================== */

function toggleReelVideo(video){

 if(video.paused)video.play();
 else video.pause();

}

function toggleMute(btn){

 const reel=btn.closest(".reel");

 const video=reel.querySelector("video");

 video.muted=!video.muted;

 btn.textContent=video.muted?"🔇":"🔊";

}

function setupReelObserver(){

 const videos=
 document.querySelectorAll(".reel video");

 const observer=new IntersectionObserver(entries=>{

  entries.forEach(entry=>{

   const video=entry.target;

   if(entry.isIntersecting){

    video.play().catch(()=>{});

    const reel=video.closest(".reel");

    const id=reel.dataset.reel;

    recordReelView(id);

   }else{

    video.pause();

   }

  });

 },{
  threshold:.7
 });

 videos.forEach(v=>observer.observe(v));

}

async function recordReelView(id){

 const {data}=await db
 .from("fb_reel_views")
 .select("id")
 .eq("reel_id",id)
 .eq("user_id",me.id)
 .maybeSingle();

 if(data)return;

 await db.from("fb_reel_views").insert({
  reel_id:Number(id),
  user_id:me.id
 });

 const {data:r}=await db
 .from("fb_reels")
 .select("views")
 .eq("id",id)
 .single();

 if(r){

  await db.from("fb_reels")
  .update({views:Number(r.views||0)+1})
  .eq("id",id);

 }

}

async function publishReel(){

 const file=$("reelFile").files[0];

 if(!file){

  toast("ভিডিও নির্বাচন করুন");

  return;
 }

 if(!file.type.startsWith("video/")){

  toast("শুধু ভিডিও");

  return;
 }

 const ext=(file.name.split(".").pop()||"mp4").toLowerCase();

 const path=
 `${me.id}/${Date.now()}-${crypto.randomUUID()}.${ext}`;

 toast("ভিডিও Upload হচ্ছে...");

 const {error:upErr}=await db.storage
 .from("reels")
 .upload(path,file,{
  contentType:file.type,
  upsert:false
 });

 if(upErr){

  toast("Upload failed: "+upErr.message);

  return;
 }

 const {data:urlData}=db.storage
 .from("reels")
 .getPublicUrl(path);

 const {error:dbErr}=await db
 .from("fb_reels")
 .insert({
  user_id:me.id,
  video_url:urlData.publicUrl,
  caption:$("reelCaption").value.trim(),
  audio_name:$("reelAudio").value.trim(),
  views:0
 });

 if(dbErr){

  toast("Reel save failed: "+dbErr.message);

  return;
 }

 closeModal();

 toast("🎬 Reel posted");

 showPage("reels");

}

  name:$("editName").value.trim(),
  username:$("editUsername").value.trim(),
  bio:$("editBio").value.trim(),
  profile_photo:$("editPhoto").value.trim(),
  cover_photo:$("editCover").value.trim(),
  updated_at:new Date().toISOString()
 };

 const {error}=await db
 .from("fb_profiles")
 .update(payload)
 .eq("id",me.id);

async function loadFriends(){

 const {data:incoming}=await db
 .from("fb_friend_requests")
 .select("*")
 .eq("receiver_id",me.id)
 .eq("status","pending")
 .order("created_at",{ascending:false});

 const {data:outgoing}=await db
 .from("fb_friend_requests")
 .select("*")
 .eq("sender_id",me.id)
 .eq("status","pending");

 const {data:friends}=await db
 .from("fb_friends")
 .select("*")
 .or(`user_id.eq.${me.id},friend_id.eq.${me.id}`);

 const ids=new Set();

 (incoming||[]).forEach(x=>ids.add(x.sender_id));
 (outgoing||[]).forEach(x=>ids.add(x.receiver_id));
 (friends||[]).forEach(x=>{
  ids.add(x.user_id);
  ids.add(x.friend_id);
 });

 ids.delete(me.id);

 let profiles=[];

 if(ids.size){

  const r=await db
  .from("fb_profiles")
  .select("*")
  .in("id",[...ids]);

  profiles=r.data||[];

 }

 const pm={};

 profiles.forEach(p=>pm[p.id]=p);

 $("content").innerHTML=`

 <div class="page-title">👥 Friends</div>

 <div class="card">

 <h3>Friend Requests</h3>

 ${incoming?.length
 ? incoming.map(r=>`

 <div class="chat">

 <img class="avatar"
 src="${avatarURL(pm[r.sender_id])}">

 <div style="flex:1">
 <b>${escapeHTML(pm[r.sender_id]?.name||"User")}</b>
 </div>

 <button class="primary"
 onclick="acceptFriend(${r.id},'${r.sender_id}')">
 Accept
 </button>

 <button class="action"
 onclick="rejectFriend(${r.id})">
 Reject
 </button>

 </div>
 `).join("")
 : `<div class="empty">No requests</div>`}

 </div>

 <div class="card">

 <h3>Friends</h3>

 ${[...(friends||[])]
 .map(f=>{

  const id=f.user_id===me.id?f.friend_id:f.user_id;

  return `

  <div class="chat">

  <img class="avatar"
  src="${avatarURL(pm[id])}">

  <div style="flex:1"
  onclick="loadProfile('${id}')">

  <b>${escapeHTML(pm[id]?.name||"User")}</b>

  </div>

  <button class="action"
  onclick="sendMessageTo('${id}')">
  💬
  </button>

  </div>

  `;

 }).join("")||`<div class="empty">No friends yet</div>`}

 </div>

 <div class="card">

 <h3>Find People</h3>

 <button class="primary"
 onclick="doSearch()">
 🔎 Search People
 </button>

 </div>
 `;

}

async function sendFriendRequest(userId){

 const {error}=await db.from("fb_friend_requests").insert({
  sender_id:me.id,
  receiver_id:userId,
  status:"pending"
 });

 if(error){

  toast(error.message);

  return;
 }

}

async function acceptFriend(requestId,userId){

 await db.from("fb_friend_requests")
 .update({status:"accepted"})
 .eq("id",requestId);

 await db.from("fb_friends").insert([
  {user_id:me.id,friend_id:userId},
  {user_id:userId,friend_id:me.id}
 ]);

 toast("Friend added");

 loadFriends();

}

async function rejectFriend(id){

 await db.from("fb_friend_requests")
 .update({status:"rejected"})
 .eq("id",id);

 loadFriends();

}

async function openChat(userId){

 selectedChat=userId;

 const {data:profile}=await db
 .from("fb_profiles")
 .select("*")
 .eq("id",userId)
 .maybeSingle();

 const {data:messages,error}=await db
 .from("fb_messages")
 .select("*")
 .or(
 `and(sender_id.eq.${me.id},receiver_id.eq.${userId}),and(sender_id.eq.${userId},receiver_id.eq.${me.id})`
 )
 .order("created_at",{ascending:true});

 if(error){

  toast(error.message);

  return;
 }

 let html=`

 <div style="display:flex;align-items:center;gap:10px">

 <img class="avatar"
 src="${avatarURL(profile)}">

 <b>${escapeHTML(profile?.name||"User")}</b>

 </div>

 <hr>

 <div style="min-height:300px;max-height:450px;overflow:auto">

 `;

 (messages||[]).forEach(m=>{

  html+=`

  <div class="message ${
   m.sender_id===me.id?"mine":"theirs"
  }">

  ${m.image_url
  ? `<img src="${escapeHTML(m.image_url)}">`
  : ""}

  ${escapeHTML(m.text||"")}

  <div style="font-size:10px;opacity:.7">
  ${formatDate(m.created_at)}
  </div>

  </div>
  `;

 });

 html+=`

 </div>

 <div class="commentbox">

 <input id="messageInput"
 placeholder="Write message..."
 onkeydown="if(event.key==='Enter')sendMessage()">

 <button class="primary"
 onclick="sendMessage()">
 Send
 </button>

 </div>

 `;

 $("chatWindow").innerHTML=html;

}

async function sendMessage(){

 const text=$("messageInput").value.trim();

 if(!text||!selectedChat)return;

 const {error}=await db.from("fb_messages").insert({
  sender_id:me.id,
  receiver_id:selectedChat,
  text,
  image_url:null,
  seen:false
 });

 if(error){

  toast(error.message);

  return;
 }

 openChat(selectedChat);

}

async function sendMessageTo(userId){

 showPage("messages");

 setTimeout(()=>{
  openChat(userId);
 },300);

}

  .in("id",ids);

  profiles=r.data||[];

 }

 $("modalBox").innerHTML=`

 <div class="modalhead">

 <h2>Blocked Users</h2>

 <button class="close"
 onclick="closeModal()">✕</button>

 </div>

 ${profiles.map(p=>`

 <div class="chat">

 <img class="avatar"
 src="${avatarURL(p)}">

 <div style="flex:1">
 ${escapeHTML(p.name)}
 </div>

 <button class="action"
 onclick="unblockUser('${p.id}')">
 Unblock
 </button>

 </div>

 `).join("")||

 `<div class="empty">No blocked users</div>`}

 `;

 openModal();

}

async function unblockUser(id){

 await db.from("fb_blocks")
 .delete()
 .eq("user_id",me.id)
 .eq("blocked_id",id);

 showBlocked();

}

async function reportContent(type,id){

 const reason=prompt("Report করার কারণ লিখুন:");

 if(!reason)return;

 const {error}=await db.from("fb_reports").insert({
  reporter_id:me.id,
  target_type:type,
  target_id:Number(id),

 });

 }

 toast("Report submitted");

}


/* =====================================================

===================================================== */

async function doSearch(){

 const q=$("searchInput").value.trim();

 if(!q){

  toast("Search লিখুন");

  return;
 }

 const pattern="%"+q+"%";

 const {data:people}=await db
 .from("fb_profiles")
 .select("*")
 .or(`name.ilike.${pattern},username.ilike.${pattern}`)
 .limit(20);

 const {data:posts}=await db
 .from("fb_posts")
 .select("*")
 .ilike("text",pattern)
 .limit(20);

 const {data:reels}=await db
 .from("fb_reels")
 .select("*")
 .ilike("caption",pattern)
 .limit(20);

 $("content").innerHTML=`

 <div class="page-title">
 🔎 Search: ${escapeHTML(q)}
 </div>

 <div class="card">

 <h3>People</h3>

 ${(people||[]).map(p=>`

 <div class="chat">

 <img class="avatar"
 src="${avatarURL(p)}">

 <div style="flex:1"
 onclick="loadProfile('${p.id}')">

 <b>${escapeHTML(p.name)}</b>

 <small style="display:block;color:var(--muted)">
 @${escapeHTML(p.username||"")}
 </small>

 </div>

 <button class="primary"
 onclick="sendFriendRequest('${p.id}')">
 Add Friend
 </button>

 </div>

 `).join("")||

 `<div class="empty">No people found</div>`}

 </div>

 <div class="card">

 <h3>Posts</h3>

 <div id="searchPosts"></div>

 </div>

 <div class="card">

 <h3>Reels</h3>

 ${(reels||[]).map(r=>`

 <div class="chat">

 🎬

 <div>

 <b>${escapeHTML(r.caption||"Reel")}</b>

 <small style="display:block;color:var(--muted)">
 ${Number(r.views||0)} views
 </small>

 </div>

 </div>

 `).join("")||

 `<div class="empty">No reels found</div>`}

 </div>

 `;

 const pm={};

 const ids=[...new Set((posts||[]).map(p=>p.user_id))];

 if(ids.length){

  const r=await db.from("fb_profiles")
  .select("*")
  .in("id",ids);

  (r.data||[]).forEach(p=>pm[p.id]=p);

 }

 let postHtml="";

 for(const p of (posts||[])){

  postHtml+=await renderPost(p,pm[p.user_id]);

 }

 $("searchPosts").innerHTML=
 postHtml||`<div class="empty">No posts found</div>`;

}

/* =====================================================
DOWNLOAD DATA
===================================================== */

async function downloadData(){

 const result={};

 const tables=[
  "fb_profiles",
  "fb_posts",
  "fb_comments",
  "fb_reels",
  "fb_messages",
  "fb_follows",
  "fb_friend_requests"
 ];

 for(const table of tables){

  const {data}=await db
  .from(table)
  .select("*");

  result[table]=data||[];

 }

 const blob=new Blob(
  [JSON.stringify(result,null,2)],
  {type:"application/json"}
 );

 const url=URL.createObjectURL(blob);

 const a=document.createElement("a");

 a.href=url;

 a.download="friendbook-data.json";

 a.click();

 URL.revokeObjectURL(url);

 toast("Data downloaded");

}
