<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1877f2">
<title>FriendBook</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
:root{
 --blue:#1877f2;
 --bg:#f0f2f5;
 --card:#fff;
 --text:#111;
 --muted:#65676b;
 --border:#dddfe2;
 --danger:#e41e3f;
}
body.dark{
 --bg:#18191a;
 --card:#242526;
 --text:#e4e6eb;
 --muted:#b0b3b8;
 --border:#3a3b3c;
}
body{
 margin:0;
 background:var(--bg);
 color:var(--text);
 font-family:Arial,"Noto Sans Bengali",sans-serif;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* AUTH */
#authPage{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
 background:linear-gradient(135deg,#e7f0ff,#f7f9fc);
}
.authBox{
 width:100%;
 max-width:420px;
 background:var(--card);
 border-radius:18px;
 padding:28px;
 box-shadow:0 8px 35px #0002;
}
.logo{
 text-align:center;
 color:var(--blue);
 font-size:42px;
 font-weight:800;
 margin-bottom:5px;
}
.tagline{
 text-align:center;
 color:var(--muted);
 margin-bottom:25px;
}
.authBox input{
 width:100%;
 padding:14px;
 margin:7px 0;
 border:1px solid var(--border);
 border-radius:10px;
 outline:none;
 background:var(--card);
 color:var(--text);
}
.authBox input:focus{border-color:var(--blue)}
.mainBtn{
 width:100%;
 border:0;
 border-radius:10px;
 padding:13px;
 background:var(--blue);
 color:white;
 font-weight:bold;
 margin-top:8px;
}
.secondaryBtn{
 width:100%;
 border:1px solid var(--border);
 border-radius:10px;
 padding:12px;
 background:var(--card);
 color:var(--text);
 margin-top:8px;
}
.authMsg{
 margin-top:12px;
 padding:10px;
 border-radius:8px;
 display:none;
 font-size:14px;
}
.authMsg.show{display:block}
.authMsg.error{background:#ffe5e9;color:#b00020}
.authMsg.success{background:#e5f8e9;color:#08752d}

/* HEADER */
header{
 position:sticky;
 top:0;
 z-index:100;
 height:62px;
 background:var(--card);
 border-bottom:1px solid var(--border);
 display:flex;
 align-items:center;
 padding:0 15px;
 gap:15px;
}
.headerLogo{
 color:var(--blue);
 font-weight:800;
 font-size:25px;
 white-space:nowrap;
}
.searchBox{
 flex:1;
 max-width:500px;
}
.searchBox input{
 width:100%;
 border:0;
 outline:0;
 background:var(--bg);
 padding:10px 15px;
 border-radius:22px;
 color:var(--text);
}
.headerActions{
 margin-left:auto;
 display:flex;
 gap:7px;
}
.iconBtn{
 width:42px;
 height:42px;
 border:0;
 border-radius:50%;
 background:var(--bg);
 color:var(--text);
}
.iconBtn:hover{background:var(--border)}

#app{
 min-height:100vh;
}
.layout{
 display:grid;
 grid-template-columns:240px minmax(0,680px) 280px;
 gap:20px;
 max-width:1250px;
 margin:auto;
 padding:20px 15px;
}
.sidebar{
 position:sticky;
 top:82px;
 height:max-content;
}
.sideBtn{
 width:100%;
 text-align:left;
 padding:13px 15px;
 border:0;
 border-radius:10px;
 background:transparent;
 color:var(--text);
 margin-bottom:3px;
 font-weight:600;
}
.sideBtn:hover,.sideBtn.active{background:var(--card)}
.card{
 background:var(--card);
 border-radius:12px;
 box-shadow:0 1px 2px #0001;
 margin-bottom:15px;
 overflow:hidden;
}
.cardPad{padding:15px}

/* COMPOSER */
.composer textarea{
 width:100%;
 min-height:70px;
 resize:none;
 border:0;
 outline:0;
 background:var(--bg);
 color:var(--text);
 padding:13px;
 border-radius:10px;
}
.composerBottom{
 display:flex;
 gap:8px;
 margin-top:10px;
}
.composerBottom input,.composerBottom select{
 flex:1;
 min-width:0;
 padding:10px;
 border:1px solid var(--border);
 border-radius:8px;
 background:var(--card);
 color:var(--text);
}
.postBtn{
 background:var(--blue);
 color:white;
 border:0;
 padding:10px 20px;
 border-radius:8px;
 font-weight:bold;
}

/* POST */
.postHead{
 display:flex;
 align-items:center;
 padding:13px 15px 5px;
 gap:10px;
}
.avatar{
 width:42px;
 height:42px;
 border-radius:50%;
 object-fit:cover;
 background:var(--bg);
}
.avatar.big{
 width:90px;
 height:90px;
}
.author{
 font-weight:bold;
}
.time{
 font-size:12px;
 color:var(--muted);
 margin-top:3px;
}
.postMenu{
 margin-left:auto;
}
.postBody{
 padding:8px 15px 10px;
 white-space:pre-wrap;
 word-break:break-word;
}
.postImg{
 width:100%;
 max-height:650px;
 object-fit:cover;
 display:block;
}
.stats{
 display:flex;
 justify-content:space-between;
 padding:8px 15px;
 color:var(--muted);
 font-size:13px;
 border-bottom:1px solid var(--border);
}
.actions{
 display:grid;
 grid-template-columns:repeat(3,1fr);
}
.action{
 border:0;
 background:transparent;
 color:var(--muted);
 padding:11px 5px;
 font-weight:bold;
}
.action:hover{background:var(--bg)}
.action.active{color:var(--blue)}
.reactionBar{
 display:flex;
 gap:5px;
 padding:7px 15px;
 flex-wrap:wrap;
 border-bottom:1px solid var(--border);
}
.reactBtn{
 border:0;
 background:var(--bg);
 border-radius:20px;
 padding:6px 10px;
}
.comments{
 padding:0 15px 12px;
}
.comment{
 display:flex;
 gap:8px;
 margin-top:10px;
}
.commentBubble{
 background:var(--bg);
 padding:8px 11px;
 border-radius:15px;
 max-width:85%;
}
.commentName{
 font-weight:bold;
 font-size:13px;
}
.commentText{
 font-size:14px;
 margin-top:2px;
}
.commentInput{
 display:flex;
 gap:7px;
 margin-top:10px;
}
.commentInput input{
 flex:1;
 padding:9px 12px;
 border:0;
 border-radius:20px;
 background:var(--bg);
 color:var(--text);
 outline:0;
}
.commentInput button{
 border:0;
 border-radius:20px;
 padding:0 15px;
 background:var(--blue);
 color:#fff;
}

/* STORY */
.storyRow{
 display:flex;
 gap:10px;
 overflow-x:auto;
 padding:12px;
}
.story{
 min-width:105px;
 height:150px;
 border-radius:12px;
 background:linear-gradient(145deg,#1877f2,#8b5cf6);
 color:#fff;
 display:flex;
 align-items:flex-end;
 padding:10px;
 font-weight:bold;
}

/* RIGHT */
.rightTitle{
 font-weight:bold;
 padding:15px;
}
.userMini{
 display:flex;
 align-items:center;
 gap:10px;
 padding:10px 15px;
}
.userMini button{
 margin-left:auto;
 background:var(--blue);
 color:#fff;
 border:0;
 border-radius:7px;
 padding:7px 10px;
}

/* PAGE */
.pageTitle{
 font-size:25px;
 font-weight:800;
 margin-bottom:15px;
}
.profileCover{
 height:230px;
 background:linear-gradient(135deg,#1877f2,#7c3aed);
 background-size:cover;
 background-position:center;
 position:relative;
}
.profileAvatar{
 position:absolute;
 left:25px;
 bottom:-50px;
 border:5px solid var(--card);
 border-radius:50%;
 width:110px;
 height:110px;
 object-fit:cover;
 background:var(--bg);
}
.profileInfo{
 padding:60px 20px 20px;
}
.profileName{
 font-size:25px;
 font-weight:800;
}
.profileBio{
 color:var(--muted);
 margin-top:5px;
}
.profileBtns{
 display:flex;
 gap:8px;
 margin-top:15px;
}
.smallBtn{
 padding:9px 14px;
 border:0;
 border-radius:8px;
 background:var(--blue);
 color:white;
}
.grayBtn{
 background:var(--bg);
 color:var(--text);
}

/* REELS */
.reelsContainer{
 max-width:500px;
 margin:auto;
}
.reel{
 background:#000;
 border-radius:12px;
 margin-bottom:15px;
 overflow:hidden;
 position:relative;
}
.reel video{
 width:100%;
 max-height:700px;
 display:block;
 object-fit:cover;
}
.reelInfo{
 padding:12px;
 color:#fff;
 background:#111;
}
.reelActions{
 display:flex;
 gap:7px;
 margin-top:10px;
}
.reelActions button{
 background:#222;
 color:#fff;
 border:0;
 border-radius:20px;
 padding:8px 13px;
}

/* MODAL */
.modalBg{
 position:fixed;
 inset:0;
 background:#0008;
 z-index:500;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:15px;
}
.modal{
 width:100%;
 max-width:520px;
 max-height:90vh;
 overflow:auto;
 background:var(--card);
 border-radius:14px;
 padding:20px;
}
.modalHeader{
 display:flex;
 align-items:center;
 justify-content:space-between;
 margin-bottom:15px;
}
.closeBtn{
 border:0;
 background:var(--bg);
 color:var(--text);
 border-radius:50%;
 width:35px;
 height:35px;
}
.modal input,.modal textarea,.modal select{
 width:100%;
 padding:11px;
 border:1px solid var(--border);
 border-radius:8px;
 margin:5px 0 10px;
 background:var(--card);
 color:var(--text);
}

/* CHAT */
.chatBox{
 height:500px;
 display:flex;
 flex-direction:column;
}
.chatMessages{
 flex:1;
 overflow:auto;
 padding:15px;
}
.chatMsg{
 max-width:75%;
 padding:9px 12px;
 border-radius:15px;
 margin-bottom:8px;
 background:var(--bg);
}
.chatMsg.me{
 margin-left:auto;
 background:var(--blue);
 color:white;
}
.chatSend{
 display:flex;
 gap:7px;
 padding:10px;
 border-top:1px solid var(--border);
}
.chatSend input{
 flex:1;
 border:0;
 outline:0;
 background:var(--bg);
 border-radius:20px;
 padding:10px 14px;
 color:var(--text);
}

/* SETTINGS */
.setting{
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:15px 0;
 border-bottom:1px solid var(--border);
}
.setting:last-child{border:0}

/* TOAST */
#toast{
 position:fixed;
 left:50%;
 bottom:25px;
 transform:translateX(-50%);
 background:#222;
 color:#fff;
 padding:11px 18px;
 border-radius:25px;
 z-index:1000;
 display:none;
}
#toast.show{display:block}

/* MOBILE */
@media(max-width:950px){
 .layout{grid-template-columns:70px minmax(0,680px)}
 .rightSide{display:none}
 .sideBtn{font-size:0;text-align:center}
 .sideBtn:first-letter{font-size:20px}
}
@media(max-width:700px){
 header{height:56px;padding:0 8px}
 .headerLogo{font-size:20px}
 .searchBox{display:none}
 .layout{
  display:block;
  padding:10px 5px 80px;
 }
 .sidebar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  top:auto;
  height:60px;
  background:var(--card);
  border-top:1px solid var(--border);
  z-index:200;
  display:flex;
  overflow-x:auto;
 }
 .sideBtn{
  min-width:75px;
  margin:0;
  font-size:11px;
  text-align:center;
  padding:8px 3px;
 }
 .sideBtn:first-letter{font-size:16px}
 .composerBottom{flex-wrap:wrap}
 .composerBottom input,.composerBottom select{min-width:45%}
 .profileCover{height:180px}
 .profileAvatar{width:90px;height:90px}
}
</style>
</head>

<body>

<!-- ================= AUTH ================= -->
<section id="authPage">
 <div class="authBox">

  <div class="logo">FriendBook</div>
  <div class="tagline">Connect with friends and share your world</div>

  <div id="loginForm">
   <input id="loginEmail" type="email" placeholder="Email">
   <input id="loginPassword" type="password" placeholder="Password">

   <button class="mainBtn" onclick="login()">Log In</button>

   <button class="secondaryBtn" onclick="showSignup()">
    Create new account
   </button>
  </div>

  <div id="signupForm" class="hidden">
   <input id="signupName" type="text" placeholder="Your name">
   <input id="signupEmail" type="email" placeholder="Email">
   <input id="signupPassword" type="password" placeholder="Password">

   <button class="mainBtn" onclick="signup()">Create Account</button>

   <button class="secondaryBtn" onclick="showLogin()">
    Already have an account? Login
   </button>
  </div>

  <div id="authMsg" class="authMsg"></div>

 </div>
</section>


<!-- ================= APP ================= -->
<div id="app" class="hidden">

<header>
 <div class="headerLogo">FriendBook</div>

 <div class="searchBox">
  <input id="globalSearch"
   placeholder="Search FriendBook..."
   onkeydown="if(event.key==='Enter')doSearch()">
 </div>

 <div class="headerActions">
  <button class="iconBtn" onclick="showHome()">⌂</button>
  <button class="iconBtn" onclick="showNotifications()">🔔</button>
  <button class="iconBtn" onclick="showMessenger()">💬</button>
  <button class="iconBtn" onclick="showProfile()">👤</button>
 </div>
</header>


<div class="layout">

<!-- SIDEBAR -->
<aside class="sidebar">

 <button class="sideBtn" onclick="showHome()">🏠 Home</button>
 <button class="sideBtn" onclick="showProfile()">👤 Profile</button>
 <button class="sideBtn" onclick="showFriends()">👥 Friends</button>
 <button class="sideBtn" onclick="showMessenger()">💬 Messenger</button>
 <button class="sideBtn" onclick="showReels()">🎬 Reels</button>
 <button class="sideBtn" onclick="showNotifications()">🔔 Notifications</button>
 <button class="sideBtn" onclick="showSearch()">🔎 Search</button>
 <button class="sideBtn" onclick="showCreator()">💰 Creator</button>
 <button class="sideBtn" onclick="showSettings()">⚙️ Settings</button>
 <button class="sideBtn" onclick="logout()">🚪 Logout</button>

</aside>


<!-- MAIN -->
<main id="mainContent"></main>


<!-- RIGHT -->
<aside class="rightSide">

 <div class="card">
  <div class="rightTitle">FriendBook</div>

  <div class="userMini">
   <img id="rightAvatar" class="avatar">
   <div>
    <div id="rightName">User</div>
    <small>Online</small>
   </div>
  </div>
 </div>

 <div class="card">
  <div class="rightTitle">Quick Menu</div>

  <div class="userMini">
   <span>🎬</span>
   <span>Reels</span>
  </div>

  <div class="userMini">
   <span>👥</span>
   <span>Friends</span>
  </div>

  <div class="userMini">
   <span>💰</span>
   <span>Creator</span>
  </div>
 </div>

</aside>

</div>
</div>


<!-- MODAL -->
<div id="modalBg" class="modalBg hidden" onclick="closeModal(event)">
 <div class="modal" onclick="event.stopPropagation()">

  <div class="modalHeader">
   <h3 id="modalTitle">FriendBook</h3>
   <button class="closeBtn" onclick="closeModal()">×</button>
  </div>

  <div id="modalBody"></div>

 </div>
</div>


<div id="toast"></div>


<script>

/* =========================================================
   SUPABASE CONFIG
========================================================= */

const SUPABASE_URL =
"https://skereuaizdczbvjplisi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_3R2otJA1zIlsMsTYxe1ocw_NAPY5O9x";

const sb =
window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);


/* =========================================================
   GLOBAL
========================================================= */

let session = null;
let currentUser = null;
let currentProfile = null;
let currentChatUser = null;

const $ = id => document.getElementById(id);


/* =========================================================
   HELPERS
========================================================= */

function toast(msg){
 const t=$("toast");
 t.innerText=msg;
 t.classList.add("show");

 setTimeout(()=>{
  t.classList.remove("show");
 },2500);
}

function escapeHTML(str=""){
 return String(str)
 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;")
 .replaceAll("'","&#039;");
}

function timeAgo(date){
 if(!date)return "";
 const sec=Math.floor((Date.now()-new Date(date))/1000);

 if(sec<60)return "এখনই";
 if(sec<3600)return Math.floor(sec/60)+" মিনিট আগে";
 if(sec<86400)return Math.floor(sec/3600)+" ঘণ্টা আগে";
 if(sec<604800)return Math.floor(sec/86400)+" দিন আগে";

 return new Date(date).toLocaleDateString();
}

function avatar(url){
 return url ||
 "https://ui-avatars.com/api/?name=FriendBook&background=1877f2&color=fff";
}

function closeModal(event){
 if(event && event.target!==$("modalBg"))return;
 $("modalBg").classList.add("hidden");
}

function openModal(title,html){
 $("modalTitle").innerText=title;
 $("modalBody").innerHTML=html;
 $("modalBg").classList.remove("hidden");
}


/* =========================================================
   AUTH UI
========================================================= */

function showLogin(){
 $("loginForm").classList.remove("hidden");
 $("signupForm").classList.add("hidden");
 clearAuthMsg();
}

function showSignup(){
 $("loginForm").classList.add("hidden");
 $("signupForm").classList.remove("hidden");
 clearAuthMsg();
}

function authMessage(msg,type="error"){
 const box=$("authMsg");
 box.innerText=msg;
 box.className="authMsg show "+type;
}

function clearAuthMsg(){
 $("authMsg").className="authMsg";
 $("authMsg").innerText="";
}


/* =========================================================
   LOGIN
========================================================= */

async function login(){

 clearAuthMsg();

 const email=$("loginEmail").value.trim();
 const password=$("loginPassword").value;

 if(!email || !password){
  authMessage("Email এবং Password দিন।");
  return;
 }

 const btn=document.querySelector("#loginForm .mainBtn");
 btn.disabled=true;
 btn.innerText="Logging in...";

 try{

  const {data,error}=await sb.auth.signInWithPassword({
   email,
   password
  });

  if(error)throw error;

  if(!data.session){
   throw new Error("Login session তৈরি হয়নি।");
  }

  session=data.session;
  currentUser=data.user;

  authMessage("Login successful!","success");

  await loadApp();

 }catch(error){

  console.error(error);

  let msg=error.message || "Login failed";

  if(msg.toLowerCase().includes("invalid login credentials")){
   msg="Email অথবা Password ভুল।";
  }

  if(msg.toLowerCase().includes("email not confirmed")){
   msg="Email এখনো confirm করা হয়নি। Supabase থেকে email confirm করুন।";
  }

  if(msg.toLowerCase().includes("failed to fetch")){
   msg="Internet অথবা Supabase connection সমস্যা।";
  }

  authMessage(msg);

 }finally{

  btn.disabled=false;
  btn.innerText="Log In";

 }

}


/* =========================================================
   SIGNUP
========================================================= */

async function signup(){

 clearAuthMsg();

 const name=$("signupName").value.trim();
 const email=$("signupEmail").value.trim();
 const password=$("signupPassword").value;

 if(!name || !email || !password){
  authMessage("সব তথ্য পূরণ করুন।");
  return;
 }

 if(password.length<6){
  authMessage("Password কমপক্ষে 6 অক্ষরের হতে হবে।");
  return;
 }

 const btn=document.querySelector("#signupForm .mainBtn");
 btn.disabled=true;
 btn.innerText="Creating...";

 try{

  const {data,error}=await sb.auth.signUp({
   email,
   password,
   options:{
    data:{
     name:name
    }
   }
  });

  if(error)throw error;

  if(data.session){

   session=data.session;
   currentUser=data.user;

   await ensureProfile(name);
   await loadApp();

  }else{

   authMessage(
    "Account তৈরি হয়েছে। আপনার email confirm করে তারপর Login করুন।",
    "success"
   );

  }

 }catch(error){

  console.error(error);

  authMessage(error.message || "Signup failed");

 }finally{

  btn.disabled=false;
  btn.innerText="Create Account";

 }

}


/* =========================================================
   PROFILE
========================================================= */

async function ensureProfile(name="FriendBook User"){

 if(!currentUser)return;

 const {data,error}=await sb
 .from("my social app")
 .select("*")
 .eq("id",currentUser.id)
 .maybeSingle();

 if(error){
  console.error(error);
  return;
 }

 if(!data){

  const {error:insertError}=await sb
   .from("my social app")
   .insert({
    id:currentUser.id,
    name:name || "FriendBook User",
    profile_photo:null,
    cover_photo:null
   });

  if(insertError){
   console.error(insertError);
  }

 }else{

  currentProfile=data;

 }

}


/* =========================================================
   LOAD APP
========================================================= */

async function loadApp(){

 $("authPage").classList.add("hidden");
 $("app").classList.remove("hidden");

 await ensureProfile(
  currentUser?.user_metadata?.name ||
  "FriendBook User"
 );

 await loadCurrentProfile();

 showHome();

}


/* =========================================================
   CURRENT PROFILE
========================================================= */

async function loadCurrentProfile(){

 if(!currentUser)return;

 const {data,error}=await sb
 .from("my social app")
 .select("*")
 .eq("id",currentUser.id)
 .maybeSingle();

 if(!error && data){
  currentProfile=data;

  $("rightName").innerText=
   data.name || "FriendBook User";

  $("rightAvatar").src=
   avatar(data.profile_photo);
 }

}


/* =========================================================
   LOGOUT
========================================================= */

async function logout(){

 await sb.auth.signOut();

 session=null;
 currentUser=null;
 currentProfile=null;

 $("app").classList.add("hidden");
 $("authPage").classList.remove("hidden");

 showLogin();

 toast("Logged out");

}


/* =========================================================
   HOME
========================================================= */

async function showHome(){

 setActive();

 $("mainContent").innerHTML=`

/* =========================================================
   UPLOAD IMAGE
========================================================= */

async function uploadImage(file,folder="posts"){

 if(!file)return null;

 const ext=file.name.split(".").pop();
 const path=
  currentUser.id+
  "/" +
  Date.now()+
  "."+
  ext;

 const {error}=await sb.storage
  .from("post-images")
  .upload(path,file,{
   upsert:false
  });

 if(error){
  console.error(error);
  throw new Error(
   "Image upload failed: "+error.message
  );
 }

 const {data}=sb.storage
  .from("post-images")
  .getPublicUrl(path);

 return data.publicUrl;

}


/* =========================================================
   CREATE POST
========================================================= */

async function submitPost(){

 const text=$("postText").value.trim();
 const file=$("postImage").files[0];
 const privacy=$("postPrivacy").value;
 const feeling=$("postFeeling").value;

 if(!text && !file){
  toast("Post-এর জন্য কিছু লিখুন অথবা ছবি দিন।");
  return;
 }

 try{

  toast("Posting...");

  let image=null;

  if(file){
   image=await uploadImage(file);
  }

  const {error}=await sb
   .from("posts")
   .insert({
    user_id:currentUser.id,
    text:text,
    image_url:image,
    privacy:privacy,
    feeling:feeling || null
   });

  if(error)throw error;

  $("postText").value="";
  $("postImage").value="";

  toast("Post published!");

  await loadPosts();

 }catch(error){

  console.error(error);
  toast(error.message || "Post failed");

 }

}

/* =========================================================
   REACTION
========================================================= */

async function reactPost(postId,reaction){

 const existing=await sb
  .from("post_reactions")
  .select("id,reaction")
  .eq("post_id",postId)
  .eq("user_id",currentUser.id)
  .maybeSingle();

 try{

  if(existing.data){

   if(existing.data.reaction===reaction){

    await sb
     .from("post_reactions")
     .delete()
     .eq("id",existing.data.id);

   }else{

    await sb
     .from("post_reactions")
     .update({reaction})
     .eq("id",existing.data.id);

   }

  }else{

   await sb
    .from("post_reactions")
    .insert({
     post_id:postId,
     user_id:currentUser.id,
     reaction
    });

  }

  await loadPosts();

 }catch(error){

  toast(error.message);

 }

}

  .order("created_at",{ascending:true});

   `<div>${escapeHTML(error.message)}</div>`;

  return;
 }

 let html="";

 for(const c of data || []){

  const p=await sb

   .maybeSingle();

  html+=`

   <div class="comment">

     src="${avatar(p.data?.profile_photo)}">

    <div class="commentBubble">

     </div>

async function addComment(postId){

 if(!input)return;

 const text=input.value.trim();

 if(!text)return;

  .from("comments")
  .insert({

   user_id:currentUser.id,

async function sharePost(postId){

 const url=location.href+"#post-"+postId;

 if(navigator.share){

  try{
   await navigator.share({
    title:"FriendBook",
    text:"Check this post on FriendBook",
    url
   });
  }catch(e){}

 }else{

  await navigator.clipboard.writeText(url);

 }

}

  .from("reel_likes")
  .select("id")
  .eq("reel_id",reelId)
  .eq("user_id",currentUser.id)
  .maybeSingle();

 if(existing.data){

  await sb
   .from("reel_likes")
   .delete()
   .eq("id",existing.data.id);

 }else{

  await sb
   .from("reel_likes")
   .insert({
    reel_id:reelId,
    user_id:currentUser.id
   });

 }

 loadReels();

}


/* =========================================================
   REEL COMMENT
========================================================= */

async function commentReel(reelId){

 const {data,error}=await sb
  .from("reel_comments")
  .select("*")
  .eq("reel_id",reelId)
  .order("created_at",{ascending:true});

 if(error){

  toast(error.message);
  return;

 }

 let html="";

 for(const c of data || []){

  html+=`

   <div style="padding:8px;background:var(--bg);border-radius:10px;margin-bottom:6px">

    <b>User</b><br>

    ${escapeHTML(c.text)}

   </div>

  `;

 }

 html+=`

  <input id="reelCommentInput"
   placeholder="Write comment..."
   style="width:100%;padding:11px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text)">

  <button class="smallBtn"
   style="width:100%;margin-top:8px"
   onclick="addReelComment(${reelId})">
   Send
  </button>
 `;

 openModal("Reel Comments",html);

}

async function addReelComment(reelId){

 const input=$("reelCommentInput");

 const text=input.value.trim();

 if(!text)return;

 const {error}=await sb
  .from("reel_comments")
  .insert({
   reel_id:reelId,
   user_id:currentUser.id,
   text
  });

 if(error){

  toast(error.message);
  return;

 }

 closeModal();
 toast("Comment added");
 loadReels();

}

async function shareReel(url){

 if(navigator.share){

  try{
   await navigator.share({
    title:"FriendBook Reel",
    url
   });
  }catch(e){}

 }else{

  await navigator.clipboard.writeText(url);
  toast("Reel link copied!");

 }

}


/* =========================================================
   MESSENGER
========================================================= */

async function showMessenger(){

 setActive();

 $("mainContent").innerHTML=`

  <div class="pageTitle">Messenger</div>

  <div class="card cardPad">

   <input id="chatSearch"
    style="width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text)"
    placeholder="Search person..."
    oninput="searchChatUsers()">

  </div>

  <div id="chatUsers"></div>

  <div id="chatArea"></div>
 `;

}

async function searchChatUsers(){

 const q=$("chatSearch").value.trim();

 if(q.length<2)return;

 const {data,error}=await sb
  .from("my social app")
  .select("*")
  .ilike("name","%"+q+"%")
  .limit(20);

 if(error)return;

 $("chatUsers").innerHTML="";

 for(const p of data || []){

  if(p.id===currentUser.id)continue;

  const div=document.createElement("div");
  div.className="card";

  div.innerHTML=`

   <div class="userMini"
    onclick="openChat('${p.id}','${escapeHTML(p.name || "User")}')">

    <img class="avatar"
     src="${avatar(p.profile_photo)}">

    <b>${escapeHTML(p.name || "User")}</b>

   </div>
  `;

  $("chatUsers").appendChild(div);

 }

}

async function openChat(userId,name){

 currentChatUser=userId;

 $("chatArea").innerHTML=`

  <div class="card">

   <div class="cardPad">
    <b>${escapeHTML(name)}</b>
   </div>

   <div class="chatBox">

    <div id="chatMessages"
     class="chatMessages">
     Loading...
    </div>

    <div class="chatSend">

     <input id="chatInput"
      placeholder="Write a message..."
      onkeydown="if(event.key==='Enter')sendMessage()">

     <button class="smallBtn"
      onclick="sendMessage()">
      Send
     </button>

    </div>

   </div>

  </div>
 `;

 await loadMessages();

}

async function loadMessages(){

 if(!currentChatUser)return;

 const {data,error}=await sb
  .from("messages")
  .select("*")
  .or(
   `and(sender_id.eq.${currentUser.id},receiver_id.eq.${currentChatUser}),and(sender_id.eq.${currentChatUser},receiver_id.eq.${currentUser.id})`
  )
  .order("created_at",{ascending:true});

 if(error){

  $("chatMessages").innerHTML=
   escapeHTML(error.message);

  return;

 }

 $("chatMessages").innerHTML="";

 for(const m of data || []){

  const div=document.createElement("div");

  div.className=
   "chatMsg "+(m.sender_id===currentUser.id?"me":"");

  div.innerText=m.text || "";

  $("chatMessages").appendChild(div);

 }

 $("chatMessages").scrollTop=
  $("chatMessages").scrollHeight;

}

async function sendMessage(){

 const input=$("chatInput");

 if(!input || !currentChatUser)return;

 const text=input.value.trim();

 if(!text)return;

 const {error}=await sb
  .from("messages")
  .insert({
   sender_id:currentUser.id,
   receiver_id:currentChatUser,
   text
  });

 if(error){

  toast(error.message);
  return;

 }

 input.value="";

 await loadMessages();

}


/* =========================================================
   NOTIFICATIONS
========================================================= */

async function showNotifications(){

 setActive();

 $("mainContent").innerHTML=`

  <div class="pageTitle">Notifications</div>

  <div id="notifications">
   Loading...
  </div>
 `;

 const {data,error}=await sb
  .from("notifications")
  .select("*")
  .eq("receiver_id",currentUser.id)
  .order("created_at",{ascending:false})
  .limit(50);

 if(error){

  $("notifications").innerHTML=
   `<div class="card cardPad">${escapeHTML(error.message)}</div>`;

  return;

 }

 if(!data?.length){

  $("notifications").innerHTML=
   `<div class="card cardPad">No notifications</div>`;

  return;

 }

 $("notifications").innerHTML="";

 for(const n of data){

  const div=document.createElement("div");
  div.className="card";

  div.innerHTML=`

   <div class="cardPad">

    <b>${escapeHTML(n.message || "Notification")}</b>

    <div class="time">
     ${timeAgo(n.created_at)}
    </div>

   </div>
  `;

  $("notifications").appendChild(div);

 }

}

   CREATOR / MONETIZATION
========================================================= */

 setActive();

 let settings=null;

 const result=await sb
  .from("creator_settings")
  .select("*")
  .eq("user_id",currentUser.id)
  .maybeSingle();

 settings=result.data;

 $("mainContent").innerHTML=`

  <div class="pageTitle">Creator Center</div>

  <div class="card">

   <div class="cardPad">

    <h3>💰 Monetization</h3>

    <div class="setting">

     <span>Monetization</span>

     <input id="monetization"
      type="checkbox"
      ${settings?.monetization_enabled?"checked":""}>

    </div>

    <input id="payoutEmail"
     placeholder="Payout Email"
     value="${escapeHTML(settings?.payout_email || "")}">

    <select id="payoutMethod">

     <option value="">Payout Method</option>
     <option value="bank">Bank</option>
     <option value="paypal">PayPal</option>
     <option value="other">Other</option>

    </select>

    <button class="smallBtn"
     style="width:100%"
     onclick="saveCreatorSettings()">
     Save Settings
    </button>

   </div>

  </div>

  <div class="card">

   <div class="cardPad">

    <h3>📊 Creator Statistics</h3>

    <p>Followers: Loading...</p>
    <p>Posts: Loading...</p>
    <p>Reels: Loading...</p>

   </div>

  </div>

 `;

}

async function saveCreatorSettings(){

 const monetization_enabled=
  $("monetization").checked;

 const payout_email=
  $("payoutEmail").value.trim();

 const payout_method=
  $("payoutMethod").value;

 const {error}=await sb
  .from("creator_settings")
  .upsert({
   user_id:currentUser.id,
   monetization_enabled,
   payout_email,
   payout_method,
   updated_at:new Date().toISOString()
  });

 if(error){

  toast(error.message);
  return;

 }

 toast("Creator settings saved");

}


/* =========================================================
   SETTINGS
========================================================= */

function showSettings(){

 setActive();

 const dark=
  localStorage.getItem("friendbook_dark")==="1";

 $("mainContent").innerHTML=`

  <div class="pageTitle">Settings</div>

  <div class="card cardPad">

   <div class="setting">

    <span>🌙 Dark Mode</span>

    <input type="checkbox"
     ${dark?"checked":""}
     onchange="toggleDark(this.checked)">

   </div>

   <div class="setting">

    <span>🔔 Notifications</span>

    <button class="smallBtn grayBtn"
     onclick="showNotifications()">
     Open
    </button>

   </div>

   <div class="setting">

    <span>👤 Edit Profile</span>

    <button class="smallBtn grayBtn"
     onclick="editProfile()">
     Edit
    </button>

   </div>

   <div class="setting">

    <span>💰 Creator Center</span>

    <button class="smallBtn grayBtn"
     onclick="showCreator()">
     Open
    </button>

   </div>

   <div class="setting">

    <span>🚪 Logout</span>

    <button class="smallBtn"
     style="background:#e41e3f"
     onclick="logout()">
     Logout
    </button>

   </div>

  </div>

 `;

}

function toggleDark(value){

 document.body.classList.toggle("dark",value);

 localStorage.setItem(
  "friendbook_dark",
  value?"1":"0"
 );

}


/* =========================================================
   NAV ACTIVE
========================================================= */

function setActive(){

}


/* =========================================================
   SESSION START
========================================================= */

async function start(){

 if(localStorage.getItem("friendbook_dark")==="1"){
  document.body.classList.add("dark");
 }

 const {data}=await sb.auth.getSession();

 if(data?.session){

  session=data.session;
  currentUser=data.session.user;

  await loadApp();

 }else{

  $("authPage").classList.remove("hidden");
  $("app").classList.add("hidden");

 }

}


/* =========================================================
   AUTH STATE
========================================================= */

sb.auth.onAuthStateChange(
 async (event,newSession)=>{

  if(newSession){

   session=newSession;
   currentUser=newSession.user;

   if($("app").classList.contains("hidden")){
    await loadApp();
   }

  }

 }
);


/* =========================================================
   START
========================================================= */

start();

</script>
