<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1877f2">
<title>My Social App</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f0f2f5;
 color:#111;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

header{
 position:sticky;
 top:0;
 z-index:100;
 height:58px;
 background:#1877f2;
 color:#fff;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 12px;
 box-shadow:0 2px 6px #0002;
}
.logo{font-size:21px;font-weight:bold}
.headerBtns{display:flex;gap:5px}
.headerBtns button{
 border:0;
 background:#ffffff22;
 color:#fff;
 border-radius:50%;
 width:40px;
 height:40px;
}

.container{
 max-width:700px;
 margin:auto;
 padding:12px 8px 75px;
}

.card{
 background:#fff;
 border-radius:12px;
 padding:12px;
 margin-bottom:10px;
 box-shadow:0 1px 3px #0001;
}

input,textarea,select{
 width:100%;
 padding:11px;
 border:1px solid #ddd;
 border-radius:8px;
 margin:5px 0;
 outline:none;
}
textarea{min-height:90px;resize:vertical}

.primary{
 width:100%;
 border:0;
 background:#1877f2;
 color:#fff;
 padding:11px;
 border-radius:8px;
 font-weight:bold;
 margin-top:6px;
}
.secondary{
 border:0;
 background:#e4e6eb;
 padding:9px 14px;
 border-radius:8px;
}
.danger{
 border:0;
 background:#e41e3f;
 color:#fff;
 padding:10px;
 border-radius:8px;
}

.nav{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 height:60px;
 background:#fff;
 border-top:1px solid #ddd;
 display:flex;
 justify-content:space-around;
 align-items:center;
 z-index:200;
}
.nav button{
 border:0;
 background:none;
 font-size:22px;
}
.nav small{
 display:block;
 font-size:10px;
}

.avatar{
 width:42px;
 height:42px;
 border-radius:50%;
 object-fit:cover;
 background:#ddd;
}
.userRow{
 display:flex;
 align-items:center;
 gap:9px;
}
.userName{font-weight:bold}
.muted{
 color:#65676b;
 font-size:13px;
}

.postImg{
 width:100%;
 max-height:550px;
 object-fit:cover;
 border-radius:10px;
 margin-top:8px;
}

.actions{
 display:flex;
 border-top:1px solid #eee;
 margin-top:8px;
}
.actions button{
 flex:1;
 border:0;
 background:#fff;
 padding:11px 3px;
}
.actions button:hover{
 background:#f0f2f5;
}

.comment{
 background:#f0f2f5;
 border-radius:12px;
 padding:8px 10px;
 margin:6px 0;
}

.reel{
 background:#000;
 color:#fff;
 border-radius:12px;
 overflow:hidden;
 margin-bottom:12px;
}
.reel video{
 width:100%;
 max-height:80vh;
 display:block;
 object-fit:contain;
 background:#000;
}
.reelInfo{padding:10px}

.profileCover{
 height:180px;
 background:#1877f2;
 background-size:cover;
 background-position:center;
}
.profileBox{
 padding:0 15px 15px;
 margin-top:-35px;
}
.profileBig{
 width:90px;
 height:90px;
 border-radius:50%;
 border:4px solid #fff;
 object-fit:cover;
}

.tabs{
 display:flex;
 gap:6px;
 overflow:auto;
 margin-bottom:10px;
}
.tabs button{
 white-space:nowrap;
 border:0;
 background:#fff;
 padding:9px 13px;
 border-radius:20px;
}

.login{
 max-width:430px;
 margin:50px auto;
 padding:20px;
}
.login h1{
 text-align:center;
 color:#1877f2;
}

.modal{
 position:fixed;
 inset:0;
 background:#0008;
 z-index:500;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:15px;
}
.modalBox{
 background:#fff;
 width:100%;
 max-width:500px;
 max-height:90vh;
 overflow:auto;
 border-radius:12px;
 padding:15px;
}

.toast{
 position:fixed;
 top:70px;
 left:50%;
 transform:translateX(-50%);
 background:#222;
 color:#fff;
 padding:10px 15px;
 border-radius:8px;
 z-index:1000;
}

.loading{
 text-align:center;
 padding:30px;
}

.errorBox{
 max-width:500px;
 margin:30px auto;
 background:#fff;
 padding:20px;
 border-radius:12px;
 color:#d00;
}

body.dark{
 background:#18191a;
 color:#e4e6eb;
}
body.dark .card,
body.dark .nav,
body.dark .modalBox,
body.dark .actions button{
 background:#242526;
 color:#e4e6eb;
}
body.dark input,
body.dark textarea,
body.dark select{
 background:#3a3b3c;
 color:#fff;
 border-color:#555;
}
body.dark .secondary{
 background:#3a3b3c;
 color:#fff;
}
body.dark .comment{
 background:#3a3b3c;
}
</style>
</head>

<body>

<div id="app"></div>

<div id="toast" class="toast hidden"></div>

<div id="modal" class="modal hidden">
 <div class="modalBox" id="modalContent"></div>
</div>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://skereuaizdczbvjplisi.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_3R2otJA1zIlsMsTYxe1ocw_NAPY5O9x";

const db=window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_ANON_KEY
);

let currentUser=null;
let currentProfile=null;


/* =====================================================
   HELPERS
===================================================== */

function $(id){
 return document.getElementById(id);
}

function esc(v){
 return String(v??"")
 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;")
 .replaceAll("'","&#039;");
}

function avatar(url){
 return url || "https://i.pravatar.cc/150";
}

function toast(msg){
 const t=$("toast");
 t.textContent=msg;
 t.classList.remove("hidden");
 setTimeout(()=>{
  t.classList.add("hidden");
 },2500);
}

function openModal(html){
 $("modalContent").innerHTML=html;
 $("modal").classList.remove("hidden");
}

function closeModal(){
 $("modal").classList.add("hidden");
}


/* =====================================================
   AUTH
===================================================== */

function showLogin(){

$("app").innerHTML=`

<div class="login card">

<h1>My Social App</h1>

<h3>Login</h3>

<input id="loginEmail"
type="email"
placeholder="Email">

<input id="loginPassword"
type="password"
placeholder="Password">

<button class="primary"
onclick="login()">
Login
</button>

<button class="secondary"
style="width:100%;margin-top:8px"
onclick="showSignup()">
Create new account
</button>

</div>
`;

}

function showSignup(){

$("app").innerHTML=`

<div class="login card">

<h1>My Social App</h1>

<h3>Create new account</h3>

<input id="signupName"
placeholder="Your name">

<input id="signupEmail"
type="email"
placeholder="Email">

<input id="signupPassword"
type="password"
placeholder="Password">

<button class="primary"
onclick="signup()">
Create Account
</button>

<button class="secondary"
style="width:100%;margin-top:8px"
onclick="showLogin()">
Back to Login
</button>

</div>
`;

}

async function signup(){

const name=$("signupName").value.trim();
const email=$("signupEmail").value.trim();
const password=$("signupPassword").value;

if(!name||!email||!password){
 toast("সব তথ্য দিন");
 return;
}

if(password.length<6){
 toast("Password কমপক্ষে ৬ অক্ষর হতে হবে");
 return;
}

const {data,error}=await db.auth.signUp({
 email,
 password
});

if(error){
 toast(error.message);
 return;
}

if(data.user){

const {error:profileError}=await db
.from("my social app")
.insert({
 id:data.user.id,
 name:name
});

if(profileError){
 console.log(profileError);
}

toast("Account তৈরি হয়েছে");

if(!data.session){
 alert("আপনার Email verify করুন, তারপর Login করুন।");
}

}

}

async function login(){

const email=$("loginEmail").value.trim();
const password=$("loginPassword").value;

if(!email||!password){
 toast("Email ও Password দিন");
 return;
}

const {data,error}=await db.auth.signInWithPassword({
 email,
 password
});

if(error){
 toast(error.message);
 return;
}

currentUser=data.user;

await startApp();

}

async function logout(){

await db.auth.signOut();

currentUser=null;
currentProfile=null;

showLogin();

}


/* =====================================================
   PROFILE
===================================================== */

async function loadProfile(){

if(!currentUser)return;

const {data,error}=await db
.from("my social app")
.select("*")
.eq("id",currentUser.id)
.maybeSingle();

if(error){
 console.log(error);
 return;
}

currentProfile=data;

if(!data){

const {data:p}=await db
.from("my social app")
.insert({
 id:currentUser.id,
 name:currentUser.email?.split("@")[0]||"User"
})
.select()
.single();

currentProfile=p;

}

}

function profileName(){
 return currentProfile?.name||
 currentUser?.email?.split("@")[0]||
 "User";
}

function profilePhoto(){
 return currentProfile?.profile_photo||
 "https://i.pravatar.cc/150";
}


/* =====================================================
   APP LAYOUT
===================================================== */

async function startApp(){

currentUser=await getUser();

if(!currentUser){
 showLogin();
 return;
}

await loadProfile();

renderLayout();

loadHome();

}

async function getUser(){

const {data}=await db.auth.getUser();

return data?.user||null;

}

function renderLayout(){

$("app").innerHTML=`

<header>

<div class="logo">
My Social App
</div>

<div class="headerBtns">

<button onclick="searchUsers()">🔍</button>

<button onclick="showNotifications()">🔔</button>

<button onclick="showSettings()">⚙️</button>

</div>

</header>

<main class="container" id="page"></main>

<nav class="nav">

<button onclick="loadHome()">
🏠
<small>Home</small>
</button>

<button onclick="loadReels()">
🎬
<small>Reels</small>
</button>

<button onclick="createPost()">
➕
<small>Post</small>
</button>

<button onclick="loadProfilePage(currentUser.id)">
👤
<small>Profile</small>
</button>

<button onclick="showFriends()">
👥
<small>Friends</small>
</button>

</nav>
`;

}


/* =====================================================
   HOME
===================================================== */

async function loadHome(){

$("page").innerHTML=`

<div class="tabs">

<button onclick="loadHome()">
🏠 Home
</button>

<button onclick="loadReels()">
🎬 Reels
</button>

<button onclick="showFriends()">
👥 Friends
</button>

</div>

<div class="card">

<div class="userRow">

<img class="avatar"
src="${avatar(profilePhoto())}">

<div style="flex:1">

<button class="secondary"
style="width:100%;text-align:left"
onclick="createPost()">

What's on your mind?

</button>

</div>

</div>

</div>

<div id="feed">
<div class="loading">
Loading posts...
</div>
</div>

`;

const {data,error}=await db
.from("posts")
.select("*")
.order("created_at",{ascending:false})
.limit(50);

if(error){

$("feed").innerHTML=`

<div class="card">

<b>Post load error</b>

<p>${esc(error.message)}</p>

</div>
`;

return;
}

if(!data?.length){

$("feed").innerHTML=`

<div class="card">
<h3>No posts yet</h3>
<p>আপনার প্রথম পোস্ট করুন।</p>
</div>

`;

return;
}

$("feed").innerHTML="";

for(const post of data){

await renderPost(post);

}

}


/* =====================================================
   CREATE POST
===================================================== */

function createPost(){

openModal(`

<h3>📝 Create Post</h3>

<textarea id="postText"
placeholder="What's on your mind?"></textarea>

<input id="postImage"
placeholder="Image URL (optional)">

<select id="postFeeling">

<option value="">Feeling</option>
<option>😊 Happy</option>
<option>😍 Love</option>
<option>😢 Sad</option>
<option>😎 Cool</option>
<option>🔥 Excited</option>

</select>

<select id="postPrivacy">

<option value="public">Public</option>
<option value="friends">Friends</option>
<option value="only_me">Only me</option>

</select>

<button class="primary"
onclick="submitPost()">
Post
</button>

<button class="secondary"
style="width:100%;margin-top:8px"
onclick="closeModal()">
Cancel
</button>

`);

}

async function submitPost(){

const text=$("postText").value.trim();
const image=$("postImage").value.trim();
const feeling=$("postFeeling").value;
const privacy=$("postPrivacy").value;

if(!text&&!image){
 toast("Text অথবা Image দিন");
 return;
}

const {error}=await db
.from("posts")
.insert({
 user_id:currentUser.id,
 text:text,
 image_url:image||null,
 privacy:privacy,
 feeling:feeling||null
});

if(error){

toast(error.message);
console.log(error);

return;
}

closeModal();

toast("Post হয়েছে");

loadHome();

}


/* =====================================================
   POST RENDER
===================================================== */

async function renderPost(post){

let name="User";
let photo="https://i.pravatar.cc/150";

const {data:p}=await db
.from("my social app")
.select("name,profile_photo")
.eq("id",post.user_id)
.maybeSingle();

if(p){

name=p.name||name;
photo=p.profile_photo||photo;

}


/* ---------- LIKES ---------- */

let likes=[];
let likeCount=0;
let liked=false;

const likeResult=await db
.from("post_reactions")
.select("id,user_id,reaction")
.eq("post_id",post.id);

if(!likeResult.error){

likes=likeResult.data||[];

likeCount=likes.length;

liked=likes.some(
 x=>x.user_id===currentUser.id
);

}


/* ---------- COMMENTS ---------- */

const commentResult=await db
.from("comments")
.select("id,post_id,user_id,text,created_at")
.eq("post_id",post.id)
.order("created_at",{ascending:true});

const comments=commentResult.error?
[]:
(commentResult.data||[]);

const commentCount=comments.length;


/* ---------- COMMENT HTML ---------- */

let commentsHTML="";

for(const c of comments){

let cname="User";

const {data:cp}=await db
.from("my social app")
.select("name,profile_photo")
.eq("id",c.user_id)
.maybeSingle();

if(cp?.name)cname=cp.name;

commentsHTML+=`

<div class="comment">

<b>${esc(cname)}</b>

<div>${esc(c.text)}</div>

<div class="muted">
${new Date(c.created_at).toLocaleString()}
</div>

</div>

`;

}


/* ---------- POST ---------- */

const html=`

<div class="card"
id="post-${post.id}">

<div class="userRow">

<img class="avatar"
src="${avatar(photo)}">

<div style="flex:1">

<div class="userName">
${esc(name)}
</div>

<div class="muted">
${new Date(post.created_at).toLocaleString()}
</div>

</div>

</div>


${post.text?`
<p>${esc(post.text)}</p>
`:""}


${post.feeling?`
<div>${esc(post.feeling)}</div>
`:""}


${post.image_url?`

<img class="postImg"
src="${esc(post.image_url)}"
onerror="this.style.display='none'">

`:""}


<div class="muted"
style="margin-top:8px">

❤️ ${likeCount}
&nbsp;&nbsp;
💬 ${commentCount}

</div>


<div class="actions">

<button onclick="likePost(${post.id})">

${liked?"❤️":"👍"} Like

</button>

<button onclick="toggleCommentBox(${post.id})">

💬 Comment

</button>

<button onclick="sharePost(${post.id})">

↗ Share

</button>

</div>


<div id="comment-area-${post.id}"
class="${comments.length?'':'hidden'}">

${commentsHTML}

<div style="display:flex;gap:5px">

<input
id="comment-input-${post.id}"
placeholder="Write a comment..."
style="margin:5px 0">

<button class="primary"
style="width:auto;padding:9px 14px"
onclick="addComment(${post.id})">
Send
</button>

</div>

</div>


</div>
`;

$("feed").insertAdjacentHTML(
"beforeend",
html
);

}


/* =====================================================
   LIKE
===================================================== */

async function likePost(postId){

const {data,error}=await db
.from("post_reactions")
.select("id")
.eq("post_id",postId)
.eq("user_id",currentUser.id)
.maybeSingle();

if(error){

toast(error.message);
console.log(error);
return;

}

if(data){

const {error:deleteError}=await db
.from("post_reactions")
.delete()
.eq("id",data.id);

if(deleteError){
 toast(deleteError.message);
 return;
}

}else{

const {error:insertError}=await db
.from("post_reactions")
.insert({
 post_id:postId,
 user_id:currentUser.id,
 reaction:"like"
});

if(insertError){
 toast(insertError.message);
 return;
}

}

loadHome();

}


/* =====================================================
   COMMENT BOX
===================================================== */

function toggleCommentBox(postId){

const box=$("comment-area-"+postId);

if(!box)return;

box.classList.toggle("hidden");

if(!box.classList.contains("hidden")){

const input=$("comment-input-"+postId);

if(input){
 setTimeout(()=>{
  input.focus();
 },100);
}

}

}


/* =====================================================
   ADD COMMENT
===================================================== */

async function addComment(postId){

const input=$("comment-input-"+postId);

if(!input){

toast("Comment box পাওয়া যায়নি");
return;

}

const text=input.value.trim();

if(!text){

toast("Comment লিখুন");
return;

}


/* IMPORTANT:
   comments table uses column: text
*/

const {data,error}=await db
.from("comments")
.insert({
 post_id:postId,
 user_id:currentUser.id,
 text:text
})
.select()
.single();

if(error){

console.error("COMMENT ERROR:",error);

toast("Comment হয়নি: "+error.message);

return;

}

toast("Comment হয়েছে ❤️");

input.value="";

/* Reload feed so comment count + comment list update */

loadHome();

}


/* =====================================================
   SHARE
===================================================== */

async function sharePost(postId){

const url=
location.href.split("#")[0]+
"#post-"+postId;

if(navigator.share){

try{

await navigator.share({
 title:"My Social App",
 text:"Check this post",
 url:url
});

}catch(e){}

}else{

try{

await navigator.clipboard.writeText(url);

toast("Post link copied");

}catch(e){

toast(url);

}

}

}


/* =====================================================
   REELS
===================================================== */

async function loadReels(){

$("page").innerHTML=`

<div class="card">

<h3>🎬 Reels</h3>

<input id="reelVideo"
placeholder="Video URL">

<input id="reelCaption"
placeholder="Caption">

<button class="primary"
onclick="uploadReel()">
Publish Reel
</button>

</div>

<div id="reelsList">

<div class="loading">
Loading reels...
</div>

</div>
`;

const {data,error}=await db
.from("reels")
.select("*")
.order("created_at",{ascending:false})
.limit(30);

if(error){

$("reelsList").innerHTML=`

<div class="card">
${esc(error.message)}
</div>

`;

return;
}

if(!data?.length){

$("reelsList").innerHTML=`

<div class="card">
No reels yet.
</div>

`;

return;
}

$("reelsList").innerHTML="";

for(const reel of data){

let likes=0;
let liked=false;

const {data:rl}=await db
.from("reel_likes")
.select("user_id")
.eq("reel_id",reel.id);

if(rl){

likes=rl.length;

liked=rl.some(
x=>x.user_id===currentUser.id
);

}

$("reelsList").insertAdjacentHTML(
"beforeend",

`

<div class="reel">

<video
src="${esc(reel.video_url)}"
controls
loop
playsinline
preload="metadata">
</video>

<div class="reelInfo">

<b>${esc(reel.caption||"")}</b>

<br><br>

<button class="secondary"
onclick="likeReel(${reel.id})">

${liked?"❤️":"🤍"} ${likes}

</button>

<button class="secondary"
onclick="commentReel(${reel.id})">

💬 Comment

</button>

</div>

</div>

`

);

}

}

async function uploadReel(){

const video=$("reelVideo").value.trim();
const caption=$("reelCaption").value.trim();

if(!video){

toast("Video URL দিন");

return;

}

const {error}=await db
.from("reels")
.insert({
 user_id:currentUser.id,
 video_url:video,
 caption:caption
});

if(error){

toast(error.message);

return;

}

toast("Reel published");

loadReels();

}

async function likeReel(reelId){

const {data,error}=await db
.from("reel_likes")
.select("id")
.eq("reel_id",reelId)
.eq("user_id",currentUser.id)
.maybeSingle();

if(error){

toast(error.message);
return;

}

if(data){

await db
.from("reel_likes")
.delete()
.eq("id",data.id);

}else{

await db
.from("reel_likes")
.insert({
 reel_id:reelId,
 user_id:currentUser.id
});

}

loadReels();

}


/* =====================================================
   REEL COMMENTS
===================================================== */

async function commentReel(reelId){

openModal(`

<h3>💬 Reel Comments</h3>

<div id="reelComments">
Loading...
</div>

<div style="display:flex;gap:5px">

<input id="reelCommentInput"
placeholder="Write comment...">

<button class="primary"
style="width:auto"
onclick="addReelComment(${reelId})">
Send
</button>

</div>

`);

const {data,error}=await db
.from("reel_comments")
.select("*")
.eq("reel_id",reelId)

/* =====================================================
   PROFILE
===================================================== */

async function loadProfilePage(userId){

const {data:p}=await db
.from("my social app")
.select("*")
.eq("id",userId)
.maybeSingle();

const name=p?.name||"User";
const photo=p?.profile_photo||
"https://i.pravatar.cc/200";
const cover=p?.cover_photo||"";

const {count:followerCount}=await db
.from("follows")
.select("*",{count:"exact",head:true})
.eq("following_id",userId);

const {count:followingCount}=await db
.from("follows")
.select("*",{count:"exact",head:true})
.eq("follower_id",userId);

$("page").innerHTML=`

<div class="card"
style="padding:0;overflow:hidden">

<div class="profileCover"
style="background-image:url('${esc(cover)}')">
</div>

<div class="profileBox">

<img class="profileBig"
src="${avatar(photo)}">

<h2>${esc(name)}</h2>

<div>

Followers:
${followerCount||0}

&nbsp;&nbsp;

Following:
${followingCount||0}

</div>

${userId!==currentUser.id?`

<button class="primary"
onclick="toggleFollow('${userId}')">

Follow / Unfollow

</button>

`:`

<button class="secondary"
onclick="editProfile()">

Edit Profile

</button>

`}

</div>

</div>

<div class="card">

<h3>Posts</h3>

<div id="profilePosts">
Loading...
</div>

</div>
`;

const {data:posts}=await db
.from("posts")
.select("*")
.eq("user_id",userId)
.order("created_at",{ascending:false})
.limit(30);

if(!posts?.length){

$("profilePosts").innerHTML=
"No posts yet.";

return;

}

$("profilePosts").innerHTML="";

for(const post of posts){

$("profilePosts").insertAdjacentHTML(
"beforeend",

`

<div class="card">

${post.text?
`<p>${esc(post.text)}</p>`:""}

${post.image_url?
`<img class="postImg" src="${esc(post.image_url)}">`
:""}

<div class="muted">

${new Date(post.created_at).toLocaleString()}

</div>

</div>

`

);

}

}


/* =====================================================
   FOLLOW
===================================================== */

async function toggleFollow(userId){

const {data,error}=await db
.from("follows")
.select("id")
.eq("follower_id",currentUser.id)
.eq("following_id",userId)
.maybeSingle();

if(error){

toast(error.message);
return;

}

if(data){

await db
.from("follows")
.delete()
.eq("id",data.id);

toast("Unfollowed");

}else{

await db
.from("follows")
.insert({
 follower_id:currentUser.id,
 following_id:userId
});

toast("Followed");

}

loadProfilePage(userId);

}
