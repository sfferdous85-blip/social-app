<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Social App</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f0f2f5;
    color:#222;
}

button{
    border:0;
    padding:10px 14px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

input,textarea{
    width:100%;
    padding:12px;
    margin:6px 0;
    border:1px solid #ddd;
    border-radius:8px;
    outline:none;
    background:white;
}

textarea{
    resize:none;
    height:80px;
}

img{
    max-width:100%;
}

.hidden{
    display:none!important;
}

.blue{
    background:#1877f2;
    color:white;
}

.green{
    background:#42b72a;
    color:white;
}

.red{
    background:#e41e3f;
    color:white;
}

.gray{
    background:#e4e6eb;
    color:#222;
}

/* AUTH */

#authPage{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.authBox{
    width:100%;
    max-width:420px;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 25px rgba(0,0,0,.1);
}

.authBox h1{
    text-align:center;
    color:#1877f2;
    margin-top:0;
}

.authBox h2{
    text-align:center;
}

.authBox button{
    width:100%;
    margin-top:8px;
}

.authMsg{
    text-align:center;
    margin-top:10px;
    color:#e41e3f;
}

/* APP */

#app{
    min-height:100vh;
}

.topbar{
    background:#1877f2;
    color:white;
    padding:10px 15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:21px;
    font-weight:bold;
}

.topActions{
    display:flex;
    gap:6px;
}

.topActions button{
    padding:8px 10px;
}

.navbar{
    background:white;
    display:flex;
    justify-content:center;
    gap:5px;
    padding:8px;
    position:sticky;
    top:55px;
    z-index:90;
    box-shadow:0 1px 3px rgba(0,0,0,.1);
}

.navbar button{
    background:white;
    font-size:14px;
}

.navbar button:hover{
    background:#e4e6eb;
}

.container{
    width:100%;
    max-width:900px;
    margin:15px auto;
    padding:0 10px;
}

.section{
    background:white;
    border-radius:12px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 1px 3px rgba(0,0,0,.08);
}

.section h2{
    margin-top:0;
}

/* PROFILE */

.profileCover{
    height:220px;
    background:#ddd;
    border-radius:12px 12px 0 0;
    background-size:cover;
    background-position:center;
    position:relative;
}

.profileAvatar{
    width:130px;
    height:130px;
    border-radius:50%;
    border:5px solid white;
    object-fit:cover;
    position:absolute;
    left:25px;
    bottom:-65px;
    background:white;
}

.profileInfo{
    padding:75px 20px 20px;
}

.profileInfo h1{
    margin:0 0 5px;
}

.profileBio{
    color:#555;
}

.profileButtons{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

/* CREATE POST */

.createPost textarea{
    height:70px;
}

.fileLabel{
    display:inline-block;
    background:#e4e6eb;
    padding:10px 14px;
    border-radius:8px;
    cursor:pointer;
    margin-top:5px;
}

.fileLabel input{
    display:none;
}

/* POSTS */

.post{
    background:white;
    border-radius:12px;
    margin-bottom:15px;
    padding:15px;
    box-shadow:0 1px 3px rgba(0,0,0,.08);
}

.postHeader{
    display:flex;
    align-items:center;
    gap:10px;
}

.avatar{
    width:45px;
    height:45px;
    border-radius:50%;
    object-fit:cover;
    background:#ddd;
}

.postName{
    font-weight:bold;
}

.postDate{
    color:#777;
    font-size:12px;
}

.postText{
    margin:15px 0;
    white-space:pre-wrap;
}

.postImage{
    width:100%;
    max-height:600px;
    object-fit:contain;
    border-radius:10px;
    background:#eee;
}

.postActions{
    display:flex;
    gap:5px;
    margin-top:10px;
    border-top:1px solid #eee;
    padding-top:8px;
}

.postActions button{
    flex:1;
    background:#f0f2f5;
}

.commentBox{
    display:flex;
    gap:5px;
    margin-top:10px;
}

.commentBox input{
    margin:0;
}

.commentBox button{
    background:#1877f2;
    color:white;
}

.comment{
    background:#f0f2f5;
    padding:8px 10px;
    border-radius:10px;
    margin-top:6px;
}

.commentName{
    font-weight:bold;
}

/* SEARCH */

.userCard{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px;
    border-bottom:1px solid #eee;
}

.userCard:last-child{
    border-bottom:0;
}

.userCardInfo{
    flex:1;
}

.userCard button{
    margin-left:5px;
}

/* CHAT */

.chatList{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.chatUser{
    padding:12px;
    background:#f0f2f5;
    border-radius:10px;
    cursor:pointer;
}

.chatWindow{
    height:400px;
    overflow-y:auto;
    background:#f0f2f5;
    padding:10px;
    border-radius:10px;
    margin-bottom:10px;
}

.message{
    max-width:75%;
    padding:9px 12px;
    margin:5px 0;
    border-radius:15px;
}

.messageMine{
    background:#1877f2;
    color:white;
    margin-left:auto;
}

.messageOther{
    background:white;
}

.messageTime{
    font-size:10px;
    opacity:.7;
}

.chatSend{
    display:flex;
    gap:5px;
}

.chatSend input{
    margin:0;
}

.chatSend button{
    background:#1877f2;
    color:white;
}

/* REELS */

.reel{
    background:#111;
    color:white;
    border-radius:12px;
    overflow:hidden;
    margin-bottom:15px;
}

.reel video{
    width:100%;
    max-height:600px;
    display:block;
    background:#000;
}

.reelInfo{
    padding:12px;
}

/* NOTIFICATIONS */

.notification{
    padding:12px;
    border-bottom:1px solid #eee;
}

.unread{
    background:#e7f3ff;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.6);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:1000;
    padding:15px;
}

.modalBox{
    background:white;
    width:100%;
    max-width:500px;
    max-height:90vh;
    overflow:auto;
    padding:20px;
    border-radius:15px;
}

.closeBtn{
    float:right;
    background:#e4e6eb;
}

/* LOADING */

.loading{
    text-align:center;
    padding:25px;
    color:#777;
}

.empty{
    text-align:center;
    color:#777;
    padding:20px;
}

/* MOBILE */

@media(max-width:600px){

    .topbar{
        padding:9px;
    }

    .logo{
        font-size:17px;
    }

    .navbar{
        overflow-x:auto;
        justify-content:flex-start;
        white-space:nowrap;
        top:51px;
    }

    .navbar button{
        min-width:max-content;
    }

    .profileCover{
        height:170px;
    }

    .profileAvatar{
        width:100px;
        height:100px;
        bottom:-50px;
    }

    .profileInfo{
        padding-top:60px;
    }

    .postActions button{
        padding:8px 5px;
        font-size:12px;
    }
}
</style>
</head>

<body>

<script>

/* =========================================================
   SUPABASE CONFIG
========================================================= */

const SUPABASE_URL =
"https://skereuaizdczbvjplisi.supabase.co";

/*
IMPORTANT:
এখানে আপনার নিজের Publishable Key বসান।
এটি sb_publishable_ দিয়ে শুরু হবে।
*/
const SUPABASE_PUBLISHABLE_KEY =
"PASTE_YOUR_PUBLISHABLE_KEY_HERE";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let currentUser = null;
let currentProfile = null;
let currentChatUser = null;


/* =========================================================
   BASIC HELPERS
========================================================= */

function $(id){
    return document.getElementById(id);
}


function escapeHTML(value){
    if(value === null || value === undefined){
        return "";
    }

    return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function formatDate(date){
    if(!date){
        return "";
    }

    try{
        return new Date(date).toLocaleString("bn-BD");
    }catch(e){
        return "";
    }
}


function makeId(){
    /*
    আপনার int8 ID column auto increment না হলেও
    আপাতত unique numeric ID তৈরি করবে।
    */
    return Date.now() + Math.floor(Math.random()*1000);
}


function showSection(id){

    const sections = [
        "homeSection",
        "searchSection",
        "friendsSection",
        "messagesSection",
        "notificationsSection",
        "reelsSection",
        "profileSection",
        "otherProfileSection"
    ];

    sections.forEach(x=>{
        $(x)?.classList.add("hidden");
    });

    $(id)?.classList.remove("hidden");
}


function showLogin(){

    $("loginBox").classList.remove("hidden");
    $("registerBox").classList.add("hidden");

}


function showRegister(){

    $("loginBox").classList.add("hidden");
    $("registerBox").classList.remove("hidden");

}


function closeEditModal(){
    $("editModal").classList.add("hidden");
}


/* =========================================================
   AUTH
========================================================= */

async function register(){

    const name =
        $("regName").value.trim();

    const email =
        $("regEmail").value.trim();

    const password =
        $("regPassword").value;

    $("registerMsg").textContent =
        "Creating account...";

    if(!name || !email || !password){

        $("registerMsg").textContent =
            "সব তথ্য পূরণ করুন।";

        return;
    }

    if(password.length < 6){

        $("registerMsg").textContent =
            "Password কমপক্ষে 6 অক্ষরের হতে হবে।";

        return;
    }

    const {data,error} =
        await supabaseClient.auth.signUp({

            email:email,
            password:password,

            options:{
                data:{
                    name:name
                }
            }

        });

    if(error){

        $("registerMsg").textContent =
            error.message;

        return;
    }


    /*
    যদি email confirmation OFF থাকে,
    তখন session পাওয়া যাবে।
    */

    if(data.user){

        if(data.session){

            await createProfile(
                data.user.id,
                name
            );

            $("registerMsg").textContent =
                "Account তৈরি হয়েছে।";

            await startApp(data.user);

        }else{

            $("registerMsg").textContent =
                "Account তৈরি হয়েছে। Email verify করে Login করুন।";

        }

    }

}


async function login(){

    const email =
        $("loginEmail").value.trim();

    const password =
        $("loginPassword").value;

    $("loginMsg").textContent =
        "Logging in...";

    if(!email || !password){

        $("loginMsg").textContent =
            "Email এবং Password দিন।";

        return;
    }

    const {data,error} =
        await supabaseClient.auth.signInWithPassword({

            email:email,
            password:password

        });

    if(error){

        $("loginMsg").textContent =
            error.message;

        return;
    }

    if(data.user){

        await startApp(data.user);

    }

}


async function logout(){

    await supabaseClient.auth.signOut();

    currentUser = null;
    currentProfile = null;

    $("app").classList.add("hidden");
    $("authPage").classList.remove("hidden");

}


async function createProfile(userId,name){

    const {data,error} =
        await supabaseClient
        .from("profiles")
        .insert({

            id:userId,
            name:name,
            bio:"",
            profile_photo:"",
            cover_photo:""

        })
        .select()
        .single();

    return {
        data,
        error
    };
}


async function loadCurrentProfile(){

    if(!currentUser){
        return null;
    }

    let {data,error} =
        await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id",currentUser.id)
        .maybeSingle();

    if(!data && !error){

        const result =
            await createProfile(
                currentUser.id,
                currentUser.user_metadata?.name ||
                currentUser.email?.split("@")[0] ||
                "User"
            );

        data = result.data;
    }

    currentProfile = data;

    return data;
}


async function startApp(user){

    currentUser = user;

    $("authPage").classList.add("hidden");
    $("app").classList.remove("hidden");

    await loadCurrentProfile();

    showSection("homeSection");

    await loadFeed();

}


/* =========================================================
   SESSION CHECK
========================================================= */

async function checkSession(){

    const {data} =
        await supabaseClient.auth.getSession();

    if(data.session?.user){

        await startApp(
            data.session.user
        );

    }else{

        $("authPage").classList.remove("hidden");
        $("app").classList.add("hidden");

    }

}


supabaseClient.auth.onAuthStateChange(
    async (event,session)=>{

        if(event === "SIGNED_IN" &&
           session?.user &&
           !currentUser){

            await startApp(session.user);

        }

        if(event === "SIGNED_OUT"){

            currentUser = null;

        }

    }
);


/* =========================================================
   STORAGE
========================================================= */

async function uploadFile(
    file,
    folder
){

    if(!file){
        return null;
    }

    const ext =
        file.name.split(".").pop();

    const path =
        folder +
        "/" +
        currentUser.id +
        "_" +
        Date.now() +
        "." +
        ext;

    const {error} =
        await supabaseClient
        .storage
        .from("media")
        .upload(
            path,
            file,
            {
                upsert:false,
                contentType:file.type
            }
        );

    if(error){

        console.error(error);

        throw new Error(
            "File upload failed: " +
            error.message
        );

    }

    const {data} =
        supabaseClient
        .storage
        .from("media")
        .getPublicUrl(path);

    return data.publicUrl;
}


/* =========================================================
   POSTS
========================================================= */

async function createPost(){

    if(!currentUser){
        return;
    }

    const text =
        $("postText").value.trim();

    const file =
        $("postImage").files[0];

    $("postMsg").textContent =
        "Posting...";

    if(!text && !file){

        $("postMsg").textContent =
            "লেখা অথবা ছবি দিন।";

        return;
    }

    try{

        let imageUrl = "";

        if(file){

            imageUrl =
                await uploadFile(
                    file,
                    "posts"
                );

        }

        const {error} =
            await supabaseClient
            .from("posts")
            .insert({

                id:makeId(),

                user_id:currentUser.id,

                text:text,

                image_url:imageUrl

            });

        if(error){
            throw error;
        }

        $("postText").value = "";
        $("postImage").value = "";

        $("postMsg").textContent =
            "Post published.";

        await loadFeed();

    }catch(error){

        $("postMsg").textContent =
            error.message;

    }

}


async function loadFeed(){

    const feed =
        $("feed");

    feed.innerHTML =
        '<div class="loading">Loading...</div>';

    const {data:posts,error} =
        await supabaseClient
        .from("posts")
        .select("*")
        .order("created_at",{ascending:false});

    if(error){

        feed.innerHTML =
            '<div class="empty">' +
            escapeHTML(error.message) +
            '</div>';

        return;
    }

    if(!posts || posts.length === 0){

        feed.innerHTML =
            '<div class="empty">কোনো Post নেই।</div>';

        return;
    }

    const userIds =
        [...new Set(posts.map(p=>p.user_id))];

    let profiles = [];

    if(userIds.length){

        const result =
            await supabaseClient
            .from("profiles")
            .select("*")
            .in("id",userIds);

        profiles =
            result.data || [];

    }

    const profileMap = {};

    profiles.forEach(p=>{
        profileMap[p.id] = p;
    });


    let html = "";

    for(const post of posts){

        const profile =
            profileMap[post.user_id] || {};

        html +=
            await renderPost(
                post,
                profile
            );

    }

    feed.innerHTML = html;

    await loadPostExtras(posts);

}


async function renderPost(post,profile){

    if(post.image_url){

        imageHTML =

            >`;

    }

    return `

    <div class="post">

        <div class="postHeader">

            <img
                class="avatar"
                src="${escapeHTML(avatar)}"
                onclick="openProfile('${post.user_id}')"

                    onclick="openProfile('${post.user_id}')"

                </div>

                    ${formatDate(post.created_at)}
                </div>

            </div>

                </span>

            <button
                onclick="toggleComments(${post.id})"
            >

                    ${commentCount}
                </span>
            </button>

            <button
                onclick="sharePost(${post.id})"
            >
                ↗ Share
            </button>

            ${
                post.user_id === currentUser.id
                ?
                `<button
                    onclick="deletePost(${post.id})"
                >
                    🗑
                </button>`
                :
                ""
            }

async function searchUsers(){

    const q =
        $("userSearch").value.trim();

    let query =
        supabaseClient
        .from("profiles")
        .select("*")
        .neq("id",currentUser.id)
        .limit(30);

    if(q){

        query =
            query.ilike(
                "name",
                "%" + q + "%"
            );

    }

    const {data,error} =
        await query;

    if(error){

        $("usersList").innerHTML =
            escapeHTML(error.message);

        return;
    }

    if(!data || !data.length){

        $("usersList").innerHTML =
            '<div class="empty">User পাওয়া যায়নি।</div>';

        return;
    }

    let html = "";

    for(const user of data){

        const relation =
            await getFriendRelation(user.id);

        let action = "";

        if(relation === "friends"){

            action =
                `<button class="gray">
                    Friends
                </button>`;

        }else if(relation === "sent"){

            action =
                `<button class="gray">
                    Request Sent
                </button>`;

        }else if(relation === "received"){

            action =
                `<button
                    class="green"
                    onclick="acceptRequestByUser('${user.id}')"
                >
                    Accept
                </button>`;

        }else{

            action =
                `<button
                    class="blue"
                    onclick="sendFriendRequest('${user.id}')"
                >
                    Add Friend
                </button>`;

        }

        html += `

        <div class="userCard">

            <img
                class="avatar"
                src="${escapeHTML(
                    user.profile_photo ||
                    "https://via.placeholder.com/100"
                )}"
            >

            <div class="userCardInfo">

                <b>
                    ${escapeHTML(
                        user.name || "User"
                    )}
                </b>

                <div>
                    ${escapeHTML(
                        user.bio || ""
                    )}
                </div>

            </div>

            ${action}

            <button
                class="gray"
                onclick="openProfile('${user.id}')"
            >
                View
            </button>

        </div>

        `;

    }

    $("usersList").innerHTML = html;

}

async function getFriendRelation(userId){

    const {data} =
        await supabaseClient
        .from("friend_requests")
        .select("*")
        .or(
            `and(sender_id.eq.${currentUser.id},receiver_id.eq.${userId}),and(sender_id.eq.${userId},receiver_id.eq.${currentUser.id})`
        );

    if(!data || !data.length){
        return "none";
    }

    const row =
        data.find(x=>x.status === "accepted");

    if(row){
        return "friends";
    }

    const pending =
        data.find(x=>x.status === "pending");

    if(!pending){
        return "none";
    }

    if(pending.sender_id === currentUser.id){
        return "sent";
    }

    return "received";
}


async function sendFriendRequest(receiverId){

    if(receiverId === currentUser.id){
        return;
    }

    const relation =
        await getFriendRelation(receiverId);

    if(relation !== "none"){

        alert("Already connected/requested.");

        return;
    }

    const {error} =
        await supabaseClient
        .from("friend_requests")
        .insert({

            id:makeId(),

            sender_id:currentUser.id,

            receiver_id:receiverId,

            status:"pending",

            created_at:new Date().toISOString()

        });

    if(error){

        alert(error.message);

        return;
    }

    await createNotification(
        receiverId,
        (currentProfile?.name || "Someone") +
        " sent you a friend request."
    );

    alert("Friend request sent.");

    await searchUsers();

}


async function acceptRequestByUser(senderId){

    const {data,error} =
        await supabaseClient
        .from("friend_requests")
        .select("*")
        .eq("sender_id",senderId)
        .eq("receiver_id",currentUser.id)
        .eq("status","pending")
        .limit(1)
        .maybeSingle();

    if(error || !data){

        alert("Request not found.");

        return;
    }

    const {error:updateError} =
        await supabaseClient
        .from("friend_requests")
        .update({
            status:"accepted"
        })
        .eq("id",data.id);

    if(updateError){

        alert(updateError.message);

        return;
    }

    await createNotification(
        senderId,
        (currentProfile?.name || "Someone") +
        " accepted your friend request."
    );

    await loadFriends();

}

                </div>

            </div>

            `;

        }).join("");

}


async function increaseReelView(
    reelId,
    currentViews
){

    /*
    একই video বারবার count না করার জন্য
    browser session storage ব্যবহার করছি।
    */

    const key =
        "viewed_reel_" + reelId;

    if(sessionStorage.getItem(key)){
        return;
    }

    sessionStorage.setItem(key,"1");

    await supabaseClient
    .from("reels")
    .update({
        views:(currentViews || 0) + 1
    })
    .eq("id",reelId);

}


async function deleteReel(id){

    if(!confirm("এই Reel delete করবেন?")){
        return;
    }

    const {error} =
        await supabaseClient
        .from("reels")
        .delete()
        .eq("id",id)
        .eq("user_id",currentUser.id);

    if(error){

        alert(error.message);

        return;
    }

    await loadReels();

}
