<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1">

<meta name="theme-color" content="#1877f2">

<title>FriendBook</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{

}

html,body{

button,input,textarea{

#loginPage{

.topbar{

.avatar{

textarea,
input{

.actions button{

#reels{

}

.reelInfo{

.reelCreate{

.progressBar{

}

</style>
</head>

<script>

/* =====================================================
 SUPABASE
===================================================== */

const SUPABASE_URL =
"https://skereuaizdczbvjplisi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_3R2otJA1zIlsMsTYxe1ocw_NAPY5O9x";

const supabaseClient =
supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);


/* =====================================================
 GLOBAL
===================================================== */

let currentUser=null;

const REEL_BUCKET=
"friendbook-reels";


function toast(message){

 const box=
  document.getElementById("toast");

 box.textContent=message;
 box.style.display="block";

 clearTimeout(window.toastTimer);

 window.toastTimer=
  setTimeout(()=>{
   box.style.display="none";
  },3000);

}


function esc(value){

 return String(value||"")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


/* =====================================================
 AUTH
===================================================== */

async function login(){

 const email=
  document.getElementById("email").value.trim();

 const password=
  document.getElementById("password").value;

 if(!email || !password){

  document.getElementById("loginMsg").textContent=
   "Email এবং Password দিন";

  return;
 }

 const {data,error}=
  await supabaseClient.auth.signInWithPassword({
   email,
   password
  });

 if(error){

  document.getElementById("loginMsg").textContent=
   error.message;

  return;
 }

 currentUser=data.user;

 openApp();

}


async function signup(){

 const email=
  document.getElementById("email").value.trim();

 const password=
  document.getElementById("password").value;

 if(!email || !password){

  document.getElementById("loginMsg").textContent=
   "Email এবং Password দিন";

  return;
 }

 if(password.length<6){

  document.getElementById("loginMsg").textContent=
   "Password কমপক্ষে ৬ অক্ষরের হতে হবে";

  return;
 }

 const {data,error}=
  await supabaseClient.auth.signUp({
   email,
   password
  });

 if(error){

  document.getElementById("loginMsg").textContent=
   error.message;

  return;
 }

 if(!data.user){

  document.getElementById("loginMsg").textContent=
   "Email verification প্রয়োজন হতে পারে";

  return;
 }

 currentUser=data.user;

 await supabaseClient
  .from("fb_profiles")
  .upsert({
   id:currentUser.id,
   name:email.split("@")[0],
   username:email.split("@")[0],
   bio:"",
   online:true,
   last_seen:new Date().toISOString(),
   updated_at:new Date().toISOString()
  });

 openApp();

}


async function logout(){

 await supabaseClient.auth.signOut();

 location.reload();

}


function openApp(){

 document.getElementById("loginPage").style.display="none";

 document.getElementById("app").style.display="block";

 showReels();

}


/* =====================================================
 HOME
===================================================== */

function showHome(){

 document.getElementById("homeBtn")
  .classList.add("active");

 document.getElementById("reelsBtn")
  .classList.remove("active");

 document.getElementById("main").innerHTML=`

 <div class="page">

  <div class="card">

   <h2>📝 Create Post</h2>

   <textarea
    id="postText"
    rows="4"
    placeholder="What's on your mind?">
   </textarea>

   <input
    id="postImage"
    placeholder="Image URL">

   <button
    class="btn blue"
    onclick="createPost()">
    Post
   </button>

  </div>

  <div id="feed">
   Loading...
  </div>

 </div>

 `;

 loadPosts();

}


async function createPost(){

 const text=
  document.getElementById("postText")
  .value.trim();

 const image=
  document.getElementById("postImage")
  .value.trim();

 if(!text && !image){

  toast("Post content দিন");
  return;

 }

 const {error}=
  await supabaseClient
   .from("fb_posts")
   .insert({
    user_id:currentUser.id,
    text:text,
    image_url:image||null,
    privacy:"public"
   });

 if(error){

  toast("Post failed: "+error.message);
  return;

 }

 toast("Post published");

 showHome();

}


async function loadPosts(){

 const {data,error}=
  await supabaseClient
   .from("fb_posts")
   .select("*")
   .order("created_at",{
    ascending:false
   })
   .limit(30);

 if(error){

  document.getElementById("feed").innerHTML=
   `<div class="card">
    ${esc(error.message)}
   </div>`;

  return;
 }

 if(!data?.length){

  document.getElementById("feed").innerHTML=
   `<div class="card">
    এখনো কোনো Post নেই।
   </div>`;

  return;

 }

 document.getElementById("feed").innerHTML=
  data.map(p=>`

   <div class="card">

    <b>
     ${p.user_id===currentUser.id
      ?"You"
      :"FriendBook User"}
    </b>

    <p>
     ${esc(p.text||"")}
    </p>

    ${
     p.image_url
     ?
     `<img
      class="postImage"
      src="${esc(p.image_url)}">`
     :
     ""
    }

    <div class="actions">

     <button>
      👍 Like
     </button>

     <button>
      💬 Comment
     </button>

     <button>
      ↗ Share
     </button>

    </div>

   </div>

  `).join("");

}


/* =====================================================
 REELS PAGE
===================================================== */

async function showReels(){

 document.getElementById("homeBtn")
  .classList.remove("active");

 document.getElementById("reelsBtn")
  .classList.add("active");

 document.getElementById("main").innerHTML=`

 <div class="reelCreate">

  <h2>🎬 Create Reel</h2>

  <label>

   <b>
    📱 ফোনের Gallery থেকে ভিডিও নির্বাচন করুন
   </b>

   <input
    id="reelFile"
    type="file"
    accept="video/*"
    onchange="previewVideo(event)">

  </label>

  <video
   id="preview"
   class="preview"
   controls
   playsinline>
  </video>

  <input
   id="reelCaption"
   placeholder="Write a caption... #reels">

  <input
   id="reelAudio"
   placeholder="🎵 Audio name">

  <button
   class="btn blue"
   onclick="uploadReel()">
   🚀 Post Reel
  </button>

  <div
   id="uploadStatus"
   style="margin-top:10px">
  </div>

  <div
   id="progressBox"
   class="progress"
   style="display:none">

   <div
    id="progressBar"
    class="progressBar">
   </div>

  </div>

 </div>


 <div id="reels">

  <div style="
   color:white;
   padding:30px;
   text-align:center">
   Loading Reels...
  </div>

 </div>

 `;

 await loadReels();

}


/* =====================================================
 VIDEO PREVIEW
===================================================== */

function previewVideo(event){

 const file=
  event.target.files[0];

 if(!file)return;

 if(!file.type.startsWith("video/")){

  toast("শুধু Video নির্বাচন করুন");

  event.target.value="";

  return;

 }

 if(file.size >
  100*1024*1024){

  toast(
   "ভিডিও 100 MB-এর বেশি হতে পারবে না"
  );

  event.target.value="";

  return;

 }

 const video=
  document.getElementById("preview");

 video.src=
  URL.createObjectURL(file);

 video.style.display="block";

}


/* =====================================================
 UPLOAD REEL
===================================================== */

async function uploadReel(){

 const fileInput=
  document.getElementById("reelFile");

 const file=
  fileInput.files[0];

 if(!file){

  toast(
   "প্রথমে Gallery থেকে ভিডিও নির্বাচন করুন"
  );

  return;

 }

 if(!file.type.startsWith("video/")){

  toast("এটি Video file নয়");

  return;

 }

 if(file.size >
  100*1024*1024){

  toast(
   "ভিডিও সর্বোচ্চ 100 MB হতে পারবে"
  );

  return;

 }


 const status=
  document.getElementById(
   "uploadStatus"
  );

 const progressBox=
  document.getElementById(
   "progressBox"
  );

 const progressBar=
  document.getElementById(
   "progressBar"
  );


 status.textContent=
  "⏳ Video upload হচ্ছে...";

 progressBox.style.display="block";

 progressBar.style.width="10%";


 /* ---------------------------------------
    Unique file name
 --------------------------------------- */

 const extension=
  file.name.split(".").pop()
   .toLowerCase();

 const fileName=
  Date.now()+
  "_" +
  crypto.randomUUID()+
  "."+
  extension;

 const filePath=
  currentUser.id+
  "/"+
  fileName;


 /* ---------------------------------------
    Upload
 --------------------------------------- */

 const {data,error}=
  await supabaseClient
   .storage
   .from(REEL_BUCKET)
   .upload(
    filePath,
    file,
    {
     cacheControl:"3600",
     contentType:file.type,
     upsert:false
    }
   );


 if(error){

  progressBox.style.display="none";

  status.innerHTML=
   "❌ Upload failed:<br>"+
   esc(error.message);

  console.error(error);

  return;

 }


 progressBar.style.width="70%";


 /* ---------------------------------------
    Public URL
 --------------------------------------- */

 const {data:urlData}=
  supabaseClient
   .storage
   .from(REEL_BUCKET)
   .getPublicUrl(filePath);

 const videoURL=
  urlData.publicUrl;


 /* ---------------------------------------
    Insert Reel
 --------------------------------------- */

 const {error:dbError}=
  await supabaseClient
   .from("fb_reels")
   .insert({
    user_id:currentUser.id,
    video_url:videoURL,
    caption:
     document.getElementById(
      "reelCaption"
     ).value.trim(),

    audio_name:
     document.getElementById(
      "reelAudio"
     ).value.trim(),

    views:0
   });


 if(dbError){

  /* Database insert failed.
     Try to remove uploaded file. */

  await supabaseClient
   .storage
   .from(REEL_BUCKET)
   .remove([filePath]);

  progressBox.style.display="none";

  status.innerHTML=
   "❌ Reel database failed:<br>"+
   esc(dbError.message);

  return;

 }


 progressBar.style.width="100%";

 status.textContent=
  "✅ Reel successfully posted!";


 toast("🎬 Reel posted successfully");


 setTimeout(()=>{
  showReels();
 },800);

}

 LOAD REELS
===================================================== */

 if(error){

    color:white;

    ❌ ${esc(error.message)}

  return;

 }


 if(!data?.length){

  box.innerHTML=`

   <div style="

    text-align:center;
    padding:50px">

    <div style="font-size:60px">
     🎬
    </div>

    <h2>
     এখনো কোনো Reel নেই
    </h2>

    <p>
     উপরে থেকে প্রথম Reel পোস্ট করুন।

 box.innerHTML=

    </video>


    <div class="reelShade"></div>


    <button
     class="reelSound"
     onclick="
      toggleSound(
       ${reel.id},
       this
      )
     ">
     🔇
    </button>


    <div class="reelSide">

     <button
      onclick="
       reelReaction(
        ${reel.id},
        'like'
       )
      ">
      👍
     </button>

     <button
      onclick="
       reelReaction(
        ${reel.id},
        'love'
       )
      ">
      ❤️
     </button>

     <button
      onclick="
       openComments(
        ${reel.id}
       )
      ">
      💬
     </button>

     <button

       shareReel(
        ${reel.id}
       )
      ">
      ↗
     </button>

     ${
      reel.user_id===currentUser.id
      ?

       onclick="

         '${esc(reel.video_url)}'
        )
       ">
       🗑
      </button>`
      :
      ""
     }

    </div>


    <div class="reelInfo">

     <b>
      👤 ${reel.user_id===currentUser.id
       ?"You"
       :"FriendBook User"}
     </b>

     <p>
      ${esc(reel.caption||"")}
     </p>

     <div>

      🎵
      ${esc(
       reel.audio_name ||
       "Original audio"
      )}

      ·

      👁
      ${Number(reel.views||0)}

     </div>

    </div>

   </section>

  `).join("");


 setupReelAutoPlay();

/* =====================================================
 REEL AUTOPLAY
===================================================== */

function setupReelAutoPlay(){

 const observer=
  new IntersectionObserver(
   entries=>{

    entries.forEach(entry=>{

     const section=
      entry.target;

     const video=
      section.querySelector(
       "video"
      );

     if(entry.isIntersecting){

      document
       .querySelectorAll(
        ".reel video"
       )
       .forEach(v=>{

        if(v!==video)
         v.pause();

       });

      video.play()
       .catch(()=>{});


      countView(
       section.dataset.id
      );

     }else{

      video.pause();

     }

    });

   },
   {
    threshold:.7
   }
  );


 document
  .querySelectorAll(".reel")
  .forEach(reel=>{
   observer.observe(reel);
  });

}


/* =====================================================
 PLAY / PAUSE
===================================================== */

function playPause(id){

 const video=
  document.getElementById(
   "video-"+id
  );

 if(video.paused){

  video.play()
   .catch(()=>{});

 }else{

  video.pause();

 }

}


/* =====================================================
 SOUND
===================================================== */

function toggleSound(id,button){

 const video=
  document.getElementById(
   "video-"+id
  );

 video.muted=
  !video.muted;

 button.textContent=
  video.muted
  ?"🔇"
  :"🔊";

 if(video.paused){

  video.play()
   .catch(()=>{});

 }

}


/* =====================================================
 VIEWS
===================================================== */

const viewedReels=
 new Set();


async function countView(id){

 if(viewedReels.has(id))
  return;

 viewedReels.add(id);

 const {data:existing}=
  await supabaseClient
   .from("fb_reel_views")
   .select("id")
   .eq("reel_id",Number(id))
   .eq("user_id",currentUser.id)
   .maybeSingle();

 if(existing)
  return;


 await supabaseClient
  .from("fb_reel_views")
  .insert({
   reel_id:Number(id),
   user_id:currentUser.id
  });


 const {data:reel}=
  await supabaseClient
   .from("fb_reels")
   .select("views")
   .eq("id",Number(id))
   .maybeSingle();


 if(reel){

  await supabaseClient
   .from("fb_reels")
   .update({
    views:Number(
     reel.views||0
    )+1
   })
   .eq("id",Number(id));

 }

}


/* =====================================================
 REACTION
===================================================== */

async function reelReaction(
 id,
 reaction
){

 const {data:old}=
  await supabaseClient
   .from("fb_reel_reactions")
   .select("id,reaction")
   .eq("reel_id",id)
   .eq("user_id",currentUser.id)
   .maybeSingle();


 if(old){

  if(old.reaction===reaction){

   const {error}=
    await supabaseClient
     .from("fb_reel_reactions")
     .delete()
     .eq("id",old.id);

   if(error)
    toast(error.message);

  }else{

   const {error}=
    await supabaseClient
     .from("fb_reel_reactions")
     .update({
      reaction:reaction
     })
     .eq("id",old.id);

   if(error)
    toast(error.message);

  }

 }else{

  const {error}=
   await supabaseClient
    .from("fb_reel_reactions")
    .insert({
     reel_id:id,
     user_id:currentUser.id,
     reaction:reaction
    });

  if(error){

   toast(error.message);
   return;

  }

 }

 toast(
  reaction==="love"
  ?"❤️ Love"
  :"👍 Like"
 );

}


/* =====================================================
 DELETE REEL
===================================================== */

async function deleteReel(
 id,
 videoURL
){

 if(!confirm(
  "এই Reel Delete করবেন?"
 ))
  return;


 const {error}=
  await supabaseClient
   .from("fb_reels")
   .delete()
   .eq("id",id)
   .eq("user_id",currentUser.id);


 if(error){

  toast(error.message);
  return;

 }


 /* Try to remove Storage file */

 try{

  const marker=
   "/friendbook-reels/";

  if(videoURL.includes(marker)){

   const path=
    decodeURIComponent(
     videoURL.split(marker)[1]
    );

   await supabaseClient
    .storage
    .from(REEL_BUCKET)
    .remove([path]);

  }

 }catch(e){

  console.log(e);

 }


 toast("🗑 Reel deleted");

 showReels();

}


/* =====================================================
 SHARE
===================================================== */

async function shareReel(id){

 const url=
  location.href.split("#")[0]+
  "#reel-"+id;


 if(navigator.share){

  try{

   await navigator.share({
    title:"FriendBook Reel",
    text:"Check this Reel",
    url:url
   });

  }catch(e){}

 }else{

  try{

   await navigator.clipboard
    .writeText(url);

   toast("🔗 Reel link copied");

  }catch(e){

   toast(url);

  }

 }

}


/* =====================================================
 COMMENTS
===================================================== */

async function openComments(id){

 const {data,error}=
  await supabaseClient
   .from("fb_reel_comments")
   .select("*")
   .eq("reel_id",id)
   .order("created_at",{
    ascending:true
   });


 let html=`

 <div class="card">

  <h2>💬 Reel Comments</h2>

  <input
   id="commentText"
   placeholder="Write a comment...">

  <button
   class="btn blue"
   onclick="
    addComment(${id})
   ">
   Comment
  </button>

 </div>

 `;


 if(error){

  html+=`
   <div class="card">
    ${esc(error.message)}
   </div>
  `;

 }else{

  html+=
   (data||[]).map(c=>`

    <div class="comment">

     <b>
      ${c.user_id===currentUser.id
       ?"You"
       :"User"}
     </b>

     <p>
      ${esc(c.text)}
     </p>

    </div>

   `).join("")
   ||
   `<div class="card">
    No comments yet.
   </div>`;

 }


 document.getElementById(
  "main"
 ).innerHTML=`

 <div class="page">

  <button
   class="btn gray"
   onclick="showReels()">
   ← Back to Reels
  </button>

  ${html}

 </div>

 `;

}


async function addComment(reelId){

 const text=
  document.getElementById(
   "commentText"
  ).value.trim();

 if(!text)
  return;


 const {error}=
  await supabaseClient
   .from("fb_reel_comments")
   .insert({
    reel_id:reelId,
    user_id:currentUser.id,
    text:text,
    parent_id:null
   });


 if(error){

  toast(error.message);
  return;

 }


 toast("💬 Comment added");

 openComments(reelId);

}
