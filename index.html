<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1877f2">

<title>FriendBook V2</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f0f2f5;
 color:#111;
}

body.dark{
 background:#18191a;
 color:#eee;
}

button,input,textarea,select{
 font:inherit;
}

button{
 cursor:pointer;
}

.hidden{
 display:none!important;
}

.top{
 position:sticky;
 top:0;
 z-index:100;
 height:60px;
 display:flex;
 align-items:center;
 gap:10px;
 padding:8px 12px;
 background:white;
 border-bottom:1px solid #ddd;
}

.dark .top{
 background:#242526;
 border-color:#444;
}

.logo{
 color:#1877f2;
 font-size:25px;
 font-weight:bold;
 white-space:nowrap;
}

.search{
 flex:1;
 max-width:430px;
}

.search input{
 width:100%;
 padding:10px 15px;
 border:0;
 outline:0;
 border-radius:25px;
 background:#f0f2f5;
}

.dark .search input{
 background:#3a3b3c;
 color:white;
}

.topUser{
 margin-left:auto;
 display:flex;
 align-items:center;
 gap:7px;
}

.avatar{
 width:40px;
 height:40px;
 border-radius:50%;
 object-fit:cover;
 background:#ddd;
}

.nav{
 position:sticky;
 top:60px;
 z-index:90;
 display:flex;
 justify-content:center;
 gap:3px;
 background:white;
 border-bottom:1px solid #ddd;
 padding:5px;
}

.dark .nav{
 background:#242526;
 border-color:#444;
}

.nav button{
 border:0;
 background:transparent;
 border-radius:8px;
 padding:10px 14px;
 font-weight:bold;
}

.nav button:hover{
 background:#eee;
}

.dark .nav button{
 color:#eee;
}

.dark .nav button:hover{
 background:#3a3b3c;
}

.container{
 width:min(720px,100%);
 margin:auto;
 padding:12px;
}

.card{
 background:white;
 border-radius:10px;
 padding:14px;
 margin-bottom:12px;
 box-shadow:0 1px 3px #0002;
}

.dark .card{
 background:#242526;
 color:#eee;
}

.row{
 display:flex;
 align-items:center;
 gap:9px;
}

.between{
 justify-content:space-between;
}

.field{
 width:100%;
 padding:11px;
 border:1px solid #ccc;
 border-radius:8px;
 margin:5px 0;
 outline:0;
}

.dark .field{
 background:#3a3b3c;
 color:white;
 border-color:#555;
}

.mainBtn{
 border:0;
 background:#1877f2;
 color:white;
 padding:11px 16px;
 border-radius:8px;
 font-weight:bold;
}

.fullBtn{
 width:100%;
 margin-top:8px;
}

.green{
 background:#42b72a;
}

.red{
 background:#e41e3f;
}

.gray{
 background:#65676b;
 color:white;
}

.auth{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
}

.authBox{
 width:min(420px,100%);
 background:white;
 padding:25px;
 border-radius:15px;
 box-shadow:0 5px 30px #0002;
}

.dark .authBox{
 background:#242526;
}

.authBox h1{
 color:#1877f2;
 text-align:center;
}

.authSwitch{
 color:#1877f2;
 text-align:center;
 padding:15px;
 cursor:pointer;
}

.msg{
 padding:10px;
 margin:8px 0;
 border-radius:8px;
 background:#ffe5e5;
 color:#c00;
}

.success{
 background:#e8f8e8;
 color:green;
}

.composer textarea{
 width:100%;
 min-height:80px;
 resize:none;
 border:0;
 border-radius:10px;
 background:#f0f2f5;
 padding:12px;
 outline:0;
}

.dark .composer textarea{
 background:#3a3b3c;
 color:white;
}

.postText{
 white-space:pre-wrap;
 line-height:1.5;
 margin-top:10px;
}

.postImg{
 width:100%;
 max-height:650px;
 object-fit:cover;
 border-radius:8px;
 margin-top:10px;
}

.small{
 font-size:13px;
 color:#65676b;
}

.dark .small{
 color:#aaa;
}

.actions{
 display:flex;
 gap:3px;
 border-top:1px solid #ddd;
 margin-top:10px;
 padding-top:5px;
}

.dark .actions{
 border-color:#444;
}

.actions button{
 flex:1;
 border:0;
 background:transparent;
 padding:10px 5px;
 border-radius:7px;
}

.actions button:hover{
 background:#eee;
}

.dark .actions button{
 color:white;
}

.dark .actions button:hover{
 background:#3a3b3c;
}

.comment{
 background:#f0f2f5;
 border-radius:15px;
 padding:8px 12px;
 margin:5px 0;
}

.dark .comment{
 background:#3a3b3c;
}

.commentInput{
 display:flex;
 gap:5px;
 margin-top:8px;
}

.commentInput input{
 flex:1;
 border:1px solid #ccc;
 border-radius:20px;
 padding:9px 13px;
}

.profileCover{
 height:240px;
 background:#1877f2;
 border-radius:10px 10px 0 0;
 overflow:hidden;
}

.profileCover img{
 width:100%;
 height:100%;
 object-fit:cover;
}

.profileCenter{
 text-align:center;
 margin-top:-50px;
}

.bigAvatar{
 width:105px;
 height:105px;
 object-fit:cover;
 border-radius:50%;
 border:5px solid white;
}

.dark .bigAvatar{
 border-color:#242526;
}

.profileName{
 font-size:25px;
 font-weight:bold;
 margin:8px;
}

.tabs{
 display:flex;
 gap:4px;
 overflow:auto;
 margin-top:10px;
}

.tabs button{
 flex:1;
 min-width:100px;
 border:0;
 padding:10px;
 border-radius:8px;
 background:#eee;
}

.dark .tabs button{
 background:#3a3b3c;
 color:white;
}

.people{
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:10px 0;
 border-bottom:1px solid #ddd;
}

.dark .people{
 border-color:#444;
}

.people:last-child{
 border:0;
}

.reelsLayer{
 position:fixed;
 inset:0;
 z-index:500;
 background:#000;
 overflow-y:auto;
 scroll-snap-type:y mandatory;
}

.reel{
 height:100vh;
 position:relative;
 scroll-snap-align:start;
 display:flex;
 align-items:center;
 justify-content:center;
}

.reel video{
 width:100%;
 height:100%;
 object-fit:contain;
}

.reelInfo{
 position:absolute;
 left:15px;
 bottom:30px;
 color:white;
 max-width:70%;
 text-shadow:0 1px 5px #000;
}

.reelBtns{
 position:absolute;
 right:15px;
 bottom:80px;
 display:flex;
 flex-direction:column;
 gap:10px;
}

.reelBtns button{
 width:50px;
 height:50px;
 border:0;
 border-radius:50%;
 background:#ffffff30;
 color:white;
 font-size:20px;
}

.close{
 position:fixed;
 right:15px;
 top:15px;
 z-index:600;
 width:45px;
 height:45px;
 border:0;
 border-radius:50%;
 background:#ffffff30;
 color:white;
 font-size:25px;
}

.settingsItem{
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:15px 5px;
 border-bottom:1px solid #ddd;
}

.dark .settingsItem{
 border-color:#444;
}

.chat{
 height:65vh;
 display:flex;
 flex-direction:column;
}

.chatMessages{
 flex:1;
 overflow-y:auto;
 padding:10px;
}

.bubble{
 max-width:75%;
 padding:9px 12px;
 margin:5px 0;
 border-radius:15px;
 background:#e4e6eb;
}

.dark .bubble{
 background:#3a3b3c;
}

.mine{
 margin-left:auto;
 background:#1877f2;
 color:white;
}

.chatSend{
 display:flex;
 gap:5px;
}

.chatSend input{
 flex:1;
 padding:11px;
 border:1px solid #ccc;
 border-radius:20px;
}

.toast{
 position:fixed;
 z-index:1000;
 left:50%;
 bottom:25px;
 transform:translateX(-50%);
 background:#222;
 color:white;
 padding:11px 18px;
 border-radius:25px;
 display:none;
}

@media(max-width:600px){
 .logo{
  font-size:20px;
 }
 .topUser span{
  display:none;
 }
 .nav button{
  padding:9px 8px;
  font-size:12px;
 }
 .profileCover{
  height:180px;
 }
}
</style>
</head>

<body>

<!-- ================= AUTH ================= -->

<section id="authPage" class="auth">

<div class="authBox">

<h1>FriendBook</h1>

<div id="loginBox">

<h2>Login</h2>

<input
 id="loginEmail"
 class="field"
 type="email"
 placeholder="Email">

<input
 id="loginPassword"
 class="field"
 type="password"
 placeholder="Password">

<button
 class="mainBtn fullBtn"
 onclick="login()">
 Log In
</button>

<div id="loginMsg"></div>

<div class="authSwitch"
 onclick="showSignup()">
 Create new account
</div>

</div>

<div id="signupBox" class="hidden">

<h2>Create Account</h2>

<input
 id="signupName"
 class="field"
 placeholder="Your Name">

<input
 id="signupEmail"
 class="field"
 type="email"
 placeholder="Email">

<input
 id="signupPassword"
 class="field"
 type="password"
 placeholder="Password">

<button
 class="mainBtn green fullBtn"
 onclick="signup()">
 Sign Up
</button>

<div id="signupMsg"></div>

<div class="authSwitch"
 onclick="showLogin()">
 Already have an account? Login
</div>

</div>

</div>
</section>


<!-- ================= APP ================= -->

<div id="app" class="hidden">

<header class="top">

<div class="logo">
FriendBook
</div>

<div class="search">
<input
 id="searchInput"
 placeholder="Search people..."
 onkeydown="if(event.key==='Enter')searchPeople()">
</div>

<div class="topUser">

<img
 id="topAvatar"
 class="avatar">

<span id="topName"></span>

</div>

</header>

<nav class="nav">

<button onclick="showHome()">🏠</button>

<button onclick="openFriends()">👥</button>

<button onclick="openMessenger()">💬</button>

<button onclick="showReels()">🎬</button>

<button onclick="showProfile()">👤</button>

<button onclick="showNotifications()">🔔</button>

<button onclick="showSettings()">⚙️</button>

</nav>

<main id="main" class="container"></main>

</div>


<!-- REELS -->

<div
 id="reelsLayer"
 class="reelsLayer hidden">

<button
 class="close"
 onclick="closeReels()">
 ×
</button>

<div id="reelsList"></div>

</div>


<div id="toast" class="toast"></div>


<script>

/* ========================================================
   SUPABASE
======================================================== */

const SUPABASE_URL =
"https://skereuaizdczbvjplisi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_3R2otJA1zIlsMsTYxe1ocw_NAPY5O9x";

const sb =
window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

let currentUser=null;
let profile=null;

let dark =
localStorage.getItem("fb_dark")==="1";


/* ========================================================
   HELPERS
======================================================== */

const $=id=>document.getElementById(id);

function esc(v){
 return String(v??"")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");
}

function date(v){
 if(!v)return "";
 return new Date(v).toLocaleString(
 "bn-BD",
 {
  dateStyle:"medium",
  timeStyle:"short"
 }
 );
}

function toast(text){

 const t=$("toast");

 t.innerText=text;
 t.style.display="block";

 setTimeout(()=>{
  t.style.display="none";
 },2200);
}

function msg(id,text,success=false){

 $(id).innerHTML=
 text
 ? `<div class="msg ${success?"success":""}">
      ${esc(text)}
    </div>`
 : "";
}


/* ========================================================
   AUTH
======================================================== */

function showLogin(){

 $("loginBox").classList.remove("hidden");
 $("signupBox").classList.add("hidden");
}

function showSignup(){

 $("loginBox").classList.add("hidden");
 $("signupBox").classList.remove("hidden");
}


async function login(){

 const email=$("loginEmail").value.trim();
 const password=$("loginPassword").value;

 msg("loginMsg","");

 if(!email||!password){

  msg(
   "loginMsg",
   "Email এবং Password দিন।"
  );

  return;
 }

 try{

  const {data,error}=
   await sb.auth.signInWithPassword({
    email,
    password
   });

  if(error)throw error;

  currentUser=data.user;

  await loadApp();

 }catch(e){

  console.error(e);

  let m=e.message;

  if(
   m.toLowerCase()
   .includes("invalid login credentials")
  ){
   m="Email অথবা Password ভুল।";
  }

  if(
   m.toLowerCase()
   .includes("email not confirmed")
  ){
   m="Email Confirm করুন।";
  }

  msg("loginMsg",m);
 }
}


async function signup(){

 const name=$("signupName").value.trim();
 const email=$("signupEmail").value.trim();
 const password=$("signupPassword").value;

 msg("signupMsg","");

 if(!name||!email||!password){

  msg(
   "signupMsg",
   "সব তথ্য পূরণ করুন।"
  );

  return;
 }

 if(password.length<6){

  msg(
   "signupMsg",
   "Password কমপক্ষে 6 অক্ষর।"
  );

  return;
 }

 try{

  const {data,error}=
   await sb.auth.signUp({
    email,
    password,
    options:{
     data:{name}
    }
   });

  if(error)throw error;

  if(data.session){

   currentUser=data.user;

   await loadApp();

  }else{

   msg(
    "signupMsg",
    "Account তৈরি হয়েছে। Email Confirm করে Login করুন।",
    true
   );
  }

 }catch(e){

  msg("signupMsg",e.message);
 }
}


/* ========================================================
   APP START
======================================================== */

async function loadApp(){

 $("authPage").classList.add("hidden");
 $("app").classList.remove("hidden");

 if(dark)
  document.body.classList.add("dark");

 await ensureProfile();

 await loadProfile();

 showHome();
}


async function ensureProfile(){

 if(!currentUser)return;

 const {data}=
  await sb
  .from("fb_profiles")
  .select("*")
  .eq("id",currentUser.id)
  .maybeSingle();

 if(!data){

  const name=
   currentUser.user_metadata?.name ||
   currentUser.email?.split("@")[0] ||
   "User";

  await sb
  .from("fb_profiles")
  .insert({
   id:currentUser.id,
   name:name
  });
 }
}


async function loadProfile(){

 const {data}=
  await sb
  .from("fb_profiles")
  .select("*")
  .eq("id",currentUser.id)
  .maybeSingle();

 profile=data||{
  name:"User"
 };

 $("topName").innerText=
  profile.name||"User";

 $("topAvatar").src=
  profile.profile_photo||
  "https://placehold.co/100x100?text=User";
}


/* ========================================================
   HOME
======================================================== */

async function showHome(){

 $("main").innerHTML=`

 <div class="card composer">

  <div class="row">

   <img
    class="avatar"
    src="${profile.profile_photo||
    "https://placehold.co/100x100?text=User"}">

   <strong>
    ${esc(profile.name||"You")}
   </strong>

  </div>

  <br>

  <textarea
   id="newPostText"
   placeholder="What's on your mind?">
  </textarea>

  <input
   id="newPostImage"
   class="field"
   type="file"
   accept="image/*">

  <input
   id="newPostLocation"
   class="field"
   placeholder="📍 Location">

  <input
   id="newPostFeeling"
   class="field"
   placeholder="😊 Feeling / Activity">

  <select
   id="newPostPrivacy"
   class="field">

   <option value="public">
    🌎 Public
   </option>

   <option value="friends">
    👥 Friends
   </option>

   <option value="only_me">
    🔒 Only Me
   </option>

  </select>

  <button
   class="mainBtn fullBtn"
   onclick="createPost()">
   📤 Post
  </button>

 </div>

 <div id="feed">
  <div class="card">
   Loading...
  </div>
 </div>
 `;

 await loadFeed();
}


/* ========================================================
   CREATE POST
======================================================== */

async function createPost(){

 const text=$("newPostText").value.trim();
 const file=$("newPostImage").files[0];

 const privacy=
  $("newPostPrivacy").value;

 const feeling=
  $("newPostFeeling").value.trim();

 const location=
  $("newPostLocation").value.trim();

 if(!text&&!file){

  toast("Text অথবা Photo দিন।");
  return;
 }

 try{

  let image_url=null;

  if(file){

   const path=
    currentUser.id+
    "/"+
    Date.now()+
    "_"+
    file.name;

   const {error}=
    await sb.storage
    .from("post-images")
    .upload(path,file);

   if(error)throw error;

   const {data}=
    sb.storage
    .from("post-images")
    .getPublicUrl(path);

   image_url=data.publicUrl;
  }

  const {error}=
   await sb
   .from("fb_posts")
   .insert({
    user_id:currentUser.id,
    text,
    image_url,
    privacy,
    feeling:feeling||null,
    location:location||null
   });

  if(error)throw error;

  toast("Post published!");

  showHome();

 }catch(e){

  toast(e.message);
 }
}


/* ========================================================
   FEED
======================================================== */

async function loadFeed(){

 const feed=$("feed");

 try{

  const {data,error}=
   await sb
   .from("fb_posts")
   .select("*")
   .order("created_at",{ascending:false})
   .limit(50);

  if(error)throw error;

  if(!data?.length){

   feed.innerHTML=
    `<div class="card">
      No posts yet.
     </div>`;

   return;
  }

  feed.innerHTML="";

  for(const post of data){

   await renderPost(feed,post);
  }

 }catch(e){

  feed.innerHTML=
   `<div class="card">
    ${esc(e.message)}
   </div>`;
 }
}


async function renderPost(feed,post){

 let author=null;

 const p=
  await sb
  .from("fb_profiles")
  .select("*")
  .eq("id",post.user_id)
  .maybeSingle();

 author=p.data;

 const reactions=
  await sb
  .from("fb_post_reactions")
  .select("reaction,user_id")
  .eq("post_id",post.id);

 const reactionRows=
  reactions.data||[];

 const mine=
  reactionRows.find(
   x=>x.user_id===currentUser.id
  );

 const saved=
  await sb
  .from("fb_saved_posts")
  .select("id")
  .eq("post_id",post.id)
  .eq("user_id",currentUser.id)
  .maybeSingle();

 const pinned=
  await sb
  .from("fb_pinned_posts")
  .select("id")
  .eq("post_id",post.id)
  .eq("user_id",currentUser.id)
  .maybeSingle();

 const comments=
  await sb
  .from("fb_comments")
  .select("id")
  .eq("post_id",post.id);

 const div=document.createElement("div");

 div.className="card";

 div.innerHTML=`

 <div class="row between">

  <div class="row">

   <img
    class="avatar"
    src="${author?.profile_photo||
    "https://placehold.co/100x100?text=User"}">

   <div>

    <strong>
     ${esc(author?.name||"User")}
    </strong>

    <div class="small">
     ${date(post.created_at)}
    </div>

   </div>

  </div>

  <div>

   ${
    post.user_id===currentUser.id
    ? `
      <button
       class="gray"
       style="border:0;border-radius:6px;padding:7px"
       onclick="deletePost(${post.id})">
       🗑️
      </button>
     `
    :""
   }

  </div>

 </div>

 ${
  post.feeling
  ? `<div class="small">
      ${esc(post.feeling)}
     </div>`
  :""
 }

 ${
  post.location
  ? `<div class="small">
      📍 ${esc(post.location)}
     </div>`
  :""
 }

 ${
  post.text
  ? `<div class="postText">
      ${esc(post.text)}
     </div>`
  :""
 }

 ${
  post.image_url
  ? `<img
      class="postImg"
      src="${post.image_url}">
     `
  :""
 }

 <div class="small"
      style="margin-top:8px">

  👍 ${reactionRows.filter(x=>x.reaction==="like").length}
  ❤️ ${reactionRows.filter(x=>x.reaction==="love").length}
  😂 ${reactionRows.filter(x=>x.reaction==="haha").length}
  😮 ${reactionRows.filter(x=>x.reaction==="wow").length}
  😢 ${reactionRows.filter(x=>x.reaction==="sad").length}
  😡 ${reactionRows.filter(x=>x.reaction==="angry").length}

  · 💬 ${comments.data?.length||0}

 </div>

 <div class="actions">

  <button
   onclick="reactPost(${post.id},'like')">
   ${mine?.reaction==="like"?"❤️":"👍"} Like
  </button>

  <button
   onclick="showReactionMenu(${post.id})">
   ❤️ Reaction
  </button>

  <button
   onclick="togglePostComments(${post.id})">
   💬 Comment
  </button>

  <button
   onclick="sharePost(${post.id})">
   ↗ Share
  </button>

 </div>

 <div
  class="actions"
  style="border:0">

  <button
   onclick="savePost(${post.id})">
   ${saved.data?"🔖 Saved":"🔖 Save"}
  </button>

  <button
   onclick="pinPost(${post.id})">
   ${pinned.data?"📌 Pinned":"📌 Pin"}
  </button>

  <button
   onclick="reportPost(${post.id})">
   🚩 Report
  </button>

 </div>

 <div
  id="reaction-${post.id}"
  class="hidden">
 </div>

 <div
  id="comments-${post.id}"
  class="hidden">
 </div>
 `;

 feed.appendChild(div);

async function reactPost(id,reaction){

 try{

  const {data}=
   await sb
   .from("fb_post_reactions")
   .select("*")
   .eq("post_id",id)
   .eq("user_id",currentUser.id)
   .maybeSingle();

  if(data){

   if(data.reaction===reaction){

    await sb
    .from("fb_post_reactions")
    .delete()
    .eq("id",data.id);

   }else{

    await sb
    .from("fb_post_reactions")
    .update({reaction})
    .eq("id",data.id);
   }

  }else{

   await sb
   .from("fb_post_reactions")
   .insert({
    post_id:id,
    user_id:currentUser.id,
    reaction
   });

   await notify(
    id,

 }catch(e){

 }

}


async function sendMessage(userId){

 const input=$("messageInput");

 const text=input.value.trim();

 if(!text)return;

 const {error}=
  await sb
  .from("fb_messages")
  .insert({
   sender_id:currentUser.id,
   receiver_id:userId,
   text
  });

 if(error){

  toast(error.message);
  return;
 }

 input.value="";

 await loadMessages(userId);

 await sb
 .from("fb_notifications")
 .insert({
  receiver_id:userId,
  sender_id:currentUser.id,
  type:"message",
  message:`${profile.name} sent you a message`
 });
}


/* ========================================================
   REELS
======================================================== */

async function showReels(){

 $("reelsLayer")
 .classList.remove("hidden");

 $("reelsList").innerHTML=
 `<div style="color:white;padding:30px">
  Loading...
 </div>`;

 const {data,error}=
  await sb
  .from("fb_reels")
  .select("*")
  .order("created_at",{ascending:false})
  .limit(30);

 if(error){

  $("reelsList").innerHTML=
   `<div style="color:white;padding:30px">
    ${esc(error.message)}
   </div>`;

  return;
 }

 $("reelsList").innerHTML="";

 for(const reel of data||[]){

  const div=document.createElement("div");

  div.className="reel";

  div.innerHTML=`

   <video
    src="${reel.video_url}"
    controls
    loop
    playsinline>
   </video>

   <div class="reelInfo">

    <strong>FriendBook</strong>

    <div>
     ${esc(reel.caption||"")}
    </div>

    ${
     reel.audio_name
     ? `<div>
         🎵 ${esc(reel.audio_name)}
        </div>`
     :""
    }

   </div>

   <div class="reelBtns">

    <button
     onclick="reactReel(${reel.id})">
     ❤️
    </button>

    <button
     onclick="sharePost(${reel.id})">
     ↗
    </button>

    <button
     onclick="toggleMute(this)">
     🔊
    </button>

   </div>

  `;

  $("reelsList").appendChild(div);
 }

 observeReels();
}


function closeReels(){

 document
 .querySelectorAll(".reel video")
 .forEach(v=>v.pause());

 $("reelsLayer")
 .classList.add("hidden");
}


function toggleMute(btn){

 const video=
  btn.closest(".reel")
  .querySelector("video");

 video.muted=!video.muted;

 btn.innerText=
  video.muted?"🔇":"🔊";

 if(video.paused)
  video.play().catch(()=>{});
}


function observeReels(){

 const videos=
  document.querySelectorAll(
   ".reel video"
  );

 const obs=
  new IntersectionObserver(
   entries=>{
    entries.forEach(e=>{

     if(e.isIntersecting){

      e.target.play()
      .catch(()=>{});

     }else{

      e.target.pause();
     }

    });
   },
   {threshold:.7}
  );

 videos.forEach(v=>obs.observe(v));
}


async function reactReel(id){

 const {data}=
  await sb
  .from("fb_reel_reactions")
  .select("id")
  .eq("reel_id",id)
  .eq("user_id",currentUser.id)
  .maybeSingle();

 if(data){

  await sb
  .from("fb_reel_reactions")
  .delete()
  .eq("id",data.id);

 }else{

  await sb
  .from("fb_reel_reactions")
  .insert({
   reel_id:id,
   user_id:currentUser.id,
   reaction:"like"
  });
 }

 toast("Reaction updated");
}

/* ========================================================
   CREATOR
======================================================== */

async function showCreator(){

 $("main").innerHTML=`

 <div class="card">

  <h2>💰 Creator Dashboard</h2>

  <div id="creatorInfo">
   Loading...
  </div>

  <button
   class="mainBtn fullBtn"
   onclick="toggleCreator()">
   Monetization On / Off
  </button>

 </div>

 <div class="card">

  <h3>💵 Earnings</h3>

  <div id="earnings">
   Loading...
  </div>

 </div>
 `;

 const setting=
  await sb
  .from("fb_creator_settings")
  .select("*")
  .eq("user_id",currentUser.id)
  .maybeSingle();

 $("creatorInfo").innerHTML=
  setting.data?.monetization_enabled
  ? "✅ Monetization Enabled"
  : "❌ Monetization Disabled";

 const earnings=
  await sb
  .from("fb_creator_earnings")
  .select("*")
  .eq("user_id",currentUser.id)
  .order("created_at",{ascending:false});

 let total=0;

 for(const e of earnings.data||[])
  total+=Number(e.amount||0);

 $("earnings").innerHTML=
  `<h2>$${total.toFixed(2)}</h2>`;
}


async function toggleCreator(){

 const old=
  await sb
  .from("fb_creator_settings")
  .select("*")
  .eq("user_id",currentUser.id)
  .maybeSingle();

 const enabled=
  !old.data?.monetization_enabled;

 const {error}=
  await sb
  .from("fb_creator_settings")
  .upsert({
   user_id:currentUser.id,
   monetization_enabled:enabled,
   updated_at:new Date().toISOString()
  });

 if(error){

  toast(error.message);
  return;
 }

 toast(
  enabled
  ?"Monetization Enabled"
  :"Monetization Disabled"
 );

 showCreator();
}

======================================================== */

async function logout(){

 await sb.auth.signOut();

 currentUser=null;
 profile=null;

 $("app").classList.add("hidden");
 $("authPage").classList.remove("hidden");

 showLogin();
}


/* ========================================================
   AUTH STATE
======================================================== */

sb.auth.onAuthStateChange(
 async(event,session)=>{

  if(session&&!currentUser){

   currentUser=session.user;

   await loadApp();
  }

 }
);


/* ========================================================
   START
======================================================== */

async function start(){

 if(dark)
  document.body.classList.add("dark");

 try{

  const {data}=
   await sb.auth.getSession();

  if(data.session){

   currentUser=data.session.user;

   await loadApp();

  }else{

   $("authPage")
   .classList.remove("hidden");
  }

 }catch(e){

  console.error(e);

  $("authPage")
  .classList.remove("hidden");
 }
}

start();

</script>
