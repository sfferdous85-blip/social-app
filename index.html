<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1877f2">
<title>My Social App</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
 --blue:#1877f2;
 --blue2:#0d6efd;
 --bg:#f0f2f5;
 --card:#fff;
 --text:#172033;
 --muted:#65676b;
 --border:#dddfe2;
 --danger:#e53935;
 --success:#16a34a;
 --shadow:0 2px 10px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
 font-family:Arial,Helvetica,sans-serif;
 background:var(--bg);
 color:var(--text);
}
body.dark{
 --bg:#101318;
 --card:#181c23;
 --text:#f5f7fa;
 --muted:#aeb6c2;
 --border:#303640;
}
button,input,textarea,select{
 font:inherit;
}
button{
 cursor:pointer;
 border:0;
}
.hidden{display:none!important}
.topbar{
 position:sticky;
 top:0;
 z-index:100;
 height:62px;
 background:var(--card);
 border-bottom:1px solid var(--border);
 display:flex;
 align-items:center;
 padding:8px 12px;
 gap:10px;
}
.logo{
 color:var(--blue);
 font-size:21px;
 font-weight:800;
 white-space:nowrap;
}
.search{
 flex:1;
 max-width:500px;
 background:var(--bg);
 border:0;
 outline:none;
 border-radius:25px;
 padding:11px 15px;
 color:var(--text);
}
.top-actions{
 margin-left:auto;
 display:flex;
 gap:5px;
}
.circle{
 width:40px;
 height:40px;
 border-radius:50%;
 background:var(--bg);
 color:var(--text);
}
.layout{
 max-width:1450px;
 margin:auto;
 display:grid;
 grid-template-columns:240px minmax(0,720px) 280px;
 gap:15px;
 padding:15px;
}
.left,.right{
 position:sticky;
 top:77px;
 height:max-content;
}
.card,.panel{
 background:var(--card);
 border:1px solid var(--border);
 border-radius:14px;
 box-shadow:var(--shadow);
 margin-bottom:14px;
 overflow:hidden;
}
.menu button{
 display:block;
 width:100%;
 background:transparent;
 color:var(--text);
 text-align:left;
 padding:12px 14px;
 border-radius:10px;
}
.menu button:hover{
 background:var(--bg);
}
.menu button.active{
 background:#e7f0ff;
 color:var(--blue);
 font-weight:700;
}
body.dark .menu button.active{
 background:#162946;
}
.pad{padding:14px}
.row{
 display:flex;
 align-items:center;
 gap:10px;
}
.between{
 justify-content:space-between;
}
.wrap{flex-wrap:wrap}
.avatar{
 width:42px;
 height:42px;
 border-radius:50%;
 object-fit:cover;
 background:#ccd6e5;
}
.avatar.small{
 width:32px;
 height:32px;
}
.avatar.big{
 width:90px;
 height:90px;
}
.muted{
 color:var(--muted);
 font-size:13px;
}
.bold{font-weight:700}
.primary{
 background:var(--blue);
 color:#fff;
 padding:10px 16px;
 border-radius:8px;
}
.secondary{
 background:var(--bg);
 color:var(--text);
 padding:10px 14px;
 border-radius:8px;
}
.danger{
 background:#fee2e2;
 color:#b91c1c;
 padding:10px 14px;
 border-radius:8px;
}
input,textarea,select{
 width:100%;
 border:1px solid var(--border);
 border-radius:9px;
 padding:11px;
 background:var(--card);
 color:var(--text);
 outline:none;
}
textarea{resize:vertical}
.field{margin-bottom:10px}
.composer textarea{
 border:0;
 background:var(--bg);
 border-radius:20px;
 min-height:55px;
}
.actionbar{
 display:flex;
 flex-wrap:wrap;
 gap:5px;
 margin-top:10px;
}
.action{
 background:transparent;
 color:var(--muted);
 padding:9px 10px;
 border-radius:8px;
}
.action:hover{
 background:var(--bg);
 color:var(--text);
}
.post-head{
 padding:14px;
}
.post-text{
 white-space:pre-wrap;
 line-height:1.55;
 padding:0 14px 10px;
}
.post-media{
 width:100%;
 max-height:620px;
 object-fit:cover;
 display:block;
}
.stats{
 display:flex;
 justify-content:space-between;
 color:var(--muted);
 padding:9px 14px;
 border-top:1px solid var(--border);
}
.comment-area{
 padding:10px 14px 14px;
}
.comment{
 padding:8px;
 background:var(--bg);
 border-radius:10px;
 margin-bottom:6px;
}
.comment-input{
 display:flex;
 gap:7px;
}
.comment-input input{border-radius:20px}
.storybar{
 display:flex;
 gap:9px;
 overflow-x:auto;
 padding:12px;
}
.story-card{
 min-width:92px;
 height:145px;
 border-radius:13px;
 background-size:cover;
 background-position:center;
 position:relative;
 overflow:hidden;
 border:1px solid var(--border);
}
.story-card:after{
 content:"";
 position:absolute;
 inset:0;
 background:linear-gradient(transparent,#000b);
}
.story-card span{
 position:absolute;
 z-index:2;
 bottom:8px;
 left:8px;
 right:5px;
 color:#fff;
 font-size:12px;
 font-weight:bold;
}
.profile-cover{
 height:220px;
 background:#d8e2f0 center/cover no-repeat;
}
.profile-info{
 margin-top:-45px;
 position:relative;
 padding:0 18px 18px;
}
.profile-tabs{
 display:flex;
 overflow:auto;
 border-top:1px solid var(--border);
}
.profile-tabs button{
 background:transparent;
 color:var(--muted);
 padding:13px 18px;
}
.profile-tabs button.active{
 color:var(--blue);
 border-bottom:3px solid var(--blue);
}
.reel{
 height:calc(100vh - 82px);
 min-height:500px;
 background:#000;
 border-radius:14px;
 overflow:hidden;
 position:relative;
 margin-bottom:14px;
}
.reel video{
 width:100%;
 height:100%;
 object-fit:cover;
}
.reel-overlay{
 position:absolute;
 inset:0;
 background:linear-gradient(transparent 55%,rgba(0,0,0,.8));
 pointer-events:none;
}
.reel-info{
 position:absolute;
 bottom:18px;
 left:15px;
 right:90px;
 color:white;
}
.reel-actions{
 position:absolute;
 bottom:70px;
 right:10px;
 display:flex;
 flex-direction:column;
 gap:8px;
}
.reel-actions button{
 width:48px;
 height:48px;
 border-radius:50%;
 background:#0009;
 color:#fff;
 font-size:18px;
}
.badge{
 display:inline-block;
 background:#e7f0ff;
 color:var(--blue);
 padding:3px 8px;
 border-radius:20px;
 font-size:11px;
 font-weight:bold;
}
.modal{
 position:fixed;
 inset:0;
 background:#0008;
 z-index:500;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:15px;
}
.modal-box{
 background:var(--card);
 color:var(--text);
 width:min(650px,100%);
 max-height:90vh;
 overflow:auto;
 border-radius:15px;
 padding:18px;
}
.modal-head{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:15px;
}
.close{
 width:35px;
 height:35px;
 border-radius:50%;
 background:var(--bg);
 color:var(--text);
}
.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px;
}
.feature{
 background:var(--bg);
 padding:14px;
 border-radius:12px;
}
.stat-grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px;
}
.stat{
 background:var(--bg);
 padding:14px;
 border-radius:12px;
}
.stat b{
 display:block;
 font-size:22px;
 margin-top:5px;
}
.chat-list{
 max-height:350px;
 overflow:auto;
}
.chat-item{
 padding:11px;
 border-bottom:1px solid var(--border);
 cursor:pointer;
}
.chat-item:hover{background:var(--bg)}
.toast{
 position:fixed;
 left:50%;
 bottom:25px;
 transform:translateX(-50%);
 background:#111;
 color:#fff;
 padding:11px 18px;
 border-radius:30px;
 z-index:9999;
 display:none;
}
.empty{
 text-align:center;
 padding:35px 15px;
 color:var(--muted);
}
hr{
 border:0;
 border-top:1px solid var(--border);
}
@media(max-width:1050px){
 .layout{grid-template-columns:70px minmax(0,1fr)}
 .right{display:none}
 .left .label{display:none}
 .left{top:77px}
 .menu button{text-align:center;font-size:20px}
}
@media(max-width:700px){
 .topbar{height:58px}
 .logo{font-size:17px}
 .search{max-width:none}
 .top-actions .optional{display:none}
 .layout{
  display:block;
  padding:7px;
 }
 .left{display:none}
 .card,.panel{border-radius:10px}
 .profile-cover{height:170px}
 .grid{grid-template-columns:1fr}
 .reel{
  height:calc(100vh - 70px);
  border-radius:8px;
 }
}
</style>
</head>

<body>

<div id="toast" class="toast"></div>

<!-- TOPBAR -->
<header class="topbar">
 <div class="logo">My Social App</div>
 <input id="globalSearch" class="search" placeholder="Search people, posts, reels, hashtags...">
 <div class="top-actions">
  <button class="circle" onclick="openPage('notifications')">🔔</button>
  <button class="circle optional" onclick="openPage('messages')">💬</button>
  <button class="circle" onclick="openPage('profile')">👤</button>
 </div>
</header>

<div class="layout">

<!-- LEFT -->
<aside class="left">
 <div class="panel menu">
  <button class="active" data-page="home" onclick="openPage('home',this)">🏠 <span class="label">Home</span></button>
  <button data-page="reels" onclick="openPage('reels',this)">🎬 <span class="label">Reels</span></button>
  <button data-page="friends" onclick="openPage('friends',this)">👥 <span class="label">Friends</span></button>
  <button data-page="messages" onclick="openPage('messages',this)">💬 <span class="label">Messages</span></button>
  <button data-page="notifications" onclick="openPage('notifications',this)">🔔 <span class="label">Notifications</span></button>
  <button data-page="search" onclick="openPage('search',this)">🔎 <span class="label">Search</span></button>
  <button data-page="groups" onclick="openPage('groups',this)">👨‍👩‍👧‍👦 <span class="label">Groups</span></button>
  <button data-page="pages" onclick="openPage('pages',this)">📄 <span class="label">Pages</span></button>
  <button data-page="marketplace" onclick="openPage('marketplace',this)">🛒 <span class="label">Marketplace</span></button>
  <button data-page="creator" onclick="openPage('creator',this)">💰 <span class="label">Creator</span></button>
  <button data-page="live" onclick="openPage('live',this)">🔴 <span class="label">Live</span></button>
  <button data-page="admin" onclick="openPage('admin',this)">⚙️ <span class="label">Admin</span></button>
  <button data-page="settings" onclick="openPage('settings',this)">🛠️ <span class="label">Settings</span></button>
  <button onclick="logout()">🚪 <span class="label">Logout</span></button>
 </div>
</aside>

<!-- MAIN -->
<main id="app"></main>

<!-- RIGHT -->
<aside class="right">

 <div class="panel pad">
  <div class="bold">Quick Actions</div>
  <button class="menuBtn" onclick="openComposer()">➕ Create Post</button>
  <button class="menuBtn" onclick="openReelUpload()">🎬 Upload Reel</button>
  <button class="menuBtn" onclick="openStoryUpload()">⭕ Add Story</button>
  <button class="menuBtn" onclick="openPage('messages')">💬 New Message</button>
  <button class="menuBtn" onclick="openPage('live')">🔴 Go Live</button>
 </div>

 <div class="panel pad">
  <div class="bold">People You May Know</div>
  <div id="suggestions"></div>
 </div>

 <div class="panel pad">
  <div class="bold">Trending</div>
  <p class="muted">#MySocialApp</p>
  <p class="muted">#Bangladesh</p>
  <p class="muted">#Reels</p>
  <p class="muted">#Trending</p>
 </div>

</aside>
</div>

<!-- AUTH -->
<div id="authModal" class="modal">
 <div class="modal-box" style="max-width:430px">
  <h2>My Social App</h2>
  <p class="muted">Login অথবা নতুন account তৈরি করুন</p>

  <div class="field">
   <input id="authEmail" type="email" placeholder="Email">
  </div>
  <div class="field">
   <input id="authPassword" type="password" placeholder="Password">
  </div>
  <div class="field" id="authNameBox">
   <input id="authName" placeholder="আপনার নাম">
  </div>

  <button id="loginBtn" class="primary" style="width:100%" onclick="login()">Login</button>
  <button class="secondary" style="width:100%;margin-top:8px" onclick="register()">Create new account</button>
  <p id="authMessage" class="muted"></p>
 </div>
</div>

<!-- UNIVERSAL MODAL -->
<div id="modal" class="modal hidden">
 <div class="modal-box">
  <div class="modal-head">
   <h3 id="modalTitle">Modal</h3>
   <button class="close" onclick="closeModal()">×</button>
  </div>
  <div id="modalBody"></div>
 </div>
</div>

<script>
/* ============================================================
   CONFIG
============================================================ */

const SUPABASE_URL =
"https://skereuaizdczbvjplisi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_3R2otJA1zIlsMsTYxe1ocw_NAPY5O9x";

const FUNCTION_URL =
"https://skereuaizdczbvjplisi.supabase.co/functions/v1/super-function";

const {createClient}=supabase;

const db=createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

let currentUser=null;
let currentProfile=null;
let currentPage="home";
let selectedChat=null;
let realtimeChannel=null;

/* ============================================================
   HELPERS
============================================================ */

function $(id){
 return document.getElementById(id);
}

function esc(v){
 return String(v??"")
 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;")
 .replaceAll("'","&#039;");
}

function toast(msg){
 const t=$("toast");
 t.textContent=msg;
 t.style.display="block";
 clearTimeout(window.toastTimer);
 window.toastTimer=setTimeout(()=>{
  t.style.display="none";
 },2600);
}

function openModal(title,html){
 $("modalTitle").textContent=title;
 $("modalBody").innerHTML=html;
 $("modal").classList.remove("hidden");
}

function closeModal(){
 $("modal").classList.add("hidden");
}

function formatDate(date){
 if(!date)return "";
 return new Date(date).toLocaleString("bn-BD",{
  dateStyle:"medium",
  timeStyle:"short"
 });
}

async function api(path,options={}){
 const session=(await db.auth.getSession()).data.session;

 const headers={
  "Content-Type":"application/json",
  ...(options.headers||{})
 };

 if(session?.access_token){
  headers.Authorization="Bearer "+session.access_token;
 }

 const res=await fetch(FUNCTION_URL+path,{
  ...options,
  headers
 });

 let data={};
 try{
  data=await res.json();
 }catch{}

 if(!res.ok){
  throw new Error(data.error||data.message||"API error");
 }

 return data;
}

/* ============================================================
   AUTH
============================================================ */

async function login(){
 const email=$("authEmail").value.trim();
 const password=$("authPassword").value;

 if(!email||!password){
  $("authMessage").textContent="Email এবং Password দিন";
  return;
 }

 const {data,error}=await db.auth.signInWithPassword({
  email,password
 });

 if(error){
  $("authMessage").textContent=error.message;
  return;
 }

 currentUser=data.user;
 await boot();
}

async function register(){
 const email=$("authEmail").value.trim();
 const password=$("authPassword").value;
 const name=$("authName").value.trim()||"New User";

 if(!email||!password){
  $("authMessage").textContent="Email এবং Password দিন";
  return;
 }

 if(password.length<6){
  $("authMessage").textContent="Password কমপক্ষে 6 characters";
  return;
 }

 const {data,error}=await db.auth.signUp({
  email,password
 });

 if(error){
  $("authMessage").textContent=error.message;
  return;
 }

 if(data.user){
  await db.from("profiles").upsert({
   id:data.user.id,
   name,
   username:"user_"+data.user.id.slice(0,8)
  });

  toast("Account তৈরি হয়েছে");
 }

 $("authMessage").textContent="Email verification প্রয়োজন হতে পারে।";
}

async function logout(){
 await db.auth.signOut();
 location.reload();
}

async function boot(){
 const {data}=await db.auth.getUser();

 currentUser=data.user;

 if(!currentUser){
  $("authModal").classList.remove("hidden");
  return;
 }

 $("authModal").classList.add("hidden");

 await loadProfile();
 await loadSuggestions();
 openPage("home");
 startRealtime();
}

async function loadProfile(){
 const {data,error}=await db
 .from("profiles")
 .select("*")
 .eq("id",currentUser.id)
 .maybeSingle();

 if(error){
  console.error(error);
 }

 currentProfile=data;

 if(!data){
  await db.from("profiles").insert({
   id:currentUser.id,
   name:currentUser.email?.split("@")[0]||"User",
   username:"user_"+currentUser.id.slice(0,8)
  });

  const r=await db.from("profiles")
   .select("*")
   .eq("id",currentUser.id)
   .maybeSingle();

  currentProfile=r.data;
 }
}

/* ============================================================
   NAVIGATION
============================================================ */

function openPage(page,btn){
 currentPage=page;

 document.querySelectorAll(".menu button[data-page]")
 .forEach(x=>x.classList.remove("active"));

 if(btn)btn.classList.add("active");

 const found=document.querySelector(
  `.menu button[data-page="${page}"]`
 );

 if(found)found.classList.add("active");

 const funcs={
  home:renderHome,
  reels:renderReels,
  friends:renderFriends,
  messages:renderMessages,
  notifications:renderNotifications,
  search:renderSearch,
  groups:renderGroups,
  pages:renderPages,
  marketplace:renderMarketplace,
  creator:renderCreator,
  live:renderLive,
  admin:renderAdmin,
  settings:renderSettings,
  profile:renderProfile
 };

 (funcs[page]||renderHome)();
}

/* ============================================================
   HOME
============================================================ */

async function renderHome(){
 $("app").innerHTML=`
 <section>

  <div class="card">
   <div class="storybar" id="stories"></div>
  </div>

  <div class="card composer pad">
   <div class="row">
    <img class="avatar" src="${esc(currentProfile?.profile_photo||"")}">
    <textarea id="postText" placeholder="${esc(currentProfile?.name||"আপনি")} কী ভাবছেন?"></textarea>
   </div>

   <div class="actionbar">
    <button class="action" onclick="selectPostImage()">📷 Photo</button>
    <button class="action" onclick="openReelUpload()">🎬 Reel</button>
    <button class="action" onclick="openStoryUpload()">⭕ Story</button>
    <button class="action" onclick="openPoll()">📊 Poll</button>
    <button class="action" onclick="openFeeling()">😊 Feeling</button>
    <button class="action" onclick="openLocation()">📍 Location</button>
    <button class="action" onclick="openPrivacy()">🔒 Privacy</button>
   </div>

   <input id="postImage" type="file" accept="image/*" class="hidden"
    onchange="previewPostImage(this)">

   <div id="postPreview"></div>

   <div style="margin-top:10px">
    <button class="primary" onclick="createPost()">Post</button>
   </div>
  </div>

  <div id="feed">
   <div class="empty">Feed loading...</div>
  </div>

 </section>
 `;

 await loadStories();
 await loadFeed();
}

/* ============================================================
   FEED
============================================================ */

async function loadFeed(){
 const feed=$("feed");

 try{
  const data=await api("/feed");

  const posts=data.posts||data.data||[];

  if(!posts.length){
   feed.innerHTML=`
   <div class="card empty">
    এখনো কোনো post নেই।
    <br><br>
    প্রথম post আপনি করুন।
   </div>`;
   return;
  }

  feed.innerHTML=posts.map(renderPost).join("");

 }catch(e){

  console.error(e);

  const {data,error}=await db
   .from("posts")
   .select(`
    id,user_id,text,image_url,created_at,privacy,
    feeling,location,view_count,
    profiles(name,username,profile_photo,verified)
   `)
   .order("created_at",{ascending:false})
   .limit(30);

  if(error){
   feed.innerHTML=`
   <div class="card empty">
    Feed load হয়নি।
    <br>${esc(error.message)}
   </div>`;
   return;
  }

  feed.innerHTML=(data||[]).map(renderPost).join("");
 }
}

function renderPost(p){
 const profile=p.profiles||p.profile||{};
 const name=profile.name||p.name||"User";

 return `
 <article class="card post" id="post-${p.id}">

  <div class="post-head row between">
   <div class="row">
    <img class="avatar" src="${esc(profile.profile_photo||"")}">
    <div>
     <div class="bold">
      ${esc(name)}
      ${profile.verified?'<span class="badge">✓ Verified</span>':""}
     </div>
     <div class="muted">
      ${formatDate(p.created_at)}
      ${p.location?" · 📍 "+esc(p.location):""}
      ${p.privacy?" · "+esc(p.privacy):""}
     </div>
    </div>
   </div>

   <button class="circle"
    onclick="postMenu(${p.id})">⋯</button>
  </div>

  ${p.text?`<div class="post-text">${esc(p.text)}</div>`:""}

  ${p.feeling?`<div class="post-text">😊 ${esc(p.feeling)}</div>`:""}

  ${p.image_url?
   `<img class="post-media" src="${esc(p.image_url)}" loading="lazy">`
   :""
  }

  <div class="stats">
   <span>❤️ <span id="likes-${p.id}">0</span></span>
   <span>💬 <span id="comments-${p.id}">0</span> · 👁 ${p.view_count||0}</span>
  </div>

  <div class="actionbar pad">
   <button class="action" onclick="likePost(${p.id})">❤️ Like</button>
   <button class="action" onclick="reactionMenu('post',${p.id})">😊 Reaction</button>

async function uploadFile(bucket,file){
 const ext=file.name.split(".").pop();
 const path=`${currentUser.id}/${Date.now()}.${ext}`;

 const {error}=await db.storage
  .from(bucket)
  .upload(path,file,{upsert:false});

 if(error)throw error;

 const {data}=db.storage
  .from(bucket)
  .getPublicUrl(path);

 return data.publicUrl;
}

   image_url=await uploadFile("post-images",selectedImageFile);
  }

  await api("/posts",{
   method:"POST",
   body:JSON.stringify({
    text:text||"",
    image_url,
    privacy:postPrivacy,
    feeling:postFeeling,
    location:postLocation,
    poll:postPoll
   })
  });

  selectedImageFile=null;
  postFeeling="";
  postLocation="";

  const {data,error}=await db
   .from("posts")
   .insert({

async function saveProfile(){
 let photo=currentProfile?.profile_photo||null;
 let cover=currentProfile?.cover_photo||null;

 try{

  const pf=$("profilePhoto").files[0];
  const cf=$("coverPhoto").files[0];

  if(pf)photo=await uploadFile("profile-photos",pf);
  if(cf)cover=await uploadFile("profile-photos",cf);

  const updates={
   name:$("editName").value,
   username:$("editUsername").value,
   bio:$("editBio").value,
   profile_photo:photo,
   cover_photo:cover
  };

  try{
   await api("/profile",{
    method:"PATCH",
    body:JSON.stringify(updates)
   });
  }catch{
   await db.from("profiles")
    .update(updates)
    .eq("id",currentUser.id);
  }

  closeModal();
  await loadProfile();
  renderProfile();

 }catch(e){
  toast(e.message);
 }
}

async function followUser(userId){
 if(userId===currentUser.id){
  toast("নিজেকে follow করা যাবে না");
  return;
 }

 try{
  await api(`/users/${userId}/follow`,{method:"POST"});
  toast("Follow updated");
 }catch(e){

  const {data}=await db.from("follows")
   .select("*")
   .eq("follower_id",currentUser.id)
   .eq("following_id",userId)
   .maybeSingle();

  if(data){
   await db.from("follows").delete()
    .eq("follower_id",currentUser.id)
    .eq("following_id",userId);
  }else{
   await db.from("follows").insert({
    follower_id:currentUser.id,
    following_id:userId
   });
  }

  toast("Follow updated");
 }
}

async function friendTab(tab,btn){
 document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("on"));

 const box=$("friendContent");

 if(tab==="requests"){
  try{
   const {data}=await db.from("friend_requests")

   box.innerHTML=(data||[]).map(r=>`

async function loadChats(){
 const box=$("chatList");

 try{
  const {data}=await db.from("messages")
   .select("*")
   .or(`sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`)
   .order("created_at",{ascending:false})
   .limit(30);

  const seen=new Set();

  const chats=(data||[]).filter(m=>{
   const id=m.sender_id===currentUser.id?m.receiver_id:m.sender_id;
   if(seen.has(id))return false;
   seen.add(id);
   return true;
  });

  box.innerHTML=chats.map(m=>{
   const id=m.sender_id===currentUser.id?m.receiver_id:m.sender_id;

   return `
   <div class="chat-item" onclick="openChat('${id}')">
    💬 User
    <div class="muted">${esc(m.text||"Media")}</div>
   </div>`;
  }).join("")||`<div class="empty">No conversations</div>`;

 }catch{
  box.innerHTML=`<div class="empty">No conversations</div>`;
 }
}

async function loadMessages(userId){
 const box=$("messagesBox");

 try{
  const {data}=await db.from("messages")
   .select("*")
   .or(
    `and(sender_id.eq.${currentUser.id},receiver_id.eq.${userId}),`+
    `and(sender_id.eq.${userId},receiver_id.eq.${currentUser.id})`
   )
   .order("created_at");

  box.innerHTML=(data||[]).map(m=>`
   <div style="
    display:flex;
    justify-content:${m.sender_id===currentUser.id?"flex-end":"flex-start"};
    margin:7px 0">
    <div style="
     background:${m.sender_id===currentUser.id?"#1877f2":"var(--bg)"};
     color:${m.sender_id===currentUser.id?"#fff":"var(--text)"};
     padding:9px 12px;
     border-radius:15px;
     max-width:75%">
     ${esc(m.text||"")}
     <div style="font-size:10px;opacity:.7">
      ${formatDate(m.created_at)}
     </div>
    </div>
   </div>
  `).join("");

  box.scrollTop=box.scrollHeight;

 }catch(e){
  box.innerHTML=`<div class="empty">${esc(e.message)}</div>`;
 }
}

async function sendMessage(){
 const input=$("messageInput");
 const text=input.value.trim();

 if(!text||!selectedChat)return;

 const {error}=await db.from("messages").insert({
  sender_id:currentUser.id,
  receiver_id:selectedChat,
  text
 });

 if(error){
  toast(error.message);
  return;
 }

 input.value="";
 loadMessages(selectedChat);
}

async function performSearch(q){

 searchTimer=setTimeout(async()=>{
  q=q.trim();

  if(!q){
   $("searchResults").innerHTML=`<div class="empty">Search শুরু করুন</div>`;
   return;
  }

  const {data,error}=await db.from("profiles")
   .select("id,name,username,profile_photo,verified,bio")
   .or(`name.ilike.%${q}%,username.ilike.%${q}%`)
   .limit(20);

  if(error){
   $("searchResults").innerHTML=esc(error.message);
   return;
  }

  $("searchResults").innerHTML=(data||[]).map(u=>`
   <div class="feature row between">
    <div class="row">
     <img class="avatar" src="${esc(u.profile_photo||"")}">
     <div>

  `).join("")||`<div class="empty">No results</div>`;

 },300);
}

function startRealtime(){

 if(realtimeChannel)return;

 realtimeChannel=db.channel("social-app-live");

 realtimeChannel
 .on(
  "postgres_changes",
  {
   event:"*",
   schema:"public",
   table:"notifications",
   filter:`receiver_id=eq.${currentUser.id}`
  },
  payload=>{
   if(currentPage==="notifications"){
    renderNotifications();
   }
   toast("New notification");
  }
 )
 .on(
  "postgres_changes",
  {
   event:"*",
   schema:"public",
   table:"messages",
   filter:`receiver_id=eq.${currentUser.id}`
  },
  payload=>{
   if(currentPage==="messages"&&selectedChat){
    loadMessages(selectedChat);
   }
   toast("New message");
  }
 )
 .subscribe();
}

/* ============================================================
   SERVICE WORKER
============================================================ */

if("serviceWorker" in navigator){
 try{
  const sw=`
   const CACHE='my-social-app-v1';
   self.addEventListener('install',e=>{
    self.skipWaiting();
   });
   self.addEventListener('activate',e=>{
    e.waitUntil(self.clients.claim());
   });
   self.addEventListener('fetch',e=>{
    if(e.request.method==='GET'){
     e.respondWith(
      caches.match(e.request).then(c=>c||fetch(e.request))
     );
    }
   });
  `;

  const blob=new Blob([sw],{type:"text/javascript"});
  const url=URL.createObjectURL(blob);
  navigator.serviceWorker.register(url).catch(()=>{});
 }catch{}
}
