<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">

<title>My Social App</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  background:#f5f6f8;
  color:#111;
  font-family:Arial,Helvetica,sans-serif;
}

body.dark{
  background:#0d0f12;
  color:#fff;
}

button,input,textarea,select{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* AUTH */

#authScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.authBox{
  width:100%;
  max-width:430px;
  background:#fff;
  border-radius:24px;
  padding:25px;
  box-shadow:0 15px 50px #0002;
}

.dark .authBox{
  background:#171a20;
}

.logo{
  text-align:center;
  font-size:30px;
  font-weight:900;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#777;
  margin-bottom:22px;
}

.authBox input{
  width:100%;
  padding:15px;
  border:1px solid #ddd;
  border-radius:14px;
  margin:6px 0;
  outline:none;
}

.dark .authBox input{
  background:#22262e;
  color:#fff;
  border-color:#333;
}

.primary{
  width:100%;
  padding:15px;
  background:#1877f2;
  color:#fff;
  border-radius:14px;
  font-weight:800;
  margin-top:10px;
}

.secondary{
  width:100%;
  padding:14px;
  background:#eef2f7;
  color:#222;
  border-radius:14px;
  font-weight:700;
  margin-top:8px;
}

.dark .secondary{
  background:#252a33;
  color:#fff;
}

.authMsg{
  margin-top:12px;
  text-align:center;
  font-size:14px;
}

/* APP */

#app{
  min-height:100vh;
  padding-bottom:78px;
}

.topbar{
  position:sticky;
  top:0;
  z-index:100;
  height:60px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 12px;
  background:#ffffffee;
  backdrop-filter:blur(15px);
  border-bottom:1px solid #ddd;
}

.dark .topbar{
  background:#101216ee;
  border-color:#252932;
}

.brand{
  font-size:21px;
  font-weight:900;
  white-space:nowrap;
}

.search{
  flex:1;
  background:#eef1f5;
  border-radius:20px;
  padding:10px 14px;
  border:0;
  outline:0;
}

.dark .search{
  background:#22262e;
  color:#fff;
}

.iconBtn{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#eef1f5;
  font-size:18px;
}

.dark .iconBtn{
  background:#242830;
  color:#fff;
}

.content{
  width:100%;
  max-width:700px;
  margin:auto;
  padding:12px;
}

/* CREATE */

.createCard{
  background:#fff;
  border-radius:20px;
  padding:15px;
  margin-bottom:12px;
  box-shadow:0 3px 16px #0000000b;
}

.dark .createCard,
.dark .postCard{
  background:#171a20;
}

.createTop{
  display:flex;
  align-items:center;
  gap:10px;
}

.avatar{
  width:44px;
  height:44px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd;
}

.createInput{
  flex:1;
  background:#f0f2f5;
  border-radius:22px;
  padding:12px 16px;
  color:#777;
  cursor:pointer;
}

.dark .createInput{
  background:#252a32;
}

.createActions{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:12px;
}

.createActions button{
  padding:12px 5px;
  border-radius:12px;
  background:#f3f5f8;
  font-weight:700;
}

.dark .createActions button{
  background:#242830;
  color:#fff;
}

/* POSTS */

.postCard{
  background:#fff;
  border-radius:20px;
  margin-bottom:14px;
  overflow:hidden;
  box-shadow:0 3px 16px #0000000b;
}

.postHeader{
  display:flex;
  align-items:center;
  gap:10px;
  padding:14px;
}

.postUser{
  flex:1;
}

.postUser strong{
  display:block;
}

.postUser small{
  color:#777;
}

.postText{
  padding:0 14px 12px;
  line-height:1.5;
}

.postMedia{
  width:100%;
  max-height:650px;
  object-fit:cover;
  display:block;
  background:#000;
}

.postActions{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  border-top:1px solid #eee;
  margin-top:5px;
}

.dark .postActions{
  border-color:#292d35;
}

.postActions button{
  padding:13px 4px;
  background:transparent;
}

.commentBox{
  display:flex;
  gap:8px;
  padding:10px 12px 14px;
}

.commentBox input{
  flex:1;
  padding:11px 14px;
  border:0;
  background:#f0f2f5;
  border-radius:20px;
  outline:none;
}

.dark .commentBox input{
  background:#242830;
  color:#fff;
}

/* BOTTOM NAV */

.bottomNav{
  position:fixed;
  z-index:150;
  bottom:0;
  left:0;
  right:0;
  height:66px;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  background:#ffffffee;
  backdrop-filter:blur(16px);
  border-top:1px solid #ddd;
}

.dark .bottomNav{
  background:#111318ee;
  border-color:#282c34;
}

.bottomNav button{
  background:transparent;
  font-size:21px;
}

.bottomNav small{
  display:block;
  font-size:10px;
}

/* UPLOAD STUDIO */

.modal{
  position:fixed;
  inset:0;
  z-index:500;
  background:#0008;
  display:flex;
  align-items:flex-end;
  justify-content:center;
}

.uploadPanel{
  width:100%;
  max-width:720px;
  max-height:96vh;
  overflow:auto;
  background:#fff;
  border-radius:28px 28px 0 0;
  padding:16px;
}

.dark .uploadPanel{
  background:#111419;
  color:#fff;
}

.uploadHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}

.uploadHeader h2{
  margin:0;
}

.closeBtn{
  width:38px;
  height:38px;
  border-radius:50%;
  background:#eee;
}

.dark .closeBtn{
  background:#292e37;
  color:#fff;
}

.modeTabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:12px;
}

.modeTabs button{
  padding:13px;
  border-radius:13px;
  background:#eef1f5;
  font-weight:800;
}

.modeTabs button.active{
  background:#1877f2;
  color:#fff;
}

.dropZone{
  border:2px dashed #b8c0cc;
  border-radius:20px;
  padding:25px 15px;
  text-align:center;
  margin-bottom:12px;
}

.dropZone strong{
  display:block;
  font-size:18px;
  margin-bottom:5px;
}

.pickBtn{
  background:#1877f2;
  color:#fff;
  padding:12px 18px;
  border-radius:12px;
  font-weight:800;
  margin-top:10px;
}

#fileInput{
  display:none;
}

/* MEDIA PREVIEW */

.mediaPreview{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  margin:12px 0;
}

.previewItem{
  position:relative;
  overflow:hidden;
  border-radius:15px;
  background:#000;
  min-height:130px;
}

.previewItem img,
.previewItem video{
  width:100%;
  height:100%;
  min-height:130px;
  object-fit:cover;
  display:block;
}

.removeMedia{
  position:absolute;
  top:7px;
  right:7px;
  width:30px;
  height:30px;
  border-radius:50%;
  background:#000b;
  color:#fff;
}

/* EDITOR */

.editor{
  background:#f5f6f8;
  border-radius:18px;
  padding:12px;
  margin:10px 0;
}

.dark .editor{
  background:#1b1f26;
}

.editorTitle{
  font-weight:900;
  margin-bottom:10px;
}

.control{
  margin:10px 0;
}

.control label{
  display:flex;
  justify-content:space-between;
  font-size:13px;
  margin-bottom:5px;
}

.control input[type=range]{
  width:100%;
}

.effectGrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
}

.effectGrid button{
  padding:9px 3px;
  border-radius:9px;
  background:#fff;
  font-size:12px;
}

.dark .effectGrid button{
  background:#292e37;
  color:#fff;
}

.effectGrid button.active{
  background:#1877f2;
  color:#fff;
}

.uploadInput,
.uploadSelect,
.caption{
  width:100%;
  border:1px solid #ddd;
  border-radius:13px;
  padding:12px;
  margin:6px 0;
  outline:none;
  background:#fff;
}

.dark .uploadInput,
.dark .uploadSelect,
.dark .caption{
  background:#20242b;
  color:#fff;
  border-color:#333;
}

.caption{
  min-height:100px;
  resize:vertical;
}

.optionGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.optionBox{
  padding:12px;
  border-radius:12px;
  background:#f0f2f5;
}

.dark .optionBox{
  background:#232831;
}

.optionBox label{
  font-size:13px;
  display:block;
  margin-bottom:5px;
}

.progressBox{
  margin-top:12px;
  display:none;
}

.progressTrack{
  height:9px;
  background:#e2e5ea;
  border-radius:10px;
  overflow:hidden;
}

.progressBar{
  height:100%;
  width:0%;
  background:#1877f2;
  transition:.2s;
}

.progressText{
  text-align:center;
  font-size:12px;
  margin-top:5px;
}

.publishBtn{
  width:100%;
  padding:15px;
  border-radius:14px;
  background:#1877f2;
  color:#fff;
  font-weight:900;
  font-size:16px;
  margin-top:10px;
}

.publishBtn:disabled{
  opacity:.5;
}

/* COVER */

.coverPreview{
  width:100%;
  aspect-ratio:16/9;
  object-fit:cover;
  background:#000;
  border-radius:15px;
  margin-top:8px;
}

/* TOAST */

.toast{
  position:fixed;
  z-index:1000;
  left:50%;
  bottom:85px;
  transform:translateX(-50%);
  background:#111;
  color:#fff;
  padding:12px 18px;
  border-radius:20px;
  display:none;
  max-width:90%;
  text-align:center;
}

/* LOADING */

.loader{
  padding:35px;
  text-align:center;
  color:#777;
}

/* RESPONSIVE */

@media(max-width:500px){
  .content{
    padding:8px;
  }

  .topbar{
    height:56px;
  }

  .brand{
    font-size:18px;
  }

  .search{
    min-width:0;
  }

  .uploadPanel{
    max-height:98vh;
  }

  .effectGrid{
    grid-template-columns:repeat(4,1fr);
  }
}
</style>
</head>

<body>

<!-- AUTH -->

<section id="authScreen">

  <div class="authBox">

    <div class="logo">My Social App</div>

    <div class="subtitle">
      Connect • Create • Share
    </div>

    <div id="loginForm">

      <input
        id="loginEmail"
        type="email"
        placeholder="Email"
        autocomplete="email">

      <input
        id="loginPassword"
        type="password"
        placeholder="Password"
        autocomplete="current-password">

      <button class="primary" onclick="login()">
        Login
      </button>

      <button class="secondary" onclick="showSignup()">
        Create New Account
      </button>

      <button class="secondary" onclick="resetPassword()">
        Forgot Password?
      </button>

    </div>

    <div id="signupForm" class="hidden">

      <input
        id="signupName"
        type="text"
        placeholder="Your name">

      <input
        id="signupEmail"
        type="email"
        placeholder="Email">

      <input
        id="signupPassword"
        type="password"
        placeholder="Password">

      <button class="primary" onclick="signup()">
        Sign Up
      </button>

      <button class="secondary" onclick="showLogin()">
        Already have an account
      </button>

    </div>

    <div id="authMsg" class="authMsg"></div>

  </div>

</section>


<!-- APP -->

<section id="app" class="hidden">

  <header class="topbar">

    <div class="brand">My Social</div>

    <input
      class="search"
      placeholder="Search..."
      id="searchInput">

    <button
      class="iconBtn"
      onclick="toggleDark()">
      🌙
    </button>

    <button
      class="iconBtn"
      onclick="logout()">
      ⎋
    </button>

  </header>


  <main class="content">

    <!-- CREATE -->

    <div class="createCard">

      <div class="createTop">

        <img
          id="myAvatar"
          class="avatar"
          src="https://i.pravatar.cc/100">

        <div
          class="createInput"
          onclick="openUpload('post')">
          What's on your mind?
        </div>

      </div>

      <div class="createActions">

        <button onclick="openUpload('post')">
          📷 Photo
        </button>

        <button onclick="openUpload('reel')">
          🎥 Reel
        </button>

        <button onclick="openUpload('post')">
          📝 Post
        </button>

      </div>

    </div>


    <!-- FEED -->

    <div id="feed">
      <div class="loader">
        Loading posts...
      </div>
    </div>

  </main>


  <!-- NAV -->

  <nav class="bottomNav">

    <button onclick="loadFeed()">
      🏠
      <small>Home</small>
    </button>

    <button onclick="openUpload('post')">
      ➕
      <small>Create</small>
    </button>

    <button onclick="openUpload('reel')">
      🎬
      <small>Reels</small>
    </button>

    <button onclick="showToast('Profile section')">
      👤
      <small>Profile</small>
    </button>

    <button onclick="showToast('Settings')">
      ⚙️
      <small>Settings</small>
    </button>

  </nav>

</section>


<!-- UPLOAD STUDIO -->

<div
  id="uploadModal"
  class="modal hidden">

  <div class="uploadPanel">

    <div class="uploadHeader">

      <h2>✨ Upload Studio</h2>

      <button
        class="closeBtn"
        onclick="closeUpload()">
        ✕
      </button>

    </div>


    <!-- MODE -->

    <div class="modeTabs">

      <button
        id="postModeBtn"
        class="active"
        onclick="setUploadMode('post')">
        📰 Post
      </button>

      <button
        id="reelModeBtn"
        onclick="setUploadMode('reel')">
        🎬 Reel
      </button>

    </div>


    <!-- DROP -->

    <div
      class="dropZone"
      id="dropZone"
      onclick="document.getElementById('fileInput').click()">

      <strong>📤 Select Photos / Videos</strong>

      <span>
        Multiple files supported
      </span>

      <br>

      <button
        class="pickBtn"
        type="button"
        onclick="event.stopPropagation();document.getElementById('fileInput').click()">
        Choose Files
      </button>

    </div>

    <input
      id="fileInput"
      type="file"
      multiple
      accept="image/*,video/*">


    <!-- MEDIA -->

    <div
      id="mediaPreview"
      class="mediaPreview">
    </div>


    <!-- VIDEO EDITOR -->

    <div
      id="videoEditor"
      class="editor hidden">

      <div class="editorTitle">
        🎬 Video Editor
      </div>

      <div class="control">

        <label>
          <span>Trim Start</span>
          <span id="trimStartValue">0s</span>
        </label>

        <input
          id="trimStart"
          type="range"
          min="0"
          max="0"
          value="0">

      </div>


      <div class="control">

        <label>
          <span>Trim End</span>
          <span id="trimEndValue">0s</span>
        </label>

        <input
          id="trimEnd"
          type="range"
          min="0"
          max="0"
          value="0">

      </div>


      <div class="control">

        <label>
          <span>Speed</span>
          <span id="speedValue">1x</span>
        </label>

        <input
          id="speedRange"
          type="range"
          min="0.5"
          max="2"
          step="0.25"
          value="1">

      </div>


      <div class="control">

        <label>
          Brightness
          <span id="brightnessValue">100%</span>
        </label>

        <input
          id="brightness"
          type="range"
          min="50"
          max="150"
          value="100">

      </div>


      <div class="control">

        <label>
          Contrast
          <span id="contrastValue">100%</span>
        </label>

        <input
          id="contrast"
          type="range"
          min="50"
          max="150"
          value="100">

      </div>


      <div class="control">

        <label>
          Saturation
          <span id="saturationValue">100%</span>
        </label>

        <input
          id="saturation"
          type="range"
          min="0"
          max="200"
          value="100">

      </div>


      <div class="control">

        <label>Effects</label>

        <div class="effectGrid">

          <button
            class="effectBtn active"
            data-effect="none"
            onclick="setEffect('none',this)">
            Normal
          </button>

          <button
            class="effectBtn"
            data-effect="grayscale"
            onclick="setEffect('grayscale',this)">
            B&W
          </button>

          <button
            class="effectBtn"
            data-effect="sepia"
            onclick="setEffect('sepia',this)">
            Sepia
          </button>

          <button
            class="effectBtn"
            data-effect="vintage"
            onclick="setEffect('vintage',this)">
            Vintage
          </button>

        </div>

      </div>


      <div class="control">

        <label>
          Original Audio
        </label>

        <button
          id="muteBtn"
          class="secondary"
          onclick="toggleMute()">
          🔊 Audio On
        </button>

      </div>


      <div class="control">

        <label>
          Custom Cover
        </label>

        <input
          id="coverInput"
          class="uploadInput"
          type="file"
          accept="image/*">

        <img
          id="coverPreview"
          class="coverPreview hidden">

      </div>

    </div>


    <!-- POST DETAILS -->

    <div class="editor">

      <div class="editorTitle">
        📝 Publish Details
      </div>

      <textarea
        id="caption"
        class="caption"
        placeholder="Write a caption... #hashtag">
      </textarea>

      <input
        id="feeling"
        class="uploadInput"
        placeholder="😊 Feeling / Activity">

      <input
        id="location"
        class="uploadInput"
        placeholder="📍 Location">

      <div class="optionGrid">

        <div class="optionBox">

          <label>Audience</label>

          <select
            id="audience"
            class="uploadSelect">

            <option value="public">
              🌎 Public
            </option>

            <option value="friends">
              👥 Friends
            </option>

            <option value="only_me">
              🔒 Only Me
            </option>

          </select>

        </div>


        <div class="optionBox">

          <label>Comments</label>

          <select
            id="commentsEnabled"
            class="uploadSelect">

            <option value="true">
              💬 On
            </option>

            <option value="false">
              🚫 Off
            </option>

          </select>

        </div>

      </div>

    </div>


    <!-- PROGRESS -->

    <div
      id="progressBox"
      class="progressBox">

      <div class="progressTrack">

        <div
          id="progressBar"
          class="progressBar">
        </div>

      </div>

      <div
        id="progressText"
        class="progressText">
        Preparing upload...
      </div>

    </div>


    <!-- ACTION -->

    <button
      id="publishBtn"
      class="publishBtn"
      onclick="publishContent()">

      🚀 Publish Now

    </button>

    <button
      id="cancelUploadBtn"
      class="secondary hidden"
      onclick="cancelUpload()">

      Cancel Upload

    </button>

  </div>

</div>


<div
  id="toast"
  class="toast">
</div>


<script>

/* =====================================================
   SUPABASE CONFIG
   ===================================================== */

const SUPABASE_URL =
  "https://skereuaizdczbvjplisi.supabase.co";

/*
  তোমার বর্তমান Publishable/Anon key এখানে বসাও।
*/
const SUPABASE_KEY =
  "YOUR_SUPABASE_PUBLISHABLE_KEY";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   GLOBAL STATE
   ===================================================== */

let currentUser = null;

let uploadMode = "post";

let selectedFiles = [];

let currentVideoFile = null;

let currentVideoDuration = 0;

let uploadCancelled = false;

let currentEffect = "none";

let mutedVideo = false;

let currentCoverFile = null;


/* =====================================================
   START
   ===================================================== */

document.addEventListener("DOMContentLoaded", async () => {

  setupEvents();

  const {
    data
  } = await supabaseClient.auth.getSession();

  if(data && data.session){

    currentUser =
      data.session.user;

    showApp();

  }else{

    showAuth();

  }

});


supabaseClient.auth.onAuthStateChange(
  async (event, session) => {

    if(session){

      currentUser =
        session.user;

      showApp();

    }else{

      currentUser = null;

      showAuth();

    }

  }
);


/* =====================================================
   AUTH
   ===================================================== */

function showAuth(){

  document
    .getElementById("authScreen")
    .classList.remove("hidden");

  document
    .getElementById("app")
    .classList.add("hidden");

}


function showApp(){

  document
    .getElementById("authScreen")
    .classList.add("hidden");

  document
    .getElementById("app")
    .classList.remove("hidden");

  loadFeed();

}


function showSignup(){

  document
    .getElementById("loginForm")
    .classList.add("hidden");

  document
    .getElementById("signupForm")

/* =====================================================
   FILE EVENTS
   ===================================================== */

function setupEvents(){

  const fileInput =
    document
      .getElementById("fileInput");

  fileInput.addEventListener(
    "change",
    event => {

      addFiles(
        Array.from(
          event.target.files
        )
      );

    }
  );


  const dropZone =
    document
      .getElementById("dropZone");

  dropZone.addEventListener(
    "dragover",
    e => {

      e.preventDefault();

    }
  );


  dropZone.addEventListener(
    "drop",
    e => {

      e.preventDefault();

      addFiles(
        Array.from(
          e.dataTransfer.files
        )
      );

    }
  );


  document
    .getElementById("brightness")
    .addEventListener(
      "input",
      applyVideoControls
    );

  document
    .getElementById("contrast")
    .addEventListener(
      "input",
      applyVideoControls
    );

  document
    .getElementById("saturation")
    .addEventListener(
      "input",
      applyVideoControls
    );


  document
    .getElementById("speedRange")
    .addEventListener(
      "input",
      applyVideoControls
    );


  document
    .getElementById("trimStart")
    .addEventListener(
      "input",
      () => {

        const value =
          Number(
            document
              .getElementById("trimStart")
              .value
          );

        document
          .getElementById("trimStartValue")
          .textContent =
            value + "s";

      }
    );


  document
    .getElementById("trimEnd")
    .addEventListener(
      "input",
      () => {

        const value =
          Number(
            document
              .getElementById("trimEnd")
              .value
          );

        document
          .getElementById("trimEndValue")
          .textContent =
            value + "s";

      }
    );


  document
    .getElementById("coverInput")
    .addEventListener(
      "change",
      handleCover
    );

}


function addFiles(files){

  if(!files.length)
    return;

  const valid =
    files.filter(file => {

      return (
        file.type.startsWith("image/") ||
        file.type.startsWith("video/")
      );

    });

  if(!valid.length){

    showToast(
      "শুধু image অথবা video upload করা যাবে."
    );

    return;

  }

  selectedFiles =
    [
      ...selectedFiles,
      ...valid
    ];

  renderMediaPreview();

  detectMainVideo();

}


/* =====================================================
   PREVIEW
   ===================================================== */

function renderMediaPreview(){

  const box =
    document
      .getElementById("mediaPreview");

  box.innerHTML =
    "";

  selectedFiles.forEach(
    (file,index) => {

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "previewItem";

      let media;

      if(file.type.startsWith("image/")){

        media =
          document.createElement(
            "img"
          );

        media.src =
          URL.createObjectURL(
            file
          );

      }else{

        media =
          document.createElement(
            "video"
          );

        media.src =
          URL.createObjectURL(
            file
          );

        media.controls =
          true;

        media.playsInline =
          true;

      }

      const remove =
        document.createElement(
          "button"
        );

      remove.className =
        "removeMedia";

      remove.textContent =
        "✕";

      remove.onclick =
        event => {

          event.stopPropagation();

          selectedFiles.splice(
            index,
            1
          );

          renderMediaPreview();

          detectMainVideo();

        };

      item.appendChild(media);

      item.appendChild(remove);

      box.appendChild(item);

    }
  );

}


function detectMainVideo(){

  currentVideoFile =
    selectedFiles.find(
      file =>
        file.type.startsWith(
          "video/"
        )
    ) || null;

  if(!currentVideoFile){

    document
      .getElementById("videoEditor")
      .classList
      .add("hidden");

    return;

  }

  const video =
    document.createElement(
      "video"
    );

  video.preload =
    "metadata";

  video.src =
    URL.createObjectURL(
      currentVideoFile
    );

  video.onloadedmetadata =
    () => {

      currentVideoDuration =
        Math.floor(
          video.duration
        );

      const start =
        document
          .getElementById("trimStart");

      const end =
        document
          .getElementById("trimEnd");

      start.max =
        currentVideoDuration;

      end.max =
        currentVideoDuration;

      end.value =
        currentVideoDuration;

      document
        .getElementById("trimEndValue")
        .textContent =
          currentVideoDuration +
          "s";

      updateEditorVisibility();

    };

}


function handleCover(event){

  const file =
    event.target.files[0];

  if(!file)
    return;

  currentCoverFile =
    file;

  const img =
    document
      .getElementById("coverPreview");

  img.src =
    URL.createObjectURL(
      file
    );

  img.classList
    .remove("hidden");

}


/* =====================================================
   VIDEO EDITOR
   ===================================================== */

function applyVideoControls(){

  const brightness =
    Number(
      document
        .getElementById("brightness")
        .value
    );

  const contrast =
    Number(
      document
        .getElementById("contrast")
        .value
    );

  const saturation =
    Number(
      document
        .getElementById("saturation")
        .value
    );

  const speed =
    Number(
      document
        .getElementById("speedRange")
        .value
    );


  document
    .getElementById("brightnessValue")
    .textContent =
      brightness + "%";

  document
    .getElementById("contrastValue")
    .textContent =
      contrast + "%";

  document
    .getElementById("saturationValue")
    .textContent =
      saturation + "%";

  document
    .getElementById("speedValue")
    .textContent =
      speed + "x";


  document
    .querySelectorAll(
      "#mediaPreview video"
    )
    .forEach(video => {

      video.style.filter =
        buildFilter();

      video.playbackRate =
        speed;

      video.muted =
        mutedVideo;

    });

}


function buildFilter(){

  const brightness =
    document
      .getElementById("brightness")
      .value;

  const contrast =
    document
      .getElementById("contrast")
      .value;

  const saturation =
    document
      .getElementById("saturation")
      .value;

  let filter =
    `brightness(${brightness}%)
     contrast(${contrast}%)
     saturate(${saturation}%)`;

  if(currentEffect === "grayscale"){

    filter +=
      " grayscale(100%)";

  }

  if(currentEffect === "sepia"){

    filter +=
      " sepia(100%)";

  }

  if(currentEffect === "vintage"){

    filter +=
      " sepia(35%) contrast(110%)";

  }

  return filter;

}


function setEffect(effect,button){

  currentEffect =
    effect;

  document
    .querySelectorAll(
      ".effectBtn"
    )
    .forEach(
      b =>
        b.classList.remove(
          "active"
        )
    );

  button.classList
    .add("active");

  applyVideoControls();

}


function toggleMute(){

  mutedVideo =
    !mutedVideo;

  const btn =
    document
      .getElementById("muteBtn");

  btn.textContent =
    mutedVideo
      ? "🔇 Audio Off"
      : "🔊 Audio On";

  applyVideoControls();

}


/* =====================================================
   STORAGE
   ===================================================== */

async function uploadFile(
  file,
  folder,
  progressCallback
){

  if(!file)
    return null;

  const ext =
    file.name
      .split(".")
      .pop()
      .toLowerCase();

  const filename =
    `${crypto.randomUUID()}.${ext}`;

  const path =
    `${folder}/${currentUser.id}/${filename}`;


  progressCallback(10);


  const {
    error
  } =
    await supabaseClient
      .storage
      .from("post-images")
      .upload(
        path,
        file,
        {
          cacheControl:
            "3600",
          upsert:false,
          contentType:
            file.type
        }
      );


  if(error){

    throw error;

  }


  progressCallback(90);


  const {
    data
  } =
    supabaseClient
      .storage
      .from("post-images")
      .getPublicUrl(
        path
      );


  progressCallback(100);


  return data.publicUrl;

}

/* =====================================================
   POST
   ===================================================== */

async function publishPost(options){

  const {
    caption,
    feeling,
    location,
    privacy,
    comments,
    progressBar,
    progressText
  } = options;


  progressText.textContent =
    "Uploading media...";


  const mediaUrls = [];


  for(
    let i=0;
    i<selectedFiles.length;
    i++
  ){

    if(uploadCancelled)
      throw new Error(
        "Upload cancelled"
      );


    const file =
      selectedFiles[i];

    const url =
      await uploadFile(
        file,
        "posts",
        percent => {

          const total =
            (
              i * 100 +
              percent
            ) /
            selectedFiles.length;

          progressBar.style.width =
            total + "%";

          progressText.textContent =
            `Uploading ${i+1}/${selectedFiles.length} • ${Math.round(total)}%`;

        }
      );


    mediaUrls.push({
      url,
      type:
        file.type.startsWith("video/")
          ? "video"
          : "image"
    });

  }


  progressText.textContent =
    "Creating post...";


  const main =
    mediaUrls[0];


  /*
    তোমার existing posts table-এর
    compatible columns ব্যবহার করা হয়েছে।
  */

  const {
    data:post,
    error
  } =
    await supabaseClient
      .from("posts")
      .insert({

        user_id:
          currentUser.id,

        text:
          caption,

        image_url:
          main &&
          main.type === "image"
            ? main.url
            : null,

        privacy:
          privacy,

        feeling:
          feeling || null,

        location:
          location || null,

        promoted:
          false,

        view_count:
          0

      })
      .select()
      .single();


  if(error)
    throw error;


  /*
    Multiple media থাকলে
    post_media table-এ রাখবে।
  */

  if(mediaUrls.length){

    const rows =
      mediaUrls.map(
        (media,index) => ({
          post_id:
            post.id,

          media_url:
            media.url,

          media_type:
            media.type,

          sort_order:
            index

        })
      );


    const {
      error:mediaError
    } =
      await supabaseClient
        .from("post_media")
        .insert(rows);


    if(mediaError){

      console.warn(
        "post_media:",
        mediaError
      );

    }

  }


  progressBar.style.width =
    "100%";

  progressText.textContent =
    "✅ Published";

}


/* =====================================================
   REEL
   ===================================================== */

async function publishReel(options){

  const {
    caption,
    progressBar,
    progressText
  } = options;


  const video =
    selectedFiles.find(
      file =>
        file.type.startsWith(
          "video/"
        )
    );


  if(!video){

    throw new Error(
      "Reel-এর জন্য একটি video নির্বাচন করুন."
    );

  }


  progressText.textContent =
    "Uploading Reel video...";


  const videoUrl =
    await uploadFile(
      video,
      "reels",
      percent => {

        progressBar.style.width =
          percent + "%";

        progressText.textContent =
          `Reel upload ${percent}%`;

      }
    );


  let coverUrl =
    null;


  if(currentCoverFile){

    progressText.textContent =
      "Uploading cover...";


    coverUrl =
      await uploadFile(
        currentCoverFile,
        "reel-covers",
        percent => {

          progressText.textContent =
            `Cover upload ${percent}%`;

        }
      );

  }


  progressText.textContent =
    "Creating Reel...";


  const {
    error
  } =
    await supabaseClient
      .from("reels")
      .insert({

        user_id:
          currentUser.id,

        video_url:
          videoUrl,

        caption:
          caption,

        views:
          0,

        audio_name:
          "",

        ...(coverUrl
          ? {cover_url:coverUrl}
          : {})

      });


  if(error)
    throw error;


  progressBar.style.width =
    "100%";

  progressText.textContent =
    "✅ Reel published";

}

async function loadFeed(){

  const feed =
    document
      .getElementById(
        "feed"
      );

  feed.innerHTML =
    `<div class="loader">
      Loading posts...
     </div>`;


  const {
    data,
    error
  } =
    await supabaseClient
      .from("posts")
      .select("*")
      .order(
        "created_at",
        {
          ascending:false
        }
      )
      .limit(30);


  if(error){

    console.error(error);

    feed.innerHTML =
      `<div class="loader">
        Feed load failed.<br>
        ${escapeHtml(error.message)}
       </div>`;

    return;

  }


  if(!data || !data.length){

    feed.innerHTML =
      `<div class="loader">
        এখনো কোনো পোস্ট নেই।<br>
        প্রথম পোস্টটি তৈরি করুন।
       </div>`;

    return;

  }


  feed.innerHTML =
    data
      .map(
        post =>
          renderPost(post)
      )
      .join("");

}


function renderPost(post){

  const text =
    escapeHtml(
      post.text || ""
    );

  const image =
    post.image_url
      ? `
        <img
          class="postMedia"
          src="${escapeAttr(post.image_url)}"
          loading="lazy">
        `
      : "";


  return `

    <article
      class="postCard">

      <div
        class="postHeader">

        <img
          class="avatar"
          src="https://i.pravatar.cc/100?u=${encodeURIComponent(post.user_id || "")}">

        <div class="postUser">

          <strong>
            My Social User
          </strong>

          <small>
            ${escapeHtml(post.privacy || "public")}
          </small>

        </div>

        <button>
          ⋯
        </button>

      </div>


      ${
        text
          ? `<div class="postText">
               ${text}
             </div>`
          : ""
      }


      ${image}


      <div
        class="postActions">

        <button
          onclick="likePost('${post.id}')">
          ❤️ Like
        </button>

        <button
          onclick="showToast('Comment section')">
          💬 Comment
        </button>

        <button
          onclick="sharePost('${post.id}')">
          ↗️ Share
        </button>

        <button
          onclick="showToast('Saved')">
          🔖 Save
        </button>

      </div>


      ${
        post.privacy !== "only_me"
          ? `
            <div class="commentBox">

              <input
                placeholder="Write a comment..."
                id="comment-${post.id}">

              <button
                onclick="addComment('${post.id}')">
                ➤

}

    return;

  }


  /*
    Existing post_likes table থাকলে
    insert করবে।
  */

  const {
    error
  } =
    await supabaseClient
      .from("post_likes")
      .insert({

        post_id:
          postId,

        user_id:
          currentUser.id

      });


  if(error){

    /*
      Duplicate হলে শুধু UI feedback
      দেওয়া হবে।
    */

    showToast(
      "❤️ Like"
    );

  }else{

    showToast(
      "❤️ Liked"
    );

  }

}


/* =====================================================
   COMMENT
   ===================================================== */

async function addComment(postId){

  if(!currentUser){

    showToast(
      "Login required."
    );

    return;

  }


  const input =
    document
      .getElementById(
        "comment-" +
        postId
      );


  if(!input)
    return;


  const text =
    input.value.trim();


  if(!text)
    return;


  const {
    error
  } =
    await supabaseClient
      .from("comments")
      .insert({

        post_id:
          postId,

        user_id:
          currentUser.id,

        text:
          text

      });


  if(error){

    showToast(
      error.message
    );

  }else{

    input.value =
      "";

    showToast(
      "💬 Comment added"
    );

  }

}


/* =====================================================
   SHARE
   ===================================================== */

async function sharePost(postId){

  const url =
    window.location.href +
    "?post=" +
    encodeURIComponent(
      postId
    );


  if(
    navigator.share
  ){

    try{

      await navigator.share({
        title:
          "My Social App",
        text:
          "Check this post",
        url
      });

    }catch(e){}

  }else{

    try{

      await navigator.clipboard.writeText(
        url
      );

      showToast(
        "🔗 Link copied"
      );

    }catch(e){

      showToast(
        url
      );

    }

  }

}


/* =====================================================
   SECURITY HELPERS
   ===================================================== */

function escapeHtml(value){

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeAttr(value){

  return escapeHtml(value);

}


/* =====================================================
   DRAG & DROP
   ===================================================== */

window.addEventListener(
  "dragover",
  e => {

    e.preventDefault();

  }
);


/* =====================================================
   KEYBOARD
   ===================================================== */

document.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Escape"
    ){

      const modal =
        document
          .getElementById(
            "uploadModal"
          );

      if(
        !modal.classList.contains(
          "hidden"
        )
      ){

        closeUpload();

      }

    }

  }
);
