<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1877f2">
<title>FriendBook - Reels</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;
 padding:0;
 width:100%;
 height:100%;
 font-family:Arial,Helvetica,sans-serif;
 background:#000;
 color:#fff;
 overflow:hidden;
}
button,input,textarea{
 font-family:inherit;
}
button{
 border:0;
 cursor:pointer;
}
.hidden{display:none!important}

/* LOGIN */
#loginPage{
 width:100%;
 height:100%;
 background:#f0f2f5;
 color:#111;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
}
.loginBox{
 width:100%;
 max-width:420px;
 background:#fff;
 padding:25px;
 border-radius:16px;
 box-shadow:0 4px 25px #0002;
}
.loginBox h1{
 color:#1877f2;
 text-align:center;
 margin:0 0 20px;
}
.loginBox input{
 width:100%;
 padding:14px;
 margin:7px 0;
 border:1px solid #ddd;
 border-radius:10px;
 font-size:16px;
}
.loginBtn{
 width:100%;
 background:#1877f2;
 color:#fff;
 padding:14px;
 border-radius:10px;
 font-size:17px;
 margin-top:8px;
}
.signupBtn{
 width:100%;
 background:#42b72a;
 color:#fff;
 padding:14px;
 border-radius:10px;
 font-size:17px;
 margin-top:8px;
}

/* APP */
#app{
 width:100%;
 height:100%;
 display:none;
 background:#000;
 position:relative;
}

/* TOP */
.topbar{
 position:absolute;
 top:0;
 left:0;
 right:0;
 height:58px;
 z-index:50;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:8px 12px;
 background:linear-gradient(#000b,transparent);
 pointer-events:none;
}
.logo{
 font-size:22px;
 font-weight:bold;
 pointer-events:auto;
}
.topActions{
 display:flex;
 gap:8px;
 pointer-events:auto;
}
.iconBtn{
 width:40px;
 height:40px;
 border-radius:50%;
 background:#0008;
 color:#fff;
 font-size:20px;
}

/* REELS */
#reelsContainer{
 width:100%;
 height:100%;
 overflow-y:auto;
 overflow-x:hidden;
 scroll-snap-type:y mandatory;
 scrollbar-width:none;
}
#reelsContainer::-webkit-scrollbar{display:none}

.reel{
 position:relative;
 width:100%;
 height:100dvh;
 min-height:100vh;
 scroll-snap-align:start;
 background:#111;
 overflow:hidden;
}

.reelVideo{
 width:100%;
 height:100%;
 object-fit:cover;
 background:#111;
}

/* fallback */
.videoOverlay{
 position:absolute;
 inset:0;
 pointer-events:none;
 background:linear-gradient(
   transparent 35%,
   transparent 45%,
   #0002 65%,
   #000b 100%
 );
}

/* right buttons */
.reelRight{
 position:absolute;
 right:10px;
 bottom:105px;
 display:flex;
 flex-direction:column;
 align-items:center;
 gap:15px;
 z-index:10;
}
.reelAction{
 display:flex;
 flex-direction:column;
 align-items:center;
 color:#fff;
 background:none;
 font-size:13px;
 text-shadow:0 1px 4px #000;
}
.reelAction .circle{
 width:48px;
 height:48px;
 border-radius:50%;
 background:#0008;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:25px;
 margin-bottom:3px;
}
.reelAction.active .circle{
 background:#1877f2;
}
.reelAction.loved .circle{
 background:#e91e63;
}

/* bottom info */
.reelInfo{
 position:absolute;
 left:12px;
 right:75px;
 bottom:22px;
 z-index:10;
 text-shadow:0 1px 5px #000;
}
.creatorRow{
 display:flex;
 align-items:center;
 gap:10px;
 margin-bottom:10px;
}
.creatorAvatar{
 width:42px;
 height:42px;
 border-radius:50%;
 object-fit:cover;
 background:#333;
 border:2px solid #fff;
}
.creatorName{
 font-weight:bold;
 font-size:16px;
}
.followBtn{
 background:#1877f2;
 color:#fff;
 padding:7px 13px;
 border-radius:7px;
 font-weight:bold;
}
.followBtn.following{
 background:#444;
}
.caption{
 font-size:15px;
 line-height:1.4;
 margin-bottom:8px;
}
.audio{
 font-size:13px;
 opacity:.95;
 display:flex;
 align-items:center;
 gap:5px;
}

/* sound */
.soundBtn{
 position:absolute;
 top:68px;
 right:12px;
 z-index:15;
 width:42px;
 height:42px;
 border-radius:50%;
 background:#0009;
 color:#fff;
 font-size:20px;
}

/* pause */
.pauseIcon{
 position:absolute;
 left:50%;
 top:50%;
 transform:translate(-50%,-50%);
 width:70px;
 height:70px;
 border-radius:50%;
 background:#0008;
 display:none;
 align-items:center;
 justify-content:center;
 font-size:35px;
 z-index:20;
}
.reel.paused .pauseIcon{
 display:flex;
}

/* top badge */
.reelBadge{
 position:absolute;
 top:72px;
 left:12px;
 z-index:10;
 background:#0008;
 border-radius:20px;
 padding:6px 11px;
 font-size:13px;
}

/* UPLOAD */
.uploadPanel{
 position:absolute;
 left:10px;
 right:10px;
 top:65px;
 z-index:100;
 background:#fff;
 color:#111;
 border-radius:15px;
 padding:16px;
 box-shadow:0 5px 30px #0008;
 max-height:80vh;
 overflow:auto;
}
.uploadPanel h3{
 margin:0 0 12px;
}
.uploadPanel input,
.uploadPanel textarea{
 width:100%;
 border:1px solid #ddd;
 border-radius:10px;
 padding:12px;
 margin:6px 0;
 font-size:15px;
}
.uploadBtn{
 width:100%;
 background:#1877f2;
 color:#fff;
 padding:13px;
 border-radius:10px;
 font-size:16px;
 margin-top:8px;
}
.cancelBtn{
 width:100%;
 background:#eee;
 color:#111;
 padding:12px;
 border-radius:10px;
 margin-top:7px;
}

/* COMMENTS */
.modal{
 position:absolute;
 inset:0;
 z-index:200;
 background:#0008;
 display:none;
 align-items:flex-end;
}
.commentBox{
 width:100%;
 max-height:78%;
 background:#fff;
 color:#111;
 border-radius:20px 20px 0 0;
 overflow:hidden;
 display:flex;
 flex-direction:column;
}
.commentHeader{
 padding:14px;
 border-bottom:1px solid #ddd;
 display:flex;
 align-items:center;
 justify-content:space-between;
 font-weight:bold;
}
.commentList{
 flex:1;
 overflow-y:auto;
 padding:10px;
}
.comment{
 display:flex;
 gap:8px;
 margin-bottom:14px;
}
.commentAvatar{
 width:36px;
 height:36px;
 border-radius:50%;
 object-fit:cover;
 background:#ddd;
 flex:none;
}
.commentBody{
 background:#f0f2f5;
 padding:8px 10px;
 border-radius:12px;
 max-width:85%;
}
.commentName{
 font-weight:bold;
 font-size:13px;
}
.commentText{
 font-size:14px;
 margin-top:3px;
}
.commentTools{
 margin-top:5px;
 display:flex;
 gap:12px;
 font-size:12px;
 color:#65676b;
}
.replyBox{
 margin-left:45px;
 margin-top:7px;
 display:none;
}
.commentInputRow{
 display:flex;
 gap:7px;
 padding:10px;
 border-top:1px solid #ddd;
}
.commentInput{
 flex:1;
 border:1px solid #ddd;
 border-radius:22px;
 padding:11px 15px;
 font-size:15px;
}
.sendComment{
 width:45px;
 height:45px;
 border-radius:50%;
 background:#1877f2;
 color:#fff;
 font-size:18px;
}

/* reaction menu */
.reactionMenu{
 position:absolute;
 right:65px;
 bottom:250px;
 z-index:80;
 background:#fff;
 color:#111;
 padding:7px;
 border-radius:30px;
 box-shadow:0 4px 20px #0008;
 display:none;
 gap:4px;
}
.reactionMenu button{
 width:42px;
 height:42px;
 border-radius:50%;
 background:#f0f2f5;
 font-size:22px;
}
.reactionMenu.show{
 display:flex;
}

/* TOAST */
#toast{
 position:absolute;
 left:50%;
 bottom:75px;
 transform:translateX(-50%);
 background:#222;
 color:#fff;
 padding:11px 16px;
 border-radius:10px;
 z-index:500;
 display:none;
 max-width:90%;
 text-align:center;
}

/* loading */
.loading{
 position:absolute;
 inset:0;
 display:flex;
 align-items:center;
 justify-content:center;
 background:#000;
 z-index:300;
 font-size:18px;
}

/* empty */
.empty{
 height:100%;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 text-align:center;
 padding:25px;
}
.empty button{
 background:#1877f2;
 color:#fff;
 padding:12px 20px;
 border-radius:10px;
 margin-top:15px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage">
  <div class="loginBox">
    <h1>FriendBook</h1>

    <input id="loginEmail" type="email" placeholder="Email">
    <input id="loginPassword" type="password" placeholder="Password">

    <button class="loginBtn" onclick="login()">Login</button>
    <button class="signupBtn" onclick="signup()">Create New Account</button>

    <div id="loginMsg" style="text-align:center;margin-top:12px;color:#e41e3f"></div>
  </div>
</div>

<!-- APP -->
<div id="app">

  <div class="topbar">
    <div class="logo">FriendBook</div>

    <div class="topActions">
      <button class="iconBtn" onclick="openUpload()">＋</button>
      <button class="iconBtn" onclick="logout()">↪</button>
    </div>
  </div>

  <div id="reelsContainer">
    <div class="loading" id="loading">Reels লোড হচ্ছে...</div>
  </div>

  <!-- UPLOAD PANEL -->
  <div id="uploadPanel" class="uploadPanel hidden">

    <h3>🎬 Create Reel</h3>

    <input id="reelVideoUrl"
           type="url"
           placeholder="Video URL দিন (https://...)">

    <input id="reelAudio"
           type="text"
           placeholder="🎵 Audio name">

    <textarea id="reelCaption"
              rows="4"
              placeholder="আপনার Reel সম্পর্কে লিখুন... #reels #friendbook"></textarea>

    <button class="uploadBtn" onclick="uploadReel()">
      🚀 Post Reel
    </button>

    <button class="cancelBtn" onclick="closeUpload()">
      Cancel
    </button>

  </div>

  <!-- COMMENTS MODAL -->
  <div id="commentModal" class="modal">

    <div class="commentBox">

      <div class="commentHeader">
        <span>💬 Comments</span>
        <button onclick="closeComments()">✕</button>
      </div>

      <div id="commentList" class="commentList">
      </div>

      <div class="commentInputRow">
        <input
          id="commentInput"
          class="commentInput"
          placeholder="Write a comment..."
          onkeydown="if(event.key==='Enter')sendComment()">

        <button class="sendComment" onclick="sendComment()">➤</button>
      </div>

    </div>

  </div>

  <div id="toast"></div>

</div>

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://skereuaizdczbvjplisi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_3R2otJA1zIlsMsTYxe1ocw_NAPY5O9x";

const sb =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   GLOBAL
========================= */

let currentUser = null;
let reels = [];
let currentCommentReel = null;

const reactions = {
  like:"👍",
  love:"❤️",
  haha:"😂",
  wow:"😮",
  sad:"😢",
  angry:"😡"
};


/* =========================
   INIT
========================= */

window.addEventListener("load", async()=>{

  const {data} =
    await sb.auth.getSession();

  if(data && data.session){

    currentUser =
      data.session.user;

    showApp();

  }else{

    showLogin();

  }

});


/* =========================
   AUTH
========================= */

async function login(){

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  if(!email || !password){

    showLoginMsg("Email এবং Password দিন");
    return;
  }

  const {data,error} =
    await sb.auth.signInWithPassword({
      email,
      password
    });

  if(error){

    showLoginMsg(error.message);
    return;
  }

  currentUser = data.user;

  showApp();
}


async function signup(){

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  if(!email || !password){

    showLoginMsg("Email এবং Password দিন");
    return;
  }

  if(password.length < 6){

    showLoginMsg(
      "Password কমপক্ষে ৬ অক্ষরের হতে হবে"
    );

    return;
  }

  const {data,error} =
    await sb.auth.signUp({
      email,
      password
    });

  if(error){

    showLoginMsg(error.message);
    return;
  }

  if(data.user){

    currentUser = data.user;

    /* profile create */

    await sb
      .from("fb_profiles")
      .upsert({
        id:data.user.id,
        name:email.split("@")[0],
        username:email.split("@")[0],
        bio:"",
        created_at:new Date().toISOString(),
        updated_at:new Date().toISOString(),
        online:true,
        last_seen:new Date().toISOString()
      });

    showApp();

  }else{

    showLoginMsg(
      "Account তৈরি হয়েছে। Email verification প্রয়োজন হতে পারে।"
    );

  }

}


async function logout(){

  await sb.auth.signOut();

  currentUser = null;

  showLogin();

}


/* =========================
   SCREEN
========================= */

function showLogin(){

  document.getElementById("loginPage")
    .style.display="flex";

  document.getElementById("app")
    .style.display="none";

}


function showApp(){

  document.getElementById("loginPage")
    .style.display="none";

  document.getElementById("app")
    .style.display="block";

  loadReels();

}


function showLoginMsg(text){

  document.getElementById("loginMsg")
    .textContent=text;

}


/* =========================
   PROFILE
========================= */

const profileCache = {};

async function getProfile(userId){

  if(profileCache[userId])
    return profileCache[userId];

  const {data,error} =
    await sb
      .from("fb_profiles")
      .select("*")
      .eq("id",userId)
      .maybeSingle();

  if(error){

    console.log("profile error",error);
  }

  const profile =
    data || {
      id:userId,
      name:"User",
      username:"user",
      profile_photo:""
    };

  profileCache[userId]=profile;

  return profile;
}


function avatar(profile){

  if(profile.profile_photo){

    return profile.profile_photo;

  }

  return "https://ui-avatars.com/api/?name="+
    encodeURIComponent(profile.name || "User")+
    "&background=1877f2&color=fff";
}


/* =========================
   LOAD REELS
========================= */

async function loadReels(){

  const container =
    document.getElementById("reelsContainer");

  container.innerHTML =
    `<div class="loading">Reels লোড হচ্ছে...</div>`;

  const {data,error} =
    await sb
      .from("fb_reels")
      .select("*")
      .order("created_at",{ascending:false});

  if(error){

    console.error(error);

    container.innerHTML=`
      <div class="empty">
        <div>❌ Reels লোড হয়নি</div>
        <small>${escapeHtml(error.message)}</small>
        <button onclick="loadReels()">Retry</button>
      </div>
    `;

    return;
  }

  reels = data || [];

  if(!reels.length){

    container.innerHTML=`
      <div class="empty">
        <div style="font-size:55px">🎬</div>
        <h2>এখনো কোনো Reel নেই</h2>
        <p>প্রথম Reel আপনিই পোস্ট করুন।</p>
        <button onclick="openUpload()">＋ Create Reel</button>
      </div>
    `;

    return;
  }

  container.innerHTML="";

  for(const reel of reels){

    const profile =
      await getProfile(reel.user_id);

    const el =
      await createReelElement(
        reel,
        profile
      );

    container.appendChild(el);
  }

  setupVideoObserver();

}


/* =========================
   CREATE REEL
========================= */

async function createReelElement(
  reel,
  profile
){

  const div =
    document.createElement("div");

  div.className="reel";

  div.dataset.id=reel.id;

  const isMine =
    currentUser &&
    reel.user_id === currentUser.id;

  const avatarUrl =
    avatar(profile);

  const caption =
    reel.caption || "";

  const audio =
    reel.audio_name ||
    "Original audio";

  const views =
    Number(reel.views || 0);

  div.innerHTML=`

    <video
      class="reelVideo"
      src="${escapeAttr(reel.video_url || "")}"
      playsinline
      loop
      preload="metadata">
    </video>

    <div class="videoOverlay"></div>

    <button
      class="soundBtn"
      onclick="toggleSound(event,this)">
      🔇
    </button>

    <div class="pauseIcon">▶</div>

    <div class="reelBadge">
      🎬 REELS
    </div>

    <div class="reelRight">

      <button
        class="reelAction"
        onclick="openReactionMenu(event,this)">
        <span class="circle">👍</span>
        <span>Like</span>
      </button>

      <button
        class="reelAction"
        onclick="quickLove(event,this)">
        <span class="circle">❤️</span>
        <span>Love</span>
      </button>

      <button
        class="reelAction"
        onclick="openComments(${reel.id})">
        <span class="circle">💬</span>
        <span>Comment</span>
      </button>

      <button
        class="reelAction"
        onclick="shareReel(${reel.id})">
        <span class="circle">↗</span>
        <span>Share</span>
      </button>

      <button
        class="reelAction"
        onclick="saveReel(${reel.id})">
        <span class="circle">🔖</span>
        <span>Save</span>
      </button>

      ${
        isMine
        ?
        `
        <button
          class="reelAction"
          onclick="deleteReel(${reel.id})">
          <span class="circle">🗑️</span>
          <span>Delete</span>
        </button>
        `
        :
        ""
      }

    </div>

    <div class="reactionMenu">

      <button onclick="selectReaction(event,'like',${reel.id})">👍</button>
      <button onclick="selectReaction(event,'love',${reel.id})">❤️</button>
      <button onclick="selectReaction(event,'haha',${reel.id})">😂</button>
      <button onclick="selectReaction(event,'wow',${reel.id})">😮</button>
      <button onclick="selectReaction(event,'sad',${reel.id})">😢</button>
      <button onclick="selectReaction(event,'angry',${reel.id})">😡</button>

    </div>

    <div class="reelInfo">

      <div class="creatorRow">

        <img
          class="creatorAvatar"
          src="${escapeAttr(avatarUrl)}">

        <div class="creatorName">
          ${escapeHtml(profile.name || "User")}
        </div>

        <button
          class="followBtn"
          onclick="followUser('${reel.user_id}',this)">
          Follow
        </button>

      </div>

      <div class="caption">
        ${formatCaption(caption)}
      </div>

      <div class="audio">
        🎵 ${escapeHtml(audio)}
        &nbsp; • &nbsp;
        👁 ${views}
      </div>

    </div>
  `;


  /* video click */

  const video =
    div.querySelector(".reelVideo");

  video.addEventListener("click",()=>{

    if(video.paused){

      video.play().catch(()=>{});

      div.classList.remove("paused");

    }else{

      video.pause();

      div.classList.add("paused");

    }

  });


  return div;
}


/* =========================
   VIDEO OBSERVER
========================= */

function setupVideoObserver(){

  const videos =
    document.querySelectorAll(".reel");

  const observer =
    new IntersectionObserver(
      entries=>{

        entries.forEach(entry=>{

          const reel =
            entry.target;

          const video =
            reel.querySelector(".reelVideo");

          if(entry.isIntersecting){

            document
              .querySelectorAll(".reelVideo")
              .forEach(v=>{

                if(v !== video){

                  v.pause();

                }

              });

            video.muted=true;

            video.play()
              .catch(()=>{});

            const sound =
              reel.querySelector(".soundBtn");

            if(sound)
              sound.textContent="🔇";

            countView(
              reel.dataset.id
            );

          }else{

            video.pause();

          }

        });

      },
      {
        threshold:.65
      }
    );


  videos.forEach(v=>observer.observe(v));

}


/* =========================
   SOUND
========================= */

function toggleSound(event,button){

  event.stopPropagation();

  const reel =
    button.closest(".reel");

  const video =
    reel.querySelector(".reelVideo");

  video.muted =
    !video.muted;

  button.textContent =
    video.muted ? "🔇" : "🔊";

}


/* =========================
   VIEW COUNT
========================= */

const viewedReels =
  new Set();

async function countView(reelId){

  if(viewedReels.has(reelId))
    return;

  viewedReels.add(reelId);

  if(!currentUser)
    return;

  try{

    await sb
      .from("fb_reel_views")
      .insert({
        reel_id:Number(reelId),
        user_id:currentUser.id
      });

  }catch(e){

    console.log("view insert",e);

  }

  const reel =
    reels.find(
      r=>String(r.id)===String(reelId)
    );

  if(!reel)
    return;

  const newViews =
    Number(reel.views || 0)+1;

  reel.views=newViews;

  await sb
    .from("fb_reels")
    .update({
      views:newViews
    })
    .eq("id",reelId);

}


/* =========================
   REACTION MENU
========================= */

function openReactionMenu(
  event,
  button
){

  event.stopPropagation();

  const reel =
    button.closest(".reel");

  document
    .querySelectorAll(".reactionMenu")
    .forEach(m=>{

      if(
        !reel.contains(m)
      )
        m.classList.remove("show");

    });

  const menu =
    reel.querySelector(".reactionMenu");

  menu.classList.toggle("show");

}


async function selectReaction(
  event,
  reaction,
  reelId
){

  event.stopPropagation();

  const reel =
    event.target.closest(".reel");

  const menu =
    reel.querySelector(".reactionMenu");

  menu.classList.remove("show");

  await reactToReel(
    reelId,
    reaction
  );

}


async function quickLove(
  event,
  button
){

  event.stopPropagation();

  const reel =
    button.closest(".reel");

  const reelId =
    reel.dataset.id;

  await reactToReel(
    reelId,
    "love"
  );

}


/* =========================
   REACT
========================= */

async function reactToReel(
  reelId,
  reaction
){

  if(!currentUser){

    toast("Login করুন");
    return;

  }

  const {data:old} =
    await sb
      .from("fb_reel_reactions")
      .select("id,reaction")
      .eq("reel_id",reelId)
      .eq("user_id",currentUser.id)
      .maybeSingle();

  let error=null;

  if(old){

    if(old.reaction===reaction){

      const res =
        await sb
          .from("fb_reel_reactions")
          .delete()
          .eq("id",old.id);

      error=res.error;

    }else{

      const res =
        await sb
          .from("fb_reel_reactions")
          .update({
            reaction:reaction
          })
          .eq("id",old.id);

      error=res.error;

    }

  }else{

    const res =
      await sb
        .from("fb_reel_reactions")
        .insert({
          reel_id:Number(reelId),
          user_id:currentUser.id,
          reaction:reaction
        });

    error=res.error;

  }

  if(error){

    console.error(error);

    toast(
      "Reaction কাজ করেনি: "+
      error.message
    );

    return;

  }

  toast(
    reactions[reaction] +
    " Reaction হয়েছে"
  );

}


/* =========================
   COMMENTS
========================= */

async function openComments(
  reelId
){

  currentCommentReel =
    Number(reelId);

  document
    .getElementById("commentModal")
    .style.display="flex";

  document
    .getElementById("commentList")
    .innerHTML=
      "<div style='padding:20px;text-align:center'>Loading...</div>";

  await loadComments(reelId);

}


function closeComments(){

  document
    .getElementById("commentModal")
    .style.display="none";

  currentCommentReel=null;

}


async function loadComments(
  reelId
){

  const list =
    document.getElementById(
      "commentList"
    );

  const {data,error} =
    await sb
      .from("fb_reel_comments")
      .select("*")
      .eq("reel_id",reelId)
      .order("created_at",{
        ascending:true
      });

  if(error){

    list.innerHTML=
      `<div style="padding:15px;color:red">
        ${escapeHtml(error.message)}
      </div>`;

    return;

  }

  if(!data || !data.length){

    list.innerHTML=
      `<div style="padding:30px;text-align:center;color:#777">
        এখনো কোনো comment নেই।
        <br>
        প্রথম comment করুন।
      </div>`;

    return;

  }

  list.innerHTML="";

  for(const comment of data){

    const profile =
      await getProfile(
        comment.user_id
      );

    const div =
      document.createElement("div");

    div.className="comment";

    div.innerHTML=`

      <img
        class="commentAvatar"
        src="${escapeAttr(avatar(profile))}">

      <div>

        <div class="commentBody">

          <div class="commentName">
            ${escapeHtml(profile.name || "User")}
          </div>

          <div class="commentText">
            ${escapeHtml(comment.text || "")}
          </div>

        </div>

        <div class="commentTools">

          <button
            onclick="likeComment(${comment.id})">
            👍 Like
          </button>

          <button
            onclick="showReplyInput(${comment.id})">
            Reply
          </button>

        </div>

        <div
          id="reply-${comment.id}"
          class="replyBox">

          <input
            style="width:100%;padding:9px;border:1px solid #ddd;border-radius:10px"
            placeholder="Reply লিখুন..."
            onkeydown="
              if(event.key==='Enter')
              sendReply(${comment.id},this)
            ">

        </div>

      </div>

    `;

    list.appendChild(div);

  }

}


async function sendComment(){

  const input =
    document.getElementById(
      "commentInput"
    );

  const text =
    input.value.trim();

  if(!text)
    return;

  if(!currentUser){

    toast("Login করুন");
    return;

  }

  const {error} =
    await sb
      .from("fb_reel_comments")
      .insert({
        reel_id:currentCommentReel,
        user_id:currentUser.id,
        text:text,
        parent_id:null
      });

  if(error){

    toast(
      "Comment failed: "+
      error.message
    );

    console.error(error);

    return;

  }

  input.value="";

  await loadComments(
    currentCommentReel
  );

}


function showReplyInput(id){

  const box =
    document.getElementById(
      "reply-"+id
    );

  if(box)
    box.style.display=
      box.style.display==="block"
      ? "none"
      : "block";

}


async function sendReply(
  commentId,
  input
){

  const text =
    input.value.trim();

  if(!text)
    return;

  const {error} =
    await sb
      .from("fb_reel_comments")
      .insert({
        reel_id:currentCommentReel,
        user_id:currentUser.id,
        text:text,
        parent_id:commentId
      });

  if(error){

    toast(
      "Reply failed: "+
      error.message
    );

    return;

  }

  input.value="";

  await loadComments(
    currentCommentReel
  );

}


async function likeComment(
  commentId
){

  if(!currentUser)
    return;

  const {error} =
    await sb
      .from("fb_comment_likes")
      .insert({
        comment_id:commentId,
        user_id:currentUser.id
      });

  if(error){

    console.log(error);

  }else{

    toast("👍 Comment liked");

  }

}


/* =========================
   SHARE
========================= */

async function shareReel(
  reelId
){

  const url =
    location.href.split("#")[0]+
    "#reel-"+reelId;

  if(
    navigator.share
  ){

    try{

      await navigator.share({
        title:"FriendBook Reel",
        text:"এই Reel টি দেখুন",
        url:url
      });

    }catch(e){}

  }else{

    try{

      await navigator.clipboard.writeText(
        url
      );

      toast(
        "Reel link copied"
      );

    }catch(e){

      toast(url);

    }

  }

}


/* =========================
   SAVE
========================= */

async function saveReel(
  reelId
){

  if(!currentUser){

    toast("Login করুন");
    return;

  }

  const {error} =
    await sb
      .from("fb_saved_reels")
      .insert({
        reel_id:Number(reelId),
        user_id:currentUser.id
      });

  if(error){

    /* table না থাকলেও app বন্ধ হবে না */

    console.log(
      "save reel:",
      error
    );

    toast(
      "Save table সেটআপ করুন"
    );

    return;

  }

  toast(
    "🔖 Reel saved"
  );

}


/* =========================
   FOLLOW
========================= */

async function followUser(
  userId,
  button
){

  if(!currentUser){

    toast("Login করুন");
    return;

  }

  if(
    userId === currentUser.id
  ){

    toast(
      "নিজেকে Follow করা যাবে না"
    );

    return;

  }

  const {data:existing} =
    await sb
      .from("fb_follows")
      .select("id")
      .eq("follower_id",currentUser.id)
      .eq("following_id",userId)
      .maybeSingle();

  if(existing){

    const {error} =
      await sb
        .from("fb_follows")
        .delete()
        .eq("id",existing.id);

    if(!error){

      button.textContent="Follow";
      button.classList.remove(
        "following"
      );

      toast("Unfollow করা হয়েছে");

    }

  }else{

    const {error} =
      await sb
        .from("fb_follows")
        .insert({
          follower_id:currentUser.id,
          following_id:userId
        });

    if(!error){

      button.textContent="Following";
      button.classList.add(
        "following"
      );

      toast("Following");

    }else{

      toast(
        "Follow failed: "+
        error.message
      );

    }

  }

}


/* =========================
   DELETE REEL
========================= */

async function deleteReel(
  reelId
){

  if(!confirm(
    "এই Reel টি Delete করবেন?"
  ))
    return;

  const {error} =
    await sb
      .from("fb_reels")
      .delete()
      .eq("id",reelId)
      .eq("user_id",currentUser.id);

  if(error){

    toast(
      "Delete failed: "+
      error.message
    );

    return;

  }

  toast("Reel deleted");

  await loadReels();

}


/* =========================
   UPLOAD REEL
========================= */

function openUpload(){

  document
    .getElementById("uploadPanel")
    .classList.remove("hidden");

}


function closeUpload(){

  document
    .getElementById("uploadPanel")
    .classList.add("hidden");

}


async function uploadReel(){

  const videoUrl =
    document
      .getElementById("reelVideoUrl")
      .value
      .trim();

  const audio =
    document
      .getElementById("reelAudio")
      .value
      .trim();

  const caption =
    document
      .getElementById("reelCaption")
      .value
      .trim();

  if(!videoUrl){

    toast(
      "Video URL দিন"
    );

    return;

  }

  if(!currentUser){

    toast("Login করুন");
    return;

  }

  const button =
    document.querySelector(
      ".uploadBtn"
    );

  button.disabled=true;
  button.textContent=
    "Posting...";

  const {error} =
    await sb
      .from("fb_reels")
      .insert({
        user_id:currentUser.id,
        video_url:videoUrl,
        caption:caption,
        audio_name:audio,
        views:0
      });

  button.disabled=false;
  button.textContent=
    "🚀 Post Reel";

  if(error){

    console.error(error);

    toast(
      "Post failed: "+
      error.message
    );

    return;

  }

  document
    .getElementById("reelVideoUrl")
    .value="";

  document
    .getElementById("reelAudio")
    .value="";

  document
    .getElementById("reelCaption")
    .value="";

  closeUpload();

  toast(
    "🎬 Reel পোস্ট হয়েছে"
  );

  await loadReels();

}


/* =========================
   CAPTION
========================= */

function formatCaption(text){

  let safe =
    escapeHtml(text || "");

  safe =
    safe.replace(
      /(#[\w\u0980-\u09FF]+)/g,
      '<span style="color:#60a5fa">$1</span>'
    );

  return safe;

}


/* =========================
   ESCAPE
========================= */

function escapeHtml(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttr(text){

  return escapeHtml(text);

}


/* =========================
   TOAST
========================= */

let toastTimer;

function toast(text){

  const el =
    document.getElementById("toast");

  el.textContent=text;

  el.style.display="block";

  clearTimeout(toastTimer);

  toastTimer =
    setTimeout(()=>{
      el.style.display="none";
    },2500);

}


/* =========================
   OUTSIDE CLICK
========================= */

document.addEventListener(
  "click",
  e=>{

    if(
      !e.target.closest(".reactionMenu") &&
      !e.target.closest(".reelAction")
    ){

      document
        .querySelectorAll(".reactionMenu")
        .forEach(m=>
          m.classList.remove("show")
        );

    }

  }
);


/* =========================
   AUTH STATE
========================= */

sb.auth.onAuthStateChange(
  (event,session)=>{

    if(session){

      currentUser =
        session.user;

    }else{

      currentUser=null;

    }

  }
);
