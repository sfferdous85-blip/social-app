<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1877f2">
<title>FriendBook</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;background:#f0f2f5;color:#050505}
body.dark{background:#18191a;color:#e4e6eb}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

:root{
 --blue:#1877f2;
 --bg:#f0f2f5;
 --card:#fff;
 --text:#050505;
 --muted:#65676b;
 --border:#dddfe2;
}
.dark{
 --bg:#18191a;
 --card:#242526;
 --text:#e4e6eb;
 --muted:#b0b3b8;
 --border:#3e4042;
}

body{background:var(--bg);color:var(--text)}

.auth{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
}
.authbox{
 width:100%;
 max-width:420px;
 background:var(--card);
 padding:28px;
 border-radius:16px;
 box-shadow:0 4px 20px #0002;
}
.logo{
 color:var(--blue);
 font-size:38px;
 font-weight:800;
 text-align:center;
 margin-bottom:8px;
}
.subtitle{
 text-align:center;
 color:var(--muted);
 margin-bottom:25px;
}
.input{
 width:100%;
 padding:14px;
 border:1px solid var(--border);
 border-radius:10px;
 outline:none;
 background:var(--card);
 color:var(--text);
 margin-bottom:12px;
}
.input:focus{border-color:var(--blue)}
.primary{
 width:100%;
 border:0;
 padding:13px;
 border-radius:9px;
 background:var(--blue);
 color:#fff;
 font-weight:bold;
 margin-top:5px;
}
.secondary{
 width:100%;
 border:0;
 padding:12px;
 border-radius:9px;
 background:#42b72a;
 color:#fff;
 font-weight:bold;
 margin-top:10px;
}
.authmsg{
 min-height:25px;
 margin-top:12px;
 text-align:center;
 color:#e41e3f;
 font-size:14px;
}

.app{min-height:100vh}

.topbar{
 position:sticky;
 top:0;
 z-index:100;
 height:62px;
 background:var(--card);
 border-bottom:1px solid var(--border);
 display:flex;
 align-items:center;
 gap:10px;
 padding:8px 14px;
}
.brand{
 color:var(--blue);
 font-size:25px;
 font-weight:800;
 white-space:nowrap;
}
.topsearch{
 flex:1;
 max-width:360px;
 background:var(--bg);
 border:0;
 border-radius:22px;
 padding:11px 15px;
 outline:none;
 color:var(--text);
}
.topicons{
 margin-left:auto;
 display:flex;
 gap:7px;
}
.iconbtn{
 width:42px;
 height:42px;
 border:0;
 border-radius:50%;
 background:var(--bg);
 color:var(--text);
 font-size:20px;
}
.iconbtn:hover{background:#ddd}

.nav{
 position:sticky;
 top:62px;
 z-index:90;
 background:var(--card);
 border-bottom:1px solid var(--border);
 display:flex;
 justify-content:center;
 gap:4px;
 padding:5px;
}
.nav button{
 flex:1;
 max-width:130px;

 padding:10px 5px;
 border-radius:8px;

}
.nav button.active{

 background:#e7f3ff;
}

.main{

 max-width:1000px;
 margin:auto;
 padding:18px 12px 80px;
}

.card{
 background:var(--card);
 border-radius:12px;
 margin-bottom:14px;
 box-shadow:0 1px 2px #0002;
 overflow:hidden;
}

.composer{
 padding:14px;
}
.composerrow{
 display:flex;
 gap:10px;
 align-items:center;
}
.avatar{
 width:42px;
 height:42px;
 border-radius:50%;
 object-fit:cover;
 background:#ddd;
 flex-shrink:0;
}
.fakeinput{
 flex:1;
 background:var(--bg);
 border:0;
 border-radius:22px;
 padding:12px 15px;
 color:var(--muted);
 cursor:pointer;
}
.composeractions{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 margin-top:12px;
 border-top:1px solid var(--border);
 padding-top:8px;
 gap:5px;
}
.composeractions button{

 background:transparent;
 color:var(--muted);
 padding:10px;
 border-radius:8px;
}
.composeractions button:hover{background:var(--bg)}

.posthead{
 display:flex;
 align-items:center;
 padding:13px;
 gap:10px;
}
.postuser{
 font-weight:bold;
}
.posttime{
 font-size:12px;
 color:var(--muted);
 margin-top:3px;
}
.more{
 margin-left:auto;
 border:0;
 background:transparent;
 color:var(--muted);
 font-size:22px;
}
.posttext{
 padding:0 14px 13px;
 white-space:pre-wrap;
 word-break:break-word;
 line-height:1.45;
}
.postimg{
 display:block;
 width:100%;
 max-height:650px;
 object-fit:cover;
 background:#000;
}
.stats{

 justify-content:space-between;
 padding:8px 14px;

 font-size:13px;
 border-bottom:1px solid var(--border);
}
.postactions{
 display:grid;
 grid-template-columns:repeat(3,1fr);

 gap:3px;
}
.postactions button{

 background:transparent;
 padding:10px;

 color:var(--muted);
 font-weight:bold;
}
.postactions button:hover{background:var(--bg)}
.postactions button.liked{color:#1877f2}

.comments{
 padding:0 14px 14px;
}
.comment{
 display:flex;
 gap:8px;
 margin-top:10px;
}
.commentbubble{
 background:var(--bg);
 padding:8px 11px;
 border-radius:14px;
 max-width:85%;
}
.commentname{
 font-weight:bold;
 font-size:13px;
}
.commenttext{
 margin-top:3px;
 white-space:pre-wrap;
}
.commentinput{
 display:flex;
 gap:8px;
 margin-top:10px;
}
.commentinput input{
 flex:1;
 border:0;
 background:var(--bg);
 color:var(--text);
 border-radius:20px;
 padding:10px 14px;
 outline:none;
}
.commentinput button{
 width:40px;
 border:0;
 border-radius:50%;
 background:var(--blue);
 color:white;
}

.pageTitle{

 font-weight:800;
 margin:8px 0 15px;
}

.profilecover{
 height:230px;
 background:#ccd0d5;
 overflow:hidden;
}
.profilecover img{
 width:100%;
 height:100%;
 object-fit:cover;
}
.profileinfo{
 padding:0 18px 18px;

}
.profilebig{
 width:120px;
 height:120px;
 border-radius:50%;
 border:5px solid var(--card);
 object-fit:cover;
 margin-top:-60px;
 background:#ddd;
}
.profilename{
 font-size:26px;
 font-weight:800;
 margin-top:8px;
}
.profileusername{
 color:var(--muted);
 margin-top:3px;
}
.profilebio{
 margin-top:10px;
 white-space:pre-wrap;
}
.profilebuttons{
 display:flex;
 gap:8px;
 margin-top:15px;
 flex-wrap:wrap;
}
.profilebuttons button{
 border:0;
 border-radius:8px;
 padding:10px 16px;
 background:var(--blue);
 color:#fff;
 font-weight:bold;
}
.profilebuttons button.gray{
 background:var(--bg);
 color:var(--text);
}

.tabs{
 display:flex;
 gap:5px;
 padding:7px;
 border-top:1px solid var(--border);
}
.tabs button{
 flex:1;
 border:0;
 background:transparent;
 padding:10px;
 color:var(--muted);
 font-weight:bold;
}
.tabs button.active{color:var(--blue)}

.grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:3px;
}
.grid img{
 width:100%;
 aspect-ratio:1;
 object-fit:cover;
}

.reels{
 display:flex;
 flex-direction:column;
 gap:15px;
}
.reel{
 position:relative;
 width:100%;
 height:min(760px,calc(100vh - 90px));
 background:#000;
 border-radius:12px;
 overflow:hidden;
}
.reel video{
 width:100%;
 height:100%;
 object-fit:cover;
}
.reelshade{
 position:absolute;
 left:0;
 right:0;
 bottom:0;
 padding:20px;
 background:linear-gradient(transparent,#000b);
 color:#fff;
}
.reeluser{
 display:flex;
 align-items:center;
 gap:9px;
}
.reelcaption{
 margin-top:10px;
 white-space:pre-wrap;
}
.reelbuttons{
 position:absolute;
 right:10px;
 bottom:85px;
 display:flex;
 flex-direction:column;
 gap:9px;
}
.reelbuttons button{
 width:48px;
 height:48px;
 border:0;
 border-radius:50%;
 background:#0008;
 color:#fff;
 font-size:18px;
}
.reelbuttons button.active{color:#ff3040}

.searchbox{
 display:flex;
 gap:8px;
 margin-bottom:15px;
}
.searchbox input{
 flex:1;
 padding:13px;
 border:1px solid var(--border);
 background:var(--card);
 color:var(--text);
 border-radius:9px;
 outline:none;
}
.searchbox button{
 border:0;
 background:var(--blue);
 color:#fff;
 padding:0 18px;
 border-radius:9px;
}

.person{
 display:flex;
 align-items:center;
 gap:12px;
 padding:13px;
 border-bottom:1px solid var(--border);
}
.person:last-child{border-bottom:0}
.personinfo{flex:1}
.personname{font-weight:bold}
.personuser{font-size:12px;color:var(--muted)}
.person button{
 border:0;
 border-radius:8px;
 background:var(--blue);
 color:#fff;
 padding:8px 12px;
}

.setting{
 padding:15px;
 border-bottom:1px solid var(--border);
}
.setting:last-child{border-bottom:0}
.settingtitle{font-weight:bold}
.settingdesc{color:var(--muted);font-size:13px;margin-top:4px}
.setting button{
 margin-top:10px;
 border:0;
 border-radius:8px;
 padding:9px 13px;
 background:var(--bg);
 color:var(--text);
}
.setting input,.setting select{
 width:100%;
 margin-top:10px;
 padding:11px;
 border:1px solid var(--border);
 border-radius:8px;
 background:var(--card);
 color:var(--text);
}

.modal{
 position:fixed;
 inset:0;
 background:#0008;
 z-index:500;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:15px;
}
.modalbox{
 width:100%;
 max-width:550px;
 max-height:90vh;
 overflow:auto;
 background:var(--card);
 color:var(--text);
 border-radius:14px;
 padding:18px;
}
.modalhead{
 display:flex;
 align-items:center;
 font-size:20px;
 font-weight:bold;
 margin-bottom:15px;
}
.close{
 margin-left:auto;
 border:0;
 width:35px;
 height:35px;
 border-radius:50%;
 background:var(--bg);
 color:var(--text);
}
.modal textarea{
 width:100%;
 min-height:130px;
 resize:vertical;
 border:1px solid var(--border);
 border-radius:10px;
 padding:12px;
 background:var(--card);
 color:var(--text);
 outline:none;
}
.file{
 width:100%;
 margin:12px 0;
}
.modal .primary{margin-top:8px}

.toast{
 position:fixed;
 left:50%;
 bottom:25px;
 transform:translateX(-50%);
 z-index:999;
 background:#222;
 color:white;
 padding:12px 18px;
 border-radius:25px;
 display:none;
 max-width:90%;
 text-align:center;
}

.loading{
 text-align:center;
 padding:40px;
 color:var(--muted);
}

.empty{
 text-align:center;
 padding:35px;
 color:var(--muted);
}

.chatlist{
 display:flex;
 flex-direction:column;
}
.chatitem{
 display:flex;
 align-items:center;
 gap:10px;
 padding:13px;
 border-bottom:1px solid var(--border);
 cursor:pointer;
}
.chatitem:hover{background:var(--bg)}
.chatname{font-weight:bold}

.messages{
 height:55vh;
 overflow:auto;
 background:var(--bg);
 padding:15px;
}
.bubble{
 max-width:75%;
 padding:10px 13px;
 border-radius:16px;
 margin-bottom:8px;
 word-break:break-word;
}
.bubble.me{
 margin-left:auto;
 background:var(--blue);
 color:#fff;
 border-bottom-right-radius:4px;
}
.bubble.them{
 background:var(--card);
 border-bottom-left-radius:4px;
}
.chatinput{
 display:flex;
 gap:8px;
 margin-top:10px;
}
.chatinput input{
 flex:1;
 border:1px solid var(--border);
 border-radius:20px;
 padding:11px 14px;
 background:var(--card);
 color:var(--text);
}
.chatinput button{
 border:0;
 border-radius:50%;
 width:43px;
 background:var(--blue);
 color:white;
}

.notice{
 background:#e7f3ff;
 color:#1877f2;
 padding:12px;
 border-radius:10px;
 margin-bottom:12px;
 font-size:13px;
}

.dark .notice{
 background:#263a52;
 color:#8ab4f8;
}

@media(max-width:600px){
 .brand{font-size:21px}
 .topsearch{display:none}
 .topbar{height:55px}
 .nav{top:55px}
 .nav button{font-size:12px;padding:9px 2px}
 .nav button span{display:block;font-size:17px}
 .main{padding:10px 7px 70px}
 .card{border-radius:9px}
 .profilecover{height:170px}
 .profilebig{width:95px;height:95px;margin-top:-48px}
 .profilename{font-size:23px}
 .reel{height:calc(100vh - 120px);border-radius:7px}
}

@media(min-width:700px){
 .mobileOnly{display:none!important}
}
</style>
</head>

<body>

<!-- LOGIN / SIGNUP -->
<div id="authScreen" class="auth">
  <div class="authbox">
    <div class="logo">FriendBook</div>
    <div class="subtitle">Connect with friends and people around you</div>

    <div id="loginForm">
      <input id="loginEmail" class="input" type="email" placeholder="Email">
      <input id="loginPassword" class="input" type="password" placeholder="Password">

      <button class="primary" onclick="login()">Log In</button>
      <button class="secondary" onclick="showSignup()">Create New Account</button>

      <div id="loginMsg" class="authmsg"></div>
    </div>

    <div id="signupForm" class="hidden">
      <input id="signupName" class="input" placeholder="Full name">
      <input id="signupUsername" class="input" placeholder="Username">
      <input id="signupEmail" class="input" type="email" placeholder="Email">
      <input id="signupPassword" class="input" type="password" placeholder="Password">

      <button class="secondary" onclick="signup()">Sign Up</button>
      <button class="primary" onclick="showLogin()">Back to Login</button>

      <div id="signupMsg" class="authmsg"></div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app" class="app hidden">

  <header class="topbar">
    <div class="brand">FriendBook</div>

    <input
      id="topSearch"
      class="topsearch"
      placeholder="Search FriendBook..."
      onkeydown="if(event.key==='Enter')doSearch()"
    >

    <div class="topicons">
      <button class="iconbtn" onclick="openSearch()">🔎</button>
      <button class="iconbtn" onclick="showPage('messages')">💬</button>
      <button class="iconbtn" onclick="showPage('notifications')">🔔</button>
      <button class="iconbtn" onclick="showPage('profile')">👤</button>
    </div>
  </header>

  <nav class="nav">
    <button id="nav-home" onclick="showPage('home')">
      <span>🏠</span> Home
    </button>
    <button id="nav-reels" onclick="showPage('reels')">
      <span>🎬</span> Reels
    </button>
    <button id="nav-friends" onclick="showPage('friends')">
      <span>👥</span> Friends
    </button>
    <button id="nav-search" onclick="showPage('search')">
      <span>🔎</span> Search
    </button>
    <button id="nav-profile" onclick="showPage('profile')">
      <span>👤</span> Profile
    </button>
    <button id="nav-settings" onclick="showPage('settings')">
      <span>⚙️</span> Settings
    </button>
  </nav>

  <main id="main" class="main"></main>
</div>

<!-- MODAL -->
<div id="modal" class="modal hidden" onclick="if(event.target.id==='modal')closeModal()">
  <div id="modalBox" class="modalbox"></div>
</div>

<div id="toast" class="toast"></div>

<script>
"use strict";

/* ================================
   SUPABASE
================================ */

const SUPABASE_URL =
"https://skereuaizdczbvjplisi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_3R2otJA1zIlsMsTYxe1ocw_NAPY5O9x";

const sb =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser = null;
let currentProfile = null;
let currentPage = "home";
let currentChatUser = null;
let realtimeChannel = null;

/* ================================
   BASIC HELPERS
================================ */

function $(id){
  return document.getElementById(id);
}

function escapeHTML(value){
  if(value === null || value === undefined) return "";
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function timeAgo(date){
  if(!date) return "";
  const d = new Date(date);
  const diff = Math.floor((Date.now()-d.getTime())/1000);

  if(diff < 60) return "Just now";
  if(diff < 3600) return Math.floor(diff/60)+"m";
  if(diff < 86400) return Math.floor(diff/3600)+"h";
  if(diff < 604800) return Math.floor(diff/86400)+"d";

  return d.toLocaleDateString();
}

function toast(text){
  const el = $("toast");
  el.innerText = text;
  el.style.display = "block";

  clearTimeout(window.toastTimer);

  window.toastTimer =
    setTimeout(()=>{
      el.style.display = "none";
    },2500);
}

function openModal(html){
  $("modalBox").innerHTML = html;
  $("modal").classList.remove("hidden");
}

function closeModal(){
  $("modal").classList.add("hidden");
}

function defaultAvatar(){
  return "https://ui-avatars.com/api/?name=FriendBook&background=1877f2&color=fff";
}

function avatar(profile){
  return profile && profile.profile_photo
    ? profile.profile_photo
    : defaultAvatar();
}

/* ================================
   AUTH UI
================================ */

function showLogin(){
  $("loginForm").classList.remove("hidden");
  $("signupForm").classList.add("hidden");
}

function showSignup(){
  $("loginForm").classList.add("hidden");
  $("signupForm").classList.remove("hidden");
}

async function login(){

  const email =
    $("loginEmail").value.trim();

  const password =
    $("loginPassword").value;

  const msg = $("loginMsg");

  if(!email || !password){
    msg.innerText = "Email এবং Password দিন।";
    return;
  }

  msg.style.color = "#1877f2";
  msg.innerText = "Login হচ্ছে...";

  try{

    const result =
      await sb.auth.signInWithPassword({
        email: email,
        password: password
      });

    console.log("LOGIN RESULT:",result);

    if(result.error){
      msg.style.color = "#e41e3f";
      msg.innerText =
        "❌ " + result.error.message;
      return;
    }

    if(!result.data || !result.data.session){
      msg.style.color = "#e41e3f";
      msg.innerText =
        "❌ Login session পাওয়া যায়নি।";
      return;
    }

    currentUser =
      result.data.user;

    await startApp();

  }catch(error){

    console.error(error);

    msg.style.color = "#e41e3f";
    msg.innerText =
      "❌ " + (error.message || "Login error");
  }
}

async function signup(){

  const name =
    $("signupName").value.trim();

  const username =
    $("signupUsername").value.trim()
      .toLowerCase()
      .replace(/[^a-z0-9_]/g,"");

  const email =
    $("signupEmail").value.trim();

  const password =
    $("signupPassword").value;

  const msg =
    $("signupMsg");

  if(!name || !username || !email || !password){
    msg.innerText =
      "সব তথ্য পূরণ করুন।";
    return;
  }

  if(password.length < 6){
    msg.innerText =
      "Password কমপক্ষে 6 অক্ষরের দিন।";
    return;
  }

  msg.style.color = "#1877f2";
  msg.innerText = "Account তৈরি হচ্ছে...";

  try{

    const result =
      await sb.auth.signUp({
        email: email,
        password: password,
        options:{
          data:{
            name:name,
            username:username
          }
        }
      });

    console.log("SIGNUP RESULT:",result);

    if(result.error){
      msg.style.color = "#e41e3f";
      msg.innerText =
        "❌ " + result.error.message;
      return;
    }

    if(result.data.user){

      if(result.data.session){

        currentUser =
          result.data.user;

        await ensureProfile(
          name,
          username
        );

        await startApp();

      }else{

        msg.style.color = "#1877f2";
        msg.innerText =
          "✅ Account তৈরি হয়েছে। Email verification প্রয়োজন হলে Email verify করে Login করুন।";
      }
    }

  }catch(error){

    console.error(error);

    msg.style.color = "#e41e3f";
    msg.innerText =
      "❌ " + error.message;
  }
}

async function logout(){

  try{
    await sb.auth.signOut();
  }catch(e){
    console.error(e);
  }

  currentUser = null;
  currentProfile = null;

  $("app").classList.add("hidden");
  $("authScreen").classList.remove("hidden");

  showLogin();
}

/* ================================
   PROFILE
================================ */

async function ensureProfile(name,username){

  if(!currentUser) return;

  const {data,error} =
    await sb
      .from("fb_profiles")
      .select("*")
      .eq("id",currentUser.id)
      .maybeSingle();

  if(error){
    console.error("Profile read:",error);
    return;
  }

  if(data){
    currentProfile = data;
    return;
  }

  const {data:newProfile,error:insertError} =
    await sb
      .from("fb_profiles")
      .insert({
        id:currentUser.id,
        name:name || "FriendBook User",
        username:username || ("user"+Date.now())
      })
      .select()
      .single();

  if(insertError){
    console.error("Profile insert:",insertError);
  }else{
    currentProfile = newProfile;
  }
}

async function showPage(page){

  currentPage = page;

  document.querySelectorAll(".nav button")
    .forEach(btn=>{
      btn.classList.remove("active");
    });

  const nav =
    $("nav-"+page);

  if(nav){
    nav.classList.add("active");
  }

  const main = $("main");

  main.innerHTML =
    '<div class="loading">Loading...</div>';

  try{

    if(page==="home"){
      await renderHome();
    }
    else if(page==="reels"){
      await renderReels();
    }
    else if(page==="profile"){
      await renderProfile(currentUser.id);
    }
    else if(page==="friends"){
      await renderFriends();
    }
    else if(page==="search"){
      await renderSearch();
    }
    else if(page==="messages"){
      await renderMessages();
    }
    else if(page==="notifications"){
      await renderNotifications();
    }
    else if(page==="settings"){
      await renderSettings();
    }

  }catch(error){

    console.error(error);

    main.innerHTML =
      `<div class="card empty">
        <h3>Something went wrong</h3>
        <p>${escapeHTML(error.message)}</p>
        <button class="primary" onclick="showPage('${page}')">
          Try Again
        </button>
      </div>`;
  }
}

    await sb
      .from("fb_posts")

async function renderPost(post){

  const profile =
    await getProfile(post.user_id);

  const {data:reactions} =
    await sb
      .from("fb_post_reactions")
      .select("reaction,user_id")
      .eq("post_id",post.id);

  const {data:comments} =
    await sb
      .from("fb_comments")
      .select("*")
      .eq("post_id",post.id)
      .order("created_at",{ascending:true})
      .limit(20);

  const reactionCount =
    reactions ? reactions.length : 0;

  const myReaction =
    reactions?.find(
      x=>x.user_id===currentUser.id
    );

  const commentCount =
    comments ? comments.length : 0;

  let commentHTML = "";

  if(comments && comments.length){

    for(const c of comments){

      const cp =
        await getProfile(c.user_id);

      commentHTML += `
        <div class="comment">
          <img class="avatar"
               src="${escapeHTML(avatar(cp))}">
          <div class="commentbubble">
            <div class="commentname">
              ${escapeHTML(cp?.name || "User")}
            </div>
            <div class="commenttext">
              ${escapeHTML(c.text)}
            </div>
          </div>
        </div>
      `;
    }
  }

  return `
    <article class="card">

      <div class="posthead">
        <img class="avatar"
             src="${escapeHTML(avatar(profile))}"
             onclick="renderProfile('${post.user_id}')">

        <div onclick="renderProfile('${post.user_id}')"
             style="cursor:pointer">
          <div class="postuser">
            ${escapeHTML(profile?.name || "User")}
          </div>
          <div class="posttime">
            ${timeAgo(post.created_at)}
            ${post.privacy ? " · "+escapeHTML(post.privacy) : ""}
          </div>
        </div>

        <button class="more"
                onclick="postMenu(${post.id},'${post.user_id}')">
          ⋯
        </button>
      </div>

      ${
        post.text
        ?
        `<div class="posttext">${escapeHTML(post.text)}</div>`
        :
        ""
      }

      ${
        post.image_url
        ?
        `<img class="postimg"
              src="${escapeHTML(post.image_url)}"
              loading="lazy">`
        :
        ""
      }

      <div class="stats">
        <span>👍 ${reactionCount}</span>
        <span>${commentCount} Comments</span>
      </div>

      <div class="postactions">

        <button
          class="${myReaction ? "liked" : ""}"
          onclick="togglePostReaction(${post.id})">
          ${myReaction ? "👍 Liked" : "👍 Like"}
        </button>

        <button onclick="focusComment(${post.id})">
          💬 Comment
        </button>

        <button onclick="sharePost(${post.id})">
          ↗ Share
        </button>

      </div>

      <div class="comments">

        <div class="commentinput">
          <input
            id="comment-${post.id}"
            placeholder="Write a comment..."
            onkeydown="if(event.key==='Enter')addComment(${post.id})">

          <button onclick="addComment(${post.id})">
            ➤
          </button>
        </div>

        ${commentHTML}

      </div>

    </article>
  `;
}

async function createPost(){

  const text =
    $("newPostText").value.trim();

  const file =
    $("newPostImage").files[0];

  const privacy =
    $("newPostPrivacy").value;

  const feeling =
    $("newPostFeeling").value.trim();

  const location =
    $("newPostLocation").value.trim();

  if(!text && !file){
    toast("Post-এর Text অথবা Photo দিন।");
    return;
  }

  toast("Post তৈরি হচ্ছে...");

  let image_url = null;

  try{

    if(file){

      image_url =
        await uploadFile(file,"posts");
    }

    const {data,error} =
      await sb
        .from("fb_posts")
        .insert({
          user_id:currentUser.id,
          text:text || null,
          image_url:image_url,
          privacy:privacy,
          feeling:feeling || null,
          location:location || null
        })
        .select()
        .single();

    if(error){
      console.error(error);
      toast("❌ "+error.message);
      return;
    }

    closeModal();
    toast("✅ Post published");

    await showPage("home");

  }catch(error){

    console.error(error);

    toast(
      "❌ "+error.message+
      " — Photo upload হলে Storage bucket/policy check করুন।"
    );
  }
}

/* ================================
   FILE UPLOAD
================================ */

async function uploadFile(file,folder){

  const safeName =
    file.name
      .replace(/[^a-zA-Z0-9._-]/g,"_");

  const path =
    folder+
    "/"+
    currentUser.id+
    "/"+
    Date.now()+
    "_"+
    safeName;

  const {error} =
    await sb.storage
      .from("post-images")
      .upload(
        path,
        file,
        {
          cacheControl:"3600",
          upsert:false
        }
      );

  if(error){
    throw error;
  }

  const {data} =
    sb.storage
      .from("post-images")
      .getPublicUrl(path);

  return data.publicUrl;
}

          profile.cover_photo
          ?
          `<img src="${escapeHTML(profile.cover_photo)}">`

          profile.username
          ?
          `<div class="profileusername">
            @${escapeHTML(profile.username)}
          </div>`
          :
          ""
        }

        ${
          profile.bio
          ?
          `<div class="profilebio">
            ${escapeHTML(profile.bio)}
          </div>`
          :
          ""
        }

        <div style="margin-top:12px;color:var(--muted)">
          <b>${followers || 0}</b> Followers
          &nbsp; · &nbsp;
          <b>${following || 0}</b> Following
        </div>

        <div class="profilebuttons">

          ${
            mine
            ?
            `
            <button onclick="openEditProfile()">
              ✏️ Edit Profile
            </button>

            <button class="gray"
                    onclick="openPostComposer()">
              ➕ Create Post
            </button>
            `
            :

async function saveProfile(){

  const name =
    $("editName").value.trim();

  const username =
    $("editUsername").value.trim()
      .toLowerCase()
      .replace(/[^a-z0-9_]/g,"");

  const bio =
    $("editBio").value.trim();

  let profilePhoto =
    currentProfile?.profile_photo || null;

  let coverPhoto =
    currentProfile?.cover_photo || null;

  try{

    const photo =
      $("editPhoto").files[0];

    const cover =
      $("editCover").files[0];

    if(photo){
      profilePhoto =
        await uploadFile(photo,"profiles");

      coverPhoto =
        await uploadFile(cover,"covers");

    const {data,error} =
      await sb
        .from("fb_profiles")
        .update({
          name:name || "FriendBook User",
          username:username || null,
          bio:bio || null,
          profile_photo:profilePhoto,
          cover_photo:coverPhoto,
          updated_at:new Date().toISOString()
        })
        .eq("id",currentUser.id)
        .select()
        .single();

    if(error){
      toast("❌ "+error.message);
      return;

    currentProfile = data;

    closeModal();

    await renderProfile(currentUser.id);

async function sendFriendRequest(userId){

  if(userId===currentUser.id) return;

  const {data:existing} =
    await sb
      .from("fb_friend_requests")
      .select("id,status")
      .eq("sender_id",currentUser.id)
      .eq("receiver_id",userId)
      .maybeSingle();

  if(existing){

    toast("Friend request already sent.");
    return;
  }

  const {error} =
    await sb
      .from("fb_friend_requests")

function toggleVideoSound(video){

  if(!video) return;

  video.muted =
    !video.muted;

  if(!video.muted){
    video.volume = 1;
  }

  if(video.paused){
    video.play().catch(()=>{});
  }
}

function setupReelObserver(){

  const videos =
    document.querySelectorAll(".reel video");

  if(!videos.length) return;

  const observer =
    new IntersectionObserver(
      entries=>{

        entries.forEach(entry=>{

          const video =
            entry.target;

          if(entry.isIntersecting){

            video.play().catch(()=>{});

          }else{

            video.pause();
          }
        });

      },
      {
        threshold:0.65
      }
    );

  videos.forEach(v=>observer.observe(v));
}

    $("reelAudio").value.trim();

  if(!file){

    toast("শুধু Video file দিন।");
    return;
  }

  toast("Reel upload হচ্ছে...");

  try{

    const videoUrl =
      await uploadFile(file,"reels");

    const {error} =
      await sb
        .from("fb_reels")
        .insert({
          user_id:currentUser.id,

        <button onclick="showSavedPosts()">
          View Saved Posts
        </button>
      </div>

    </div>

    <div class="card">

      <div class="setting">
        <div class="settingtitle">
          ⚠️ Deactivate / Delete
        </div>

        <div class="settingdesc">
          এই demo app-এ destructive account deletion
          সরাসরি দেওয়া হয়নি।
        </div>
      </div>

    </div>
  `;
}

function toggleDarkMode(){

  document.body.classList.toggle("dark");

  localStorage.setItem(
    "friendbook_dark",
    document.body.classList.contains("dark")
      ? "1"
      : "0"
  );

  renderSettings();
}

async function saveCreatorSettings(){

  const enabled =
    $("monetizationEnabled").value==="true";

  const method =
    $("payoutMethod").value.trim();

  const email =
    $("payoutEmail").value.trim();

  const {data:existing} =
    await sb
      .from("fb_creator_settings")
      .select("user_id")
      .eq("user_id",currentUser.id)
      .maybeSingle();

  let result;

  const payload = {
    user_id:currentUser.id,
    monetization_enabled:enabled,
    payout_method:method || null,
    payout_email:email || null,
    updated_at:new Date().toISOString()
  };

  if(existing){

    result =
      await sb
        .from("fb_creator_settings")
        .update(payload)
        .eq("user_id",currentUser.id);

  }else{

    result =
      await sb
        .from("fb_creator_settings")
        .insert(payload);
  }

  if(result.error){
    toast("❌ "+result.error.message);
    return;
  }

  toast("✅ Monetization settings saved");

  await renderSettings();
}

async function showBlockedUsers(){

  const {data,error} =
    await sb
      .from("fb_blocks")
      .select("*")
      .eq("user_id",currentUser.id)
      .order("created_at",{ascending:false});

  let html = `
    <div class="pageTitle">
      🚫 Blocked Users
    </div>

    <div class="card">
  `;

  if(error){

    html +=
      `<div class="empty">
        ${escapeHTML(error.message)}
      </div>`;

  }else if(!data || data.length===0){

    html +=
      `<div class="empty">
        No blocked users.
      </div>`;

  }else{

    for(const b of data){

      const p =
        await getProfile(b.blocked_id);

      html += `
        <div class="person">

          <img class="avatar"
               src="${escapeHTML(avatar(p))}">

          <div class="personinfo">
            <div class="personname">
              ${escapeHTML(p?.name || "User")}
            </div>
          </div>

          <button onclick="unblockUser(${b.id})">
            Unblock
          </button>

        </div>
      `;
    }
  }

  html += `</div>`;

  $("main").innerHTML = html;
}

async function unblockUser(id){

  const {error} =
    await sb
      .from("fb_blocks")
      .delete()
      .eq("id",id)
      .eq("user_id",currentUser.id);

  if(error){
    toast("❌ "+error.message);
    return;
  }

  toast("User unblocked");

  await showBlockedUsers();
}

async function showSavedPosts(){

  const {data:pins,error} =
    await sb
      .from("fb_pinned_posts")
      .select("*")
      .eq("user_id",currentUser.id)
      .order("created_at",{ascending:false});

  if(error){

    $("main").innerHTML =
      `<div class="card empty">
        ${escapeHTML(error.message)}
      </div>`;

    return;
  }

  let html =
    `<div class="pageTitle">📌 Saved Posts</div>`;

  if(!pins || pins.length===0){

    html +=
      `<div class="card empty">
        No saved posts.
      </div>`;

  }else{

    for(const pin of pins){

      const {data:post} =
        await sb
          .from("fb_posts")
          .select("*")
          .eq("id",pin.post_id)
          .maybeSingle();

      if(post){
        html += await renderPost(post);
      }
    }
  }

  $("main").innerHTML = html;
}

/* ================================
   REALTIME
================================ */

function setupRealtime(){

  if(realtimeChannel){
    try{
      sb.removeChannel(realtimeChannel);
    }catch(e){}
  }

  realtimeChannel =
    sb.channel("friendbook-live-"+currentUser.id)

      .on(
        "postgres_changes",
        {
          event:"*",
          schema:"public",
          table:"fb_posts"
        },
        ()=>{
          if(currentPage==="home"){
            renderHome();
          }
        }
      )

      .on(
        "postgres_changes",
        {
          event:"*",
          schema:"public",
          table:"fb_notifications",
          filter:"receiver_id=eq."+currentUser.id
        },
        ()=>{
          if(currentPage==="notifications"){
            renderNotifications();
          }
        }
      )

      .subscribe();
}

/* ================================
   STARTUP
================================ */

function loadTheme(){

  if(
    localStorage.getItem("friendbook_dark")==="1"
  ){
    document.body.classList.add("dark");
  }
}

async function boot(){

  loadTheme();

  try{

    const {data,error} =
      await sb.auth.getSession();

    if(error){

      console.error(error);

      $("authScreen").classList.remove("hidden");
      $("app").classList.add("hidden");

      $("loginMsg").innerText =
        error.message;

      return;
    }

    if(data && data.session){

      currentUser =
        data.session.user;

      await startApp();

    }else{

      $("authScreen").classList.remove("hidden");
      $("app").classList.add("hidden");
    }

  }catch(error){

    console.error(error);

    $("authScreen").classList.remove("hidden");
    $("app").classList.add("hidden");

    $("loginMsg").innerText =
      "❌ "+error.message;
  }
}

sb.auth.onAuthStateChange(
  (event,session)=>{

    console.log(
      "AUTH EVENT:",
      event
    );

    if(event==="SIGNED_OUT"){

      currentUser=null;
      currentProfile=null;

      $("app").classList.add("hidden");
      $("authScreen").classList.remove("hidden");
    }

  }
);

boot();

</script>
