<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1877f2">
<meta name="description" content="My Social App - Social, Reels, Creator and Monetization">
<title>My Social App</title>

<link rel="manifest" href="./manifest.json">

<style>
:root{
 --primary:#1877f2;
 --primary2:#0d6efd;
 --bg:#f0f2f5;
 --card:#fff;
 --text:#111827;
 --muted:#65676b;
 --border:#dddfe2;
 --danger:#e53935;
 --success:#16a34a;
 --shadow:0 2px 12px rgba(0,0,0,.08);
 --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
font-family:Arial,"Noto Sans Bengali",sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0}
.hidden{display:none!important}
.app{min-height:100vh}

/* AUTH */
.auth{
 min-height:100vh;display:flex;align-items:center;justify-content:center;
 padding:20px;background:linear-gradient(135deg,#eaf2ff,#f5f7fb)
}
.authBox{
 width:100%;max-width:430px;background:var(--card);border-radius:24px;
 padding:28px;box-shadow:0 12px 45px rgba(0,0,0,.12)
}
.logo{
 width:64px;height:64px;border-radius:18px;background:var(--primary);
 color:#fff;display:flex;align-items:center;justify-content:center;
 font-size:30px;font-weight:900;margin:auto
}
.authTitle{text-align:center;font-size:28px;font-weight:800;margin:15px 0 5px}
.authSub{text-align:center;color:var(--muted);margin-bottom:22px}
.field{margin:10px 0}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.field input,.field textarea,.field select{
 width:100%;padding:13px;border:1px solid var(--border);
 border-radius:11px;background:var(--card);color:var(--text);outline:none
}
.field input:focus,.field textarea:focus,.field select:focus{
 border-color:var(--primary);box-shadow:0 0 0 3px rgba(24,119,242,.12)
}
.primary{
 width:100%;padding:13px;border-radius:11px;background:var(--primary);
 color:#fff;font-weight:800;margin-top:8px
}
.secondary{
 padding:11px 15px;border-radius:10px;background:#e7f3ff;color:#0866ff;
 font-weight:700
}
.authSwitch{text-align:center;margin-top:16px;color:var(--muted)}
.authSwitch button{background:none;color:var(--primary);font-weight:800}
.authError{
 padding:11px;border-radius:10px;background:#fff0f0;color:#c62828;
 margin:10px 0;font-size:14px
}
.authSuccess{
 padding:11px;border-radius:10px;background:#effdf3;color:#15803d;
 margin:10px 0;font-size:14px
}

/* TOPBAR */
.topbar{
 position:sticky;top:0;z-index:1000;height:62px;background:var(--card);
 border-bottom:1px solid var(--border);display:flex;align-items:center;
 padding:0 14px;gap:12px
}
.brand{font-weight:900;font-size:21px;color:var(--primary);white-space:nowrap}
.search{
 flex:1;max-width:480px;background:var(--bg);border-radius:22px;
 display:flex;align-items:center;padding:0 14px
}
.search input{border:0;background:none;outline:0;width:100%;padding:10px}
.topActions{margin-left:auto;display:flex;gap:7px}
.iconBtn{
 width:40px;height:40px;border-radius:50%;background:var(--bg);
 display:flex;align-items:center;justify-content:center;font-size:18px
}

/* LAYOUT */
.layout{
 display:grid;grid-template-columns:240px minmax(0,680px) 280px;
 gap:18px;max-width:1250px;margin:auto;padding:18px
}
.side{position:sticky;top:80px;height:max-content}
.sideItem{
 width:100%;padding:12px;border-radius:11px;background:transparent;
 text-align:left;font-weight:700;color:var(--text);margin-bottom:3px
}
.sideItem:hover{background:var(--card)}
.sideItem.active{background:#e7f3ff;color:var(--primary)}
.card{
 background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
 margin-bottom:15px;padding:15px
}
.sectionTitle{font-size:19px;font-weight:800;margin-bottom:12px}
.muted{color:var(--muted)}
hr{border:0;border-top:1px solid var(--border);margin:13px 0}

/* COMPOSER */
.composerRow{display:flex;gap:10px;align-items:center}
.avatar{
 width:44px;height:44px;border-radius:50%;object-fit:cover;background:#ddd;
 display:flex;align-items:center;justify-content:center;font-weight:800
}
.avatar.small{width:36px;height:36px}
.fakeInput{
 flex:1;background:var(--bg);padding:12px 15px;border-radius:22px;
 color:var(--muted);cursor:pointer
}
.composeTools{
 display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px
}
.toolBtn{
 padding:10px;border-radius:9px;background:var(--bg);font-weight:700
}
.previewGrid{
 display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:10px
}
.previewGrid img,.previewGrid video{
 width:100%;height:150px;object-fit:cover;border-radius:8px
}

/* POSTS */
.postHead{display:flex;gap:10px;align-items:center}
.postName{font-weight:800}
.postTime{font-size:12px;color:var(--muted)}
.postText{white-space:pre-wrap;line-height:1.5;margin:12px 0}
.postMedia{
 width:100%;max-height:600px;object-fit:contain;background:#000;border-radius:12px
}
.postActions{display:flex;gap:5px;margin-top:10px}
.postAction{
 flex:1;padding:9px;border-radius:9px;background:var(--bg);
 font-weight:700;color:var(--muted)
}
.postAction.liked{color:#1877f2;background:#e7f3ff}
.reactionBar{font-size:13px;color:var(--muted);margin-top:8px}
.commentBox{display:flex;gap:7px;margin-top:10px}
.commentBox input{
 flex:1;border:0;background:var(--bg);border-radius:20px;padding:10px
}
.comment{
 background:var(--bg);border-radius:12px;padding:8px 11px;margin-top:6px
}
.comment b{font-size:13px}

/* STORIES */
.storyRow{
 display:flex;gap:10px;overflow:auto;padding-bottom:3px
}
.story{
 min-width:105px;height:145px;border-radius:13px;position:relative;
 overflow:hidden;background:linear-gradient(135deg,#1877f2,#8b5cf6);
 color:#fff;display:flex;align-items:flex-end;padding:9px;font-weight:800
}
.story img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.story span{position:relative;text-shadow:0 1px 4px #000}

/* RIGHT */
.statGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{
 background:var(--bg);padding:13px;border-radius:12px
}
.stat strong{display:block;font-size:21px}

/* MODAL */
.modal{
 position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:4000;
 display:flex;align-items:center;justify-content:center;padding:15px
}
.modalBox{
 width:100%;max-width:650px;max-height:92vh;overflow:auto;
 background:var(--card);border-radius:18px;padding:18px
}
.modalHead{display:flex;align-items:center;justify-content:space-between}
.close{background:var(--bg);border-radius:50%;width:36px;height:36px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

/* PROFILE */
.cover{
 height:240px;border-radius:15px;background:linear-gradient(135deg,#1877f2,#9333ea);
 position:relative;overflow:hidden
}
.cover img{width:100%;height:100%;object-fit:cover}
.profileInfo{text-align:center;margin-top:-48px;position:relative}
.profileInfo .avatar{
 width:96px;height:96px;border:5px solid var(--card);margin:auto
}
.profileName{font-size:24px;font-weight:900;margin-top:7px}
.profileBio{color:var(--muted);margin:5px 0 12px}

/* REELS */
.reelsScreen{
 position:fixed;inset:0;z-index:5000;background:#000
}
.reelsTop{
 position:absolute;top:0;left:0;right:0;z-index:20;
 display:flex;align-items:center;gap:10px;padding:14px;color:#fff;
 background:linear-gradient(#0008,transparent)
}
.reelsTop button{background:#0007;color:#fff;border-radius:50%;width:40px;height:40px}
.reelsFeed{
 height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory;
 overscroll-behavior-y:contain
}
.reelCard{
 height:100dvh;min-height:100svh;scroll-snap-align:start;
 position:relative;background:#000
}
.reelCard video{width:100%;height:100%;object-fit:cover}
.reelShade{
 position:absolute;inset:0;background:linear-gradient(
 transparent 40%,transparent 52%,rgba(0,0,0,.8) 100%
 );pointer-events:none
}
.reelInfo{
 position:absolute;left:15px;right:80px;bottom:28px;color:#fff;z-index:5
}
.reelCreator{font-weight:900;font-size:17px}
.reelCaption{margin-top:8px;line-height:1.4}
.reelAudio{margin-top:7px;font-size:13px}
.reelActions{
 position:absolute;right:10px;bottom:85px;z-index:10;
 display:flex;flex-direction:column;gap:12px;align-items:center
}
.reelAction{
 width:48px;height:48px;border-radius:50%;background:#0008;color:#fff;
 display:flex;align-items:center;justify-content:center;font-size:20px
}
.reelAction.liked{color:#ff3040}
.reelCount{font-size:11px;color:#fff}
.heartBurst{
 position:absolute;left:50%;top:50%;
 transform:translate(-50%,-50%) scale(.4);font-size:100px;color:#fff;
 opacity:0;pointer-events:none;animation:heartPop .7s ease forwards;
 text-shadow:0 8px 30px rgba(0,0,0,.45);z-index:30
}
@keyframes heartPop{
 0%{opacity:0;transform:translate(-50%,-50%) scale(.35)}
 20%{opacity:1}
 70%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}
 100%{opacity:0;transform:translate(-50%,-50%) scale(1.35)}
}
.progress{
 position:absolute;left:0;right:0;bottom:0;height:3px;background:#ffffff44;z-index:30
}
.progress i{display:block;height:100%;width:0;background:#fff}

/* DASHBOARD */
.moneyHero{
 background:linear-gradient(135deg,#111827,#1d4ed8);color:#fff;
 border-radius:18px;padding:22px
}
.moneyAmount{font-size:38px;font-weight:900;margin:8px 0}
.moneyGrid{
 display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:15px
}
.moneyStat{
 background:#ffffff15;border-radius:12px;padding:11px
}
.moneyStat b{display:block;font-size:18px}
.earnRow{
 display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)
}
.switch{
 width:48px;height:26px;border-radius:20px;background:#bbb;padding:3px
}
.switch i{
 display:block;width:20px;height:20px;border-radius:50%;background:#fff;
 transition:.2s
}
.switch.on{background:var(--success)}
.switch.on i{transform:translateX(22px)}
.progressBar{height:9px;background:var(--bg);border-radius:20px;overflow:hidden}
.progressBar i{display:block;height:100%;background:var(--primary);width:0}

/* SETTINGS */
.setting{
 padding:13px 0;border-bottom:1px solid var(--border);
 display:flex;justify-content:space-between;gap:10px
}

/* TOAST */
#toast{
 position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
 background:#111;color:#fff;padding:12px 18px;border-radius:25px;
 z-index:9999;display:none;max-width:90%;text-align:center
}
#loading{
 position:fixed;inset:0;background:#fff;z-index:99999;
 display:flex;align-items:center;justify-content:center;flex-direction:column
}
.spinner{
 width:40px;height:40px;border:4px solid #ddd;border-top-color:var(--primary);
 border-radius:50%;animation:spin .8s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}

/* MOBILE */
.mobileNav{
 display:none;position:fixed;bottom:0;left:0;right:0;background:var(--card);
 border-top:1px solid var(--border);z-index:1500;
 grid-template-columns:repeat(5,1fr)
}
.mobileNav button{background:none;padding:9px 3px;font-size:11px;color:var(--muted)}
.mobileNav button b{display:block;font-size:19px}
body.reels-open{overflow:hidden}

@media(max-width:1050px){
 .layout{grid-template-columns:190px minmax(0,680px)}
 .rightSide{display:none}
}
@media(max-width:760px){
 .topbar{height:58px}
 .brand{font-size:18px}
 .search{max-width:none}
 .topActions .optional{display:none}
 .layout{display:block;padding:10px 8px 75px}
 .leftSide{display:none}
 .mobileNav{display:grid}
 .card{border-radius:13px}
 .composeTools{grid-template-columns:repeat(2,1fr)}
 .moneyGrid{grid-template-columns:1fr 1fr}
 .grid2{grid-template-columns:1fr}
 .cover{height:180px}
 .reelCard video{object-fit:cover}
}
</style>
</head>

<body>

<div id="loading">
 <div class="spinner"></div>
 <b style="margin-top:12px">My Social App</b>
 <small style="margin-top:5px;color:#777">লোড হচ্ছে...</small>
</div>

<!-- AUTH -->
<section id="auth" class="auth hidden">
 <div class="authBox">

  <div class="authTitle">My Social App</div>

  <div id="authError" class="authError hidden"></div>

    <button id="forgotBtn">Password ভুলে গেছেন?</button>
   </div>

    নতুন account?
    <button id="showSignup">Create new account</button>
   </div>
  </div>

  <div id="signupForm" class="hidden">
   <div class="field">
    <label>Name</label>
    <input id="signupName" type="text" placeholder="আপনার নাম">
   </div>
   <div class="field">
    <label>Email</label>
    <input id="signupEmail" type="email" autocomplete="email" placeholder="Email">
   </div>
   <div class="field">
    <label>Password</label>
    <input id="signupPassword" type="password" autocomplete="new-password" placeholder="কমপক্ষে 6 অক্ষর">

 </div>
</section>

<!-- APP -->
<div id="app" class="app hidden">

<header class="topbar">
 <div class="brand">My Social App</div>

 <div class="search">
  🔎
  <input id="globalSearch" placeholder="Search people, posts, reels...">
 </div>

 <div class="topActions">
  <button class="iconBtn optional" onclick="openMessages()">💬</button>
  <button class="iconBtn optional" onclick="showPage('notifications')">🔔</button>
  <button class="iconBtn" onclick="showPage('profile')">👤</button>
  <button class="iconBtn" onclick="showPage('settings')">⚙️</button>

</header>

<div class="layout">

<aside class="side leftSide">
 <button class="sideItem active" data-page="home" onclick="showPage('home')">🏠 Home</button>
 <button class="sideItem" data-page="reels" onclick="openReels()">🎬 Reels</button>
 <button class="sideItem" data-page="profile" onclick="showPage('profile')">👤 Profile</button>
 <button class="sideItem" data-page="friends" onclick="showPage('friends')">👥 Friends</button>
 <button class="sideItem" data-page="messages" onclick="showPage('messages')">💬 Messages</button>
 <button class="sideItem" data-page="notifications" onclick="showPage('notifications')">🔔 Notifications</button>
 <button class="sideItem" data-page="saved" onclick="showPage('saved')">🔖 Saved</button>
 <button class="sideItem" data-page="memories" onclick="showPage('memories')">🕘 Memories</button>
 <button class="sideItem" data-page="groups" onclick="showPage('groups')">👨‍👩‍👧 Groups</button>
 <button class="sideItem" data-page="pages" onclick="showPage('pages')">📄 Pages</button>
 <button class="sideItem" data-page="marketplace" onclick="showPage('marketplace')">🛒 Marketplace</button>
 <button class="sideItem" data-page="events" onclick="showPage('events')">📅 Events</button>
 <button class="sideItem" data-page="live" onclick="showPage('live')">🔴 Live</button>
 <button class="sideItem" data-page="creator" onclick="showPage('creator')">💰 Monetization</button>
 <button class="sideItem" data-page="analytics" onclick="showPage('analytics')">📊 Analytics</button>

<main id="main"></main>

<aside class="side rightSide">
 <div class="card">
  <div class="sectionTitle">Your account</div>
  <div class="row">
   <div id="rightAvatar" class="avatar">U</div>
   <div>
    <b id="rightName">User</b>
    <div class="muted" id="rightEmail"></div>
   </div>
  </div>
 </div>

 <div class="card">
  <div class="sectionTitle">Quick access</div>
  <button class="sideItem" onclick="showPage('creator')">💰 Creator & Earnings</button>
  <button class="sideItem" onclick="showPage('analytics')">📊 Analytics</button>
  <button class="sideItem" onclick="openReels()">🎬 Watch Reels</button>
 </div>
</aside>

</div>

<nav class="mobileNav">
 <button onclick="showPage('home')"><b>🏠</b>Home</button>
 <button onclick="openReels()"><b>🎬</b>Reels</button>
 <button onclick="showPage('creator')"><b>💰</b>Earn</button>
 <button onclick="showPage('notifications')"><b>🔔</b>Alerts</button>
 <button onclick="showPage('profile')"><b>👤</b>Profile</button>
</nav>

</div>

<!-- GENERIC MODAL -->
<div id="modal" class="modal hidden">
 <div class="modalBox">
  <div class="modalHead">
   <h3 id="modalTitle">Modal</h3>
   <button class="close" onclick="closeModal()">✕</button>
  </div>
  <div id="modalBody"></div>
 </div>
</div>

<!-- REELS -->
<div id="reelsScreen" class="reelsScreen hidden">
 <div class="reelsTop">
  <button onclick="closeReels()">←</button>
  <b>Reels</b>
  <div style="margin-left:auto;display:flex;gap:7px">
   <button onclick="openReelUpload()">＋</button>
   <button id="globalSoundBtn" onclick="toggleGlobalReelSound()">🔊</button>
  </div>
 </div>
 <div id="reelsFeed" class="reelsFeed"></div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* ============================================================
   SUPABASE
============================================================ */
const SUPABASE_URL = "https://skereuaizdczbvjplisi.supabase.co";
const SUPABASE_KEY = "sb_publishable_3R2otJA1zIlsMsTYxe1ocw_NAPY5O9x";

let supabaseClient = null;
let currentUser = null;
let currentProfile = null;
let postsCache = [];
let reelsCache = [];
let reelObserver = null;
let reelSound = true;

try{
 supabaseClient = window.supabase.createClient(
   SUPABASE_URL,
   SUPABASE_KEY,
   {
    auth:{
     persistSession:true,
     autoRefreshToken:true,
     detectSessionInUrl:true
    }
   }
 );
}catch(e){
 console.error(e);
}

/* ============================================================
   HELPERS
============================================================ */
const $ = id => document.getElementById(id);

function esc(v){
 return String(v ?? "").replace(/[&<>"']/g,m=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
 }[m]));
}

function toast(msg){
 const el=$("toast");
 el.textContent=msg;
 el.style.display="block";
 clearTimeout(window.toastTimer);
 window.toastTimer=setTimeout(()=>el.style.display="none",2600);
}

function errorText(err){
 return err?.message || err?.error_description || "একটি সমস্যা হয়েছে";
}

function authError(msg){
 $("authError").textContent=msg;
 $("authError").classList.remove("hidden");
 $("authSuccess").classList.add("hidden");
}

function authSuccess(msg){
 $("authSuccess").textContent=msg;
 $("authSuccess").classList.remove("hidden");
 $("authError").classList.add("hidden");
}

function clearAuthMessages(){
 $("authError").classList.add("hidden");
 $("authSuccess").classList.add("hidden");
}

function openModal(title,body){
 $("modalTitle").textContent=title;
 $("modalBody").innerHTML=body;
 $("modal").classList.remove("hidden");
}

function closeModal(){
 $("modal").classList.add("hidden");
}

function formatDate(d){
 if(!d)return "";
 try{
  return new Date(d).toLocaleString("bn-BD",{
   day:"numeric",month:"short",hour:"numeric",minute:"2-digit"
  });
 }catch{return ""}
}

function initials(name){
 return String(name||"U").trim().charAt(0).toUpperCase() || "U";
}

function avatarHTML(profile,small=false){
 const cls=small?"avatar small":"avatar";
 if(profile?.profile_photo){
  return `<img class="${cls}" src="${esc(profile.profile_photo)}" alt="">`;
 }
 return `<div class="${cls}">${esc(initials(profile?.name||currentProfile?.name))}</div>`;
}

async function safeQuery(fn){
 try{
  return await fn();
 }catch(e){
  console.warn(e);
  return {data:null,error:e};
 }
}

/* ============================================================
   AUTH — FIXED
============================================================ */
async function boot(){
 $("loading").classList.remove("hidden");

 if(!supabaseClient){
  $("loading").classList.add("hidden");
  $("auth").classList.remove("hidden");
  authError("Supabase connection তৈরি হয়নি।");
  return;
 }

 try{
  const {data,error}=await supabaseClient.auth.getSession();

  if(error)throw error;

  if(data?.session?.user){
   currentUser=data.session.user;
   await afterLogin();
  }else{
   showAuth();
  }

  supabaseClient.auth.onAuthStateChange(async(event,session)=>{
   console.log("AUTH:",event);

   if(session?.user){
    currentUser=session.user;

    if(event==="SIGNED_IN" || event==="INITIAL_SESSION"){
     await afterLogin();
    }
   }else if(event==="SIGNED_OUT"){
    currentUser=null;
    currentProfile=null;
    showAuth();
   }
  });

 }catch(e){
  console.error(e);
  showAuth();
  authError("Supabase Auth error: "+errorText(e));
 }

 $("loading").classList.add("hidden");
}

async function login(){
 clearAuthMessages();

 const email=$("loginEmail").value.trim();
 const password=$("loginPassword").value;

 if(!email || !password){
  authError("Email এবং Password দিন।");
  return;
 }

 const btn=$("loginBtn");
 btn.disabled=true;
 btn.textContent="Login হচ্ছে...";

 try{
  const {data,error}=await supabaseClient.auth.signInWithPassword({
   email,password
  });

  if(error)throw error;

  if(data?.session?.user){
   currentUser=data.session.user;
   await afterLogin();
   toast("Login সফল হয়েছে");
  }else{
   throw new Error("Session পাওয়া যায়নি।");
  }

 }catch(e){
  console.error(e);

  let msg=errorText(e);

  if(msg.toLowerCase().includes("invalid login credentials")){
   msg="Email অথবা Password ভুল।";
  }else if(msg.toLowerCase().includes("email not confirmed")){
   msg="Email confirmation প্রয়োজন। Supabase Authentication settings চেক করুন।";
  }

  authError(msg);
 }finally{
  btn.disabled=false;
  btn.textContent="Login";
 }
}

async function signup(){
 clearAuthMessages();

 const name=$("signupName").value.trim();
 const email=$("signupEmail").value.trim();
 const password=$("signupPassword").value;

 if(!name || !email || !password){
  authError("Name, Email এবং Password সব দিন।");
  return;
 }

 if(password.length<6){
  authError("Password কমপক্ষে 6 অক্ষরের হতে হবে।");
  return;
 }

 const btn=$("signupBtn");
 btn.disabled=true;
 btn.textContent="Account তৈরি হচ্ছে...";

 try{
  const {data,error}=await supabaseClient.auth.signUp({
   email,
   password,
   options:{
    data:{name:name}
   }
  });

  if(error)throw error;

  /*
    Email confirmation OFF থাকলে session সাধারণত পাওয়া যাবে।
    Confirmation ON থাকলে session null হতে পারে — তখন message দেখানো হবে।
  */
  if(data?.session?.user){
   currentUser=data.session.user;
   await createProfile(name);
   await afterLogin();
   toast("Account তৈরি হয়েছে");
  }else{
   authSuccess(
    "Account তৈরি হয়েছে। যদি email confirmation চালু থাকে, email confirm করে Login করুন।"
   );
   $("loginEmail").value=email;
   $("loginForm").classList.remove("hidden");
   $("signupForm").classList.add("hidden");
  }

 }catch(e){
  console.error(e);
  authError(errorText(e));
 }finally{
  btn.disabled=false;
  btn.textContent="Create Account";
 }
}

async function uploadFile(bucket,file,path){
 const {error}=await supabaseClient.storage
  .from(bucket)
  .upload(path,file,{upsert:false,cacheControl:"3600"});

 if(error)throw error;

 const {data}=supabaseClient.storage.from(bucket).getPublicUrl(path);
 return data.publicUrl;
}

async function publishPost(){
 const text=$("postText")?.value.trim()||"";
 const privacy=$("postPrivacy")?.value||"public";
 const feeling=$("postFeeling")?.value.trim()||null;

 if(!text && !selectedPostFiles.length){
  toast("Post text অথবা media দিন");
  return;
 }

 const btn=document.querySelector("#modalBody .primary");
 if(btn){
  btn.disabled=true;
  btn.textContent="Uploading...";
 }

 try{
  let image_url=null;
  let video_url=null;
  const mediaRows=[];

  for(let i=0;i<selectedPostFiles.length;i++){
   const file=selectedPostFiles[i];
   const ext=(file.name.split(".").pop()||"bin").toLowerCase();
   const path=`${currentUser.id}/${Date.now()}_${i}.${ext}`;

   if(file.type.startsWith("image")){
    image_url=await uploadFile("post-images",file,path);
   }else if(file.type.startsWith("video")){
    /*
      ভিডিও fallback:
      post-images নয়, media bucket ব্যবহার করা হচ্ছে।
      যদি media bucket upload permission না থাকে, error দেখাবে।
    */
    video_url=await uploadFile("media",file,path);
   }

   mediaRows.push({
    user_id:currentUser.id,
    media_url:image_url||video_url,
    media_type:file.type.startsWith("image")?"image":"video"
   });
  }

  const payload={
   user_id:currentUser.id,
   text:text||null,
   image_url:image_url,
   video_url:video_url,
   privacy:privacy,
   feeling:feeling,
   created_at:new Date().toISOString()
  };

  const {data,error}=await supabaseClient
   .from("posts")
   .insert(payload)
   .select()
   .single();

  if(error)throw error;

  /*
    Optional post_media.
    Schema আলাদা হলে post publish fail করবে না।
  */
  if(data?.id && mediaRows.length){
   for(const m of mediaRows){
    try{
     await supabaseClient.from("post_media").insert({
      post_id:data.id,
      user_id:currentUser.id,
      media_url:m.media_url,
      media_type:m.media_type
     });
    }catch(e){
     console.warn("post_media optional:",e);
    }
   }
  }

  closeModal();
  toast("Post published");
  await loadPosts();

 }catch(e){
  console.error(e);
  toast("Post upload হয়নি: "+errorText(e));
 }finally{
  if(btn){
   btn.disabled=false;
   btn.textContent="Publish Post";
  }
 }
}

 document.querySelectorAll(".reelCard video").forEach(v=>{
  v.addEventListener("loadedmetadata",()=>{
   const card=v.closest(".reelCard");
   const progress=card?.querySelector(".progress i");
   v.addEventListener("timeupdate",()=>{
    if(progress && v.duration){
     progress.style.width=(v.currentTime/v.duration*100)+"%";
    }
   });
  });

  let lastTap=0;
  let tapTimer=null;

  v.addEventListener("pointerup",e=>{
   const now=Date.now();

   if(now-lastTap<320){
    clearTimeout(tapTimer);
    const card=v.closest(".reelCard");
    toggleReelLike(card,true);
    showHeart(card,e.clientX,e.clientY);
    lastTap=0;

   }

    if(v.paused)v.play().catch(()=>{});

  });
 });

function setupReelObserver(){
 if(reelObserver)reelObserver.disconnect();

 reelObserver=new IntersectionObserver(entries=>{
  entries.forEach(entry=>{
   const video=entry.target.querySelector("video");
   if(!video)return;

   if(entry.isIntersecting && entry.intersectionRatio>=.65){
    document.querySelectorAll(".reelCard video").forEach(v=>{
     if(v!==video)v.pause();
    });

    video.muted=!reelSound;

    video.play().catch(()=>{
     video.muted=true;
     video.play().catch(()=>{});
    });

    countReelView(entry.target.dataset.reelId);
   }else{
    video.pause();
   }
  });
 },{threshold:[.65]});

 document.querySelectorAll(".reelCard").forEach(card=>{
  reelObserver.observe(card);
 });
}

async function toggleReelLike(card,forceLike=false){
 if(!card)return;

 const id=Number(card.dataset.reelId);
 const button=card.querySelector(".reelActions .reelAction");

 try{
  const {data:existing}=await supabaseClient
   .from("reel_reactions")
   .select("*")
   .eq("reel_id",id)
   .eq("user_id",currentUser.id)
   .maybeSingle();

  if(existing && !forceLike){
   await supabaseClient.from("reel_reactions").delete()
    .eq("reel_id",id).eq("user_id",currentUser.id);
   button.classList.remove("liked");
  }else if(!existing){
   await supabaseClient.from("reel_reactions").insert({
    reel_id:id,user_id:currentUser.id,reaction:"like"
   });
   button.classList.add("liked");
  }else{
   button.classList.add("liked");
  }
 }catch(e){
  /*
   schema mismatch হলে double-tap/UI বন্ধ হবে না।
  */
  button.classList.toggle("liked");
  console.warn("reel reaction:",e);
 }
}

async function uploadReel(){
 const file=$("reelFile")?.files[0];

 if(!file){
  toast("একটি video নির্বাচন করুন");
  return;
 }

 const progress=$("reelUploadProgress");
 progress.classList.remove("hidden");

 try{
  const ext=(file.name.split(".").pop()||"mp4").toLowerCase();
  const path=`${currentUser.id}/${Date.now()}.${ext}`;

  const {error}=await supabaseClient.storage
   .from("reels")
   .upload(path,file,{upsert:false});

  if(error)throw error;

  const {data:publicData}=supabaseClient.storage
   .from("reels").getPublicUrl(path);

  const {error:dbError}=await supabaseClient.from("reels").insert({
   user_id:currentUser.id,
   video_url:publicData.publicUrl,
   caption:$("reelCaption").value.trim(),
   audio_name:$("reelAudio").value.trim()||"Original audio",
   views:0,
   created_at:new Date().toISOString()
  });

  if(dbError)throw dbError;

  closeModal();
  toast("Reel uploaded");
  await loadReels();

 }catch(e){
  toast("Reel upload হয়নি: "+errorText(e));
 }finally{
  progress.classList.add("hidden");
 }
}

async function toggleMonetization(key,value){
 try{
  const settings=await ensureMonetizationSettings();

  const {error}=await supabaseClient
   .from("monetization_settings")
   .update({
    [key]:value,
    updated_at:new Date().toISOString()
   })
   .eq("user_id",currentUser.id);

  if(error)throw error;

  toast(value?"Enabled":"Disabled");
  await renderCreator();
 }catch(e){
  toast("Monetization setting update হয়নি: "+errorText(e));
 }
}

function averageMetric(rows,key){
 if(!rows.length)return 0;
 const vals=rows.map(x=>Number(x[key]||0)).filter(x=>x>0);
 if(!vals.length)return 0;
 return vals.reduce((a,b)=>a+b,0)/vals.length;
}

function countryEarnings(rows){
 const map={};

 rows.forEach(x=>{
  const c=x.country||"Unknown";
  map[c]=(map[c]||0)+Number(x.amount||0);
 });

 const arr=Object.entries(map).sort((a,b)=>b[1]-a[1]);

 return arr.length
  ? arr.map(([c,a])=>`
    <div class="earnRow">
     <b>${esc(c)}</b>
     <span>$${a.toFixed(4)}</span>
    </div>`).join("")
  : `<p class="muted">Country data এখনো নেই।</p>`;
}

async function requestPayout(available,minPayout){
 if(available<minPayout){
  toast(`Minimum payout $${minPayout.toFixed(2)}। Available $${available.toFixed(2)}`);
  return;
 }

 openModal("Request Payout",`
  <p>Available balance: <b>$${available.toFixed(4)}</b></p>
  <p>Minimum payout: <b>$${minPayout.toFixed(2)}</b></p>

   <label>Amount</label>
   <input id="payoutAmount" type="number" step="0.0001"
    value="${available.toFixed(4)}" max="${available}">
  </div>

  <div class="field">
   <label>Payment method</label>
   <select id="payoutMethod">
    <option>Bank</option>
    <option>Payoneer</option>
    <option>PayPal</option>
    <option>Mobile Banking</option>
   </select>
  </div>

  <button class="primary" onclick="submitPayout(${available},${minPayout})">
   Submit Payout Request
  </button>
 `);
}

async function submitPayout(available,minPayout){
 const amount=Number($("payoutAmount").value);

 if(!amount || amount<minPayout || amount>available){
  toast("Payout amount ঠিক নয়");
  return;
 }

 try{
  const {error}=await supabaseClient.from("payout_requests").insert({
   user_id:currentUser.id,
   amount,
   currency:"USD",
   method:$("payoutMethod").value,
   status:"pending"
  });

  if(error)throw error;

  closeModal();
  toast("Payout request submitted");
 }catch(e){
  toast("Payout request হয়নি: "+errorText(e));
 }
}

function toggleDark(){
 const dark=document.body.dataset.theme!=="dark";
 document.body.dataset.theme=dark?"dark":"light";

 if(dark){
  document.documentElement.style.setProperty("--bg","#101114");
  document.documentElement.style.setProperty("--card","#18191b");
  document.documentElement.style.setProperty("--text","#f5f5f5");
  document.documentElement.style.setProperty("--muted","#b0b3b8");
  document.documentElement.style.setProperty("--border","#333");
 }else{
  document.documentElement.style.setProperty("--bg","#f0f2f5");
  document.documentElement.style.setProperty("--card","#fff");
  document.documentElement.style.setProperty("--text","#111827");
  document.documentElement.style.setProperty("--muted","#65676b");
  document.documentElement.style.setProperty("--border","#dddfe2");
 }

 localStorage.setItem("msa_dark",dark?"1":"0");
}

if(localStorage.getItem("msa_dark")==="1"){
 setTimeout(toggleDark,0);
}

async function downloadMyData(){
 try{
  const [profile,posts,reels]=await Promise.all([
   safeQuery(()=>supabaseClient.from("profiles").select("*").eq("id",currentUser.id).maybeSingle()),
   safeQuery(()=>supabaseClient.from("posts").select("*").eq("user_id",currentUser.id)),
   safeQuery(()=>supabaseClient.from("reels").select("*").eq("user_id",currentUser.id))
  ]);

  const data={
   exported_at:new Date().toISOString(),
   profile:profile.data,
   posts:posts.data||[],
   reels:reels.data||[]
  };

  const blob=new Blob([JSON.stringify(data,null,2)],{
   type:"application/json"
  });

  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="my-social-app-data.json";
  a.click();
  URL.revokeObjectURL(url);

  toast("Data downloaded");
 }catch(e){
  toast(errorText(e));
 }
}
