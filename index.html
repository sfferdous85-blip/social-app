<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FriendBook Login Test</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f0f2f5;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}
.box{
  width:90%;
  max-width:380px;
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 5px 20px #0002;
}
h1{
  text-align:center;
  color:#1877f2;
}
input{
  width:100%;
  padding:13px;
  margin:7px 0;
  box-sizing:border-box;
  border:1px solid #ddd;
  border-radius:8px;
}
button{
  width:100%;
  padding:13px;
  margin-top:10px;
  border:0;
  border-radius:8px;
  background:#1877f2;
  color:white;
  font-weight:bold;
}
#msg{
  margin-top:15px;
  padding:10px;
  background:#f0f2f5;
  border-radius:8px;
}
</style>
</head>

<body>

<div class="box">

<h1>FriendBook</h1>

<input
 id="email"
 type="email"
 placeholder="Email">

<input
 id="password"
 type="password"
 placeholder="Password">

<button onclick="login()">
Log In
</button>

<div id="msg">Login করার জন্য তথ্য দিন।</div>

</div>

<script>

const SUPABASE_URL =
"https://skereuaizdczbvjplisi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_3R2otJA1zIlsMsTYxe1ocw_NAPY5O9x";

const sb =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function login(){

 const email =
 document.getElementById("email").value.trim();

 const password =
 document.getElementById("password").value;

 const msg =
 document.getElementById("msg");

 if(!email || !password){

   msg.innerText =
   "Email এবং Password দিন।";

   return;
 }

 msg.innerText="Logging in...";

 try{

   const result =
   await sb.auth.signInWithPassword({
     email:email,
     password:password
   });

   console.log(result);

   if(result.error){

     msg.innerText =
     "ERROR: "+result.error.message;

     return;
   }

   if(result.data.session){

     msg.innerText =
     "✅ LOGIN SUCCESSFUL!";

   }else{

     msg.innerText =
     "Login হয়েছে কিন্তু session পাওয়া যায়নি।";
   }

 }catch(error){

   console.error(error);

   msg.innerText =
   "ERROR: "+error.message;
 }
}

</script>

</body>
</html>
