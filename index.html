<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1877f2">
<link rel="manifest" href="./manifest.json">
<title>My Social App</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f0f2f5;
 color:#1c1e21
}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0}
.hidden{display:none!important}
.muted{color:#65676b;font-size:13px}

.top{
 height:58px;
 background:#fff;
 border-bottom:1px solid #ddd;
 display:flex;
 align-items:center;
 padding:0 14px;
 gap:10px;
 position:sticky;
 top:0;
 z-index:20
}

.logo{
 font-size:24px;
 font-weight:800;
 color:#1877f2
}

.search{
 max-width:300px;
 width:100%;
 padding:10px 14px;
 border-radius:22px;
 border:1px solid #ddd;
 background:#f0f2f5
}

.top-spacer{flex:1}

.iconbtn{
 background:#f0f2f5;
 border-radius:50%;
 width:40px;
 height:40px
}

.avatar{
 width:40px;
 height:40px;
 border-radius:50%;
 object-fit:cover;
 background:#ddd
}

.layout{
 display:grid;
 grid-template-columns:240px minmax(0,680px) 260px;
 gap:18px;
 max-width:1200px;
 margin:auto;
 padding:18px
}

.sidebar,.right{
 position:sticky;
 top:76px;
 height:max-content
}

.nav{
 padding:11px 12px;
 border-radius:10px;
 margin-bottom:4px;
 font-weight:600
}

.nav:hover{background:#ddd}

.card{
 background:#fff;
 border-radius:12px;
 padding:14px;
 margin-bottom:14px;
 box-shadow:0 1px 2px #0001
}

.nav.active{
 background:#dceaff;
 color:#1877f2
}

.composer{
 display:flex;
 gap:10px;
 align-items:center
}

.composer button{
 background:#f0f2f5;
 padding:10px 15px;
 border-radius:8px
}

.primary{
 background:#1877f2!important;
 color:white!important
}

.danger{
 background:#e41e3f!important;
 color:white!important
}

.success{
 background:#31a24c!important;
 color:white!important
}

.post-head{
 display:flex;
 align-items:center;
 gap:10px
}

.post-head .grow{flex:1}

.post-text{
 white-space:pre-wrap;
 margin:12px 0;
 font-size:16px
}

.post-media{
 width:100%;
 max-height:500px;
 object-fit:cover;
 border-radius:10px;
 margin-top:8px
}

.media-grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:4px
}

.media-grid img,
.media-grid video{
 width:100%;
 height:250px;
 object-fit:cover;
 border-radius:7px
}

.actions{
 display:flex;
 border-top:1px solid #eee;
 border-bottom:1px solid #eee;
 margin-top:10px
}

.actions button{
 flex:1;
 background:white;
 padding:10px
}

.actions button:hover{
 background:#f0f2f5
}

.comment{
 padding:8px;
 background:#f0f2f5;
 border-radius:12px;
 margin-top:7px
}

.comment-row{
 display:flex;
 gap:7px
}

.comment-row input{
 flex:1;
 padding:10px;
 border:0;
 border-radius:20px;
 background:#f0f2f5
}

.story-row{
 display:flex;
 gap:10px;
 overflow:auto
}

.story{
 min-width:100px;
 height:150px;
 border-radius:12px;
 position:relative;
 overflow:hidden;
 background:#ddd
}

.story img{
 width:100%;
 height:100%;
 object-fit:cover
}

.story span{
 position:absolute;
 bottom:7px;
 left:7px;
 color:white;
 font-weight:bold;
 text-shadow:0 1px 3px #000
}

.person{
 display:flex;
 align-items:center;
 gap:9px;
 padding:9px;
 border-radius:9px
}

.person:hover{background:#f0f2f5}
.person .grow{flex:1}

.modal{
 position:fixed;
 inset:0;
 background:#0008;
 z-index:50;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:15px
}

.modal-box{
 background:#fff;
 width:min(600px,100%);
 max-height:90vh;
 overflow:auto;
 border-radius:14px;
 padding:18px
}

.modal-head{
 display:flex;
 justify-content:space-between;
 align-items:center
}

.modal input,
.modal textarea,
.modal select{
 width:100%;
 padding:11px;
 margin:7px 0;
 border:1px solid #ddd;
 border-radius:8px
}

.row{
 display:flex;
 gap:8px;
 flex-wrap:wrap
}

.smallbtn{
 padding:7px 10px;
 border-radius:7px;
 background:#e4e6eb
}

.profile-cover{
 height:210px;
 background:#ddd;
 border-radius:12px 12px 0 0;
 overflow:hidden
}

.profile-cover img{
 width:100%;
 height:100%;
 object-fit:cover
}

.profile-main{
 margin-top:-35px;
 padding:0 18px 18px
}

.profile-main .avatar{
 width:90px;
 height:90px;
 border:4px solid white
}

.profile-actions{
 display:flex;
 gap:8px;
 margin-top:10px
}

.chat-wrap{
 display:grid;
 grid-template-columns:230px 1fr;
 height:600px
}

.chat-list{
 border-right:1px solid #ddd;
 overflow:auto
}

.chat-window{
 display:flex;
 flex-direction:column
}

.chat-title{
 padding:12px;
 border-bottom:1px solid #ddd
}

.messages{
 flex:1;
 overflow:auto;
 padding:12px;
 background:#f5f6f7
}

.msg{
 max-width:70%;
 padding:9px 12px;
 background:white;
 border-radius:14px;
 margin:6px 0;
 display:table
}

.msg.mine{
 margin-left:auto;
 background:#1877f2;
 color:white
}

.seen{
 font-size:11px;
 opacity:.7;
 margin-left:5px
}

.typing{
 font-size:12px;
 padding:4px 12px
}

.message-input{
 display:flex;
 gap:7px;
 padding:10px;
 border-top:1px solid #ddd
}

.message-input input{
 flex:1;
 padding:11px;
 border-radius:22px;
 border:1px solid #ddd
}

.toggle{
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:13px 0;
 border-bottom:1px solid #eee
}

.switch{
 width:48px;
 height:27px;
 border-radius:20px;
 background:#bbb;
 padding:3px
}

.switch i{
 display:block;
 width:21px;
 height:21px;
 background:#fff;
 border-radius:50%;
 transition:.2s
}

.switch.on{background:#1877f2}

.switch.on i{
 transform:translateX(21px)
}

.dark{
 background:#18191a;
 color:#e4e6eb
}

.dark .card,
.dark .top,
.dark .modal-box{
 background:#242526;
 color:#e4e6eb
}

.dark .actions button,
.dark .search,
.dark .composer button,
.dark .smallbtn,
.dark .messages{
 background:#3a3b3c;
 color:#fff
}

.dark .actions button:hover,
.dark .nav:hover{
 background:#3a3b3c
}

.dark input,
.dark textarea,
.dark select{
 background:#3a3b3c;
 color:#fff;
 border-color:#555
}

.bottom-nav{display:none}

@media(max-width:950px){

 .layout{
  grid-template-columns:1fr
 }

 .sidebar,.right{
  display:none
 }

 .layout{
  padding:10px;
  padding-bottom:70px
 }

 .bottom-nav{
  display:flex;
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:55px;
  background:#fff;
  border-top:1px solid #ddd;
  z-index:30
 }

 .bottom-nav button{
  flex:1;
  background:#fff
 }

 .search{
  max-width:160px
 }

 .chat-wrap{
  grid-template-columns:1fr
 }

 .chat-list{
  display:none
 }

 .media-grid img,
 .media-grid video{
  height:190px
 }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen" class="modal">

<div class="modal-box">

<h1 class="logo">My Social App</h1>

<div id="authLogin">

<h2>Login</h2>

<input
 id="loginEmail"
 type="email"
 placeholder="Email"
>

<input
 id="loginPassword"
 type="password"
 placeholder="Password"
>

<button
 class="primary"
 style="width:100%;padding:12px;border-radius:8px"
 onclick="login()"
>
Login
</button>

<p>
<button
 class="smallbtn"
 onclick="showRegister()"
>
Create new account
</button>
</p>

</div>


<div id="authRegister" class="hidden">

<h2>Create account</h2>

<input
 id="regName"
 placeholder="Name"
>

<input
 id="regEmail"
 type="email"
 placeholder="Email"
>

<input
 id="regPassword"
 type="password"
 placeholder="Password"
>

<button
 class="primary"
 style="width:100%;padding:12px;border-radius:8px"
 onclick="register()"
>
Create account

<button

 onclick="showLogin()"
>
Back to login

</div>


<!-- APP -->
<div id="app" class="hidden">

<header class="top">

<div class="logo">My Social</div>

<input
 class="search"
 id="searchInput"
 placeholder="Search..."
 onkeydown="if(event.key==='Enter')doSearch()"
>

<div class="top-spacer"></div>

<button
 class="iconbtn"
 onclick="openPage('messenger')"
>
💬
</button>

<button
 class="iconbtn"

>
🔔

<img

>

</header>


<div class="layout">

<!-- SIDEBAR -->
<aside class="sidebar">

<div class="card">

<div
 class="nav active"
 data-page="home"
 onclick="openPage('home')"
>
🏠 Home

<div
 class="nav"
 data-page="profile"
 onclick="openPage('profile')"
>
👤 Profile
</div>

<div
 class="nav"
 data-page="friends"
 onclick="openPage('friends')"
>
👥 Friends
</div>

<div
 class="nav"
 data-page="messenger"
 onclick="openPage('messenger')"
>
💬 Messenger
</div>

<div
 class="nav"
 data-page="notifications"
 onclick="openPage('notifications')"
>
🔔 Notifications
</div>

<div
 class="nav"
 data-page="reels"
 onclick="openPage('reels')"
>
🎬 Reels
</div>

<div
 class="nav"
 data-page="earnings"
 onclick="openPage('earnings')"
>
💰 Earnings
</div>

<div
 class="nav"
 data-page="settings"
 onclick="openPage('settings')"
>
⚙️ Settings & Privacy

<div

 class="nav hidden"
 data-page="admin"
 onclick="openPage('admin')"
>
🛡️ Admin Panel

<!-- MAIN -->
<main id="main"></main>


<!-- RIGHT -->
<aside class="right">

<div class="card">

<b>People</b>

<div
 id="rightPeople"
 class="people"
>
</div>

</div>


<div class="card">

<b>My Social App</b>

<p class="muted">
Connect, share, chat and grow.
</p>

</div>

</aside>

</div>


<!-- MOBILE NAV -->
<nav class="bottom-nav">

<button onclick="openPage('home')">
🏠<br>Home
</button>

<button onclick="openPage('friends')">
👥<br>Friends
</button>

<button onclick="openPage('messenger')">
💬<br>Chat
</button>

🔔<br>Alerts
</button>

👤<br>Me
</button>

</nav>

</div>


<!-- MODAL -->
<div
 id="modal"
 class="modal hidden"
>

<div
 id="modalBox"
 class="modal-box"
>
</div>

</div>


<!-- TOAST -->
<div
 id="toast"
 style="
 position:fixed;
 bottom:75px;
 left:50%;
 transform:translateX(-50%);
 background:#222;
 color:white;
 padding:10px 16px;
 border-radius:20px;
 display:none;
 z-index:100
 "
>
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://skereuaizdczbvjplisi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_3R2otJA1zIlsMsTYxe1ocw_NAPY5O9x";

const supabaseClient =
supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

const STORAGE =
SUPABASE_URL+
"/storage/v1/object/public/media/";

let me=null;

let currentChatUser=null;

let chatChannel=null;

let typingTimer=null;

let settings=
JSON.parse(
 localStorage.getItem("mySocialSettings") ||
 '{"online":true,"notifications":true,"dark":false,"privacy":"public"}'
);

let blocked=
JSON.parse(
 localStorage.getItem("mySocialBlocked") ||
 "[]"
);


/* HELPERS */

const esc=s=>
String(s??"").replace(
 /[&<>"']/g,
 c=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 }[c])
);

const avatarFallback=n=>
"https://ui-avatars.com/api/?name="+
encodeURIComponent(n||"User")+
"&background=1877f2&color=fff";


function toast(t){

 let x=document.getElementById("toast");

 x.textContent=t;

 x.style.display="block";

 clearTimeout(window.__toast);

 window.__toast=
 setTimeout(
  ()=>x.style.display="none",
  2500
 );

}


function saveSettings(){

 localStorage.setItem(
  "mySocialSettings",
  JSON.stringify(settings)
 );

 document.body.classList.toggle(
  "dark",
  !!settings.dark
);

}


function saveBlocked(){

 localStorage.setItem(
  "mySocialBlocked",
  JSON.stringify(blocked)
);

}


function showLogin(){

 authLogin.classList.remove("hidden");

 authRegister.classList.add("hidden");

}


function showRegister(){

 authLogin.classList.add("hidden");

 authRegister.classList.remove("hidden");

}


/* AUTH */

async function login(){

 let email=
 loginEmail.value.trim();

 let password=
 loginPassword.value;

 if(!email||!password){

  toast("Email ও Password দিন");

  return;

 }

 let {error}=
 await supabaseClient.auth.signInWithPassword({
  email,
  password
 });

 if(error){

  authMsg.textContent=
  error.message;

  return;

 }

 await startApp();

}


async function register(){

 let name=
 regName.value.trim();

 let email=
 regEmail.value.trim();

 let password=
 regPassword.value;

 if(
  !name||
  !email||
  password.length<6
 ){

  toast(
   "নাম, email ও ৬+ অক্ষরের password দিন"
  );

  return;

 }

 let {data,error}=
 await supabaseClient.auth.signUp({
  email,
  password
 });

 if(error){

  authMsg.textContent=
  error.message;

  return;

 }

 if(data.user){

  await supabaseClient
  .from("profiles")
  .upsert({
   id:data.user.id,
   name:name,
   bio:"",
   role:"user",
   last_seen:
    new Date().toISOString()
  });

 }

 authMsg.textContent=
 "Account তৈরি হয়েছে। Email verification লাগলে email verify করুন।";

}


async function logout(){

 await supabaseClient.auth.signOut();

 location.reload();

}


/* PROFILE */

async function ensureProfile(){

 let {data}=
 await supabaseClient
 .from("profiles")
 .select("*")
 .eq("id",me.id)
 .maybeSingle();

 if(!data){

  await supabaseClient
  .from("profiles")
  .insert({
   id:me.id,
   name:
    me.email?.split("@")[0]||
    "User",
   role:"user",
   last_seen:
    new Date().toISOString()
  });

 }

}


async function loadProfile(){

 let {data}=
 await supabaseClient
 .from("profiles")
 .select("*")
 .eq("id",me.id)
 .maybeSingle();

 if(data){

  document.getElementById(
   "topAvatar"
  ).src=
   data.profile_photo||
   avatarFallback(data.name);

  window.myProfile=data;

 }

}


async function heartbeat(){

 if(
  !me||
  !settings.online
 )return;

 await supabaseClient
 .from("profiles")
 .update({
  last_seen:
   new Date().toISOString()
 })
 .eq("id",me.id);

}


setInterval(
 heartbeat,
 30000
);


/* START */

async function startApp(){

 document
  .getElementById("loginScreen")
  .classList.add("hidden");

 document
  .getElementById("app")
  .classList
  .remove("hidden");

 saveSettings();

 await ensureProfile();

 await loadProfile();

 await heartbeat();

 await loadPeople();

 await loadNotifications();

 await checkAdmin();

 openPage("home");

}


async function checkAdmin(){

 let {data}=
 await supabaseClient
 .from("profiles")
 .select("role")
 .eq("id",me.id)
 .maybeSingle();

 document
  .getElementById("adminNav")
  .classList
  .toggle(
   "hidden",
   data?.role!=="admin"
  );

}


/* PAGE NAVIGATION */

function openPage(page){

 document
 .querySelectorAll(".nav")
 .forEach(
  x=>
   x.classList.toggle(
    "active",
    x.dataset.page===page
   )
 );

 if(page==="home")
  renderHome();

 else if(page==="profile")
  renderProfile(me.id);

 else if(page==="friends")
  renderFriends();

 else if(page==="messenger")
  renderMessenger();

 else if(page==="notifications")
  renderNotifications();

 else if(page==="reels")
  renderReels();

 else if(page==="earnings")
  renderEarnings();

 else if(page==="settings")
  renderSettings();

 else if(page==="admin")
  renderAdmin();

 else if(page==="search")
  renderSearch(
   window.lastSearch||""
  );

}


/* PEOPLE */

function onlineText(t){

 if(
  t &&
  Date.now()-
  new Date(t).getTime()
  <120000
 )
 return "🟢 Online";

 return "⚪ Offline";

}


function personHTML(u){

 return `
 <div class="person">

 <img
  class="avatar"
  src="${esc(
   u.profile_photo||
   avatarFallback(u.name)
  )}"
 >

 <div class="grow">

 <b>
 ${esc(u.name||"User")}
 </b>

 <div class="muted">
 ${onlineText(u.last_seen)}
 </div>

 </div>

 <button
  class="smallbtn"
  onclick="openChat(
   '${u.id}',
   '${esc(u.name||"User")}'
  )"
 >
 💬
 </button>

 </div>
 `;

}


async function loadPeople(){

 let {data}=
 await supabaseClient
 .from("profiles")
 .select("*")
 .neq("id",me.id)
 .limit(12);

 let html=
 (data||[])
 .filter(
  u=>!blocked.includes(u.id)
 )
 .map(personHTML)
 .join("");

 rightPeople.innerHTML=
 html||
 '<p class="muted">No users yet</p>';

}


/* HOME */

async function renderHome(){

 main.innerHTML=`

 <div class="card composer">

 <img
  id="composerAvatar"
  class="avatar"
 >

 <button
  style="flex:1;text-align:left"
  onclick="openPostModal()"
 >
 What's on your mind?
 </button>

 <button
  onclick="openPostModal(true)"
 >
 📷
 </button>

 </div>


 <div class="card">

 <b>Stories</b>

 <button
  class="smallbtn"
  style="float:right"
  onclick="openStoryModal()"
 >
 ➕ Add Story
 </button>

 <div
  id="stories"
  class="story-row"
  style="margin-top:12px"
 >
 </div>

 </div>


 <div id="feed">
 <p class="muted">
 Loading...
 </p>
 </div>

 `;

 composerAvatar.src=
 window.myProfile?.profile_photo||
 avatarFallback(
  window.myProfile?.name
 );

 await loadStories();

 await loadFeed();

}


/* STORIES */

async function loadStories(){

 let {data}=
 await supabaseClient
 .from("stories")
 .select("*")
 .gt(
  "expires_at",
  new Date().toISOString()
 )
 .order(
  "created_at",
  {ascending:false}
 )
 .limit(30);

 let ids=
 [
  ...new Set(
   (data||[])
   .map(x=>x.user_id)
  )
 ];

 let {data:ps}=
 ids.length
 ?
 await supabaseClient
 .from("profiles")
 .select("*")
 .in("id",ids)
 :
 {data:[]};

 let pm=
 new Map(
  (ps||[])
  .map(x=>[x.id,x])
 );

 stories.innerHTML=
 (data||[])
 .map(s=>{

  let u=
   pm.get(s.user_id)||
   {};

  return `

  <div
   class="story"
   onclick="viewStory(
    ${s.id},
    '${esc(s.media_url)}'
   )"
  >

  <img
   src="${esc(s.media_url)}"
  >

  <span>
   ${esc(u.name||"User")}
  </span>

  </div>

  `;

 })
 .join("")||
 '<p class="muted">No stories</p>';

}


async function viewStory(id,url){

 await supabaseClient
 .from("story_views")
 .upsert(
  {
   story_id:id,
   viewer_id:me.id
  },
  {
   onConflict:
   "story_id,viewer_id"
  }
 );

 openModal(`

 <div class="modal-head">

 <h3>Story</h3>

 <button
  onclick="closeModal()"
 >
 ✕
 </button>

 </div>

 <img
  src="${esc(url)}"
  style="
   width:100%;
   max-height:70vh;
   object-fit:contain
  "
 >

 `);

}


function openStoryModal(){

 openModal(`

 <h3>Add Story</h3>

 <input
  id="storyFile"
  type="file"
  accept="image/*,video/*"
 >

 <input
  id="storyCaption"
  placeholder="Caption"
 >

 <button
  class="primary"
  style="
   padding:10px;
   border-radius:8px
  "
  onclick="createStory()"
 >
 Add Story
 </button>

 `);

}


async function createStory(){

 let f=
 storyFile.files[0];

 if(!f){

  toast("Media select করুন");

  return;

 }

 try{

  let url=
   await uploadFile(
    f,

async function uploadFile(
 file,
 folder
){

 let path=
 folder+
 "/"+
 me.id+
 "/"+
 Date.now()+
 "_"+
 Math.random()
 .toString(36)
 .slice(2)+
 "_"+
 file.name.replace(
  /[^\w.\-]/g,
  "_"
 );

 let {error}=
 await supabaseClient
 .storage
 .from("media")
 .upload(
  path,
  file,
  {upsert:false}
 );

 if(error)
  throw error;

 return STORAGE+path;

}

async function openChat(
 userId,
 name
){

 currentChatUser=
 userId;

 if(!document.getElementById("messages")){

  openPage("messenger");

  await new Promise(
   r=>setTimeout(r,100)
  );

 }

 chatTitle.innerHTML=
 `<b>${esc(name)}</b>
  <div
   class="muted"
   id="chatOnline"
  >
   Checking status...
  </div>`;

 await loadChatStatus();

 await loadMessages();

 subscribeChat();

 messageInput.focus();

}


async function loadChatStatus(){

 if(!currentChatUser)return;

 let {data}=
 await supabaseClient
 .from("profiles")
 .select("last_seen")
 .eq(
  "id",
  currentChatUser
 )
 .maybeSingle();

 if(
  document.getElementById("chatOnline")
 ){

  chatOnline.textContent=
   onlineText(data?.last_seen);

 }

}


async function loadMessages(){

 if(!currentChatUser)return;

 let {data,error}=
 await supabaseClient
 .from("messages")
 .select("*")
 .or(
  `and(sender_id.eq.${me.id},receiver_id.eq.${currentChatUser}),and(sender_id.eq.${currentChatUser},receiver_id.eq.${me.id})`
 )
 .order(
  "created_at",
  {ascending:true}
 );

 if(error){

  messages.innerHTML=
   esc(error.message);

  return;

 }

 messages.innerHTML=
 (data||[])
 .map(
  m=>
   `

   <div
    class="msg ${
     m.sender_id===me.id
     ?"mine"
     :""
    }"
   >

   ${esc(m.text||"")}

   ${
    m.sender_id===me.id
    ?
    `<span class="seen">
     ${
      m.seen
      ?"✓✓"
      :"✓"
     }
     </span>`
    :""
   }

   </div>

   `
 )
 .join("");

 messages.scrollTop=
  messages.scrollHeight;


 await supabaseClient
 .from("messages")
 .update({
  seen:true
 })
 .eq(
  "sender_id",
  currentChatUser
 )
 .eq(
  "receiver_id",
  me.id
 )
 .eq(
  "seen",
  false
 );

}


function messageKey(e){

 if(
  e.key==="Enter"
 )
 sendMessage();

}


async function sendMessage(){

 let text=
 messageInput.value.trim();

 if(
  !text||
  !currentChatUser
 )
 return;

 let {error}=
 await supabaseClient
 .from("messages")
 .insert({
  sender_id:me.id,
  receiver_id:currentChatUser,
  text:text,
  seen:false
 });

 if(error){

  toast(error.message);

 }else{

  messageInput.value="";

  await loadMessages();

 }

}


function chatKey(){

 return "chat:"+
 [
  me.id,
  currentChatUser
 ]
 .sort()
 .join(":");

}


function subscribeChat(){

 if(chatChannel){

  supabaseClient
   .removeChannel(
    chatChannel
   );

 }

 chatChannel=
 supabaseClient
 .channel(
  chatKey()
 );


 chatChannel
 .on(
  "broadcast",
  {
   event:"typing"
  },
  payload=>{

   if(
    payload.payload?.user!==me.id
   ){

    typing.textContent=
     payload.payload?.typing
     ?"Typing..."
     :"";

   }

  }
 )


 .on(
  "postgres_changes",
  {
   event:"INSERT",
   schema:"public",
   table:"messages"
  },
  payload=>{

   let m=
    payload.new;

   if(
    (
     m.sender_id===me.id &&
     m.receiver_id===currentChatUser
    )||
    (
     m.sender_id===currentChatUser &&
     m.receiver_id===me.id
    )
   ){

    loadMessages();

   }

  }
 )


 .on(
  "postgres_changes",
  {
   event:"UPDATE",
   schema:"public",
   table:"messages"
  },
  ()=>loadMessages()
 )


 .subscribe();

}


async function sendTyping(){

 if(
  !chatChannel||
  !currentChatUser
 )
 return;

 await chatChannel.send({
  type:"broadcast",
  event:"typing",
  payload:{
   user:me.id,
   typing:true
  }
 });

 clearTimeout(
  typingTimer
 );

 typingTimer=
 setTimeout(
  ()=>{

   chatChannel?.send({
    type:"broadcast",
    event:"typing",
    payload:{
     user:me.id,
     typing:false
    }
   });

  },
  1000
 );

}
