<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Social App</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  background:#f0f2f5;
  color:#111;
}

.header{
  background:#1877f2;
  color:white;
  padding:15px;
  font-size:24px;
  font-weight:bold;
  text-align:center;
}

.container{
  max-width:600px;
  margin:20px auto;
  padding:10px;
}

.card,.post{
  background:white;
  border-radius:12px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 2px 7px rgba(0,0,0,.1);
}

input,textarea{
  width:100%;
  border:1px solid #ddd;
  border-radius:8px;
  padding:12px;
  margin:7px 0;
  font-size:16px;
}

textarea{
  min-height:90px;
  resize:none;
}

button{
  border:0;
  border-radius:8px;
  padding:11px 18px;
  margin-top:8px;
  background:#1877f2;
  color:white;
  font-size:16px;
  cursor:pointer;
}

.secondary{
  background:#eee;
  color:#222;
}

.hidden{
  display:none;
}

.title{
  font-size:25px;
  font-weight:bold;
  margin-bottom:15px;
}

.post-name{
  font-weight:bold;
  font-size:18px;
  margin-bottom:8px;
}

.post-text{
  font-size:16px;
  line-height:1.5;
  white-space:pre-wrap;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.actions button{
  flex:1;
  background:#eee;
  color:#222;
}

.logout{
  float:right;
  font-size:14px;
  padding:8px 12px;
  margin-top:-5px;
}
</style>
</head>

<body>

<div class="header">
  My Social App
  <button class="logout hidden" id="logoutBtn" onclick="logout()">Logout</button>
</div>

<div class="container">

<!-- LOGIN -->
<div id="loginPage" class="card">
  <div class="title">Login</div>

  <input id="loginEmail" type="email" placeholder="Email">
  <input id="loginPassword" type="password" placeholder="Password">

  <button onclick="login()">Login</button>
  <button class="secondary" onclick="showRegister()">Create new account</button>

  <p id="loginMessage"></p>
</div>


<!-- REGISTER -->
<div id="registerPage" class="card hidden">
  <div class="title">Create Account</div>

  <input id="regName" type="text" placeholder="আপনার নাম">
  <input id="regEmail" type="email" placeholder="Email">
  <input id="regPassword" type="password" placeholder="Password">

  <button onclick="register()">Register</button>
  <button class="secondary" onclick="showLogin()">Already have an account?</button>

  <p id="registerMessage"></p>
</div>


<!-- HOME -->
<div id="homePage" class="hidden">

  <div class="card">
    <div class="title">Home Feed</div>

    <textarea id="postText"
      placeholder="আপনি কী ভাবছেন?"></textarea>

    <button onclick="createPost()">Post</button>
  </div>

  <div id="feed"></div>

</div>

</div>


<script>

let currentUser = null;

let users = JSON.parse(localStorage.getItem("users") || "[]");

let posts = JSON.parse(localStorage.getItem("posts") || "[]");


function saveData(){
  localStorage.setItem("users",JSON.stringify(users));
  localStorage.setItem("posts",JSON.stringify(posts));
}


function showRegister(){
  document.getElementById("loginPage").classList.add("hidden");
  document.getElementById("registerPage").classList.remove("hidden");
}


function showLogin(){
  document.getElementById("registerPage").classList.add("hidden");
  document.getElementById("loginPage").classList.remove("hidden");
}


function register(){

  const name=document.getElementById("regName").value.trim();
  const email=document.getElementById("regEmail").value.trim();
  const password=document.getElementById("regPassword").value;

  if(!name || !email || !password){
    document.getElementById("registerMessage").innerText="সব তথ্য পূরণ করুন।";
    return;
  }

  if(users.some(u=>u.email===email)){
    document.getElementById("registerMessage").innerText="এই Email দিয়ে আগে অ্যাকাউন্ট আছে।";
    return;
  }

  users.push({
    name:name,
    email:email,
    password:password
  });

  saveData();

  document.getElementById("registerMessage").innerText="Account তৈরি হয়েছে! এখন Login করুন।";

  setTimeout(showLogin,800);
}


function login(){

  const email=document.getElementById("loginEmail").value.trim();
  const password=document.getElementById("loginPassword").value;

  const user=users.find(
    u=>u.email===email && u.password===password
  );

  if(!user){
    document.getElementById("loginMessage").innerText="Email অথবা Password ভুল।";
    return;
  }

  currentUser=user;

  document.getElementById("loginPage").classList.add("hidden");
  document.getElementById("registerPage").classList.add("hidden");
  document.getElementById("homePage").classList.remove("hidden");

  document.getElementById("logoutBtn").classList.remove("hidden");

  loadPosts();
}


function logout(){

  currentUser=null;

  document.getElementById("homePage").classList.add("hidden");
  document.getElementById("logoutBtn").classList.add("hidden");
  document.getElementById("loginPage").classList.remove("hidden");
}


function createPost(){

  const text=document.getElementById("postText").value.trim();

  if(!text){
    alert("আগে কিছু লিখুন!");
    return;
  }

  posts.unshift({
    id:Date.now(),
    name:currentUser.name,
    text:text,
    likes:0
  });

  saveData();

  document.getElementById("postText").value="";

  loadPosts();
}


function likePost(id){

  const post=posts.find(p=>p.id===id);

  if(post){
    post.likes++;
    saveData();
    loadPosts();
  }
}


function loadPosts(){

  const feed=document.getElementById("feed");

  feed.innerHTML="";

  posts.forEach(post=>{

    const div=document.createElement("div");

    div.className="post";

    div.innerHTML=`
      <div class="post-name">${escapeHTML(post.name)}</div>

      <div class="post-text">${escapeHTML(post.text)}</div>

      <div class="actions">

        <button onclick="likePost(${post.id})">
          ❤️ Like ${post.likes}
        </button>

        <button onclick="alert('Comment feature আমরা পরের ধাপে যোগ করব')">
          💬 Comment
        </button>

        <button onclick="alert('Share feature আমরা পরের ধাপে যোগ করব')">
          ↗ Share
        </button>

      </div>
    `;

    feed.appendChild(div);
  });
}


function escapeHTML(text){

  const div=document.createElement("div");

  div.textContent=text;

  return div.innerHTML;
}

</script>

</body>
</html>
