<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1877f2">
<title>FriendBook Premium</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
:root{
 --blue:#1877f2;
 --blue2:#0866ff;
 --bg:#f0f2f5;
 --card:#fff;
 --text:#111827;
 --muted:#65676b;
 --border:#e4e6eb;
 --shadow:0 4px 18px rgba(0,0,0,.08);
}
body.dark{
 --bg:#0f1115;
 --card:#181b21;
 --text:#f5f6f7;
 --muted:#a9adb5;
 --border:#30343b;
}
body{
 margin:0;
 background:var(--bg);
 color:var(--text);
 font-family:Arial,Helvetica,sans-serif;
}
button,input,textarea{
 font:inherit;
}
button{
 border:0;
 cursor:pointer;
}
.hidden{display:none!important}

/* AUTH */
.auth{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
 background:linear-gradient(135deg,#1877f2,#6b5cff);
}
.auth-box{
 width:100%;
 max-width:430px;
 background:var(--card);
 border-radius:25px;
 padding:28px;
 box-shadow:0 20px 60px rgba(0,0,0,.25);
}
.logo{
 font-size:36px;
 font-weight:900;
 color:var(--blue);
 text-align:center;
 margin-bottom:8px;
}
.tagline{
 text-align:center;
 color:var(--muted);
 margin-bottom:25px;
}
.auth input{
 width:100%;
 padding:15px;
 border:1px solid var(--border);
 border-radius:13px;
 margin:7px 0;
 outline:none;
 background:var(--bg);
 color:var(--text);
}
.primary{
 width:100%;
 padding:14px;
 border-radius:13px;
 background:linear-gradient(135deg,#1877f2,#0866ff);
 color:#fff;
 font-weight:800;
 margin-top:10px;
}
.secondary{
 width:100%;
 padding:13px;
 border-radius:13px;
 background:#e7f3ff;
 color:#1877f2;
 font-weight:800;
 margin-top:10px;
}
.auth-msg{
 text-align:center;
 margin-top:12px;
 color:#e53935;
}

/* APP */
.topbar{
 position:sticky;
 top:0;
 z-index:100;
 height:62px;
 background:var(--card);
 border-bottom:1px solid var(--border);
 display:flex;
 align-items:center;
 padding:0 14px;
 gap:12px;
}
.top-logo{
 font-size:25px;
 font-weight:900;
 color:var(--blue);
}
.search{
 flex:1;
 max-width:520px;
}
.search input{
 width:100%;
 border:0;
 outline:none;
 background:var(--bg);
 color:var(--text);
 border-radius:25px;
 padding:11px 16px;
}
.top-actions{
 margin-left:auto;
 display:flex;
 gap:7px;
}
.icon-btn{
 width:40px;
 height:40px;
 border-radius:50%;
 background:var(--bg);
 color:var(--text);
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:19px;
}
.icon-btn:hover{
 background:#dfe3e8;
}

.main{
 max-width:1200px;
 margin:auto;
 padding:15px 12px 90px;
}
.page{display:none}
.page.active{display:block}

/* STORY */
.story-row{
 display:flex;
 gap:10px;
 overflow-x:auto;
 padding-bottom:12px;
}
.story-row::-webkit-scrollbar{display:none}
.story{
 min-width:115px;
 height:190px;
 border-radius:16px;
 overflow:hidden;
 position:relative;
 background:linear-gradient(135deg,#1877f2,#8b5cf6);
 color:white;
 box-shadow:var(--shadow);
}
.story img{
 width:100%;
 height:100%;
 object-fit:cover;
}
.story-overlay{
 position:absolute;
 inset:0;
 background:linear-gradient(transparent 45%,rgba(0,0,0,.8));
}
.story-name{
 position:absolute;
 bottom:10px;
 left:10px;
 right:5px;
 font-weight:800;
}
.story-add{
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 font-size:30px;
}
.story-add small{
 font-size:14px;
 margin-top:8px;
}

/* CARD */
.card{
 background:var(--card);
 border-radius:16px;
 box-shadow:var(--shadow);
 margin:12px 0;
 border:1px solid var(--border);
 overflow:hidden;
}
.card-body{padding:15px}
.profile-line{
 display:flex;
 align-items:center;
 gap:10px;
}
.avatar{
 width:45px;
 height:45px;
 border-radius:50%;
 object-fit:cover;
 background:#ddd;
}
.avatar.big{
 width:90px;
 height:90px;
 border:4px solid var(--card);
}
.name{
 font-weight:800;
}
.time{
 color:var(--muted);
 font-size:12px;
 margin-top:3px;
}
.post-text{
 font-size:16px;
 line-height:1.55;
 white-space:pre-wrap;
 margin:15px 0;
}
.post-image{
 width:100%;
 max-height:650px;
 object-fit:cover;
 display:block;
}
.post-stats{
 padding:10px 15px;
 color:var(--muted);
 font-size:14px;
 display:flex;
 justify-content:space-between;
}
.post-actions{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 border-top:1px solid var(--border);
}
.post-actions button{
 background:transparent;
 color:var(--muted);
 padding:12px 4px;
 font-weight:700;
}
.post-actions button:hover{
 background:var(--bg);
}

/* CREATE */
.create{
 padding:15px;
}
.create-top{
 display:flex;
 gap:10px;
 align-items:center;
}
.fake-input{
 flex:1;
 padding:12px 16px;
 border-radius:25px;
 background:var(--bg);
 color:var(--muted);
 cursor:pointer;
}
.create-options{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 margin-top:12px;
 border-top:1px solid var(--border);
 padding-top:10px;
}
.create-options button{
 background:transparent;
 color:var(--muted);
 padding:10px 3px;
}

/* PROFILE */
.cover{
 height:280px;
 background:linear-gradient(135deg,#1877f2,#8b5cf6);
 position:relative;
}
.cover img{
 width:100%;
 height:100%;
 object-fit:cover;
}
.profile-info{
 padding:0 20px 20px;
 margin-top:-45px;
 position:relative;
}
.profile-main{
 display:flex;
 align-items:flex-end;
 gap:15px;
}
.profile-details h2{
 margin:0;
}
.profile-details p{
 margin:5px 0;
 color:var(--muted);
}
.profile-buttons{
 display:flex;
 gap:8px;
 margin-top:15px;
}
.profile-buttons button{
 padding:11px 16px;
 border-radius:10px;
 font-weight:800;
 background:var(--bg);
 color:var(--text);
}
.profile-buttons .blue{
 background:var(--blue);
 color:#fff;
}

/* REELS */
.reels-container{
 max-width:500px;
 margin:auto;
}
.reel{
 height:calc(100vh - 130px);
 min-height:520px;
 background:#000;
 border-radius:18px;
 margin-bottom:15px;
 position:relative;
 overflow:hidden;
}
.reel video{
 width:100%;
 height:100%;
 object-fit:cover;
}
.reel-gradient{
 position:absolute;
 inset:0;
 background:linear-gradient(transparent 45%,rgba(0,0,0,.85));
 pointer-events:none;
}
.reel-info{
 position:absolute;
 left:15px;
 right:65px;
 bottom:18px;
 color:#fff;
 z-index:2;
}
.reel-user{
 font-weight:900;
 margin-bottom:8px;
}
.reel-caption{
 line-height:1.4;
}
.reel-actions{
 position:absolute;
 right:10px;
 bottom:25px;
 display:flex;
 flex-direction:column;
 gap:12px;
 z-index:3;
}
.reel-action{
 width:48px;
 height:48px;
 border-radius:50%;
 background:rgba(255,255,255,.16);
 backdrop-filter:blur(10px);
 color:#fff;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:21px;
}
.sound{
 position:absolute;
 right:12px;
 top:12px;
 z-index:4;
 background:rgba(0,0,0,.55);
 color:#fff;
 border-radius:50%;
 width:42px;
 height:42px;
}

/* DASHBOARD */
.stats{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px;
}
.stat{
 background:var(--card);
 border:1px solid var(--border);
 border-radius:15px;
 padding:18px;
}
.stat b{
 font-size:25px;
 display:block;
 margin-top:5px;
}

/* MENU */
.menu-grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px;
}
.menu-item{
 padding:18px 10px;
 border-radius:15px;
 background:var(--card);
 border:1px solid var(--border);
 text-align:center;
 font-weight:800;
}
.menu-icon{
 font-size:28px;
 display:block;
 margin-bottom:8px;
}

/* MODAL */
.modal{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.65);
 z-index:500;
 display:none;
 align-items:flex-end;
 justify-content:center;
}
.modal.show{display:flex}
.modal-box{
 width:100%;
 max-width:650px;
 max-height:90vh;
 overflow:auto;
 background:var(--card);
 color:var(--text);
 border-radius:22px 22px 0 0;
 padding:20px;
}
.modal-head{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:15px;
}
.close{
 width:38px;
 height:38px;
 border-radius:50%;
 background:var(--bg);
 color:var(--text);
}

/* COMMENTS */
.comment{
 display:flex;
 gap:9px;
 margin:12px 0;
}
.comment-body{
 background:var(--bg);
 padding:9px 12px;
 border-radius:14px;
 flex:1;
}
.comment-form{
 display:flex;
 gap:8px;
 margin-top:15px;
}
.comment-form input{
 flex:1;
 padding:12px;
 border-radius:22px;
 border:1px solid var(--border);
 background:var(--bg);
 color:var(--text);
}
.comment-form button{
 padding:0 18px;
 border-radius:22px;
 background:var(--blue);
 color:#fff;
}

/* BOTTOM */
.bottom{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 height:65px;
 background:var(--card);
 border-top:1px solid var(--border);
 z-index:200;
 display:grid;
 grid-template-columns:repeat(5,1fr);
}
.bottom button{
 background:transparent;
 color:var(--muted);
 font-size:21px;
}
.bottom button span{
 display:block;
 font-size:10px;
 margin-top:2px;
}
.bottom button.active{
 color:var(--blue);
}

/* TOAST */
.toast{
 position:fixed;
 left:50%;
 bottom:85px;
 transform:translateX(-50%) translateY(20px);
 background:#111;
 color:#fff;
 padding:12px 18px;
 border-radius:25px;
 z-index:1000;
 opacity:0;
 pointer-events:none;
 transition:.3s;
}
.toast.show{
 opacity:1;
 transform:translateX(-50%) translateY(0);
}

/* RESPONSIVE */
@media(min-width:800px){
 .bottom{
  left:50%;
  right:auto;
  transform:translateX(-50%);
  width:600px;
  border:1px solid var(--border);
  border-radius:20px 20px 0 0;
 }
 .modal{
  align-items:center;
 }
 .modal-box{
  border-radius:22px;
 }
}
</style>
</head>

<body>

<!-- AUTH -->
<section id="authPage" class="auth">
 <div class="auth-box">
  <div class="logo">FriendBook</div>
  <div class="tagline">Connect • Share • Create</div>

  <div id="loginBox">
   <input id="loginEmail" type="email" placeholder="Email">
   <input id="loginPassword" type="password" placeholder="Password">
   <button class="primary" onclick="login()">Login</button>
   <button class="secondary" onclick="showSignup()">Create new account</button>
  </div>

  <div id="signupBox" class="hidden">
   <input id="signupName" placeholder="Full Name">
   <input id="signupEmail" type="email" placeholder="Email">
   <input id="signupPassword" type="password" placeholder="Password">
   <button class="primary" onclick="signup()">Create Account</button>
   <button class="secondary" onclick="showLogin()">Already have an account</button>
  </div>

  <div id="authMsg" class="auth-msg"></div>
 </div>
</section>

<!-- APP -->
<div id="app" class="hidden">

<header class="topbar">
 <div class="top-logo">FriendBook</div>

 <div class="search">
  <input id="searchInput" placeholder="Search FriendBook..." onkeydown="if(event.key==='Enter')searchApp()">
 </div>

 <div class="top-actions">
  <button class="icon-btn" onclick="openNotifications()">🔔</button>
  <button class="icon-btn" onclick="openMessages()">💬</button>
  <button class="icon-btn" onclick="openMenu()">☰</button>
 </div>
</header>

<main class="main">

<!-- HOME -->
<section id="homePage" class="page active">

 <div class="story-row">
  <div class="story story-add" onclick="openStoryModal()">
   ➕
   <small>Create Story</small>
  </div>
  <div id="stories"></div>
 </div>

 <div class="card create">
  <div class="create-top">
   <img id="createAvatar" class="avatar" src="">
   <div class="fake-input" onclick="openPostModal()">What's on your mind?</div>
  </div>

  <div class="create-options">
   <button onclick="openPostModal()">🎥 Live</button>
   <button onclick="openPostModal()">🖼️ Photo</button>
   <button onclick="openPostModal()">😊 Feeling</button>
  </div>
 </div>

 <div id="feed"></div>
</section>

<!-- REELS -->
<section id="reelsPage" class="page">
 <h2>🎬 Reels</h2>
 <div id="reels" class="reels-container"></div>
</section>

<!-- PROFILE -->
<section id="profilePage" class="page">
 <div class="card">
  <div class="cover">
   <img id="profileCover" src="">
  </div>

  <div class="profile-info">
   <div class="profile-main">
    <img id="profileAvatar" class="avatar big" src="">
    <div class="profile-details">
     <h2 id="profileName">User</h2>
     <p id="profileBio">Welcome to FriendBook</p>
    </div>
   </div>

   <div class="profile-buttons">
    <button class="blue" onclick="openPostModal()">＋ Post</button>
    <button onclick="editProfile()">✏️ Edit Profile</button>
   </div>
  </div>
 </div>

 <div id="profilePosts"></div>
</section>

<!-- MENU -->
<section id="menuPage" class="page">
 <h2>Menu</h2>

 <div class="menu-grid">
  <div class="menu-item" onclick="openMessages()">
   <span class="menu-icon">💬</span>Messenger
  </div>

  <div class="menu-item" onclick="openFriends()">
   <span class="menu-icon">👥</span>Friends
  </div>

  <div class="menu-item" onclick="openGroups()">
   <span class="menu-icon">👨‍👩‍👧</span>Groups
  </div>

  <div class="menu-item" onclick="openPages()">
   <span class="menu-icon">📄</span>Pages
  </div>

  <div class="menu-item" onclick="openMarketplace()">
   <span class="menu-icon">🛒</span>Marketplace
  </div>

  <div class="menu-item" onclick="openEvents()">
   <span class="menu-icon">📅</span>Events
  </div>

  <div class="menu-item" onclick="openCreator()">
   <span class="menu-icon">💰</span>Creator
  </div>

  <div class="menu-item" onclick="openSettings()">
   <span class="menu-icon">⚙️</span>Settings
  </div>
 </div>
</section>

</main>

<nav class="bottom">
 <button id="navHome" class="active" onclick="go('homePage',this)">🏠<span>Home</span></button>
 <button id="navReels" onclick="go('reelsPage',this)">🎬<span>Reels</span></button>
 <button onclick="openPostModal()">➕<span>Post</span></button>
 <button onclick="go('profilePage',this)">👤<span>Profile</span></button>
 <button onclick="go('menuPage',this)">☰<span>Menu</span></button>
</nav>

</div>

<!-- POST MODAL -->
<div id="postModal" class="modal">
 <div class="modal-box">
  <div class="modal-head">
   <h2>Create Post</h2>
   <button class="close" onclick="closeModal('postModal')">✕</button>
  </div>

  <textarea id="postText" rows="5"
   placeholder="What's on your mind?"
   style="width:100%;padding:14px;border:1px solid var(--border);border-radius:14px;background:var(--bg);color:var(--text);resize:none"></textarea>

  <input id="postImage" type="file" accept="image/*"
   style="width:100%;margin-top:12px">

  <button class="primary" onclick="createPost()">Publish Post</button>
 </div>
</div>

<!-- STORY MODAL -->
<div id="storyModal" class="modal">
 <div class="modal-box">
  <div class="modal-head">
   <h2>Create Story</h2>
   <button class="close" onclick="closeModal('storyModal')">✕</button>
  </div>

  <input id="storyImage" type="file" accept="image/*"
   style="width:100%;margin:10px 0">

  <button class="primary" onclick="createStory()">Publish Story</button>
 </div>
</div>

<!-- COMMENT MODAL -->
<div id="commentModal" class="modal">
 <div class="modal-box">
  <div class="modal-head">
   <h2>Comments</h2>
   <button class="close" onclick="closeModal('commentModal')">✕</button>
  </div>

  <div id="comments"></div>

  <div class="comment-form">
   <input id="commentInput" placeholder="Write a comment...">
   <button onclick="addComment()">Send</button>
  </div>
 </div>
</div>

<!-- GENERAL MODAL -->
<div id="generalModal" class="modal">
 <div class="modal-box">
  <div class="modal-head">
   <h2 id="generalTitle">FriendBook</h2>
   <button class="close" onclick="closeModal('generalModal')">✕</button>
  </div>

  <div id="generalContent"></div>
 </div>
</div>

<div id="toast" class="toast"></div>

<script>

/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
"https://skereuaizdczbvjplisi.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_3R2otJA1zIlsMsTYxe1ocw_NAPY5O9x";

const supabase =
window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_ANON_KEY
);


/* =====================================================
   GLOBAL
===================================================== */

let currentUser = null;
let currentProfile = null;
let selectedPostId = null;


/* =====================================================
   HELPERS
===================================================== */

function $(id){
 return document.getElementById(id);
}

function toast(message){
 const t=$("toast");
 t.textContent=message;
 t.classList.add("show");

 setTimeout(()=>{
  t.classList.remove("show");
 },2500);
}

function escapeHTML(str){
 if(!str)return "";
 return String(str)
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
}

function avatar(url,name="User"){
 return url ||
 `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=1877f2&color=fff`;
}

function closeModal(id){
 $(id).classList.remove("show");
}


/* =====================================================
   AUTH UI
===================================================== */

function showSignup(){
 $("loginBox").classList.add("hidden");
 $("signupBox").classList.remove("hidden");
 $("authMsg").textContent="";
}

function showLogin(){
 $("signupBox").classList.add("hidden");
 $("loginBox").classList.remove("hidden");
 $("authMsg").textContent="";
}


/* =====================================================
   SIGNUP
===================================================== */

async function signup(){

 const name=$("signupName").value.trim();
 const email=$("signupEmail").value.trim();
 const password=$("signupPassword").value;

 if(!name || !email || !password){
  $("authMsg").textContent="সব তথ্য পূরণ করুন";
  return;
 }

 $("authMsg").textContent="Account তৈরি হচ্ছে...";

 const {data,error}=await supabase.auth.signUp({
  email,
  password,
  options:{
   data:{
    full_name:name
   }
  }
 });

 if(error){
  $("authMsg").textContent=error.message;
  return;
 }

 if(data.user){

  await supabase
   .from("profiles")
   .upsert({
    id:data.user.id,
    full_name:name
   });

  $("authMsg").style.color="green";
  $("authMsg").textContent=
   "Account তৈরি হয়েছে। Email verification প্রয়োজন হলে email verify করুন।";
 }

}


/* =====================================================
   LOGIN
===================================================== */

async function login(){

 const email=$("loginEmail").value.trim();
 const password=$("loginPassword").value;

 if(!email || !password){
  $("authMsg").textContent="Email এবং Password দিন";
  return;
 }

 $("authMsg").textContent="Login হচ্ছে...";

 const {data,error}=await supabase.auth.signInWithPassword({
  email,
  password
 });

 if(error){
  $("authMsg").textContent=error.message;
  return;
 }

 currentUser=data.user;

 await startApp();
}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

 await supabase.auth.signOut();

 currentUser=null;
 currentProfile=null;

 $("app").classList.add("hidden");
 $("authPage").classList.remove("hidden");

 toast("Logged out");
}


/* =====================================================
   START APP
===================================================== */

async function startApp(){

 $("authPage").classList.add("hidden");
 $("app").classList.remove("hidden");

 await loadProfile();
 await loadFeed();
 await loadStories();
 await loadReels();
 await loadProfilePosts();

 $("createAvatar").src=
 avatar(
  currentProfile?.avatar_url,
  currentProfile?.full_name || "User"
 );

}


/* =====================================================
   LOAD PROFILE
===================================================== */

async function loadProfile(){

 if(!currentUser)return;

 let {data,error}=await supabase
  .from("profiles")
  .select("*")
  .eq("id",currentUser.id)
  .maybeSingle();

 if(error){
  console.error(error);
 }

 if(!data){

  const name=
   currentUser.user_metadata?.full_name ||
   currentUser.email?.split("@")[0] ||
   "User";

  const result=await supabase
   .from("profiles")
   .insert({
    id:currentUser.id,
    full_name:name
   })
   .select()
   .single();

  data=result.data;
 }

 currentProfile=data;

 const name=data?.full_name || "User";
 const bio=data?.bio || "Welcome to FriendBook";

/* =====================================================
   RENDER POST
===================================================== */

function renderPost(post){

 const profile=post.profiles || {};

 const name=
  profile.full_name ||
  "FriendBook User";

 const av=
  avatar(profile.avatar_url,name);

 const image=post.image_url
  ? `<img class="post-image"
          src="${escapeHTML(post.image_url)}"
          loading="lazy">`
  : "";

 const text=post.content
  ? `<div class="post-text">${escapeHTML(post.content)}</div>`
  : "";

 return `
 <article class="card" id="post-${post.id}">

  <div class="card-body">

   <div class="profile-line">

    <img class="avatar"
         src="${escapeHTML(av)}">

    <div>
     <div class="name">${escapeHTML(name)}</div>
     <div class="time">
      ${formatDate(post.created_at)}
     </div>
    </div>

   </div>

   ${text}

  </div>

  ${image}

  <div class="post-stats">
   <span id="reaction-count-${post.id}">
    👍 0
   </span>

   <span>
    💬 <span id="comment-count-${post.id}">0</span>
   </span>
  </div>

  <div class="post-actions">

   <button onclick="reactPost(${post.id},'like')">
    👍 Like
   </button>

   <button onclick="openComments(${post.id})">
    💬 Comment
   </button>

   <button onclick="sharePost(${post.id})">
    ↗ Share
   </button>

  </div>

 </article>
 `;
}


/* =====================================================
   DATE
===================================================== */

function formatDate(date){

 if(!date)return "";

 const d=new Date(date);

 return d.toLocaleString(
  "en-BD",
  {
   dateStyle:"medium",
   timeStyle:"short"
  }
 );
}

function openPostModal(){

async function createPost(){

 if(!currentUser){
  toast("Login করুন");
  return;
 }

 const content=$("postText").value.trim();
 const file=$("postImage").files[0];

 if(!content && !file){
  toast("Post-এ কিছু লিখুন অথবা ছবি দিন");
  return;
 }

 let imageUrl=null;

 if(file){

  const ext=
   file.name.split(".").pop();

  const path=
   `${currentUser.id}/${Date.now()}.${ext}`;

  const {error:uploadError}=await supabase
   .storage
   .from("posts")
   .upload(path,file,{
    upsert:false
   });

  if(uploadError){
   toast("ছবি upload হয়নি: "+uploadError.message);
   return;
  }

  const {data:urlData}=
   supabase.storage
   .from("posts")
   .getPublicUrl(path);

  imageUrl=urlData.publicUrl;
 }

 const {error}=await supabase
  .from("posts")
  .insert({
   user_id:currentUser.id,
   content:content || null,
   image_url:imageUrl
  });

 if(error){
  toast(error.message);
  return;
 }

 closeModal("postModal");

 toast("Post published 🎉");

 await loadFeed();
 await loadProfilePosts();
}


/* =====================================================
   REACTION
===================================================== */

async function reactPost(postId,reaction){

 if(!currentUser)return;

 const {data:existing}=await supabase
  .from("reactions")
  .select("*")
  .eq("post_id",postId)
  .eq("user_id",currentUser.id)
  .maybeSingle();

 if(existing){

  if(existing.reaction===reaction){

   await supabase
    .from("reactions")
    .delete()
    .eq("id",existing.id);

  }else{

   await supabase
    .from("reactions")
    .update({reaction})
    .eq("id",existing.id);

  }

 }else{

  await supabase
   .from("reactions")
   .insert({
    post_id:postId,
    user_id:currentUser.id,
    reaction
   });

 }

 await updateReactionCount(postId);
}


async function updateReactionCount(postId){

 const {count}=await supabase
  .from("reactions")
  .select("*",{count:"exact",head:true})
  .eq("post_id",postId);

 const el=$(`reaction-count-${postId}`);

 if(el){
  el.textContent=`👍 ${count || 0}`;
 }
}

 `;
}


/* =====================================================
   REEL SOUND
===================================================== */

function toggleSound(id,event){

 if(event){
  event.stopPropagation();
 }

 const video=$(`video-${id}`);

 if(!video)return;

 video.muted=!video.muted;

 const button=
  document.querySelector(
   `.reel[data-reel="${id}"] .sound`
  );

 if(button){
  button.textContent=
   video.muted ? "🔇" : "🔊";
 }

 if(video.paused){
  video.play().catch(()=>{});
 }
}


function toggleReelPlay(id){

 const video=$(`video-${id}`);

 if(!video)return;

 if(video.paused){
  video.play().catch(()=>{});
 }else{
  video.pause();
 }
}


/* =====================================================
   REEL VIEW
===================================================== */

function observeReels(){

 const videos=
  document.querySelectorAll(".reel video");

 const observer=
  new IntersectionObserver(
   entries=>{

    entries.forEach(entry=>{

     const video=entry.target;
     const reel=
      video.closest(".reel");

     if(entry.isIntersecting){

      video.play().catch(()=>{});

      if(reel){
       const id=reel.dataset.reel;
       incrementReelView(id);
      }

     }else{

      video.pause();

     }

    });

   },
   {threshold:.7}
  );

 videos.forEach(v=>observer.observe(v));
}


const viewedReels=new Set();

async function incrementReelView(id){

 if(viewedReels.has(id))return;

 viewedReels.add(id);

 try{

  await supabase.rpc(
   "increment_reel_views",
   {reel_id:id}
  );

 }catch(e){

  console.log("view RPC not available",e);

 }

}

);
