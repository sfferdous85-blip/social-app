<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Social App</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      color: #222;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 15px;
    }

    header {
      background: #1877f2;
      color: white;
      padding: 12px 15px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    .header-user {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .avatar-small {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      background: #ddd;
    }

    .auth-box {
      max-width: 420px;
      margin: 60px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 2px 15px rgba(0,0,0,.1);
    }

    .auth-box h1 {
      text-align: center;
      color: #1877f2;
    }

    .input {
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
    }

    .input:focus {
      border-color: #1877f2;
    }

    textarea.input {
      resize: vertical;
      min-height: 80px;
    }

    .btn {
      border: 0;
      border-radius: 8px;
      padding: 10px 15px;
      background: #1877f2;
      color: white;
      font-weight: bold;
    }

    .btn:hover {
      opacity: .9;
    }

    .btn-secondary {
      background: #e4e6eb;
      color: #222;
    }

    .btn-danger {
      background: #e53935;
    }

    .btn-success {
      background: #2e7d32;
    }

    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 15px;
    }

    .nav button {
      border: 0;
      padding: 10px 14px;
      border-radius: 8px;
      background: white;
      font-weight: bold;
    }

    .nav button.active {
      background: #1877f2;
      color: white;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 1px 5px rgba(0,0,0,.08);
    }

    .profile-cover {
      width: 100%;
      height: 260px;
      object-fit: cover;
      border-radius: 12px 12px 0 0;
      background: #ddd;
    }

    .profile-header {
      position: relative;
      background: white;
      padding: 0 20px 20px;
      border-radius: 0 0 12px 12px;
    }

    .profile-photo {
      width: 130px;
      height: 130px;
      object-fit: cover;
      border-radius: 50%;
      border: 5px solid white;
      margin-top: -65px;
      background: #ddd;
    }

    .profile-name {
      font-size: 25px;
      font-weight: bold;
      margin: 8px 0;
    }

    .post-head {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .post-user {
      font-weight: bold;
    }

    .post-date {
      font-size: 12px;
      color: #777;
    }

    .post-text {
      font-size: 17px;
      margin: 15px 0;
      white-space: pre-wrap;
    }

    .post-image {
      width: 100%;
      max-height: 600px;
      object-fit: contain;
      border-radius: 8px;
      background: #eee;
    }

    .post-actions {
      display: flex;
      gap: 5px;
      margin-top: 10px;
      border-top: 1px solid #eee;
      padding-top: 10px;
    }

    .post-actions button {
      flex: 1;
      border: 0;
      background: transparent;
      padding: 9px;
      border-radius: 7px;
    }

    .post-actions button:hover {
      background: #f0f2f5;
    }

    .comment-box {
      display: flex;
      gap: 5px;
      margin-top: 10px;
    }

    .comment-box input {
      flex: 1;
    }

    .comment {
      background: #f0f2f5;
      padding: 8px 10px;
      border-radius: 10px;
      margin-top: 6px;
    }

    .comment strong {
      display: block;
      font-size: 14px;
    }

    .user-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-row {
      display: flex;
      gap: 8px;
    }

    .search-row input {
      flex: 1;
    }

    .reel-video {
      width: 100%;
      max-height: 650px;
      border-radius: 10px;
      background: #000;
    }

    .notification {
      padding: 12px;
      border-bottom: 1px solid #eee;
    }

    .notification.unread {
      background: #e8f1ff;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #777;
    }

    .loading {
      text-align: center;
      padding: 25px;
    }

    .file-label {
      display: inline-block;
      padding: 10px 14px;
      background: #e4e6eb;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 5px;
    }

    .preview {
      max-width: 100%;
      max-height: 250px;
      border-radius: 8px;
      margin-top: 10px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    @media (max-width: 650px) {
      .container {
        padding: 8px;
      }

      .profile-cover {
        height: 180px;
      }

      .profile-photo {
        width: 100px;
        height: 100px;
        margin-top: -50px;
      }

      .profile-name {
        font-size: 21px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .nav {
        overflow-x: auto;
        flex-wrap: nowrap;
      }

      .nav button {
        white-space: nowrap;
      }
    }
  </style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header id="mainHeader" class="hidden">
  <div class="header-inner">

    <div class="logo">
      My Social App
    </div>

    <div class="header-user">
      <img
        id="headerAvatar"
        class="avatar-small"
        src=""
        alt="profile"
      >

      <button

</header>


<!-- =========================
     AUTH
========================= -->

<div id="authSection">

  <div class="auth-box">

    <h1>My Social App</h1>

    <div id="loginBox">

      <h2>Login</h2>

      <input
        id="loginEmail"
        class="input"

      >

      <input
        id="loginPassword"

        <button
          class="btn btn-secondary"

        >
          Create new account

      </p>

    </div>


    <div id="registerBox" class="hidden">

      <h2>Create new account</h2>

      <input
        id="registerName"
        class="input"
        type="text"
        placeholder="আপনার নাম"
      >

      <input
        id="registerEmail"
        class="input"
        type="email"
        placeholder="Email"
      >

      <input
        id="registerPassword"
        class="input"
        type="password"
        placeholder="Password"
      >

      <button
        class="btn"
        style="width:100%;margin-top:8px"
        onclick="register()"
      >
        Create Account
      </button>

      <p style="text-align:center">

        <button
          class="btn btn-secondary"
          onclick="showLogin()"
        >
          Login
        </button>

      </p>

    </div>

    <div
      id="authMessage"
      style="margin-top:10px;text-align:center;color:#d32f2f"
    ></div>

  </div>

</div>


<!-- =========================
     APP
========================= -->

<div
  id="appSection"
  class="container hidden"
>

  <div class="nav">

    <button
      id="navHome"
      class="active"
      onclick="showPage('home')"
    >

    </button>

    <button

    >
      👤 Profile
    </button>

    <button
      onclick="showPage('friends')"
    >
      👥 Friends
    </button>

    <button
      onclick="showPage('messages')"
    >
      💬 Messenger
    </button>

    <button
      onclick="showPage('notifications')"
    >
      🔔 Notifications
    </button>

    <button
      onclick="showPage('reels')"
    >

    </button>

    <button

    >

    </button>

  </div>


  <!-- =========================
       HOME
  ========================= -->

  <section id="homePage">

    <div class="card">

      <h2>Create Post</h2>

      <textarea
        id="postText"
        class="input"
        placeholder="আপনার মনের কথা লিখুন..."

      <label class="file-label">
        📷 Photo Upload

        <input
          id="postImage"

      <br>

      <img

        class="preview hidden"

      >

      <button
        class="btn"

      >
        Post

    <div id="feed">

        Loading...
      </div>

  </section>


  <!-- =========================
       PROFILE
  ========================= -->

  <section
    id="profilePage"
    class="hidden"
  >

    <div class="card">

      <img
        id="coverPhoto"
        class="profile-cover"
        src=""
        alt="cover"
      >

      <div class="profile-header">

        <img
          id="profilePhoto"
          class="profile-photo"
          src=""
          alt="profile"
        >

        <div
          id="profileName"
          class="profile-name"
        ></div>

        <div
          id="profileBio"
          style="color:#666"
        ></div>

        <br>

        <button
          class="btn"
          onclick="toggleEditProfile()"
        >
          ✏️ Edit Profile
        </button>

      </div>

    </div>


    <div
      id="editProfileBox"
      class="card hidden"
    >

      <h3>Edit Profile</h3>

      <input
        id="editName"
        class="input"
        placeholder="Name"
      >

      <textarea
        id="editBio"
        class="input"
        placeholder="Bio"
      ></textarea>


      <label class="file-label">
        Profile Photo

        <input
          id="profileFile"
          type="file"

      </label>


      <br><br>


      <label class="file-label">
        Cover Photo

        <input
          id="coverFile"

          accept="image/*"

      </label>


      <br><br>

      <button

        onclick="saveProfile()"

        Save Profile
      </button>

    <h2>My Posts</h2>

    <div id="myPosts"></div>

  </section>


  <!-- =========================
       FRIENDS
  ========================= -->

  <section

  >

    <div class="card">

      <h2>Friend Requests</h2>

      <div id="friendRequests"></div>

    </div>


    <div class="card">

      <h2>My Friends</h2>

      <div id="friendsList"></div>

    </div>

  </section>


  <!-- =========================
       SEARCH
  ========================= -->

  <section
    id="searchPage"
    class="hidden"
  >

    <div class="card">

      <h2>Search People</h2>

      <div class="search-row">

        <input
          id="searchInput"
          class="input"
          placeholder="নাম দিয়ে খুঁজুন..."
        >

        <button
          class="btn"
          onclick="searchUsers()"
        >
          Search
        </button>

      </div>

    </div>

    <div
      id="searchResults"
      class="card"
    ></div>

  </section>


  <!-- =========================
       MESSAGES
  ========================= -->

  <section
    id="messagesPage"
    class="hidden"
  >

    <div class="card">

      <h2>Messenger</h2>

      <div id="messageFriends"></div>

    </div>


    <div
      id="chatBox"
      class="card hidden"
    >

      <h3 id="chatTitle"></h3>

      <div
        id="messagesList"
        style="
          max-height:400px;
          overflow-y:auto;
          margin-bottom:10px;
        "
      ></div>

      <div class="search-row">

        <input
          id="messageInput"
          class="input"
          placeholder="Message লিখুন..."
        >

        <button
          class="btn"
          onclick="sendMessage()"
        >
          Send
        </button>

      </div>

    </div>

  </section>


  <!-- =========================
       NOTIFICATIONS
  ========================= -->

  <section
    id="notificationsPage"
    class="hidden"
  >

    <div class="card">

      <h2>Notifications</h2>

      <div id="notificationsList"></div>

      <button
        class="btn btn-secondary"
        onclick="markNotificationsRead()"
      >
        Mark all as read
      </button>

    </div>

  </section>


  <!-- =========================
       REELS
  ========================= -->

  <section
    id="reelsPage"
    class="hidden"
  >

    <div class="card">

      <h2>Upload Reel</h2>

      <input
        id="reelCaption"
        class="input"
        placeholder="Reel caption"
      >

      <label class="file-label">
        🎬 Select Video

        <input
          id="reelFile"
          type="file"
          accept="video/*"
          hidden
        >

      </label>

      <br><br>

      <button
        class="btn"
        onclick="uploadReel()"
      >
        Upload Reel
      </button>

    </div>


    <div id="reelsList"></div>

  </section>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://skereuaizdczbvjplisi.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_3R2otJA1zIlsMsTYxe1ocw_NAPY5O9x";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let currentUser = null;
let currentProfile = null;
let currentChatUser = null;


/* =========================================================
   DEFAULT IMAGE
========================================================= */

const DEFAULT_AVATAR =
  "https://ui-avatars.com/api/?name=User&background=random";

const DEFAULT_COVER =
  "https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1200&q=80";


/* =========================================================
   AUTH START
========================================================= */

document.addEventListener("DOMContentLoaded", async () => {

  const {
    data: {
      session
    }
  } = await supabaseClient.auth.getSession();

  if (session && session.user) {

    currentUser = session.user;

    await startApp();

  } else {

    showAuth();

  }

});


supabaseClient.auth.onAuthStateChange(
  async (event, session) => {

    if (session && session.user) {

      currentUser = session.user;

      await startApp();

    } else {

      currentUser = null;
      currentProfile = null;

      showAuth();

    }

  }
);


/* =========================================================
   AUTH UI
========================================================= */

function showAuth() {

  document
    .getElementById("authSection")
    .classList.remove("hidden");

  document
    .getElementById("appSection")
    .classList.add("hidden");

  document
    .getElementById("mainHeader")
    .classList.add("hidden");

}


function showLogin() {

  document
    .getElementById("loginBox")
    .classList.remove("hidden");

  document
    .getElementById("registerBox")
    .classList.add("hidden");

  document
    .getElementById("authMessage")
    .textContent = "";

}


function showRegister() {

  document
    .getElementById("loginBox")
    .classList.add("hidden");

  document
    .getElementById("registerBox")
    .classList.remove("hidden");

  document
    .getElementById("authMessage")
    .textContent = "";

}


/* =========================================================
   REGISTER
========================================================= */

async function register() {

  const name =
    document
      .getElementById("registerName")
      .value
      .trim();

  const email =
    document
      .getElementById("registerEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("registerPassword")
      .value;

  const msg =
    document.getElementById("authMessage");


  if (!name || !email || !password) {

    msg.textContent =
      "সব তথ্য পূরণ করুন।";

    return;
  }


  if (password.length < 6) {

    msg.textContent =
      "Password কমপক্ষে ৬ অক্ষরের হতে হবে।";

    return;
  }


  msg.style.color = "#1877f2";
  msg.textContent =
    "Account তৈরি হচ্ছে...";


  const {
    data,
    error
  } =
    await supabaseClient.auth.signUp({

      email,
      password,

      options: {

        data: {
          name: name
        }

      }

    });


  if (error) {

    msg.style.color = "#d32f2f";
    msg.textContent = error.message;

    return;
  }


  if (data.user) {

    const {
      error: profileError
    } =
      await supabaseClient
        .from("profiles")
        .upsert({

          id: data.user.id,
          name: name,
          bio: "",
          profile_photo: "",
          cover_photo: ""

        });


    if (profileError) {

      console.log(
        "Profile error:",
        profileError
      );

    }

  }


  msg.style.color = "#2e7d32";

  msg.textContent =
    "Account তৈরি হয়েছে। Email verification চাইলে email verify করুন, তারপর Login করুন।";

}


/* =========================================================
   LOGIN
========================================================= */

async function login() {

  const email =
    document
      .getElementById("loginEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("loginPassword")
      .value;

  const msg =
    document.getElementById("authMessage");


  if (!email || !password) {

    msg.textContent =
      "Email এবং Password দিন।";

    return;
  }


  msg.style.color = "#1877f2";

  msg.textContent =
    "Login হচ্ছে...";


  const {
    data,
    error
  } =
    await supabaseClient.auth.signInWithPassword({

      email,
      password

    });


  if (error) {

    msg.style.color = "#d32f2f";

    msg.textContent =
      "Email অথবা Password ভুল।";

    console.log(error);

    return;
  }


  currentUser = data.user;

  await startApp();

}


/* =========================================================
   LOGOUT
========================================================= */

async function logout() {

  await supabaseClient.auth.signOut();

  currentUser = null;
  currentProfile = null;

  showAuth();

}


/* =========================================================
   START APP
========================================================= */

async function startApp() {

  document
    .getElementById("authSection")
    .classList.add("hidden");

  document
    .getElementById("appSection")
    .classList.remove("hidden");

  document
    .getElementById("mainHeader")
    .classList.remove("hidden");


  await loadProfile();

  updateHeader();

  await loadFeed();

}


/* =========================================================
   PROFILE
========================================================= */

async function loadProfile() {

  if (!currentUser) return;


  let {
    data,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id", currentUser.id)
      .maybeSingle();


  if (error) {

    console.log(
      "Profile load error:",
      error
    );

    return;
  }


  if (!data) {

    const name =
      currentUser.user_metadata?.name ||
      currentUser.email?.split("@")[0] ||
      "User";


    const {
      data: newProfile,
      error: insertError
    } =
      await supabaseClient
        .from("profiles")
        .insert({

          id: currentUser.id,
          name: name,
          bio: "",
          profile_photo: "",
          cover_photo: ""

        })
        .select()
        .single();


    if (insertError) {

      console.log(
        "Profile create error:",
        insertError
      );

      return;
    }


    data = newProfile;

  }


  currentProfile = data;

  renderProfile();

  updateHeader();

}


function renderProfile() {

  if (!currentProfile) return;


  document
    .getElementById("profileName")
    .textContent =
      currentProfile.name || "User";


  document
    .getElementById("profileBio")
    .textContent =
      currentProfile.bio || "No bio";


  document
    .getElementById("profilePhoto")
    .src =
      currentProfile.profile_photo ||
      `https://ui-avatars.com/api/?name=${encodeURIComponent(
        currentProfile.name || "User"
      )}&background=random`;


  document
    .getElementById("coverPhoto")
    .src =
      currentProfile.cover_photo ||
      DEFAULT_COVER;


  document
    .getElementById("editName")
    .value =
      currentProfile.name || "";


  document
    .getElementById("editBio")
    .value =
      currentProfile.bio || "";

}


function updateHeader() {

  if (!currentProfile) return;


  document
    .getElementById("headerName")
    .textContent =
      currentProfile.name || "User";


  document
    .getElementById("headerAvatar")
    .src =
      currentProfile.profile_photo ||
      `https://ui-avatars.com/api/?name=${encodeURIComponent(
        currentProfile.name || "User"
      )}&background=random`;

}


function toggleEditProfile() {

  document
    .getElementById("editProfileBox")
    .classList.toggle("hidden");

}


/* =========================================================
   STORAGE UPLOAD
========================================================= */

async function uploadFile(file, folder) {

  if (!file) return null;


  const extension =
    file.name.split(".").pop();


  const fileName =
    `${folder}/${currentUser.id}_${Date.now()}.${extension}`;


  const {
    error
  } =
    await supabaseClient
      .storage
      .from("media")
      .upload(
        fileName,
        file,
        {
          upsert: false
        }
      );


  if (error) {

    console.log(
      "Upload error:",
      error
    );

    alert(
      "Photo/Video upload হয়নি। Supabase Storage policy check করুন।"
    );

    return null;
  }


  const {
    data
  } =
    supabaseClient
      .storage
      .from("media")
      .getPublicUrl(fileName);


  return data.publicUrl;

}

/* =========================================================
   LOAD FEED
========================================================= */

async function loadFeed() {

  const feed =
    document.getElementById("feed");


  feed.innerHTML =
    '<div class="loading">Loading...</div>';


  const {
    data: posts,
    error
  } =
    await supabaseClient
      .from("posts")
      .select("*")
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    feed.innerHTML =
      `<div class="card">
        Feed load হয়নি: ${escapeHtml(error.message)}
      </div>`;

    return;
  }


  if (!posts || posts.length === 0) {

    feed.innerHTML =
      '<div class="card empty">এখনো কোনো Post নেই।</div>';

    return;
  }


  const userIds =
    [
      ...new Set(
        posts.map(
          p => p.user_id
        )
      )
    ];


  const {
    data: profiles
  } =
    await supabaseClient
      .from("profiles")
      .select("*")
      .in(
        "id",
        userIds
      );


  const profileMap = {};

  (profiles || []).forEach(
    profile => {

      profileMap[
        profile.id
      ] = profile;

    }
  );


  feed.innerHTML = "";


  for (const post of posts) {

    const profile =
      profileMap[
        post.user_id
      ] || {};


    const postElement =
      await createPostElement(
        post,
        profile
      );


    feed.appendChild(
      postElement
    );

  }

}


/* =========================================================
   POST ELEMENT
========================================================= */

async function createPostElement(
  post,
  profile
) {

  const div =
    document.createElement("div");

  div.className = "card";


  const avatar =
    profile.profile_photo ||
    `https://ui-avatars.com/api/?name=${encodeURIComponent(
      profile.name || "User"
    )}&background=random`;


  const date =
    post.created_at
      ? new Date(
          post.created_at
        ).toLocaleString(
          "bn-BD"
        )
      : "";


  let likes = [];


  const {
    data: likeData
  } =
    await supabaseClient
      .from("post_likes")
      .select("user_id")
      .eq(
        "post_id",
        post.id
      );


  likes =
    likeData || [];


  const liked =
    likes.some(
      l =>
        l.user_id ===
        currentUser.id
    );


  const comments =
    await getComments(
      post.id
    );


  div.innerHTML = `

    <div class="post-head">

      <img
        class="avatar-small"
        src="${escapeAttr(avatar)}"
        alt=""
      >

      <div>

        <div class="post-user">
          ${escapeHtml(
            profile.name || "User"
          )}
        </div>

        <div class="post-date">
          ${escapeHtml(date)}
        </div>

      </div>

    </div>


    ${
      post.text
        ? `
          <div class="post-text">
            ${escapeHtml(post.text)}
          </div>
        `
        : ""
    }


    ${
      post.image_url
        ? `
          <img
            class="post-image"
            src="${escapeAttr(
              post.image_url
            )}"
            alt="post"
          >
        `
        : ""
    }


    <div class="post-actions">

      <button
        onclick="toggleLike(${post.id})"
      >
        ${
          liked
            ? "❤️ Unlike"
            : "🤍 Like"
        }
        ${likes.length}
      </button>


      <button
        onclick="focusComment(${post.id})"
      >
        💬 Comment
      </button>


      <button
        onclick="sharePost(${post.id})"
      >
        ↗ Share
      </button>


      ${
        post.user_id === currentUser.id
          ? `
            <button
              onclick="deletePost(${post.id})"
            >
              🗑 Delete
            </button>
          `
          : ""
      }

    </div>


    <div id="comments-${post.id}">

      ${
        comments
          .map(
            c => `

              <div class="comment">

                <strong>
                  ${escapeHtml(
                    c.profile?.name ||
                    "User"
                  )}
                </strong>

                ${escapeHtml(
                  c.text
                )}

              </div>

            `
          )
          .join("")
      }

    </div>


    <div class="comment-box">

      <input
        id="comment-${post.id}"
        class="input"
        placeholder="Comment লিখুন..."
      >

      <button
        class="btn"
        onclick="addComment(${post.id})"
      >
        Send
      </button>

    </div>

  `;


  return div;

}


/* =========================================================
   GET COMMENTS
========================================================= */

async function getComments(postId) {

  const {
    data: comments,
    error
  } =
    await supabaseClient
      .from("comments")
      .select("*")
      .eq(
        "post_id",
        postId
      )
      .order(
        "created_at",
        {
          ascending: true
        }
      );


  if (error) {

    console.log(error);

    return [];

  }


  const userIds =
    [
      ...new Set(
        (comments || [])
          .map(
            c =>
              c.user_id
          )
      )
    ];


  if (!userIds.length) {

    return comments || [];

  }


  const {
    data: profiles
  } =
    await supabaseClient
      .from("profiles")
      .select("*")
      .in(
        "id",
        userIds
      );


  const map = {};


  (profiles || []).forEach(
    p => {

      map[p.id] = p;

    }
  );


  return (comments || [])
    .map(
      c => ({
        ...c,
        profile:
          map[c.user_id]
      })
    );

}


/* =========================================================
   LIKE
========================================================= */

async function toggleLike(postId) {

  const {
    data: existing
  } =
    await supabaseClient
      .from("post_likes")
      .select("*")
      .eq(
        "post_id",
        postId
      )
      .eq(
        "user_id",
        currentUser.id
      )
      .maybeSingle();


  if (existing) {

    await supabaseClient
      .from("post_likes")
      .delete()
      .eq(
        "post_id",
        postId
      )
      .eq(
        "user_id",
        currentUser.id
      );

  } else {

    const {
      error
    } =
      await supabaseClient
        .from("post_likes")
        .insert({

          post_id:
            postId,

          user_id:
            currentUser.id

        });


    if (error) {

      alert(
        "Like হয়নি: " +
        error.message
      );

      return;
    }

  }


  await loadFeed();

}

/* =========================================================
   SHARE
========================================================= */

async function sharePost(postId) {

  const url =
    window.location.href +
    "#post-" +
    postId;


  if (
    navigator.share
  ) {

    try {

      await navigator.share({

        title:
          "My Social App",

        text:
          "এই Post টি দেখুন",

        url:
          url

      });

    } catch (e) {

      console.log(e);

    }

  } else {

    try {

      await navigator.clipboard.writeText(
        url
      );

      alert(
        "Post link copied!"
      );

    } catch (e) {

      prompt(
        "এই link কপি করুন:",
        url
      );

    }

  }

}

/* =========================================================
   SEND FRIEND REQUEST
========================================================= */

async function sendFriendRequest(
  receiverId
) {

  if (
    receiverId ===
    currentUser.id
  ) {

    return;

  }


  const {
    data: existing
  } =
    await supabaseClient
      .from("friend_requests")
      .select("*")
      .or(
        `and(sender_id.eq.${currentUser.id},receiver_id.eq.${receiverId}),and(sender_id.eq.${receiverId},receiver_id.eq.${currentUser.id})`
      );


  if (
    existing &&
    existing.length
  ) {

    alert(
      "Friend request আগে থেকেই আছে।"
    );

    return;

  }


  const {
    error
  } =
    await supabaseClient
      .from("friend_requests")
      .insert({

        id:
          Date.now() +
          Math.floor(
            Math.random() * 1000
          ),

        sender_id:
          currentUser.id,

        receiver_id:
          receiverId,

        status:
          "pending"

      });


  if (error) {

    alert(
      "Request হয়নি: " +
      error.message
    );

    return;
  }


  alert(
    "Friend Request পাঠানো হয়েছে।"
  );

}

          r.receiver_id
        )
    );


  (received || [])
    .forEach(
      r =>
        ids.push(
          r.sender_id
        )
    );


  const uniqueIds =
    [
      ...new Set(ids)
    ];


  if (!uniqueIds.length) {

    box.innerHTML =
      '<div class="empty">Message করার জন্য Friend নেই।</div>';

    return;

  }


  const {
    data: profiles
  } =
    await supabaseClient
      .from("profiles")
      .select("*")
      .in(
        "id",
        uniqueIds
      );


  box.innerHTML = "";


  (profiles || [])
    .forEach(
      profile => {

        const row =
          document.createElement(
            "div"
          );

        row.className =
          "user-row";


        row.innerHTML = `

          <div class="user-info">

            <img
              class="avatar-small"
              src="${escapeAttr(
                profile.profile_photo ||
                `https://ui-avatars.com/api/?name=${encodeURIComponent(
                  profile.name || "User"
                )}`
              )}"
            >

            <strong>
              ${escapeHtml(
                profile.name ||
                "User"
              )}
            </strong>

          </div>


          <button
            class="btn"
            onclick="openChat('${profile.id}')"
          >
            Chat
          </button>

        `;


        box.appendChild(
          row
        );

      }
    );

}


/* =========================================================
   OPEN CHAT
========================================================= */

async function openChat(userId) {

  currentChatUser =
    userId;


  const {
    data: profile
  } =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq(
        "id",
        userId
      )
      .single();


  document
    .getElementById("chatTitle")
    .textContent =
      "Chat with " +
      (
        profile?.name ||
        "User"
      );


  document
    .getElementById("chatBox")
    .classList.remove("hidden");


  await loadMessages();

}


/* =========================================================
   LOAD MESSAGES
========================================================= */

async function loadMessages() {

  if (!currentChatUser)
    return;


  const box =
    document.getElementById(
      "messagesList"
    );


  const {
    data,
    error
  } =
    await supabaseClient
      .from("messages")
      .select("*")
      .or(
        `and(sender_id.eq.${currentUser.id},receiver_id.eq.${currentChatUser}),and(sender_id.eq.${currentChatUser},receiver_id.eq.${currentUser.id})`
      )
      .order(
        "created_at",
        {
          ascending: true
        }
      );


  if (error) {

    box.innerHTML =
      escapeHtml(
        error.message
      );

    return;

  }


  box.innerHTML = "";


  (data || [])
    .forEach(
      message => {

        const div =
          document.createElement(
            "div"
          );


        const mine =
          message.sender_id ===
          currentUser.id;


        div.style.textAlign =
          mine
            ? "right"
            : "left";


        div.innerHTML = `

          <span
            style="
              display:inline-block;
              padding:8px 12px;
              margin:4px;
              border-radius:15px;
              background:${
                mine
                  ? "#1877f2"
                  : "#e4e6eb"
              };
              color:${
                mine
                  ? "white"
                  : "#222"
              };
              max-width:80%;
              word-break:break-word;
            "
          >
            ${escapeHtml(
              message.text
            )}
          </span>

        `;


        box.appendChild(
          div
        );

      }
    );


  box.scrollTop =
    box.scrollHeight;

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage() {

  const input =
    document.getElementById(
      "messageInput"
    );


  const text =
    input.value.trim();


  if (!text ||
      !currentChatUser) {

    return;

  }


  const {
    error
  } =
    await supabaseClient
      .from("messages")
      .insert({

        id:
          Date.now() +
          Math.floor(
            Math.random() * 1000
          ),

        sender_id:
          currentUser.id,

        receiver_id:
          currentChatUser,

        text:
          text

      });


  if (error) {

    alert(
      "Message হয়নি: " +
      error.message
    );

    return;

  }


  input.value = "";

  await loadMessages();

}


/* =========================================================
   NOTIFICATIONS
========================================================= */

async function loadNotifications() {

  const box =
    document.getElementById(
      "notificationsList"
    );


  const {
    data,
    error
  } =
    await supabaseClient
      .from("notifications")
      .select("*")
      .eq(
        "receiver_id",
        currentUser.id
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    box.innerHTML =
      escapeHtml(
        error.message
      );

    return;

  }


  if (!data?.length) {

    box.innerHTML =
      '<div class="empty">কোনো Notification নেই।</div>';

    return;

  }


  box.innerHTML = "";


  data.forEach(
    notification => {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "notification " +
        (
          notification.read
            ? ""
            : "unread"
        );


      div.innerHTML = `

        <div>
          ${escapeHtml(
            notification.text
          )}
        </div>

        <small>
          ${new Date(
            notification.created_at
          ).toLocaleString(
            "bn-BD"
          )}
        </small>

      `;


      box.appendChild(
        div
      );

    }
  );

}


/* =========================================================
   MARK NOTIFICATIONS READ
========================================================= */

async function markNotificationsRead() {

  const {
    error
  } =
    await supabaseClient
      .from("notifications")
      .update({
        read: true
      })
      .eq(
        "receiver_id",
        currentUser.id
      );


  if (error) {

    alert(
      error.message
    );

    return;

  }


  await loadNotifications();

}


/* =========================================================
   REELS
========================================================= */

async function uploadReel() {

  const file =
    document
      .getElementById(
        "reelFile"
      )
      .files[0];


  const caption =
    document
      .getElementById(
        "reelCaption"
      )
      .value
      .trim();


  if (!file) {

    alert(
      "Video select করুন।"
    );

    return;

  }


  const url =
    await uploadFile(
      file,
      "reels"
    );


  if (!url) return;


  const {
    error
  } =
    await supabaseClient
      .from("reels")
      .insert({

        id:
          Date.now() +
          Math.floor(
            Math.random() * 1000
          ),

        user_id:
          currentUser.id,

        video_url:
          url,

        caption:
          caption,

        views:
          0

      });


  if (error) {

    alert(
      "Reel upload হয়নি: " +
      error.message
    );

    return;

  }


  document
    .getElementById(
      "reelFile"
    )
    .value = "";


  document
    .getElementById(
      "reelCaption"
    )
    .value = "";


  alert(
    "Reel upload হয়েছে।"
  );


  await loadReels();

}


/* =========================================================
   LOAD REELS
========================================================= */

async function loadReels() {

  const box =
    document.getElementById(
      "reelsList"
    );


  box.innerHTML =
    '<div class="loading">Loading Reels...</div>';


  const {
    data: reels,
    error
  } =
    await supabaseClient
      .from("reels")
      .select("*")
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    box.innerHTML =
      `<div class="card">
        ${escapeHtml(
          error.message
        )}
      </div>`;

    return;

  }


  if (!reels?.length) {

    box.innerHTML =
      '<div class="card empty">এখনো কোনো Reel নেই।</div>';

    return;

  }


  const ids =
    [
      ...new Set(
        reels.map(
          r =>
            r.user_id
        )
      )
    ];


  const {
    data: profiles
  } =
    await supabaseClient
      .from("profiles")
      .select("*")
      .in(
        "id",
        ids
      );


  const map = {};


  (profiles || [])
    .forEach(
      p => {

        map[p.id] =
          p;

      }
    );


  box.innerHTML = "";


  reels.forEach(
    reel => {

      const profile =
        map[
          reel.user_id
        ] || {};


      const div =
        document.createElement(
          "div"
        );


      div.className =
        "card";


      div.innerHTML = `

        <div class="post-head">

          <img
            class="avatar-small"
            src="${escapeAttr(
              profile.profile_photo ||
              `https://ui-avatars.com/api/?name=${encodeURIComponent(
                profile.name || "User"
              )}`
            )}"
          >

          <strong>
            ${escapeHtml(
              profile.name ||
              "User"
            )}
          </strong>

        </div>


        ${
          reel.caption
            ? `
              <div class="post-text">
                ${escapeHtml(
                  reel.caption
                )}
              </div>
            `
            : ""
        }


        <video
          class="reel-video"
          controls
          playsinline
          preload="metadata"
          onplay="increaseReelView(${reel.id}, ${reel.views || 0})"
        >
          <source
            src="${escapeAttr(
              reel.video_url
            )}"
          >
        </video>


        <div style="margin-top:8px">
          👁️ Views:
          <span id="views-${reel.id}">
            ${reel.views || 0}
          </span>
        </div>


        ${
          reel.user_id ===
          currentUser.id
            ? `
              <button
                class="btn btn-danger"
                style="margin-top:10px"
                onclick="deleteReel(${reel.id})"
              >
                Delete Reel
              </button>
            `
            : ""
        }

      `;


      box.appendChild(
        div
      );

    }
  );

}


/* =========================================================
   REEL VIEW
========================================================= */

async function increaseReelView(
  reelId,
  oldViews
) {

  const key =
    "viewed_reel_" +
    reelId;


  if (
    sessionStorage.getItem(
      key
    )
  ) {

    return;

  }


  sessionStorage.setItem(
    key,
    "1"
  );


  const newViews =
    Number(oldViews || 0) +
    1;


  const {
    error
  } =
    await supabaseClient
      .from("reels")
      .update({
        views:
          newViews
      })
      .eq(
        "id",
        reelId
      );


  if (!error) {

    const el =
      document.getElementById(
        "views-" +
        reelId
      );


    if (el) {

      el.textContent =
        newViews;

    }

  }

}


/* =========================================================
   DELETE REEL
========================================================= */

async function deleteReel(
  reelId
) {

  if (
    !confirm(
      "এই Reel delete করতে চান?"
    )
  ) {

    return;

  }


  const {
    error
  } =
    await supabaseClient
      .from("reels")
      .delete()
      .eq(
        "id",
        reelId
      )
      .eq(
        "user_id",
        currentUser.id
      );


  if (error) {

    alert(
      "Delete হয়নি: " +
      error.message
    );

    return;

  }


  await loadReels();

}


/* =========================================================
   PAGE NAVIGATION
========================================================= */

async function showPage(
  page
) {

  const pages = [
    "home",
    "profile",
    "friends",
    "messages",
    "notifications",
    "reels",
    "search"
  ];


  pages.forEach(
    p => {

      const el =
        document.getElementById(
          p + "Page"
        );


      if (el) {

        el.classList.toggle(
          "hidden",
          p !== page
        );

      }

    }
  );


  document
    .querySelectorAll(
      ".nav button"
    )
    .forEach(
      btn =>
        btn.classList.remove(
          "active"
        )
    );


  if (
    page === "home"
  ) {

    document
      .getElementById(
        "navHome"
      )
      .classList.add(
        "active"
      );

    await loadFeed();

  }


  if (
    page === "profile"
  ) {

    await loadProfile();

    await loadMyPosts();

  }


  if (
    page === "friends"
  ) {

    await loadFriendRequests();

    await loadFriends();

  }


  if (
    page === "messages"
  ) {

    await loadMessageFriends();

  }


  if (
    page === "notifications"
  ) {

    await loadNotifications();

  }


  if (
    page === "reels"
  ) {

    await loadReels();

  }

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
  value
) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }


  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeAttr(
  value
) {

  return escapeHtml(
    value
  );

}

   AUTO REFRESH CHAT
========================================================= */

setInterval(

    if (
      currentUser &&
      currentChatUser &&
      !document

        .classList

        )

setInterval(

    if (

      !document
        .getElementById(
          "notificationsPage"
        )
        .classList
        .contains(

        )

      await loadNotifications();
