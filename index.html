<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#1877f2">
<title>My Social App</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:Arial,sans-serif;background:#f0f2f5;color:#111}
body.dark{background:#18191a;color:#eee}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0}
.hidden{display:none!important}

#bootError{
 position:fixed;inset:0;background:#fff;color:#111;
 display:flex;align-items:center;justify-content:center;
 padding:20px;z-index:99999
}
.errorBox{
 max-width:600px;width:100%;padding:25px;border-radius:16px;
 background:#f5f5f5;border:1px solid #ddd
}
.errorBox h2{color:#d00}

header{
 position:sticky;top:0;z-index:100;
 height:58px;background:#1877f2;color:#fff;
 display:flex;align-items:center;padding:0 12px;gap:10px;
 box-shadow:0 2px 6px #0002
}
.logo{font-size:22px;font-weight:bold;white-space:nowrap}
.search{
 flex:1;max-width:450px;
 background:#fff;border-radius:22px;padding:9px 15px;
 color:#111;outline:none;border:0
}
.headerBtns{display:flex;gap:6px;margin-left:auto}
.hbtn{
 width:38px;height:38px;border-radius:50%;
 background:#ffffff22;color:#fff;font-size:19px
}

.app{
 max-width:1250px;margin:auto;
 display:grid;grid-template-columns:250px 1fr 270px;
 gap:16px;padding:16px
}
.card{
 background:#fff;border-radius:12px;
 box-shadow:0 1px 3px #0002;margin-bottom:14px;
 overflow:hidden
}
.dark .card{background:#242526;color:#eee}

.sidebar{
 position:sticky;top:74px;height:max-content
}
.menu{
 padding:12px;display:flex;align-items:center;
 gap:12px;border-radius:9px;margin-bottom:4px;
 cursor:pointer;font-weight:600
}
.menu:hover{background:#e4e6eb}
.dark .menu:hover{background:#3a3b3c}

.profileMini{
 padding:15px;text-align:center
}
.avatar{
 width:52px;height:52px;border-radius:50%;
 object-fit:cover;background:#ddd
}
.bigAvatar{width:100px;height:100px}

.page{min-width:0}

.composer{
 padding:12px;display:flex;gap:10px;align-items:center
}
.composer input{
 flex:1;border:0;background:#f0f2f5;
 padding:12px 16px;border-radius:22px;outline:0
}
.dark .composer input{background:#3a3b3c;color:#fff}

.actions{
 display:flex;border-top:1px solid #ddd;padding-top:8px;
 margin-top:8px
}
.action{
 flex:1;padding:9px;border-radius:7px;
 background:transparent
}
.action:hover{background:#eee}
.dark .action:hover{background:#3a3b3c}

.postHead{
 display:flex;align-items:center;gap:10px;padding:12px
}
.postHead .name{font-weight:bold}
.small{font-size:12px;color:#777}
.postBody{padding:0 14px 12px;white-space:pre-wrap}
.postImg{width:100%;max-height:650px;object-fit:cover;display:block}
.postStats{
 display:flex;justify-content:space-between;
 padding:8px 14px;color:#777;font-size:14px
}
.postButtons{
 display:flex;border-top:1px solid #ddd;
 border-bottom:1px solid #ddd
}
.postButtons button{
 flex:1;padding:11px;background:transparent
}
.postButtons button:hover{background:#eee}
.liked{color:#1877f2;font-weight:bold}

.comments{padding:10px}
.comment{
 display:flex;gap:8px;margin-bottom:8px
}
.commentBubble{
 background:#f0f2f5;border-radius:15px;padding:7px 11px
}
.dark .commentBubble{background:#3a3b3c}

.commentForm{display:flex;gap:7px;margin-top:8px}
.commentForm input{
 flex:1;border:0;background:#f0f2f5;
 padding:10px 13px;border-radius:20px;outline:0
}
.commentForm button{
 width:40px;border-radius:50%;
 background:#1877f2;color:white
}

.reel{
 position:relative;background:#000;border-radius:12px;
 overflow:hidden;margin-bottom:14px
}
.reel video{
 width:100%;height:min(78vh,700px);
 object-fit:cover;display:block
}
.reelInfo{
 position:absolute;left:14px;right:14px;bottom:14px;
 color:white;text-shadow:0 1px 4px #000
}
.reelActions{
 position:absolute;right:10px;bottom:70px;
 display:flex;flex-direction:column;gap:10px
}
.reelActions button{
 width:48px;height:48px;border-radius:50%;
 background:#0008;color:#fff
}

.modal{
 position:fixed;inset:0;background:#0008;
 display:flex;align-items:center;justify-content:center;
 padding:15px;z-index:1000
}
.modalBox{
 background:#fff;color:#111;border-radius:14px;
 max-width:650px;width:100%;max-height:90vh;
 overflow:auto;padding:18px
}
.dark .modalBox{background:#242526;color:#fff}
.modalTitle{
 display:flex;justify-content:space-between;
 align-items:center;margin-bottom:15px
}
.close{
 background:#eee;border-radius:50%;width:34px;height:34px
}

textarea,input,select{
 width:100%;padding:11px;border:1px solid #ccc;
 border-radius:8px;margin-bottom:10px;outline:none
}
.dark textarea,.dark input,.dark select{
 background:#3a3b3c;color:#fff;border-color:#555
}

.primary{
 background:#1877f2;color:#fff;padding:11px 18px;
 border-radius:8px
}
.danger{background:#e41e3f;color:#fff;padding:10px;border-radius:8px}
.secondary{background:#e4e6eb;padding:10px;border-radius:8px}

.storyRow{
 display:flex;gap:10px;overflow-x:auto;padding:12px
}
.story{
 min-width:100px;height:145px;border-radius:12px;
 overflow:hidden;position:relative;background:#ddd
}
.story img{width:100%;height:100%;object-fit:cover}
.story span{
 position:absolute;bottom:6px;left:7px;color:#fff;
 font-size:12px;text-shadow:0 1px 3px #000
}

.profileCover{
 height:220px;background:#ddd center/cover no-repeat;
 position:relative
}
.profileInfo{
 padding:0 18px 18px;text-align:center
}
.profileInfo .bigAvatar{
 margin-top:-50px;border:4px solid #fff
}

.grid{
 display:grid;grid-template-columns:repeat(3,1fr);gap:4px
}
.grid img{width:100%;aspect-ratio:1;object-fit:cover}

.userRow{
 display:flex;align-items:center;gap:10px;
 padding:10px;border-bottom:1px solid #ddd
}
.userRow:last-child{border-bottom:0}
.userRow .grow{flex:1}

.settingRow{
 display:flex;justify-content:space-between;
 align-items:center;padding:14px 0;border-bottom:1px solid #ddd
}

.badge{
 background:#e41e3f;color:#fff;border-radius:12px;
 padding:2px 7px;font-size:11px
}

.empty{text-align:center;padding:30px;color:#777}

@media(max-width:950px){
 .app{grid-template-columns:1fr}
 .sidebar,.rightbar{display:none}
}
@media(max-width:600px){
 header{height:54px}
 .logo{font-size:18px}
 .search{max-width:none}
 .app{padding:8px}
 .card{border-radius:8px}
 .reel video{height:78vh}
}
</style>
</head>

<body>

<div id="bootError" class="hidden">
 <div class="errorBox">
  <h2>My Social App চালু হতে সমস্যা হয়েছে</h2>
  <p id="bootErrorText"></p>
  <button class="primary" onclick="location.reload()">Reload</button>
 </div>
</div>

<header>
 <div class="logo">My Social App</div>
 <input id="searchBox" class="search" placeholder="Search people..." onkeydown="if(event.key==='Enter')searchUsers()">
 <div class="headerBtns">
  <button class="hbtn" onclick="showPage('home')">⌂</button>
  <button class="hbtn" onclick="showNotifications()">🔔</button>
  <button class="hbtn" onclick="showPage('settings')">☰</button>
 </div>
</header>

<div class="app">

<aside class="sidebar">
 <div class="card profileMini">
  <img id="miniAvatar" class="avatar" src="">
  <div id="miniName">Loading...</div>
 </div>

 <div class="menu" onclick="showPage('home')">🏠 Home</div>
 <div class="menu" onclick="showPage('reels')">🎬 Reels</div>
 <div class="menu" onclick="showPage('profile')">👤 Profile</div>
 <div class="menu" onclick="showPage('friends')">👥 Friends</div>
 <div class="menu" onclick="showPage('messages')">💬 Messages</div>
 <div class="menu" onclick="showNotifications()">🔔 Notifications</div>
 <div class="menu" onclick="showPage('creator')">💰 Monetization</div>
 <div class="menu" onclick="showPage('settings')">⚙️ Settings</div>
 <div class="menu" onclick="toggleDark()">🌙 Dark Mode</div>
 <div class="menu" onclick="logout()">🚪 Logout</div>
</aside>

<main id="page" class="page"></main>

<aside class="rightbar">
 <div class="card" style="padding:14px">
  <b>Quick Menu</b>
  <div class="menu" onclick="openPostModal()">📝 Create Post</div>
  <div class="menu" onclick="openReelModal()">🎬 Create Reel</div>
  <div class="menu" onclick="showPage('profile')">👤 My Profile</div>
 </div>

 <div class="card">
  <div style="padding:14px"><b>People you may know</b></div>
  <div id="suggestions"></div>
 </div>
</aside>

</div>

<div id="modal" class="modal hidden">
 <div id="modalBox" class="modalBox"></div>
</div>

<script>
/* =========================================================
   1. SUPABASE CONFIG
   ========================================================= */

const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

let db = null;
let currentUser = null;
let currentProfile = null;
let currentPage = "home";

function bootError(msg){
 document.getElementById("bootErrorText").textContent = msg;
 document.getElementById("bootError").classList.remove("hidden");
}

try{
 if(
   SUPABASE_URL.includes("YOUR_") ||
   SUPABASE_ANON_KEY.includes("YOUR_")
 ){
   throw new Error("Supabase URL এবং ANON KEY বসানো হয়নি।");
 }

 db = window.supabase.createClient(
   SUPABASE_URL,
   SUPABASE_ANON_KEY
 );
}catch(e){
 bootError(e.message);
}

/* =========================================================
   2. HELPERS
   ========================================================= */

function esc(v){
 if(v===null || v===undefined)return "";
 return String(v)
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
}

function timeAgo(date){
 if(!date)return "";
 const sec=Math.floor((Date.now()-new Date(date).getTime())/1000);
 if(sec<60)return "Just now";
 if(sec<3600)return Math.floor(sec/60)+"m";
 if(sec<86400)return Math.floor(sec/3600)+"h";
 if(sec<604800)return Math.floor(sec/86400)+"d";
 return new Date(date).toLocaleDateString();
}

function avatar(url){
 return url || "https://ui-avatars.com/api/?name=User&background=1877f2&color=fff";
}

function closeModal(){
 document.getElementById("modal").classList.add("hidden");
}

function modal(html){
 document.getElementById("modalBox").innerHTML=html;
 document.getElementById("modal").classList.remove("hidden");
}

function notify(msg){
 alert(msg);
}

async function safeQuery(fn){
 try{
   return await fn();
 }catch(e){
   console.error(e);
   return {data:null,error:e};
 }
}

/* =========================================================
   3. AUTH
   ========================================================= */

async function init(){
 if(!db)return;

 const {data,error}=await db.auth.getSession();

 if(error){
   bootError(error.message);
   return;
 }

 if(data.session){
   currentUser=data.session.user;
   await loadProfile();
   await showPage("home");
 }else{
   showLogin();
 }
}

async function loadProfile(){
 if(!currentUser)return;

 const {data,error}=await db
  .from("my social app")
  .select("*")
  .eq("id",currentUser.id)
  .maybeSingle();

 if(error){
   console.error(error);
   currentProfile={
     id:currentUser.id,
     name:currentUser.email?.split("@")[0] || "User",
     profile_photo:"",
     cover_photo:""
   };
 }else{
   currentProfile=data || {
     id:currentUser.id,
     name:currentUser.email?.split("@")[0] || "User",
     profile_photo:"",
     cover_photo:""
   };
 }

 updateMiniProfile();
}

function updateMiniProfile(){
 document.getElementById("miniName").textContent =
  currentProfile?.name || "User";

 document.getElementById("miniAvatar").src =
  avatar(currentProfile?.profile_photo);
}

function showLogin(){
 document.querySelector(".app").style.display="none";

 document.getElementById("page").innerHTML=`
 <div style="min-height:80vh;display:flex;align-items:center;justify-content:center">
  <div class="card" style="max-width:420px;width:100%;padding:25px">
   <h1 style="text-align:center;color:#1877f2">My Social App</h1>

   <input id="loginEmail" type="email" placeholder="Email">
   <input id="loginPassword" type="password" placeholder="Password">

   <button class="primary" style="width:100%" onclick="login()">
    Login
   </button>

   <hr>

   <button class="secondary" style="width:100%" onclick="showSignup()">
    Create new account
   </button>
  </div>
 </div>`;
}

function showSignup(){
 document.getElementById("page").innerHTML=`
 <div style="min-height:80vh;display:flex;align-items:center;justify-content:center">
  <div class="card" style="max-width:420px;width:100%;padding:25px">
   <h2>Create new account</h2>

   <input id="signupName" placeholder="Your name">
   <input id="signupEmail" type="email" placeholder="Email">
   <input id="signupPassword" type="password" placeholder="Password">

   <button class="primary" style="width:100%" onclick="signup()">
    Sign Up
   </button>

   <button class="secondary" style="width:100%;margin-top:8px" onclick="showLogin()">
    Back to Login
   </button>
  </div>
 </div>`;
}

async function signup(){
 const name=document.getElementById("signupName").value.trim();
 const email=document.getElementById("signupEmail").value.trim();
 const password=document.getElementById("signupPassword").value;

 if(!name||!email||!password){
  notify("সব তথ্য দিন");
  return;
 }

 const {data,error}=await db.auth.signUp({
  email,
  password
 });

 if(error){
  notify(error.message);
  return;
 }

 if(data.user){
  const {error:pError}=await db
   .from("my social app")
   .insert({
     id:data.user.id,
     name:name,
     profile_photo:"",
     cover_photo:""
   });

  if(pError)console.log(pError);
 }

 notify("Account তৈরি হয়েছে। Email verification লাগতে পারে।");
 showLogin();
}

async function login(){
 const email=document.getElementById("loginEmail").value.trim();
 const password=document.getElementById("loginPassword").value;

 if(!email||!password){
  notify("Email এবং Password দিন");
  return;
 }

 const {data,error}=await db.auth.signInWithPassword({
  email,password
 });

 if(error){
  notify(error.message);
  return;
 }

 currentUser=data.user;
 await loadProfile();

 document.querySelector(".app").style.display="grid";
 await showPage("home");
}

async function logout(){
 await db.auth.signOut();
 location.reload();
}

/* =========================================================
   4. PAGE ROUTER
   ========================================================= */

async function showPage(page){
 currentPage=page;

 if(!currentUser){
  showLogin();
  return;
 }

 if(page==="home")return renderHome();
 if(page==="reels")return renderReels();
 if(page==="profile")return renderProfile(currentUser.id);
 if(page==="friends")return renderFriends();
 if(page==="messages")return renderMessages();
 if(page==="creator")return renderCreator();
 if(page==="settings")return renderSettings();
}

/* =========================================================
   5. HOME FEED
   ========================================================= */

async function renderHome(){
 const page=document.getElementById("page");

 page.innerHTML=`
  <div class="card composer">
   <img class="avatar" src="${avatar(currentProfile?.profile_photo)}">
   <input placeholder="What's on your mind?"
    onclick="openPostModal()">
  </div>

  <div class="card">
   <div style="padding:12px;font-weight:bold">Stories</div>
   <div class="storyRow">
    <div class="story" onclick="openStoryModal()">
     <div style="height:100%;display:flex;align-items:center;justify-content:center;font-size:35px">
      ➕
     </div>
     <span>Create Story</span>
    </div>
    <div id="storiesRow"></div>
   </div>
  </div>

  <div id="feed">
   <div class="empty">Loading posts...</div>
  </div>`;

 await loadStories();
 await loadFeed();
 await loadSuggestions();
}

async function loadFeed(){
 const feed=document.getElementById("feed");

 const {data,error}=await db
  .from("posts")
  .select("*")
  .order("created_at",{ascending:false})
  .limit(50);

 if(error){
  feed.innerHTML=`<div class="card empty">
   Feed load error:<br>${esc(error.message)}
  </div>`;
  return;
 }

 if(!data?.length){
  feed.innerHTML=`<div class="card empty">
   এখনো কোনো post নেই।
  </div>`;
  return;
 }

 let html="";

 for(const post of data){
  html+=await postHTML(post);
 }

 feed.innerHTML=html;
}

async function postHTML(post){
 const id=post.id;

 let profile={
  name:"User",
  profile_photo:""
 };

 const {data:p}=await db
  .from("my social app")
  .select("id,name,profile_photo")
  .eq("id",post.user_id)
  .maybeSingle();

 if(p)profile=p;

 const {data:reaction}=await db
  .from("post_reactions")
  .select("reaction")
  .eq("post_id",id)
  .eq("user_id",currentUser.id)
  .maybeSingle();

 const {count:likeCount}=await db
  .from("post_reactions")
  .select("*",{count:"exact",head:true})
  .eq("post_id",id);

 const {count:commentCount}=await db
  .from("comments")
  .select("*",{count:"exact",head:true})
  .eq("post_id",id);

 return `
 <article class="card">
  <div class="postHead">
   <img class="avatar" src="${avatar(profile.profile_photo)}"
    onclick="renderProfile('${post.user_id}')">
   <div style="flex:1">
    <div class="name">${esc(profile.name)}</div>
    <div class="small">${timeAgo(post.created_at)}
     ${post.privacy ? " · "+esc(post.privacy):""}
    </div>
   </div>
   ${post.user_id===currentUser.id?
    `<button onclick="deletePost(${id})">⋮</button>`:""}
  </div>

  ${post.feeling?`<div class="postBody">Feeling ${esc(post.feeling)}</div>`:""}

  ${post.text?`<div class="postBody">${esc(post.text)}</div>`:""}

  ${post.image_url?
   `<img class="postImg" src="${esc(post.image_url)}" loading="lazy">`
   :""
  }

  <div class="postStats">
   <span>❤️ ${likeCount||0}</span>
   <span>${commentCount||0} comments</span>
  </div>

  <div class="postButtons">
   <button class="${reaction?'liked':''}"
    onclick="toggleLike(${id})">
    ${reaction?'❤️ Liked':'👍 Like'}
   </button>

   <button onclick="toggleComments(${id})">
    💬 Comment
   </button>

   <button onclick="sharePost(${id})">
    ↗ Share
   </button>
  </div>

  <div id="comments-${id}" class="comments hidden"></div>
 </article>`;
}

/* =========================================================
   6. CREATE POST
   ========================================================= */

function openPostModal(){
 modal(`
  <div class="modalTitle">
   <h2>Create Post</h2>
   <button class="close" onclick="closeModal()">✕</button>
  </div>

  <textarea id="postText" rows="5"
   placeholder="What's on your mind?"></textarea>

  <input id="postImage" type="url"
   placeholder="Image URL (optional)">

  <input id="postFeeling"
   placeholder="Feeling (optional)">

  <select id="postPrivacy">
   <option value="public">Public</option>
   <option value="friends">Friends</option>
   <option value="only_me">Only me</option>
  </select>

  <button class="primary" style="width:100%"
   onclick="createPost()">
   Publish
  </button>
 `);
}

async function createPost(){
 const text=document.getElementById("postText").value.trim();
 const image=document.getElementById("postImage").value.trim();
 const feeling=document.getElementById("postFeeling").value.trim();
 const privacy=document.getElementById("postPrivacy").value;

 if(!text&&!image){
  notify("Text অথবা Image দিন");
  return;
 }

 const payload={
  user_id:currentUser.id,
  text:text,
  image_url:image,
  privacy:privacy,
  feeling:feeling,
  promoted:false,
  view_count:0
 };

 const {error}=await db.from("posts").insert(payload);

 if(error){
  notify("Post হয়নি: "+error.message);
  return;
 }

 closeModal();
 renderHome();
}

/* =========================================================
   7. LIKE
   ========================================================= */

async function toggleLike(postId){
 const {data:existing}=await db
  .from("post_reactions")
  .select("*")
  .eq("post_id",postId)
  .eq("user_id",currentUser.id)
  .maybeSingle();

 if(existing){
  await db.from("post_reactions")
   .delete()
   .eq("post_id",postId)
   .eq("user_id",currentUser.id);
 }else{
  await db.from("post_reactions").insert({
   post_id:postId,
   user_id:currentUser.id,
   reaction:"like"
  });
 }

 renderHome();
}

/* =========================================================
   8. COMMENTS
   ========================================================= */

async function toggleComments(postId){
 const box=document.getElementById("comments-"+postId);

 if(!box)return;

 if(!box.classList.contains("hidden")){
  box.classList.add("hidden");
  return;
 }

 box.classList.remove("hidden");

 const {data,error}=await db
  .from("comments")
  .select("*")
  .eq("post_id",postId)
  .order("created_at",{ascending:true});

 let html="";

 if(!error && data){
  for(const c of data){
   let p=null;

   const {data:pp}=await db
    .from("my social app")
    .select("name,profile_photo")
    .eq("id",c.user_id)
    .maybeSingle();

   p=pp;

   html+=`
    <div class="comment">
     <img class="avatar" style="width:34px;height:34px"
      src="${avatar(p?.profile_photo)}">
     <div class="commentBubble">
      <b>${esc(p?.name||"User")}</b><br>
      ${esc(c.comment||c.text||"")}
     </div>
    </div>`;
  }
 }

 html+=`
  <div class="commentForm">
   <input id="commentInput-${postId}" placeholder="Write a comment...">
   <button onclick="addComment(${postId})">➤</button>
  </div>`;

 box.innerHTML=html;
}

async function renderProfile(userId){
 currentPage="profile";

 const page=document.getElementById("page");

 const {data:p}=await db
  .from("my social app")
  .select("*")
  .eq("id",userId)
  .maybeSingle();

 const profile=p||{
  id:userId,
  name:"User",
  profile_photo:"",
  cover_photo:""
 };

 const {count:followerCount}=await db
  .from("follows")
  .select("*",{count:"exact",head:true})
  .eq("following_id",userId);

 const {count:followingCount}=await db
  .from("follows")
  .select("*",{count:"exact",head:true})
  .eq("follower_id",userId);

 let following=false;

 if(userId!==currentUser.id){
  const {data:f}=await db
   .from("follows")
   .select("*")
   .eq("follower_id",currentUser.id)
   .eq("following_id",userId)
   .maybeSingle();

  following=!!f;
 }

 const {data:posts}=await db
  .from("posts")
  .select("*")
  .eq("user_id",userId)
  .order("created_at",{ascending:false});

 page.innerHTML=`
  <div class="card">
   <div class="profileCover"
    style="background-image:url('${esc(profile.cover_photo||"")}')">
   </div>

   <div class="profileInfo">
    <img class="avatar bigAvatar"
     src="${avatar(profile.profile_photo)}">

    <h2>${esc(profile.name||"User")}</h2>

    <div style="color:#777">
     ${followerCount||0} Followers ·
     ${followingCount||0} Following
    </div>

    <div style="margin-top:12px">
     ${userId===currentUser.id
      ?`<button class="primary" onclick="openEditProfile()">Edit Profile</button>`
      :`<button class="primary" onclick="toggleFollow('${userId}')">
       ${following?"Following":"Follow"}
      </button>`
     }
    </div>
   </div>
  </div>

  <div id="profilePosts"></div>`;

 const box=document.getElementById("profilePosts");

 if(!posts?.length){
  box.innerHTML=`<div class="card empty">No posts.</div>`;
 }else{
  for(const p of posts){
   box.innerHTML+=await postHTML(p);
  }
 }
}

async function toggleFollow(userId){
 const {data}=await db
  .from("follows")
  .select("*")
  .eq("follower_id",currentUser.id)

  .maybeSingle();

 if(data){
  await db.from("follows").delete()
   .eq("follower_id",currentUser.id)
   .eq("following_id",userId);
 }else{
  await db.from("follows").insert({
   follower_id:currentUser.id,

  });

  await db.from("notifications").insert({
   receiver_id:userId,
   message:(currentProfile?.name||"Someone")+" started following you",
   read:false
  });
 }

 renderProfile(userId);
}

async function saveCreatorSettings(){

  document.getElementById("monetizationToggle").checked;

 const payout_email=
  document.getElementById("payoutEmail").value.trim();

 const payout_method=
  document.getElementById("payoutMethod").value;

 const {data:existing}=await db
  .from("creator_settings")
  .select("user_id")
  .eq("user_id",currentUser.id)
  .maybeSingle();

 let result;

 if(existing){
  result=await db.from("creator_settings")
   .update({
    monetization_enabled,
    payout_email,
    payout_method,
    updated_at:new Date().toISOString()
   })
   .eq("user_id",currentUser.id);
 }else{
  result=await db.from("creator_settings")
   .insert({
    user_id:currentUser.id,
    monetization_enabled,
    payout_email,
    payout_method
   });
 }

 if(result.error)notify(result.error.message);
 else notify("Settings saved");
}
