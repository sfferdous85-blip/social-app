<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1877f2">

<title>FriendBook</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:#f0f2f5;
  color:#111;
}

body.dark{
  background:#18191a;
  color:#eee;
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

.top{
  position:sticky;
  top:0;
  z-index:1000;
  background:#1877f2;
  color:white;
  padding:10px;
  box-shadow:0 2px 8px #0002;
}

.topin{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:10px;
}

.logo{
  font-size:24px;
  font-weight:bold;
}

.search{
  flex:1;
}

.search input{
  width:100%;
  padding:10px 15px;
  border:0;
  border-radius:25px;
  outline:0;
}

.nav{
  max-width:1100px;
  margin:auto;
  display:flex;
  overflow:auto;
  gap:6px;
  padding:7px 0;
}

.nav button{
  white-space:nowrap;
  border:0;
  background:#ffffff22;
  color:white;
  padding:9px 13px;
  border-radius:8px;
}

.nav button:hover{
  background:#ffffff40;
}

.container{
  max-width:800px;
  margin:15px auto;
  padding:0 10px;
}

.card{
  background:white;
  border-radius:12px;
  margin-bottom:14px;
  padding:14px;
  box-shadow:0 1px 4px #0002;
}

.dark .card{
  background:#242526;
  color:#eee;
}

.auth{
  max-width:430px;
  margin:50px auto;
  padding:20px;
}

.auth h1{
  text-align:center;
  color:#1877f2;
}

.input{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:8px;
  margin:5px 0;
  outline:none;
}

.dark .input{
  background:#3a3b3c;
  color:white;
  border-color:#555;
}

.btn{
  border:0;
  border-radius:8px;
  padding:10px 15px;
  margin:3px;
  background:#1877f2;
  color:white;
}

.btn.gray{
  background:#e4e6eb;
  color:#111;
}

.dark .btn.gray{
  background:#3a3b3c;
  color:white;
}

.btn.red{
  background:#e41e3f;
}

.btn.green{
  background:#42b72a;
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd;
}

.avatar.big{
  width:90px;
  height:90px;
}

.userrow{
  display:flex;
  align-items:center;
  gap:10px;
}

.username{
  font-weight:bold;
}

.muted{
  color:#777;
  font-size:13px;
}

.dark .muted{
  color:#aaa;
}

.posttext{
  white-space:pre-wrap;
  line-height:1.5;
  margin:10px 0;
}

.postimg{
  width:100%;
  max-height:600px;
  object-fit:cover;
  border-radius:10px;
}

.actions{
  display:flex;
  gap:5px;
  border-top:1px solid #ddd;
  border-bottom:1px solid #ddd;
  margin-top:10px;
  padding:5px 0;
}

.dark .actions{
  border-color:#444;
}

.actions button{
  flex:1;
  border:0;
  background:transparent;
  padding:10px 5px;
  border-radius:7px;
}

.actions button:hover{
  background:#eee;
}

.dark .actions button:hover{
  background:#3a3b3c;
}

.comment{
  background:#f0f2f5;
  padding:8px;
  border-radius:10px;
  margin:6px 0;
}

.dark .comment{
  background:#3a3b3c;
}

.storybar{
  display:flex;
  gap:10px;
  overflow:auto;
  padding-bottom:5px;
}

.story{
  min-width:100px;
  height:150px;
  border-radius:12px;
  position:relative;
  overflow:hidden;
  background:#1877f2;
  color:white;
  padding:8px;
  cursor:pointer;
}

.story img{
  width:100%;
  height:100%;
  position:absolute;
  inset:0;
  object-fit:cover;
}

.story span{
  position:absolute;
  bottom:7px;
  left:7px;
  right:7px;
  font-weight:bold;
  text-shadow:0 1px 4px #000;
}

.reels{
  background:#000;
  border-radius:12px;
  overflow:hidden;
}

.reel{
  height:80vh;
  min-height:500px;
  position:relative;
  background:#000;
  margin-bottom:10px;
}

.reel video{
  width:100%;
  height:100%;
  object-fit:cover;
}

.reelinfo{
  position:absolute;
  left:15px;
  right:15px;
  bottom:20px;
  color:white;
  text-shadow:0 1px 5px #000;
}

.reelbuttons{
  position:absolute;
  right:12px;
  bottom:30px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.reelbuttons button{
  width:50px;
  height:50px;
  border-radius:50%;
  border:0;
  background:#0008;
  color:white;
}

.profile-cover{
  height:220px;
  background:#1877f2;
  border-radius:12px 12px 0 0;
  background-size:cover;
  background-position:center;
}

.profilebox{
  text-align:center;
  margin-top:-55px;
  position:relative;
}

.profile-actions{
  margin-top:10px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.item{
  background:white;
  padding:15px;
  border-radius:10px;
  box-shadow:0 1px 4px #0002;
}

.dark .item{
  background:#242526;
}

.stat{
  text-align:center;
  padding:10px;
}

.stat b{
  display:block;
  font-size:22px;
}

.menu{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.menu button{
  padding:14px;
  border:0;
  border-radius:10px;
  background:#e4e6eb;
}

.dark .menu button{
  background:#3a3b3c;
  color:white;
}

.modal{
  position:fixed;
  inset:0;
  background:#0008;
  z-index:5000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modalbox{
  width:min(600px,100%);
  max-height:90vh;
  overflow:auto;
  background:white;
  color:#111;
  border-radius:15px;
  padding:18px;
}

.dark .modalbox{
  background:#242526;
  color:white;
}

.toast{
  position:fixed;
  left:50%;
  bottom:20px;
  transform:translateX(-50%);
  background:#111;
  color:white;
  padding:12px 18px;
  border-radius:25px;
  z-index:9999;
}

.loading{
  text-align:center;
  padding:30px;
}

@media(max-width:600px){
  .logo{
    font-size:20px;
  }

  .container{
    padding:0 6px;
  }

  .card{
    border-radius:8px;
  }

  .reel{
    height:calc(100vh - 120px);
  }

  .profile-cover{
    height:170px;
  }
}
</style>
</head>

<body>

<div id="authBox" class="auth card">
  <h1>FriendBook</h1>

  <input id="email" class="input" type="email" placeholder="Email">

  <input id="password" class="input" type="password" placeholder="Password">

  <button class="btn" onclick="login()">Login</button>

  <button class="btn green" onclick="signup()">Create New Account</button>

  <p id="authMsg" class="muted"></p>
</div>

<div id="app" class="hidden">

<header class="top">

  <div class="topin">

    <div class="logo">FriendBook</div>

    <div class="search">
      <input
        id="searchInput"
        placeholder="Search people, posts, #hashtag..."
        onkeydown="if(event.key==='Enter')searchAll()"
      >
    </div>

    <button class="btn gray" onclick="logout()">Logout</button>

  </div>

  <nav class="nav">

    <button onclick="showPage('home')">🏠 Home</button>

    <button onclick="showPage('reels')">🎬 Reels</button>

    <button onclick="showPage('messages')">💬 Messages</button>

    <button onclick="showPage('notifications')">🔔 Notifications</button>

    <button onclick="showPage('profile')">👤 Profile</button>

    <button onclick="showPage('friends')">👥 Friends</button>

    <button onclick="showPage('groups')">👥 Groups</button>

    <button onclick="showPage('pages')">📄 Pages</button>

    <button onclick="showPage('marketplace')">🛍️ Marketplace</button>

    <button onclick="showPage('events')">📅 Events</button>

    <button onclick="showPage('creator')">💰 Creator</button>

    <button onclick="showPage('settings')">⚙️ Settings</button>

  </nav>

</header>

<main id="main" class="container"></main>

</div>

<div id="modal" class="modal hidden">
  <div id="modalBox" class="modalbox"></div>
</div>

<div id="toast" class="toast hidden"></div>

<script>

const SUPABASE_URL =
"https://skereuaizdczbvjplisi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_3R2otJA1zIlsMsTYxe1ocw_NAPY5O9x";

const sb =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser=null;
let currentProfile=null;
let currentPage="home";

function toast(msg){

  const t=document.getElementById("toast");

  t.textContent=msg;
  t.classList.remove("hidden");

  clearTimeout(window.toastTimer);

  window.toastTimer=setTimeout(()=>{
    t.classList.add("hidden");
  },2500);
}

function escapeHTML(value){

  if(value===null || value===undefined) return "";

  return String(value)
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
}

function closeModal(){
  document.getElementById("modal").classList.add("hidden");
}

function openModal(html){

  document.getElementById("modalBox").innerHTML=html;

  document.getElementById("modal").classList.remove("hidden");
}

async function login(){

  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;

  if(!email || !password){
    document.getElementById("authMsg").textContent=
      "Email এবং Password দিন";
    return;
  }

  document.getElementById("authMsg").textContent="Login হচ্ছে...";

  const {data,error}=await sb.auth.signInWithPassword({
    email,
    password
  });

  if(error){

    document.getElementById("authMsg").textContent=
      error.message;

    return;
  }

  currentUser=data.user;

  await startApp();
}

async function signup(){

  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;

  if(!email || password.length<6){

    document.getElementById("authMsg").textContent=
      "Email দিন এবং Password কমপক্ষে ৬ অক্ষরের করুন";

    return;
  }

  const {data,error}=await sb.auth.signUp({
    email,
    password
  });

  if(error){

    document.getElementById("authMsg").textContent=
      error.message;

    return;
  }

  if(data.user){

    currentUser=data.user;

    await createProfileIfMissing();

    toast("Account তৈরি হয়েছে");

    await startApp();
  }
}

async function logout(){

  await sb.auth.signOut();

  currentUser=null;
  currentProfile=null;

  document.getElementById("app").classList.add("hidden");
  document.getElementById("authBox").classList.remove("hidden");
}

async function createProfileIfMissing(){

  if(!currentUser) return;

  const {data}=await sb
    .from("fb_profiles")
    .select("*")
    .eq("id",currentUser.id)
    .maybeSingle();

  if(!data){

    const name=
      currentUser.email
      ? currentUser.email.split("@")[0]
      : "User";

    await sb.from("fb_profiles").insert({
      id:currentUser.id,
      name:name,
      username:name.toLowerCase().replace(/[^a-z0-9]/g,""),
      bio:"",
      profile_photo:"",
      cover_photo:""
    });
  }
}

async function loadProfile(){

  if(!currentUser) return;

  await createProfileIfMissing();

  const {data}=await sb
    .from("fb_profiles")
    .select("*")
    .eq("id",currentUser.id)
    .maybeSingle();

  currentProfile=data;
}

async function startApp(){

  document.getElementById("authBox").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");

  await loadProfile();

  await showPage("home");
}

async function showPage(page){

  currentPage=page;

  const main=document.getElementById("main");

  main.innerHTML=
    '<div class="loading">লোড হচ্ছে...</div>';

  if(page==="home") await renderHome();
  else if(page==="reels") await renderReels();
  else if(page==="profile") await renderProfile(currentUser.id);
  else if(page==="messages") await renderMessages();
  else if(page==="notifications") await renderNotifications();
  else if(page==="friends") await renderFriends();
  else if(page==="groups") await renderGroups();
  else if(page==="pages") await renderPages();
  else if(page==="marketplace") await renderMarketplace();
  else if(page==="events") await renderEvents();
  else if(page==="creator") await renderCreator();
  else if(page==="settings") await renderSettings();
  else if(page==="search") await searchAll();
}

async function renderHome(){

  const main=document.getElementById("main");

  main.innerHTML=`

    <div class="card">
      <div class="userrow">
        <img
          class="avatar"
          src="${escapeHTML(currentProfile?.profile_photo || '')}"
          onerror="this.src='https://ui-avatars.com/api/?name=User'"
        >

        <button
          class="btn gray"
          style="flex:1;text-align:left"
          onclick="openCreatePost()"
        >
          What's on your mind?
        </button>
      </div>

      <div style="margin-top:10px">
        <button class="btn" onclick="openCreatePost()">📝 Post</button>
        <button class="btn" onclick="openCreatePost('photo')">📷 Photo</button>
        <button class="btn" onclick="openCreateStory()">📖 Story</button>
        <button class="btn" onclick="showPage('reels')">🎬 Reel</button>
      </div>
    </div>

    <div class="card">
      <h3>📖 Stories</h3>
      <div id="storyBar" class="storybar"></div>
    </div>

    <div id="feed">
      <div class="loading">Posts লোড হচ্ছে...</div>
    </div>
  `;

  await renderStories();

  await loadPosts();
}

async function loadPosts(){

  const feed=document.getElementById("feed");

  const {data,error}=await sb
    .from("fb_posts")
    .select("*")
    .order("created_at",{ascending:false})
    .limit(50);

  if(error){

    feed.innerHTML=
      `<div class="card">Post load error: ${escapeHTML(error.message)}</div>`;

    return;
  }

  if(!data || !data.length){

    feed.innerHTML=
      `<div class="card">এখনো কোনো Post নেই। প্রথম Post করুন।</div>`;

    return;
  }

  const ids=data.map(x=>x.user_id);

  const {data:profiles}=await sb
    .from("fb_profiles")
    .select("*")
    .in("id",ids);

  const profileMap={};

  (profiles||[]).forEach(p=>{
    profileMap[p.id]=p;
  });

  feed.innerHTML="";

  for(const post of data){

    feed.insertAdjacentHTML(
      "beforeend",
      await postHTML(post,profileMap[post.user_id])
    );
  }
}

async function postHTML(post,profile){

  const {data:reactionRows}=await sb
    .from("fb_post_reactions")
    .select("reaction,user_id")
    .eq("post_id",post.id);

  const reactions=reactionRows||[];

  const mine=
    reactions.find(x=>x.user_id===currentUser.id);

  const likes=reactions.length;

  const {count:comments}=await sb
    .from("fb_comments")
    .select("*",{count:"exact",head:true})
    .eq("post_id",post.id);

  const {count:views}=await sb
    .from("fb_post_views")
    .select("*",{count:"exact",head:true})
    .eq("post_id",post.id);

  const saved=await isSaved(post.id);

  return `

  <article class="card">

    <div class="userrow">

      <img
        class="avatar"
        src="${escapeHTML(profile?.profile_photo||'')}"
        onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(profile?.name||'User')}'"
      >

      <div style="flex:1">

        <div
          class="username"
          onclick="renderProfile('${post.user_id}')"
          style="cursor:pointer"
        >
          ${escapeHTML(profile?.name||"User")}
        </div>

        <div class="muted">
          ${new Date(post.created_at).toLocaleString()}
          ${post.location ? " · 📍"+escapeHTML(post.location):""}
        </div>

      </div>

      ${
        post.user_id===currentUser.id
        ?
        `<button
          class="btn gray"
          onclick="postMenu(${post.id})"
        >⋯</button>`
        :
        `<button
          class="btn gray"
          onclick="reportItem('post',${post.id})"
        >🚩</button>`
      }

    </div>

    <div class="posttext">
      ${escapeHTML(post.text||"")}
    </div>

    ${
      post.image_url
      ?
      `<img
        class="postimg"
        src="${escapeHTML(post.image_url)}"
      >`
      :""
    }

    <div class="muted" style="margin-top:8px">
      ❤️ ${likes}
      &nbsp; 💬 ${comments||0}
      &nbsp; 👁️ ${views||0}
    </div>

    <div class="actions">

      <button onclick="reactPost(${post.id},'like')">
        ${mine?.reaction==="like"?"❤️":"🤍"} Like
      </button>

      <button onclick="reactPost(${post.id},'love')">
        ❤️ Love
      </button>

      <button onclick="reactPost(${post.id},'haha')">
        😂 Haha
      </button>

      <button onclick="focusComment(${post.id})">
        💬 Comment
      </button>

      <button onclick="savePost(${post.id})">
        ${saved?"📌":"🔖"} Save
      </button>

      <button onclick="sharePost(${post.id})">
        ↗ Share
      </button>

    </div>

    <div id="comments-${post.id}">
      <div class="muted" style="margin-top:10px">
        Comments load হচ্ছে...
      </div>
    </div>

    <div style="display:flex;gap:5px;margin-top:8px">

      <input
        id="comment-${post.id}"
        class="input"
        placeholder="Write a comment..."
      >

      <button
        class="btn"
        onclick="addComment(${post.id})"
      >
        Send
      </button>

    </div>

  </article>
  `;
}

async function reactPost(postId,reaction){

  const {data:old}=await sb
    .from("fb_post_reactions")
    .select("id,reaction")
    .eq("post_id",postId)
    .eq("user_id",currentUser.id)
    .maybeSingle();

  if(old){

    if(old.reaction===reaction){

      await sb
        .from("fb_post_reactions")
        .delete()
        .eq("id",old.id);

    }else{

      await sb
        .from("fb_post_reactions")
        .update({reaction})
        .eq("id",old.id);
    }

  }else{

    await sb
      .from("fb_post_reactions")
      .insert({
        post_id:postId,
        user_id:currentUser.id,
        reaction
      });

    await makeNotificationForPost(postId,"reaction");
  }

  await loadPosts();

  toast("Reaction updated");
}

async function addComment(postId){

  const input=document.getElementById("comment-"+postId);

  const text=input.value.trim();

  if(!text) return;

  const {error}=await sb
    .from("fb_comments")
    .insert({
      post_id:postId,
      user_id:currentUser.id,
      text:text
    });

  if(error){

    toast(error.message);
    return;
  }

  input.value="";

  await makeNotificationForPost(postId,"comment");

  await loadPosts();

  toast("Comment added");
}

async function loadComments(postId){

  const box=document.getElementById("comments-"+postId);

  if(!box) return;

  const {data}=await sb
    .from("fb_comments")
    .select("*")
    .eq("post_id",postId)
    .order("created_at",{ascending:true});

  if(!data || !data.length){

    box.innerHTML="";
    return;
  }

  const ids=data.map(x=>x.user_id);

  const {data:profiles}=await sb
    .from("fb_profiles")
    .select("*")
    .in("id",ids);

  const map={};

  (profiles||[]).forEach(p=>{
    map[p.id]=p;
  });

  box.innerHTML=data.map(c=>`

    <div class="comment">

      <div class="userrow">

        <img
          class="avatar"
          src="${escapeHTML(map[c.user_id]?.profile_photo||'')}"
          onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(map[c.user_id]?.name||'User')}'"
        >

        <div>

          <b>${escapeHTML(map[c.user_id]?.name||"User")}</b>

          <div class="muted">
            ${new Date(c.created_at).toLocaleString()}
          </div>

        </div>

      </div>

      <div style="margin-top:5px">
        ${escapeHTML(c.text)}
      </div>

      <button
        class="btn gray"
        onclick="likeComment(${c.id})"
      >
        ❤️ Like
      </button>

      <button
        class="btn gray"
        onclick="replyComment(${c.id},${postId})"
      >
        ↩ Reply
      </button>

      ${
        c.user_id===currentUser.id
        ?
        `<button
          class="btn gray"
          onclick="deleteComment(${c.id})"
        >
          Delete
        </button>`
        :""
      }

    </div>

  `).join("");
}

async function focusComment(postId){

  const input=document.getElementById("comment-"+postId);

  if(input){
    input.focus();
  }

  await loadComments(postId);
}

async function likeComment(commentId){

  const {data}=await sb
    .from("fb_comment_likes")
    .select("id")
    .eq("comment_id",commentId)

async function uploadFile(file,path){

  if(!file) return null;

  const ext=
    file.name.split(".").pop() || "jpg";

  const filename=
    `${path}/${currentUser.id}_${Date.now()}.${ext}`;

  const {error}=await sb.storage
    .from("post-images")
    .upload(filename,file,{
      upsert:false
    });

  if(error){

    toast("Upload error: "+error.message);

    return null;
  }

  const {data}=sb.storage
    .from("post-images")
    .getPublicUrl(filename);

  return data.publicUrl;
}

async function extractHashtags(postId,text){

  const tags=
    (text.match(/#[\w\u0980-\u09FF]+/g)||[])
    .map(x=>x.substring(1).toLowerCase());

  for(const tag of tags){

    let {data}=await sb
      .from("fb_hashtags")
      .select("*")
      .eq("name",tag)
      .maybeSingle();

    if(!data){

      const result=await sb
        .from("fb_hashtags")
        .insert({name:tag})
        .select()
        .single();

      data=result.data;
    }

    if(data){

      await sb
        .from("fb_post_hashtags")
        .insert({
          post_id:postId,
          hashtag_id:data.id
        });
    }
  }
}

function setupReels(){

  const observer=
    new IntersectionObserver(entries=>{

      entries.forEach(entry=>{

        const video=
          entry.target.querySelector("video");

        if(!video) return;

        if(entry.isIntersecting){

          video.play().catch(()=>{});

        }else{

          video.pause();
        }

      });

    },{
      threshold:.6
    });

  document
    .querySelectorAll(".reel")
    .forEach(x=>observer.observe(x));
}

function toggleReelSound(video){

  if(!video) return;

  video.muted=!video.muted;

  if(!video.paused){
    video.play().catch(()=>{});
  }
}

  if(cf){

      await uploadFile(cf,"covers");

  }

    name:document.getElementById("profileName").value,
    username:document.getElementById("profileUsername").value,
    bio:document.getElementById("profileBio").value,

    .from("fb_profiles")
    .update(updates)
    .eq("id",currentUser.id);

async function startChat(userId){

async function openChat(userId){

  const {data:profile}=await sb
    .from("fb_profiles")
    .select("*")
    .eq("id",userId)
    .maybeSingle();

  if(!profile){

    toast("User পাওয়া যায়নি");
    return;
  }

  const {data:messages}=await sb
    .from("fb_messages")
    .select("*")
    .or(
      `and(sender_id.eq.${currentUser.id},receiver_id.eq.${userId}),and(sender_id.eq.${userId},receiver_id.eq.${currentUser.id})`
    )
    .order("created_at",{ascending:true});

  openModal(`

    <h3>
      💬 ${escapeHTML(profile.name||"User")}
    </h3>

    <div
      id="chatMessages"
      style="max-height:50vh;overflow:auto"
    >

      ${(messages||[]).map(m=>`

        <div
          class="comment"
          style="text-align:${m.sender_id===currentUser.id?"right":"left"}"
        >
          ${escapeHTML(m.text||"")}
          <div class="muted">
            ${new Date(m.created_at).toLocaleString()}
            ${m.seen?" · Seen":""}
          </div>
        </div>

      `).join("")}

    </div>

    <div style="display:flex">

      <input
        id="messageText"
        class="input"
        placeholder="Message..."
      >

      <button
        class="btn"
        onclick="sendMessage('${userId}')"
      >
        Send
      </button>

    </div>

  `);

  await sb
    .from("fb_messages")
    .update({seen:true})
    .eq("sender_id",userId)
    .eq("receiver_id",currentUser.id);
}

async function sendMessage(userId){

  const text=
    document.getElementById("messageText").value.trim();

  if(!text) return;

  const {error}=await sb
    .from("fb_messages")
    .insert({
      sender_id:currentUser.id,
      receiver_id:userId,
      text:text,
      seen:false
    });

  if(error){

    toast(error.message);
    return;
  }

  await notifyUser(
    userId,
    "message",
    "আপনাকে নতুন Message পাঠিয়েছে"
  );

  await openChat(userId);
}

async function saveCreatorSettings(){

  const enabled=
    document.getElementById("monetization").checked;

  const payoutMethod=
    document.getElementById("payoutMethod").value;

  const payoutEmail=
    document.getElementById("payoutEmail").value;

  const {data:old}=await sb
    .from("fb_creator_settings")
    .select("*")
    .eq("user_id",currentUser.id)
    .maybeSingle();

  let result;

  if(old){

    result=await sb
      .from("fb_creator_settings")
      .update({
        monetization_enabled:enabled,
        payout_method:payoutMethod,
        payout_email:payoutEmail,
        updated_at:new Date().toISOString()
      })
      .eq("user_id",currentUser.id);

  }else{

    result=await sb
      .from("fb_creator_settings")
      .insert({
        user_id:currentUser.id,
        monetization_enabled:enabled,
        payout_method:payoutMethod,
        payout_email:payoutEmail,
        updated_at:new Date().toISOString()
      });
  }

  if(result.error){

    toast(result.error.message);
    return;
  }

  toast("Creator settings saved");

  await renderCreator();
}

async function privacySettings(){

  openModal(`

    <h3>🔒 Privacy Settings</h3>

    <select id="profilePrivacy" class="input">

      <option value="public">Profile Public</option>
      <option value="friends">Friends Only</option>
      <option value="private">Only Me</option>

    </select>

      <option value="everyone">Everyone can message</option>
      <option value="friends">Friends only</option>

    </select>

    <button
      class="btn"
      onclick="savePrivacy()"
    >
      Save
    </button>

  `);
}

async function savePrivacy(){

  const profilePrivacy=
    document.getElementById("profilePrivacy").value;

  const messagePrivacy=
    document.getElementById("messagePrivacy").value;

  const {data:old}=await sb
    .from("fb_user_settings")
    .select("*")
    .eq("user_id",currentUser.id)
    .maybeSingle();

  const values={
    user_id:currentUser.id,
    profile_privacy:profilePrivacy,
    message_privacy:messagePrivacy,
    updated_at:new Date().toISOString()
  };

  if(old){

    await sb
      .from("fb_user_settings")
      .update(values)
      .eq("user_id",currentUser.id);

  }else{

    await sb
      .from("fb_user_settings")
      .insert(values);
  }

  closeModal();

  toast("Privacy settings saved");
}

async function savedPosts(){

  const {data}=await sb
    .from("fb_saved_posts")
    .select("*")
    .eq("user_id",currentUser.id)
    .order("created_at",{ascending:false});

  if(!data?.length){

    openModal(`
      <h3>📌 Saved Posts</h3>
      <p>কোনো Saved Post নেই।</p>
      <button class="btn" onclick="closeModal()">Close</button>
    `);

    return;
  }

  const ids=data.map(x=>x.post_id);

  const {data:posts}=await sb
    .from("fb_posts")
    .select("*")
    .in("id",ids);

  openModal(`

    <h3>📌 Saved Posts</h3>

    ${
      (posts||[]).map(p=>`

        <div class="comment">

          ${escapeHTML(p.text||"")}

          <br>

          <button
            class="btn"
            onclick="closeModal();renderProfile('${p.user_id}')"
          >
            View
          </button>

        </div>

      `).join("")
    }

    <button
      class="btn gray"
      onclick="closeModal()"
    >
      Close
    </button>

  `);
}

async function blockedUsers(){

  const {data}=await sb
    .from("fb_blocks")
    .select("*")
    .eq("user_id",currentUser.id);

  openModal(`

    <h3>🚫 Blocked Users</h3>

    ${
      data?.length
      ?
      data.map(b=>`

        <div class="comment">

          ${escapeHTML(b.blocked_id)}

          <button
            class="btn"
            onclick="unblockUser('${b.blocked_id}')"

            Unblock
          </button>

        </div>

      `).join("")
      :
      `<p>কেউ Block করা নেই।</p>`

    <button
      class="btn gray"
      onclick="closeModal()"

}

async function unblockUser(id){

  await sb
    .from("fb_blocks")
    .delete()
    .eq("user_id",currentUser.id)
    .eq("blocked_id",id);

  await blockedUsers();
}

function toggleTheme(){

  document.body.classList.toggle("dark");

  localStorage.setItem(
    "friendbook-dark",
    document.body.classList.contains("dark")
  );
}

function loadTheme(){

  if(localStorage.getItem("friendbook-dark")==="true"){
    document.body.classList.add("dark");
  }
}

async function reportItem(type,id){

  const reason=
    prompt(
      "Report reason লিখুন:\nspam / abuse / fake / copyright / other"
    );

  if(!reason) return;

  const details=
    prompt("আরও বিস্তারিত লিখতে পারেন")||"";

  const {error}=await sb
    .from("fb_reports")
    .insert({
      reporter_id:currentUser.id,
      target_type:type,
      target_id:id,
      reason,
      details,
      status:"pending"
    });

  if(error){

    toast(error.message);
    return;
  }

  toast("Report submitted");
}

async function searchAll(){

  const q=
    document.getElementById("searchInput").value.trim();

  if(!q) return;

  const main=document.getElementById("main");

  main.innerHTML=
    `<div class="loading">Search হচ্ছে...</div>`;

  const clean=q.replace(/^#/,"");

  const {data:people}=await sb
    .from("fb_profiles")
    .select("*")
    .or(
      `name.ilike.%${clean}%,username.ilike.%${clean}%`
    )
    .limit(20);

  const {data:posts}=await sb
    .from("fb_posts")
    .select("*")
    .ilike("text","%"+clean+"%")
    .limit(20);

  main.innerHTML=`

    <div class="card">

      <h2>🔎 Search: ${escapeHTML(q)}</h2>

    </div>

    <div class="card">

      <h3>👤 People</h3>

      ${
        people?.length
        ?
        people.map(p=>`

          <div class="userrow card">

            <img
              class="avatar"
              src="${escapeHTML(p.profile_photo||'')}"
            >

            <div style="flex:1">
              <b>${escapeHTML(p.name||"User")}</b>
              <div class="muted">
                @${escapeHTML(p.username||"")}
              </div>
            </div>

            <button
              class="btn"
              onclick="renderProfile('${p.id}')"
            >
              View
            </button>

          </div>

        `).join("")
        :
        `<p class="muted">People পাওয়া যায়নি</p>`
      }

    </div>

    <div class="card">

      <h3>📝 Posts</h3>

      <div id="searchPosts"></div>

    </div>

  `;

  const box=document.getElementById("searchPosts");

  if(!posts?.length){

    box.innerHTML=
      `<p class="muted">Post পাওয়া যায়নি</p>`;

    return;
  }

  const ids=[...new Set(posts.map(p=>p.user_id))];

  const {data:profiles}=await sb
    .from("fb_profiles")
    .select("*")
    .in("id",ids);

  const map={};

  (profiles||[]).forEach(p=>map[p.id]=p);

  for(const p of posts){

    box.insertAdjacentHTML(
      "beforeend",
      await postHTML(p,map[p.user_id])
    );
  }
}

async function boot(){

  loadTheme();

  const {data,error}=await sb.auth.getSession();

  if(error){

    document.getElementById("authMsg").textContent=
      error.message;

    return;
  }

  if(data?.session){

    currentUser=data.session.user;

    await startApp();

  }else{

    document.getElementById("authBox")
      .classList.remove("hidden");

    document.getElementById("app")
      .classList.add("hidden");
  }
}

sb.auth.onAuthStateChange((event,session)=>{

  if(event==="SIGNED_OUT"){

    currentUser=null;

    document.getElementById("app")
      .classList.add("hidden");

    document.getElementById("authBox")
      .classList.remove("hidden");
  }

});

boot();

</script>
