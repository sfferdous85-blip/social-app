<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#1877f2">
<title>My Social App</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#f0f2f5;font-family:Arial,sans-serif;color:#111}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0}
img,video{max-width:100%}
.hidden{display:none!important}

:root{
 --blue:#1877f2;
 --bg:#f0f2f5;
 --card:#fff;
 --border:#dddfe2;
 --text:#050505;
 --muted:#65676b;
}

body.dark{
 --bg:#18191a;
 --card:#242526;
 --border:#3a3b3c;
 --text:#e4e6eb;
 --muted:#b0b3b8;
}

#app{min-height:100vh}

.topbar{
 position:sticky;
 top:0;
 z-index:1000;
 height:58px;
 background:var(--card);
 border-bottom:1px solid var(--border);
 display:flex;
 align-items:center;
 gap:10px;
 padding:0 12px;
}

.logo{
 font-size:22px;
 font-weight:800;
 color:var(--blue);
 white-space:nowrap;
}

.search{
 flex:1;
 max-width:480px;
 background:var(--bg);
 border-radius:22px;
 padding:10px 15px;
 border:0;
 outline:none;
 color:var(--text);
}

.top-actions{
 margin-left:auto;
 display:flex;
 gap:7px;
}

.iconbtn{
 width:40px;
 height:40px;
 border-radius:50%;
 background:var(--bg);
 color:var(--text);
 font-size:19px;
}

.badge{
 position:absolute;
 top:-2px;
 right:-2px;
 min-width:17px;
 height:17px;
 border-radius:20px;
 background:#e41e3f;
 color:#fff;
 font-size:10px;
 display:flex;
 align-items:center;
 justify-content:center;
}

.nav{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 height:62px;
 z-index:1000;
 background:var(--card);
 border-top:1px solid var(--border);
 display:flex;
 justify-content:space-around;
 align-items:center;
}

.nav button{
 background:none;
 color:var(--muted);
 font-size:11px;
 display:flex;
 flex-direction:column;
 align-items:center;
 gap:3px;
 min-width:55px;
}

.nav button.active{color:var(--blue)}
.nav i{font-style:normal;font-size:22px}

.main{
 width:100%;
 max-width:900px;
 margin:auto;
 padding:15px 10px 80px;
}

.card{
 background:var(--card);
 border-radius:12px;
 border:1px solid var(--border);
 margin-bottom:12px;
 overflow:hidden;
}

.cardpad{padding:14px}

.profile-cover{
 height:220px;
 background:linear-gradient(135deg,#1877f2,#7b2cff);
 position:relative;
}

.cover-img{
 width:100%;
 height:100%;
 object-fit:cover;
}

.profile-photo{
 width:120px;
 height:120px;
 border-radius:50%;
 border:5px solid var(--card);
 object-fit:cover;
 position:absolute;
 left:20px;
 bottom:-55px;
 background:#ddd;
}

.profile-info{
 padding:65px 18px 18px;
}

.profile-name{
 font-size:25px;
 font-weight:800;
}

.profile-email{
 color:var(--muted);
 margin-top:4px;
}

.profile-actions{
 display:flex;
 gap:8px;
 margin-top:15px;
 flex-wrap:wrap;
}

.btn{
 background:var(--blue);
 color:#fff;
 padding:10px 16px;
 border-radius:8px;
 font-weight:700;
}

.btn.secondary{
 background:var(--bg);
 color:var(--text);
}

.btn.danger{
 background:#e41e3f;
 color:#fff;
}

.stats{
 display:flex;
 gap:25px;
 margin-top:15px;
}

.stat{text-align:center}
.stat b{display:block;font-size:18px}
.stat span{font-size:12px;color:var(--muted)}

.create-box{
 display:flex;
 gap:10px;
 align-items:center;
}

.avatar{
 width:42px;
 height:42px;
 border-radius:50%;
 object-fit:cover;
 background:#ddd;
 flex-shrink:0;
}

.create-input{
 flex:1;
 background:var(--bg);
 border-radius:22px;
 padding:12px 16px;
 color:var(--muted);
 cursor:pointer;
}

.story-row{
 display:flex;
 gap:9px;
 overflow-x:auto;
 padding:10px;
}

.story{
 min-width:85px;
 height:125px;
 border-radius:10px;
 overflow:hidden;
 position:relative;
 background:linear-gradient(135deg,#1877f2,#9c27b0);
 color:#fff;
}

.story img,.story video{
 width:100%;
 height:100%;
 object-fit:cover;
}

.story-name{
 position:absolute;
 bottom:6px;
 left:6px;
 right:6px;
 font-size:11px;
 font-weight:bold;
 text-shadow:0 1px 4px #000;
}

.post-head{
 display:flex;
 align-items:center;
 gap:10px;
 padding:12px;
}

.post-user{
 flex:1;
}

.post-user b{display:block}
.post-time{font-size:12px;color:var(--muted)}

.post-menu{
 width:35px;
 height:35px;
 border-radius:50%;
 background:var(--bg);
 color:var(--text);
}

.post-text{
 padding:0 12px 12px;
 white-space:pre-wrap;
 word-break:break-word;
}

.post-image{
 width:100%;
 max-height:650px;
 object-fit:cover;
 display:block;
}

.media-grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:2px;
}

.media-grid img{
 width:100%;
 height:250px;
 object-fit:cover;
}

.post-stats{
 display:flex;
 justify-content:space-between;
 padding:8px 12px;
 color:var(--muted);
 font-size:13px;
 border-bottom:1px solid var(--border);
}

.post-actions{
 display:grid;
 grid-template-columns:repeat(3,1fr);
}

.post-actions button{
 padding:11px 5px;
 background:none;
 color:var(--muted);
 font-weight:700;
}

.post-actions button:hover{background:var(--bg)}
.liked{color:#1877f2!important}

.comment-box{
 display:flex;
 gap:7px;
 padding:10px;
 border-top:1px solid var(--border);
}

.comment-box input{
 flex:1;
 border:0;
 background:var(--bg);
 border-radius:20px;
 padding:10px 13px;
 outline:none;
 color:var(--text);
}

.comments{
 padding:0 12px 10px;
}

.comment{
 background:var(--bg);
 border-radius:15px;
 padding:8px 11px;
 margin:5px 0;
}

.comment b{font-size:13px}
.comment p{margin:3px 0 0;font-size:14px}

.reels{
 background:#000;
 border-radius:12px;
 overflow:hidden;
}

.reel{
 position:relative;
 height:calc(100vh - 125px);
 min-height:500px;
 background:#000;
 overflow:hidden;
 margin-bottom:5px;
}

.reel video{
 width:100%;
 height:100%;
 object-fit:cover;
}

.reel-info{
 position:absolute;
 left:15px;
 right:75px;
 bottom:20px;
 color:#fff;
 text-shadow:0 1px 4px #000;
 z-index:3;
}

.reel-info b{font-size:17px}
.reel-caption{margin-top:7px}

.reel-actions{
 position:absolute;
 right:12px;
 bottom:75px;
 display:flex;
 flex-direction:column;
 gap:13px;
 z-index:4;
}

.reel-actions button{
 width:48px;
 height:48px;
 border-radius:50%;
 background:rgba(0,0,0,.5);
 color:#fff;
 font-size:19px;
}

.reel-actions small{
 display:block;
 font-size:9px;
}

.reel-mute{
 position:absolute;
 right:12px;
 top:15px;
 z-index:4;
}

.reel-mute button{
 width:42px;
 height:42px;
 border-radius:50%;
 background:rgba(0,0,0,.55);
 color:#fff;
}

.modal{
 position:fixed;
 inset:0;
 z-index:3000;
 background:rgba(0,0,0,.65);
 display:flex;
 align-items:center;
 justify-content:center;
 padding:12px;
}

.modalbox{
 width:100%;
 max-width:500px;
 max-height:92vh;
 overflow:auto;
 background:var(--card);
 border-radius:15px;
 color:var(--text);
}

.modalhead{
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:15px;
 border-bottom:1px solid var(--border);
 font-weight:800;
}

.close{
 width:35px;
 height:35px;
 border-radius:50%;
 background:var(--bg);
 color:var(--text);
}

.modalbody{padding:15px}

textarea,input,select{
 width:100%;
 padding:12px;
 border:1px solid var(--border);
 border-radius:9px;
 background:var(--card);
 color:var(--text);
 outline:none;
}

textarea{min-height:120px;resize:vertical}

.formgroup{margin-bottom:12px}
.formgroup label{
 display:block;
 font-size:13px;
 font-weight:bold;
 margin-bottom:6px;
}

.login{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
}

.loginbox{
 width:100%;
 max-width:400px;
 background:var(--card);
 padding:25px;
 border-radius:15px;
 border:1px solid var(--border);
}

.loginbox h1{
 color:var(--blue);
 text-align:center;
}

.switch{
 text-align:center;
 margin-top:15px;
 color:var(--blue);
 cursor:pointer;
}

.loading{
 padding:30px;
 text-align:center;
 color:var(--muted);
}

.empty{
 padding:35px 15px;
 text-align:center;
 color:var(--muted);
}

.search-result{
 display:flex;
 align-items:center;
 gap:10px;
 padding:10px;
 border-bottom:1px solid var(--border);
}

.setting-row{
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:15px;
 border-bottom:1px solid var(--border);
}

.setting-row:last-child{border-bottom:0}

.toast{
 position:fixed;
 left:50%;
 bottom:80px;
 transform:translateX(-50%);
 background:#222;
 color:#fff;
 padding:11px 18px;
 border-radius:25px;
 z-index:5000;
 font-size:14px;
}

@media(min-width:700px){
 .main{padding-top:20px}
 .nav{
   position:fixed;
   width:600px;
   left:50%;
   transform:translateX(-50%);
   border:1px solid var(--border);
   border-radius:15px 15px 0 0;
 }
}

@media(max-width:500px){
 .logo{font-size:19px}
 .search{max-width:none}
 .top-actions .hide-mobile{display:none}
 .profile-cover{height:170px}
 .profile-photo{width:100px;height:100px}
 .profile-info{padding-top:55px}
}
</style>
</head>

<body>

<div id="app"></div>
<div id="toast" class="toast hidden"></div>

<script>
/* =========================================================
   MY SOCIAL APP
   ========================================================= */

const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

let currentUser = null;
let currentProfile = null;
let activePage = "home";
let postsCache = [];
let reelsCache = [];
let followingSet = new Set();
let notificationCount = 0;
let currentCommentPost = null;
let currentCommentReel = null;
let reelObserver = null;


/* =========================================================
   HELPERS
   ========================================================= */

function safe(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function toast(message){
  const el = document.getElementById("toast");
  el.textContent = message;
  el.classList.remove("hidden");
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>{
    el.classList.add("hidden");
  },2500);
}

function formatDate(date){
  if(!date) return "";
  const d = new Date(date);
  if(Number.isNaN(d.getTime())) return "";
  return d.toLocaleString("bn-BD",{
    day:"numeric",
    month:"short",
    hour:"numeric",
    minute:"2-digit"
  });
}

function profileName(p){
  return p?.name || p?.full_name || p?.username || "User";
}

function profilePhoto(p){
  return p?.profile_photo || p?.avatar_url ||
         "https://placehold.co/100x100?text=User";
}

async function getProfile(userId){
  if(!userId) return null;

  const {data,error} = await db
    .from("my social app")
    .select("*")
    .eq("id",userId)
    .maybeSingle();

  if(error){
    console.log("Profile error:",error);
    return null;
  }

  return data;
}

async function refreshProfile(){
  if(!currentUser) return;
  currentProfile = await getProfile(currentUser.id);
}

async function notify(receiverId,message){
  if(!receiverId || receiverId === currentUser?.id) return;

  try{
    await db.from("notifications").insert({
      receiver_id:receiverId,
      message,
      read:false
    });
  }catch(e){
    console.log("notification:",e);
  }
}


/* =========================================================
   AUTH
   ========================================================= */

async function checkAuth(){
  const {data} = await db.auth.getSession();
  currentUser = data.session?.user || null;

  if(currentUser){
    await refreshProfile();
    renderApp();
  }else{
    renderLogin();
  }

  db.auth.onAuthStateChange(async(_event,session)=>{
    currentUser = session?.user || null;

    if(currentUser){
      await refreshProfile();
      renderApp();
    }else{
      currentProfile = null;
      renderLogin();
    }
  });
}

function renderLogin(){
  document.getElementById("app").innerHTML = `
    <div class="login">
      <div class="loginbox">
        <h1>My Social App</h1>

        <div id="authForm">
          <div class="formgroup">
            <label>Email</label>
            <input id="authEmail" type="email" placeholder="Email">
          </div>

          <div class="formgroup">
            <label>Password</label>
            <input id="authPassword" type="password" placeholder="Password">
          </div>

          <button class="btn" style="width:100%" onclick="login()">
            Login
          </button>

          <div class="switch" onclick="showSignup()">
            নতুন account তৈরি করুন
          </div>
        </div>
      </div>
    </div>
  `;
}

function showSignup(){
  document.getElementById("authForm").innerHTML = `
    <div class="formgroup">
      <label>নাম</label>
      <input id="authName" placeholder="আপনার নাম">
    </div>

    <div class="formgroup">
      <label>Email</label>
      <input id="authEmail" type="email" placeholder="Email">
    </div>

    <div class="formgroup">
      <label>Password</label>
      <input id="authPassword" type="password" placeholder="কমপক্ষে 6 অক্ষর">
    </div>

    <button class="btn" style="width:100%" onclick="signup()">
      Create Account
    </button>

    <div class="switch" onclick="renderLogin()">
      Login-এ ফিরে যান
    </div>
  `;
}

async function login(){
  const email = document.getElementById("authEmail").value.trim();
  const password = document.getElementById("authPassword").value;

  if(!email || !password){
    toast("Email ও Password দিন");
    return;
  }

  const {error} = await db.auth.signInWithPassword({
    email,
    password
  });

  if(error){
    toast(error.message);
  }
}

async function signup(){
  const name = document.getElementById("authName").value.trim();
  const email = document.getElementById("authEmail").value.trim();
  const password = document.getElementById("authPassword").value;

  if(!name || !email || !password){
    toast("সব তথ্য পূরণ করুন");
    return;
  }

  if(password.length < 6){
    toast("Password কমপক্ষে 6 অক্ষরের হতে হবে");
    return;
  }

  const {data,error} = await db.auth.signUp({
    email,
    password,
    options:{
      data:{name}
    }
  });

  if(error){
    toast(error.message);
    return;
  }

  if(data.user){
    try{
      await db.from("my social app").upsert({
        id:data.user.id,
        name:name,
        email:email
      });
    }catch(e){
      console.log(e);
    }
  }

  toast("Account তৈরি হয়েছে");
}

async function logout(){
  await db.auth.signOut();
}


/* =========================================================
   MAIN APP
   ========================================================= */

function renderApp(){
  document.getElementById("app").innerHTML = `
    <header class="topbar">
      <div class="logo">My Social App</div>

      <input
        class="search"
        id="globalSearch"
        placeholder="Search..."
        onkeydown="if(event.key==='Enter')doSearch()"
      >

      <div class="top-actions">

        <div style="position:relative">
          <button class="iconbtn" onclick="openNotifications()">🔔</button>
          <span id="notificationBadge" class="badge hidden">0</span>
        </div>

        <button class="iconbtn hide-mobile" onclick="openCreatePost()">＋</button>
      </div>
    </header>

    <main class="main" id="main"></main>

    <nav class="nav">
      <button id="navHome" onclick="showPage('home')">
        <i>🏠</i>Home
      </button>

      <button id="navReels" onclick="showPage('reels')">
        <i>🎬</i>Reels
      </button>

      <button onclick="openCreatePost()">
        <i>➕</i>Post
      </button>

      <button id="navProfile" onclick="showPage('profile')">
        <i>👤</i>Profile
      </button>

      <button id="navSettings" onclick="showPage('settings')">
        <i>⚙️</i>Settings
      </button>
    </nav>
  `;

  showPage("home");
  loadNotificationCount();
}


/* =========================================================
   PAGE NAVIGATION
   ========================================================= */

async function showPage(page){
  activePage = page;

  document.querySelectorAll(".nav button")
    .forEach(x=>x.classList.remove("active"));

  const map = {
    home:"navHome",
    reels:"navReels",
    profile:"navProfile",
    settings:"navSettings"
  };

  if(map[page]){
    document.getElementById(map[page])?.classList.add("active");
  }

  if(page==="home") await renderHome();
  if(page==="reels") await renderReels();
  if(page==="profile") await renderProfile();
  if(page==="settings") renderSettings();
}


/* =========================================================
   HOME
   ========================================================= */

async function renderHome(){
  const main = document.getElementById("main");

  main.innerHTML = `
    <div class="card">
      <div class="cardpad create-box">
        <img class="avatar" src="${safe(profilePhoto(currentProfile))}">
        <div class="create-input" onclick="openCreatePost()">
          কী ভাবছেন, ${safe(profileName(currentProfile))}?
        </div>
      </div>
    </div>

    <div class="card">
      <div class="story-row">
        <div class="story" onclick="openStoryUpload()">
          <div style="height:100%;display:flex;align-items:center;justify-content:center;font-size:35px">
            ＋
          </div>
          <div class="story-name">Create Story</div>
        </div>

        <div id="storiesList"></div>
      </div>
    </div>

    <div id="feed">
      <div class="loading">Feed লোড হচ্ছে...</div>
    </div>
  `;

  await loadStories();
  await loadPosts();
}

async function loadPosts(){
  const feed = document.getElementById("feed");

  try{
    /*
      posts(*) ব্যবহার করা হয়েছে যাতে আপনার posts table-এর
      অতিরিক্ত column থাকলেও code ভেঙে না যায়।
    */
    const {data,error} = await db
      .from("posts")
      .select("*")
      .order("created_at",{ascending:false})
      .limit(50);

    if(error){
      console.error(error);
      feed.innerHTML = `
        <div class="card empty">
          <b>Post লোড করা যায়নি</b>
          <p>${safe(error.message)}</p>
          <button class="btn" onclick="loadPosts()">Retry</button>
        </div>
      `;
      return;
    }

    postsCache = data || [];

    if(!postsCache.length){
      feed.innerHTML = `
        <div class="card empty">
          এখনো কোনো Post নেই।
          <br><br>
          <button class="btn" onclick="openCreatePost()">
            প্রথম Post করুন
          </button>
        </div>
      `;
      return;
    }

    feed.innerHTML = "";

    for(const post of postsCache){
      feed.insertAdjacentHTML("beforeend",await postHTML(post));
    }

  }catch(e){
    feed.innerHTML = `
      <div class="card empty">
        Error: ${safe(e.message)}
      </div>
    `;
  }
}

async function postHTML(post){
  const postId = post.id ?? post.post_id;
  const ownerId = post.user_id;

  let profile = null;

  if(ownerId){
    profile = await getProfile(ownerId);
  }

  const name = profileName(profile);
  const photo = profilePhoto(profile);

  let reactionCount = 0;
  let commentCount = 0;
  let userLiked = false;

  try{
    const r = await db
      .from("post_reactions")
      .select("user_id,reaction", {count:"exact"})
      .eq("post_id",postId);

    reactionCount = r.count || 0;
    userLiked = (r.data || []).some(
      x=>x.user_id===currentUser.id
    );
  }catch(e){}

  try{
    const c = await db
      .from("comments")
      .select("id",{count:"exact",head:true})
      .eq("post_id",postId);

    commentCount = c.count || 0;
  }catch(e){}

  const text = post.text || post.content || "";
  const image = post.image_url || "";

  return `
    <article class="card" id="post-${safe(postId)}">

      <div class="post-head">
        <img class="avatar" src="${safe(photo)}">

        <div class="post-user">
          <b>${safe(name)}</b>
          <div class="post-time">
            ${formatDate(post.created_at)}
            ${post.privacy ? " · " + safe(post.privacy) : ""}
          </div>
        </div>

        <button class="post-menu"
          onclick="postMenu('${safe(postId)}','${safe(ownerId)}')">
          ⋯
        </button>
      </div>

      ${text ? `<div class="post-text">${safe(text)}</div>` : ""}

      ${
        image
        ? `<img class="post-image" src="${safe(image)}" loading="lazy">`
        : ""

function setupReelObserver(){
  if(reelObserver) reelObserver.disconnect();

  reelObserver = new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      const video = entry.target.querySelector("video");

      if(entry.isIntersecting){
        document.querySelectorAll(".reel video")
          .forEach(v=>{
            if(v!==video){
              v.pause();
            }
          });

        video.play().catch(()=>{});

        const id = entry.target.dataset.reelId;
        incrementReelView(id);
      }else{
        video.pause();
      }
    });
  },{
    threshold:.7
  });

  document.querySelectorAll(".reel")
    .forEach(x=>reelObserver.observe(x));
}

async function incrementReelView(reelId){
  const key = "reel_view_" + reelId;

  if(sessionStorage.getItem(key)) return;

  sessionStorage.setItem(key,"1");

  const reel = reelsCache.find(x=>String(x.id)===String(reelId));

  if(!reel) return;

  try{
    await db
      .from("reels")
      .update({
        views:Number(reel.views || 0)+1
      })
      .eq("id",reelId);
  }catch(e){
    console.log(e);
  }
}

function toggleReelSound(video){
  if(!video) return;

  video.muted = !video.muted;

  const btn =
    video.parentElement.querySelector(".reel-mute button");

  if(btn){
    btn.textContent = video.muted ? "🔇" : "🔊";
  }

  if(video.paused){
    video.play().catch(()=>{});
  }
}

async function uploadProfileImage(file,folder){
  if(!file) return null;

  const path =
    currentUser.id + "/" +
    Date.now() + "_" +
    file.name.replace(/[^\w.\-]/g,"_");

  const {error} = await db.storage
    .from("profiles")
    .upload(path,file,{upsert:true});

  if(error) throw error;

  const {data} = db.storage
    .from("profiles")
    .getPublicUrl(path);

  return data.publicUrl;
}

async function saveProfile(){
  const name = document.getElementById("editName").value.trim();
  const bio = document.getElementById("editBio").value.trim();

  const profileFile =
    document.getElementById("editProfilePhoto").files[0];

  const coverFile =
    document.getElementById("editCoverPhoto").files[0];

  const update = {
    name,
    bio
  };

  try{
    if(profileFile){
      update.profile_photo =
        await uploadProfileImage(profileFile,"profile");
    }

    if(coverFile){
      update.cover_photo =
        await uploadProfileImage(coverFile,"cover");
    }

    const {error} = await db
      .from("my social app")
      .update(update)
      .eq("id",currentUser.id);

    if(error){
      toast(error.message);
      return;
    }

    closeModal();
    await refreshProfile();
    toast("Profile updated");
    await renderProfile();

  }catch(e){
    toast("Profile photo upload error: " + e.message);
  }
}

async function openFriends(){

    .eq("status","pending")
    .order("created_at",{ascending:false});

  let html = `

      <span>👥 Friends</span>

    </div>

      const p = await getProfile(r.sender_id);

      html += `
        <div class="search-result">
          <img class="avatar"
            src="${safe(profilePhoto(p))}">

          <div style="flex:1">
            <b>${safe(profileName(p))}</b>

          <button class="btn"
            onclick="acceptFriend('${safe(r.id)}','${safe(r.sender_id)}')">
            Accept
          </button>
        </div>
      `;
    }
  }else{
    html += `<div class="empty">কোনো Friend Request নেই</div>`;
  }

  html += `<h3>Friends</h3>`;

  if(friends?.length){
    for(const f of friends){
      const p = await getProfile(f.friend_id);

      html += `
        <div class="search-result">
          <img class="avatar"
            src="${safe(profilePhoto(p))}">

          <div style="flex:1">
            <b>${safe(profileName(p))}</b>
          </div>

          <button class="btn secondary"

        </div>
      `;
    }
  }else{
    html += `<div class="empty">এখনো কোনো Friend নেই</div>`;
  }

  html += `</div>`;

  openModal(html);
}

async function acceptFriend(requestId,senderId){
  await db
    .from("friend_requests")
    .update({status:"accepted"})
    .eq("id",requestId);

  await db.from("friends").upsert([
    {
      user_id:currentUser.id,
      friend_id:senderId
    },
    {
      user_id:senderId,
      friend_id:currentUser.id
    }
  ]);

  await notify(
    senderId,
    `${profileName(currentProfile)} আপনার Friend Request গ্রহণ করেছেন 👥`
  );

  toast("Friend added");
  await openFriends();
}

async function openChat(userId){
  const p = await getProfile(userId);

  openModal(`
    <div class="modalhead">
      <span>💬 ${safe(profileName(p))}</span>
      <button class="close" onclick="closeModal()">✕</button>
    </div>

    <div class="modalbody">

      <div id="chatMessages"
        style="height:350px;overflow:auto;margin-bottom:10px">
        Loading...
      </div>

      <div class="comment-box">
        <input id="chatInput"
          placeholder="Message লিখুন...">
        <button class="btn"
          onclick="sendMessage('${safe(userId)}')">
          Send
        </button>
      </div>

    </div>
  `);

  await loadChat(userId);
}

async function loadChat(userId){
  const box = document.getElementById("chatMessages");
  if(!box) return;

  const {data,error} = await db
    .from("messages")
    .select("*")
    .or(
      `and(sender_id.eq.${currentUser.id},receiver_id.eq.${userId}),and(sender_id.eq.${userId},receiver_id.eq.${currentUser.id})`
    )
    .order("created_at",{ascending:true});

  if(error){
    box.innerHTML = `<p>${safe(error.message)}</p>`;
    return;
  }

  box.innerHTML = (data || []).map(m=>`
    <div style="
      display:flex;
      justify-content:${m.sender_id===currentUser.id?"flex-end":"flex-start"};
      margin:7px 0">

      <div style="
        background:${m.sender_id===currentUser.id?"#1877f2":"var(--bg)"};
        color:${m.sender_id===currentUser.id?"white":"var(--text)"};
        padding:9px 12px;
        border-radius:16px;
        max-width:75%">
        ${safe(m.text)}
      </div>

    </div>
  `).join("");

  box.scrollTop = box.scrollHeight;
}

async function sendMessage(userId){
  const input = document.getElementById("chatInput");
  const text = input.value.trim();

  if(!text) return;

  const {error} = await db
    .from("messages")
    .insert({
      sender_id:currentUser.id,
      receiver_id:userId,
      text
    });

  if(error){
    toast(error.message);
    return;
  }

  input.value = "";
  await loadChat(userId);

  await notify(
    userId,
    `${profileName(currentProfile)} আপনাকে একটি Message পাঠিয়েছেন 💬`
  );
}

/* =========================================================

function openModal(html){
  closeModal();

  const div = document.createElement("div");
  div.id = "modal";
  div.className = "modal";

  div.innerHTML = `
    <div class="modalbox">
      ${html}
    </div>
  `;

  div.addEventListener("click",e=>{
    if(e.target===div){
      closeModal();
    }
  });

  document.body.appendChild(div);
}

function closeModal(){
  document.getElementById("modal")?.remove();
}
