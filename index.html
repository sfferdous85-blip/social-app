<script>

let premiumVideoFile = null;
let premiumAudioFile = null;
let premiumCoverFile = null;

let premiumRotation = 0;
let premiumZoom = 100;
let premiumSpeed = 1;

let premiumFilter = "none";

let trimStartSeconds = 0;
let trimEndSeconds = 0;

function openPremiumUpload(){

  const modal =
    document.getElementById("premiumUploadModal");

  if(modal){
    modal.classList.add("show");
  }

  resetVideoEditor();
}

function closePremiumUpload(){

  const modal =
    document.getElementById("premiumUploadModal");

  if(modal){
    modal.classList.remove("show");
  }
}

function loadPremiumVideo(event){

  const file = event.target.files[0];

  if(!file) return;

  if(!file.type.startsWith("video/")){
    alert("দয়া করে Video নির্বাচন করুন");
    return;
  }

  premiumVideoFile = file;

  const video =
    document.getElementById("premiumVideo");

  const empty =
    document.getElementById("playerEmpty");

  video.src = URL.createObjectURL(file);

  video.load();

  empty.style.display = "none";

  video.onloadedmetadata = function(){

    trimStartSeconds = 0;
    trimEndSeconds = video.duration;

    document.getElementById("trimEnd").value = 100;

    document.getElementById("trimEndText").innerText =
      video.duration.toFixed(1) + "s";

    document.getElementById("trimStartText").innerText =
      "0.0s";
  };

}

function setVideoFilter(filter){

  premiumFilter = filter;

  updateVideoStyle();
}

function updateVideoAdjustments(){

  const brightness =
    document.getElementById("brightnessControl").value;

  const contrast =
    document.getElementById("contrastControl").value;

  const saturation =
    document.getElementById("saturationControl").value;

  document.getElementById("brightnessValue").innerText =
    brightness + "%";

  document.getElementById("contrastValue").innerText =
    contrast + "%";

  document.getElementById("saturationValue").innerText =
    saturation + "%";

  updateVideoStyle();
}

function updateVideoStyle(){

  const video =
    document.getElementById("premiumVideo");

  if(!video) return;

  const brightness =
    document.getElementById("brightnessControl").value;

  const contrast =
    document.getElementById("contrastControl").value;

  const saturation =
    document.getElementById("saturationControl").value;

  video.style.filter =
    `
    ${premiumFilter}
    brightness(${brightness}%)
    contrast(${contrast}%)
    saturate(${saturation}%)
    `;

  video.style.transform =
    `
    rotate(${premiumRotation}deg)
    scale(${premiumZoom / 100})
    `;
}

function updateVideoTransform(){

  premiumZoom =
    document.getElementById("zoomControl").value;

  document.getElementById("zoomValue").innerText =
    premiumZoom + "%";

  updateVideoStyle();
}

function rotateVideo(degrees){

  premiumRotation += degrees;

  if(premiumRotation >= 360)
    premiumRotation -= 360;

  if(premiumRotation <= -360)
    premiumRotation += 360;

  updateVideoStyle();
}

function setVideoSpeed(speed){

  premiumSpeed = speed;

  const video =
    document.getElementById("premiumVideo");

  video.playbackRate = speed;
}

function updateVideoVolume(){

  const volume =
    document.getElementById("volumeControl").value;

  const video =
    document.getElementById("premiumVideo");

  video.volume = volume / 100;

  document.getElementById("volumeValue").innerText =
    volume + "%";
}

function toggleVideoMute(){

  const video =
    document.getElementById("premiumVideo");

  video.muted = !video.muted;

  document.getElementById("muteButton").innerText =
    video.muted ? "🔊 Unmute" : "🔇 Mute";
}

function addVideoText(){

  const text =
    document.getElementById("videoTextInput").value.trim();

  if(!text) return;

  const color =
    document.getElementById("videoTextColor").value;

  const size =
    document.getElementById("videoTextSize").value;

  const overlay =
    document.getElementById("premiumTextOverlay");

  overlay.innerText = text;

  overlay.style.color = color;

  overlay.style.fontSize = size + "px";
}

function addVideoEmoji(emoji){

  document.getElementById("premiumEmojiOverlay")
    .innerText = emoji;
}

function updateTrimStart(){

  const video =
    document.getElementById("premiumVideo");

  if(!video.duration) return;

  const percent =
    Number(document.getElementById("trimStart").value);

  trimStartSeconds =
    video.duration * percent / 100;

  if(trimStartSeconds >= trimEndSeconds){

    trimStartSeconds =
      Math.max(0, trimEndSeconds - .1);

  }

  document.getElementById("trimStartText").innerText =
    trimStartSeconds.toFixed(1) + "s";

  video.currentTime = trimStartSeconds;
}

function updateTrimEnd(){

  const video =
    document.getElementById("premiumVideo");

  if(!video.duration) return;

  const percent =
    Number(document.getElementById("trimEnd").value);

  trimEndSeconds =
    video.duration * percent / 100;

  if(trimEndSeconds <= trimStartSeconds){

    trimEndSeconds =
      Math.min(video.duration, trimStartSeconds + .1);

  }

  document.getElementById("trimEndText").innerText =
    trimEndSeconds.toFixed(1) + "s";
}

document.addEventListener("DOMContentLoaded", function(){

  const video =
    document.getElementById("premiumVideo");

  if(video){

    video.addEventListener("timeupdate", function(){

      if(
        trimEndSeconds > 0 &&
        video.currentTime >= trimEndSeconds
      ){

        video.pause();

        video.currentTime =
          trimStartSeconds;
      }

    });

  }

});

function loadPremiumAudio(event){

  const file = event.target.files[0];

  if(!file) return;

  premiumAudioFile = file;

  document.getElementById("audioNameInput").value =
    file.name;
}

function loadPremiumCover(event){

  const file = event.target.files[0];

  if(!file) return;

  premiumCoverFile = file;

  const preview =
    document.getElementById("coverPreview");

  preview.innerHTML = "";

  const img =
    document.createElement("img");

  img.src = URL.createObjectURL(file);

  preview.appendChild(img);
}

function captureVideoCover(){

  const video =
    document.getElementById("premiumVideo");

  if(!video.src) return;

  const canvas =
    document.createElement("canvas");

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  const ctx =
    canvas.getContext("2d");

  ctx.filter =
    getComputedStyle(video).filter;

  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );

  canvas.toBlob(function(blob){

    if(!blob) return;

    premiumCoverFile =
      new File(
        [blob],
        "reel-cover.jpg",
        {type:"image/jpeg"}
      );

    const preview =
      document.getElementById("coverPreview");

    preview.innerHTML = "";

    const img =
      document.createElement("img");

    img.src =
      URL.createObjectURL(blob);

    preview.appendChild(img);

  },"image/jpeg",.92);
}

function resetVideoEditor(){

  premiumRotation = 0;
  premiumZoom = 100;
  premiumSpeed = 1;
  premiumFilter = "none";

  document.getElementById("brightnessControl").value = 100;
  document.getElementById("contrastControl").value = 100;
  document.getElementById("saturationControl").value = 100;
  document.getElementById("zoomControl").value = 100;
  document.getElementById("volumeControl").value = 100;

  document.getElementById("brightnessValue").innerText = "100%";
  document.getElementById("contrastValue").innerText = "100%";
  document.getElementById("saturationValue").innerText = "100%";
  document.getElementById("zoomValue").innerText = "100%";
  document.getElementById("volumeValue").innerText = "100%";

  const video =
    document.getElementById("premiumVideo");

  if(video){

    video.style.filter = "none";
    video.style.transform = "none";
    video.playbackRate = 1;
    video.volume = 1;
    video.muted = false;
  }

  const text =
    document.getElementById("premiumTextOverlay");

  const emoji =
    document.getElementById("premiumEmojiOverlay");

  if(text) text.innerText = "";
  if(emoji) emoji.innerText = "";
}

function playFinalPreview(){

  const video =
    document.getElementById("premiumVideo");

  if(!video.src){

    alert("আগে একটি ভিডিও নির্বাচন করুন");
    return;
  }

  video.currentTime = trimStartSeconds;

  video.playbackRate = premiumSpeed;

  video.play();

}

async function applyPremiumUpload(){

  if(!premiumVideoFile){

    alert("প্রথমে একটি ভিডিও নির্বাচন করুন");
    return;
  }

  const status =
    document.getElementById("premiumUploadStatus");

  status.innerText =
    "⏳ Upload প্রস্তুত হচ্ছে...";

  /*
    IMPORTANT:

    Browser CSS effects যেমন brightness,
    filter, zoom, rotation ইত্যাদি
    শুধু Preview-তে দেখায়।

    যদি edited effect-সহ নতুন video file
    তৈরি করতে চান, তাহলে browser-side
    Canvas/MediaRecorder বা server-side
    video processing দরকার।

    এখানে original video Supabase Storage-এ
    upload করার জন্য আপনার existing
    reel upload function-এ data পাঠানো হবে।
  */

  const reelData = {

    videoFile: premiumVideoFile,

    coverFile: premiumCoverFile,

    audioFile: premiumAudioFile,

    caption:
      document.getElementById("reelCaption").value,

    location:
      document.getElementById("reelLocation").value,

    privacy:
      document.getElementById("reelPrivacy").value,

    audioName:
      document.getElementById("audioNameInput").value,

    commentsAllowed:
      document.getElementById("commentsAllowed").checked,

    likesAllowed:
      document.getElementById("likesAllowed").checked,

    sharingAllowed:
      document.getElementById("sharingAllowed").checked,

    monetization:
      document.getElementById("reelMonetization").checked,

    speed: premiumSpeed,

    rotation: premiumRotation,

    zoom: premiumZoom,

    filter: premiumFilter,

    brightness:
      document.getElementById("brightnessControl").value,

    contrast:
      document.getElementById("contrastControl").value,

    saturation:
      document.getElementById("saturationControl").value,

    trimStart: trimStartSeconds,

    trimEnd: trimEndSeconds
  };

  /*
     আপনার existing upload function থাকলে
     এখানে সেটি call করুন:

     await uploadReelToSupabase(reelData);
  */

  window.premiumEditedReelData = reelData;

  status.innerText =
    "✅ Editor settings প্রস্তুত। এখন আপনার existing Supabase Reel Upload function-এ এই data পাঠানো যাবে।";

  console.log(
    "Premium Reel Data:",
    reelData
  );

}

</script>
