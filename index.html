<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1877f2">
<title>FriendBook</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,Helvetica,sans-serif;
 background:#f0f2f5;
 color:#1c1e21
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.top{
 position:sticky;
 top:0;
 z-index:100;
 height:58px;
 background:#1877f2;
 color:white;
 display:flex;
 align-items:center;
 padding:0 12px;
 gap:10px
}
.logo{font-size:24px;font-weight:bold}
.search{
 flex:1;
 max-width:420px;
 background:white;
 border-radius:22px;
 padding:10px 15px;
 border:0;
 outline:0
}
.top button{
 border:0;
 background:rgba(255,255,255,.15);
 color:white;
 border-radius:8px;
 padding:8px 11px
}
.nav{
 display:flex;
 overflow:auto;
 background:white;
 border-bottom:1px solid #ddd;
 position:sticky;
 top:58px;
 z-index:90
}
.nav button{
 flex:1;
 min-width:80px;
 border:0;
 background:white;
 padding:13px 8px;
 color:#555
}
.nav button.active{
 color:#1877f2;
 font-weight:bold;
 border-bottom:3px solid #1877f2
}
.container{
 max-width:900px;
 margin:auto;
 padding:15px
}
.card{
 background:white;
 border-radius:10px;
 padding:15px;
 margin-bottom:15px;
 box-shadow:0 1px 3px rgba(0,0,0,.12)
}
.hidden{display:none!important}
.row{display:flex;gap:10px;align-items:center}
.avatar{
 width:42px;
 height:42px;
 border-radius:50%;
 object-fit:cover;
 background:#ddd
}
.avatar.big{
 width:90px;
 height:90px
}
.muted{color:#65676b;font-size:13px}
h2,h3{margin-top:0}
textarea,input,select{
 width:100%;
 border:1px solid #ccd0d5;
 border-radius:8px;
 padding:11px;
 outline:none
}
textarea{resize:vertical;min-height:80px}
.primary{
 background:#1877f2!important;
 color:white!important
}
.green{background:#42b72a!important;color:white!important}
.danger{background:#e41e3f!important;color:white!important}
.btn{
 border:0;
 background:#e4e6eb;
 padding:9px 13px;
 border-radius:7px;
 margin:3px
}
.actions{
 display:flex;
 flex-wrap:wrap;
 border-top:1px solid #eee;
 margin-top:10px;
 padding-top:8px
}
.actions button{
 flex:1;
 min-width:80px;
 border:0;
 background:white;
 padding:9px;
 color:#65676b;
 border-radius:7px
}
.actions button:hover{background:#f0f2f5}
.post-img{
 width:100%;
 max-height:600px;
 object-fit:cover;
 border-radius:8px;
 margin-top:10px
}
.reel{
 background:#000;
 color:white;
 border-radius:12px;
 overflow:hidden;
 margin-bottom:15px
}
.reel video{
 width:100%;
 max-height:700px;
 display:block;
 background:#000
}
.story-list{
 display:flex;
 gap:10px;
 overflow:auto
}
.story{
 min-width:100px;
 height:150px;
 border-radius:12px;
 background:#1877f2;
 color:white;
 padding:10px;
 display:flex;
 align-items:end;
 font-weight:bold
}
.modal{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.6);
 z-index:300;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:15px
}
.modal-box{
 background:white;
 width:100%;
 max-width:600px;
 max-height:90vh;
 overflow:auto;
 border-radius:12px;
 padding:18px
}
.close{
 float:right;
 border:0;
 background:#eee;
 border-radius:50%;
 width:34px;
 height:34px
}
.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
 gap:10px
}
.stat{
 background:#f0f2f5;
 padding:15px;
 border-radius:10px;
 text-align:center
}
#toast{
 position:fixed;
 bottom:20px;
 left:50%;
 transform:translateX(-50%);
 background:#1c1e21;
 color:white;
 padding:12px 18px;
 border-radius:8px;
 z-index:999;
 display:none;
 max-width:90%
}
.login{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px
}
.login-box{
 width:100%;
 max-width:400px;
 background:white;
 padding:25px;
 border-radius:12px;
 box-shadow:0 2px 12px rgba(0,0,0,.15)
}
.comment{
 background:#f0f2f5;
 border-radius:12px;
 padding:8px 12px;
 margin:6px 0
}
.dark{
 background:#18191a;
 color:#e4e6eb
}
.dark .card,
.dark .nav,
.dark .nav button,
.dark .actions button,
.dark .modal-box,
.dark .login-box{
 background:#242526;
 color:#e4e6eb
}
.dark input,.dark textarea,.dark select{
 background:#3a3b3c;
 color:white;
 border-color:#555
}
.dark .muted{color:#b0b3b8}
.dark .actions{border-color:#444}
@media(max-width:600px){
 .logo{font-size:20px}
 .search{max-width:none}
 .top button{padding:7px}
 .container{padding:8px}
}
</style>
</head>

<body>

<div id="app"></div>
<div id="toast"></div>

<script>
const SUPABASE_URL="https://skereuaizdczbvjplisi.supabase.co";
const SUPABASE_KEY="sb_publishable_3R2otJA1zIlsMsTYxe1ocw_NAPY5O9x";

const sb=window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

let currentUser=null;
let currentProfile=null;
let currentPage="home";
let darkMode=false;

const $=id=>document.getElementById(id);

function toast(msg){
 const t=$("toast");
 t.innerText=msg;
 t.style.display="block";
 clearTimeout(window.toastTimer);
 window.toastTimer=setTimeout(()=>t.style.display="none",3500);
}

function esc(v){
 if(v===null||v===undefined)return "";
 return String(v).replace(/[&<>"']/g,m=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#039;"
 }[m]));
}

function avatar(url,name){
 return `<img class="avatar" src="${esc(url||"https://ui-avatars.com/api/?name="+encodeURIComponent(name||"User"))}" onerror="this.src='https://ui-avatars.com/api/?name=User'">`;
}

async function getSession(){
 const {data,error}=await sb.auth.getSession();
 if(error){
  toast(error.message);
  return null;
 }
 return data.session;
}

async function loadProfile(){
 if(!currentUser)return;

 const {data,error}=await sb
 .from("fb_profiles")
 .select("*")
 .eq("id",currentUser.id)
 .maybeSingle();

 if(error){
  console.log("profile:",error);
 }

 if(data){
  currentProfile=data;
 }else{
  const name=currentUser.email
   ? currentUser.email.split("@")[0]
   :"User";

  const {data:newProfile,error:insertError}=await sb
   .from("fb_profiles")
   .insert({
    id:currentUser.id,
    name:name,
    username:name.toLowerCase().replace(/[^a-z0-9_]/g,""),
    bio:""
   })
   .select()
   .maybeSingle();

  if(!insertError && newProfile){
   currentProfile=newProfile;
  }else{
   currentProfile={
    id:currentUser.id,
    name:name,
    username:name,
    bio:""
   };
  }
 }
}

async function boot(){
 const session=await getSession();

 if(session){
  currentUser=session.user;
  await loadProfile();
  renderApp();
 }else{
  renderLogin();
 }

 sb.auth.onAuthStateChange(async(event,session)=>{
  if(session){
   currentUser=session.user;
   await loadProfile();
   renderApp();
  }else{
   currentUser=null;
   currentProfile=null;
   renderLogin();
  }
 });
}

function renderLogin(){
 document.body.className="";
 $("app").innerHTML=`
 <div class="login">
  <div class="login-box">
   <h1 style="color:#1877f2;text-align:center">FriendBook</h1>
   <p style="text-align:center">আপনার নিজের Social Network</p>

   <input id="loginEmail" type="email" placeholder="Email">
   <br><br>
   <input id="loginPassword" type="password" placeholder="Password">
   <br><br>

   <button class="btn primary" style="width:100%" onclick="login()">
    Login
   </button>

   <button class="btn green" style="width:100%" onclick="signup()">
    Create new account
   </button>

   <p class="muted" style="text-align:center">
    Email verification চালু থাকলে signup-এর পর email verify করুন।
   </p>
  </div>
 </div>`;
}

async function login(){
 const email=$("loginEmail").value.trim();
 const password=$("loginPassword").value;

 if(!email||!password){
  toast("Email ও Password দিন");
  return;
 }

 const {error}=await sb.auth.signInWithPassword({
  email,
  password
 });

 if(error)toast("Login failed: "+error.message);
}

async function signup(){
 const email=$("loginEmail").value.trim();
 const password=$("loginPassword").value;

 if(!email||!password){
  toast("Email ও Password দিন");
  return;
 }

 if(password.length<6){
  toast("Password কমপক্ষে 6 অক্ষরের হতে হবে");
  return;
 }

 const {data,error}=await sb.auth.signUp({
  email,
  password
 });

 if(error){
  toast("Signup failed: "+error.message);
  return;
 }

 if(data.session){
  toast("Account তৈরি হয়েছে");
 }else{
  toast("Account তৈরি হয়েছে। Email verify করে Login করুন।");
 }
}

async function logout(){
 await sb.auth.signOut();
}

function renderApp(){
 document.body.className=darkMode?"dark":"";

 $("app").innerHTML=`
 <header class="top">
  <div class="logo">FriendBook</div>

  <input class="search"
   placeholder="Search FriendBook..."
   onkeydown="if(event.key==='Enter')searchAll(this.value)">

  <button onclick="showPage('notifications')">🔔</button>
  <button onclick="showPage('messages')">💬</button>
  <button onclick="showPage('profile')">
   ${esc(currentProfile?.name||"Profile")}
  </button>
  <button onclick="logout()">Logout</button>
 </header>

 <nav class="nav">
  <button id="nav-home" onclick="showPage('home')">🏠 Home</button>
  <button id="nav-reels" onclick="showPage('reels')">🎬 Reels</button>
  <button id="nav-friends" onclick="showPage('friends')">👥 Friends</button>
  <button id="nav-groups" onclick="showPage('groups')">👨‍👩‍👧 Groups</button>
  <button id="nav-pages" onclick="showPage('pages')">📄 Pages</button>
  <button id="nav-marketplace" onclick="showPage('marketplace')">🛒 Marketplace</button>
  <button id="nav-events" onclick="showPage('events')">📅 Events</button>
  <button id="nav-profile" onclick="showPage('profile')">👤 Profile</button>
  <button id="nav-settings" onclick="showPage('settings')">⚙️ Settings</button>
 </nav>

 <main class="container" id="main"></main>
 `;

 showPage("home");
}

function navActive(page){
 document.querySelectorAll(".nav button")
  .forEach(x=>x.classList.remove("active"));

 const b=$("nav-"+page);
 if(b)b.classList.add("active");
}

async function showPage(page){
 currentPage=page;
 navActive(page);

 if(page==="home")return renderHome();
 if(page==="reels")return renderReels();
 if(page==="profile")return renderProfile();
 if(page==="friends")return renderFriends();
 if(page==="messages")return renderMessages();
 if(page==="notifications")return renderNotifications();
 if(page==="groups")return renderGroups();
 if(page==="pages")return renderPages();
 if(page==="marketplace")return renderMarketplace();
 if(page==="events")return renderEvents();
 if(page==="settings")return renderSettings();
}

async function renderHome(){
 $("main").innerHTML=`
 <div class="card">
  <div class="row">
   ${avatar(currentProfile?.profile_photo,currentProfile?.name)}
   <button class="btn" style="flex:1;text-align:left"
    onclick="openPostComposer()">
    ${esc(currentProfile?.name||"আপনি")} কী ভাবছেন?
   </button>
  </div>
 </div>

 <div class="card">
  <h3>Stories</h3>
  <div class="story-list">
   <div class="story" onclick="openStoryComposer()">➕ Add Story</div>
   <div class="story">Your Story</div>
  </div>
 </div>

 <div id="feed">
  <div class="card">পোস্ট লোড হচ্ছে...</div>
 </div>
 `;

 await loadFeed();
}

async function loadFeed(){
 const feed=$("feed");
 if(!feed)return;

 const {data,error}=await sb
  .from("fb_posts")
  .select(`
   id,
   user_id,
   text,
   image_url,
   privacy,
   feeling,
   location,
   created_at,
   fb_profiles!fb_posts_user_id_fkey(
    id,name,username,profile_photo
   )
  `)
  .order("created_at",{ascending:false})
  .limit(30);

 if(error){
  console.log(error);

  /* fallback without relationship */
  const fallback=await sb
   .from("fb_posts")
   .select("*")
   .order("created_at",{ascending:false})
   .limit(30);

  if(fallback.error){
   feed.innerHTML=`
    <div class="card">
     <b>Feed load failed</b>
     <p>${esc(error.message)}</p>
    </div>`;
   return;
  }

  return renderPosts(fallback.data||[]);
 }

 renderPosts(data||[]);
}

async function renderPosts(posts){
 const feed=$("feed");

 if(!posts.length){
  feed.innerHTML=`
   <div class="card" style="text-align:center">
    এখনো কোনো পোস্ট নেই। প্রথম পোস্টটি আপনি করুন 🎉
   </div>`;
  return;
 }

 const html=[];

 for(const p of posts){
  let profile=p.fb_profiles;

  if(!profile){
   const r=await sb
    .from("fb_profiles")
    .select("id,name,username,profile_photo")
    .eq("id",p.user_id)
    .maybeSingle();

   profile=r.data;
  }

  html.push(postHTML(p,profile));
 }

 feed.innerHTML=html.join("");
}

function postHTML(p,profile){
 const name=profile?.name||"FriendBook User";

 return `
 <article class="card" id="post-${p.id}">
  <div class="row">
   ${avatar(profile?.profile_photo,name)}
   <div>
    <b>${esc(name)}</b>
    <div class="muted">
     @${esc(profile?.username||"user")}
     · ${p.created_at?new Date(p.created_at).toLocaleString("bn-BD"):""}
    </div>
   </div>
  </div>

  ${p.feeling?`<div class="muted">feeling ${esc(p.feeling)}</div>`:""}
  ${p.location?`<div class="muted">📍 ${esc(p.location)}</div>`:""}

  <div style="margin-top:10px;white-space:pre-wrap">
   ${esc(p.text||"")}
  </div>

  ${p.image_url?
   `<img class="post-img" src="${esc(p.image_url)}"
     onerror="this.style.display='none'">`
   :""
  }

  <div class="actions">
   <button onclick="reactPost(${p.id},'like')">👍 Like</button>
   <button onclick="reactPost(${p.id},'love')">❤️ Love</button>
   <button onclick="reactPost(${p.id},'haha')">😂 Haha</button>
   <button onclick="reactPost(${p.id},'wow')">😮 Wow</button>
   <button onclick="reactPost(${p.id},'sad')">😢 Sad</button>
   <button onclick="reactPost(${p.id},'angry')">😡 Angry</button>
   <button onclick="openComments(${p.id})">💬 Comment</button>
   <button onclick="sharePost(${p.id})">↗ Share</button>
   <button onclick="savePost(${p.id})">🔖 Save</button>
  </div>

  <div id="comments-${p.id}"></div>

  ${p.user_id===currentUser.id?
   `<div style="margin-top:8px">
    <button class="btn" onclick="editPost(${p.id},${JSON.stringify(p.text||"")})">✏️ Edit</button>
    <button class="btn danger" onclick="deletePost(${p.id})">🗑 Delete</button>
   </div>`
   :""
  }
 </article>`;
}

function openPostComposer(){
 showModal(`
  <h2>নতুন পোস্ট</h2>

  <textarea id="postText"
   placeholder="আপনি কী ভাবছেন?"></textarea>

  <br><br>

  <input id="postImage"
   placeholder="Image URL (ঐচ্ছিক)">

  <br><br>

  <input id="postLocation"
   placeholder="📍 Location">

  <br><br>

  <input id="postFeeling"
   placeholder="😊 Feeling / Activity">

  <br><br>

  <select id="postPrivacy">
   <option value="public">🌍 Public</option>
   <option value="friends">👥 Friends</option>
   <option value="private">🔒 Only me</option>
  </select>

  <br><br>

  <button class="btn primary" style="width:100%"
   onclick="createPost()">
   🚀 Post
  </button>
 `);
}

async function createPost(){
 if(!currentUser){
  toast("আগে Login করুন");
  return;
 }

 const text=$("postText")?.value.trim()||"";
 const image=$("postImage")?.value.trim()||"";
 const location=$("postLocation")?.value.trim()||"";
 const feeling=$("postFeeling")?.value.trim()||"";
 const privacy=$("postPrivacy")?.value||"public";

 if(!text && !image){
  toast("Post-এ Text অথবা Image URL দিন");
  return;
 }

 /* IMPORTANT:
    এখানে .select().single() নেই।
    এতে RLS SELECT policy না থাকলেও post insert ব্যর্থ দেখাবে না।
 */
 const payload={
  user_id:currentUser.id,
  text:text
 };

 if(image)payload.image_url=image;
 if(privacy)payload.privacy=privacy;
 if(feeling)payload.feeling=feeling;
 if(location)payload.location=location;

 const {error}=await sb
  .from("fb_posts")
  .insert(payload);

 if(error){
  console.error("POST ERROR:",error);

  toast(
   "Post failed: "+
   error.message+
   (error.details?" | "+error.details:"")
  );

  return;
 }

 closeModal();
 toast("✅ Post সফলভাবে প্রকাশ হয়েছে");

 await renderHome();
}

async function reactPost(postId,reaction){
 if(!currentUser)return;

 const {data:old}=await sb
  .from("fb_post_reactions")
  .select("id,reaction")
  .eq("post_id",postId)
  .eq("user_id",currentUser.id)
  .maybeSingle();

 if(old){
  if(old.reaction===reaction){
   const {error}=await sb
    .from("fb_post_reactions")
    .delete()
    .eq("id",old.id);

   if(error)toast(error.message);
  }else{
   const {error}=await sb
    .from("fb_post_reactions")
    .update({reaction})
    .eq("id",old.id);

   if(error)toast(error.message);
  }
 }else{
  const {error}=await sb
   .from("fb_post_reactions")
   .insert({
    post_id:postId,
    user_id:currentUser.id,
    reaction
   });

  if(error)toast(error.message);
 }

 toast("Reaction updated");
}

async function openComments(postId){
 const box=$("comments-"+postId);
 if(!box)return;

 box.innerHTML=`
 <div class="comment">
  <input id="commentInput-${postId}"
   placeholder="Write a comment..."
   onkeydown="if(event.key==='Enter')addComment(${postId})">
  <button class="btn primary"
   onclick="addComment(${postId})">
   Comment
  </button>
 </div>
 <div id="commentList-${postId}">Loading...</div>
 `;

 const {data,error}=await sb
  .from("fb_comments")
  .select("*")
  .eq("post_id",postId)
  .order("created_at",{ascending:true});

 if(error){
  $("commentList-"+postId).innerHTML=
   `<div class="muted">${esc(error.message)}</div>`;
  return;
 }

 $("commentList-"+postId).innerHTML=(data||[]).map(c=>`
  <div class="comment">
   <b>${c.user_id===currentUser.id?"You":"User"}</b>
   <div>${esc(c.text)}</div>
  </div>
 `).join("")||"<div class='muted'>No comments</div>";
}

async function addComment(postId){
 const input=$("commentInput-"+postId);
 const text=input?.value.trim();

 if(!text)return;

 const {error}=await sb
  .from("fb_comments")
  .insert({
   post_id:postId,
   user_id:currentUser.id,
   text
  });

 if(error){
  toast("Comment failed: "+error.message);
  return;
 }

 input.value="";
 await openComments(postId);
}

async function deletePost(id){
 if(!confirm("এই পোস্টটি Delete করবেন?"))return;

 const {error}=await sb
  .from("fb_posts")
  .delete()
  .eq("id",id)
  .eq("user_id",currentUser.id);

 if(error){
  toast("Delete failed: "+error.message);
  return;
 }

 toast("Post deleted");
 await loadFeed();
}

async function editPost(id,oldText){
 const text=prompt("Post edit করুন",oldText);
 if(text===null)return;

 const {error}=await sb
  .from("fb_posts")
  .update({
   text:text,
   edited_at:new Date().toISOString()
  })
  .eq("id",id)
  .eq("user_id",currentUser.id);

 if(error){
  toast("Edit failed: "+error.message);
  return;
 }

 toast("Post updated");
 await loadFeed();
}

async function sharePost(id){
 const url=location.href.split("#")[0]+"#post-"+id;

 if(navigator.share){
  try{
   await navigator.share({
    title:"FriendBook Post",
    text:"FriendBook post",
    url
   });
  }catch(e){}
 }else{
  try{
   await navigator.clipboard.writeText(url);
   toast("Post link copied");
  }catch(e){
   prompt("Copy link",url);
  }
 }
}

async function savePost(postId){
 const {data,error}=await sb
  .from("fb_saved_posts")
  .insert({
   post_id:postId,
   user_id:currentUser.id
  });

 if(error){
  if(String(error.message).toLowerCase().includes("duplicate")){

   <div class="stat">Followers<br><b>0</b></div>
  </div>

  <br>

  <input id="payoutEmail"
   placeholder="Payout email">

  <br><br>

  <button class="btn primary"
   onclick="saveCreatorSettings()">

 `);
}

async function saveCreatorSettings(){
 const email=$("payoutEmail").value.trim();

 const {data:old}=await sb
  .from("fb_creator_settings")
  .select("*")
  .eq("user_id",currentUser.id)
  .maybeSingle();

 let result;

 if(old){
  result=await sb
   .from("fb_creator_settings")
   .update({
    monetization_enabled:true,
    payout_email:email,
    updated_at:new Date().toISOString()
   })
   .eq("user_id",currentUser.id);
 }else{
  result=await sb
   .from("fb_creator_settings")
   .insert({
    user_id:currentUser.id,
    monetization_enabled:true,
    payout_email:email,
    updated_at:new Date().toISOString()
   });
 }

 if(result.error){
  toast(result.error.message);
  return;
 }

 toast("Creator settings saved");
 closeModal();
}

async function showBlocked(){

  showModal(`<h2>Blocked Users</h2><p>${esc(error.message)}</p>`);

 showModal(`

  ${(data||[]).map(x=>`
   <div class="comment">
    ${esc(x.blocked_id)}

 `);
}

async function downloadData(){
 const result={};

 const tables=[
  "fb_profiles",
  "fb_posts",
  "fb_reels",
  "fb_follows",
  "fb_friends"
 ];

 for(const table of tables){
  const {data}=await sb
   .from(table)
   .select("*")
   .eq(
    table==="fb_profiles"?"id":
    table==="fb_posts"||table==="fb_reels"?"user_id":
    table==="fb_follows"?"follower_id":
    "user_id",
    currentUser.id
   );

  result[table]=data||[];
 }

 const blob=new Blob(
  [JSON.stringify(result,null,2)],
  {type:"application/json"}
 );

 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;
 a.download="friendbook-data.json";
 a.click();
 URL.revokeObjectURL(url);

 toast("Data downloaded");
}

async function searchAll(q){
 q=q.trim();

 if(!q)return;

 $("main").innerHTML=`
 <div class="card">
  <h2>🔎 Search</h2>
  <p>Search: <b>${esc(q)}</b></p>
 </div>

 <div id="searchResults"></div>
 `;

 const {data:people}=await sb
  .from("fb_profiles")
  .select("*")
  .ilike("name","%"+q+"%")
  .limit(20);

 const {data:posts}=await sb
  .from("fb_posts")
  .select("*")
  .ilike("text","%"+q+"%")
  .limit(20);

 $("searchResults").innerHTML=`
  <div class="card">
   <h3>People</h3>
   ${(people||[]).map(p=>`
    <div class="comment">
     ${avatar(p.profile_photo,p.name)}
     <b>${esc(p.name)}</b>
     @${esc(p.username||"")}
    </div>
   `).join("")||"No people"}
  </div>

  <div class="card">
   <h3>Posts</h3>
   ${(posts||[]).map(p=>`
    <div class="comment">
     ${esc(p.text||"")}
    </div>
   `).join("")||"No posts"}
  </div>
 `;
}

function showModal(html){
 const old=$("modal");
 if(old)old.remove();

 const div=document.createElement("div");
 div.id="modal";
 div.className="modal";

 div.innerHTML=`
  <div class="modal-box">
   <button class="close" onclick="closeModal()">×</button>
   ${html}
  </div>
 `;

 document.body.appendChild(div);
}

function closeModal(){
 const m=$("modal");
 if(m)m.remove();
}
