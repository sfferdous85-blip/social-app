<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#1877f2">
<title>My Social App</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
:root{
 --blue:#1877f2;
 --blue2:#0866ff;
 --bg:#f0f2f5;
 --card:#fff;
 --text:#050505;
 --muted:#65676b;
 --border:#dddfe2;
 --green:#31a24c;
}
body.dark{
 --bg:#18191a;
 --card:#242526;
 --text:#e4e6eb;
 --muted:#b0b3b8;
 --border:#3a3b3c;
}
body{
 margin:0;
 background:var(--bg);
 color:var(--text);
 font-family:Arial,Helvetica,sans-serif;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* TOP */
.top{
 position:sticky;
 top:0;
 z-index:100;
 height:64px;
 background:var(--card);
 border-bottom:1px solid var(--border);
 display:flex;
 align-items:center;
 padding:8px 14px;
 gap:12px;
 box-shadow:0 1px 4px #0001;
}
.logo{
 font-size:25px;
 font-weight:900;
 color:var(--blue);
 white-space:nowrap;
}
.search{
 flex:1;
 max-width:500px;
 background:var(--bg);
 border-radius:25px;
 padding:11px 16px;
 border:0;
 outline:none;
 color:var(--text);
}
.topbtn{
 border:0;
 background:var(--bg);
 width:42px;
 height:42px;
 border-radius:50%;
 font-size:20px;
}
.topbtn:hover{background:#dfe3e8}

.nav{
 position:sticky;
 top:64px;
 z-index:90;
 background:var(--card);
 display:flex;
 justify-content:center;
 border-bottom:1px solid var(--border);
}
.nav button{
 flex:1;
 max-width:150px;
 border:0;
 background:none;
 color:var(--muted);
 padding:13px 5px;
 font-weight:700;
}
.nav button.active{
 color:var(--blue);
 border-bottom:3px solid var(--blue);
}

/* LAYOUT */
.container{
 max-width:720px;
 margin:18px auto;
 padding:0 10px;
}
.card{
 background:var(--card);
 border-radius:12px;
 box-shadow:0 1px 3px #0002;
 margin-bottom:14px;
 overflow:hidden;
}

/* STORIES */
.stories{
 display:flex;
 gap:10px;
 padding:12px;
 overflow-x:auto;
}
.story{
 min-width:105px;
 height:150px;
 border-radius:12px;
 background:linear-gradient(145deg,#1877f2,#8b5cf6);
 color:white;
 position:relative;
 overflow:hidden;
}
.story img{
 width:100%;
 height:100%;
 object-fit:cover;
}
.story span{
 position:absolute;
 bottom:8px;
 left:8px;
 right:5px;
 font-weight:bold;
 text-shadow:0 1px 3px #000;
}
.addstory{
 display:flex;
 align-items:center;
 justify-content:center;
 flex-direction:column;
 font-size:14px;
}

/* COMPOSER */
.composer{
 padding:14px;
}
.composer-head{
 display:flex;
 gap:10px;
 align-items:center;
}
.avatar{
 width:44px;
 height:44px;
 border-radius:50%;
 object-fit:cover;
 background:#ddd;
}
.openComposer{
 flex:1;
 border:0;
 background:var(--bg);
 color:var(--muted);
 padding:13px 17px;
 border-radius:25px;
 text-align:left;
}
.quick{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:5px;
 margin-top:12px;
 border-top:1px solid var(--border);
 padding-top:10px;
}
.quick button{
 border:0;
 background:none;
 padding:9px 4px;
 border-radius:8px;
 font-weight:700;
 color:var(--muted);
}
.quick button:hover{background:var(--bg)}
.photo{color:#20a84a!important}
.video{color:#e41e3f!important}
.feel{color:#f7b928!important}
.live{color:#f02849!important}

/* MODAL */
.modal{
 position:fixed;
 inset:0;
 z-index:1000;
 background:#0008;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:12px;
}
.modalbox{
 width:min(650px,100%);
 max-height:94vh;
 overflow:auto;
 background:var(--card);
 border-radius:16px;
 box-shadow:0 15px 50px #0008;
}
.modalhead{
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:14px 17px;
 border-bottom:1px solid var(--border);
}
.modalhead h2{margin:0;font-size:20px}
.close{
 border:0;
 background:var(--bg);
 width:38px;
 height:38px;
 border-radius:50%;
 font-size:22px;
}
.composer-body{padding:15px}
.userline{
 display:flex;
 align-items:center;
 gap:10px;
}
.userline b{display:block}
.privacy{
 font-size:12px;
 color:var(--muted);
 margin-top:3px;
}
.caption{
 width:100%;
 min-height:120px;
 resize:none;
 border:0;
 outline:0;
 background:transparent;
 color:var(--text);
 font-size:20px;
 margin:15px 0;
}
.caption::placeholder{color:var(--muted)}

.optionrow{
 display:flex;
 gap:8px;
 margin:8px 0;
 flex-wrap:wrap;
}
.option{
 border:1px solid var(--border);
 background:var(--bg);
 color:var(--text);
 border-radius:20px;
 padding:9px 13px;
}
.option.active{
 background:#e7f3ff;
 color:var(--blue);
 border-color:#9ac8ff;
}

/* MEDIA PICKER */
.media-picker{
 border:2px dashed #b7bcc3;
 border-radius:14px;
 min-height:150px;
 display:flex;
 align-items:center;
 justify-content:center;
 text-align:center;
 padding:20px;
 margin-top:10px;
 transition:.2s;
}
.media-picker:hover{
 border-color:var(--blue);
 background:#1877f208;
}
.pickinner{
 display:flex;
 flex-direction:column;
 align-items:center;
 gap:8px;
}
.pickicon{
 width:58px;
 height:58px;
 border-radius:50%;
 background:#e7f3ff;
 color:var(--blue);
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:28px;
}
.picktitle{font-size:17px;font-weight:800}
.picksub{font-size:13px;color:var(--muted)}

#mediaInput{display:none}

/* PREVIEW */
.preview{
 display:grid;
 gap:5px;
 margin-top:10px;
 border-radius:12px;
 overflow:hidden;
}
.preview.one{grid-template-columns:1fr}
.preview.two{grid-template-columns:1fr 1fr}
.preview.three{grid-template-columns:1fr 1fr}
.preview.four{grid-template-columns:1fr 1fr}
.mediaitem{
 min-height:150px;
 max-height:380px;
 position:relative;
 background:#111;
 overflow:hidden;
}
.mediaitem img,
.mediaitem video{
 width:100%;
 height:100%;
 object-fit:cover;
 display:block;
}
.preview.one .mediaitem{max-height:450px}
.preview.three .mediaitem:first-child{
 grid-row:span 2;
}
.removeMedia{
 position:absolute;
 top:8px;
 right:8px;
 width:34px;
 height:34px;
 border:0;
 border-radius:50%;
 background:#000b;
 color:white;
 font-size:18px;
 z-index:3;
}
.mediaCount{
 position:absolute;
 bottom:8px;
 left:8px;
 background:#000b;
 color:#fff;
 border-radius:20px;
 padding:5px 9px;
 font-size:12px;
}

/* EXTRA OPTIONS */
.extra{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:8px;
 margin-top:10px;
}
.extra button{
 background:var(--bg);
 color:var(--text);
 border:0;
 border-radius:10px;
 padding:12px;
 text-align:left;
}
.extra button:hover{background:#dfe3e8}

.publish{
 width:100%;
 border:0;
 background:var(--blue);
 color:white;
 border-radius:9px;
 padding:13px;
 font-weight:800;
 margin-top:12px;
 font-size:16px;
}
.publish:disabled{
 opacity:.5;
 cursor:not-allowed;
}

.progressbox{
 margin-top:10px;
 display:none;
}
.progressbar{
 height:9px;
 background:var(--bg);
 border-radius:20px;
 overflow:hidden;
}
.progressfill{
 width:0%;
 height:100%;
 background:var(--blue);
 transition:.2s;
}
.progresstext{
 font-size:13px;
 color:var(--muted);
 margin-top:5px;
}

/* POST */
.posthead{
 display:flex;
 align-items:center;
 gap:10px;
 padding:13px 14px 5px;
}
.postuser{font-weight:800}
.posttime{font-size:12px;color:var(--muted)}
.postbody{padding:8px 14px}
.posttext{
 white-space:pre-wrap;
 font-size:16px;
 line-height:1.45;
}
.postmedia{
 margin-top:10px;
 display:grid;
 gap:4px;
 overflow:hidden;
}
.postmedia.grid-two{grid-template-columns:1fr 1fr}
.postmedia.grid-three{grid-template-columns:1fr 1fr}
.postmedia.grid-four{grid-template-columns:1fr 1fr}
.postmedia .postmediaitem{
 position:relative;
 overflow:hidden;
 background:#111;
 min-height:180px;
}
.postmedia.grid-three .postmediaitem:first-child{
 grid-row:span 2;
}
.postmedia img,
.postmedia video{
 width:100%;
 height:100%;
 min-height:180px;
 max-height:600px;
 object-fit:cover;
 display:block;
 background:#111;
}
.postmedia.single .postmediaitem,
.postmedia.single img,
.postmedia.single video{
 min-height:0;
 max-height:600px;
}
.meta{
 padding:8px 14px;
 display:flex;
 justify-content:space-between;
 color:var(--muted);
 font-size:13px;
 border-bottom:1px solid var(--border);
}
.actions{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 padding:4px;
}
.actions button{
 border:0;
 background:none;
 color:var(--muted);
 padding:10px 4px;
 border-radius:7px;
 font-weight:700;
}
.actions button:hover{background:var(--bg)}
.actions button.liked{color:var(--blue)}

/* COMMENTS */
.commentbox{
 display:flex;
 gap:8px;
 padding:8px 12px 12px;
}
.commentbox input{
 flex:1;
 border:0;
 background:var(--bg);
 border-radius:20px;
 padding:10px 14px;
 outline:none;
 color:var(--text);
}
.commentbox button{
 border:0;
 background:var(--blue);
 color:white;
 width:40px;
 border-radius:50%;
}
.comments{
 padding:0 14px 10px;
}
.comment{
 background:var(--bg);
 border-radius:14px;
 padding:8px 11px;
 margin:5px 0;
}
.comment b{font-size:13px}
.comment div{font-size:14px;margin-top:3px}

/* FEED EMPTY */
.empty{
 text-align:center;
 padding:50px 20px;
 color:var(--muted);
}

/* REELS */
.reel{
 background:#000;
 border-radius:12px;
 overflow:hidden;
 margin-bottom:15px;
 position:relative;
}
.reel video{
 width:100%;
 max-height:720px;
 object-fit:cover;
 display:block;
}
.reelcaption{
 position:absolute;
 bottom:15px;
 left:15px;
 right:15px;
 color:white;
 text-shadow:0 1px 4px #000;
}

/* PROFILE */
.profilecover{
 height:220px;
 background:linear-gradient(135deg,#1877f2,#7c3aed);
 background-size:cover;
 background-position:center;
 position:relative;
}
.profilepic{
 width:130px;
 height:130px;
 border-radius:50%;
 border:5px solid var(--card);
 position:absolute;
 bottom:-65px;
 left:25px;
 object-fit:cover;
 background:#ddd;
}
.profileinfo{
 padding:75px 20px 20px;
}
.profileinfo h1{margin:0}
.profilebuttons{
 display:flex;
 gap:8px;
 margin-top:12px;
}
.profilebuttons button{
 border:0;
 background:var(--bg);
 color:var(--text);
 border-radius:8px;
 padding:10px 14px;
 font-weight:bold;
}

/* SEARCH */
.searchbox{
 padding:14px;
}
.searchbox input{
 width:100%;
 padding:13px;
 border:1px solid var(--border);
 border-radius:10px;
 background:var(--bg);
 color:var(--text);
 outline:none;
}
.result{
 display:flex;
 align-items:center;
 gap:10px;
 padding:10px;
 border-bottom:1px solid var(--border);
}
.result button{
 margin-left:auto;
 background:var(--blue);
 color:#fff;
 border:0;
 padding:7px 12px;
 border-radius:7px;
}

/* TOAST */
.toast{
 position:fixed;
 left:50%;
 bottom:25px;
 transform:translateX(-50%);
 z-index:2000;
 background:#111;
 color:#fff;
 padding:12px 18px;
 border-radius:25px;
 display:none;
 box-shadow:0 5px 25px #0005;
}

/* LOADER */
.loader{
 width:25px;
 height:25px;
 border:3px solid #ddd;
 border-top-color:var(--blue);
 border-radius:50%;
 animation:spin .7s linear infinite;
 margin:auto;
}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:600px){
 .top{height:58px}
 .logo{font-size:21px}
 .search{display:none}
 .nav{top:58px}
 .nav button{font-size:12px}
 .quick button{font-size:12px}
 .extra{grid-template-columns:1fr}
 .modal{padding:0}
 .modalbox{
  height:100%;
  max-height:100%;
  border-radius:0;
 }
 .caption{font-size:18px}
 .mediaitem{min-height:130px}
}
</style>
</head>

<body>

<header class="top">
 <div class="logo">My Social App</div>
 <input id="topSearch" class="search" placeholder="🔎 Search My Social App">
 <button class="topbtn" onclick="openSearch()">🔎</button>
 <button class="topbtn" onclick="toggleDark()">🌙</button>
 <button class="topbtn" onclick="showProfile()">👤</button>
</header>

<nav class="nav">
 <button id="navHome" class="active" onclick="showHome()">🏠<br>Home</button>
 <button onclick="showReels()">🎬<br>Reels</button>
 <button onclick="openSearch()">🔎<br>Search</button>
 <button onclick="showNotifications()">🔔<br>Alerts</button>
 <button onclick="showProfile()">👤<br>Profile</button>
</nav>

<main class="container">

 <!-- HOME -->
 <section id="homeSection">

  <div class="card stories">
   <div class="story addstory" onclick="openStory()">
    <strong style="font-size:30px">＋</strong>
    <span style="position:static;text-shadow:none">Create Story</span>
   </div>
   <div class="story">
    <div style="height:100%;display:flex;align-items:center;justify-content:center;font-size:45px">📸</div>
    <span>Your Story</span>
   </div>
   <div class="story">
    <div style="height:100%;display:flex;align-items:center;justify-content:center;font-size:45px">🎬</div>
    <span>Reels</span>
   </div>
  </div>

  <!-- PREMIUM COMPOSER -->
  <div class="card composer">
   <div class="composer-head">
    <img id="composerAvatar" class="avatar" src="">
    <button class="openComposer" onclick="openComposer()">
     What's on your mind?
    </button>
   </div>

   <div class="quick">
    <button class="video" onclick="openComposer('video')">🎥 Live Video</button>
    <button class="photo" onclick="openComposer('photo')">🖼️ Photo/Video</button>
    <button class="feel" onclick="openComposer('feeling')">😊 Feeling</button>
    <button class="live" onclick="openComposer('live')">🔴 Live</button>

  </div>

  <div id="feed"></div>

 </section>

 <!-- REELS -->
 <section id="reelsSection" class="hidden">
  <div class="card composer">
   <button class="publish" onclick="openReelUpload()">＋ Create Reel</button>
  </div>
  <div id="reels"></div>
 </section>

 <!-- SEARCH -->
 <section id="searchSection" class="hidden">
  <div class="card searchbox">
   <input id="peopleSearch" placeholder="People, posts, reels, hashtags..." oninput="searchUsers()">
  </div>
  <div class="card" id="searchResults"></div>
 </section>

 <!-- NOTIFICATIONS -->
 <section id="notificationsSection" class="hidden">
  <div class="card">
   <div style="padding:15px;font-size:20px;font-weight:bold">🔔 Notifications</div>
   <div id="notifications"></div>
  </div>
 </section>

 <!-- PROFILE -->
 <section id="profileSection" class="hidden">
  <div class="card">
   <div id="profileCover" class="profilecover">
    <img id="profilePic" class="profilepic">
   </div>
   <div class="profileinfo">
    <h1 id="profileName">User</h1>
    <p id="profileBio" style="color:var(--muted)">Your bio</p>
    <div id="profileStats"></div>
    <div class="profilebuttons">
     <button onclick="editProfile()">✏️ Edit Profile</button>
     <button onclick="openSettings()">⚙️ Settings</button>
    </div>
   </div>
  </div>

  <div class="card">
   <div style="padding:15px;font-weight:bold;font-size:18px">Posts</div>
   <div id="profilePosts"></div>
  </div>
 </section>

</main>

<!-- PREMIUM POST MODAL -->
<div id="composerModal" class="modal hidden">
 <div class="modalbox">

  <div class="modalhead">
   <h2>Create Post</h2>
   <button class="close" onclick="closeComposer()">×</button>
  </div>

  <div class="composer-body">

   <div class="userline">
    <img id="modalAvatar" class="avatar">
    <div>
     <b id="modalName">User</b>
     <div class="privacy">🌎 Public · Change</div>
    </div>
   </div>

   <textarea id="postText" class="caption"
    placeholder="What's on your mind?"></textarea>

   <!-- MEDIA PICKER -->
   <div id="mediaPicker" class="media-picker"

    <div class="pickinner">
     <div class="pickicon">🖼️</div>
     <div class="picktitle">Add Photos / Videos</div>
     <div class="picksub">Choose one or multiple photos and videos</div>
    </div>
   </div>

   <input
    id="mediaInput"
    type="file"
    accept="image/*,video/*"
    multiple
    onchange="handleMedia(event)"
   >

   <div id="preview" class="preview hidden"></div>

   <div class="optionrow">
    <button class="option active" onclick="setPrivacy(this,'public')">🌎 Public</button>
    <button class="option" onclick="setPrivacy(this,'friends')">👥 Friends</button>
    <button class="option" onclick="setPrivacy(this,'only_me')">🔒 Only Me</button>
   </div>

   <div class="extra">
    <button onclick="addFeeling()">😊 Feeling / Activity</button>
    <button onclick="addLocation()">📍 Check in</button>
    <button onclick="addTag()">👥 Tag People</button>
    <button onclick="addHashtag()">#️⃣ Hashtag</button>
   </div>

   <div id="extraInfo" style="color:var(--muted);font-size:14px;margin-top:8px"></div>

   <div class="progressbox" id="progressBox">
    <div class="progressbar">
     <div class="progressfill" id="progressFill"></div>
    </div>
    <div class="progresstext" id="progressText">Preparing upload...</div>
   </div>

   <button id="publishBtn" class="publish" onclick="publishPost()">
    🚀 Post
   </button>

  </div>
 </div>
</div>

<!-- REEL MODAL -->
<div id="reelModal" class="modal hidden">
 <div class="modalbox">
  <div class="modalhead">
   <h2>Create Reel</h2>
   <button class="close" onclick="closeReelUpload()">×</button>
  </div>
  <div class="composer-body">
   <textarea id="reelCaption" class="caption"
    placeholder="Write a caption for your Reel..."></textarea>

   <div class="media-picker" onclick="document.getElementById('reelInput').click()">
    <div class="pickinner">
     <div class="pickicon">🎬</div>
     <div class="picktitle">Choose Reel Video</div>
     <div class="picksub">MP4, WebM, MOV and supported video files</div>
    </div>
   </div>

   <input id="reelInput" type="file" accept="video/*" onchange="previewReel(event)">
   <div id="reelPreview"></div>

   <div class="progressbox" id="reelProgressBox">
    <div class="progressbar">
     <div class="progressfill" id="reelProgressFill"></div>
    </div>
    <div class="progresstext" id="reelProgressText">Uploading...</div>
   </div>

   <button class="publish" onclick="publishReel()">🎬 Publish Reel</button>
  </div>
 </div>
</div>

<div id="toast" class="toast"></div>

<script>
/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL = "https://skereuaizdczbvjplisi.supabase.co";
const SUPABASE_KEY = "sb_publishable_3R2otJA1zIlsMsTYxe1ocw_NAPY5O9x";

const {createClient} = supabase;
const db = createClient(SUPABASE_URL,SUPABASE_KEY);

let currentUser = null;
let currentProfile = null;
let selectedMedia = [];
let selectedPrivacy = "public";
let selectedFeeling = "";
let selectedLocation = "";
let selectedTag = "";

/* =========================================================
   HELPERS
========================================================= */

function $(id){
 return document.getElementById(id);
}

function toast(message){
 const t=$("toast");
 t.textContent=message;
 t.style.display="block";
 clearTimeout(window.toastTimer);
 window.toastTimer=setTimeout(()=>t.style.display="none",3000);
}

function escapeHTML(value){
 if(value==null)return "";
 return String(value)
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
}

function formatDate(date){
 try{
  return new Date(date).toLocaleString("bn-BD",{
   dateStyle:"medium",
   timeStyle:"short"
  });
 }catch(e){return ""}
}

function getAvatar(profile){
 return profile?.profile_photo || profile?.avatar_url ||
 "https://ui-avatars.com/api/?name=User&background=1877f2&color=fff";
}

function normalizeMediaUrls(value){
 if(!value)return [];

 if(Array.isArray(value)){
  return value
   .map(item=>{
    if(typeof item==="string"){
     return {url:item,type:"image"};
    }

    if(item && typeof item==="object"){
     const url=item.url || item.public_url || item.media_url;
     if(!url)return null;

     return {
      url,
      type:item.type || (
       item.mime_type?.startsWith("video/")
       ? "video"
       : "image"
      )
     };
    }

    return null;
   })
   .filter(Boolean);
 }

 if(typeof value==="object"){
  return normalizeMediaUrls(
   value.items || value.media || value.urls || []
  );
 }

 return [];
}

function getPostMedia(post){
 const gallery=normalizeMediaUrls(
  post.post_media || post.media || post.media_urls
 );

 if(gallery.length)return gallery;

 const fallback=[];

 if(post.image_url){
  fallback.push({
   url:post.image_url,
   type:"image"
  });
 }

 if(post.video_url){
  fallback.push({
   url:post.video_url,
   type:"video"
  });
 }

 return fallback;
}

/* =========================================================
   MEDIA SELECTION
========================================================= */

function handleMedia(event){
 const files=Array.from(event.target.files || []);

 if(!files.length)return;

 const maxFiles=10;

 if(files.length>maxFiles){
  toast("একসাথে সর্বোচ্চ ১০টি media");
 }

 const picked=files.slice(0,maxFiles);

 selectedMedia=picked.map(file=>({
  file,
  id:crypto.randomUUID()
 }));

 renderPreview();
}

function renderPreview(){
 const box=$("preview");

 box.innerHTML="";

 if(!selectedMedia.length){
  box.className="preview hidden";
  return;
 }

 box.className="preview "+(
  selectedMedia.length===1?"one":
  selectedMedia.length===2?"two":
  selectedMedia.length===3?"three":"four"
 );

 selectedMedia.forEach((item,index)=>{
  const div=document.createElement("div");
  div.className="mediaitem";

  const remove=document.createElement("button");
  remove.className="removeMedia";
  remove.innerHTML="×";
  remove.onclick=()=>{
   selectedMedia.splice(index,1);
   renderPreview();
  };

  if(item.file.type.startsWith("image/")){
   const img=document.createElement("img");
   img.src=URL.createObjectURL(item.file);
   div.appendChild(img);
  }
  else if(item.file.type.startsWith("video/")){
   const video=document.createElement("video");
   video.src=URL.createObjectURL(item.file);
   video.controls=true;
   video.playsInline=true;
   div.appendChild(video);
  }

  div.appendChild(remove);

  if(selectedMedia.length>1){
   const count=document.createElement("div");
   count.className="mediaCount";
   count.textContent=(index+1)+" / "+selectedMedia.length;
   div.appendChild(count);
  }

  box.appendChild(div);
 });
}

========================================================= */

async function uploadFile(file,bucket,folder,onProgress){

 if(!currentUser){
  throw new Error("User not logged in");
 }

 const safeName=file.name
  .replace(/[^\w.\-]+/g,"_")
  .slice(-100);

 const path=
  currentUser.id+
  "/"+
  Date.now()+
  "-"+
  Math.random().toString(36).slice(2,8)+
  "-"+
  safeName;

 if(onProgress)onProgress(15);

 const {error}=await db.storage
  .from(bucket)
  .upload(path,file,{
   cacheControl:"3600",
   upsert:false,
   contentType:file.type
  });

 if(error)throw error;

 if(onProgress)onProgress(75);

 const {data}=db.storage
  .from(bucket)
  .getPublicUrl(path);

 if(onProgress)onProgress(100);

 return data.publicUrl;
}

   PUBLISH POST
========================================================= */

async function publishPost(){

 if(!currentUser){
  toast("আগে Login করুন");
  return;
 }

 const text=$("postText").value.trim();

 if(!text && !selectedMedia.length){
  toast("Post-এ কিছু যোগ করুন");
  return;
 }

 const btn=$("publishBtn");
 btn.disabled=true;

 $("progressBox").style.display="block";
 $("progressText").textContent="Preparing upload...";
 $("progressFill").style.width="5%";

 try{

  const mediaUrls=[];

  if(selectedMedia.length){

   for(let i=0;i<selectedMedia.length;i++){

    const item=selectedMedia[i];

    const percent=Math.round(
     (i/selectedMedia.length)*80
    );

    $("progressText").textContent=
     `Uploading ${i+1}/${selectedMedia.length}...`;

    $("progressFill").style.width=
     Math.max(5,percent)+"%";

    const bucket=
     item.file.type.startsWith("image/")
     ? "post-images"
     : "media";

    const url=await uploadFile(
     item.file,
     bucket,
     currentUser.id,
     p=>{
      const totalBase=
       Math.round((i/selectedMedia.length)*80);

      $("progressFill").style.width=
       Math.min(90,totalBase+Math.round(p/10))+"%";
     }
    );

    mediaUrls.push({
     url,
     type:item.file.type.startsWith("video/")
      ? "video"
      : "image",
     mime_type:item.file.type,
     name:item.file.name,
     position:i
    });
   }
  }

  $("progressText").textContent="Publishing post...";
  $("progressFill").style.width="92%";

  const firstImage=
   mediaUrls.find(item=>item.type==="image")?.url || null;

  const firstVideo=
   mediaUrls.find(item=>item.type==="video")?.url || null;

  const postData={
   user_id:currentUser.id,
   text:text || null,
   image_url:firstImage,
   video_url:firstVideo,
   privacy:selectedPrivacy,
   feeling:selectedFeeling || null,
   promoted:false,
   view_count:0
  };

  const {data,error}=await db
   .from("posts")
   .insert(postData)
   .select()
   .single();

  if(error)throw error;

  if(mediaUrls.length){
   const mediaRows=mediaUrls.map(item=>({
    post_id:data.id,
    user_id:currentUser.id,
    media_url:item.url,
    media_type:item.type,
    mime_type:item.mime_type,
    file_name:item.name,
    position:item.position
   }));

   const {error:mediaError}=await db
    .from("post_media")
    .insert(mediaRows);

   if(mediaError){
    const jsonbResult=await db
     .from("posts")
     .update({
      media_urls:mediaUrls
     })
     .eq("id",data.id);

    if(jsonbResult.error)throw mediaError;
   }
  }

  $("progressFill").style.width="100%";
  $("progressText").textContent="Post published successfully!";

  toast("🎉 Post সফলভাবে প্রকাশ হয়েছে");

  setTimeout(()=>{
   closeComposer();
   resetComposer();
   loadFeed();
  },600);

 }catch(error){

  console.error(error);

  $("progressText").textContent=
   "Upload failed: "+error.message;

  $("progressFill").style.width="0%";

  toast("❌ Upload/Post failed");

  btn.disabled=false;
 }
}

/* =========================================================
   POST RENDER
========================================================= */

function renderPost(post,profile=null){

 const p=profile || currentProfile || {};

 const name=p.name || "User";
 const avatar=getAvatar(p);
 const mediaItems=getPostMedia(post);

 let media="";

 if(mediaItems.length){
  const layout=
   mediaItems.length===1
   ?"single"
   :mediaItems.length===2
   ?"grid-two"
   :mediaItems.length===3
   ?"grid-three"
   :"grid-four";

  media=`
   <div class="postmedia ${layout}">
    ${mediaItems.map((item,index)=>{
     const url=escapeHTML(item.url);
     const label=`Media ${index+1}`;

     if(item.type==="video"){
      return `
       <div class="postmediaitem">
        <video
         src="${url}"
         controls
         playsinline
         preload="metadata"
         aria-label="${label}">
        </video>
       </div>`;
     }

     return `
      <div class="postmediaitem">
       <img
        src="${url}"
        loading="lazy"
        alt="${label}">
      </div>`;
    }).join("")}
   </div>`;
 }

 let feeling=
  post.feeling
  ? `<div style="color:var(--muted);font-size:13px">
      😊 ${escapeHTML(post.feeling)}
     </div>`
  :"";

 return `
 <article class="card post" id="post-${post.id}">

  <div class="posthead">
   <img class="avatar" src="${escapeHTML(avatar)}">
   <div>
    <div class="postuser">${escapeHTML(name)}</div>
    <div class="posttime">
     ${formatDate(post.created_at)} ·
     ${post.privacy==="friends"?"👥":"🌎"}
    </div>
   </div>
  </div>

  <div class="postbody">
   ${post.text?
    `<div class="posttext">${escapeHTML(post.text)}</div>`
    :""}

   ${feeling}

   ${media}
  </div>

  <div class="meta">
   <span id="like-count-${post.id}">❤️ 0</span>
   <span>💬 <span id="comment-count-${post.id}">0</span> · ↗ Share</span>
  </div>

  <div class="actions">
   <button id="like-btn-${post.id}"
    onclick="toggleLike('${post.id}')">
    👍 Like
   </button>

   <button onclick="focusComment('${post.id}')">
    💬 Comment
   </button>

   <button onclick="sharePost('${post.id}')">
    ↗ Share
   </button>

   <button onclick="savePost('${post.id}')">
    🔖 Save
   </button>
  </div>

  <div class="comments" id="comments-${post.id}"></div>

  <div class="commentbox">
   <input
    id="comment-input-${post.id}"
    placeholder="Write a comment..."
    onkeydown="if(event.key==='Enter')addComment('${post.id}')">
   <button onclick="addComment('${post.id}')">➤</button>
  </div>

 </article>`;
}

     </div>
    </div>
    <button onclick="viewUser('${p.id}')">View</button>
   </div>
  `).join("") ||
  `<div class="empty">No users found</div>`;
}

async function viewUser(userId){

 const {data,error}=await db
  .from("profiles")
  .select("*")
  .eq("id",userId)
  .single();

 if(error){
  toast(error.message);
  return;
 }

 alert(
  (data.name||"User")+
  "\n\n"+
  (data.bio||"No bio")
 );
}

/* =========================================================
   REELS
========================================================= */

function openReelUpload(){
 $("reelModal").classList.remove("hidden");
}

function closeReelUpload(){
 $("reelModal").classList.add("hidden");
 $("reelInput").value="";
 $("reelPreview").innerHTML="";
}

function previewReel(event){

 const file=event.target.files?.[0];

 if(!file)return;

 if(!file.type.startsWith("video/")){
  toast("Please choose a video");
  return;
 }

 const url=URL.createObjectURL(file);

 $("reelPreview").innerHTML=`
  <video
   src="${url}"
   controls
   playsinline
   style="width:100%;max-height:550px;border-radius:12px;margin-top:10px">
  </video>`;
}

async function publishReel(){

 if(!currentUser)return;

 const file=$("reelInput").files?.[0];

 if(!file){
  toast("Reel video নির্বাচন করুন");
  return;
 }

 const caption=$("reelCaption").value.trim();

 $("reelProgressBox").style.display="block";

 try{

  const url=await uploadFile(
   file,
   "reels",
   currentUser.id,
   p=>{
    $("reelProgressFill").style.width=p+"%";
    $("reelProgressText").textContent=
     "Uploading "+p+"%";
   }
  );

  const {error}=await db
   .from("reels")
   .insert({
    user_id:currentUser.id,
    video_url:url,
    caption:caption,
    views:0
   });

  if(error)throw error;

  toast("🎬 Reel published");

  closeReelUpload();
  loadReels();

 }catch(e){

  console.error(e);
  toast("Reel upload failed: "+e.message);
 }
}

async function loadReels(){

 const box=$("reels");

 box.innerHTML=
  `<div class="card empty"><div class="loader"></div></div>`;

 const {data,error}=await db
  .from("reels")
  .select("*")
  .order("created_at",{ascending:false})
  .limit(30);

 if(error){
  box.innerHTML=
   `<div class="card empty">${escapeHTML(error.message)}</div>`;
  return;
 }

 box.innerHTML=(data||[]).map(r=>`
  <div class="reel">
   <video
    src="${escapeHTML(r.video_url)}"
    controls
    playsinline
    loop>
   </video>
   <div class="reelcaption">
    <b>${escapeHTML(currentProfile?.name||"Creator")}</b>
    <div>${escapeHTML(r.caption||"")}</div>
   </div>
  </div>
 `).join("") ||
 `<div class="card empty">No Reels yet</div>`;
}

/* =========================================================
   NOTIFICATIONS
========================================================= */

async function loadNotifications(){

 const box=$("notifications");

 const {data,error}=await db
  .from("notifications")
  .select("*")
  .eq("receiver_id",currentUser.id)
  .order("created_at",{ascending:false})
  .limit(50);

 if(error){
  box.innerHTML=
   `<div class="empty">${escapeHTML(error.message)}</div>`;
  return;
 }

 box.innerHTML=(data||[]).map(n=>`
  <div style="
   padding:14px;
   border-top:1px solid var(--border)">
   🔔 ${escapeHTML(n.text||"Notification")}
   <div style="font-size:11px;color:var(--muted)">
    ${formatDate(n.created_at)}
   </div>
  </div>
 `).join("") ||
 `<div class="empty">No notifications</div>`;
}

function openSettings(){

 const choice=prompt(
  "Settings\n\n"+
  "1 = Logout\n"+
  "2 = Dark/Light\n"+
  "3 = Edit Profile\n\n"+
  "Number:"
 );

 if(choice==="1")logout();
 if(choice==="2")toggleDark();
 if(choice==="3")editProfile();
}

async function logout(){
 await db.auth.signOut();
 location.reload();
}

  currentUser=null;
 }

 if(event==="SIGNED_IN"){
  currentUser=session.user;
 }
});
