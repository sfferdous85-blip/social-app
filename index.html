<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Social App</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f0f2f5;
    color:#222;
}

button{
    cursor:pointer;
    border:none;
}

.page{
    display:none;
}

.active{
    display:block;
}

/* AUTH */
.auth{
    max-width:400px;
    margin:60px auto;
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 2px 10px #bbb;
}

.auth h1{
    text-align:center;
    color:#1877f2;
    margin-bottom:25px;
}

.auth input{
    width:100%;
    padding:13px;
    margin:8px 0;
    border:1px solid #ddd;
    border-radius:7px;
}

.auth button{
    width:100%;
    padding:13px;
    background:#1877f2;
    color:white;
    border-radius:7px;
    margin-top:10px;
    font-size:16px;
}

.auth p{
    text-align:center;
    margin-top:15px;
    color:#1877f2;
    cursor:pointer;
}

/* HEADER */
.header{
    position:sticky;
    top:0;
    z-index:100;
    background:#1877f2;
    color:white;
    padding:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header h2{
    font-size:20px;
}

.header button{
    background:rgba(255,255,255,.15);
    color:white;
    padding:8px 10px;
    border-radius:7px;
    margin-left:4px;
}

.notificationBtn{
    position:relative;
}

.badge{
    position:absolute;
    top:-5px;
    right:-5px;
    background:red;
    color:white;
    border-radius:50%;
    font-size:11px;
    min-width:18px;
    height:18px;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* CONTAINER */
.container{
    max-width:650px;
    margin:auto;
    padding:15px;
}

/* POST BOX */
.createPost{
    background:white;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
    box-shadow:0 1px 4px #ddd;
}

.createPost textarea{
    width:100%;
    min-height:80px;
    padding:10px;
    border:1px solid #ddd;
    border-radius:8px;
    resize:none;
}

.postActions{
    display:flex;
    gap:8px;
    margin-top:10px;
}

.postActions label,
.postActions button{
    flex:1;
    padding:10px;
    background:#eee;
    border-radius:7px;
    text-align:center;
}

.postActions button{
    background:#1877f2;
    color:white;
}

.preview{
    max-width:100%;
    max-height:300px;
    margin-top:10px;
    border-radius:8px;
    display:none;
}

/* POST */
.post{
    background:white;
    border-radius:10px;
    margin-bottom:15px;
    padding:15px;
    box-shadow:0 1px 4px #ddd;
}

.postHeader{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.userInfo{
    display:flex;
    align-items:center;
    gap:10px;
}

.avatar{
    width:45px;
    height:45px;
    border-radius:50%;
    object-fit:cover;
    background:#ddd;
}

.postName{
    font-weight:bold;
}

.postMenu{
    position:relative;
}

.postMenu button{
    background:none;
    font-size:20px;
}

.menuBox{
    display:none;
    position:absolute;
    right:0;
    top:30px;
    background:white;
    width:130px;
    box-shadow:0 2px 8px #aaa;
    border-radius:7px;
    overflow:hidden;
    z-index:5;
}

.menuBox button{
    width:100%;
    padding:10px;
    text-align:left;
    font-size:14px;
}

.menuBox button:hover{
    background:#eee;
}

.postText{
    margin:12px 0;
    white-space:pre-wrap;
}

.postImage{
    width:100%;
    max-height:500px;
    object-fit:cover;
    border-radius:8px;
}

.stats{
    display:flex;
    justify-content:space-between;
    padding:8px 0;
    color:#666;
    font-size:14px;
}

.postButtons{
    display:flex;
    border-top:1px solid #ddd;
    border-bottom:1px solid #ddd;
}

.postButtons button{
    flex:1;
    padding:10px;
    background:white;
    font-size:14px;
}

.postButtons button:hover{
    background:#f0f2f5;
}

.liked{
    color:#1877f2;
    font-weight:bold;
}

/* COMMENT */
.commentBox{
    display:none;
    margin-top:10px;
}

.commentInput{
    width:100%;
    padding:10px;
    border:1px solid #ddd;
    border-radius:7px;
}

.comment{
    background:#f0f2f5;
    padding:8px 10px;
    border-radius:8px;
    margin-top:6px;
    font-size:14px;
}

/* PROFILE */
.profile{
    background:white;
    border-radius:10px;
    overflow:hidden;
    margin-bottom:15px;
}

.cover{
    height:220px;
    background:#ddd;
    position:relative;
}

.cover img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.profileInfo{
    padding:15px;
    position:relative;
}

.profilePic{
    width:110px;
    height:110px;
    border-radius:50%;
    border:4px solid white;
    object-fit:cover;
    margin-top:-65px;
    background:#ddd;
}

.profileName{
    font-size:23px;
    font-weight:bold;
    margin-top:5px;
}

.bio{
    color:#666;
    margin:6px 0;
}

.counts{
    display:flex;
    gap:20px;
    margin:12px 0;
}

.counts div{
    cursor:pointer;
}

.profileButtons{
    display:flex;
    gap:8px;
}

.profileButtons button{
    padding:9px 14px;
    border-radius:7px;
    background:#1877f2;
    color:white;
}

.profileButtons .secondary{
    background:#e4e6eb;
    color:#222;
}

/* EDIT PROFILE */
.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:200;
    padding:20px;
}

.modalContent{
    background:white;
    max-width:450px;
    margin:50px auto;
    padding:20px;
    border-radius:10px;
}

.modalContent h2{
    margin-bottom:15px;
}

.modalContent input,
.modalContent textarea{
    width:100%;
    padding:11px;
    margin:7px 0;
    border:1px solid #ddd;
    border-radius:7px;
}

.modalContent textarea{
    min-height:90px;
}

.modalButtons{
    display:flex;
    gap:8px;
}

.modalButtons button{
    flex:1;
    padding:11px;
    border-radius:7px;
}

.saveBtn{
    background:#1877f2;
    color:white;
}

.cancelBtn{
    background:#ddd;
}

/* SEARCH */
.searchBox{
    background:white;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
}

.searchBox input{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:7px;
}

.userResult{
    background:white;
    padding:12px;
    margin-bottom:8px;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    box-shadow:0 1px 3px #ddd;
}

.userResultLeft{
    display:flex;
    align-items:center;
    gap:10px;
}

.userResult button{
    background:#1877f2;
    color:white;
    padding:8px 12px;
    border-radius:7px;
}

/* NOTIFICATION */
.notificationPanel{
    display:none;
    position:fixed;
    top:58px;
    right:10px;
    width:330px;
    max-width:calc(100% - 20px);
    background:white;
    border-radius:10px;
    box-shadow:0 3px 15px #999;
    z-index:150;
    max-height:500px;
    overflow-y:auto;
}

.notificationHeader{
    padding:14px;
    border-bottom:1px solid #ddd;
    font-weight:bold;
}

.notification{
    padding:12px;
    border-bottom:1px solid #eee;
    font-size:14px;
}

.notification.unread{
    background:#eaf3ff;
}

.notification small{
    color:#777;
    display:block;
    margin-top:4px;
}

/* LIST */
.listBox{
    background:white;
    border-radius:10px;
    padding:15px;
}

.listUser{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid #eee;
}

.listUserLeft{
    display:flex;
    align-items:center;
    gap:10px;
}

.listUser button{
    padding:7px 12px;
    background:#1877f2;
    color:white;
    border-radius:7px;
}

/* EMPTY */
.empty{
    text-align:center;
    padding:30px;
    color:#777;
}

/* MOBILE */
@media(max-width:600px){
    .container{
        padding:8px;
    }

    .cover{
        height:170px;
    }

    .profilePic{
        width:90px;
        height:90px;
    }

    .notificationPanel{
        right:5px;
        width:calc(100% - 10px);
    }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="page active">
    <div class="auth">
        <h1>My Social App</h1>

        <input id="loginEmail" type="email" placeholder="Email">
        <input id="loginPassword" type="password" placeholder="Password">

        <button onclick="login()">Login</button>

        <p onclick="showRegister()">Create new account</p>
    </div>
</div>

<!-- REGISTER -->
<div id="registerPage" class="page">
    <div class="auth">
        <h1>Create Account</h1>

        <input id="regName" placeholder="Full Name">
        <input id="regEmail" type="email" placeholder="Email">
        <input id="regPassword" type="password" placeholder="Password">

        <button onclick="register()">Register</button>

        <p onclick="showLogin()">Already have an account? Login</p>
    </div>
</div>

<!-- HOME -->
<div id="homePage" class="page">

    <div class="header">
        <h2>My Social App</h2>

        <div>
            <button onclick="showHome()">🏠</button>
            <button onclick="showProfile()">👤</button>
            <button onclick="showSearch()">🔎</button>

            <button class="notificationBtn" onclick="toggleNotifications()">
                🔔
                <span id="notificationBadge" class="badge" style="display:none">0</span>
            </button>

            <button onclick="logout()">Logout</button>
        </div>
    </div>

    <div id="notificationPanel" class="notificationPanel">
        <div class="notificationHeader">
            Notifications
            <button onclick="markAllRead()" style="float:right;background:none;color:#1877f2;">
                Mark all read
            </button>
        </div>

        <div id="notificationList"></div>
    </div>

    <div class="container">

        <!-- CREATE POST -->
        <div class="createPost">
            <textarea id="postText" placeholder="What's on your mind?"></textarea>

            <img id="postPreview" class="preview">

            <div class="postActions">

                <label>
                    📷 Photo
                    <input
                        id="postPhoto"
                        type="file"
                        accept="image/*"
                        style="display:none"
                        onchange="previewPostPhoto(event)"
                    >
                </label>

                <button onclick="createPost()">Post</button>

            </div>
        </div>

        <div id="feed"></div>

    </div>
</div>

<!-- PROFILE -->
<div id="profilePage" class="page">

    <div class="header">
        <h2>My Profile</h2>

        <div>
            <button onclick="showHome()">🏠</button>
            <button onclick="showSearch()">🔎</button>
            <button onclick="toggleNotifications()">🔔</button>
            <button onclick="logout()">Logout</button>
        </div>
    </div>

    <div class="container">

        <div class="profile">

            <div class="cover">
                <img id="myCover">
            </div>

            <div class="profileInfo">

                <img id="myProfilePhoto" class="profilePic">

                <div id="myName" class="profileName"></div>

                <div id="myBio" class="bio"></div>

                <div class="counts">

                    <div onclick="showFollowers(currentUserId)">
                        <b id="myFollowers">0</b>
                        <br>
                        Followers
                    </div>

                    <div onclick="showFollowing(currentUserId)">
                        <b id="myFollowing">0</b>
                        <br>
                        Following
                    </div>

                    <div>
                        <b id="myPostsCount">0</b>
                        <br>
                        Posts
                    </div>

                </div>

                <div class="profileButtons">

                    <button onclick="openEditProfile()">
                        Edit Profile
                    </button>

                    <label class="secondary" style="padding:9px 14px;border-radius:7px;cursor:pointer;">
                        🖼️ Cover
                        <input
                            type="file"
                            accept="image/*"
                            style="display:none"
                            onchange="changeCoverPhoto(event)"
                        >
                    </label>

                    <label class="secondary" style="padding:9px 14px;border-radius:7px;cursor:pointer;">
                        📷 Profile
                        <input
                            type="file"
                            accept="image/*"
                            style="display:none"
                            onchange="changeProfilePhoto(event)"
                        >
                    </label>

                </div>

            </div>
        </div>

        <h3 style="margin:12px 0;">My Posts</h3>

        <div id="myPosts"></div>

    </div>
</div>

<!-- OTHER USER PROFILE -->
<div id="userProfilePage" class="page">

    <div class="header">
        <h2>User Profile</h2>

        <div>
            <button onclick="showHome()">🏠</button>
            <button onclick="showSearch()">🔎</button>
        </div>
    </div>

    <div class="container">

        <div class="profile">

            <div class="cover">
                <img id="otherCover">
            </div>

            <div class="profileInfo">

                <img id="otherProfilePhoto" class="profilePic">

                <div id="otherName" class="profileName"></div>

                <div id="otherBio" class="bio"></div>

                <div class="counts">

                    <div onclick="showFollowers(viewingUserId)">
                        <b id="otherFollowers">0</b>
                        <br>
                        Followers
                    </div>

                    <div onclick="showFollowing(viewingUserId)">
                        <b id="otherFollowing">0</b>
                        <br>
                        Following
                    </div>

                    <div>
                        <b id="otherPostsCount">0</b>
                        <br>
                        Posts
                    </div>

                </div>

                <div class="profileButtons">

                    <button id="followButton" onclick="toggleFollowFromProfile()">
                        Follow
                    </button>

                </div>

            </div>
        </div>

        <h3 style="margin:12px 0;">Posts</h3>

        <div id="otherPosts"></div>

    </div>
</div>

<!-- SEARCH -->
<div id="searchPage" class="page">

    <div class="header">
        <h2>Search Users</h2>

        <div>
            <button onclick="showHome()">🏠</button>
            <button onclick="showProfile()">👤</button>
        </div>
    </div>

    <div class="container">

        <div class="searchBox">
            <input
                id="searchInput"
                placeholder="Search by name or email..."
                oninput="searchUsers()"
            >
        </div>

        <div id="searchResults"></div>

    </div>
</div>

<!-- LIST PAGE -->
<div id="listPage" class="page">

    <div class="header">
        <h2 id="listTitle">Users</h2>

        <div>
            <button onclick="showHome()">🏠</button>
            <button onclick="showProfile()">👤</button>
        </div>
    </div>

    <div class="container">
        <div class="listBox" id="userList"></div>
    </div>

</div>

<!-- EDIT PROFILE MODAL -->
<div id="editModal" class="modal">

    <div class="modalContent">

        <h2>Edit Profile</h2>

        <input id="editName" placeholder="Name">

        <textarea id="editBio" placeholder="Bio"></textarea>

        <div class="modalButtons">
            <button class="saveBtn" onclick="saveProfile()">
                Save
            </button>

            <button class="cancelBtn" onclick="closeEditProfile()">
                Cancel
            </button>
        </div>

    </div>
</div>

<script>

/* =========================
   DATABASE
========================= */

let users = JSON.parse(localStorage.getItem("users") || "[]");
let posts = JSON.parse(localStorage.getItem("posts") || "[]");
let notifications = JSON.parse(localStorage.getItem("notifications") || "[]");

let currentUserId = localStorage.getItem("currentUser");
let viewingUserId = null;

let selectedPostImage = "";


/* =========================
   SAVE DATABASE
========================= */

function saveUsers(){
    localStorage.setItem("users", JSON.stringify(users));
}

function savePosts(){
    localStorage.setItem("posts", JSON.stringify(posts));
}

function saveNotifications(){
    localStorage.setItem(
        "notifications",
        JSON.stringify(notifications)
    );
}


/* =========================
   USER HELPERS
========================= */

function getCurrentUser(){
    return users.find(u => String(u.id) === String(currentUserId));
}

function getUser(id){
    return users.find(u => String(u.id) === String(id));
}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(text){

    if(text === undefined || text === null){
        return "";
    }

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================
   DEFAULT PHOTOS
========================= */

function getPhoto(user){

    return user && user.profilePhoto
        ? user.profilePhoto
        : "https://via.placeholder.com/150?text=User";
}

function getCover(user){

    return user && user.coverPhoto
        ? user.coverPhoto
        : "https://via.placeholder.com/800x250?text=Cover";
}


/* =========================
   AUTH
========================= */

function showRegister(){

    document.getElementById("loginPage").classList.remove("active");
    document.getElementById("registerPage").classList.add("active");
}

function showLogin(){

    document.getElementById("registerPage").classList.remove("active");
    document.getElementById("loginPage").classList.add("active");
}


function register(){

    const name =
        document.getElementById("regName").value.trim();

    const email =
        document.getElementById("regEmail").value.trim();

    const password =
        document.getElementById("regPassword").value;

    if(!name || !email || !password){

        alert("সব তথ্য পূরণ করুন।");
        return;
    }

    if(users.some(u => u.email.toLowerCase() === email.toLowerCase())){

        alert("এই Email দিয়ে আগে থেকেই account আছে।");
        return;
    }

    const newUser = {

        id:Date.now(),

        name:name,

        email:email,

        password:password,

        bio:"",

        profilePhoto:"",

        coverPhoto:"",

        followers:[],

        following:[]
    };

    users.push(newUser);

    saveUsers();

    alert("Account তৈরি হয়েছে। এখন Login করুন।");

    document.getElementById("regName").value="";
    document.getElementById("regEmail").value="";
    document.getElementById("regPassword").value="";

    showLogin();
}


function login(){

    const email =
        document.getElementById("loginEmail").value.trim();

    const password =
        document.getElementById("loginPassword").value;

    const user = users.find(
        u =>
        u.email.toLowerCase() === email.toLowerCase() &&
        u.password === password
    );

    if(!user){

        alert("Email অথবা Password ভুল।");
        return;
    }

    currentUserId = user.id;

    localStorage.setItem(
        "currentUser",
        user.id
    );

    showHome();
}


function logout(){

    localStorage.removeItem("currentUser");

    currentUserId = null;

    hideAllPages();

    document.getElementById("loginPage")
        .classList.add("active");
}


/* =========================
   PAGE CONTROL
========================= */

function hideAllPages(){

    document
        .querySelectorAll(".page")
        .forEach(p => p.classList.remove("active"));
}


function showHome(){

    if(!currentUserId) return;

    hideAllPages();

    document.getElementById("homePage")
        .classList.add("active");

    loadPosts();

    updateNotificationBadge();
}


function showProfile(){

    if(!currentUserId) return;

    hideAllPages();

    document.getElementById("profilePage")
        .classList.add("active");

    loadProfile();
}


function showSearch(){

    if(!currentUserId) return;

    hideAllPages();

    document.getElementById("searchPage")
        .classList.add("active");

    document.getElementById("searchInput").value="";

    document.getElementById("searchResults").innerHTML="";

}


/* =========================
   PROFILE
========================= */

function loadProfile(){

    const user = getCurrentUser();

    if(!user) return;

    document.getElementById("myName").textContent =
        user.name;

    document.getElementById("myBio").textContent =
        user.bio || "No bio yet.";

    document.getElementById("myProfilePhoto").src =
        getPhoto(user);

    document.getElementById("myCover").src =
        getCover(user);

    document.getElementById("myFollowers").textContent =
        user.followers.length;

    document.getElementById("myFollowing").textContent =
        user.following.length;

    const myPosts =
        posts.filter(p => String(p.userId) === String(user.id));

    document.getElementById("myPostsCount").textContent =
        myPosts.length;

    loadMyPosts();
}


function openEditProfile(){

    const user = getCurrentUser();

    document.getElementById("editName").value =
        user.name;

    document.getElementById("editBio").value =
        user.bio || "";

    document.getElementById("editModal").style.display =
        "block";
}


function closeEditProfile(){

    document.getElementById("editModal").style.display =
        "none";
}


function saveProfile(){

    const user = getCurrentUser();

    const name =
        document.getElementById("editName").value.trim();

    const bio =
        document.getElementById("editBio").value.trim();

    if(!name){

        alert("Name দিতে হবে।");
        return;
    }

    user.name = name;
    user.bio = bio;

    saveUsers();

    posts.forEach(p => {

        if(String(p.userId) === String(user.id)){
            p.name = name;
        }

    });

    savePosts();

    closeEditProfile();

    loadProfile();
    loadPosts();

    alert("Profile updated!");
}


/* =========================
   PROFILE PHOTOS
========================= */

function resizeImage(file, callback){

    const reader = new FileReader();

    reader.onload = function(e){

        const img = new Image();

        img.onload = function(){

            const canvas =
                document.createElement("canvas");

            const max = 900;

            let width = img.width;
            let height = img.height;

            if(width > max){

                height =
                    height * max / width;

                width = max;
            }

            canvas.width = width;
            canvas.height = height;

            const ctx =
                canvas.getContext("2d");

            ctx.drawImage(
                img,
                0,
                0,
                width,
                height
            );

            callback(
                canvas.toDataURL(
                    "image/jpeg",
                    0.8
                )
            );
        };

        img.src = e.target.result;
    };

    reader.readAsDataURL(file);
}


function changeProfilePhoto(event){

    const file = event.target.files[0];

    if(!file) return;

    resizeImage(file, function(data){

        const user = getCurrentUser();

        user.profilePhoto = data;

        saveUsers();

        loadProfile();
    });
}


function changeCoverPhoto(event){

    const file = event.target.files[0];

    if(!file) return;

    resizeImage(file, function(data){

        const user = getCurrentUser();

        user.coverPhoto = data;

        saveUsers();

        loadProfile();
    });
}


/* =========================
   POST PHOTO
========================= */

function previewPostPhoto(event){

    const file = event.target.files[0];

    if(!file) return;

    resizeImage(file, function(data){

        selectedPostImage = data;

        const preview =
            document.getElementById("postPreview");

        preview.src = data;

        preview.style.display = "block";
    });
}


/* =========================
   CREATE POST
========================= */

function createPost(){

    const text =
        document.getElementById("postText")
        .value
        .trim();

    if(!text && !selectedPostImage){

        alert("Post-এর জন্য লেখা অথবা ছবি দিন।");
        return;
    }

    const user = getCurrentUser();

    const newPost = {

        id:Date.now(),

        userId:user.id,

        name:user.name,

        text:text,

        image:selectedPostImage,

        likes:0,

        likedBy:[],

        comments:[],

        shares:0
    };

    posts.unshift(newPost);

    savePosts();

    document.getElementById("postText").value="";

    document.getElementById("postPhoto").value="";

    document.getElementById("postPreview").style.display="none";

    document.getElementById("postPreview").src="";

    selectedPostImage="";

    loadPosts();
}


/* =========================
   LOAD POSTS
========================= */

function loadPosts(){

    const feed =
        document.getElementById("feed");

    if(!feed) return;

    feed.innerHTML="";

    if(posts.length === 0){

        feed.innerHTML =
            `<div class="empty">
                এখনো কোনো Post নেই।
             </div>`;

        return;
    }

    posts.forEach(post => {

        feed.innerHTML +=
            renderPost(post);
    });
}


function loadMyPosts(){

    const box =
        document.getElementById("myPosts");

    if(!box) return;

    const user = getCurrentUser();

    const myPosts =
        posts.filter(
            p =>
            String(p.userId) === String(user.id)
        );

    box.innerHTML="";

    if(myPosts.length === 0){

        box.innerHTML =
            `<div class="empty">
                আপনি এখনো কোনো Post করেননি।
             </div>`;

        return;
    }

    myPosts.forEach(post => {

        box.innerHTML +=
            renderPost(post);
    });
}


function loadOtherPosts(){

    const box =
        document.getElementById("otherPosts");

    if(!box) return;

    const myPosts =
        posts.filter(
            p =>
            String(p.userId) === String(viewingUserId)
        );

    box.innerHTML="";

    if(myPosts.length === 0){

        box.innerHTML =
            `<div class="empty">
                এই User এখনো কোনো Post করেনি।
             </div>`;

        return;
    }

    myPosts.forEach(post => {

        box.innerHTML +=
            renderPost(post);
    });
}


/* =========================
   RENDER POST
========================= */

function renderPost(post){

    const owner =
        getUser(post.userId);

    if(!owner) return "";

    const current =
        getCurrentUser();

    const liked =
        post.likedBy.includes(current.id);

    const comments =
        post.comments || [];

    const commentsHTML =
        comments.map(c => {

            const commenter =
                getUser(c.userId);

            return `
                <div class="comment">
                    <b>
                        ${escapeHTML(
                            commenter
                            ? commenter.name
                            : c.name
                        )}
                    </b>
                    <br>
                    ${escapeHTML(c.text)}
                </div>
            `;

        }).join("");

    const isOwner =
        String(post.userId) ===
        String(current.id);

    return `

    <div class="post">

        <div class="postHeader">

            <div
                class="userInfo"
                onclick="openUserProfile(${owner.id})"
                style="cursor:pointer"
            >

                <img
                    class="avatar"
                    src="${getPhoto(owner)}"
                >

                <div>

                    <div class="postName">
                        ${escapeHTML(owner.name)}
                    </div>

                    <small>
                        My Social App
                    </small>

                </div>

            </div>

            <div class="postMenu">

                <button
                    onclick="togglePostMenu(${post.id})"
                >
                    ⋮
                </button>

                <div
                    id="menu-${post.id}"
                    class="menuBox"
                >

                    ${
                        isOwner
                        ?
                        `
                        <button
                            onclick="editPost(${post.id})"
                        >
                            ✏️ Edit
                        </button>

                        <button
                            onclick="deletePost(${post.id})"
                        >
                            🗑️ Delete
                        </button>
                        `
                        :
                        `
                        <button
                            onclick="closeAllMenus()"
                        >
                            Close
                        </button>
                        `
                    }

                </div>

            </div>

        </div>

        ${
            post.text
            ?
            `<div class="postText">
                ${escapeHTML(post.text)}
             </div>`
            :
            ""
        }

        ${
            post.image
            ?
            `<img
                class="postImage"
                src="${post.image}"
            >`
            :
            ""
        }

        <div class="stats">

            <span>
                ${
                    post.likes > 0
                    ? "❤️ " + post.likes
                    : "Be the first to like"
                }
            </span>

            <span>
                ${comments.length} Comments
                ·
                ${post.shares} Shares
            </span>

        </div>

        <div class="postButtons">

            <button
                class="${liked ? "liked" : ""}"
                onclick="likePost(${post.id})"
            >
                ${liked ? "❤️ Liked" : "👍 Like"}
            </button>

            <button
                onclick="toggleComment(${post.id})"
            >
                💬 Comment
            </button>

            <button
                onclick="sharePost(${post.id})"
            >
                ↗ Share
            </button>

        </div>

        <div
            id="comments-${post.id}"
            class="commentBox"
        >

            <input
                id="commentInput-${post.id}"
                class="commentInput"
                placeholder="Write a comment..."
                onkeydown="
                    if(event.key==='Enter'){
                        addComment(${post.id})
                    }
                "
            >

            ${commentsHTML}

        </div>

    </div>

    `;
}


/* =========================
   POST MENU
========================= */

function togglePostMenu(id){

    closeAllMenus();

    const menu =
        document.getElementById("menu-" + id);

    if(menu){

        menu.style.display =
            "block";
    }
}


function closeAllMenus(){

    document
        .querySelectorAll(".menuBox")
        .forEach(m => {

            m.style.display = "none";

        });
}


/* =========================
   DELETE POST
========================= */

function deletePost(id){

    const post =
        posts.find(p => String(p.id) === String(id));

    if(!post) return;

    if(
        !confirm(
            "আপনি কি এই Post Delete করতে চান?"
        )
    ){
        return;
    }

    posts =
        posts.filter(
            p =>
            String(p.id) !== String(id)
        );

    savePosts();

    loadPosts();

    loadMyPosts();
}


/* =========================
   EDIT POST
========================= */

function editPost(id){

    const post =
        posts.find(
            p =>
            String(p.id) === String(id)
        );

    if(!post) return;

    const newText =
        prompt(
            "Post Edit করুন:",
            post.text
        );

    if(newText === null) return;

    post.text =
        newText.trim();

    savePosts();

    loadPosts();

    loadMyPosts();

    if(viewingUserId){
        loadOtherPosts();
    }
}


/* =========================
   LIKE
========================= */

function likePost(id){

    const post =
        posts.find(
            p =>
            String(p.id) === String(id)
        );

    if(!post) return;

    const current =
        getCurrentUser();

    const index =
        post.likedBy.indexOf(
            current.id
        );

    if(index === -1){

        post.likedBy.push(
            current.id
        );

        post.likes++;

        if(
            String(post.userId) !==
            String(current.id)
        ){

            addNotification(
                post.userId,
                current.name +
                " liked your post.",
                "like"
            );
        }

    }else{

        post.likedBy.splice(
            index,
            1
        );

        post.likes--;
    }

    savePosts();

    refreshVisiblePosts();
}


/* =========================
   COMMENT
========================= */

function toggleComment(id){

    const box =
        document.getElementById(
            "comments-" + id
        );

    if(!box) return;

    box.style.display =
        box.style.display === "block"
        ? "none"
        : "block";
}


function addComment(id){

    const input =
        document.getElementById(
            "commentInput-" + id
        );

    if(!input) return;

    const text =
        input.value.trim();

    if(!text) return;

    const post =
        posts.find(
            p =>
            String(p.id) === String(id)
        );

    if(!post) return;

    if(!post.comments){
        post.comments=[];
    }

    const current =
        getCurrentUser();

    post.comments.push({

        id:Date.now(),

        userId:current.id,

        name:current.name,

        text:text
    });

    if(
        String(post.userId) !==
        String(current.id)
    ){

        addNotification(
            post.userId,
            current.name +
            " commented on your post.",
            "comment"
        );
    }

    savePosts();

    input.value="";

    refreshVisiblePosts();
}


/* =========================
   SHARE
========================= */

function sharePost(id){

    const post =
        posts.find(
            p =>
            String(p.id) === String(id)
        );

    if(!post) return;

    post.shares++;

    savePosts();

    if(
        navigator.share
    ){

        navigator.share({

            title:"My Social App",

            text:post.text ||
                 "Check this post",

            url:location.href

        }).catch(()=>{});

    }else{

        alert("Post share count +1 হয়েছে।");
    }

    refreshVisiblePosts();
}


/* =========================
   REFRESH POSTS
========================= */

function refreshVisiblePosts(){

    loadPosts();

    loadMyPosts();

    if(
        document
        .getElementById("userProfilePage")
        .classList.contains("active")
    ){

        loadOtherPosts();
    }
}


/* =========================
   FOLLOW
========================= */

function toggleFollow(targetId){

    const current =
        getCurrentUser();

    const target =
        getUser(targetId);

    if(!target) return;

    if(
        String(current.id) ===
        String(target.id)
    ){

        alert("নিজেকে Follow করা যাবে না।");
        return;
    }

    const index =
        current.following.indexOf(
            target.id
        );

    if(index === -1){

        current.following.push(
            target.id
        );

        if(!target.followers.includes(current.id)){

            target.followers.push(
                current.id
            );
        }

        addNotification(
            target.id,
            current.name +
            " started following you.",
            "follow"
        );

    }else{

        current.following.splice(
            index,
            1
        );

        const followerIndex =
            target.followers.indexOf(
                current.id
            );

        if(followerIndex !== -1){

            target.followers.splice(
                followerIndex,
                1
            );
        }
    }

    saveUsers();

    loadProfile();

    if(
        viewingUserId &&
        String(viewingUserId) ===
        String(target.id)
    ){

        loadOtherProfile();
    }

    searchUsers();
}


function toggleFollowFromProfile(){

    if(!viewingUserId) return;

    toggleFollow(viewingUserId);
}


/* =========================
   OTHER PROFILE
========================= */

function openUserProfile(id){

    if(
        String(id) ===
        String(currentUserId)
    ){

        showProfile();
        return;
    }

    viewingUserId = id;

    hideAllPages();

    document
        .getElementById("userProfilePage")
        .classList.add("active");

    loadOtherProfile();
}


function loadOtherProfile(){

    const user =
        getUser(viewingUserId);

    if(!user) return;

    document.getElementById("otherName")
        .textContent = user.name;

    document.getElementById("otherBio")
        .textContent =
        user.bio || "No bio yet.";

    document.getElementById("otherProfilePhoto")
        .src = getPhoto(user);

    document.getElementById("otherCover")
        .src = getCover(user);

    document.getElementById("otherFollowers")
        .textContent =
        user.followers.length;

    document.getElementById("otherFollowing")
        .textContent =
        user.following.length;

    const userPosts =
        posts.filter(
            p =>
            String(p.userId) ===
            String(user.id)
        );

    document.getElementById("otherPostsCount")
        .textContent =
        userPosts.length;

    const current =
        getCurrentUser();

    const following =
        current.following.includes(
            user.id
        );

    document.getElementById("followButton")
        .textContent =
        following
        ? "Unfollow"
        : "Follow";

    loadOtherPosts();
}


/* =========================
   SEARCH USERS
========================= */

function searchUsers(){

    const query =
        document
        .getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();

    const box =
        document.getElementById("searchResults");

    if(!query){

        box.innerHTML =
            `<div class="empty">
                Name অথবা Email লিখে Search করুন।
             </div>`;

        return;
    }

    const current =
        getCurrentUser();

    const results =
        users.filter(u =>

            String(u.id) !==
            String(current.id)

            &&

            (
                u.name
                .toLowerCase()
                .includes(query)

                ||

                u.email
                .toLowerCase()
                .includes(query)
            )
        );

    box.innerHTML="";

    if(results.length === 0){

        box.innerHTML =
            `<div class="empty">
                কোনো User পাওয়া যায়নি।
             </div>`;

        return;
    }

    results.forEach(user => {

        const isFollowing =
            current.following.includes(
                user.id
            );

        box.innerHTML += `

            <div class="userResult">

                <div
                    class="userResultLeft"
                    onclick="openUserProfile(${user.id})"
                    style="cursor:pointer"
                >

                    <img
                        class="avatar"
                        src="${getPhoto(user)}"
                    >

                    <div>

                        <b>
                            ${escapeHTML(user.name)}
                        </b>

                        <br>

                        <small>
                            ${escapeHTML(user.email)}
                        </small>

                    </div>

                </div>

                <button
                    onclick="toggleFollow(${user.id})"
                >
                    ${isFollowing ? "Unfollow" : "Follow"}
                </button>

            </div>

        `;
    });
}


/* =========================
   FOLLOWERS / FOLLOWING
========================= */

function showFollowers(userId){

    const user =
        getUser(userId);

    if(!user) return;

    hideAllPages();

    document
        .getElementById("listPage")
        .classList.add("active");

    document.getElementById("listTitle")
        .textContent =
        "Followers of " + user.name;

    const box =
        document.getElementById("userList");

    box.innerHTML="";

    if(user.followers.length === 0){

        box.innerHTML =
            `<div class="empty">
                এখনো কোনো Followers নেই।
             </div>`;

        return;
    }

    user.followers.forEach(id => {

        const follower =
            getUser(id);

        if(!follower) return;

        renderListUser(
            follower,
            box
        );
    });
}


function showFollowing(userId){

    const user =
        getUser(userId);

    if(!user) return;

    hideAllPages();

    document
        .getElementById("listPage")
        .classList.add("active");

    document.getElementById("listTitle")
        .textContent =
        user.name + " is Following";

    const box =
        document.getElementById("userList");

    box.innerHTML="";

    if(user.following.length === 0){

        box.innerHTML =
            `<div class="empty">
                এখনো কাউকে Follow করেনি।
             </div>`;

        return;
    }

    user.following.forEach(id => {

        const following =
            getUser(id);

        if(!following) return;

        renderListUser(
            following,
            box
        );
    });
}


function renderListUser(user, box){

    const current =
        getCurrentUser();

    const following =
        current.following.includes(
            user.id
        );

    const div =
        document.createElement("div");

    div.className =
        "listUser";

    div.innerHTML = `

        <div
            class="listUserLeft"
            onclick="openUserProfile(${user.id})"
            style="cursor:pointer"
        >

            <img
                class="avatar"
                src="${getPhoto(user)}"
            >

            <div>
                <b>
                    ${escapeHTML(user.name)}
                </b>
                <br>
                <small>
                    ${escapeHTML(user.email)}
                </small>
            </div>

        </div>

        ${
            String(user.id) !==
            String(current.id)

            ?

            `<button
                onclick="toggleFollow(${user.id})"
            >
                ${following ? "Unfollow" : "Follow"}
             </button>`

            :

            ""
        }

    `;

    box.appendChild(div);
}


/* =========================
   NOTIFICATIONS
========================= */

function addNotification(
    receiverId,
    text,
    type
){

    notifications.unshift({

        id:Date.now() +
           Math.random(),

        receiverId:receiverId,

        text:text,

        type:type,

        read:false,

        time:new Date().toLocaleString()
    });

    saveNotifications();

    updateNotificationBadge();
}


function getMyNotifications(){

    return notifications.filter(
        n =>
        String(n.receiverId) ===
        String(currentUserId)
    );
}


function updateNotificationBadge(){

    const badge =
        document.getElementById(
            "notificationBadge"
        );

    if(!badge) return;

    const unread =
        getMyNotifications()
        .filter(n => !n.read)
        .length;

    if(unread > 0){

        badge.style.display =
            "flex";

        badge.textContent =
            unread > 99
            ? "99+"
            : unread;

    }else{

        badge.style.display =
            "none";
    }
}


function toggleNotifications(){

    const panel =
        document.getElementById(
            "notificationPanel"
        );

    if(!panel) return;

    if(
        panel.style.display ===
        "block"
    ){

        panel.style.display =
            "none";

        return;
    }

    loadNotifications();

    panel.style.display =
        "block";
}


function loadNotifications(){

    const box =
        document.getElementById(
            "notificationList"
        );

    if(!box) return;

    const mine =
        getMyNotifications();

    box.innerHTML="";

    if(mine.length === 0){

        box.innerHTML =
            `<div class="empty">
                কোনো Notification নেই।
             </div>`;

        return;
    }

    mine.forEach(n => {

        box.innerHTML += `

            <div
                class="notification ${
                    n.read ? "" : "unread"
                }"
            >

                ${escapeHTML(n.text)}

                <small>
                    ${escapeHTML(n.time)}
                </small>

            </div>

        `;
    });
}


function markAllRead(){

    notifications.forEach(n => {

        if(
            String(n.receiverId) ===
            String(currentUserId)
        ){

            n.read = true;
        }
    });

    saveNotifications();

    loadNotifications();

    updateNotificationBadge();
}


/* =========================
   OLD DATA MIGRATION
========================= */

function migrateData(){

    let changed = false;

    users.forEach(user => {

        if(!user.bio){
            user.bio="";
            changed=true;
        }

        if(!Array.isArray(user.followers)){

            user.followers=[];
            changed=true;
        }

        if(!Array.isArray(user.following)){

            user.following=[];
            changed=true;
        }

        if(!user.profilePhoto){

            user.profilePhoto="";
            changed=true;
        }

        if(!user.coverPhoto){

            user.coverPhoto="";
            changed=true;
        }
    });


    posts.forEach(post => {

        if(!Array.isArray(post.likedBy)){

            post.likedBy=[];
            changed=true;
        }

        if(!Array.isArray(post.comments)){

            post.comments=[];
            changed=true;
        }

        if(post.shares === undefined){

            post.shares=0;
            changed=true;
        }

        if(post.likes === undefined){

            post.likes=0;
            changed=true;
        }
    });


    if(changed){

        saveUsers();
        savePosts();
    }
}


/* =========================
   START APP
========================= */

window.onload = function(){

    migrateData();

    if(currentUserId){

        const user =
            getUser(currentUserId);

        if(user){

            showHome();

        }else{

            localStorage.removeItem(
                "currentUser"
            );

            currentUserId=null;

            showLogin();
        }

    }else{

        showLogin();
    }

};


/* =========================
   CLOSE NOTIFICATION
========================= */

document.addEventListener(
    "click",
    function(event){

        const panel =
            document.getElementById(
                "notificationPanel"
            );

        if(!panel) return;

        const clickedInside =
            panel.contains(event.target);

        const notificationButton =
            event.target.closest(
                ".notificationBtn"
            );

        if(
            !clickedInside &&
            !notificationButton
        ){

            panel.style.display =
                "none";
        }
    }
);
