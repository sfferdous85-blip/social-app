<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,Helvetica,sans-serif;
 background:#f0f2f5;
 color:#1c1e21;
}

button,input,select,textarea{

}

button{

 border:0;
 border-radius:8px;
 padding:10px 14px;

}

.blue{

 color:#fff;
}

.gray{
 background:#e4e6eb;

}

.danger{
 background:#e53935;
 color:#fff;
}

.green{

 color:#fff;
}

body.dark{

 color:#e4e6eb;
}

body.dark .card,
body.dark .topbar,
body.dark .sidebar,
body.dark .bottomnav,
body.dark .modal-box,
body.dark .post,
body.dark .story{

 color:#e4e6eb;
}

body.dark input,
body.dark textarea,
body.dark select{

 color:#fff;

}

body.dark .gray{

 color:#fff;

.topbar{

 background:#fff;

 top:0;

.logo{

}

.search{

}

.search input{

}

.top-actions{

 gap:7px;
}

.icon-btn{

 height:42px;
 padding:0;

 background:#e4e6eb;
}

.app{
 max-width:1300px;
 margin:auto;

 gap:18px;
 padding:18px;
}

.sidebar{
 background:#fff;
 border-radius:10px;
 padding:10px;

}

}

.nav-btn:hover{

body.dark .nav-btn:hover{

}

.card{

.page-title{

.post-head{

.avatar{

 font-weight:bold;

}

.avatar img{

}

.post-text{

.post img.post-image,

.post-actions{

body.dark .post-actions{

}

.post-actions button{

}

.post-actions button:hover{

}

body.dark .post-actions button:hover{

}

}

}

.story img{

 height:100%;

}

.story-name{

textarea,
input,
select{

textarea{

}

.modal{

 background:#0008;

 justify-content:center;
 z-index:1000;
 padding:15px;
}

.modal-box{
 width:100%;
 max-width:520px;
 max-height:90vh;
 overflow:auto;
 background:#fff;
 border-radius:12px;
 padding:18px;
}

.modal-head{

 justify-content:space-between;
 align-items:center;
 margin-bottom:15px;
}

.close{

 height:35px;
 border-radius:50%;

}

.bottomnav{
 display:none;
}

.toast{

 bottom:25px;
 left:50%;

}

.profile-cover{

}

 overflow:hidden;
}

.profile-avatar img{
 width:100%;
 height:100%;
 object-fit:cover;
}

.profile-info{
 padding:55px 20px 20px;
}

.profile-actions{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
 margin-top:10px;
}

.comment{
 display:flex;
 gap:8px;
 margin-top:10px;
}

.comment-body{
 background:#f0f2f5;
 border-radius:15px;
 padding:8px 12px;
 flex:1;
}

body.dark .comment-body{
 background:#3a3b3c;
}

.reel{
 background:#000;
 color:#fff;
 border-radius:10px;
 overflow:hidden;
 margin-bottom:15px;
}

.reel video{
 width:100%;
 max-height:650px;
 display:block;
}

.settings-section{
 margin-bottom:15px;
}

.settings-title{
 font-size:18px;
 font-weight:bold;
 margin-bottom:12px;
}

.setting-row{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:15px;
 padding:13px 0;
 border-bottom:1px solid #eee;
}

.setting-row:last-child{
 border-bottom:0;
}

.setting-info{
 flex:1;
}

.setting-info strong{
 display:block;
 font-size:15px;
 margin-bottom:4px;
}

.setting-info small{
 color:#65676b;
 font-size:13px;
}

.setting-select{
 min-width:150px;
 width:auto;
 padding:9px 10px;
}

.setting-input{
 width:100%;
 padding:11px 12px;
 margin-top:6px;
}

.switch{
 position:relative;
 width:48px;
 height:26px;
 flex:none;
}

.switch input{
 opacity:0;
 width:0;
 height:0;
}

.slider{
 position:absolute;
 inset:0;
 background:#ccc;
 border-radius:30px;
 transition:.2s;
}

.slider:before{
 content:"";
 position:absolute;
 width:20px;
 height:20px;
 left:3px;
 top:3px;
 background:#fff;
 border-radius:50%;
 transition:.2s;
}

.switch input:checked + .slider{
 background:#1877f2;
}

.switch input:checked + .slider:before{
 transform:translateX(22px);
}

.blocked-user{
 display:flex;
 align-items:center;
 gap:10px;
 padding:10px 0;
 border-bottom:1px solid #eee;
}

.blocked-user:last-child{
 border-bottom:0;
}

.blocked-user .avatar{

 height:40px;
}

.settings-buttons{

 gap:8px;
 flex-wrap:wrap;
}

.settings-buttons button{

}

.security-box{
 background:#f0f2f5;

 padding:12px;

}

body.dark .security-box{

}

hr{

 }

 }

 .bottomnav{

<script>
const SUPABASE_URL =
"https://skereuaizdczbvjplisi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_3R2otJA1zIlsMsTYxe1ocw_NAPY5O9x";

const sb = supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

let user=null;
let profile=null;
let appSettings=null;
let creatorSettings=null;


/* =========================
   BASIC HELPERS
========================= */

function esc(value){
 return String(value ?? "")
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
}

function toast(text){
 const el=document.getElementById("toast");
 el.textContent=text;
 el.style.display="block";

 setTimeout(()=>{
  el.style.display="none";
 },2500);
}

function openModal(html){
 document.getElementById("modalBox").innerHTML=html;
 document.getElementById("modal").style.display="flex";
}

function closeModal(){
 document.getElementById("modal").style.display="none";
}

function avatarHTML(p,size="45px"){
 if(p?.avatar_url){
  return `
   <div class="avatar" style="width:${size};height:${size}">
    <img src="${esc(p.avatar_url)}">
   </div>
  `;
 }

 return `
  <div class="avatar" style="width:${size};height:${size}">
   ${esc((p?.name||"U").charAt(0).toUpperCase())}
  </div>
 `;
}


/* =========================
   AUTH
========================= */

function showLogin(){

 document.getElementById("app").style.display="none";

 document.getElementById("loginPage").innerHTML=`
 <div style="
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
 ">
  <div class="card" style="width:100%;max-width:420px">

   <h1 style="text-align:center;color:#1877f2">
    My Social App
   </h1>

   <p style="text-align:center;color:#65676b">
    Login to continue
   </p>

   <input id="loginEmail" placeholder="Email">
   <br><br>

   <input
    id="loginPassword"
    type="password"
    placeholder="Password"
   >

   <br><br>

   <button
    class="blue"
    style="width:100%"
    onclick="login()"
   >
    Login
   </button>

   <br><br>

   <button
    class="green"
    style="width:100%"
    onclick="showRegister()"
   >
    Create new account
   </button>

  </div>
 </div>
 `;
}

function showRegister(){

 document.getElementById("loginPage").innerHTML=`
 <div style="
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
 ">
  <div class="card" style="width:100%;max-width:420px">

   <h2 style="text-align:center;color:#1877f2">
    Create Account
   </h2>

   <input id="regName" placeholder="Full name">
   <br><br>

   <input id="regEmail" placeholder="Email">
   <br><br>

   <input
    id="regPassword"
    type="password"
    placeholder="Password (minimum 6 characters)"
   >

   <br><br>

   <button
    class="green"
    style="width:100%"
    onclick="register()"
   >
    Register
   </button>

   <br><br>

   <button
    class="gray"
    style="width:100%"
    onclick="showLogin()"
   >
    Back to Login
   </button>

  </div>
 </div>
 `;
}

async function login(){

 const email=document.getElementById("loginEmail").value.trim();
 const password=document.getElementById("loginPassword").value;

 if(!email || !password){
  toast("Email এবং Password দিন");
  return;
 }

 const {data,error}=await sb.auth.signInWithPassword({
  email,
  password
 });

 if(error){
  toast(error.message);
  return;
 }

 user=data.user;
 await startApp();
}

async function register(){

 const name=document.getElementById("regName").value.trim();
 const email=document.getElementById("regEmail").value.trim();
 const password=document.getElementById("regPassword").value;

 if(!name || !email || !password){
  toast("সব তথ্য পূরণ করুন");
  return;
 }

 if(password.length<6){
  toast("Password কমপক্ষে 6 characters");
  return;
 }

 const {data,error}=await sb.auth.signUp({
  email,
  password
 });

 if(error){
  toast(error.message);
  return;
 }

 if(data.user){

  user=data.user;

  await sb.from("profiles").upsert({
   id:user.id,
   name:name,
   bio:"",
   role:"user",
   is_deactivated:false,
   last_seen:new Date().toISOString()
  });

  await sb.from("user_settings").upsert({
   user_id:user.id
  });

  await sb.from("creator_settings").upsert({
   user_id:user.id
  });
 }

 alert(
  "Account তৈরি হয়েছে। যদি email confirmation চালু থাকে তাহলে Email verify করে Login করুন।"
 );

 showLogin();
}

async function logout(){

 await sb.auth.signOut({
  scope:"local"
 });

 user=null;
 profile=null;
 appSettings=null;
 creatorSettings=null;

 showLogin();
}


/* =========================
   PROFILE
========================= */

async function ensureProfile(){

 if(!user)return;

 let {data,error}=await sb
  .from("profiles")
  .select("*")
  .eq("id",user.id)
  .maybeSingle();

 if(error){
  console.log(error);
 }

 if(!data){

  const name =
   user.user_metadata?.name ||
   user.email?.split("@")[0] ||
   "User";

  await sb.from("profiles").upsert({
   id:user.id,
   name:name,
   bio:"",
   role:"user",
   is_deactivated:false,
   last_seen:new Date().toISOString()
  });

  const result=await sb
   .from("profiles")
   .select("*")
   .eq("id",user.id)
   .maybeSingle();

  data=result.data;
 }

 profile=data;
}

async function refreshProfile(){

 if(!user)return;

 const {data}=await sb
  .from("profiles")
  .select("*")
  .eq("id",user.id)
  .maybeSingle();

 profile=data;
}


/* =========================
   SETTINGS
========================= */

async function ensureSettings(){

 if(!user)return null;

 let {data}=await sb
  .from("user_settings")
  .select("*")
  .eq("user_id",user.id)
  .maybeSingle();

 if(!data){

  const result=await sb
   .from("user_settings")
   .insert({
    user_id:user.id
   })
   .select("*")
   .single();

  data=result.data;
 }

 appSettings=data;
 return data;
}

async function ensureCreatorSettings(){

 if(!user)return null;

 let {data}=await sb
  .from("creator_settings")
  .select("*")
  .eq("user_id",user.id)
  .maybeSingle();

 if(!data){

  const result=await sb
   .from("creator_settings")
   .insert({
    user_id:user.id
   })
   .select("*")
   .single();

  data=result.data;
 }

 creatorSettings=data;
 return data;
}

function applyTheme(theme){

 if(theme==="dark"){
  document.body.classList.add("dark");
 }else{
  document.body.classList.remove("dark");
 }

 localStorage.setItem(
  "theme",
  theme
 );
}

async function saveSetting(field,value){

 const {data,error}=await sb
  .from("user_settings")
  .update({
   [field]:value,
   updated_at:new Date().toISOString()
  })
  .eq("user_id",user.id)
  .select("*")
  .single();

 if(error){
  toast(error.message);
  return;
 }

 appSettings=data;

 if(field==="theme"){
  applyTheme(value);
 }

 if(field==="post_privacy"){
  localStorage.setItem("privacy",value);
 }

 toast("Setting saved");
}


/* =========================
   START APP
========================= */

async function startApp(){

 await ensureProfile();

 if(profile?.is_deactivated){

  await sb.auth.signOut({
   scope:"local"
  });

  user=null;
  profile=null;

  alert("এই account বর্তমানে deactivated করা আছে।");
  showLogin();
  return;
 }

 await ensureSettings();
 await ensureCreatorSettings();

 applyTheme(
  appSettings?.theme ||
  localStorage.getItem("theme") ||
  "light"
 );

 document.getElementById("loginPage").innerHTML="";
 document.getElementById("app").style.display="block";

 buildSidebar();
 openPage("home");

 heartbeat();

 setInterval(heartbeat,60000);
}

async function heartbeat(){

 if(!user)return;

 if(appSettings?.online_status===false){
  return;
 }

 await sb
  .from("profiles")
  .update({
   last_seen:new Date().toISOString()
  })
  .eq("id",user.id);
}


/* =========================
   SIDEBAR
========================= */

function buildSidebar(){

 let admin="";

 if(profile?.role==="admin"){
  admin=`
   <button class="nav-btn" onclick="openPage('admin')">
    🛡️ Admin Panel
   </button>
  `;
 }

 document.getElementById("sidebar").innerHTML=`

 <button class="nav-btn" onclick="openPage('home')">
  🏠 Home
 </button>

 <button class="nav-btn" onclick="openPage('profile')">
  👤 Profile
 </button>

 <button class="nav-btn" onclick="openPage('friends')">
  👥 Friends
 </button>

 <button class="nav-btn" onclick="openPage('messenger')">
  💬 Messenger
 </button>

 <button class="nav-btn" onclick="openPage('notifications')">
  🔔 Notifications
 </button>

 <button class="nav-btn" onclick="openPage('reels')">
  🎬 Reels
 </button>

 <button class="nav-btn" onclick="openPage('saved')">
  🔖 Saved
 </button>

 <button class="nav-btn" onclick="openPage('trending')">
  🔥 Trending
 </button>

 <button class="nav-btn" onclick="openPage('earnings')">
  💰 Earnings
 </button>

 <button class="nav-btn" onclick="openPage('settings')">

 ${admin}

 <hr>

/* =========================
   PAGE ROUTER
========================= */

async function openPage(page){

 if(page==="home")return loadHome();
 if(page==="profile")return renderProfile(user.id);
 if(page==="friends")return renderFriends();
 if(page==="messenger")return renderMessenger();
 if(page==="notifications")return renderNotifications();
 if(page==="reels")return renderReels();
 if(page==="saved")return renderSaved();
 if(page==="trending")return renderTrending();
 if(page==="earnings")return renderEarnings();
 if(page==="settings")return renderSettings();
 if(page==="admin")return renderAdmin();
}


/* =========================
   HOME
========================= */

async function loadHome(){

 document.getElementById("main").innerHTML=`

 <div class="page-title">

async function filterVisiblePosts(posts){

 if(!posts?.length)return [];

 const {data:friends}=await sb
  .from("friends")
  .select("friend_id")
  .eq("user_id",user.id);

 const friendIds=new Set(
  (friends||[]).map(x=>x.friend_id)
 );

 const {data:blocked}=await sb
  .from("blocked_users")
  .select("blocked_id")
  .eq("blocker_id",user.id);

 const blockedIds=new Set(
  (blocked||[]).map(x=>x.blocked_id)
 );

 return posts.filter(p=>{

  if(blockedIds.has(p.user_id)){
   return false;
  }

  if(p.user_id===user.id){
   return true;
  }

  if(p.privacy==="public"){
   return true;
  }

  if(p.privacy==="friends"){
   return friendIds.has(p.user_id);
  }

  return false;
 });
}

async function setReaction(postId,reaction){

 const {data:old}=await sb
  .from("post_reactions")
  .select("*")
  .eq("post_id",postId)
  .eq("user_id",user.id)
  .maybeSingle();

 let shouldNotify=false;

 if(old){

  if(old.reaction===reaction){

   await sb
    .from("post_reactions")
    .delete()
    .eq("post_id",postId)
    .eq("user_id",user.id);

  }else{

   await sb
    .from("post_reactions")
    .update({
     reaction:reaction
    })
    .eq("post_id",postId)
    .eq("user_id",user.id);

   shouldNotify=true;
  }

 }else{

  await sb
   .from("post_reactions")
   .insert({
    post_id:postId,
    user_id:user.id,
    reaction:reaction
   });

  shouldNotify=true;
 }

 if(shouldNotify){

  const {data:post}=await sb
   .from("posts")
   .select("user_id")
   .eq("id",postId)
   .maybeSingle();

  if(post?.user_id && post.user_id!==user.id){

   await createNotification(
    post.user_id,
    `${profile.name} আপনার পোস্টে reaction দিয়েছে`,
    "like"
   );
  }
 }

 loadFeed();
}

async function createNotification(
 receiver,
 text,
 type="message"
){

 if(!receiver || receiver===user.id)return;

 const map={
  like:"notify_like",
  comment:"notify_comment",
  friend_request:"notify_friend_request",
  message:"notify_message",
  follow:"notify_follow"
 };

 const field=map[type];

 if(field){

  const {data}=await sb
   .from("user_settings")
   .select(field)
   .eq("user_id",receiver)
   .maybeSingle();

  if(data && data[field]===false){
   return;
  }
 }

 await sb.from("notifications").insert({
  receiver_id:receiver,
  text:text,
  read:false
 });
}

async function canSendFriendRequest(id){

 const {data}=await sb
  .from("user_settings")
  .select("friend_request_privacy")
  .eq("user_id",id)
  .maybeSingle();

 const privacy=
  data?.friend_request_privacy ||
  "everyone";

 if(privacy==="everyone")return true;

 if(privacy==="no_one")return false;

 const {data:mine}=await sb
  .from("friends")
  .select("friend_id")
  .eq("user_id",user.id);

 const {data:theirs}=await sb
  .from("friends")
  .select("friend_id")
  .eq("user_id",id);

 const myFriends=new Set(
  (mine||[]).map(x=>x.friend_id)
 );

 return (theirs||[])
  .some(x=>myFriends.has(x.friend_id));
}

async function sendFriendRequest(id){

 const allowed=await canSendFriendRequest(id);

 if(!allowed){
  toast("এই user-এর friend request privacy অনুযায়ী request পাঠানো যাচ্ছে না");
  return;
 }

 const {data:existing}=await sb
  .from("friend_requests")
  .select("*")
  .or(
   `and(sender_id.eq.${user.id},receiver_id.eq.${id}),and(sender_id.eq.${id},receiver_id.eq.${user.id})`
  )
  .maybeSingle();

 if(existing){
  toast("Friend request already exists");
  return;
 }

 const {error}=await sb
  .from("friend_requests")
  .insert({
   sender_id:user.id,
   receiver_id:id,
   status:"pending"
  });

 if(error){
  toast(error.message);
  return;
 }

 await createNotification(
  id,
  `${profile.name} আপনাকে friend request পাঠিয়েছে`,
  "friend_request"
 );

 toast("Friend request sent");
}

async function acceptRequest(id){

 const {data:req}=await sb
  .from("friend_requests")
  .select("*")
  .eq("id",id)
  .maybeSingle();

 if(!req)return;

 await sb
  .from("friend_requests")
  .update({status:"accepted"})
  .eq("id",id);

 await sb.from("friends").insert({
  user_id:req.sender_id,
  friend_id:req.receiver_id
 });

 await sb.from("friends").insert({
  user_id:req.receiver_id,
  friend_id:req.sender_id
 });

 await createNotification(
  req.sender_id,
  `${profile.name} আপনার friend request গ্রহণ করেছে`,
  "friend_request"
 );

 toast("Friend request accepted");

 renderFriends();
}

async function saveProfile(){

 const username=document.getElementById("editUsername").value.trim().toLowerCase();
 const bio=document.getElementById("editBio").value.trim();
 const avatar=document.getElementById("editAvatar").value.trim();

 if(!name){
  toast("Name required");
  return;
 }

 if(username &&
 !/^[a-z0-9._]{3,30}$/.test(username)){

  return;
 }

 if(username){

  const {data:existing}=await sb
   .from("profiles")
   .select("id")
   .eq("username",username)
   .neq("id",user.id)
   .maybeSingle();

  if(existing){
   toast("Username already taken");
   return;
  }
 }

 const {error}=await sb
  .from("profiles")
  .update({
   name,
   username:username||null,
   bio,
   avatar_url:avatar||null
  })
  .eq("id",user.id);

 if(error){
  toast(error.message);
  return;
 }

 await refreshProfile();

 closeModal();

async function blockUser(id){

 if(id===user.id)return;

 if(!confirm("এই user-কে block করবেন?"))return;

 const {error}=await sb
  .from("blocked_users")
  .insert({
   blocker_id:user.id,
   blocked_id:id
  });

 if(error){
  toast(error.message);
  return;
 }

 toast("User blocked");

 renderProfile(id);
}

  .from("blocked_users")
  .delete()
  .eq("blocker_id",user.id)
  .eq("blocked_id",id);

 }

async function loadChatMessages(id){

 const {data}=await sb
  .from("messages")
  .select("*")
  .or(
   `and(sender_id.eq.${user.id},receiver_id.eq.${id}),and(sender_id.eq.${id},receiver_id.eq.${user.id})`
  )
  .order("created_at",{ascending:true});

 const box=document.getElementById("chatMessages");

 if(!box)return;

 box.innerHTML=(data||[]).map(m=>`

  <div style="
   margin:7px 0;
   text-align:${m.sender_id===user.id?"right":"left"}
  ">

   <span style="
    display:inline-block;
    padding:8px 12px;
    border-radius:15px;
    background:${m.sender_id===user.id?"#1877f2":"#e4e6eb"};
    color:${m.sender_id===user.id?"#fff":"#111"}
   ">
    ${esc(m.text||m.message||"")}
   </span>

  </div>

 `).join("");

 box.scrollTop=box.scrollHeight;
}

async function sendMessage(id){

 const text=document
  .getElementById("messageText")
  .value
  .trim();

 if(!text)return;

 const {error}=await sb
  .from("messages")
  .insert({
   sender_id:user.id,
   receiver_id:id,
   text:text
  });

 if(error){
  toast(error.message);
  return;
 }

 await createNotification(
  id,
  `${profile.name} আপনাকে message পাঠিয়েছে`,
  "message"
 );

 document.getElementById("messageText").value="";

 await loadChatMessages(id);
}

async function saveAccountSettings(){

 const name=document
  .getElementById("settingsName")
  .value
  .trim();

 const username=document
  .getElementById("settingsUsername")
  .value
  .trim()
  .toLowerCase();

 const email=document
  .getElementById("settingsEmail")
  .value
  .trim();

 if(!name){
  toast("Name required");
  return;
 }

 if(username &&
 !/^[a-z0-9._]{3,30}$/.test(username)){
  toast("Username 3-30 characters হতে হবে");
  return;
 }

 if(username){

  const {data:existing}=await sb
   .from("profiles")
   .select("id")
   .eq("username",username)
   .neq("id",user.id)
   .maybeSingle();

  if(existing){
   toast("Username already taken");
   return;
  }
 }

 const {error}=await sb
  .from("profiles")
  .update({
   name,
   username:username||null
  })
  .eq("id",user.id);

 if(error){
  toast(error.message);
  return;
 }

 if(email && email!==user.email){

  const {error:emailError}=await sb.auth.updateUser({
   email:email
  });

  if(emailError){
   toast(emailError.message);
   return;
  }

  toast("Email change confirmation আপনার email-এ যেতে পারে");
 }

 await refreshProfile();

 buildSidebar();

 toast("Account settings saved");

 renderSettings();
}

async function changePassword(){

 const p=document
  .getElementById("newPassword")
  .value;

 const c=document
  .getElementById("confirmPassword")
  .value;

 if(!p){
  toast("New password দিন");
  return;
 }

 if(p.length<6){
  toast("Password কমপক্ষে 6 characters");
  return;
 }

 if(p!==c){
  toast("Passwords মিলছে না");
  return;
 }

 const {error}=await sb.auth.updateUser({
  password:p
 });

 if(error){
  toast(error.message);
  return;
 }

 closeModal();
 toast("Password changed successfully");
}

 user=null;

 creatorSettings=null;

 alert("Account deactivated");

/* =========================
   DELETE ACCOUNT
========================= */

async function deleteAccount(){

 if(!confirm(
  "⚠️ Account permanently delete করবেন?"
 ))return;

 if(!confirm(
  "শেষবার নিশ্চিত করুন: আপনার account/data delete হবে। Continue?"
 ))return;

 toast("Deleting account...");

 const {error}=await sb.rpc(
  "delete_my_account"
 );

 if(error){
  toast(error.message);
  return;
 }

 await sb.auth.signOut({
  scope:"local"
 });

 user=null;
 profile=null;
 appSettings=null;
 creatorSettings=null;

 alert("Account permanently deleted");

 showLogin();
}


/* =========================
   DOWNLOAD DATA
========================= */

async function downloadMyData(){

 toast("Your data preparing...");

 const results=await Promise.all([

  sb.from("profiles")
   .select("*")
   .eq("id",user.id),

  sb.from("user_settings")
   .select("*")
   .eq("user_id",user.id),

  sb.from("creator_settings")
   .select("*")
   .eq("user_id",user.id),

  sb.from("posts")
   .select("*")
   .eq("user_id",user.id),

  sb.from("comments")
   .select("*")
   .eq("user_id",user.id),

  sb.from("follows")
   .select("*")
   .or(
    `follower_id.eq.${user.id},following_id.eq.${user.id}`
   ),

  sb.from("friends")
   .select("*")
   .or(
    `user_id.eq.${user.id},friend_id.eq.${user.id}`
   ),

  sb.from("friend_requests")
   .select("*")
   .or(
    `sender_id.eq.${user.id},receiver_id.eq.${user.id}`
   ),

  sb.from("messages")
   .select("*")
   .or(
    `sender_id.eq.${user.id},receiver_id.eq.${user.id}`
   ),

  sb.from("notifications")
   .select("*")
   .eq("receiver_id",user.id),

  sb.from("reels")
   .select("*")
   .eq("user_id",user.id),

  sb.from("creator_earnings")
   .select("*")
   .eq("user_id",user.id),

  sb.from("blocked_users")
   .select("*")
   .eq("blocker_id",user.id)

 ]);

 const names=[
  "profile",
  "settings",
  "creator_settings",
  "posts",
  "comments",
  "follows",
  "friends",
  "friend_requests",
  "messages",
  "notifications",
  "reels",
  "earnings",
  "blocked_users"
 ];

 const result={};

 results.forEach((r,i)=>{
  result[names[i]]=r.data||[];
 });

 result.downloaded_at=new Date().toISOString();

 const blob=new Blob(
  [JSON.stringify(result,null,2)],
  {type:"application/json"}
 );

 const url=URL.createObjectURL(blob);

 const a=document.createElement("a");

 a.href=url;
 a.download="my-social-app-data.json";

 document.body.appendChild(a);
 a.click();
 a.remove();

 URL.revokeObjectURL(url);

 toast("Data downloaded");
}

async function saveCreatorSettings(){

 const payout=

 const {data,error}=await sb
  .from("creator_settings")
  .upsert({

   monetization_enabled:enabled,

 }

 creatorSettings=data;

 toast("Creator settings saved");

/* =========================
   SEARCH
========================= */

async function searchUsers(){

 const q=document
  .getElementById("searchInput")
  .value
  .trim();

 if(!q)return;

 const {data}=await sb
  .from("profiles")
  .select("*")
  .ilike("name",`%${q}%`)
  .limit(30);

 let html=`
 <div class="page-title">
  🔎 Search Results
 </div>

 <div class="card">
 `;

 if(!data?.length){
  html+=`<p>No users found.</p>`;
 }

 for(const p of data||[]){

  html+=`

   <div class="setting-row">

    <div style="display:flex;gap:10px;align-items:center">

     ${avatarHTML(p,"45px")}

     <div>
      <strong>${esc(p.name)}</strong>
      ${
       p.username
       ? `<small style="display:block">@${esc(p.username)}</small>`
       : ""
      }
     </div>

    </div>

    <button
     class="blue"
     onclick="renderProfile('${p.id}')"
    >
     View
    </button>

   </div>

  `;
 }

 html+=`</div>`;

 document.getElementById("main").innerHTML=html;
}


/* =========================
   DARK MODE COMPATIBILITY
========================= */

function toggleDark(){

 const newTheme=
  document.body.classList.contains("dark")
  ? "light"
  : "dark";

 saveSetting("theme",newTheme);
}

function loadDark(){

 const theme=
  localStorage.getItem("theme") ||
  localStorage.getItem("dark")==="true"
  ? "dark"
  : "light";

 applyTheme(theme);
}


/* =========================
   AUTH STATE
========================= */

async function start(){

 const {data}=await sb.auth.getSession();

 if(data?.session){

  user=data.session.user;

  await startApp();

 }else{

  showLogin();

 }
}

sb.auth.onAuthStateChange(
 async(event,session)=>{

  if(session && !user){

   user=session.user;

   await startApp();

  }

 }
);


/* =========================
   INITIALIZE
========================= */

loadDark();
start();

</script>
