<!DOCTYPE html>
<html lang="bn">
<head>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f0f2f5;
    color:#222;
}

button{
    border:0;

}

input,textarea{

textarea{

}

img{
    max-width:100%;
}

.hidden{
    display:none!important;
}

.blue{

    color:white;
}

.green{
    background:#42b72a;
    color:white;
}

.red{

    color:white;
}

.gray{
    background:#e4e6eb;
    color:#222;
}

#authPage{
    min-height:100vh;

    justify-content:center;
    align-items:center;
    padding:20px;
}

.authBox{
    width:100%;

.authBox h1{

}

.authMsg{

}

.topbar{
    background:#1877f2;
    color:white;
    padding:10px 15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:21px;

}

.topActions{
    display:flex;
    gap:6px;
}

.topActions button{
    padding:8px 10px;
}

.navbar{
    background:white;
    display:flex;
    justify-content:center;
    gap:5px;

.container{

}

.section{

}

.section h2{
    margin-top:0;
}

.profileCover{
    height:220px;
    background:#ddd;
    border-radius:12px 12px 0 0;
    background-size:cover;
    background-position:center;
    position:relative;
}

.profileAvatar{
    width:130px;
    height:130px;
    border-radius:50%;
    border:5px solid white;
    object-fit:cover;
    position:absolute;
    left:25px;
    bottom:-65px;
    background:white;
}

.profileInfo{
    padding:75px 20px 20px;
}

.profileInfo h1{
    margin:0 0 5px;
}

.profileBio{

}

.profileButtons{
    display:flex;

.createPost textarea{

}

.fileLabel{
    display:inline-block;

    padding:10px 14px;
    border-radius:8px;
    cursor:pointer;
    margin-top:5px;
}

.fileLabel input{
    display:none;
}

.post{
    background:white;
    border-radius:12px;
    margin-bottom:15px;
    padding:15px;
    box-shadow:0 1px 3px rgba(0,0,0,.08);
}

.postHeader{
    display:flex;
    align-items:center;
    gap:10px;
}

.avatar{
    width:45px;
    height:45px;
    border-radius:50%;
    object-fit:cover;
    background:#ddd;
}

.postName{
    font-weight:bold;
    cursor:pointer;
}

.postDate{

}

.postText{

}

.postImage{

}

.postActions{
    display:flex;
    gap:5px;
    margin-top:10px;
    border-top:1px solid #eee;
    padding-top:8px;
}

.postActions button{
    flex:1;
    background:#f0f2f5;
}

.commentBox{
    display:flex;
    gap:5px;
    margin-top:10px;
}

.commentBox input{
    margin:0;
}

.commentBox button{
    background:#1877f2;
    color:white;
}

.comment{
    background:#f0f2f5;
    padding:8px 10px;
    border-radius:10px;
    margin-top:6px;
}

.commentName{
    font-weight:bold;
}

.userCard{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px;
    border-bottom:1px solid #eee;
}

.userCard:last-child{
    border-bottom:0;
}

.userCardInfo{
    flex:1;
}

.userCard button{
    margin-left:5px;
}

.chatList{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.chatUser{
    padding:12px;
    background:#f0f2f5;
    border-radius:10px;
    cursor:pointer;
}

.chatWindow{
    height:400px;
    overflow-y:auto;
    background:#f0f2f5;
    padding:10px;
    border-radius:10px;
    margin-bottom:10px;
}

.message{
    max-width:75%;
    padding:9px 12px;
    margin:5px 0;
    border-radius:15px;
}

.messageMine{
    background:#1877f2;
    color:white;
    margin-left:auto;
}

.messageOther{
    background:white;
}

.messageTime{
    font-size:10px;
    opacity:.7;
}

.chatSend{
    display:flex;
    gap:5px;
}

.chatSend input{
    margin:0;
}

.chatSend button{
    background:#1877f2;
    color:white;
}

.reel{
    background:#111;
    color:white;
    border-radius:12px;
    overflow:hidden;
    margin-bottom:15px;
}

.reel video{
    width:100%;
    max-height:600px;
    display:block;
    background:#000;
}

.reelInfo{
    padding:12px;
}

.notification{
    padding:12px;
    border-bottom:1px solid #eee;
}

.unread{
    background:#e7f3ff;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.6);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:1000;
    padding:15px;
}

.modalBox{
    background:white;
    width:100%;
    max-width:500px;
    max-height:90vh;
    overflow:auto;
    padding:20px;
    border-radius:15px;
}

.closeBtn{
    float:right;
    background:#e4e6eb;
}

.loading{
    text-align:center;
    padding:25px;
    color:#777;
}

.empty{
    text-align:center;
    color:#777;
    padding:20px;
}

@media(max-width:600px){

    .topbar{
        padding:9px;
    }

    .logo{
        font-size:17px;
    }

    .navbar{
        overflow-x:auto;
        justify-content:flex-start;
        white-space:nowrap;
        top:51px;
    }

    .navbar button{
        min-width:max-content;
    }

    .profileCover{
        height:170px;
    }

    .profileAvatar{
        width:100px;
        height:100px;
        bottom:-50px;
    }

    .profileInfo{
        padding-top:60px;
    }

    .postActions button{
        padding:8px 5px;
        font-size:12px;
    }
}
</style>
</head>

<body>

<script>

const SUPABASE_URL =
"https://skereuaizdczbvjplisi.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"PASTE_YOUR_PUBLISHABLE_KEY_HERE";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);

let currentUser = null;
let currentProfile = null;
let currentChatUser = null;


function $(id){
    return document.getElementById(id);
}


function escapeHTML(value){

    if(value === null || value === undefined){
        return "";
    }

    return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function formatDate(date){

    if(!date){
        return "";
    }

    try{
        return new Date(date).toLocaleString("bn-BD");
    }catch(e){
        return "";
    }
}


function makeId(){

    return Date.now() +
    Math.floor(Math.random()*1000);

}


function showSection(id){

    const sections = [
        "homeSection",
        "searchSection",
        "friendsSection",
        "messagesSection",
        "notificationsSection",
        "reelsSection",
        "profileSection",
        "otherProfileSection"
    ];

    sections.forEach(x=>{
        $(x)?.classList.add("hidden");
    });

    $(id)?.classList.remove("hidden");

}


function showLogin(){

    $("loginBox").classList.remove("hidden");
    $("registerBox").classList.add("hidden");

}


function showRegister(){

    $("loginBox").classList.add("hidden");
    $("registerBox").classList.remove("hidden");

}


function closeEditModal(){

    $("editModal").classList.add("hidden");

}


/* AUTH */

async function register(){

    const name =
    $("regName").value.trim();

    const email =
    $("regEmail").value.trim();

    const password =
    $("regPassword").value;

    $("registerMsg").textContent =
    "Creating account...";

    if(!name || !email || !password){

        $("registerMsg").textContent =
        "সব তথ্য পূরণ করুন।";

        return;
    }

    if(password.length < 6){

        $("registerMsg").textContent =
        "Password কমপক্ষে 6 অক্ষরের হতে হবে।";

        return;
    }

    const {data,error} =
    await supabaseClient.auth.signUp({

        email:email,
        password:password,

        options:{
            data:{
                name:name
            }
        }

    });

    if(error){

        $("registerMsg").textContent =
        error.message;

        return;
    }

    if(data.user){

        if(data.session){

            await createProfile(
                data.user.id,
                name
            );

            await startApp(data.user);

        }else{

            $("registerMsg").textContent =
            "Account তৈরি হয়েছে। Email verify করে Login করুন।";

        }

    }

}


async function login(){

    const email =
    $("loginEmail").value.trim();

    const password =
    $("loginPassword").value;

    $("loginMsg").textContent =
    "Logging in...";

    if(!email || !password){

        $("loginMsg").textContent =
        "Email এবং Password দিন।";

        return;
    }

    const {data,error} =
    await supabaseClient.auth.signInWithPassword({

        email:email,
        password:password

    });

    if(error){

        $("loginMsg").textContent =
        error.message;

        return;
    }

    if(data.user){

        await startApp(data.user);

    }

}


async function logout(){

    await supabaseClient.auth.signOut();

    currentUser = null;
    currentProfile = null;

    $("app").classList.add("hidden");
    $("authPage").classList.remove("hidden");

}


async function createProfile(userId,name){

    return await supabaseClient
    .from("profiles")
    .insert({

        id:userId,
        name:name,
        bio:"",
        profile_photo:"",
        cover_photo:""

    });

}


async function loadCurrentProfile(){

    if(!currentUser){
        return null;
    }

    let {data,error} =
    await supabaseClient
    .from("profiles")
    .select("*")
    .eq("id",currentUser.id)
    .maybeSingle();

    if(!data){

        const name =
        currentUser.user_metadata?.name ||
        currentUser.email?.split("@")[0] ||
        "User";

        await createProfile(
            currentUser.id,
            name
        );

        const result =
        await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id",currentUser.id)
        .maybeSingle();

        data = result.data;

    }

    currentProfile = data;

    return data;

}


async function startApp(user){

    currentUser = user;

    $("authPage").classList.add("hidden");
    $("app").classList.remove("hidden");

    await loadCurrentProfile();

    showSection("homeSection");

    await loadFeed();

}


async function checkSession(){

    const {data} =
    await supabaseClient.auth.getSession();

    if(data.session?.user){

        await startApp(data.session.user);

    }else{

        $("authPage").classList.remove("hidden");
        $("app").classList.add("hidden");

    }

}


supabaseClient.auth.onAuthStateChange(
async(event,session)=>{

    if(
        event === "SIGNED_IN" &&
        session?.user &&
        !currentUser
    ){

        await startApp(session.user);

    }

    if(event === "SIGNED_OUT"){

        currentUser = null;

    }

});


/* STORAGE */

async function uploadFile(file,folder){

    if(!file){
        return null;
    }

    const ext =
    file.name.split(".").pop();

    const path =
    folder + "/" +
    currentUser.id + "_" +
    Date.now() + "." +
    ext;

    const {error} =
    await supabaseClient
    .storage
    .from("media")
    .upload(
        path,
        file,
        {
            upsert:false,
            contentType:file.type
        }
    );

    if(error){

        throw new Error(
            "File upload failed: " +
            error.message
        );

    }

    const {data} =
    supabaseClient
    .storage
    .from("media")
    .getPublicUrl(path);

    return data.publicUrl;

}


/* POSTS */

async function createPost(){

    const text =
    $("postText").value.trim();

    const file =
    $("postImage").files[0];

    $("postMsg").textContent =
    "Posting...";

    if(!text && !file){

        $("postMsg").textContent =
        "লেখা অথবা ছবি দিন।";

        return;
    }

    try{

        let imageUrl = "";

        if(file){

            imageUrl =
            await uploadFile(
                file,
                "posts"
            );

        }

        const {error} =
        await supabaseClient
        .from("posts")
        .insert({

            id:makeId(),
            user_id:currentUser.id,
            text:text,
            image_url:imageUrl

        });

        if(error){
            throw error;
        }

        $("postText").value = "";
        $("postImage").value = "";

        $("postMsg").textContent =
        "Post published.";

        await loadFeed();

    }catch(error){

        $("postMsg").textContent =
        error.message;

    }

}


async function loadFeed(){

    const feed = $("feed");

    feed.innerHTML =
    '<div class="loading">Loading...</div>';

    const {data:posts,error} =
    await supabaseClient
    .from("posts")
    .select("*")
    .order("created_at",{ascending:false});

    if(error){

        feed.innerHTML =
        '<div class="empty">' +
        escapeHTML(error.message) +
        '</div>';

        return;
    }

    if(!posts || !posts.length){

        feed.innerHTML =
        '<div class="empty">কোনো Post নেই।</div>';

        return;
    }

    const ids =
    [...new Set(posts.map(p=>p.user_id))];

    const {data:profiles} =
    await supabaseClient
    .from("profiles")
    .select("*")
    .in("id",ids);

    const map = {};

    (profiles || []).forEach(p=>{
        map[p.id] = p;
    });

    let html = "";

    for(const post of posts){

        html += await renderPost(
            post,
            map[post.user_id] || {}
        );

    }

    feed.innerHTML = html;

}


async function renderPost(post,profile){

    const avatar =
    profile.profile_photo ||
    "https://via.placeholder.com/100";

    const liked =
    await hasLiked(post.id);

    const likeCount =
    await getLikeCount(post.id);

    const commentCount =
    await getCommentCount(post.id);

    let imageHTML = "";

    if(post.image_url){

        imageHTML =
        `<img
        class="postImage"
        src="${escapeHTML(post.image_url)}"
        alt="post"
        >`;

    }

    return `

    <div class="post" id="post-${post.id}">

        <div class="postHeader">

            <img
            class="avatar"
            src="${escapeHTML(avatar)}"
            onclick="openProfile('${post.user_id}')"
            >

            <div>

                <div
                class="postName"
                onclick="openProfile('${post.user_id}')"
                >
                ${escapeHTML(profile.name || "User")}
                </div>

                <div class="postDate">
                ${formatDate(post.created_at)}
                </div>

            </div>

        </div>

        ${
            post.text
            ?
            `<div class="postText">
            ${escapeHTML(post.text)}
            </div>`
            :
            ""
        }

        ${imageHTML}

        <div class="postActions">

            <button onclick="toggleLike(${post.id})">
            ${liked ? "❤️" : "👍"} Like
            <span id="likes-${post.id}">
            ${likeCount}
            </span>
            </button>

            <button onclick="toggleComments(${post.id})">
            💬 Comment

async function searchUsers(){

    const q =
    $("userSearch").value.trim();

    let query =
    supabaseClient
    .from("profiles")
    .select("*")
    .neq("id",currentUser.id)
    .limit(30);

    if(q){

        query =
        query.ilike(
            "name",
            "%" + q + "%"
        );

    }

    const {data,error} =
    await query;

    if(error){

        $("usersList").innerHTML =
        escapeHTML(error.message);

        return;
    }

    if(!data || !data.length){

        $("usersList").innerHTML =
        '<div class="empty">User পাওয়া যায়নি।</div>';

        return;
    }

    let html = "";

    for(const user of data){

        const relation =
        await getFriendRelation(user.id);

        let action = "";

        if(relation === "friends"){

            action =
            `<button class="gray">
            Friends
            </button>`;

        }else if(relation === "sent"){

            action =
            `<button class="gray">
            Request Sent
            </button>`;

        }else if(relation === "received"){

            action =
            `<button
            class="green"
            onclick="acceptRequestByUser('${user.id}')"
            >
            Accept
            </button>`;

        }else{

            action =
            `<button
            class="blue"
            onclick="sendFriendRequest('${user.id}')"
            >
            Add Friend
            </button>`;

        }

        html += `

        <div class="userCard">

            <img
            class="avatar"
            src="${escapeHTML(
                user.profile_photo ||
                "https://via.placeholder.com/100"
            )}"
            >

            <div class="userCardInfo">

                <b>
                ${escapeHTML(user.name || "User")}
                </b>

                <div>
                ${escapeHTML(user.bio || "")}
                </div>

            </div>

            ${action}

            <button
            class="gray"
            onclick="openProfile('${user.id}')"
            >
            View
            </button>

        </div>

        `;

    }

    $("usersList").innerHTML = html;

}


/* FRIENDS */

async function getFriendRelation(userId){

    const {data} =
    await supabaseClient
    .from("friend_requests")
    .select("*")
    .or(
        `and(sender_id.eq.${currentUser.id},receiver_id.eq.${userId}),and(sender_id.eq.${userId},receiver_id.eq.${currentUser.id})`
    );

    if(!data || !data.length){
        return "none";
    }

    const accepted =
    data.find(x=>x.status === "accepted");

    if(accepted){
        return "friends";
    }

    const pending =
    data.find(x=>x.status === "pending");

    if(!pending){
        return "none";
    }

    if(pending.sender_id === currentUser.id){
        return "sent";
    }

    return "received";

}


async function sendFriendRequest(receiverId){

    const relation =
    await getFriendRelation(receiverId);

    if(relation !== "none"){

        alert("Already connected/requested.");
        return;

    }

    const {error} =
    await supabaseClient
    .from("friend_requests")
    .insert({

        id:makeId(),
        sender_id:currentUser.id,
        receiver_id:receiverId,
        status:"pending",
        created_at:new Date().toISOString()

    });

    if(error){

        alert(error.message);
        return;

    }

    alert("Friend request sent.");

    await searchUsers();

}


async function acceptRequestByUser(senderId){

    const {data,error} =
    await supabaseClient
    .from("friend_requests")
    .select("*")
    .eq("sender_id",senderId)
    .eq("receiver_id",currentUser.id)
    .eq("status","pending")
    .limit(1)
    .maybeSingle();

    if(error || !data){

        alert("Request not found.");
        return;

    }

    const {error:updateError} =
    await supabaseClient
    .from("friend_requests")
    .update({
        status:"accepted"
    })
    .eq("id",data.id);

    if(updateError){

        alert(updateError.message);
        return;

    }

    await loadFriends();

}

async function uploadReel(){

    if(!file){

        return;
    }

    try{

        const videoUrl =
        await uploadFile(

        );

        const {error} =
        await supabaseClient
        .from("reels")
        .insert({

            id:makeId(),
            user_id:currentUser.id,
            video_url:videoUrl,
            caption:caption,
            views:0,
            created_at:new Date().toISOString()

        });

        if(error){
            throw error;
        }

        $("reelFile").value = "";
        $("reelCaption").value = "";

        $("reelMsg").textContent =
        "Reel uploaded.";

        await loadReels();

    }catch(error){

        $("reelMsg").textContent =
        error.message;

    }

    await supabaseClient
    .from("profiles")

        box.innerHTML =
        '<div class="empty">Profile পাওয়া যায়নি।</div>';

        return;
    }

    const cover =
    profile.cover_photo ||
    "";

    const avatar =
    profile.profile_photo ||
    "https://via.placeholder.com/200";

    let buttons = "";

    if(isMe){

        buttons = `
        <div class="profileButtons">

            <button
            class="blue"
            onclick="openEditModal()"
            >
            ✏️ Edit Profile
            </button>

        </div>

        const relation =
        await getFriendRelation(userId);

        if(relation === "friends"){

            buttons = `

                <button class="gray">
                👥 Friends
                </button>

                <button

                    '${userId}',
                    '${escapeHTML(profile.name || "User")}'
                )"
                >
                💬 Message
                </button>

            </div>
            `;

        }else if(relation === "sent"){

            buttons = `
            <div class="profileButtons">

                <button class="gray">
                Request Sent
                </button>

            </div>
            `;

        }else if(relation === "received"){

            buttons = `
            <div class="profileButtons">

                <button
                class="green"
                onclick="acceptRequestByUser('${userId}')"
                >
                Accept Friend
                </button>

            </div>
            `;

        }else{

            buttons = `
            <div class="profileButtons">

                <button
                class="blue"
                onclick="sendFriendRequest('${userId}')"
                >
                👥 Add Friend
                </button>

            </div>
            `;

        }

    }

    box.innerHTML = `

    <div class="section">

        <div
        class="profileCover"
        style="

        "

        </div>

    </div>

    `;

    $("editModal").classList.remove("hidden");

}


async function saveProfile(){

    const name =
    $("editName").value.trim();

    const bio =
    $("editBio").value.trim();

    const profileFile =
    $("editProfilePhoto").files[0];

    const coverFile =
    $("editCoverPhoto").files[0];

    $("editMsg").textContent =
    "Saving...";

    try{

        let profilePhoto =
        currentProfile.profile_photo || "";

        let coverPhoto =
        currentProfile.cover_photo || "";

        if(profileFile){

            profilePhoto =
            await uploadFile(
                profileFile,
                "profiles"
            );

        }

        if(coverFile){

            coverPhoto =
            await uploadFile(
                coverFile,
                "covers"
            );

        }

        const {data,error} =
        await supabaseClient
        .from("profiles")
        .update({

            name:name || "User",
            bio:bio,
            profile_photo:profilePhoto,
            cover_photo:coverPhoto

        })
        .eq("id",currentUser.id)
        .select()
        .single();

        if(error){
            throw error;
        }

        currentProfile = data;

        $("editMsg").textContent =
        "Profile updated.";

        closeEditModal();

        await renderProfile(
            currentUser.id,
            "profileContent",
            true
        );

    }catch(error){

        $("editMsg").textContent =
        error.message;

    }

}


/* START */

checkSession();

</script>
