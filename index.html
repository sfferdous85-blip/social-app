<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1877f2">
<title>My Social App</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f0f2f5;
  color:#111;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

header{
  position:sticky;
  top:0;
  z-index:100;
  height:58px;
  background:#1877f2;
  color:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px;
  box-shadow:0 2px 6px #0002;
}
.logo{
  font-size:21px;
  font-weight:bold;
}
.headerBtns{
  display:flex;
  gap:6px;
}
.headerBtns button{
  border:0;
  background:#ffffff22;
  color:white;
  border-radius:20px;
  width:40px;
  height:40px;
}

.container{
  max-width:700px;
  margin:auto;
  padding:12px 8px 80px;
}

.card{
  background:white;
  border-radius:12px;
  padding:12px;
  margin-bottom:10px;
  box-shadow:0 1px 3px #0001;
}

.login{
  max-width:430px;
  margin:50px auto;
  padding:20px;
}
.login h1{
  text-align:center;
  color:#1877f2;
}
input,textarea,select{
  width:100%;
  border:1px solid #ddd;
  border-radius:8px;
  padding:11px;
  margin:5px 0;
  outline:none;
}
textarea{min-height:90px;resize:vertical}

.primary{
  width:100%;
  border:0;
  background:#1877f2;
  color:white;
  padding:11px;
  border-radius:8px;
  font-weight:bold;
  margin-top:6px;
}
.secondary{
  border:0;
  background:#e4e6eb;
  padding:9px 14px;
  border-radius:8px;
}
.danger{
  background:#e41e3f;
  color:white;
  border:0;
  padding:10px;
  border-radius:8px;
}

.nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:60px;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:100;
}
.nav button{
  background:none;
  border:0;
  font-size:23px;
}
.nav small{
  display:block;
  font-size:10px;
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd;
}
.userRow{
  display:flex;
  align-items:center;
  gap:9px;
}
.userName{
  font-weight:bold;
}
.muted{
  color:#65676b;
  font-size:13px;
}

.postImg{
  width:100%;
  max-height:500px;
  object-fit:cover;
  border-radius:10px;
  margin-top:8px;
}

.actions{
  display:flex;
  border-top:1px solid #eee;
  margin-top:8px;
}
.actions button{
  flex:1;
  border:0;
  background:white;
  padding:10px 3px;
}
.actions button:hover{
  background:#f0f2f5;
}

.comment{
  background:#f0f2f5;
  border-radius:12px;
  padding:8px;
  margin:5px 0;
}

.reel{
  background:#000;
  border-radius:12px;
  overflow:hidden;
  margin-bottom:12px;
  color:white;
}
.reel video{
  width:100%;
  max-height:80vh;
  display:block;
  object-fit:contain;
  background:#000;
}
.reelInfo{
  padding:10px;
}

.profileCover{
  height:180px;
  background:#1877f2;
  border-radius:12px 12px 0 0;
  background-size:cover;
  background-position:center;
}
.profileBox{
  margin-top:-35px;
  padding:0 15px 15px;
}
.profileBig{
  width:90px;
  height:90px;
  border-radius:50%;
  border:4px solid white;
  object-fit:cover;
}

.tabs{
  display:flex;
  overflow:auto;
  gap:5px;
  margin-bottom:10px;
}
.tabs button{
  white-space:nowrap;
  border:0;
  background:white;
  padding:9px 13px;
  border-radius:20px;
}

.modal{
  position:fixed;
  inset:0;
  background:#0008;
  z-index:500;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
}
.modalBox{
  background:white;
  width:100%;
  max-width:500px;
  max-height:90vh;
  overflow:auto;
  border-radius:12px;
  padding:15px;
}

.toast{
  position:fixed;
  top:70px;
  left:50%;
  transform:translateX(-50%);
  background:#222;
  color:white;
  padding:10px 15px;
  border-radius:8px;
  z-index:1000;
}

body.dark{
  background:#18191a;
  color:#e4e6eb;
}
body.dark .card,
body.dark .nav,
body.dark .modalBox,
body.dark .actions button{
  background:#242526;
  color:#e4e6eb;
}
body.dark input,
body.dark textarea,
body.dark select{
  background:#3a3b3c;
  color:white;
  border-color:#555;
}
body.dark .comment{
  background:#3a3b3c;
}
body.dark .secondary{
  background:#3a3b3c;
  color:white;
}

.loading{
  text-align:center;
  padding:30px;
}

.errorBox{
  background:#fff;
  margin:30px auto;
  max-width:500px;
  padding:20px;
  border-radius:12px;
  color:#d00;
}
</style>
</head>

<body>

<div id="app"></div>

<div id="toast" class="toast hidden"></div>

<div id="modal" class="modal hidden">
  <div class="modalBox" id="modalContent"></div>
</div>

<script>

/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
"https://skereuaizdczbvjplisi.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_3R2otJA1zIlsMsTYxe1ocw_NAPY5O9x";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

let currentUser = null;
let currentProfile = null;


/* =====================================================
   BASIC HELPERS
===================================================== */

function $(id){
  return document.getElementById(id);
}

function toast(message){
  const t=$("toast");
  t.textContent=message;
  t.classList.remove("hidden");
  setTimeout(()=>t.classList.add("hidden"),2500);
}

function esc(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function avatar(url){
  return url || "https://i.pravatar.cc/100";
}

function closeModal(){
  $("modal").classList.add("hidden");
}

function openModal(html){
  $("modalContent").innerHTML=html;
  $("modal").classList.remove("hidden");
}

async function getUser(){
  const {data}=await db.auth.getUser();
  return data?.user || null;
}


/* =====================================================
   AUTH
===================================================== */

function showLogin(){

$("app").innerHTML=`

<div class="login card">

<h1>My Social App</h1>

<div id="authLogin">

<h3>Login</h3>

<input id="loginEmail"
type="email"
placeholder="Email">

<input id="loginPassword"
type="password"
placeholder="Password">

<button class="primary" onclick="login()">
Login
</button>

<button class="secondary"
style="width:100%;margin-top:8px"
onclick="showSignup()">
Create new account
</button>

</div>

</div>

`;

}

function showSignup(){

$("app").innerHTML=`

<div class="login card">

<h1>My Social App</h1>

<h3>Create new account</h3>

<input id="signupName"
placeholder="Your name">

<input id="signupEmail"
type="email"
placeholder="Email">

<input id="signupPassword"
type="password"
placeholder="Password">

<button class="primary" onclick="signup()">
Create account
</button>

<button class="secondary"
style="width:100%;margin-top:8px"
onclick="showLogin()">
Back to Login
</button>

</div>

`;

}

async function signup(){

const name=$("signupName").value.trim();
const email=$("signupEmail").value.trim();
const password=$("signupPassword").value;

if(!name||!email||!password){
toast("সব তথ্য দিন");
return;
}

if(password.length<6){
toast("Password কমপক্ষে ৬ অক্ষর দিন");
return;
}

const {data,error}=await db.auth.signUp({
email,
password
});

if(error){
toast(error.message);
return;
}

if(data.user){

await db.from("my social app").insert({
id:data.user.id,
name:name
});

toast("Account তৈরি হয়েছে");

if(!data.session){
alert("Email verification চালু থাকলে আপনার Email verify করুন।");
}

}

}

async function login(){

const email=$("loginEmail").value.trim();
const password=$("loginPassword").value;

if(!email||!password){
toast("Email এবং Password দিন");
return;
}

const {data,error}=await db.auth.signInWithPassword({
email,
password
});

if(error){
toast(error.message);
return;
}

currentUser=data.user;

await startApp();

}

async function logout(){

await db.auth.signOut();

currentUser=null;
currentProfile=null;

showLogin();

}


/* =====================================================
   PROFILE
===================================================== */

async function loadProfile(){

if(!currentUser)return;

const {data,error}=await db
.from("my social app")
.select("*")
.eq("id",currentUser.id)
.maybeSingle();

if(error){
console.log(error);
return;
}

currentProfile=data;

if(!data){

const {data:newProfile}=await db
.from("my social app")
.insert({
id:currentUser.id,
name:currentUser.email?.split("@")[0] || "User"
})
.select()
.single();

currentProfile=newProfile;
}

}

function profileName(){
return currentProfile?.name ||
currentUser?.email?.split("@")[0] ||
"User";
}

function profilePhoto(){
return currentProfile?.profile_photo ||
"https://i.pravatar.cc/200";
}


/* =====================================================
   MAIN APP
===================================================== */

async function startApp(){

currentUser=await getUser();

if(!currentUser){
showLogin();
return;
}

await loadProfile();

renderLayout();

loadHome();

}

function renderLayout(){

$("app").innerHTML=`

<header>

<div class="logo">My Social App</div>

<div class="headerBtns">

<button onclick="searchUsers()">🔍</button>

<button onclick="showNotifications()">🔔</button>

<button onclick="showSettings()">⚙️</button>

</div>

</header>

<main class="container" id="page">

<div class="loading">
Loading...
</div>

</main>

<nav class="nav">

<button onclick="loadHome()">
🏠<small>Home</small>
</button>

<button onclick="loadReels()">
🎬<small>Reels</small>
</button>

<button onclick="createPost()">
➕<small>Post</small>
</button>

<button onclick="loadProfilePage(currentUser.id)">
👤<small>Profile</small>
</button>

<button onclick="showFriends()">
👥<small>Friends</small>
</button>

</nav>

`;

}


/* =====================================================
   HOME FEED
===================================================== */

async function loadHome(){

const page=$("page");

page.innerHTML=`

<div class="tabs">
<button onclick="loadHome()">🏠 Home</button>
<button onclick="loadReels()">🎬 Reels</button>
<button onclick="showFriends()">👥 Friends</button>
</div>

<div class="card">

<div class="userRow">

<img class="avatar"
src="${avatar(profilePhoto())}">

<div style="flex:1">

<button
class="secondary"
style="width:100%;text-align:left"
onclick="createPost()">
What's on your mind?
</button>

</div>

</div>

</div>

<div id="feed">
<div class="loading">Loading posts...</div>
</div>

`;

const {data,error}=await db
.from("posts")
.select("*")
.order("created_at",{ascending:false})
.limit(50);

if(error){

$("feed").innerHTML=
`<div class="card">
<b>Post load error</b>
<p>${esc(error.message)}</p>
</div>`;

return;
}

if(!data?.length){

$("feed").innerHTML=`
<div class="card">
<h3>No posts yet</h3>
<p>প্রথম পোস্টটি আপনিই করুন।</p>
</div>
`;

return;
}

$("feed").innerHTML="";

for(const post of data){

await renderPost(post);

}

}


/* =====================================================
   POST
===================================================== */

async function createPost(){

openModal(`

<h3>Create Post</h3>

<textarea id="postText"
placeholder="What's on your mind?"></textarea>

<input id="postImage"
placeholder="Image URL (optional)">

<select id="postFeeling">
<option value="">Feeling</option>
<option>😊 Happy</option>
<option>😍 Love</option>
<option>😢 Sad</option>
<option>😎 Cool</option>
<option>🔥 Excited</option>
</select>

<select id="postPrivacy">
<option value="public">Public</option>
<option value="friends">Friends</option>
<option value="only_me">Only me</option>
</select>

<button class="primary"
onclick="submitPost()">
Post
</button>

<button class="secondary"
style="width:100%;margin-top:8px"
onclick="closeModal()">
Cancel
</button>

`);

}

async function submitPost(){

const text=$("postText").value.trim();
const image=$("postImage").value.trim();
const feeling=$("postFeeling").value;
const privacy=$("postPrivacy").value;

if(!text&&!image){
toast("Text অথবা Image দিন");
return;
}

const {error}=await db
.from("posts")
.insert({
user_id:currentUser.id,
text:text,
image_url:image || null,
privacy,
feeling
});

if(error){
toast(error.message);
return;
}

closeModal();
toast("Post হয়েছে");
loadHome();

}


/* =====================================================
   RENDER POST
===================================================== */

async function renderPost(post){

let name="User";
let photo="https://i.pravatar.cc/100";

const {data:profile}=await db
.from("my social app")
.select("name,profile_photo")
.eq("id",post.user_id)
.maybeSingle();

if(profile){
name=profile.name || name;
photo=profile.profile_photo || photo;
}

let likeCount=0;
let liked=false;

const {data:likes}=await db
.from("post_reactions")
.select("user_id,reaction")
.eq("post_id",post.id);

if(likes){

likeCount=likes.length;
liked=likes.some(x=>x.user_id===currentUser.id);

}

let commentCount=0;

const {count}=await db
.from("comments")
.select("*",{count:"exact",head:true})
.eq("post_id",post.id);

commentCount=count || 0;

const html=`

<div class="card" id="post-${post.id}">

<div class="userRow">

<img class="avatar"
src="${avatar(photo)}">

<div style="flex:1">

<div class="userName">
${esc(name)}
</div>

<div class="muted">
${new Date(post.created_at).toLocaleString()}
</div>

</div>

</div>

${post.text ? `
<p>${esc(post.text)}</p>
` : ""}

${post.feeling ? `
<div>${esc(post.feeling)}</div>
` : ""}

${post.image_url ? `
<img class="postImg"
src="${esc(post.image_url)}"
onerror="this.style.display='none'">
` : ""}

<div class="muted"
style="margin-top:8px">
❤️ ${likeCount} &nbsp; 💬 ${commentCount}
</div>

<div class="actions">

<button onclick="likePost(${post.id})">
${liked?"❤️":"👍"} Like
</button>

<button onclick="showComments(${post.id})">
💬 Comment
</button>

<button onclick="sharePost(${post.id})">
↗ Share
</button>

</div>

<div id="comments-${post.id}"></div>

</div>
`;

$("feed").insertAdjacentHTML("beforeend",html);

}


/* =====================================================
   LIKE POST
===================================================== */

async function likePost(postId){

const {data}=await db
.from("post_reactions")
.select("id")
.eq("post_id",postId)
.eq("user_id",currentUser.id)
.maybeSingle();

if(data){

await db
.from("post_reactions")
.delete()
.eq("id",data.id);

}else{

await db
.from("post_reactions")
.insert({
post_id:postId,
user_id:currentUser.id,
reaction:"like"
});

}

loadHome();

}


/* =====================================================
   COMMENTS
===================================================== */

async function showComments(postId){

const box=$("comments-"+postId);

if(!box)return;

box.innerHTML=`
<div class="card">
<div class="loading">Loading comments...</div>
</div>
`;

const {data,error}=await db
.from("comments")
.select("*")
.eq("post_id",postId)
.order("created_at",{ascending:true});

if(error){

box.innerHTML=
`<p>${esc(error.message)}</p>`;
return;

}

let html="";

for(const comment of data || []){

let name="User";

const {data:p}=await db
.from("my social app")
.select("name")
.eq("id",comment.user_id)
.maybeSingle();

if(p?.name)name=p.name;

html+=`

<div class="comment">

<b>${esc(name)}</b>

<div>${esc(comment.comment)}</div>

<div class="muted">
${new Date(comment.created_at).toLocaleString()}
</div>

</div>

`;

}

html+=`

<input id="commentInput-${postId}"
placeholder="Write a comment...">

<button class="primary"
onclick="addComment(${postId})">
Comment
</button>

`;

box.innerHTML=html;

}

async function addComment(postId){

const input=$("commentInput-"+postId);

const text=input.value.trim();

if(!text)return;

const {error}=await db
.from("comments")
.insert({
post_id:postId,
user_id:currentUser.id,
comment:text
});

if(error){
toast(error.message);
return;
}

showComments(postId);

}


/* =====================================================
   SHARE
===================================================== */

async function sharePost(postId){

const url=location.href+"#post-"+postId;

if(navigator.share){

try{

await navigator.share({
title:"My Social App",
text:"Check this post",
url
});

}catch(e){}

}else{

await navigator.clipboard.writeText(url);

toast("Post link copied");

}

}


/* =====================================================
   REELS
===================================================== */

async function loadReels(){

$("page").innerHTML=`

<div class="card">

<h3>🎬 Reels</h3>

<input id="reelVideo"
placeholder="Video URL">

<input id="reelCaption"
placeholder="Caption">

<button class="primary"
onclick="uploadReel()">
Publish Reel
</button>

</div>

<div id="reelsList">
<div class="loading">Loading reels...</div>
</div>

`;

const {data,error}=await db
.from("reels")
.select("*")
.order("created_at",{ascending:false})
.limit(30);

if(error){

$("reelsList").innerHTML=
`<div class="card">${esc(error.message)}</div>`;

return;

}

if(!data?.length){

$("reelsList").innerHTML=
`<div class="card">No reels yet.</div>`;

return;

}

$("reelsList").innerHTML="";

for(const reel of data){

let likes=0;
let liked=false;

const {data:rl}=await db
.from("reel_likes")
.select("user_id")
.eq("reel_id",reel.id);

if(rl){
likes=rl.length;
liked=rl.some(x=>x.user_id===currentUser.id);
}

$("reelsList").insertAdjacentHTML(
"beforeend",

`

<div class="reel">

<video
src="${esc(reel.video_url)}"
controls
loop
playsinline
preload="metadata">
</video>

<div class="reelInfo">

<b>${esc(reel.caption||"")}</b>

<div style="margin-top:8px">

<button class="secondary"
onclick="likeReel(${reel.id})">
${liked?"❤️":"🤍"} ${likes}
</button>

<button class="secondary"
onclick="commentReel(${reel.id})">
💬 Comment
</button>

</div>

</div>

</div>

`

);

}

}

async function uploadReel(){

const video=$("reelVideo").value.trim();
const caption=$("reelCaption").value.trim();

if(!video){
toast("Video URL দিন");
return;
}

const {error}=await db
.from("reels")
.insert({
user_id:currentUser.id,
video_url:video,
caption
});

if(error){
toast(error.message);
return;
}

toast("Reel published");
loadReels();

}

async function likeReel(reelId){

const {data}=await db
.from("reel_likes")
.select("id")
.eq("reel_id",reelId)
.eq("user_id",currentUser.id)
.maybeSingle();

if(data){

await db
.from("reel_likes")
.delete()
.eq("id",data.id);

}else{

await db
.from("reel_likes")
.insert({
reel_id:reelId,
user_id:currentUser.id
});

}

loadReels();

}

async function commentReel(reelId){

openModal(`

<h3>Reel Comment</h3>

<div id="reelComments">
Loading...
</div>

<input id="reelCommentInput"
placeholder="Write comment...">

<button class="primary"
onclick="addReelComment(${reelId})">
Comment
</button>

`);

const {data}=await db
.from("reel_comments")
.select("*")
.eq("reel_id",reelId)
.order("created_at",{ascending:true});

let html="";

for(const c of data||[]){

html+=`
<div class="comment">
${esc(c.comment)}
</div>
`;

}

$("reelComments").innerHTML=
html || "No comments yet.";

}

async function addReelComment(reelId){

const text=$("reelCommentInput").value.trim();

if(!text)return;

const {error}=await db
.from("reel_comments")
.insert({
reel_id:reelId,
user_id:currentUser.id,
comment:text
});

if(error){
toast(error.message);
return;
}

commentReel(reelId);

}


/* =====================================================
   PROFILE PAGE
===================================================== */

async function loadProfilePage(userId){

const {data:p}=await db
.from("my social app")
.select("*")
.eq("id",userId)
.maybeSingle();

const name=p?.name || "User";
const photo=p?.profile_photo ||
"https://i.pravatar.cc/200";

const cover=p?.cover_photo || "";

let followerCount=0;
let followingCount=0;

const f1=await db
.from("follows")
.select("*",{count:"exact",head:true})
.eq("following_id",userId);

followerCount=f1.count||0;

const f2=await db
.from("follows")
.select("*",{count:"exact",head:true})
.eq("follower_id",userId);

followingCount=f2.count||0;

$("page").innerHTML=`

<div class="card" style="padding:0;overflow:hidden">

<div class="profileCover"
style="background-image:url('${esc(cover)}')">
</div>

<div class="profileBox">

<img class="profileBig"
src="${avatar(photo)}">

<h2>${esc(name)}</h2>

<div>
Followers: ${followerCount}
&nbsp;&nbsp;
Following: ${followingCount}
</div>

${userId!==currentUser.id ? `
<button class="primary"
onclick="toggleFollow('${userId}')">
Follow / Unfollow
</button>
` : `
<button class="secondary"
onclick="editProfile()">
Edit Profile
</button>
`}

</div>

</div>

<div class="card">
<h3>Posts</h3>
<div id="profilePosts">Loading...</div>
</div>

`;

const {data:posts}=await db
.from("posts")
.select("*")
.eq("user_id",userId)
.order("created_at",{ascending:false})
.limit(30);

if(!posts?.length){

$("profilePosts").innerHTML="No posts";

return;

}

$("profilePosts").innerHTML="";

for(const post of posts){

const div=document.createElement("div");

div.className="card";

div.innerHTML=`

${post.text?
`<p>${esc(post.text)}</p>`:""}

${post.image_url?
`<img class="postImg" src="${esc(post.image_url)}">`:""}

<div class="muted">
${new Date(post.created_at).toLocaleString()}
</div>

`;

$("profilePosts").appendChild(div);

}

}


/* =====================================================
   FOLLOW
===================================================== */

async function toggleFollow(userId){

const {data}=await db
.from("follows")
.select("id")
.eq("follower_id",currentUser.id)
.eq("following_id",userId)
.maybeSingle();

if(data){

await db
.from("follows")
.delete()
.eq("id",data.id);

toast("Unfollowed");

}else{

await db
.from("follows")
.insert({
follower_id:currentUser.id,
following_id:userId
});

toast("Followed");

}

loadProfilePage(userId);

}


/* =====================================================
   SEARCH
===================================================== */

function searchUsers(){

openModal(`

<h3>🔍 Search Users</h3>

<input id="searchInput"
placeholder="Name লিখুন"
oninput="doSearch()">

<div id="searchResults"></div>

`);

}

async function doSearch(){

const q=$("searchInput").value.trim();

if(!q){

$("searchResults").innerHTML="";
return;

}

const {data,error}=await db
.from("my social app")
.select("*")
.ilike("name","%"+q+"%")
.limit(20);

if(error){

$("searchResults").innerHTML=
esc(error.message);

return;

}

let html="";

for(const p of data||[]){

html+=`

<div class="card">

<div class="userRow">

<img class="avatar"
src="${avatar(p.profile_photo)}">

<div style="flex:1">
<b>${esc(p.name)}</b>
</div>

<button class="secondary"
onclick="closeModal();loadProfilePage('${p.id}')">
View
</button>

</div>

</div>

`;

}

$("searchResults").innerHTML=
html || "No users found.";

}

async function showFriendRequests(){

const {data,error}=await db
.from("friend_requests")
.select("*")
.eq("receiver_id",currentUser.id)
.eq("status","pending");

if(error){

toast(error.message);
return;

}

let html="<h3>Friend Requests</h3>";

for(const r of data||[]){

const {data:p}=await db
.from("my social app")
.select("*")
.eq("id",r.sender_id)
.maybeSingle();

html+=`

<div class="card">

<b>${esc(p?.name||"User")}</b>

<button class="primary"
onclick="acceptFriend('${r.id}','${r.sender_id}')">
Accept
</button>

</div>

`;

}

openModal(html);

}

async function acceptFriend(requestId,senderId){

await db
.from("friend_requests")
.update({status:"accepted"})
.eq("id",requestId);

await db
.from("friends")
.insert({
user_id:currentUser.id,
friend_id:senderId
});

await db
.from("friends")
.insert({
user_id:senderId,
friend_id:currentUser.id
});

toast("Friend added");

showFriendRequests();

}

function editProfile(){

openModal(`

<h3>👤 Edit Profile</h3>

<input id="editName"
value="${esc(profileName())}"
placeholder="Name">

<input id="editPhoto"
value="${esc(currentProfile?.profile_photo||"")}"
placeholder="Profile Photo URL">

<input id="editCover"
value="${esc(currentProfile?.cover_photo||"")}"
placeholder="Cover Photo URL">

<button class="primary"
onclick="saveProfile()">
Save
</button>

`);

}

async function saveProfile(){

const name=$("editName").value.trim();
const photo=$("editPhoto").value.trim();
const cover=$("editCover").value.trim();

const {error}=await db
.from("my social app")
.update({
name,
profile_photo:photo||null,
cover_photo:cover||null
})
.eq("id",currentUser.id);

if(error){

toast(error.message);
return;

}

await loadProfile();

closeModal();

toast("Profile updated");

loadProfilePage(currentUser.id);

}


/* =====================================================
   DARK MODE
===================================================== */

function toggleDarkMode(){

document.body.classList.toggle("dark");

localStorage.setItem(
"dark",
document.body.classList.contains("dark")
);

}

if(localStorage.getItem("dark")==="true"){
document.body.classList.add("dark");
}


/* =====================================================
   MONETIZATION
===================================================== */

async function showMonetization(){

openModal(`

<h3>💰 Creator Monetization</h3>

<div id="monetization">
Loading...
</div>

`);

const {data,error}=await db
.from("creator_settings")
.select("*")
.eq("user_id",currentUser.id)
.maybeSingle();

if(error){

$("monetization").innerHTML=
esc(error.message);

return;

}

const enabled=data?.monetization_enabled||false;

$("monetization").innerHTML=`

<div class="card">

<b>Status:</b>
${enabled?"🟢 Enabled":"🔴 Disabled"}

</div>

<input id="payoutEmail"
placeholder="Payout Email"
value="${esc(data?.payout_email||"")}">

<select id="payoutMethod">

<option value="">Payout Method</option>

<option value="bank"
${data?.payout_method==="bank"?"selected":""}>
Bank
</option>

<option value="paypal"
${data?.payout_method==="paypal"?"selected":""}>
PayPal
</option>

</select>

<button class="primary"
onclick="saveMonetization()">
Save Monetization Settings
</button>

`;

}

async function saveMonetization(){

const email=$("payoutEmail").value.trim();
const method=$("payoutMethod").value;

const {error}=await db
.from("creator_settings")
.upsert({
user_id:currentUser.id,
monetization_enabled:true,
payout_email:email,
payout_method:method,
updated_at:new Date().toISOString()
});

if(error){

toast(error.message);
return;

}

toast("Monetization settings saved");

showMonetization();

}

.from("notification_settings")
.upsert({
user_id:currentUser.id,
comments:$("setComments").checked,
friend_requests:$("setFriends").checked,
messages:$("setMessages").checked,
follows:$("setFollows").checked,
updated_at:new Date().toISOString()
});

if(error){

toast(error.message);
return;

}

toast("Settings saved");

closeModal();

}
