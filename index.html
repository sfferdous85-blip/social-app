<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Social App</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f0f2f5;
    color:#222;
}

header{
    background:#1877f2;
    color:white;
    padding:12px 15px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;
    top:0;
    z-index:100;
}

header h1{
    font-size:22px;
}

button{
    border:0;
    border-radius:6px;
    padding:9px 14px;
    cursor:pointer;
    background:#1877f2;
    color:white;
    font-size:14px;
}

button:hover{
    opacity:.9;
}

input,
textarea{
    width:100%;
    padding:11px;
    border:1px solid #ddd;
    border-radius:7px;
    margin:6px 0;
    font-size:15px;
}

textarea{
    resize:vertical;
    min-height:80px;
}

.container{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:15px;
}

.card{
    background:white;
    border-radius:10px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 1px 4px rgba(0,0,0,.1);
}

.hidden{
    display:none!important;
}

.auth{
    max-width:400px;
    margin:60px auto;
}

.auth h2{
    margin-bottom:15px;
    text-align:center;
}

.switch{
    text-align:center;
    margin-top:10px;
    color:#1877f2;
    cursor:pointer;
}

.profile-cover{
    height:220px;
    background:#ddd;
    border-radius:10px 10px 0 0;
    overflow:hidden;
}

.profile-cover img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.profile-info{
    position:relative;
    padding:10px;
    padding-top:65px;
}

.profile-photo{
    width:110px;
    height:110px;
    border-radius:50%;
    object-fit:cover;
    border:5px solid white;
    position:absolute;
    top:-55px;
    left:20px;
    background:#ddd;
}

.profile-name{
    font-size:22px;
    font-weight:bold;
}

.post-user{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
}

.avatar{
    width:45px;
    height:45px;
    border-radius:50%;
    object-fit:cover;
    background:#ddd;
}

.post-image{
    width:100%;
    max-height:600px;
    object-fit:contain;
    border-radius:8px;
    margin-top:10px;
    background:#eee;
}

.actions{
    display:flex;
    gap:5px;
    border-top:1px solid #eee;
    border-bottom:1px solid #eee;
    padding:8px 0;
    margin-top:10px;
}

.actions button{
    flex:1;
    background:white;
    color:#333;
}

.actions button:hover{
    background:#f0f2f5;
}

.comment{
    padding:7px;
    background:#f0f2f5;
    border-radius:7px;
    margin-top:5px;
}

.user-result{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px;
    border-bottom:1px solid #eee;
}

.user-left{
    display:flex;
    align-items:center;
    gap:10px;
}

.nav{
    display:flex;
    gap:5px;
    overflow-x:auto;
    margin-bottom:15px;
}

.nav button{
    white-space:nowrap;
}

video{
    width:100%;
    max-height:600px;
    border-radius:8px;
    background:#000;
}

.message{
    padding:8px 12px;
    margin:5px 0;
    border-radius:15px;
    max-width:75%;
}

.mine{
    background:#1877f2;
    color:white;
    margin-left:auto;
}

.theirs{
    background:#e4e6eb;
    color:#111;
}

.small{
    font-size:12px;
    color:#777;
}

.danger{
    background:#e41e3f;
}

.success{
    background:#42b72a;
}

.gray{
    background:#65676b;
}

.file{
    margin:8px 0;
}

@media(max-width:600px){

    .container{
        padding:8px;
    }

    header h1{
        font-size:18px;
    }

    .profile-cover{
        height:160px;
    }
}
</style>
</head>

<body>

<header id="mainHeader" class="hidden">

    <h1>My Social App</h1>

    <button onclick="logout()">
        Logout
    </button>

</header>


<div id="authSection" class="container">

    <div id="loginBox" class="card auth">

        <h2>Login</h2>

        <input
            id="loginEmail"
            type="email"
            placeholder="Email"
        >

        <input
            id="loginPassword"
            type="password"
            placeholder="Password"
        >

        <button
            style="width:100%;"
            onclick="login()"
        >
            Login
        </button>

        <div
            class="switch"
            onclick="showRegister()"
        >
            Create new account
        </div>

        <p
            id="loginMessage"
            style="margin-top:10px;color:red;"
        ></p>

    </div>


    <div
        id="registerBox"
        class="card auth hidden"
    >

        <h2>Create new account</h2>

        <input
            id="registerName"
            type="text"
            placeholder="Your name"
        >

        <input
            id="registerEmail"
            type="email"
            placeholder="Email"
        >

        <input
            id="registerPassword"
            type="password"
            placeholder="Password"
        >

        <button
            style="width:100%;"
            onclick="register()"
        >
            Create Account
        </button>

        <div
            class="switch"
            onclick="showLogin()"
        >
            Already have an account? Login
        </div>

        <p
            id="registerMessage"
            style="margin-top:10px;color:red;"
        ></p>

    </div>

</div>


<div
    id="appSection"
    class="container hidden"
>

    <div class="nav">

        <button onclick="showPage('home')">
            🏠 Home
        </button>

        <button onclick="showPage('profile')">
            👤 Profile
        </button>

        <button onclick="showPage('friends')">
            👥 Friends
        </button>

        <button onclick="showPage('search')">
            🔎 Search
        </button>

        <button onclick="showPage('messages')">
            💬 Messenger
        </button>

        <button onclick="showPage('notifications')">
            🔔 Notifications
        </button>

        <button onclick="showPage('reels')">
            🎬 Reels
        </button>

    </div>


    <div id="homePage">

        <div class="card">

            <h3>Create Post</h3>

            <textarea
                id="postText"
                placeholder="What's on your mind?"
            ></textarea>

            <input
                id="postImage"
                class="file"
                type="file"
                accept="image/*"
            >

            <button onclick="createPost()">
                Post
            </button>

            <p
                id="postMessage"
                style="margin-top:8px;"
            ></p>

        </div>

        <div id="feed"></div>

    </div>


    <div
        id="profilePage"
        class="hidden"
    >

        <div class="card">

            <div class="profile-cover">

                <img
                    id="coverImage"
                    src=""
                    alt=""
                >

            </div>

            <div class="profile-info">

                <img
                    id="profileImage"
                    class="profile-photo"
                    src=""
                    alt=""
                >

                <div
                    id="profileName"
                    class="profile-name"
                ></div>

                <p
                    id="profileBio"
                    style="margin-top:5px;"
                ></p>

            </div>

        </div>


        <div class="card">

            <h3>Edit Profile</h3>

            <input
                id="editName"
                placeholder="Name"
            >

            <textarea
                id="editBio"
                placeholder="Bio"
            ></textarea>

            <label>
                Profile Photo
            </label>

            <input
                id="editProfilePhoto"
                type="file"
                accept="image/*"
            >

            <label>
                Cover Photo
            </label>

            <input
                id="editCoverPhoto"
                type="file"
                accept="image/*"
            >

            <button onclick="updateProfile()">
                Save Profile
            </button>

            <p id="profileMessage"></p>

        </div>

    </div>


    <div
        id="friendsPage"
        class="hidden"
    >

        <div class="card">

            <h2>Friend Requests</h2>

            <div id="friendRequests"></div>

        </div>


        <div class="card">

            <h2>My Friends</h2>

            <div id="friendsList"></div>

        </div>

    </div>


    <div
        id="searchPage"
        class="hidden"
    >

        <div class="card">

            <h2>Search Users</h2>

            <input
                id="searchInput"
                placeholder="Search by name..."
                oninput="searchUsers()"
            >

            <div id="searchResults"></div>

        </div>

    </div>


    <div
        id="messagesPage"
        class="hidden"
    >

        <div class="card">

            <h2>Messenger</h2>

            <input
                id="messageUserId"
                placeholder="Receiver User ID"
            >

            <div
                id="messagesBox"
                style="
                    height:350px;
                    overflow-y:auto;
                    border:1px solid #ddd;
                    padding:10px;
                    margin:10px 0;
                "
            ></div>

            <input
                id="messageText"
                placeholder="Write message..."
            >

            <button onclick="sendMessage()">
                Send
            </button>

            <button
                class="gray"
                onclick="loadMessages()"
            >
                Refresh
            </button>

        </div>

    </div>


    <div
        id="notificationsPage"
        class="hidden"
    >

        <div class="card">

            <h2>Notifications</h2>

            <div id="notificationsList"></div>

        </div>

    </div>


    <div
        id="reelsPage"
        class="hidden"
    >

        <div class="card">

            <h2>Upload Reel</h2>

            <input
                id="reelCaption"
                placeholder="Caption"
            >

            <input
                id="reelVideo"
                type="file"
                accept="video/*"
            >

            <button onclick="uploadReel()">
                Upload Reel
            </button>

            <p id="reelMessage"></p>

        </div>

        <div id="reelsList"></div>

    </div>

</div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://skereuaizdczbvjplisi.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_3R2otJA1zIlsMsTYxe1ocw_NAPY5O9x";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


/* =========================================
   GLOBAL
========================================= */

let currentUser = null;


/* =========================================
   AUTH UI
========================================= */

function showLogin(){

    document
        .getElementById("loginBox")
        .classList.remove("hidden");

    document
        .getElementById("registerBox")
        .classList.add("hidden");
}


function showRegister(){

    document
        .getElementById("loginBox")
        .classList.add("hidden");

    document
        .getElementById("registerBox")
        .classList.remove("hidden");
}


/* =========================================
   REGISTER
========================================= */

async function register(){

    const name =
        document
            .getElementById("registerName")
            .value
            .trim();

    const email =
        document
            .getElementById("registerEmail")
            .value
            .trim();

    const password =
        document
            .getElementById("registerPassword")
            .value;

    const message =
        document.getElementById(
            "registerMessage"
        );


    if(!name || !email || !password){

        message.innerText =
            "সব তথ্য পূরণ করুন।";

        return;
    }


    if(password.length < 6){

        message.innerText =
            "Password কমপক্ষে ৬ অক্ষরের হতে হবে।";

        return;
    }


    message.innerText =
        "Account তৈরি হচ্ছে...";


    const {
        data,
        error
    } =
    await supabaseClient.auth.signUp({

        email:email,

        password:password

    });


    if(error){

        message.innerText =
            error.message;

        return;
    }


    if(data.user){

        const {
            error:profileError
        } =
        await supabaseClient
            .from("profiles")
            .insert({

                id:data.user.id,

                name:name,

                bio:"",

                profile_photo:"",

                cover_photo:""

            });


        if(profileError){

            console.log(
                profileError
            );
        }
    }


    message.style.color =
        "green";

    message.innerText =
        "Account তৈরি হয়েছে।";


    setTimeout(
        showLogin,
        1500
    );
}


/* =========================================
   LOGIN
========================================= */

async function login(){

    const email =
        document
            .getElementById("loginEmail")
            .value
            .trim();

    const password =
        document
            .getElementById("loginPassword")
            .value;

    const message =
        document.getElementById(
            "loginMessage"
        );


    if(!email || !password){

        message.innerText =
            "Email এবং Password দিন।";

        return;
    }


    message.innerText =
        "Login হচ্ছে...";


    const {
        data,
        error
    } =
    await supabaseClient
        .auth
        .signInWithPassword({

            email:email,

            password:password

        });


    if(error){

        message.innerText =
            error.message;

        return;
    }


    currentUser =
        data.user;

    await startApp();
}


/* =========================================
   LOGOUT
========================================= */

async function logout(){

    await supabaseClient
        .auth
        .signOut();

    currentUser = null;


    document
        .getElementById("appSection")
        .classList.add("hidden");

    document
        .getElementById("mainHeader")
        .classList.add("hidden");

    document
        .getElementById("authSection")
        .classList.remove("hidden");

    showLogin();
}


/* =========================================
   START APP
========================================= */

async function startApp(){

    document
        .getElementById("authSection")
        .classList.add("hidden");

    document
        .getElementById("appSection")
        .classList.remove("hidden");

    document
        .getElementById("mainHeader")
        .classList.remove("hidden");


    await loadProfile();

    await loadFeed();
}


/* =========================================
   PAGE SWITCH
========================================= */

function showPage(page){

    const pages = [

        "homePage",
        "profilePage",
        "friendsPage",
        "searchPage",
        "messagesPage",
        "notificationsPage",
        "reelsPage"

    ];


    pages.forEach(
        id => {

            document
                .getElementById(id)
                .classList.add("hidden");

        }
    );


    if(page === "home"){

        document
            .getElementById("homePage")
            .classList.remove("hidden");

        loadFeed();
    }


    if(page === "profile"){

        document
            .getElementById("profilePage")
            .classList.remove("hidden");

        loadProfile();
    }


    if(page === "friends"){

        document
            .getElementById("friendsPage")
            .classList.remove("hidden");

        loadFriendRequests();

        loadFriends();
    }


    if(page === "search"){

        document
            .getElementById("searchPage")
            .classList.remove("hidden");
    }


    if(page === "messages"){

        document
            .getElementById("messagesPage")
            .classList.remove("hidden");
    }


    if(page === "notifications"){

        document
            .getElementById("notificationsPage")
            .classList.remove("hidden");

        loadNotifications();
    }


    if(page === "reels"){

        document
            .getElementById("reelsPage")
            .classList.remove("hidden");

        loadReels();
    }
}


/* =========================================
   PROFILE
========================================= */

async function loadProfile(){

    if(!currentUser)
        return;


    let {
        data,
        error
    } =
    await supabaseClient
        .from("profiles")
        .select("*")
        .eq(
            "id",
            currentUser.id
        )
        .maybeSingle();


    if(error){

        console.log(error);

        return;
    }


    if(!data){

        const {
            data:newProfile
        } =
        await supabaseClient
            .from("profiles")
            .insert({

                id:currentUser.id,

                name:
                    currentUser.email
                        ?.split("@")[0] ||
                    "User",

                bio:"",

                profile_photo:"",

                cover_photo:""

            })
            .select()
            .single();

        data =
            newProfile;
    }


    if(!data)
        return;


    document
        .getElementById("profileName")
        .innerText =
            data.name || "User";


    document
        .getElementById("profileBio")
        .innerText =
            data.bio || "";


    document
        .getElementById("editName")
        .value =
            data.name || "";


    document
        .getElementById("editBio")
        .value =
            data.bio || "";


    document
        .getElementById("profileImage")
        .src =
            data.profile_photo ||
            "https://via.placeholder.com/150";


    document
        .getElementById("coverImage")
        .src =
            data.cover_photo ||
            "https://via.placeholder.com/900x300";
}


/* =========================================
   UPDATE PROFILE
========================================= */

async function updateProfile(){

    if(!currentUser)
        return;


    const name =
        document
            .getElementById("editName")
            .value
            .trim();

    const bio =
        document
            .getElementById("editBio")
            .value
            .trim();


    const profileFile =
        document
            .getElementById(
                "editProfilePhoto"
            )
            .files[0];


    const coverFile =
        document
            .getElementById(
                "editCoverPhoto"
            )
            .files[0];


    let profilePhoto = null;

    let coverPhoto = null;


    if(profileFile){

        profilePhoto =
            await uploadMedia(
                profileFile,
                "profiles"
            );

        if(!profilePhoto)
            return;
    }


    if(coverFile){

        coverPhoto =
            await uploadMedia(
                coverFile,
                "covers"
            );

        if(!coverPhoto)
            return;
    }


    const updateData = {

        name:name,

        bio:bio

    };


    if(profilePhoto){

        updateData.profile_photo =
            profilePhoto;
    }


    if(coverPhoto){

        updateData.cover_photo =
            coverPhoto;
    }


    const {
        error
    } =
    await supabaseClient
        .from("profiles")
        .update(updateData)
        .eq(
            "id",
            currentUser.id
        );


    const message =
        document.getElementById(
            "profileMessage"
        );


    if(error){

        message.style.color =
            "red";

        message.innerText =
            error.message;

        return;
    }


    message.style.color =
        "green";

    message.innerText =
        "Profile updated successfully!";


    await loadProfile();
}


/* =========================================
   STORAGE
========================================= */

async function uploadMedia(
    file,
    folder
){

    if(!file)
        return null;


    const extension =
        file.name
            .split(".")
            .pop();


    const fileName =
        `${folder}/${currentUser.id}_${Date.now()}.${extension}`;


    const {
        error
    } =
    await supabaseClient
        .storage
        .from("media")
        .upload(
            fileName,
            file,
            {
                upsert:false
            }
        );


    if(error){

        alert(
            "Upload error: " +
            error.message
        );

        return null;
    }


    const {
        data
    } =
    supabaseClient
        .storage
        .from("media")
        .getPublicUrl(
            fileName
        );


    return data.publicUrl;
}


/* =========================================
   CREATE POST
========================================= */

async function createPost(){

    if(!currentUser)
        return;


    const text =
        document
            .getElementById("postText")
            .value
            .trim();


    const file =
        document
            .getElementById("postImage")
            .files[0];


    const message =
        document.getElementById(
            "postMessage"
        );


    if(!text && !file){

        message.innerText =
            "Post-এ কিছু লিখুন বা ছবি দিন।";

        return;
    }


    message.innerText =
        "Post হচ্ছে...";


    let imageUrl = "";


    if(file){

        imageUrl =
            await uploadMedia(
                file,
                "posts"
            );

        if(!imageUrl){

            message.innerText =
                "ছবি upload হয়নি।";

            return;
        }
    }


    const {
        error
    } =
    await supabaseClient
        .from("posts")
        .insert({

            user_id:
                currentUser.id,

            text:text,

            image_url:
                imageUrl

        });


    if(error){

        message.style.color =
            "red";

        message.innerText =
            error.message;

        return;
    }


    document
        .getElementById("postText")
        .value = "";

    document
        .getElementById("postImage")
        .value = "";


    message.style.color =
        "green";

    message.innerText =
        "Post published!";


    loadFeed();
}


/* =========================================
   LOAD FEED
========================================= */

async function loadFeed(){

    const feed =
        document.getElementById(
            "feed"
        );


    feed.innerHTML =
        "<div class='card'>Loading posts...</div>";


    const {
        data:posts,
        error
    } =
    await supabaseClient
        .from("posts")
        .select("*")
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        feed.innerHTML =
            `<div class="card">
                ${escapeHtml(
                    error.message
                )}
            </div>`;

        return;
    }


    if(!posts || posts.length === 0){

        feed.innerHTML =
            `<div class="card">
                No posts yet.
            </div>`;

        return;
    }


    feed.innerHTML = "";


    for(
        const post of posts
    ){

        const html =
            await createPostHTML(
                post
            );

        feed.innerHTML +=
            html;
    }
}


/* =========================================
   POST HTML
========================================= */

async function createPostHTML(
    post
){

    const {
        data:profile
    } =
    await supabaseClient
        .from("profiles")
        .select(
            "name,profile_photo"
        )
        .eq(
            "id",
            post.user_id
        )
        .maybeSingle();


    const {
        count:likeCount
    } =
    await supabaseClient
        .from("post_likes")
        .select(
            "*",
            {
                count:"exact",
                head:true
            }
        )
        .eq(
            "post_id",
            post.id
        );


    let liked = false;


    if(currentUser){

        const {
            data:myLike
        } =
        await supabaseClient
            .from("post_likes")
            .select("post_id")
            .eq(
                "post_id",
                post.id
            )
            .eq(
                "user_id",
                currentUser.id
            )
            .maybeSingle();


        liked =
            !!myLike;
    }


    const {
        data:comments
    } =
    await supabaseClient
        .from("comments")
        .select("*")
        .eq(
            "post_id",
            post.id
        )
        .order(
            "created_at",
            {
                ascending:true
            }
        );


    let commentsHTML = "";


    if(comments){

        for(
            const comment of comments
        ){

            const {
                data:commentProfile
            } =
            await supabaseClient
                .from("profiles")
                .select(
                    "name,profile_photo"
                )
                .eq(
                    "id",
                    comment.user_id
                )
                .maybeSingle();


            commentsHTML += `

                <div class="comment">

                    <b>
                        ${escapeHtml(
                            commentProfile?.name ||
                            "User"
                        )}
                    </b>

                    <br>

                    ${escapeHtml(
                        comment.text
                    )}

                </div>

            `;
        }
    }


    const avatar =
        profile?.profile_photo ||
        "https://via.placeholder.com/50";


    const deleteButton =
        currentUser &&
        post.user_id ===
        currentUser.id
        ?
        `
        <button
            class="danger"
            onclick="deletePost(${post.id})"
        >
            Delete
        </button>
        `
        :
        "";


    return `

        <div
            class="card"
            id="post-${post.id}"
        >

            <div class="post-user">

                <img
                    class="avatar"
                    src="${avatar}"
                >

                <div>

                    <b>
                        ${escapeHtml(
                            profile?.name ||
                            "User"
                        )}
                    </b>

                    <div class="small">
                        ${formatDate(
                            post.created_at
                        )}
                    </div>

                </div>

            </div>


            ${
                post.text
                ?
                `
                <p
                    style="white-space:pre-wrap;"
                >
                    ${escapeHtml(
                        post.text
                    )}
                </p>
                `
                :
                ""
            }


            ${
                post.image_url
                ?
                `
                <img
                    class="post-image"
                    src="${post.image_url}"
                >
                `
                :
                ""
            }


            <div class="actions">

                <button
                    onclick="toggleLike(${post.id})"
                >
                    ${liked ? "❤️" : "🤍"}
                    Like ${likeCount || 0}
                </button>

                <button
                    onclick="focusComment(${post.id})"
                >
                    💬 Comment
                </button>

                <button
                    onclick="sharePost(${post.id})"
                >
                    ↗ Share
                </button>

                ${deleteButton}

            </div>


            <div
                id="comments-${post.id}"
                style="margin-top:8px;"
            >

                ${commentsHTML}

            </div>


            <div
                style="
                    display:flex;
                    gap:5px;
                    margin-top:8px;
                "
            >

                <input
                    id="commentInput-${post.id}"
                    placeholder="Write a comment..."
                >

                <button
                    onclick="addComment(${post.id})"
                >
                    Send
                </button>

            </div>

        </div>

    `;
}


/* =========================================
   LIKE
========================================= */

async function toggleLike(
    postId
){

    if(!currentUser)
        return;


    const {
        data:existing
    } =
    await supabaseClient
        .from("post_likes")
        .select("*")
        .eq(
            "post_id",
            postId
        )
        .eq(
            "user_id",
            currentUser.id
        )
        .maybeSingle();


    if(existing){

        await supabaseClient
            .from("post_likes")
            .delete()
            .eq(
                "post_id",
                postId
            )
            .eq(
                "user_id",
                currentUser.id
            );

    }else{

        await supabaseClient
            .from("post_likes")
            .insert({

                post_id:
                    postId,

                user_id:
                    currentUser.id

            });
    }


    loadFeed();
}


/* =========================================
   COMMENT
========================================= */

async function addComment(
    postId
){

    if(!currentUser)
        return;


    const input =
        document.getElementById(
            `commentInput-${postId}`
        );


    const text =
        input.value.trim();


    if(!text)
        return;


    const {
        error
    } =
    await supabaseClient
        .from("comments")
        .insert({

            post_id:
                postId,

            user_id:
                currentUser.id,

            text:
                text

        });


    if(error){

        alert(
            error.message
        );

        return;
    }


    input.value = "";

    loadFeed();
}


function focusComment(
    postId
){

    const input =
        document.getElementById(
            `commentInput-${postId}`
        );

    if(input)
        input.focus();
}


/* =========================================
   DELETE POST
========================================= */

async function deletePost(
    postId
){

    if(!confirm(
        "এই post delete করবেন?"
    ))
        return;


    const {
        error
    } =
    await supabaseClient
        .from("posts")
        .delete()
        .eq(
            "id",
            postId
        )
        .eq(
            "user_id",
            currentUser.id
        );


    if(error){

        alert(
            error.message
        );

        return;
    }


    loadFeed();
}


/* =========================================
   SHARE
========================================= */

async function sharePost(
    postId
){

    const url =
        location.href +
        "#post-" +
        postId;


    if(navigator.share){

        try{

            await navigator.share({

                title:
                    "My Social App",

                text:
                    "Check this post",

                url:url

            });

        }catch(e){}

    }else{

        await navigator.clipboard.writeText(
            url
        );

        alert(
            "Post link copied!"
        );
    }
}


/* =========================================
   FRIEND REQUEST
========================================= */

async function sendFriendRequest(
    receiverId
){

    if(!currentUser)
        return;


    if(
        receiverId ===
        currentUser.id
    ){

        alert(
            "নিজেকে friend request পাঠানো যাবে না।"
        );

        return;
    }


    const {
        data:existing
    } =
    await supabaseClient
        .from("friend_requests")
        .select("*")
        .or(
            `and(sender_id.eq.${currentUser.id},receiver_id.eq.${receiverId}),and(sender_id.eq.${receiverId},receiver_id.eq.${currentUser.id})`
        )
        .maybeSingle();


    if(existing){

        alert(
            "Friend request already exists."
        );

        return;
    }


    const {
        error
    } =
    await supabaseClient
        .from("friend_requests")
        .insert({

            sender_id:
                currentUser.id,

            receiver_id:
                receiverId,

            status:
                "pending"

        });


    if(error){

        alert(
            error.message
        );

        return;
    }


    alert(
        "Friend request sent!"
    );
}


/* =========================================
   FRIEND REQUEST LIST
========================================= */

/* =========================================
   ACCEPT FRIEND
========================================= */

async function acceptFriend(
    requestId
){

    const {
        error
    } =
    await supabaseClient
        .from("friend_requests")
        .update({
            status:"accepted"
        })
        .eq(
            "id",
            requestId
        );


    if(error){

        return;

    loadFriendRequests();

}


/* =========================================
   REJECT FRIEND
========================================= */

async function rejectFriend(

){

        .from("friend_requests")
        .update({

        })
        .eq(

    if(error){

/* =========================================
   FRIENDS
========================================= */

async function loadFriends(){

    const box =
        document.getElementById(
            "friendsList"
        );


    const {
        data,
        error
    } =
    await supabaseClient
        .from("friend_requests")
        .select("*")
        .eq(
            "status",
            "accepted"
        )
        .or(
            `sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`
        );


    if(error){

        box.innerHTML =
            escapeHtml(
                error.message
            );

        return;
    }


    if(!data || !data.length){

        box.innerHTML =
            "<p>No friends yet.</p>";

        return;
    }


    box.innerHTML = "";


    for(
        const friendship of data
    ){

        const friendId =
            friendship.sender_id ===
            currentUser.id

            )

            <div class="user-result">

                        }"
                    >

                    <div>

                        <b>
                            ${escapeHtml(
                                user?.name ||
                                "User"
                            )}
                        </b>

                        <div class="small">
                            ${friendId}
                        </div>

                </div>

                    Message

        `;

}


/* =========================================
   SEARCH
========================================= */

async function searchUsers(){

    const q =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .trim();


    const results =
        document.getElementById(
            "searchResults"
        );


    if(!q){

        results.innerHTML = "";

        return;
    }


    const {
        data,
        error
    } =
    await supabaseClient
        .from("profiles")
        .select(
            "id,name,bio,profile_photo"
        )
        .ilike(
            "name",
            `%${q}%`
        )
        .limit(30);


    if(error){

        results.innerHTML =
            escapeHtml(
                error.message
            );

        return;
    }


    if(!data || !data.length){

        results.innerHTML =
            "<p>No user found.</p>";

        return;
    }


    results.innerHTML = "";


    for(
        const user of data
    ){

        if(
            user.id ===
            currentUser.id
        )
            continue;


        results.innerHTML += `

            <div class="user-result">

                <div class="user-left">

                    <img
                        class="avatar"
                        src="${
                            user.profile_photo ||
                            "https://via.placeholder.com/50"
                        }"
                    >

                    <div>

                        <b>
                            ${escapeHtml(
                                user.name ||
                                "User"
                            )}
                        </b>

                        <div class="small">
                            ${escapeHtml(
                                user.bio || ""
                            )}
                        </div>

                    </div>

                </div>


                <button
                    onclick="sendFriendRequest('${user.id}')"
                >
                    Add Friend
                </button>

            </div>

        `;
    }
}


/* =========================================
   OPEN CHAT
========================================= */

function openChat(
    userId
){

    document
        .getElementById(
            "messageUserId"
        )
        .value =
            userId;


    showPage(
        "messages"
    );


    loadMessages();
}


/* =========================================
   SEND MESSAGE
========================================= */

async function sendMessage(){

    if(!currentUser)
        return;


    const receiverId =
        document
            .getElementById(
                "messageUserId"
            )
            .value
            .trim();


    const text =
        document
            .getElementById(
                "messageText"
            )
            .value
            .trim();


    if(!receiverId){

        alert(
            "Receiver User ID দিন।"
        );

        return;
    }


    if(!text)
        return;


    const {
        error
    } =
    await supabaseClient
        .from("messages")
        .insert({

            sender_id:
                currentUser.id,

            receiver_id:
                receiverId,

            text:
                text

        });


    if(error){

        alert(
            error.message
        );

        return;
    }


    document
        .getElementById(
            "messageText"
        )
        .value = "";


    loadMessages();
}


/* =========================================
   LOAD MESSAGES
========================================= */

async function loadMessages(){

    const receiverId =
        document
            .getElementById(
                "messageUserId"
            )
            .value
            .trim();


    if(!receiverId)
        return;


    const box =
        document.getElementById(
            "messagesBox"
        );


    const {
        data,
        error
    } =
    await supabaseClient
        .from("messages")
        .select("*")
        .or(
            `and(sender_id.eq.${currentUser.id},receiver_id.eq.${receiverId}),and(sender_id.eq.${receiverId},receiver_id.eq.${currentUser.id})`
        )
        .order(
            "created_at",
            {
                ascending:true
            }
        );


    if(error){

        box.innerHTML =
            escapeHtml(
                error.message
            );

        return;
    }


    box.innerHTML = "";


    if(!data || !data.length){

        box.innerHTML =
            "<p>No messages yet.</p>";

        return;
    }


    data.forEach(
        msg => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "message " +
                (
                    msg.sender_id ===
                    currentUser.id
                    ?
                    "mine"
                    :
                    "theirs"
                );


            div.innerText =
                msg.text;


            box.appendChild(
                div
            );

        }
    );


    box.scrollTop =
        box.scrollHeight;
}


/* =========================================
   NOTIFICATIONS
========================================= */

async function loadNotifications(){

    const box =
        document.getElementById(
            "notificationsList"
        );


    const {
        data,
        error
    } =
    await supabaseClient
        .from("notifications")
        .select("*")
        .eq(
            "receiver_id",
            currentUser.id
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        box.innerHTML =
            escapeHtml(
                error.message
            );

        return;
    }

        );

/* =========================================
   REELS
========================================= */

async function uploadReel(){

    if(!currentUser)
        return;


    const file =
        document
            .getElementById(
                "reelVideo"
            )
            .files[0];


    const caption =
        document
            .getElementById(
                "reelCaption"
            )
            .value
            .trim();


    const message =
        document.getElementById(
            "reelMessage"
        );


    if(!file){

        message.innerText =
            "Video select করুন।";

        return;
    }


    message.innerText =
        "Video upload হচ্ছে...";


    const videoUrl =
        await uploadMedia(
            file,
            "reels"
        );


    if(!videoUrl){

        message.innerText =
            "Video upload হয়নি।";

        return;
    }


    const {
        error
    } =
    await supabaseClient
        .from("reels")
        .insert({

            user_id:
                currentUser.id,

            video_url:
                videoUrl,

            caption:
                caption,

            views:
                0

        });


    if(error){

        message.innerText =
            error.message;

        return;
    }


    message.style.color =
        "green";

    message.innerText =
        "Reel uploaded!";


    document
        .getElementById(
            "reelVideo"
        )
        .value = "";


    document
        .getElementById(
            "reelCaption"
        )
        .value = "";


    loadReels();
}


/* =========================================
   LOAD REELS
========================================= */

    const box =
        document.getElementById(
            "reelsList"
        );


    box.innerHTML =
        "<div class='card'>Loading reels...</div>";


    const {
        data,
        error
    } =
    await supabaseClient
        .from("reels")
        .select("*")
        .order(

                ascending:false
            }
        );

        box.innerHTML =

                ${escapeHtml(

            </div>`;

    }

    for(
        const reel of data
    ){

        const {

        } =
        await supabaseClient
            .from("profiles")
            .select(
                "name,profile_photo"
            )
            .eq(
                "id",
                reel.user_id
            )
            .maybeSingle();

                        }"
                    >

                    <b>
                        ${escapeHtml(
                            profile?.name ||
                            "User"
                        )}
                    </b>

                </div>


                <video
                    controls
                    playsinline
                    onplay="
                        increaseReelView(

                            ${reel.views || 0}
                        )
                    "
                >

                    <source
                        src="${reel.video_url}"
                    >

                </video>


                ${
                    reel.caption
                    ?
                    `
                    <p
                        style="
                            margin-top:10px;
                            white-space:pre-wrap;
                        "
                    >
                        ${escapeHtml(

                    </p>

                }


                <div class="small">

                    👁 ${reel.views || 0} views

                </div>


                <div
                    style="margin-top:8px;"
                >

                    ${deleteButton}

                </div>

            </div>

        `;
    }
}


/* =========================================
   REEL VIEW
========================================= */

async function increaseReelView(
    reelId,
    currentViews
){

    await supabaseClient
        .from("reels")
        .update({

            views:
                Number(
                    currentViews || 0
                ) + 1

        })
        .eq(
            "id",
            reelId
        );
}


/* =========================================
   DELETE REEL
========================================= */

async function deleteReel(
    reelId
){

    if(!confirm(
        "এই Reel delete করবেন?"
    ))
        return;


    const {
        error
    } =
    await supabaseClient
        .from("reels")
        .delete()
        .eq(
            "id",
            reelId
        )
        .eq(
            "user_id",
            currentUser.id
        );


    if(error){

        alert(
            error.message
        );

        return;
    }


    loadReels();
}


/* =========================================
   HELPERS
========================================= */

function escapeHtml(
    text
){

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text ?? "";

    return div.innerHTML;
}


function formatDate(
    date
){

    if(!date)
        return "";

    return new Date(
        date
    ).toLocaleString(
        "bn-BD"
    );
}


/* =========================================
   SESSION
========================================= */

async function checkSession(){

    const {
        data
    } =
    await supabaseClient
        .auth
        .getSession();


    if(
        data &&
        data.session &&
        data.session.user
    ){

        currentUser =
            data.session.user;

        await startApp();

    }else{

        document
            .getElementById(
                "authSection"
            )
            .classList.remove(
                "hidden"
            );
    }
}


/* =========================================
   AUTH STATE
========================================= */

supabaseClient
    .auth
    .onAuthStateChange(
        async (
            event,
            session
        ) => {

            if(
                session &&
                session.user
            ){

                currentUser =
                    session.user;
            }

        }
    );


/* =========================================
   START
========================================= */

checkSession();


/* =========================================
   MESSAGE AUTO REFRESH
========================================= */

setInterval(
    () => {

        const page =
            document.getElementById(
                "messagesPage"
            );


        if(
            page &&
            !page.classList.contains(
                "hidden"
            ) &&
            currentUser
        ){

            loadMessages();

        }

    },
    5000
);
