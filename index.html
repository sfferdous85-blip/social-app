<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1877f2">
<title>My Social App</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f0f2f5;
  color:#111;
}

body.dark{
  background:#18191a;
  color:#eee;
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
  border:0;
}

.container{
  max-width:700px;
  margin:auto;
  padding:10px;
}

.card{
  background:#fff;
  border-radius:12px;
  padding:14px;
  margin-bottom:12px;
  box-shadow:0 1px 3px #0002;
}

.dark .card{
  background:#242526;
  color:#eee;
}

input,textarea,select{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:8px;
  margin:5px 0;
}

.dark input,
.dark textarea,
.dark select{
  background:#3a3b3c;
  color:#fff;
  border-color:#555;
}

.primary{
  background:#1877f2;
  color:white;
  padding:11px 16px;
  border-radius:8px;
}

.secondary{
  background:#e4e6eb;
  padding:10px 14px;
  border-radius:8px;
}

.dark .secondary{
  background:#3a3b3c;
  color:white;
}

.topbar{
  position:sticky;
  top:0;
  z-index:100;
  background:#1877f2;
  color:#fff;
  padding:12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.nav{
  display:flex;
  gap:5px;
  overflow-x:auto;
  background:#fff;
  padding:8px;
  position:sticky;
  top:50px;
  z-index:90;
}

.dark .nav{
  background:#242526;
}

.nav button{
  flex:1;
  min-width:70px;
  padding:9px 6px;
  border-radius:8px;
  background:transparent;
}

.nav button:hover{
  background:#e4e6eb;
}

.dark .nav button:hover{
  background:#3a3b3c;
}

.hidden{
  display:none!important;
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd;
}

.post-head{
  display:flex;
  gap:10px;
  align-items:center;
}

.post-name{
  font-weight:bold;
}

.post-time{
  font-size:12px;
  color:#777;
}

.post-image{
  width:100%;
  max-height:600px;
  object-fit:cover;
  border-radius:10px;
  margin-top:10px;
}

.actions{
  display:flex;
  gap:5px;
  margin-top:10px;
}

.actions button{
  flex:1;
  padding:10px;
  border-radius:8px;
  background:#e4e6eb;
}

.dark .actions button{
  background:#3a3b3c;
  color:#fff;
}

.comment{
  background:#f0f2f5;
  padding:9px;
  border-radius:8px;
  margin:5px 0;
}

.dark .comment{
  background:#3a3b3c;
}

.modal-bg{
  position:fixed;
  inset:0;
  background:#0008;
  z-index:999;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal{
  background:#fff;
  color:#111;
  width:100%;
  max-width:500px;
  max-height:90vh;
  overflow:auto;
  border-radius:14px;
  padding:16px;
}

.dark .modal{
  background:#242526;
  color:#fff;
}

.close{
  float:right;
  font-size:24px;
  background:none;
}

.reel{
  background:#000;
  color:#fff;
  border-radius:12px;
  margin-bottom:15px;
  overflow:hidden;
}

.reel video{
  width:100%;
  height:75vh;
  object-fit:cover;
  display:block;
}

.reel-info{
  padding:12px;
}

.reel-actions{
  display:flex;
  gap:8px;
  padding:10px;
}

.reel-actions button{
  background:#ffffff22;
  color:#fff;
  padding:10px 14px;
  border-radius:20px;
}

.profile-cover{
  width:100%;
  height:200px;
  object-fit:cover;
  border-radius:12px;
}

.profile-box{
  text-align:center;
  margin-top:-45px;
}

.profile-big{
  width:90px;
  height:90px;
  border-radius:50%;
  border:4px solid #fff;
  object-fit:cover;
}

.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#222;
  color:#fff;
  padding:12px 18px;
  border-radius:8px;
  z-index:2000;
}

.auth{
  max-width:420px;
  margin:50px auto;
  padding:20px;
}

hr{
  border:0;
  border-top:1px solid #ddd;
  margin:12px 0;
}

</head>

<body>

<div id="app"></div>

<script>
const SUPABASE_URL =
"https://skereuaizdczbvjplisi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_3R2otJA1zIlsMsTYxe1ocw_NAPY5O9x";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser = null;
let profile = null;

const $ = id => document.getElementById(id);

function esc(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function toast(message){
  const old=document.querySelector(".toast");
  if(old) old.remove();

  const div=document.createElement("div");
  div.className="toast";
  div.textContent=message;
  document.body.appendChild(div);

  setTimeout(()=>div.remove(),2500);
}

function openModal(html){
  closeModal();

  const bg=document.createElement("div");
  bg.className="modal-bg";
  bg.id="modalBg";

  bg.innerHTML=`
    <div class="modal">
      <button class="close" onclick="closeModal()">×</button>
      ${html}
    </div>
  `;

  document.body.appendChild(bg);
}

function closeModal(){
  const m=$("modalBg");
  if(m) m.remove();
}

/* =========================
   AUTH
========================= */

function showLogin(){
  $("app").innerHTML=`
    <div class="auth">
      <div class="card">
        <h1>My Social App</h1>
        <h2>Login</h2>

        <input id="loginEmail" type="email" placeholder="Email">

        <input id="loginPassword"
               type="password"
               placeholder="Password">

        <button class="primary"
                style="width:100%;margin-top:8px"
                onclick="login()">
          Login
        </button>

        <button class="secondary"
                style="width:100%;margin-top:8px"
                onclick="showSignup()">
          Create new account
        </button>
      </div>
    </div>
  `;
}

function showSignup(){
  $("app").innerHTML=`
    <div class="auth">
      <div class="card">
        <h1>My Social App</h1>
        <h2>Create Account</h2>

        <input id="signupName"
               placeholder="Your name">

        <input id="signupEmail"
               type="email"
               placeholder="Email">

        <input id="signupPassword"
               type="password"
               placeholder="Password">

        <button class="primary"
                style="width:100%;margin-top:8px"
                onclick="signup()">
          Sign Up
        </button>

        <button class="secondary"
                style="width:100%;margin-top:8px"
                onclick="showLogin()">
          Back to Login
        </button>
      </div>
    </div>
  `;
}

async function signup(){

  const name=$("signupName").value.trim();
  const email=$("signupEmail").value.trim();
  const password=$("signupPassword").value;

  if(!name || !email || !password){
    toast("সব তথ্য দিন");
    return;
  }

  if(password.length<6){
    toast("Password কমপক্ষে ৬ অক্ষরের হতে হবে");
    return;
  }

  const {data,error}=await db.auth.signUp({
    email,
    password,
    options:{
      data:{
        name:name
      }
    }
  });

  if(error){
    toast(error.message);
    return;
  }

  toast("Account created");

  if(data.user){
    currentUser=data.user;
    await loadProfile();
    renderApp();
  }
}

async function login(){

  const email=$("loginEmail").value.trim();
  const password=$("loginPassword").value;

  const {data,error}=await db.auth.signInWithPassword({
    email,
    password
  });

  if(error){
    toast(error.message);
    return;
  }

  currentUser=data.user;
  await loadProfile();
  renderApp();
}

async function logout(){
  await db.auth.signOut();
  currentUser=null;
  profile=null;
  showLogin();
}

/* =========================
   PROFILE
========================= */

async function loadProfile(){

  if(!currentUser) return;

  const {data,error}=await db
    .from("my social app")
    .select("*")
    .eq("id",currentUser.id)
    .maybeSingle();

  if(error){
    console.log(error);
    return;
  }

  profile=data;

  if(!profile){

    const {data:newProfile,error:insertError}=
      await db
      .from("my social app")
      .insert({
        id:currentUser.id,
        name:currentUser.user_metadata?.name ||
             currentUser.email?.split("@")[0] ||
             "User"
      })
      .select()
      .single();

    if(!insertError){
      profile=newProfile;
    }
  }
}

/* =========================
   APP UI
========================= */

function renderApp(){

  $("app").innerHTML=`

    <div class="topbar">
      <b>My Social App</b>

      <button
        style="background:none;color:#fff;font-size:22px"
        onclick="logout()">
        ⇥
      </button>
    </div>

    <div class="nav">
      <button onclick="showHome()">🏠 Home</button>
      <button onclick="showReels()">🎬 Reels</button>
      <button onclick="showProfile()">👤 Profile</button>
      <button onclick="showSearch()">🔍 Search</button>
      <button onclick="showSettings()">⚙️ Settings</button>
    </div>

    <main class="container" id="content"></main>
  `;

  showHome();
}

/* =========================
   HOME
========================= */

async function showHome(){

  $("content").innerHTML=`
    <div class="card">
      <h3>What's on your mind?</h3>

      <textarea
        id="postText"
        placeholder="Write something..."></textarea>

      <input
        id="postImage"
        type="file"
        accept="image/*">

      <select id="postPrivacy">
        <option value="public">🌍 Public</option>
        <option value="friends">👥 Friends</option>
        <option value="private">🔒 Only me</option>
      </select>

      <input
        id="postFeeling"
        placeholder="Feeling / Activity (optional)">

      <button class="primary"
              style="width:100%"
              onclick="submitPost()">
        Post
      </button>
    </div>

    <div id="feed">Loading...</div>
  `;

  await loadPosts();
}

async function submitPost(){

  const text=$("postText").value.trim();
  const imageFile=$("postImage").files[0];
  const privacy=$("postPrivacy").value;
  const feeling=$("postFeeling").value.trim();

  if(!text && !imageFile){
    toast("Text অথবা Photo দিন");
    return;
  }

  let image=null;

  if(imageFile){

    const ext=imageFile.name.split(".").pop();
    const path=
      currentUser.id+"/"+
      Date.now()+"."+ext;

    const {error:uploadError}=
      await db.storage
      .from("post-images")
      .upload(path,imageFile);

    if(uploadError){
      toast("Image upload error: "+uploadError.message);
      return;
    }

    const {data:urlData}=
      db.storage
      .from("post-images")
      .getPublicUrl(path);

    image=urlData.publicUrl;
  }

  const {error}=await db
    .from("posts")
    .insert({
      user_id:currentUser.id,
      text:text,
      image_url:image,
      privacy:privacy,
      feeling:feeling || null
    });

  if(error){
    toast(error.message);
    return;
  }

  $("postText").value="";
  $("postImage").value="";
  $("postFeeling").value="";

  toast("Post published");

  await loadPosts();
}

async function loadPosts(){

  const feed=$("feed");

  const {data:posts,error}=await db
    .from("posts")
    .select("*")
    .order("created_at",{ascending:false})
    .limit(50);

  if(error){
    feed.innerHTML=`
      <div class="card">
        ${esc(error.message)}
      </div>
    `;
    return;
  }

  if(!posts || posts.length===0){
    feed.innerHTML=`
      <div class="card">
        No posts yet.
      </div>
    `;
    return;
  }

  let html="";

  for(const post of posts){

    let author="User";
    let avatar="";

    const {data:p}=await db
      .from("my social app")
      .select("name,profile_photo")
      .eq("id",post.user_id)
      .maybeSingle();

    if(p){
      author=p.name || "User";
      avatar=p.profile_photo || "";
    }

    const {count:likeCount}=await db
      .from("post_reactions")
      .select("*",{count:"exact",head:true})
      .eq("post_id",post.id);

    html+=`
      <div class="card">

        <div class="post-head">

          ${
            avatar
            ? `<img class="avatar"
                    src="${esc(avatar)}">`
            : `<div class="avatar"></div>`
          }

          <div>
            <div class="post-name">
              ${esc(author)}
            </div>

            <div class="post-time">
              ${post.created_at
                ? new Date(post.created_at).toLocaleString()
                : ""}
            </div>
          </div>

        </div>

        ${
          post.feeling
          ? `<div style="margin-top:8px">
               😊 ${esc(post.feeling)}
             </div>`
          : ""
        }

        ${
          post.text
          ? `<div style="margin-top:10px">
               ${esc(post.text)}
             </div>`
          : ""
        }

        ${
          post.image_url
          ? `<img class="post-image"
                  src="${esc(post.image_url)}">`
          : ""
        }

        <div class="actions">

          <button onclick="likePost(${post.id})">
            ❤️ ${likeCount || 0}
          </button>

          <button onclick="commentPost(${post.id})">
            💬 Comment
          </button>

          <button onclick="sharePost(${post.id})">
            ↗ Share
          </button>

        </div>

      </div>
    `;
  }

  feed.innerHTML=html;
}

/* =========================
   POST LIKE
========================= */

async function likePost(postId){

  const {data:existing}=await db
    .from("post_reactions")
    .select("id")
    .eq("post_id",postId)
    .eq("user_id",currentUser.id)
    .maybeSingle();

  if(existing){

    await db
      .from("post_reactions")
      .delete()
      .eq("id",existing.id);

  }else{

    const {error}=await db
      .from("post_reactions")
      .insert({
        post_id:postId,
        user_id:currentUser.id,
        reaction:"like"
      });

    if(error){
      toast(error.message);
      return;
    }
  }

  await loadPosts();
}

/* =========================
   POST COMMENT
========================= */

async function commentPost(postId){

  openModal(`
    <h3>💬 Comments</h3>

    <div id="postComments">
      Loading...
    </div>

    <div style="display:flex;gap:5px">
      <input
        id="postCommentInput"
        placeholder="Write comment..."
        style="flex:1">

      <button
        class="primary"
        style="width:auto"
        onclick="addPostComment(${postId})">
        Send
      </button>
    </div>
  `);

  await loadPostComments(postId);
}

async function loadPostComments(postId){

  const box=$("postComments");

  const {data,error}=await db
    .from("comments")
    .select("id,post_id,user_id,text,created_at")
    .eq("post_id",postId)
    .order("created_at",{ascending:true});

  if(error){
    box.innerHTML=esc(error.message);
    return;
  }

  let html="";

  for(const c of data || []){

    html+=`
      <div class="comment">
        ${esc(c.text)}
      </div>
    `;
  }

  box.innerHTML=html || "No comments yet.";
}

async function addPostComment(postId){

  const input=$("postCommentInput");
  const text=input.value.trim();

  if(!text) return;

  const {error}=await db
    .from("comments")
    .insert({
      post_id:postId,
      user_id:currentUser.id,
      text:text
    });

  if(error){
    toast(error.message);
    return;
  }

  input.value="";

  await loadPostComments(postId);
}

/* =========================
   SHARE
========================= */

async function sharePost(postId){

  const url=location.href+"#post-"+postId;

  if(navigator.share){

    try{
      await navigator.share({
        title:"My Social App",
        text:"Check this post",
        url:url
      });
    }catch(e){}

  }else{

    await navigator.clipboard.writeText(url);
    toast("Post link copied");
  }
}

/* =========================
   REELS
========================= */

async function showReels(){

  $("content").innerHTML=`
    <div class="card">
      <h2>🎬 Reels</h2>
    </div>

    <div id="reelsList">
      Loading...
    </div>
  `;

  await loadReels();
}

async function loadReels(){

  const box=$("reelsList");

  const {data:reels,error}=await db
    .from("reels")
    .select("*")
    .order("created_at",{ascending:false})
    .limit(50);

  if(error){
    box.innerHTML=`
      <div class="card">
        ${esc(error.message)}
      </div>
    `;
    return;
  }

  if(!reels || reels.length===0){
    box.innerHTML=`
      <div class="card">
        No reels yet.
      </div>
    `;
    return;
  }

  let html="";

  for(const reel of reels){

    const {count:likes}=await db
      .from("reel_likes")
      .select("*",{count:"exact",head:true})
      .eq("reel_id",reel.id);

    html+=`
      <div class="reel">

        <video
          src="${esc(reel.video_url)}"
          controls
          playsinline
          loop>
        </video>

        <div class="reel-info">

          ${
            reel.caption
            ? `<div>${esc(reel.caption)}</div>`
            : ""
          }

          ${
            reel.audio_name
            ? `<div style="font-size:13px;margin-top:5px">
                🎵 ${esc(reel.audio_name)}
               </div>`
            : ""
          }

        </div>

        <div class="reel-actions">

          <button onclick="likeReel(${reel.id})">
            ❤️ ${likes || 0}
          </button>

          <button onclick="commentReel(${reel.id})">
            💬 Comment
          </button>

          <button onclick="shareReel(${reel.id})">
            ↗ Share
          </button>

        </div>

      </div>
    `;
  }

  box.innerHTML=html;
}

/* =========================
   REEL LIKE
========================= */

  const {data:existing}=await db
    .from("reel_likes")

        reel_id:reelId,
        user_id:currentUser.id

    if(error){
      toast(error.message);

/* =========================
   REEL COMMENT
   IMPORTANT:
   COLUMN IS "text"
========================= */

async function commentReel(reelId){

  openModal(`
    <h3>💬 Reel Comments</h3>

    <div id="reelComments">
      Loading...
    </div>

    <div style="display:flex;gap:5px;margin-top:12px">

      <input
        id="reelCommentInput"
        placeholder="Write comment..."
        style="flex:1">

      <button
        class="primary"
        style="width:auto"
        onclick="addReelComment(${reelId})">
        Send
      </button>

    </div>
  `);

  const {data,error}=await db
    .from("reel_comments")
    .select("id,reel_id,user_id,text,created_at")
    .eq("reel_id",reelId)
    .order("created_at",{ascending:true});

  if(error){

    $("reelComments").innerHTML=
      esc(error.message);

    return;
  }

  let html="";

  for(const c of data || []){

    html+=`
      <div class="comment">
        ${esc(c.text)}
      </div>
    `;
  }

  $("reelComments").innerHTML=
    html || "No comments yet.";
}


async function addReelComment(reelId){

  const input=$("reelCommentInput");

  if(!input) return;

  const text=input.value.trim();

  if(!text){
    toast("Write a comment first");
    return;
  }

  const {error}=await db
    .from("reel_comments")
    .insert({
      reel_id:reelId,
      user_id:currentUser.id,
      text:text
    });

  if(error){

    toast(error.message);

    return;
  }

  input.value="";

  toast("Comment added");

  await commentReel(reelId);
}

/* =========================
   PROFILE

  const avatar=

  const cover=
    profile?.cover_photo || "";

  $("content").innerHTML=`

      ${
        cover

        : `<div class="profile-cover"
                style="background:#1877f2"></div>`

      <div class="profile-box">

        ${

          ? `<img class="profile-big"
                  src="${esc(avatar)}">`
          : `<div class="profile-big"
                  style="background:#ddd;display:inline-block">
             </div>`
        }

        <h2>${esc(name)}</h2>

        <p>${esc(currentUser.email)}</p>

      </div>

      <button
        class="primary"
        style="width:100%"
        onclick="editProfile()">
        Edit Profile
      </button>

    </div>
  `;
}

function editProfile(){

  openModal(`

    <h3>✏️ Edit Profile</h3>

    <input
      id="editName"
      value="${esc(profile?.name || "")}"
      placeholder="Name">

    <input
      id="editPhoto"
      placeholder="Profile photo URL"
      value="${esc(profile?.profile_photo || "")}">

    <input
      id="editCover"
      placeholder="Cover photo URL"
      value="${esc(profile?.cover_photo || "")}">

    <button
      class="primary"
      style="width:100%"
      onclick="saveProfile()">
      Save
    </button>

  `);
}

async function saveProfile(){

  const name=$("editName").value.trim();
  const photo=$("editPhoto").value.trim();
  const cover=$("editCover").value.trim();

  const {data,error}=await db
    .from("my social app")
    .upsert({
      id:currentUser.id,
      name:name,
      profile_photo:photo || null,
      cover_photo:cover || null
    })
    .select()
    .single();

  if(error){
    toast(error.message);
    return;
  }

  profile=data;

  closeModal();

  toast("Profile updated");

  showProfile();
}

/* =========================
   SEARCH
========================= */

function showSearch(){

  $("content").innerHTML=`

    <div class="card">

      <h2>🔍 Search</h2>

      <input
        id="searchInput"
        placeholder="Search people..."
        onkeydown="if(event.key==='Enter')searchUsers()">

      <button
        class="primary"
        style="width:100%"
        onclick="searchUsers()">
        Search
      </button>

    </div>

    <div id="searchResults"></div>
  `;
}

async function searchUsers(){

  const q=$("searchInput").value.trim();

  if(!q) return;

  const {data,error}=await db
    .from("my social app")
    .select("id,name,profile_photo")
    .ilike("name","%"+q+"%")
    .limit(30);

  if(error){
    $("searchResults").innerHTML=
      `<div class="card">${esc(error.message)}</div>`;
    return;
  }

  if(!data?.length){
    $("searchResults").innerHTML=
      `<div class="card">No users found.</div>`;
    return;
  }

  let html="";

  for(const u of data){

    html+=`
      <div class="card">

        <div class="post-head">

          ${
            u.profile_photo
            ? `<img class="avatar"
                    src="${esc(u.profile_photo)}">`
            : `<div class="avatar"></div>`
          }

          <div style="flex:1">
            <b>${esc(u.name || "User")}</b>
          </div>

          ${
            u.id!==currentUser.id
            ? `<button
                class="primary"
                onclick="followUser('${u.id}')">
                Follow
              </button>`
            : ""
          }

        </div>

      </div>
    `;
  }

  $("searchResults").innerHTML=html;
}

/* =========================
   FOLLOW
========================= */

async function followUser(userId){

  const {data:existing}=await db
    .from("follows")
    .select("id")
    .eq("follower_id",currentUser.id)
    .eq("following_id",userId)
    .maybeSingle();

  if(existing){

    await db
      .from("follows")
      .delete()
      .eq("id",existing.id);

    toast("Unfollowed");

  }else{

    const {error}=await db
      .from("follows")
      .insert({
        follower_id:currentUser.id,
        following_id:userId
      });

    if(error){
      toast(error.message);
      return;
    }

    toast("Following");
  }
}

/* =========================
   MONETIZATION
========================= */

async function showMonetization(){

  const {data}=await db
    .from("creator_settings")
    .select("*")
    .eq("user_id",currentUser.id)
    .maybeSingle();

  openModal(`

    <h3>💰 Monetization</h3>

    <p>
      Content Monetization
    </p>

    <label>
      <input
        type="checkbox"
        id="monetizationEnabled"
        ${data?.monetization_enabled ? "checked":""}>
      Enable Monetization
    </label>

    <input
      id="payoutEmail"
      placeholder="Payout email"
      value="${esc(data?.payout_email || "")}">

    <select id="payoutMethod">

      <option value="">
        Select payout method
      </option>

      <option value="bank"
        ${data?.payout_method==="bank"?"selected":""}>
        Bank
      </option>

      <option value="paypal"
        ${data?.payout_method==="paypal"?"selected":""}>
        PayPal
      </option>

    </select>

    <button
      class="primary"
      style="width:100%"
      onclick="saveMonetization()">
      Save
    </button>

  `);
}

async function saveMonetization(){

  const enabled=
    $("monetizationEnabled").checked;

  const email=
    $("payoutEmail").value.trim();

  const method=
    $("payoutMethod").value;

  const {error}=await db
    .from("creator_settings")
    .upsert({
      user_id:currentUser.id,
      monetization_enabled:enabled,
      payout_email:email || null,
      payout_method:method || null,
      updated_at:new Date().toISOString()
    });

  if(error){
    toast(error.message);
    return;
  }

  toast("Monetization settings saved");

  closeModal();
}

/* =========================
   START APP
========================= */

async function start(){

  if(localStorage.getItem("darkMode")==="true"){
    document.body.classList.add("dark");
  }

  const {
    data:{session}
  }=await db.auth.getSession();

  if(session){

    currentUser=session.user;

    await loadProfile();

    renderApp();

  }else{

    showLogin();
  }

  db.auth.onAuthStateChange(
    async(event,session)=>{

      if(session && !currentUser){

        currentUser=session.user;

        await loadProfile();

        renderApp();

      }

      if(!session){

        currentUser=null;

        profile=null;

        showLogin();
      }
    }
  );
}

start();

</script>
