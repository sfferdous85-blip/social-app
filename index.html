<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<meta name="description" content="My Social App">
<title>My Social App</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0b0b0f;--card:#15151b;--card2:#1b1b23;--text:#f5f5f7;--muted:#a5a5b0;
  --line:#292932;--accent:#ff2d75;--accent2:#7c4dff;--good:#27d17f;--danger:#ff4d67;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
body{min-height:100vh}
button,input,textarea,select{font:inherit}
button{border:0;color:inherit;cursor:pointer}
.hidden{display:none!important}
.app{min-height:100vh;max-width:760px;margin:auto;padding-bottom:78px}
.topbar{
  position:sticky;top:0;z-index:20;height:62px;padding:8px 14px;
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(11,11,15,.92);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)
}
.brand{font-size:22px;font-weight:800;letter-spacing:-.7px}
.brand span{background:linear-gradient(90deg,#ff2d75,#9b6cff);-webkit-background-clip:text;color:transparent}
.top-actions{display:flex;gap:7px}
.iconbtn{width:40px;height:40px;border-radius:50%;background:#191920;font-size:20px}
.page{padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px}
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}
.auth{width:min(440px,100%);padding:25px;border-radius:26px;background:linear-gradient(145deg,#171720,#101015);border:1px solid #30303b;box-shadow:0 20px 70px rgba(0,0,0,.45)}
.logo{font-size:34px;font-weight:900;margin-bottom:5px}
.subtitle{color:var(--muted);margin-bottom:24px}
.field{margin:10px 0}
.field label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px 4px}
.input,.textarea,.select{
  width:100%;padding:13px 14px;border-radius:13px;background:#0d0d12;border:1px solid #30303a;color:#fff;outline:none
}
.input:focus,.textarea:focus{border-color:#7557ff}
.primary{
  width:100%;padding:13px 16px;border-radius:13px;font-weight:800;
  background:linear-gradient(100deg,#ff2d75,#7c4dff);margin-top:8px
}
.secondary{padding:11px 15px;border-radius:12px;background:#24242d}
.linkbtn{background:none;color:#ff6b9b;margin-top:14px}
.status{padding:10px 12px;border-radius:12px;background:#191920;color:var(--muted);font-size:13px;margin:12px 0}
.status.ok{color:#72e9ac}.status.err{color:#ff8498}
.story-row{display:flex;gap:12px;overflow:auto;padding:4px 0 16px}
.story{min-width:66px;text-align:center;font-size:11px;color:var(--muted)}
.avatar,.story-img{width:58px;height:58px;border-radius:50%;object-fit:cover;display:block;margin:auto;border:2px solid #ff3f86;background:#20202a}
.story-add{display:grid;place-items:center;font-size:26px;background:#1d1d26}
.composer{padding:12px;margin-bottom:13px}
.composer-row{display:flex;align-items:center;gap:10px}
.composer-avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#24242c}
.composer-input{flex:1;background:#202029;color:#aaa;padding:11px 14px;border-radius:22px}
.post{overflow:hidden;margin-bottom:14px}
.post-head{display:flex;align-items:center;gap:10px;padding:12px}
.post-head img{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#222}
.post-user{font-weight:750}.post-time{font-size:11px;color:var(--muted)}
.post-menu{margin-left:auto;background:none;font-size:20px}
.post-text{padding:0 13px 12px;line-height:1.5;white-space:pre-wrap}
.post-media{width:100%;max-height:650px;object-fit:cover;display:block;background:#050507}
.post-actions{display:flex;align-items:center;gap:4px;padding:8px 10px;border-top:1px solid var(--line)}
.action{background:none;padding:8px 9px;border-radius:10px;color:#ddd}
.action.active{color:#ff3c7d}
.spacer{flex:1}
.meta{padding:0 13px 12px;color:var(--muted);font-size:13px}
.empty{padding:40px 15px;text-align:center;color:var(--muted)}
.bottom{
 position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);
 z-index:30;height:66px;display:flex;justify-content:space-around;align-items:center;
 background:rgba(12,12,17,.96);backdrop-filter:blur(18px);border-top:1px solid var(--line)
}
.nav{background:none;color:#9d9da8;font-size:22px;min-width:54px}
.nav small{display:block;font-size:9px;margin-top:2px}
.nav.active{color:#fff}
.reel{position:relative;height:calc(100vh - 130px);min-height:510px;background:#050507;border-radius:18px;overflow:hidden;margin-bottom:14px}
.reel video{width:100%;height:100%;object-fit:cover;background:#000}
.reel-grad{position:absolute;inset:auto 0 0;height:55%;background:linear-gradient(transparent,rgba(0,0,0,.9));pointer-events:none}
.reel-info{position:absolute;left:14px;right:75px;bottom:18px;z-index:2}
.reel-actions{position:absolute;right:10px;bottom:22px;z-index:3;display:flex;flex-direction:column;gap:9px}
.reel-action{width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,.5);font-size:21px}
.reel-action.liked{color:#ff397d}
.profile-head{padding:18px}
.profile-main{display:flex;gap:16px;align-items:center}
.profile-main .avatar{width:92px;height:92px;margin:0}
.profile-name{font-size:21px;font-weight:850}
.profile-bio{color:var(--muted);margin-top:4px}
.stats{display:flex;justify-content:space-around;text-align:center;margin:18px 0}
.stat b{font-size:18px}.stat span{display:block;color:var(--muted);font-size:11px}
.profile-actions{display:flex;gap:8px}.profile-actions button{flex:1}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.grid img,.grid video{width:100%;aspect-ratio:1;object-fit:cover;background:#15151a}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;display:grid;place-items:end center}
.sheet{width:min(760px,100%);max-height:92vh;overflow:auto;background:#15151b;border-radius:24px 24px 0 0;padding:18px;border:1px solid var(--line)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.close{background:#25252d;border-radius:50%;width:38px;height:38px}
.preview{width:100%;max-height:320px;object-fit:contain;border-radius:15px;background:#09090c;margin:8px 0}
.upload-zone{padding:24px;border:1px dashed #555564;border-radius:16px;text-align:center;color:var(--muted);margin:10px 0}
.progress{height:7px;border-radius:20px;background:#292932;overflow:hidden;margin:10px 0}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff2d75,#7c4dff)}
.notice{padding:11px 13px;border-radius:12px;background:#20202a;color:#bbb;font-size:13px;margin:10px 0}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:15px 4px;border-bottom:1px solid var(--line)}
.toggle{width:50px;height:28px;border-radius:20px;background:#363640;padding:3px}
.toggle i{display:block;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.toggle.on{background:#7c4dff}.toggle.on i{transform:translateX(22px)}
.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);z-index:100;background:#f4f4f5;color:#111;padding:11px 16px;border-radius:13px;font-weight:650;display:none;max-width:90%}
@media(min-width:760px){.app{border-left:1px solid #17171e;border-right:1px solid #17171e}.modal{align-items:center}.sheet{border-radius:24px}}
</style>
</head>
<body>

<div id="authScreen" class="auth-wrap">
  <div class="auth">
    <div class="logo"><span>My Social App</span></div>
    <div class="subtitle">তোমার নিজের social platform</div>

    <div id="authStatus" class="status">Supabase connection পরীক্ষা হচ্ছে...</div>

    <div id="loginForm">
      <div class="field"><label>Email</label><input id="loginEmail" class="input" type="email" autocomplete="email" placeholder="আপনার email"></div>
      <div class="field"><label>Password</label><input id="loginPassword" class="input" type="password" autocomplete="current-password" placeholder="Password"></div>
      <button id="loginBtn" class="primary">Login</button>
      <button id="showSignup" class="linkbtn">নতুন account তৈরি করুন</button>
      <button id="forgotBtn" class="linkbtn">Password ভুলে গেছেন?</button>
    </div>

    <div id="signupForm" class="hidden">
      <div class="field"><label>Name</label><input id="signupName" class="input" placeholder="আপনার নাম"></div>
      <div class="field"><label>Email</label><input id="signupEmail" class="input" type="email" autocomplete="email" placeholder="আপনার email"></div>
      <div class="field"><label>Password</label><input id="signupPassword" class="input" type="password" autocomplete="new-password" placeholder="কমপক্ষে ৬ অক্ষর"></div>
      <button id="signupBtn" class="primary">Create account</button>
      <button id="showLogin" class="linkbtn">আগের Login-এ ফিরুন</button>
    </div>
  </div>
</div>

<div id="app" class="app hidden">
  <header class="topbar">
    <div class="brand"><span>My Social</span></div>
    <div class="top-actions">
      <button class="iconbtn" onclick="openSearch()">⌕</button>
      <button class="iconbtn" onclick="showPage('notifications')">♡</button>
      <button class="iconbtn" onclick="showPage('settings')">☰</button>
    </div>
  </header>

  <main id="content" class="page"></main>

  <nav class="bottom">
    <button class="nav active" data-page="home" onclick="showPage('home')">⌂<small>Home</small></button>
    <button class="nav" data-page="reels" onclick="showPage('reels')">▶<small>Reels</small></button>
    <button class="nav" onclick="openUpload()">＋<small>Create</small></button>
    <button class="nav" data-page="search" onclick="openSearch()">⌕<small>Search</small></button>
    <button class="nav" data-page="profile" onclick="showPage('profile')">◉<small>Profile</small></button>
  </nav>
</div>

<div id="modal" class="modal hidden">
  <div class="sheet" id="sheet"></div>
</div>
<div id="toast" class="toast"></div>

<script>
const SUPABASE_URL = "https://skereuaizdczbvjplisi.supabase.co";
const SUPABASE_KEY = "sb_publishable_3R2otJA1zIlsMsTYxe1ocw_NAPY5O9x";

if(!window.supabase){
  document.body.innerHTML='<div style="padding:30px;color:white;background:#111;font-family:system-ui">Supabase library load হয়নি। Internet connection check করুন।</div>';
  throw new Error('Supabase JS failed to load');
}

const {createClient} = window.supabase;
const sb = createClient(SUPABASE_URL,SUPABASE_KEY,{
  auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}
});

let user=null, profile=null, currentPage='home', postsCache=[], reelsCache=[];

const $=id=>document.getElementById(id);
function toast(msg){
  const t=$('toast');t.textContent=msg;t.style.display='block';
  clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.style.display='none',2600);
}
function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function timeAgo(d){
  const s=Math.max(1,Math.floor((Date.now()-new Date(d).getTime())/1000));
  if(s<60)return s+'s'; if(s<3600)return Math.floor(s/60)+'m';
  if(s<86400)return Math.floor(s/3600)+'h'; return Math.floor(s/86400)+'d';
}
function avatar(url,name='U'){
  return url || `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=20202a&color=fff`;
}
function setAuthStatus(msg,ok=false,err=false){
  const x=$('authStatus');x.textContent=msg;x.className='status'+(ok?' ok':'')+(err?' err':'');
}

async function testConnection(){
  try{
    const {error}=await sb.from('profiles').select('id').limit(1);
    if(error){
      setAuthStatus('Supabase connected, কিন্তু profiles query: '+error.message,false,true);
    }else{
      setAuthStatus('Supabase connection প্রস্তুত ✓',true,false);
    }
  }catch(e){
    setAuthStatus('Supabase connection ব্যর্থ: '+e.message,false,true);
  }
}

$('showSignup').onclick=()=>{
  $('loginForm').classList.add('hidden');
  $('signupForm').classList.remove('hidden');
};
$('showLogin').onclick=()=>{
  $('signupForm').classList.add('hidden');
  $('loginForm').classList.remove('hidden');
};

$('loginBtn').onclick=async()=>{
  const email=$('loginEmail').value.trim();
  const password=$('loginPassword').value;
  if(!email||!password)return toast('Email এবং password দিন');

  $('loginBtn').disabled=true;
  $('loginBtn').textContent='Login হচ্ছে...';

  const {data,error}=await sb.auth.signInWithPassword({email,password});

  $('loginBtn').disabled=false;
  $('loginBtn').textContent='Login';

  if(error){
    setAuthStatus(error.message,false,true);
    return toast(error.message);
  }
  await startApp(data.user);
};

$('signupBtn').onclick=async()=>{
  const name=$('signupName').value.trim();
  const email=$('signupEmail').value.trim();
  const password=$('signupPassword').value;
  if(!name||!email||password.length<6)return toast('Name, valid email এবং ৬+ অক্ষরের password দিন');

  $('signupBtn').disabled=true;
  $('signupBtn').textContent='Account তৈরি হচ্ছে...';

  const {data,error}=await sb.auth.signUp({
    email,password,
    options:{data:{name}}
  });

  $('signupBtn').disabled=false;
  $('signupBtn').textContent='Create account';

  if(error)return toast(error.message);
  if(data.session) await startApp(data.user);
  else toast('Account তৈরি হয়েছে। Email confirmation চালু থাকলে email verify করে Login করুন।');
};

$('forgotBtn').onclick=async()=>{
  const email=$('loginEmail').value.trim();
  if(!email)return toast('আগে email লিখুন');
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
  if(error)return toast(error.message);
  toast('Password reset email পাঠানো হয়েছে');
};

sb.auth.onAuthStateChange(async(event,session)=>{
  if(session?.user && !$('app').classList.contains('hidden')) return;
  if(session?.user) await startApp(session.user);
});

async function startApp(u){
  user=u;
  $('authScreen').classList.add('hidden');
  $('app').classList.remove('hidden');
  await ensureProfile();
  await showPage('home');
}

async function ensureProfile(){
  let {data,error}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();

  if(!data && !error){
    const name=user.user_metadata?.name || user.email?.split('@')[0] || 'User';
    const ins=await sb.from('profiles').insert({id:user.id,name,bio:''}).select().single();
    if(!ins.error)data=ins.data;
  }

  profile=data||{
    id:user.id,
    name:user.user_metadata?.name || user.email?.split('@')[0] || 'User',
    bio:''
  };
}

function navActive(page){
  document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===page));
}

async function showPage(page){
  currentPage=page;
  navActive(page);
  const c=$('content');
  c.innerHTML='<div class="empty">লোড হচ্ছে...</div>';

  try{
    if(page==='home')return renderHome();
    if(page==='reels')return renderReels();
    if(page==='profile')return renderProfile();
    if(page==='settings')return renderSettings();
    if(page==='notifications')return renderNotifications();
    if(page==='search')return renderSearch();
  }catch(e){
    c.innerHTML=`<div class="empty">লোড করতে সমস্যা: ${esc(e.message)}</div>`;
  }
}

async function renderHome(){
  const {data,error}=await sb.from('posts')
    .select('id,user_id,text,image_url,created_at,privacy,feeling,location,view_count')
    .order('created_at',{ascending:false})
    .limit(40);

  if(error){
    $('content').innerHTML=`<div class="notice">Posts load হয়নি।<br>${esc(error.message)}</div>`;
    return;
  }

  postsCache=data||[];

  $('content').innerHTML=`
    <div class="story-row">
      <div class="story" onclick="openUpload()">
        <div class="story-img story-add">＋</div>
        <div>আপনার story</div>
      </div>
    </div>

    <div class="composer card" onclick="openUpload()">
      <div class="composer-row">
        <img class="composer-avatar" src="${avatar(profile?.profile_photo,profile?.name)}">
        <div class="composer-input">What's on your mind?</div>
      </div>
    </div>

    <div style="margin-bottom:12px">
      <button class="secondary" onclick="openReelUpload()">＋ Create Reel</button>
    </div>

    <div id="feed">
      ${postsCache.length?postsCache.map(postHTML).join(''):'<div class="empty">এখনও কোনো post নেই। প্রথম post দিন!</div>'}
    </div>`;
}

function postHTML(p){
  const media=p.image_url
    ? `<img class="post-media" src="${esc(p.image_url)}" loading="lazy" onclick="viewMedia('${esc(p.image_url)}')">`
    : '';

  return `<article class="post card" id="post-${p.id}">
    <div class="post-head">
      <img src="${avatar(profile?.profile_photo,profile?.name)}">
      <div>
        <div class="post-user">${esc(p.user_id===user.id?(profile?.name||'You'):'User')}</div>
        <div class="post-time">${timeAgo(p.created_at)}${p.location?' · '+esc(p.location):''}</div>
      </div>
      <button class="post-menu" onclick="deletePost('${p.id}')">⋯</button>
    </div>

    ${p.text?`<div class="post-text">${esc(p.text)}</div>`:''}
    ${media}

    <div class="post-actions">
      <button class="action" onclick="reactPost('${p.id}',this)">♡ Like</button>
      <button class="action" onclick="openComments('${p.id}')">💬 Comment</button>
      <button class="action" onclick="sharePost('${p.id}')">↗ Share</button>
      <span class="spacer"></span>
      <button class="action" onclick="toast('Saved')">🔖</button>
    </div>

    <div class="meta">${p.feeling?esc(p.feeling)+' · ':''}${p.view_count||0} views</div>
  </article>`;
}

async function reactPost(id,btn){
  const {error}=await sb.from('post_reactions').insert({
    post_id:id,
    user_id:user.id,
    reaction:'like'
  });

  if(error && !String(error.message).toLowerCase().includes('duplicate')){
    return toast(error.message);
  }

  btn.classList.add('active');
  btn.textContent='♥ Liked';
}

async function deletePost(id){
  const p=postsCache.find(x=>String(x.id)===String(id));
  if(!p||p.user_id!==user.id)return toast('নিজের post হলে delete করতে পারবেন');
  if(!confirm('এই post delete করবেন?'))return;

  const {error}=await sb.from('posts').delete().eq('id',id).eq('user_id',user.id);
  if(error)return toast(error.message);

  toast('Post deleted');
  renderHome();
}

function sharePost(id){
  const url=location.href+'#post-'+id;
  if(navigator.share){
    navigator.share({title:'My Social App',url}).catch(()=>{});
  }else{
    navigator.clipboard?.writeText(url).then(()=>toast('Link copied'));
  }
}

function viewMedia(url){
  openSheet(`<img class="preview" src="${esc(url)}"><button class="primary" onclick="closeModal()">Close</button>`);
}

async function renderReels(){
  const {data,error}=await sb.from('reels')
    .select('*')
    .order('created_at',{ascending:false})
    .limit(25);

  reelsCache=data||[];

  if(error){
    $('content').innerHTML=`<div class="notice">Reels load হয়নি: ${esc(error.message)}</div>`;
    return;
  }

  $('content').innerHTML=reelsCache.length
    ? reelsCache.map(reelHTML).join('')
    : `<div class="empty">কোনো Reel নেই।<br><br><button class="secondary" onclick="openReelUpload()">＋ প্রথম Reel upload করুন</button></div>`;

  document.querySelectorAll('.reel video').forEach(v=>{
    v.addEventListener('click',()=>{
      if(v.paused)v.play().catch(()=>{});
      else v.pause();
    });

    const io=new IntersectionObserver(es=>es.forEach(e=>{
      if(e.isIntersecting)v.play().catch(()=>{});
      else v.pause();
    }),{threshold:.65});

    io.observe(v);
  });
}

function reelHTML(r){
  return `<section class="reel">
    <video src="${esc(r.video_url)}" playsinline loop preload="metadata"></video>
    <div class="reel-grad"></div>

    <div class="reel-info">
      <b>@${esc(r.user_id===user.id?(profile?.name||'you'):'creator')}</b>
      <div>${esc(r.caption||'')}</div>
      <small>${r.views||0} views · ${timeAgo(r.created_at)}</small>
    </div>

    <div class="reel-actions">
      <button class="reel-action" onclick="likeReel('${r.id}',this)">♡</button>
      <button class="reel-action" onclick="openReelComments('${r.id}')">💬</button>
      <button class="reel-action" onclick="shareReel('${r.id}')">↗</button>
      <button class="reel-action" onclick="toggleMute(this)">🔊</button>
    </div>
  </section>`;
}

function toggleMute(btn){
  const v=btn.closest('.reel').querySelector('video');
  v.muted=!v.muted;
  btn.textContent=v.muted?'🔇':'🔊';
}

async function likeReel(id,btn){
  const {error}=await sb.from('reel_reactions').insert({
    reel_id:id,
    user_id:user.id,
    reaction:'like'
  });

  if(error && !String(error.message).toLowerCase().includes('duplicate')){
    return toast(error.message);
  }

  btn.classList.add('liked');
  btn.textContent='♥';
}

function shareReel(id){
  const u=location.href+'#reel-'+id;
  navigator.clipboard?.writeText(u);
  toast('Reel link copied');
}

async function renderProfile(){
  const {data:p}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();
  profile=p||profile;

  const {data:ps}=await sb.from('posts')
    .select('id,image_url,text,created_at')
    .eq('user_id',user.id)
    .order('created_at',{ascending:false})
    .limit(60);

  $('content').innerHTML=`
    <section class="card profile-head">
      <div class="profile-main">
        <img class="avatar" src="${avatar(profile?.profile_photo,profile?.name)}">
        <div>
          <div class="profile-name">${esc(profile?.name||'User')}</div>
          <div class="profile-bio">${esc(profile?.bio||'No bio yet')}</div>
        </div>
      </div>

      <div class="stats">
        <div class="stat"><b>${ps?.length||0}</b><span>Posts</span></div>
        <div class="stat"><b>0</b><span>Followers</span></div>
        <div class="stat"><b>0</b><span>Following</span></div>
      </div>

      <div class="profile-actions">
        <button class="secondary" onclick="editProfile()">Edit profile</button>
        <button class="secondary" onclick="openUpload()">＋ Post</button>
      </div>
    </section>

    <div style="height:12px"></div>

    <div class="grid">
      ${(ps||[]).map(x=>
        x.image_url
          ? `<img src="${esc(x.image_url)}" loading="lazy" onclick="viewMedia('${esc(x.image_url)}')">`
          : `<div style="aspect-ratio:1;background:#17171e;padding:10px;overflow:hidden">${esc(x.text||'')}</div>`
      ).join('')}
    </div>`;
}

async function editProfile(){
  openSheet(`
    <div class="sheet-head">
      <h2>Edit profile</h2>
      <button class="close" onclick="closeModal()">×</button>
    </div>

    <div class="field">
      <label>Name</label>
      <input id="epName" class="input" value="${esc(profile?.name||'')}">
    </div>

    <div class="field">
      <label>Bio</label>
      <textarea id="epBio" class="textarea" rows="4">${esc(profile?.bio||'')}</textarea>
    </div>

    <div class="field">
      <label>Profile photo URL</label>
      <input id="epAvatar" class="input" value="${esc(profile?.profile_photo||'')}" placeholder="https://...">
    </div>

    <button class="primary" onclick="saveProfile()">Save changes</button>
  `);
}

async function saveProfile(){
  const values={
    name:$('epName').value.trim(),
    bio:$('epBio').value.trim(),
    profile_photo:$('epAvatar').value.trim()
  };

  const {data,error}=await sb.from('profiles')
    .update(values)
    .eq('id',user.id)
    .select()
    .single();

  if(error)return toast(error.message);

  profile=data;
  closeModal();
  toast('Profile updated');
  renderProfile();
}

async function renderSettings(){
  $('content').innerHTML=`
    <h2>Settings</h2>

    <div class="card" style="padding:8px 14px">
      <div class="settings-row">
        <div>
          <b>Account</b>
          <div style="color:#999;font-size:12px">${esc(user.email||'')}</div>
        </div>
        <button class="secondary" onclick="editProfile()">Edit</button>
      </div>

      <div class="settings-row">
        <div>
          <b>Dark mode</b>
          <div style="color:#999;font-size:12px">বর্তমানে dark</div>
        </div>
        <div class="toggle on"><i></i></div>
      </div>

      <div class="settings-row">
        <div><b>Blocked users</b></div>
        <button class="secondary" onclick="toast('Blocked users section')">Open</button>
      </div>

      <div class="settings-row">
        <div><b>Security</b></div>
        <button class="secondary" onclick="toast('Session secure')">Check</button>
      </div>

      <div class="settings-row">
        <div><b>Sign out</b></div>
        <button class="secondary" onclick="logout()">Logout</button>
      </div>
    </div>

    <div class="notice">Supabase connected project: ${esc(SUPABASE_URL)}</div>`;
}

async function logout(){
  await sb.auth.signOut();
  location.reload();
}

async function renderNotifications(){
  const {data,error}=await sb.from('notifications')
    .select('*')
    .eq('receiver_id',user.id)
    .order('created_at',{ascending:false})
    .limit(30);

  $('content').innerHTML=
    `<h2>Notifications</h2>`+
    (
      error
        ? `<div class="notice">${esc(error.message)}</div>`
        : (
          data?.length
            ? data.map(n=>`
              <div class="card" style="padding:14px;margin:8px 0">
                ${esc(n.text||'New notification')}
                <div style="color:#888;font-size:11px">${timeAgo(n.created_at)}</div>
              </div>
            `).join('')
            : '<div class="empty">কোনো notification নেই</div>'
        )
    );
}

function renderSearch(){
  $('content').innerHTML=`
    <div class="field">
      <input id="searchInput" class="input" placeholder="Search people..." autofocus oninput="doSearch(this.value)">
    </div>
    <div id="searchResults"></div>`;
}

let searchTimer;

async function doSearch(q){
  clearTimeout(searchTimer);
  q=q.trim();

  if(!q){
    $('searchResults').innerHTML='';
    return;
  }

  searchTimer=setTimeout(async()=>{
    const {data,error}=await sb.from('profiles')
      .select('id,name,bio,profile_photo')
      .ilike('name','%'+q+'%')
      .limit(20);

    $('searchResults').innerHTML=
      error
        ? `<div class="notice">${esc(error.message)}</div>`
        : (
          data?.length
            ? data.map(p=>`
              <div class="card" style="padding:12px;margin:8px 0;display:flex;align-items:center;gap:10px">
                <img class="avatar" style="margin:0;width:46px;height:46px" src="${avatar(p.profile_photo,p.name)}">
                <div>
                  <b>${esc(p.name)}</b>
                  <div style="color:#999">${esc(p.bio||'')}</div>
                </div>
              </div>
            `).join('')
            : '<div class="empty">কিছু পাওয়া যায়নি</div>'
        );
  },300);
}

function openSearch(){
  showPage('search');
}

function openUpload(){
  openSheet(`
    <div class="sheet-head">
      <h2>Create post</h2>
      <button class="close" onclick="closeModal()">×</button>
    </div>

    <textarea id="upText" class="textarea" rows="5" placeholder="What's on your mind?"></textarea>

    <div class="upload-zone">
      <input id="upFile" type="file" accept="image/*" onchange="previewUpload(this)">
      <div>ছবি নির্বাচন করুন</div>
    </div>

    <div id="upPreview"></div>

    <div class="progress"><i id="upProg"></i></div>

    <button class="primary" onclick="publishPost()">Publish</button>
  `);
}

function previewUpload(inp){
  const f=inp.files[0];
  const p=$('upPreview');

  if(!f){
    p.innerHTML='';
    return;
  }

  const u=URL.createObjectURL(f);
  p.innerHTML=`<img class="preview" src="${u}">`;
}

async function publishPost(){
  const text=$('upText').value.trim();
  const file=$('upFile').files[0];

  if(!text&&!file)return toast('Text অথবা image দিন');

  $('upProg').style.width='15%';

  let image_url=null;

  if(file){
    const ext=(file.name.split('.').pop()||'jpg').toLowerCase();
    const path=`${user.id}/${Date.now()}.${ext}`;

    const {error}=await sb.storage.from('post-images').upload(path,file,{
      upsert:false,
      contentType:file.type
    });

    if(error)return toast('Upload failed: '+error.message);

    image_url=sb.storage.from('post-images').getPublicUrl(path).data.publicUrl;
  }

  $('upProg').style.width='70%';

  const {error}=await sb.from('posts').insert({
    user_id:user.id,
    text:text||null,
    image_url,
    privacy:'public'
  });

  $('upProg').style.width='100%';

  if(error)return toast(error.message);

  closeModal();
  toast('Post published ✓');
  showPage('home');
}

function openReelUpload(){
  openSheet(`
    <div class="sheet-head">
      <h2>Create Reel</h2>
      <button class="close" onclick="closeModal()">×</button>
    </div>

    <div class="upload-zone">
      <input id="reelFile" type="file" accept="video/*" onchange="previewReel(this)">
      <div>Vertical video নির্বাচন করুন</div>
    </div>

    <div id="reelPreview"></div>

    <input id="reelCaption" class="input" placeholder="Caption" style="margin:8px 0">
    <input id="reelAudio" class="input" placeholder="Audio name (optional)" style="margin:8px 0">

    <div class="progress"><i id="reelProg"></i></div>

    <button class="primary" onclick="publishReel()">Publish Reel</button>
  `);
}

function previewReel(inp){
  const f=inp.files[0];
  if(f){
    $('reelPreview').innerHTML=`<video class="preview" controls playsinline src="${URL.createObjectURL(f)}"></video>`;
  }
}

async function publishReel(){
  const f=$('reelFile').files[0];

  if(!f)return toast('Video নির্বাচন করুন');

  const ext=(f.name.split('.').pop()||'mp4').toLowerCase();
  const path=`${user.id}/reels/${Date.now()}.${ext}`;

  $('reelProg').style.width='15%';

  const {error}=await sb.storage.from('post-images').upload(path,f,{
    upsert:false,
    contentType:f.type
  });

  if(error)return toast('Video upload failed: '+error.message);

  $('reelProg').style.width='70%';

  const url=sb.storage.from('post-images').getPublicUrl(path).data.publicUrl;

  const {error:e}=await sb.from('reels').insert({
    user_id:user.id,
    video_url:url,
    caption:$('reelCaption').value.trim(),
    audio_name:$('reelAudio').value.trim()||null
  });

  $('reelProg').style.width='100%';

  if(e)return toast(e.message);

  closeModal();
  toast('Reel published ✓');
  showPage('reels');
}

function openSheet(html){
  $('sheet').innerHTML=html;
  $('modal').classList.remove('hidden');
}

function closeModal(){
  $('modal').classList.add('hidden');
  $('sheet').innerHTML='';
}

$('modal').addEventListener('click',e=>{
  if(e.target.id==='modal')closeModal();
});

async function openComments(id){
  const {data,error}=await sb.from('comments')
    .select('id,text,created_at,user_id')
    .eq('post_id',id)
    .order('created_at',{ascending:true})
    .limit(100);

  openSheet(`
    <div class="sheet-head">
      <h2>Comments</h2>
      <button class="close" onclick="closeModal()">×</button>
    </div>

    <div id="commentsList">
      ${
        error
          ? `<div class="notice">${esc(error.message)}</div>`
          : (
            data?.length
              ? data.map(c=>`
                <div style="padding:10px 0;border-bottom:1px solid #292932">
                  <b>${c.user_id===user.id?'You':'User'}</b> ${esc(c.text)}
                  <div style="font-size:10px;color:#888">${timeAgo(c.created_at)}</div>
                </div>
              `).join('')
              : '<div class="empty">No comments yet</div>'
          )
      }
    </div>

    <div style="display:flex;gap:7px;margin-top:12px">
      <input id="commentText" class="input" placeholder="Write a comment...">
      <button class="secondary" onclick="sendComment('${id}')">Send</button>
    </div>
  `);
}

async function sendComment(id){
  const text=$('commentText').value.trim();
  if(!text)return;

  const {error}=await sb.from('comments').insert({
    post_id:id,
    user_id:user.id,
    text
  });

  if(error)return toast(error.message);

  openComments(id);
}

async function openReelComments(id){
  const {data,error}=await sb.from('reel_comments')
    .select('*')
    .eq('reel_id',id)
    .order('created_at',{ascending:true})
    .limit(100);

  openSheet(`
    <div class="sheet-head">
      <h2>Reel Comments</h2>
      <button class="close" onclick="closeModal()">×</button>
    </div>

    <div>
      ${
        error
          ? `<div class="notice">${esc(error.message)}</div>`
          : (
            data?.length
              ? data.map(c=>`
                <div style="padding:10px 0;border-bottom:1px solid #292932">
                  <b>${c.user_id===user.id?'You':'User'}</b> ${esc(c.text)}
                </div>
              `).join('')
              : '<div class="empty">No comments</div>'
          )
      }
    </div>

    <div style="display:flex;gap:7px;margin-top:12px">
      <input id="rcText" class="input" placeholder="Write a comment">
      <button class="secondary" onclick="sendReelComment('${id}')">Send</button>
    </div>
  `);
}

async function sendReelComment(id){
  const text=$('rcText').value.trim();
  if(!text)return;

  const {error}=await sb.from('reel_comments').insert({
    reel_id:id,
    user_id:user.id,
    text
  });

  if(error)return toast(error.message);

  openReelComments(id);
}

testConnection();

(async()=>{
  const {data}=await sb.auth.getSession();
  if(data.session){
    startApp(data.session.user);
  }
})();
</script>
