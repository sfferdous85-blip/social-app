<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Social App</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f0f2f5;
  color:#222;
}
button,input,textarea{font-family:inherit}
button{cursor:pointer}

.topbar{
  position:sticky;
  top:0;
  z-index:100;
  height:60px;
  background:#1877f2;
  color:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  box-shadow:0 2px 8px #0002;
}
.logo{
  font-size:22px;
  font-weight:bold;
}
.top-actions{
  display:flex;
  gap:7px;
}
.icon-btn{
  border:0;
  background:#ffffff22;
  color:white;
  border-radius:50%;
  width:40px;
  height:40px;
  font-size:19px;
}

.container{
  max-width:650px;
  margin:auto;
  padding:12px;
}

.card{
  background:white;
  border-radius:12px;
  margin-bottom:12px;
  padding:14px;
  box-shadow:0 1px 4px #0001;
}

.auth{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.auth-box{
  width:100%;
  max-width:400px;
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 5px 25px #0002;
}
.auth-box h1{
  text-align:center;
  color:#1877f2;
}
input,textarea{
  width:100%;
  border:1px solid #ddd;
  border-radius:9px;
  padding:12px;
  margin:6px 0;
  outline:none;
}
textarea{resize:none}

.primary{
  width:100%;
  border:0;
  background:#1877f2;
  color:white;
  padding:12px;
  border-radius:9px;
  font-size:16px;
  font-weight:bold;
}
.secondary{
  border:0;
  background:#e4e6eb;
  padding:10px 14px;
  border-radius:8px;
}
.danger{
  border:0;
  background:#e53935;
  color:white;
  padding:9px 12px;
  border-radius:8px;
}

.nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:100;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  padding:7px 2px;
}
.nav button{
  border:0;
  background:none;
  font-size:12px;
  color:#555;
}
.nav span{
  display:block;
  font-size:22px;
}
.badge{
  background:red;
  color:white;
  border-radius:20px;
  padding:2px 6px;
  font-size:10px;
}

.post-head{
  display:flex;
  align-items:center;
  gap:10px;
}
.avatar{
  width:45px;
  height:45px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd;
}
.name{
  font-weight:bold;
}
.time{
  font-size:12px;
  color:#777;
}
.post-text{
  margin:12px 0;
  white-space:pre-wrap;
}
.post-image{
  width:100%;
  max-height:600px;
  object-fit:cover;
  border-radius:10px;
}
.post-video{
  width:100%;
  max-height:600px;
  border-radius:10px;
  background:#000;
}
.post-actions{
  display:flex;
  justify-content:space-around;
  border-top:1px solid #eee;
  border-bottom:1px solid #eee;
  margin-top:10px;
}
.post-actions button{
  flex:1;
  border:0;
  background:none;
  padding:10px 4px;
  color:#555;
}
.post-actions button:hover{
  background:#f0f2f5;
}

.profile-cover{
  height:220px;
  background:#ddd center/cover no-repeat;
  border-radius:12px 12px 0 0;
}
.profile-main{
  text-align:center;
  margin-top:-55px;
}
.profile-main .avatar{
  width:110px;
  height:110px;
  border:4px solid white;
}
.profile-name{
  font-size:24px;
  font-weight:bold;
  margin:8px 0 3px;
}
.bio{
  color:#666;
  margin:5px;
}
.stats{
  display:flex;
  justify-content:center;
  gap:30px;
  margin:15px 0;
}
.stat{
  text-align:center;
}
.stat b{
  display:block;
  font-size:19px;
}

.reel-card video{
  width:100%;
  max-height:650px;
  border-radius:12px;
  background:#000;
}

.comment{
  background:#f0f2f5;
  padding:8px 10px;
  border-radius:10px;
  margin:6px 0;
}
.comment b{margin-right:5px}

.user-row{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 0;
  border-bottom:1px solid #eee;
}
.user-info{
  flex:1;
}

.hidden{display:none!important}

.modal{
  position:fixed;
  inset:0;
  background:#0008;
  z-index:200;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
}
.modal-box{
  background:white;
  width:100%;
  max-width:500px;
  max-height:90vh;
  overflow:auto;
  border-radius:15px;
  padding:18px;
}

.preview{
  width:100%;
  max-height:350px;
  object-fit:contain;
  border-radius:10px;
  margin-top:8px;
}

.empty{
  text-align:center;
  padding:30px;
  color:#777;
}

.search-box{
  display:flex;
  gap:7px;
}
.search-box input{margin:0}

@media(max-width:500px){
  .container{padding:8px}
  .profile-cover{height:180px}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="auth">
  <div class="auth-box">
    <h1>My Social App</h1>
    <input id="loginEmail" type="email" placeholder="Email">
    <input id="loginPassword" type="password" placeholder="Password">
    <button class="primary" onclick="login()">Login</button>
    <p style="text-align:center">অ্যাকাউন্ট নেই?</p>
    <button class="secondary" style="width:100%" onclick="showRegister()">Create New Account</button>
  </div>
</div>

<!-- REGISTER -->
<div id="registerPage" class="auth hidden">
  <div class="auth-box">
    <h1>Create Account</h1>
    <input id="regName" placeholder="আপনার নাম">
    <input id="regEmail" type="email" placeholder="Email">
    <input id="regPassword" type="password" placeholder="Password">
    <button class="primary" onclick="register()">Create Account</button>
    <p style="text-align:center">
      <button class="secondary" onclick="showLogin()">Already have an account?</button>
    </p>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">

<header class="topbar">
  <div class="logo">My Social</div>
  <div class="top-actions">
    <button class="icon-btn" onclick="showSearch()">🔍</button>
    <button class="icon-btn" onclick="toggleNotifications()">🔔</button>
    <button class="icon-btn" onclick="showProfile()">👤</button>
  </div>
</header>

<main class="container">

<!-- HOME -->
<section id="homePage">
  <div class="card">
    <textarea id="postText" rows="3" placeholder="What's on your mind?"></textarea>

    <input id="postPhoto" type="file" accept="image/*" onchange="previewPostPhoto()">

    <img id="postPreview" class="preview hidden">

    <button class="primary" style="margin-top:8px" onclick="createPost()">
      📝 Post
    </button>
  </div>

  <div id="feed"></div>
</section>

<!-- REELS -->
<section id="reelsPage" class="hidden">

  <div class="card">
    <h2>🎬 Create Reel</h2>

    <textarea id="reelText" rows="2" placeholder="Reel সম্পর্কে কিছু লিখুন..."></textarea>

    <input id="reelVideo" type="file" accept="video/*" onchange="previewReel()">

    <video id="reelPreview" class="preview hidden" controls></video>

    <button class="primary" style="margin-top:8px" onclick="createReel()">
      ⬆️ Upload Reel
    </button>
  </div>

  <div id="reels"></div>
</section>

<!-- PROFILE -->
<section id="profilePage" class="hidden">

  <div class="card" style="padding:0;overflow:hidden">

    <div id="myCover" class="profile-cover"></div>

    <div class="profile-main">

      <img id="myProfilePhoto" class="avatar">

      <div id="myName" class="profile-name"></div>
      <div id="myBio" class="bio"></div>

      <div class="stats">
        <div class="stat">
          <b id="myFollowers">0</b>
          Followers
        </div>

        <div class="stat">
          <b id="myFollowing">0</b>
          Following
        </div>

        <div class="stat">
          <b id="myPosts">0</b>
          Posts
        </div>
      </div>

      <button class="primary" style="width:auto;margin-bottom:15px"
              onclick="openEditProfile()">
        ✏️ Edit Profile
      </button>

    </div>
  </div>

  <div id="myContent"></div>

</section>

<!-- OTHER USER PROFILE -->
<section id="userProfilePage" class="hidden">
  <div id="otherProfile"></div>
  <div id="otherContent"></div>
</section>

<!-- SEARCH -->
<section id="searchPage" class="hidden">

  <div class="card">
    <div class="search-box">
      <input id="searchInput" placeholder="Search users...">
      <button class="primary" style="width:auto" onclick="searchUsers()">Search</button>
    </div>
  </div>

  <div class="card">
    <div id="searchResults"></div>
  </div>

</section>

<!-- LIST -->
<section id="listPage" class="hidden">
  <div class="card">
    <button class="secondary" onclick="goBack()">← Back</button>
    <h2 id="listTitle"></h2>
    <div id="listUsers"></div>
  </div>
</section>

</main>

<!-- NAVIGATION -->
<nav class="nav">
  <button onclick="showHome()">
    <span>🏠</span>Home
  </button>

  <button onclick="showReels()">
    <span>🎬</span>Reels
  </button>

  <button onclick="showSearch()">
    <span>🔍</span>Search
  </button>

  <button onclick="showProfile()">
    <span>👤</span>Profile
  </button>

  <button onclick="toggleNotifications()">
    <span>🔔</span>
    <small id="notifyBadge" class="badge hidden">0</small>
    Notifications
  </button>
</nav>

</div>

<!-- EDIT PROFILE MODAL -->
<div id="editModal" class="modal hidden">

  <div class="modal-box">

    <h2>Edit Profile</h2>

    <input id="editName" placeholder="Name">

    <textarea id="editBio" rows="3" placeholder="Bio"></textarea>

    <label>Profile Photo</label>
    <input type="file" id="editProfilePhoto" accept="image/*">

    <label>Cover Photo</label>
    <input type="file" id="editCoverPhoto" accept="image/*">

    <br><br>

    <button class="primary" onclick="saveProfile()">Save Changes</button>

    <button class="secondary" style="width:100%;margin-top:8px"
            onclick="closeEditProfile()">
      Cancel
    </button>

  </div>
</div>

<script>

let users = JSON.parse(localStorage.getItem("users") || "[]");
let posts = JSON.parse(localStorage.getItem("posts") || "[]");
let reels = JSON.parse(localStorage.getItem("reels") || "[]");
let notifications = JSON.parse(localStorage.getItem("notifications") || "[]");

let currentUserId = localStorage.getItem("currentUserId");
let previousPage = "homePage";

function saveAll(){
  localStorage.setItem("users",JSON.stringify(users));
  localStorage.setItem("posts",JSON.stringify(posts));
  localStorage.setItem("reels",JSON.stringify(reels));
  localStorage.setItem("notifications",JSON.stringify(notifications));
}

function escapeHTML(str){
  return String(str || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function currentUser(){
  return users.find(u=>u.id===currentUserId);
}

/* AUTH */

function showRegister(){
  document.getElementById("loginPage").classList.add("hidden");
  document.getElementById("registerPage").classList.remove("hidden");
}

function showLogin(){
  document.getElementById("registerPage").classList.add("hidden");
  document.getElementById("loginPage").classList.remove("hidden");
}

function register(){

  let name=document.getElementById("regName").value.trim();
  let email=document.getElementById("regEmail").value.trim();
  let password=document.getElementById("regPassword").value;

  if(!name || !email || !password){
    alert("সব তথ্য পূরণ করুন");
    return;
  }

  if(users.some(u=>u.email===email)){
    alert("এই Email দিয়ে আগে অ্যাকাউন্ট আছে");
    return;
  }

  let user={
    id:Date.now().toString(),
    name,
    email,
    password,
    bio:"",
    profilePhoto:"",
    coverPhoto:"",
    followers:[],
    following:[]
  };

  users.push(user);
  saveAll();

  alert("Account তৈরি হয়েছে");
  showLogin();
}

function login(){

  let email=document.getElementById("loginEmail").value.trim();
  let password=document.getElementById("loginPassword").value;

  let user=users.find(u=>u.email===email && u.password===password);

  if(!user){
    alert("Email অথবা Password ভুল");
    return;
  }

  currentUserId=user.id;
  localStorage.setItem("currentUserId",currentUserId);

  openApp();
}

function logout(){

  currentUserId=null;
  localStorage.removeItem("currentUserId");

  document.getElementById("app").classList.add("hidden");
  document.getElementById("loginPage").classList.remove("hidden");
}

/* PAGES */

function hideAllPages(){

  ["homePage","reelsPage","profilePage",
   "userProfilePage","searchPage","listPage"]
  .forEach(id=>{
    document.getElementById(id).classList.add("hidden");
  });
}

function showHome(){
  hideAllPages();
  document.getElementById("homePage").classList.remove("hidden");
  loadFeed();
  previousPage="homePage";
}

function showReels(){
  hideAllPages();
  document.getElementById("reelsPage").classList.remove("hidden");
  loadReels();
  previousPage="reelsPage";
}

function showProfile(){
  hideAllPages();
  document.getElementById("profilePage").classList.remove("hidden");
  loadProfile();
  previousPage="profilePage";
}

function showSearch(){
  hideAllPages();
  document.getElementById("searchPage").classList.remove("hidden");
  previousPage="searchPage";
}

function goBack(){
  showHome();
}

/* PROFILE */

function loadProfile(){

  let user=currentUser();

  if(!user)return;

  document.getElementById("myName").textContent=user.name;

  document.getElementById("myBio").textContent=
    user.bio || "No bio yet";

  document.getElementById("myFollowers").textContent=
    user.followers.length;

  document.getElementById("myFollowing").textContent=
    user.following.length;

  document.getElementById("myPosts").textContent=
    posts.filter(p=>p.userId===user.id).length;

  document.getElementById("myProfilePhoto").src=
    user.profilePhoto ||
    "data:image/svg+xml;charset=UTF-8,"+
    encodeURIComponent(
      `<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">
       <rect width="100%" height="100%" fill="#ddd"/>
       <text x="50%" y="55%" text-anchor="middle"
       font-size="80">👤</text></svg>`
    );

  document.getElementById("myCover").style.backgroundImage=
    user.coverPhoto ? `url(${user.coverPhoto})` : "none";

  loadMyContent();
}

function openEditProfile(){

  let u=currentUser();

  document.getElementById("editName").value=u.name;
  document.getElementById("editBio").value=u.bio || "";

  document.getElementById("editModal").classList.remove("hidden");
}

function closeEditProfile(){
  document.getElementById("editModal").classList.add("hidden");
}

function readFile(file){
  return new Promise((resolve,reject)=>{

    if(!file){
      resolve("");
      return;
    }

    let reader=new FileReader();

    reader.onload=e=>resolve(e.target.result);
    reader.onerror=reject;

    reader.readAsDataURL(file);
  });
}

async function saveProfile(){

  let u=currentUser();

  u.name=document.getElementById("editName").value.trim();
  u.bio=document.getElementById("editBio").value.trim();

  let profileFile=
    document.getElementById("editProfilePhoto").files[0];

  let coverFile=
    document.getElementById("editCoverPhoto").files[0];

  if(profileFile)
    u.profilePhoto=await readFile(profileFile);

  if(coverFile)
    u.coverPhoto=await readFile(coverFile);

  saveAll();

  closeEditProfile();
  loadProfile();

  alert("Profile আপডেট হয়েছে");
}

/* POST PHOTO */

function previewPostPhoto(){

  let file=document.getElementById("postPhoto").files[0];
  let img=document.getElementById("postPreview");

  if(!file){
    img.classList.add("hidden");
    return;
  }

  img.src=URL.createObjectURL(file);
  img.classList.remove("hidden");
}

async function createPost(){

  let text=document.getElementById("postText").value.trim();
  let file=document.getElementById("postPhoto").files[0];

  if(!text && !file){
    alert("কিছু লিখুন অথবা ছবি দিন");
    return;
  }

  let image="";

  if(file){
    image=await readFile(file);
  }

  let u=currentUser();

  posts.unshift({
    id:Date.now().toString(),
    userId:u.id,
    name:u.name,
    text,
    image,
    likes:0,
    likedBy:[],
    comments:[],
    shares:0
  });

  saveAll();

  document.getElementById("postText").value="";
  document.getElementById("postPhoto").value="";
  document.getElementById("postPreview").classList.add("hidden");

  loadFeed();
}

function loadFeed(){

  let box=document.getElementById("feed");

  if(posts.length===0){
    box.innerHTML=
      `<div class="card empty">এখনো কোনো পোস্ট নেই। প্রথম পোস্টটি করুন।</div>`;
    return;
  }

  box.innerHTML=posts.map(renderPost).join("");
}

function renderPost(p){

  let u=users.find(x=>x.id===p.userId);
  let avatar=u?.profilePhoto || "";

  let liked=p.likedBy.includes(currentUserId);

  let comments=(p.comments || []).map(c=>`
    <div class="comment">
      <b>${escapeHTML(c.name)}</b>
      ${escapeHTML(c.text)}
    </div>
  `).join("");

  return `
  <div class="card">

    <div class="post-head">

      <img class="avatar"
           src="${avatar || 'https://via.placeholder.com/100'}">

      <div class="user-info">
        <div class="name">${escapeHTML(p.name)}</div>
        <div class="time">My Social App</div>
      </div>

      ${
        p.userId===currentUserId
        ? `<button class="secondary"
             onclick="deletePost('${p.id}')">🗑️</button>`
        : ""
      }

    </div>

    <div class="post-text">${escapeHTML(p.text)}</div>

    ${
      p.image
      ? `<img class="post-image" src="${p.image}">`
      : ""
    }

    <div class="post-actions">

      <button onclick="likePost('${p.id}')">
        ${liked ? "❤️" : "👍"} ${p.likes}
      </button>

      <button onclick="toggleComment('${p.id}')">
        💬 ${p.comments.length}
      </button>

      <button onclick="sharePost('${p.id}')">
        ↗️ ${p.shares}
      </button>

    </div>

    <div id="comment-${p.id}" class="hidden">

      <input id="commentInput-${p.id}"
             placeholder="Write a comment...">

      <button class="primary"
              onclick="addComment('${p.id}')">
        Comment
      </button>

      ${comments}

    </div>

  </div>
  `;
}

function likePost(id){

  let p=posts.find(x=>x.id===id);
  if(!p)return;

  if(!p.likedBy)p.likedBy=[];

  if(p.likedBy.includes(currentUserId)){
    p.likedBy=p.likedBy.filter(x=>x!==currentUserId);
    p.likes--;
  }else{
    p.likedBy.push(currentUserId);
    p.likes++;

    if(p.userId!==currentUserId){
      addNotification(
        p.userId,
        currentUser().name+" আপনার পোস্টে Like দিয়েছেন ❤️"
      );
    }
  }

  saveAll();
  loadFeed();
}

function toggleComment(id){
  document.getElementById("comment-"+id)
    .classList.toggle("hidden");
}

function addComment(id){

  let input=document.getElementById("commentInput-"+id);
  let text=input.value.trim();

  if(!text)return;

  let p=posts.find(x=>x.id===id);

  p.comments.push({
    name:currentUser().name,
    userId:currentUserId,
    text
  });

  if(p.userId!==currentUserId){
    addNotification(
      p.userId,
      currentUser().name+" আপনার পোস্টে Comment করেছেন 💬"
    );
  }

  saveAll();
  loadFeed();
}

async function sharePost(id){

  let p=posts.find(x=>x.id===id);

  p.shares++;

  if(navigator.share){
    try{
      await navigator.share({
        title:"My Social App",
        text:p.text || "Check this post"
      });
    }catch(e){}
  }else{
    alert("Post share করা হয়েছে");
  }

  saveAll();
  loadFeed();
}

function deletePost(id){

  if(!confirm("এই পোস্টটি Delete করবেন?"))return;

  posts=posts.filter(p=>p.id!==id);

  saveAll();
  loadFeed();
}

/* REELS */

function previewReel(){

  let file=document.getElementById("reelVideo").files[0];
  let video=document.getElementById("reelPreview");

  if(!file){
    video.classList.add("hidden");
    return;
  }

  video.src=URL.createObjectURL(file);
  video.classList.remove("hidden");
}

async function createReel(){

  let file=document.getElementById("reelVideo").files[0];
  let text=document.getElementById("reelText").value.trim();

  if(!file){
    alert("একটি ভিডিও নির্বাচন করুন");
    return;
  }

  if(file.size>15*1024*1024){
    alert("পরীক্ষার জন্য 15MB-এর ছোট ভিডিও ব্যবহার করুন");
    return;
  }

  let video=await readFile(file);
  let u=currentUser();

  reels.unshift({
    id:Date.now().toString(),
    userId:u.id,
    name:u.name,
    text,
    video,
    likes:0,
    likedBy:[],
    comments:[],
    shares:0
  });

  try{
    saveAll();
  }catch(e){
    alert("ভিডিওটি অনেক বড়। ছোট ভিডিও দিয়ে চেষ্টা করুন।");
    return;
  }

  document.getElementById("reelVideo").value="";
  document.getElementById("reelText").value="";
  document.getElementById("reelPreview").classList.add("hidden");

  loadReels();

  alert("Reel Upload হয়েছে 🎉");
}

function loadReels(){

  let box=document.getElementById("reels");

  if(reels.length===0){
    box.innerHTML=
      `<div class="card empty">এখনো কোনো Reel নেই।</div>`;
    return;
  }

  box.innerHTML=reels.map(renderReel).join("");
}

function renderReel(r){

  let liked=r.likedBy.includes(currentUserId);

  let comments=(r.comments || []).map(c=>`
    <div class="comment">
      <b>${escapeHTML(c.name)}</b>
      ${escapeHTML(c.text)}
    </div>
  `).join("");

  return `
  <div class="card reel-card">

    <div class="post-head">
      <div class="avatar"
           style="display:flex;align-items:center;justify-content:center">
        🎬
      </div>

      <div class="user-info">
        <div class="name">${escapeHTML(r.name)}</div>
        <div class="time">Reel</div>
      </div>

      ${
        r.userId===currentUserId
        ? `<button class="danger"
             onclick="deleteReel('${r.id}')">
             Delete
           </button>`
        : ""
      }
    </div>

    <div class="post-text">${escapeHTML(r.text)}</div>

    <video controls playsinline class="post-video">
      <source src="${r.video}">
    </video>

    <div class="post-actions">

      <button onclick="likeReel('${r.id}')">
        ${liked?"❤️":"👍"} ${r.likes}
      </button>

      <button onclick="addReelComment('${r.id}')">
        💬 ${r.comments.length}
      </button>

      <button onclick="shareReel('${r.id}')">
        ↗️ ${r.shares}
      </button>

    </div>

    <div id="reelComments-${r.id}">
      ${comments}
    </div>

  </div>
  `;
}

function likeReel(id){

  let r=reels.find(x=>x.id===id);

  if(r.likedBy.includes(currentUserId)){
    r.likedBy=r.likedBy.filter(x=>x!==currentUserId);
    r.likes--;
  }else{
    r.likedBy.push(currentUserId);
    r.likes++;

    if(r.userId!==currentUserId){
      addNotification(
        r.userId,
        currentUser().name+" আপনার Reel Like করেছেন ❤️"
      );
    }
  }

  saveAll();
  loadReels();
}

function addReelComment(id){

  let text=prompt("Comment লিখুন");

  if(!text)return;

  let r=reels.find(x=>x.id===id);

  r.comments.push({
    name:currentUser().name,
    userId:currentUserId,
    text
  });

  saveAll();
  loadReels();
}

async function shareReel(id){

  let r=reels.find(x=>x.id===id);

  r.shares++;

  if(navigator.share){
    try{
      await navigator.share({
        title:"My Social App Reel",
        text:r.text || "Check this Reel"
      });
    }catch(e){}
  }else{
    alert("Reel share করা হয়েছে");
  }

  saveAll();
  loadReels();
}

function deleteReel(id){

  if(!confirm("এই Reel Delete করবেন?"))return;

  reels=reels.filter(r=>r.id!==id);

  saveAll();
  loadReels();
}

/* SEARCH */

function searchUsers(){

  let q=document.getElementById("searchInput")
    .value.trim().toLowerCase();

  let result=users.filter(u=>
    u.name.toLowerCase().includes(q)
  );

  let box=document.getElementById("searchResults");

  if(result.length===0){
    box.innerHTML=`<div class="empty">কোনো User পাওয়া যায়নি</div>`;
    return;
  }

  box.innerHTML=result.map(renderUser).join("");
}

function renderUser(u){

  return `
  <div class="user-row">

    <img class="avatar"
         src="${u.profilePhoto || 'https://via.placeholder.com/100'}">

    <div class="user-info">
      <b>${escapeHTML(u.name)}</b>
      <div>${u.followers.length} Followers</div>
    </div>

    <button class="secondary"
            onclick="openUserProfile('${u.id}')">
      View
    </button>

  </div>
  `;
}

/* OTHER PROFILE */

function openUserProfile(id){

  if(id===currentUserId){
    showProfile();
    return;
  }

  hideAllPages();

  document.getElementById("userProfilePage")
    .classList.remove("hidden");

  loadOtherProfile(id);

  previousPage="userProfilePage";
}

function loadOtherProfile(id){

  let u=users.find(x=>x.id===id);

  if(!u)return;

  let me=currentUser();

  let following=me.following.includes(id);

  document.getElementById("otherProfile").innerHTML=`

  <div class="card" style="padding:0;overflow:hidden">

    <div class="profile-cover"
         style="background-image:url('${u.coverPhoto || ""}')"></div>

    <div class="profile-main">

      <img class="avatar"
           src="${u.profilePhoto || 'https://via.placeholder.com/100'}">

      <div class="profile-name">${escapeHTML(u.name)}</div>

      <div class="bio">${escapeHTML(u.bio || "No bio yet")}</div>

      <div class="stats">

        <div class="stat">
          <b>${u.followers.length}</b>
          Followers
        </div>

        <div class="stat">
          <b>${u.following.length}</b>
          Following
        </div>

      </div>

      <button class="primary"
              style="width:auto;margin-bottom:15px"
              onclick="toggleFollowFromProfile('${u.id}')">

        ${following ? "Following ✓" : "Follow +"}

      </button>

    </div>
  </div>
  `;

  loadOtherContent(id);
}

function toggleFollowFromProfile(id){

  toggleFollow(id);
  loadOtherProfile(id);
}

function toggleFollow(id){

  let me=currentUser();
  let target=users.find(u=>u.id===id);

  if(!target)return;

  if(me.following.includes(id)){

    me.following=
      me.following.filter(x=>x!==id);

    target.followers=
      target.followers.filter(x=>x!==me.id);

  }else{

    me.following.push(id);
    target.followers.push(me.id);

    addNotification(
      target.id,
      me.name+" আপনাকে Follow করেছেন 👤"
    );
  }

  saveAll();
}

function loadOtherContent(id){

  let box=document.getElementById("otherContent");

  let userPosts=
    posts.filter(p=>p.userId===id);

  let userReels=
    reels.filter(r=>r.userId===id);

  box.innerHTML=
    userPosts.map(renderPost).join("")+
    userReels.map(renderReel).join("");

  if(!box.innerHTML){
    box.innerHTML=
      `<div class="card empty">এখনো কোনো পোস্ট নেই।</div>`;
  }
}

/* FOLLOWERS / FOLLOWING */

function showFollowers(){

  let u=currentUser();

  document.getElementById("listTitle").textContent="Followers";

  document.getElementById("listUsers").innerHTML=
    u.followers.map(id=>{
      let user=users.find(x=>x.id===id);
      return user ? renderUser(user) : "";
    }).join("") ||
    `<div class="empty">কোনো Followers নেই</div>`;

  hideAllPages();
  document.getElementById("listPage").classList.remove("hidden");
}

function showFollowing(){

  let u=currentUser();

  document.getElementById("listTitle").textContent="Following";

  document.getElementById("listUsers").innerHTML=
    u.following.map(id=>{
      let user=users.find(x=>x.id===id);
      return user ? renderUser(user) : "";
    }).join("") ||
    `<div class="empty">কাউকে Follow করছেন না</div>`;

  hideAllPages();
  document.getElementById("listPage").classList.remove("hidden");
}

/* NOTIFICATIONS */

function addNotification(receiverId,text){

  notifications.unshift({
    id:Date.now().toString()+Math.random(),
    receiverId,
    text,
    read:false,
    time:new Date().toLocaleString()
  });

  saveAll();
  updateNotificationBadge();
}

function toggleNotifications(){

  let my=notifications.filter(
    n=>n.receiverId===currentUserId
  );

  let text=my.map(n=>n.text).join("\n");

  if(!text)
    text="কোনো Notification নেই";

  alert(text);

  my.forEach(n=>n.read=true);

  saveAll();
  updateNotificationBadge();
}

function updateNotificationBadge(){

  let count=notifications.filter(
    n=>n.receiverId===currentUserId && !n.read
  ).length;

  let badge=document.getElementById("notifyBadge");

  if(count){
    badge.textContent=count;
    badge.classList.remove("hidden");
  }else{
    badge.classList.add("hidden");
  }
}

/* MIGRATION */

function migrate(){

  users.forEach(u=>{

    if(!u.followers)u.followers=[];
    if(!u.following)u.following=[];
    if(!u.bio)u.bio="";
    if(!u.profilePhoto)u.profilePhoto="";
    if(!u.coverPhoto)u.coverPhoto="";

  });

  posts.forEach(p=>{

    if(!p.likedBy)p.likedBy=[];
    if(!p.comments)p.comments=[];
    if(!p.likes)p.likes=0;
    if(!p.shares)p.shares=0;

  });

  reels.forEach(r=>{

    if(!r.likedBy)r.likedBy=[];
    if(!r.comments)r.comments=[];
    if(!r.likes)r.likes=0;
    if(!r.shares)r.shares=0;

  });

  saveAll();
}

/* OPEN APP */

function openApp(){

  document.getElementById("loginPage").classList.add("hidden");
  document.getElementById("registerPage").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");

  migrate();
  showHome();
  updateNotificationBadge();
}

/* START */

window.onload=function(){

  migrate();

  if(currentUserId && currentUser()){
    openApp();
  }else{
    showLogin();
  }

};

</script>
