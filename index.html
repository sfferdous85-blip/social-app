<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1877f2">
<meta name="description" content="FriendBook Premium Social Network">
<link rel="manifest" href="./manifest.json">
<title>FriendBook Premium</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
 --primary:#1877f2;
 --primary2:#6c5ce7;
 --bg:#f0f2f5;
 --card:#fff;
 --text:#172033;
 --muted:#697386;
 --border:#e4e8ef;
 --danger:#ef4444;
 --success:#10b981;
 --shadow:0 8px 30px rgba(20,30,55,.09);
 --radius:18px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
font-family:Arial,Helvetica,sans-serif}
button,input,textarea,select{font:inherit}
button{border:0;cursor:pointer}
img,video{max-width:100%}
.hidden{display:none!important}
.app{min-height:100vh}
.topbar{
 position:sticky;top:0;z-index:50;height:64px;
 background:rgba(255,255,255,.92);backdrop-filter:blur(18px);
 border-bottom:1px solid var(--border);display:flex;align-items:center;
 padding:0 14px;gap:10px
}
.logo{
 font-size:25px;font-weight:900;
 background:linear-gradient(135deg,var(--primary),var(--primary2));
 -webkit-background-clip:text;color:transparent
}
.searchBox{flex:1;max-width:480px;position:relative}
.searchBox input{
 width:100%;border:1px solid var(--border);border-radius:30px;
 padding:11px 16px 11px 42px;background:#f4f6f9;outline:none
}
.searchIcon{position:absolute;left:15px;top:10px}
.topActions{margin-left:auto;display:flex;gap:7px}
.iconBtn{
 width:42px;height:42px;border-radius:50%;background:#eef2f7;
 display:flex;align-items:center;justify-content:center;font-size:19px
}
.main{max-width:1200px;margin:auto;padding:16px 12px 90px}
.layout{display:grid;grid-template-columns:250px minmax(0,650px) 260px;gap:16px}
.card{
 background:var(--card);border:1px solid var(--border);
 border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden
}
.sidebar{position:sticky;top:80px;height:max-content}
.menuItem{
 display:flex;align-items:center;gap:12px;padding:12px;border-radius:13px;
 margin-bottom:4px;font-weight:700;background:transparent;width:100%;
 text-align:left;color:var(--text)
}
.menuItem:hover{background:#edf3ff}
.menuIcon{font-size:22px;width:28px;text-align:center}
.feed{min-width:0}
.composer{padding:14px;margin-bottom:14px}
.userRow{display:flex;align-items:center;gap:10px}
.avatar{
 width:44px;height:44px;border-radius:50%;object-fit:cover;
 background:linear-gradient(135deg,#dbeafe,#ddd6fe);display:block
}
.avatar.sm{width:36px;height:36px}
.avatar.lg{width:82px;height:82px;border:4px solid #fff}
.composerInput{
 flex:1;background:#f2f4f7;border-radius:25px;padding:12px 16px;
 color:var(--muted);cursor:pointer
}
.quickActions{display:grid;grid-template-columns:repeat(4,1fr);margin-top:12px;
 border-top:1px solid var(--border);padding-top:10px}
.quickBtn{background:none;padding:9px;border-radius:10px;color:var(--muted);font-weight:700}
.quickBtn:hover{background:#f3f5f8}
.storyRow{
 display:flex;gap:10px;overflow-x:auto;padding:4px 2px 14px;
 scrollbar-width:none
}
.storyRow::-webkit-scrollbar{display:none}
.story{
 min-width:105px;height:165px;border-radius:16px;overflow:hidden;
 position:relative;background:#111;cursor:pointer
}
.story img{width:100%;height:100%;object-fit:cover;opacity:.88}
.story:after{
 content:"";position:absolute;inset:0;
 background:linear-gradient(transparent 45%,rgba(0,0,0,.8))
}
.storyName{position:absolute;bottom:9px;left:8px;right:5px;color:#fff;
 z-index:2;font-weight:700;font-size:13px}
.storyAvatar{
 position:absolute;z-index:3;top:8px;left:8px;width:35px;height:35px;
 border:3px solid var(--primary);border-radius:50%;object-fit:cover
}
.addStory{
 min-width:105px;height:165px;border-radius:16px;background:
 linear-gradient(135deg,#1877f2,#6c5ce7);color:#fff;display:flex;
 align-items:center;justify-content:center;flex-direction:column;font-weight:800
}
.addStory span{font-size:34px}
.post{margin-bottom:14px}
.postHeader{display:flex;gap:10px;padding:14px}
.postInfo{flex:1}
.postName{font-weight:800}
.postTime{font-size:12px;color:var(--muted);margin-top:3px}
.moreBtn{background:none;font-size:20px;color:var(--muted)}
.postText{padding:0 14px 12px;white-space:pre-wrap;word-break:break-word}
.postText .tag{color:var(--primary);font-weight:700}
.postImage{display:block;width:100%;max-height:620px;object-fit:cover}
.postStats{display:flex;justify-content:space-between;padding:9px 14px;
 color:var(--muted);font-size:13px}
.postActions{display:grid;grid-template-columns:repeat(4,1fr);
 border-top:1px solid var(--border);margin:0 10px}
.postAction{padding:11px 5px;background:none;font-weight:700;color:var(--muted)}
.postAction.active{color:var(--primary)}
.postAction:hover{background:#f4f6f8}
.badge{
 background:#ef4444;color:#fff;font-size:10px;border-radius:20px;
 padding:2px 6px;margin-left:auto
}
.rightTitle{font-weight:900;padding:14px 14px 8px}
.contact{display:flex;align-items:center;gap:9px;padding:9px 14px}
.onlineDot{width:10px;height:10px;background:#16a34a;border-radius:50%;
 margin-left:auto}
.bottomNav{
 position:fixed;z-index:100;left:0;right:0;bottom:0;height:68px;
 background:rgba(255,255,255,.96);backdrop-filter:blur(18px);
 border-top:1px solid var(--border);display:none;
 grid-template-columns:repeat(5,1fr)
}
.bottomNav button{background:none;color:var(--muted);font-size:11px;font-weight:700}
.bottomNav button b{display:block;font-size:22px;line-height:27px}
.bottomNav button.active{color:var(--primary)}
.auth{
 min-height:100vh;display:flex;align-items:center;justify-content:center;
 padding:20px;background:
 radial-gradient(circle at 10% 10%,#dbeafe,transparent 35%),
 radial-gradient(circle at 90% 90%,#ede9fe,transparent 35%),var(--bg)
}
.authCard{width:100%;max-width:430px;padding:26px}
.authLogo{text-align:center;font-size:40px;font-weight:900;
 background:linear-gradient(135deg,#1877f2,#7c3aed);
 -webkit-background-clip:text;color:transparent;margin-bottom:8px}
.authSub{text-align:center;color:var(--muted);margin-bottom:22px}
.input{
 width:100%;padding:13px 14px;border:1px solid var(--border);
 border-radius:12px;outline:none;margin-bottom:10px;background:var(--card)
}
.primary{
 width:100%;padding:13px;border-radius:12px;background:var(--primary);
 color:#fff;font-weight:800;margin-top:4px
}
.secondary{
 padding:11px 15px;border-radius:11px;background:#eef2f7;color:var(--text);
 font-weight:700
}
.linkBtn{background:none;color:var(--primary);font-weight:700}
.modal{
 position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;
 display:none;align-items:center;justify-content:center;padding:15px
}
.modal.show{display:flex}
.modalBox{
 width:100%;max-width:620px;max-height:92vh;overflow:auto;
 background:var(--card);border-radius:22px;padding:18px;
 box-shadow:0 20px 70px rgba(0,0,0,.3)
}
.modalHead{display:flex;align-items:center;justify-content:space-between;
 margin-bottom:14px}
.modalTitle{font-size:20px;font-weight:900}
.close{background:#eef2f7;border-radius:50%;width:36px;height:36px}
textarea.input{min-height:130px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.featureGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.feature{
 padding:17px;border-radius:17px;background:linear-gradient(135deg,#f8fafc,#eef3ff);
 border:1px solid var(--border);cursor:pointer
}
.featureIcon{font-size:30px}
.featureTitle{font-weight:900;margin-top:7px}
.featureText{font-size:12px;color:var(--muted);margin-top:3px}
.section{margin-bottom:16px}
.sectionTitle{font-size:19px;font-weight:900;margin:5px 0 12px}
.profileCover{
 height:210px;background:linear-gradient(135deg,#1877f2,#7c3aed);
 background-size:cover;background-position:center;position:relative
}
.profileInfo{padding:0 18px 18px;position:relative}
.profileAvatar{margin-top:-48px}
.profileName{font-size:23px;font-weight:900;margin-top:8px}
.profileBio{color:var(--muted);margin:5px 0 12px}
.stats{display:flex;gap:25px;color:var(--muted)}
.stats b{color:var(--text)}
.profileActions{display:flex;gap:8px;margin-top:13px}
.profileActions button{flex:1}
.tabs{display:flex;overflow:auto;border-bottom:1px solid var(--border)}
.tab{padding:13px 16px;background:none;font-weight:800;color:var(--muted)}
.tab.active{color:var(--primary);border-bottom:3px solid var(--primary)}
.reelsWrap{position:fixed;inset:0;z-index:150;background:#000;display:none}
.reelsWrap.show{display:block}
.reelTop{position:absolute;top:0;left:0;right:0;z-index:5;padding:16px;color:#fff;
display:flex;justify-content:space-between;background:linear-gradient(#0008,transparent)}
.reelsFeed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory}
.reelItem{height:100dvh;position:relative;scroll-snap-align:start;background:#000;
display:flex;align-items:center;justify-content:center}
.reelVideo{width:100%;height:100%;object-fit:cover}
.reelOverlay{position:absolute;inset:auto 0 0;padding:20px;color:#fff;
background:linear-gradient(transparent,rgba(0,0,0,.8))}
.reelActions{position:absolute;right:12px;bottom:110px;display:flex;
flex-direction:column;gap:13px}
.reelAction{width:48px;height:48px;border-radius:50%;background:#0008;color:#fff;
display:flex;align-items:center;justify-content:center;font-size:20px}
.commentItem{display:flex;gap:9px;padding:10px 0;border-bottom:1px solid var(--border)}
.commentBody{background:#f1f3f6;border-radius:13px;padding:8px 11px;flex:1}
.commentName{font-weight:800;font-size:13px}
.commentText{margin-top:3px}
.chatList{display:flex;flex-direction:column;gap:2px}
.chatItem{display:flex;align-items:center;gap:10px;padding:11px;border-radius:13px;
cursor:pointer}
.chatItem:hover{background:#f3f5f8}
.chatWindow{height:420px;display:flex;flex-direction:column}
.messages{flex:1;overflow:auto;padding:10px}
.bubble{max-width:78%;padding:10px 13px;border-radius:17px;margin:5px 0;
background:#eef1f5;word-break:break-word}
.bubble.mine{margin-left:auto;background:var(--primary);color:#fff}
.chatInput{display:flex;gap:8px;padding-top:10px;border-top:1px solid var(--border)}
.chatInput input{flex:1}
.notify{display:flex;gap:10px;padding:12px;border-bottom:1px solid var(--border)}
.notify.unread{background:#eef5ff}
.searchResults{max-height:400px;overflow:auto}
.result{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid var(--border)}
.tableCard{overflow:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px;border-bottom:1px solid var(--border);white-space:nowrap}
.empty{text-align:center;padding:35px;color:var(--muted)}
.loader{padding:30px;text-align:center;color:var(--muted)}
.toast{
 position:fixed;z-index:999;left:50%;bottom:82px;transform:translateX(-50%);
 background:#111;color:#fff;padding:11px 17px;border-radius:30px;
 box-shadow:0 10px 30px #0004;display:none
}
.toast.show{display:block;animation:toast .2s ease}
@keyframes toast{from{transform:translate(-50%,10px);opacity:0}
to{transform:translate(-50%,0);opacity:1}}
.skeleton{height:130px;background:linear-gradient(90deg,#eee,#f8f8f8,#eee);
animation:sk 1.3s infinite;background-size:200% 100%}
@keyframes sk{to{background-position:-200% 0}}
.dark{
 --bg:#0b0f16;--card:#121923;--text:#f3f6fb;--muted:#9aa6b7;
 --border:#263142;--shadow:0 8px 30px rgba(0,0,0,.25)
}
.dark .topbar,.dark .bottomNav{background:rgba(18,25,35,.94)}
.dark .searchBox input,.dark .composerInput,.dark .secondary,
.dark .iconBtn,.dark .feature,.dark .close,.dark .commentBody{background:#1b2431}
.dark .quickBtn:hover,.dark .postAction:hover,.dark .menuItem:hover,
.dark .chatItem:hover{background:#1b2431}
.amoled{--bg:#000;--card:#050505;--border:#181818}
@media(max-width:1000px){
 .layout{grid-template-columns:190px minmax(0,1fr)}
 .rightSide{display:none}
}
@media(max-width:700px){
 .topbar{height:58px}
 .logo{font-size:22px}
 .searchBox{display:none}
 .main{padding:10px 7px 78px}
 .layout{display:block}
 .sidebar{display:none}
 .bottomNav{display:grid}
 .card{border-radius:15px}
 .quickActions{grid-template-columns:repeat(4,1fr)}
 .quickBtn{font-size:11px;padding:8px 2px}
 .profileCover{height:170px}
 .featureGrid{grid-template-columns:1fr 1fr}
}
</style>
</head>

<body>

<div id="toast" class="toast"></div>

<!-- AUTH -->
<section id="authScreen" class="auth">
 <div class="card authCard">
  <div class="authLogo">FriendBook</div>
  <div class="authSub">Connect • Share • Discover</div>

  <div id="loginBox">
   <input id="loginEmail" class="input" type="email" placeholder="Email">
   <input id="loginPassword" class="input" type="password" placeholder="Password">
   <button class="primary" onclick="login()">Login</button>
   <div style="text-align:center;margin-top:15px">
    <button class="linkBtn" onclick="showRegister()">Create new account</button>
   </div>
  </div>

  <div id="registerBox" class="hidden">
   <input id="regName" class="input" placeholder="Full name">
   <input id="regEmail" class="input" type="email" placeholder="Email">
   <input id="regPassword" class="input" type="password" placeholder="Password">
   <button class="primary" onclick="register()">Create account</button>
   <div style="text-align:center;margin-top:15px">
    <button class="linkBtn" onclick="showLogin()">Already have an account?</button>
   </div>
  </div>
 </div>
</section>

<!-- APP -->
<div id="app" class="app hidden">

<header class="topbar">
 <div class="logo">FriendBook</div>
 <div class="searchBox">
  <span class="searchIcon">🔎</span>
  <input id="searchInput" placeholder="Search FriendBook..." oninput="searchUsers(this.value)">
 </div>
 <div class="topActions">
  <button class="iconBtn" onclick="openMessages()">💬</button>
  <button class="iconBtn" onclick="openNotifications()">🔔<span id="notifyBadge"></span></button>
  <button class="iconBtn" onclick="openSettings()">⚙️</button>
 </div>
</header>

<main class="main">
 <div class="layout">

  <!-- LEFT -->
  <aside class="sidebar">
   <div class="card" style="padding:9px">
    <button class="menuItem" onclick="goHome()">🏠 <span>Home</span></button>
    <button class="menuItem" onclick="openProfile()">👤 <span>Profile</span></button>
    <button class="menuItem" onclick="openFriends()">👥 <span>Friends</span></button>
    <button class="menuItem" onclick="openMessages()">💬 <span>Messenger</span></button>
    <button class="menuItem" onclick="openNotifications()">🔔 <span>Notifications</span></button>
    <button class="menuItem" onclick="openPages()">📄 <span>Pages</span></button>
    <button class="menuItem" onclick="openGroups()">👨‍👩‍👧 <span>Groups</span></button>
    <button class="menuItem" onclick="openMarketplace()">🛒 <span>Marketplace</span></button>
    <button class="menuItem" onclick="openEvents()">📅 <span>Events</span></button>
    <button class="menuItem" onclick="openCreator()">💰 <span>Creator Studio</span></button>
    <button class="menuItem" onclick="openSettings()">⚙️ <span>Settings</span></button>
    <button class="menuItem" onclick="logout()">🚪 <span>Logout</span></button>
   </div>
  </aside>

  <!-- FEED -->
  <section id="content" class="feed">
   <div id="homeView">

    <div class="section">
     <div class="storyRow" id="stories"></div>
    </div>

    <div class="card composer">
     <div class="userRow">
      <img id="composerAvatar" class="avatar" src="">
      <div class="composerInput" onclick="openCreatePost()">What's on your mind?</div>
     </div>
     <div class="quickActions">
      <button class="quickBtn" onclick="openCreatePost()">📝 Post</button>
      <button class="quickBtn" onclick="openCreateStory()">📸 Story</button>
      <button class="quickBtn" onclick="openCreateReel()">🎬 Reel</button>
      <button class="quickBtn" onclick="openLive()">🔴 Live</button>
     </div>
    </div>

    <div id="feed"></div>
   </div>
  </section>

  <!-- RIGHT -->
  <aside class="rightSide">
   <div class="card section">
    <div class="rightTitle">FriendBook Features</div>
    <div class="featureGrid" style="padding:0 10px 10px">
     <div class="feature" onclick="openMarketplace()">
      <div class="featureIcon">🛒</div><div class="featureTitle">Marketplace</div>
      <div class="featureText">Buy & sell</div>
     </div>
     <div class="feature" onclick="openGroups()">
      <div class="featureIcon">👥</div><div class="featureTitle">Groups</div>
      <div class="featureText">Community</div>
     </div>
     <div class="feature" onclick="openEvents()">
      <div class="featureIcon">📅</div><div class="featureTitle">Events</div>
      <div class="featureText">Join events</div>
     </div>
     <div class="feature" onclick="openCreator()">
      <div class="featureIcon">💰</div><div class="featureTitle">Creator</div>
      <div class="featureText">Monetization</div>
     </div>
    </div>
   </div>

   <div class="card">
    <div class="rightTitle">Online Friends</div>
    <div id="onlineFriends"></div>
   </div>
  </aside>

 </div>
</main>

<nav class="bottomNav">
 <button class="active" onclick="goHome()"><b>🏠</b>Home</button>
 <button onclick="openReels()"><b>🎬</b>Reels</button>
 <button onclick="openCreatePost()"><b>➕</b>Create</button>
 <button onclick="openNotifications()"><b>🔔</b>Alerts</button>
 <button onclick="openProfile()"><b>👤</b>Profile</button>
</nav>

</div>

<!-- GENERAL MODAL -->
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()">
 <div class="modalBox" id="modalBox"></div>
</div>

<!-- REELS -->
<div id="reelsWrap" class="reelsWrap">
 <div class="reelTop">
  <button class="secondary" onclick="closeReels()">← Back</button>
  <b style="font-size:22px">Reels</b>
  <button class="secondary" onclick="openCreateReel()">＋</button>
 </div>
 <div id="reelsFeed" class="reelsFeed"></div>
</div>

<script>
/* =========================================================
   FRIENDBOOK PREMIUM V3
   Supabase configuration
========================================================= */

const SUPABASE_URL = "https://skereuaizdczbvjplisi.supabase.co";
const SUPABASE_KEY = "sb_publishable_3R2otJA1zIlsMsTYxe1ocw_NAPY5O9x";

const {createClient} = supabase;
const sb = createClient(SUPABASE_URL,SUPABASE_KEY);

let me=null;
let myProfile=null;
let currentChatUser=null;
let currentPost=null;
let currentReel=null;
let currentPage=null;
let currentGroup=null;
let profilesCache={};
let feedPosts=[];
let reelsCache=[];

/* =========================
   HELPERS
========================= */

const $=id=>document.getElementById(id);

function esc(v){
 return String(v??"")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");
}

function avatar(url,name="User"){
 return url || "https://ui-avatars.com/api/?name="+encodeURIComponent(name)+"&background=1877f2&color=fff";
}

function timeAgo(date){
 if(!date)return "";
 const sec=Math.floor((Date.now()-new Date(date).getTime())/1000);
 if(sec<60)return "Just now";
 if(sec<3600)return Math.floor(sec/60)+"m";
 if(sec<86400)return Math.floor(sec/3600)+"h";
 if(sec<604800)return Math.floor(sec/86400)+"d";
 return new Date(date).toLocaleDateString();
}

function toast(msg){
 const t=$("toast");
 t.textContent=msg;
 t.classList.add("show");
 clearTimeout(window.toastTimer);
 window.toastTimer=setTimeout(()=>t.classList.remove("show"),2200);
}

function openModal(html){
 $("modalBox").innerHTML=html;
 $("modal").classList.add("show");
}

function closeModal(){
 $("modal").classList.remove("show");
}

function loading(){
 return `<div class="loader">Loading...</div>`;
}

function noData(text){
 return `<div class="empty">${esc(text)}</div>`;
}

function currentAvatar(){
 return avatar(myProfile?.avatar_url,myProfile?.full_name||"User");
}

/* =========================
   AUTH
========================= */

function showRegister(){
 $("loginBox").classList.add("hidden");
 $("registerBox").classList.remove("hidden");
}

function showLogin(){
 $("registerBox").classList.add("hidden");
 $("loginBox").classList.remove("hidden");
}

async function login(){
 const email=$("loginEmail").value.trim();
 const password=$("loginPassword").value;

 if(!email||!password)return toast("Email ও password দিন");

 const {data,error}=await sb.auth.signInWithPassword({email,password});

 if(error)return toast(error.message);

 me=data.user;
 await startApp();
}

async function register(){
 const name=$("regName").value.trim();
 const email=$("regEmail").value.trim();
 const password=$("regPassword").value;

 if(!name||!email||!password)return toast("সব তথ্য দিন");
 if(password.length<6)return toast("Password কমপক্ষে 6 অক্ষরের দিন");

 const {data,error}=await sb.auth.signUp({
  email,
  password,
  options:{data:{full_name:name}}
 });

 if(error)return toast(error.message);

 if(data.user){
  try{
   await sb.from("profiles").upsert({
    id:data.user.id,
    full_name:name
   });
  }catch(e){}
 }

 toast("Account তৈরি হয়েছে");
 if(data.session){
  me=data.user;
  await startApp();
 }else{
  toast("Email verification লাগতে পারে");
 }
}

async function logout(){

async function saveHashtags(postId,text){
 const tags=[...String(text||"").matchAll(/#([\w\u0980-\u09FF]+)/g)]
 .map(x=>x[1].toLowerCase());

 for(const tag of tags){
  try{
   let {data}=await sb.from("fb_hashtags")
    .select("*").eq("tag",tag).maybeSingle();

   if(!data){
    const r=await sb.from("fb_hashtags").insert({tag}).select().single();
    data=r.data;
   }

   if(data){
    await sb.from("fb_post_hashtags").upsert({
     post_id:postId,
     hashtag_id:data.id
    });
   }
  }catch(e){}
 }

async function loadReels(){

 box.innerHTML=loading();

 .select("*")
 .order("created_at",{ascending:false})
 .limit(50);

 if(error){
  box.innerHTML=noData(error.message);
  return;
 }

 reelsCache=data||[];

 if(!reelsCache.length){
  box.innerHTML=noData("No Reels yet");
  return;
 }

 box.innerHTML=reelsCache.map(renderReel).join("");

 document.querySelectorAll(".reelVideo").forEach(v=>{
  const observer=new IntersectionObserver(entries=>{
   entries.forEach(e=>{
    if(e.isIntersecting){
     e.target.play().catch(()=>{});
     const id=e.target.dataset.id;
     incrementReelView(id);
    }else{
     e.target.pause();
    }
   });
  },{threshold:.65});
  observer.observe(v);
 });
}

function toggleReelSound(video){
 if(!video)return;
 video.muted=!video.muted;
 if(!video.muted)video.play().catch(()=>{});
 toast(video.muted?"Sound Off":"Sound On 🔊");

async function incrementReelView(id){
 try{
  await sb.rpc("increment_reel_views",{reel_id:id});
 }catch(e){
  try{
   const r=reelsCache.find(x=>String(x.id)===String(id));
   await sb.from("reels").update({views:(r?.views||0)+1}).eq("id",id);
  }catch(x){}
 }
}

async function createReel(){
 const video_url=$("reelUrl").value.trim();
 const caption=$("reelCaption").value.trim();

 const {error}=await sb.from("reels").insert({
  user_id:me.id,
  video_url,
  caption,
  created_at:new Date().toISOString(),
  views:0

 const {error}=await sb.from("fb_live_streams").insert({
  user_id:me.id,
  title:$("liveTitle").value.trim(),
  stream_url:$("liveUrl").value.trim()||null,
  status:"live",
  privacy:$("livePrivacy").value
 });

 if(error)return toast(error.message);

 closeModal();
 toast("Live session created 🔴");
}

/* =========================
   SETTINGS
========================= */

function openSettings(){
 openModal(`
 <div class="modalHead"><div class="modalTitle">Settings</div>
 <button class="close" onclick="closeModal()">×</button></div>

 <div class="featureGrid">
  <div class="feature" onclick="setTheme('light')">
   <div class="featureIcon">☀️</div><div class="featureTitle">Light</div>
  </div>
  <div class="feature" onclick="setTheme('dark')">
   <div class="featureIcon">🌙</div><div class="featureTitle">Dark</div>
  </div>
  <div class="feature" onclick="setTheme('amoled')">
   <div class="featureIcon">⚫</div><div class="featureTitle">AMOLED</div>
  </div>
  <div class="feature" onclick="editProfile()">
   <div class="featureIcon">👤</div><div class="featureTitle">Profile</div>
  </div>
 </div>

 <div style="margin-top:15px">
  <button class="menuItem" onclick="toggleSetting('notifications')">🔔 Notifications</button>
  <button class="menuItem" onclick="openPrivacy()">🔒 Privacy</button>
  <button class="menuItem" onclick="openBlocked()">🚫 Blocked Users</button>
  <button class="menuItem" onclick="logout()">🚪 Logout</button>
 </div>`);
}

function setTheme(theme){
 document.body.classList.remove("dark","amoled");
 if(theme==="dark")document.body.classList.add("dark");
 if(theme==="amoled")document.body.classList.add("dark","amoled");
 localStorage.setItem("fb_theme",theme);
 toast(theme+" theme");
}

function loadTheme(){
 setTheme(localStorage.getItem("fb_theme")||"light");
}

function toggleSetting(key){
 const old=localStorage.getItem("fb_"+key)!=="off";
 localStorage.setItem("fb_"+key,old?"off":"on");
 toast(old?"Disabled":"Enabled");
}

function openPrivacy(){
 openModal(`
 <div class="modalHead"><div class="modalTitle">Privacy</div>
 <button class="close" onclick="closeModal()">×</button></div>
 <button class="menuItem" onclick="toast('Profile visibility updated')">👤 Profile visibility</button>
 <button class="menuItem" onclick="toast('Message privacy updated')">💬 Who can message me</button>
 <button class="menuItem" onclick="toast('Post privacy updated')">📝 Default post audience</button>
 <button class="menuItem" onclick="toast('Search visibility updated')">🔎 Search visibility</button>`);
}

async function openBlocked(){
 const {data,error}=await sb.from("fb_blocks")
 .select("*").eq("blocker_id",me.id);

 if(error)return toast(error.message);

 let html=`
 <div class="modalHead"><div class="modalTitle">Blocked Users</div>
 <button class="close" onclick="closeModal()">×</button></div>`;

 for(const b of data||[]){
  const p=await getProfile(b.blocked_id);
  html+=`
   <div class="result">
    <img class="avatar" src="${avatar(p?.avatar_url,p?.full_name)}">
    <div style="flex:1"><b>${esc(p?.full_name||"User")}</b></div>
    <button class="secondary" onclick="unblockUser('${b.blocked_id}')">Unblock</button>
   </div>`;
 }

 openModal(html+(data?.length?"":noData("No blocked users")));
}

async function unblockUser(id){
 await sb.from("fb_blocks").delete()
 .eq("blocker_id",me.id).eq("blocked_id",id);
 toast("Unblocked");
 openBlocked();
}

/* =========================
   ONLINE FRIENDS
========================= */

async function loadOnlineFriends(){
 const box=$("onlineFriends");
 if(!box)return;

 const {data}=await sb.from("profiles")
 .select("*")
 .neq("id",me.id)
 .order("last_seen",{ascending:false})
 .limit(8);

 box.innerHTML=(data||[]).map(p=>`
 <div class="contact" onclick="openProfile('${p.id}')">
  <img class="avatar sm" src="${avatar(p.avatar_url,p.full_name)}">
  <span>${esc(p.full_name||"User")}</span>
  <span class="onlineDot"></span>
 </div>`).join("")||noData("No users");
}

/* =========================
   INIT
========================= */

loadTheme();

(async function init(){
 const {data}=await sb.auth.getSession();

 if(data?.session){
  me=data.session.user;
  await startApp();
 }else{
  $("authScreen").classList.remove("hidden");
 }
})();

/* Keep visible post statistics updated */
setTimeout(loadVisibleStats,1500);

/* Register service worker if available */
if("serviceWorker" in navigator){
 navigator.serviceWorker.register("./sw.js").catch(()=>{});
}

/* Keyboard shortcut */
document.addEventListener("keydown",e=>{
 if(e.key==="Escape"){
  closeModal();
  closeReels();
 }
});
</script>
