<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#1877f2">
<title>My Social App</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
 margin:0;
 background:#f0f2f5;
 font-family:Arial,"Noto Sans Bengali",sans-serif;
 color:#111;
}
button,input,textarea{font-family:inherit}
button{cursor:pointer;border:0}
.hidden{display:none!important}

/* HEADER */
.header{
 position:sticky;
 top:0;
 z-index:1000;
 height:58px;
 background:#fff;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 12px;
 box-shadow:0 1px 5px #0002;
}
.logo{
 color:#1877f2;
 font-size:25px;
 font-weight:800;
}
.header-actions{
 display:flex;
 gap:8px;
}
.circle{
 width:40px;
 height:40px;
 border-radius:50%;
 background:#f0f2f5;
 font-size:19px;
}

/* NAV */
.nav{
 position:sticky;
 top:58px;
 z-index:900;
 height:50px;
 display:flex;
 background:#fff;
 border-bottom:1px solid #ddd;
}
.nav button{
 flex:1;
 background:#fff;
 font-weight:bold;
 color:#65676b;
}
.nav button.active{
 color:#1877f2;
 border-bottom:3px solid #1877f2;
}

/* PAGES */
.page{
 max-width:700px;
 margin:auto;
 padding-bottom:80px;
}

/* CREATE */
.create{
 background:#fff;
 margin:10px;
 padding:12px;
 border-radius:10px;
 box-shadow:0 1px 3px #0002;
 display:flex;
 gap:10px;
 align-items:center;
}
.avatar{
 width:42px;
 height:42px;
 border-radius:50%;
 background:#1877f2;
 color:white;
 display:flex;
 align-items:center;
 justify-content:center;
 font-weight:bold;
 overflow:hidden;
 flex-shrink:0;
}
.avatar img{
 width:100%;
 height:100%;
 object-fit:cover;
}
.create-input{
 flex:1;
 background:#f0f2f5;
 border-radius:22px;
 padding:12px 15px;
 color:#65676b;
}

/* POST */
.post{
 background:#fff;
 margin:10px;
 border-radius:10px;
 overflow:hidden;
 box-shadow:0 1px 3px #0002;
}
.post-head{
 display:flex;
 gap:10px;
 padding:12px;
 align-items:center;
}
.user-name{font-weight:bold}
.time{font-size:12px;color:#777}
.caption{
 padding:0 12px 12px;
 white-space:pre-wrap;
 line-height:1.45;
}
.post-image{
 width:100%;
 max-height:650px;
 object-fit:cover;
 display:block;
}
.stats{
 display:flex;
 justify-content:space-between;
 padding:9px 12px;
 color:#65676b;
 font-size:14px;
 border-bottom:1px solid #eee;
}
.actions{
 display:flex;
}
.action{
 flex:1;
 padding:11px 4px;
 background:#fff;
 color:#65676b;
 font-weight:bold;
}
.action.liked{color:#1877f2}
.action:active{background:#f0f2f5}

/* COMMENTS */
.comments{
 display:none;
 padding:8px 12px 12px;
 border-top:1px solid #eee;
}
.comments.show{display:block}
.comment{
 background:#f0f2f5;
 border-radius:14px;
 padding:8px 11px;
 margin:6px 0;
 font-size:14px;
}
.comment strong{
 display:block;
 margin-bottom:2px;
}
.comment-form{
 display:flex;
 gap:7px;
 margin-top:8px;
}
.comment-form input{
 flex:1;
 border:1px solid #ddd;
 border-radius:20px;
 padding:10px 13px;
 outline:none;
}
.comment-form button{
 background:#1877f2;
 color:#fff;
 border-radius:20px;
 padding:0 15px;
}

/* REELS */
#reelsPage{
 display:none;
 position:fixed;
 left:0;
 right:0;
 top:108px;
 bottom:0;
 background:#000;
 z-index:800;
 overflow-y:auto;
 scroll-snap-type:y mandatory;
}
.reel{
 height:calc(100vh - 108px);
 position:relative;
 background:#000;
 scroll-snap-align:start;
 overflow:hidden;
}
.reel video{
 width:100%;
 height:100%;
 object-fit:cover;
}
.sound{
 position:absolute;
 right:12px;
 top:15px;
 width:45px;
 height:45px;
 border-radius:50%;
 background:#0008;
 color:#fff;
 font-size:20px;
 z-index:5;
}
.reel-info{
 position:absolute;
 left:15px;
 right:85px;
 bottom:25px;
 color:#fff;
}
.reel-user{
 font-weight:bold;
 font-size:17px;
 margin-bottom:7px;
}
.reel-caption{
 font-size:14px;
}
.reel-actions{
 position:absolute;
 right:10px;
 bottom:25px;
 display:flex;
 flex-direction:column;
 align-items:center;
 gap:10px;
}
.reel-action{
 width:52px;
 height:52px;
 border-radius:50%;
 background:#0008;
 color:#fff;
 font-size:21px;
}
.reel-count{
 color:#fff;
 font-size:12px;
}

/* PROFILE */
#profilePage{
 display:none;
 max-width:700px;
 margin:10px auto;
 background:#fff;
 border-radius:10px;
 overflow:hidden;
}
.cover{
 height:180px;
 background:linear-gradient(135deg,#1877f2,#6a5cff);
}
.profile-body{
 text-align:center;
 padding:0 15px 20px;
}
.profile-avatar{
 width:95px;
 height:95px;
 border-radius:50%;
 margin:-48px auto 10px;
 background:#1877f2;
 color:#fff;
 border:5px solid #fff;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:32px;
 font-weight:bold;
 overflow:hidden;
}
.profile-avatar img{
 width:100%;
 height:100%;
 object-fit:cover;
}
.profile-name{
 font-size:22px;
 font-weight:bold;
}
.bio{
 color:#65676b;
 margin:7px 0;
}
.profile-stats{
 display:flex;
 justify-content:center;
 gap:35px;
 margin:17px 0;
}
.stat strong{
 display:block;
 font-size:18px;
}
.stat span{
 color:#777;
 font-size:13px;
}

/* SEARCH */
.search-box{
 background:#fff;
 margin:10px;
 padding:12px;
 border-radius:10px;
}
.search-box input{
 width:100%;
 border:1px solid #ddd;
 border-radius:22px;
 padding:12px 15px;
 outline:none;
}
.search-results{
 margin-top:10px;
}
.user-result{
 display:flex;
 align-items:center;
 gap:10px;
 padding:10px 0;
 border-bottom:1px solid #eee;
}
.follow-btn{
 margin-left:auto;
 background:#1877f2;
 color:#fff;
 padding:8px 13px;
 border-radius:7px;
}

/* MODAL */
.modal{
 position:fixed;
 inset:0;
 background:#0008;
 z-index:3000;
 display:none;
 align-items:center;
 justify-content:center;
 padding:15px;
}
.modal.show{display:flex}
.modal-box{
 width:100%;
 max-width:500px;
 background:#fff;
 border-radius:12px;
 padding:18px;
}
.modal-title{
 font-size:20px;
 font-weight:bold;
 margin-bottom:15px;
}
.modal input,.modal textarea{
 width:100%;
 padding:12px;
 border:1px solid #ddd;
 border-radius:8px;
 margin-bottom:10px;
 outline:none;
}
.modal textarea{
 min-height:120px;
 resize:vertical;
}
.modal-actions{
 display:flex;
 justify-content:flex-end;
 gap:8px;
}
.cancel{
 background:#e4e6eb;
 padding:10px 18px;
 border-radius:7px;
}
.primary{
 background:#1877f2;
 color:#fff;
 padding:10px 18px;
 border-radius:7px;
}

/* LOGIN */
#loginPage{
 min-height:100vh;
 display:none;
 align-items:center;
 justify-content:center;
 padding:20px;
}
.login-box{
 width:100%;
 max-width:400px;
 background:#fff;
 padding:25px;
 border-radius:12px;
 box-shadow:0 3px 15px #0002;
}
.login-title{
 color:#1877f2;
 text-align:center;
 font-size:30px;
 font-weight:bold;
 margin-bottom:25px;
}
.login-box input{
 width:100%;
 padding:13px;
 border:1px solid #ddd;
 border-radius:7px;
 margin-bottom:10px;
}
.login-btn,.register-btn{
 width:100%;
 padding:13px;
 border-radius:7px;
 color:#fff;
 font-weight:bold;
}
.login-btn{background:#1877f2}
.register-btn{
 background:#42b72a;
 margin-top:10px;
}
.message{
 text-align:center;
 margin-top:10px;
}

/* ADMIN */
.admin{
 display:none;
 padding:10px;
 max-width:700px;
 margin:auto;
}
.admin-card{
 background:#fff;
 padding:18px;
 border-radius:10px;
 margin-bottom:10px;
 box-shadow:0 1px 3px #0002;
}
.admin-number{
 font-size:28px;
 font-weight:bold;
 color:#1877f2;
}

/* EMPTY */
.empty{
 text-align:center;
 padding:50px 20px;
 color:#777;
}

@media(max-width:600px){
 .create,.post{
  margin:7px 0;
  border-radius:0;
 }
 #profilePage{
  margin:7px 0;
  border-radius:0;
 }
}
</style>
</head>

<body>

<!-- LOGIN -->
<section id="loginPage">
 <div class="login-box">

  <div class="login-title">
   My Social App
  </div>

  <input id="loginEmail"
         type="email"
         placeholder="Email">

  <input id="loginPassword"
         type="password"
         placeholder="Password">

  <button class="login-btn"
          onclick="login()">
   Login
  </button>

  <button class="register-btn"
          onclick="registerUser()">
   Create new account
  </button>

  <div id="loginMessage"
       class="message"></div>

 </div>
</section>


<!-- APP -->
<div id="app">

 <header class="header">

  <div class="logo">
   My Social
  </div>

  <div class="header-actions">

   <button class="circle"
           onclick="openPost()">
    ＋
   </button>

   <button class="circle"
           onclick="logout()">
    ⇥
   </button>

  </div>

 </header>


 <nav class="nav">

  <button id="navHome"
          class="active"
          onclick="showHome()">
   🏠 Home
  </button>

  <button id="navSearch"
          onclick="showSearch()">
   🔍 Search
  </button>

  <button id="navReels"
          onclick="showReels()">
   ▶ Reels
  </button>

  <button id="navProfile"
          onclick="showProfile()">
   👤 Profile
  </button>

 </nav>


 <!-- HOME -->
 <main id="homePage"
       class="page">

  <div class="create">

   <div id="smallAvatar"
        class="avatar">
    F
   </div>

   <div class="create-input"
        onclick="openPost()">
    What's on your mind?
   </div>

  </div>

  <div id="feed"></div>

 </main>


 <!-- SEARCH -->
 <section id="searchPage"
          class="page hidden">

  <div class="search-box">

   <input id="searchInput"
          placeholder="Search users..."
          oninput="searchUsers()">

   <div id="searchResults"
        class="search-results"></div>

  </div>

 </section>


 <!-- REELS -->
 <section id="reelsPage">

  <div id="reelsContainer"></div>

 </section>


 <!-- PROFILE -->
 <section id="profilePage">

  <div class="cover"></div>

  <div class="profile-body">

   <div id="profileAvatar"
        class="profile-avatar">
    F
   </div>

   <div id="profileName"
        class="profile-name">
    Ferdous
   </div>

   <div id="profileBio"
        class="bio">
    Welcome to My Social App
   </div>

   <div class="profile-stats">

    <div class="stat">
     <strong id="postCount">0</strong>
     <span>Posts</span>
    </div>

    <div class="stat">
     <strong id="followerCount">0</strong>
     <span>Followers</span>
    </div>

    <div class="stat">
     <strong id="followingCount">0</strong>
     <span>Following</span>
    </div>

   </div>

   <button class="primary"
           onclick="editProfile()">
    Edit Profile
   </button>

  </div>

 </section>


 <!-- ADMIN -->
 <section id="adminPage"
          class="admin">

  <div class="admin-card">
   <div>Users</div>
   <div id="adminUsers"
        class="admin-number">0</div>
  </div>

  <div class="admin-card">
   <div>Posts</div>
   <div id="adminPosts"
        class="admin-number">0</div>
  </div>

  <div class="admin-card">
   <div>Reels</div>
   <div id="adminReels"
        class="admin-number">0</div>
  </div>

 </section>

</div>


<!-- POST MODAL -->
<div id="postModal"
     class="modal">

 <div class="modal-box">

  <div class="modal-title">
   Create Post
  </div>

  <textarea id="postText"
            placeholder="What's on your mind?"></textarea>

  <input id="postImage"
         placeholder="Image URL">

  <div class="modal-actions">

   <button class="cancel"
           onclick="closePost()">
    Cancel
   </button>

   <button class="primary"
           onclick="createPost()">
    Post
   </button>

  </div>

 </div>

</div>


<script>

/* =========================================================
 SUPABASE
========================================================= */

const SUPABASE_URL =
"YOUR_SUPABASE_URL";

const SUPABASE_ANON_KEY =
"YOUR_SUPABASE_ANON_KEY";


/* =========================================================
 STATE
========================================================= */

let currentUser =
 JSON.parse(
  localStorage.getItem("my_social_user") || "null"
 );

let posts =
 JSON.parse(
  localStorage.getItem("my_social_posts") || "null"
 ) || [];

let reels =
 JSON.parse(
  localStorage.getItem("my_social_reels") || "null"
 ) || [];

let likes =
 JSON.parse(
  localStorage.getItem("my_social_likes") || "{}"
 );

let comments =
 JSON.parse(
  localStorage.getItem("my_social_comments") || "{}"
 );

let following =
 JSON.parse(
  localStorage.getItem("my_social_following") || "[]"
 );

let users =
 JSON.parse(
  localStorage.getItem("my_social_users") || "null"
 ) || [
  {
   id:"local-user",
   name:"Ferdous",
   email:"demo@example.com",
   followers:0,
   following:0
  }
 ];


/* =========================================================
 DEMO DATA
========================================================= */

if(posts.length===0){

 posts=[
  {
   id:"post1",
   user:"Ferdous",
   caption:"Welcome to My Social App ❤️",
   image:"",
   likes:3,
   created_at:new Date().toISOString()
  },
  {
   id:"post2",
   user:"Ferdous",
   caption:"আমাদের নতুন Social App 🚀",
   image:"",
   likes:5,
   created_at:new Date().toISOString()
  }
 ];

}

if(reels.length===0){

 reels=[
  {
   id:"reel1",
   user:"Ferdous",
   caption:"Welcome to My Social App ❤️",
   video:"https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",
   likes:10
  },
  {
   id:"reel2",
   user:"Ferdous",
   caption:"Reels Test Video 🔥",
   video:"https://www.w3schools.com/html/mov_bbb.mp4",
   likes:7
  }
 ];

}


/* =========================================================
 START
========================================================= */

document.addEventListener("DOMContentLoaded",()=>{

 if(!currentUser){

  currentUser={
   id:"local-user",
   name:"Ferdous",
   email:"demo@example.com"
  };

  localStorage.setItem(
   "my_social_user",
   JSON.stringify(currentUser)
  );

 }

 save();

 updateUI();
 renderFeed();
 renderReels();

});


/* =========================================================
 SAVE
========================================================= */

function save(){

 localStorage.setItem(
  "my_social_posts",
  JSON.stringify(posts)
 );

 localStorage.setItem(
  "my_social_reels",
  JSON.stringify(reels)
 );

 localStorage.setItem(
  "my_social_likes",
  JSON.stringify(likes)
 );

 localStorage.setItem(
  "my_social_comments",
  JSON.stringify(comments)
 );

 localStorage.setItem(
  "my_social_following",
  JSON.stringify(following)
 );

 localStorage.setItem(
  "my_social_users",
  JSON.stringify(users)
 );

}


/* =========================================================
 UI
========================================================= */

function updateUI(){

 const name =
  currentUser?.name || "Ferdous";

 const first =
  name.charAt(0).toUpperCase();

 document.getElementById(
  "smallAvatar"
 ).textContent=first;

 document.getElementById(
  "profileAvatar"
 ).textContent=first;

 document.getElementById(
  "profileName"
 ).textContent=name;

 document.getElementById(
  "postCount"
 ).textContent=
  posts.filter(
   p=>p.user===name
  ).length;

 const me =
  users.find(
   u=>u.id===currentUser.id
  );

 document.getElementById(
  "followerCount"
 ).textContent=
  me?.followers || 0;

 document.getElementById(
  "followingCount"
 ).textContent=
  me?.following || following.length;

}


/* =========================================================
 FEED
========================================================= */

function renderFeed(){

 const feed =
  document.getElementById("feed");

 feed.innerHTML="";

 if(posts.length===0){

  feed.innerHTML=
   `<div class="empty">
     No posts yet.
    </div>`;

  return;

 }

 posts.forEach(post=>{

  const liked =
   likes[post.id]===true;

  const likeCount =
   Number(post.likes||0)
   +(liked?1:0);

  const list =
   comments[post.id]||[];

  const div =
   document.createElement("article");

  div.className="post";

  div.innerHTML=`

   <div class="post-head">

    <div class="avatar">
     ${esc(
      (post.user||"U").charAt(0)
     )}
    </div>

    <div>
     <div class="user-name">
      ${esc(post.user||"User")}
     </div>

     <div class="time">
      Just now
     </div>
    </div>

   </div>

   ${
    post.caption
    ?`
    <div class="caption">
     ${esc(post.caption)}
    </div>`
    :""
   }

   ${
    post.image
    ?`
    <img
     class="post-image"
     src="${attr(post.image)}"
     onerror="this.style.display='none'">
    `
    :""
   }

   <div class="stats">

    <span>❤️ ${likeCount}</span>

    <span>
     ${list.length} comments
    </span>

   </div>

   <div class="actions">

    <button
     class="action ${liked?"liked":""}"
     onclick="toggleLike('${post.id}')">

     ${liked?"💙 Liked":"❤️ Like"}

    </button>

    <button
     class="action"
     onclick="toggleComments('${post.id}')">

     💬 Comment

    </button>

    <button
     class="action"
     onclick="sharePost('${post.id}')">

     ↗ Share

    </button>

   </div>

   <div
    id="comments-${post.id}"
    class="comments">

    <div>
     ${
      list.length
      ?list.map(c=>`
       <div class="comment">
        <strong>${esc(c.user)}</strong>
        ${esc(c.text)}
       </div>
      `).join("")
      :`<small style="color:#777">
          No comments yet.
        </small>`
     }
    </div>

    <div class="comment-form">

     <input
      id="input-${post.id}"
      placeholder="Write a comment...">

     <button
      onclick="addComment('${post.id}')">
      Send
     </button>

    </div>

   </div>

  `;

  feed.appendChild(div);

 });

}


/* =========================================================
 LIKE
========================================================= */

function toggleLike(id){

 likes[id]=!likes[id];

 save();
 renderFeed();

}


/* =========================================================
 COMMENTS
========================================================= */

function toggleComments(id){

 const box =
  document.getElementById(
   "comments-"+id
  );

 if(box)
  box.classList.toggle("show");

}


function addComment(id){

 const input =
  document.getElementById(
   "input-"+id
  );

 const text =
  input.value.trim();

 if(!text)return;

 if(!comments[id])
  comments[id]=[];

 comments[id].push({

  user:
   currentUser?.name||"Ferdous",

  text:text,

  created_at:
   new Date().toISOString()

 });

 input.value="";

 save();
 renderFeed();

 setTimeout(()=>{

  const box =
   document.getElementById(
    "comments-"+id
   );

  if(box)
   box.classList.add("show");

 },50);

}


/* =========================================================
 SHARE
========================================================= */

function sharePost(id){

 const post =
  posts.find(
   p=>p.id===id
  );

 if(!post)return;

 const text =
  `${post.user}: ${post.caption}`;

 if(navigator.share){

  navigator.share({
   title:"My Social App",
   text:text
  }).catch(()=>{});

 }else{

  navigator.clipboard
   ?.writeText(text);

  alert("Post copied!");

 }

}


/* =========================================================
 POST
========================================================= */

function openPost(){

 document.getElementById(
  "postModal"
 ).classList.add("show");

}


function closePost(){

 document.getElementById(
  "postModal"
 ).classList.remove("show");

}


function createPost(){

 const text =
  document.getElementById(
   "postText"
  ).value.trim();

 const image =
  document.getElementById(
   "postImage"
  ).value.trim();

 if(!text&&!image){

  alert(
   "Post লিখুন অথবা Image URL দিন"
  );

  return;

 }

 posts.unshift({

  id:"post-"+Date.now(),

  user:
   currentUser?.name||"Ferdous",

  caption:text,

  image:image,

  likes:0,

  created_at:
   new Date().toISOString()

 });

 document.getElementById(
  "postText"
 ).value="";

 document.getElementById(
  "postImage"
 ).value="";

 save();
 closePost();
 renderFeed();
 updateUI();

}


/* =========================================================
 REELS
========================================================= */

function renderReels(){

 const box =
  document.getElementById(
   "reelsContainer"
  );

 box.innerHTML="";

 reels.forEach(reel=>{

  const liked =
   likes[reel.id]===true;

  const count =
   Number(reel.likes||0)
   +(liked?1:0);

  const div =
   document.createElement("div");

  div.className="reel";

  div.innerHTML=`

   <video
    class="reel-video"
    src="${attr(reel.video)}"
    muted
    loop
    playsinline
    preload="metadata">
   </video>

   <button
    class="sound"
    onclick="sound(this)">
    🔇
   </button>

   <div class="reel-info">

    <div class="reel-user">
     @${esc(reel.user)}
    </div>

    <div class="reel-caption">
     ${esc(reel.caption)}
    </div>

   </div>

   <div class="reel-actions">

    <button
     class="reel-action"
     onclick="reelLike('${reel.id}')">
     ${liked?"💙":"❤️"}
    </button>

    <div class="reel-count">
     ${count}
    </div>

    <button
     class="reel-action"
     onclick="alert('Reel comment system active')">
     💬
    </button>

    <button
     class="reel-action"
     onclick="shareReel('${reel.id}')">
     ↗
    </button>

   </div>

  `;

  box.appendChild(div);

 });

 observeVideos();

}


function reelLike(id){

 likes[id]=!likes[id];

 save();
 renderReels();

}


function sound(btn){

 const video =
  btn.parentElement
   .querySelector("video");

 video.muted=!video.muted;

 btn.textContent =
  video.muted?"🔇":"🔊";

 video.play().catch(()=>{});

}


function shareReel(id){

 const reel =
  reels.find(
   r=>r.id===id
  );

 if(!reel)return;

 if(navigator.share){

  navigator.share({
   title:"My Social App",
   text:reel.caption,
   url:reel.video
  }).catch(()=>{});

 }else{

  navigator.clipboard
   ?.writeText(reel.video);

  alert("Reel link copied!");

 }

}


function observeVideos(){

 const observer =
  new IntersectionObserver(
   entries=>{

    entries.forEach(entry=>{

     const video =
      entry.target;

     if(entry.isIntersecting)
      video.play().catch(()=>{});
     else
      video.pause();

    });

   },
   {threshold:.7}
  );

 document
  .querySelectorAll(".reel-video")
  .forEach(v=>observer.observe(v));

}


/* =========================================================
 SEARCH
========================================================= */

function searchUsers(){

 const q =
  document.getElementById(
   "searchInput"
  ).value
  .trim()
  .toLowerCase();

 const box =
  document.getElementById(
   "searchResults"
  );

 box.innerHTML="";

 if(!q)return;

 users
  .filter(u=>
   u.name.toLowerCase().includes(q)
  )
  .forEach(user=>{

   const isFollowing =
    following.includes(user.id);

   const div =
    document.createElement("div");

   div.className="user-result";

   div.innerHTML=`

    <div class="avatar">
     ${esc(user.name.charAt(0))}
    </div>

    <strong>
     ${esc(user.name)}
    </strong>

    <button
     class="follow-btn"
     onclick="toggleFollow('${user.id}')">

     ${isFollowing
      ?"Following"
      :"Follow"}

    </button>

   `;

   box.appendChild(div);

  });

}


/* =========================================================
 FOLLOW
========================================================= */

function toggleFollow(id){

 if(id===currentUser.id){

  alert("নিজেকে Follow করা যাবে না");

  return;

 }

 const index =
  following.indexOf(id);

 if(index>=0){

  following.splice(index,1);

  const user =
   users.find(u=>u.id===id);

  if(user)
   user.followers=
    Math.max(
     0,
     (user.followers||0)-1
    );

 }else{

  following.push(id);

  const user =
   users.find(u=>u.id===id);

  if(user)
   user.followers=
    (user.followers||0)+1;

 }

 const me =
  users.find(
   u=>u.id===currentUser.id
  );

 if(me)
  me.following=following.length;

 save();
 searchUsers();
 updateUI();

}

function editProfile(){

 const name =
  prompt(
   "নতুন নাম লিখুন:",
   currentUser.name
  );

 if(!name)return;

 currentUser.name=name;

 localStorage.setItem(
  "my_social_user",
  JSON.stringify(currentUser)
 );

 let user =
  users.find(
   u=>u.id===currentUser.id
  );

 if(!user){

  user={
   id:currentUser.id,
   name:name,
   followers:0,
   following:following.length
  };

  users.push(user);

 }else{

  user.name=name;

 }

 save();
 updateUI();
 renderFeed();

}


/* =========================================================
 LOGIN
========================================================= */

function login(){

 const email =
  document.getElementById(
   "loginEmail"
  ).value.trim();

 const password =
  document.getElementById(
   "loginPassword"
  ).value.trim();

 if(!email||!password){

  document.getElementById(
   "loginMessage"
  ).textContent=
   "Email এবং Password দিন";

  return;

 }

 currentUser={
  id:"user-"+Date.now(),
  name:email.split("@")[0],
  email:email
 };

 if(!users.some(
  u=>u.id===currentUser.id
 )){

  users.push({
   id:currentUser.id,
   name:currentUser.name,
   email:email,
   followers:0,
   following:0
  });

 }

 localStorage.setItem(
  "my_social_user",
  JSON.stringify(currentUser)
 );

 save();

 document.getElementById(
  "loginPage"
 ).style.display="none";

 document.getElementById(
  "app"
 ).style.display="block";

 updateUI();

}

  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")

}
