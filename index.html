<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#1877f2">
<title>FriendBook</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
:root{
 --blue:#1877f2;
 --bg:#f0f2f5;
 --card:#fff;
 --text:#1c1e21;
 --muted:#65676b;
 --border:#dddfe2;
 --danger:#e41e3f;
}
body.dark{
 --bg:#18191a;
 --card:#242526;
 --text:#e4e6eb;
 --muted:#b0b3b8;
 --border:#3a3b3c;
}
body{
 margin:0;
 background:var(--bg);
 color:var(--text);
 font-family:Arial,Helvetica,sans-serif;
}
button,input,textarea,select{
 font:inherit;
}
button{
 cursor:pointer;
 border:0;
}
.hidden{display:none!important}
.top{
 position:sticky;
 top:0;
 z-index:100;
 background:var(--card);
 border-bottom:1px solid var(--border);
 height:58px;
 display:flex;
 align-items:center;
 gap:8px;
 padding:8px 12px;
}
.logo{
 color:var(--blue);
 font-size:24px;
 font-weight:800;
 white-space:nowrap;
}
.search{
 flex:1;
 max-width:420px;
}
.search input{
 width:100%;
 border:0;
 background:var(--bg);
 border-radius:22px;
 padding:11px 15px;
 outline:0;
 color:var(--text);
}
.nav{
 display:flex;
 gap:4px;
 margin-left:auto;
}
.nav button{
 background:transparent;
 color:var(--muted);
 font-size:20px;
 padding:9px 11px;
 border-radius:9px;
}
.nav button:hover{
 background:var(--bg);
}
.badge{
 position:absolute;
 background:#e41e3f;
 color:#fff;
 border-radius:20px;
 font-size:10px;
 padding:2px 5px;
 margin-left:-8px;
 margin-top:-7px;
}
.layout{
 max-width:1250px;
 margin:auto;
 display:grid;
 grid-template-columns:220px minmax(0,680px) 260px;
 gap:18px;
 padding:18px;
}
.left,.right{
 position:sticky;
 top:76px;
 height:max-content;
}
.menu{
 background:var(--card);
 border-radius:12px;
 overflow:hidden;
}
.menu button{
 width:100%;
 text-align:left;
 padding:13px;
 background:transparent;
 color:var(--text);
}
.menu button:hover{
 background:var(--bg);
}
.card{
 background:var(--card);
 border-radius:12px;
 padding:15px;
 margin-bottom:14px;
 box-shadow:0 1px 2px rgba(0,0,0,.08);
}
.avatar{
 width:42px;
 height:42px;
 border-radius:50%;
 object-fit:cover;
 background:#ddd;
}
.avatar.big{
 width:92px;
 height:92px;
}
.row{
 display:flex;
 align-items:center;
 gap:10px;
}
.space{
 justify-content:space-between;
}
.muted{
 color:var(--muted);
 font-size:13px;
}
.btn{
 background:var(--blue);
 color:white;
 padding:9px 14px;
 border-radius:7px;
}
.btn.secondary{
 background:var(--bg);
 color:var(--text);
}
.btn.danger{
 background:var(--danger);
}
textarea,input,select{
 width:100%;
 border:1px solid var(--border);
 border-radius:8px;
 padding:11px;
 background:var(--card);
 color:var(--text);
 outline:none;
}
textarea{
 min-height:85px;
 resize:vertical;
}
.actions{
 display:flex;
 gap:6px;
 flex-wrap:wrap;
 margin-top:10px;
}
.actions button{
 flex:1;
 min-width:75px;
 background:var(--bg);
 color:var(--text);
 border-radius:7px;
 padding:9px;
}
.actions button:hover{
 background:#e4e6eb;
}
.post-img,.post-video{
 width:100%;
 max-height:650px;
 object-fit:cover;
 border-radius:8px;
 margin-top:10px;
}
.story-scroll,.reel-scroll{
 display:flex;
 gap:9px;
 overflow:auto;
 padding-bottom:3px;
}
.story{
 min-width:105px;
 height:150px;
 border-radius:12px;
 overflow:hidden;
 position:relative;
 background:#222;
}
.story img,.story video{
 width:100%;
 height:100%;
 object-fit:cover;
}
.story span{
 position:absolute;
 bottom:6px;
 left:7px;
 color:#fff;
 font-weight:bold;
 font-size:12px;
 text-shadow:0 1px 3px #000;
}
.tabs{
 display:flex;
 overflow:auto;
 gap:4px;
 margin-bottom:14px;
}
.tabs button{
 white-space:nowrap;
 background:var(--card);
 color:var(--text);
 padding:10px 14px;
 border-radius:8px;
}
.tabs button.active{
 background:var(--blue);
 color:#fff;
}
.profile-cover{
 width:100%;
 height:220px;
 object-fit:cover;
 border-radius:12px 12px 0 0;
}
.profile-head{
 margin-top:-45px;
 padding:0 18px 18px;
}
.profile-actions{
 display:flex;
 gap:7px;
 flex-wrap:wrap;
}
.comment{
 margin-top:8px;
 padding:9px;
 background:var(--bg);
 border-radius:10px;
}
.comment-actions{
 display:flex;
 gap:10px;
 font-size:12px;
 color:var(--muted);
 margin-top:5px;
}
.reel{
 position:relative;
 background:#000;
 border-radius:12px;
 overflow:hidden;
 margin-bottom:15px;
}
.reel video{
 width:100%;
 height:min(75vh,680px);
 object-fit:cover;
 display:block;
}
.reel-info{
 position:absolute;
 bottom:12px;
 left:12px;
 right:12px;
 color:white;
 text-shadow:0 1px 4px #000;
}
.modal{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.65);
 z-index:500;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:15px;
}
.modal-box{
 width:min(620px,100%);
 max-height:90vh;
 overflow:auto;
 background:var(--card);
 border-radius:14px;
 padding:18px;
}
.toast{
 position:fixed;
 bottom:20px;
 left:50%;
 transform:translateX(-50%);
 background:#222;
 color:#fff;
 padding:11px 18px;
 border-radius:20px;
 z-index:1000;
}
.login-wrap{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
}
.login-box{
 width:min(430px,100%);
 background:var(--card);
 border-radius:15px;
 padding:25px;
 box-shadow:0 5px 25px rgba(0,0,0,.12);
}
.login-box h1{
 color:var(--blue);
 text-align:center;
}
.auth-tabs{
 display:flex;
 gap:5px;
 margin-bottom:15px;
}
.auth-tabs button{
 flex:1;
 padding:10px;
 border-radius:8px;
 background:var(--bg);
 color:var(--text);
}
.auth-tabs button.active{
 background:var(--blue);
 color:#fff;
}
.stat-grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:8px;
}
.stat{
 background:var(--bg);
 padding:12px;
 border-radius:8px;
 text-align:center;
}
.grid2{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px;
}
.item{
 background:var(--bg);
 padding:12px;
 border-radius:10px;
}
@media(max-width:1000px){
 .layout{
  grid-template-columns:180px minmax(0,1fr);
 }
 .right{display:none}
}
@media(max-width:700px){
 .top{height:auto;flex-wrap:wrap}
 .logo{font-size:21px}
 .search{order:3;max-width:none;flex-basis:100%}
 .nav{margin-left:auto}
 .layout{
  display:block;
  padding:9px;
 }
 .left{
  position:static;
  margin-bottom:10px;
 }
 .left .menu{
  display:flex;
  overflow:auto;
 }
 .left .menu button{
  min-width:max-content;
  text-align:center;
 }
 .profile-cover{height:170px}
}
</style>
</head>

<body>

<div id="loginScreen" class="login-wrap">
 <div class="login-box">
  <h1>FriendBook</h1>
  <p class="muted" style="text-align:center">Connect with people</p>

  <div class="auth-tabs">
   <button id="loginTab" class="active" onclick="authMode('login')">Log In</button>
   <button id="signupTab" onclick="authMode('signup')">Create Account</button>
  </div>

  <div id="authForm">
   <input id="authEmail" type="email" placeholder="Email">
   <br><br>
   <input id="authPassword" type="password" placeholder="Password">
   <br><br>
   <input id="authName" class="hidden" placeholder="Your name">
   <br id="nameBreak" class="hidden">
   <button class="btn" style="width:100%" onclick="submitAuth()">Continue</button>
  </div>

  <p id="authMsg" class="muted"></p>
 </div>
</div>

<div id="app" class="hidden">

<header class="top">
 <div class="logo">FriendBook</div>

 <div class="search">
  <input id="globalSearch" placeholder="Search people, posts, reels..." onkeydown="if(event.key==='Enter')searchAll()">
 </div>

 <div class="nav">
  <button onclick="showPage('home')">🏠</button>
  <button onclick="showPage('reels')">🎬</button>
  <button onclick="showPage('messages')">💬</button>
  <button onclick="showPage('notifications')">🔔<span id="notifyBadge" class="badge hidden">0</span></button>
  <button onclick="showPage('profile')">👤</button>
  <button onclick="showPage('settings')">⚙️</button>
 </div>
</header>

<div class="layout">

<aside class="left">
 <div class="menu">
  <button onclick="showPage('home')">🏠 Home</button>
  <button onclick="showPage('profile')">👤 Profile</button>
  <button onclick="showPage('friends')">👥 Friends</button>
  <button onclick="showPage('messages')">💬 Messenger</button>
  <button onclick="showPage('reels')">🎬 Reels</button>
  <button onclick="showPage('stories')">📖 Stories</button>
  <button onclick="showPage('groups')">👨‍👩‍👧 Groups</button>
  <button onclick="showPage('pages')">📄 Pages</button>
  <button onclick="showPage('marketplace')">🛒 Marketplace</button>
  <button onclick="showPage('events')">📅 Events</button>
  <button onclick="showPage('creator')">💰 Creator</button>
  <button onclick="showPage('saved')">🔖 Saved</button>
  <button onclick="showPage('settings')">⚙️ Settings</button>
  <button onclick="toggleDark()">🌙 Dark Mode</button>
  <button onclick="logout()">🚪 Logout</button>
 </div>
</aside>

<main id="main"></main>

<aside class="right">
 <div class="card">
  <b>FriendBook</b>
  <p class="muted">Your social world in one place.</p>
 </div>
 <div class="card">
  <b>Quick Actions</b>
  <div class="actions">
   <button onclick="showCreatePost()">📝 Post</button>
   <button onclick="showCreateStory()">📖 Story</button>
   <button onclick="showCreateReel()">🎬 Reel</button>
  </div>
 </div>
</aside>

</div>
</div>

<div id="modal" class="modal hidden">
 <div id="modalBox" class="modal-box"></div>
</div>

<div id="toast" class="toast hidden"></div>

<script>
const SUPABASE_URL="https://skereuaizdczbvjplisi.supabase.co";
const SUPABASE_KEY="sb_publishable_3R2otJA1zIlsMsTYxe1ocw_NAPY5O9x";

const sb=window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

let currentUser=null;
let currentProfile=null;
let authType="login";
let currentPage="home";
let currentChatUser=null;

const $=id=>document.getElementById(id);

function toast(msg){
 $("toast").textContent=msg;
 $("toast").classList.remove("hidden");
 setTimeout(()=>$("toast").classList.add("hidden"),2500);
}

function esc(v){
 return String(v??"")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;");
}

function closeModal(){
 $("modal").classList.add("hidden");
}

function modal(html){
 $("modalBox").innerHTML=html;
 $("modal").classList.remove("hidden");
}

function authMode(type){
 authType=type;
 $("loginTab").classList.toggle("active",type==="login");
 $("signupTab").classList.toggle("active",type==="signup");
 $("authName").classList.toggle("hidden",type!=="signup");
 $("nameBreak").classList.toggle("hidden",type!=="signup");
 $("authMsg").textContent="";
}

async function submitAuth(){
 const email=$("authEmail").value.trim();
 const password=$("authPassword").value;
 const name=$("authName").value.trim();

 if(!email||!password){
  $("authMsg").textContent="Email এবং password দিন";
  return;
 }

 $("authMsg").textContent="Processing...";

 if(authType==="signup"){
  if(!name){
   $("authMsg").textContent="নাম দিন";
   return;
  }

  const {data,error}=await sb.auth.signUp({
   email,
   password,
   options:{
    data:{name}
   }
  });

  if(error){
   $("authMsg").textContent=error.message;
   return;
  }

  if(data.user){
   await createProfile(data.user,name);
  }

  if(!data.session){
   $("authMsg").textContent="Account তৈরি হয়েছে। Email verification লাগতে পারে।";
   return;
  }
 }else{
  const {error}=await sb.auth.signInWithPassword({
   email,
   password
  });

  if(error){
   $("authMsg").textContent=error.message;
   return;
  }
 }

 await startApp();
}

async function createProfile(user,name){
 const {data}=await sb
 .from("fb_profiles")
 .select("id")
 .eq("id",user.id)
 .maybeSingle();

 if(!data){
  await sb.from("fb_profiles").insert({
   id:user.id,
   name:name||"FriendBook User",
   username:(name||"user")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g,"")
    .slice(0,20),
   bio:""
  });
 }
}

async function startApp(){
 const {data:{user}}=await sb.auth.getUser();

 if(!user){
  $("loginScreen").classList.remove("hidden");
  $("app").classList.add("hidden");
  return;
 }

 currentUser=user;
 await createProfile(
  user,
  user.user_metadata?.name||"FriendBook User"
 );

 await loadMyProfile();

 $("loginScreen").classList.add("hidden");
 $("app").classList.remove("hidden");

 await updateOnline(true);
 showPage("home");
}

async function loadMyProfile(){
 const {data}=await sb
 .from("fb_profiles")
 .select("*")
 .eq("id",currentUser.id)
 .maybeSingle();

 currentProfile=data||{
  id:currentUser.id,
  name:"FriendBook User"
 };
}

async function logout(){
 await updateOnline(false);
 await sb.auth.signOut();
 location.reload();
}

async function updateOnline(value){
 if(!currentUser)return;

 await sb
 .from("fb_profiles")
 .update({
  online:value,
  last_seen:new Date().toISOString()
 })
 .eq("id",currentUser.id);
}

function showPage(page){
 currentPage=page;

 if(page==="home")renderHome();
 else if(page==="profile")renderProfile(currentUser.id);
 else if(page==="friends")renderFriends();
 else if(page==="messages")renderMessages();
 else if(page==="reels")renderReels();
 else if(page==="stories")renderStories();
 else if(page==="groups")renderGroups();
 else if(page==="pages")renderPages();
 else if(page==="marketplace")renderMarketplace();
 else if(page==="events")renderEvents();
 else if(page==="creator")renderCreator();
 else if(page==="saved")renderSaved();
 else if(page==="notifications")renderNotifications();
 else if(page==="settings")renderSettings();
}

async function renderHome(){
 $("main").innerHTML=`
 <div class="tabs">
  <button class="active">Home</button>
  <button onclick="renderHomeRecent()">Recent</button>
  <button onclick="showCreatePost()">Create Post</button>
  <button onclick="showCreateStory()">Story</button>
 </div>

 <div id="storiesHome"></div>

 <div class="card">
  <div class="row">
   <img class="avatar" src="${esc(currentProfile?.profile_photo||"https://placehold.co/80")}">
   <button class="btn secondary" style="flex:1;text-align:left" onclick="showCreatePost()">
    What's on your mind?
   </button>
  </div>
 </div>

 <div id="feed">Loading...</div>
 `;

 await renderStoriesMini();
 await loadFeed();
}

async function renderHomeRecent(){
 await renderHome();
}

async function loadFeed(){
 const {data,error}=await sb
 .from("fb_posts")
 .select("*")
 .order("created_at",{ascending:false})
 .limit(50);

 if(error){
  $("feed").innerHTML=`<div class="card">Error: ${esc(error.message)}</div>`;
  return;
 }

 if(!data?.length){
  $("feed").innerHTML=`<div class="card">এখনও কোনো post নেই। প্রথম post তৈরি করুন।</div>`;
  return;
 }

 $("feed").innerHTML="";

 for(const post of data){
  $("feed").insertAdjacentHTML(
   "beforeend",
   await postHTML(post)
  );
 }
}

async function postHTML(post){
 const {data:profile}=await sb
 .from("fb_profiles")
 .select("name,profile_photo,username")
 .eq("id",post.user_id)
 .maybeSingle();

 const {data:reactions}=await sb
 .from("fb_post_reactions")
 .select("reaction,user_id")
 .eq("post_id",post.id);

 const {data:comments}=await sb
 .from("fb_comments")
 .select("*")
 .eq("post_id",post.id)
 .order("created_at",{ascending:true})
 .limit(20);

 const mine=reactions?.find(x=>x.user_id===currentUser.id);

 const counts={};
 (reactions||[]).forEach(r=>{
  counts[r.reaction]=(counts[r.reaction]||0)+1;
 });

 return `
 <article class="card" id="post-${post.id}">
  <div class="row space">
   <div class="row">
    <img class="avatar" src="${esc(profile?.profile_photo||"https://placehold.co/80")}">
    <div>
     <b>${esc(profile?.name||"User")}</b>
     <div class="muted">
      ${esc(post.created_at||"")} ${post.location?" · "+esc(post.location):""}
     </div>
    </div>
   </div>
   <button class="btn secondary" onclick="postMenu(${post.id},${post.user_id===currentUser.id})">•••</button>
  </div>

  ${post.text?`<div style="margin-top:12px;white-space:pre-wrap">${esc(post.text)}</div>`:""}

  ${post.image_url?`<img class="post-img" src="${esc(post.image_url)}">`:""}

  <div class="muted" style="margin-top:10px">
   ❤️ ${Object.values(counts).reduce((a,b)=>a+b,0)}
   · 💬 ${(comments||[]).length}
  </div>

  <div class="actions">
   <button onclick="reactPost(${post.id},'like')">👍 ${counts.like||0}</button>
   <button onclick="reactPost(${post.id},'love')">❤️ ${counts.love||0}</button>
   <button onclick="reactPost(${post.id},'haha')">😂 ${counts.haha||0}</button>
   <button onclick="reactPost(${post.id},'wow')">😮 ${counts.wow||0}</button>
   <button onclick="reactPost(${post.id},'sad')">😢 ${counts.sad||0}</button>
   <button onclick="reactPost(${post.id},'angry')">😡 ${counts.angry||0}</button>
  </div>

  <div class="actions">
   <button onclick="focusComments(${post.id})">💬 Comment</button>
   <button onclick="savePost(${post.id})">🔖 Save</button>
   <button onclick="sharePost(${post.id})">↗ Share</button>
  </div>

  <div id="comments-${post.id}">
   ${(comments||[]).map(c=>commentHTML(c)).join("")}
  </div>

  <div class="row" style="margin-top:10px">
   <input id="commentInput-${post.id}" placeholder="Write a comment..."
    onkeydown="if(event.key==='Enter')addComment(${post.id})">
   <button class="btn" onclick="addComment(${post.id})">Send</button>
  </div>
 </article>
 `;
}

function commentHTML(c){
 return `
 <div class="comment">
  <div><b>User</b> ${esc(c.text)}</div>
  <div class="comment-actions">
   <span onclick="likeComment(${c.id})">👍 Like</span>
   <span onclick="replyComment(${c.id},${c.post_id})">↩ Reply</span>
   ${c.user_id===currentUser.id?`
    <span onclick="editComment(${c.id})">Edit</span>
    <span onclick="deleteComment(${c.id})">Delete</span>
   `:""}
  </div>
 </div>
 `;
}

async function reactPost(postId,reaction){
 const {data:old}=await sb
 .from("fb_post_reactions")
 .select("id,reaction")
 .eq("post_id",postId)
 .eq("user_id",currentUser.id)
 .maybeSingle();

 if(old){
  if(old.reaction===reaction){
   await sb.from("fb_post_reactions").delete().eq("id",old.id);
  }else{
   await sb.from("fb_post_reactions")
    .update({reaction})
    .eq("id",old.id);
  }
 }else{
  await sb.from("fb_post_reactions").insert({
   post_id:postId,
   user_id:currentUser.id,
   reaction
  });
 }

 await loadFeed();
}

async function addComment(postId){
 const input=$(`commentInput-${postId}`);
 const text=input.value.trim();

 if(!text)return;

 const {error}=await sb
 .from("fb_comments")
 .insert({
  post_id:postId,
  user_id:currentUser.id,
  text
 });

 if(error){
  toast(error.message);
  return;
 }

 input.value="";
 await loadFeed();
}

async function likeComment(commentId){
 const {data:old}=await sb
 .from("fb_comment_likes")
 .select("id")
 .eq("comment_id",commentId)
 .eq("user_id",currentUser.id)
 .maybeSingle();

 if(old){
  await sb.from("fb_comment_likes").delete().eq("id",old.id);
 }else{
  await sb.from("fb_comment_likes").insert({
   comment_id:commentId,
   user_id:currentUser.id
  });
 }

 toast("Comment reaction updated");
}

async function replyComment(parentId,postId){
 modal(`
  <h3>Reply</h3>
  <input id="replyText" placeholder="Write reply...">
  <br><br>
  <button class="btn" onclick="sendReply(${parentId},${postId})">Reply</button>
  <button class="btn secondary" onclick="closeModal()">Cancel</button>
 `);
}

async function sendReply(parentId,postId){
 const text=$("replyText").value.trim();
 if(!text)return;

 const {error}=await sb.from("fb_comments").insert({
  post_id:postId,
  user_id:currentUser.id,
  parent_id:parentId,
  text
 });

 if(error){
  toast(error.message);
  return;
 }

 closeModal();
 loadFeed();
}

}

function toggleDark(){
 document.body.classList.toggle("dark");
 localStorage.setItem(
  "friendbook-dark",
  document.body.classList.contains("dark")
 );
}

function applyDark(){
 if(localStorage.getItem("friendbook-dark")==="true"){
  document.body.classList.add("dark");
 }
}

async function loadNotifyBadge(){
 const {count}=await sb.from("fb_notifications")
 .select("*",{count:"exact",head:true})
 .eq("receiver_id",currentUser.id)
 .eq("read",false);

 if(count){
  $("notifyBadge").textContent=count;
  $("notifyBadge").classList.remove("hidden");
 }else{
  $("notifyBadge").classList.add("hidden");
 }
}

sb.auth.onAuthStateChange(async(event,session)=>{
 if(session && !currentUser){
  setTimeout(startApp,0);
 }
});

applyDark();

(async()=>{
 const {data:{session}}=await sb.auth.getSession();

 if(session){
  await startApp();
  setInterval(loadNotifyBadge,15000);
 }else{
  $("loginScreen").classList.remove("hidden");
 }
})();

window.addEventListener("beforeunload",()=>{
 if(currentUser){
  sb.from("fb_profiles")
   .update({
    online:false,
    last_seen:new Date().toISOString()
   })
   .eq("id",currentUser.id);
 }
});
</script>

</body>
</html>
