<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<meta name="theme-color"
      content="#1877f2">

<title>FriendBook</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
 box-sizing:border-box;
}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f0f2f5;
 color:#111;
}

body.dark{
 background:#18191a;
 color:#eee;
}

button,
input,
textarea,
select{
 font:inherit;
}

button{
 cursor:pointer;
 border:0;
}

.hidden{
 display:none!important;
}

#login{
 min-height:100vh;
 display:flex;
 justify-content:center;
 align-items:center;
 padding:20px;
}

.loginBox{
 background:#fff;
 width:100%;
 max-width:400px;
 padding:25px;
 border-radius:16px;
 box-shadow:0 5px 25px #0002;
}

.loginBox h1{
 color:#1877f2;
 text-align:center;
}

.loginBox input{
 width:100%;
 padding:13px;
 margin:6px 0;
 border:1px solid #ddd;
 border-radius:9px;
}

.btn{
 padding:11px 16px;
 border-radius:9px;
 margin:4px 0;
}

.blue{
 background:#1877f2;
 color:#fff;
}

.green{
 background:#42b72a;
 color:#fff;
}

.gray{
 background:#e4e6eb;
 color:#111;
}

.danger{
 background:#e41e3f;
 color:#fff;
}

.top{
 position:sticky;
 top:0;
 z-index:100;
 height:60px;
 background:#fff;
 border-bottom:1px solid #ddd;
 display:flex;
 align-items:center;
 gap:10px;
 padding:8px 12px;
}

.logo{
 font-size:22px;
 font-weight:bold;
 color:#1877f2;
}

.search{
 flex:1;
 border:0;
 background:#f0f2f5;
 border-radius:22px;
 padding:11px 15px;
}

.top button{
 width:40px;
 height:40px;
 border-radius:50%;
 background:#e4e6eb;
}

.nav{
 position:sticky;
 top:60px;
 z-index:90;
 display:flex;
 overflow-x:auto;
 background:#fff;
 border-bottom:1px solid #ddd;
}

.nav button{
 padding:13px 15px;
 background:#fff;
 white-space:nowrap;
}

.nav button.active{
 color:#1877f2;
 border-bottom:3px solid #1877f2;
}

.page{
 max-width:950px;
 margin:auto;
 padding:12px;
}

.card{
 background:#fff;
 padding:15px;
 margin-bottom:12px;
 border-radius:12px;
 box-shadow:0 1px 3px #0002;
}

body.dark .card,
body.dark .top,
body.dark .nav{
 background:#242526;
 color:#eee;
}

textarea,
.formInput,
select{
 width:100%;
 padding:11px;
 border:1px solid #ddd;
 border-radius:9px;
 margin:5px 0;
}

.row{
 display:flex;
 align-items:center;
 gap:10px;
}

.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
 gap:10px;
}

.feature{
 padding:18px;
 border-radius:12px;
 background:#f0f2f5;
 cursor:pointer;
 text-align:center;
}

body.dark .feature{
 background:#3a3b3c;
}

.postImg{
 width:100%;
 max-height:600px;
 object-fit:cover;
 border-radius:10px;
 margin-top:10px;
}

.actions{
 display:flex;
 gap:4px;
 border-top:1px solid #ddd;
 margin-top:10px;
 padding-top:6px;
}

.actions button{
 flex:1;
 background:transparent;
 padding:10px 4px;
 border-radius:8px;
}

.actions button:hover{
 background:#f0f2f5;
}

.comment{
 background:#f0f2f5;
 padding:9px;
 border-radius:10px;
 margin:6px 0;
}

/* REELS */

.reelCreate{
 background:#fff;
 padding:15px;
}

#reelFeed{
 height:calc(100vh - 116px);
 overflow-y:auto;
 scroll-snap-type:y mandatory;
 background:#000;
}

.reel{
 height:calc(100vh - 116px);
 min-height:500px;
 position:relative;
 scroll-snap-align:start;
 background:#000;
 color:#fff;
 overflow:hidden;
}

.reel video{
 width:100%;
 height:100%;
 object-fit:cover;
}

.reelShade{
 position:absolute;
 inset:0;
 background:linear-gradient(
  transparent 40%,
  #000d
 );
 pointer-events:none;
}

.sound{
 position:absolute;
 right:15px;
 top:15px;
 z-index:5;
 width:45px;
 height:45px;
 border-radius:50%;
 background:#0009;
 color:#fff;
}

.reelSide{
 position:absolute;
 right:10px;
 bottom:110px;
 z-index:5;
 display:flex;
 flex-direction:column;
 gap:9px;
}

.reelSide button{
 width:48px;
 height:48px;
 border-radius:50%;
 background:#0009;
 color:#fff;
 font-size:19px;
}

.reelInfo{
 position:absolute;
 left:15px;
 right:70px;
 bottom:15px;
 z-index:5;
 text-shadow:0 2px 5px #000;
}

.preview{
 width:100%;
 max-height:350px;
 display:none;
 margin:10px 0;
 background:#000;
 border-radius:10px;
}

.progress{
 width:100%;
 height:10px;
 background:#ddd;
 border-radius:10px;
 overflow:hidden;
 display:none;
}

.progress div{
 height:100%;
 width:0;
 background:#1877f2;
}

#toast{
 position:fixed;
 z-index:9999;
 left:50%;
 bottom:20px;
 transform:translateX(-50%);
 background:#222;
 color:#fff;
 padding:12px 18px;
 border-radius:10px;
 display:none;
 max-width:90%;
}

.stat{
 text-align:center;
 padding:12px;
 background:#f0f2f5;
 border-radius:10px;
}

body.dark .stat{
 background:#3a3b3c;
}

</style>

</head>

<body>


<!-- LOGIN -->

<section id="login">

  <p style="text-align:center">

  <input

<!-- APP -->

<div id="app" class="hidden">


<header class="top">

  👥 Friends

  💬 Messenger
 </button>

  ⭕ Stories
 </button>

  👨‍👩‍👧 Groups
 </button>

 <button onclick="showPages()">
  📄 Pages
 </button>

 <button onclick="showMarketplace()">
  🛒 Marketplace
 </button>

  📅 Events
 </button>

<main id="main"></main>

</div>


<div id="toast"></div>


<script>

/* =====================================================
 SUPABASE
===================================================== */

const SUPABASE_URL=
"https://skereuaizdczbvjplisi.supabase.co";

const SUPABASE_KEY=
"sb_publishable_3R2otJA1zIlsMsTYxe1ocw_NAPY5O9x";

const db=
supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

const BUCKET=
"friendbook-reels";

let me=null;


/* =====================================================
 HELPERS
===================================================== */

function $(id){
 return document.getElementById(id);
}

function esc(x){

 return String(x??"")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");

}

function toast(x){

 $("toast").textContent=x;
 $("toast").style.display="block";

 clearTimeout(window.tt);

 window.tt=setTimeout(()=>{
  $("toast").style.display="none";
 },3000);

}


/* =====================================================
 AUTH
===================================================== */

async function login(){

 const email=$("email").value.trim();
 const password=$("password").value;

 const {data,error}=
 await db.auth.signInWithPassword({
  email,
  password
 });

 if(error){

  $("loginMsg").textContent=
   error.message;

  return;

 }

 me=data.user;

 openApp();

}


async function signup(){

 const email=$("email").value.trim();
 const password=$("password").value;

 if(password.length<6){

  $("loginMsg").textContent=
   "Password কমপক্ষে ৬ অক্ষর";

  return;

 }

 const {data,error}=
 await db.auth.signUp({
  email,
  password
 });

 if(error){

  $("loginMsg").textContent=
   error.message;

  return;

 }

 if(data.user){

  me=data.user;

  await db.from("fb_profiles")
   .upsert({
    id:me.id,
    name:email.split("@")[0],
    username:email.split("@")[0],
    bio:"",
    online:true,
    last_seen:new Date().toISOString(),
    updated_at:new Date().toISOString()
   });

  openApp();

 }else{

  $("loginMsg").textContent=
   "Email verification প্রয়োজন হতে পারে";

 }

}


async function logout(){

 await db.auth.signOut();

 location.reload();

}


function openApp(){

 $("login").classList.add("hidden");

 $("app").classList.remove("hidden");

 showHome();

}


/* =====================================================
 HOME
===================================================== */

async function showHome(){

 $("main").innerHTML=`

 <div class="page">

  <div class="card">

   <h2>📝 Create Post</h2>

   <textarea
    id="postText"
    rows="4"
    placeholder="What's on your mind?">
   </textarea>

   <input
    id="postImage"
    class="formInput"
    placeholder="Photo URL">

   <select id="privacy">

    <option value="public">
     🌍 Public
    </option>

    <option value="friends">
     👥 Friends
    </option>

    <option value="only_me">
     🔒 Only Me
    </option>

   </select>

   <input
    id="feeling"
    class="formInput"
    placeholder="😊 Feeling / Activity">

   <input
    id="location"
    class="formInput"
    placeholder="📍 Location">

   <button
    class="btn blue"
    onclick="createPost()">
    🚀 Post
   </button>

  </div>


  <div class="card">

   <h3>Quick Access</h3>

   <div class="grid">

    <div class="feature"
     onclick="showReels()">
     🎬<br>Reels
    </div>

    <div class="feature"
     onclick="showStories()">
     ⭕<br>Stories
    </div>

    <div class="feature"
     onclick="showFriends()">
     👥<br>Friends
    </div>

    <div class="feature"
     onclick="showMessages()">
     💬<br>Messages
    </div>

    <div class="feature"
     onclick="showGroups()">
     👨‍👩‍👧<br>Groups
    </div>

    <div class="feature"
     onclick="showMarketplace()">
     🛒<br>Marketplace
    </div>

   </div>

  </div>


  <div id="feed">
   Loading...
  </div>

 </div>

 `;

 loadPosts();

}


async function createPost(){

 const text=$("postText").value.trim();

 const image=$("postImage").value.trim();

 if(!text && !image){

  toast("Post content দিন");
  return;

 }

 const {error}=
 await db.from("fb_posts")
 .insert({
  user_id:me.id,
  text:text,
  image_url:image||null,
  privacy:$("privacy").value,
  feeling:$("feeling").value.trim(),
  location:$("location").value.trim()
 });

 if(error){

  toast(
   "Post failed: "+
   error.message
  );

  return;

 }

 toast("✅ Post published");

 showHome();

}


async function loadPosts(){

 const {data,error}=
 await db.from("fb_posts")
 .select("*")
 .order("created_at",{
  ascending:false
 })
 .limit(50);

 if(error){

  $("feed").innerHTML=
   `<div class="card">
    ❌ ${esc(error.message)}
   </div>`;

  return;

 }

 if(!data?.length){

  $("feed").innerHTML=
   `<div class="card">
    No posts yet.
   </div>`;

  return;

 }

 $("feed").innerHTML=
 data.map(p=>`

  <article class="card">

   <div class="row">

    <div style="
     width:44px;
     height:44px;
     border-radius:50%;
     background:#1877f2;
     color:#fff;
     display:grid;
     place-items:center">
     👤
    </div>

    <div>

     <b>
      ${p.user_id===me.id
       ?"You"
       :"FriendBook User"}
     </b>

     <small>
      ${esc(p.privacy||"public")}
     </small>

    </div>

   </div>

   ${
    p.feeling
    ?`<p>😊 ${esc(p.feeling)}</p>`
    :""
   }

   ${
    p.location
    ?`<p>📍 ${esc(p.location)}</p>`
    :""
   }

   <p>
    ${esc(p.text||"")}
   </p>

   ${
    p.image_url
    ?`
    <img
     class="postImg"
     src="${esc(p.image_url)}">
    `
    :""
   }

   <div class="actions">

    <button
     onclick="postReact(${p.id},'like')">
     👍 Like
    </button>

    <button
     onclick="postReact(${p.id},'love')">
     ❤️ Love
    </button>

    <button
     onclick="commentPost(${p.id})">
     💬 Comment
    </button>

    <button
     onclick="savePost(${p.id})">
     🔖 Save
    </button>

    <button
     onclick="sharePost(${p.id})">
     ↗ Share
    </button>

   </div>

  </article>

 `).join("");

}


/* =====================================================
 POST REACTION
===================================================== */

async function postReact(id,reaction){

 const {data:old}=
 await db.from("fb_post_reactions")
 .select("id,reaction")
 .eq("post_id",id)
 .eq("user_id",me.id)
 .maybeSingle();

 if(old){

  if(old.reaction===reaction){

   await db.from("fb_post_reactions")
   .delete()
   .eq("id",old.id);

  }else{

   await db.from("fb_post_reactions")
   .update({reaction})
   .eq("id",old.id);

  }

 }else{

  const {error}=
  await db.from("fb_post_reactions")
  .insert({
   post_id:id,
   user_id:me.id,
   reaction
  });

  if(error){

   toast(error.message);
   return;

  }

 }

 toast(
  reaction==="love"
  ?"❤️ Love"
  :"👍 Like"
 );

}


/* =====================================================
 COMMENTS
===================================================== */

async function commentPost(postId){

 const {data}=
 await db.from("fb_comments")
 .select("*")
 .eq("post_id",postId)
 .order("created_at",{
  ascending:true
 });

 let html=`

 <div class="page">

  <button
   class="btn gray"
   onclick="showHome()">
   ← Back
  </button>

  <div class="card">

   <h2>💬 Comments</h2>

   <input
    id="commentText"
    class="formInput"
    placeholder="Write a comment">

   <button
    class="btn blue"
    onclick="addPostComment(${postId})">
    Comment
   </button>

  </div>

 `;

 html+=(data||[]).map(c=>`

  <div class="card">

   <b>
    ${c.user_id===me.id
     ?"You"
     :"User"}
   </b>

   <p>
    ${esc(c.text)}
   </p>

  </div>

 `).join("");

 html+=`</div>`;

 $("main").innerHTML=html;

}


async function addPostComment(id){

 const text=$("commentText").value.trim();

 if(!text)return;

 const {error}=
 await db.from("fb_comments")
 .insert({
  post_id:id,
  user_id:me.id,
  text,
  parent_id:null
 });

 if(error){

  toast(error.message);
  return;

 }

 toast("💬 Comment added");

 commentPost(id);

}


async function savePost(id){

 const {error}=
 await db.from("fb_saved_posts")
 .insert({
  post_id:id,
  user_id:me.id
 });

 if(error){

  if(error.code==="23505")
   toast("Already saved");
  else
   toast(error.message);

  return;

 }

 toast("🔖 Saved");

}


async function sharePost(id){

 const link=
 location.href.split("#")[0]+
 "#post-"+id;

 if(navigator.share){

  try{
   await navigator.share({
    title:"FriendBook Post",
    url:link
   });
  }catch(e){}

 }else{

  await navigator.clipboard
   .writeText(link);

  toast("🔗 Link copied");

 }

}


/* =====================================================
 REELS
===================================================== */

async function showReels(){

 $("main").innerHTML=`

 <div class="reelCreate">

  <h2>🎬 Create Reel</h2>

  <p>
   📱 ফোনের Gallery থেকে ভিডিও নির্বাচন করুন
  </p>

  <input
   id="reelFile"
   type="file"
   accept="video/*"
   onchange="previewReel(event)">

  <video
   id="reelPreview"
   class="preview"
   controls
   playsinline>
  </video>

  <input
   id="reelCaption"
   class="formInput"
   placeholder="Caption / #Hashtag">

  <input
   id="reelAudio"
   class="formInput"
   placeholder="🎵 Audio name">

  <button
   class="btn blue"
   onclick="uploadReel()">
   🚀 Post Reel
  </button>

  <div
   id="reelStatus">
  </div>

  <div
   id="uploadProgress"
   class="progress">

   <div id="progressBar"></div>

  </div>

 </div>


 <div id="reelFeed">
  Loading Reels...
 </div>

 `;

 await loadReels();

}


function previewReel(e){

 const file=e.target.files[0];

 if(!file)return;

 if(!file.type.startsWith("video/")){

  toast("শুধু Video নির্বাচন করুন");

  e.target.value="";

  return;

 }

 if(file.size>100*1024*1024){

  toast("ভিডিও 100 MB-এর বেশি নয়");

  e.target.value="";

  return;

 }

 const preview=$("reelPreview");

 preview.src=
  URL.createObjectURL(file);

 preview.style.display="block";

}


async function uploadReel(){

 const file=$("reelFile").files[0];

 if(!file){

  toast("Gallery থেকে ভিডিও নির্বাচন করুন");
  return;

 }

 const status=$("reelStatus");

 const progress=$("uploadProgress");

 const bar=$("progressBar");

 status.textContent=
  "⏳ Video upload হচ্ছে...";

 progress.style.display="block";

 bar.style.width="10%";


 const ext=
  (file.name.split(".").pop()||
   "mp4").toLowerCase();

 const path=
  me.id+
  "/"+
  Date.now()+
  "-"+
  crypto.randomUUID()+
  "."+
  ext;


 const {error:uploadError}=
 await db.storage
 .from(BUCKET)
 .upload(
  path,
  file,
  {
   cacheControl:"3600",
   contentType:file.type,
   upsert:false
  }
 );


 if(uploadError){

  progress.style.display="none";

  status.textContent=
   "❌ "+uploadError.message;

  return;

 }

 bar.style.width="70%";


 const {data:urlData}=
 db.storage
 .from(BUCKET)
 .getPublicUrl(path);

 const videoUrl=
  urlData.publicUrl;


 const {error:dbError}=
 await db.from("fb_reels")
 .insert({
  user_id:me.id,
  video_url:videoUrl,
  caption:$("reelCaption").value.trim(),
  audio_name:$("reelAudio").value.trim(),
  views:0
 });


 if(dbError){

  await db.storage
  .from(BUCKET)
  .remove([path]);

  progress.style.display="none";

  status.textContent=
   "❌ "+dbError.message;

  return;

 }

 bar.style.width="100%";

 status.textContent=
  "✅ Reel posted successfully";

 toast("🎬 Reel Posted");

 setTimeout(showReels,700);

}


async function loadReels(){

 const box=$("reelFeed");

 const {data,error}=
 await db.from("fb_reels")
 .select("*")
 .order("created_at",{
  ascending:false
 });

 if(error){

  box.innerHTML=
   `<div style="
    color:white;
    padding:30px">
    ❌ ${esc(error.message)}
   </div>`;

  return;

 }

 if(!data?.length){

  box.innerHTML=`

   <div style="
    color:white;
    text-align:center;
    padding:60px">

    <div style="font-size:60px">
     🎬
    </div>

    <h2>No Reels Yet</h2>

    <p>
     উপরে থেকে আপনার প্রথম Reel পোস্ট করুন।
    </p>

   </div>

  `;

  return;

 }


 box.innerHTML=
 data.map(r=>`

  <section
   class="reel"
   data-id="${r.id}">

   <video
    id="rv${r.id}"
    src="${esc(r.video_url)}"
    muted
    loop
    playsinline
    preload="metadata"
    onclick="toggleReel(${r.id})">
   </video>

   <div class="reelShade"></div>

   <button
    class="sound"
    onclick="soundReel(${r.id},this)">
    🔇
   </button>

   <div class="reelSide">

    <button
     onclick="reelReaction(${r.id},'like')">
     👍
    </button>

    <button
     onclick="reelReaction(${r.id},'love')">
     ❤️
    </button>

function setupReelObserver(){

 const observer=
 new IntersectionObserver(
  entries=>{

   entries.forEach(e=>{

    const video=
     e.target.querySelector("video");

    if(e.isIntersecting){

     document
     .querySelectorAll(".reel video")
     .forEach(v=>{
      if(v!==video)
       v.pause();
     });

     video.play().catch(()=>{});

     recordReelView(
      e.target.dataset.id
     );

    }else{

     video.pause();

    }

   });

  },
  {threshold:.7}
 );


 document
 .querySelectorAll(".reel")
 .forEach(x=>{
  observer.observe(x);
 });

}

}

 await db.from("fb_reels")
 .select("views")

 .maybeSingle();

   "/friendbook-reels/";

   await db.storage
   .from(BUCKET)
   .remove([path]);

}

   .insert(payload);

 }

 if(result.error){

  toast(result.error.message);
  return;

 }

 toast("Creator Mode enabled");

 showCreator();

}


/* =====================================================
 SEARCH
===================================================== */

async function doSearch(){

 const q=
 $("globalSearch").value.trim();

 if(!q)return;

 const {data:people}=
 await db.from("fb_profiles")
 .select("*")
 .or(
  `name.ilike.%${q}%,username.ilike.%${q}%`
 )
 .limit(30);

 const {data:posts}=
 await db.from("fb_posts")
 .select("*")
 .ilike("text","%"+q+"%")
 .limit(30);

 const {data:reels}=
 await db.from("fb_reels")
 .select("*")
 .ilike("caption","%"+q+"%")
 .limit(30);

 $("main").innerHTML=`

 <div class="page">

  <div class="card">

   <h2>
    🔎 Search: ${esc(q)}
   </h2>

  </div>

  <div class="card">

   <h3>👤 People</h3>

   ${
    (people||[]).map(p=>`

     <p>
      👤 ${esc(p.name)}
      <small>
       @${esc(p.username)}
      </small>
     </p>

    `).join("")
    ||
    "No people found."
   }

  </div>

  <div class="card">

   <h3>📝 Posts</h3>

   ${
    (posts||[]).map(p=>`

     <p>
      ${esc(p.text||"")}
     </p>

    `).join("")
    ||
    "No posts found."
   }

  </div>

  <div class="card">

   <h3>🎬 Reels</h3>

   ${
    (reels||[]).map(r=>`

     <p>
      ${esc(r.caption||"")}
     </p>

    `).join("")
    ||
    "No reels found."
   }

  </div>

  <div class="card">

   <h3>Search Categories</h3>

   <p>People</p>
   <p>Posts</p>
   <p>Reels</p>
   <p>Groups</p>
   <p>Pages</p>
   <p>Marketplace</p>
   <p>Events</p>
   <p>Hashtags</p>

  </div>

 </div>

 `;

}
