<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#1877f2">
<link rel="manifest" href="./manifest.json">
<title>My Social App</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
 font-family:Arial,"Noto Sans Bengali",sans-serif;
 background:#f0f2f5;color:#1c1e21;
 min-height:100vh
}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0}
.topbar{
 height:60px;background:#fff;border-bottom:1px solid #ddd;
 display:flex;align-items:center;padding:0 15px;
 position:fixed;top:0;left:0;right:0;z-index:1000
}
.logo{font-size:25px;font-weight:bold;color:#1877f2;margin-right:18px}
.search{
 width:260px;background:#f0f2f5;border-radius:25px;
 padding:10px 15px;border:0;outline:none
}
.top-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.icon-btn{
 width:42px;height:42px;border-radius:50%;
 background:#e4e6eb;font-size:20px;position:relative
}
.badge{
 position:absolute;right:-2px;top:-3px;background:red;color:#fff;
 border-radius:20px;font-size:11px;padding:3px 6px
}
.avatar{
 width:38px;height:38px;border-radius:50%;object-fit:cover;
 background:#1877f2;color:white;display:flex;
 align-items:center;justify-content:center;font-weight:bold
}
.layout{
 display:grid;grid-template-columns:250px 1fr 280px;
 max-width:1450px;margin:auto;padding-top:70px
}
.sidebar{
 padding:15px;position:sticky;top:70px;height:calc(100vh - 70px)
}
.nav{
 padding:12px;border-radius:10px;margin-bottom:4px;
 cursor:pointer;font-weight:bold
}
.nav:hover,.nav.active{background:#dbeafe;color:#1877f2}
.main{max-width:700px;width:100%;margin:auto;padding:10px}
.rightbar{padding:15px}
.card{
 background:#fff;border-radius:12px;padding:15px;
 margin-bottom:12px;box-shadow:0 1px 3px #ddd
}
.composer{
 display:flex;gap:10px;align-items:center
}
.composer button{
 flex:1;text-align:left;padding:12px 16px;
 border-radius:25px;background:#f0f2f5;color:#65676b
}
.primary{
 background:#1877f2!important;color:#fff!important;
 padding:10px 18px;border-radius:8px
}
.danger{background:#e41e3f!important;color:#fff!important}
.gray{background:#e4e6eb!important;color:#111!important}
.story-row{
 display:flex;gap:10px;overflow-x:auto;padding-bottom:5px
}
.story{
 min-width:105px;height:150px;border-radius:12px;
 overflow:hidden;position:relative;background:#ddd;
 cursor:pointer
}
.story img,.story video{
 width:100%;height:100%;object-fit:cover
}
.story-name{
 position:absolute;bottom:7px;left:7px;color:#fff;
 font-weight:bold;text-shadow:0 1px 3px #000
}
.post-head{display:flex;align-items:center;gap:10px}
.post-head .info{flex:1}
.name{font-weight:bold}
.time{font-size:12px;color:#65676b}
.post-text{margin:12px 0;white-space:pre-wrap;word-break:break-word}
.post-media{
 display:grid;gap:3px;margin:10px -15px
}
.post-media.one{grid-template-columns:1fr}
.post-media.two{grid-template-columns:1fr 1fr}
.post-media img,.post-media video{
 width:100%;max-height:500px;object-fit:cover
}
.post-actions{
 display:flex;justify-content:space-between;
 border-top:1px solid #ddd;border-bottom:1px solid #ddd;
 margin-top:10px;padding:5px 0
}
.action{
 flex:1;padding:9px;border-radius:7px;background:transparent;
 color:#65676b;font-weight:bold
}
.action:hover{background:#f0f2f5}
.comments{margin-top:10px}
.comment{
 display:flex;gap:8px;margin:8px 0
}
.comment-body{
 background:#f0f2f5;border-radius:12px;padding:8px 12px;
 flex:1
}
.comment-input{
 display:flex;gap:5px;margin-top:8px
}
.comment-input input{
 flex:1;padding:10px;border-radius:20px;
 border:1px solid #ddd;outline:none
}
.modal{
 position:fixed;inset:0;background:#0008;
 display:none;align-items:center;justify-content:center;
 z-index:2000;padding:15px
}
.modal.show{display:flex}
.modal-box{
 background:#fff;width:100%;max-width:600px;
 max-height:90vh;overflow:auto;border-radius:15px;padding:20px
}
.modal-head{
 display:flex;justify-content:space-between;align-items:center;
 margin-bottom:15px
}
.close{font-size:25px;background:none}
.field{margin-bottom:12px}
.field label{display:block;font-weight:bold;margin-bottom:5px}
.field input,.field textarea,.field select{
 width:100%;padding:11px;border:1px solid #ddd;
 border-radius:8px;outline:none
}
.field textarea{min-height:100px;resize:vertical}
.login{
 min-height:100vh;display:flex;align-items:center;
 justify-content:center;padding:20px
}
.login-box{width:100%;max-width:400px}
.login-logo{text-align:center;color:#1877f2;font-size:36px;font-weight:bold;margin-bottom:20px}
.login-box input{
 width:100%;padding:14px;margin-bottom:10px;
 border:1px solid #ddd;border-radius:8px
}
.login-box button{width:100%;padding:13px;margin-top:5px;border-radius:8px}
.profile-cover{
 height:230px;border-radius:12px 12px 0 0;
 background:#1877f2 center/cover no-repeat;
 position:relative
}
.profile-info{
 padding:0 20px 20px;position:relative
}
.profile-avatar{
 width:120px;height:120px;border:5px solid #fff;
 border-radius:50%;object-fit:cover;margin-top:-60px;
 background:#1877f2
}
.profile-buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.stats{display:flex;gap:25px;margin-top:15px}
.stat b{display:block;font-size:20px}
.page-title{font-size:25px;font-weight:bold;margin:10px 0 15px}
.people{display:flex;align-items:center;gap:10px;padding:10px 0}
.people .grow{flex:1}
.chat-layout{
 display:grid;grid-template-columns:220px 1fr;
 min-height:550px;border:1px solid #ddd;border-radius:10px;
 overflow:hidden
}
.chat-list{border-right:1px solid #ddd;overflow:auto}
.chat-user{padding:12px;cursor:pointer}
.chat-user:hover{background:#f0f2f5}
.chat-window{display:flex;flex-direction:column}
.chat-messages{flex:1;padding:15px;overflow:auto}
.message{
 max-width:70%;padding:9px 12px;border-radius:15px;
 margin:6px 0;background:#e4e6eb
}
.message.mine{margin-left:auto;background:#1877f2;color:white}
.chat-send{display:flex;padding:10px;border-top:1px solid #ddd;gap:5px}
.chat-send input{flex:1;padding:11px;border:1px solid #ddd;border-radius:20px}
.reel{
 background:#000;border-radius:12px;margin-bottom:15px;
 overflow:hidden;color:#fff
}
.reel video{width:100%;max-height:650px;display:block}
.reel-info{padding:12px}
.reaction-menu{
 display:none;position:absolute;background:#fff;
 padding:8px;border-radius:20px;box-shadow:0 2px 10px #999;
 z-index:50
}
.reaction-menu button{
 background:none;font-size:23px;padding:4px
}
.menu{position:relative}
.menu-box{
 display:none;position:absolute;right:0;top:35px;
 background:#fff;box-shadow:0 2px 10px #aaa;
 border-radius:10px;z-index:100;width:180px
}
.menu-box.show{display:block}
.menu-box button{
 display:block;width:100%;padding:11px;text-align:left;background:#fff
}
.menu-box button:hover{background:#f0f2f5}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat-card{text-align:center}
.stat-card strong{font-size:28px;color:#1877f2}
.loading{text-align:center;padding:25px;color:#777}
.empty{text-align:center;padding:30px;color:#777}
.mobile-nav{
 display:none;position:fixed;bottom:0;left:0;right:0;
 height:60px;background:#fff;border-top:1px solid #ddd;
 z-index:1000;justify-content:space-around
}
.mobile-nav button{background:none;font-size:20px}
.dark{background:#18191a;color:#e4e6eb}
.dark .card,.dark .topbar,.dark .mobile-nav,.dark .modal-box{
 background:#242526;color:#e4e6eb
}
.dark .search,.dark input,.dark textarea,.dark select{
 background:#3a3b3c;color:#fff;border-color:#555
}
.dark .action{color:#ddd}
.dark .comment-body,.dark .gray{background:#3a3b3c!important;color:#fff!important}
.dark .menu-box,.dark .menu-box button{background:#242526;color:#fff}
.dark .menu-box button:hover{background:#3a3b3c}
@media(max-width:1000px){
 .layout{grid-template-columns:210px 1fr}
 .rightbar{display:none}
}
@media(max-width:700px){
 .topbar{height:55px}
 .logo{font-size:21px}
 .search{display:none}
 .layout{display:block;padding-top:60px;padding-bottom:65px}
 .sidebar{display:none}
 .main{padding:7px}
 .mobile-nav{display:flex}
 .grid{grid-template-columns:1fr}
 .chat-layout{grid-template-columns:1fr}
 .chat-list{display:none}
 .profile-cover{height:180px}
}
</style>
</head>

<body>

<div id="app"></div>

<!-- MODAL -->
<div class="modal" id="modal">
 <div class="modal-box">
  <div class="modal-head">
   <h2 id="modalTitle">Modal</h2>
   <button class="close" onclick="closeModal()">×</button>
  </div>
  <div id="modalBody"></div>
 </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://skereuaizdczbvjplisi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_3R2otJA1zIlsMsTYxe1ocw_NAPY5O9x";

const sb = supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

let user=null;
let profile=null;
let currentPage="home";
let currentChatUser=null;
let selectedPost=null;
let searchTimer=null;

/* =========================
   HELPERS
========================= */

function esc(v){
 if(v===null || v===undefined)return "";
 return String(v)
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
}

function avatarFallback(name){
 return "https://ui-avatars.com/api/?name="+
 encodeURIComponent(name||"User")+
 "&background=1877f2&color=fff";
}

function toast(msg){
 alert(msg);
}

function openModal(title,html){
 document.getElementById("modalTitle").innerText=title;
 document.getElementById("modalBody").innerHTML=html;
 document.getElementById("modal").classList.add("show");
}

function closeModal(){
 document.getElementById("modal").classList.remove("show");
}

function timeAgo(date){
 let d=new Date(date);
 let sec=Math.floor((Date.now()-d)/1000);
 if(sec<60)return "এইমাত্র";
 if(sec<3600)return Math.floor(sec/60)+" মিনিট আগে";
 if(sec<86400)return Math.floor(sec/3600)+" ঘণ্টা আগে";
 if(sec<604800)return Math.floor(sec/86400)+" দিন আগে";
 return d.toLocaleDateString("bn-BD");
}

function formatNumber(n){
 n=Number(n||0);
 if(n>=1000000)return (n/1000000).toFixed(1)+"M";
 if(n>=1000)return (n/1000).toFixed(1)+"K";
 return n.toString();
}

/* =========================
   AUTH
========================= */

async function start(){
 const {data}=await sb.auth.getSession();

 if(data.session){
  user=data.session.user;
  await startApp();
 }else{
  showLogin();
 }

 sb.auth.onAuthStateChange(async(event,session)=>{
  if(session && !user){
   user=session.user;
   await startApp();
  }
 });
}

function showLogin(){
 document.getElementById("app").innerHTML=`
 <div class="login">
  <div class="login-box card">
   <div class="login-logo">My Social App</div>

   <input id="loginEmail"
    type="email"
    placeholder="Email">

   <input id="loginPassword"
    type="password"
    placeholder="Password">

   <button class="primary" onclick="login()">
    Login
   </button>

   <button class="gray" onclick="showRegister()">
    Create new account
   </button>

   <p id="loginMsg" style="text-align:center;margin-top:10px;color:red"></p>
  </div>
 </div>`;
}

function showRegister(){
 document.getElementById("app").innerHTML=`
 <div class="login">
  <div class="login-box card">
   <div class="login-logo">My Social App</div>

   <input id="regName" placeholder="Your name">

   <input id="regEmail"
    type="email"
    placeholder="Email">

   <input id="regPassword"
    type="password"
    placeholder="Password">

   <button class="primary" onclick="register()">
    Create Account
   </button>

   <button class="gray" onclick="showLogin()">
    Already have an account? Login
   </button>

   <p id="regMsg"
    style="text-align:center;margin-top:10px;color:red"></p>
  </div>
 </div>`;
}

async function login(){
 const email=document.getElementById("loginEmail").value.trim();
 const password=document.getElementById("loginPassword").value;

 if(!email||!password){
  document.getElementById("loginMsg").innerText=
   "Email ও Password দিন";
  return;
 }

 const {data,error}=await sb.auth.signInWithPassword({
  email,password
 });

 if(error){
  document.getElementById("loginMsg").innerText=error.message;
  return;
 }

 user=data.user;
 await startApp();
}

async function register(){
 const name=document.getElementById("regName").value.trim();
 const email=document.getElementById("regEmail").value.trim();
 const password=document.getElementById("regPassword").value;

 if(!name||!email||!password){
  document.getElementById("regMsg").innerText=
   "সব তথ্য পূরণ করুন";
  return;
 }

 const {data,error}=await sb.auth.signUp({
  email,password
 });

 if(error){
  document.getElementById("regMsg").innerText=error.message;
  return;
 }

 if(data.user){
  await sb.from("profiles").upsert({
   id:data.user.id,
   name:name,
   bio:"",
   role:"user",
   last_seen:new Date().toISOString()
  });

  alert("Account তৈরি হয়েছে। Email verification প্রয়োজন হলে email verify করুন।");
  showLogin();
 }
}

async function logout(){
 await sb.auth.signOut();
 user=null;
 profile=null;
 showLogin();
}

/* =========================
   PROFILE
========================= */

async function ensureProfile(){
 let {data}=await sb.from("profiles")
  .select("*")
  .eq("id",user.id)
  .maybeSingle();

 if(!data){
  await sb.from("profiles").insert({
   id:user.id,
   name:user.email?.split("@")[0]||"User",
   role:"user"
  });

  let r=await sb.from("profiles")
   .select("*")
   .eq("id",user.id)
   .single();

  data=r.data;
 }

 profile=data;
}

async function heartbeat(){
 if(!user)return;

 await sb.from("profiles")
  .update({
   last_seen:new Date().toISOString()
  })
  .eq("id",user.id);
}

setInterval(heartbeat,30000);

/* =========================
   APP SHELL
========================= */

async function startApp(){
 await ensureProfile();

 document.getElementById("app").innerHTML=`
 <header class="topbar">

  <div class="logo" onclick="openPage('home')">
   My Social
  </div>

  <input class="search"
   placeholder="Search..."
   oninput="liveSearch(this.value)">

  <div class="top-right">

   <button class="icon-btn"
    onclick="openPage('messenger')">
    💬
    <span id="msgBadge" class="badge" style="display:none">0</span>
   </button>

   <button class="icon-btn"
    onclick="openPage('notifications')">
    🔔
    <span id="notiBadge" class="badge" style="display:none">0</span>
   </button>

   <img class="avatar"
    src="${esc(profile.profile_photo||avatarFallback(profile.name))}"
    onclick="openPage('profile')">

   <button class="gray"
    style="padding:8px 12px;border-radius:8px"
    onclick="logout()">
    Logout
   </button>

  </div>
 </header>

 <div class="layout">

  <aside class="sidebar">
   ${navHTML()}
  </aside>

  <main class="main" id="main"></main>

  <aside class="rightbar" id="rightbar"></aside>

 </div>

 <nav class="mobile-nav">
  <button onclick="openPage('home')">🏠</button>
  <button onclick="openPage('friends')">👥</button>
  <button onclick="openPage('reels')">🎬</button>
  <button onclick="openPage('messenger')">💬</button>
  <button onclick="openPage('profile')">👤</button>
 </nav>
 `;

 await openPage("home");
 updateBadges();
 subscribeRealtime();
}

function navHTML(){
 return `
 <div class="nav active" onclick="openPage('home')">🏠 Home</div>
 <div class="nav" onclick="openPage('profile')">👤 Profile</div>
 <div class="nav" onclick="openPage('friends')">👥 Friends</div>
 <div class="nav" onclick="openPage('messenger')">💬 Messenger</div>
 <div class="nav" onclick="openPage('notifications')">🔔 Notifications</div>
 <div class="nav" onclick="openPage('reels')">🎬 Reels</div>
 <div class="nav" onclick="openPage('saved')">🔖 Saved</div>
 <div class="nav" onclick="openPage('trending')">🔥 Trending</div>
 <div class="nav" onclick="openPage('earnings')">💰 Earnings</div>
 <div class="nav" onclick="openPage('settings')">⚙️ Settings</div>
 ${profile?.role==="admin"?
 `<div class="nav" onclick="openPage('admin')">🛡️ Admin Panel</div>`:""}
 `;
}

/* =========================
   PAGE ROUTER
========================= */

async function openPage(page){
 currentPage=page;

 document.querySelectorAll(".nav")
 .forEach(x=>x.classList.remove("active"));

 document.getElementById("main").innerHTML=
 `<div class="loading">Loading...</div>`;

 if(page==="home")await renderHome();
 if(page==="profile")await renderProfile(user.id);
 if(page==="friends")await renderFriends();
 if(page==="messenger")await renderMessenger();
 if(page==="notifications")await renderNotifications();
 if(page==="reels")await renderReels();
 if(page==="saved")await renderSaved();
 if(page==="trending")await renderTrending();
 if(page==="earnings")await renderEarnings();
 if(page==="settings")await renderSettings();
 if(page==="admin")await renderAdmin();
}

/* =========================
   HOME
========================= */

async function renderHome(){

 let stories=await loadStories();

 document.getElementById("main").innerHTML=`
 <div class="card">
  <div class="story-row">
   <div class="story" onclick="openStoryModal()">
    <div style="height:100%;display:flex;align-items:center;
    justify-content:center;font-size:40px;background:#1877f2;color:#fff">
     +
    </div>
    <div class="story-name">Add Story</div>
   </div>

   ${stories}
  </div>
 </div>

 <div class="card composer">
  <img class="avatar"
   src="${esc(profile.profile_photo||avatarFallback(profile.name))}">
  <button onclick="openPostModal()">
   ${esc(profile.name)}, What's on your mind?
  </button>
 </div>

 <div id="feed">
  <div class="loading">Loading posts...</div>
 </div>
 `;

 await loadFeed();
}

async function loadFeed(){
 let {data:posts,error}=await sb.from("posts")
  .select("*")
  .order("created_at",{ascending:false})
  .limit(30);

 if(error){
  document.getElementById("feed").innerHTML=
   `<div class="card">${esc(error.message)}</div>`;
  return;
 }

 if(!posts?.length){
  document.getElementById("feed").innerHTML=
   `<div class="card empty">কোনো পোস্ট নেই। প্রথম পোস্টটি করুন।</div>`;
  return;
 }

 let ids=[...new Set(posts.map(p=>p.user_id))];

 let {data:profiles}=await sb.from("profiles")
  .select("*")
  .in("id",ids);

 let map={};
 (profiles||[]).forEach(p=>map[p.id]=p);

 let html="";

 for(const p of posts){
  html+=await postHTML(p,map[p.user_id]);
 }

 document.getElementById("feed").innerHTML=html;
}

/* =========================
   POST HTML
========================= */

async function postHTML(post,author){

 let {data:media}=await sb.from("post_media")
  .select("*")
  .eq("post_id",post.id)
  .order("sort_order");

 let {data:reactions}=await sb.from("post_reactions")
  .select("reaction,user_id")
  .eq("post_id",post.id);

 let {count:commentsCount}=await sb.from("comments",{
 }).select("*",{count:"exact",head:true})
 .eq("post_id",post.id);

 let myReaction=(reactions||[])
  .find(x=>x.user_id===user.id)?.reaction;

 let reactionCount=(reactions||[]).length;

 let mediaHTML="";

 if(media?.length){
  mediaHTML=media.map(m=>{
   if(m.media_type==="video"){
    return `<video controls src="${esc(m.media_url)}"></video>`;
   }

   return `<img src="${esc(m.media_url)}"
    onclick="viewMedia('${esc(m.media_url)}')">`;
  }).join("");
 }else if(post.image_url){
  mediaHTML=`<img src="${esc(post.image_url)}">`;
 }

 let menu=`
 <div class="menu">
  <button class="icon-btn"
   onclick="toggleMenu(${post.id})">⋯</button>

  <div class="menu-box" id="menu-${post.id}">
   <button onclick="savePost(${post.id})">🔖 Save</button>
   <button onclick="copyPost(${post.id})">🔗 Copy link</button>
   <button onclick="pinPost(${post.id})">📌 Pin</button>
   <button onclick="reportPost(${post.id})">🚩 Report</button>
   ${
    post.user_id===user.id || profile.role==="admin"
    ?`<button onclick="deletePost(${post.id})">🗑️ Delete</button>`
    :""
   }
  </div>
 </div>`;

 return `
 <article class="card" id="post-${post.id}">

  <div class="post-head">

   <img class="avatar"
    src="${esc(author?.profile_photo||avatarFallback(author?.name))}"
    onclick="renderProfile('${post.user_id}')">

   <div class="info">
    <div class="name">
     ${esc(author?.name||"User")}
     ${author?.verified?`<span title="Verified">🔵</span>`:""}
    </div>
    <div class="time">${timeAgo(post.created_at)}</div>
   </div>

   ${menu}

  </div>

  ${post.privacy==="friends"?
   `<small>👥 Friends</small>`:""}

  ${post.feeling?

async function uploadFile(file){

 let ext=file.name.split(".").pop();
 let path=
  user.id+"/"+Date.now()+"-"+Math.random()
  .toString(36).slice(2)+"."+ext;

 let {error}=await sb.storage
  .from("media")
  .upload(path,file,{
   upsert:false,
   contentType:file.type
  });

 if(error)throw error;

 let {data}=sb.storage
  .from("media")
  .getPublicUrl(path);

 return data.publicUrl;
}

async function createPost(){

 let text=document.getElementById("postText").value.trim();
 let files=[...document.getElementById("postFiles").files];

 let privacy=document.getElementById("postPrivacy").value;
 let feeling=document.getElementById("postFeeling").value.trim();
 let location=document.getElementById("postLocation").value.trim();

 if(!text && !files.length){
  toast("Post-এর জন্য লেখা বা ছবি/ভিডিও দিন");
  return;
 }

 let {data:post,error}=await sb.from("posts")
  .insert({
   user_id:user.id,
   text:text,
   privacy,
   feeling,
   location,
   image_url:""
  })
  .select()
  .single();

 if(error){
  toast(error.message);
  return;
 }

 for(let i=0;i<files.length;i++){

  try{
   let url=await uploadFile(files[i]);

   await sb.from("post_media").insert({
    post_id:post.id,
    media_url:url,
    media_type:files[i].type.startsWith("video")
     ?"video":"image",
    sort_order:i
   });

  }catch(e){
   toast("File upload error: "+e.message);
  }
 }

 closeModal();
 await openPage("home");
}

   onclick="startChat('${id}')">

   <img class="avatar"
    style="vertical-align:middle"
    src="${esc(map[id]?.profile_photo||avatarFallback(map[id]?.name))}">

   <b>${esc(map[id]?.name||"User")}</b>
  </div>
 `).join("");
}

async function startChat(id){

 currentChatUser=id;

 if(currentPage!=="messenger"){
  await openPage("messenger");
 }

 let {data:p}=await sb.from("profiles")
  .select("*").eq("id",id).single();

 document.getElementById("chatTitle").innerHTML=`
  <b>${esc(p?.name||"User")}</b>
  <small style="color:#777"> ● Online system</small>
 `;

 await loadChat();

 await sb.from("messages")
  .update({seen:true})
  .eq("receiver_id",user.id)
  .eq("sender_id",id);
}

async function loadChat(){

 if(!currentChatUser)return;

 let {data}=await sb.from("messages")
  .select("*")
  .or(
   `and(sender_id.eq.${user.id},receiver_id.eq.${currentChatUser}),`+
   `and(sender_id.eq.${currentChatUser},receiver_id.eq.${user.id})`
  )
  .order("created_at",{ascending:true});

 document.getElementById("chatMessages").innerHTML=
 (data||[]).map(m=>`
  <div class="message ${m.sender_id===user.id?"mine":""}">
   ${esc(m.text)}
   <div style="font-size:10px;opacity:.7">
    ${timeAgo(m.created_at)}
    ${m.sender_id===user.id?(m.seen?" ✓✓":" ✓"):""}
   </div>
  </div>
 `).join("") ||
 `<div class="empty">No messages</div>`;

 let box=document.getElementById("chatMessages");
 box.scrollTop=box.scrollHeight;
}

async function sendMessage(){

 if(!currentChatUser)return;

 let input=document.getElementById("chatInput");
 let text=input.value.trim();

 if(!text)return;

 let {error}=await sb.from("messages").insert({
  sender_id:user.id,
  receiver_id:currentChatUser,
  text,
  seen:false
 });

 if(error){
  toast(error.message);
  return;
 }

 input.value="";
 await loadChat();

 await createNotification(
  currentChatUser,
  `${profile.name} আপনাকে একটি message পাঠিয়েছে`
 );
}

/* =========================
   NOTIFICATIONS
========================= */

async function createNotification(receiver,text){

 if(receiver===user.id)return;

 await sb.from("notifications").insert({
  receiver_id:receiver,
  text,
  read:false
 });
}

async function renderNotifications(){

 document.getElementById("main").innerHTML=`
 <div class="page-title">🔔 Notifications</div>
 <div id="notifications" class="loading">
  Loading...
 </div>
 `;

 let {data}=await sb.from("notifications")
  .select("*")
  .eq("receiver_id",user.id)
  .order("created_at",{ascending:false})
  .limit(100);

 document.getElementById("notifications").innerHTML=
 (data||[]).map(n=>`
 <div class="card"
  style="${n.read?"":"border-left:4px solid #1877f2"}"
  onclick="readNotification(${n.id})">

  <b>${n.read?"":"🔵 "}</b>
  ${esc(n.text)}

  <small style="display:block;color:#777;margin-top:5px">
   ${timeAgo(n.created_at)}
  </small>
 </div>
 `).join("") ||
 `<div class="card empty">No notifications</div>`;

 await sb.from("notifications")
  .update({read:true})
  .eq("receiver_id",user.id)
  .eq("read",false);

 updateBadges();
}

async function readNotification(id){

 await sb.from("notifications")
  .update({read:true})
  .eq("id",id);

 renderNotifications();
}

async function updateBadges(){

 let {count:noti}=await sb.from("notifications")
  .select("*",{count:"exact",head:true})
  .eq("receiver_id",user.id)
  .eq("read",false);

 let n=document.getElementById("notiBadge");

 if(n){
  n.innerText=noti||0;
  n.style.display=noti?"block":"none";
 }

 let {count:msg}=await sb.from("messages")
  .select("*",{count:"exact",head:true})
  .eq("receiver_id",user.id)
  .eq("seen",false);

 let m=document.getElementById("msgBadge");

 if(m){
  m.innerText=msg||0;
  m.style.display=msg?"block":"none";
 }
}

========================= */

async function renderReels(){

 document.getElementById("main").innerHTML=`
 <div class="page-title">🎬 Reels</div>

 <div class="card">
  <button class="primary"
   onclick="openReelModal()">
   + Upload Reel
  </button>
 </div>

 <div id="reelsList">
  <div class="loading">Loading...</div>
 </div>
 `;

 let {data}=await sb.from("reels")
  .select("*")
  .order("created_at",{ascending:false})
  .limit(30);

 let ids=[...new Set((data||[]).map(x=>x.user_id))];

 let {data:ps}=await sb.from("profiles")
  .select("*")
  .in("id",ids.length?ids:["00000000-0000-0000-0000-000000000000"]);

 let map={};
 (ps||[]).forEach(p=>map[p.id]=p);

 document.getElementById("reelsList").innerHTML=
 (data||[]).map(r=>`
 <div class="reel">

  <video
   src="${esc(r.video_url)}"
   controls
   playsinline
   loop
   onplay="reelView(${r.id})">
  </video>

  <div class="reel-info">

   ${map[r.user_id]?.verified?"🔵":""}

   <div style="margin-top:5px">
    ${esc(r.caption||"")}

}

function openReelModal(){

 openModal("Upload Reel",`
  <div class="field">
   <input id="reelFile"
    type="file"
    accept="video/*">
  </div>

  <div class="field">
   <textarea id="reelCaption"
    placeholder="Caption"></textarea>
  </div>

  <button class="primary"
   onclick="uploadReel()">
   Upload
  </button>
 `);
}

async function uploadReel(){

 let file=document.getElementById("reelFile").files[0];

 if(!file){
  toast("Video নির্বাচন করুন");
  return;
 }

 try{
  let url=await uploadFile(file);

  let {error}=await sb.from("reels").insert({
   user_id:user.id,
   video_url:url,
   caption:document.getElementById("reelCaption").value,
   views:0
  });

  if(error)throw error;

  closeModal();
  await renderReels();

 }catch(e){
  toast(e.message);
 }
}

async function reelView(id){

 try{
  await sb.rpc("increment_reel_view",{
   p_reel_id:id
  });
 }catch(e){}
}

function toggleDark(){
 document.body.classList.toggle("dark");
 localStorage.setItem(
  "dark",
  document.body.classList.contains("dark")
 );
}

function loadDark(){
 if(localStorage.getItem("dark")==="true"){
  document.body.classList.add("dark");
 }
}

async function changePassword(){

 let p=prompt("New password:");

 if(!p)return;

 if(p.length<6){
  toast("Password কমপক্ষে 6 characters");
  return;
 }

 let {error}=await sb.auth.updateUser({
  password:p
 });

 if(error)toast(error.message);
 else toast("Password changed");
}

async function deleteAccount(){

 if(!confirm(
  "Account delete করার পর data হারাতে পারেন। Continue?"
 ))return;

 toast(
  "নিরাপত্তার কারণে account deletion server-side admin function দিয়ে করা উচিত।"
 );
}

async function renderAdmin(){

  return;
 }

 let {count:users}=await sb.from("profiles")
  .select("*",{count:"exact",head:true});

 let {count:posts}=await sb.from("posts")
  .select("*",{count:"exact",head:true});

 let {count:reports}=await sb.from("reports")
  .select("*",{count:"exact",head:true});

 let {count:reels}=await sb.from("reels")
  .select("*",{count:"exact",head:true});

 document.getElementById("main").innerHTML=`
 <div class="page-title">🛡️ Admin Panel</div>

 <div class="grid">

  <div class="card stat-card">
   <div>Users</div>

  </div>

  <div class="card stat-card">
   <div>Posts</div>
   <strong>${posts||0}</strong>
  </div>

  <div class="card stat-card">

   <strong>${reels||0}</strong>
  </div>

  <div class="card stat-card">

   <strong>${reports||0}</strong>
  </div>

 </div>

 <div class="card">
  <h3>Reports</h3>
  <br>
  <div id="adminReports">Loading...</div>
 </div>
 `;

 let {data}=await sb.from("reports")
  .select("*")
  .order("created_at",{ascending:false})
  .limit(100);

 document.getElementById("adminReports").innerHTML=
 (data||[]).map(r=>`
  <div style="padding:12px;border-bottom:1px solid #ddd">

   <b>Report #${r.id}</b>

   <div>Reason: ${esc(r.reason)}</div>
   <div>Status: ${esc(r.status||"pending")}</div>

   ${r.post_id?
    `<button class="danger"
     style="margin-top:7px;padding:7px"
     onclick="adminDeletePost(${r.post_id},${r.id})">
     Delete Post
    </button>`:""}

  </div>
 `).join("") ||
 `<div class="empty">No reports</div>`;
}

async function adminDeletePost(postId,reportId){

 if(profile.role!=="admin")return;

 if(!confirm("Post delete করবেন?"))return;

 let {error}=await sb.from("posts")
  .delete().eq("id",postId);

 if(error){
  toast(error.message);
  return;
 }

 await sb.from("reports")
  .update({status:"resolved"})
  .eq("id",reportId);

 await renderAdmin();
}

   SEARCH
========================= */

function liveSearch(q){

 clearTimeout(searchTimer);

 q=q.trim();

 if(!q)return;

 searchTimer=setTimeout(()=>{
  searchUsers(q);
 },400);
}

async function searchUsers(q){

 let {data}=await sb.from("profiles")
  .select("*")
  .ilike("name","%"+q+"%")
  .limit(20);

 openModal("Search Results",
  (data||[]).map(p=>`
   <div class="people">

    <img class="avatar"
     src="${esc(p.profile_photo||avatarFallback(p.name))}">

    <div class="grow">
     <b>${esc(p.name)}</b>
     <small style="display:block">
      ${esc(p.bio||"")}
     </small>
    </div>

    <button class="primary"
     onclick="closeModal();renderProfile('${p.id}')">
     View
    </button>

   </div>
  `).join("")||
  `<div class="empty">No results</div>`
 );
}

/* =========================
   REALTIME
========================= */

function subscribeRealtime(){

 try{

  sb.channel("social-realtime")
   .on(
    "postgres_changes",
    {
     event:"INSERT",
     schema:"public",
     table:"messages"
    },
    async payload=>{

     if(
      payload.new.receiver_id===user.id ||
      payload.new.sender_id===user.id
     ){

      updateBadges();

      if(
       currentPage==="messenger" &&
       currentChatUser &&
       (
        payload.new.sender_id===currentChatUser ||
        payload.new.receiver_id===currentChatUser
       )
      ){
       loadChat();
      }
     }
    }
   )
   .on(
    "postgres_changes",
    {
     event:"INSERT",
     schema:"public",
     table:"notifications"
    },
    payload=>{
     if(payload.new.receiver_id===user.id){
      updateBadges();
     }
    }
   )
   .subscribe();

 }catch(e){
  console.log(e);
 }
}

start();
