<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<meta name="theme-color" content="#1877f2">

<title>My Social App</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  background:#f0f2f5;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  color:#111;
}

body{
  overflow-x:hidden;
}

button{
  font-family:inherit;
  cursor:pointer;
  border:0;
}

.app{
  min-height:100vh;
}

/* HEADER */

.header{
  position:sticky;
  top:0;
  z-index:1000;
  height:58px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px;
  box-shadow:0 1px 5px rgba(0,0,0,.12);
}

.logo{
  color:#1877f2;
  font-size:25px;
  font-weight:800;
}

.header-right{
  display:flex;
  gap:8px;
}

.header-btn{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#f0f2f5;
  font-size:19px;
}

/* NAV */

.nav{
  position:sticky;
  top:58px;
  z-index:900;
  height:50px;
  background:#fff;
  border-bottom:1px solid #ddd;
  display:flex;
}

.nav button{
  flex:1;
  background:#fff;
  font-size:14px;
  font-weight:bold;
  color:#555;
}

.nav button.active{
  color:#1877f2;
  border-bottom:3px solid #1877f2;
}

/* PAGE */

.page{
  max-width:700px;
  margin:auto;
  padding-bottom:80px;
}

/* POST BOX */

.create-post{
  background:#fff;
  margin:10px;
  border-radius:10px;
  padding:12px;
  box-shadow:0 1px 3px rgba(0,0,0,.12);
}

.create-row{
  display:flex;
  gap:10px;
  align-items:center;
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#1877f2;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  overflow:hidden;
  flex-shrink:0;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.fake-input{
  flex:1;
  background:#f0f2f5;
  border-radius:22px;
  padding:11px 15px;
  color:#65676b;
  cursor:pointer;
}

/* POST */

.post{
  background:#fff;
  margin:10px;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 1px 3px rgba(0,0,0,.12);
}

.post-head{
  display:flex;
  gap:10px;
  padding:12px;
  align-items:center;
}

.post-user{
  font-weight:bold;
}

.post-time{
  font-size:12px;
  color:#777;
  margin-top:3px;
}

.post-caption{
  padding:0 12px 12px;
  white-space:pre-wrap;
  line-height:1.45;
}

.post-image{
  width:100%;
  display:block;
  max-height:600px;
  object-fit:cover;
}

.post-stats{
  padding:9px 12px;
  display:flex;
  justify-content:space-between;
  color:#666;
  font-size:14px;
  border-bottom:1px solid #eee;
}

.actions{
  display:flex;
}

.action{
  flex:1;
  padding:11px 5px;
  background:#fff;
  color:#65676b;
  font-weight:bold;
  font-size:14px;
}

.action.liked{
  color:#1877f2;
}

.action:active{
  background:#f0f2f5;
}

/* COMMENTS */

.comments{
  padding:8px 12px 12px;
  border-top:1px solid #eee;
  display:none;
}

.comments.show{
  display:block;
}

.comment{
  background:#f0f2f5;
  border-radius:14px;
  padding:8px 11px;
  margin:6px 0;
  font-size:14px;
}

.comment strong{
  display:block;
  margin-bottom:2px;
}

.comment-form{
  display:flex;
  gap:7px;
  margin-top:8px;
}

.comment-form input{
  flex:1;
  border:1px solid #ddd;
  border-radius:20px;
  padding:10px 13px;
  outline:none;
}

.comment-form button{
  background:#1877f2;
  color:#fff;
  padding:0 15px;
  border-radius:20px;
}

/* REELS */

.reels-page{
  display:none;
  background:#000;
  position:fixed;
  top:108px;
  left:0;
  right:0;
  bottom:0;
  z-index:800;
  overflow-y:auto;
  scroll-snap-type:y mandatory;
}

.reel{
  position:relative;
  width:100%;
  height:calc(100vh - 108px);
  background:#000;
  scroll-snap-align:start;
  overflow:hidden;
}

.reel video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.reel-overlay{
  position:absolute;
  inset:0;
  pointer-events:none;
}

.reel-info{
  position:absolute;
  left:15px;
  right:85px;
  bottom:25px;
  color:#fff;
  pointer-events:auto;
}

.reel-user{
  font-size:17px;
  font-weight:bold;
  margin-bottom:8px;
}

.reel-caption{
  font-size:14px;
  line-height:1.4;
}

.reel-actions{
  position:absolute;
  right:10px;
  bottom:25px;
  display:flex;
  flex-direction:column;
  gap:15px;
  align-items:center;
  pointer-events:auto;
}

.reel-action{
  width:52px;
  height:52px;
  border-radius:50%;
  background:rgba(0,0,0,.45);
  color:#fff;
  font-size:21px;
}

.reel-count{
  color:#fff;
  font-size:12px;
  margin-top:-10px;
}

.sound-btn{
  position:absolute;
  right:12px;
  top:15px;
  width:44px;
  height:44px;
  border-radius:50%;
  background:rgba(0,0,0,.5);
  color:#fff;
  font-size:20px;
  z-index:5;
}

/* PROFILE */

.profile{
  display:none;
  background:#fff;
  margin:10px;
  border-radius:10px;
  overflow:hidden;
}

.cover{
  height:180px;
  background:linear-gradient(135deg,#1877f2,#6a5cff);
}

.profile-body{
  padding:0 15px 20px;
  text-align:center;
}

.profile-avatar{
  width:90px;
  height:90px;
  border-radius:50%;
  background:#1877f2;
  border:5px solid #fff;
  margin:-45px auto 10px;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  font-weight:bold;
  overflow:hidden;
}

.profile-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile-name{
  font-size:22px;
  font-weight:bold;
}

.profile-stats{
  display:flex;
  justify-content:center;
  gap:30px;
  margin:15px 0;
}

.stat strong{
  display:block;
  font-size:18px;
}

.stat span{
  color:#777;
  font-size:13px;
}

/* MODAL */

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:2000;
  background:rgba(0,0,0,.6);
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal.show{
  display:flex;
}

.modal-box{
  background:#fff;
  width:100%;
  max-width:500px;
  border-radius:12px;
  padding:18px;
}

.modal-title{
  font-size:20px;
  font-weight:bold;
  margin-bottom:15px;
}

.modal textarea,
.modal input{
  width:100%;
  border:1px solid #ddd;
  border-radius:8px;
  padding:12px;
  margin-bottom:10px;
  outline:none;
  font-family:inherit;
}

.modal textarea{
  min-height:120px;
  resize:vertical;
}

.modal-actions{
  display:flex;
  gap:8px;
  justify-content:flex-end;
}

.cancel{
  background:#e4e6eb;
  padding:10px 18px;
  border-radius:7px;
}

.primary{
  background:#1877f2;
  color:#fff;
  padding:10px 18px;
  border-radius:7px;
}

/* LOGIN */

.login{
  min-height:100vh;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:#f0f2f5;
}

.login-box{
  width:100%;
  max-width:400px;
  background:#fff;
  padding:25px;
  border-radius:12px;
  box-shadow:0 3px 15px rgba(0,0,0,.12);
}

.login-title{
  text-align:center;
  color:#1877f2;
  font-size:30px;
  font-weight:bold;
  margin-bottom:25px;
}

.login-box input{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:7px;
  margin-bottom:10px;
  outline:none;
}

.login-btn{
  width:100%;
  padding:13px;
  background:#1877f2;
  color:#fff;
  border-radius:7px;
  font-size:16px;
  font-weight:bold;
}

.register-btn{
  width:100%;
  padding:13px;
  background:#42b72a;
  color:#fff;
  border-radius:7px;
  margin-top:10px;
  font-weight:bold;
}

.message{
  text-align:center;
  margin-top:10px;
  font-size:14px;
}

/* EMPTY */

.empty{
  text-align:center;
  padding:50px 20px;
  color:#777;
}

/* MOBILE */

@media(max-width:600px){
  .page{
    width:100%;
  }

  .post{
    margin:7px 0;
    border-radius:0;
  }

  .create-post{
    margin:7px 0;
    border-radius:0;
  }

  .profile{
    margin:7px 0;
    border-radius:0;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="login">

  <div class="login-box">

    <div class="login-title">
      My Social App
    </div>

    <input
      id="loginEmail"
      type="email"
      placeholder="Email">

    <input
      id="loginPassword"
      type="password"
      placeholder="Password">

    <button
      class="login-btn"
      onclick="login()">
      Login
    </button>

    <button
      class="register-btn"
      onclick="showRegister()">
      Create new account
    </button>

    <div id="loginMessage" class="message"></div>

  </div>

</div>


<!-- MAIN APP -->
<div id="app" class="app">

  <!-- HEADER -->
  <header class="header">

    <div class="logo">
      My Social
    </div>

    <div class="header-right">

      <button
        class="header-btn"
        onclick="openPostModal()">
        ＋
      </button>

      <button
        class="header-btn"
        onclick="logout()">
        ⇥
      </button>

    </div>

  </header>


  <!-- NAV -->
  <nav class="nav">

    <button
      id="homeNav"
      class="active"
      onclick="showHome()">
      🏠 Home
    </button>

    <button
      id="reelsNav"
      onclick="showReels()">
      ▶ Reels
    </button>

    <button
      id="profileNav"
      onclick="showProfile()">
      👤 Profile
    </button>

  </nav>


  <!-- HOME -->
  <main id="homePage" class="page">

    <div class="create-post">

      <div class="create-row">

        <div class="avatar" id="smallAvatar">
          F
        </div>

        <div
          class="fake-input"
          onclick="openPostModal()">
          What's on your mind?
        </div>

      </div>

    </div>

    <div id="feed"></div>

  </main>


  <!-- REELS -->
  <section id="reelsPage" class="reels-page">

    <div id="reelsContainer"></div>

  </section>


  <!-- PROFILE -->
  <section id="profilePage" class="profile">

    <div class="cover"></div>

    <div class="profile-body">

      <div
        class="profile-avatar"
        id="profileAvatar">
        F
      </div>

      <div
        class="profile-name"
        id="profileName">
        Ferdous
      </div>

      <div class="profile-stats">

        <div class="stat">
          <strong id="postCount">0</strong>
          <span>Posts</span>
        </div>

        <div class="stat">
          <strong id="followerCount">0</strong>
          <span>Followers</span>
        </div>

        <div class="stat">
          <strong id="followingCount">0</strong>
          <span>Following</span>
        </div>

      </div>

      <button
        class="primary"
        onclick="logout()">
        Logout
      </button>

    </div>

  </section>

</div>


<!-- POST MODAL -->
<div
  id="postModal"
  class="modal">

  <div class="modal-box">

    <div class="modal-title">
      Create Post
    </div>

    <textarea
      id="postText"
      placeholder="What's on your mind?"></textarea>

    <input
      id="postImage"
      type="text"
      placeholder="Image URL (optional)">

    <div class="modal-actions">

      <button
        class="cancel"
        onclick="closePostModal()">
        Cancel
      </button>

      <button
        class="primary"
        onclick="createPost()">
        Post
      </button>

    </div>

  </div>

</div>


<script>

/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
  "YOUR_SUPABASE_URL";

const SUPABASE_ANON_KEY =
  "YOUR_SUPABASE_ANON_KEY";


/* =====================================================
   APP STATE
===================================================== */

let currentUser = null;

let posts = [];

let reels = [];

let comments = {};

let likes = {};


/* =====================================================
   DEMO DATA
===================================================== */

const demoPosts = [

  {
    id:"post1",
    user:"Ferdous",
    caption:"Welcome to My Social App ❤️",
    image:"",
    likes:3,
    comments:[]
  },

  {
    id:"post2",
    user:"Ferdous",
    caption:"আমাদের নতুন Social App 🚀",
    image:"",
    likes:5,
    comments:[]
  }

];


const demoReels = [

  {
    id:"reel1",
    user:"Ferdous",
    caption:"Welcome to My Social App ❤️",
    video:"https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",
    likes:10
  },

  {
    id:"reel2",
    user:"Ferdous",
    caption:"Reels Test Video 🔥",
    video:"https://www.w3schools.com/html/mov_bbb.mp4",
    likes:7
  }

];


/* =====================================================
   START
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    loadLocalData();

    currentUser = JSON.parse(
      localStorage.getItem("my_social_user")
      || "null"
    );

    if(!currentUser){

      currentUser = {
        id:"local-user",
        name:"Ferdous",
        email:"demo@example.com"
      };

      localStorage.setItem(
        "my_social_user",
        JSON.stringify(currentUser)
      );

    }

    posts = JSON.parse(
      localStorage.getItem("my_social_posts")
      || "null"
    ) || demoPosts;

    reels = JSON.parse(
      localStorage.getItem("my_social_reels")
      || "null"
    ) || demoReels;

    updateUserUI();

    renderFeed();

    renderReels();

  }
);


/* =====================================================
   LOCAL STORAGE
===================================================== */

function loadLocalData(){

  comments =
    JSON.parse(
      localStorage.getItem("my_social_comments")
      || "{}"
    );

  likes =
    JSON.parse(
      localStorage.getItem("my_social_likes")
      || "{}"
    );

}


function saveData(){

  localStorage.setItem(
    "my_social_posts",
    JSON.stringify(posts)
  );

  localStorage.setItem(
    "my_social_comments",
    JSON.stringify(comments)
  );

  localStorage.setItem(
    "my_social_likes",
    JSON.stringify(likes)
  );

}


/* =====================================================
   USER UI
===================================================== */

function updateUserUI(){

  const name =
    currentUser?.name || "Ferdous";

  const first =
    name.charAt(0).toUpperCase();

  document.getElementById(
    "smallAvatar"
  ).textContent = first;

  document.getElementById(
    "profileAvatar"
  ).textContent = first;

  document.getElementById(
    "profileName"
  ).textContent = name;

  document.getElementById(
    "postCount"
  ).textContent = posts.length;

}


/* =====================================================
   FEED
===================================================== */

function renderFeed(){

  const feed =
    document.getElementById("feed");

  feed.innerHTML = "";

  if(posts.length === 0){

    feed.innerHTML =
      `<div class="empty">
        No posts yet.
      </div>`;

    return;

  }

  posts.forEach(post => {

    const postComments =
      comments[post.id] || [];

    const isLiked =
      likes[post.id] === true;

    const likeCount =
      Number(post.likes || 0)
      + (isLiked ? 1 : 0);

    const div =
      document.createElement("article");

    div.className = "post";

    div.innerHTML = `

      <div class="post-head">

        <div class="avatar">
          ${escapeHtml(
            (post.user || "F").charAt(0)
          )}
        </div>

        <div>
          <div class="post-user">
            ${escapeHtml(post.user || "User")}
          </div>

          <div class="post-time">
            Just now
          </div>
        </div>

      </div>

      <div class="post-caption">
        ${escapeHtml(post.caption || "")}
      </div>

      ${
        post.image
        ?
        `<img
          class="post-image"
          src="${escapeAttribute(post.image)}"
          onerror="this.style.display='none'">`
        :
        ""
      }

      <div class="post-stats">

        <span>
          ❤️ ${likeCount}
        </span>

        <span>
          ${postComments.length} comments
        </span>

      </div>

      <div class="actions">

        <button
          class="action ${isLiked ? "liked":""}"
          onclick="toggleLike('${post.id}')">

          ${isLiked ? "💙 Liked" : "❤️ Like"}

        </button>

        <button
          class="action"
          onclick="toggleComments('${post.id}')">

          💬 Comment

        </button>

        <button
          class="action"
          onclick="sharePost('${post.id}')">

          ↗ Share

        </button>

      </div>

      <div
        id="comments-${post.id}"
        class="comments">

        <div id="comment-list-${post.id}">

          ${renderCommentHTML(post.id)}

        </div>

        <div class="comment-form">

          <input
            id="comment-input-${post.id}"
            placeholder="Write a comment...">

          <button
            onclick="addComment('${post.id}')">

            Send

          </button>

        </div>

      </div>

    `;

    feed.appendChild(div);

  });

}


function renderCommentHTML(postId){

  const list =
    comments[postId] || [];

  if(list.length === 0){

    return `
      <div style="color:#777;font-size:13px">
        No comments yet.
      </div>
    `;

  }

  return list.map(c => `

    <div class="comment">

      <strong>
        ${escapeHtml(c.user)}
      </strong>

      ${escapeHtml(c.text)}

    </div>

  `).join("");

}


/* =====================================================
   LIKE
===================================================== */

function toggleLike(postId){

  likes[postId] =
    !likes[postId];

  saveData();

  renderFeed();

}


function toggleReelLike(reelId){

  likes[reelId] =
    !likes[reelId];

  saveData();

  renderReels();

}


/* =====================================================
   COMMENT
===================================================== */

function toggleComments(postId){

  const box =
    document.getElementById(
      "comments-" + postId
    );

  if(box){

    box.classList.toggle("show");

  }

}


function addComment(postId){

  const input =
    document.getElementById(
      "comment-input-" + postId
    );

  const text =
    input.value.trim();

  if(!text){

    return;

  }

  if(!comments[postId]){

    comments[postId] = [];

  }

  comments[postId].push({

    user:
      currentUser?.name || "Ferdous",

    text:text,

    created_at:
      new Date().toISOString()

  });

  input.value = "";

  saveData();

  renderFeed();

  setTimeout(() => {

    const box =
      document.getElementById(
        "comments-" + postId
      );

    if(box){

      box.classList.add("show");

    }

  },50);

}


/* =====================================================
   SHARE
===================================================== */

function sharePost(postId){

  const post =
    posts.find(
      p => p.id === postId
    );

  if(!post) return;

  const text =
    `${post.user}: ${post.caption}`;

  if(
    navigator.share
  ){

    navigator.share({

      title:"My Social App",

      text:text

    }).catch(()=>{});

  }else{

    navigator.clipboard
      ?.writeText(text);

    alert("Post copied!");

  }

}


/* =====================================================
   CREATE POST
===================================================== */

function openPostModal(){

  document
    .getElementById("postModal")
    .classList.add("show");

}


function closePostModal(){

  document
    .getElementById("postModal")
    .classList.remove("show");

}


function createPost(){

  const text =
    document
      .getElementById("postText")
      .value
      .trim();

  const image =
    document
      .getElementById("postImage")
      .value
      .trim();

  if(!text && !image){

    alert("Post লিখুন অথবা Image URL দিন");

    return;

  }

  const post = {

    id:
      "post-" +
      Date.now(),

    user:
      currentUser?.name || "Ferdous",

    caption:text,

    image:image,

    likes:0,

    comments:[]

  };

  posts.unshift(post);

  saveData();

  document.getElementById(
    "postText"
  ).value = "";

  document.getElementById(
    "postImage"
  ).value = "";

  closePostModal();

  renderFeed();

  updateUserUI();

}


/* =====================================================
   REELS
===================================================== */

function renderReels(){

  const container =
    document.getElementById(
      "reelsContainer"
    );

  container.innerHTML = "";

  reels.forEach(reel => {

    const isLiked =
      likes[reel.id] === true;

    const count =
      Number(reel.likes || 0)
      + (isLiked ? 1 : 0);

    const div =
      document.createElement("div");

    div.className = "reel";

    div.innerHTML = `

      <video
        class="reel-video"
        src="${escapeAttribute(reel.video)}"
        loop
        muted
        playsinline
        preload="metadata">
      </video>

      <button
        class="sound-btn"
        onclick="toggleSound(this)">

        🔇

      </button>

      <div class="reel-overlay">

        <div class="reel-info">

          <div class="reel-user">
            @${escapeHtml(reel.user)}
          </div>

          <div class="reel-caption">
            ${escapeHtml(reel.caption)}
          </div>

        </div>

        <div class="reel-actions">

          <button
            class="reel-action"
            onclick="toggleReelLike('${reel.id}')">

            ${isLiked ? "💙" : "❤️"}

          </button>

          <div class="reel-count">
            ${count}
          </div>

          <button
            class="reel-action"
            onclick="alert('Comment system নিচে Feed-এ ব্যবহার করুন')">

            💬

          </button>

          <button
            class="reel-action"
            onclick="shareReel('${reel.id}')">

            ↗

          </button>

        </div>

      </div>

    `;

    container.appendChild(div);

  });

  setupReelObserver();

}


function setupReelObserver(){

  const observer =
    new IntersectionObserver(

      entries => {

        entries.forEach(entry => {

          const video =
            entry.target;

          if(entry.isIntersecting){

            video.play()
              .catch(()=>{});

          }else{

            video.pause();

          }

        });

      },

      {
        threshold:.7
      }

    );

  document
    .querySelectorAll(".reel-video")
    .forEach(video => {

      observer.observe(video);

    });

}


function toggleSound(button){

  const reel =
    button.closest(".reel");

  const video =
    reel.querySelector("video");

  video.muted =
    !video.muted;

  button.textContent =
    video.muted
      ? "🔇"
      : "🔊";

  if(video.paused){

    video.play()
      .catch(()=>{});

  }

}


function shareReel(reelId){

  const reel =
    reels.find(
      r => r.id === reelId
    );

  if(!reel) return;

  if(navigator.share){

    navigator.share({

      title:"My Social App",

      text:reel.caption,

      url:reel.video

    }).catch(()=>{});

  }else{

    navigator.clipboard
      ?.writeText(reel.video);

    alert("Reel link copied!");

  }

}


/* =====================================================
   NAVIGATION
===================================================== */

function setActive(id){

  document
    .querySelectorAll(".nav button")
    .forEach(b =>
      b.classList.remove("active")
    );

  document
    .getElementById(id)
    .classList.add("active");

}


function hideAll(){

  document.getElementById(
    "homePage"
  ).style.display = "none";

  document.getElementById(
    "reelsPage"
  ).style.display = "none";

  document.getElementById(
    "profilePage"
  ).style.display = "none";

}


function showHome(){

  hideAll();

  document.getElementById(
    "homePage"
  ).style.display = "block";

  setActive("homeNav");

}


function showReels(){

  hideAll();

  document.getElementById(
    "reelsPage"
  ).style.display = "block";

  setActive("reelsNav");

  setTimeout(
    setupReelObserver,
    100
  );

}


function showProfile(){

  hideAll();

  document.getElementById(
    "profilePage"
  ).style.display = "block";

  setActive("profileNav");

}


/* =====================================================
   LOGIN
===================================================== */

function login(){

  const email =
    document
      .getElementById("loginEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("loginPassword")
      .value
      .trim();

  if(!email || !password){

    document.getElementById(
      "loginMessage"
    ).textContent =
      "Email এবং Password দিন";

    return;

  }

  currentUser = {

    id:"local-user",

    name:
      email.split("@")[0],

    email:email

  };

  localStorage.setItem(
    "my_social_user",
    JSON.stringify(currentUser)
  );

  document.getElementById(
    "loginPage"
  ).style.display = "none";

  document.getElementById(
    "app"
  ).style.display = "block";

  updateUserUI();

  renderFeed();

}


function showRegister(){

  const name =
    prompt("আপনার নাম লিখুন:");

  if(!name){

    return;

  }

  const email =
    prompt("Email লিখুন:");

  if(!email){

    return;

  }

  currentUser = {

    id:
      "user-" + Date.now(),

    name:name,

    email:email

  };

  localStorage.setItem(
    "my_social_user",
    JSON.stringify(currentUser)
  );

  document.getElementById(
    "loginPage"
  ).style.display = "none";

  document.getElementById(
    "app"
  ).style.display = "block";

  updateUserUI();

}


function logout(){

  if(
    !confirm(
      "আপনি কি Logout করতে চান?"
    )
  ){

    return;

  }

  localStorage.removeItem(
    "my_social_user"
  );

  location.reload();

}


/* =====================================================
   SECURITY / HTML ESCAPE
===================================================== */

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function escapeAttribute(value){

  return String(value ?? "")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}
