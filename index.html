<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1877f2">

<title>My Social</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f0f2f5;
  color:#111;
}

body.dark{
  background:#18191a;
  color:#eee;
}

button,input,textarea{
  font-family:inherit;
}

button{
  cursor:pointer;
  border:0;
}

.topbar{
  position:sticky;
  top:0;
  z-index:1000;
  background:#1877f2;
  color:white;
  height:60px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 12px;
}

.logo{
  font-size:22px;
  font-weight:bold;
  white-space:nowrap;
}

.search{
  flex:1;
  max-width:450px;
  padding:10px 14px;
  border:0;
  outline:0;
  border-radius:25px;
}

.top-button{
  background:rgba(255,255,255,.18);
  color:white;
  border-radius:50%;
  width:40px;
  height:40px;
  font-size:19px;
}

.container{
  width:100%;
  max-width:720px;
  margin:auto;
  padding:12px;
}

.page{
  display:none;
  padding-bottom:80px;
}

.page.active{
  display:block;
}

.card{
  background:white;
  border-radius:12px;
  padding:14px;
  margin-bottom:12px;
  box-shadow:0 1px 3px rgba(0,0,0,.15);
}

.dark .card{
  background:#242526;
  color:#eee;
  box-shadow:none;
}

.auth{
  width:92%;
  max-width:420px;
  margin:60px auto;
}

.auth h1{
  color:#1877f2;
  text-align:center;
}

.auth input{
  width:100%;
  padding:13px;
  margin:7px 0;
  border:1px solid #ddd;
  border-radius:8px;
  outline:0;
}

.primary{
  background:#1877f2;
  color:white;
  padding:12px 16px;
  border-radius:8px;
  font-weight:bold;
}

.primary.full{
  width:100%;
}

.secondary{
  background:#e4e6eb;
  color:#111;
  padding:10px 14px;
  border-radius:8px;
}

.dark .secondary{
  background:#3a3b3c;
  color:white;
}

.avatar{
  width:44px;
  height:44px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd;
}

.avatar-large{
  width:92px;
  height:92px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid white;
}

.post-head{
  display:flex;
  align-items:center;
  gap:10px;
}

.post-user{
  flex:1;
}

.username{
  font-weight:bold;
}

.time{
  color:#777;
  font-size:12px;
  margin-top:3px;
}

.post-text{
  white-space:pre-wrap;
  margin-top:12px;
  line-height:1.5;
}

.post-image{
  width:100%;
  max-height:650px;
  object-fit:cover;
  border-radius:10px;
  margin-top:10px;
}

.post-actions{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  border-top:1px solid #ddd;
  border-bottom:1px solid #ddd;
  margin-top:12px;
}

.dark .post-actions{
  border-color:#444;
}

.post-actions button{
  padding:11px 3px;
  background:transparent;
  color:inherit;
}

.post-actions button:hover{
  background:#f0f2f5;
}

.dark .post-actions button:hover{
  background:#3a3b3c;
}

.stats{
  color:#777;
  padding:8px 2px;
  font-size:14px;
}

.comment-input{
  display:flex;
  gap:6px;
  margin-top:10px;
}

.comment-input input{
  flex:1;
  border:1px solid #ccc;
  border-radius:22px;
  padding:10px 14px;
  outline:0;
}

.comment{
  background:#f0f2f5;
  border-radius:9px;
  padding:8px 10px;
  margin-top:7px;
}

.dark .comment{
  background:#3a3b3c;
}

.story-row{
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding-bottom:3px;
}

.story{
  min-width:100px;
  height:145px;
  border-radius:12px;
  background:#1877f2;
  color:white;
  display:flex;
  align-items:flex-end;
  padding:9px;
  background-size:cover;
  background-position:center;
  overflow:hidden;
}

.story.add{
  align-items:center;
  justify-content:center;
  text-align:center;
  font-weight:bold;
}

.create-box textarea{
  width:100%;
  border:0;
  outline:0;
  resize:none;
  padding:10px;
  font-size:16px;
  background:transparent;
  color:inherit;
}

.create-tools{
  display:flex;
  gap:8px;
  align-items:center;
}

.preview{
  width:100%;
  max-height:400px;
  object-fit:cover;
  border-radius:10px;
  margin:8px 0;
  display:none;
}

.nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:62px;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:1000;
}

.dark .nav{
  background:#242526;
  border-color:#444;
}

.nav button{
  background:transparent;
  color:inherit;
  font-size:21px;
  padding:7px;
}

.nav small{
  display:block;
  font-size:9px;
}

.profile-cover{
  height:170px;
  background:linear-gradient(135deg,#1877f2,#7b61ff);
  border-radius:12px 12px 0 0;
}

.profile-info{
  text-align:center;
  margin-top:-48px;
}

.profile-info h2{
  margin:6px 0 3px;
}

.profile-buttons{
  display:flex;
  justify-content:center;
  gap:7px;
  flex-wrap:wrap;
}

.menu{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.menu button{
  padding:15px 8px;
  border-radius:10px;
  background:#e4e6eb;
  color:#111;
}

.dark .menu button{
  background:#3a3b3c;
  color:#fff;
}

.reel{
  background:#000;
  border-radius:12px;
  overflow:hidden;
  margin-bottom:12px;
}

.reel video{
  width:100%;
  max-height:650px;
  display:block;
}

.reel-info{
  color:white;
  padding:10px;
}

.message{
  padding:9px 12px;
  border-radius:14px;
  margin:6px 0;
  max-width:80%;
}

.message.mine{
  background:#1877f2;
  color:white;
  margin-left:auto;
}

.message.other{
  background:#e4e6eb;
}

.dark .message.other{
  background:#3a3b3c;
  color:white;
}

.empty{
  text-align:center;
  color:#777;
  padding:30px;
}

.result{
  display:flex;
  align-items:center;
  gap:10px;
}

.result-info{
  flex:1;
}

.notification{
  display:flex;
  gap:10px;
  padding:12px 5px;
  border-bottom:1px solid #ddd;
}

.dark .notification{
  border-color:#444;
}

.unread{
  background:#e7f3ff;
}

.dark .unread{
  background:#26384a;
}

.setting-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 4px;
  border-bottom:1px solid #ddd;
}

.dark .setting-row{
  border-color:#444;
}

@media(max-width:500px){

  .logo{
    font-size:19px;
  }

  .search{
    min-width:0;
  }

  .post-actions{
    grid-template-columns:repeat(4,1fr);
  }

}
</style>
</head>

<body>

<!-- =========================
AUTH PAGE
========================= -->

<div id="authPage">

  <div class="auth card">

    <h1>My Social</h1>

    <!-- LOGIN -->

    <div id="loginBox">

      <h2>Login</h2>

      <input
        id="loginEmail"
        type="email"
        placeholder="Email">

      <input
        id="loginPassword"
        type="password"
        placeholder="Password">

      <button
        class="primary full"
        onclick="login()">
        Login
      </button>

      <br><br>

      <button
        class="secondary"
        onclick="showRegister()">
        Create new account
      </button>

      <button
        class="secondary"
        onclick="resetPassword()">
        Forgot password?
      </button>

    </div>


    <!-- REGISTER -->

    <div id="registerBox" style="display:none">

      <h2>Create Account</h2>

      <input
        id="regName"
        placeholder="Your name">

      <input
        id="regUsername"
        placeholder="Username">

      <input
        id="regEmail"
        type="email"
        placeholder="Email">

      <input
        id="regPassword"
        type="password"
        placeholder="Password">

      <button
        class="primary full"
        onclick="register()">
        Create account
      </button>

      <br><br>

      <button
        class="secondary"
        onclick="showLogin()">
        Back to Login
      </button>

    </div>

  </div>

</div>


<!-- =========================
MAIN APP
========================= -->

<div id="app" style="display:none">

  <!-- TOP BAR -->

  <div class="topbar">

    <div class="logo">
      My Social
    </div>

    <input
      id="topSearch"
      class="search"
      placeholder="Search..."
      onkeydown="topSearchKey(event)">

    <button
      class="top-button"
      onclick="toggleDark()">
      🌙
    </button>

  </div>


  <!-- =====================
  HOME
  ====================== -->

  <div
    id="homePage"
    class="page active">

    <div class="container">

      <!-- STORIES -->

      <div class="card">

        <h3>📖 Stories</h3>

        <div
          id="stories"
          class="story-row">
        </div>

      </div>


      <!-- CREATE POST -->

      <div class="card create-box">

        <textarea
          id="postText"
          rows="3"
          placeholder="What's on your mind?">
        </textarea>

        <input
          id="postImage"
          type="file"
          accept="image/*"
          style="display:none"
          onchange="previewImage()">

        <img
          id="preview"
          class="preview">

        <div class="create-tools">

          <button
            class="secondary"
            onclick="document.getElementById('postImage').click()">
            📷 Photo
          </button>

          <button
            class="primary"
            onclick="createPost()">
            Post
          </button>

        </div>

      </div>


      <!-- FEED -->

      <div id="feed">
      </div>

    </div>

  </div>


  <!-- =====================
  SEARCH
  ====================== -->

  <div
    id="searchPage"
    class="page">

    <div class="container">

      <div class="card">

        <h2>🔎 Search People</h2>

        <input
          id="searchBox"
          style="width:100%;padding:12px;border:1px solid #ccc;border-radius:8px"
          placeholder="Username search..."
          oninput="doSearch()">

      </div>

      <div id="searchResults"></div>

    </div>

  </div>


  <!-- =====================
  PROFILE
  ====================== -->

  <div
    id="profilePage"
    class="page">

    <div class="container">

      <div id="profileArea">
      </div>

    </div>

  </div>


  <!-- =====================
  REELS
  ====================== -->

  <div
    id="reelsPage"
    class="page">

    <div class="container">

      <div class="card">

        <h2>🎬 Reels</h2>

        <input
          id="reelFile"
          type="file"
          accept="video/*">

        <br><br>

        <input
          id="reelCaption"
          style="width:100%;padding:11px;border:1px solid #ccc;border-radius:8px"
          placeholder="Reel caption">

        <br><br>

        <button
          class="primary full"
          onclick="uploadReel()">
          Upload Reel
        </button>

      </div>

      <div id="reels"></div>

    </div>

  </div>


  <!-- =====================
  NOTIFICATIONS
  ====================== -->

  <div
    id="notificationsPage"
    class="page">

    <div class="container">

      <div class="card">

        <h2>🔔 Notifications</h2>

        <button
          class="secondary"
          onclick="markNotificationsRead()">
          Mark all as read
        </button>

      </div>

      <div id="notifications"></div>

    </div>

  </div>


  <!-- =====================
  MESSAGES
  ====================== -->

  <div
    id="messagesPage"
    class="page">

    <div class="container">

      <div class="card">

        <h2>💬 Messenger</h2>

        <input
          id="messageUser"
          style="width:100%;padding:11px;border:1px solid #ccc;border-radius:8px"
          placeholder="Receiver User ID">

        <br><br>

        <input
          id="messageText"
          style="width:100%;padding:11px;border:1px solid #ccc;border-radius:8px"
          placeholder="Write message..."
          onkeydown="messageKey(event)">

        <br><br>

        <button
          class="primary full"
          onclick="sendMessage()">
          Send
        </button>

      </div>

      <div id="messages"></div>

    </div>

  </div>


  <!-- =====================
  SAVED
  ====================== -->

  <div
    id="savedPage"
    class="page">

    <div class="container">

      <div class="card">

        <h2>🔖 Saved Posts</h2>

      </div>

      <div id="savedPosts"></div>

    </div>

  </div>


  <!-- =====================
  SETTINGS
  ====================== -->

  <div
    id="settingsPage"
    class="page">

    <div class="container">

      <div class="card">

        <h2>⚙️ Settings</h2>

        <div class="setting-row">
          <span>🌙 Dark Mode</span>
          <button
            class="secondary"
            onclick="toggleDark()">
            Change
          </button>
        </div>

        <div class="setting-row">
          <span>👤 Edit Profile</span>
          <button
            class="secondary"
            onclick="editProfile()">
            Edit
          </button>
        </div>

        <div class="setting-row">
          <span>🔐 Password</span>
          <button
            class="secondary"
            onclick="changePassword()">
            Change
          </button>
        </div>

        <div class="setting-row">
          <span>🔖 Saved</span>
          <button
            class="secondary"
            onclick="showPage('saved')">
            Open
          </button>
        </div>

        <div class="setting-row">
          <span>🚪 Logout</span>
          <button
            class="secondary"
            onclick="logout()">
            Logout
          </button>
        </div>

        <div class="setting-row">
          <span>🗑️ Delete Account</span>
          <button
            class="secondary"
            onclick="deleteAccount()">
            Delete
          </button>
        </div>

      </div>

    </div>

  </div>


  <!-- =====================
  BOTTOM NAV
  ====================== -->

  <div class="nav">

    <button onclick="showPage('home')">
      🏠
      <small>Home</small>
    </button>

    <button onclick="showPage('search')">
      🔎
      <small>Search</small>
    </button>

    <button onclick="showPage('reels')">
      🎬
      <small>Reels</small>
    </button>

    <button onclick="showPage('notifications')">
      🔔
      <small>Alerts</small>
    </button>

    <button onclick="showPage('messages')">
      💬
      <small>Chat</small>
    </button>

    <button onclick="showPage('profile')">
      👤
      <small>Profile</small>
    </button>

    <button onclick="showPage('settings')">
      ☰
      <small>Menu</small>
    </button>

  </div>

</div>


<script>

/* =========================================
SUPABASE
========================================= */

const SUPABASE_URL =
"https://skereuaizdczbvjplisi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_3R2otJA1zIlsMsTYxe1ocw_NAPY5O9x";

const sb =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser = null;


/* =========================================
HELPER
========================================= */

function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================================
AUTH UI
========================================= */

function showLogin(){

  document.getElementById("loginBox")
    .style.display="block";

  document.getElementById("registerBox")
    .style.display="none";

}


function showRegister(){

  document.getElementById("loginBox")
    .style.display="none";

  document.getElementById("registerBox")
    .style.display="block";

}


/* =========================================
LOGIN
========================================= */

async function login(){

  const email =
    document.getElementById("loginEmail")
    .value.trim();

  const password =
    document.getElementById("loginPassword")
    .value;

  if(!email || !password){

    alert("Email এবং Password দিন");
    return;

  }

  const {error} =
    await sb.auth.signInWithPassword({
      email,
      password
    });

  if(error){

    alert(error.message);
    return;

  }

  await checkUser();

}


/* =========================================
REGISTER
========================================= */

async function register(){

  const name =
    document.getElementById("regName")
    .value.trim();

  const username =
    document.getElementById("regUsername")
    .value.trim()
    .toLowerCase();

  const email =
    document.getElementById("regEmail")
    .value.trim();

  const password =
    document.getElementById("regPassword")
    .value;

  if(!name || !username || !email || !password){

    alert("সব তথ্য পূরণ করুন");
    return;

  }

  if(password.length < 6){

    alert("Password কমপক্ষে ৬ অক্ষরের দিন");
    return;

  }

  const {
    data,
    error
  } =
    await sb.auth.signUp({
      email,
      password
    });

  if(error){

    alert(error.message);
    return;

  }

  if(data.user){

    const {error:profileError} =
      await sb
      .from("profiles")
      .upsert({
        id:data.user.id,
        name:name,
        username:username
      });

    if(profileError){

      alert(
        "Account হয়েছে, কিন্তু Profile তৈরি হয়নি: "+
        profileError.message
      );

      return;

    }

  }

  alert(
    "Account তৈরি হয়েছে। Email verification চাইলে Email verify করে Login করুন।"
  );

  showLogin();

}


/* =========================================
CHECK USER
========================================= */

async function checkUser(){

  const {
    data:{user}
  } =
    await sb.auth.getUser();

  if(user){

    currentUser=user;

    document.getElementById("authPage")
      .style.display="none";

    document.getElementById("app")
      .style.display="block";

    await createDefaultProfile();

    await loadPosts();
    await loadStories();

    loadNotifications();
    loadReels();

  }else{

    document.getElementById("authPage")
      .style.display="block";

    document.getElementById("app")
      .style.display="none";

  }

}


/* =========================================
DEFAULT PROFILE
========================================= */

async function createDefaultProfile(){

  if(!currentUser) return;

  const {data} =
    await sb
    .from("profiles")
    .select("id")
    .eq("id",currentUser.id)
    .maybeSingle();

  if(!data){

    await sb
    .from("profiles")
    .insert({
      id:currentUser.id,
      name:
        currentUser.email?.split("@")[0] ||
        "User",
      username:
        "user"+Date.now()
    });

  }

}


/* =========================================
LOGOUT
========================================= */

async function logout(){

  await sb.auth.signOut();

  currentUser=null;

  location.reload();

}


/* =========================================
NAVIGATION
========================================= */

async function showPage(page){

  document
    .querySelectorAll(".page")
    .forEach(p=>{
      p.classList.remove("active");
    });

  const pageEl =
    document.getElementById(page+"Page");

  if(pageEl){

    pageEl.classList.add("active");

  }

  if(page==="home"){
    loadPosts();
  }

  if(page==="profile"){
    loadMyProfile();
  }

  if(page==="reels"){
    loadReels();
  }

  if(page==="notifications"){
    loadNotifications();
  }

  if(page==="messages"){
    loadMessages();
  }

  if(page==="saved"){
    loadSaved();
  }

}


/* =========================================
LOAD POSTS
========================================= */

async function loadPosts(){

  const feed =
    document.getElementById("feed");

  feed.innerHTML =
    `<div class="card">Loading Feed...</div>`;

  const {
    data:posts,
    error
  } =
    await sb
    .from("posts")
    .select(`
      id,
      user_id,
      text,
      image_url,
      privacy,
      created_at
    `)
    .order(
      "created_at",
      {ascending:false}
    )
    .limit(50);

  if(error){

    feed.innerHTML =
      `<div class="card">
        Feed Error: ${escapeHTML(error.message)}
      </div>`;

    return;

  }

  if(!posts || posts.length===0){

    feed.innerHTML =
      `<div class="card empty">
        এখনো কোনো Post নেই।
      </div>`;

    return;

  }

  const userIds =
    [...new Set(
      posts
      .map(p=>p.user_id)
      .filter(Boolean)
    )];

  let profiles=[];

  if(userIds.length){

    const result =
      await sb
      .from("profiles")
      .select(
        "id,name,username,avatar_url"
      )
      .in("id",userIds);

    profiles=result.data || [];

  }

  const profileMap={};

  profiles.forEach(p=>{
    profileMap[p.id]=p;
  });

  feed.innerHTML="";

  posts.forEach(post=>{

    renderPost(
      post,
      profileMap[post.user_id],
      feed
    );

  });

}


/* =========================================
RENDER POST
========================================= */

function renderPost(
  post,
  profile,
  container
){

  const div =
    document.createElement("div");

  div.className="card";

  const name =
    profile?.name ||
    profile?.username ||
    "User";

  const avatar =
    profile?.avatar_url ||
    "https://via.placeholder.com/100";

  div.innerHTML=`

    <div class="post-head">

      <img
        class="avatar"
        src="${avatar}">

      <div class="post-user">

        <div class="username">

async function loadComments(postId){

  const box =
    document.getElementById(
      "comments-"+postId
    );

  if(!box) return;

  const {data} =
    await sb
    .from("comments")
    .select(
      "id,user_id,text,created_at"
    )
    .eq("post_id",postId)
    .order(
      "created_at",
      {ascending:true}
    )
    .limit(20);

  if(!data || !data.length){

    box.innerHTML="";
    return;

  }

  const ids =
    [...new Set(
      data.map(c=>c.user_id)
    )];

  const {data:profiles} =
    await sb
    .from("profiles")
    .select("id,name,username")
    .in("id",ids);

  const map={};

  (profiles||[]).forEach(p=>{
    map[p.id]=p;
  });

  box.innerHTML =
    data.map(c=>`

      <div class="comment">

        <b>
          ${escapeHTML(
            map[c.user_id]?.name ||
            map[c.user_id]?.username ||
            "User"
          )}
        </b>

        <br>

        ${escapeHTML(c.text)}

      </div>

    `).join("");

}

/* =========================================
CREATE POST
========================================= */

async function createPost(){

  const text =
    document.getElementById("postText")
    .value.trim();

  const file =
    document.getElementById("postImage")
    .files[0];

  if(!text && !file){

    alert(
      "Post লিখুন অথবা Photo নির্বাচন করুন"
    );

    return;

  }

  let image_url=null;

  if(file){

    const path =
      currentUser.id+
      "/"+
      Date.now()+
      "_"+
      file.name.replace(/\s+/g,"_");

    const {error} =
      await sb
      .storage
      .from("post-images")
      .upload(path,file);

    if(error){

      alert(error.message);
      return;

    }

    const {data} =
      sb
      .storage
      .from("post-images")
      .getPublicUrl(path);

    image_url=data.publicUrl;

  }

  const {error} =
    await sb
    .from("posts")
    .insert({
      user_id:currentUser.id,
      text:text || null,
      image_url:image_url,
      privacy:"public"
    });

  if(error){

    alert(error.message);
    return;

  }

  document.getElementById("postText")
    .value="";

  document.getElementById("postImage")
    .value="";

  document.getElementById("preview")
    .style.display="none";

  alert("Post হয়েছে ✅");

  loadPosts();

}

async function doSearch(){

========================================= */

async function sharePost(postId){

  const url =
    location.href.split("#")[0]+
    "#post-"+postId;

  if(navigator.share){

    try{

      await navigator.share({
        title:"My Social",
        text:"Check this post",
        url:url
      });

    }catch(e){}

  }else{

    try{

      await navigator.clipboard
        .writeText(url);

      alert("Post link copied ✅");

    }catch(e){

      prompt(
        "এই Link কপি করুন:",
        url
      );

    }

  }

}

NOTIFICATION
========================================= */

async function createNotificationForPost(
  postId,
  type
){

  const {
    data:post
  } =
    await sb
    .from("posts")
    .select("user_id")
    .eq("id",postId)
    .single();

  if(!post) return;

  if(post.user_id===currentUser.id)
    return;

  let message="";

  if(type==="like"){

    message=
      "আপনার Post-এ Like দিয়েছে ❤️";

  }

  if(type==="comment"){

    message=
      "আপনার Post-এ Comment করেছে 💬";

  }

  await sb
    .from("notifications")
    .insert({
      receiver_id:post.user_id,
      actor_id:currentUser.id,
      type:type,
      post_id:postId,
      message:message,
      read:false
    });

}

  const caption =
    document.getElementById(
      "reelCaption"
    ).value.trim();

  if(!file){

    alert("Video নির্বাচন করুন");
    return;

  }

  const path =
    currentUser.id+
    "/reel_"+
    Date.now()+
    "_"+
    file.name.replace(/\s+/g,"_");

  const {error} =
    await sb
    .storage
    .from("post-images")
    .upload(
      path,
      file
    );

  if(error){

    alert(
      "Video upload হয়নি: "+
      error.message
    );

    return;

  }

  const {data} =
    sb
    .storage
    .from("post-images")
    .getPublicUrl(path);

  const {
    error:dbError
  } =
    await sb
    .from("reels")
    .insert({
      user_id:currentUser.id,
      video_url:data.publicUrl,
      caption:caption
    });

  if(dbError){

    alert(dbError.message);
    return;

  }

  document.getElementById(
    "reelFile"
  ).value="";

  document.getElementById(
    "reelCaption"
  ).value="";

  alert("Reel uploaded ✅");

  loadReels();

}


/* LOAD REELS */

async function loadReels(){

  const box =
    document.getElementById(
      "reels"
    );

  if(!box) return;

  const {
    data,
    error
  } =
    await sb
    .from("reels")
    .select(`
      id,
      user_id,
      video_url,
      caption,
      views,
      created_at
    `)
    .order(
      "created_at",
      {ascending:false}
    )
    .limit(30);

  if(error){

    box.innerHTML=
      `<div class="card">
        ${escapeHTML(error.message)}
      </div>`;

    return;

  }

  box.innerHTML="";

  (data||[]).forEach(r=>{

    const div =
      document.createElement("div");

    div.className="reel";

    div.innerHTML=`

      <video
        src="${r.video_url}"
        controls
        playsinline
        loop>
      </video>

      <div class="reel-info">

        ${escapeHTML(
          r.caption || ""
        )}

        <br><br>

        👁️ ${r.views || 0} views

      </div>

    `;

    box.appendChild(div);

  });

}


/* =========================================
PASSWORD
========================================= */

async function changePassword(){

  const password =
    prompt(
      "নতুন Password দিন:"
    );

  if(!password) return;

  if(password.length<6){

    alert(
      "Password কমপক্ষে ৬ অক্ষরের হতে হবে"
    );

    return;

  }

  const {error} =
    await sb.auth.updateUser({
      password:password
    });

  if(error){

    alert(error.message);

  }else{

    alert(
      "Password পরিবর্তন হয়েছে ✅"
    );

  }

}


/* =========================================
RESET PASSWORD
========================================= */

async function resetPassword(){

  const email =
    prompt(
      "আপনার Account Email:"
    );

  if(!email) return;

  const {error} =
    await sb.auth.resetPasswordForEmail(
      email
    );

  if(error){

    alert(error.message);

  }else{

    alert(
      "Password reset link Email-এ পাঠানো হয়েছে।"
    );

  }

}


/* =========================================
DELETE ACCOUNT
========================================= */

async function deleteAccount(){

  const confirmText =
    prompt(
      "Account Delete করতে DELETE লিখুন:"
    );

  if(confirmText!=="DELETE"){

    alert("Account Delete করা হয়নি");
    return;

  }

  const {error} =
    await sb.rpc(
      "delete_my_account"
    );

  if(error){

    alert(error.message);
    return;

  }

  await sb.auth.signOut();

  location.reload();

}
