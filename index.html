<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<meta
  name="theme-color"
  content="#1877f2"
>

<title>My Social App</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:#f0f2f5;
  color:#111;
}

button{
  cursor:pointer;
}

.hidden{
  display:none !important;
}

/* =========================
   AUTH
========================= */

#authPage{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.authBox{
  width:100%;
  max-width:400px;
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 4px 20px rgba(0,0,0,.12);
}

.logo{
  text-align:center;
  color:#1877f2;
  font-size:32px;
  font-weight:bold;
  margin-bottom:20px;
}

.input{
  width:100%;
  padding:13px;
  margin:7px 0;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:15px;
}

.primaryBtn{
  width:100%;
  border:0;
  background:#1877f2;
  color:white;
  padding:13px;
  border-radius:8px;
  font-size:16px;
  font-weight:bold;
  margin-top:8px;
}

.greenBtn{
  width:100%;
  border:0;
  background:#42b72a;
  color:white;
  padding:13px;
  border-radius:8px;
  font-size:16px;
  font-weight:bold;
  margin-top:8px;
}

.authMsg{
  text-align:center;
  margin-top:12px;
  color:#d00;
}

/* =========================
   APP
========================= */

#appPage{
  min-height:100vh;
}

.topbar{
  position:sticky;
  top:0;
  z-index:100;
  height:60px;
  background:white;
  border-bottom:1px solid #ddd;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
}

.topLogo{
  color:#1877f2;
  font-size:23px;
  font-weight:bold;
}

.topActions{
  display:flex;
  gap:7px;
}

.topActions button{
  border:0;
  background:#f0f2f5;
  border-radius:50%;
  width:40px;
  height:40px;
  font-size:18px;
}

.container{
  width:100%;
  max-width:680px;
  margin:auto;
  padding:15px;
}

/* =========================
   NAV
========================= */

.nav{
  background:white;
  display:flex;
  justify-content:space-around;
  border-bottom:1px solid #ddd;
  position:sticky;
  top:60px;
  z-index:90;
}

.nav button{
  flex:1;
  border:0;
  background:white;
  padding:13px 5px;
  font-size:14px;
}

.nav button.active{
  color:#1877f2;
  border-bottom:3px solid #1877f2;
}

/* =========================
   CARD
========================= */

.card{
  background:white;
  border-radius:10px;
  padding:15px;
  margin-bottom:15px;
  box-shadow:0 1px 3px rgba(0,0,0,.08);
}

/* =========================
   CREATE POST
========================= */

.createPost{
  background:white;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
}

.createTop{
  display:flex;
  gap:10px;
}

.createTop textarea{
  flex:1;
  border:0;
  background:#f0f2f5;
  border-radius:20px;
  padding:12px 15px;
  resize:none;
  outline:none;
  min-height:45px;
}

.postTools{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.postTools button{
  flex:1;
  border:0;
  background:#f0f2f5;
  padding:10px;
  border-radius:8px;
}

.postBtn{
  width:100%;
  margin-top:10px;
  border:0;
  background:#1877f2;
  color:white;
  padding:11px;
  border-radius:8px;
  font-weight:bold;
}

/* =========================
   POST
========================= */

.post-card{
  background:white;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
  box-shadow:0 1px 3px rgba(0,0,0,.08);
}

.post-actions{
  display:flex;
  border-top:1px solid #eee;
  margin-top:12px;
  padding-top:8px;
}

.post-actions button{
  flex:1;
  border:0;
  background:white;
  padding:9px;
  font-size:14px;
}

/* =========================
   PROFILE
========================= */

.profileHeader{
  background:white;
  border-radius:10px;
  padding:20px;
  text-align:center;
  margin-bottom:15px;
}

.bigAvatar{
  width:90px;
  height:90px;
  border-radius:50%;
  object-fit:cover;
}

/* =========================
   SETTINGS
========================= */

.settingItem{
  background:white;
  padding:16px;
  border-bottom:1px solid #eee;
}

.settingItem button{
  border:0;
  background:none;
  width:100%;
  text-align:left;
  font-size:15px;
}

/* =========================
   LOADING
========================= */

.loading{
  text-align:center;
  padding:25px;
  color:#777;
}

.errorBox{
  background:#ffecec;
  color:#c00;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
}

.successBox{
  background:#eaffea;
  color:#087a08;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .container{
    padding:8px;
  }

  .topLogo{
    font-size:20px;
  }

  .nav button{
    font-size:12px;
  }

}

</style>

</head>

<body>

<!-- =====================================================
     AUTH PAGE
===================================================== -->

<div id="authPage">

  <div class="authBox">

    <input

    >

<!-- =====================================================
     APP PAGE

<div
  id="appPage"
  class="hidden"
>

  <div class="topbar">

    <div class="topLogo">

      </button>

      <button onclick="showPage('profile')">
        👤

  </div>


  <div class="nav">

    <button

      Home

    <button

      onclick="showPage('profile')"

      Profile
    </button>

    <button
      id="navSettings"
      onclick="showPage('settings')"
    >
      Settings
    </button>

  <div class="container">

    <!-- ================= HOME ================= -->

    <section id="homePage">

        <div class="createTop">

          <img

            class="bigAvatar"
            style="

              height:45px;
            "

          >

        <input

        <div

        <select

          <option value="public">
            Public
          </option>

          <option value="private">

          </option>

        </select>


        <button
          class="postBtn"
          onclick="createPost()"
        >

        <div
          id="postMsg"
          style="
            text-align:center;
            margin-top:10px;
          "
        ></div>

      </div>


      <div id="feed">

        <div class="loading">

        </div>

      </div>

    </section>


    <!-- ================= PROFILE ================= -->

    <section
      id="profilePage"
      class="hidden"
    >

      <div class="profileHeader">

        <img
          id="profileAvatar"
          class="bigAvatar"
          src="https://ui-avatars.com/api/?name=User"
        >

        <h2 id="profileName">
          User
        </h2>

          id="profileUsername"
          style="color:#777"
        >
          @username

      <div id="profilePosts"></div>

    </section>


    <!-- ================= SETTINGS ================= -->

    <section
      id="settingsPage"
      class="hidden"
    >

      <div class="card">

        <h2>
          Settings
        </h2>

        <p>
          আপনার My Social account settings
        </p>

      </div>


      <div class="settingItem">

        <button onclick="editProfile()">
          👤 Edit Profile
        </button>

      </div>


      <div class="settingItem">

        <button onclick="changePassword()">
          🔐 Change Password
        </button>

      </div>


      <div class="settingItem">

        <button onclick="logout()">
          🚪 Logout
        </button>

      </div>

    </section>

  </div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://skereuaizdczbvjplisi.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_3R2otJA1zIlsMsTYxe1ocw_NAPY5O9x";

const sb =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   GLOBAL
===================================================== */

let currentUser = null;


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHTML(text){

  if(
    text === null ||
    text === undefined
  ){
    return "";
  }

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =====================================================
   CHECK LOGIN
===================================================== */

async function checkUser(){

  const {
    data,
    error
  } = await sb.auth.getSession();

  if(error){

    console.error(error);

    return;
  }

  if(
    data &&
    data.session &&
    data.session.user
  ){

    currentUser =
      data.session.user;

    showApp();

  }else{

    showAuth();

  }

}


/* =====================================================
   AUTH PAGE
===================================================== */

function showAuth(){

  document
    .getElementById("authPage")
    .classList
    .remove("hidden");

  document
    .getElementById("appPage")
    .classList
    .add("hidden");

}


/* =====================================================
   SHOW APP
===================================================== */

function showApp(){

  document
    .getElementById("authPage")
    .classList
    .add("hidden");

  document
    .getElementById("appPage")
    .classList
    .remove("hidden");

  showPage("home");

  loadMyProfile();

  loadPosts();

}


/* =====================================================
   LOGIN
===================================================== */

async function login(){

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;

  const msg =
    document.getElementById("authMsg");


  if(!email || !password){

    msg.innerHTML =
      "Email এবং Password দিন";

    return;
  }


  msg.innerHTML =
    "Login হচ্ছে...";


  const {
    data,
    error
  } = await sb.auth.signInWithPassword({

    email:email,

    password:password

  });


  if(error){

    console.error(error);

    msg.innerHTML =
      escapeHTML(error.message);

    return;
  }


  currentUser =
    data.user;

  msg.innerHTML = "";

  showApp();

}


/* =====================================================
   REGISTER
===================================================== */

async function register(){

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;


  const msg =
    document.getElementById("authMsg");


  if(!email || !password){

    msg.innerHTML =
      "Email এবং Password দিন";

    return;
  }


  if(password.length < 6){

    msg.innerHTML =
      "Password কমপক্ষে ৬ অক্ষরের হতে হবে";

    return;
  }


  msg.innerHTML =
    "Account তৈরি হচ্ছে...";


  const {
    data,
    error
  } = await sb.auth.signUp({

    email:email,

    password:password

  });


  if(error){

    console.error(error);

    msg.innerHTML =
      escapeHTML(error.message);

    return;
  }


  if(data.user){

    currentUser =
      data.user;


    /*
      যদি profiles automatic না তৈরি হয়,
      তাহলে এখানে profile তৈরি করার চেষ্টা করা হবে।
    */

    await createDefaultProfile(
      data.user
    );


    if(data.session){

      showApp();

    }else{

      msg.innerHTML =
        "Account তৈরি হয়েছে। Email verify করে Login করুন।";

    }

  }

}


/* =====================================================
   DEFAULT PROFILE
===================================================== */

async function createDefaultProfile(user){

  if(!user){
    return;
  }


  const email =
    user.email || "User";


  const username =
    email
      .split("@")[0]
      .replace(/[^a-zA-Z0-9_]/g,"")
      .substring(0,20)
      || "user";


  const name =
    username;


  const {
    error
  } = await sb
    .from("profiles")
    .upsert({

      id:user.id,

      name:name,

      username:username

    },{

      onConflict:"id"

    });


  if(error){

    console.log(
      "Profile create:",
      error.message
    );

  }

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

  await sb.auth.signOut();

  currentUser = null;

  showAuth();

}


/* =====================================================
   NAVIGATION
===================================================== */

function showPage(page){

  document
    .getElementById("homePage")
    .classList
    .add("hidden");

  document
    .getElementById("profilePage")
    .classList
    .add("hidden");

  document
    .getElementById("settingsPage")
    .classList
    .add("hidden");


  document
    .getElementById("navHome")
    .classList
    .remove("active");

  document
    .getElementById("navProfile")
    .classList
    .remove("active");

  document
    .getElementById("navSettings")
    .classList
    .remove("active");


  if(page === "home"){

    document
      .getElementById("homePage")
      .classList
      .remove("hidden");

    document
      .getElementById("navHome")
      .classList
      .add("active");

    loadPosts();

  }


  if(page === "profile"){

    document
      .getElementById("profilePage")
      .classList
      .remove("hidden");

    document
      .getElementById("navProfile")
      .classList
      .add("active");

    loadMyProfile();

  }


  if(page === "settings"){

    document
      .getElementById("settingsPage")
      .classList
      .remove("hidden");

    document
      .getElementById("navSettings")
      .classList
      .add("active");

  }

}


/* =====================================================
   LOAD POSTS
===================================================== */

async function loadPosts(){

  const feed =
    document.getElementById("feed");


  if(!feed){

    console.error(
      "feed element পাওয়া যায়নি"
    );

    return;
  }


  feed.innerHTML = `
    <div class="loading">
      পোস্ট লোড হচ্ছে...
    </div>
  `;


  /*
    IMPORTANT:

    এখানে profiles:user_id ব্যবহার করা হয়নি।

    Posts এবং Profiles আলাদাভাবে load করা হচ্ছে।
  */


  const {
    data:posts,
    error:postsError
  } = await sb
    .from("posts")
    .select(`
      id,
      user_id,
      text,
      image_url,
      privacy,
      created_at
    `)
    .order(
      "created_at",
      {
        ascending:false
      }
    );


  if(postsError){

    console.error(
      "POST ERROR:",
      postsError
    );


    feed.innerHTML = `
      <div class="errorBox">

        <b>
          পোস্ট লোড হয়নি
        </b>

        <br><br>

        ${escapeHTML(
          postsError.message
        )}

      </div>
    `;

    return;
  }


  console.log(
    "POSTS:",
    posts
  );


  if(
    !posts ||
    posts.length === 0
  ){

    feed.innerHTML = `
      <div class="card" style="text-align:center">

        এখনো কোনো পোস্ট নেই।

      </div>
    `;

    return;
  }


  /* =========================
     USER IDS
  ========================= */

  const userIds = [
    ...new Set(
      posts
        .map(
          post => post.user_id
        )
        .filter(Boolean)
    )
  ];


  /* =========================
     PROFILES
  ========================= */

  let profiles = [];


  if(userIds.length > 0){

    const {
      data,
      error:profileError
    } = await sb
      .from("profiles")
      .select(`
        id,
        name,
        username,
        avatar_url
      `)
      .in(
        "id",
        userIds
      );


    if(profileError){

      console.error(
        "PROFILE ERROR:",
        profileError
      );

    }else{

      profiles =
        data || [];

    }

  }


  /* =========================
     PROFILE MAP
  ========================= */

  const profileMap = {};


  profiles.forEach(
    profile => {

      profileMap[
        profile.id
      ] = profile;

    }
  );


  /* =========================
     RENDER
  ========================= */

  feed.innerHTML = "";


  posts.forEach(
    post => {

      const profile =
        profileMap[
          post.user_id
        ] || {

          id:post.user_id,

          name:"User",

          username:"",

          avatar_url:""

        };


      renderPost(
        post,
        profile,
        feed
      );

    }
  );

}


/* =====================================================
   RENDER POST
===================================================== */

function renderPost(
  post,
  profile,
  feed
){

  const div =
    document.createElement("div");


  div.className =
    "post-card";


  const name =
    profile.name ||
    profile.username ||
    "User";


  const avatar =
    profile.avatar_url ||
    "https://ui-avatars.com/api/?name=" +
    encodeURIComponent(name);


  const time =
    post.created_at
      ? new Date(
          post.created_at
        ).toLocaleString("bn-BD")
      : "";


  let imageHTML = "";


  if(post.image_url){

    imageHTML = `

      <img

        src="${escapeHTML(
          post.image_url
        )}"

        style="
          width:100%;
          max-height:500px;
          object-fit:cover;
          border-radius:10px;
          margin-top:10px;
          display:block;
        "

        onerror="
          this.style.display='none';
        "

      >

    `;

  }


  div.innerHTML = `

    <div style="
      display:flex;
      align-items:center;
      gap:10px;
    ">

      <img

        src="${escapeHTML(
          avatar
        )}"

        style="
          width:45px;
          height:45px;
          border-radius:50%;
          object-fit:cover;
        "

      >


      <div>

        <div style="
          font-weight:bold;
          font-size:16px;
        ">

          ${escapeHTML(
            name
          )}

        </div>


        <div style="
          color:#777;
          font-size:12px;
        ">

          ${escapeHTML(
            time
          )}

        </div>

      </div>

    </div>


    ${
      post.text
        ? `

          <div style="
            margin-top:12px;
            font-size:16px;
            white-space:pre-wrap;
          ">

            ${escapeHTML(
              post.text
            )}

          </div>

        `
        : ""
    }


    ${imageHTML}


    <div class="post-actions">

      <button
        onclick="likePost('${post.id}')"
      >
        ❤️ Like
      </button>


      <button
        onclick="commentPost('${post.id}')"
      >
        💬 Comment
      </button>


      <button
        onclick="sharePost('${post.id}')"
      >
        ↗ Share
      </button>

    </div>

  `;


  feed.appendChild(div);

}


/* =====================================================
   IMAGE PREVIEW
===================================================== */

function previewImage(){

  const input =
    document.getElementById(
      "postImage"
    );

  const preview =
    document.getElementById(
      "imagePreview"
    );


  preview.innerHTML = "";


  if(
    !input.files ||
    !input.files[0]
  ){

    return;
  }


  const file =
    input.files[0];


  const url =
    URL.createObjectURL(file);


  preview.innerHTML = `

    <img

      src="${url}"

      style="
        width:100%;
        max-height:300px;
        object-fit:cover;
        border-radius:10px;
      "

    >

  `;

}


/* =====================================================
   CREATE POST
===================================================== */

async function createPost(){

  if(!currentUser){

    alert(
      "আগে Login করুন"
    );

    return;
  }


  const text =
    document
      .getElementById("postText")
      .value
      .trim();


  const fileInput =
    document.getElementById(
      "postImage"
    );


  const privacy =
    document
      .getElementById(
        "postPrivacy"
      )
      .value;


  const msg =
    document.getElementById(
      "postMsg"
    );


  if(
    !text &&
    (
      !fileInput.files ||
      !fileInput.files[0]
    )
  ){

    msg.innerHTML =
      "লিখা অথবা ছবি দিন";

    return;
  }


  msg.innerHTML =
    "পোস্ট তৈরি হচ্ছে...";


  let image_url = null;


  /* =========================
     IMAGE UPLOAD
  ========================= */

  if(
    fileInput.files &&
    fileInput.files[0]
  ){

    const file =
      fileInput.files[0];


    const extension =
      file.name
        .split(".")
        .pop()
        .toLowerCase();


    const fileName =
      currentUser.id +
      "/" +
      Date.now() +
      "." +
      extension;


    const {
      error:uploadError
    } = await sb
      .storage
      .from("post-images")
      .upload(
        fileName,
        file,
        {
          upsert:false
        }
      );


    if(uploadError){

      console.error(
        "UPLOAD ERROR:",
        uploadError
      );


      msg.innerHTML =
        "ছবি Upload হয়নি: " +
        escapeHTML(
          uploadError.message
        );

      return;
    }


    const {
      data:urlData
    } = sb
      .storage
      .from("post-images")
      .getPublicUrl(
        fileName
      );


    image_url =
      urlData.publicUrl;

  }


  /* =========================
     INSERT POST
  ========================= */

  const {
    data,
    error
  } = await sb
    .from("posts")
    .insert({

      user_id:
        currentUser.id,

      text:
        text || null,

      image_url:
        image_url,

      privacy:
        privacy

    })
    .select()
    .single();


  if(error){

    console.error(
      "INSERT POST ERROR:",
      error
    );


    msg.innerHTML =
      "পোস্ট হয়নি: " +
      escapeHTML(
        error.message
      );

    return;
  }


  console.log(
    "POST CREATED:",
    data
  );


  document
    .getElementById(
      "postText"
    )
    .value = "";


  fileInput.value = "";


  document
    .getElementById(
      "imagePreview"
    )
    .innerHTML = "";


  msg.innerHTML = `
    <span style="color:green">
      পোস্ট সফল হয়েছে ✓
    </span>
  `;


  await loadPosts();


  setTimeout(
    () => {

      msg.innerHTML = "";

    },
    2000
  );

}

async function loadMyProfile(){

  if(!currentUser){

    return;
  }


  const {
    data,
    error
  } = await sb
    .from("profiles")
    .select(`
      id,
      name,
      username,
      avatar_url
    `)
    .eq(
      "id",
      currentUser.id
    )
    .maybeSingle();


  if(error){

    console.error(
      "PROFILE LOAD ERROR:",
      error
    );

    return;
  }


  const profile =
    data || {

      name:
        currentUser.email
          ? currentUser.email
              .split("@")[0]
          : "User",

      username:"",

      avatar_url:""

    };


  const name =
    profile.name ||
    profile.username ||
    "User";


  const avatar =
    profile.avatar_url ||
    "https://ui-avatars.com/api/?name=" +
    encodeURIComponent(name);


  document
    .getElementById(
      "profileName"
    )
    .textContent =
      name;


  document
    .getElementById(
      "profileUsername"
    )
    .textContent =
      profile.username
        ? "@" +
          profile.username
        : "";


  document
    .getElementById(
      "profileAvatar"
    )
    .src =
      avatar;


  document
    .getElementById(
      "createAvatar"
    )
    .src =
      avatar;


  loadProfilePosts();

}


/* =====================================================
   PROFILE POSTS
===================================================== */

async function loadProfilePosts(){

  if(!currentUser){

    return;
  }


  const box =
    document.getElementById(
      "profilePosts"
    );


  box.innerHTML = `
    <div class="loading">
      পোস্ট লোড হচ্ছে...
    </div>
  `;


  const {
    data:posts,
    error
  } = await sb
    .from("posts")
    .select(`
      id,
      user_id,
      text,
      image_url,
      privacy,
      created_at
    `)
    .eq(
      "user_id",
      currentUser.id
    )
    .order(
      "created_at",
      {
        ascending:false
      }
    );


  if(error){

    box.innerHTML = `
      <div class="errorBox">
        ${escapeHTML(
          error.message
        )}
      </div>
    `;

    return;
  }


  box.innerHTML = "";


  if(
    !posts ||
    posts.length === 0
  ){

    box.innerHTML = `
      <div class="card"
        style="text-align:center">
        আপনার কোনো পোস্ট নেই।
      </div>
    `;

    return;
  }


  const {
    data:profile
  } = await sb
    .from("profiles")
    .select(`
      id,
      name,
      username,
      avatar_url
    `)
    .eq(
      "id",
      currentUser.id
    )
    .maybeSingle();


  const p =
    profile || {

      name:"User",

      username:"",

      avatar_url:""

    };


  posts.forEach(
    post => {

      renderPost(
        post,
        p,
        box
      );

    }
  );

}

/* =====================================================

===================================================== */

async function sharePost(id){

  const url =
    window.location.href +
    "#post-" +
    id;


  if(
    navigator.share
  ){

    try{

      await navigator.share({

        title:
          "My Social Post",

        url:url

      });

    }catch(e){}

  }else{

    try{

      await navigator.clipboard.writeText(
        url
      );

      alert(
        "Post link copied ✓"
      );

    }catch(e){

      alert(url);

    }

  }

}
