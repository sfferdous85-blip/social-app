<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1877f2">

<title>My Social App</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  overflow:hidden;
}

button,input,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

#app{
  width:100%;
  height:100vh;
  height:100dvh;
  background:#000;
  position:relative;
}

/* TOP BAR */
.topbar{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:58px;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  background:linear-gradient(
    to bottom,
    rgba(0,0,0,.75),
    rgba(0,0,0,0)
  );
}

.logo{
  font-size:21px;
  font-weight:800;
}

.top-actions{
  display:flex;
  gap:8px;
}

.icon-btn{
  width:40px;
  height:40px;
  border:0;
  border-radius:50%;
  color:#fff;
  background:rgba(255,255,255,.15);
  font-size:19px;
}

/* REELS */
#reels{
  width:100%;
  height:100vh;
  height:100dvh;
  overflow-y:auto;
  scroll-snap-type:y mandatory;
  background:#000;
}

.reel{
  position:relative;
  width:100%;
  height:100vh;
  height:100dvh;
  scroll-snap-align:start;
  scroll-snap-stop:always;
  overflow:hidden;
  background:#000;
}

.reel video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  background:#000;
}

/* VIDEO GRADIENT */
.reel::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:42%;
  pointer-events:none;
  background:linear-gradient(
    to top,
    rgba(0,0,0,.85),
    rgba(0,0,0,.4),
    transparent
  );
}

/* RIGHT BUTTONS */
.reel-actions{
  position:absolute;
  right:10px;
  bottom:105px;
  z-index:20;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:16px;
}

.action{
  width:50px;
  border:0;
  background:transparent;
  color:#fff;
  text-align:center;
  padding:0;
}

.action-icon{
  width:48px;
  height:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:rgba(0,0,0,.4);
  font-size:25px;
}

.action-count{
  display:block;
  margin-top:3px;
  font-size:12px;
  font-weight:700;
  text-shadow:0 1px 4px #000;
}

.action.liked .action-icon{
  color:#ff1744;
}

/* BOTTOM INFO */
.reel-info{
  position:absolute;
  left:14px;
  right:75px;
  bottom:22px;
  z-index:20;
}

.creator-row{
  display:flex;
  align-items:center;
  gap:9px;
  margin-bottom:9px;
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
  background:#444;
  border:2px solid #fff;
}

.creator-name{
  font-weight:800;
  font-size:15px;
}

.follow-btn{
  border:1px solid #fff;
  background:transparent;
  color:#fff;
  border-radius:8px;
  padding:6px 12px;
  font-weight:700;
  font-size:12px;
}

.follow-btn.following{
  background:#fff;
  color:#000;
}

.caption{
  font-size:15px;
  line-height:1.35;
  margin-bottom:8px;
  word-break:break-word;
}

.audio{
  font-size:13px;
  opacity:.9;
}

/* MUTE */
.mute-badge{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  z-index:30;
  width:64px;
  height:64px;
  border-radius:50%;
  background:rgba(0,0,0,.55);
  display:none;
  align-items:center;
  justify-content:center;
  font-size:29px;
  pointer-events:none;
}

.mute-badge.show{
  display:flex;
}

/* DOUBLE TAP HEART */
.big-heart{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) scale(.3);
  z-index:50;
  font-size:100px;
  opacity:0;
  pointer-events:none;
}

.big-heart.show{
  animation:heartPop .7s ease;
}

@keyframes heartPop{
  0%{
    opacity:0;
    transform:translate(-50%,-50%) scale(.3);
  }
  25%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1.1);
  }
  70%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
  }
  100%{
    opacity:0;
    transform:translate(-50%,-50%) scale(1.2);
  }
}

/* EMPTY */
.empty{
  width:100%;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:10px;
  color:#aaa;
  text-align:center;
  padding:30px;
}

.empty-icon{
  font-size:50px;
}

.empty button{
  background:#1877f2;
  color:#fff;
  border:0;
  padding:12px 20px;
  border-radius:10px;
  font-weight:700;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  z-index:300;
  display:none;
  align-items:flex-end;
  background:rgba(0,0,0,.65);
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-height:75vh;
  background:#fff;
  color:#111;
  border-radius:22px 22px 0 0;
  padding:15px;
  overflow:auto;
}

.modal-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}

.modal-title{
  font-size:19px;
  font-weight:800;
}

.close{
  border:0;
  background:#eee;
  width:38px;
  height:38px;
  border-radius:50%;
  font-size:20px;
}

.comment-input{
  display:flex;
  gap:8px;
  position:sticky;
  bottom:0;
  background:#fff;
  padding-top:8px;
}

.comment-input input{
  flex:1;
  border:1px solid #ddd;
  border-radius:20px;
  padding:11px 14px;
  outline:none;
}

.comment-input button{
  border:0;
  background:#1877f2;
  color:#fff;
  padding:0 16px;
  border-radius:20px;
  font-weight:700;
}

.comment-item{
  display:flex;
  gap:9px;
  margin:12px 0;
}

.comment-avatar{
  width:35px;
  height:35px;
  border-radius:50%;
  background:#ddd;
}

.comment-body{
  background:#f1f2f6;
  border-radius:14px;
  padding:8px 11px;
  flex:1;
}

.comment-user{
  font-size:12px;
  font-weight:800;
}

.comment-text{
  margin-top:3px;
  font-size:14px;
}

/* UPLOAD MODAL */
.upload-box input,
.upload-box textarea{
  width:100%;
  border:1px solid #ddd;
  border-radius:10px;
  padding:12px;
  margin-bottom:10px;
  outline:none;
}

.upload-box textarea{
  min-height:80px;
  resize:none;
}

.primary{
  width:100%;
  border:0;
  background:#1877f2;
  color:#fff;
  border-radius:10px;
  padding:13px;
  font-weight:800;
}

.progress{
  width:100%;
  height:7px;
  background:#eee;
  border-radius:20px;
  overflow:hidden;
  margin:8px 0;
  display:none;
}

.progress-bar{
  width:0%;
  height:100%;
  background:#1877f2;
}

/* TOAST */
#toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%) translateY(100px);
  z-index:999;
  background:rgba(0,0,0,.85);
  color:#fff;
  padding:11px 17px;
  border-radius:20px;
  font-size:14px;
  opacity:0;
  transition:.3s;
  pointer-events:none;
  white-space:nowrap;
}

#toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* LOADING */
.loading{
  width:100%;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:12px;
}

.spinner{
  width:40px;
  height:40px;
  border:4px solid #333;
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* DESKTOP */
@media(min-width:700px){
  .reel{
    max-width:500px;
    margin:auto;
  }

  #reels{
    background:#111;
  }
}
</style>
</head>

<body>

<div id="app">

  <div class="topbar">
    <div class="logo">My Social App</div>

    <div class="top-actions">
      <button class="icon-btn" onclick="openUpload()">＋</button>
      <button class="icon-btn" onclick="loadReels()">↻</button>
    </div>
  </div>

  <main id="reels">
    <div class="loading">
      <div class="spinner"></div>
      <div>Reels লোড হচ্ছে...</div>
    </div>
  </main>

</div>

<!-- COMMENTS -->
<div class="modal" id="commentModal">
  <div class="modal-box">

    <div class="modal-header">
      <div class="modal-title">
        Comments
      </div>

      <button class="close" onclick="closeComments()">×</button>
    </div>

    <div id="commentsList">
      Loading...
    </div>

    <div class="comment-input">
      <input
        id="commentText"
        type="text"
        placeholder="Comment লিখুন..."
        maxlength="500"
      >

      <button onclick="sendComment()">
        Send
      </button>
    </div>

  </div>
</div>

<!-- UPLOAD -->
<div class="modal" id="uploadModal">
  <div class="modal-box upload-box">

    <div class="modal-header">
      <div class="modal-title">
        Upload Reel
      </div>

      <button class="close" onclick="closeUpload()">×</button>
    </div>

    <input
      id="reelFile"
      type="file"
      accept="video/*"
    >

    <textarea
      id="reelCaption"
      placeholder="Caption লিখুন..."
      maxlength="1000"
    ></textarea>

    <input
      id="reelAudio"
      type="text"
      placeholder="Audio name"
      maxlength="200"
    >

    <div class="progress" id="uploadProgress">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <button
      class="primary"
      onclick="uploadReel()"
    >
      Upload Reel
    </button>

  </div>
</div>

<div id="toast"></div>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "YOUR_SUPABASE_URL";

const SUPABASE_ANON_KEY =
  "YOUR_SUPABASE_ANON_KEY";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let reelsData = [];
let currentReelId = null;
let currentCommentReelId = null;
let currentUser = null;

let observer = null;


/* =====================================================
   TOAST
===================================================== */

function toast(message){

  const el = document.getElementById("toast");

  el.textContent = message;

  el.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer = setTimeout(() => {

    el.classList.remove("show");

  }, 2200);
}


/* =====================================================
   AUTH USER
===================================================== */

async function getCurrentUser(){

  const {
    data,
    error
  } = await supabaseClient.auth.getUser();

  if(error){

    console.log(error);

    return null;
  }

  return data.user || null;
}


/* =====================================================
   LOAD REELS
===================================================== */

async function loadReels(){

  const container =
    document.getElementById("reels");

  container.innerHTML = `
    <div class="loading">
      <div class="spinner"></div>
      <div>Reels লোড হচ্ছে...</div>
    </div>
  `;

  currentUser = await getCurrentUser();

  const {
    data,
    error
  } = await supabaseClient
    .from("reels")
    .select(`
      id,
      user_id,
      video_url,
      caption,
      created_at,
      views,
      audio_name
    `)
    .order(
      "created_at",
      {
        ascending:false
      }
    );

  if(error){

    console.error(error);

    container.innerHTML = `
      <div class="empty">

        <div class="empty-icon">⚠️</div>

        <div>
          Reels লোড করা যাচ্ছে না।
        </div>

        <small>
          ${escapeHtml(error.message)}
        </small>

        <button onclick="loadReels()">
          আবার চেষ্টা করুন
        </button>

      </div>
    `;

    return;
  }

  reelsData = data || [];

  if(!reelsData.length){

    container.innerHTML = `
      <div class="empty">

        <div class="empty-icon">
          🎬
        </div>

        <div>
          এখনো কোনো Reel নেই
        </div>

        <button onclick="openUpload()">
          প্রথম Reel Upload করুন
        </button>

      </div>
    `;

    return;
  }

  container.innerHTML = "";

  for(const reel of reelsData){

    await createReelElement(
      reel,
      container
    );
  }

  setupObserver();

  setTimeout(() => {

    const firstVideo =
      document.querySelector(
        ".reel video"
      );

    if(firstVideo){

      firstVideo.play()
        .catch(() => {});

    }

  },300);
}


/* =====================================================
   CREATE REEL
===================================================== */

async function createReelElement(
  reel,
  container
){

  const reelElement =
    document.createElement("section");

  reelElement.className = "reel";

  reelElement.dataset.id =
    reel.id;

  const likes =
    await getLikeCount(reel.id);

  const comments =
    await getCommentCount(reel.id);

  const liked =
    await isLiked(reel.id);

  const following =
    await checkFollowing(reel.user_id);

  const ownReel =
    currentUser &&
    currentUser.id === reel.user_id;

  const safeCaption =
    escapeHtml(
      reel.caption || ""
    );

  const safeAudio =
    escapeHtml(
      reel.audio_name || "Original audio"
    );

  reelElement.innerHTML = `

    <video
      src="${escapeAttr(reel.video_url)}"
      playsinline
      webkit-playsinline
      loop
      muted
      preload="metadata"
    ></video>

    <div class="mute-badge">
      🔇
    </div>

    <div class="big-heart">
      ❤️
    </div>

    <div class="reel-actions">

      <button
        class="action ${liked ? "liked" : ""}"
        onclick="toggleLike(${reel.id},this)"
      >

        <span class="action-icon">
          ❤️
        </span>

        <span class="action-count like-count">
          ${likes}
        </span>

      </button>


      <button
        class="action"
        onclick="openComments(${reel.id})"
      >

        <span class="action-icon">
          💬
        </span>

        <span class="action-count comment-count">
          ${comments}
        </span>

      </button>


      <button
        class="action"
        onclick="shareReel(${reel.id})"
      >

        <span class="action-icon">
          ↗
        </span>

        <span class="action-count">
          Share
        </span>

      </button>


      <button
        class="action"
        onclick="reportReel(${reel.id})"
      >

        <span class="action-icon">
          ⚑
        </span>

        <span class="action-count">
          Report
        </span>

      </button>


      ${
        ownReel
        ?
        `
        <button
          class="action"
          onclick="deleteReel(${reel.id})"
        >

          <span class="action-icon">
            🗑
          </span>

          <span class="action-count">
            Delete
          </span>

        </button>
        `
        :
        ""
      }

    </div>


    <div class="reel-info">

      <div class="creator-row">

        <img
          class="avatar"
          src="https://ui-avatars.com/api/?name=User&background=1877f2&color=fff"
          alt=""
        >

        <div class="creator-name">
          ${shortId(reel.user_id)}
        </div>

        ${
          currentUser &&
          currentUser.id !== reel.user_id
          ?
          `
          <button
            class="follow-btn ${following ? "following" : ""}"
            onclick="toggleFollow('${reel.user_id}',this)"
          >
            ${following ? "Following" : "Follow"}
          </button>
          `
          :
          ""
        }

      </div>


      ${
        safeCaption
        ?
        `
        <div class="caption">
          ${safeCaption}
        </div>
        `
        :
        ""
      }


      <div class="audio">
        🎵 ${safeAudio}
      </div>

    </div>
  `;

  container.appendChild(
    reelElement
  );


  const video =
    reelElement.querySelector("video");

  const muteBadge =
    reelElement.querySelector(
      ".mute-badge"
    );

  const bigHeart =
    reelElement.querySelector(
      ".big-heart"
    );


  /* TAP VIDEO = SOUND */

  video.addEventListener(
    "click",
    () => {

      video.muted =
        !video.muted;

      muteBadge.textContent =
        video.muted
        ? "🔇"
        : "🔊";

      muteBadge.classList.add(
        "show"
      );

      setTimeout(() => {

        muteBadge.classList.remove(
          "show"
        );

      },800);

    }
  );


  /* DOUBLE TAP = LIKE */

  let lastTap = 0;

  video.addEventListener(
    "touchend",
    async(e) => {

      const now =
        Date.now();

      if(
        now - lastTap <
        350
      ){

        e.preventDefault();

        bigHeart.classList.remove(
          "show"
        );

        void bigHeart.offsetWidth;

        bigHeart.classList.add(
          "show"
        );

        if(!likedStateForElement(reelElement)){

          const button =
            reelElement.querySelector(
              ".action"
            );

          await toggleLike(
            reel.id,
            button
          );

        }

      }

      lastTap = now;

    },
    {
      passive:false
    }
  );


  video.addEventListener(
    "play",
    async() => {

      currentReelId =
        reel.id;

      await addViewOnce(
        reel.id
      );

    }
  );
}


/* =====================================================
   LIKE STATE
===================================================== */

function likedStateForElement(
  element
){

  const button =
    element.querySelector(
      ".action"
    );

  return button &&
    button.classList.contains(
      "liked"
    );
}


/* =====================================================
   LIKE COUNT
===================================================== */

async function getLikeCount(
  reelId
){

  const {
    count,
    error
  } = await supabaseClient
    .from("reel_likes")
    .select(
      "id",
      {
        count:"exact",
        head:true
      }
    )
    .eq(
      "reel_id",
      reelId
    );

  if(error){

    console.log(
      "Like count error:",
      error.message
    );

    return 0;
  }

  return count || 0;
}


/* =====================================================
   IS LIKED
===================================================== */

async function isLiked(
  reelId
){

  if(!currentUser){

    return false;
  }

  const {
    data,
    error
  } = await supabaseClient
    .from("reel_likes")
    .select("id")
    .eq(
      "reel_id",
      reelId
    )
    .eq(
      "user_id",
      currentUser.id
    )
    .maybeSingle();

  if(error){

    return false;
  }

  return !!data;
}


/* =====================================================
   TOGGLE LIKE
===================================================== */

async function toggleLike(
  reelId,
  button
){

  if(!currentUser){

    toast(
      "Like করতে Login করুন"
    );

    return;
  }

  const alreadyLiked =
    button.classList.contains(
      "liked"
    );


  if(alreadyLiked){

    const {
      error
    } = await supabaseClient
      .from("reel_likes")
      .delete()
      .eq(
        "reel_id",
        reelId
      )
      .eq(
        "user_id",
        currentUser.id
      );

    if(error){

      console.error(error);

      toast(
        "Unlike করা যায়নি"
      );

      return;
    }

    button.classList.remove(
      "liked"
    );

  }else{

    const {
      error
    } = await supabaseClient
      .from("reel_likes")
      .insert({
        reel_id:reelId,
        user_id:currentUser.id
      });

    if(error){

      console.error(error);

      if(
        error.code ===
        "23505"
      ){

        button.classList.add(
          "liked"
        );

      }else{

        toast(
          "Like করা যায়নি"
        );

        return;
      }

    }else{

      button.classList.add(
        "liked"
      );

    }

  }


  const count =
    await getLikeCount(
      reelId
    );

  const reel =
    document.querySelector(
      `.reel[data-id="${reelId}"]`
    );

  if(reel){

    const countElement =
      reel.querySelector(
        ".like-count"
      );

    if(countElement){

      countElement.textContent =
        count;

    }

  }


  if(
    !alreadyLiked
  ){

    await sendLikeNotification(
      reelId
    );

  }
}


/* =====================================================
   LIKE NOTIFICATION
===================================================== */

/* =====================================================

async function loadComments(
  reelId
){

  const {
    data,
    error
  } = await supabaseClient
    .from("reel_comments")
    .select(`
      id,
      reel_id,
      user_id,
      comment,
      created_at
    `)
    .eq(
      "reel_id",
      reelId
    )
    .order(
      "created_at",
      {
        ascending:true
      }
    );

  const list =
    document.getElementById(
      "commentsList"
    );

  if(error){

    console.error(error);

    list.innerHTML = `
      <p>
        Comment লোড করা যায়নি।
      </p>
    `;

    return;
  }


  if(!data || !data.length){

    list.innerHTML = `
      <p style="color:#777;text-align:center">
        এখনো কোনো Comment নেই।
      </p>
    `;

    return;
  }


  list.innerHTML =
    data.map(
      item => `

        <div class="comment-item">

          <img
            class="comment-avatar"
            src="https://ui-avatars.com/api/?name=User&background=1877f2&color=fff"
          >

          <div class="comment-body">

            <div class="comment-user">
              ${shortId(item.user_id)}
            </div>

            <div class="comment-text">
              ${escapeHtml(item.comment)}
            </div>

          </div>

        </div>
      `
    ).join("");
}

async function sendComment(){

  if(!currentUser){

    toast(
      "Comment করতে Login করুন"
    );

    return;
  }

  const input =
    document.getElementById(
      "commentText"
    );

  const text =
    input.value.trim();

  if(!text){

    return;
  }

  if(!currentCommentReelId){

    return;
  }


  const {
    error
  } = await supabaseClient
    .from("reel_comments")
    .insert({
      reel_id:
        currentCommentReelId,

      user_id:
        currentUser.id,

      comment:
        text
    });


  if(error){

    console.error(error);

    toast(
      "Comment করা যায়নি"
    );

    return;
  }


  input.value = "";

  await loadComments(
    currentCommentReelId
  );


  const count =
    await getCommentCount(
      currentCommentReelId
    );

  const reel =
    document.querySelector(
      `.reel[data-id="${currentCommentReelId}"]`
    );

  if(reel){

    const countElement =
      reel.querySelector(
        ".comment-count"
      );

    if(countElement){

      countElement.textContent =
        count;

    }

  }


  await sendCommentNotification(
    currentCommentReelId
  );
}

/* =====================================================

===================================================== */

async function toggleFollow(
  userId,
  button
){

  if(!currentUser){

    toast(
      "Follow করতে Login করুন"
    );

    return;
  }


  const following =
    button.classList.contains(
      "following"
    );


  if(following){

    const {
      error
    } = await supabaseClient
      .from("follows")
      .delete()
      .eq(
        "follower_id",
        currentUser.id
      )
      .eq(
        "following_id",
        userId
      );

    if(error){

      console.error(error);

      toast(
        "Unfollow করা যায়নি"
      );

      return;
    }

    button.classList.remove(
      "following"
    );

    button.textContent =
      "Follow";

  }else{

    const {
      error
    } = await supabaseClient
      .from("follows")
      .insert({
        follower_id:
          currentUser.id,

        following_id:
          userId
      });

    if(error){

      console.error(error);

      if(
        error.code ===
        "23505"
      ){

        button.classList.add(
          "following"
        );

        button.textContent =
          "Following";

      }else{

        toast(
          "Follow করা যায়নি"
        );

        return;
      }

    }else{

      button.classList.add(
        "following"
      );

      button.textContent =
        "Following";

    }

  }

  await sendFollowNotification(
    userId
  );
}

===================================================== */

const viewedReels =
  new Set();


async function addViewOnce(
  reelId
){

  if(
    viewedReels.has(
      reelId
    )
  ){

    return;
  }

  viewedReels.add(
    reelId
  );


  const reel =
    reelsData.find(
      r =>
        Number(r.id) ===
        Number(reelId)
    );

  if(!reel){

    return;
  }


  const currentViews =
    Number(
      reel.views || 0
    );


  const {
    error
  } = await supabaseClient
    .from("reels")
    .update({
      views:
        currentViews + 1
    })
    .eq(
      "id",
      reelId
    );


  if(error){

    console.log(
      "View error:",
      error.message
    );

  }else{

    reel.views =
      currentViews + 1;

  }
}

/* =====================================================
   UPLOAD REEL
===================================================== */

async function uploadReel(){

  if(!currentUser){

    toast(
      "আগে Login করুন"
    );

    return;
  }


  const fileInput =
    document.getElementById(
      "reelFile"
    );

  const captionInput =
    document.getElementById(
      "reelCaption"
    );

  const audioInput =
    document.getElementById(
      "reelAudio"
    );


  const file =
    fileInput.files[0];

  if(!file){

    toast(
      "একটি Video নির্বাচন করুন"
    );

    return;
  }


  if(
    !file.type.startsWith(
      "video/"
    )
  ){

    toast(
      "শুধু Video Upload করুন"
    );

    return;
  }


  const maxSize =
    100 * 1024 * 1024;


  if(
    file.size >
    maxSize
  ){

    toast(
      "Video সর্বোচ্চ 100MB হতে পারবে"
    );

    return;
  }


  const progress =
    document.getElementById(
      "uploadProgress"
    );

  const progressBar =
    document.getElementById(
      "progressBar"
    );


  progress.style.display =
    "block";

  progressBar.style.width =
    "10%";


  const extension =
    file.name
      .split(".")
      .pop()
      .toLowerCase();


  const fileName =
    currentUser.id +
    "_" +
    Date.now() +
    "." +
    extension;


  const filePath =
    fileName;


  toast(
    "Video Upload হচ্ছে..."
  );


  const {
    error:
      uploadError
  } = await supabaseClient
    .storage
    .from("reels")
    .upload(
      filePath,
      file,
      {
        cacheControl:"3600",
        upsert:false,
        contentType:
          file.type
      }
    );


  if(uploadError){

    console.error(
      uploadError
    );

    progress.style.display =
      "none";

    toast(
      "Video Upload হয়নি: " +
      uploadError.message
    );

    return;
  }


  progressBar.style.width =
    "65%";


  const {
    data:
      publicData
  } = supabaseClient
    .storage
    .from("reels")
    .getPublicUrl(
      filePath
    );


  const videoUrl =
    publicData.publicUrl;


  const {
    error:
      insertError
  } = await supabaseClient
    .from("reels")
    .insert({
      user_id:
        currentUser.id,

      video_url:
        videoUrl,

      caption:
        captionInput.value.trim(),

      views:
        0,

      audio_name:
        audioInput.value.trim() ||
        "Original audio"
    });


  if(insertError){

    console.error(
      insertError
    );


    await supabaseClient
      .storage
      .from("reels")
      .remove([
        filePath
      ]);


    progress.style.display =
      "none";

    toast(
      "Reel database-এ যোগ হয়নি: " +
      insertError.message
    );

    return;
  }


  progressBar.style.width =
    "100%";


  fileInput.value =
    "";

  captionInput.value =
    "";

  audioInput.value =
    "";


  closeUpload();


  progress.style.display =
    "none";

  progressBar.style.width =
    "0%";


  toast(
    "Reel সফলভাবে Upload হয়েছে"
  );


  await loadReels();
}


/* =====================================================
   INTERSECTION OBSERVER
===================================================== */

function setupObserver(){

  if(observer){

    observer.disconnect();

  }


  const videos =
    document.querySelectorAll(
      ".reel video"
    );


  observer =
    new IntersectionObserver(
      entries => {

        entries.forEach(
          entry => {

            const video =
              entry.target;

            const reel =
              video.closest(
                ".reel"
              );

            if(
              entry.isIntersecting &&
              entry.intersectionRatio >
              .65
            ){

              videos.forEach(
                other => {

                  if(
                    other !==
                    video
                  ){

                    other.pause();

                  }

                }
              );


              video.play()
                .catch(
                  () => {}
                );


              if(reel){

                currentReelId =
                  Number(
                    reel.dataset.id
                  );

              }

            }else{

              video.pause();

            }

          }
        );

      },
      {
        threshold:[
          .65
        ]
      }
    );


  videos.forEach(
    video => {

      observer.observe(
        video
      );

    }
  );
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
  value
){

  return String(
    value
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );
}


function escapeAttr(
  value
){

  return escapeHtml(
    value
  );
}


/* =====================================================
   SHORT USER ID
===================================================== */

function shortId(
  id
){

  if(!id){

    return "User";

  }

  return (
    "User " +
    String(id)
      .substring(
        0,
        6
      )
  );
}
