<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1877f2">

<title>FriendBook</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

:root{
 --blue:#1877f2;
 --bg:#f0f2f5;
 --card:#fff;
 --text:#1c1e21;
 --muted:#65676b;
 --border:#dddfe2;
 --danger:#e41e3f;
}

body.dark{
 --bg:#18191a;
 --card:#242526;
 --text:#e4e6eb;
 --muted:#b0b3b8;
 --border:#3a3b3c;
}

body{
 margin:0;
 font-family:Arial,"Noto Sans Bengali",sans-serif;
 background:var(--bg);
 color:var(--text);
}

button,input,textarea,select{
 font:inherit;
}

button{
 cursor:pointer;
 border:0;
}

.top{
 position:sticky;
 top:0;
 z-index:1000;
 height:58px;
 background:var(--card);
 border-bottom:1px solid var(--border);
 display:flex;
 align-items:center;
 padding:0 12px;
 gap:10px;
}

.logo{
 font-size:24px;
 font-weight:800;
 color:var(--blue);
}

.search{
 flex:1;
 max-width:350px;
 background:var(--bg);
 border-radius:22px;
 padding:10px 15px;
 border:0;
 outline:none;
 color:var(--text);
}

.nav{
 display:flex;
 gap:5px;
 margin-left:auto;
}

.nav button{
 background:transparent;
 color:var(--muted);
 padding:10px 13px;
 border-radius:9px;
 font-size:20px;
}

.nav button:hover{
 background:var(--bg);
 color:var(--blue);
}

.container{
 max-width:1100px;
 margin:auto;
 padding:15px;
}

.card{
 background:var(--card);
 border-radius:12px;
 padding:14px;
 margin-bottom:14px;
 box-shadow:0 1px 2px #0002;
}

.auth{
 max-width:430px;
 margin:70px auto;
}

.auth h1{
 color:var(--blue);
 text-align:center;
}

.input{
 width:100%;
 padding:13px;
 margin:7px 0;
 border:1px solid var(--border);
 border-radius:8px;
 background:var(--card);
 color:var(--text);
 outline:none;
}

.btn{
 background:var(--blue);
 color:white;
 padding:11px 17px;
 border-radius:8px;
 font-weight:bold;
}

.btn.gray{
 background:#e4e6eb;
 color:#1c1e21;
}

body.dark .btn.gray{
 background:#3a3b3c;
 color:white;
}

.btn.red{
 background:var(--danger);
}

.small{
 color:var(--muted);
 font-size:13px;
}

.hidden{
 display:none!important;
}

.avatar{
 width:44px;
 height:44px;
 border-radius:50%;
 object-fit:cover;
 background:#ddd;
}

.row{
 display:flex;
 align-items:center;
 gap:10px;
}

.between{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
}

.composer{
 display:flex;
 gap:10px;
 align-items:center;
}

.composer textarea{
 flex:1;
 min-height:45px;
 border:0;
 background:var(--bg);
 border-radius:22px;
 padding:13px;
 color:var(--text);
 resize:none;
 outline:none;
}

.post-head{
 display:flex;
 align-items:center;
 gap:10px;
}

.post-text{
 white-space:pre-wrap;
 margin:12px 0;
 line-height:1.5;
}

.post-img{
 width:100%;
 max-height:650px;
 object-fit:cover;
 border-radius:9px;
}

.actions{
 display:flex;
 gap:5px;
 border-top:1px solid var(--border);
 border-bottom:1px solid var(--border);
 margin-top:10px;
 padding:5px 0;
}

.action{
 flex:1;
 background:transparent;
 color:var(--muted);
 padding:10px 5px;
 border-radius:7px;
}

.action:hover{
 background:var(--bg);
}

.comment{
 background:var(--bg);
 border-radius:14px;
 padding:8px 12px;
 margin:7px 0;
}

.comment-actions{
 font-size:12px;
 color:var(--muted);
 margin-top:4px;
}

.comment-input{
 display:flex;
 gap:6px;
 margin-top:8px;
}

.comment-input input{
 flex:1;
 padding:10px 13px;
 border-radius:20px;
 border:0;
 background:var(--bg);
 color:var(--text);
 outline:none;
}

.grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:10px;
}

.menu-grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px;
}

.menu{
 background:var(--bg);
 border-radius:10px;
 padding:15px;
 cursor:pointer;
}

.menu:hover{
 outline:2px solid var(--blue);
}

.profile-cover{
 height:260px;
 background:#ccd0d5;
 border-radius:12px 12px 0 0;
 overflow:hidden;
}

.profile-cover img{
 width:100%;
 height:100%;
 object-fit:cover;
}

.profile-main{
 margin-top:-55px;
 padding:0 20px 20px;
 position:relative;
}

.profile-big{
 width:110px;
 height:110px;
 border-radius:50%;
 border:5px solid var(--card);
 object-fit:cover;
 background:#ddd;
}

.profile-name{
 font-size:25px;
 font-weight:bold;
 margin-top:8px;
}

.tabs{
 display:flex;
 overflow:auto;
 gap:5px;
 border-top:1px solid var(--border);
 margin-top:15px;
 padding-top:8px;
}

.tab{
 padding:10px 16px;
 background:transparent;
 color:var(--muted);
 border-radius:8px;
 white-space:nowrap;
}

.tab.active{
 color:var(--blue);
 background:#e7f3ff;
}

.reels{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:10px;
}

.reel{
 background:#000;
 border-radius:12px;
 overflow:hidden;
 position:relative;
 min-height:350px;
}

.reel video{
 width:100%;
 height:520px;
 object-fit:cover;
 background:#000;
}

.reel-info{
 position:absolute;
 bottom:0;
 left:0;
 right:0;
 padding:15px;
 color:#fff;
 background:linear-gradient(transparent,#000b);
}

.reel-actions{
 display:flex;
 gap:5px;
 margin-top:8px;
}

.reel-actions button{
 background:#ffffff22;
 color:#fff;
 padding:8px 12px;
 border-radius:20px;
}

.story-row{
 display:flex;
 gap:10px;
 overflow-x:auto;
 padding-bottom:4px;
}

.story{
 min-width:110px;
 height:160px;
 border-radius:12px;
 overflow:hidden;
 position:relative;
 background:#1877f2;
 color:#fff;
 cursor:pointer;
}

.story img{
 width:100%;
 height:100%;
 object-fit:cover;
}

.story span{
 position:absolute;
 bottom:8px;
 left:8px;
 font-weight:bold;
 text-shadow:0 1px 4px #000;
}

.stat{
 text-align:center;
 flex:1;
}

.stat strong{
 display:block;
 font-size:20px;
}

.list-item{
 display:flex;
 align-items:center;
 gap:10px;
 padding:10px;
 border-radius:9px;
}

.list-item:hover{
 background:var(--bg);
}

.chat{
 height:520px;
 display:flex;
 flex-direction:column;
}

.chat-box{
 flex:1;
 overflow:auto;
 padding:10px;
}

.message{
 max-width:75%;
 padding:9px 12px;
 border-radius:15px;
 margin:6px 0;
 background:var(--bg);
}

.message.mine{
 margin-left:auto;
 background:var(--blue);
 color:white;
}

.badge{
 display:inline-block;
 padding:3px 8px;
 background:#e7f3ff;
 color:var(--blue);
 border-radius:20px;
 font-size:12px;
}

.empty{
 text-align:center;
 padding:35px;
 color:var(--muted);
}

.loader{
 text-align:center;
 padding:30px;
}

.toast{
 position:fixed;
 bottom:20px;
 left:50%;
 transform:translateX(-50%);
 background:#222;
 color:#fff;
 padding:12px 18px;
 border-radius:25px;
 z-index:9999;
}

.modal{
 position:fixed;
 inset:0;
 background:#0009;
 display:flex;
 align-items:center;
 justify-content:center;
 z-index:5000;
 padding:15px;
}

.modal-box{
 background:var(--card);
 width:100%;
 max-width:600px;
 max-height:90vh;
 overflow:auto;
 border-radius:14px;
 padding:18px;
}

.close{
 float:right;
 background:var(--bg);
 border-radius:50%;
 width:35px;
 height:35px;
}

.stat-grid{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:10px;
}

.stat-card{
 background:var(--bg);
 padding:15px;
 border-radius:10px;
 text-align:center;
}

@media(max-width:700px){
 .nav button{
  font-size:17px;
  padding:9px;
 }
 .logo{
  font-size:20px;
 }
 .search{
  max-width:150px;
 }
 .container{
  padding:8px;
 }
 .grid,.reels{
  grid-template-columns:repeat(2,1fr);
 }
 .stat-grid{
  grid-template-columns:repeat(2,1fr);
 }
 .profile-cover{
  height:180px;
 }
 .reel video{
  height:450px;
 }
}

@media(max-width:450px){
 .nav button:nth-child(n+4){
  display:none;
 }
 .menu-grid{
  grid-template-columns:1fr;
 }
}
</style>
</head>

<body>

<div id="toast" class="toast hidden"></div>

<!-- LOGIN -->
<div id="authPage" class="auth card">
 <h1>FriendBook</h1>
 <p style="text-align:center" class="small">
  আপনার নিজের Social Network
 </p>

 <input id="email" class="input" type="email" placeholder="Email">
 <input id="password" class="input" type="password" placeholder="Password">

 <button class="btn" style="width:100%" onclick="login()">
  Login
 </button>

 <br><br>

 <input id="signupName" class="input" placeholder="আপনার নাম">

 <button class="btn gray" style="width:100%" onclick="signup()">
  Create new account
 </button>

 <p id="authMsg" class="small"></p>
</div>

<!-- APP -->
<div id="app" class="hidden">

<header class="top">
 <div class="logo">FriendBook</div>

 <input
   id="globalSearch"
   class="search"
   placeholder="Search FriendBook..."
   onkeydown="if(event.key==='Enter') searchAll()"
 >

 <nav class="nav">
  <button onclick="home()">🏠</button>
  <button onclick="showReels()">🎬</button>
  <button onclick="showProfile()">👤</button>
  <button onclick="showMessages()">💬</button>
  <button onclick="showNotifications()">🔔</button>
  <button onclick="showSettings()">⚙️</button>
 </nav>
</header>

<main id="content" class="container"></main>

</div>

<script>
/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://skereuaizdczbvjplisi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_3R2otJA1zIlsMsTYxe1ocw_NAPY5O9x";

const sb = window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

let currentUser=null;
let currentProfile=null;
let currentChatUser=null;
let realtimeChannel=null;

/* =====================================================
   BASIC
===================================================== */

function toast(msg){
 const t=document.getElementById("toast");
 t.textContent=msg;
 t.classList.remove("hidden");

 setTimeout(()=>{
  t.classList.add("hidden");
 },2500);
}

function esc(v){
 if(v===null||v===undefined)return "";
 return String(v)
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");
}

function avatar(url,name="User"){
 return url ||
 `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=1877f2&color=fff`;
}

function timeAgo(date){
 if(!date)return "";
 const sec=Math.floor((Date.now()-new Date(date).getTime())/1000);

 if(sec<60)return "এখনই";
 if(sec<3600)return Math.floor(sec/60)+" মিনিট আগে";
 if(sec<86400)return Math.floor(sec/3600)+" ঘণ্টা আগে";
 if(sec<604800)return Math.floor(sec/86400)+" দিন আগে";

 return new Date(date).toLocaleDateString("bn-BD");
}

function setContent(html){
 document.getElementById("content").innerHTML=html;
}

function showLoader(){
 setContent(`<div class="card loader">লোড হচ্ছে...</div>`);
}

/* =====================================================
   AUTH
===================================================== */

async function login(){

 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;

 if(!email||!password){
  document.getElementById("authMsg").textContent="Email ও Password দিন";
  return;
 }

 document.getElementById("authMsg").textContent="Login হচ্ছে...";

 const {data,error}=await sb.auth.signInWithPassword({
  email,
  password
 });

 if(error){
  document.getElementById("authMsg").textContent=
   error.message;
  return;
 }

 currentUser=data.user;

 await startApp();
}

async function signup(){

 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 const name=document.getElementById("signupName").value.trim();

 if(!email||!password||!name){
  document.getElementById("authMsg").textContent=
   "নাম, Email ও Password দিন";
  return;
 }

 if(password.length<6){
  document.getElementById("authMsg").textContent=
   "Password কমপক্ষে ৬ অক্ষরের হতে হবে";
  return;
 }

 const {data,error}=await sb.auth.signUp({
  email,
  password
 });

 if(error){
  document.getElementById("authMsg").textContent=
   error.message;
  return;
 }

 if(data.user){

  await sb.from("fb_profiles").insert({
   id:data.user.id,
   name:name,
   username:
    name.toLowerCase()
    .replace(/[^a-z0-9]/g,"")
    .slice(0,30)
  });

  toast("Account তৈরি হয়েছে");

  if(data.session){
   currentUser=data.user;
   await startApp();
  }else{
   document.getElementById("authMsg").textContent=
    "Account তৈরি হয়েছে। Email verification থাকলে Email verify করে Login করুন।";
  }
 }
}

async function logout(){

 await sb.auth.signOut();

 currentUser=null;
 currentProfile=null;

 if(realtimeChannel){
  sb.removeChannel(realtimeChannel);
  realtimeChannel=null;
 }

 document.getElementById("app").classList.add("hidden");
 document.getElementById("authPage").classList.remove("hidden");
}

sb.auth.onAuthStateChange(async(event,session)=>{

 if(event==="SIGNED_OUT"){
  document.getElementById("app").classList.add("hidden");
  document.getElementById("authPage").classList.remove("hidden");
 }
});

/* =====================================================
   PROFILE
===================================================== */

async function loadMyProfile(){

 const {data,error}=await sb
 .from("fb_profiles")
 .select("*")
 .eq("id",currentUser.id)
 .maybeSingle();

 if(data){
  currentProfile=data;
  return data;
 }

 const name=
  currentUser.email?.split("@")[0] || "FriendBook User";

 const username=
  name.toLowerCase()
  .replace(/[^a-z0-9]/g,"")
  .slice(0,25) || "user";

 const result=await sb.from("fb_profiles").insert({
  id:currentUser.id,
  name,
  username
 }).select().single();

 currentProfile=result.data;
 return result.data;
}

async function updateOnline(){

 await sb.from("fb_profiles")
 .update({
  online:true,
  last_seen:new Date().toISOString()
 })
 .eq("id",currentUser.id);
}

async function showProfile(userId=currentUser.id){

 showLoader();

 const {data:p}=await sb
 .from("fb_profiles")
 .select("*")
 .eq("id",userId)
 .maybeSingle();

 if(!p){
  setContent(`<div class="card empty">Profile পাওয়া যায়নি</div>`);
  return;
 }

 if(userId!==currentUser.id){

  await sb.from("fb_profile_visitors").upsert({
   profile_id:userId,
   visitor_id:currentUser.id
  },{
   onConflict:"profile_id,visitor_id"
  });
 }

 const [
  postsRes,
  followersRes,
  followingRes,
  friendsRes
 ]=await Promise.all([

  sb.from("fb_posts")
   .select("*",{count:"exact",head:true})
   .eq("user_id",userId),

  sb.from("fb_follows")
   .select("*",{count:"exact",head:true})
   .eq("following_id",userId),

  sb.from("fb_follows")
   .select("*",{count:"exact",head:true})
   .eq("follower_id",userId),

  sb.from("fb_friends")
   .select("*",{count:"exact",head:true})
   .eq("user_id",userId)
 ]);

 const {data:details}=await sb
 .from("fb_profile_details")
 .select("*")
 .eq("user_id",userId)
 .maybeSingle();

 const following=await isFollowing(userId);

 setContent(`

 <div class="card">

  <div class="profile-cover">
   ${
    p.cover_photo
    ? `<img src="${esc(p.cover_photo)}">`
    : ""
   }
  </div>

  <div class="profile-main">

   <img
    class="profile-big"
    src="${avatar(p.profile_photo,p.name)}"
   >

   <div class="profile-name">
    ${esc(p.name||"User")}
    ${p.verified ? " <span class='badge'>✓ Verified</span>":""}
   </div>

   <div class="small">
    @${esc(p.username||"user")}
   </div>

   <p>${esc(p.bio||"")}</p>

   ${
    details
    ? `
     <div class="small">
      ${details.city?`📍 ${esc(details.city)} `:""}
      ${details.work?` 💼 ${esc(details.work)} `:""}
      ${details.education?` 🎓 ${esc(details.education)}`:""}
     </div>
    `
    :""
   }

   <br>

   ${
    userId===currentUser.id
    ? `
     <button class="btn" onclick="editProfile()">
      Edit Profile
     </button>
    `
    :
    `
     <button
      class="btn"
      onclick="${following
       ? `unfollow('${userId}')`
       : `follow('${userId}')`}"
     >
      ${following?"Unfollow":"Follow"}
     </button>

     <button
      class="btn gray"
      onclick="sendFriendRequest('${userId}')"
     >
      Add Friend
     </button>

     <button
      class="btn gray"
      onclick="openChat('${userId}')"
     >
      Message
     </button>
    `
   }

  </div>

  <div class="row">

   <div class="stat">
    <strong>${postsRes.count||0}</strong>
    Posts
   </div>

   <div class="stat">
    <strong>${followersRes.count||0}</strong>
    Followers
   </div>

   <div class="stat">
    <strong>${followingRes.count||0}</strong>
    Following
   </div>

   <div class="stat">
    <strong>${friendsRes.count||0}</strong>
    Friends
   </div>

  </div>

 </div>

 <div class="card">

  <div class="tabs">

   <button class="tab active"
    onclick="showProfile('${userId}')">
    Posts
   </button>

   <button class="tab"
    onclick="showProfileAbout('${userId}')">
    About
   </button>

   <button class="tab"
    onclick="showFollowers('${userId}')">
    Followers
   </button>

   <button class="tab"
    onclick="showFollowing('${userId}')">
    Following
   </button>

  </div>

 </div>

 <div id="profilePosts"></div>
 `);

 await loadPostsInto(
  document.getElementById("profilePosts"),
  userId
 );
}

/* =====================================================
   PROFILE EDIT
===================================================== */

async function editProfile(){

 const p=currentProfile || await loadMyProfile();

 setContent(`

 <div class="card">

  <div class="between">
   <h2>Edit Profile</h2>
   <button class="close" onclick="showProfile()">×</button>
  </div>

  <input id="epName"
   class="input"
   value="${esc(p.name||"")}"
   placeholder="Name">

  <input id="epUsername"
   class="input"
   value="${esc(p.username||"")}"
   placeholder="Username">

  <textarea id="epBio"
   class="input"
   placeholder="Bio">${esc(p.bio||"")}</textarea>

  <input id="epPhoto"
   class="input"
   value="${esc(p.profile_photo||"")}"
   placeholder="Profile Photo URL">

  <input id="epCover"
   class="input"
   value="${esc(p.cover_photo||"")}"
   placeholder="Cover Photo URL">

  <button class="btn" onclick="saveProfile()">
   Save Profile
  </button>

 </div>

 <div class="card">

  <h3>About / Intro</h3>

  <input id="pdCity" class="input"
   placeholder="City">

  <input id="pdWork" class="input"
   placeholder="Work">

  <input id="pdEducation" class="input"
   placeholder="Education">

  <input id="pdWebsite" class="input"
   placeholder="Website">

  <button class="btn" onclick="saveDetails()">
   Save About
  </button>

 </div>
 `);

 const {data:d}=await sb
 .from("fb_profile_details")
 .select("*")
 .eq("user_id",currentUser.id)
 .maybeSingle();

 if(d){
  pdCity.value=d.city||"";
  pdWork.value=d.work||"";
  pdEducation.value=d.education||"";
  pdWebsite.value=d.website||"";
 }
}

async function saveProfile(){

 const obj={
  name:document.getElementById("epName").value.trim(),
  username:document.getElementById("epUsername").value.trim(),
  bio:document.getElementById("epBio").value.trim(),
  profile_photo:document.getElementById("epPhoto").value.trim(),
  cover_photo:document.getElementById("epCover").value.trim(),
  updated_at:new Date().toISOString()
 };

 const {error}=await sb
 .from("fb_profiles")
 .update(obj)
 .eq("id",currentUser.id);

 if(error){
  toast(error.message);
  return;
 }

 await loadMyProfile();
 toast("Profile updated");
 showProfile();
}

async function saveDetails(){

 const obj={
  user_id:currentUser.id,
  city:document.getElementById("pdCity").value.trim(),
  work:document.getElementById("pdWork").value.trim(),
  education:document.getElementById("pdEducation").value.trim(),
  website:document.getElementById("pdWebsite").value.trim(),
  updated_at:new Date().toISOString()
 };

 const {data:old}=await sb
 .from("fb_profile_details")
 .select("user_id")
 .eq("user_id",currentUser.id)
 .maybeSingle();

 let error;

 if(old){
  ({error}=await sb
   .from("fb_profile_details")
   .update(obj)
   .eq("user_id",currentUser.id));
 }else{

async function loadChat(){

 const {data:messages,error}=await sb
 .from("fb_messages")
 .select("*")
 .or(
  `and(sender_id.eq.${currentUser.id},receiver_id.eq.${currentChatUser}),and(sender_id.eq.${currentChatUser},receiver_id.eq.${currentUser.id})`
 )
 .order("created_at",{ascending:true});

 if(error){
  chatBox.innerHTML=esc(error.message);
  return;
 }

 let html="";

 for(const m of messages||[]){

  html+=`
   <div class="message ${
    m.sender_id===currentUser.id?"mine":""
   }">
    ${esc(m.text||"")}
    <div class="small">
     ${timeAgo(m.created_at)}
     ${m.seen?" ✓✓":""}
    </div>
   </div>
  `;
 }

 chatBox.innerHTML=
  html||`<div class="empty">Start chatting</div>`;

 chatBox.scrollTop=chatBox.scrollHeight;

 await sb.from("fb_messages")
 .update({seen:true})
 .eq("sender_id",currentChatUser)
 .eq("receiver_id",currentUser.id);
}

async function sendMessage(){

 const input=document.getElementById("messageInput");
 const text=input.value.trim();

 if(!text)return;

 const {error}=await sb
 .from("fb_messages")
 .insert({
  sender_id:currentUser.id,
  receiver_id:currentChatUser,
  text,
  seen:false
 });

 if(error){
  toast(error.message);
  return;
 }

 input.value="";

 await notify(
  currentChatUser,
  "message",
  "আপনাকে একটি Message পাঠিয়েছে"
 );

 await loadChat();
}

async function saveCreatorSettings(){

  monetization_enabled:
   document.getElementById("monetization").value==="true",
  payout_method:
   document.getElementById("payoutMethod").value.trim(),
  payout_email:
   document.getElementById("payoutEmail").value.trim(),
  updated_at:new Date().toISOString()
 };

 const {data:old}=await sb
 .from("fb_creator_settings")
 .select("user_id")
 .eq("user_id",currentUser.id)
 .maybeSingle();

 let error;

 if(old){

  ({error}=await sb
   .from("fb_creator_settings")
   .update(obj)
   .eq("user_id",currentUser.id));

 }else{

  ({error}=await sb
   .from("fb_creator_settings")
   .insert(obj));
 }

 if(error){
  toast(error.message);
  return;
 }

 toast("Creator settings saved");
}

async function createMarketplaceItem(){

 const title=prompt("Product name:");

 if(!title)return;

 const price=prompt("Price:");

 const image=prompt("Image URL:");

 const location=prompt("Location:");

 const description=prompt("Description:")||"";

 const {error}=await sb
 .from("fb_marketplace_items")
 .insert({
  user_id:currentUser.id,
  title,
  price:Number(price)||0,
  image_url:image,
  location,
  description,
  status:"available"
 });

 if(error){
  toast(error.message);
  return;
 }

 toast("Listing created");
 showMarketplace();
}

 openChat(userId);
}

async function showCoins(){

 const {data:c}=await sb
 .from("fb_coins")
 .select("*")
 .eq("user_id",currentUser.id)
 .maybeSingle();

 const {data:tx}=await sb
 .from("fb_coin_transactions")
 .select("*")
 .eq("user_id",currentUser.id)
 .order("created_at",{ascending:false})
 .limit(20);

 setContent(`

 <div class="card">

  <h2>🪙 Coins</h2>

  <div class="stat-card">
   <strong>${c?.balance||0}</strong>
   Coin Balance
  </div>

  <br>

  <button class="btn"
   onclick="addDemoCoins()">
   Demo +100 Coins
  </button>

 </div>

 <div class="card">

  <h3>Transactions</h3>

  ${
   (tx||[]).map(x=>`
    <div class="list-item">
     <span>${esc(x.description||x.transaction_type||"Transaction")}</span>
     <b>${x.amount}</b>
    </div>
   `).join("")
   ||
   `<div class="empty">No transactions</div>`
  }

 </div>
 `);
}

async function addDemoCoins(){

 const {data:c}=await sb
 .from("fb_coins")
 .select("*")
 .eq("user_id",currentUser.id)
 .maybeSingle();

 if(c){

  await sb.from("fb_coins")
   .update({
    balance:Number(c.balance||0)+100,
    updated_at:new Date().toISOString()
   })
   .eq("user_id",currentUser.id);

 }else{

  await sb.from("fb_coins")
   .insert({
    user_id:currentUser.id,
    balance:100
   });
 }

 await sb.from("fb_coin_transactions")
 .insert({
  user_id:currentUser.id,
  amount:100,
  transaction_type:"demo",
  description:"Demo coins"
 });

 toast("+100 Coins");
 showCoins();
}

/* =====================================================
   ACCOUNT START
===================================================== */

async function startApp(){

 document.getElementById("authPage")
 .classList.add("hidden");

 document.getElementById("app")
 .classList.remove("hidden");

 await loadMyProfile();
 await updateOnline();

 home();

 startRealtime();
}

/* =====================================================
   REALTIME
===================================================== */

function startRealtime(){

 if(realtimeChannel){
  sb.removeChannel(realtimeChannel);
 }

 realtimeChannel=
 sb.channel("friendbook-live")

 .on(
  "postgres_changes",
  {
   event:"INSERT",
   schema:"public",
   table:"fb_notifications",
   filter:`receiver_id=eq.${currentUser.id}`
  },
  ()=>{
   toast("🔔 New notification");
  }
 )

 .on(
  "postgres_changes",
  {
   event:"INSERT",
   schema:"public",
   table:"fb_messages",
   filter:`receiver_id=eq.${currentUser.id}`
  },
  ()=>{
   toast("💬 New message");

   if(currentChatUser){
    loadChat();
   }
  }
 )

 .subscribe();
}

/* =====================================================
   BOOT
===================================================== */

async function boot(){

 loadTheme();

 const {data,error}=await sb.auth.getSession();

 if(error){
  document.getElementById("authMsg").textContent=
   error.message;
  return;
 }

 if(data?.session){

  currentUser=data.session.user;

  await startApp();

 }else{

  document.getElementById("authPage")
   .classList.remove("hidden");

  document.getElementById("app")
   .classList.add("hidden");
 }
}

boot();

/* =====================================================
   AUTO LAST SEEN
===================================================== */

setInterval(async()=>{

 if(currentUser){

  await sb.from("fb_profiles")
  .update({
   online:true,
   last_seen:new Date().toISOString()
  })
  .eq("id",currentUser.id);
 }

},60000);

/* =====================================================
   PAGE VISIBILITY
===================================================== */

document.addEventListener(
 "visibilitychange",
 async()=>{

  if(!currentUser)return;

  if(document.hidden){

   await sb.from("fb_profiles")
   .update({
    online:false,
    last_seen:new Date().toISOString()
   })
   .eq("id",currentUser.id);

  }else{

   await updateOnline();
  }
 }
);

</script>
