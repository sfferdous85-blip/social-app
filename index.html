<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1877f2">
<meta name="description" content="My Social App">
<title>My Social App</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;background:#f0f2f5;color:#111}
body.dark{background:#18191a;color:#e4e6eb}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0}
a{text-decoration:none;color:inherit}

:root{
 --blue:#1877f2;
 --blue2:#0866ff;
 --bg:#f0f2f5;
 --card:#fff;
 --text:#111;
 --muted:#65676b;
 --border:#dddfe2;
 --green:#31a24c;
 --danger:#e41e3f;
}

body.dark{
 --bg:#18191a;
 --card:#242526;
 --text:#e4e6eb;
 --muted:#b0b3b8;
 --border:#3a3b3c;
}

.hidden{display:none!important}
.app{min-height:100vh}

.topbar{
 position:sticky;
 top:0;
 z-index:1000;
 height:58px;
 background:var(--card);
 border-bottom:1px solid var(--border);
 display:flex;
 align-items:center;
 padding:0 12px;
 gap:10px;
}

.logo{
 font-size:22px;
 font-weight:800;
 color:var(--blue);
 white-space:nowrap;
}

.searchBox{
 flex:1;
 max-width:360px;
 position:relative;
}

.searchBox input{
 width:100%;
 border:0;
 outline:0;
 background:var(--bg);
 color:var(--text);
 padding:11px 15px 11px 40px;
 border-radius:22px;
}

.searchIcon{
 position:absolute;
 left:14px;
 top:9px;
 font-size:18px;
}

.topActions{
 margin-left:auto;
 display:flex;
 gap:6px;
}

.iconBtn{
 width:40px;
 height:40px;
 border-radius:50%;
 background:var(--bg);
 color:var(--text);
 font-size:18px;
 position:relative;
}

.badge{
 position:absolute;
 right:-2px;
 top:-2px;
 background:#e41e3f;
 color:white;
 font-size:10px;
 min-width:17px;
 height:17px;
 padding:2px 4px;
 border-radius:10px;
}

.main{
 max-width:1200px;
 margin:auto;
 display:grid;
 grid-template-columns:220px minmax(0,650px) 250px;
 gap:16px;
 padding:16px;
}

.sidebar,.rightbar{
 position:sticky;
 top:74px;
 height:max-content;
}

.sideCard{
 background:var(--card);
 border-radius:12px;
 padding:8px;
 box-shadow:0 1px 2px rgba(0,0,0,.08);
 margin-bottom:12px;
}

.navItem{
 width:100%;
 padding:12px;
 border-radius:9px;
 background:transparent;
 color:var(--text);
 display:flex;
 align-items:center;
 gap:12px;
 text-align:left;
 font-weight:600;
}

.navItem:hover{background:var(--bg)}

.navItem.active{
 background:#e7f3ff;
 color:var(--blue);
}

body.dark .navItem.active{background:#263c5a}

.card{
 background:var(--card);
 border-radius:12px;
 margin-bottom:14px;
 box-shadow:0 1px 2px rgba(0,0,0,.08);
 overflow:hidden;
}

.cardPad{padding:14px}

.composer{
 display:flex;
 gap:10px;
 align-items:center;
}

.avatar{
 width:42px;
 height:42px;
 border-radius:50%;
 object-fit:cover;
 background:#ddd;
 flex:none;
}

.avatar.sm{width:34px;height:34px}
.avatar.lg{width:90px;height:90px}

.fakeInput{
 flex:1;
 background:var(--bg);
 border-radius:22px;
 padding:12px 16px;
 color:var(--muted);
 cursor:pointer;
}

.storyRow{
 display:flex;
 gap:10px;
 overflow-x:auto;
 padding:14px;
}

.story{
 min-width:105px;
 height:160px;
 border-radius:12px;
 overflow:hidden;
 position:relative;
 background:linear-gradient(135deg,#1877f2,#9b59b6);
 color:white;
 cursor:pointer;
}

.story img,.story video{
 width:100%;
 height:100%;
 object-fit:cover;
}

.storyOverlay{
 position:absolute;
 inset:0;
 background:linear-gradient(transparent 50%,rgba(0,0,0,.75));
}

.storyName{
 position:absolute;
 bottom:10px;
 left:8px;
 right:8px;
 font-size:12px;
 font-weight:bold;
}

.postHeader{
 display:flex;
 gap:10px;
 padding:14px 14px 8px;
}

.postMeta{flex:1}
.postName{font-weight:700}
.postTime{font-size:12px;color:var(--muted);margin-top:3px}

.postMenu{
 background:transparent;
 color:var(--muted);
 font-size:20px;
}

.postText{
 padding:5px 14px 12px;
 white-space:pre-wrap;
 line-height:1.45;
}

.postImage{
 width:100%;
 max-height:650px;
 object-fit:cover;
 display:block;
}

.postStats{
 padding:8px 14px;
 display:flex;
 justify-content:space-between;
 color:var(--muted);
 font-size:13px;
 border-bottom:1px solid var(--border);
}

.postActions{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 padding:4px;
}

.actionBtn{
 background:transparent;
 color:var(--muted);
 padding:9px 4px;
 border-radius:8px;
 font-weight:600;
}

.actionBtn:hover{background:var(--bg)}
.actionBtn.liked{color:var(--blue)}

.commentBox{
 display:flex;
 gap:8px;
 padding:10px 14px;
 border-top:1px solid var(--border);
}

.commentBox input{
 flex:1;
 border:0;
 outline:0;
 background:var(--bg);
 color:var(--text);
 border-radius:20px;
 padding:10px 13px;
}

.comments{
 padding:0 14px 10px;
}

.comment{
 display:flex;
 gap:8px;
 margin:8px 0;
}

.commentBubble{
 background:var(--bg);
 border-radius:14px;
 padding:8px 11px;
 flex:1;
}

.commentName{font-weight:bold;font-size:13px}
.commentText{font-size:14px;margin-top:2px}

.btn{
 background:var(--blue);
 color:#fff;
 padding:10px 15px;
 border-radius:8px;
 font-weight:700;
}

.btn.secondary{
 background:var(--bg);
 color:var(--text);
}

.btn.danger{background:var(--danger)}
.btn.success{background:var(--green)}

.fullBtn{width:100%}

.tabs{
 display:flex;
 overflow-x:auto;
 background:var(--card);
 border-radius:12px;
 margin-bottom:14px;
}

.tab{
 flex:1;
 min-width:100px;
 padding:13px;
 background:transparent;
 color:var(--muted);
 font-weight:700;
 border-bottom:3px solid transparent;
}

.tab.active{
 color:var(--blue);
 border-bottom-color:var(--blue);
}

.profileCover{
 height:230px;
 background:linear-gradient(135deg,#1877f2,#7b2ff7);
 position:relative;
}

.profileCover img{
 width:100%;
 height:100%;
 object-fit:cover;
}

.profileInfo{
 padding:0 18px 18px;
 position:relative;
}

.profileAvatar{
 margin-top:-60px;
 border:5px solid var(--card);
}

.profileName{
 font-size:25px;
 font-weight:800;
 margin-top:8px;
}

.profileBio{color:var(--muted);margin:6px 0}

.profileStats{
 display:flex;
 gap:25px;
 margin:12px 0;
}

.stat b{display:block;font-size:18px}
.stat span{font-size:12px;color:var(--muted)}

.profileButtons{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
}

.reelsGrid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:3px;
}

.reelThumb{
 aspect-ratio:9/14;
 background:#111;
 position:relative;
 overflow:hidden;
 cursor:pointer;
}

.reelThumb video{
 width:100%;
 height:100%;
 object-fit:cover;
}

.reelCount{
 position:absolute;
 bottom:6px;
 left:7px;
 color:#fff;
 font-size:12px;
 text-shadow:0 1px 3px #000;
}

.reelsViewer{
 position:fixed;
 inset:0;
 background:#000;
 z-index:3000;
 display:none;
}

.reelsViewer.show{display:block}

.reelClose{
 position:absolute;
 top:15px;
 right:15px;
 z-index:20;
 width:42px;
 height:42px;
 border-radius:50%;
 background:rgba(255,255,255,.15);
 color:#fff;
 font-size:22px;
}

.reelFeed{
 height:100%;
 overflow-y:auto;
 scroll-snap-type:y mandatory;
}

.reelItem{
 height:100vh;
 position:relative;
 scroll-snap-align:start;
 display:flex;
 justify-content:center;
 background:#000;
}

.reelVideo{
 width:100%;
 max-width:500px;
 height:100%;
 object-fit:contain;
}

.reelInfo{
 position:absolute;
 bottom:25px;
 left:15px;
 right:75px;
 color:#fff;
 text-shadow:0 1px 4px #000;
}

.reelSide{
 position:absolute;
 right:12px;
 bottom:100px;
 display:flex;
 flex-direction:column;
 gap:12px;
}

.reelSide button{
 width:48px;
 height:48px;
 border-radius:50%;
 background:rgba(0,0,0,.45);
 color:#fff;
 font-size:20px;
}

.modal{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.6);
 z-index:5000;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:15px;
}

.modalBox{
 width:min(600px,100%);
 max-height:90vh;
 overflow:auto;
 background:var(--card);
 color:var(--text);
 border-radius:15px;
}

.modalHeader{
 padding:15px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 border-bottom:1px solid var(--border);
}

.modalBody{padding:15px}

.closeBtn{
 background:var(--bg);
 color:var(--text);
 width:36px;
 height:36px;
 border-radius:50%;
}

.field{
 margin-bottom:12px;
}

.field label{
 display:block;
 margin-bottom:6px;
 font-size:13px;
 font-weight:700;
}

.field input,.field textarea,.field select{
 width:100%;
 padding:11px;
 border:1px solid var(--border);
 border-radius:8px;
 background:var(--card);
 color:var(--text);
 outline:none;
}

.field textarea{min-height:100px;resize:vertical}

.row{
 display:flex;
 gap:8px;
 align-items:center;
}

.row>*{flex:1}

.auth{
 min-height:100vh;
 display:flex;
 justify-content:center;
 align-items:center;
 padding:20px;
 background:linear-gradient(135deg,#1877f2,#7b2ff7);
}

.authBox{
 width:min(420px,100%);
 background:#fff;
 border-radius:18px;
 padding:25px;
 box-shadow:0 15px 50px rgba(0,0,0,.25);
}

.authLogo{
 text-align:center;
 color:#1877f2;
 font-size:30px;
 font-weight:900;
 margin-bottom:20px;
}

.authTabs{
 display:flex;
 margin-bottom:18px;
}

.authTabs button{
 flex:1;
 padding:12px;
 background:#f0f2f5;
 font-weight:bold;
}

.authTabs button.active{
 background:#1877f2;
 color:#fff;
}

.loader{
 text-align:center;
 padding:25px;
 color:var(--muted);
}

.empty{
 text-align:center;
 padding:30px;
 color:var(--muted);
}

.searchResults{
 max-height:500px;
 overflow:auto;
}

.userResult{
 display:flex;
 gap:10px;
 align-items:center;
 padding:10px;
 border-bottom:1px solid var(--border);
 cursor:pointer;
}

.userResult:hover{background:var(--bg)}

.toast{
 position:fixed;
 left:50%;
 bottom:25px;
 transform:translateX(-50%);
 z-index:9000;
 background:#222;
 color:#fff;
 padding:12px 18px;
 border-radius:25px;
 display:none;
 max-width:90%;
 text-align:center;
}

.toast.show{display:block}

.onlineDot{
 width:10px;
 height:10px;
 background:#31a24c;
 border:2px solid var(--card);
 border-radius:50%;
 display:inline-block;
}

.chatLayout{
 display:grid;
 grid-template-columns:220px 1fr;
 min-height:500px;
}

.chatUsers{
 border-right:1px solid var(--border);
 overflow:auto;
}

.chatUser{
 padding:10px;
 display:flex;
 gap:8px;
 align-items:center;
 cursor:pointer;
}

.chatUser:hover,.chatUser.active{background:var(--bg)}

.chatArea{
 display:flex;
 flex-direction:column;
 min-height:500px;
}

.chatMessages{
 flex:1;
 overflow:auto;
 padding:15px;
 background:var(--bg);
}

.msg{
 display:flex;
 margin:6px 0;
}

.msg.me{justify-content:flex-end}

.msgBubble{
 max-width:75%;
 padding:9px 12px;
 border-radius:16px;
 background:var(--card);
}

.msg.me .msgBubble{
 background:var(--blue);
 color:white;
}

.chatInput{
 display:flex;
 gap:7px;
 padding:10px;
 background:var(--card);
 border-top:1px solid var(--border);
}

.chatInput input{
 flex:1;
 border:0;
 background:var(--bg);
 color:var(--text);
 border-radius:20px;
 padding:11px 14px;
 outline:none;
}

.statGrid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px;
}

.statCard{
 background:var(--bg);
 padding:15px;
 border-radius:10px;
}

.statCard b{font-size:24px}
.statCard span{display:block;color:var(--muted);font-size:13px}

.settingRow{
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:14px 0;
 border-bottom:1px solid var(--border);
}

.switch{
 width:48px;
 height:26px;
 border-radius:20px;
 background:#aaa;
 position:relative;
 cursor:pointer;
}

.switch.on{background:var(--blue)}

.switch:after{
 content:"";
 width:20px;
 height:20px;
 border-radius:50%;
 background:#fff;
 position:absolute;
 top:3px;
 left:4px;
 transition:.2s;
}

.switch.on:after{left:24px}

@media(max-width:900px){
 .main{grid-template-columns:1fr}
 .sidebar,.rightbar{display:none}
 .main{padding:10px}
}

@media(max-width:600px){
 .logo{font-size:18px}
 .searchBox{display:none}
 .topbar{height:54px}
 .topActions .hideMobile{display:none}
 .postActions{font-size:12px}
 .reelsGrid{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>

<body>

<div id="toast" class="toast"></div>

<!-- AUTH -->
<section id="authPage" class="auth">
 <div class="authBox">
  <div class="authLogo">My Social App</div>

  <div class="authTabs">
   <button id="loginTab" class="active" onclick="showAuth('login')">Login</button>
   <button id="registerTab" onclick="showAuth('register')">Create Account</button>
  </div>

  <div id="loginForm">
   <div class="field">
    <label>Email</label>
    <input id="loginEmail" type="email" placeholder="Email">
   </div>
   <div class="field">
    <label>Password</label>
    <input id="loginPassword" type="password" placeholder="Password">
   </div>
   <button class="btn fullBtn" onclick="login()">Login</button>
  </div>

  <div id="registerForm" class="hidden">
   <div class="field">
    <label>Name</label>
    <input id="registerName" placeholder="আপনার নাম">
   </div>
   <div class="field">
    <label>Username</label>
    <input id="registerUsername" placeholder="username">
   </div>
   <div class="field">
    <label>Email</label>
    <input id="registerEmail" type="email" placeholder="Email">
   </div>
   <div class="field">
    <label>Password</label>
    <input id="registerPassword" type="password" placeholder="কমপক্ষে ৬ অক্ষর">
   </div>
   <button class="btn fullBtn" onclick="register()">Create Account</button>
  </div>
 </div>
</section>

<!-- APP -->
<section id="appPage" class="app hidden">

<header class="topbar">
 <div class="logo">My Social App</div>

 <div class="searchBox">
  <span class="searchIcon">🔎</span>
  <input id="globalSearch" placeholder="Search..." oninput="searchAll(this.value)">
 </div>

 <div class="topActions">
  <button class="iconBtn hideMobile" onclick="go('home')">🏠</button>
  <button class="iconBtn" onclick="go('messages')">💬</button>
  <button class="iconBtn" onclick="go('notifications')">
   🔔
   <span id="notificationBadge" class="badge hidden">0</span>
  </button>
  <button class="iconBtn" onclick="go('profile')">👤</button>
 </div>
</header>

<main class="main">

<!-- LEFT -->
<aside class="sidebar">
 <div class="sideCard">
  <button class="navItem active" data-nav="home" onclick="go('home')">🏠 Home</button>
  <button class="navItem" data-nav="reels" onclick="go('reels')">🎬 Reels</button>
  <button class="navItem" data-nav="friends" onclick="go('friends')">👥 Friends</button>
  <button class="navItem" data-nav="messages" onclick="go('messages')">💬 Messenger</button>
  <button class="navItem" data-nav="profile" onclick="go('profile')">👤 Profile</button>
  <button class="navItem" data-nav="search" onclick="go('search')">🔎 Search</button>
  <button class="navItem" data-nav="creator" onclick="go('creator')">💰 Creator</button>
  <button class="navItem" data-nav="settings" onclick="go('settings')">⚙️ Settings</button>
  <button id="adminNav" class="navItem hidden" data-nav="admin" onclick="go('admin')">👑 Admin</button>
 </div>

 <div class="sideCard cardPad">
  <button class="btn fullBtn" onclick="logout()">Logout</button>
 </div>
</aside>

<!-- CENTER -->
<section id="content"></section>

<!-- RIGHT -->
<aside class="rightbar">
 <div class="sideCard cardPad">
  <b>My Social App</b>
  <p style="color:var(--muted);font-size:13px">
   আপনার বন্ধুদের সাথে যুক্ত থাকুন।
  </p>
 </div>

 <div class="sideCard">
  <div class="cardPad"><b>Quick Menu</b></div>
  <button class="navItem" onclick="openPostModal()">➕ Create Post</button>
  <button class="navItem" onclick="openReelModal()">🎬 Upload Reel</button>
  <button class="navItem" onclick="openStoryModal()">📖 Add Story</button>
 </div>
</aside>

</main>
</section>

<!-- MODAL -->
<div id="modal" class="modal hidden">
 <div class="modalBox">
  <div class="modalHeader">
   <b id="modalTitle">Modal</b>
   <button class="closeBtn" onclick="closeModal()">✕</button>
  </div>
  <div id="modalBody" class="modalBody"></div>
 </div>
</div>

<!-- REELS VIEWER -->
<div id="reelsViewer" class="reelsViewer">
 <button class="reelClose" onclick="closeReels()">✕</button>
 <div id="reelFeed" class="reelFeed"></div>
</div>

<script>
/* =========================================================
   CONFIG
========================================================= */

const SUPABASE_URL = "https://skereuaizdczbvjplisi.supabase.co";
const SUPABASE_KEY = "sb_publishable_3R2otJA1zIlsMsTYxe1ocw_NAPY5O9x";

const FUNCTION_URL =
 "https://skereuaizdczbvjplisi.supabase.co/functions/v1/super-function";

const {createClient} = supabase;
const db = createClient(SUPABASE_URL,SUPABASE_KEY);

let currentUser = null;
let currentProfile = null;
let currentPage = "home";
let currentChatUser = null;
let currentSearchTimer = null;
let notificationChannel = null;
let messageChannel = null;
let selectedReel = null;

/* =========================================================
   HELPERS
========================================================= */

function toast(message){
 const el=document.getElementById("toast");
 el.textContent=message;
 el.classList.add("show");
 clearTimeout(window.toastTimer);
 window.toastTimer=setTimeout(()=>el.classList.remove("show"),2800);
}

function escapeHtml(value){
 if(value===null||value===undefined)return "";
 return String(value)
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
}

function timeAgo(date){
 if(!date)return "";
 const diff=Math.max(0,Date.now()-new Date(date).getTime());
 const s=Math.floor(diff/1000);
 if(s<60)return "এইমাত্র";
 const m=Math.floor(s/60);
 if(m<60)return m+" মিনিট আগে";
 const h=Math.floor(m/60);
 if(h<24)return h+" ঘণ্টা আগে";
 const d=Math.floor(h/24);
 if(d<7)return d+" দিন আগে";
 return new Date(date).toLocaleDateString("bn-BD");
}

function avatarUrl(profile){
 return profile?.profile_photo ||
 "https://ui-avatars.com/api/?name="+encodeURIComponent(profile?.name||"User");
}

function showModal(title,html){
 document.getElementById("modalTitle").textContent=title;
 document.getElementById("modalBody").innerHTML=html;
 document.getElementById("modal").classList.remove("hidden");
}

function closeModal(){
 document.getElementById("modal").classList.add("hidden");
}

function setLoading(text="লোড হচ্ছে..."){
 document.getElementById("content").innerHTML=
 `<div class="card loader">${escapeHtml(text)}</div>`;
}

function setNav(page){
 document.querySelectorAll("[data-nav]").forEach(x=>{
  x.classList.toggle("active",x.dataset.nav===page);
 });
}

function go(page){
 currentPage=page;
 setNav(page);

 if(page==="home")loadHome();
 else if(page==="reels")loadReelsPage();
 else if(page==="friends")loadFriends();
 else if(page==="messages")loadMessages();
 else if(page==="profile")loadProfile(currentUser.id);
 else if(page==="search")loadSearchPage();
 else if(page==="notifications")loadNotifications();
 else if(page==="creator")loadCreator();
 else if(page==="settings")loadSettings();
 else if(page==="admin")loadAdmin();
}

/* =========================================================
   AUTH
========================================================= */

function showAuth(type){
 const login=type==="login";
 document.getElementById("loginForm").classList.toggle("hidden",!login);
 document.getElementById("registerForm").classList.toggle("hidden",login);
 document.getElementById("loginTab").classList.toggle("active",login);
 document.getElementById("registerTab").classList.toggle("active",!login);
}

async function login(){
 const email=document.getElementById("loginEmail").value.trim();
 const password=document.getElementById("loginPassword").value;

 if(!email||!password){
  toast("Email এবং password দিন");

async function api(path,options={}){
 try{
  const session=(await db.auth.getSession()).data.session;

  const headers={
   "Content-Type":"application/json",
   ...(options.headers||{})
  };

  if(session?.access_token){
   headers.Authorization="Bearer "+session.access_token;
  }

  const res=await fetch(FUNCTION_URL+path,{
   ...options,
   headers
  });

  let data={};

  try{
   data=await res.json();
  }catch(e){}

  if(!res.ok){
   throw new Error(data.error||data.message||("Request failed: "+res.status));
  }

  return data;
 }catch(error){
  console.error(error);
  throw error;
 }
}

async function loadFriends(){

 const [requests,friends,people]=await Promise.all([
  db.from("friend_requests")
   .select("*")
   .eq("receiver_id",currentUser.id)

   .or(`user_id.eq.${currentUser.id},friend_id.eq.${currentUser.id}`)
   .limit(100),
  db.from("profiles")
   .select("*")
   .neq("id",currentUser.id)
   .eq("is_deactivated",false)
   .limit(30)
 ]);

 let html=`
  <div class="card cardPad">
   <h2 style="margin-top:0">👥 Friends</h2>
   <div class="tabs">
    <button class="tab active" onclick="friendSection('suggestions')">Suggestions</button>
    <button class="tab" onclick="friendSection('requests')">Requests</button>
    <button class="tab" onclick="friendSection('friends')">Friends</button>
   </div>
   <div id="friendSection"></div>
  </div>
 `;

 window.friendData={

 };

 friendSection("suggestions");

async function friendSection(type){
 const box=document.getElementById("friendSection");
 if(!box)return;

 if(type==="requests"){
  const requests=window.friendData.requests;

  if(!requests.length){
   box.innerHTML=`<div class="empty">কোনো friend request নেই</div>`;
   return;
  }

  let html="";

  for(const r of requests){
   const p=await getProfile(r.sender_id);

   html+=`
    <div class="userResult">
     <img class="avatar" src="${avatarUrl(p)}">
     <div style="flex:1">
      <b>${escapeHtml(p?.name||"User")}</b>
     </div>
     <button class="btn success" onclick="respondFriend(${r.id},'accepted')">Accept</button>
     <button class="btn secondary" onclick="respondFriend(${r.id},'rejected')">Reject</button>
    </div>`;
  }

  box.innerHTML=html;
 }

 if(type==="friends"){
  const list=window.friendData.friends;

  if(!list.length){
   box.innerHTML=`<div class="empty">এখনো কোনো friend নেই</div>`;
   return;
  }

  let html="";

  for(const f of list){
   const id=f.user_id===currentUser.id?f.friend_id:f.user_id;
   const p=await getProfile(id);

   html+=`
    <div class="userResult" onclick="loadProfile('${id}')">
     <img class="avatar" src="${avatarUrl(p)}">
     <div style="flex:1">
      <b>${escapeHtml(p?.name||"User")}</b>
      <div style="font-size:12px;color:var(--muted)">
       ${p?.online_status?"🟢 Online":"Offline"}
      </div>
     </div>
    </div>`;
  }

  box.innerHTML=html;
 }

 if(type==="suggestions"){
  const list=window.friendData.people;

  let html="";

  for(const p of list){
   const existing=await db.from("friend_requests")
    .select("id,status")
    .eq("sender_id",currentUser.id)
    .eq("receiver_id",p.id)
    .eq("status","pending")
    .maybeSingle();

   html+=`
    <div class="userResult">
     <img class="avatar" src="${avatarUrl(p)}" onclick="loadProfile('${p.id}')">
     <div style="flex:1" onclick="loadProfile('${p.id}')">
      <b>${escapeHtml(p.name||"User")}</b>
      <div style="font-size:12px;color:var(--muted)">
       @${escapeHtml(p.username||"user")}
      </div>
     </div>
     ${existing.data
      ? `<button class="btn secondary">Sent</button>`
      : `<button class="btn" onclick="sendFriendRequest('${p.id}')">Add Friend</button>`}
    </div>`;
  }

  box.innerHTML=html||`<div class="empty">No suggestions</div>`;
 }
}

async function sendFriendRequest(receiverId){
 try{
  const {error}=await db.from("friend_requests").insert({
   sender_id:currentUser.id,
   receiver_id:receiverId,
   status:"pending"
  });

  if(error)throw error;

  try{
   await api("/notifications",{
    method:"POST",
    body:JSON.stringify({
     receiver_id:receiverId,
     text:(currentProfile?.name||"Someone")+" sent you a friend request"
    })
   });
  }catch(e){}

  toast("Friend request sent");
  loadFriends();

 }catch(e){
  toast(e.message);
 }
}

async function respondFriend(id,status){
 try{
  const {data,error}=await db.from("friend_requests")
   .update({status})
   .eq("id",id)
   .eq("receiver_id",currentUser.id)
   .select()
   .single();

  if(error)throw error;

  if(status==="accepted"){
   await db.from("friends").insert({
    user_id:data.sender_id,
    friend_id:data.receiver_id
   });

   try{
    await api("/notifications",{
     method:"POST",
     body:JSON.stringify({
      receiver_id:data.sender_id,
      text:(currentProfile?.name||"Someone")+" accepted your friend request"
     })
    });
   }catch(e){}
  }

  toast(status==="accepted"?"Friend added":"Request rejected");
  loadFriends();

 }catch(e){
  toast(e.message);
 }
}

async function startChat(userId){
 go("messages");

}

async function openChat(userId){
 currentChatUser=userId;

 const p=await getProfile(userId);

 document.getElementById("chatHeader").innerHTML=`
  <div class="row">
   <img class="avatar sm" src="${avatarUrl(p)}">
   <div>
    <b>${escapeHtml(p?.name||"User")}</b>
    <div style="font-size:12px;color:var(--muted)">
     ${p?.online_status?"🟢 Online":"Last seen recently"}
    </div>
   </div>
  </div>`;

 await loadChatMessages();

 if(messageChannel){
  db.removeChannel(messageChannel);
 }

 messageChannel=db.channel("messages-"+currentUser.id+"-"+userId)
 .on(
  "postgres_changes",
  {
   event:"*",
   schema:"public",
   table:"messages"
  },
  payload=>{
   const row=payload.new;
   if(!row)return;

   if(
    (row.sender_id===currentUser.id&&row.receiver_id===userId)||
    (row.sender_id===userId&&row.receiver_id===currentUser.id)
   ){
    loadChatMessages();
   }
  }
 )
 .subscribe();
}

async function loadChatMessages(){
 if(!currentChatUser)return;

 const {data,error}=await db.from("messages")
  .select("*")
  .or(
   `and(sender_id.eq.${currentUser.id},receiver_id.eq.${currentChatUser}),and(sender_id.eq.${currentChatUser},receiver_id.eq.${currentUser.id})`
  )
  .order("created_at",{ascending:true})
  .limit(100);

 if(error){
  document.getElementById("chatMessages").innerHTML=
   `<div class="empty">${escapeHtml(error.message)}</div>`;
  return;
 }

 let html="";

 for(const m of data||[]){
  const me=m.sender_id===currentUser.id;

  html+=`
   <div class="msg ${me?"me":""}">
    <div class="msgBubble">
     ${m.text?escapeHtml(m.text):""}
     ${m.media_url?`<br><a href="${escapeHtml(m.media_url)}" target="_blank">📎 Media</a>`:""}
     <div style="font-size:9px;opacity:.7;margin-top:3px">
      ${timeAgo(m.created_at)}
     </div>
    </div>
   </div>`;
 }

 document.getElementById("chatMessages").innerHTML=
  html||`<div class="empty">No messages</div>`;

 const box=document.getElementById("chatMessages");
 box.scrollTop=box.scrollHeight;
}

async function sendMessage(){
 const input=document.getElementById("messageInput");
 const text=input.value.trim();

 if(!currentChatUser||!text)return;

 try{
  const {error}=await db.from("messages").insert({
   sender_id:currentUser.id,
   receiver_id:currentChatUser,
   text
  });

  if(error)throw error;

  input.value="";
  loadChatMessages();

  try{
   await api("/notifications",{
    method:"POST",
    body:JSON.stringify({
     receiver_id:currentChatUser,
     text:(currentProfile?.name||"Someone")+" sent you a message"
    })
   });
  }catch(e){}

 }catch(e){
  toast(e.message);
 }
}

    <div>
     <b>Online Status</b>
     <div style="color:var(--muted);font-size:12px">আপনি online কিনা</div>
    </div>
    <div class="switch ${settings.online_status!==false?"on":""}"
      onclick="toggleSetting(this,'online_status')"></div>
   </div>

   <div class="settingRow">
    <div>
     <b>Friend Requests</b>
    </div>
    <div class="switch ${settings.friend_requests!==false?"on":""}"
      onclick="toggleSetting(this,'friend_requests')"></div>
   </div>

   <div class="settingRow">
    <div>
     <b>Followers</b>
    </div>
    <div class="switch ${settings.followers!==false?"on":""}"
      onclick="toggleSetting(this,'followers')"></div>
   </div>
  </div>

  <div class="card cardPad">
   <h3>Privacy & Security</h3>

   <button class="btn secondary fullBtn" onclick="showBlocked()">
    🚫 Blocked Users
   </button>

   <br><br>

   <button class="btn secondary fullBtn" onclick="downloadData()">
    📥 Download My Data
   </button>

   <br><br>

   <button class="btn danger fullBtn" onclick="deactivateAccount()">
    Deactivate Account
   </button>

   <br><br>

   <button class="btn danger fullBtn" onclick="logout()">
    Logout
   </button>
  </div>
 `;

 if(settings.dark_mode){
  document.body.classList.add("dark");
 }
}

async function toggleDark(el){
 const on=!el.classList.contains("on");
 el.classList.toggle("on",on);
 document.body.classList.toggle("dark",on);

 await db.from("user_settings").upsert({
  user_id:currentUser.id,
  dark_mode:on,
  updated_at:new Date().toISOString()
 });
}

async function toggleSetting(el,key){
 const on=!el.classList.contains("on");
 el.classList.toggle("on",on);

 const update={
  user_id:currentUser.id,
  [key]:on,
  updated_at:new Date().toISOString()
 };

 await db.from("user_settings").upsert(update);
}

async function showBlocked(){
 const {data}=await db.from("blocked_users")
  .select("*")
  .eq("uuid",currentUser.id);

 let html="";

 for(const b of data||[]){
  const p=await getProfile(b.blocked_id);

  html+=`
   <div class="userResult">
    <img class="avatar" src="${avatarUrl(p)}">
    <div style="flex:1">${escapeHtml(p?.name||"User")}</div>
    <button class="btn secondary" onclick="unblockUser('${b.blocked_id}')">
     Unblock
    </button>
   </div>`;
 }

 showModal("Blocked Users",html||`<div class="empty">কেউ blocked নেই</div>`);
}

async function blockUser(userId){
 if(!confirm("এই user-কে block করবেন?"))return;

 try{
  await api("/block",{
   method:"POST",
   body:JSON.stringify({blocked_id:userId})
  });

  toast("User blocked");
 }catch(e){
  toast(e.message);
 }
}

async function unblockUser(userId){
 try{
  await db.from("blocked_users")
   .delete()
   .eq("uuid",currentUser.id)
   .eq("blocked_id",userId);

  closeModal();
  toast("User unblocked");
 }catch(e){toast(e.message)}
}

async function downloadData(){
 try{
  const [
   profile,
   posts,
   comments,
   reels
  ]=await Promise.all([
   db.from("profiles").select("*").eq("id",currentUser.id),
   db.from("posts").select("*").eq("user_id",currentUser.id),
   db.from("comments").select("*").eq("user_id",currentUser.id),
   db.from("reels").select("*").eq("user_id",currentUser.id)
  ]);

  const data={
   profile:profile.data||[],
   posts:posts.data||[],
   comments:comments.data||[],
   reels:reels.data||[],
   exported_at:new Date().toISOString()
  };

  const blob=new Blob(
   [JSON.stringify(data,null,2)],
   {type:"application/json"}
  );

  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="my-social-app-data.json";
  a.click();
  URL.revokeObjectURL(url);

  toast("Data downloaded");

 }catch(e){toast(e.message)}
}

async function deactivateAccount(){
 if(!confirm("Account deactivate করবেন?"))return;

 try{
  await db.from("profiles")
   .update({is_deactivated:true})
   .eq("id",currentUser.id);

  await logout();

 }catch(e){toast(e.message)}
}

/* =========================================================
   REALTIME NOTIFICATIONS
========================================================= */

function setupRealtime(){
 if(notificationChannel){
  db.removeChannel(notificationChannel);
 }

 notificationChannel=db.channel("notifications-"+currentUser.id)
 .on(
  "postgres_changes",
  {
   event:"INSERT",
   schema:"public",
   table:"notifications",
   filter:"receiver_id=eq."+currentUser.id
  },
  payload=>{
   const badge=document.getElementById("notificationBadge");
   badge.classList.remove("hidden");

   let count=parseInt(badge.textContent||"0")||0;
   badge.textContent=String(count+1);

   toast("🔔 নতুন notification");
  }
 )
 .subscribe();
}

/* =========================================================
   AUTH STATE
========================================================= */

async function bootUser(){
 const {data}=await db.auth.getUser();

 if(!data?.user){
  document.getElementById("authPage").classList.remove("hidden");
  document.getElementById("appPage").classList.add("hidden");
  return;
 }

 currentUser=data.user;

 await loadMe();

 document.getElementById("authPage").classList.add("hidden");
 document.getElementById("appPage").classList.remove("hidden");

 setupRealtime();
 go("home");
}

db.auth.onAuthStateChange(async(event,session)=>{
 if(session?.user){
  currentUser=session.user;

  setTimeout(async()=>{
   await loadMe();

   document.getElementById("authPage").classList.add("hidden");
   document.getElementById("appPage").classList.remove("hidden");

   setupRealtime();

   if(currentPage==="home")loadHome();
  },0);
 }else{
  currentUser=null;
  currentProfile=null;
  document.getElementById("authPage").classList.remove("hidden");
  document.getElementById("appPage").classList.add("hidden");
 }
});

/* =========================================================
   START
========================================================= */

bootUser();
</script>
