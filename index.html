<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#1877f2">
<title>My Social App</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Arial,sans-serif;background:#f0f2f5;color:#111}
button,input,textarea{font:inherit}
button{cursor:pointer}

.topbar{
position:fixed;top:0;left:0;right:0;height:58px;
background:#fff;border-bottom:1px solid #ddd;
display:flex;align-items:center;justify-content:space-between;
padding:0 12px;z-index:1000
}
.logo{color:#1877f2;font-size:23px;font-weight:bold}
.top-actions{display:flex;gap:7px}
.icon-btn{
width:40px;height:40px;border:0;border-radius:50%;
background:#f0f2f5;font-size:20px
}

.page{display:none;padding-top:70px;padding-bottom:75px;min-height:100vh}
.page.active{display:block}
.container{width:100%;max-width:650px;margin:auto}

.card{
background:#fff;border-radius:10px;margin:10px;padding:14px;
box-shadow:0 1px 3px rgba(0,0,0,.12)
}

.user-row{display:flex;align-items:center;gap:10px}
.avatar{
width:42px;height:42px;border-radius:50%;
background:#1877f2;color:#fff;
display:flex;align-items:center;justify-content:center;
font-weight:bold;overflow:hidden
}
.avatar img{width:100%;height:100%;object-fit:cover}
.username{font-weight:bold}
.time{color:#777;font-size:12px;margin-top:3px}
.post-text{margin:12px 0;white-space:pre-wrap;word-break:break-word}
.post-image{
width:100%;max-height:600px;object-fit:cover;
border-radius:8px;display:block
}

.actions{
display:flex;border-top:1px solid #eee;
margin-top:10px;padding-top:7px;gap:5px
}
.action-btn{
flex:1;border:0;background:#fff;padding:10px 4px;
border-radius:7px;font-weight:bold
}
.action-btn:hover{background:#f0f2f5}
.liked{color:#1877f2}

.bottom-nav{
position:fixed;bottom:0;left:0;right:0;height:62px;
background:#fff;border-top:1px solid #ddd;
display:flex;z-index:1000
}
.nav-btn{
flex:1;border:0;background:#fff;font-size:12px;color:#555
}
.nav-btn b{display:block;font-size:21px}
.nav-btn.active{color:#1877f2}

.loading{text-align:center;padding:40px 20px;color:#666}
.empty{text-align:center;padding:45px 20px;color:#666}

.primary{
border:0;background:#1877f2;color:#fff;
padding:11px 18px;border-radius:8px;font-weight:bold
}
.danger{
border:0;background:#e41e3f;color:#fff;
padding:10px 15px;border-radius:8px
}

.modal{
display:none;position:fixed;inset:0;
background:rgba(0,0,0,.55);z-index:2000;
align-items:flex-end;justify-content:center
}
.modal.show{display:flex}
.modal-box{
background:#fff;width:100%;max-width:650px;
max-height:90vh;overflow:auto;
border-radius:18px 18px 0 0;padding:18px
}
.modal-head{
display:flex;align-items:center;justify-content:space-between;
margin-bottom:15px
}
.modal-head h3{margin:0}
.close{
border:0;background:#f0f2f5;width:36px;height:36px;
border-radius:50%;font-size:20px
}

textarea,input[type=text],input[type=email],input[type=password]{
width:100%;border:1px solid #ccc;border-radius:9px;
padding:12px;outline:none;margin-bottom:10px
}
textarea{min-height:120px;resize:vertical}
.file{width:100%;margin:10px 0 15px}

.profile{
background:#fff;margin:10px;border-radius:12px;overflow:hidden
}
.cover{
height:150px;
background:linear-gradient(135deg,#1877f2,#6c5ce7)
}
.profile-info{padding:0 15px 20px}
.profile-avatar{
width:90px;height:90px;margin-top:-45px;
border:4px solid #fff;border-radius:50%;
background:#1877f2;color:#fff;
display:flex;align-items:center;justify-content:center;
font-size:35px;font-weight:bold;overflow:hidden
}
.profile-avatar img{width:100%;height:100%;object-fit:cover}

.stats{display:flex;gap:25px;margin:15px 0}
.stat{text-align:center}
.stat b{display:block;font-size:20px}
.stat span{color:#777;font-size:12px}

#reelsPage{
background:#000;padding-top:58px;padding-bottom:0
}
.reels-container{
width:100%;height:calc(100vh - 58px);
overflow-y:auto;scroll-snap-type:y mandatory;background:#000
}
.reel{
width:100%;height:calc(100vh - 58px);
position:relative;scroll-snap-align:start;
background:#000;overflow:hidden
}
.reel video{
width:100%;height:100%;object-fit:cover;
display:block;background:#000
}
.reel-info{
position:absolute;left:15px;right:75px;bottom:25px;
color:#fff;z-index:5;text-shadow:0 1px 4px #000
}
.reel-caption{
margin-top:8px;font-size:15px;white-space:pre-wrap
}
.reel-actions{
position:absolute;right:12px;bottom:85px;
display:flex;flex-direction:column;gap:14px;z-index:10
}
.reel-action{
width:50px;min-height:50px;border:0;border-radius:50%;
background:rgba(0,0,0,.5);color:#fff;font-size:21px
}
.reel-action small{display:block;font-size:10px;margin-top:2px}

.reel-top{
position:absolute;top:12px;left:12px;right:12px;
display:flex;justify-content:space-between;z-index:10
}
.reel-top button{
border:0;background:rgba(0,0,0,.5);color:#fff;
width:42px;height:42px;border-radius:50%;font-size:20px
}

.reel-error{
color:#fff;padding:30px 18px;text-align:center
}
.error-box{
background:#1e1e1e;border:1px solid #555;
padding:14px;border-radius:10px;text-align:left;
word-break:break-word;margin:15px 0;color:#ffb3b3
}

.comment-item{
padding:10px 0;border-bottom:1px solid #eee
}
.comment-name{font-weight:bold}

.toast{
position:fixed;left:50%;bottom:80px;
transform:translateX(-50%);
background:#222;color:#fff;padding:12px 18px;
border-radius:8px;z-index:5000;
display:none;max-width:90%;text-align:center
}
.toast.show{display:block}

.login-box{max-width:430px;margin:80px auto;padding:20px}
</style>
</head>

<body>

<!-- TOP BAR -->
<div class="topbar">
<div class="logo">My Social App</div>

<div class="top-actions">
<button class="icon-btn" onclick="openPost()">＋</button>
<button class="icon-btn" onclick="openNotifications()">🔔</button>
<button class="icon-btn" onclick="showPage('settings')">⚙️</button>
</div>
</div>


<!-- HOME -->
<section id="homePage" class="page active">
<div class="container">

<div class="card">
<button class="primary" style="width:100%" onclick="openPost()">
What's on your mind?
</button>
</div>

<div id="feed">
<div class="loading">Feed লোড হচ্ছে...</div>
</div>

</div>
</section>


<!-- REELS -->
<section id="reelsPage" class="page">

<div class="reels-container" id="reelsList">
<div class="loading" style="color:white">
Reels লোড হচ্ছে...
</div>
</div>

</section>


<!-- PROFILE -->
<section id="profilePage" class="page">
<div class="container">

<div class="profile">

<div class="cover"></div>

<div class="profile-info">

<div class="profile-avatar" id="profileAvatar">
U
</div>

<h2 id="profileName">User</h2>

<div id="profileEmail" style="color:#777"></div>

<div class="stats">

<div class="stat">
<b id="postCount">0</b>
<span>Posts</span>
</div>

<div class="stat">
<b id="followersCount">0</b>
<span>Followers</span>
</div>

<div class="stat">
<b id="followingCount">0</b>
<span>Following</span>
</div>

</div>

<button class="primary" onclick="showPage('settings')">
⚙️ Settings
</button>

</div>
</div>

<div id="myPosts"></div>

</div>
</section>


<!-- SETTINGS -->
<section id="settingsPage" class="page">
<div class="container">

<div class="card">

<h2>⚙️ Settings</h2>

<hr>

<p><b>Account</b></p>

<p id="settingsEmail"></p>

<button class="primary"
style="width:100%;margin-bottom:10px"
onclick="openPost()">
＋ Create Post
</button>

<button class="primary"
style="width:100%;margin-bottom:10px"
onclick="openReelUpload()">
🎬 Upload Reel
</button>

<button class="danger"
style="width:100%"
onclick="logout()">
Logout
</button>

</div>

</div>
</section>


<!-- BOTTOM NAV -->
<div class="bottom-nav">

<button class="nav-btn active"
id="navHome"
onclick="showPage('home')">
<b>🏠</b>
Home
</button>

<button class="nav-btn"
id="navReels"
onclick="showPage('reels')">
<b>🎬</b>
Reels
</button>

<button class="nav-btn"
id="navProfile"
onclick="showPage('profile')">
<b>👤</b>
Profile
</button>

<button class="nav-btn"
id="navSettings"
onclick="showPage('settings')">
<b>⚙️</b>
Settings
</button>

</div>


<!-- POST MODAL -->
<div class="modal" id="postModal">

<div class="modal-box">

<div class="modal-head">
<h3>Create Post</h3>
<button class="close"
onclick="closeModal('postModal')">×</button>
</div>

<textarea id="postText"
placeholder="What's on your mind?"></textarea>

<input type="file"
id="postImage"
class="file"
accept="image/*">

<button class="primary"
style="width:100%"
onclick="createPost()">
Publish
</button>

</div>
</div>


<!-- REEL UPLOAD -->
<div class="modal" id="reelModal">

<div class="modal-box">

<div class="modal-head">

<h3>🎬 Upload Reel</h3>

<button class="close"
onclick="closeModal('reelModal')">
×
</button>

</div>

<input type="file"
id="reelFile"
class="file"
accept="video/*">

<textarea id="reelCaption"
placeholder="Reel caption..."></textarea>

<input type="text"
id="audioName"
placeholder="🎵 Audio name">

<button class="primary"
style="width:100%"
onclick="uploadReel()">
Upload Reel
</button>

<div id="uploadStatus"
style="margin-top:12px;text-align:center">
</div>

</div>
</div>


<!-- COMMENTS -->
<div class="modal" id="commentModal">

<div class="modal-box">

<div class="modal-head">

<h3>💬 Comments</h3>

<button class="close"
onclick="closeModal('commentModal')">
×
</button>

</div>

<div id="commentsList">
Loading...
</div>

<div style="margin-top:15px">

<input type="text"
id="commentInput"
placeholder="Write a comment...">

<button class="primary"
style="width:100%"
onclick="submitComment()">
Comment
</button>

</div>

</div>
</div>


<!-- NOTIFICATIONS -->
<div class="modal" id="notificationModal">

<div class="modal-box">

<div class="modal-head">

<h3>🔔 Notifications</h3>

<button class="close"
onclick="closeModal('notificationModal')">
×
</button>

</div>

<div id="notificationList">
Loading...
</div>

</div>
</div>


<div class="toast" id="toast"></div>


<script>

/* =====================================================
SUPABASE
===================================================== */

const SUPABASE_URL =
"YOUR_SUPABASE_URL";

const SUPABASE_ANON_KEY =
"YOUR_SUPABASE_ANON_KEY";

const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);


/* =====================================================
GLOBAL
===================================================== */

let user=null;
let currentCommentType=null;
let currentCommentId=null;
let reelObserver=null;


/* =====================================================
HELPER
===================================================== */

function safe(v){

return String(v ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function toast(msg){

const box=document.getElementById("toast");

box.textContent=msg;
box.classList.add("show");

setTimeout(()=>{
box.classList.remove("show");
},3000);

}


function closeModal(id){

document.getElementById(id)
.classList.remove("show");

}


/* =====================================================
PAGE
===================================================== */

function showPage(page){

document.querySelectorAll(".page")
.forEach(x=>x.classList.remove("active"));

document.querySelectorAll(".nav-btn")
.forEach(x=>x.classList.remove("active"));


if(page==="home"){

document.getElementById("homePage")
.classList.add("active");

document.getElementById("navHome")
.classList.add("active");

loadFeed();

}


if(page==="reels"){

document.getElementById("reelsPage")
.classList.add("active");

document.getElementById("navReels")
.classList.add("active");

loadReels();

}


if(page==="profile"){

document.getElementById("profilePage")
.classList.add("active");

document.getElementById("navProfile")
.classList.add("active");

loadProfile();

}


if(page==="settings"){

document.getElementById("settingsPage")
.classList.add("active");

document.getElementById("navSettings")
.classList.add("active");

loadProfile();

}

}


/* =====================================================
AUTH
===================================================== */

async function checkUser(){

const result=await db.auth.getUser();

user=result.data.user || null;

if(!user){

document.body.innerHTML=`

<div class="login-box card">

<h2>My Social App</h2>

<p>প্রথমে Login করুন</p>

<input
id="loginEmail"
type="email"
placeholder="Email">

<input
id="loginPassword"
type="password"
placeholder="Password">

<button
class="primary"
style="width:100%;margin-bottom:10px"
onclick="login()">
Login
</button>

<button
style="width:100%;padding:11px;border:0;border-radius:8px"
onclick="signup()">
Create new account
</button>

</div>

`;

return false;

}

return true;

}


async function login(){

const email=
document.getElementById("loginEmail")
.value.trim();

const password=
document.getElementById("loginPassword")
.value;

const {error}=
await db.auth.signInWithPassword({
email,
password
});

if(error){

alert(error.message);
return;

}

location.reload();

}


async function signup(){

const email=
document.getElementById("loginEmail")
.value.trim();

const password=
document.getElementById("loginPassword")
.value;

if(password.length<6){

alert("Password কমপক্ষে ৬ অক্ষরের হতে হবে");
return;

}

const {error}=
await db.auth.signUp({
email,
password
});

if(error){

alert(error.message);
return;

}

alert("Account তৈরি হয়েছে।");

}


async function logout(){

await db.auth.signOut();

location.reload();

}


/* =====================================================
POST
===================================================== */

function openPost(){

document.getElementById("postModal")
.classList.add("show");

}


async function createPost(){

if(!user){

toast("Login করুন");
return;

}

const text=
document.getElementById("postText")
.value.trim();

const file=
document.getElementById("postImage")
.files[0];

if(!text && !file){

alert("Text অথবা Photo দিন");
return;

}

let imageUrl=null;


if(file){

const path=
`${user.id}/${Date.now()}_${file.name}`;

const upload=
await db.storage
.from("posts")
.upload(path,file,{upsert:false});

if(upload.error){

alert("Photo upload error: "+upload.error.message);
return;

}

imageUrl=
db.storage
.from("posts")
.getPublicUrl(path)
.data.publicUrl;

}


const {error}=
await db
.from("posts")
.insert({
user_id:user.id,
text:text,
image_url:imageUrl
});


if(error){

alert("Post error: "+error.message);
return;

}

document.getElementById("postText").value="";
document.getElementById("postImage").value="";

closeModal("postModal");

toast("Post published ✅");

loadFeed();

}


async function loadFeed(){

const box=document.getElementById("feed");

box.innerHTML=
`<div class="loading">Feed লোড হচ্ছে...</div>`;


if(!user){

box.innerHTML=
`<div class="empty">Login করুন</div>`;

return;

}


const {data,error}=
await db
.from("posts")
.select("id,user_id,text,image_url,created_at")
.order("created_at",{ascending:false})
.limit(50);


if(error){

box.innerHTML=`

<div class="card">

❌ Feed Error

<div class="error-box">
${safe(error.message)}
</div>

</div>

`;

return;

}


if(!data || !data.length){

box.innerHTML=
`<div class="empty">এখনো কোনো Post নেই</div>`;

return;

}


box.innerHTML=
data.map(postCard).join("");

}


function postCard(post){

return `

<div class="card">

<div class="user-row">

<div class="avatar">U</div>

<div>

<div class="username">User</div>

<div class="time">
${safe(post.created_at)}
</div>

</div>

</div>


<div class="post-text">
${safe(post.text || "")}
</div>


${
post.image_url
?
`<img
class="post-image"
src="${safe(post.image_url)}"
loading="lazy">`
:""
}


<div class="actions">

<button
class="action-btn"
onclick="likePost(${post.id})">
❤️ Like
</button>

<button
class="action-btn"
onclick="openPostComments(${post.id})">
💬 Comment
</button>

<button
class="action-btn"
onclick="sharePost(${post.id})">
↗ Share
</button>

</div>

</div>

`;

}


async function likePost(postId){

if(!user){
toast("Login করুন");
return;
}


const {data}=await db
.from("post_reactions")
.select("id")
.eq("post_id",postId)
.eq("user_id",user.id)
.maybeSingle();


if(data){

await db
.from("post_reactions")
.delete()
.eq("id",data.id);

toast("Like removed");

}else{

const {error}=
await db
.from("post_reactions")
.insert({
post_id:postId,
user_id:user.id,
reaction:"like"
});

if(error){

toast(error.message);
return;

}

toast("Liked ❤️");

}

}


async function sharePost(id){

const url=
location.href.split("#")[0]+"?post="+id;

if(navigator.share){

try{

await navigator.share({
title:"My Social App",
url:url
});

}catch(e){}

}else{

try{

await navigator.clipboard.writeText(url);

toast("Link copied");

}catch(e){

prompt("Copy link:",url);

}

}

}


/* =====================================================
COMMENTS
===================================================== */

async function openPostComments(id){

currentCommentType="post";
currentCommentId=id;

document.getElementById("commentModal")
.classList.add("show");

loadComments();

}


async function openReelComments(id){

currentCommentType="reel";
currentCommentId=id;

document.getElementById("commentModal")
.classList.add("show");

loadComments();

}


async function loadComments(){

const box=document.getElementById("commentsList");

box.innerHTML=
`<div class="loading">Comments loading...</div>`;


const table=
currentCommentType==="reel"
?"reel_comments"
:"comments";

const field=
currentCommentType==="reel"
?"reel_id"
:"post_id";


const {data,error}=
await db
.from(table)
.select("*")
.eq(field,currentCommentId)
.order("created_at",{ascending:true});


if(error){

box.innerHTML=`
<div class="error-box">
${safe(error.message)}
</div>`;
return;

}


if(!data || !data.length){

box.innerHTML=
`<div class="empty">No comments yet</div>`;

return;

}


box.innerHTML=
data.map(c=>`

<div class="comment-item">

<div class="comment-name">
User
</div>

<div>
${safe(c.comment || "")}
</div>

</div>

`).join("");

}


async function submitComment(){

if(!user){

toast("Login করুন");
return;

}

const input=
document.getElementById("commentInput");

const text=input.value.trim();

if(!text)return;


const table=
currentCommentType==="reel"
?"reel_comments"
:"comments";


const payload=
currentCommentType==="reel"
?
{
reel_id:currentCommentId,
user_id:user.id,
comment:text
}
:
{
post_id:currentCommentId,
user_id:user.id,
comment:text
};


const {error}=
await db
.from(table)
.insert(payload);


if(error){

alert(error.message);
return;

}

input.value="";

loadComments();

}


/* =====================================================
REEL UPLOAD
===================================================== */

function openReelUpload(){

document.getElementById("reelModal")
.classList.add("show");

}


async function uploadReel(){

if(!user){

toast("Login করুন");
return;

}

const file=
document.getElementById("reelFile")
.files[0];

const caption=
document.getElementById("reelCaption")
.value.trim();

const audio=
document.getElementById("audioName")
.value.trim();

const status=
document.getElementById("uploadStatus");


if(!file){

status.textContent="Video নির্বাচন করুন";
return;

}


status.textContent="Video upload হচ্ছে...";


const ext=
file.name.split(".").pop();

const path=
`${user.id}/${Date.now()}.${ext}`;


const upload=
await db.storage
.from("reels")
.upload(
path,
file,
{
upsert:false,
contentType:file.type
}
);


if(upload.error){

status.innerHTML=
`<span style="color:red">
${safe(upload.error.message)}
</span>`;

return;

}


const videoUrl=
db.storage
.from("reels")
.getPublicUrl(path)
.data.publicUrl;


const {error}=
await db
.from("reels")
.insert({

user_id:user.id,
video_url:videoUrl,
caption:caption,
views:0,
audio_name:audio || null

});


if(error){

status.innerHTML=
`<span style="color:red">
${safe(error.message)}
</span>`;

return;

}


status.innerHTML=
`<span style="color:green">
Reel uploaded ✅
</span>`;


document.getElementById("reelFile").value="";
document.getElementById("reelCaption").value="";
document.getElementById("audioName").value="";


setTimeout(()=>{

closeModal("reelModal");
showPage("reels");

},800);

}


/* =====================================================
REELS LOAD
===================================================== */

async function loadReels(){

const box=
document.getElementById("reelsList");


box.innerHTML=`

<div class="loading" style="color:white">
Reels লোড হচ্ছে...
</div>

`;


try{

if(!user){

box.innerHTML=`

<div class="reel-error">
<h3>Login করুন</h3>
</div>

`;

return;

}


/* SUPABASE QUERY */

const query=
db
.from("reels")
.select(`
id,
user_id,
video_url,
caption,
created_at,
views,
audio_name
`)
.order("created_at",{ascending:false})
.limit(50);


/* TIMEOUT */

const timeout=
new Promise((_,reject)=>{

setTimeout(()=>{

reject(
new Error(
"Supabase থেকে response আসছে না। Internet / RLS / Supabase check করুন।"
)
);

},15000);

});


const result=
await Promise.race([
query,
timeout
]);


const data=result.data;
const error=result.error;


if(error){

box.innerHTML=`

<div class="reel-error">

<h3>❌ Reels লোড হয়নি</h3>

<div class="error-box">
${safe(error.message)}
</div>

<button
class="primary"
onclick="loadReels()">
🔄 আবার চেষ্টা করুন
</button>

</div>

`;

return;

}


if(!data || data.length===0){

box.innerHTML=`

<div class="reel-error">

<h3>🎬 এখনো কোনো Reel নেই</h3>

<p>প্রথম Reel Upload করুন</p>

<button
class="primary"
onclick="openReelUpload()">
＋ Upload Reel
</button>

</div>

`;

return;

}


box.innerHTML=
data.map(reelCard).join("");


setupReelObserver();


for(const reel of data){

try{

await reelStats(reel.id);

}catch(e){

console.log(e);

}

}


}catch(e){

console.error(e);


box.innerHTML=`

<div class="reel-error">

<h3>❌ Reels Error</h3>

<div class="error-box">
${safe(e.message)}
</div>

<button
class="primary"
onclick="loadReels()">
🔄 আবার চেষ্টা করুন
</button>

</div>

`;

}

}


/* =====================================================
REEL CARD
===================================================== */

function reelCard(reel){

return `

<div
class="reel"
data-reel-id="${reel.id}">


<video
class="reel-video"
src="${safe(reel.video_url)}"
loop
muted
playsinline
preload="metadata"
onclick="toggleReelSound(this)">
</video>


<div class="reel-top">

<button onclick="showPage('home')">
←
</button>

<button onclick="openReelUpload()">
＋
</button>

</div>


<div class="reel-info">

<div class="username">
👤 User
</div>

${
reel.caption
?
`<div class="reel-caption">
${safe(reel.caption)}
</div>`
:""
}


${
reel.audio_name
?
`<div style="margin-top:7px">
🎵 ${safe(reel.audio_name)}
</div>`
:""
}

</div>


<div class="reel-actions">

<button
class="reel-action"
onclick="likeReel(${reel.id},this)">
❤️
<small class="like-count">0</small>
</button>


<button
class="reel-action"
onclick="openReelComments(${reel.id})">
💬
<small>Comment</small>
</button>


<button
class="reel-action"
onclick="shareReel(${reel.id})">
↗
<small>Share</small>
</button>


<button
class="reel-action"
data-sound-button="true"
onclick="toggleReelSound(this)">
🔇
</button>


</div>

</div>

`;

}


/* =====================================================
REEL OBSERVER
===================================================== */

function setupReelObserver(){

if(reelObserver){
reelObserver.disconnect();
}


const videos=
document.querySelectorAll(".reel-video");


reelObserver=
new IntersectionObserver(
entries=>{

entries.forEach(entry=>{

const video=entry.target;


if(entry.isIntersecting){

video.muted=true;

video.play().catch(()=>{});

const reel=
video.closest(".reel");

if(reel){

increaseView(
reel.dataset.reelId
);

}

}else{

video.pause();

}

});

},
{threshold:.7}
);


videos.forEach(video=>{
reelObserver.observe(video);
});

}


/* =====================================================
SOUND
===================================================== */

function toggleReelSound(element){

let video=null;


if(element.tagName==="VIDEO"){

video=element;

}else{

const reel=
element.closest(".reel");

if(reel){

video=
reel.querySelector("video");

}

}


if(!video)return;


video.muted=!video.muted;


const reel=
video.closest(".reel");


if(reel){

const btn=
reel.querySelector(
'[data-sound-button="true"]'
);


if(btn){

btn.firstChild.textContent=
video.muted
?"🔇"
:"🔊";

}

}

}


/* =====================================================
REEL VIEW
===================================================== */

async function increaseView(id){

try{

const {data}=
await db
.from("reels")
.select("views")
.eq("id",id)
.single();


if(!data)return;


await db
.from("reels")
.update({
views:(data.views || 0)+1
})
.eq("id",id);


}catch(e){

console.log(e);

}

}


/* =====================================================
REEL LIKE
===================================================== */

async function likeReel(id,button){

if(!user){

toast("Login করুন");
return;

}


const {data,error}=
await db
.from("reel_likes")
.select("id")
.eq("reel_id",id)
.eq("user_id",user.id)
.maybeSingle();


if(error){

toast(error.message);
return;

}


if(data){

await db
.from("reel_likes")
.delete()
.eq("id",data.id);

button.classList.remove("liked");

}else{

const result=
await db
.from("reel_likes")
.insert({
reel_id:id,
user_id:user.id
});


if(result.error){

toast(result.error.message);
return;

}

button.classList.add("liked");

}


const count=
await db
.from("reel_likes")
.select("id",{count:"exact",head:true})
.eq("reel_id",id);


const countEl=
button.querySelector(".like-count");


if(countEl){

countEl.textContent=
count.count || 0;

}

}


async function reelStats(id){

const result=
await db
.from("reel_likes")
.select("id",{count:"exact",head:true})
.eq("reel_id",id);


const reel=
document.querySelector(
`.reel[data-reel-id="${id}"]`
);


if(!reel)return;


const count=
reel.querySelector(".like-count");


if(count){

count.textContent=
result.count || 0;

}

}


/* =====================================================
REEL SHARE
===================================================== */

async function shareReel(id){

const url=
location.href.split("#")[0]+"?reel="+id;


if(navigator.share){

try{

await navigator.share({
title:"My Social App Reel",
url:url
});

}catch(e){}

}else{

try{

await navigator.clipboard.writeText(url);

toast("Reel link copied");

}catch(e){

prompt("Copy link:",url);

}

}

}


/* =====================================================
PROFILE
===================================================== */

async function loadProfile(){

if(!user)return;


document.getElementById("profileEmail")
.textContent=user.email || "";

document.getElementById("settingsEmail")
.textContent=user.email || "";


const posts=
await db
.from("posts")
.select("id")
.eq("user_id",user.id);


document.getElementById("postCount")
.textContent=
posts.data?.length || 0;


const followers=
await db
.from("follows")
.select("id",{count:"exact",head:true})
.eq("following_id",user.id);


document.getElementById("followersCount")
.textContent=
followers.count || 0;


const following=
await db
.from("follows")
.select("id",{count:"exact",head:true})
.eq("follower_id",user.id);


document.getElementById("followingCount")
.textContent=
following.count || 0;


loadMyPosts();

}


async function loadMyPosts(){

const box=
document.getElementById("myPosts");


const {data,error}=
await db
.from("posts")
.select(
"id,user_id,text,image_url,created_at"
)
.eq("user_id",user.id)
.order("created_at",{ascending:false});


if(error){

box.innerHTML=`

<div class="card">
${safe(error.message)}
</div>

`;

return;

}


box.innerHTML=
(data || [])
.map(postCard)
.join("");

}


/* =====================================================
NOTIFICATIONS
===================================================== */

async function openNotifications(){

document.getElementById("notificationModal")
.classList.add("show");


const box=
document.getElementById("notificationList");


box.innerHTML=
`<div class="loading">Loading...</div>`;


if(!user){

box.innerHTML="Login করুন";
return;

}


const {data,error}=
await db
.from("notifications")
.select(
"id,receiver_id,message,read,created_at"
)
.eq("receiver_id",user.id)
.order("created_at",{ascending:false})
.limit(50);


if(error){

box.innerHTML=`

<div class="error-box">
${safe(error.message)}
</div>

`;

return;

}


if(!data || !data.length){

box.innerHTML=
`<div class="empty">No notifications</div>`;

return;

}


box.innerHTML=
data.map(n=>`

<div class="comment-item">

🔔 ${safe(n.message)}

<div class="time">
${safe(n.created_at)}
</div>

</div>

`).join("");

}
