<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1877f2">
<title>FriendBook</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
:root{
 --blue:#1877f2;
 --blue2:#4267b2;
 --bg:#f0f2f5;
 --card:#fff;
 --text:#17202a;
 --muted:#65676b;
 --border:#dddfe2;
 --danger:#e41e3f;
 --green:#16a34a;
}
body.dark{
 --bg:#0b1220;
 --card:#111827;
 --text:#f1f5f9;
 --muted:#94a3b8;
 --border:#263244;
}
html,body{
 margin:0;
 padding:0;
 min-height:100%;
 background:var(--bg);
 color:var(--text);
 font-family:Arial,Helvetica,sans-serif;
}
button,input,textarea,select{
 font:inherit;
}
button{
 cursor:pointer;
}
img,video{
 max-width:100%;
}
.hidden{display:none!important}

#app{
 min-height:100vh;
}

/* AUTH */
.auth-screen{
 min-height:100vh;
 display:flex;
 justify-content:center;
 align-items:center;
 padding:20px;
 background:
 radial-gradient(circle at 10% 10%,rgba(24,119,242,.25),transparent 35%),
 radial-gradient(circle at 90% 90%,rgba(124,58,237,.2),transparent 35%),
 var(--bg);
}
.auth-box{
 width:100%;
 max-width:430px;
 background:var(--card);
 border-radius:24px;
 padding:28px;
 box-shadow:0 20px 60px rgba(0,0,0,.18);
}
.logo{
 color:var(--blue);
 font-size:34px;
 font-weight:900;
 letter-spacing:-1px;
}
.logo-sub{
 color:var(--muted);
 margin:5px 0 20px;
}
.input{
 width:100%;
 padding:13px 14px;
 border:1px solid var(--border);
 background:var(--card);
 color:var(--text);
 border-radius:12px;
 outline:none;
 margin:6px 0;
}
.input:focus{
 border-color:var(--blue);
 box-shadow:0 0 0 3px rgba(24,119,242,.12);
}
.btn{
 border:0;
 padding:11px 15px;
 border-radius:12px;
 background:#e4e6eb;
 color:#111;
 font-weight:700;
}
body.dark .btn{
 background:#263244;
 color:#fff;
}
.btn.primary{
 background:var(--blue);
 color:#fff;
}
.btn.success{
 background:var(--green);
 color:#fff;
}
.btn.danger{
 background:var(--danger);
 color:#fff;
}
.btn.full{
 width:100%;
 margin-top:8px;
}
.auth-switch{
 text-align:center;
 color:var(--blue);
 font-weight:700;
 margin-top:16px;
 cursor:pointer;
}

/* TOPBAR */
.topbar{
 position:sticky;
 top:0;
 z-index:1000;
 height:64px;
 background:var(--card);
 border-bottom:1px solid var(--border);
 display:flex;
 align-items:center;
 gap:12px;
 padding:8px 16px;
 box-shadow:0 2px 8px rgba(0,0,0,.05);
}
.top-logo{
 color:var(--blue);
 font-size:24px;
 font-weight:900;
 white-space:nowrap;
}
.search-box{
 flex:1;
 max-width:500px;
}
.search-box input{
 width:100%;
 border:0;
 outline:0;
 padding:11px 15px;
 border-radius:30px;
 background:var(--bg);
 color:var(--text);
}
.top-actions{
 margin-left:auto;
 display:flex;
 gap:8px;
}
.icon-btn{
 width:42px;
 height:42px;
 border:0;
 border-radius:50%;
 background:var(--bg);
 color:var(--text);
 font-size:19px;
}

/* LAYOUT */
.layout{
 max-width:1450px;
 margin:auto;
 display:grid;
 grid-template-columns:250px minmax(0,680px) 280px;
 gap:18px;
 padding:18px;
}
.sidebar{
 position:sticky;
 top:82px;
 height:max-content;
}
.menu-item{
 display:flex;
 align-items:center;
 gap:13px;
 padding:12px;
 margin:3px 0;
 border-radius:12px;
 font-weight:700;
 cursor:pointer;
}
.menu-item:hover{
 background:var(--card);
}
.menu-item.active{
 background:rgba(24,119,242,.12);
 color:var(--blue);
}
.card{
 background:var(--card);
 border:1px solid var(--border);
 border-radius:17px;
 padding:15px;
 margin-bottom:15px;
 box-shadow:0 2px 8px rgba(0,0,0,.04);
}

/* STORIES */
.story-row{
 display:flex;
 gap:10px;
 overflow-x:auto;
 padding-bottom:4px;
}
.story{
 min-width:110px;
 height:170px;
 border-radius:15px;
 overflow:hidden;
 position:relative;
 background:linear-gradient(145deg,#1877f2,#7c3aed);
 color:white;
 cursor:pointer;
}
.story img{
 width:100%;
 height:100%;
 object-fit:cover;
}
.story:after{
 content:"";
 position:absolute;
 inset:0;
 background:linear-gradient(transparent 45%,rgba(0,0,0,.8));
}
.story-name{
 position:absolute;
 z-index:2;
 left:8px;
 bottom:9px;
 font-size:12px;
 font-weight:800;
}
.story-create{
 display:flex;
 align-items:center;
 justify-content:center;
 flex-direction:column;
 gap:7px;
}

/* COMPOSER */
.composer-row{
 display:flex;
 gap:10px;
 align-items:center;
}
.avatar{
 width:44px;
 height:44px;
 border-radius:50%;
 object-fit:cover;
 background:#ddd;
}
.composer-input{
 flex:1;
 border:0;
 background:var(--bg);
 color:var(--text);
 border-radius:25px;
 padding:13px 17px;
 cursor:pointer;
}

/* POST */
.post-head{
 display:flex;
 gap:10px;
 align-items:center;
}
.post-user{
 flex:1;
}
.post-user strong{
 display:block;
}
.post-user small{
 color:var(--muted);
}
.post-menu{
 border:0;
 background:transparent;
 color:var(--muted);
 font-size:22px;
}
.post-text{
 white-space:pre-wrap;
 line-height:1.5;
 margin:14px 0;
}
.post-image{
 width:100%;
 max-height:650px;
 object-fit:cover;
 border-radius:12px;
}
.post-stats{
 display:flex;
 justify-content:space-between;
 color:var(--muted);
 font-size:13px;
 padding:10px 2px;
}
.post-actions{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 border-top:1px solid var(--border);
 border-bottom:1px solid var(--border);
}
.post-actions button{
 border:0;
 background:transparent;
 color:var(--muted);
 padding:11px 3px;
 font-weight:700;
}
.post-actions button:hover{
 background:var(--bg);
}
.post-actions button.liked{
 color:#1877f2;
}
.comment-box{
 display:flex;
 gap:8px;
 margin-top:10px;
}
.comment{
 display:flex;
 gap:8px;
 margin-top:10px;
}
.comment-body{
 background:var(--bg);
 padding:8px 11px;
 border-radius:13px;
 flex:1;
}
.comment-body strong{
 display:block;
 font-size:13px;
}
.comment-body small{
 color:var(--muted);
}

/* RIGHT */
.quick-btn{
 width:100%;
 text-align:left;
 margin:5px 0;
}

/* MODAL */
.modal-bg{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.65);
 z-index:5000;
 display:flex;
 justify-content:center;
 align-items:center;
 padding:14px;
 overflow:auto;
}
.modal{
 width:100%;
 max-width:650px;
 max-height:94vh;
 overflow:auto;
 background:var(--card);
 border-radius:20px;
 padding:18px;
}
.modal-head{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:12px;
}
.close{
 border:0;
 width:38px;
 height:38px;
 border-radius:50%;
 background:var(--bg);
 color:var(--text);
 font-size:20px;
}

/* PROFILE */
.cover{
 height:220px;
 border-radius:18px;
 background:linear-gradient(135deg,#1877f2,#7c3aed);
 overflow:hidden;
}
.cover img{
 width:100%;
 height:100%;
 object-fit:cover;
}
.profile-main{
 padding:0 18px 18px;
}
.profile-avatar{
 width:120px;
 height:120px;
 border-radius:50%;
 object-fit:cover;
 border:5px solid var(--card);
 margin-top:-60px;
 position:relative;
}
.profile-actions{
 display:flex;
 flex-wrap:wrap;
 gap:8px;
 margin-top:10px;
}

/* LIST */
.list-item{
 display:flex;
 align-items:center;
 gap:12px;
 padding:11px 0;
 border-bottom:1px solid var(--border);
}
.list-item:last-child{
 border-bottom:0;
}
.list-info{
 flex:1;
}

/* REELS */
.reels-page{
 position:fixed;
 inset:0;
 z-index:9000;
 background:#000;
 overflow-y:auto;
 scroll-snap-type:y mandatory;
}
.reel-item{
 position:relative;
 width:100%;
 max-width:560px;
 height:100vh;
 min-height:600px;
 margin:auto;
 background:#000;
 scroll-snap-align:start;
 overflow:hidden;
}
.reel-video{
 width:100%;
 height:100%;
 object-fit:cover;
 background:#000;
}
.reel-gradient{
 position:absolute;
 inset:0;
 pointer-events:none;
 background:linear-gradient(
   to bottom,
   rgba(0,0,0,.2),
   transparent 35%,
   rgba(0,0,0,.9)
 );
}
.reel-top{
 position:absolute;
 top:16px;
 left:16px;
 right:16px;
 display:flex;
 justify-content:space-between;
 z-index:3;
}
.reel-bottom{
 position:absolute;
 left:16px;
 right:80px;
 bottom:30px;
 z-index:3;
 color:white;
}
.reel-actions{
 position:absolute;
 right:12px;
 bottom:28px;
 z-index:4;
 display:flex;
 flex-direction:column;
 gap:13px;
}
.reel-action{
 width:52px;
 height:52px;
 border:0;
 border-radius:50%;
 background:rgba(0,0,0,.55);
 color:white;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 font-size:20px;
}
.reel-action small{
 font-size:8px;
}
.reel-action.active{
 background:var(--blue);
}
.reel-close{
 width:43px;
 height:43px;
 border:0;
 border-radius:50%;
 background:rgba(0,0,0,.55);
 color:#fff;
 font-size:23px;
}

/* REEL UPLOAD */
.reel-upload{
 background:var(--card);
 border-radius:20px;
}
.drop-zone{
 border:2px dashed #94a3b8;
 border-radius:18px;
 padding:30px 15px;
 text-align:center;
 cursor:pointer;
}
.drop-zone:hover{
 border-color:var(--blue);
}
.reel-preview{
 width:100%;
 max-height:420px;
 object-fit:contain;
 border-radius:15px;
 background:#000;
 margin-top:12px;
}
.reel-cover{
 width:100%;
 max-height:250px;
 object-fit:cover;
 border-radius:15px;
 margin-top:10px;
}
.cover-grid{
 display:grid;
 grid-template-columns:repeat(5,1fr);
 gap:6px;
 margin-top:8px;
}
.cover-frame{
 width:100%;
 aspect-ratio:9/16;
 object-fit:cover;
 border-radius:8px;
 border:2px solid transparent;
 cursor:pointer;
}
.cover-frame.active{
 border-color:var(--blue);
}
.progress{
 height:9px;
 background:#334155;
 border-radius:10px;
 overflow:hidden;
}
.progress-bar{
 width:0;
 height:100%;
 background:linear-gradient(90deg,#1877f2,#7c3aed,#ec4899);
}
.reel-options{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
}
.option{
 padding:10px;
 background:var(--bg);
 border-radius:11px;
}

/* TOAST */
#toast{
 position:fixed;
 left:50%;
 bottom:80px;
 transform:translateX(-50%);
 z-index:10000;
 background:#111827;
 color:#fff;
 padding:12px 18px;
 border-radius:30px;
 opacity:0;
 pointer-events:none;
 transition:.25s;
}
#toast.show{
 opacity:1;
}

/* BOTTOM NAV */
.bottom-nav{
 display:none;
}

/* RESPONSIVE */
@media(max-width:1050px){
 .layout{
  grid-template-columns:210px minmax(0,1fr);
 }
 .rightbar{
  display:none;
 }
}
@media(max-width:760px){
 .topbar{
  padding:7px 10px;
 }
 .top-logo{
  font-size:21px;
 }
 .search-box{
  max-width:none;
 }
 .layout{
  display:block;
  padding:8px 8px 80px;
 }
 .sidebar{
  display:none;
 }
 .main{
  width:100%;
 }
 .bottom-nav{
  display:flex;
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:3000;
  height:62px;
  background:var(--card);
  border-top:1px solid var(--border);
  justify-content:space-around;
  align-items:center;
 }
 .bottom-nav button{
  border:0;
  background:transparent;
  color:var(--muted);
  font-size:21px;
 }
 .bottom-nav button span{
  display:block;
  font-size:9px;
 }
 .top-actions .desktop-only{
  display:none;
 }
 .post-actions{
  grid-template-columns:repeat(4,1fr);
 }
 .reel-item{
  max-width:none;
 }
}
</style>
</head>

<body>

<div id="app">

<!-- ================= AUTH ================= -->

<div id="authScreen" class="auth-screen">

  <div class="auth-box">

    <div class="logo">FriendBook</div>

    <div class="logo-sub">
      Connect with friends and share your world.
    </div>

    <div id="authTitle"
         style="font-size:22px;font-weight:800;margin-bottom:10px">
      Login
    </div>

    <input
      id="authName"
      class="input hidden"
      placeholder="আপনার নাম"
    >

    <input
      id="authEmail"
      class="input"
      type="email"
      placeholder="Email"
    >

    <input
      id="authPassword"
      class="input"
      type="password"
      placeholder="Password"
    >

    <button
      id="authBtn"
      class="btn primary full"
      onclick="authAction()"
    >
      Login
    </button>

    <div
      id="authSwitch"
      class="auth-switch"
      onclick="switchAuth()"
    >
      Create new account
    </div>

  </div>

</div>


<!-- ================= MAIN ================= -->

<div id="mainApp" class="hidden">

  <header class="topbar">

    <div
      class="top-logo"
      onclick="showHome()"
    >
      FriendBook
    </div>

    <div class="search-box">

      <input
        id="globalSearch"
        placeholder="🔎 Search FriendBook"
        onkeydown="
          if(event.key==='Enter') doSearch()
        "
      >

    </div>

    <div class="top-actions">

      <button
        class="icon-btn desktop-only"
        onclick="openMessenger()"
      >💬</button>

      <button
        class="icon-btn"
        onclick="openNotifications()"
      >🔔</button>

      <button
        class="icon-btn"
        onclick="toggleDark()"
      >🌙</button>

    </div>

  </header>


  <div class="layout">

    <!-- LEFT -->

    <aside class="sidebar">

      <div
        class="menu-item active"
        onclick="showHome()"
      >🏠 Home</div>

      <div
        class="menu-item"
        onclick="openProfile(me.id)"
      >👤 Profile</div>

      <div
        class="menu-item"
        onclick="openReels()"
      >🎬 Reels</div>

      <div
        class="menu-item"
        onclick="openMessenger()"
      >💬 Messenger</div>

      <div
        class="menu-item"
        onclick="openFriends()"
      >👥 Friends</div>

      <div
        class="menu-item"
        onclick="openPages()"
      >📄 Pages</div>

      <div
        class="menu-item"
        onclick="openGroups()"
      >👨‍👩‍👧 Groups</div>

      <div
        class="menu-item"
        onclick="openMarketplace()"
      >🛒 Marketplace</div>

      <div
        class="menu-item"
        onclick="openEvents()"
      >📅 Events</div>

      <div
        class="menu-item"
        onclick="openCreator()"
      >💰 Creator Studio</div>

      <div
        class="menu-item"
        onclick="openSettings()"
      >⚙️ Settings</div>

      <div
        class="menu-item"
        onclick="logout()"
      >🚪 Logout</div>

    </aside>


    <!-- CENTER -->

    <main class="main" id="mainContent">

      <div id="homeContent">

        <!-- STORIES -->

        <div class="card">

          <div
            style="
              font-size:18px;
              font-weight:800;
              margin-bottom:10px
            "
          >
            Stories
          </div>

          <div
            id="stories"
            class="story-row"
          ></div>

        </div>


        <!-- COMPOSER -->

        <div class="card">

          <div class="composer-row">

            <img
              id="composerAvatar"
              class="avatar"
            >

            <div
              class="composer-input"
              onclick="openCreatePost()"
            >
              What's on your mind?
            </div>

          </div>

          <div
            style="
              display:grid;
              grid-template-columns:repeat(3,1fr);
              gap:5px;
              margin-top:10px
            "
          >

            <button
              class="btn"
              onclick="openCreatePost()"
            >
              📝 Post
            </button>

            <button
              class="btn"
              onclick="openCreateReel()"
            >
              🎬 Reel
            </button>

            <button
              class="btn"
              onclick="openCreateStory()"
            >
              📷 Story
            </button>

          </div>

        </div>


        <!-- FEED -->

        <div id="feed"></div>

      </div>

    </main>


    <!-- RIGHT -->

    <aside class="rightbar">

      <div class="card">

        <h3 style="margin-top:0">
          Quick Actions
        </h3>

        <button
          class="btn quick-btn"
          onclick="openCreateReel()"
        >
          🎬 Upload Reel
        </button>

        <button
          class="btn quick-btn"
          onclick="openCreatePost()"
        >
          📝 Create Post
        </button>

        <button
          class="btn quick-btn"
          onclick="openCreateStory()"
        >
          📷 Create Story
        </button>

      </div>


      <div class="card">

        <h3 style="margin-top:0">
          Online Friends
        </h3>

        <div id="onlineFriends">
          Loading...
        </div>

      </div>

    </aside>

  </div>


  <!-- MOBILE NAV -->

  <nav class="bottom-nav">

    <button onclick="showHome()">
      🏠
      <span>Home</span>
    </button>

    <button onclick="openReels()">
      🎬
      <span>Reels</span>
    </button>

    <button onclick="openCreatePost()">
      ➕
      <span>Create</span>
    </button>

    <button onclick="openMessenger()">
      💬
      <span>Chat</span>
    </button>

    <button onclick="openProfile(me.id)">
      👤
      <span>Profile</span>
    </button>

  </nav>

</div>


<div id="modalRoot"></div>

<div id="toast"></div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://skereuaizdczbvjplisi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_3R2otJA1zIlsMsTYxe1ocw_NAPY5O9x";

const {createClient} = supabase;

const sb = createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================================
   GLOBAL
========================================================= */

let me = null;
let myProfile = null;

let authMode = "login";

let currentReelFile = null;
let currentReelCover = null;
let currentReelVideoURL = null;

let currentUploadXHR = null;
let currentUploadPaths = [];

let currentReelFrames = [];


/* =========================================================
   HELPERS
========================================================= */

function esc(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function toast(message){

  const el =
    document.getElementById("toast");

  el.textContent = message;

  el.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer =
    setTimeout(()=>{
      el.classList.remove("show");
    },2600);
}


function openModal(html){

  document.getElementById("modalRoot")
    .innerHTML = `
      <div
        class="modal-bg"
        onclick="
          if(event.target===this) closeModal()
        "
      >
        <div class="modal">
          ${html}
        </div>
      </div>
    `;
}


function closeModal(){

  document.getElementById("modalRoot")
    .innerHTML = "";
}


function avatarURL(url){

  if(url) return url;

  return "https://ui-avatars.com/api/?name=FriendBook&background=1877f2&color=fff";
}


function timeAgo(date){

  if(!date) return "";

  const seconds =
    Math.floor(
      (Date.now() - new Date(date).getTime()) / 1000
    );

  if(seconds < 60)
    return "just now";

  if(seconds < 3600)
    return Math.floor(seconds/60)+"m";

  if(seconds < 86400)
    return Math.floor(seconds/3600)+"h";

  if(seconds < 2592000)
    return Math.floor(seconds/86400)+"d";

  return new Date(date).toLocaleDateString();
}


function safeFileName(name){

  return String(name || "file")
    .replace(/[^\w.\-]+/g,"_")
    .slice(-120);
}


/* =========================================================
   AUTH
========================================================= */

function switchAuth(){

  authMode =
    authMode === "login"
    ? "register"
    : "login";

  document.getElementById("authTitle")
    .textContent =
      authMode === "login"
      ? "Login"
      : "Create Account";

  document.getElementById("authBtn")
    .textContent =
      authMode === "login"
      ? "Login"
      : "Create Account";

  document.getElementById("authSwitch")
    .textContent =
      authMode === "login"
      ? "Create new account"
      : "Already have an account? Login";

  document.getElementById("authName")
    .classList.toggle(
      "hidden",
      authMode === "login"
    );
}


async function authAction(){

  const email =
    document.getElementById("authEmail")
      .value.trim();

  const password =
    document.getElementById("authPassword")
      .value;

  const name =
    document.getElementById("authName")
      .value.trim();


  if(!email || !password){

    toast("Email এবং Password দিন");
    return;
  }


  try{

    if(authMode === "login"){

      const {error} =
        await sb.auth.signInWithPassword({
          email,
          password
        });

      if(error) throw error;

      toast("Login successful");

    }else{

      const {
        data,
        error
      } =
        await sb.auth.signUp({
          email,
          password,
          options:{
            data:{
              full_name:name || "FriendBook User"
            }
          }
        });

      if(error) throw error;

      if(data.user){

        await sb
          .from("profiles")
          .upsert({
            id:data.user.id,
            full_name:name || "FriendBook User"
          });
      }

      toast(
        "Account তৈরি হয়েছে। Email verification লাগতে পারে।"
      );
    }

  }catch(error){

    console.error(error);

    toast(
      error.message ||
      "Authentication failed"
    );
  }
}


async function logout(){

  await sb.auth.signOut();

  location.reload();
}


/* =========================================================
   INIT
========================================================= */

async function init(){

  const {
    data:{session}
  } = await sb.auth.getSession();

  if(session){

    me = session.user;

    await boot();

  }else{

    document
      .getElementById("authScreen")
      .classList.remove("hidden");

  }


  sb.auth.onAuthStateChange(
    async(event,session)=>{

      if(session && !me){

        me = session.user;

        await boot();

      }

    }
  );
}


async function boot(){

  document
    .getElementById("authScreen")
    .classList.add("hidden");

  document
    .getElementById("mainApp")
    .classList.remove("hidden");


  await loadMyProfile();

  updateMyUI();

  await showHome();

  loadOnlineFriends();

  updateLastSeen();

  setInterval(updateLastSeen,60000);
}


async function loadMyProfile(){

  const {data} =
    await sb
      .from("profiles")

            me.email?.split("@")[0] ||

function updateMyUI(){

async function loadStories(){

  const box =
    document.getElementById("stories");

  try{

    const {data:stories} =
      await sb
        .from("stories")
        .select("*")
        .gt(
          "expires_at",
          new Date().toISOString()
        )
        .order("created_at",{ascending:false})
        .limit(20);


    let html = `
      <div
        class="story story-create"
        onclick="openCreateStory()"
      >
        <div style="font-size:38px">➕</div>
        <b>Create Story</b>
      </div>
    `;


    if(stories?.length){

      const ids =
        [...new Set(
          stories.map(s=>s.user_id)
        )];

      const {data:profiles} =
        await sb
          .from("profiles")
          .select("*")
          .in("id",ids);

      const map = {};

      (profiles || []).forEach(p=>{
        map[p.id] = p;
      });


      stories.forEach(story=>{

        const p = map[story.user_id];

        html += `
          <div
            class="story"
            onclick="viewStory('${esc(story.image_url)}')"
          >

            <img src="${esc(story.image_url)}">

            <div class="story-name">
              ${esc(
                p?.full_name ||
                "FriendBook User"
              )}
            </div>

          </div>
        `;
      });
    }


    box.innerHTML = html;

  }catch(error){

    console.error(error);

    box.innerHTML = `
      <div class="story story-create"
           onclick="openCreateStory()">
        ➕
        <b>Create Story</b>
      </div>
    `;
  }
}


function openCreateStory(){

  openModal(`
    <div class="modal-head">
      <h2>Create Story</h2>
      <button class="close" onclick="closeModal()">×</button>
    </div>

    <input
      id="storyFile"
      class="input"
      type="file"
      accept="image/*"
    >

    <button
      class="btn primary full"
      onclick="createStory()"
    >
      Publish Story
    </button>
  `);
}


async function createStory(){

  const file =
    document.getElementById("storyFile")
      .files[0];

  if(!file){

    toast("ছবি নির্বাচন করুন");
    return;
  }


  try{

    const path =
      `${me.id}/${Date.now()}-${safeFileName(file.name)}`;


    const {error:uploadError} =
      await sb.storage
        .from("stories")
        .upload(path,file,{
          upsert:false
        });

    if(uploadError) throw uploadError;


    const {data:urlData} =
      sb.storage
        .from("stories")
        .getPublicUrl(path);


    const {error} =
      await sb
        .from("stories")
        .insert({
          user_id:me.id,
          image_url:urlData.publicUrl,
          expires_at:
            new Date(
              Date.now()+24*60*60*1000
            ).toISOString(),
          created_at:
            new Date().toISOString()
        });

    if(error) throw error;

    closeModal();

    toast("Story published");

    loadStories();

  }catch(error){

    console.error(error);

    toast("Story upload হয়নি");
  }
}

async function createPost(){

  const text =
    document.getElementById("postText")
      .value.trim();

  const file =
    document.getElementById("postImage")
      .files[0];


  if(!text && !file){

    toast("Post লিখুন অথবা ছবি দিন");
    return;
  }


  try{

    let imageURL = null;

    if(file){

      const path =
        `${me.id}/${Date.now()}-${safeFileName(file.name)}`;

      const {error} =
        await sb.storage
          .from("posts")
          .upload(path,file,{
            upsert:false
          });

      if(error) throw error;

      imageURL =
        sb.storage
          .from("posts")
          .getPublicUrl(path)
          .data.publicUrl;
    }


    const {error} =
      await sb
        .from("posts")
        .insert({
          user_id:me.id,
          content:text,
          image_url:imageURL,
          created_at:
            new Date().toISOString()
        });

    if(error) throw error;

    closeModal();

    toast("Post published");

    loadFeed();

  }catch(error){

    console.error(error);

    toast(
      "Post publish হয়নি: "+
      error.message
    );
  }
}

   FEED
========================================================= */

async function loadFeed(){

  const feed =
    document.getElementById("feed");

  feed.innerHTML =
    `<div class="card">Loading Feed...</div>`;


  try{

    const {data:posts,error} =
      await sb
        .from("posts")
        .select("*")
        .order("created_at",{ascending:false})
        .limit(30);

    if(error) throw error;


    if(!posts?.length){

      feed.innerHTML = `
        <div class="card"
             style="text-align:center;padding:40px">
          <div style="font-size:45px">📝</div>
          <h3>No posts yet</h3>
          <p>Create your first post.</p>
        </div>
      `;

      return;
    }


    const ids =
      [...new Set(
        posts.map(p=>p.user_id)
      )];


    const {data:profiles} =
      await sb
        .from("profiles")
        .select("*")
        .in("id",ids);


    const map = {};

    (profiles || []).forEach(p=>{
      map[p.id]=p;
    });


    feed.innerHTML =
      posts.map(p=>
        renderPost(
          p,
          map[p.user_id]
        )
      ).join("");


    for(const p of posts){

      hydratePostStats(p.id);
    }


  }catch(error){

    console.error(error);

    feed.innerHTML = `
      <div class="card">
        Feed load হয়নি.
        <br>
        ${esc(error.message)}
      </div>
    `;
  }
}

/* =========================================================
   POST STATS
========================================================= */

async function hydratePostStats(id){

  try{

    const {count:likes} =
      await sb
        .from("post_likes")
        .select("*",{count:"exact",head:true})
        .eq("post_id",id);


    const {count:comments} =
      await sb
        .from("comments")
        .select("*",{count:"exact",head:true})
        .eq("post_id",id);


    const stats =
      document.getElementById(
        "stats-"+id
      );

    if(stats){

      stats.innerHTML = `
        <span>❤️ ${likes || 0}</span>
        <span>${comments || 0} Comments</span>
      `;
    }


    const {data:mine} =
      await sb
        .from("post_likes")
        .select("id")
        .eq("post_id",id)
        .eq("user_id",me.id)
        .maybeSingle();


    const btn =
      document.getElementById(
        "like-"+id
      );

    if(btn && mine){

      btn.classList.add("liked");
      btn.textContent = "💙 Liked";
    }

  }catch(error){

    console.log(error);
  }
}


/* =========================================================
   LIKE
========================================================= */

async function toggleLike(id){

  try{

    const {data} =
      await sb
        .from("post_likes")
        .select("id")
        .eq("post_id",id)
        .eq("user_id",me.id)
        .maybeSingle();


    if(data){

      await sb
        .from("post_likes")
        .delete()
        .eq("id",data.id);

    }else{

      await sb
        .from("post_likes")
        .insert({
          post_id:id,
          user_id:me.id
        });
    }


    await hydratePostStats(id);

  }catch(error){

    console.error(error);

    toast("Like করা যায়নি");
  }
}


/* =========================================================
   COMMENTS
========================================================= */

async function toggleComments(id){

  const box =
    document.getElementById(
      "comments-"+id
    );

  if(!box) return;

  if(!box.classList.contains("hidden")){

    box.classList.add("hidden");
    return;
  }


  box.classList.remove("hidden");

  box.innerHTML =
    `<div style="padding:12px">Loading...</div>`;


  try{

    const {data:comments,error} =
      await sb
        .from("comments")
        .select("*")
        .eq("post_id",id)
        .order("created_at",{ascending:true});


    if(error) throw error;


    const ids =
      [...new Set(
        (comments || []).map(c=>c.user_id)
      )];


    let profiles = [];

    if(ids.length){

      const result =
        await sb
          .from("profiles")
          .select("*")
          .in("id",ids);

      profiles =
        result.data || [];
    }


    const map = {};

    profiles.forEach(p=>{
      map[p.id]=p;
    });


    box.innerHTML = `

      <div class="comment-box">

        <input
          id="commentInput-${id}"
          class="input"
          placeholder="Write a comment..."
        >

        <button
          class="btn primary"
          onclick="addComment(${id})"
        >
          Send
        </button>

      </div>

      <div>
        ${
          (comments || []).map(c=>`

            <div class="comment">

              <img
                class="avatar"
                style="width:36px;height:36px"
                src="${esc(
                  avatarURL(
                    map[c.user_id]?.avatar_url
                  )
                )}"
              >

              <div class="comment-body">

                <strong>
                  ${esc(
                    map[c.user_id]?.full_name ||
                    "User"
                  )}
                </strong>

                <div>
                  ${esc(
                    c.text ||
                    c.content ||
                    ""
                  )}
                </div>

                <small>
                  ${timeAgo(c.created_at)}
                </small>

              </div>

            </div>

          `).join("")
        }
      </div>
    `;

  }catch(error){

    console.error(error);

    box.innerHTML =
      `<div class="card">
        Comments load হয়নি.
      </div>`;
  }
}


async function addComment(id){

  const input =
    document.getElementById(
      "commentInput-"+id
    );

  const text =
    input?.value.trim();

  if(!text) return;


  try{

    const {error} =
      await sb
        .from("comments")
        .insert({
          post_id:id,
          user_id:me.id,
          text:text,
          content:text,
          created_at:
            new Date().toISOString()
        });


    if(error){

      /* Some existing schemas use only text */
      const fallback =
        await sb
          .from("comments")
          .insert({
            post_id:id,
            user_id:me.id,
            text:text,
            created_at:
              new Date().toISOString()
          });

      if(fallback.error)
        throw error;
    }


    input.value = "";

    await toggleComments(id);
    await toggleComments(id);
    await hydratePostStats(id);

  }catch(error){

    console.error(error);

    toast("Comment করা যায়নি");
  }
}

   SHARE POST
========================================================= */

async function sharePost(id){

  const url =
    location.href.split("?")[0] +
    "?post="+id;

  try{

    if(navigator.share){

      await navigator.share({
        title:"FriendBook",
        text:"Check this post",
        url
      });

    }else{

      await navigator.clipboard.writeText(url);

      toast("Post link copied");
    }

  }catch(e){}
}

async function savePost(id){

        .from("fb_saved_posts")

          post_id:id,
          user_id:me.id

      toast("Post saved");
    }

  }catch(error){

    console.error(error);

    toast("Save করা যায়নি");
  }
}

/* =========================================================
   REEL FILE
========================================================= */

function handleReelFile(file){

  if(!file) return;


  if(!file.type.startsWith("video/")){

    toast("শুধু Video নির্বাচন করুন");
    return;
  }


  if(file.size > 100*1024*1024){

    toast("ভিডিও সর্বোচ্চ 100MB হতে পারবে");
    return;
  }


  currentReelFile = file;


  if(currentReelVideoURL)
    URL.revokeObjectURL(
      currentReelVideoURL
    );


  currentReelVideoURL =
    URL.createObjectURL(file);


  const video =
    document.getElementById(
      "reelPreview"
    );

  video.src =
    currentReelVideoURL;


  video.onloadedmetadata =
    function(){

      if(video.duration > 180){

        toast(
          "Reel সর্বোচ্চ 180 seconds"
        );

        currentReelFile = null;

        video.removeAttribute("src");
        video.load();

        return;
      }


      document.getElementById(
        "reelEditor"
      ).style.display = "block";


      document.getElementById(
        "reelDrop"
      ).style.display = "none";


      document.getElementById(
        "reelInfo"
      ).textContent =
        `${formatDuration(video.duration)} • `+
        `${video.videoWidth}×${video.videoHeight} • `+
        `${formatSize(file.size)}`;
    };
}


function formatDuration(sec){

  sec = Math.floor(sec || 0);

  const m =
    Math.floor(sec/60);

  const s =
    sec % 60;

  return (
    String(m).padStart(2,"0")+
    ":"+
    String(s).padStart(2,"0")
  );
}


function formatSize(bytes){

  if(bytes < 1024*1024)
    return Math.round(bytes/1024)+" KB";

  return (
    bytes/(1024*1024)
  ).toFixed(1)+" MB";
}


/* =========================================================
   REEL COVER
========================================================= */

function handleReelCover(file){

  if(!file) return;


  if(!file.type.startsWith("image/")){

    toast("শুধু Image নির্বাচন করুন");
    return;
  }


  if(file.size > 10*1024*1024){

}


/* =========================================================
   VIDEO FRAME COVERS
========================================================= */

async function generateReelFrames(){

  if(!currentReelVideoURL){

    toast("আগে ভিডিও নির্বাচন করুন");
    return;
  }


  const video =
    document.getElementById(
      "reelPreview"
    );

  const box =
    document.getElementById(
      "coverFrames"
    );

  box.innerHTML =
    "Generating covers...";


  currentReelFrames = [];


  const canvas =
    document.createElement("canvas");

  canvas.width =
    video.videoWidth || 720;

  canvas.height =
    video.videoHeight || 1280;


  const ctx =
    canvas.getContext("2d");


  const positions =
    [.1,.3,.5,.7,.9];


  for(let i=0;i<positions.length;i++){

    const time =
      Math.max(
        .1,
        Math.min(
          video.duration-.1,
          video.duration*positions[i]
        )
      );


    await seekVideo(video,time);


    ctx.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );


    const blob =
      await new Promise(resolve =>
        canvas.toBlob(
          resolve,
          "image/jpeg",
          .88
        )
      );


    currentReelFrames.push({
      blob,
      url:URL.createObjectURL(blob)
    });
  }


  box.innerHTML =
    currentReelFrames
      .map((f,i)=>`
        <img
          id="cover-frame-${i}"
          class="cover-frame"
          src="${f.url}"
          onclick="selectReelFrame(${i})"
        >
      `)
      .join("");


  toast("একটি Cover নির্বাচন করুন");
}


function seekVideo(video,time){

  return new Promise(resolve=>{

    const fn = ()=>{

      video.removeEventListener(
        "seeked",
        fn
      );

      resolve();
    };

    video.addEventListener(
      "seeked",
      fn
    );

    video.currentTime = time;
  });
}


function selectReelFrame(index){

  const frame =
    currentReelFrames[index];

  if(!frame) return;


  currentReelCover =
    new File(
      [frame.blob],
      "cover.jpg",
      {
        type:"image/jpeg"
      }
    );


  document
    .querySelectorAll(".cover-frame")
    .forEach(el =>
      el.classList.remove("active")
    );


  document
    .getElementById(
      "cover-frame-"+index
    )
    ?.classList.add("active");


  const preview =
    document.getElementById(
      "reelCoverPreview"
    );

  preview.src = frame.url;
  preview.classList.remove("hidden");

  toast("Cover selected");
}


/* =========================================================
   STORAGE UPLOAD PROGRESS
========================================================= */

function uploadReelFile(
  path,
  file,
  progressCallback
){

  return new Promise(async(resolve,reject)=>{

    try{

      const {
        data:{session}
      } =
        await sb.auth.getSession();


      if(!session){

        reject(
          new Error("Login session expired")
        );

        return;
      }


      const url =
        `${SUPABASE_URL}/storage/v1/object/reels/`+
        path
          .split("/")
          .map(encodeURIComponent)
          .join("/");


      const xhr =
        new XMLHttpRequest();


      currentUploadXHR = xhr;


      xhr.open(
        "POST",
        url,
        true
      );


      xhr.setRequestHeader(
        "Authorization",
        "Bearer "+
        session.access_token
      );


      xhr.setRequestHeader(
        "apikey",
        SUPABASE_KEY
      );


      xhr.setRequestHeader(
        "x-upsert",
        "false"
      );


      xhr.upload.onprogress =
        e=>{

          if(e.lengthComputable){

            progressCallback(
              Math.round(
                e.loaded/e.total*100
              )
            );
          }
        };


      xhr.onload = ()=>{

        currentUploadXHR = null;


        if(
          xhr.status >= 200 &&
          xhr.status < 300
        ){

          resolve(true);

        }else{

          reject(
            new Error(
              xhr.responseText ||
              "Upload failed"
            )
          );
        }
      };


      xhr.onerror = ()=>{

        currentUploadXHR = null;

        reject(
          new Error("Network error")
        );
      };


      xhr.onabort = ()=>{

        currentUploadXHR = null;

        reject(
          new Error("UPLOAD_CANCELLED")
        );
      };


      xhr.send(file);

    }catch(error){

      reject(error);
    }
  });
}


/* =========================================================
   STORAGE URL
========================================================= */

function reelPublicURL(path){

  return (
    SUPABASE_URL+
    "/storage/v1/object/public/reels/"+
    path
      .split("/")
      .map(encodeURIComponent)
      .join("/")
  );
}


/* =========================================================
   PUBLISH REEL
========================================================= */

async function publishReel(){

  if(!currentReelFile){

    toast("ভিডিও নির্বাচন করুন");
    return;
  }


  const btn =
    document.getElementById(
      "publishReelBtn"
    );

  const progressBox =
    document.getElementById(
      "reelProgressBox"
    );

  const progress =
    document.getElementById(
      "reelProgress"
    );

  const progressText =
    document.getElementById(
      "reelProgressText"
    );


  btn.disabled = true;
  btn.textContent = "Uploading...";

  progressBox.style.display = "block";


  let reelId = null;


  try{

    const caption =
      document.getElementById(
        "reelCaption"
      ).value.trim();


    const hashtags =
      document.getElementById(
        "reelHashtags"
      ).value.trim();


    const audience =
      document.getElementById(
        "reelAudience"
      ).value;


    const location =
      document.getElementById(
        "reelLocation"
      ).value.trim();


    const musicName =
      document.getElementById(
        "reelMusicName"
      ).value.trim();


    const musicURL =
      document.getElementById(
        "reelMusicURL"
      ).value.trim();


    const commentsEnabled =
      document.getElementById(
        "reelComments"
      ).checked;


    const reactionsEnabled =
      document.getElementById(
        "reelReactions"
      ).checked;


    const sharesEnabled =
      document.getElementById(
        "reelShares"
      ).checked;


    const video =
      document.getElementById(
        "reelPreview"
      );


    const timestamp =
      Date.now();


    const videoPath =
      `${me.id}/${timestamp}-`+
      safeFileName(
        currentReelFile.name
      );


    currentUploadPaths = [
      videoPath
    ];


    /* VIDEO */

    progressText.textContent =
      "ভিডিও Upload হচ্ছে...";


    await uploadReelFile(
      videoPath,
      currentReelFile,
      p=>{

        progress.style.width =
          Math.round(p*.85)+"%";

        progressText.textContent =
          `ভিডিও Upload হচ্ছে ${p}%`;
      }
    );


    /* COVER */

    let coverPath = null;
    let coverURL = null;


    if(currentReelCover){

      coverPath =
        `${me.id}/covers/`+
        `${timestamp}-cover.jpg`;


      currentUploadPaths.push(
        coverPath
      );


      await uploadReelFile(
        coverPath,
        currentReelCover,
        p=>{

          progress.style.width =
            (85+Math.round(p*.15))+
            "%";

          progressText.textContent =
            `Cover Upload হচ্ছে ${p}%`;
        }
      );


      coverURL =
        reelPublicURL(
          coverPath
        );
    }


    progress.style.width = "96%";

    progressText.textContent =
      "Saving Reel...";


    const finalCaption =
      hashtags
      ? `${caption}\n\n${hashtags}`
      : caption;


    const {
      data:reel,
      error:reelError
    } =
      await sb
        .from("reels")
        .insert({
          user_id:me.id,
          video_url:
            reelPublicURL(
              videoPath
            ),
          caption:finalCaption,
          created_at:
            new Date().toISOString(),
          views:0
        })
        .select()
        .single();


    if(reelError)
      throw reelError;


    reelId =
      reel.id;


    /* SETTINGS */

    const {
      error:settingsError
    } =
      await sb
        .from("fb_reel_settings")
        .upsert({
          reel_id:reel.id,
          user_id:me.id,

          video_path:videoPath,

          cover_path:coverPath,
          cover_url:coverURL,

          music_url:
            musicURL || null,

          music_name:
            musicName || null,

          location:
            location || null,

          hashtags:
            hashtags || null,

          audience,

          comments_enabled:
            commentsEnabled,

          reactions_enabled:
            reactionsEnabled,

          shares_enabled:
            sharesEnabled,

          duration:
            Number(video.duration || 0),

          width:
            Number(video.videoWidth || 0),

          height:
            Number(video.videoHeight || 0),

          updated_at:
            new Date().toISOString()
        },{
          onConflict:"reel_id"
        });


    if(settingsError)
      throw settingsError;


    progress.style.width = "100%";

    progressText.textContent =
      "🎉 Reel Published!";


    toast("🎬 Reel Upload সফল হয়েছে");


    setTimeout(()=>{

      closeModal();

      openReels();

    },800);


  }catch(error){

    console.error(error);


    if(reelId){

      await sb
        .from("reels")
        .delete()
        .eq("id",reelId);
    }


    for(
      const path of currentUploadPaths
    ){

      try{

        await sb.storage
          .from("reels")
          .remove([path]);

      }catch(e){}
    }


    currentUploadPaths = [];


    if(
      error.message ===
      "UPLOAD_CANCELLED"
    ){

      toast("Upload cancelled");

    }else{

      toast(
        "Reel Upload হয়নি: "+
        error.message
      );
    }


    btn.disabled = false;
    btn.textContent =
      "🔁 Retry Publish";
  }
}


/* =========================================================

========================================================= */

async function cancelReelUpload(){

  if(currentUploadXHR){

    try{
      currentUploadXHR.abort();
    }catch(e){}
  }


  for(
    const path of currentUploadPaths
  ){

    try{

      await sb.storage
        .from("reels")
        .remove([path]);

    }catch(e){}
  }


  currentUploadPaths = [];

  closeModal();

  toast("Reel upload cancelled");
}


/* =========================================================
   OPEN REELS
========================================================= */

async function openReels(){

  try{

    const {
      data:reels,
      error
    } =
      await sb
        .from("reels")
        .select("*")
        .order(
          "created_at",
          {ascending:false}
        )
        .limit(50);


    if(error)
      throw error;


    const ids =
      [...new Set(
        (reels || [])
          .map(r=>r.user_id)
          .filter(Boolean)
      )];


    let profiles = [];

    if(ids.length){

      const result =
        await sb
          .from("profiles")
          .select("*")
          .in("id",ids);

      profiles =
        result.data || [];
    }


    const reelIds =
      (reels || []).map(r=>r.id);


    let settings = [];


    if(reelIds.length){

      const result =
        await sb
          .from("fb_reel_settings")
          .select("*")
          .in(
            "reel_id",
            reelIds
          );

      settings =
        result.data || [];
    }


    const profileMap = {};
    const settingsMap = {};


    profiles.forEach(p=>{
      profileMap[p.id]=p;
    });


    settings.forEach(s=>{
      settingsMap[s.reel_id]=s;
    });


    /*
      Privacy:
      public = everyone
      only_me = owner
      friends = allowed by database/RLS
    */

    const visible =
      (reels || []).filter(r=>{

        const s =
          settingsMap[r.id];

        if(!s)
          return true;

        if(s.audience === "public")
          return true;

        if(s.user_id === me.id)
          return true;

        if(s.audience === "friends")
          return true;

        return false;
      });


    document.getElementById(
      "modalRoot"
    ).innerHTML = `

      <div class="reels-page"
           id="reelsPage">

        <div
          style="
            position:fixed;
            top:14px;
            left:14px;
            z-index:100;
          "
        >

          <button
            class="reel-close"
            onclick="closeReels()"
          >
            ←
          </button>

        </div>


        ${
          visible.length
          ?
          visible.map(r=>
            renderReel(
              r,
              profileMap[r.user_id],
              settingsMap[r.id]
            )
          ).join("")
          :
          `
          <div
            style="
              height:100vh;
              display:grid;
              place-items:center;
              color:#fff;
              text-align:center;
            "
          >

            <div>

              <div style="font-size:70px">
                🎬
              </div>

              <h2>No Reels Yet</h2>

              <p>
                আপনার প্রথম Reel Upload করুন
              </p>

              <button
                class="btn primary"
                onclick="
                  closeReels();
                  openCreateReel();
                "
              >
                + Create Reel
              </button>

            </div>

          </div>
          `
        }

      </div>
    `;


    const videos =
      document.querySelectorAll(
        ".reel-video"
      );


    const observer =
      new IntersectionObserver(
        entries=>{

          entries.forEach(entry=>{

            const video =
              entry.target;


            if(entry.isIntersecting){

              video.play().catch(()=>{});

              incrementReelView(
                video.dataset.reelId
              );

            }else{

              video.pause();
            }

          });

        },
        {
          threshold:.75
        }
      );


    videos.forEach(v=>{
      observer.observe(v);
    });


  }catch(error){

    console.error(error);

    toast(
      "Reels load হয়নি: "+
      error.message
    );
  }
}

      "sound-"+video.dataset.reelId

/* =========================================================
   REEL VIEWS
========================================================= */

async function incrementReelView(id){

  try{

    const key =
      "friendbook_reel_view_"+id;


    if(sessionStorage.getItem(key))
      return;


    sessionStorage.setItem(

      )}"
    >

      value="${esc(

      )}"
    >


    <select
      id="editReelAudience"
      class="input"
    >

      <option
        value="public"
        ${settings?.audience==="public"?"selected":""}
      >
        🌎 Public
      </option>

      <option
        value="friends"
        ${settings?.audience==="friends"?"selected":""}
      >
        👥 Friends
      </option>

      <option
        value="only_me"
        ${settings?.audience==="only_me"?"selected":""}
      >
        🔒 Only Me
      </option>

    </select>


    <button
      class="btn primary full"
      onclick="saveReelEdit(${id})"
    >
      Save Changes
    </button>

  `);
}


async function saveReelEdit(id){

  try{

    const caption =
      document.getElementById(
        "editReelCaption"
      ).value.trim();


    const location =
      document.getElementById(
        "editReelLocation"
      ).value.trim();


    const hashtags =
      document.getElementById(
        "editReelHashtags"
      ).value.trim();


    const audience =
      document.getElementById(
        "editReelAudience"
      ).value;


    const finalCaption =
      hashtags
      ? `${caption}\n\n${hashtags}`
      : caption;


    const {error:reelError} =
      await sb
        .from("reels")
        .update({
          caption:finalCaption
        })
        .eq("id",id)
        .eq("user_id",me.id);


    if(reelError)
      throw reelError;


    const {error:settingsError} =
      await sb
        .from("fb_reel_settings")
        .upsert({
          reel_id:id,
          user_id:me.id,
          location:
            location || null,
          hashtags:
            hashtags || null,
          audience,
          updated_at:
            new Date().toISOString()
        },{
          onConflict:"reel_id"
        });


    if(settingsError)
      throw settingsError;


    closeModal();

    toast("Reel updated");

    openReels();

  }catch(error){

    console.error(error);

    toast("Update হয়নি");
  }
}


/* =========================================================
   DELETE REEL
========================================================= */

async function deleteReel(id){

  if(!confirm(
    "এই Reel Delete করতে চান?"
  ))
    return;


  try{

    const {data:settings} =
      await sb
        .from("fb_reel_settings")
        .select(
          "video_path,cover_path"
        )
        .eq("reel_id",id)
        .maybeSingle();


    const {error} =
      await sb
        .from("reels")
        .delete()
        .eq("id",id)
        .eq("user_id",me.id);


    if(error)
      throw error;


    if(settings?.video_path){

      await sb.storage
        .from("reels")
        .remove([
          settings.video_path
        ]);
    }


    if(settings?.cover_path){

      await sb.storage
        .from("reels")
        .remove([
          settings.cover_path
        ]);
    }


    closeModal();

    toast("Reel deleted");

    openReels();

  }catch(error){

    console.error(error);

    toast("Reel Delete হয়নি");
  }
}

========================================================= */

function editMyProfile(){

  openModal(`

    <div class="modal-head">

      <h2>Edit Profile</h2>

      <button
        class="close"
        onclick="closeModal()"
      >
        ×
      </button>

    </div>


    <input
      id="editName"
      class="input"
      placeholder="Full name"
      value="${esc(
        myProfile?.full_name ||
        myProfile?.name ||
        ""
      )}"
    >


    <textarea
      id="editBio"
      class="input"
      placeholder="Bio"
    >${esc(
      myProfile?.bio || ""
    )}</textarea>


    <input
      id="editAvatar"
      class="input"
      type="file"
      accept="image/*"
    >


    <button
      class="btn primary full"
      onclick="saveProfile()"
    >
      Save Profile
    </button>

  `);
}


async function saveProfile(){

  try{

    const name =
      document.getElementById(
        "editName"
      ).value.trim();


    const bio =
      document.getElementById(
        "editBio"
      ).value.trim();


    const file =
      document.getElementById(
        "editAvatar"
      ).files[0];


    let avatar_url =
      myProfile?.avatar_url ||
      null;


    if(file){

      const path =
        `${me.id}/${Date.now()}-${safeFileName(file.name)}`;


      const {error} =
        await sb.storage
          .from("avatars")
          .upload(path,file,{
            upsert:true
          });


      if(error) throw error;


      avatar_url =
        sb.storage
          .from("avatars")
          .getPublicUrl(path)
          .data.publicUrl;
    }


    const {data,error} =
      await sb
        .from("profiles")
        .upsert({
          id:me.id,
          full_name:name,
          bio,
          avatar_url
        })
        .select()
        .single();


    if(error)
      throw error;


    myProfile = data;

    updateMyUI();

    closeModal();

    toast("Profile updated");

  }catch(error){

    console.error(error);

    toast(
      "Profile update হয়নি"
    );
  }
}

  localStorage.setItem(
    "friendbook_dark",
    document.body.classList.contains("dark")

}

async function loadOnlineFriends(){

      "onlineFriends"

      await sb

            <div class="list-info">

              <b>
                ${esc(
                  p.full_name ||
                  "User"
                )}

              <small>

                  p.last_seen
