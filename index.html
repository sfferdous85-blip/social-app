<!-- =========================================================
     ADVANCED CREATOR UPLOAD STUDIO
========================================================= -->

<style>
/* UPLOAD FAB */
.creator-fab{
  position:fixed;
  right:18px;
  bottom:85px;
  z-index:300;
  width:58px;
  height:58px;
  border-radius:50%;
  background:#1877f2;
  color:#fff;
  font-size:28px;
  box-shadow:0 8px 25px #0004;
  display:flex;
  align-items:center;
  justify-content:center;
}

.creator-fab:active{
  transform:scale(.94);
}

/* UPLOAD MODAL */
.creator-modal{
  position:fixed;
  inset:0;
  z-index:900;
  background:#000b;
  display:none;
  align-items:flex-end;
  justify-content:center;
}

.creator-modal.show{
  display:flex;
}

.creator-sheet{
  width:100%;
  max-width:760px;
  max-height:96vh;
  overflow:auto;
  background:#fff;
  color:#111;
  border-radius:28px 28px 0 0;
  padding:16px;
}

body.dark .creator-sheet{
  background:#11151b;
  color:#fff;
}

.creator-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
}

.creator-head h2{
  margin:0;
  font-size:21px;
}

.creator-close{
  width:38px;
  height:38px;
  border-radius:50%;
  background:#eee;
}

body.dark .creator-close{
  background:#292e36;
  color:#fff;
}

/* TYPE */
.creator-types{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
  margin-bottom:14px;
}

.creator-types button{
  padding:11px 4px;
  border:0;
  border-radius:13px;
  background:#eef1f5;
  font-size:12px;
  font-weight:800;
}

body.dark .creator-types button{
  background:#242932;
  color:#fff;
}

.creator-types button.active{
  background:#1877f2;
  color:#fff;
}

/* DROP */
.creator-drop{
  border:2px dashed #aeb7c4;
  border-radius:20px;
  padding:25px 12px;
  text-align:center;
  margin-bottom:12px;
}

.creator-drop-icon{
  font-size:40px;
}

.creator-drop-title{
  font-weight:900;
  margin-top:7px;
}

.creator-drop-sub{
  color:#777;
  font-size:13px;
  margin-top:5px;
}

.creator-select{
  margin-top:12px;
  background:#1877f2;
  color:#fff;
  padding:12px 20px;
  border-radius:13px;
  font-weight:800;
  border:0;
}

#creatorFileInput{
  display:none;
}

/* QUEUE */
.creator-queue{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:12px;
}

.creator-item{
  position:relative;
  border-radius:14px;
  overflow:hidden;
  background:#000;
  aspect-ratio:1/1;
}

.creator-item img,
.creator-item video{
  width:100%;
  height:100%;
  object-fit:cover;
}

.creator-remove{
  position:absolute;
  right:6px;
  top:6px;
  width:29px;
  height:29px;
  border:0;
  border-radius:50%;
  background:#000c;
  color:#fff;
}

/* EDITOR */
.creator-editor{
  background:#f3f5f8;
  border-radius:18px;
  padding:13px;
  margin-bottom:12px;
}

body.dark .creator-editor{
  background:#1c2128;
}

.creator-editor h3{
  margin:0 0 10px;
  font-size:16px;
}

.creator-control{
  margin:12px 0;
}

.creator-control label{
  display:flex;
  justify-content:space-between;
  font-size:13px;
  margin-bottom:5px;
}

.creator-control input[type=range]{
  width:100%;
}

.creator-effects{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
}

.creator-effects button{
  padding:9px 2px;
  border:0;
  border-radius:9px;
  background:#fff;
  font-size:11px;
}

body.dark .creator-effects button{
  background:#2a3039;
  color:#fff;
}

.creator-effects button.active{
  background:#1877f2;
  color:#fff;
}

/* INPUT */
.creator-field{
  width:100%;
  padding:13px;
  border:1px solid #d8dde5;
  border-radius:13px;
  margin-bottom:8px;
  outline:none;
}

body.dark .creator-field{
  background:#20252d;
  color:#fff;
  border-color:#353b45;
}

.creator-caption{
  min-height:100px;
  resize:vertical;
}

/* OPTIONS */
.creator-options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.creator-option{
  background:#f1f3f6;
  padding:10px;
  border-radius:12px;
}

body.dark .creator-option{
  background:#242a32;
}

.creator-option label{
  display:block;
  font-size:12px;
  margin-bottom:5px;
}

.creator-option select{
  width:100%;
  border:0;
  background:transparent;
  outline:none;
}

/* PREVIEW */
.creator-preview{
  background:#000;
  border-radius:18px;
  overflow:hidden;
  margin:12px 0;
  display:none;
}

.creator-preview.show{
  display:block;
}

.creator-preview video,
.creator-preview img{
  width:100%;
  max-height:500px;
  object-fit:contain;
  display:block;
}

/* PROGRESS */
.creator-progress{
  display:none;
  margin:12px 0;
}

.creator-progress.show{
  display:block;
}

.creator-progress-track{
  height:10px;
  border-radius:10px;
  background:#e1e5eb;
  overflow:hidden;
}

.creator-progress-bar{
  width:0%;
  height:100%;
  background:#1877f2;
  transition:.2s;
}

.creator-progress-info{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  margin-top:5px;
}

/* BUTTON */
.creator-publish{
  width:100%;
  padding:15px;
  border:0;
  border-radius:15px;
  background:#1877f2;
  color:#fff;
  font-size:16px;
  font-weight:900;
}

.creator-cancel{
  width:100%;
  padding:13px;
  border:0;
  border-radius:14px;
  background:#e9edf2;
  margin-top:8px;
  font-weight:800;
}

body.dark .creator-cancel{
  background:#292f38;
  color:#fff;
}

@media(max-width:520px){
  .creator-types{
    grid-template-columns:repeat(5,1fr);
  }

  .creator-effects{
    grid-template-columns:repeat(5,1fr);
  }
}
</style>

  +
</button>


<!-- CREATOR STUDIO -->

<div
  id="creatorModal"
  class="creator-modal">

  <div class="creator-sheet">

    <div class="creator-head">

      <h2>✨ Creator Studio</h2>

      <button
        class="creator-close"
        onclick="closeCreatorStudio()">
        ✕
      </button>

    </div>


    <!-- CONTENT TYPE -->

    <div class="creator-types">

      <button
        class="active"
        data-type="post"
        onclick="creatorSetType('post',this)">

        data-type="photo"
        onclick="creatorSetType('photo',this)">

      </button>

    <!-- DROP AREA -->

      <div class="creator-drop-icon">

      </div>

      <div class="creator-drop-title">

      </div>

      <div class="creator-drop-sub">

      accept="image/*,video/*">

    <!-- PREVIEW -->

    <div
      id="creatorPreview"
      class="creator-preview">

      <img
        id="creatorPreviewImage"
        class="hidden">

      <video
        id="creatorPreviewVideo"
        controls

      </video>

    </div>


    <!-- VIDEO EDITOR -->

    <div
      id="creatorVideoEditor"
      class="creator-editor"
      style="display:none">

      <h3>🎬 Advanced Video Editor</h3>


      <div class="creator-control">

        <label>
          <span>Trim Start</span>

        <input

      <div class="creator-control">

          <span>Trim End</span>

        </label>

        <input
          id="creatorSpeed"

      <div class="creator-control">

        </label>

        <input
          id="creatorBrightness"
          type="range"

      <div class="creator-control">

    <!-- PUBLISH SETTINGS -->

    <div class="creator-editor">

    <!-- PROGRESS -->

<script>

/* =========================================================
   CREATOR STATE
========================================================= */

let creatorType = "post";

let creatorFiles = [];

let creatorVideo = null;

let creatorVideoDuration = 0;

let creatorEffectValue = "normal";

let creatorMuted = false;

let creatorCancelled = false;

let creatorCoverFile = null;


/* =========================================================
   OPEN / CLOSE
========================================================= */

function openCreatorStudio(){

  document
    .getElementById("creatorModal")
    .classList.add("show");

}


function closeCreatorStudio(){

  document
    .getElementById("creatorModal")
    .classList.remove("show");

}


/* =========================================================
   TYPE
========================================================= */

function creatorSetType(type,button){

  creatorType = type;

  document
    .querySelectorAll(
      ".creator-types button"
    )
    .forEach(
      x =>
        x.classList.remove("active")
    );

  button.classList.add("active");

  const input =
    document.getElementById(
      "creatorFileInput"
    );

  if(type === "photo"){

    input.accept =
      "image/*";

  }else if(
    type === "video" ||
    type === "reel"
  ){

    input.accept =
      "video/*";

  }else{

    input.accept =
      "image/*,video/*";

  }

  creatorUpdateEditor();

}


/* =========================================================
   FILE INPUT
========================================================= */

document
  .getElementById(
    "creatorFileInput"
  )
  .addEventListener(
    "change",
    e => {

      creatorAddFiles(
        Array.from(
          e.target.files
        )
      );

    }
  );


function creatorAddFiles(files){

  if(!files.length)
    return;


  const valid =
    files.filter(
      file =>
        file.type.startsWith("image/") ||
        file.type.startsWith("video/")
    );


  creatorFiles =
    [
      ...creatorFiles,
      ...valid
    ];


  creatorRenderQueue();

  creatorDetectVideo();

}


/* =========================================================
   QUEUE
========================================================= */

function creatorRenderQueue(){

  const box =
    document.getElementById(
      "creatorQueue"
    );

  box.innerHTML = "";


  creatorFiles.forEach(
    (file,index) => {

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "creator-item";


      let media;


      if(
        file.type.startsWith(
          "image/"
        )
      ){

        media =
          document.createElement(
            "img"
          );

        media.src =
          URL.createObjectURL(
            file
          );

      }else{

        media =
          document.createElement(
            "video"
          );

        media.src =
          URL.createObjectURL(
            file
          );

        media.muted =
          true;

      }


      const remove =
        document.createElement(
          "button"
        );

      remove.className =
        "creator-remove";

      remove.textContent =
        "✕";


      remove.onclick =
        event => {

          event.stopPropagation();

          creatorFiles.splice(
            index,
            1
          );

          creatorRenderQueue();

          creatorDetectVideo();

        };


      item.appendChild(media);

      item.appendChild(remove);

      box.appendChild(item);

    }
  );

}


/* =========================================================
   DETECT VIDEO
========================================================= */

function creatorDetectVideo(){

  creatorVideo =
    creatorFiles.find(
      file =>
        file.type.startsWith(
          "video/"
        )
    ) || null;


  creatorUpdateEditor();


  if(!creatorVideo)
    return;


  const video =
    document.createElement(
      "video"
    );


  video.preload =
    "metadata";

  video.src =
    URL.createObjectURL(
      creatorVideo
    );


  video.onloadedmetadata =
    () => {

      creatorVideoDuration =
        Math.floor(
          video.duration
        );


      const start =
        document.getElementById(
          "creatorTrimStart"
        );

      const end =
        document.getElementById(
          "creatorTrimEnd"
        );


      start.max =
        creatorVideoDuration;

      end.max =
        creatorVideoDuration;

      end.value =
        creatorVideoDuration;


      document
        .getElementById(
          "creatorEndText"
        )
        .textContent =
          creatorVideoDuration +
          "s";

    };

}


/* =========================================================
   EDITOR VISIBILITY
========================================================= */

function creatorUpdateEditor(){

  const editor =
    document.getElementById(
      "creatorVideoEditor"
    );


  if(
    creatorVideo &&
    (
      creatorType === "video" ||
      creatorType === "reel"
    )
  ){

    editor.style.display =
      "block";

  }else{

    editor.style.display =
      "none";

  }

}


/* =========================================================
   PREVIEW
========================================================= */

function creatorPreviewFile(file){

  if(!file)
    return;


  const box =
    document.getElementById(
      "creatorPreview"
    );

  const img =
    document.getElementById(
      "creatorPreviewImage"
    );

  const video =
    document.getElementById(
      "creatorPreviewVideo"
    );


  box.classList.add("show");


  if(
    file.type.startsWith(
      "image/"
    )
  ){

    img.src =
      URL.createObjectURL(
        file
      );

    img.style.display =
      "block";

    video.style.display =
      "none";

  }else{

    video.src =
      URL.createObjectURL(
        file
      );

    video.style.display =
      "block";

    img.style.display =
      "none";

  }

}


/* =========================================================
   CONTROLS
========================================================= */

function creatorApplyControls(){

  if(!creatorVideo)
    return;


  const brightness =
    document.getElementById(
      "creatorBrightness"
    ).value;


  const contrast =
    document.getElementById(
      "creatorContrast"
    ).value;


  const saturation =
    document.getElementById(
      "creatorSaturation"
    ).value;


  const speed =
    document.getElementById(
      "creatorSpeed"
    ).value;


  document.getElementById(
    "creatorBrightnessText"
  ).textContent =
    brightness + "%";


  document.getElementById(
    "creatorContrastText"
  ).textContent =
    contrast + "%";


  document.getElementById(
    "creatorSaturationText"
  ).textContent =
    saturation + "%";


  document.getElementById(
    "creatorSpeedText"
  ).textContent =
    speed + "x";


  const preview =
    document.getElementById(
      "creatorPreviewVideo"
    );


  preview.style.filter =
    creatorBuildFilter();

  preview.playbackRate =
    Number(speed);

  preview.muted =
    creatorMuted;

}


/* =========================================================
   FILTER
========================================================= */

function creatorBuildFilter(){

  const b =
    document.getElementById(
      "creatorBrightness"
    ).value;

  const c =
    document.getElementById(
      "creatorContrast"
    ).value;

  const s =
    document.getElementById(
      "creatorSaturation"
    ).value;


  let filter =
    `brightness(${b}%)
     contrast(${c}%)
     saturate(${s}%)`;


  if(
    creatorEffectValue === "bw"
  ){

    filter +=
      " grayscale(100%)";

  }


  if(
    creatorEffectValue === "sepia"
  ){

    filter +=
      " sepia(100%)";

  }


  if(
    creatorEffectValue === "vintage"
  ){

    filter +=
      " sepia(35%) contrast(115%)";

  }


  if(
    creatorEffectValue === "dramatic"
  ){

    filter +=
      " contrast(140%) saturate(115%)";

  }


  return filter;

}


/* =========================================================
   FILTER BUTTON
========================================================= */

function creatorEffect(effect,button){

  creatorEffectValue =
    effect;


  document
    .querySelectorAll(
      ".creator-effects button"
    )
    .forEach(
      x =>
        x.classList.remove(
          "active"
        )
    );


  button.classList.add(
    "active"
  );


  creatorApplyControls();

}


/* =========================================================
   RANGE EVENTS
========================================================= */

[
  "creatorBrightness",
  "creatorContrast",
  "creatorSaturation",
  "creatorSpeed"
].forEach(
  id => {

    document
      .getElementById(id)
      .addEventListener(
        "input",
        creatorApplyControls
      );

  }
);


document
  .getElementById(
    "creatorTrimStart"
  )
  .addEventListener(
    "input",
    e => {

      document
        .getElementById(
          "creatorStartText"
        )
        .textContent =
          e.target.value +
          "s";

    }
  );


document
  .getElementById(
    "creatorTrimEnd"
  )
  .addEventListener(
    "input",
    e => {

      document
        .getElementById(
          "creatorEndText"
        )
        .textContent =
          e.target.value +
          "s";

    }
  );


/* =========================================================
   MUTE
========================================================= */

function creatorToggleMute(){

  creatorMuted =
    !creatorMuted;


  document
    .getElementById(
      "creatorMute"
    )
    .textContent =
      creatorMuted
        ? "🔇 Original Audio Off"
        : "🔊 Original Audio On";


  creatorApplyControls();

}


/* =========================================================
   COVER
========================================================= */

document
  .getElementById(
    "creatorCover"
  )
  .addEventListener(
    "change",
    e => {

      creatorCoverFile =

/* =========================================================
   UPLOAD STORAGE
========================================================= */

async function creatorUploadFile(
  file,
  folder,
  progress
){

  if(
    typeof supabaseClient ===
    "undefined"
  ){

    throw new Error(
      "Supabase client পাওয়া যায়নি."
    );

  }


  if(
    typeof currentUser ===
    "undefined" ||
    !currentUser
  ){

    throw new Error(
      "Login required."
    );

  }


  const ext =
    file.name
      .split(".")
      .pop()
      .toLowerCase();


  const path =
    `${folder}/${currentUser.id}/${crypto.randomUUID()}.${ext}`;


  progress(15);


  const result =
    await supabaseClient
      .storage
      .from("post-images")
      .upload(
        path,
        file,
        {
          cacheControl:"3600",
          upsert:false,
          contentType:file.type
        }
      );


  if(result.error)
    throw result.error;


  progress(90);


  const publicData =
    supabaseClient
      .storage
      .from("post-images")
      .getPublicUrl(
        path
      );


  progress(100);


  return publicData.data.publicUrl;

}


/* =========================================================
   PUBLISH
========================================================= */

async function creatorPublishContent(){

  if(
    typeof currentUser ===
    "undefined" ||
    !currentUser
  ){

    alert(
      "প্রথমে Login করুন."
    );

    return;

  }


  if(
    creatorFiles.length === 0 &&
    creatorType !== "post"
  ){

    alert(
      "Media নির্বাচন করুন."
    );

    return;

  }


  if(
    creatorType === "post" &&
    creatorFiles.length === 0 &&
    !document
      .getElementById(
        "creatorCaption"
      )
      .value
      .trim()
  ){

    alert(
      "Post-এর জন্য কিছু লিখুন বা media নির্বাচন করুন."
    );

    return;

  }


  creatorCancelled =
    false;


  const publish =
    document.getElementById(
      "creatorPublish"
    );


  const progress =
    document.getElementById(
      "creatorProgress"
    );


  const bar =
    document.getElementById(
      "creatorProgressBar"
    );


  const text =
    document.getElementById(
      "creatorProgressText"
    );


  const percent =
    document.getElementById(
      "creatorProgressPercent"
    );


  publish.disabled =
    true;


  progress.classList.add(
    "show"
  );


  try{

    const caption =
      document
        .getElementById(
          "creatorCaption"
        )
        .value
        .trim();


    const feeling =
      document
        .getElementById(
          "creatorFeeling"
        )
        .value
        .trim();


    const location =
      document
        .getElementById(
          "creatorLocation"
        )
        .value
        .trim();


    const tags =
      document
        .getElementById(
          "creatorTags"
        )
        .value
        .trim();


    const audience =
      document
        .getElementById(
          "creatorAudience"
        )
        .value;


    const comments =
      document
        .getElementById(
          "creatorComments"
        )
        .value === "true";


    const uploaded = [];


    for(
      let i=0;
      i<creatorFiles.length;
      i++
    ){

      if(creatorCancelled)
        throw new Error(
          "Upload cancelled."
        );


      const file =
        creatorFiles[i];


      text.textContent =
        `Uploading ${i+1}/${creatorFiles.length}`;


      const base =
        (
          i /
          creatorFiles.length
        ) *
        100;


      const size =
        100 /
        creatorFiles.length;


      const url =
        await creatorUploadFile(
          file,
          creatorType === "reel"
            ? "reels"
            : "posts",
          p => {

            const total =
              base +
              (p / 100) *
              size;


            bar.style.width =
              total + "%";


            percent.textContent =
              Math.round(total) +
              "%";

          }
        );


      uploaded.push({
        file,
        url
      });

    }


    text.textContent =
      "Saving content...";


    /* =========================================
       REEL
    ========================================= */

    if(
      creatorType === "reel"
    ){

      const video =
        uploaded.find(
          x =>
            x.file.type
              .startsWith(
                "video/"
              )
        );


      if(!video)
        throw new Error(
          "Reel video পাওয়া যায়নি."
        );


      const data = {

        user_id:
          currentUser.id,

        video_url:
          video.url,

        caption:
          caption,

        views:
          0,

        audio_name:
          ""

      };


      const result =
        await supabaseClient
          .from("reels")
          .insert(data);


      if(result.error)
        throw result.error;

    }


    /* =========================================
       POST / PHOTO / VIDEO
    ========================================= */

    else if(
      creatorType === "post" ||
      creatorType === "photo" ||
      creatorType === "video"
    ){

      const first =
        uploaded[0];


      const result =
        await supabaseClient
          .from("posts")
          .insert({

            user_id:
              currentUser.id,

            text:
              caption,

            image_url:
              first &&
              first.file.type
                .startsWith("image/")
                ? first.url
                : null,

            privacy:
              audience,

            feeling:
              feeling || null,

            location:
              location || null,

            promoted:
              false,

            view_count:
              0

          })
          .select()
          .single();


      if(result.error)
        throw result.error;


      const post =
        result.data;


      if(
        uploaded.length
      ){

        const rows =
          uploaded.map(
            (x,index) => ({

              post_id:
                post.id,

              media_url:
                x.url,

              media_type:
                x.file.type
                  .startsWith(
                    "video/"
                  )
                  ? "video"
                  : "image",

              sort_order:
                index

            })
          );


        const mediaResult =
          await supabaseClient
            .from("post_media")
            .insert(rows);


        /*
          post_media table থাকলেও
          schema mismatch হলে post
          যেন পুরোপুরি fail না করে।
        */

        if(
          mediaResult.error
        ){

          console.warn(
            "post_media error:",
            mediaResult.error
          );

        }

      }

    }


    /* =========================================
       STORY
    ========================================= */

    else if(
      creatorType === "story"
    ){

      /*
        Story table তোমার বর্তমান schema-তে
        নিশ্চিত না থাকলে এখানে upload সম্পন্ন
        হওয়ার পর UI success দেখানো হচ্ছে।
        Story table তৈরি করলে এখানে insert
        করা যাবে।
      */

      console.log(
        "Story uploaded:",
        uploaded
      );

    }


    bar.style.width =
      "100%";

    percent.textContent =
      "100%";

    text.textContent =
      "✅ Published successfully";


    setTimeout(
      () => {

        creatorReset();

        closeCreatorStudio();

        if(
          typeof loadFeed ===
          "function"
        ){

          loadFeed();

        }

      },
      800
    );


  }catch(error){

    console.error(
      "Creator upload error:",
      error
    );


    text.textContent =
      "❌ " +
      error.message;


    alert(
      "Upload failed:\n" +
      error.message
    );


  }finally{

    publish.disabled =
      false;

  }

}
