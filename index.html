<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#1877f2">
<title>FriendBook</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0;font-family:Arial,sans-serif;background:#f0f2f5;color:#111}
button,input,textarea,select{font:inherit}
button{border:0;cursor:pointer}
.hidden{display:none!important}
a{text-decoration:none;color:inherit}

:root{
 --blue:#1877f2;
 --green:#42b72a;
 --bg:#f0f2f5;
 --card:#fff;
 --text:#111;
 --muted:#65676b;
 --line:#ddd;
}

body.dark{
 --bg:#18191a;
 --card:#242526;
 --text:#e4e6eb;
 --muted:#b0b3b8;
 --line:#3a3b3c;
}

body{background:var(--bg);color:var(--text)}

#loginPage{
 min-height:100vh;
 display:flex;
 justify-content:center;
 align-items:center;
 padding:20px;
}
.loginBox{
 width:min(420px,100%);
 background:var(--card);
 padding:25px;
 border-radius:18px;
 box-shadow:0 5px 25px #0002;
}
.loginBox h1{
 color:var(--blue);
 text-align:center;
 margin-top:0;
 font-size:32px;
}
.loginBox input{
 width:100%;
 padding:14px;
 margin:6px 0;
 border:1px solid var(--line);
 border-radius:10px;
 background:var(--card);
 color:var(--text);
}
.btn{
 width:100%;
 padding:13px;
 border-radius:9px;
 margin-top:7px;
}
.blue{background:var(--blue);color:#fff}
.green{background:var(--green);color:#fff}
.gray{background:#e4e6eb;color:#111}

#app{display:none;min-height:100vh}

.topbar{
 height:60px;
 position:sticky;
 top:0;
 z-index:50;
 background:var(--card);
 border-bottom:1px solid var(--line);
 display:flex;
 align-items:center;
 gap:10px;
 padding:8px 12px;
}
.logo{
 font-size:22px;
 font-weight:bold;
 color:var(--blue);
}
.search{
 flex:1;
 max-width:500px;
 border:1px solid var(--line);
 background:var(--bg);
 color:var(--text);
 border-radius:22px;
 padding:10px 15px;
}
.topButton{
 width:40px;
 height:40px;
 border-radius:50%;
 background:var(--bg);
 color:var(--text);
}

.nav{
 position:sticky;
 top:60px;
 z-index:45;
 background:var(--card);
 border-bottom:1px solid var(--line);
 display:flex;
 overflow-x:auto;
 scrollbar-width:none;
}
.nav::-webkit-scrollbar{display:none}
.nav button{
 white-space:nowrap;
 padding:13px 15px;
 background:var(--card);
 color:var(--text);
}
.nav button.active{
 color:var(--blue);
 border-bottom:3px solid var(--blue);
 font-weight:bold;
}

.page{
 width:min(950px,100%);
 margin:auto;
 padding:12px;
}

.card{
 background:var(--card);
 border-radius:12px;
 padding:14px;
 margin-bottom:12px;
 box-shadow:0 1px 3px #0001;
}

.row{
 display:flex;
 align-items:center;
 gap:10px;
}
.avatar{
 width:45px;
 height:45px;
 border-radius:50%;
 object-fit:cover;
 background:#ddd;
}
.cover{
 width:100%;
 height:220px;
 object-fit:cover;
 border-radius:12px;
 background:#bbb;
}
.muted{color:var(--muted)}
.small{font-size:12px}

textarea,input,select{
 background:var(--card);
 color:var(--text);
 border:1px solid var(--line);
 border-radius:9px;
 padding:11px;
}
textarea{resize:vertical}

.composer textarea{
 width:100%;
 margin-top:10px;
}

.postImage{
 width:100%;
 max-height:650px;
 object-fit:cover;
 border-radius:10px;
 margin-top:10px;
}

.actions{
 display:flex;
 border-top:1px solid var(--line);
 margin-top:10px;
 padding-top:7px;
 gap:4px;
}
.actions button{
 flex:1;
 background:transparent;
 color:var(--text);
 padding:10px 4px;
 border-radius:7px;
}
.actions button:hover{background:var(--bg)}

.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
 gap:10px;
}

.item{
 border:1px solid var(--line);
 border-radius:10px;
 padding:12px;
}

/* REELS */
.reels{
 height:calc(100vh - 116px);
 overflow-y:auto;
 scroll-snap-type:y mandatory;
 background:#000;
}
.reel{
 height:calc(100vh - 116px);
 min-height:500px;
 position:relative;
 scroll-snap-align:start;
 background:#111;
 color:#fff;
 overflow:hidden;
}
.reel video{
 width:100%;
 height:100%;
 object-fit:cover;
 background:#111;
}
.reelShade{
 position:absolute;
 inset:0;
 background:linear-gradient(
   transparent 35%,
   transparent 50%,
   #000b 100%
 );
 pointer-events:none;
}
.reelSound{
 position:absolute;
 right:12px;
 top:12px;
 z-index:10;
 width:44px;
 height:44px;
 border-radius:50%;
 background:#0009;
 color:#fff;
 font-size:20px;
}
.reelSide{
 position:absolute;
 right:10px;
 bottom:105px;
 z-index:10;
 display:flex;
 flex-direction:column;
 gap:10px;
}
.reelSide button{
 width:48px;
 height:48px;
 border-radius:50%;
 background:#0009;
 color:#fff;
 font-size:20px;
}
.reelInfo{
 position:absolute;
 left:13px;
 right:70px;
 bottom:18px;
 z-index:10;
 text-shadow:0 1px 5px #000;
}
.follow{
 background:var(--blue);
 color:#fff;
 padding:7px 12px;
 border-radius:7px;
}
.following{background:#555}

/* STORIES */
.storyRow{
 display:flex;
 gap:10px;
 overflow-x:auto;
}
.story{
 min-width:105px;
 height:155px;
 border-radius:12px;
 background:#555;
 color:#fff;
 display:flex;
 align-items:flex-end;
 justify-content:center;
 padding:10px;
 background-size:cover;
 background-position:center;
}

/* MODAL */
.modal{
 position:fixed;
 inset:0;
 z-index:100;
 background:#0008;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:15px;
}
.modalBox{
 width:min(650px,100%);
 max-height:90vh;
 overflow:auto;
 background:var(--card);
 color:var(--text);
 border-radius:15px;
 padding:18px;
}
.close{
 float:right;
 width:35px;
 height:35px;
 border-radius:50%;
 background:var(--bg);
 color:var(--text);
}

/* TOAST */
#toast{
 display:none;
 position:fixed;
 z-index:300;
 bottom:20px;
 left:50%;
 transform:translateX(-50%);
 background:#222;
 color:#fff;
 padding:11px 17px;
 border-radius:9px;
 max-width:90%;
 text-align:center;
}

/* COMMENT */
.comment{
 padding:10px;
 border-radius:10px;
 background:var(--bg);
 margin-bottom:8px;
}

/* PROFILE */
.profileHead{text-align:center}
.profilePhoto{
 width:110px;
 height:110px;
 border-radius:50%;
 object-fit:cover;
 border:4px solid var(--card);
 margin-top:-55px;
}

/* MOBILE */
@media(max-width:600px){
 .logo{font-size:19px}
 .topbar{padding:7px}
 .nav button{padding:12px 11px;font-size:13px}
 .cover{height:170px}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage">
 <div class="loginBox">

  <h1>FriendBook</h1>

  <input id="email" type="email" placeholder="Email">

  <input id="password" type="password" placeholder="Password">

  <button class="btn blue" onclick="login()">
   Login
  </button>

  <button class="btn green" onclick="signup()">
   Create New Account
  </button>

  <p id="loginMessage" class="muted"></p>

 </div>
</div>


<!-- APP -->
<div id="app">

<header class="topbar">

 <b class="logo">FriendBook</b>

 <input
  id="globalSearch"
  class="search"
  placeholder="Search FriendBook"
  onkeydown="if(event.key==='Enter')searchAll()">

 <button class="topButton" onclick="openCreate()">
  ＋
 </button>

 <button class="topButton" onclick="toggleDark()">
  🌙
 </button>

 <button class="topButton" onclick="logout()">
  ↪
 </button>

</header>


<nav class="nav">

 <button data-tab="home" onclick="tab('home')">🏠 Home</button>
 <button data-tab="reels" onclick="tab('reels')">🎬 Reels</button>
 <button data-tab="stories" onclick="tab('stories')">📖 Stories</button>
 <button data-tab="friends" onclick="tab('friends')">👥 Friends</button>
 <button data-tab="messages" onclick="tab('messages')">💬 Messenger</button>
 <button data-tab="notifications" onclick="tab('notifications')">🔔 Notifications</button>
 <button data-tab="groups" onclick="tab('groups')">👥 Groups</button>
 <button data-tab="pages" onclick="tab('pages')">📄 Pages</button>
 <button data-tab="market" onclick="tab('market')">🛒 Marketplace</button>
 <button data-tab="events" onclick="tab('events')">📅 Events</button>
 <button data-tab="profile" onclick="tab('profile')">👤 Profile</button>
 <button data-tab="creator" onclick="tab('creator')">💰 Creator</button>
 <button data-tab="settings" onclick="tab('settings')">⚙️ Settings</button>

</nav>


<main id="main"></main>

</div>


<!-- CREATE MODAL -->
<div id="createModal" class="modal hidden">

 <div class="modalBox">

  <button class="close" onclick="closeModal('createModal')">✕</button>

  <h2>Create</h2>

  <button class="btn blue" onclick="closeModal('createModal');tab('home')">
   📝 Post
  </button>

  <button class="btn blue" onclick="closeModal('createModal');tab('reels')">
   🎬 Reel
  </button>

  <button class="btn blue" onclick="closeModal('createModal');tab('stories')">
   📖 Story
  </button>

  <button class="btn blue" onclick="closeModal('createModal');tab('friends')">
   👥 Friend
  </button>

  <button class="btn blue" onclick="closeModal('createModal');tab('groups')">
   👥 Group
  </button>

  <button class="btn blue" onclick="closeModal('createModal');tab('pages')">
   📄 Page
  </button>

  <button class="btn blue" onclick="closeModal('createModal');tab('market')">
   🛒 Marketplace
  </button>

  <button class="btn blue" onclick="closeModal('createModal');tab('events')">
   📅 Event
  </button>

 </div>

</div>


<!-- COMMENT MODAL -->
<div id="commentModal" class="modal hidden">

 <div class="modalBox">

  <button class="close" onclick="closeModal('commentModal')">✕</button>

  <h2>💬 Comments</h2>

  <div id="commentList"></div>

  <input
   id="commentInput"
   style="width:100%"
   placeholder="Write a comment..."
   onkeydown="if(event.key==='Enter')sendComment()">

  <button class="btn blue" onclick="sendComment()">
   Comment
  </button>

 </div>

</div>


<div id="toast"></div>


<script>

/* =========================================================
 SUPABASE
========================================================= */

const SUPABASE_URL =
"https://skereuaizdczbvjplisi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_3R2otJA1zIlsMsTYxe1ocw_NAPY5O9x";

const db =
supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);


/* =========================================================
 GLOBAL
========================================================= */

let me=null;
let currentPost=null;
let currentReel=null;
let currentTab="home";


const $=id=>document.getElementById(id);


function esc(v){

 return String(v ?? "")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


function avatar(url,name){

 return url ||
 "https://ui-avatars.com/api/?name="+
 encodeURIComponent(name || "User")+
 "&background=1877f2&color=fff";

}


function toast(text){

 const x=$("toast");

 x.textContent=text;
 x.style.display="block";

 clearTimeout(window.toastTimer);

 window.toastTimer=setTimeout(()=>{
  x.style.display="none";
 },2500);

}


/* =========================================================
 AUTH
========================================================= */

async function login(){

 const email=$("email").value.trim();
 const password=$("password").value;

 if(!email || !password){

  $("loginMessage").textContent=
   "Email এবং Password দিন";

  return;
 }

 const {data,error}=
  await db.auth.signInWithPassword({
   email,
   password
  });

 if(error){

  $("loginMessage").textContent=
   error.message;

  return;
 }

 me=data.user;

 await updateOnline();

 startApp();

}


async function signup(){

 const email=$("email").value.trim();
 const password=$("password").value;

 if(!email || !password){

  $("loginMessage").textContent=
   "Email এবং Password দিন";

  return;
 }

 if(password.length<6){

  $("loginMessage").textContent=
   "Password কমপক্ষে ৬ অক্ষরের হতে হবে";

  return;
 }

 const {data,error}=
  await db.auth.signUp({
   email,
   password
  });

 if(error){

  $("loginMessage").textContent=
   error.message;

  return;
 }

 if(!data.user){

  $("loginMessage").textContent=
   "Email verification প্রয়োজন হতে পারে";

  return;
 }

 me=data.user;

 const name=
  email.split("@")[0];

 await db
  .from("fb_profiles")
  .upsert({
   id:me.id,
   name:name,
   username:name,
   bio:"",
   created_at:new Date().toISOString(),
   updated_at:new Date().toISOString(),
   online:true,
   last_seen:new Date().toISOString()
  });

 startApp();

}


async function logout(){

 if(me){

  await db
   .from("fb_profiles")
   .update({
    online:false,
    last_seen:new Date().toISOString()
   })
   .eq("id",me.id);

 }

 await db.auth.signOut();

 location.reload();

}


async function updateOnline(){

 if(!me)return;

 await db
  .from("fb_profiles")
  .update({
   online:true,
   last_seen:new Date().toISOString()
  })
  .eq("id",me.id);

}


function startApp(){

 $("loginPage").style.display="none";
 $("app").style.display="block";

 tab("home");

}


/* =========================================================
 TAB
========================================================= */

function tab(t){

 currentTab=t;

 document
  .querySelectorAll(".nav button")
  .forEach(b=>{
   b.classList.toggle(
    "active",
    b.dataset.tab===t
   );
  });

 if(t==="home")home();
 if(t==="reels")reelsPage();
 if(t==="stories")storiesPage();
 if(t==="friends")friendsPage();
 if(t==="messages")messagesPage();
 if(t==="notifications")notificationsPage();
 if(t==="groups")groupsPage();
 if(t==="pages")pagesPage();
 if(t==="market")marketPage();
 if(t==="events")eventsPage();
 if(t==="profile")profilePage(me.id);
 if(t==="creator")creatorPage();
 if(t==="settings")settingsPage();

}


/* =========================================================
 HOME
========================================================= */

function home(){

 $("main").innerHTML=`

 <div class="page">

  <div class="card composer">

   <div class="row">

    <img
     class="avatar"
     src="${avatar("",me.email)}">

    <b>What's on your mind?</b>

   </div>

   <textarea
    id="postText"
    rows="4"
    placeholder="আপনার মনের কথা লিখুন...">
   </textarea>

   <input
    id="postImage"
    style="width:100%;margin-top:7px"
    placeholder="Image URL (optional)">

   <select
    id="postPrivacy"
    style="width:100%;margin-top:7px">

    <option value="public">🌎 Public</option>
    <option value="friends">👥 Friends</option>
    <option value="only_me">🔒 Only me</option>

   </select>

   <input
    id="postFeeling"
    style="width:100%;margin-top:7px"
    placeholder="😊 Feeling / Activity">

   <input
    id="postLocation"
    style="width:100%;margin-top:7px"
    placeholder="📍 Location">

   <button
    class="btn blue"
    onclick="createPost()">
    Post
   </button>

  </div>


  <div class="card">

   <div class="row">

    <button class="btn blue"
     style="width:auto"
     onclick="loadPosts('recent')">
     Recent
    </button>

    <button class="btn gray"
     style="width:auto"
     onclick="loadPosts('latest')">
     Most Relevant
    </button>

   </div>

  </div>


  <div id="feed">
   Loading...
  </div>

 </div>
 `;

 loadPosts();

}


async function createPost(){

 const text=$("postText").value.trim();
 const image=$("postImage").value.trim();

 if(!text && !image){

  toast("Post content দিন");
  return;

 }

 const payload={
  user_id:me.id,
  text:text,
  image_url:image || null,
  privacy:$("postPrivacy").value,
  feeling:$("postFeeling").value,
  location:$("postLocation").value
 };

 const {error}=
  await db
   .from("fb_posts")
   .insert(payload);

 if(error){

  toast(
   "Post failed: "+error.message
  );

  console.error(error);

  return;
 }

 toast("✅ Post published");

 $("postText").value="";
 $("postImage").value="";
 $("postFeeling").value="";
 $("postLocation").value="";

 loadPosts();

}


async function loadPosts(){

 const {data,error}=
  await db
   .from("fb_posts")
   .select("*")
   .order("created_at",{
    ascending:false
   })
   .limit(50);

 if(error){

  $("feed").innerHTML=
   `<div class="card">
    ❌ ${esc(error.message)}
   </div>`;

  return;
 }

 renderPosts(data || []);

}


async function renderPosts(posts){

 const feed=$("feed");

 if(!posts.length){

  feed.innerHTML=
   `<div class="card">
    এখনো কোনো Post নেই।
   </div>`;

  return;
 }

 let html="";

 for(const p of posts){

  const {data:u}=
   await db
    .from("fb_profiles")
    .select("*")
    .eq("id",p.user_id)
    .maybeSingle();

  const name=u?.name || "User";

  html+=`

  <article class="card">

   <div class="row">

    <img
     class="avatar"
     src="${esc(
      avatar(u?.profile_photo,name)
     )}">

    <div>

     <b>${esc(name)}</b>

     <div class="small muted">
      ${esc(p.created_at || "")}
     </div>

    </div>

   </div>

   ${
    p.text
    ?
    `<p>${esc(p.text)}</p>`
    :
    ""
   }

   ${
    p.feeling
    ?
    `<span>😊 ${esc(p.feeling)}</span>`
    :
    ""
   }

   ${
    p.location
    ?
    `<span> 📍 ${esc(p.location)}</span>`
    :
    ""
   }

   ${
    p.image_url
    ?
    `<img
      class="postImage"
      src="${esc(p.image_url)}"
      onerror="this.style.display='none'">`
    :
    ""
   }

   <div class="actions">

    <button onclick="reactPost(${p.id},'like')">
     👍 Like
    </button>

    <button onclick="reactPost(${p.id},'love')">
     ❤️ Love
    </button>

    <button onclick="openPostComments(${p.id})">
     💬 Comment
    </button>

    <button onclick="shareContent('post',${p.id})">
     ↗ Share
    </button>

    <button onclick="savePost(${p.id})">
     🔖 Save
    </button>

   </div>

  </article>
  `;
 }

 feed.innerHTML=html;

}


/* =========================================================
 POST REACTION
========================================================= */

async function reactPost(id,reaction){

 const {data:old}=
  await db
   .from("fb_post_reactions")
   .select("id,reaction")
   .eq("post_id",id)
   .eq("user_id",me.id)
   .maybeSingle();

 let result;

 if(old){

  if(old.reaction===reaction){

   result=
    await db
     .from("fb_post_reactions")
     .delete()
     .eq("id",old.id);

  }else{

   result=
    await db
     .from("fb_post_reactions")
     .update({
      reaction:reaction
     })
     .eq("id",old.id);

  }

 }else{

  result=
   await db
    .from("fb_post_reactions")
    .insert({
     post_id:id,
     user_id:me.id,
     reaction:reaction
    });

 }

 if(result.error){

  toast(result.error.message);

  return;
 }

 toast(
  reaction==="love"
  ?"❤️ Love"
  :"👍 Like"
 );

}


/* =========================================================
 COMMENTS
========================================================= */

async function openPostComments(id){

 currentPost=id;
 currentReel=null;

 $("commentInput").value="";

 await loadPostComments();

 openModal("commentModal");

}


async function loadPostComments(){

 const {data,error}=
  await db
   .from("fb_comments")
   .select("*")
   .eq("post_id",currentPost)
   .order("created_at",{
    ascending:true
   });

 if(error){

  $("commentList").innerHTML=
   `<p>${esc(error.message)}</p>`;

  return;
 }

 if(!data?.length){

  $("commentList").innerHTML=
   `<p class="muted">
    এখনো কোনো comment নেই।
   </p>`;

  return;
 }

 $("commentList").innerHTML=
  data.map(c=>`

   <div class="comment">

    <b>
     ${c.user_id===me.id
      ?"You"
      :"User"}
    </b>

    <div>
     ${esc(c.text)}
    </div>

    <div class="small muted">
     👍 Like · Reply
    </div>

   </div>

  `).join("");

}


async function sendComment(){

 const text=
  $("commentInput").value.trim();

 if(!text)return;

 if(currentPost){

  const {error}=
   await db
    .from("fb_comments")
    .insert({
     post_id:currentPost,
     user_id:me.id,
     text:text,
     parent_id:null
    });

  if(error){

   toast(error.message);
   return;
  }

  $("commentInput").value="";

  await loadPostComments();

 }

 if(currentReel){

  const {error}=
   await db
    .from("fb_reel_comments")
    .insert({
     reel_id:currentReel,
     user_id:me.id,
     text:text,
     parent_id:null
    });

  if(error){

   toast(error.message);
   return;

function formatHashtags(text){

 return esc(text)
  .replace(
   /(#[\w\u0980-\u09FF]+)/g,
   '<span style="color:#60a5fa">$1</span>'
  );

}


function setupReelObserver(){

 const observer=
  new IntersectionObserver(
   entries=>{

    entries.forEach(entry=>{

     const reel=entry.target;

     const video=
      reel.querySelector("video");

     if(entry.isIntersecting){

      document
       .querySelectorAll(".reel video")
       .forEach(v=>{
        if(v!==video)
         v.pause();
       });

      video.muted=true;

      video.play()
       .catch(()=>{});

      countReelView(
       reel.dataset.id
      );

     }else{

      video.pause();

     }

    });

   },
   {
    threshold:.7
   }
  );

 document
  .querySelectorAll(".reel")
  .forEach(r=>observer.observe(r));

}


function toggleReelSound(id,button){

 const video=$("video-"+id);

 video.muted=!video.muted;

 button.textContent=
  video.muted
  ?"🔇"
  :"🔊";

 if(video.paused)
  video.play().catch(()=>{});

}


async function countReelView(id){

 const {data:old}=
  await db
   .from("fb_reel_views")
   .select("id")
   .eq("reel_id",Number(id))
   .eq("user_id",me.id)
   .maybeSingle();

 if(old)return;

 await db
  .from("fb_reel_views")
  .insert({
   reel_id:Number(id),
   user_id:me.id
  });

 const {data:r}=
  await db
   .from("fb_reels")
   .select("views")
   .eq("id",Number(id))
   .maybeSingle();

 if(r){

  await db
   .from("fb_reels")
   .update({
    views:Number(r.views||0)+1
   })
   .eq("id",Number(id));

 }

}


async function reactReel(id,reaction){

 const {data:old}=
  await db
   .from("fb_reel_reactions")
   .select("id,reaction")
   .eq("reel_id",id)
   .eq("user_id",me.id)
   .maybeSingle();

 let result;

 if(old){

  if(old.reaction===reaction){

   result=
    await db
     .from("fb_reel_reactions")
     .delete()
     .eq("id",old.id);

  }else{

   result=
    await db
     .from("fb_reel_reactions")
     .update({
      reaction:reaction
     })
     .eq("id",old.id);

  }

 }else{

  result=
   await db
    .from("fb_reel_reactions")
    .insert({
     reel_id:id,
     user_id:me.id,
     reaction:reaction
    });

 }

 if(result.error)
  toast(result.error.message);
 else
  toast("Reaction saved");

}

async function loadProfileStats(uid){

 const {count:followers}=
  await db
   .from("fb_follows")
   .select("*",{count:"exact",head:true})
   .eq("following_id",uid);

 const {count:following}=
  await db
   .from("fb_follows")
   .select("*",{count:"exact",head:true})
   .eq("follower_id",uid);

 const {count:posts}=
  await db
   .from("fb_posts")
   .select("*",{count:"exact",head:true})
   .eq("user_id",uid);

 if($("followersCount"))
  $("followersCount").textContent=
   followers||0;

 if($("followingCount"))
  $("followingCount").textContent=
   following||0;

 if($("postCount"))
  $("postCount").textContent=
   posts||0;

}


async function loadProfilePosts(uid){

 const {data,error}=
  await db
   .from("fb_posts")
   .select("*")
   .eq("user_id",uid)
   .order("created_at",{
    ascending:false
   });

 if(error){

  $("profilePosts").innerHTML=
   `<div class="card">
    ${esc(error.message)}
   </div>`;

  return;
 }

 let oldFeed=$("feed");

 if(!oldFeed){

  $("profilePosts").innerHTML=
   `<div id="profileFeed"></div>`;

 }

 const target=
  $("profileFeed") ||
  $("profilePosts");

 let html="";

 for(const p of data||[]){

  html+=`

  <div class="card">

   <p>
    ${esc(p.text||"")}
   </p>

   ${
    p.image_url
    ?
    `<img
     class="postImage"
     src="${esc(p.image_url)}">`
    :
    ""
   }

   <div class="actions">

    <button onclick="reactPost(${p.id},'like')">
     👍 Like
    </button>

    <button onclick="openPostComments(${p.id})">
     💬 Comment
    </button>

    <button onclick="shareContent('post',${p.id})">
     ↗ Share
    </button>

   </div>

  </div>

  `;

 }

 target.innerHTML=
  html ||
  `<div class="card">
   No posts.
  </div>`;

}

async function saveProfile(){

 const {error}=
  await db
   .from("fb_profiles")
   .update({
    name:$("editName").value,
    username:$("editUsername").value,
    bio:$("editBio").value,
    profile_photo:$("editPhoto").value,
    cover_photo:$("editCover").value,
    updated_at:new Date().toISOString()
   })
   .eq("id",me.id);

 if(error){

  toast(error.message);
  return;

 }

 toast("Profile updated");

 closeModal("profileEditModal");

 profilePage(me.id);

}

async function enableCreator(){

 const {data}=await db
  .from("fb_creator_settings")
  .select("user_id")
  .eq("user_id",me.id)
  .maybeSingle();

 let result;

   await db
    .from("fb_creator_settings")
    .update({

 );

function downloadMyData(){

 const data={
  id:me.id,
  email:me.email,
  downloaded_at:new Date().toISOString()
 };

 const blob=
  new Blob(
   [JSON.stringify(data,null,2)],
   {type:"application/json"}
  );

 const url=
  URL.createObjectURL(blob);

 const a=
  document.createElement("a");

 a.href=url;
 a.download="friendbook-data.json";

 a.click();

 URL.revokeObjectURL(url);

}

/* =========================================================
 SHARE
========================================================= */

async function shareContent(type,id){

 const url=
  location.href.split("#")[0]+
  "#"+type+"-"+id;

 if(navigator.share){

  try{

   await navigator.share({
    title:"FriendBook",
    text:"FriendBook content",
    url:url
   });

  }catch(e){}

 }else{

  try{

   await navigator.clipboard.writeText(url);

   toast("🔗 Link copied");

  }catch(e){

   toast(url);

  }

 }

}
