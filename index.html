<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://skereuaizdczbvjplisi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_3R2otJA1zIlsMsTYxe1ocw_NAPY5O9x";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================
   GLOBAL
========================= */

let me = null;
let profile = null;
let posts = [];

/* =========================
   HELPERS
========================= */

function escapeHTML(text){

return String(text ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function showToast(message){

const box =
document.getElementById("toast");

box.textContent = message;

box.style.display = "block";

setTimeout(()=>{
box.style.display="none";
},2500);

}


function formatDate(date){

return new Date(date)
.toLocaleString("bn-BD",{
dateStyle:"medium",
timeStyle:"short"
});

}


function getAvatar(user){

if(user && user.profile_photo){

return user.profile_photo;

}

const name =
user?.name || "User";

return "https://ui-avatars.com/api/?name="
+encodeURIComponent(name)
+"&background=1877f2&color=fff";

}


/* =========================
   AUTH SCREEN
========================= */

function showLogin(){

document.getElementById("app").innerHTML = `

<div class="auth">

My Social App
</div>

id="loginTab"

id="registerTab"
onclick="showRegisterForm()">

</button>

</div>

`;

/* =========================
   LOGIN FORM
========================= */

function showLoginForm(){

document.getElementById("loginTab")
.classList.add("active");

document.getElementById("registerTab")
.classList.remove("active");

document.getElementById("authForm").innerHTML = `

<input
id="loginEmail"
class="input"
type="email"
placeholder="Email">

<input
id="loginPassword"
class="input"
type="password"
placeholder="Password">

<button
class="primary"
style="width:100%;margin-top:10px"
onclick="login()">

Login

`;

}


/* =========================
   REGISTER FORM
========================= */

function showRegisterForm(){

document.getElementById("loginTab")
.classList.remove("active");

document.getElementById("registerTab")
.classList.add("active");

document.getElementById("authForm").innerHTML = `

<input
id="registerName"
class="input"
placeholder="Your name">

<input
id="registerEmail"
class="input"
type="email"
placeholder="Email">

<input
id="registerPassword"
class="input"
type="password"
placeholder="Password">

<button
class="primary"
style="width:100%;margin-top:10px"
onclick="register()">

Create Account

</button>

`;

}


/* =========================
   LOGIN
========================= */

async function login(){

const email =
document.getElementById("loginEmail")
.value.trim();

const password =
document.getElementById("loginPassword")
.value;

if(!email || !password){

showToast("Email এবং Password দিন");

return;

}

const {data,error} =
await supabaseClient.auth
.signInWithPassword({
email,
password
});

if(error){

showToast(error.message);

return;

}

await startApp();

}


/* =========================
   REGISTER
========================= */

async function register(){

const name =
document.getElementById("registerName")
.value.trim();

const email =
document.getElementById("registerEmail")
.value.trim();

const password =
document.getElementById("registerPassword")
.value;

if(!name){

showToast("নাম দিন");

return;

}

if(password.length < 6){

showToast("Password কমপক্ষে ৬ অক্ষর দিন");

return;

}

const {data,error} =
await supabaseClient.auth.signUp({

email,
password,

options:{
data:{
name:name
}
}

});

if(error){

showToast(error.message);

return;

}

if(data.user){

await supabaseClient
.from("profiles")
.upsert({

id:data.user.id,
name:name

});

}

if(data.session){

await startApp();

}else{

showToast(
"Account তৈরি হয়েছে। Email confirmation চাইলে email confirm করে Login করুন।"
);

}

}


/* =========================
   START APP
========================= */

async function startApp(){

const {data:{user}} =
await supabaseClient.auth.getUser();

if(!user){

showLogin();

return;

}

me = user;


/* PROFILE */

let {data:p} =
await supabaseClient
.from("profiles")
.select("*")
.eq("id",user.id)
.maybeSingle();


if(!p){

const {data:newProfile} =
await supabaseClient
.from("profiles")
.insert({

id:user.id,

name:
user.user_metadata?.name ||
user.email?.split("@")[0] ||
"User"

})
.select()
.single();

p = newProfile;

}

profile = p;


/* LAST SEEN */

await supabaseClient
.from("profiles")
.update({
last_seen:new Date().toISOString()
})
.eq("id",me.id)
.catch(()=>{});


renderLayout();

goHome();

}

   HOME
========================= */

page.innerHTML = `

class="avatar"

/* =========================
   SELECTED FILES
========================= */

function showSelectedFiles(input){

const files =
Array.from(input.files);

document.getElementById(
"selectedFiles"
).textContent =
files.map(f=>f.name).join(", ");

}


/* =========================
   UPLOAD FILE
========================= */

async function uploadFile(file){

const extension =
file.name.split(".").pop();

const path =
"posts/"
+me.id+"/"
+Date.now()
+"_"
+Math.random()
.toString(36)
.substring(2)
+"."+extension;


const {error} =
await supabaseClient
.storage
.from("media")
.upload(
path,
file,
{
upsert:false,
contentType:file.type
}
);


if(error){

throw error;

}


const {data} =
supabaseClient
.storage
.from("media")
.getPublicUrl(path);


return data.publicUrl;

}


/* =========================
   CREATE POST
========================= */

async function createPost(){

const text =
document.getElementById("postText")
.value.trim();

const files =
Array.from(
document.getElementById("postFiles")
.files
);


if(!text && files.length===0){

showToast(
"কিছু লিখুন অথবা ছবি/ভিডিও দিন"
);

return;

}


try{

showToast("Post হচ্ছে...");


const {data:post,error} =
await supabaseClient
.from("posts")
.insert({

user_id:me.id,

text:text,

image_url:""

})
.select()
.single();


if(error){

throw error;

}


/* FILE UPLOAD */

let firstURL="";


for(let i=0;i<files.length;i++){

const file=files[i];

const url =
await uploadFile(file);

if(i===0){

firstURL=url;

}


/* MULTIPLE MEDIA */

await supabaseClient
.from("post_media")
.insert({

post_id:post.id,

media_url:url,

media_type:
file.type.startsWith("video")
?"video"
:"image",

sort_order:i

});

}


/* OLD IMAGE_URL SUPPORT */

if(firstURL){

await supabaseClient
.from("posts")
.update({
image_url:firstURL
})
.eq("id",post.id);

}


showToast("Post হয়েছে");

goHome();


}catch(error){

console.error(error);

showToast(
error.message ||
"Post failed"
);

}

}


/* =========================
   LOAD FEED
========================= */

async function loadFeed(){

const feed =
document.getElementById("feed");

const {data,error} =
await supabaseClient
.from("posts")
.select("*")
.order(
"created_at",
{
ascending:false
}
)
.limit(50);


if(error){

feed.innerHTML = `

<div class="card empty">

${escapeHTML(error.message)}

</div>

`;

return;

}


posts=data || [];


if(posts.length===0){

feed.innerHTML = `

<div class="card empty">

এখনও কোনো পোস্ট নেই।<br>

প্রথম পোস্টটি আপনি দিন।

</div>

`;

return;

}


/* GET USERS */

const ids =
[
...new Set(
posts.map(p=>p.user_id)
)
];


const {data:profiles} =
await supabaseClient
.from("profiles")
.select("*")
.in("id",ids);


const profileMap =
Object.fromEntries(
(profiles || [])
.map(p=>[p.id,p])
);


feed.innerHTML =
posts
.map(post=>
createPostHTML(
post,
profileMap[post.user_id]
)
)
.join("");


/* MEDIA */

for(const post of posts){

await loadPostMedia(post.id);

}

}

)}

</b>

${user?.verified
?" ✓"
:""}

<div class="muted">

${formatDate(
post.created_at

</div>

</div>

</div>


${
post.user_id===me.id

`<button
class="light"
onclick="deleteMyPost(${post.id})">

🗑

/* =========================
   LOAD MULTIPLE MEDIA
========================= */

async function loadPostMedia(postId){

const box =
document.getElementById(
"media-"+postId
);

if(!box)return;


const {data,error} =
await supabaseClient
.from("post_media")
.select("*")
.eq("post_id",postId)
.order("sort_order");


if(error || !data || !data.length){

return;

}


box.innerHTML =
data
.map(media=>{

if(media.media_type==="video"){

return `

<video
class="post-video"
controls
playsinline
src="${media.media_url}">
</video>

`;

}

return `

<img
class="post-image"
src="${media.media_url}">

`;

})
.join("");

}


/* =========================
   LIKE
========================= */

async function likePost(postId){

const {data} =
await supabaseClient
.from("post_likes")
.select("*")
.eq("post_id",postId)
.eq("user_id",me.id)
.maybeSingle();


if(data){

await supabaseClient
.from("post_likes")
.delete()
.eq("post_id",postId)
.eq("user_id",me.id);

showToast("Like removed");

}else{

await supabaseClient
.from("post_likes")
.insert({

post_id:postId,

user_id:me.id

});

showToast("Liked ❤️");

}

}


/* =========================
   SHARE
========================= */

async function sharePost(id){

const url =
location.href
.split("#")[0]
+"#post-"+id;


if(navigator.share){

await navigator.share({

title:"My Social App",

text:"Check this post",

url:url

});

}else{

try{

await navigator.clipboard
.writeText(url);

showToast("Post link copied");

}catch{

showToast(url);

}

}

}


/* =========================
   DELETE
========================= */

async function deleteMyPost(id){

if(!confirm(
"এই পোস্টটি Delete করবেন?"
))return;


const {error} =
await supabaseClient
.from("posts")
.delete()
.eq("id",id)
.eq("user_id",me.id);


if(error){

showToast(error.message);

return;

}


showToast("Post deleted");

goHome();

}

}
)
.limit(50);


const box =
document.getElementById(
"profilePosts"
);


if(!userPosts?.length){

box.innerHTML = `

<div class="card empty">

No posts yet.

</div>

`;

return;

}


box.innerHTML =
userPosts
.map(post=>
createPostHTML(
post,
user
)
)
.join("");


for(const post of userPosts){

await loadPostMedia(post.id);

}

}


/* =========================
   EDIT PROFILE
========================= */

async function editMyProfile(){

const name =
prompt(
"আপনার নাম:",
profile.name
);

if(name===null)return;


const bio =
prompt(
"Bio:",
profile.bio || ""
);

if(bio===null)return;


const {error} =
await supabaseClient
.from("profiles")
.update({

name:name,

bio:bio

})
.eq("id",me.id);


if(error){

showToast(error.message);

return;

}


profile =
await getMyProfile();


showToast(
"Profile updated"
);

showMyProfile();

}


/* =========================
   GET PROFILE
========================= */

async function getMyProfile(){

const {data} =
await supabaseClient
.from("profiles")
.select("*")
.eq("id",me.id)
.single();

return data;

}


/* =========================
   SEARCH
========================= */

let searchTimer;


function searchPeople(text){

clearTimeout(searchTimer);


if(!text.trim()){

return;

}


searchTimer =
setTimeout(
async()=>{

const {data} =
await supabaseClient
.from("profiles")
.select("*")
.ilike(
"name",
"%"+text.trim()+"%"
)
.limit(20);


const page =
document.getElementById("page");


page.innerHTML = `

<div class="card">

<b>
Search Results
</b>

</div>

${
(data || [])
.map(user=>`

<div
class="card row"
onclick="showProfile('${user.id}')">

<img
class="avatar"
src="${getAvatar(user)}">

<div>

<b>
${escapeHTML(user.name)}
</b>

<div class="muted">
${escapeHTML(user.bio || "")}
</div>

</div>

</div>

`)
.join("")

||

`<div class="card empty">

কোনো User পাওয়া যায়নি।

</div>`

`;

},
300
);

}
