<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1877f2">
<title>FriendBook</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,Helvetica,sans-serif;
 background:#f0f2f5;
 color:#111;
}

button,input,textarea,select{
 font:inherit;
}

button{
 cursor:pointer;
}

.authPage{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
}

.authBox{
 width:100%;
 max-width:400px;
 background:white;
 border-radius:14px;
 padding:28px 22px;
 box-shadow:0 5px 25px rgba(0,0,0,.12);
}

.logo{
 text-align:center;
 font-size:34px;
 font-weight:800;
 color:#1877f2;
 margin-bottom:6px;
}

.subtitle{
 text-align:center;
 color:#65676b;
 margin-bottom:25px;
}

.input{
 width:100%;
 padding:14px;
 border:1px solid #ccd0d5;
 border-radius:8px;
 margin-bottom:12px;
 outline:none;
}

.input:focus{
 border-color:#1877f2;
 box-shadow:0 0 0 2px rgba(24,119,242,.15);
}

.mainBtn{
 width:100%;
 padding:13px;
 border:0;
 border-radius:8px;
 background:#1877f2;
 color:white;
 font-weight:bold;
 font-size:17px;
 margin-bottom:10px;
}

.mainBtn:disabled{
 opacity:.6;
}

.greenBtn{
 background:#42b72a;
}

.authMsg{
 min-height:24px;
 text-align:center;
 margin:10px 0;
 font-size:14px;
 color:#e41e3f;
}

.authMsg.success{
 color:#188038;
}

.divider{
 display:flex;
 align-items:center;
 gap:10px;
 margin:15px 0;
 color:#777;
}

.divider:before,
.divider:after{
 content:"";
 height:1px;
 background:#ddd;
 flex:1;
}

.linkBtn{
 border:0;
 background:none;
 color:#1877f2;
 font-weight:bold;
 display:block;
 margin:auto;
}

#app{
 display:none;
}

.topbar{
 position:sticky;
 top:0;
 z-index:100;
 height:58px;
 background:white;
 border-bottom:1px solid #ddd;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 12px;
}

.brand{
 color:#1877f2;
 font-size:25px;
 font-weight:800;
}

.topActions{
 display:flex;
 gap:7px;
}

.iconBtn{
 width:40px;
 height:40px;
 border:0;
 border-radius:50%;
 background:#f0f2f5;
 font-size:18px;
}

.container{
 max-width:650px;
 margin:auto;
 padding:12px;
}

.card{
 background:white;
 border-radius:10px;
 margin-bottom:12px;
 padding:12px;
 box-shadow:0 1px 2px rgba(0,0,0,.1);
}

.composer textarea{
 width:100%;
 min-height:80px;
 resize:none;
 border:0;
 background:#f0f2f5;
 border-radius:10px;
 padding:12px;
 outline:none;
}

.row{
 display:flex;
 gap:8px;
 align-items:center;
}

.avatar{
 width:42px;
 height:42px;
 border-radius:50%;
 object-fit:cover;
 background:#ddd;
}

.name{
 font-weight:bold;
}

.muted{
 color:#65676b;
 font-size:13px;
}

.postImg{
 width:100%;
 max-height:600px;
 object-fit:cover;
 border-radius:8px;
 margin-top:10px;
}

.actions{
 display:flex;
 border-top:1px solid #eee;
 margin-top:10px;
 padding-top:7px;
 gap:5px;
}

.actionBtn{
 flex:1;
 border:0;
 background:white;
 padding:9px 4px;
 border-radius:7px;
}

.actionBtn:hover{
 background:#f0f2f5;
}

.commentBox{
 display:flex;
 gap:6px;
 margin-top:10px;
}

.commentBox input{
 flex:1;
 padding:10px;
 border:1px solid #ddd;
 border-radius:20px;
 outline:none;
}

.commentBox button{
 border:0;
 background:#1877f2;
 color:#fff;
 border-radius:20px;
 padding:0 15px;
}

.nav{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 background:white;
 border-top:1px solid #ddd;
 display:flex;
 justify-content:center;
 z-index:100;
}

.nav button{
 flex:1;
 max-width:150px;
 border:0;
 background:white;
 padding:10px 5px;
 font-size:13px;
}

.sectionTitle{
 font-size:22px;
 font-weight:bold;
 margin:8px 0 15px;
}

.profileCover{
 height:180px;
 background:#1877f2;
 border-radius:10px 10px 0 0;
 overflow:hidden;
}

.profileCover img{
 width:100%;
 height:100%;
 object-fit:cover;
}

.profileInfo{
 text-align:center;
 margin-top:-45px;
}

.profileAvatar{
 width:100px;
 height:100px;
 border-radius:50%;
 border:4px solid white;
 object-fit:cover;
 background:#ddd;
}

.modal{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.55);
 display:none;
 align-items:center;
 justify-content:center;
 z-index:999;
 padding:15px;
}

.modalBox{
 background:white;
 width:100%;
 max-width:430px;
 border-radius:12px;
 padding:20px;
 max-height:90vh;
 overflow:auto;
}

.closeBtn{
 float:right;
 border:0;
 background:#f0f2f5;
 border-radius:50%;
 width:35px;
 height:35px;
}

.reel{
 position:relative;
 height:calc(100vh - 120px);
 background:#000;
 border-radius:10px;
 overflow:hidden;
 margin-bottom:12px;
}

.reel video{
 width:100%;
 height:100%;
 object-fit:cover;
}

.reelInfo{
 position:absolute;
 bottom:10px;
 left:10px;
 right:10px;
 color:white;
 text-shadow:0 1px 3px #000;
}

.reelActions{
 position:absolute;
 right:10px;
 bottom:70px;
 display:flex;
 flex-direction:column;
 gap:10px;
}

.reelActions button{
 width:48px;
 height:48px;
 border:0;
 border-radius:50%;
 background:rgba(0,0,0,.55);
 color:white;
}

.empty{
 text-align:center;
 padding:30px;
 color:#777;
}

body.dark{
 background:#18191a;
 color:#eee;
}

body.dark .card,
body.dark .topbar,
body.dark .nav,
body.dark .nav button,
body.dark .actionBtn,
body.dark .modalBox,
body.dark .authBox{
 background:#242526;
 color:#eee;
}

body.dark .muted{
 color:#b0b3b8;
}

body.dark .input,
body.dark .composer textarea{
 background:#3a3b3c;
 color:white;
 border-color:#555;
}

body.dark .actions{
 border-color:#444;
}

body.dark .actionBtn:hover{
 background:#3a3b3c;
}

body.dark .iconBtn{
 background:#3a3b3c;
 color:white;
}

@media(max-width:600px){
 .container{
  padding-bottom:70px;
 }
}
</style>
</head>

<body>

<!-- ================= AUTH ================= -->

<div id="authPage" class="authPage">

 <div class="authBox">

  <div class="logo">FriendBook</div>

  <div id="authSubtitle" class="subtitle">
   Connect with friends
  </div>

  <!-- LOGIN -->

  <div id="loginBox">

   <input
    id="loginEmail"
    class="input"
    type="email"
    placeholder="Email"
    autocomplete="email"
   >

   <input
    id="loginPassword"
    class="input"
    type="password"
    placeholder="Password"
    autocomplete="current-password"
   >

   <button id="loginBtn" class="mainBtn" onclick="login()">
    Log In
   </button>

   <div id="loginMsg" class="authMsg"></div>

   <div class="divider">or</div>

   <button class="mainBtn greenBtn" onclick="showSignup()">
    Create new account
   </button>

  </div>

  <!-- SIGNUP -->

  <div id="signupBox" style="display:none">

   <input
    id="signupName"
    class="input"
    type="text"
    placeholder="Your name"
   >

   <input
    id="signupEmail"
    class="input"
    type="email"
    placeholder="Email"
    autocomplete="email"
   >

   <input
    id="signupPassword"
    class="input"
    type="password"
    placeholder="Password"
    autocomplete="new-password"
   >

   <input
    id="signupPassword2"
    class="input"
    type="password"
    placeholder="Confirm password"
    autocomplete="new-password"
   >

   <button id="signupBtn" class="mainBtn greenBtn" onclick="signup()">
    Create Account
   </button>

   <div id="signupMsg" class="authMsg"></div>

   <button class="linkBtn" onclick="showLogin()">
    Already have an account? Log In
   </button>

  </div>

 </div>
</div>


<!-- ================= APP ================= -->

<div id="app">

 <div class="topbar">

  <div class="brand">FriendBook</div>

  <div class="topActions">

   <button class="iconBtn" onclick="showHome()">🏠</button>

   <button class="iconBtn" onclick="showSearch()">🔎</button>

   <button class="iconBtn" onclick="showProfile()">👤</button>

   <button class="iconBtn" onclick="showSettings()">⚙️</button>

  </div>

 </div>


 <main class="container">

  <!-- HOME -->

  <section id="homeSection">

   <div class="card composer">

    <div class="row" style="margin-bottom:10px">

     <img id="composerAvatar" class="avatar">

     <div>
      <div id="composerName" class="name">
       You
      </div>
      <div class="muted">
       What's on your mind?
      </div>
     </div>

    </div>

    <textarea
     id="postText"
     placeholder="What's on your mind?"
    ></textarea>

    <div style="margin-top:8px">

     <input
      id="postImage"
      type="file"
      accept="image/*"
     >

    </div>

    <button
     id="postBtn"
     class="mainBtn"
     style="margin-top:10px"
     onclick="submitPost()"
    >
     Post
    </button>

    <div id="postMsg" class="authMsg"></div>

   </div>

   <div class="sectionTitle">
    Home Feed
   </div>

   <div id="feed">
    <div class="empty">
     Loading posts...
    </div>
   </div>

  </section>


  <!-- SEARCH -->

  <section id="searchSection" style="display:none">

   <div class="sectionTitle">
    Search People
   </div>

   <div class="card">

    <input
     id="searchInput"
     class="input"
     placeholder="Search name..."
     oninput="searchPeople()"
    >

   </div>

   <div id="searchResults"></div>

  </section>


  <!-- REELS -->

  <section id="reelsSection" style="display:none">

   <div class="sectionTitle">
    Reels
   </div>

   <div id="reels">
    <div class="empty">
     Loading reels...
    </div>
   </div>

  </section>


  <!-- PROFILE -->

  <section id="profileSection" style="display:none">

   <div class="card">

    <div class="profileCover">

     <img
      id="profileCover"
      src=""
      onerror="this.style.display='none'"
     >

    </div>

    <div class="profileInfo">

     <img
      id="profileAvatar"
      class="profileAvatar"
      src=""
     >

     <h2 id="profileName">
      Profile
     </h2>

     <div id="profileEmail" class="muted"></div>

     <p id="profileBio"></p>

     <button
      class="mainBtn"
      onclick="openEditProfile()"
     >
      Edit Profile
     </button>

    </div>

   </div>

  </section>


  <!-- SETTINGS -->

  <section id="settingsSection" style="display:none">

   <div class="sectionTitle">
    Settings
   </div>

   <div class="card">

    <h3>Appearance</h3>

    <button
     class="mainBtn"
     onclick="toggleDark()"
    >
     🌙 Dark / Light Mode
    </button>

   </div>

   <div class="card">

    <h3>Account</h3>

    <button
     class="mainBtn"
     onclick="logout()"
    >
     Logout
    </button>

   </div>

  </section>

 </main>


 <!-- NAV -->

 <div class="nav">

  <button onclick="showHome()">
   🏠<br>Home
  </button>

  <button onclick="showReels()">
   🎬<br>Reels
  </button>

  <button onclick="showSearch()">
   🔎<br>Search
  </button>

  <button onclick="showProfile()">
   👤<br>Profile
  </button>

  <button onclick="showSettings()">
   ⚙️<br>Settings
  </button>

 </div>

</div>


<!-- ================= EDIT PROFILE MODAL ================= -->

<div id="editModal" class="modal">

 <div class="modalBox">

  <button class="closeBtn" onclick="closeEditProfile()">
   ✕
  </button>

  <h2>Edit Profile</h2>

  <input
   id="editName"
   class="input"
   placeholder="Name"
  >

  <textarea
   id="editBio"
   class="input"
   placeholder="Bio"
   style="min-height:100px"
  ></textarea>

  <input
   id="editPhoto"
   class="input"
   type="url"
   placeholder="Profile photo URL"
  >

  <input
   id="editCover"
   class="input"
   type="url"
   placeholder="Cover photo URL"
  >

  <button
   class="mainBtn"
   onclick="saveProfile()"
  >
   Save
  </button>

  <div id="profileMsg" class="authMsg"></div>

 </div>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://skereuaizdczbvjplisi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_3R2otJA1zIlsMsTYxe1ocw_NAPY5O9x";


let sb;

try{

 if(!window.supabase){
  throw new Error("Supabase library load হয়নি।");
 }

 sb = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
 );

}catch(e){

 console.error(e);

}


/* =========================================================
   GLOBAL
========================================================= */

let currentUser=null;
let currentProfile=null;


/* =========================================================
   HELPER
========================================================= */

function $(id){
 return document.getElementById(id);
}


function show(el){
 el.style.display="";
}


function hide(el){
 el.style.display="none";
}


/* =========================================================
   AUTH MESSAGE
========================================================= */

function authMessage(text,type=""){
 const loginMsg=$("loginMsg");
 const signupMsg=$("signupMsg");

 if($("loginBox").style.display!=="none"){
  loginMsg.textContent=text;
  loginMsg.className="authMsg "+type;
 }else{
  signupMsg.textContent=text;
  signupMsg.className="authMsg "+type;
 }
}


function clearAuthMsg(){

 $("loginMsg").textContent="";
 $("signupMsg").textContent="";

}


/* =========================================================
   SHOW LOGIN
========================================================= */

function showLogin(){

 $("loginBox").style.display="block";
 $("signupBox").style.display="none";

 $("authSubtitle").textContent=
 "Connect with friends";

 clearAuthMsg();

}


/* =========================================================
   SHOW SIGNUP
========================================================= */

function showSignup(){

 $("loginBox").style.display="none";
 $("signupBox").style.display="block";

 $("authSubtitle").textContent=
 "Create your FriendBook account";

 clearAuthMsg();

}


/* =========================================================
   LOGIN
========================================================= */

async function login(){

 clearAuthMsg();

 const email=$("loginEmail").value.trim();

 const password=$("loginPassword").value;

 if(!email || !password){

  $("loginMsg").textContent=
  "Email এবং Password দিন।";

  return;
 }

 if(!sb){

  $("loginMsg").textContent=
  "Supabase connection পাওয়া যাচ্ছে না।";

  return;
 }

 const btn=$("loginBtn");

 btn.disabled=true;
 btn.textContent="Logging in...";

 try{

  const {data,error}=await sb.auth.signInWithPassword({

   email:email,
   password:password

  });

  if(error){
   throw error;
  }

  if(!data || !data.user){

   throw new Error(
    "Login session তৈরি হয়নি।"
   );

  }

  currentUser=data.user;

  await loadApp();

 }catch(error){

  console.error("LOGIN ERROR:",error);

  let msg=error.message || "Login failed";

  const low=msg.toLowerCase();

  if(low.includes("invalid login credentials")){

   msg=
   "Email অথবা Password ভুল।";

  }else if(
   low.includes("email not confirmed")
  ){

   msg=
   "Email এখনো confirm করা হয়নি।";

  }else if(
   low.includes("failed to fetch")
  ){

   msg=
   "Internet অথবা Supabase connection সমস্যা।";

  }

  $("loginMsg").textContent=msg;

 }finally{

  btn.disabled=false;
  btn.textContent="Log In";

 }

}


/* =========================================================
   SIGNUP
========================================================= */

async function signup(){

 $("signupMsg").textContent="";

 const name=
 $("signupName").value.trim();

 const email=
 $("signupEmail").value.trim();

 const password=
 $("signupPassword").value;

 const password2=
 $("signupPassword2").value;

 if(!name || !email || !password){

  $("signupMsg").textContent=
  "সব তথ্য পূরণ করুন।";

  return;
 }

 if(password.length<6){

  $("signupMsg").textContent=
  "Password কমপক্ষে 6 অক্ষরের হতে হবে।";

  return;
 }

 if(password!==password2){

  $("signupMsg").textContent=
  "দুইটি Password মিলছে না।";

  return;
 }

 if(!sb){

  $("signupMsg").textContent=
  "Supabase connection পাওয়া যাচ্ছে না।";

  return;
 }

 const btn=$("signupBtn");

 btn.disabled=true;
 btn.textContent="Creating...";

 try{

  const {data,error}=await sb.auth.signUp({

   email:email,

   password:password,

   options:{
    data:{
     name:name
    }
   }

  });

  if(error){
   throw error;
  }

  if(data.session){

   currentUser=data.user;

   await loadApp();

  }else{

   $("signupMsg").className=
   "authMsg success";

   $("signupMsg").textContent=
   "Account তৈরি হয়েছে। Email confirm করে Login করুন।";

  }

 }catch(error){

  console.error("SIGNUP ERROR:",error);

  $("signupMsg").textContent=
  error.message || "Signup failed";

 }finally{

  btn.disabled=false;
  btn.textContent="Create Account";

 }

}


/* =========================================================
   LOGOUT
========================================================= */

async function logout(){

 if(sb){
  await sb.auth.signOut();
 }

 currentUser=null;
 currentProfile=null;

 $("app").style.display="none";
 $("authPage").style.display="flex";

 showLogin();

}


/* =========================================================
   LOAD APP
========================================================= */

async function loadApp(){

 $("authPage").style.display="none";
 $("app").style.display="block";

 await ensureProfile();

 await loadCurrentProfile();

 showHome();

}


/* =========================================================
   PROFILE
========================================================= */

async function ensureProfile(){

 if(!currentUser) return;

 try{

  const {data,error}=await sb
   .from("my social app")
   .select("*")
   .eq("id",currentUser.id)
   .maybeSingle();

  if(error){
   console.error("PROFILE SELECT:",error);
   return;
  }

  if(!data){

   const name=
   currentUser.user_metadata?.name ||
   currentUser.email?.split("@")[0] ||
   "FriendBook User";

   const {error:insertError}=
   await sb
   .from("my social app")
   .insert({

    id:currentUser.id,
    name:name,
    profile_photo:"",
    cover_photo:""

   });

   if(insertError){
    console.error(
     "PROFILE INSERT:",
     insertError
    );
   }

  }

 }catch(e){

  console.error(e);

 }

}


async function loadCurrentProfile(){

 if(!currentUser) return;

 try{

  const {data,error}=await sb
   .from("my social app")
   .select("*")
   .eq("id",currentUser.id)
   .maybeSingle();

  if(error){

   console.error(error);

   currentProfile={
    id:currentUser.id,
    name:
     currentUser.user_metadata?.name ||
     currentUser.email?.split("@")[0] ||
     "User"
   };

  }else{

   currentProfile=data;

  }

 }catch(e){

  console.error(e);

 }

 updateProfileUI();

}


function updateProfileUI(){

 if(!currentUser) return;

 const name=
 currentProfile?.name ||
 currentUser.user_metadata?.name ||
 currentUser.email?.split("@")[0] ||
 "User";

 const photo=
 currentProfile?.profile_photo || "";

 const cover=
 currentProfile?.cover_photo || "";

 $("composerName").textContent=name;

 $("composerAvatar").src=
 photo ||
 "https://ui-avatars.com/api/?name="+
 encodeURIComponent(name);

 $("profileName").textContent=name;

 $("profileEmail").textContent=
 currentUser.email || "";

 $("profileAvatar").src=
 photo ||
 "https://ui-avatars.com/api/?name="+
 encodeURIComponent(name);

 $("profileCover").src=cover;

 if(currentProfile?.bio){
  $("profileBio").textContent=
  currentProfile.bio;
 }else{
  $("profileBio").textContent="";
 }

}


/* =========================================================
   PROFILE EDIT
========================================================= */

function openEditProfile(){

 $("editName").value=
 currentProfile?.name || "";

 $("editBio").value=
 currentProfile?.bio || "";

 $("editPhoto").value=
 currentProfile?.profile_photo || "";

 $("editCover").value=
 currentProfile?.cover_photo || "";

 $("editModal").style.display="flex";

}


function closeEditProfile(){

 $("editModal").style.display="none";

}


async function saveProfile(){

 if(!currentUser) return;

 const name=
 $("editName").value.trim();

 const bio=
 $("editBio").value.trim();

 const photo=
 $("editPhoto").value.trim();

 const cover=
 $("editCover").value.trim();

 if(!name){

  $("profileMsg").textContent=
  "Name দিন।";

  return;

 }

 try{

  const {data,error}=await sb
   .from("my social app")
   .update({

    name:name,
    bio:bio,
    profile_photo:photo,
    cover_photo:cover

   })
   .eq("id",currentUser.id)
   .select()
   .maybeSingle();

  if(error){
   throw error;
  }

  currentProfile=data || {
   ...currentProfile,
   name:name,
   bio:bio,
   profile_photo:photo,
   cover_photo:cover
  };

  updateProfileUI();

  $("profileMsg").className=
  "authMsg success";

  $("profileMsg").textContent=
  "Profile updated.";

  setTimeout(
   closeEditProfile,
   700
  );

 }catch(error){

  console.error(error);

  $("profileMsg").className="authMsg";

  $("profileMsg").textContent=
  "Profile update হয়নি: "+
  error.message;

 }

}

========================================================= */

async function submitPost(){

 if(!currentUser){

  alert("আগে Login করুন।");

  return;

 }

 const text=
 $("postText").value.trim();

 const file=
 $("postImage").files[0];

 if(!text && !file){

  $("postMsg").textContent=
  "Post text অথবা photo দিন।";

  return;

 }

 const btn=$("postBtn");

 btn.disabled=true;
 btn.textContent="Posting...";

 try{

  let image_url="";

  if(file){

   const ext=
   file.name.split(".").pop();

   const fileName=
   currentUser.id+
   "/"+
   Date.now()+
   "."+
   ext;

   const {error:uploadError}=
   await sb.storage
   .from("post-images")
   .upload(
    fileName,
    file,
    {
     upsert:false
    }
   );

   if(uploadError){

    throw new Error(
     "Photo upload হয়নি: "+
     uploadError.message
    );

   }

   const {data:urlData}=
   sb.storage
   .from("post-images")
   .getPublicUrl(fileName);

   image_url=
   urlData.publicUrl;

  }

  const {error}=await sb
   .from("posts")
   .insert({

    user_id:currentUser.id,
    text:text,
    image_url:image_url || null

   });

  if(error){
   throw error;
  }

  $("postText").value="";
  $("postImage").value="";
  $("postMsg").className=
   "authMsg success";

  $("postMsg").textContent=
   "Post published!";

  await loadPosts();

 }catch(error){

  console.error(error);

  $("postMsg").className="authMsg";

  $("postMsg").textContent=
   error.message;

 }finally{

  btn.disabled=false;
  btn.textContent="Post";

 }

}


/* =========================================================
   LOAD POSTS
========================================================= */

async function loadPosts(){

 const feed=$("feed");

 feed.innerHTML=
 '<div class="empty">Loading...</div>';

 try{

  const {data:posts,error}=await sb
   .from("posts")
   .select("*")
   .order("created_at",{ascending:false})
   .limit(50);

  if(error){
   throw error;
  }

  if(!posts || posts.length===0){

   feed.innerHTML=
   '<div class="empty">এখনো কোনো Post নেই। প্রথম Post আপনি দিন।</div>';

   return;

  }

  feed.innerHTML="";

  for(const post of posts){

   let profile=null;

   try{

    const result=await sb
     .from("my social app")
     .select("*")
     .eq("id",post.user_id)
     .maybeSingle();

    profile=result.data;

   }catch(e){}

   const name=
   profile?.name ||
   "FriendBook User";

   const avatar=
   profile?.profile_photo ||
   "https://ui-avatars.com/api/?name="+
   encodeURIComponent(name);

   const card=
   document.createElement("div");

   card.className="card";

   card.innerHTML=`

    <div class="row">

     <img
      class="avatar"
      src="${escapeHtml(avatar)}"
     >

     <div>
      <div class="name">
       ${escapeHtml(name)}
      </div>

      <div class="muted">
       ${formatDate(post.created_at)}
      </div>
     </div>

    </div>

    ${
     post.text
     ?
     `<div style="margin-top:10px;white-space:pre-wrap">
       ${escapeHtml(post.text)}
      </div>`
     :
     ""
    }

    ${
     post.image_url
     ?
     `<img
       class="postImg"
       src="${escapeHtml(post.image_url)}"
      >`
     :
     ""
    }

    <div class="actions">

     <button
      class="actionBtn"
      onclick="likePost(${post.id})"
     >
      ❤️ Like
     </button>

     <button
      class="actionBtn"
      onclick="commentPost(${post.id})"
     >
      💬 Comment
     </button>

     <button
      class="actionBtn"
      onclick="sharePost(${post.id})"
     >
      ↗ Share
     </button>

    </div>

    <div id="comments-${post.id}"></div>

   `;

   feed.appendChild(card);

  }

 }catch(error){

  console.error(error);

  feed.innerHTML=
  `<div class="empty">
   Post load হয়নি.<br>
   ${escapeHtml(error.message)}
  </div>`;

 }

}

   .from("reels")

   div.innerHTML=`

     </div>

   `;

   reelsBox.appendChild(div);

  });

  setupReelObserver();

 }catch(error){

  reelsBox.innerHTML=
  `<div class="empty">
   Reel load হয়নি.<br>
   ${escapeHtml(error.message)}
  </div>`;

 }

}


function toggleMute(video){

 video.muted=!video.muted;

 if(video.paused){
  video.play().catch(()=>{});
 }

}


function setupReelObserver(){

 const videos=
 document.querySelectorAll(".reel video");

 const observer=
 new IntersectionObserver(

  entries=>{

   entries.forEach(entry=>{

    const video=entry.target;

    if(entry.isIntersecting){

     video.play().catch(()=>{});

    }else{

     video.pause();

    }

   });

  },

  {
   threshold:.7
  }

 );

 videos.forEach(video=>
  observer.observe(video)
 );

}

/* =========================================================
   DATE
========================================================= */

function formatDate(date){

 if(!date) return "";

 try{

  return new Date(date)
   .toLocaleString("bn-BD",{
    dateStyle:"medium",
    timeStyle:"short"
   });

 }catch(e){

  return "";

 }

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(value){

 return String(value ?? "")
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");

}

========================================================= */
