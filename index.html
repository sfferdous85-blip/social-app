<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<meta name="theme-color" content="#1877f2">

<title>FriendBook</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --bg:#f0f2f5;
  --card:#fff;
  --text:#17202a;
  --muted:#65676b;
  --line:#e4e6eb;
  --blue:#1877f2;
  --blue2:#0866ff;
  --danger:#e53935;
  --green:#20a464;
  --shadow:0 8px 30px rgba(0,0,0,.08);
}

body.dark{
  --bg:#0b0d10;
  --card:#15181c;
  --text:#f1f5f9;
  --muted:#a8b0bb;
  --line:#292d33;
  --shadow:0 10px 35px rgba(0,0,0,.35);
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

img,
video{
  max-width:100%;
}

.hidden{
  display:none!important;
}

.app{
  min-height:100vh;
}

/* ================= HEADER ================= */

.topbar{
  position:sticky;
  top:0;
  z-index:1000;
  height:62px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 12px;
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
}

body.dark .topbar{
  background:rgba(15,17,20,.92);
}

.logo{
  font-size:25px;
  font-weight:900;
  color:var(--blue);
  letter-spacing:-1px;
}

.searchBox{
  flex:1;
  position:relative;
}

.searchBox input{
  width:100%;
  border:0;
  outline:0;
  background:var(--bg);
  border-radius:25px;
  padding:11px 16px;
  color:var(--text);
}

.headerBtn{
  width:40px;
  height:40px;
  border-radius:50%;
  background:var(--bg);
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
}

.headerBtn:active{
  transform:scale(.92);
}

/* ================= MAIN ================= */

.main{
  max-width:1200px;
  margin:auto;
  padding:15px 12px 90px;
}

.grid{
  display:grid;
  grid-template-columns:250px minmax(0,650px) 280px;
  gap:15px;
}

@media(max-width:1000px){
  .grid{
    grid-template-columns:1fr;
  }

  .leftCol,
  .rightCol{
    display:none;
  }
}

/* ================= CARD ================= */

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:var(--shadow);
  margin-bottom:14px;
  overflow:hidden;
}

.pad{
  padding:15px;
}

.title{
  font-weight:800;
  font-size:17px;
}

.muted{
  color:var(--muted);
  font-size:13px;
}

.row{
  display:flex;
  align-items:center;
  gap:10px;
}

.space{
  justify-content:space-between;
}

.avatar{
  width:44px;
  height:44px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd;
}

.avatar.sm{
  width:36px;
  height:36px;
}

.avatar.lg{
  width:86px;
  height:86px;
}

.cover{
  width:100%;
  height:210px;
  object-fit:cover;
  background:#ddd;
}

/* ================= BUTTONS ================= */

.primary{
  background:linear-gradient(135deg,#1877f2,#005bea);
  color:#fff;
  padding:11px 17px;
  border-radius:12px;
  font-weight:800;
}

.secondary{
  background:var(--bg);
  color:var(--text);
  padding:10px 15px;
  border-radius:12px;
  font-weight:700;
}

.danger{
  background:#fee2e2;
  color:#b91c1c;
  padding:10px 14px;
  border-radius:12px;
  font-weight:700;
}

.iconBtn{
  width:40px;
  height:40px;
  border-radius:50%;
  background:var(--bg);
  color:var(--text);
}

.iconBtn:active,
.primary:active,
.secondary:active{
  transform:scale(.96);
}

/* ================= INPUT ================= */

.input{
  width:100%;
  border:1px solid var(--line);
  background:var(--bg);
  color:var(--text);
  border-radius:13px;
  padding:12px 13px;
  outline:0;
  margin-bottom:10px;
}

textarea.input{
  min-height:90px;
  resize:vertical;
}

.input:focus{
  border-color:var(--blue);
}

/* ================= AUTH ================= */

.auth{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at top,#1877f233,transparent 35%),
    var(--bg);
}

.authCard{
  width:100%;
  max-width:430px;
  padding:28px;
  border-radius:25px;
  background:var(--card);
  box-shadow:0 25px 80px rgba(0,0,0,.15);
  border:1px solid var(--line);
}

.authLogo{
  text-align:center;
  font-size:38px;
  font-weight:950;
  color:var(--blue);
  margin-bottom:5px;
}

/* ================= STORIES ================= */

.stories{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:5px;
}

.story{
  min-width:92px;
  height:145px;
  border-radius:15px;
  overflow:hidden;
  position:relative;
  background:#ddd;
  cursor:pointer;
}

.story img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.storyName{
  position:absolute;
  left:7px;
  right:7px;
  bottom:7px;
  color:#fff;
  font-size:12px;
  font-weight:800;
  text-shadow:0 1px 4px #000;
}

/* ================= COMPOSER ================= */

.composer{
  padding:14px;
}

.composerTop{
  display:flex;
  gap:10px;
  align-items:center;
}

.fakeInput{
  flex:1;
  background:var(--bg);
  border-radius:25px;
  padding:12px 15px;
  color:var(--muted);
  cursor:pointer;
}

.composerActions{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-top:10px;
}

.composeAction{
  padding:10px 5px;
  background:transparent;
  border-radius:10px;
  color:var(--muted);
}

.composeAction:hover{
  background:var(--bg);
}

/* ================= POST ================= */

.postHead{
  padding:14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.postUser{
  display:flex;
  gap:10px;
  align-items:center;
}

.postContent{
  padding:0 14px 12px;
  white-space:pre-wrap;
  word-break:break-word;
}

.postImage{
  width:100%;
  max-height:650px;
  object-fit:cover;
  display:block;
}

.postStats{
  padding:9px 14px;
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:13px;
}

.postActions{
  border-top:1px solid var(--line);
  display:grid;
  grid-template-columns:repeat(4,1fr);
}

.postActions button{
  background:transparent;
  color:var(--muted);
  padding:12px 3px;
}

.postActions button.active{
  color:var(--blue);
  font-weight:800;
}

/* ================= COMMENTS ================= */

.comments{
  border-top:1px solid var(--line);
  padding:10px 14px;
}

.comment{
  display:flex;
  gap:8px;
  margin-bottom:9px;
}

.commentBubble{
  background:var(--bg);
  border-radius:15px;
  padding:8px 11px;
}

/* ================= SIDEBAR ================= */

.menuItem{
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  background:transparent;
  color:var(--text);
  padding:11px 10px;
  border-radius:12px;
  text-align:left;
}

.menuItem:hover{
  background:var(--bg);
}

.menuIcon{
  width:32px;
  text-align:center;
  font-size:20px;
}

/* ================= MODAL ================= */

.modalWrap{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  z-index:3000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:12px;
}

.modal{
  width:100%;
  max-width:560px;
  max-height:92vh;
  overflow:auto;
  background:var(--card);
  border-radius:22px;
  box-shadow:0 30px 100px rgba(0,0,0,.4);
}

.modalHead{
  position:sticky;
  top:0;
  z-index:2;
  padding:15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:var(--card);
  border-bottom:1px solid var(--line);
}

.modalTitle{
  font-size:18px;
  font-weight:900;
}

.close{
  width:36px;
  height:36px;
  border-radius:50%;
  background:var(--bg);
  color:var(--text);
  font-size:22px;
}

.modalBody{
  padding:15px;
}

/* ================= PROGRESS ================= */

.progressBox{
  margin-top:10px;
  background:var(--bg);
  border-radius:15px;
  padding:12px;
}

.progressTrack{
  height:9px;
  border-radius:20px;
  background:var(--line);
  overflow:hidden;
}

.progressBar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#1877f2,#7c3aed);
  transition:.15s;
}

.progressText{
  margin-top:7px;
  text-align:center;
  font-weight:800;
}

/* ================= REEL UPLOAD ================= */

.reelUpload{
  border:1px dashed var(--line);
  border-radius:18px;
  padding:12px;
  background:var(--bg);
}

.fileBox{
  border:2px dashed #1877f255;
  border-radius:17px;
  padding:22px 10px;
  text-align:center;
  cursor:pointer;
}

.fileBox strong{
  display:block;
  font-size:16px;
}

.previewVideo{
  width:100%;
  max-height:450px;
  border-radius:17px;
  background:#000;
  object-fit:contain;
  margin-top:10px;
}

.previewCover{
  width:100%;
  max-height:300px;
  border-radius:15px;
  object-fit:cover;
  margin-top:10px;
}

.optionGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.option{
  border:1px solid var(--line);
  padding:10px;
  border-radius:12px;
  background:var(--bg);
}

.option label{
  font-size:12px;
  color:var(--muted);
  display:block;
  margin-bottom:4px;
}

.toggleRow{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:11px 0;
  border-bottom:1px solid var(--line);
}

.switch{
  position:relative;
  width:48px;
  height:28px;
}

.switch input{
  display:none;
}

.slider{
  position:absolute;
  inset:0;
  background:#aaa;
  border-radius:30px;
}

.slider:before{
  content:"";
  position:absolute;
  width:22px;
  height:22px;
  left:3px;
  top:3px;
  background:#fff;
  border-radius:50%;
  transition:.2s;
}

.switch input:checked+.slider{
  background:var(--blue);
}

.switch input:checked+.slider:before{
  transform:translateX(20px);
}

/* ================= REELS ================= */

.reelPage{
  position:fixed;
  inset:0;
  z-index:2500;
  background:#000;
  overflow-y:auto;
  scroll-snap-type:y mandatory;
}

.reelTop{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:2600;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px;
  color:#fff;
  background:linear-gradient(#0008,transparent);
}

.reel{
  height:100svh;
  min-height:100vh;
  position:relative;
  scroll-snap-align:start;
  background:#000;
  overflow:hidden;
}

.reel video{
  width:100%;
  height:100%;
  object-fit:cover;
  background:#000;
}

.reelShade{
  position:absolute;
  inset:auto 0 0;
  height:45%;
  background:linear-gradient(transparent,#000b);
  pointer-events:none;
}

.reelInfo{
  position:absolute;
  left:15px;
  right:75px;
  bottom:25px;
  color:#fff;
  z-index:4;
}

.reelInfo strong{
  font-size:16px;
}

.reelCaption{
  margin-top:7px;
  white-space:pre-wrap;
}

.reelLocation,
.reelMusic{
  margin-top:6px;
  font-size:12px;
  opacity:.85;
}

.reelActions{
  position:absolute;
  right:12px;
  bottom:25px;
  z-index:5;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.reelAction{
  width:48px;
  height:48px;
  border-radius:50%;
  background:#0008;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
  backdrop-filter:blur(8px);
}

.reelAction small{
  position:absolute;
  margin-top:65px;
  font-size:11px;
}

.reelSound{
  position:absolute;
  top:70px;
  right:15px;
  z-index:5;
  width:45px;
  height:45px;
  border-radius:50%;
  background:#0008;
  color:#fff;
}

.reelCover{
  position:absolute;
  inset:0;
  z-index:1;
  background:#000;
}

.reelCover img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.reelCover.hidden{
  display:none;
}

/* ================= BOTTOM NAV ================= */

.bottomNav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:1800;
  display:flex;
  justify-content:space-around;
  padding:7px 5px;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(18px);
  border-top:1px solid var(--line);
}

body.dark .bottomNav{
  background:rgba(15,17,20,.94);
}

.bottomNav button{
  background:transparent;
  color:var(--muted);
  min-width:55px;
  padding:5px;
}

.bottomNav button.active{
  color:var(--blue);
}

.bottomIcon{
  font-size:20px;
  display:block;
}

.bottomText{
  font-size:10px;
}

/* ================= PROFILE ================= */

.profileHeader{
  position:relative;
}

.profileCover{
  width:100%;
  height:220px;
  object-fit:cover;
  background:#ddd;
}

.profileAvatarWrap{
  position:relative;
  margin-top:-50px;
  padding-left:20px;
}

.profileName{
  font-size:24px;
  font-weight:950;
  margin-top:8px;
}

/* ================= LIST ================= */

.listItem{
  display:flex;
  gap:10px;
  align-items:center;
  padding:11px;
  border-bottom:1px solid var(--line);
}

.listItem:last-child{
  border-bottom:0;
}

.listMain{
  flex:1;
}

/* ================= EMPTY ================= */

.empty{
  text-align:center;
  padding:35px 15px;
  color:var(--muted);
}

/* ================= TOAST ================= */

.toast{
  position:fixed;
  left:50%;
  bottom:80px;
  transform:translateX(-50%) translateY(20px);
  z-index:5000;
  background:#111;
  color:#fff;
  padding:11px 17px;
  border-radius:30px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  max-width:90%;
  text-align:center;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* ================= RESPONSIVE ================= */

@media(max-width:600px){
  .topbar{
    height:57px;
  }

  .logo{
    font-size:21px;
  }

  .main{
    padding:10px 7px 85px;
  }

  .card{
    border-radius:14px;
  }

  .modalWrap{
    padding:0;
    align-items:flex-end;
  }

  .modal{
    max-height:95vh;
    border-radius:22px 22px 0 0;
  }

  .optionGrid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div id="authScreen" class="auth">

  <div class="authCard">

    <div class="authLogo">FriendBook</div>

    <p class="muted" style="text-align:center">
      Connect • Share • Create
    </p>

    <input id="authName"
           class="input hidden"
           placeholder="Your full name">

    <input id="authEmail"
           class="input"
           type="email"
           placeholder="Email">

    <input id="authPassword"
           class="input"
           type="password"
           placeholder="Password">

    <button id="authBtn"
            class="primary"
            style="width:100%"
            onclick="authAction()">
      Login
    </button>

    <button id="authSwitch"
            class="secondary"
            style="width:100%;margin-top:8px"
            onclick="switchAuth()">
      Create new account
    </button>

  </div>

</div>


<div id="app" class="app hidden">

  <header class="topbar">

    <div class="logo">FriendBook</div>

    <div class="searchBox">
      <input id="globalSearch"
             placeholder="Search FriendBook..."
             onkeydown="if(event.key==='Enter')doSearch()">
    </div>

    <button class="headerBtn"
            onclick="openNotifications()">
      🔔
    </button>

    <button class="headerBtn"
            onclick="toggleDark()">
      🌙
    </button>

  </header>


  <main class="main">

    <div class="grid">

      <aside class="leftCol">

        <div class="card pad">

          <div class="row">
            <img id="sideAvatar"
                 class="avatar"
                 src="">
            <div>
              <div id="sideName" class="title">
                User
              </div>
              <div class="muted">
                FriendBook
              </div>
            </div>
          </div>

          <hr style="border:0;border-top:1px solid var(--line);margin:12px 0">

          <button class="menuItem" onclick="showHome()">
            <span class="menuIcon">🏠</span>
            Home
          </button>

          <button class="menuItem" onclick="openProfile(me.id)">
            <span class="menuIcon">👤</span>
            Profile
          </button>

          <button class="menuItem" onclick="openReels()">
            <span class="menuIcon">🎬</span>
            Reels
          </button>

          <button class="menuItem" onclick="openMessenger()">
            <span class="menuIcon">💬</span>
            Messenger
          </button>

          <button class="menuItem" onclick="openFriends()">
            <span class="menuIcon">👥</span>
            Friends
          </button>

          <button class="menuItem" onclick="openPages()">
            <span class="menuIcon">📄</span>
            Pages
          </button>

          <button class="menuItem" onclick="openGroups()">
            <span class="menuIcon">👨‍👩‍👧</span>
            Groups
          </button>

          <button class="menuItem" onclick="openMarketplace()">
            <span class="menuIcon">🛒</span>
            Marketplace
          </button>

          <button class="menuItem" onclick="openEvents()">
            <span class="menuIcon">📅</span>
            Events
          </button>

          <button class="menuItem" onclick="openCreator()">
            <span class="menuIcon">💰</span>
            Creator Studio
          </button>

          <button class="menuItem" onclick="openSettings()">
            <span class="menuIcon">⚙️</span>
            Settings
          </button>

          <button class="menuItem" onclick="logout()">
            <span class="menuIcon">🚪</span>
            Logout
          </button>

        </div>

      </aside>


      <section id="feedColumn">

        <div id="storiesCard" class="card pad">

          <div class="row space" style="margin-bottom:8px">
            <div class="title">Stories</div>

            <button class="secondary"
                    onclick="openCreateStory()">
              + Story
            </button>
          </div>

          <div id="stories"
               class="stories">
          </div>

        </div>


        <div class="card composer">

          <div class="composerTop">

            <img id="composerAvatar"
                 class="avatar"
                 src="">

            <div class="fakeInput"
                 onclick="openCreatePost()">
              What's on your mind?
            </div>

          </div>

          <div class="composerActions">

            <button class="composeAction"
                    onclick="openCreatePost()">
              📝 Post
            </button>

            <button class="composeAction"
                    onclick="openCreateReel()">
              🎬 Reel
            </button>

            <button class="composeAction"
                    onclick="openCreateStory()">
              📷 Story
            </button>

          </div>

        </div>


        <div id="feed"></div>

      </section>


      <aside class="rightCol">

        <div class="card pad">

          <div class="title">
            Quick Actions
          </div>

          <button class="menuItem"
                  onclick="openReels()">
            🎬 Watch Reels
          </button>

          <button class="menuItem"
                  onclick="openMessenger()">
            💬 Messenger
          </button>

          <button class="menuItem"
                  onclick="openNotifications()">
            🔔 Notifications
          </button>

        </div>

        <div class="card pad">

          <div class="title">
            Online Friends
          </div>

          <div id="onlineFriends"
               class="muted"
               style="margin-top:10px">
            Loading...
          </div>

        </div>

      </aside>

    </div>

  </main>


  <nav class="bottomNav">

    <button id="navHome"
            class="active"
            onclick="showHome()">
      <span class="bottomIcon">🏠</span>
      <span class="bottomText">Home</span>
    </button>

    <button onclick="openReels()">
      <span class="bottomIcon">🎬</span>
      <span class="bottomText">Reels</span>
    </button>

function esc(value){

    .replaceAll("'","&#039;");

function toast(message){

function timeAgo(date){
  const d =
    Math.floor(
      (Date.now()-new Date(date).getTime())/1000
    );

  if(d<60) return "Just now";

  const m=Math.floor(d/60);
  if(m<60) return m+"m";

  const h=Math.floor(m/60);
  if(h<24) return h+"h";

  const days=Math.floor(h/24);
  if(days<7) return days+"d";

  return new Date(date).toLocaleDateString();
}

async function hydratePostStats(posts){

  const ids=posts.map(x=>x.id);

  if(!ids.length)return;

  const {data:reactions} =
    await sb
      .from("reactions")
      .select("post_id,user_id")
      .in("post_id",ids);

  const counts={};
  const mine={};

  (reactions||[]).forEach(r=>{
    counts[r.post_id] =
      (counts[r.post_id]||0)+1;

    if(r.user_id===me.id){
      mine[r.post_id]=true;
    }
  });

  const {data:comments} =
    await sb
      .from("comments")
      .select("post_id")
      .in("post_id",ids);

  const cc={};

  (comments||[]).forEach(c=>{
    cc[c.post_id] =
      (cc[c.post_id]||0)+1;
  });

  ids.forEach(id=>{

    const l=document.getElementById(
      `likes-${id}`
    );

    const c=document.getElementById(
      `comments-${id}`
    );

    const b=document.getElementById(
      `likeBtn-${id}`
    );

    if(l)
      l.textContent=
        `❤️ ${counts[id]||0}`;

    if(c)
      c.textContent=
        `${cc[id]||0} comments`;

    if(b && mine[id])
      b.classList.add("active");

  });
}

/* =========================================================
   REEL FILE VALIDATION + PREVIEW
========================================================= */

function handleReelFile(file){

  if(!file)return;

  if(!file.type.startsWith("video/")){

    toast("শুধু video file নির্বাচন করুন");
    return;
  }

  const maxSize =
    100*1024*1024;

  if(file.size>maxSize){

    toast("ভিডিও সর্বোচ্চ 100MB হতে পারবে");
    return;
  }

  currentReelFile=file;

  if(currentReelVideoURL){
    URL.revokeObjectURL(currentReelVideoURL);
  }

  currentReelVideoURL=
    URL.createObjectURL(file);

  const video=
    document.createElement("video");

  video.preload="metadata";
  video.src=currentReelVideoURL;

  video.onloadedmetadata=()=>{

    const duration=
      video.duration;

    const width=
      video.videoWidth;

    const height=
      video.videoHeight;

    if(duration>180){

      toast(
        "Reel সর্বোচ্চ 3 মিনিট হতে পারবে"
      );

      currentReelFile=null;
      return;
    }

    document.getElementById(
      "reelPreviewArea"
    ).innerHTML=`

      <video id="reelPreviewVideo"
             class="previewVideo"
             controls
             playsinline
             muted
             src="${currentReelVideoURL}">
      </video>

      <div class="muted"
           style="margin-top:7px">

        ⏱️ ${Math.round(duration)} sec
        • ${width}×${height}
        • ${(file.size/1024/1024).toFixed(1)} MB

      </div>
    `;
  };
}

/* =========================================================
   GENERATE COVER FROM VIDEO
========================================================= */

async function generateReelCover(){

  if(!currentReelFile){
    toast("আগে video নির্বাচন করুন");
    return;
  }

  const video=
    document.createElement("video");

  video.src=
    currentReelVideoURL;

  video.muted=true;
  video.playsInline=true;
  video.preload="auto";

  await new Promise((resolve,reject)=>{

    video.onloadeddata=resolve;
    video.onerror=reject;

  });

  video.currentTime=
    Math.min(
      1,
      Math.max(0,video.duration/2)
    );

  await new Promise(resolve=>{
    video.onseeked=resolve;
  });

  const canvas=
    document.createElement("canvas");

  const maxWidth=720;

  const scale=
    Math.min(
      1,
      maxWidth/video.videoWidth
    );

  canvas.width=
    Math.round(video.videoWidth*scale);

  canvas.height=
    Math.round(video.videoHeight*scale);

  const ctx=
    canvas.getContext("2d");

  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );

  const blob=
    await new Promise(resolve=>
      canvas.toBlob(
        resolve,
        "image/jpeg",
        .88
      )
    );

  if(!blob){
    toast("Cover তৈরি করা যায়নি");
    return;
  }

  currentReelCover=
    new File(
      [blob],
      "reel-cover.jpg",
      {type:"image/jpeg"}
    );

  const url=
    URL.createObjectURL(blob);

  document.getElementById(
    "coverPreview"
  ).innerHTML=`

    <img class="previewCover"
         src="${url}">

    <div class="muted">
      ✓ Video frame selected
    </div>

  `;

  toast("Cover তৈরি হয়েছে");
}


/* =========================================================
   STORAGE UPLOAD WITH PROGRESS
========================================================= */

async function uploadFileWithProgress(
  bucket,
  path,
  file,
  onProgress
){

  const {data:sessionData} =
    await sb.auth.getSession();

  const token =
    sessionData?.session?.access_token ||
    SUPABASE_KEY;

  return new Promise((resolve,reject)=>{

    const xhr=
      new XMLHttpRequest();

    currentUploadXHR=xhr;

    const url=
      `${SUPABASE_URL}/storage/v1/object/`+
      `${bucket}/${path}`;

    xhr.open("POST",url);

    xhr.setRequestHeader(
      "apikey",
      SUPABASE_KEY
    );

    xhr.setRequestHeader(
      "Authorization",
      `Bearer ${token}`
    );

    xhr.setRequestHeader(
      "Content-Type",
      file.type ||
      "application/octet-stream"
    );

    xhr.setRequestHeader(
      "x-upsert",
      "false"
    );

    xhr.upload.onprogress=e=>{

      if(e.lengthComputable){

        const percent=
          Math.round(
            e.loaded/e.total*100
          );

        onProgress(percent);
      }

    };

    xhr.onload=()=>{

      currentUploadXHR=null;

      if(
        xhr.status>=200 &&
        xhr.status<300
      ){

        let result={};

        try{
          result=
            JSON.parse(
              xhr.responseText || "{}"
            );
        }catch(e){}

        resolve(result);

      }else{

        reject(
          new Error(
            xhr.responseText ||
            `Upload failed (${xhr.status})`
          )
        );
      }
    };

    xhr.onerror=()=>{

      currentUploadXHR=null;

      reject(
        new Error(
          "Network upload failed"
        )
      );

    };

    xhr.onabort=()=>{

      currentUploadXHR=null;

      reject(
        new Error(
          "Upload cancelled"
        )
      );

    };

    xhr.send(file);

  });
}


async function deleteStorageFile(
  bucket,
  path
){

  if(!path)return;

  const {data:sessionData} =
    await sb.auth.getSession();

  const token =
    sessionData?.session?.access_token ||
    SUPABASE_KEY;

  await fetch(
    `${SUPABASE_URL}/storage/v1/object/`+
    `${bucket}/${path}`,
    {
      method:"DELETE",
      headers:{
        apikey:SUPABASE_KEY,
        Authorization:`Bearer ${token}`
      }
    }
  );
}


function publicStorageURL(
  bucket,
  path
){

  return sb
    .storage
    .from(bucket)
    .getPublicUrl(path)
    .data
    .publicUrl;
}

   PUBLISH REEL
========================================================= */

async function publishReel(){

  if(!currentReelFile){

    toast("প্রথমে video নির্বাচন করুন");
    return;
  }

  const caption=
    document.getElementById("reelCaption")
    .value.trim();

  const hashtags=
    document.getElementById("reelHashtags")
    .value.trim();

  const location=
    document.getElementById("reelLocation")
    .value.trim();

  const music=
    document.getElementById("reelMusic")
    .value.trim();

  const audience=
    document.getElementById("reelAudience")
    .value;

  const commentsEnabled=
    document.getElementById("reelComments")
    .checked;

  const reactionsEnabled=
    document.getElementById("reelReactions")
    .checked;

  const sharesEnabled=
    document.getElementById("reelShares")
    .checked;


  const button=
    document.getElementById(
      "publishReelBtn"
    );

  button.disabled=true;
  button.textContent="Uploading...";


  const progressBox=
    document.getElementById(
      "reelUploadProgress"
    );

  progressBox.classList.remove("hidden");


  const bar=
    document.getElementById(
      "reelProgressBar"
    );

  const text=
    document.getElementById(
      "reelProgressText"
    );


  currentUploadPaths=[];

  const stamp=
    Date.now();

  const safeName=
    safeFileName(
      currentReelFile.name
    );

  const videoPath=
    `${me.id}/${stamp}-${safeName}`;

  let coverPath=null;

  try{

    /* VIDEO */

    text.textContent=
      "Uploading video 0%";

    await uploadFileWithProgress(
      "reels",
      videoPath,
      currentReelFile,
      percent=>{

        bar.style.width=
          percent+"%";

        text.textContent=
          `Uploading video ${percent}%`;

      }
    );

    currentUploadPaths.push({
      bucket:"reels",
      path:videoPath
    });


    const videoURL=
      publicStorageURL(
        "reels",
        videoPath
      );


    /* COVER */

    let coverURL=null;

    if(currentReelCover){

      coverPath=
        `${me.id}/covers/${stamp}-cover.jpg`;

      text.textContent=
        "Uploading cover...";

      await uploadFileWithProgress(
        "reels",
        coverPath,
        currentReelCover,
        percent=>{

          text.textContent=
            `Uploading cover ${percent}%`;

        }
      );

      currentUploadPaths.push({
        bucket:"reels",
        path:coverPath
      });

      coverURL=
        publicStorageURL(
          "reels",
          coverPath
        );
    }


    /* VIDEO METADATA */

    const metaVideo=
      document.createElement("video");

    metaVideo.preload="metadata";
    metaVideo.src=
      currentReelVideoURL;

    await new Promise(resolve=>{
      metaVideo.onloadedmetadata=resolve;
      metaVideo.onerror=resolve;
    });


    /* CREATE REEL */

    text.textContent=
      "Creating Reel...";


    const {data:reel,error} =
      await sb
        .from("reels")
        .insert({
          user_id:me.id,
          video_url:videoURL,
          caption:
            caption +
            (
              hashtags
              ? `\n\n${hashtags}`
              : ""
            ),
          created_at:
            new Date().toISOString(),
          views:0
        })
        .select()
        .single();


    if(error)throw error;


    /* SAVE REEL SETTINGS */

    const {error:settingsError} =
      await sb
        .from("fb_reel_settings")
        .insert({

          reel_id:reel.id,

          user_id:me.id,

          video_path:videoPath,

          cover_url:coverURL,

          cover_path:coverPath,

          music_url:
            music || null,

          location:
            location || null,

          audience,

          comments_enabled:
            commentsEnabled,

          reactions_enabled:
            reactionsEnabled,

          shares_enabled:
            sharesEnabled,

          duration:
            Number.isFinite(metaVideo.duration)
            ? metaVideo.duration
            : null,

          width:
            metaVideo.videoWidth ||
            null,

          height:
            metaVideo.videoHeight ||
            null

        });


    if(settingsError){

      /*
       * Reel তৈরি হয়ে গেছে।
       * Settings fail হলে Reel delete না করে
       * user-কে জানানো হচ্ছে।
       */

      console.error(
        settingsError
      );
    }


    /* DONE */

    bar.style.width="100%";

    text.textContent=
      "✓ Reel published successfully";

    toast("🎬 Reel successfully published");

    setTimeout(()=>{

      closeModal();

      currentReelFile=null;
      currentReelCover=null;

      if(currentReelVideoURL){
        URL.revokeObjectURL(
          currentReelVideoURL
        );
        currentReelVideoURL=null;
      }

      openReels();

    },700);


  }catch(error){

    console.error(error);

    if(
      error.message!=="Upload cancelled"
    ){

      toast(
        "Reel upload failed: "+
        error.message
      );
    }


    /*
     * যদি upload-এর পরে DB insert fail করে,
     * uploaded files পরিষ্কার করা
     */

    for(
      const item of currentUploadPaths
    ){

      try{

        await deleteStorageFile(
          item.bucket,
          item.path
        );

      }catch(e){}

    }

    button.disabled=false;

    button.textContent=
      "🔄 Retry Publish";

  }

}

              style="width:100%"

        🎬 Create first Reel
      </button>

    </div>
    `);

    return;
  }


  const ids=
    reels.map(r=>r.id);

  const userIds=
    [...new Set(
      reels.map(r=>r.user_id)
    )];


  const {data:profiles} =
    await sb
      .from("profiles")
      .select("*")
      .in("id",userIds);


  const map={};

  (profiles||[]).forEach(p=>{
    map[p.id]=p;
  });


  const {data:settings} =
    await sb
      .from("fb_reel_settings")
      .select("*")
      .in("reel_id",ids);


  const settingMap={};

  (settings||[]).forEach(s=>{
    settingMap[s.reel_id]=s;
  });


  currentReels=
    reels.map(r=>({
      reel:r,
      profile:map[r.user_id],
      settings:settingMap[r.id]
    }));


  const page=
    document.createElement("div");

  page.className="reelPage";
  page.id="reelPage";


  page.innerHTML=`

    <div class="reelTop">

      <button class="reelAction"
              onclick="closeReels()">
        ←
      </button>

      <strong>
        FriendBook Reels
      </strong>

      <button class="reelAction"
              onclick="closeReels();openCreateReel()">
        ＋
      </button>

    </div>

    ${
      currentReels
      .map(
        (item,index)=>
          renderReel(
            item,
            index
          )
      )
      .join("")
    }

  `;


  document.body.appendChild(page);


  const observer=
    new IntersectionObserver(
      entries=>{

        entries.forEach(entry=>{

          const video=
            entry.target.querySelector(
              "video"
            );

          if(!video)return;

          if(entry.isIntersecting){

            video.play()
              .catch(()=>{});

            const reelId=
              entry.target.dataset.reelId;

            incrementReelView(
              reelId
            );

          }else{

            video.pause();

          }

        });

      },
      {
        threshold:.7
      }
    );


  page
    .querySelectorAll(".reel")
    .forEach(x=>observer.observe(x));
}

async function saveReelEdit(reelId){

    document.getElementById(

    document.getElementById(
      "editReelLocation"
    ).value.trim();

    document.getElementById(
      "editReelMusic"
    ).value.trim();

  const audience=
    document.getElementById(
      "editReelAudience"
    ).value;


  const {error} =
    await sb
      .from("reels")
      .update({
        caption
      })
      .eq("id",reelId)

    return;

  await sb
    .from("fb_reel_settings")
    .update({
      location:location||null,
      music_url:music||null,

/* =========================================================
   DELETE REEL
========================================================= */

async function deleteReel(reelId){

  if(
    !confirm(
      "এই Reel delete করবেন?"
    )
  ){
    return;
  }


  const {data:settings} =
    await sb
      .from("fb_reel_settings")
      .select("*")
      .eq("reel_id",reelId)
      .eq("user_id",me.id)
      .maybeSingle();


  const {error} =
    await sb
      .from("reels")
      .delete()
      .eq("id",reelId)
      .eq("user_id",me.id);


  if(error){

    toast(error.message);
    return;
  }


  if(settings?.video_path){

    await deleteStorageFile(
      "reels",
      settings.video_path
    );
  }


  if(settings?.cover_path){

    await deleteStorageFile(
      "reels",
      settings.cover_path
    );
  }


  toast("Reel deleted");

  closeModal();

  closeReels();

  setTimeout(
    openReels,
    200
  );
}

async function openProfile(userId){

    await sb
      .from("fb_follows")
      .select("*",{count:"exact",head:true})
      .eq("follower_id",userId);


  let followingMe=false;

  if(userId!==me.id){

    const {data:f} =
      await sb
        .from("fb_follows")

      <img class="profileCover"

           )}">

      <div class="profileAvatarWrap">

        <img class="avatar lg"
             src="${esc(avatarURL(p))}">

      </div>

    </div>


    <div class="modalBody">

      <div class="profileName">
        ${esc(p.full_name||"User")}
      </div>

      <div class="muted">
        ${esc(p.bio||"")}
      </div>

      <div class="row"
           style="margin-top:12px">

        <div>
          <b>${followers||0}</b>
          <div class="muted">Followers</div>
        </div>

        <div>
          <b>${following||0}</b>
          <div class="muted">Following</div>
        </div>

      </div>


      ${
        userId!==me.id
        ?
        `<button class="primary"

async function toggleFollow(userId){

  const {data:existing} =
    await sb
      .from("fb_follows")
      .select("*")
      .eq("follower_id",me.id)
      .eq("following_id",userId)
      .maybeSingle();


  if(existing){

    await sb
      .from("fb_follows")
      .delete()
      .eq("follower_id",me.id)
      .eq("following_id",userId);

    toast("Unfollowed");

  }else{

    await sb
      .from("fb_follows")
      .insert({
        follower_id:me.id,
        following_id:userId
      });

    toast("Following");
  }

  openProfile(userId);
}

async function sendMessage(){

  const receiver_id=
    document.getElementById(
      "chatUserId"
    ).value.trim();

  const content=
    document.getElementById(
      "chatText"
    ).value.trim();

  if(!receiver_id || !content){
    toast("Receiver ID এবং message দিন");
    return;
  }


  const {error} =
    await sb
      .from("fb_messages")
      .insert({
        sender_id:me.id,
        receiver_id,
        content
      });


  if(error){

    toast(error.message);
    return;
  }

  document.getElementById(
    "chatText"
  ).value="";

  loadMessages();
}


async function loadMessages(){

  const {data:messages} =
    await sb
      .from("fb_messages")
      .select("*")
      .or(
        `sender_id.eq.${me.id},receiver_id.eq.${me.id}`
      )
      .order("created_at",{ascending:false})
      .limit(30);


  const box=
    document.getElementById(
      "messageList"
    );

  if(!box)return;


  box.innerHTML=
    (messages||[]).map(m=>`

      <div class="listItem">

        <div class="listMain">

          <b>
            ${
              m.sender_id===me.id
              ? "You"
              : "Friend"
            }
          </b>

          <div>
            ${esc(m.content||"")}
          </div>

        </div>

        <div class="muted">
          ${timeAgo(m.created_at)}
        </div>

      </div>

    `).join("")
    ||
    `<div class="empty">
      No messages
     </div>`;
}

    </button>

  </div>
  `);
}

async function requestWithdrawal(){

  const amount=
    Number(
      prompt(
        "Withdrawal amount"
      )||0
    );

  if(!amount || amount<=0)return;

  const method=
    prompt(
      "Payment method"
    )||"";


  const account=
    prompt(
      "Payment account"
    )||"";


  const {error} =
    await sb
      .from("fb_creator_withdrawals")
      .insert({
        user_id:me.id,
        amount,
        method,
        account
      });


  if(error){
    toast(error.message);
    return;
  }

  toast("Withdrawal request submitted");
}

/* =========================================================
   SETTINGS
========================================================= */

function openSettings(){

  openModal(`
  <div class="modalHead">

    <div class="modalTitle">
      Settings
    </div>

    <button class="close"
            onclick="closeModal()">
      ×
    </button>

  </div>

  <div class="modalBody">

    <button class="menuItem"
            onclick="toggleDark()">
      🌙 Toggle Dark Mode
    </button>

    <button class="menuItem"
            onclick="toggleAmoled()">
      🖤 AMOLED Mode
    </button>

    <button class="menuItem"
            onclick="editMyProfile()">
      👤 Edit Profile
    </button>

    <button class="menuItem"
            onclick="logout()">
      🚪 Logout
    </button>

  </div>
  `);
}


function toggleDark(){

  document.body.classList.toggle("dark");

  localStorage.setItem(
    "friendbook_dark",
    document.body.classList.contains("dark")
      ? "1"
      : "0"
  );
}


function toggleAmoled(){

  document.body.classList.toggle(
    "amoled"
  );

  if(
    document.body.classList.contains("amoled")
  ){

    document.body.style.setProperty(
      "--bg",
      "#000"
    );

  }else{

    document.body.style.removeProperty(
      "--bg"
    );

  }
}


async function editMyProfile(){

  openModal(`
  <div class="modalHead">

    <div class="modalTitle">
      Edit Profile
    </div>

    <button class="close"
            onclick="closeModal()">
      ×
    </button>

  </div>

  <div class="modalBody">

    <input id="profileName"
           class="input"
           value="${esc(myProfile.full_name||"")}"
           placeholder="Name">

    <textarea id="profileBio"
              class="input"
              placeholder="Bio">${esc(myProfile.bio||"")}</textarea>

    <input id="profileAvatar"
           class="input"
           value="${esc(myProfile.avatar_url||"")}"
           placeholder="Avatar URL">

    <input id="profileCover"
           class="input"
           value="${esc(myProfile.cover_url||"")}"
           placeholder="Cover URL">

    <button class="primary"
            style="width:100%"
            onclick="saveProfile()">
      Save Profile
    </button>

  </div>
  `);
}


async function saveProfile(){

  const full_name=
    document.getElementById(
      "profileName"
    ).value.trim();

  const bio=
    document.getElementById(
      "profileBio"
    ).value.trim();

  const avatar_url=
    document.getElementById(
      "profileAvatar"
    ).value.trim();

  const cover_url=
    document.getElementById(
      "profileCover"
    ).value.trim();


  const {error} =
    await sb
      .from("profiles")
      .update({
        full_name,
        bio,
        avatar_url:
          avatar_url || null,
        cover_url:
          cover_url || null
      })
      .eq("id",me.id);


  if(error){
    toast(error.message);
    return;
  }


  const {data:p} =
    await sb
      .from("profiles")
      .select("*")
      .eq("id",me.id)
      .single();


  myProfile=p;

  updateMyUI();

  closeModal();

  toast("Profile updated");
}


/* =========================================================
   ONLINE FRIENDS
========================================================= */

async function loadOnlineFriends(){

  const box=
    document.getElementById(
      "onlineFriends"
    );

  if(!box)return;


  const {data:friends} =
    await sb
      .from("profiles")
      .select("id,full_name,avatar_url,last_seen")
      .neq("id",me.id)
      .order("last_seen",{ascending:false})
      .limit(8);


  if(!friends?.length){

    box.textContent=
      "No friends online";

    return;
  }


  box.innerHTML=
    friends.map(f=>`

      <div class="row"
           style="margin:8px 0">

        <img class="avatar sm"
             src="${esc(avatarURL(f))}">

        <div>

          <div>
            ${esc(f.full_name||"User")}
          </div>

          <div class="muted">
            ${
              f.last_seen
              ? timeAgo(f.last_seen)
              : "Offline"
            }
          </div>

        </div>

      </div>

    `).join("");
}


/* =========================================================
   LAST SEEN
========================================================= */

async function updateLastSeen(){

  if(!me)return;

  await sb
    .from("profiles")
    .update({
      last_seen:
        new Date().toISOString()
    })
    .eq("id",me.id);
}


/* =========================================================
   DARK MODE LOAD
========================================================= */

if(
  localStorage.getItem(
    "friendbook_dark"
  )==="1"
){

  document.body.classList.add("dark");
}


/* =========================================================
   START
========================================================= */

init();

setInterval(
  updateLastSeen,
  60*1000
);

   REALTIME
========================================================= */

try{

  sb.channel("friendbook-realtime")
    .on(
      "postgres_changes",
      {
        event:"INSERT",
        schema:"public",
        table:"fb_notifications",
        filter:
          `user_id=eq.${me?.id}`
      },
      ()=>{
        toast("🔔 New notification");
      }
    )
    .subscribe();

}catch(e){}
