<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Social App</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      color: #111;
    }

    .header {
      background: #1877f2;
      color: white;
      padding: 15px;
      font-size: 24px;
      font-weight: bold;
      text-align: center;
      position: sticky;
      top: 0;
    }

    .container {
      max-width: 600px;
      margin: 20px auto;
      padding: 10px;
    }

    .post-box,
    .post {
      background: white;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    textarea {
      width: 100%;
      min-height: 90px;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 12px;
      font-size: 16px;
      resize: none;
    }

    button {
      border: none;
      border-radius: 7px;
      padding: 10px 18px;
      margin-top: 10px;
      background: #1877f2;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .post-name {
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 8px;
    }

    .post-text {
      font-size: 16px;
      line-height: 1.5;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .actions button {
      background: #eee;
      color: #333;
      flex: 1;
    }
  </style>
</head>

<body>

  <div class="header">
    My Social App
  </div>

  <div class="container">

    <div class="post-box">
      <textarea id="postText" placeholder="আপনি কী ভাবছেন?"></textarea>
      <button onclick="createPost()">Post</button>
    </div>

    <div id="feed">

      <div class="post">
        <div class="post-name">SF Ferdous</div>
        <div class="post-text">
          আমাদের Social App-এর প্রথম পোস্ট! 🎉
        </div>

        <div class="actions">
          <button onclick="likePost(this)">👍 Like</button>
          <button>💬 Comment</button>
          <button>↗ Share</button>
        </div>
      </div>

    </div>

  </div>

  <script>
    function createPost() {
      const text = document.getElementById("postText").value.trim();

      if (text === "") {
        alert("আগে কিছু লিখুন!");
        return;
      }

      const post = document.createElement("div");
      post.className = "post";

      post.innerHTML = `
        <div class="post-name">SF Ferdous</div>
        <div class="post-text">${text}</div>

        <div class="actions">
          <button onclick="likePost(this)">👍 Like</button>
          <button>💬 Comment</button>
          <button>↗ Share</button>
        </div>
      `;

      document.getElementById("feed").prepend(post);
      document.getElementById("postText").value = "";
    }

    function likePost(button) {
      if (button.innerText.includes("Like")) {
        button.innerText = "❤️ Liked";
      } else {
        button.innerText = "👍 Like";
      }
    }
  </script>

</body>
</html>
