<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#1877f2">
<title>FriendBook</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
:root{
 --blue:#1877f2;
 --blue2:#0866ff;
 --bg:#f0f2f5;
 --card:#fff;
 --text:#050505;
 --muted:#65676b;
 --line:#dddfe2;
 --danger:#e41e3f;
 --green:#31a24c;
 --shadow:0 2px 12px rgba(0,0,0,.08);
}
body.dark{
 --bg:#18191a;
 --card:#242526;
 --text:#e4e6eb;
 --muted:#b0b3b8;
 --line:#3e4042;
}
body.amoled{
 --bg:#000;
 --card:#050505;
 --text:#fff;
 --muted:#aaa;
 --line:#222;
}
body{
 margin:0;
 background:var(--bg);
 color:var(--text);
 font-family:Arial,Helvetica,sans-serif;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.topbar{
 position:sticky;
 top:0;
 z-index:1000;
 height:62px;
 background:var(--card);
 border-bottom:1px solid var(--line);
 display:flex;
 align-items:center;
 padding:8px 14px;
 gap:12px;
}
.logo{
 font-size:25px;
 font-weight:900;
 color:var(--blue);
 white-space:nowrap;
}
.search{
 width:280px;
 background:var(--bg);
 border:0;
 outline:0;
 padding:11px 15px;
 border-radius:22px;
 color:var(--text);
}
.top-actions{
 margin-left:auto;
 display:flex;
 gap:8px;
}
.icon-btn{
 border:0;
 width:42px;
 height:42px;
 border-radius:50%;
 background:var(--bg);
 color:var(--text);
 font-size:19px;
}
.layout{
 max-width:1500px;
 margin:auto;
 display:grid;
 grid-template-columns:250px minmax(0,680px) 280px;
 gap:20px;
 padding:18px;
}
.sidebar,.rightbar{
 position:sticky;
 top:80px;
 height:max-content;
}
.menu-item{
 display:flex;
 align-items:center;
 gap:13px;
 padding:12px;
 border-radius:10px;
 cursor:pointer;
 font-weight:700;
}
.menu-item:hover{background:var(--card)}
.menu-icon{font-size:21px;width:25px;text-align:center}
.card{
 background:var(--card);
 border-radius:14px;
 box-shadow:var(--shadow);
 border:1px solid rgba(128,128,128,.08);
 margin-bottom:15px;
}
.composer{padding:15px}
.composer-row{
 display:flex;
 gap:10px;
 align-items:center;
}
.avatar{
 width:42px;
 height:42px;
 border-radius:50%;
 object-fit:cover;
 background:#ddd;
}
.avatar.lg{width:70px;height:70px}
.fake-input{
 flex:1;
 background:var(--bg);
 border-radius:24px;
 padding:12px 16px;
 color:var(--muted);
 cursor:pointer;
}
.action-row{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 border-top:1px solid var(--line);
 margin-top:13px;
 padding-top:8px;
}
.action-btn{
 border:0;
 background:none;
 color:var(--muted);
 padding:10px;
 border-radius:8px;
 font-weight:700;
}
.action-btn:hover{background:var(--bg)}
.stories{
 display:flex;
 gap:10px;
 overflow-x:auto;
 padding:10px;
}
.story{
 min-width:110px;
 height:170px;
 border-radius:12px;
 overflow:hidden;
 position:relative;
 background:linear-gradient(145deg,#1877f2,#8b5cf6);
 cursor:pointer;
}
.story img{
 width:100%;
 height:100%;
 object-fit:cover;
}
.story-name{
 position:absolute;
 bottom:8px;
 left:8px;
 right:5px;
 color:white;
 font-weight:bold;
 text-shadow:0 1px 4px #000;
}
.add-story{
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 color:white;
 font-weight:bold;
}
.post{
 padding:14px;
}
.post-head{
 display:flex;
 align-items:center;
 gap:10px;
}
.post-meta{flex:1}
.post-name{font-weight:800}
.post-time{font-size:12px;color:var(--muted)}
.post-text{
 white-space:pre-wrap;
 margin:13px 0;
 line-height:1.5;
}
.post-img{
 width:100%;
 max-height:600px;
 object-fit:cover;
 border-radius:10px;
}
.stats{
 display:flex;
 justify-content:space-between;
 color:var(--muted);
 font-size:13px;
 padding:9px 2px;
 border-bottom:1px solid var(--line);
}
.post-actions{
 display:grid;
 grid-template-columns:repeat(4,1fr);
}
.comments{
 margin-top:10px;
}
.comment{
 display:flex;
 gap:8px;
 margin:8px 0;
}
.comment-body{
 background:var(--bg);
 border-radius:15px;
 padding:8px 12px;
}
.comment-input{
 display:flex;
 gap:8px;
 margin-top:10px;
}
.comment-input input{
 flex:1;
 border:0;
 outline:0;
 background:var(--bg);
 border-radius:20px;
 padding:10px 14px;
 color:var(--text);
}
.btn{
 border:0;
 border-radius:9px;
 padding:10px 15px;
 font-weight:700;
 background:var(--blue);
 color:white;
}
.btn.secondary{
 background:var(--bg);
 color:var(--text);
}
.btn.danger{background:var(--danger)}
.btn.green{background:var(--green)}
.modal-bg{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.65);
 z-index:3000;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:15px;
}
.modal{
 width:min(620px,100%);
 max-height:92vh;
 overflow:auto;
 background:var(--card);
 border-radius:18px;
 box-shadow:0 15px 50px rgba(0,0,0,.3);
}
.modal-head{
 padding:15px 18px;
 border-bottom:1px solid var(--line);
 display:flex;
 align-items:center;
 justify-content:space-between;
 font-weight:900;
 font-size:19px;
}
.modal-body{padding:18px}
.close{
 border:0;
 background:var(--bg);
 color:var(--text);
 width:38px;
 height:38px;
 border-radius:50%;
 font-size:20px;
}
.field{margin-bottom:13px}
.field label{
 display:block;
 font-size:13px;
 font-weight:800;
 margin-bottom:6px;
}
.field input,.field textarea,.field select{
 width:100%;
 border:1px solid var(--line);
 background:var(--card);
 color:var(--text);
 padding:11px 12px;
 border-radius:9px;
 outline:0;
}
.field textarea{min-height:100px;resize:vertical}
.preview{
 width:100%;
 max-height:420px;
 object-fit:contain;
 background:#000;
 border-radius:12px;
 margin:10px 0;
}
.upload-progress{
 height:10px;
 background:var(--bg);
 border-radius:20px;
 overflow:hidden;
}
.upload-progress div{
 height:100%;
 width:0%;
 background:linear-gradient(90deg,#1877f2,#8b5cf6);
 transition:.15s;
}
.progress-text{
 font-size:13px;
 color:var(--muted);
 margin:7px 0;
}
.reel-cover-grid{
 display:grid;
 grid-template-columns:repeat(5,1fr);
 gap:6px;
}
.cover-thumb{
 aspect-ratio:9/16;
 object-fit:cover;
 border-radius:7px;
 border:2px solid transparent;
 cursor:pointer;
 background:#000;
}
.cover-thumb.active{border-color:var(--blue)}
.switch-row{
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:10px 0;
 border-bottom:1px solid var(--line);
}
.switch{
 width:46px;
 height:25px;
 border-radius:20px;
 background:#aaa;
 position:relative;
 cursor:pointer;
}
.switch.on{background:var(--blue)}
.switch:after{
 content:"";
 position:absolute;
 width:19px;
 height:19px;
 border-radius:50%;
 background:white;
 top:3px;
 left:3px;
 transition:.2s;
}
.switch.on:after{left:24px}
.reel-page{
 position:fixed;
 inset:0;
 z-index:5000;
 background:#000;
 overflow-y:auto;
 scroll-snap-type:y mandatory;
}
.reel{
 height:100dvh;
 min-height:600px;
 position:relative;
 scroll-snap-align:start;
 display:flex;
 align-items:center;
 justify-content:center;
 background:#000;
}
.reel video{
 width:100%;
 height:100%;
 object-fit:cover;
}
.reel-gradient{
 position:absolute;
 inset:0;
 pointer-events:none;
 background:
 linear-gradient(to top,rgba(0,0,0,.8),transparent 35%),
 linear-gradient(to bottom,rgba(0,0,0,.25),transparent 25%);
}
.reel-info{
 position:absolute;
 left:16px;
 bottom:25px;
 width:calc(100% - 95px);
 color:white;
 z-index:3;
}
.reel-user{
 display:flex;
 align-items:center;
 gap:9px;
 margin-bottom:10px;
}
.reel-user .avatar{border:2px solid white}
.reel-caption{
 font-size:15px;
 line-height:1.45;
 margin:7px 0;
}
.reel-actions{
 position:absolute;
 right:12px;
 bottom:24px;
 display:flex;
 flex-direction:column;
 gap:12px;
 z-index:4;
}
.reel-action{
 border:0;
 background:rgba(0,0,0,.42);
 color:white;
 width:48px;
 min-height:48px;
 border-radius:50%;
 font-size:21px;
}
.reel-action small{
 display:block;
 font-size:10px;
}
.reel-top{
 position:absolute;
 top:15px;
 left:15px;
 right:15px;
 display:flex;
 justify-content:space-between;
 z-index:5;
}
.reel-close{
 background:rgba(0,0,0,.45);
 color:white;
 border:0;
 width:44px;
 height:44px;
 border-radius:50%;
 font-size:22px;
}
.reel-sound{
 position:absolute;
 top:15px;
 right:70px;
 z-index:5;
}
.login-page{
 min-height:100dvh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
}
.login-box{
 width:min(430px,100%);
 background:var(--card);
 padding:25px;
 border-radius:20px;
 box-shadow:0 10px 40px rgba(0,0,0,.15);
}
.login-logo{
 font-size:40px;
 font-weight:900;
 color:var(--blue);
 text-align:center;
 margin-bottom:20px;
}
.bottom-nav{
 display:none;
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 z-index:2000;
 background:var(--card);
 border-top:1px solid var(--line);
 grid-template-columns:repeat(5,1fr);
 padding:5px 2px;
}
.bottom-nav button{
 border:0;
 background:none;
 color:var(--muted);
 padding:6px 2px;
 font-size:19px;
}
.bottom-nav span{
 display:block;
 font-size:10px;
}
.profile-cover{
 height:190px;
 background:linear-gradient(135deg,#1877f2,#8b5cf6);
 border-radius:14px 14px 0 0;
}
.profile-main{
 padding:0 18px 18px;
 margin-top:-45px;
}
.profile-main .avatar{
 width:100px;
 height:100px;
 border:5px solid var(--card);
}
.profile-actions{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
 margin-top:10px;
}
.list-item{
 display:flex;
 gap:12px;
 align-items:center;
 padding:12px;
 border-bottom:1px solid var(--line);
}
.list-item:last-child{border-bottom:0}
.list-main{flex:1}
.toast{
 position:fixed;
 bottom:80px;
 left:50%;
 transform:translateX(-50%);
 background:#222;
 color:white;
 padding:12px 18px;
 border-radius:25px;
 z-index:9000;
 box-shadow:0 5px 20px rgba(0,0,0,.25);
}
.empty{
 text-align:center;
 padding:35px 15px;
 color:var(--muted);
}
.grid2{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
}
.check{
 display:flex;
 gap:8px;
 align-items:center;
 margin:7px 0;
}
@media(max-width:1100px){
 .layout{grid-template-columns:220px minmax(0,680px)}
 .rightbar{display:none}
}
@media(max-width:760px){
 .topbar{height:56px;padding:7px 9px}
 .logo{font-size:21px}
 .search{display:none}
 .layout{
  display:block;
  padding:8px;
  padding-bottom:70px;
 }
 .sidebar{display:none}
 .bottom-nav{display:grid}
 .card{border-radius:10px}
 .post{padding:12px}
 .grid2{grid-template-columns:1fr}
 .reel video{object-fit:cover}
}
</style>
</head>

<body>

<div id="authPage" class="login-page">
 <div class="login-box">
  <div class="login-logo">FriendBook</div>

  <div id="authTitle" style="text-align:center;font-weight:800;font-size:22px;margin-bottom:15px">
   Login
  </div>

  <div id="registerName" class="field hidden">
   <label>নাম</label>
   <input id="nameInput" placeholder="আপনার নাম">
  </div>

  <div class="field">
   <label>Email</label>
   <input id="emailInput" type="email" placeholder="Email">
  </div>

  <div class="field">
   <label>Password</label>
   <input id="passwordInput" type="password" placeholder="Password">
  </div>

  <button class="btn" style="width:100%" onclick="authAction()">Login</button>

  <div style="text-align:center;margin-top:15px">
   <button class="action-btn" onclick="switchAuth()" id="authSwitch">
    Create new account
   </button>
  </div>

  <div id="authMsg" style="text-align:center;color:#e41e3f;margin-top:10px"></div>
 </div>
</div>

<div id="app" class="hidden">

<header class="topbar">
 <div class="logo">FriendBook</div>

 <input id="globalSearch" class="search"
        placeholder="Search FriendBook..."
        onkeydown="if(event.key==='Enter')doSearch()">

 <div class="top-actions">
  <button class="icon-btn" onclick="doSearch()">🔍</button>
  <button class="icon-btn" onclick="openNotifications()">🔔</button>
  <button class="icon-btn" onclick="toggleDark()">🌙</button>
 </div>
</header>

<div class="layout">

<aside class="sidebar">

 <div class="menu-item" onclick="showHome()">
  <span class="menu-icon">🏠</span> Home
 </div>

 <div class="menu-item" onclick="openProfile(me?.id)">
  <span class="menu-icon">👤</span> Profile
 </div>

 <div class="menu-item" onclick="openReels()">
  <span class="menu-icon">🎬</span> Reels
 </div>

 <div class="menu-item" onclick="openMessenger()">
  <span class="menu-icon">💬</span> Messenger
 </div>

 <div class="menu-item" onclick="openFriends()">
  <span class="menu-icon">👥</span> Friends
 </div>

 <div class="menu-item" onclick="openPages()">
  <span class="menu-icon">📄</span> Pages
 </div>

 <div class="menu-item" onclick="openGroups()">
  <span class="menu-icon">👨‍👩‍👧‍👦</span> Groups
 </div>

 <div class="menu-item" onclick="openMarketplace()">
  <span class="menu-icon">🛒</span> Marketplace
 </div>

 <div class="menu-item" onclick="openEvents()">
  <span class="menu-icon">📅</span> Events
 </div>

 <div class="menu-item" onclick="openLive()">
  <span class="menu-icon">🔴</span> Live
 </div>

 <div class="menu-item" onclick="openCreator()">
  <span class="menu-icon">💰</span> Creator Studio
 </div>

 <div class="menu-item" onclick="openSettings()">
  <span class="menu-icon">⚙️</span> Settings
 </div>

 <div class="menu-item" onclick="logout()">
  <span class="menu-icon">🚪</span> Logout
 </div>

</aside>

<main id="main"></main>

<aside class="rightbar">

 <div class="card" style="padding:15px">
  <h3 style="margin-top:0">Quick actions</h3>

  <button class="btn" style="width:100%;margin-bottom:8px"
          onclick="openCreatePost()">➕ Create Post</button>

  <button class="btn" style="width:100%;margin-bottom:8px"
          onclick="openCreateReel()">🎬 Create Reel</button>

  <button class="btn secondary" style="width:100%;margin-bottom:8px"
          onclick="openCreateStory()">⭕ Story</button>

  <button class="btn secondary" style="width:100%"
          onclick="openLive()">🔴 Go Live</button>
 </div>

 <div class="card" style="padding:15px">
  <h3 style="margin-top:0">Online friends</h3>
  <div id="onlineFriends">Loading...</div>
 </div>

</aside>

</div>

<nav class="bottom-nav">
 <button onclick="showHome()">🏠<span>Home</span></button>
 <button onclick="openReels()">🎬<span>Reels</span></button>
 <button onclick="openCreatePost()">➕<span>Create</span></button>
 <button onclick="openMessenger()">💬<span>Chat</span></button>
 <button onclick="openProfile(me?.id)">👤<span>Profile</span></button>
</nav>

</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
const SUPABASE_URL="https://skereuaizdczbvjplisi.supabase.co";
const SUPABASE_KEY="sb_publishable_3R2otJA1zIlsMsTYxe1ocw_NAPY5O9x";

const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let me=null;
let myProfile=null;
let authMode="login";

let currentUploadXHR=null;
let currentUploadPaths=[];
let currentReelFile=null;
let currentReelCover=null;
let currentReelVideoURL=null;
let currentReelFrames=[];
let currentReels=[];
let currentReelIndex=0;

function esc(v){
 if(v===null||v===undefined)return "";
 return String(v).replace(/[&<>"']/g,m=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#039;"
 }[m]));
}

function toast(msg){
 const r=document.getElementById("toastRoot");
 r.innerHTML='<div class="toast">'+esc(msg)+'</div>';
 setTimeout(()=>r.innerHTML="",2600);
}

function avatarURL(url,name="User"){
 if(url)return url;
 return "https://ui-avatars.com/api/?name="+encodeURIComponent(name)+"&background=1877f2&color=fff";
}

function timeAgo(date){
 const s=Math.floor((Date.now()-new Date(date).getTime())/1000);
 if(s<60)return "এখনই";
 if(s<3600)return Math.floor(s/60)+" মিনিট";
 if(s<86400)return Math.floor(s/3600)+" ঘণ্টা";
 return Math.floor(s/86400)+" দিন";
}

function safeFileName(name){
 return name.replace(/[^a-zA-Z0-9._-]/g,"_");
}

function closeModal(){
 document.getElementById("modalRoot").innerHTML="";
}

function openModal(title,body){
 document.getElementById("modalRoot").innerHTML=`
 <div class="modal-bg" onclick="if(event.target===this)closeModal()">
  <div class="modal">
   <div class="modal-head">
    <span>${title}</span>
    <button class="close" onclick="closeModal()">×</button>
   </div>
   <div class="modal-body">${body}</div>
  </div>
 </div>`;
}

async function init(){
 const {data}=await sb.auth.getSession();

 if(data.session){
  me=data.session.user;
  await boot();
 }else{
  document.getElementById("authPage").classList.remove("hidden");
 }

 sb.auth.onAuthStateChange(async(event,session)=>{
  if(session){
   me=session.user;
   await boot();
  }else{
   me=null;
   document.getElementById("app").classList.add("hidden");
   document.getElementById("authPage").classList.remove("hidden");
  }
 });
}

async function boot(){
 document.getElementById("authPage").classList.add("hidden");
 document.getElementById("app").classList.remove("hidden");

 await loadMyProfile();
 updateMyUI();
 showHome();
 loadOnlineFriends();
 updateLastSeen();
}

async function loadMyProfile(){
 const {data}=await sb
  .from("profiles")
  .select("*")
  .eq("id",me.id)
  .maybeSingle();

 myProfile=data||{
  id:me.id,
  full_name:me.email?.split("@")[0]||"User",
  bio:""
 };
}

function updateMyUI(){}

function switchAuth(){
 authMode=authMode==="login"?"register":"login";

 document.getElementById("authTitle").textContent=
  authMode==="login"?"Login":"Create account";

 document.querySelector("#authPage .btn").textContent=
  authMode==="login"?"Login":"Create account";

 document.getElementById("registerName")
  .classList.toggle("hidden",authMode==="login");

 document.getElementById("authSwitch").textContent=
  authMode==="login"?"Create new account":"Already have an account";
}

async function authAction(){
 const email=document.getElementById("emailInput").value.trim();
 const password=document.getElementById("passwordInput").value;
 const name=document.getElementById("nameInput").value.trim();

 if(!email||!password){
  document.getElementById("authMsg").textContent="Email এবং Password দিন";
  return;
 }

 document.getElementById("authMsg").textContent="Please wait...";

 if(authMode==="login"){
  const {error}=await sb.auth.signInWithPassword({email,password});

  if(error){
   document.getElementById("authMsg").textContent=error.message;
  }
 }else{
  const {data,error}=await sb.auth.signUp({email,password});

  if(error){
   document.getElementById("authMsg").textContent=error.message;
   return;
  }

  if(data.user){
   await sb.from("profiles").upsert({
    id:data.user.id,
    full_name:name||email.split("@")[0]
   });
  }

  document.getElementById("authMsg").textContent=
   "Account তৈরি হয়েছে। Email verify প্রয়োজন হতে পারে।";
 }
}

async function logout(){
 await sb.auth.signOut();
}

function showHome(){
 document.getElementById("main").innerHTML=`
  <div id="storiesBox"></div>

  <div class="card composer">
   <div class="composer-row">
    <img class="avatar" src="${avatarURL(myProfile?.avatar_url,myProfile?.full_name)}">
    <div class="fake-input" onclick="openCreatePost()">
     ${esc(myProfile?.full_name||"আপনি")} কী ভাবছেন?
    </div>
   </div>

   <div class="action-row">
    <button class="action-btn" onclick="openCreatePost()">🖼️ Photo</button>
    <button class="action-btn" onclick="openCreateReel()">🎬 Reel</button>
    <button class="action-btn" onclick="openCreateStory()">⭕ Story</button>
   </div>
  </div>

  <div id="feed"></div>`;

 loadStories();
 loadFeed();

async function handleReelFile(file){
 if(!file)return;

 if(!file.type.startsWith("video/")){
  toast("শুধু video file দিন");
  return;
 }

 if(file.size>100*1024*1024){
  toast("ভিডিও 100MB-এর মধ্যে হতে হবে");
  return;
 }

 currentReelFile=file;

 if(currentReelVideoURL){
  URL.revokeObjectURL(currentReelVideoURL);
 }

 currentReelVideoURL=URL.createObjectURL(file);

 const video=document.getElementById("reelPreview");
 video.src=currentReelVideoURL;
 video.classList.remove("hidden");

 video.onloadedmetadata=()=>{
  if(video.duration>180){
   toast("Reel সর্বোচ্চ 180 seconds");
   video.removeAttribute("src");
   currentReelFile=null;
   return;
  }

  document.getElementById("coverArea").classList.remove("hidden");

  document.getElementById("reelVideoInfo").classList.remove("hidden");
  document.getElementById("reelVideoInfo").innerHTML=
   "⏱️ "+Math.round(video.duration)+" sec · "+
   video.videoWidth+"×"+video.videoHeight+" · "+
   (file.size/1024/1024).toFixed(1)+" MB";

  generateFrameThumbnails(video);
 };
}

function generateFrameThumbnails(video){
 const box=document.getElementById("reelFrames");
 if(!box)return;

 box.innerHTML="";
 currentReelFrames=[];

 const times=[
  .08,.25,.42,.60,.78
 ];

 times.forEach((ratio,i)=>{
  const c=document.createElement("canvas");
  c.width=360;
  c.height=640;

  const ctx=c.getContext("2d");

  const capture=()=>{
   const old=video.currentTime;
   video.currentTime=Math.min(
    video.duration*ratio,
    Math.max(0,video.duration-.1)
   );

   video.onseeked=()=>{
    const scale=Math.max(
     c.width/video.videoWidth,
     c.height/video.videoHeight
    );

    const w=video.videoWidth*scale;
    const h=video.videoHeight*scale;

    ctx.drawImage(
     video,
     (c.width-w)/2,
     (c.height-h)/2,
     w,
     h
    );

    const url=c.toDataURL("image/jpeg",.85);

    currentReelFrames[i]=url;

    const img=document.createElement("img");
    img.className="cover-thumb";
    img.src=url;
    img.onclick=()=>{
     document.querySelectorAll(".cover-thumb")
      .forEach(x=>x.classList.remove("active"));

     img.classList.add("active");

     fetch(url)
      .then(r=>r.blob())
      .then(blob=>{
       currentReelCover=new File(
        [blob],
        "reel-cover.jpg",
        {type:"image/jpeg"}
       );

       document.getElementById("coverPreview").src=url;
       document.getElementById("coverPreview")
        .classList.remove("hidden");
      });
    };

    box.appendChild(img);
    video.currentTime=old;
   };
  };

  setTimeout(capture,i*150);
 });
}

function generateReelCover(){
 if(!currentReelFile){
  toast("আগে ভিডিও দিন");
  return;
 }

 const video=document.getElementById("reelPreview");

 const canvas=document.createElement("canvas");
 canvas.width=720;
 canvas.height=1280;

 const ctx=canvas.getContext("2d");

 video.currentTime=Math.min(video.duration*.5,video.duration-.1);

 video.onseeked=()=>{
  const scale=Math.max(
   canvas.width/video.videoWidth,
   canvas.height/video.videoHeight
  );

  const w=video.videoWidth*scale;
  const h=video.videoHeight*scale;

  ctx.drawImage(
   video,
   (canvas.width-w)/2,
   (canvas.height-h)/2,
   w,
   h
  );

  canvas.toBlob(blob=>{
   currentReelCover=new File(
    [blob],
    "reel-cover.jpg",
    {type:"image/jpeg"}
   );

   const img=document.getElementById("coverPreview");
   img.src=URL.createObjectURL(blob);
   img.classList.remove("hidden");

   toast("Cover তৈরি হয়েছে");
  },"image/jpeg",.9);
 };
}

function uploadFileWithProgress(bucket,path,file,onProgress){
 return new Promise(async(resolve,reject)=>{
  try{
   const {data}=await sb.auth.getSession();

   const token=data.session?.access_token;

   if(!token){
    reject(new Error("Login session expired"));
    return;
   }

   const xhr=new XMLHttpRequest();
   currentUploadXHR=xhr;

   xhr.open(
    "POST",
    SUPABASE_URL+
    "/storage/v1/object/"+
    encodeURIComponent(bucket)+"/"+
    path.split("/").map(encodeURIComponent).join("/")
   );

   xhr.setRequestHeader("Authorization","Bearer "+token);
   xhr.setRequestHeader("apikey",SUPABASE_KEY);
   xhr.setRequestHeader("x-upsert","false");

   xhr.upload.onprogress=e=>{
    if(e.lengthComputable){
     onProgress(
      Math.round(e.loaded/e.total*100)
     );
    }
   };

   xhr.onload=()=>{
    currentUploadXHR=null;

    if(xhr.status>=200&&xhr.status<300){
     resolve();
    }else{
     reject(new Error(xhr.responseText||"Upload failed"));
    }
   };

   xhr.onerror=()=>{
    currentUploadXHR=null;
    reject(new Error("Upload failed"));
   };

   xhr.onabort=()=>{
    currentUploadXHR=null;
    reject(new Error("UPLOAD_CANCELLED"));
   };

   currentUploadPaths.push(path);

   xhr.send(file);
  }catch(e){
   reject(e);
  }
 });
}

  toast("ভিডিও নির্বাচন করুন");
  return;
 }

 const btn=document.getElementById("publishReelBtn");

 document.getElementById("reelProgressArea")
  .classList.remove("hidden");

 currentUploadPaths=[];

 const caption=document.getElementById("reelCaption").value.trim();

 const musicUrl=document.getElementById("reelMusicUrl").value.trim();

 const audience=document.getElementById("reelAudience").value;

 const duration=document.getElementById("reelPreview").duration;
 const width=document.getElementById("reelPreview").videoWidth;
 const height=document.getElementById("reelPreview").videoHeight;

 let videoPath=null;
 let coverPath=null;

 try{
  const stamp=Date.now();

  videoPath=
   me.id+"/"+stamp+"-"+safeFileName(currentReelFile.name);

  updateReelProgress(0,"ভিডিও upload হচ্ছে");

  await uploadFileWithProgress(
   "reels",
   videoPath,
   currentReelFile,
   p=>updateReelProgress(p,"ভিডিও upload হচ্ছে")
  );

  let coverUrl=null;

  if(currentReelCover){
   coverPath=
    me.id+"/covers/"+stamp+"-cover.jpg";

   updateReelProgress(0,"Cover upload হচ্ছে");

   await uploadFileWithProgress(
    "reels",
    coverPath,
    currentReelCover,
    p=>updateReelProgress(p,"Cover upload হচ্ছে")
   );

   coverUrl=publicStorageURL("reels",coverPath);
  }

  const videoUrl=publicStorageURL("reels",videoPath);

  updateReelProgress(100,"Reel তৈরি হচ্ছে");

  const finalCaption=
   caption+
   (hashtags?"\n\n"+hashtags:"");

  const {data:reel,error:reelError}=await sb
   .from("reels")
   .insert({
    user_id:me.id,
    video_url:videoUrl,
    caption:finalCaption,
    created_at:new Date().toISOString(),
    views:0
   })
   .select("id")
   .single();

  if(reelError)throw reelError;

  const {error:settingsError}=await sb
   .from("fb_reel_settings")
   .upsert({
    reel_id:reel.id,
    user_id:me.id,
    video_path:videoPath,
    cover_path:coverPath,
    cover_url:coverUrl,
    music_url:musicUrl||null,
    music_name:musicName||null,
    location:location||null,
    hashtags:hashtags||null,
    audience,
    comments_enabled:switchOn("swComments"),
    reactions_enabled:switchOn("swReactions"),
    shares_enabled:switchOn("swShares"),
    duration,
    width,
    height,
    updated_at:new Date().toISOString()
   });

  if(settingsError){
   await sb.from("reels").delete().eq("id",reel.id);
   await deleteStorageFile("reels",videoPath);
   if(coverPath)await deleteStorageFile("reels",coverPath);
   throw settingsError;

  closeModal();

  currentReelFile=null;
  currentReelCover=null;
  currentReelVideoURL=null;

  toast("🎉 Reel published successfully");

  setTimeout(()=>openReels(),400);

 }catch(error){

   toast("Upload cancelled");
  }else{
   console.error(error);
   toast(error.message||"Reel upload failed");

  btn.disabled=false;
 }
}

function setupReelObserver(){
 const page=document.getElementById("reelPage");
 if(!page)return;

 const videos=page.querySelectorAll("video");

 const observer=new IntersectionObserver(entries=>{
  entries.forEach(entry=>{
   const video=entry.target;

   if(entry.isIntersecting && entry.intersectionRatio>.65){
    videos.forEach(v=>{
     if(v!==video)v.pause();
    });

    video.play().catch(()=>{});

    incrementReelView(
     Number(video.closest(".reel").dataset.reelId)
    );
   }else{
    video.pause();
   }
  });
 },{
  root:page,
  threshold:[.65]
 });

 videos.forEach(v=>observer.observe(v));
}

function toggleReelSound(video){
 if(!video)return;

 video.muted=!video.muted;

 const section=video.closest(".reel");
 const btn=section?.querySelector(".reel-sound");

 if(btn)btn.textContent=video.muted?"🔇":"🔊";
}

async function toggleReelLike(id,button){
 const {data}=await sb
  .from("fb_reel_reactions")

  .maybeSingle();

  await sb.from("fb_reel_reactions")
   .delete()
   .eq("reel_id",id)
   .eq("user_id",me.id);
 }else{
  await sb.from("fb_reel_reactions")
   .insert({
    reel_id:id,
    user_id:me.id,
    reaction:"like"
   });
 }

 const r=currentReels.find(x=>x.id===id);

 if(r){
  if(data){
   r.myReaction=null;
   r.reactionCount=Math.max(0,r.reactionCount-1);

   r.myReaction={reaction:"like"};
   r.reactionCount++;

   (r.myReaction?"❤️":"🤍")+
   "<small>"+r.reactionCount+"</small>";
 }
}

function toggleDark(){

 localStorage.setItem(
  "friendbook_dark",

 );
}

function toggleAmoled(){
 document.body.classList.toggle("amoled");
 localStorage.setItem(
  "friendbook_amoled",
  document.body.classList.contains("amoled")
 );
}

function editMyProfile(){
 openModal("✏️ Edit Profile",`
  <div class="field">
   <label>Name</label>
   <input id="editName"
    value="${esc(myProfile?.full_name||"")}">
  </div>

  <div class="field">
   <label>Bio</label>
   <textarea id="editBio">${esc(myProfile?.bio||"")}</textarea>
  </div>

  <div class="field">
   <label>Avatar</label>
   <input id="avatarFile" type="file" accept="image/*">
  </div>

  <div class="field">
   <label>Cover</label>
   <input id="coverFile" type="file" accept="image/*">
  </div>

  <button class="btn"
   style="width:100%"
   onclick="saveProfile()">Save</button>
 `);
}

async function saveProfile(){
 const full_name=document.getElementById("editName").value.trim();
 const bio=document.getElementById("editBio").value.trim();

 let avatar_url=myProfile?.avatar_url||null;
 let cover_url=myProfile?.cover_url||null;

 const avatar=document.getElementById("avatarFile").files[0];
 const cover=document.getElementById("coverFile").files[0];

 if(avatar){
  const path=me.id+"/avatar-"+Date.now()+"-"+safeFileName(avatar.name);

  const {error}=await sb.storage.from("avatars")
   .upload(path,avatar,{upsert:false});

  if(error)return toast(error.message);

  avatar_url=
   sb.storage.from("avatars").getPublicUrl(path).data.publicUrl;
 }

 if(cover){
  const path=me.id+"/cover-"+Date.now()+"-"+safeFileName(cover.name);

  const {error}=await sb.storage.from("avatars")
   .upload(path,cover,{upsert:false});

  if(error)return toast(error.message);

  cover_url=
   sb.storage.from("avatars").getPublicUrl(path).data.publicUrl;
 }

 const {error}=await sb.from("profiles")
  .upsert({
   id:me.id,
   full_name,
   bio,
   avatar_url,
   cover_url
  });

 if(error)return toast(error.message);

 await loadMyProfile();

 closeModal();
 openProfile(me.id);
 toast("Profile updated");
}

async function openBlockedUsers(){
 const {data}=await sb.from("fb_blocks")
  .select("*")
  .eq("blocker_id",me.id);

 let html="";

 for(const b of data||[]){
  const {data:p}=await sb.from("profiles")
   .select("*")
   .eq("id",b.blocked_id)
   .maybeSingle();

  html+=`
   <div class="list-item">
    <img class="avatar"
     src="${avatarURL(p?.avatar_url,p?.full_name)}">

    <div class="list-main">
     ${esc(p?.full_name||"User")}
    </div>

    <button class="btn"
     onclick="unblockUser('${b.id}')">
     Unblock
    </button>
   </div>`;
 }

 openModal(
  "🚫 Blocked Users",
  html||'<div class="empty">No blocked users</div>'
 );
}

async function unblockUser(id){
 await sb.from("fb_blocks").delete().eq("id",id);
 closeModal();
 openBlockedUsers();
}

async function loadOnlineFriends(){
 const box=document.getElementById("onlineFriends");
 if(!box)return;

 const {data}=await sb
  .from("profiles")
  .select("id,full_name,avatar_url,last_seen")
  .neq("id",me.id)
  .order("last_seen",{ascending:false})
  .limit(8);

 box.innerHTML=(data||[]).map(p=>`
  <div class="list-item"
   style="padding:7px 0;border:0"
   onclick="openProfile('${p.id}')">

   <img class="avatar"
    style="width:35px;height:35px"
    src="${avatarURL(p.avatar_url,p.full_name)}">

   <div class="list-main">
    <b>${esc(p.full_name||"User")}</b>
    <div style="font-size:11px;color:var(--muted)">
     ${p.last_seen?"Recently active":"Offline"}
    </div>
   </div>
  </div>`).join("");
}

async function updateLastSeen(){
 try{
  await sb.from("profiles")
   .update({last_seen:new Date().toISOString()})
   .eq("id",me.id);
 }catch(e){}
}
