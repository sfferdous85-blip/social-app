<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Social App</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f0f2f5;
    color:#111;
}

button{
    cursor:pointer;
}

.header{
    display:none;
    position:sticky;
    top:0;
    z-index:100;
    background:#1877f2;
    color:white;
    padding:12px 15px;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:22px;
    font-weight:bold;
}

.header button{
    border:0;
    background:white;
    color:#1877f2;
    padding:8px 12px;
    border-radius:6px;
    font-weight:bold;
}

.container{
    max-width:700px;
    margin:20px auto;
    padding:0 10px;
}

.card{
    background:white;
    border-radius:10px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 1px 4px rgba(0,0,0,.12);
}

.auth{
    max-width:400px;
    margin:60px auto;
    padding:20px;
}

.auth h1{
    text-align:center;
    color:#1877f2;
}

input,
textarea{
    width:100%;
    padding:12px;
    margin:7px 0;
    border:1px solid #ddd;
    border-radius:7px;
    font-size:15px;
}

textarea{
    min-height:90px;
    resize:vertical;
}

.primary{
    width:100%;
    border:0;
    background:#1877f2;
    color:white;
    padding:12px;
    border-radius:7px;
    font-size:16px;
    font-weight:bold;
    margin-top:8px;
}

.secondary{
    width:100%;
    border:0;
    background:#42b72a;
    color:white;
    padding:12px;
    border-radius:7px;
    font-size:16px;
    font-weight:bold;
    margin-top:8px;
}

.friend-button{
    border:0;
    background:#1877f2;
    color:white;
    padding:9px 14px;
    border-radius:6px;
    font-weight:bold;
}

.accept-button{
    border:0;
    background:#42b72a;
    color:white;
    padding:9px 14px;
    border-radius:6px;
    font-weight:bold;
}

.reject-button,
.remove-button{
    border:0;
    background:#eee;
    color:#333;
    padding:9px 14px;
    border-radius:6px;
    font-weight:bold;
}

.link{
    color:#1877f2;
    text-align:center;
    display:block;
    margin-top:15px;
    cursor:pointer;
}

.profile{
    overflow:hidden;
    padding:0;
}

.cover{
    width:100%;
    height:200px;
    background:#ddd;
    object-fit:cover;
}

.profile-info{
    text-align:center;
    padding:15px;
}

.profile-photo{
    width:110px;
    height:110px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid white;
    margin-top:-65px;
    background:#ddd;
}

.profile-name{
    font-size:23px;
    font-weight:bold;
    margin-top:8px;
}

.small{
    color:#666;
    font-size:14px;
}

.post-user{
    display:flex;
    align-items:center;
    gap:10px;
}

.post-user img{
    width:45px;
    height:45px;
    border-radius:50%;
    object-fit:cover;
}

.post-name{
    font-weight:bold;
}

.post-date{
    color:#777;
    font-size:12px;
}

.post-text{
    margin:15px 0;
    white-space:pre-wrap;
    word-break:break-word;
}

.post-image{
    width:100%;
    max-height:600px;
    object-fit:contain;
    border-radius:8px;
    background:#eee;
}

.actions{
    display:flex;
    gap:5px;
    border-top:1px solid #eee;
    margin-top:12px;
    padding-top:8px;
}

.actions button{
    flex:1;
    border:0;
    background:#f0f2f5;
    padding:10px;
    border-radius:6px;
    font-weight:bold;
}

.comment-box{
    display:none;
    margin-top:10px;
}

.comment{
    background:#f0f2f5;
    padding:8px;
    border-radius:8px;
    margin-top:5px;
}

.user-result{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px;
    border-bottom:1px solid #eee;
}

.user-result img{
    width:50px;
    height:50px;
    border-radius:50%;
    object-fit:cover;
    background:#ddd;
}

.user-result-info{
    flex:1;
}

.user-result-name{
    font-weight:bold;
    font-size:16px;
}

.request-item,
.friend-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 0;
    border-bottom:1px solid #eee;
}

.request-item img,
.friend-item img{
    width:50px;
    height:50px;
    border-radius:50%;
    object-fit:cover;
}

.request-info,
.friend-info{
    flex:1;
}

.request-name,
.friend-name{
    font-weight:bold;
}

.request-buttons{
    display:flex;
    gap:5px;
    flex-wrap:wrap;
}

.hidden{
    display:none !important;
}

.message{
    text-align:center;
    margin-top:10px;
    font-weight:bold;
}

.file-label{
    display:block;
    background:#f0f2f5;
    padding:12px;
    border-radius:7px;
    margin:7px 0;
    text-align:center;
    cursor:pointer;
}

hr{
    border:0;
    border-top:1px solid #eee;
    margin:15px 0;
}

.loading{
    text-align:center;
    padding:20px;
    color:#666;
}

.empty{
    text-align:center;
    color:#777;
    padding:15px;
}

@media(max-width:600px){

    .container{
        margin:10px auto;
    }

    .cover{
        height:150px;
    }

    .profile-photo{
        width:95px;
        height:95px;
    }

    .actions button{
        font-size:12px;
        padding:9px 4px;
    }

}

</style>

</head>

<body>


<!-- ================= AUTH ================= -->

<div id="authPage">

    <div class="card auth">

        <h1>My Social App</h1>

        <div id="loginBox">

            <h2>Login</h2>

            <input
                type="email"
                id="loginEmail"
                placeholder="Email"
            >

            <input
                type="password"
                id="loginPassword"
                placeholder="Password"
            >

            <button
                class="primary"
                onclick="login()"
            >
                Login
            </button>

            <div
                class="link"
                onclick="showRegister()"
            >
                Create new account
            </div>

            <div
                id="loginMessage"
                class="message"
            ></div>

        </div>


        <div
            id="registerBox"
            class="hidden"
        >

            <h2>Create Account</h2>

            <input
                type="text"
                id="registerName"
                placeholder="Your name"
            >

            <input
                type="email"
                id="registerEmail"
                placeholder="Email"
            >

            <input
                type="password"
                id="registerPassword"
                placeholder="Password"
            >

            <button
                class="secondary"
                onclick="register()"
            >
                Create Account
            </button>

            <div
                class="link"
                onclick="showLogin()"
            >
                Already have an account? Login
            </div>

            <div
                id="registerMessage"
                class="message"
            ></div>

        </div>

    </div>

</div>


<!-- ================= HEADER ================= -->

<div
    id="appHeader"
    class="header"
>

    <div class="logo">
        My Social App
    </div>

    <button onclick="logout()">
        Logout
    </button>

</div>


<!-- ================= APP ================= -->

<div
    id="appPage"
    class="container hidden"
>


    <!-- PROFILE -->

    <div class="card profile">

        <img
            id="coverPhoto"
            class="cover"
            src=""
            alt="Cover"
        >

        <div class="profile-info">

            <img
                id="profilePhoto"
                class="profile-photo"
                src=""
                alt="Profile"
            >

            <div
                id="profileName"
                class="profile-name"
            >
                User
            </div>

            <div
                id="profileBio"
                class="small"
            >
                Welcome!
            </div>

        </div>

    </div>


    <!-- PROFILE EDIT -->

    <div class="card">

        <h3>✏️ Edit Profile</h3>

        <input
            id="editName"
            placeholder="Name"
        >

        <input
            id="editBio"
            placeholder="Bio"
        >

        <label class="file-label">
            📷 Select Profile Photo
            <input
                type="file"
                id="profileImage"
                accept="image/*"
                hidden
            >
        </label>

        <label class="file-label">
            🖼️ Select Cover Photo
            <input
                type="file"
                id="coverImage"
                accept="image/*"
                hidden
            >
        </label>

        <button
            class="primary"
            onclick="updateProfile()"
        >
            Save Profile
        </button>

        <div
            id="profileMessage"
            class="message"
        ></div>

    </div>


    <!-- ================= FRIEND SEARCH ================= -->

    <div class="card">

        <h3>👥 Find Friends</h3>

        <input
            id="userSearchInput"
            placeholder="Search people by name..."
        >

        <button
            class="primary"
            onclick="searchUsers()"
        >
            🔍 Search
        </button>

        <div id="searchResults"></div>

    </div>


    <!-- ================= FRIEND REQUESTS ================= -->

    <div class="card">

        <h3>📨 Friend Requests</h3>

        <div id="friendRequests">

            <div class="loading">
                Loading...
            </div>

        </div>

    </div>


    <!-- ================= FRIENDS ================= -->

    <div class="card">

        <h3>👫 My Friends</h3>

        <div id="friendsList">

            <div class="loading">
                Loading...
            </div>

        </div>

    </div>


    <!-- CREATE POST -->

    <div class="card">

        <h3>📝 Create Post</h3>

        <textarea
            id="postText"
            placeholder="What's on your mind?"
        ></textarea>

        <label class="file-label">
            📷 Add Photo
            <input
                type="file"
                id="postImage"
                accept="image/*"
                hidden
            >
        </label>

        <button
            class="primary"
            onclick="createPost()"
        >
            Post
        </button>

        <div
            id="postMessage"
            class="message"
        ></div>

    </div>


    <!-- FEED -->

    <h2>🏠 Home Feed</h2>

    <div id="feed">

        <div class="loading">
            Loading posts...
        </div>

    </div>

</div>


<script>


/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://skereuaizdczbvjplisi.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_3R2otJA1zIlsMsTYxe1ocw_NAPY5O9x";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);

let currentUser = null;


/* =====================================================
   DEFAULT IMAGES
===================================================== */

const DEFAULT_PROFILE =
"https://via.placeholder.com/200?text=Profile";

const DEFAULT_COVER =
"https://via.placeholder.com/900x250?text=Cover";


/* =====================================================
   AUTH PAGE
===================================================== */

function showRegister(){

    document.getElementById("loginBox")
        .classList.add("hidden");

    document.getElementById("registerBox")
        .classList.remove("hidden");

}


function showLogin(){

    document.getElementById("registerBox")
        .classList.add("hidden");

    document.getElementById("loginBox")
        .classList.remove("hidden");

}


/* =====================================================
   REGISTER
===================================================== */

async function register(){

    const name =
        document.getElementById("registerName")
        .value.trim();

    const email =
        document.getElementById("registerEmail")
        .value.trim();

    const password =
        document.getElementById("registerPassword")
        .value;

    const message =
        document.getElementById("registerMessage");


    if(!name || !email || !password){

        message.style.color="red";
        message.innerText="সব তথ্য পূরণ করুন।";
        return;

    }


    if(password.length < 6){

        message.style.color="red";
        message.innerText="Password কমপক্ষে ৬ অক্ষরের হতে হবে।";
        return;

    }


    message.style.color="#1877f2";
    message.innerText="Account তৈরি হচ্ছে...";


    const {
        data,
        error
    } =
    await supabaseClient.auth.signUp({

        email:email,
        password:password

    });


    if(error){

        message.style.color="red";
        message.innerText=error.message;
        return;

    }


    if(!data.user){

        message.style.color="red";
        message.innerText="Account তৈরি হয়নি।";
        return;

    }


    const {
        error:profileError
    } =
    await supabaseClient
    .from("profiles")
    .upsert({

        id:data.user.id,
        name:name,
        bio:"",
        profile_photo:"",
        cover_photo:""

    });


    if(profileError){

        console.error(profileError);

        message.style.color="red";

        message.innerText =
        "Profile তৈরি হয়নি: " +
        profileError.message;

        return;

    }


    message.style.color="green";

    message.innerText =
    "Account তৈরি হয়েছে। এখন Login করুন।";

}


/* =====================================================
   LOGIN
===================================================== */

async function login(){

    const email =
        document.getElementById("loginEmail")
        .value.trim();

    const password =
        document.getElementById("loginPassword")
        .value;

    const message =
        document.getElementById("loginMessage");


    if(!email || !password){

        message.style.color="red";

        message.innerText =
        "Email এবং Password দিন।";

        return;

    }


    message.style.color="#1877f2";

    message.innerText =
    "Login হচ্ছে...";


    const {
        data,
        error
    } =
    await supabaseClient.auth.signInWithPassword({

        email:email,
        password:password

    });


    if(error){

        message.style.color="red";

        message.innerText =
        error.message;

        return;

    }


    currentUser =
        data.user;

    startApp();

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

    await supabaseClient.auth.signOut();

    currentUser=null;

    document
        .getElementById("appPage")
        .classList.add("hidden");

    document
        .getElementById("appHeader")
        .style.display="none";

    document
        .getElementById("authPage")
        .style.display="block";

}


/* =====================================================
   SESSION
===================================================== */

async function checkSession(){

    const {
        data
    } =
    await supabaseClient.auth.getSession();


    if(
        data &&
        data.session &&
        data.session.user
    ){

        currentUser =
        data.session.user;

        startApp();

    }

}


/* =====================================================
   AUTH STATE
===================================================== */

supabaseClient.auth.onAuthStateChange(

    function(event,session){

        if(
            session &&
            session.user
        ){

            currentUser =
            session.user;

        }

    }

);


/* =====================================================
   START APP
===================================================== */

async function startApp(){

    document
        .getElementById("authPage")
        .style.display="none";

    document
        .getElementById("appHeader")
        .style.display="flex";

    document
        .getElementById("appPage")
        .classList.remove("hidden");


    await loadProfile();

    await loadFriends();

    await loadFriendRequests();

    await loadFeed();

}


/* =====================================================
   UPLOAD MEDIA
===================================================== */

async function uploadMedia(file,folder){

    if(!file || !currentUser){

        return "";

    }


    const extension =
        file.name
        .split(".")
        .pop()
        .toLowerCase();


    const fileName =
        folder +
        "/" +
        currentUser.id +
        "_" +
        Date.now() +
        "." +
        extension;


    const {
        error
    } =
    await supabaseClient
    .storage
    .from("media")
    .upload(

        fileName,
        file,

        {
            cacheControl:"3600",
            upsert:false
        }

    );


    if(error){

        console.error(
            "UPLOAD ERROR:",
            error
        );

        return "";

    }


    const {
        data
    } =
    supabaseClient
    .storage
    .from("media")
    .getPublicUrl(fileName);


    return data.publicUrl;

}


/* =====================================================
   LOAD PROFILE
===================================================== */

async function loadProfile(){

    if(!currentUser){

        return;

    }


    let {
        data,
        error
    } =
    await supabaseClient
    .from("profiles")
    .select("*")
    .eq(
        "id",
        currentUser.id
    )
    .maybeSingle();


    if(error){

        console.error(
            "PROFILE ERROR:",
            error
        );

        return;

    }


    if(!data){

        const result =
        await supabaseClient
        .from("profiles")
        .insert({

            id:currentUser.id,

            name:
            currentUser.email
            ? currentUser.email.split("@")[0]
            : "User",

            bio:"",
            profile_photo:"",
            cover_photo:""

        })
        .select()
        .single();


        if(result.error){

            console.error(
                result.error
            );

            return;

        }


        data=result.data;

    }


    document
        .getElementById("profileName")
        .innerText =
        data.name || "User";


    document
        .getElementById("profileBio")
        .innerText =
        data.bio || "Welcome!";


    document
        .getElementById("editName")
        .value =
        data.name || "";


    document
        .getElementById("editBio")
        .value =
        data.bio || "";


    document
        .getElementById("profilePhoto")
        .src =
        data.profile_photo ||
        DEFAULT_PROFILE;


    document
        .getElementById("coverPhoto")
        .src =
        data.cover_photo ||
        DEFAULT_COVER;

}


/* =====================================================
   UPDATE PROFILE
===================================================== */

async function updateProfile(){

    if(!currentUser){

        return;

    }


    const message =
        document.getElementById("profileMessage");


    message.style.color="#1877f2";

    message.innerText =
    "Profile save হচ্ছে...";


    const name =
        document.getElementById("editName")
        .value.trim();


    const bio =
        document.getElementById("editBio")
        .value.trim();


    let profilePhoto="";

    let coverPhoto="";


    const profileFile =
        document.getElementById("profileImage")
        .files[0];


    const coverFile =
        document.getElementById("coverImage")
        .files[0];


    if(profileFile){

        profilePhoto =
        await uploadMedia(
            profileFile,
            "profiles"
        );


        if(!profilePhoto){

            message.style.color="red";

            message.innerText =
            "Profile photo upload হয়নি।";

            return;

        }

    }


    if(coverFile){

        coverPhoto =
        await uploadMedia(
            coverFile,
            "covers"
        );


        if(!coverPhoto){

            message.style.color="red";

            message.innerText =
            "Cover photo upload হয়নি।";

            return;

        }

    }


    const updateData={
        name:name,
        bio:bio
    };


    if(profilePhoto){

        updateData.profile_photo =
        profilePhoto;

    }


    if(coverPhoto){

        updateData.cover_photo =
        coverPhoto;

    }


    const {
        error
    } =
    await supabaseClient
    .from("profiles")
    .update(updateData)
    .eq(
        "id",
        currentUser.id
    );


    if(error){

        message.style.color="red";

        message.innerText =
        error.message;

        return;

    }


    message.style.color="green";

    message.innerText =
    "Profile updated!";


    document.getElementById("profileImage")
        .value="";

    document.getElementById("coverImage")
        .value="";


    await loadProfile();

}


/* =====================================================
   SEARCH USERS
===================================================== */

async function searchUsers(){

    const input =
        document
        .getElementById("userSearchInput");

    const results =
        document
        .getElementById("searchResults");


    const query =
        input.value.trim();


    if(!query){

        results.innerHTML =
        '<div class="empty">নাম লিখে Search করুন।</div>';

        return;

    }


    results.innerHTML =
    '<div class="loading">Searching...</div>';


    const {
        data:users,
        error
    } =
    await supabaseClient
    .from("profiles")
    .select("*")
    .ilike(
        "name",
        "%" + query + "%"
    )
    .neq(
        "id",
        currentUser.id
    )
    .limit(20);


    if(error){

        results.innerHTML =
        '<div class="empty">Search Error: ' +
        escapeHtml(error.message) +
        '</div>';

        return;

    }


    if(!users || users.length===0){

        results.innerHTML =
        '<div class="empty">কোনো User পাওয়া যায়নি।</div>';

        return;

    }


    results.innerHTML="";


    for(const user of users){

        const div =
        document.createElement("div");

        div.className="user-result";


        const photo =
        user.profile_photo ||
        DEFAULT_PROFILE;


        div.innerHTML=`

            <img src="${escapeHtml(photo)}">

            <div class="user-result-info">

                <div class="user-result-name">
                    ${escapeHtml(user.name || "User")}
                </div>

                <div class="small">
                    ${escapeHtml(user.bio || "")}
                </div>

            </div>

            <div id="user-action-${user.id}">
                Loading...
            </div>

        `;


        results.appendChild(div);


        await showUserAction(
            user.id
        );

    }

}


/* =====================================================
   SHOW USER ACTION
===================================================== */

async function showUserAction(userId){

    const box =
        document.getElementById(
            "user-action-" + userId
        );


    if(!box){

        return;

    }


    const {
        data:friend
    } =
    await supabaseClient
    .from("friends")
    .select("id")
    .eq(
        "user_id",
        currentUser.id
    )
    .eq(
        "friend_id",
        userId
    )
    .maybeSingle();


    if(friend){

        box.innerHTML =
        '<button class="remove-button" onclick="removeFriend(\'' +
        userId +
        '\')">✓ Friend</button>';

        return;

    }


    const {
        data:sent
    } =
    await supabaseClient
    .from("friend_requests")
    .select("id,status")
    .eq(
        "sender_id",
        currentUser.id
    )
    .eq(
        "receiver_id",
        userId
    )
    .eq(
        "status",
        "pending"
    )
    .maybeSingle();


    if(sent){

        box.innerHTML =
        '<button class="reject-button" disabled>Request Sent</button>';

        return;

    }


    const {
        data:received
    } =
    await supabaseClient
    .from("friend_requests")
    .select("id,status")
    .eq(
        "sender_id",
        userId
    )
    .eq(
        "receiver_id",
        currentUser.id
    )
    .eq(
        "status",
        "pending"
    )
    .maybeSingle();


    if(received){

        box.innerHTML =
        '<button class="accept-button" onclick="acceptRequest(' +
        received.id +
        ',\'' +
        userId +
        '\')">Accept</button>';

        return;

    }


    box.innerHTML =
    '<button class="friend-button" onclick="sendFriendRequest(\'' +
    userId +
    '\')">➕ Add Friend</button>';

}


/* =====================================================
   SEND FRIEND REQUEST
===================================================== */

async function sendFriendRequest(receiverId){

    if(!currentUser){

        alert("আগে Login করুন।");

        return;

    }


    if(receiverId === currentUser.id){

        return;

    }


    const {
        data:existing
    } =
    await supabaseClient
    .from("friend_requests")
    .select("id,status")
    .or(
        "and(sender_id.eq." +
        currentUser.id +
        ",receiver_id.eq." +
        receiverId +
        "),and(sender_id.eq." +
        receiverId +
        ",receiver_id.eq." +
        currentUser.id +
        ")"
    )
    .eq(
        "status",
        "pending"
    );


    if(existing && existing.length>0){

        alert("Friend Request already আছে।");

        return;

    }


    const {
        error
    } =
    await supabaseClient
    .from("friend_requests")
    .insert({

        sender_id:currentUser.id,

        receiver_id:receiverId,

        status:"pending"

    });


    if(error){

        alert(
            "Request Error: " +
            error.message
        );

        return;

    }


    alert(
        "Friend Request পাঠানো হয়েছে ✅"
    );


    await searchUsers();

    await loadFriendRequests();

}


/* =====================================================
   LOAD FRIEND REQUESTS
===================================================== */

async function loadFriendRequests(){

    const box =
        document.getElementById(
            "friendRequests"
        );


    if(!box || !currentUser){

        return;

    }


    box.innerHTML =
    '<div class="loading">Loading...</div>';


    const {
        data:requests,
        error
    } =
    await supabaseClient
    .from("friend_requests")
    .select("*")
    .eq(
        "receiver_id",
        currentUser.id
    )
    .eq(
        "status",
        "pending"
    )
    .order(
        "created_at",
        {
            ascending:false
        }
    );


    if(error){

        box.innerHTML =
        '<div class="empty">Request Error: ' +
        escapeHtml(error.message) +
        '</div>';

        return;

    }


    if(!requests || requests.length===0){

        box.innerHTML =
        '<div class="empty">কোনো Friend Request নেই।</div>';

        return;

    }


    box.innerHTML="";


    for(const request of requests){

        const {
            data:user
        } =
        await supabaseClient
        .from("profiles")
        .select("*")
        .eq(
            "id",
            request.sender_id
        )
        .maybeSingle();


        if(!user){

            continue;

        }


        const div =
        document.createElement("div");

        div.className="request-item";


        const photo =
        user.profile_photo ||
        DEFAULT_PROFILE;


        div.innerHTML=`

            <img src="${escapeHtml(photo)}">

            <div class="request-info">

                <div class="request-name">
                    ${escapeHtml(user.name || "User")}
                </div>

                <div class="small">
                    wants to be your friend
                </div>

            </div>

            <div class="request-buttons">

                <button
                    class="accept-button"
                    onclick="acceptRequest(
                        ${request.id},
                        '${user.id}'
                    )"
                >
                    Accept
                </button>

                <button
                    class="reject-button"
                    onclick="rejectRequest(${request.id})"
                >
                    Reject
                </button>

            </div>

        `;


        box.appendChild(div);

    }

}


/* =====================================================
   ACCEPT REQUEST
===================================================== */

async function acceptRequest(
    requestId,
    senderId
){

    if(!currentUser){

        return;

    }


    const {
        error:updateError
    } =
    await supabaseClient
    .from("friend_requests")
    .update({
        status:"accepted"
    })
    .eq(
        "id",
        requestId
    )
    .eq(
        "receiver_id",
        currentUser.id
    );


    if(updateError){

        alert(
            "Accept Error: " +
            updateError.message
        );

        return;

    }


    const {
        error:friendError
    } =
    await supabaseClient
    .from("friends")
    .insert([

        {
            user_id:currentUser.id,
            friend_id:senderId
        },

        {
            user_id:senderId,
            friend_id:currentUser.id
        }

    ]);


    if(friendError){

        alert(
            "Friend তৈরি Error: " +
            friendError.message
        );

        return;

    }


    alert(
        "Friend Request accepted ✅"
    );


    await loadFriendRequests();

    await loadFriends();

}

/* =====================================================
   LOAD FRIENDS
===================================================== */

async function loadFriends(){

    const box =
        document.getElementById(
            "friendsList"
        );


    if(!box || !currentUser){

        return;

    }


    box.innerHTML =
    '<div class="loading">Loading...</div>';


    const {
        data:friends,
        error
    } =
    await supabaseClient
    .from("friends")
    .select("*")
    .or(
        "user_id.eq." +
        currentUser.id +
        ",friend_id.eq." +
        currentUser.id
    );


    if(error){

        box.innerHTML =
        '<div class="empty">Friends Error: ' +
        escapeHtml(error.message) +
        '</div>';

        return;

    }


    if(!friends || friends.length===0){

        box.innerHTML =
        '<div class="empty">এখনো কোনো Friend নেই।</div>';

        return;

    }


    box.innerHTML="";


    const added = new Set();


    for(const friendship of friends){

        const friendId =
            friendship.user_id === currentUser.id
            ? friendship.friend_id
            : friendship.user_id;


        if(added.has(friendId)){

            continue;

        }


        added.add(friendId);


        const {
            data:user
        } =
        await supabaseClient
        .from("profiles")
        .select("*")
        .eq(
            "id",
            friendId
        )
        .maybeSingle();


        if(!user){

            continue;

        }


        const div =
        document.createElement("div");

        div.className="friend-item";


        const photo =
        user.profile_photo ||
        DEFAULT_PROFILE;


        div.innerHTML=`

            <img src="${escapeHtml(photo)}">

            <div class="friend-info">

                <div class="friend-name">
                    ${escapeHtml(user.name || "User")}
                </div>

                <div class="small">
                    ${escapeHtml(user.bio || "")}
                </div>

            </div>

            <button
                class="remove-button"
                onclick="removeFriend('${user.id}')"
            >
                Remove
            </button>

        `;


        box.appendChild(div);

    }

}


/* =====================================================
   REMOVE FRIEND
===================================================== */

async function removeFriend(friendId){

    const ok =
        confirm(
            "এই Friend-কে Remove করবেন?"
        );


    if(!ok){

        return;

    }


    const first =
    await supabaseClient
    .from("friends")
    .delete()
    .eq(
        "user_id",
        currentUser.id
    )
    .eq(
        "friend_id",
        friendId
    );


    if(first.error){

        alert(
            "Remove Error: " +
            first.error.message
        );

        return;

    }


    const second =
    await supabaseClient
    .from("friends")
    .delete()
    .eq(
        "user_id",
        friendId
    )
    .eq(
        "friend_id",
        currentUser.id
    );


    if(second.error){

        alert(
            "Remove Error: " +
            second.error.message
        );

        return;

    }


    alert(
        "Friend Remove হয়েছে।"
    );


    await loadFriends();

    await searchUsersIfNeeded();

}

/* =====================================================
   CREATE POST
===================================================== */

async function createPost(){

    const message =
        document.getElementById(
            "postMessage"
        );


    message.style.color="#1877f2";

    message.innerText =
    "Post হচ্ছে...";


    const {
        data:userData,
        error:userError
    } =
    await supabaseClient.auth.getUser();


    if(
        userError ||
        !userData ||
        !userData.user
    ){

        message.style.color="red";

        message.innerText =
        "আপনি Login অবস্থায় নেই। আবার Login করুন।";

        return;

    }


    const user =
    userData.user;


    currentUser=user;


    const text =
        document
        .getElementById("postText")
        .value.trim();


    const file =
        document
        .getElementById("postImage")
        .files[0];


    if(!text && !file){

        message.style.color="red";

        message.innerText =
        "Post-এ কিছু লিখুন অথবা ছবি দিন।";

        return;

    }


    let imageUrl="";


    if(file){

        imageUrl =
        await uploadMedia(
            file,
            "posts"
        );


        if(!imageUrl){

            message.style.color="red";

            message.innerText =
            "ছবি upload হয়নি।";

            return;

        }

    }


    const {
        data:postData,
        error:postError
    } =
    await supabaseClient
    .from("posts")
    .insert({

        user_id:user.id,
        text:text,
        image_url:imageUrl

    })
    .select()
    .single();


    if(postError){

        console.error(
            "POST ERROR:",
            postError
        );

        message.style.color="red";

        message.innerText =
        "Post Error: " +
        postError.message;

        return;

    }


    console.log(
        "POST SUCCESS:",
        postData
    );


    document
        .getElementById("postText")
        .value="";

    document
        .getElementById("postImage")
        .value="";


    message.style.color="green";

    message.innerText =
    "Post published successfully!";


    await loadFeed();

}


/* =====================================================
   LOAD FEED
===================================================== */

async function loadFeed(){

    const feed =
        document.getElementById("feed");


    feed.innerHTML =
    '<div class="loading">Loading posts...</div>';


    const {
        data:posts,
        error
    } =
    await supabaseClient
    .from("posts")
    .select("*")
    .order(
        "created_at",
        {
            ascending:false
        }
    );


    if(error){

        feed.innerHTML =
        '<div class="card">Feed Error: ' +
        escapeHtml(error.message) +
        '</div>';

    }

        feed.innerHTML =

        );

/* =====================================================
   RENDER POST
===================================================== */

async function renderPost(
    post,
    feed
){

    const {
        data:profile
    } =
    await supabaseClient
    .from("profiles")
    .select("*")
    .eq(
        "id",
        post.user_id
    )
    .maybeSingle();


    const card =
        document.createElement("div");


    card.className="card";


    const userName =
        profile && profile.name
        ? profile.name
        : "User";


    const userPhoto =
        profile && profile.profile_photo
        ? profile.profile_photo
        : DEFAULT_PROFILE;


    const date =
        post.created_at
        ? new Date(
            post.created_at
        ).toLocaleString("bn-BD")
        : "";


    let html=`

        <div class="post-user">

            <img
                src="${escapeHtml(userPhoto)}"
            >

            <div>

                <div class="post-name">
                    ${escapeHtml(userName)}
                </div>

                <div class="post-date">
                    ${escapeHtml(date)}
                </div>

            </div>

        </div>

        <div class="post-text">
            ${escapeHtml(post.text || "")}
        </div>

    `;


    if(post.image_url){

        html+=`

            <img
                class="post-image"
                src="${escapeHtml(post.image_url)}"
            >

        `;

    }


    html+=`

        <div class="actions">

            <button
                onclick="likePost(${post.id})"
            >
                ❤️ Like
            </button>

            <button
                onclick="toggleComments(${post.id})"
            >
                💬 Comment
            </button>

            <button
                onclick="sharePost(${post.id})"
            >
                ↗ Share
            </button>

        </div>

        <div
            id="comments-${post.id}"
            class="comment-box"
        >

            <input
                id="commentInput-${post.id}"
                placeholder="Write a comment..."
            >

            <button
                class="primary"
                onclick="addComment(${post.id})"
            >
                Comment
            </button>

            <div
                id="commentList-${post.id}"
            ></div>

        </div>

    `;


    if(
        currentUser &&
        currentUser.id === post.user_id
    ){

        html+=`

            <button
                style="
                width:100%;
                margin-top:10px;
                border:0;
                background:#ffdddd;
                color:red;
                padding:10px;
                border-radius:6px;
                "
                onclick="deletePost(${post.id})"
            >
                🗑 Delete Post
            </button>

        `;

    }


    card.innerHTML=html;

    feed.appendChild(card);

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   LIKE
===================================================== */

async function likePost(postId){

    if(!currentUser){

        alert("আগে Login করুন।");

        return;

    }


    const {
        data:existing
    } =
    await supabaseClient
    .from("post_likes")
    .select("*")
    .eq(
        "post_id",
        postId
    )
    .eq(
        "user_id",
        currentUser.id
    )
    .maybeSingle();


    if(existing){

        await supabaseClient
        .from("post_likes")
        .delete()
        .eq(
            "post_id",
            postId
        )
        .eq(
            "user_id",
            currentUser.id
        );

    }else{

        await supabaseClient
        .from("post_likes")
        .insert({

            post_id:postId,
            user_id:currentUser.id

        });

    }


    alert(
        existing
        ? "Like removed"
        : "Liked ❤️"
    );

}


/* =====================================================
   COMMENTS
===================================================== */

async function toggleComments(postId){

    const box =
        document.getElementById(
            "comments-" + postId
        );


    if(
        box.style.display === "block"
    ){

        box.style.display="none";

        return;

    }


    box.style.display="block";

    await loadComments(postId);

}


async function loadComments(postId){

    const list =
        document.getElementById(
            "commentList-" + postId
        );


    if(!list){

        return;

    }


    list.innerHTML =
    "Loading comments...";


    const {
        data:comments,
        error
    } =
    await supabaseClient
    .from("comments")
    .select("*")
    .eq(
        "post_id",
        postId
    )
    .order(
        "created_at",
        {
            ascending:true
        }
    );


    if(error){

        list.innerHTML =
        "Comment Error: " +
        error.message;

        return;

    }


    list.innerHTML="";


    if(
        !comments ||
        comments.length===0
    ){

        list.innerHTML =
        '<div class="small">No comments yet.</div>';

        return;

    }


    for(const comment of comments){

        const div =
        document.createElement("div");


        div.className="comment";

        div.innerText =
        comment.text || "";


        list.appendChild(div);

    }

}


async function addComment(postId){

    if(!currentUser){

        alert("আগে Login করুন।");

        return;

    }


    const input =
        document.getElementById(
            "commentInput-" + postId
        );


    const text =
        input.value.trim();


    if(!text){

        return;

    }


    const {
        error
    } =
    await supabaseClient
    .from("comments")
    .insert({

        post_id:postId,
        user_id:currentUser.id,
        text:text

    });


    if(error){

        alert(
            "Comment Error: " +
            error.message
        );

        return;

    }


    input.value="";

    await loadComments(postId);

}


/* =====================================================
   SHARE
===================================================== */

async function sharePost(postId){

    const url =
        window.location.href +
        "?post=" +
        postId;


    if(navigator.share){

        try{

            await navigator.share({

                title:"My Social App",
                text:"Check this post",
                url:url

            });

        }catch(e){}

    }else{

        try{

            await navigator.clipboard.writeText(url);

            alert("Post link copied!");

        }catch(e){

            prompt(
                "Copy this link:",
                url
            );

        }

    }

}


/* =====================================================
   DELETE POST
===================================================== */

async function deletePost(postId){

    if(!currentUser){

        return;

    }


    const confirmDelete =
        confirm(
            "এই Post delete করবেন?"
        );


    if(!confirmDelete){

        return;

    }


    const {
        error
    } =
    await supabaseClient
    .from("posts")
    .delete()
    .eq(
        "id",
        postId
    )
    .eq(
        "user_id",
        currentUser.id
    );


    if(error){

        alert(
            "Delete Error: " +
            error.message
        );

        return;

    }


    await loadFeed();

}
