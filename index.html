<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Social App</title>

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1877f2">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f0f2f5;
  color:#1c1e21
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}

.top{
  position:sticky;
  top:0;
  z-index:100;
  height:58px;
  background:#1877f2;
  color:white;

  align-items:center;
  padding:8px 12px;
  gap:10px
}
.logo{
  font-size:22px;

  flex:1
}
.top button{
  border:0;
  border-radius:20px;
  padding:8px 14px;
  background:white;
  color:#1877f2
}

.nav{
  position:sticky;
  top:58px;
  z-index:90;
  display:flex;
  overflow-x:auto;
  background:white;
  border-bottom:1px solid #ddd
}
.nav button{
  border:0;

.nav button.active{

  font-weight:bold;

}

.container{
  max-width:700px;
  margin:auto;
  padding:10px
}

.card{
  background:#fff;
  border-radius:10px;
  margin-bottom:10px;
  padding:12px;
  box-shadow:0 1px 2px #0002
}

.row{
  display:flex;
  align-items:center;
  gap:9px
}
.space{
  justify-content:space-between
}
.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd
}
.bigavatar{
  width:52px;
  height:52px
}

.muted{
  color:#65676b;
  font-size:13px
}

input,textarea,select{
  width:100%;
  border:1px solid #ddd;
  border-radius:8px;
  padding:10px;
  margin:5px 0;
  outline:none
}
textarea{
  min-height:80px;
  resize:none
}

.primary{
  background:#1877f2;
  color:white;
  border:0;
  border-radius:7px;
  padding:9px 15px
}
.secondary{
  background:#e4e6eb;
  color:#1c1e21;
  border:0;
  border-radius:7px;
  padding:9px 15px
}
.danger{
  background:#e41e3f;
  color:white;
  border:0;
  border-radius:7px;
  padding:8px 12px
}
.success{
  background:#42b72a;
  color:white;
  border:0;
  border-radius:7px;
  padding:8px 12px
}

.post-box{
  display:flex;
  gap:10px;
  align-items:center
}
.post-input{
  flex:1;
  background:#f0f2f5;
  border:0;
  border-radius:25px;
  padding:13px 16px;
  color:#65676b;
  cursor:pointer
}

.post-actions{
  display:flex;
  border-top:1px solid #eee;
  margin-top:10px;
  padding-top:8px;
  gap:5px
}
.post-actions button{
  flex:1;
  border:0;
  background:white;
  padding:9px 4px;
  border-radius:7px
}
.post-actions button:hover{
  background:#f0f2f5
}

.post-header{
  display:flex;
  align-items:center;
  justify-content:space-between
}

.post-author{
  display:flex;
  align-items:center;
  gap:9px
}
.post-author img{
  cursor:pointer
}
.post-author-name{
  font-weight:bold;
  cursor:pointer
}

.verify{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:17px;
  height:17px;
  background:#1877f2;
  color:white;
  border-radius:50%;
  font-size:11px
}

.post-text{
  margin:12px 0;
  white-space:pre-wrap;
  word-break:break-word;
  font-size:15px;
  line-height:1.5
}

.post-image{
  width:100%;
  max-height:650px;
  object-fit:cover;
  display:block;
  border-radius:7px;
  margin-top:8px
}

.post-video{
  width:100%;
  max-height:650px;
  border-radius:7px;
  margin-top:8px;
  background:#000
}

.multi-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:3px;
  margin-top:8px
}
.multi-grid img,
.multi-grid video{
  width:100%;
  height:220px;
  object-fit:cover;
  background:#000
}
.multi-grid.one{
  grid-template-columns:1fr
}
.multi-grid.one img{
  height:auto;
  max-height:650px
}

.post-stats{

  color:#65676b;
  font-size:13px;
  padding:8px 2px
}

.post-buttons{
  display:flex;

  border-bottom:1px solid #ddd;
  padding:3px 0
}
.post-buttons button{
  flex:1;

  background:white;
  padding:9px 3px;

  color:#65676b
}
.post-buttons button:hover{

}
.post-buttons button.active{

}

.comment-box{

  gap:7px;
  margin-top:8px
}
.comment-box input{

  background:#f0f2f5;
  border:0
}

.comment{

}

.reaction-menu{

  bottom:45px;
  left:0;
  background:white;
  border-radius:25px;
  padding:6px;

.reaction-wrap{

}

.reaction-menu button{

  padding:3px 6px;

.reaction-menu button:hover{

.modal{

  inset:0;
  background:#0008;
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:12px

.modal-box{
  width:min(620px,100%);

  overflow:auto;
  background:white;
  border-radius:12px;
  padding:15px
}
.close{
  float:right;
  width:32px;
  height:32px;
  border:0;
  border-radius:50%;
  background:#eee;
  font-size:20px
}

.bg-preview{
  padding:30px 15px;
  border-radius:10px;
  text-align:center;
  font-size:22px;
  font-weight:bold;

.story-list{

.story{

  background:#ddd

.story img,.story video{

.story-name{

  right:0;

.stat{

  text-align:center;

.stat b{

.user{

function escapeHTML(v){
  return String(v??"")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}

async function register(){
  const name=$("regName").value.trim();
  const email=$("regEmail").value.trim();
  const password=$("regPassword").value;

  if(!name||!email||!password){
    $("regMsg").textContent="সব তথ্য দিন";
    return;
  }

  const {data,error}=await db.auth.signUp({
    email,
    password
  });

  if(error){
    $("regMsg").textContent=error.message;
    return;
  }

  if(data.user){
    await db.from("profiles").upsert({
      id:data.user.id,
      name,
      bio:"",
      role:"user",
      verified:false,
      followers_count:0,
      following_count:0,
      last_seen:new Date().toISOString()
    });
  }

  $("regMsg").textContent=
    "Account তৈরি হয়েছে।";

  setTimeout(showLogin,1200);
}

async function login(){
  const email=$("loginEmail").value.trim();
  const password=$("loginPassword").value;

  $("loginMsg").textContent="Login হচ্ছে...";

  const {error}=await db.auth.signInWithPassword({
    email,
    password
  });

  if(error){
    $("loginMsg").textContent=error.message;
    return;
  }

  await startApp();
}

async function logout(){
  await db.auth.signOut();
  location.reload();
}

START
========================= */

async function startApp(){
  const {data:{session}}=
    await db.auth.getSession();

  if(!session){
    showLogin();
    return;
  }

  me=session.user;

  await loadProfile();

  renderApp();

  await loadFeed();
}

async function loadProfile(){
  const {data}=await db
    .from("profiles")
    .select("*")
    .eq("id",me.id)
    .maybeSingle();

  if(data){
    profile=data;
    return;
  }

  const newProfile={
    id:me.id,
    name:me.email?.split("@")[0]||"User",
    bio:"",
    role:"user",
    verified:false,
    followers_count:0,
    following_count:0,
    last_seen:new Date().toISOString()
  };

  await db.from("profiles")
    .upsert(newProfile);

  profile=newProfile;
}

function activeNav(name){
  document.querySelectorAll(".nav button")
    .forEach(x=>x.classList.remove("active"));

  const x=$("nav-"+name);
  if(x)x.classList.add("active");
}

function choosePostBackground(){
  const colors=[
    "#1877f2",
    "#8e44ad",
    "#e74c3c",
    "#16a085",
    "#f39c12"
  ];

  const color=
    colors[Math.floor(Math.random()*colors.length)];

  const box=$("backgroundPreview");

  box.style.background=color;
  box.style.color="white";
  box.classList.remove("hidden");
  box.dataset.color=color;
}

function clearPostBackground(){
  const box=$("backgroundPreview");
  box.classList.add("hidden");
  delete box.dataset.color;
}

async function publishPost(){

  const text=$("newPostText").value.trim();
  const files=[...$("postFiles").files];
  const privacy=$("postPrivacy").value;
  const feeling=$("postFeeling").value;
  const location=$("postLocation").value.trim();

  const bg=$("backgroundPreview");
  const background=bg.dataset.color||"";

  if(!text&&!files.length){
    alert("Post লিখুন অথবা Photo/Video দিন");
    return;
  }

  const {data:post,error}=await db
    .from("posts")
    .insert({
      user_id:me.id,
      text,
      image_url:"",
      privacy,
      feeling,
      location
    })
    .select()
    .single();

  if(error){
    alert(error.message);
    return;
  }

  if(background){
    await db.from("posts")
      .update({
        image_url:`bg:${background}`
      })
      .eq("id",post.id);
  }

  for(let i=0;i<files.length;i++){

    const file=files[i];

    const path=
      `posts/${me.id}/${Date.now()}_${i}_${file.name}`;

    const {error:uploadError}=
      await db.storage
      .from("media")
      .upload(path,file);

    if(uploadError){
      console.error(uploadError);
      continue;
    }

    const publicUrl=
      db.storage
      .from("media")
      .getPublicUrl(path)
      .data.publicUrl;

    await db.from("post_media").insert({
      post_id:post.id,
      media_url:publicUrl,
      media_type:file.type.startsWith("video/")
        ?"video"
        :"image",
      sort_order:i
    });

    if(i===0 && !background){
      await db.from("posts")
        .update({
          image_url:publicUrl
        })
        .eq("id",post.id);
    }
  }

  closeModal();

  await loadFeed();
}

/* =========================
FEED
========================= */

async function loadFeed(){

  const box=$("feed");
  if(!box)return;

  box.innerHTML=
    `<div class="card">Loading Feed...</div>`;

  const {data:posts,error}=
    await db
    .from("posts")
    .select("*")
    .order("created_at",{ascending:false})
    .limit(100);

  if(error){
    box.innerHTML=
      `<div class="card">${escapeHTML(error.message)}</div>`;
    return;
  }

  if(!posts?.length){
    box.innerHTML=
      `<div class="card">
        এখনো কোনো post নেই।
       </div>`;
    return;
  }

  const ids=[...new Set(
    posts.map(p=>p.user_id)
  )];

  const {data:users}=
    await db.from("profiles")
    .select("*")
    .in("id",ids);

  const userMap={};
  (users||[]).forEach(u=>{
    userMap[u.id]=u;
  });

  const postIds=posts.map(p=>p.id);

  const {data:reactions}=
    await db.from("post_reactions")
    .select("*")
    .in("post_id",postIds);

  const {data:comments}=
    await db.from("comments")
    .select("*")
    .in("post_id",postIds);

  const {data:following}=
    await db.from("follows")
    .select("following_id")
    .eq("follower_id",me.id);

  const followSet=new Set(
    (following||[]).map(x=>x.following_id)
  );

  const reactionMap={};
  const myReaction={};

  (reactions||[]).forEach(r=>{
    if(!reactionMap[r.post_id])
      reactionMap[r.post_id]=[];

    reactionMap[r.post_id].push(r);

    if(r.user_id===me.id)
      myReaction[r.post_id]=r.reaction;
  });

  const commentMap={};

  (comments||[]).forEach(c=>{
    if(!commentMap[c.post_id])
      commentMap[c.post_id]=[];

    commentMap[c.post_id].push(c);
  });

  const mediaRes=
    await db.from("post_media")
    .select("*")
    .in("post_id",postIds)
    .order("sort_order",{ascending:true});

  const mediaMap={};

  (mediaRes.data||[]).forEach(m=>{
    if(!mediaMap[m.post_id])
      mediaMap[m.post_id]=[];

    mediaMap[m.post_id].push(m);
  });

  const now=Date.now();

  const ranked=posts.map(p=>{

    const hours=Math.max(
      .1,
      (now-new Date(p.created_at).getTime())/
      3600000
    );

    const reactionsCount=
      (reactionMap[p.id]||[]).length;

    const commentsCount=
      (commentMap[p.id]||[]).length;

    let score=
      50/(1+hours);

    score+=reactionsCount*4;
    score+=commentsCount*5;

    if(followSet.has(p.user_id))
      score+=25;

    if(p.user_id===me.id)
      score+=10;

    return {
      ...p,
      author:userMap[p.user_id],
      reactions:reactionMap[p.id]||[],
      comments:commentMap[p.id]||[],
      media:mediaMap[p.id]||[],
      myReaction:myReaction[p.id]||"",
      score
    };
  });

  ranked.sort((a,b)=>b.score-a.score);

  box.innerHTML=
    ranked.map(renderPost).join("");

  await loadPostComments(ranked);
}

function showReactions(e,id){
  e.preventDefault();

  document
    .querySelectorAll(".reaction-menu")
    .forEach(x=>x.classList.add("hidden"));

  $("reaction-"+id)
    ?.classList.remove("hidden");
}

async function reactPost(postId,reaction){

  const {data:old}=
    await db.from("post_reactions")
    .select("*")
    .eq("post_id",postId)
    .eq("user_id",me.id)
    .maybeSingle();

  if(old){

    if(old.reaction===reaction){

      await db.from("post_reactions")
        .delete()
        .eq("id",old.id);

    }else{

      await db.from("post_reactions")
        .update({reaction})
        .eq("id",old.id);
    }

  }else{

    await db.from("post_reactions")
      .insert({
        post_id:postId,
        user_id:me.id,
        reaction
      });
  }

  await loadFeed();
}

function focusComment(id){
  const x=$("comment-"+id);

  if(x){
    x.focus();
    x.scrollIntoView({
      behavior:"smooth",
      block:"center"
    });
  }
}

async function addComment(postId){

  const input=$("comment-"+postId);
  const text=input.value.trim();

  if(!text)return;

  const {error}=await db
    .from("comments")
    .insert({
      post_id:postId,
      user_id:me.id,
      text
    });

  if(error){
    alert(error.message);
    return;
  }

  input.value="";

  await loadFeed();
}

async function loadPostComments(posts){

  const ids=[
    ...new Set(
      posts.flatMap(p=>
        p.comments.map(c=>c.user_id)
      )
    )
  ];

  if(!ids.length)return;

  const {data:users}=
    await db.from("profiles")
    .select("id,name,profile_photo")
    .in("id",ids);

  const map={};
  (users||[]).forEach(u=>map[u.id]=u);

  posts.forEach(p=>{

    const box=$("comments-"+p.id);

    if(!box)return;

    const comments=p.comments.slice(-5);

    box.innerHTML=comments.map(c=>{

      const u=map[c.user_id]||{
        name:"User"
      };

      return `
      <div class="comment">
        <b>${escapeHTML(u.name)}</b>
        <div>${escapeHTML(c.text)}</div>
      </div>`;

    }).join("");
  });
}

async function isFollowing(id){

  const {data}=await db
    .from("follows")
    .select("id")
    .eq("follower_id",me.id)
    .eq("following_id",id)
    .maybeSingle();

  return !!data;
}

async function toggleFollow(id){

  if(id===me.id)return;

  const yes=await isFollowing(id);

  if(yes){

    await db.from("follows")
      .delete()
      .eq("follower_id",me.id)
      .eq("following_id",id);

  }else{

    const {error}=await db
      .from("follows")
      .insert({
        follower_id:me.id,
        following_id:id
      });

    if(error){
      alert(error.message);
      return;
    }

    await db.from("notifications")
      .insert({
        receiver_id:id,
        text:`${profile.name} আপনাকে follow করেছে`
      });
  }

  await updateFollowCount(id);

  if(currentSection==="profile")
    await renderProfile(id);

  if(currentSection==="search")
    await searchAll();
}

async function updateFollowCount(id){

  const {count:f}=await db
    .from("follows")
    .select("*",{count:"exact",head:true})
    .eq("following_id",id);

  const {count:g}=await db
    .from("follows")
    .select("*",{count:"exact",head:true})
    .eq("follower_id",id);

  await db.from("profiles")
    .update({
      followers_count:f||0,
      following_count:g||0
    })
    .eq("id",id);
}

        value="${escapeHTML(profile.name||"")}"
        placeholder="Name">

      <textarea id="editBio"
        placeholder="Bio">${escapeHTML(profile.bio||"")}</textarea>

      <label>Profile Photo</label>
      <input id="editProfilePhoto"
        type="file"
        accept="image/*">

      <label>Cover Photo</label>
      <input id="editCoverPhoto"
        type="file"
        accept="image/*">

        onclick="saveProfile()">
        Save
      </button>

async function saveProfile(){

  const name=$("editName").value.trim();
  const bio=$("editBio").value.trim();

  let photo=profile.profile_photo||"";
  let cover=profile.cover_photo||"";

  const pf=$("editProfilePhoto").files[0];
  const cf=$("editCoverPhoto").files[0];

  if(pf){

    const path=
      `profiles/${me.id}/profile_${Date.now()}_${pf.name}`;

    const {error}=await db.storage
      .from("media")
      .upload(path,pf);

    if(error){
      alert(error.message);
      return;
    }

    photo=db.storage
      .from("media")
      .getPublicUrl(path)
      .data.publicUrl;
  }

  if(cf){

    const path=
      `profiles/${me.id}/cover_${Date.now()}_${cf.name}`;

    const {error}=await db.storage
      .from("media")
      .upload(path,cf);

    if(error){
      alert(error.message);
      return;
    }

    cover=db.storage
      .from("media")
      .getPublicUrl(path)
      .data.publicUrl;
  }

  const {data,error}=
    await db.from("profiles")
    .update({
      name,
      bio,
      profile_photo:photo,
      cover_photo:cover
    })
    .eq("id",me.id)
    .select()
    .single();

  if(error){
    alert(error.message);
    return;
  }

  profile=data;

  closeModal();

  renderApp();
  await section("profile");
}

    .select("*")
    .gt("expires_at",new Date().toISOString())
    .order("created_at",{ascending:false});

  window.storyCache=stories||[];

  const box=$("storyList");

  if(!stories?.length){

    box.innerHTML=
      `<div class="muted">কোনো Story নেই</div>`;

    return;
  }

  const ids=[
    ...new Set(stories.map(s=>s.user_id))
  ];

  const {data:users}=
    await db.from("profiles")
    .select("id,name,profile_photo")
    .in("id",ids);

  const map={};

  (users||[]).forEach(u=>map[u.id]=u);

  box.innerHTML=`
  <div class="story-list">

    ${stories.map(s=>{

      const u=map[s.user_id]||{
        name:"User"
      };

      return `
      <div class="story"
        onclick="viewStory(${s.id})">

        ${
          s.media_type==="video"
          ? `<video src="${escapeHTML(s.media_url)}"></video>`
          : `<img src="${escapeHTML(s.media_url)}">`
        }

        <div class="story-name">
          ${escapeHTML(u.name)}
        </div>

      </div>`;
    }).join("")}

  </div>`;
}

async function createStory(){

  const file=$("storyFile").files[0];

  if(!file){
    alert("ছবি অথবা ভিডিও দিন");
    return;
  }

  const type=
    file.type.startsWith("video/")
    ?"video"
    :"image";

  const path=
    `stories/${me.id}/${Date.now()}_${file.name}`;

  const {error}=await db.storage
    .from("media")
    .upload(path,file);

  if(error){
    alert(error.message);
    return;
  }

  const url=
    db.storage
    .from("media")
    .getPublicUrl(path)
    .data.publicUrl;

  await db.from("stories").insert({
    user_id:me.id,
    media_url:url,
    media_type:type,
    caption:$("storyCaption").value,
    expires_at:
      new Date(Date.now()+86400000).toISOString()
  });

  await renderStories();
}

async function viewStory(id){

  const s=(window.storyCache||[])
    .find(x=>x.id===id);

  if(!s)return;

  await db.from("story_views")
    .upsert({
      story_id:id,
      viewer_id:me.id
    },{
      onConflict:"story_id,viewer_id"
    });

  const {data:u}=await db
    .from("profiles")
    .select("*")
    .eq("id",s.user_id)
    .maybeSingle();

  $("modalRoot").innerHTML=`
  <div class="modal">

    <div class="modal-box">

      <button class="close"
        onclick="closeModal()">×</button>

      <div class="row">

        <img class="avatar"
          src="${avatar(u?.profile_photo)}">

        <b>${escapeHTML(u?.name||"User")}</b>

      </div>

      ${
        s.media_type==="video"
        ? `<video
             class="post-video"
             src="${escapeHTML(s.media_url)}"
             controls autoplay>
           </video>`
        : `<img
             class="post-image"
             src="${escapeHTML(s.media_url)}">`
      }

      <p>${escapeHTML(s.caption||"")}</p>

      ${
        s.user_id===me.id
        ? `<button class="danger"
             onclick="deleteStory(${s.id})">
             Delete
           </button>`
        :""
      }

    </div>

  </div>`;
}

async function deleteStory(id){

  await db.from("stories")
    .delete()
    .eq("id",id);

  closeModal();

  await renderStories();
}

/* =========================
FRIENDS
========================= */

async function renderFriends(){

  $("content").innerHTML=`

  <div class="card">

    <h3>Friends</h3>

    <input id="friendSearch"
      placeholder="Search user..."
      oninput="searchFriends()">

    <div id="friendResults"></div>

  </div>

  <div class="card">

    <h3>Friend Requests</h3>

    <div id="requests"></div>

  </div>

  <div class="card">

    <h3>My Friends</h3>

    <div id="myFriends"></div>

  </div>`;

  await searchFriends();
  await loadRequests();
  await loadFriends();
}

async function searchFriends(){

  const q=$("friendSearch")?.value.trim()||"";

  const box=$("friendResults");

  let query=db.from("profiles")
    .select("*")
    .neq("id",me.id)
    .limit(30);

  if(q)
    query=query.ilike("name",`%${q}%`);

  const {data}=await query;

  box.innerHTML=(data||[]).map(u=>`

    <div class="user">

      <img class="avatar"
        src="${avatar(u.profile_photo)}">

      <div class="user-info">
        <b>${escapeHTML(u.name)}</b>
      </div>

      <button class="primary"
        onclick="toggleFollow('${u.id}')">
        Follow
      </button>

    </div>

  `).join("")||"No users";
}

async function loadRequests(){

  const box=$("requests");

  const {data}=await db
    .from("friend_requests")
    .select("*")
    .eq("receiver_id",me.id)
    .eq("status","pending");

  if(!data?.length){
    box.innerHTML=
      `<div class="muted">No requests</div>`;
    return;
  }

  const ids=data.map(x=>x.sender_id);

  const {data:users}=await db
    .from("profiles")
    .select("*")
    .in("id",ids);

  const map={};

  (users||[]).forEach(u=>map[u.id]=u);

  box.innerHTML=data.map(r=>{

    const u=map[r.sender_id];

    return `
    <div class="user">

      <img class="avatar"
        src="${avatar(u?.profile_photo)}">

      <div class="user-info">
        <b>${escapeHTML(u?.name||"User")}</b>
      </div>

      <button class="success"
        onclick="acceptRequest(${r.id},'${r.sender_id}')">
        Accept
      </button>

    </div>`;
  }).join("");
}

async function acceptRequest(id,friendId){

  await db.from("friend_requests")
    .update({status:"accepted"})
    .eq("id",id);

  await db.from("friends").upsert({
    user_id:me.id,
    friend_id:friendId
  });

  await db.from("friends").upsert({
    user_id:friendId,
    friend_id:me.id
  });

  await renderFriends();
}

async function loadFriends(){

  const box=$("myFriends");

  const {data}=await db
    .from("friends")
    .select("*")
    .or(
      `user_id.eq.${me.id},friend_id.eq.${me.id}`
    );

  const ids=(data||[]).map(x=>
    x.user_id===me.id
    ?x.friend_id
    :x.user_id
  );

  if(!ids.length){
    box.innerHTML=
      `<div class="muted">No friends</div>`;
    return;
  }

  const {data:users}=await db
    .from("profiles")
    .select("*")
    .in("id",ids);

  box.innerHTML=(users||[]).map(u=>`
    <div class="user">

      <img class="avatar"
        src="${avatar(u.profile_photo)}">

      <div class="user-info">
        <b>${escapeHTML(u.name)}</b>
      </div>

      <button class="secondary"
        onclick="section('profile','${u.id}')">
        Profile
      </button>

    </div>
  `).join("");
}

/* =========================
MESSENGER
========================= */

async function renderMessages(){

  $("content").innerHTML=`

  <div class="card">

    <h3>Messenger</h3>

    <input id="receiverId"
      placeholder="Receiver User ID">

    <div id="chat"></div>

    <input id="messageText"
      placeholder="Message">

    <button class="primary"
      onclick="sendMessage()">
      Send
    </button>

  </div>`;

  await loadMessages();
}

async function sendMessage(){

  const receiver=$("receiverId").value.trim();
  const text=$("messageText").value.trim();

  if(!receiver||!text)return;

  const {error}=await db
    .from("messages")
    .insert({
      sender_id:me.id,
      receiver_id:receiver,
      text,
      seen:false
    });

  if(error){
    alert(error.message);
    return;
  }

  $("messageText").value="";

  await loadMessages();
}

async function loadMessages(){

  const {data}=await db
    .from("messages")
    .select("*")
    .or(
      `sender_id.eq.${me.id},receiver_id.eq.${me.id}`
    )
    .order("created_at",{ascending:true})
    .limit(100);

  $("chat").innerHTML=(data||[])
    .map(m=>`
      <div class="comment">
        <b>
          ${m.sender_id===me.id?"You":"User"}
        </b>
        <div>${escapeHTML(m.text)}</div>
      </div>
    `).join("");
}

/* =========================
NOTIFICATIONS
========================= */

async function renderNotifications(){

  const {data}=await db
    .from("notifications")
    .select("*")
    .eq("receiver_id",me.id)
    .order("created_at",{ascending:false})
    .limit(100);

  $("content").innerHTML=`

  <div class="card">

    <h3>🔔 Notifications</h3>

    ${
      data?.length
      ? data.map(n=>`
        <div class="comment">
          ${escapeHTML(n.text)}
          <div class="muted">
            ${dateText(n.created_at)}
          </div>
        </div>
      `).join("")
      : `<div class="muted">
          No notifications
         </div>`
    }

  </div>`;
}

/* =========================
CREATOR
========================= */

async function renderCreator(){

  const {data}=await db
    .from("creator_earnings")
    .select("*")
    .eq("user_id",me.id)
    .order("created_at",{ascending:false});

  const total=(data||[])
    .reduce((a,x)=>a+Number(x.amount||0),0);

  $("content").innerHTML=`

  <div class="card">

    <h2>Creator Monetization</h2>

    <h1>$${total.toFixed(2)}</h1>

    <div class="muted">
      Current earnings
    </div>

  </div>

  <div class="card">

    ${
      data?.map(x=>`
        <div class="comment">
          $${Number(x.amount||0).toFixed(2)}
          · ${escapeHTML(x.source||"content")}
        </div>
      `).join("")
      ||"No earnings"
    }

  </div>`;
}

/* =========================
ADMIN
========================= */

async function renderAdmin(){

  if(profile.role!=="admin"){
    $("content").innerHTML=
      `<div class="card">Access denied</div>`;
    return;
  }

  const {data:users}=await db
    .from("profiles")
    .select("*")
    .order("created_at",{ascending:false});

  $("content").innerHTML=`

  <div class="card">
    <h2>Admin Panel</h2>
    <p>Total users:
      <b>${users?.length||0}</b>
    </p>
  </div>

  <div class="card">

    <h3>Users</h3>

    ${
      users?.map(u=>`
      <div class="user">

        <img class="avatar"
          src="${avatar(u.profile_photo)}">

        <div class="user-info">

          <b>
            ${escapeHTML(u.name)}
            ${
              u.verified
              ? `<span class="verify">✓</span>`
              :""
            }
          </b>

          <div class="muted">
            Role: ${escapeHTML(u.role||"user")}
          </div>

        </div>

        <button class="secondary"
          onclick="toggleVerification(
            '${u.id}',
            ${!!u.verified}
          )">

          ${u.verified
            ?"Unverify"
            :"Verify"}

        </button>

      </div>
      `).join("")||""
    }

  </div>`;
}

async function toggleVerification(id,current){

  const {error}=await db
    .from("profiles")
    .update({
      verified:!current
    })
    .eq("id",id);

  if(error){
    alert(error.message);
    return;
  }

  await renderAdmin();
}
