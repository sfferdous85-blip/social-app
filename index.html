<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1877f2">
<title>My Social App</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f0f2f5;
 color:#111;
}

body.dark{
 background:#18191a;
 color:#eee;
}

button,input,textarea,select{
 font:inherit;
}

button{
 cursor:pointer;
 border:0;
}

.container{
 max-width:700px;
 margin:auto;
 padding:10px;
}

.card{
 background:#fff;
 border-radius:12px;
 padding:14px;
 margin-bottom:12px;
 box-shadow:0 1px 3px #0002;
}

.dark .card{
 background:#242526;
 color:#eee;
}

input,textarea,select{
 width:100%;
 padding:12px;
 border:1px solid #ccc;
 border-radius:8px;
 margin:5px 0;
}

.dark input,
.dark textarea,
.dark select{
 background:#3a3b3c;
 color:#fff;
 border-color:#555;
}

.primary{
 background:#1877f2;
 color:white;
 padding:11px 16px;
 border-radius:8px;
}

.secondary{
 background:#e4e6eb;
 padding:10px 14px;
 border-radius:8px;
}

.dark .secondary{
 background:#3a3b3c;
 color:white;
}

.topbar{
 position:sticky;
 top:0;
 z-index:100;
 background:#1877f2;
 color:#fff;
 padding:12px;
 display:flex;
 align-items:center;
 justify-content:space-between;
}

.nav{
 display:flex;
 gap:5px;
 overflow-x:auto;
 background:#fff;
 padding:8px;
 position:sticky;
 top:50px;
 z-index:90;
}

.dark .nav{
 background:#242526;
}

.nav button{
 flex:1;
 min-width:70px;
 padding:9px 6px;
 border-radius:8px;
 background:transparent;
}

.nav button:hover{
 background:#e4e6eb;
}

.dark .nav button:hover{
 background:#3a3b3c;
}

.avatar{

 height:42px;
 border-radius:50%;
 object-fit:cover;
 background:#ddd;
}

.post-head{

}

.post-name{

}

.post-time{

}

.post-text{

 white-space:pre-wrap;
 word-break:break-word;
 font-size:16px;
 line-height:1.45;

.post-image{
 width:100%;
 max-height:650px;
 object-fit:cover;
 border-radius:10px;
 margin-top:10px;

.post-meta{

.actions{

.actions button{

.dark .actions button{

.reaction-box{

}

.reaction-box button{

 padding:4px 8px;
 border-radius:8px;
}

.reaction-box button:hover{

}

.dark .reaction-box button:hover{

.post-menu{

 right:10px;
 top:45px;
 background:#fff;
 color:#111;
 border-radius:10px;
 box-shadow:0 3px 15px #0004;
 overflow:hidden;
 z-index:50;
 min-width:170px;
}

.dark .post-menu{
 background:#242526;
 color:#fff;
}

.post-menu button{
 display:block;
 width:100%;
 text-align:left;
 padding:12px;
 background:transparent;
}

.post-menu button:hover{
 background:#e4e6eb;
}

.dark .post-menu button:hover{
 background:#3a3b3c;
}

.post-wrap{
 position:relative;
}

.pinned{
 color:#1877f2;
 font-size:13px;
 font-weight:bold;
 margin-bottom:7px;
}

.comment{

 padding:9px;
 border-radius:8px;
 margin:5px 0;
 word-break:break-word;
}

.dark .comment{

.modal-bg{

 background:#0008;
 z-index:999;

 align-items:center;
 justify-content:center;
 padding:15px;
}

.modal{

 color:#111;
 width:100%;
 max-width:500px;
 max-height:90vh;
 overflow:auto;
 border-radius:14px;
 padding:16px;
}

.dark .modal{
 background:#242526;
 color:#fff;
}

.close{
 float:right;
 font-size:24px;

}

.reel{

}

.reel video{

 display:block;
}

.reel-info{
 padding:12px;
}

.reel-actions{

 gap:8px;
 padding:10px;
}

.reel-actions button{
 background:#ffffff22;
 color:#fff;
 padding:10px 14px;

}

.profile-cover{
 width:100%;
 height:200px;
 object-fit:cover;
 border-radius:12px;
}

.profile-box{
 text-align:center;
 margin-top:-45px;
}

.profile-big{
 width:90px;
 height:90px;
 border-radius:50%;
 border:4px solid #fff;
 object-fit:cover;
}

.toast{
 position:fixed;
 bottom:20px;
 left:50%;
 transform:translateX(-50%);
 background:#222;
 color:#fff;
 padding:12px 18px;

 z-index:2000;
}

.auth{
 max-width:420px;
 margin:50px auto;

}

.empty{
 text-align:center;
 padding:25px;

}

.load-more{
 width:100%;
 padding:12px;
 margin:5px 0 20px;
 border-radius:8px;
 background:#1877f2;
 color:#fff;
}

hr{
 border:0;
 border-top:1px solid #ddd;
 margin:12px 0;
}
</style>
</head>

<body>

<div id="app"></div>

<script>

const SUPABASE_URL =
"https://skereuaizdczbvjplisi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_3R2otJA1zIlsMsTYxe1ocw_NAPY5O9x";

const db = supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

let currentUser=null;
let profile=null;

let feedLimit=20;
let allPosts=[];

const $=id=>document.getElementById(id);

function esc(value){
 return String(value ?? "")
 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;")
 .replaceAll("'","&#039;");
}

function toast(message){

 const old=document.querySelector(".toast");
 if(old)old.remove();

 const div=document.createElement("div");

 div.className="toast";
 div.textContent=message;

 document.body.appendChild(div);

 setTimeout(()=>div.remove(),2500);
}

function openModal(html){

 closeModal();

 const bg=document.createElement("div");

 bg.className="modal-bg";
 bg.id="modalBg";

 bg.innerHTML=`
  <div class="modal">
   <button class="close"
           onclick="closeModal()">×</button>
   ${html}
  </div>
 `;

 document.body.appendChild(bg);
}

function closeModal(){

 const m=$("modalBg");

 if(m)m.remove();
}

/* =========================
 AUTH
========================= */

function showLogin(){

 $("app").innerHTML=`

 <div class="auth">

  <div class="card">

   <h1>My Social App</h1>
   <h2>Login</h2>

   <input id="loginEmail"
          type="email"
          placeholder="Email">

   <input id="loginPassword"
          type="password"
          placeholder="Password">

   <button class="primary"
           style="width:100%;margin-top:8px"
           onclick="login()">
    Login
   </button>

   <button class="secondary"
           style="width:100%;margin-top:8px"
           onclick="showSignup()">
    Create new account
   </button>

  </div>

 </div>
 `;
}

function showSignup(){

 $("app").innerHTML=`

 <div class="auth">

  <div class="card">

   <h1>My Social App</h1>

   <h2>Create Account</h2>

   <input id="signupName"
          placeholder="Your name">

   <input id="signupEmail"
          type="email"
          placeholder="Email">

   <input id="signupPassword"
          type="password"
          placeholder="Password">

   <button class="primary"
           style="width:100%;margin-top:8px"
           onclick="signup()">
    Sign Up
   </button>

   <button class="secondary"
           style="width:100%;margin-top:8px"
           onclick="showLogin()">
    Back to Login
   </button>

  </div>

 </div>
 `;
}

async function signup(){

 const name=$("signupName").value.trim();
 const email=$("signupEmail").value.trim();
 const password=$("signupPassword").value;

 if(!name||!email||!password){

  toast("সব তথ্য দিন");
  return;
 }

 if(password.length<6){

  toast("Password কমপক্ষে ৬ অক্ষরের হতে হবে");
  return;
 }

 const {data,error}=await db.auth.signUp({

  email,
  password,

  options:{
   data:{
    name:name
   }
  }

 });

 if(error){

  toast(error.message);
  return;
 }

 toast("Account created");

 if(data.user){

  currentUser=data.user;

  await loadProfile();

  renderApp();
 }
}

async function login(){

 const email=$("loginEmail").value.trim();
 const password=$("loginPassword").value;

 const {data,error}=
 await db.auth.signInWithPassword({

  email,
  password

 });

 if(error){

  toast(error.message);
  return;
 }

 currentUser=data.user;

 await loadProfile();

 renderApp();
}

async function logout(){

 await db.auth.signOut();

 currentUser=null;
 profile=null;

 showLogin();
}

/* =========================
 PROFILE
========================= */

async function loadProfile(){

 if(!currentUser)return;

 const {data,error}=await db
 .from("my social app")
 .select("*")
 .eq("id",currentUser.id)
 .maybeSingle();

 if(error){

  console.log(error);
  return;
 }

 profile=data;

 if(!profile){

  const {data:newProfile,error:insertError}=
  await db
  .from("my social app")
  .insert({

   id:currentUser.id,

   name:
   currentUser.user_metadata?.name ||
   currentUser.email?.split("@")[0] ||
   "User"

  })
  .select()
  .single();

  if(!insertError){

   profile=newProfile;
  }
 }
}

/* =========================
 APP
========================= */

function renderApp(){

 $("app").innerHTML=`

 <div class="topbar">

  <b>My Social App</b>

  <button
   style="background:none;color:#fff;font-size:22px"
   onclick="logout()">
   ⇥
  </button>

 </div>

 <div class="nav">

  <button onclick="showHome()">
   🏠 Home
  </button>

  <button onclick="showReels()">
   🎬 Reels
  </button>

  <button onclick="showProfile()">
   👤 Profile
  </button>

  <button onclick="showSearch()">
   🔍 Search
  </button>

  <button onclick="showSettings()">
   ⚙️ Settings
  </button>

 </div>

 <main class="container"
       id="content"></main>
 `;

 showHome();
}

/* =========================
 HOME / FEED
========================= */

async function showHome(){

 $("content").innerHTML=`

 <div class="card">

  <h3>📝 Create Post</h3>

  <textarea
   id="postText"
   rows="3"
   placeholder="What's on your mind?"></textarea>

  <input
   id="postImage"
   type="file"
   accept="image/*">

  <select id="postPrivacy">

   <option value="public">
    🌍 Public
   </option>

   <option value="friends">
    👥 Friends
   </option>

   <option value="private">
    🔒 Only me
   </option>

  </select>

  <input
   id="postFeeling"
   placeholder="😊 Feeling / Activity">

  <button
   class="primary"
   style="width:100%"
   onclick="submitPost()">

   🚀 Post

  </button>

 </div>

 <div class="card">

  <div style="
   display:flex;
   justify-content:space-between;
   align-items:center">

   <h3 style="margin:0">
    📰 Feed
   </h3>

   <button
    class="secondary"

    🔄 Refresh
   </button>

  </div>

 </div>

 <div id="feed">
  Loading...
 </div>
 `;

 await loadPosts(true);
}

async function refreshFeed(){

 feedLimit=20;

 await loadPosts(true);

 toast("Feed updated");
}

/* =========================
 CREATE POST
========================= */

async function submitPost(){

 const text=$("postText").value.trim();

 const imageFile=
 $("postImage").files[0];

 const privacy=
 $("postPrivacy").value;

 const feeling=
 $("postFeeling").value.trim();

 if(!text&&!imageFile){

  toast("Text অথবা Photo দিন");
  return;
 }

 let image=null;

 if(imageFile){

  const ext=
   imageFile.name.split(".").pop();

  const path=
   currentUser.id+
   "/"+
   Date.now()+
   "."+
   ext;

  const {error:uploadError}=
  await db.storage
  .from("post-images")
  .upload(path,imageFile);

  if(uploadError){

   toast(
    "Image upload error: "+
    uploadError.message
   );

   return;
  }

  const {data:urlData}=
  db.storage
  .from("post-images")
  .getPublicUrl(path);

  image=urlData.publicUrl;
 }

 const {error}=await db
 .from("posts")
 .insert({

  user_id:currentUser.id,

  text:text,

  image_url:image,

  privacy:privacy,

  feeling:feeling||null

 });

 if(error){

  toast(error.message);
  return;
 }

 $("postText").value="";
 $("postImage").value="";
 $("postFeeling").value="";

 toast("Post published");

 await loadPosts(true);
}

/* =========================
 LOAD POSTS
========================= */

async function loadPosts(reset=true){

 const feed=$("feed");

 if(!feed)return;

 if(reset){

  feed.innerHTML=
  `<div class="card">Loading Feed...</div>`;
 }

 const {data:posts,error}=
 await db
 .from("posts")
 .select("*")
 .order("created_at",{ascending:false})
 .limit(feedLimit);

 if(error){

  feed.innerHTML=`
   <div class="card">
    ${esc(error.message)}
   </div>
  `;

  return;
 }

 allPosts=posts||[];

 if(!allPosts.length){

  feed.innerHTML=`
   <div class="card empty">
    📰 এখনো কোনো Post নেই।
   </div>
  `;

  return;
 }

 let html="";

 for(const post of allPosts){

  html+=await renderPost(post);
 }

 html+=`

 <button
  class="load-more"
  onclick="loadMorePosts()">

  🔄 Load More

 </button>

 `;

 feed.innerHTML=html;
}

/* =========================
 RENDER POST
========================= */

async function renderPost(post){

 let author="User";
 let avatar="";

 const {data:p}=await db
 .from("my social app")
 .select("name,profile_photo")
 .eq("id",post.user_id)
 .maybeSingle();

 if(p){

  author=p.name||"User";
  avatar=p.profile_photo||"";
 }

 const {count:likeCount}=
 await db
 .from("post_reactions")
 .select("*",{count:"exact",head:true})
 .eq("post_id",post.id);

 const {data:myReaction}=
 await db
 .from("post_reactions")
 .select("id,reaction")
 .eq("post_id",post.id)
 .eq("user_id",currentUser.id)
 .maybeSingle();

 const {count:commentCount}=
 await db
 .from("comments")
 .select("*",{count:"exact",head:true})
 .eq("post_id",post.id);

 const viewCount=
 post.view_count||0;

 const isOwner=
 post.user_id===currentUser.id;

 let isPinned=false;

 const {data:pinned}=await db
 .from("pinned_posts")
 .select("id")
 .eq("post_id",post.id)
 .eq("user_id",currentUser.id)
 .maybeSingle();

 if(pinned)isPinned=true;

 const reactionEmoji=
 myReaction?.reaction==="love" ? "❤️":
 myReaction?.reaction==="haha" ? "😂":
 myReaction?.reaction==="wow" ? "😮":
 myReaction?.reaction==="sad" ? "😢":
 myReaction?.reaction==="angry" ? "😡":
 "👍";

 return `

 <div class="card post-wrap">

  ${
   isPinned
   ? `<div class="pinned">
       📌 Pinned Post
      </div>`
   : ""
  }

  <div class="post-head">

   ${
    avatar
    ? `<img
        class="avatar"
        src="${esc(avatar)}">`
    : `<div class="avatar"></div>`
   }

   <div style="flex:1">

    <div class="post-name">
     ${esc(author)}
    </div>

    <div class="post-time">

     ${
      post.created_at
      ? new Date(post.created_at)
        .toLocaleString()
      : ""
     }

     • ${
       post.privacy==="friends"
       ? "👥 Friends"
       : post.privacy==="private"
       ? "🔒 Only me"
       : "🌍 Public"
     }

    </div>

   </div>

   <button
    class="secondary"
    style="padding:7px 10px"
    onclick="togglePostMenu(${post.id})">

    ⋯

   </button>

  </div>

  <div id="menu-${post.id}"
       class="post-menu"
       style="display:none">

   ${
    isOwner
    ? `
      <button
       onclick="editPost(${post.id})">
       ✏️ Edit Post
      </button>

      <button
       onclick="deletePost(${post.id})">
       🗑️ Delete Post
      </button>
      `
    : ""
   }

   <button
    onclick="pinPost(${post.id},${isPinned})">

    ${
     isPinned
     ? "📌 Unpin Post"
     : "📌 Pin Post"
    }

   </button>

   <button
    onclick="sharePost(${post.id})">
    ↗️ Share
   </button>

  </div>

  ${
   post.feeling
   ? `<div style="margin-top:9px">
       😊 ${esc(post.feeling)}
      </div>`
   : ""
  }

  ${
   post.text
   ? `<div class="post-text">
       ${esc(post.text)}
      </div>`
   : ""
  }

  ${
   post.image_url
   ? `<img
       class="post-image"
       src="${esc(post.image_url)}"
       loading="lazy">`
   : ""
  }

  <div class="post-meta">

   <span>
    ${reactionEmoji}
    ${likeCount||0}
   </span>

   <span>
    💬 ${commentCount||0}
    &nbsp; 👁️ ${viewCount}
   </span>

  </div>

  <div class="actions">

   <button
    class="${myReaction ? "active":""}"
    onclick="showReactionBox(${post.id})">

    ${reactionEmoji}
    ${myReaction ? "Reacted":"Like"}

   </button>

   <button
    onclick="commentPost(${post.id})">

    💬 Comment

   </button>

   <button
    onclick="sharePost(${post.id})">

    ↗️ Share

   </button>

  </div>

  <div
   id="reaction-${post.id}"
   style="display:none;margin-top:6px">

   <div class="reaction-box">

    <button
     onclick="reactPost(${post.id},'like')">
     👍
    </button>

    <button
     onclick="reactPost(${post.id},'love')">
     ❤️
    </button>

    <button
     onclick="reactPost(${post.id},'haha')">
     😂
    </button>

    <button
     onclick="reactPost(${post.id},'wow')">
     😮
    </button>

    <button
     onclick="reactPost(${post.id},'sad')">
     😢
    </button>

    <button
     onclick="reactPost(${post.id},'angry')">
     😡
    </button>

   </div>

  </div>

 </div>
 `;
}

/* =========================
 LOAD MORE
========================= */

async function loadMorePosts(){

 feedLimit+=20;

 await loadPosts(true);
}

/* =========================
 POST MENU
========================= */

function togglePostMenu(postId){

 document
 .querySelectorAll(".post-menu")
 .forEach(x=>{
  x.style.display="none";
 });

 const menu=$("menu-"+postId);

 if(menu){

  menu.style.display=
   menu.style.display==="none"
   ? "block"
   : "none";
 }
}

/* =========================
 REACTION BOX
========================= */

function showReactionBox(postId){

 const box=$("reaction-"+postId);

 if(!box)return;

 box.style.display=
  box.style.display==="none"
  ? "block"
  : "none";
}

/* =========================
 POST REACTION
========================= */

async function reactPost(postId,reaction){

 const {data:existing}=await db
 .from("post_reactions")
 .select("id,reaction")
 .eq("post_id",postId)
 .eq("user_id",currentUser.id)
 .maybeSingle();

 if(existing){

  if(existing.reaction===reaction){

   const {error}=await db
   .from("post_reactions")
   .delete()
   .eq("id",existing.id);

   if(error){

    toast(error.message);
    return;
   }

  }else{

   const {error}=await db
   .from("post_reactions")
   .update({
    reaction:reaction
   })
   .eq("id",existing.id);

   if(error){

    toast(error.message);
    return;
   }
  }

 }else{

  const {error}=await db
  .from("post_reactions")
  .insert({

   post_id:postId,

   user_id:currentUser.id,

   reaction:reaction

  });

  if(error){

   toast(error.message);
   return;
  }
 }

 await loadPosts(true);
}

/* =========================
 POST COMMENT
========================= */

async function commentPost(postId){

 openModal(`

  <h3>💬 Comments</h3>

  <div id="postComments">
   Loading...
  </div>

  <div style="
   display:flex;
   gap:5px;
   margin-top:10px">

   <input

    style="flex:1">

   <button
    class="primary"
    style="width:auto"
    onclick="addPostComment(${postId})">

    Send

   </button>

  </div>

 `);

 await loadPostComments(postId);

async function loadPostComments(postId){

 const box=$("postComments");

 const {data,error}=await db
 .from("comments")
 .select("id,post_id,user_id,text,created_at")
 .eq("post_id",postId)
 .order("created_at",{ascending:true});

 if(error){

  box.innerHTML=
   esc(error.message);

  return;
 }

 let html="";

 for(const c of data||[]){

  html+=`

   <div class="comment">

    ${esc(c.text)}

    <div style="
     font-size:11px;
     color:#777;
     margin-top:4px">

     ${
      c.created_at
      ? new Date(c.created_at)
       .toLocaleString()
      : ""
     }

    </div>

   </div>

  `;
 }

 box.innerHTML=
  html||"No comments yet.";
}

async function addPostComment(postId){

 const input=$("postCommentInput");

 const text=input.value.trim();

 if(!text){

  toast("Comment লিখুন");
  return;
 }

 const {error}=await db
 .from("comments")
 .insert({

  post_id:postId,

  user_id:currentUser.id,

  text:text

 });

 if(error){

  toast(error.message);
  return;
 }

 input.value="";

 await loadPostComments(postId);

 await loadPosts(true);
}

/* =========================
 EDIT POST
========================= */

async function editPost(postId){

 const post=allPosts.find(
  x=>x.id===postId
 );

 if(!post)return;

 openModal(`

  <h3>✏️ Edit Post</h3>

  <textarea
   id="editPostText"
   rows="5">${esc(post.text||"")}</textarea>

  <input
   id="editFeeling"
   placeholder="Feeling / Activity"
   value="${esc(post.feeling||"")}">

  <select id="editPrivacy">

   <option value="public"
    ${post.privacy==="public"?"selected":""}>
    🌍 Public
   </option>

   <option value="friends"
    ${post.privacy==="friends"?"selected":""}>
    👥 Friends
   </option>

   <option value="private"
    ${post.privacy==="private"?"selected":""}>
    🔒 Only me
   </option>

  </select>

  <button
   class="primary"
   style="width:100%"
   onclick="saveEditPost(${postId})">

   Save Changes

  </button>

 `);
}

async function saveEditPost(postId){

 const text=
 $("editPostText").value.trim();

 const feeling=
 $("editFeeling").value.trim();

 const privacy=
 $("editPrivacy").value;

 const {error}=await db
 .from("posts")
 .update({

  text:text,

  feeling:
   feeling||null,

  privacy:privacy,

  edited_at:
   new Date().toISOString()

 })
 .eq("id",postId)
 .eq("user_id",currentUser.id);

 if(error){

  toast(error.message);
  return;
 }

 closeModal();

 toast("Post updated");

 await loadPosts(true);
}

/* =========================
 PIN POST
========================= */

async function pinPost(postId,isPinned){

 if(isPinned){

  const {error}=await db
  .from("pinned_posts")
  .delete()
  .eq("post_id",postId)
  .eq("user_id",currentUser.id);

  if(error){

   toast(error.message);
   return;
  }

  toast("Post unpinned");

 }else{

  const {error}=await db
  .from("pinned_posts")
  .insert({

   user_id:currentUser.id,

   post_id:postId

  });

  if(error){

   toast(error.message);
   return;
  }

  toast("Post pinned");
 }

 await loadPosts(true);
}

/* =========================
 SHARE
========================= */

async function sharePost(postId){

 const url=
  location.href+
  "#post-"+postId;

 if(navigator.share){

  try{

   await navigator.share({

    title:"My Social App",

    text:"Check this post",

    url:url

   });

  }catch(e){}

 }else{

  try{

   await navigator.clipboard
   .writeText(url);

   toast("Post link copied");

  }catch(e){

   toast(url);
  }
 }
}

async function showReels(){

 $("content").innerHTML=`

 <div class="card">

  <h2>🎬 Reels</h2>

 </div>

 <div id="reelsList">
  Loading...
 </div>

 `;

async function loadReels(){

 const box=$("reelsList");

 const {data:reels,error}=
 await db
 .from("reels")
 .select("*")
 .order("created_at",{ascending:false})
 .limit(50);

 if(error){

  box.innerHTML=`

   <div class="card">
    ${esc(error.message)}
   </div>

  `;

  return;
 }

 if(!reels||!reels.length){

  box.innerHTML=`

   <div class="card empty">
    No reels yet.
   </div>

  `;

  return;
 }

 let html="";

 for(const reel of reels){

  const {count:likes}=
  await db
  .from("reel_likes")
  .select("*",{count:"exact",head:true})
  .eq("reel_id",reel.id);

  html+=`

  <div class="reel">

   <video
    src="${esc(reel.video_url)}"
    controls
    playsinline
    loop>
   </video>

   <div class="reel-info">

    ${
     reel.caption
     ? `<div>
         ${esc(reel.caption)}
        </div>`
     : ""
    }

    ${
     reel.audio_name
     ? `<div style="font-size:13px;margin-top:5px">
         🎵 ${esc(reel.audio_name)}
        </div>`
     : ""
    }

   </div>

   <div class="reel-actions">

    <button
     onclick="likeReel(${reel.id})">

     ❤️ ${likes||0}

    </button>

    <button
     onclick="commentReel(${reel.id})">

     💬 Comment

    </button>

    <button
     onclick="shareReel(${reel.id})">

     ↗ Share

    </button>

   </div>

  </div>

  `;
 }

 box.innerHTML=html;
}

 .from("reel_likes")

  .from("reel_likes")

  .from("reel_likes")

   user_id:currentUser.id

  });

  }
 }

 await loadReels();
}

function editProfile(){

 openModal(`

  <h3>✏️ Edit Profile</h3>

  <input
   id="editName"
   value="${esc(profile?.name||"")}"
   placeholder="Name">

  <input
   id="editPhoto"
   placeholder="Profile photo URL"
   value="${esc(profile?.profile_photo||"")}">

  <input
   id="editCover"
   placeholder="Cover photo URL"
   value="${esc(profile?.cover_photo||"")}">

  <button
   class="primary"
   style="width:100%"
   onclick="saveProfile()">

   Save

  </button>

 `);
}

async function saveProfile(){

 const name=$("editName").value.trim();

 const photo=$("editPhoto").value.trim();

 const cover=$("editCover").value.trim();

 const {data,error}=await db
 .from("my social app")
 .upsert({

  id:currentUser.id,

  name:name,

  profile_photo:
   photo||null,

  cover_photo:
   cover||null

 })
 .select()
 .single();

 if(error){

  toast(error.message);
  return;
 }

 profile=data;

 closeModal();

 toast("Profile updated");

 showProfile();
}

function showSearch(){

 $("content").innerHTML=`

 <div class="card">

  <h2>🔍 Search</h2>

  <input
   id="searchInput"
   placeholder="Search people..."
   onkeydown="
    if(event.key==='Enter')
    searchUsers()
   ">

  <button
   class="primary"
   style="width:100%"
   onclick="searchUsers()">

   Search

  </button>

 </div>

 <div id="searchResults"></div>

 `;
}

async function searchUsers(){

 const q=$("searchInput").value.trim();

 if(!q)return;

 const {data,error}=await db
 .from("my social app")
 .select("id,name,profile_photo")
 .ilike(
  "name",
  "%"+q+"%"
 )
 .limit(30);

 if(error){

  $("searchResults").innerHTML=
  `<div class="card">
   ${esc(error.message)}
  </div>`;

  return;
 }

 if(!data?.length){

  $("searchResults").innerHTML=
  `<div class="card empty">
   No users found.
  </div>`;

  return;
 }

 let html="";

 for(const u of data){

  html+=`

  <div class="card">

   <div class="post-head">

    ${
     u.profile_photo
     ? `<img
         class="avatar"
         src="${esc(u.profile_photo)}">`
     : `<div class="avatar"></div>`
    }

    <div style="flex:1">

     <b>
      ${esc(u.name||"User")}
     </b>

    </div>

    ${
     u.id!==currentUser.id
     ? `<button
         class="primary"
         onclick="followUser('${u.id}')">
         Follow
        </button>`
     : ""
    }

   </div>

  </div>

  `;
 }

 $("searchResults").innerHTML=html;
}

/* =========================
 FOLLOW

async function followUser(userId){

 const {data:existing}=
 await db
 .from("follows")
 .select("id")
 .eq("follower_id",currentUser.id)
 .eq("following_id",userId)
 .maybeSingle();

 if(existing){

  const {error}=await db
  .from("follows")
  .delete()
  .eq("id",existing.id);

  if(error){

   toast(error.message);
   return;
  }

  toast("Unfollowed");

 }else{

  const {error}=await db
  .from("follows")
  .insert({

   follower_id:currentUser.id,

   following_id:userId

  });

  if(error){

   toast(error.message);
   return;
  }

  toast("Following");
 }
}

async function showMonetization(){

 const {data}=await db
 .from("creator_settings")
 .select("*")
 .eq("user_id",currentUser.id)
 .maybeSingle();

 openModal(`

  <h3>💰 Monetization</h3>

  <p>
   Content Monetization
  </p>

  <label>

   <input
    type="checkbox"
    id="monetizationEnabled"
    ${data?.monetization_enabled?"checked":""}>

   Enable Monetization

  </label>

  <input
   id="payoutEmail"
   placeholder="Payout email"
   value="${esc(data?.payout_email||"")}">

  <select id="payoutMethod">

   <option value="">
    Select payout method
   </option>

   <option value="bank"
    ${data?.payout_method==="bank"?"selected":""}>
    Bank
   </option>

   <option value="paypal"
    ${data?.payout_method==="paypal"?"selected":""}>

   </option>

  </select>

  <button
   class="primary"
   style="width:100%"
   onclick="saveMonetization()">

   Save

  </button>

 `);
}

async function saveMonetization(){

 const enabled=
  $("monetizationEnabled").checked;

 const email=
  $("payoutEmail").value.trim();

 const method=
  $("payoutMethod").value;

 const {error}=await db
 .from("creator_settings")
 .upsert({

  user_id:currentUser.id,

  monetization_enabled:enabled,

  payout_email:
   email||null,

  payout_method:
   method||null,

  updated_at:
   new Date().toISOString()

 });

 if(error){

  toast(error.message);
  return;
 }

 toast("Monetization settings saved");

 closeModal();
}

/* =========================
 START
========================= */

async function start(){

 if(
  localStorage.getItem("darkMode")
  ==="true"
 ){

  document.body.classList.add("dark");
 }

 const {
  data:{session}
 }=
 await db.auth.getSession();

 if(session){

  currentUser=session.user;

  await loadProfile();

  renderApp();

 }else{

  showLogin();
 }

 db.auth.onAuthStateChange(
 async(event,session)=>{

  if(session&&!currentUser){

   currentUser=session.user;

   await loadProfile();

   renderApp();
  }

  if(!session){

   currentUser=null;

   profile=null;

   showLogin();
  }

 });
}

start();
