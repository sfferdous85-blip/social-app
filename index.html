<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1877f2">
<title>My Social App</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:#f0f2f5;
  color:#1c1e21;
}
body.dark{
  background:#18191a;
  color:#e4e6eb;
}
button,input,textarea,select{
  font:inherit;
}
button{
  cursor:pointer;
}
.topbar{
  position:sticky;
  top:0;
  z-index:100;
  height:60px;
  background:#fff;
  display:flex;
  align-items:center;
  gap:12px;
  padding:8px 15px;
  box-shadow:0 1px 4px #0002;
}
.dark .topbar{
  background:#242526;
}
.logo{
  color:#1877f2;
  font-size:25px;
  font-weight:800;
}
.search{
  width:240px;
  padding:10px 14px;
  border:0;
  border-radius:25px;
  background:#f0f2f5;
  outline:0;
}
.dark .search{
  background:#3a3b3c;
  color:#fff;
}
.spacer{flex:1}
.navbtn{
  border:0;
  background:transparent;
  padding:10px;
  border-radius:10px;
}
.navbtn:hover{
  background:#eee;
}
.dark .navbtn:hover{
  background:#3a3b3c;
}
.layout{
  max-width:1250px;
  margin:auto;
  display:grid;
  grid-template-columns:220px minmax(0,650px) 260px;
  gap:18px;
  padding:18px;
}
.sidebar,.rightbar{
  position:sticky;
  top:78px;
  height:max-content;
}
.menu{
  display:flex;
  flex-direction:column;
  gap:5px;
}
.menu button{
  border:0;
  background:transparent;
  text-align:left;
  padding:12px;
  border-radius:10px;
}
.menu button:hover{
  background:#ddd;
}
.dark .menu button:hover{
  background:#3a3b3c;
}
.card{
  background:#fff;
  border-radius:12px;
  padding:15px;
  margin-bottom:15px;
  box-shadow:0 1px 3px #0002;
}
.dark .card{
  background:#242526;
}
.auth{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.authbox{
  width:100%;
  max-width:430px;
}
.authbox h1{
  color:#1877f2;
  text-align:center;
  font-size:38px;
}
.authbox input{
  width:100%;
  padding:14px;
  margin:6px 0;
  border:1px solid #ccd0d5;
  border-radius:8px;
}
.primary{
  width:100%;
  border:0;
  background:#1877f2;
  color:#fff;
  padding:13px;
  border-radius:8px;
  font-weight:bold;
}
.green{
  background:#42b72a;
}
.muted{
  color:#65676b;
}
.avatar{
  width:45px;
  height:45px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd;
}
.userrow{
  display:flex;
  align-items:center;
  gap:10px;
}
.create{
  display:flex;
  gap:10px;
  align-items:center;
}
.create input{
  flex:1;
  border:0;
  background:#f0f2f5;
  padding:12px 16px;
  border-radius:25px;
}
.dark .create input{
  background:#3a3b3c;
  color:#fff;
}
.posthead{
  display:flex;
  gap:10px;
  align-items:center;
}
.posttext{
  white-space:pre-wrap;
  margin:12px 0;
  line-height:1.5;
}
.postimg,.postvideo{
  width:100%;
  max-height:650px;
  object-fit:cover;
  border-radius:10px;
}
.actions{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  border-top:1px solid #ddd;
  border-bottom:1px solid #ddd;
  margin-top:10px;
}
.dark .actions{
  border-color:#3e4042;
}
.actions button{
  border:0;
  background:transparent;
  padding:11px 4px;
}
.actions button:hover{
  background:#eee;
}
.dark .actions button:hover{
  background:#3a3b3c;
}
.commentbox{
  display:flex;
  gap:8px;
  margin-top:10px;
}
.commentbox input{
  flex:1;
  border:0;
  background:#f0f2f5;
  border-radius:20px;
  padding:10px 14px;
}
.dark .commentbox input{
  background:#3a3b3c;
  color:#fff;
}
.comment{
  margin-top:8px;
  padding:8px 12px;
  border-radius:12px;
  background:#f0f2f5;
}
.dark .comment{
  background:#3a3b3c;
}
.profilecover{
  height:230px;
  background:#1877f2;
  border-radius:12px 12px 0 0;
  background-size:cover;
  background-position:center;
}
.profilemain{
  padding:15px;
  margin-bottom:15px;
}
.profilephoto{
  width:130px;
  height:130px;
  border-radius:50%;
  border:5px solid #fff;
  object-fit:cover;
  margin-top:-70px;
  background:#ddd;
}
.dark .profilephoto{
  border-color:#242526;
}
.row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}
.smallbtn{
  border:0;
  padding:9px 14px;
  border-radius:7px;
  background:#e4e6eb;
}
.dark .smallbtn{
  background:#3a3b3c;
  color:#fff;
}
.modal{
  position:fixed;
  inset:0;
  background:#0008;
  z-index:500;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
}
.modal.show{display:flex}
.modalbox{
  width:100%;
  max-width:520px;
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:14px;
  padding:20px;
}
.dark .modalbox{
  background:#242526;
}
.modalbox input,
.modalbox textarea,
.modalbox select{
  width:100%;
  padding:12px;
  margin:7px 0;
  border:1px solid #ccd0d5;
  border-radius:8px;
}
.dark .modalbox input,
.dark .modalbox textarea,
.dark .modalbox select{
  background:#3a3b3c;
  color:#fff;
  border-color:#555;
}
.reactions{
  display:flex;
  gap:4px;
  margin:7px 0;
}
.reactions button{
  border:0;
  background:#f0f2f5;
  border-radius:20px;
  padding:6px 10px;
}
.dark .reactions button{
  background:#3a3b3c;
  color:#fff;
}
.hidden{display:none!important}
.status{
  text-align:center;
  padding:10px;
}
.mobilebar{
  display:none;
}
@media(max-width:950px){
  .layout{
    grid-template-columns:70px minmax(0,1fr);
  }
  .rightbar{display:none}
  .sidebar span{display:none}
}
@media(max-width:650px){
  .topbar{
    height:55px;
  }
  .logo{
    font-size:20px;
  }
  .search{
    width:130px;
  }
  .layout{
    display:block;
    padding:8px;
  }
  .sidebar{display:none}
  .mobilebar{
    display:flex;
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    z-index:200;
    background:#fff;
    box-shadow:0 -2px 6px #0002;
    justify-content:space-around;
    padding:7px;
  }
  .dark .mobilebar{
    background:#242526;
  }
  .mobilebar button{
    border:0;
    background:transparent;
    font-size:20px;
  }
}
</style>
</head>

<body>

<div id="authScreen" class="auth">
  <div class="authbox">
    <h1>My Social App</h1>

    <div class="card">
      <input id="authEmail" type="email" placeholder="Email">
      <input id="authPassword" type="password" placeholder="Password">

      <button class="primary" onclick="login()">Login</button>

      <br><br>

      <button class="primary green" onclick="signup()">
        Create New Account
      </button>

      <div id="authMsg" class="status muted"></div>
    </div>
  </div>
</div>

<div id="app" class="hidden">

<header class="topbar">
  <div class="logo">My Social App</div>

  <input
    id="searchInput"
    class="search"
    placeholder="Search..."
    onkeydown="if(event.key==='Enter') searchUsers()"
  >

  <div class="spacer"></div>

  <button class="navbtn" onclick="toggleDark()">🌙</button>
  <button class="navbtn" onclick="openProfile()">👤</button>
  <button class="navbtn" onclick="logout()">🚪</button>
</header>

<div class="layout">

<aside class="sidebar">
  <div class="card">
    <div class="menu">
      <button onclick="showHome()">🏠 <span>Home</span></button>
      <button onclick="openProfile()">👤 <span>Profile</span></button>
      <button onclick="loadFriends()">👥 <span>Friends</span></button>
      <button onclick="loadNotifications()">🔔 <span>Notifications</span></button>
      <button onclick="loadReels()">🎬 <span>Reels</span></button>
      <button onclick="loadSaved()">🔖 <span>Saved</span></button>
      <button onclick="showSettings()">⚙️ <span>Settings</span></button>
    </div>
  </div>
</aside>

<main id="main"></main>

<aside class="rightbar">

  <div class="card">
    <b>My Social App</b>
    <p class="muted">Connect with people and share your moments.</p>
  </div>

  <div class="card">
    <b>Quick Actions</b>
    <br><br>
    <button class="smallbtn" onclick="openPostModal()">➕ Create Post</button>
    <br><br>
    <button class="smallbtn" onclick="openProfile()">👤 My Profile</button>
  </div>

</aside>

</div>

<div class="mobilebar">
  <button onclick="showHome()">🏠</button>
  <button onclick="loadReels()">🎬</button>
  <button onclick="openPostModal()">➕</button>
  <button onclick="loadNotifications()">🔔</button>
  <button onclick="openProfile()">👤</button>
</div>

</div>

<!-- POST MODAL -->
<div id="postModal" class="modal">
  <div class="modalbox">

    <h2>Create Post</h2>

    <textarea
      id="postText"
      rows="5"
      placeholder="What's on your mind?"
    ></textarea>

    <select id="postPrivacy">
      <option value="public">🌎 Public</option>
      <option value="friends">👥 Friends</option>
      <option value="only_me">🔒 Only Me</option>
    </select>

    <input id="postLocation" placeholder="📍 Location">

    <input id="postImage" type="file" accept="image/*">

    <input id="postVideo" type="file" accept="video/*">

    <div class="row">
      <button class="primary" onclick="createPost()">Publish</button>
      <button class="smallbtn" onclick="closeModal('postModal')">Cancel</button>
    </div>

    <div id="postMsg" class="status"></div>

  </div>
</div>

<!-- PROFILE MODAL -->
<div id="profileModal" class="modal">
  <div class="modalbox">

    <h2>Edit Profile</h2>

    <input id="editName" placeholder="Name">
    <input id="editUsername" placeholder="Username">
    <textarea id="editBio" rows="3" placeholder="Bio"></textarea>

    <label>Profile Photo</label>
    <input id="profileFile" type="file" accept="image/*">

    <label>Cover Photo</label>
    <input id="coverFile" type="file" accept="image/*">

    <button class="primary" onclick="saveProfile()">Save Profile</button>

    <br><br>

    <button class="smallbtn" onclick="closeModal('profileModal')">
      Cancel
    </button>

    <div id="profileMsg" class="status"></div>

  </div>
</div>

<script>
/* ============================================
   SUPABASE CONFIG
============================================ */

const SUPABASE_URL =
  "https://skereuaizdczbvjplisi.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_3R2otJA1zIlsMsTYxe1ocw_NAPY5O9x";

const { createClient } =
  supabase;

const db = createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser = null;
let currentProfile = null;


/* ============================================
   HELPERS
============================================ */

function $(id){
  return document.getElementById(id);
}

function escapeHTML(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function toast(message){
  alert(message);
}

function closeModal(id){
  $(id).classList.remove("show");
}

function toggleDark(){
  document.body.classList.toggle("dark");
  localStorage.setItem(
    "dark",
    document.body.classList.contains("dark")
  );
}


/* ============================================
   AUTH
============================================ */

async function signup(){

  const email = $("authEmail").value.trim();
  const password = $("authPassword").value;

  if(!email || !password){
    $("authMsg").textContent =
      "Email এবং Password দিন";
    return;
  }

  if(password.length < 6){
    $("authMsg").textContent =
      "Password কমপক্ষে 6 অক্ষরের হতে হবে";
    return;
  }

  $("authMsg").textContent =
    "Account তৈরি হচ্ছে...";

  const {data,error} =
    await db.auth.signUp({
      email,
      password
    });

  if(error){
    $("authMsg").textContent =
      error.message;
    return;
  }

  if(data.user){

    await createInitialProfile(
      data.user
    );

    $("authMsg").textContent =
      "Account তৈরি হয়েছে। এখন Login করুন।";
  }
}


async function login(){

  const email =
    $("authEmail").value.trim();

  const password =
    $("authPassword").value;

  if(!email || !password){
    $("authMsg").textContent =
      "Email এবং Password দিন";
    return;
  }

  $("authMsg").textContent =
    "Login হচ্ছে...";

  const {data,error} =
    await db.auth.signInWithPassword({
      email,
      password
    });

  if(error){
    $("authMsg").textContent =
      error.message;
    return;
  }

  currentUser = data.user;

  await initializeApp();
}


async function logout(){

  await db.auth.signOut();

  currentUser = null;
  currentProfile = null;

  $("app").classList.add("hidden");
  $("authScreen").classList.remove("hidden");
}


async function createInitialProfile(user){

  const {data,error} =
    await db
      .from("profiles")
      .insert({
        id:user.id,
        name:
          user.email?.split("@")[0] ||
          "User",
        username:
          "user_" +
          user.id.substring(0,8),
        bio:""
      })
      .select()
      .single();

  if(!error){
    currentProfile = data;
  }
}


/* ============================================
   APP INIT
============================================ */

async function initializeApp(){

  $("authScreen").classList.add("hidden");
  $("app").classList.remove("hidden");

  if(localStorage.getItem("dark")==="true"){
    document.body.classList.add("dark");
  }

  await loadMyProfile();
  await showHome();
}


async function loadMyProfile(){

  if(!currentUser) return;

  const {data,error} =
    await db
      .from("profiles")
      .select("*")
      .eq("id",currentUser.id)
      .maybeSingle();

  if(error){
    console.error(error);
    return;
  }

  if(!data){
    await createInitialProfile(currentUser);
    return;
  }

  currentProfile = data;
}


/* ============================================
   HOME
============================================ */

async function showHome(){

  $("main").innerHTML = `
    <div class="card create">
      <img
        class="avatar"
        src="${escapeHTML(
          currentProfile?.profile_photo ||
          "https://placehold.co/100x100"
        )}"
      >

      <input
        placeholder="What's on your mind?"
        onclick="openPostModal()"
        readonly
      >
    </div>

    <div id="feed">
      <div class="card status">
        Loading posts...
      </div>
    </div>
  `;

  await loadPosts();
}


async function loadPosts(){

  const {data,error} =
    await db
      .from("posts")
      .select(`
        *,
        profiles:user_id(
          id,
          name,
          username,
          profile_photo
        )
      `)
      .order("created_at",{ascending:false})
      .limit(50);

  if(error){

    console.error(error);

    $("feed").innerHTML = `
      <div class="card">
        <b>Posts load হয়নি</b>
        <p>${escapeHTML(error.message)}</p>
      </div>
    `;

    return;
  }

  if(!data?.length){

    $("feed").innerHTML = `
      <div class="card status">
        এখনো কোনো Post নেই। প্রথম Post তুমি করো! 🎉
      </div>
    `;

    return;
  }

  $("feed").innerHTML =
    data.map(postHTML).join("");

  for(const post of data){
    await loadPostStats(post.id);
  }
}


/* ============================================
   POST HTML
============================================ */

function postHTML(post){

  const profile =
    post.profiles || {};

  let media = "";

  if(post.image_url){
    media += `
      <img
        class="postimg"
        src="${escapeHTML(post.image_url)}"
      >
    `;
  }

  if(post.video_url){
    media += `
      <video
        class="postvideo"
        controls
        playsinline
        src="${escapeHTML(post.video_url)}"
      ></video>
    `;
  }

  return `
    <article
      class="card"
      id="post-${post.id}"
    >

      <div class="posthead">

        <img
          class="avatar"
          src="${escapeHTML(
            profile.profile_photo ||
            "https://placehold.co/100x100"
          )}"
        >

        <div>
          <b>
            ${escapeHTML(
              profile.name ||
              "User"
            )}
          </b>

          <div class="muted">
            @${escapeHTML(
              profile.username || ""
            )}
          </div>

          <small class="muted">
            ${new Date(
              post.created_at
            ).toLocaleString()}
          </small>
        </div>

      </div>

      <div class="posttext">
        ${escapeHTML(post.text || "")}
      </div>

      ${media}

      ${
        post.location
        ? `<div class="muted">📍 ${escapeHTML(post.location)}</div>`
        : ""
      }

      <div id="stats-${post.id}"
           class="muted"
           style="margin:8px 0">
        Loading...
      </div>

      <div class="actions">

        <button onclick="toggleLike(${post.id})">
          ❤️ Like
        </button>

        <button onclick="chooseReaction(${post.id})">
          😍 Reaction
        </button>

        <button onclick="focusComment(${post.id})">
          💬 Comment
        </button>

        <button onclick="sharePost(${post.id})">
          ↗ Share
        </button>

      </div>

      <div class="reactions">
        <button onclick="react(${post.id},'like')">👍</button>
        <button onclick="react(${post.id},'love')">❤️</button>
        <button onclick="react(${post.id},'haha')">😂</button>
        <button onclick="react(${post.id},'wow')">😮</button>
        <button onclick="react(${post.id},'sad')">😢</button>
        <button onclick="react(${post.id},'angry')">😡</button>
      </div>

      <div class="commentbox">
        <input
          id="comment-${post.id}"
          placeholder="Write a comment..."
        >
        <button
          class="smallbtn"
          onclick="addComment(${post.id})"
        >
          Send
        </button>
      </div>

      <div id="comments-${post.id}"></div>

      ${
        currentUser?.id === post.user_id
        ? `
          <br>
          <button
            class="smallbtn"
            onclick="deletePost(${post.id})"
          >
            🗑️ Delete
          </button>
        `
        : ""
      }

    </article>
  `;
}


/* ============================================
   POST CREATE
============================================ */

function openPostModal(){
  $("postModal").classList.add("show");
}


async function createPost(){

  if(!currentUser){
    toast("Login করুন");
    return;
  }

  const text =
    $("postText").value.trim();

  const privacy =
    $("postPrivacy").value;

  const location =
    $("postLocation").value.trim();

  const image =
    $("postImage").files[0];

  const video =
    $("postVideo").files[0];

  if(!text && !image && !video){
    $("postMsg").textContent =
      "Post-এর মধ্যে কিছু দিন";
    return;
  }

  $("postMsg").textContent =
    "Uploading...";

  let imageUrl = null;
  let videoUrl = null;

  try{

    if(image){

      const path =
        `${currentUser.id}/${Date.now()}-${image.name}`;

      const {error} =
        await db.storage
          .from("post-images")
          .upload(path,image,{
            upsert:false
          });

      if(error) throw error;

      const {data} =
        db.storage
          .from("post-images")
          .getPublicUrl(path);

      imageUrl =
        data.publicUrl;
    }


    if(video){

      const path =
        `${currentUser.id}/${Date.now()}-${video.name}`;

      const {error} =
        await db.storage
          .from("media")
          .upload(path,video,{
            upsert:false
          });

      if(error) throw error;

      const {data} =
        db.storage
          .from("media")
          .getPublicUrl(path);

      videoUrl =
        data.publicUrl;
    }


    const {error} =
      await db
        .from("posts")
        .insert({
          user_id:currentUser.id,
          text,
          image_url:imageUrl,
          video_url:videoUrl,
          privacy,
          location
        });

    if(error) throw error;

    $("postText").value="";
    $("postLocation").value="";
    $("postImage").value="";
    $("postVideo").value="";

    closeModal("postModal");

    await showHome();

  }catch(error){

    console.error(error);

    $("postMsg").textContent =
      error.message;
  }
}


/* ============================================
   LIKE
============================================ */

async function toggleLike(postId){

  if(!currentUser){
    toast("Login করুন");
    return;
  }

  const {data} =
    await db
      .from("post_likes")
      .select("id")
      .eq("post_id",postId)
      .eq("user_id",currentUser.id)
      .maybeSingle();

  if(data){

    await db
      .from("post_likes")
      .delete()
      .eq("id",data.id);

  }else{

    await db
      .from("post_likes")
      .insert({
        post_id:postId,
        user_id:currentUser.id
      });
  }

  await loadPostStats(postId);
}


async function react(postId,reaction){

  if(!currentUser){
    toast("Login করুন");
    return;
  }

  const {data} =
    await db
      .from("post_reactions")
      .select("id,reaction")
      .eq("post_id",postId)
      .eq("user_id",currentUser.id)
      .maybeSingle();

  if(data){

    if(data.reaction===reaction){

      await db
        .from("post_reactions")
        .delete()
        .eq("id",data.id);

    }else{

      await db
        .from("post_reactions")
        .update({reaction})
        .eq("id",data.id);
    }

  }else{

    await db
      .from("post_reactions")
      .insert({
        post_id:postId,
        user_id:currentUser.id,
        reaction
      });
  }

  await loadPostStats(postId);
}


function chooseReaction(postId){
  const reaction =
    prompt(
      "Reaction লিখুন: like / love / haha / wow / sad / angry"
    );

  if(
    ["like","love","haha","wow","sad","angry"]
      .includes((reaction||"").toLowerCase())
  ){
    react(postId,reaction.toLowerCase());
  }
}


/* ============================================
   POST STATS
============================================ */

async function loadPostStats(postId){

  const likes =
    await db
      .from("post_likes")
      .select("id",{count:"exact",head:true})
      .eq("post_id",postId);

  const reactions =
    await db
      .from("post_reactions")
      .select("id,reaction")
      .eq("post_id",postId);

  const comments =
    await db
      .from("comments")
      .select("id",{count:"exact",head:true})
      .eq("post_id",postId);

  const reactionCount =
    reactions.data?.length || 0;

  const text =
    `❤️ ${likes.count || 0}  •  😍 ${reactionCount}  •  💬 ${comments.count || 0}`;

  const el =
    $(`stats-${postId}`);

  if(el){
    el.textContent=text;
  }

  await loadComments(postId);
}

/* ============================================
   SHARE
============================================ */

async function sharePost(postId){

  const url =
    location.href.split("#")[0] +
    "#post-" +
    postId;

  if(navigator.share){

    await navigator.share({
      title:"My Social App",
      text:"Check this post",
      url
    });

  }else{

    await navigator.clipboard.writeText(url);

    toast("Post link copied");
  }
}

function openEditProfile(){

    currentProfile?.name || "";

  $("profileModal").classList.add("show");

async function uploadImage(bucket,file){

  if(!file) return null;

  const path =
    `${currentUser.id}/${Date.now()}-${file.name}`;

  const {error} =
    await db.storage
      .from(bucket)
      .upload(path,file,{
        upsert:false
      });

  if(error) throw error;

  const {data} =
    db.storage
      .from(bucket)
      .getPublicUrl(path);

  return data.publicUrl;
}


async function saveProfile(){

  try{

    const name =
      $("editName").value.trim();

    const username =
      $("editUsername").value.trim();

    const bio =
      $("editBio").value.trim();

    const profileFile =
      $("profileFile").files[0];

    const coverFile =
      $("coverFile").files[0];

    let profilePhoto =
      currentProfile?.profile_photo ||
      null;

    let coverPhoto =
      currentProfile?.cover_photo ||
      null;

    $("profileMsg").textContent =
      "Saving...";

    if(profileFile){
      profilePhoto =
        await uploadImage(
          "profile-photos",
          profileFile
        );
    }

    if(coverFile){
      coverPhoto =
        await uploadImage(
          "cover-photos",
          coverFile
        );
    }

    const {data,error} =
      await db
        .from("profiles")
        .upsert({
          id:currentUser.id,
          name,
          username,
          bio,
          profile_photo:profilePhoto,
          cover_photo:coverPhoto,
          updated_at:new Date().toISOString()
        })
        .select()
        .single();

    if(error) throw error;

    currentProfile=data;

    closeModal("profileModal");

    await openProfile();

  }catch(error){

    $("profileMsg").textContent =
      error.message;
  }
}

async function toggleFollow(userId){

  const {data} =
    await db
      .from("follows")
      .select("id")
      .eq("follower_id",currentUser.id)
      .eq("following_id",userId)
      .maybeSingle();

  if(data){

    await db
      .from("follows")
      .delete()
      .eq("id",data.id);

    toast("Unfollowed");

  }else{

    await db
      .from("follows")
      .insert({
        follower_id:currentUser.id,
        following_id:userId
      });

    toast("Following");
  }
}

async function loadReels(){

  const {data,error} =
    await db
      .from("reels")
      .select(`
        *,
        profiles:user_id(
          name,
          username,
          profile_photo
        )
      `)
      .order("created_at",{ascending:false})
      .limit(30);

  if(error){

    $("main").innerHTML = `
      <div class="card">
        <h2>Reels</h2>
        <p>${escapeHTML(error.message)}</p>
      </div>
    `;

    return;
  }

  $("main").innerHTML = `

    <div class="card">
      <h2>🎬 Reels</h2>
      <button
        class="smallbtn"
        onclick="createReel()"
      >
        ➕ Upload Reel
      </button>
    </div>

    ${
      (data||[]).map(r=>`

        <div class="card">

          <div class="userrow">

            <img
              class="avatar"
              src="${escapeHTML(
                r.profiles?.profile_photo ||
                "https://placehold.co/100x100"
              )}"
            >

            <b>
              ${escapeHTML(
                r.profiles?.name ||
                "User"
              )}
            </b>

          </div>

          <p>${escapeHTML(r.caption||"")}</p>

          <video
            class="postvideo"
            controls
            playsinline
            src="${escapeHTML(r.video_url)}"
          ></video>

        </div>

      `).join("")
    }
  `;
}


async function createReel(){

  const input =
    document.createElement("input");

  input.type="file";
  input.accept="video/*";

  input.onchange =
    async function(){

      const file =
        input.files[0];

      if(!file) return;

      try{

        const path =
          `${currentUser.id}/${Date.now()}-${file.name}`;

        const {error} =
          await db.storage
            .from("reels")
            .upload(path,file,{
              upsert:false
            });

        if(error) throw error;

        const {data} =
          db.storage
            .from("reels")
            .getPublicUrl(path);

        const caption =
          prompt("Reel caption লিখুন") || "";

        const {error:insertError} =
          await db
            .from("reels")
            .insert({
              user_id:currentUser.id,
              video_url:data.publicUrl,
              caption
            });

        if(insertError)
          throw insertError;

        toast("Reel uploaded");

        await loadReels();

      }catch(error){

        toast(error.message);
      }
    };

  input.click();
}

/* ============================================
   SESSION
============================================ */

async function checkSession(){

  const {data} =
    await db.auth.getSession();

  if(data.session?.user){

    currentUser =
      data.session.user;

    await initializeApp();

  }else{

    $("authScreen")
      .classList
      .remove("hidden");

    $("app")
      .classList
      .add("hidden");
  }
}


/* ============================================
   AUTH STATE
============================================ */

db.auth.onAuthStateChange(
  async (event,session)=>{

    if(session?.user){

      currentUser =
        session.user;

      if(event==="SIGNED_IN"){
        await initializeApp();
      }

    }else{

      currentUser=null;
      currentProfile=null;
    }
  }
);


/* ============================================
   START
============================================ */

checkSession();
