<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1877f2">
<title>My Social</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f0f2f5;
  color:#1c1e21;
}

button,input,textarea,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.header{
  position:sticky;
  top:0;
  z-index:100;
  height:58px;
  background:#1877f2;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
  box-shadow:0 2px 8px #0002;
}

.logo{
  font-size:22px;
  font-weight:bold;
}

.header-right{
  display:flex;
  gap:7px;
}

.header-btn{
  width:40px;
  height:40px;
  border:0;
  border-radius:50%;
  background:#ffffff22;
  color:#fff;
  font-size:20px;
}

.app{
  max-width:1150px;
  margin:auto;
  display:flex;
  min-height:calc(100vh - 58px);
}

.sidebar{
  width:235px;
  padding:12px 8px;
  position:sticky;
  top:58px;
  height:calc(100vh - 58px);
  overflow:auto;
}

.nav-btn{
  width:100%;
  border:0;
  background:transparent;
  padding:12px;
  margin-bottom:3px;
  border-radius:8px;
  text-align:left;
  font-weight:bold;
}

.nav-btn:hover{
  background:#e4e6eb;
}

.main{
  width:100%;
  max-width:700px;
  margin:auto;
  padding:15px;
}

.card{
  background:#fff;
  border-radius:10px;
  padding:15px;
  margin-bottom:15px;
  box-shadow:0 1px 3px #0002;
}

.create-row{
  display:flex;
  align-items:center;
  gap:10px;
  cursor:pointer;
}

.avatar{
  width:43px;
  height:43px;
  border-radius:50%;
  background:#1877f2;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  flex-shrink:0;
}

.create-input{
  flex:1;
  background:#f0f2f5;
  border-radius:25px;
  padding:12px 16px;
  color:#65676b;
}

.create-actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.action-btn{
  flex:1;
  border:0;
  background:#f0f2f5;
  padding:10px;
  border-radius:8px;
  font-weight:bold;
}

.action-btn:hover{
  background:#e4e6eb;
}

.post{
  background:#fff;
  border-radius:10px;
  margin-bottom:15px;
  box-shadow:0 1px 3px #0002;
  overflow:hidden;
}

.post-head{
  display:flex;
  align-items:center;
  gap:10px;
  padding:14px;
}

.post-user{
  font-weight:bold;
}

.post-time{
  color:#65676b;
  font-size:12px;
  margin-top:3px;
}

.post-body{
  padding:0 14px 14px;
  white-space:pre-wrap;
  word-break:break-word;
}

.post-image{
  width:100%;
  max-height:650px;
  object-fit:cover;
  display:block;
}

.post-actions{
  display:flex;
  border-top:1px solid #ddd;
  margin:0 10px;
}

.post-action{
  flex:1;
  border:0;
  background:#fff;
  padding:12px 5px;
  font-weight:bold;
}

.post-action:hover{
  background:#f0f2f5;
}

.input{
  width:100%;
  padding:13px;
  border:1px solid #ccd0d5;
  border-radius:7px;
  margin-bottom:10px;
  outline:none;
}

.primary{
  width:100%;
  border:0;
  background:#1877f2;
  color:#fff;
  padding:13px;
  border-radius:7px;
  font-weight:bold;
}

.secondary{
  width:100%;
  border:0;
  background:#42b72a;
  color:#fff;
  padding:13px;
  border-radius:7px;
  font-weight:bold;
  margin-top:8px;
}

.auth{
  max-width:400px;
  margin:80px auto;
  padding:20px;
}

.auth h1{
  text-align:center;
  color:#1877f2;
}

.modal{
  position:fixed;
  inset:0;
  background:#0008;
  z-index:999;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal-box{
  width:100%;
  max-width:520px;
  background:#fff;
  border-radius:12px;
  padding:18px;
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
}

.close{
  border:0;
  width:35px;
  height:35px;
  border-radius:50%;
  background:#eee;
}

textarea{
  width:100%;
  min-height:120px;
  resize:vertical;
  padding:12px;
  border:1px solid #ccd0d5;
  border-radius:8px;
  outline:none;
}

.file{
  width:100%;
  margin:12px 0;
}

.privacy{
  width:100%;
  padding:10px;
  border:1px solid #ddd;
  border-radius:8px;
  margin-bottom:12px;
}

.message{
  margin-top:10px;
  padding:10px;
  border-radius:8px;
}

.error{
  background:#ffebe9;
  color:#b42318;
}

.success{
  background:#e7f7ed;
  color:#137333;
}

.loading{
  text-align:center;
  padding:25px;
  color:#65676b;
}

.empty{
  text-align:center;
  padding:25px;
  color:#65676b;
}

@media(max-width:750px){

  .sidebar{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    top:auto;
    width:100%;
    height:62px;
    background:#fff;
    z-index:200;
    display:flex;
    padding:4px;
    box-shadow:0 -2px 8px #0002;
    overflow:hidden;
  }

  .nav-btn{
    flex:1;
    text-align:center;
    padding:5px 2px;
    margin:0;
    font-size:10px;
  }

  .main{
    padding-bottom:80px;
  }

  .logo{
    font-size:19px;
  }
}
</style>
</head>

<body>

<!-- LOGIN / REGISTER -->

<div id="authPage">

  <div class="auth card">

    <h1>My Social</h1>

    <input
      id="email"
      class="input"
      type="email"
      placeholder="Email"
    >

    <input
      id="password"
      class="input"
      type="password"
      placeholder="Password"
    >

    <button
      class="primary"
      onclick="login()"
    >
      Login
    </button>

    <button
      class="secondary"
      onclick="register()"
    >
      Create new account
    </button>

    <div id="authMessage"></div>

  </div>

</div>


<!-- APP -->

<div id="appPage" class="hidden">

  <header class="header">

    <div class="logo">
      My Social
    </div>

    <div class="header-right">

      <button
        class="header-btn"
        onclick="openPage('notifications')"
      >🔔</button>

      <button
        class="header-btn"
        onclick="openPage('profile')"
      >👤</button>

    </div>

  </header>


  <div class="app">

    <aside class="sidebar">

      <button class="nav-btn"
        onclick="openPage('home')">
        🏠 Home
      </button>

      <button class="nav-btn"
        onclick="openPage('profile')">
        👤 Profile
      </button>

      <button class="nav-btn"
        onclick="openPage('friends')">
        👥 Friends
      </button>

      <button class="nav-btn"
        onclick="openPage('messenger')">
        💬 Messenger
      </button>

      <button class="nav-btn"
        onclick="openPage('notifications')">
        🔔 Notifications
      </button>

      <button class="nav-btn"
        onclick="openPage('reels')">
        🎬 Reels
      </button>

      <button class="nav-btn"
        onclick="openPage('saved')">
        🔖 Saved
      </button>

      <button class="nav-btn"
        onclick="openPage('trending')">
        🔥 Trending
      </button>

      <button class="nav-btn"
        onclick="openPage('earnings')">
        💰 Earnings
      </button>

      <button class="nav-btn"
        onclick="openPage('settings')">
        ⚙️ Settings
      </button>

      <button class="nav-btn"
        onclick="logout()">
        🚪 Logout
      </button>

    </aside>


    <main class="main">

      <div id="content"></div>

    </main>

  </div>

</div>


<!-- CREATE POST -->

<div id="postModal" class="modal hidden">

  <div class="modal-box">

    <div class="modal-head">

      <strong>✍️ Create Post</strong>

      <button
        class="close"
        onclick="closePostModal()"
      >
        ✕
      </button>

    </div>

    <textarea
      id="postText"
      placeholder="What's on your mind?"
    ></textarea>

    <input
      id="postImage"
      class="file"
      type="file"
      accept="image/*"
    >

    <select
      id="postPrivacy"
      class="privacy"
    >

      <option value="public">
        🌍 Public
      </option>

      <option value="friends">
        👥 Friends
      </option>

      <option value="private">
        🔐 Only me
      </option>

    </select>

    <button
      id="publishBtn"
      class="primary"
      onclick="createPost()"
    >
      Publish
    </button>

    <div id="postMessage"></div>

  </div>

</div>


<script>

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
"https://skereuaizdczbvjplisi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_3R2otJA1zIlsMsTYxe1ocw_NAPY5O9x";

const sb =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser = null;


/* ==========================================
   AUTH
========================================== */

async function checkUser(){

  const result =
    await sb.auth.getUser();

  if(
    result.error ||
    !result.data.user
  ){

    showAuth();
    return;
  }

  currentUser =
    result.data.user;

  showApp();

  await openPage("home");
}


function showAuth(){

  document
    .getElementById("authPage")
    .classList.remove("hidden");

  document
    .getElementById("appPage")
    .classList.add("hidden");
}


function showApp(){

  document
    .getElementById("authPage")
    .classList.add("hidden");

  document
    .getElementById("appPage")
    .classList.remove("hidden");
}


async function login(){

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;

  const box =
    document.getElementById(
      "authMessage"
    );

  box.innerHTML = "";

  const result =
    await sb.auth.signInWithPassword({
      email,
      password
    });

  if(result.error){

    box.innerHTML =
      `<div class="message error">
        ${escapeHtml(result.error.message)}
      </div>`;

    return;
  }

  currentUser =
    result.data.user;

  showApp();

  await openPage("home");
}


async function register(){

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;

  const box =
    document.getElementById(
      "authMessage"
    );

  if(!email || !password){

    box.innerHTML =
      `<div class="message error">
        Email এবং Password দিন।
      </div>`;

    return;
  }

  const result =
    await sb.auth.signUp({
      email,
      password
    });

  if(result.error){

    box.innerHTML =
      `<div class="message error">
        ${escapeHtml(result.error.message)}
      </div>`;

    return;
  }

  if(result.data.user){

    await sb
      .from("profiles")
      .upsert({
        id:result.data.user.id,
        name:email.split("@")[0]
      });

  }

  box.innerHTML =
    `<div class="message success">
      Account তৈরি হয়েছে। এখন Login করুন।
    </div>`;
}


async function logout(){

  await sb.auth.signOut();

  currentUser = null;

  showAuth();
}


/* ==========================================
   PAGE
========================================== */

async function openPage(page){

  if(page === "home"){

    await renderHome();
    return;
  }

  if(page === "profile"){

    await renderProfile();
    return;
  }

  if(page === "settings"){

    renderSettings();
    return;
  }

  const titles = {

    friends:"👥 Friends",

    messenger:"💬 Messenger",

    notifications:"🔔 Notifications",

    reels:"🎬 Reels",

    saved:"🔖 Saved",

    trending:"🔥 Trending",

    earnings:"💰 Earnings"

  };

  document.getElementById(
    "content"
  ).innerHTML = `

    <div class="card">

      <div class="title">
        ${titles[page] || "My Social"}
      </div>

      <p>
        এই Section পরের ধাপে তৈরি করা হবে।
      </p>

    </div>

  `;
}


/* ==========================================
   HOME
========================================== */

async function renderHome(){

  const content =
    document.getElementById(
      "content"
    );

  content.innerHTML = `

    <div class="card">

      <div
        class="create-row"
        onclick="openPostModal()"
      >

        <div class="avatar">
          ${getInitial(
            currentUser?.email
          )}
        </div>

        <div class="create-input">
          ✍️ What's on your mind?
        </div>

      </div>

      <div class="create-actions">

        <button
          class="action-btn"
          onclick="openPostModal()"
        >
          📝 Post
        </button>

        <button
          class="action-btn"
          onclick="openPostModal()"
        >
          🖼️ Photo
        </button>

      </div>

    </div>

    <div id="feed">
      <div class="loading">
        Post loading...
      </div>
    </div>

  `;

  await loadPosts();
}


/* ==========================================
   LOAD POSTS
========================================== */

async function loadPosts(){

  const feed =
    document.getElementById("feed");

  if(!feed) return;


  /*
    IMPORTANT:

    profiles:user_id

    means:
    posts.user_id → profiles.id
  */

  const result =
    await sb
      .from("posts")
      .select(`
        id,
        user_id,
        text,
        image_url,
        privacy,
        created_at,
        profiles:user_id (
          id,
          name,
          username,
          avatar_url
        )
      `)
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(result.error){

    console.error(
      result.error
    );

    feed.innerHTML = `

      <div class="card">

        <div class="message error">

          <b>Post load হয়নি</b>

          <br><br>

          ${escapeHtml(
            result.error.message
          )}

        </div>

      </div>

    `;

    return;
  }


  const posts =
    result.data || [];


  if(posts.length === 0){

    feed.innerHTML = `

      <div class="card empty">
        এখনো কোনো Post নেই।
      </div>

    `;

    return;
  }


  feed.innerHTML =
    posts
      .map(
        post => renderPost(post)
      )
      .join("");
}


/* ==========================================
   RENDER POST
========================================== */

function renderPost(post){

  const profile =
    post.profiles || {};


  const name =
    profile.name ||
    profile.username ||
    "User";


  const initial =
    getInitial(name);


  const date =
    post.created_at
      ? new Date(
          post.created_at
        ).toLocaleString(
          "bn-BD"
        )
      : "";


  let html = `

    <article
      class="post"
      id="post-${escapeAttribute(
        post.id
      )}"
    >

      <div class="post-head">

        <div class="avatar">

          ${escapeHtml(
            initial
          )}

        </div>

        <div>

          <div class="post-user">

            ${escapeHtml(
              name
            )}

          </div>

          <div class="post-time">

            🌍
            ${escapeHtml(
              date
            )}

          </div>

        </div>

      </div>

  `;


  if(post.text){

    html += `

      <div class="post-body">

        ${escapeHtml(
          post.text
        )}

      </div>

    `;

  }


  if(post.image_url){

    html += `

      <img
        class="post-image"
        src="${escapeAttribute(
          post.image_url
        )}"
        alt="Post image"
        loading="lazy"
        onerror="this.style.display='none'"
      >

    `;

  }


  html += `

      <div class="post-actions">

        <button
          class="post-action"
          onclick="likePost('${escapeAttribute(
            post.id
          )}')"
        >
          ❤️ Like
        </button>

        <button
          class="post-action"
          onclick="commentPost('${escapeAttribute(
            post.id
          )}')"
        >
          💬 Comment
        </button>

        <button
          class="post-action"
          onclick="sharePost('${escapeAttribute(
            post.id
          )}')"
        >
          ↗️ Share
        </button>

      </div>

    </article>

  `;


  return html;
}


/* ==========================================
   CREATE POST
========================================== */

function openPostModal(){

  document
    .getElementById(
      "postModal"
    )
    .classList.remove(
      "hidden"
    );

  document
    .getElementById(
      "postText"
    )
    .focus();
}


function closePostModal(){

  document
    .getElementById(
      "postModal"
    )
    .classList.add(
      "hidden"
    );

  document
    .getElementById(
      "postText"
    )
    .value = "";

  document
    .getElementById(
      "postImage"
    )
    .value = "";

  document
    .getElementById(
      "postMessage"
    )
    .innerHTML = "";
}


async function createPost(){

  if(!currentUser){

    alert(
      "আগে Login করুন।"
    );

    return;
  }


  const button =
    document.getElementById(
      "publishBtn"
    );

  const message =
    document.getElementById(
      "postMessage"
    );


  const text =
    document
      .getElementById(
        "postText"
      )
      .value
      .trim();


  const file =
    document
      .getElementById(
        "postImage"
      )
      .files[0];


  const privacy =
    document
      .getElementById(
        "postPrivacy"
      )
      .value;


  if(!text && !file){

    message.innerHTML = `

      <div class="message error">

        কিছু লিখুন অথবা ছবি দিন।

      </div>

    `;

    return;
  }


  button.disabled = true;

  button.innerText =
    "Publishing...";


  try{

    let image_url = null;


    /* PHOTO */

    if(file){

      const ext =
        file.name
          .split(".")
          .pop()
          .toLowerCase();


      const path =
        currentUser.id +
        "/" +
        Date.now() +
        "." +
        ext;


      const upload =
        await sb.storage
          .from(
            "post-images"
          )
          .upload(
            path,
            file,
            {
              upsert:false,
              contentType:file.type
            }
          );


      if(upload.error){

        throw upload.error;
      }


      const publicUrl =
        sb.storage
          .from(
            "post-images"
          )
          .getPublicUrl(
            path
          );


      image_url =
        publicUrl
          .data
          .publicUrl;

    }


    /* DATABASE */

    const result =
      await sb
        .from("posts")
        .insert({

          user_id:
            currentUser.id,

          text:
            text || null,

          image_url:
            image_url,

          privacy:
            privacy

        })
        .select(`
          id,
          user_id,
          text,
          image_url,
          privacy,
          created_at
        `)
        .single();


    if(result.error){

      throw result.error;
    }


    message.innerHTML = `

      <div class="message success">

        ✅ Post Published

      </div>

    `;


    document
      .getElementById(
        "postText"
      )
      .value = "";

    document
      .getElementById(
        "postImage"
      )
      .value = "";


    setTimeout(
      async function(){

        closePostModal();

        await renderHome();

      },
      500
    );


  }catch(error){

    console.error(
      "CREATE POST ERROR:",
      error
    );


    message.innerHTML = `

      <div class="message error">

        Post তৈরি হয়নি:<br><br>

        ${escapeHtml(
          error.message
        )}

      </div>

    `;

  }finally{

    button.disabled = false;

    button.innerText =
      "Publish";

  }
}


/* ==========================================
   PROFILE
========================================== */

async function renderProfile(){

  const content =
    document.getElementById(
      "content"
    );


  const result =
    await sb
      .from("profiles")
      .select("*")
      .eq(
        "id",
        currentUser.id
      )
      .maybeSingle();


  const profile =
    result.data || {};


  const name =
    profile.name ||
    profile.username ||
    currentUser.email
      .split("@")[0];


  content.innerHTML = `

    <div class="card">

      <div
        class="avatar"
        style="
          width:80px;
          height:80px;
          font-size:30px
        "
      >

        ${escapeHtml(
          getInitial(name)
        )}

      </div>

      <h2>

        ${escapeHtml(
          name
        )}

      </h2>

      <p>

        ${escapeHtml(
          currentUser.email
        )}

      </p>

    </div>

  `;
}


/* ==========================================
   SETTINGS
========================================== */

function renderSettings(){

  document.getElementById(
    "content"
  ).innerHTML = `

    <div class="card">

      <div class="title">
        ⚙️ Settings & Privacy
      </div>

      <p>
        Account settings
      </p>

      <button
        class="action-btn"
        onclick="logout()"
      >
        🚪 Logout
      </button>

    </div>

  `;
}


/* ==========================================
   LIKE / COMMENT / SHARE
========================================== */

async function sharePost(postId){

  const url =
    location.href +
    "#post-" +
    postId;


  if(
    navigator.share
  ){

    try{

      await navigator.share({
        title:
          "My Social Post",
        url:url
      });

    }catch(e){}

  }else{

    try{

      await navigator.clipboard
        .writeText(url);

      alert(
        "Post link copied!"
      );

    }catch(e){

      alert(url);

    }

  }
}


/* ==========================================
   HELPERS
========================================== */

function getInitial(value){

  if(!value){

    return "U";

  }

  return value
    .trim()
    .charAt(0)
    .toUpperCase();
}


function escapeHtml(value){

  return String(
    value ?? ""
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );
}


function escapeAttribute(value){

  return escapeHtml(
    value
  );
}
