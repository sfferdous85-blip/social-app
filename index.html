<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1877f2">
  <meta name="description" content="FriendBook - Connect with friends, share posts and watch reels">
  <link rel="manifest" href="./manifest.json">

  <title>FriendBook</title>

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      background:#f0f2f5;
      color:#1c1e21;
    }

    header{
      background:#1877f2;
      color:white;
      padding:14px 18px;
      position:sticky;
      top:0;
      z-index:1000;
      box-shadow:0 2px 8px rgba(0,0,0,.15);
    }

    header h1{
      margin:0;
      font-size:25px;
    }

    .app-name{
      font-weight:bold;
    }

    main{
      max-width:700px;
      margin:20px auto;
      padding:0 12px;
    }

    .card{
      background:white;
      border-radius:12px;
      padding:16px;
      margin-bottom:15px;
      box-shadow:0 2px 8px rgba(0,0,0,.08);
    }

    button{
      border:0;
      border-radius:8px;
      padding:10px 15px;
      cursor:pointer;
      font-size:15px;
    }

    .primary{
      background:#1877f2;
      color:white;
    }

    .danger{
      background:#e41e3f;
      color:white;
    }

    input,textarea,select{
      width:100%;
      padding:12px;
      border:1px solid #ddd;
      border-radius:8px;
      margin:6px 0 10px;
      font-size:15px;
      outline:none;
    }

    textarea{
      min-height:90px;
      resize:vertical;
    }

    .center{
      text-align:center;
    }

    .hidden{
      display:none!important;
    }

    .logo{
      font-size:38px;
      font-weight:bold;
      color:#1877f2;
      margin-bottom:5px;
    }

    .subtitle{
      color:#65676b;
    }

    .post-head{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .avatar{
      width:45px;
      height:45px;
      border-radius:50%;
      object-fit:cover;
      background:#ddd;
    }

    .post-name{
      font-weight:bold;
    }

    .post-time{
      font-size:12px;
      color:#65676b;
    }

    .post-text{
      margin:14px 0;
      white-space:pre-wrap;
      word-break:break-word;
    }

    .post-image{
      width:100%;
      max-height:600px;
      object-fit:cover;
      border-radius:10px;
      margin-top:5px;
    }

    .actions{
      display:flex;
      gap:6px;
      margin-top:12px;
      border-top:1px solid #eee;
      padding-top:10px;
    }

    .actions button{
      flex:1;
      background:#f0f2f5;
    }

    nav{
      display:flex;
      gap:7px;
      overflow-x:auto;
      margin-bottom:15px;
    }

    nav button{
      white-space:nowrap;
      background:white;
    }

    nav button.active{
      background:#1877f2;
      color:white;
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:25px;
      transform:translateX(-50%);
      background:#222;
      color:white;
      padding:12px 18px;
      border-radius:8px;
      z-index:9999;
      display:none;
    }

    .loading{
      text-align:center;
      padding:25px;
      color:#65676b;
    }

    body.dark{
      background:#18191a;
      color:#e4e6eb;
    }

    body.dark .card,
    body.dark nav button{
      background:#242526;
      color:#e4e6eb;
    }

    body.dark input,
    body.dark textarea,
    body.dark select{
      background:#3a3b3c;
      color:white;
      border-color:#555;
    }

    body.dark .actions button{
      background:#3a3b3c;
      color:white;
    }

    body.dark .post-time,
    body.dark .subtitle{
      color:#b0b3b8;
    }

    @media(max-width:600px){
      main{
        margin:10px auto;
      }

      .card{
        border-radius:8px;
      }
    }
  </style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<section id="loginPage" class="center" style="padding:50px 20px;">
  <div class="logo">FriendBook</div>
  <p class="subtitle">বন্ধুদের সাথে যুক্ত থাকুন</p>

  <div class="card" style="max-width:400px;margin:20px auto;">
    <input id="loginEmail" type="email" placeholder="Email">
    <input id="loginPassword" type="password" placeholder="Password">

    <button class="primary" style="width:100%;" onclick="login()">
      Login
    </button>

    <br><br>

    <button style="width:100%;" onclick="showSignup()">
      Create new account
    </button>
  </div>
</section>


<!-- =========================
     SIGNUP
========================= -->

<section id="signupPage" class="center hidden" style="padding:50px 20px;">
  <div class="logo">FriendBook</div>

  <div class="card" style="max-width:400px;margin:20px auto;">
    <input id="signupName" type="text" placeholder="আপনার নাম">
    <input id="signupEmail" type="email" placeholder="Email">
    <input id="signupPassword" type="password" placeholder="Password">

    <button class="primary" style="width:100%;" onclick="signup()">
      Create Account
    </button>

    <br><br>

    <button style="width:100%;" onclick="showLogin()">
      Already have an account? Login
    </button>
  </div>
</section>


<!-- =========================
     APP
========================= -->

<section id="appPage" class="hidden">

  <header>
    <h1>FriendBook</h1>
  </header>

  <main>

    <nav>
      <button onclick="showHome()" id="navHome">
        🏠 Home
      </button>

      <button onclick="showReels()" id="navReels">
        🎬 Reels
      </button>

      <button onclick="showProfile()" id="navProfile">
        👤 Profile
      </button>

      <button onclick="showSearch()" id="navSearch">
        🔎 Search
      </button>

      <button onclick="showSettings()" id="navSettings">
        ⚙️ Settings
      </button>
    </nav>

    <div id="content"></div>

  </main>
</section>


<div id="toast" class="toast"></div>


<script>
/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://skereuaizdczbvjplisi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_3R2otJA1zIlsMsTYxe1ocw_NAPY5O9x";

let currentUser = null;


/* =========================
   BASIC HELPERS
========================= */

function $(id){
  return document.getElementById(id);
}

function toast(message){
  const t = $("toast");

  t.textContent = message;
  t.style.display = "block";

  setTimeout(()=>{
    t.style.display = "none";
  },2500);
}

function showLogin(){
  $("loginPage").classList.remove("hidden");
  $("signupPage").classList.add("hidden");
  $("appPage").classList.add("hidden");
}

function showSignup(){
  $("loginPage").classList.add("hidden");
  $("signupPage").classList.remove("hidden");
  $("appPage").classList.add("hidden");
}


/* =========================
   SUPABASE REQUEST
========================= */

async function supabaseFetch(path, options={}){
  const headers = {
    "apikey":SUPABASE_KEY,
    "Authorization":"Bearer "+SUPABASE_KEY,
    "Content-Type":"application/json",
    ...(options.headers || {})
  };

  const response = await fetch(
    SUPABASE_URL + "/rest/v1/" + path,
    {
      ...options,
      headers
    }
  );

  const text = await response.text();

  let data = null;

  try{
    data = text ? JSON.parse(text) : null;
  }catch{
    data = text;
  }

  if(!response.ok){
    throw new Error(
      data?.message ||
      data?.error_description ||
      data?.error ||
      text ||
      "Request failed"
    );
  }

  return data;
}


/* =========================
   AUTH
========================= */

async function login(){

  const email = $("loginEmail").value.trim();
  const password = $("loginPassword").value;

  if(!email || !password){
    toast("Email ও Password দিন");
    return;
  }

  try{

    const result = await fetch(
      SUPABASE_URL + "/auth/v1/token?grant_type=password",
      {
        method:"POST",
        headers:{
          "apikey":SUPABASE_KEY,
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          email,
          password
        })
      }
    );

    const data = await result.json();

    if(!result.ok){
      throw new Error(
        data.error_description ||
        data.msg ||
        "Login failed"
      );
    }

    localStorage.setItem(
      "friendbook_session",
      JSON.stringify(data)
    );

    currentUser = data.user;

    openApp();

  }catch(error){
    toast(error.message);
  }
}


async function signup(){

  const name = $("signupName").value.trim();
  const email = $("signupEmail").value.trim();
  const password = $("signupPassword").value;

  if(!name || !email || !password){
    toast("সব তথ্য পূরণ করুন");
    return;
  }

  if(password.length < 6){
    toast("Password কমপক্ষে ৬ অক্ষরের দিন");
    return;
  }

  try{

    const result = await fetch(
      SUPABASE_URL + "/auth/v1/signup",
      {
        method:"POST",
        headers:{
          "apikey":SUPABASE_KEY,
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          email,
          password,
          data:{
            name:name
          }
        })
      }
    );

    const data = await result.json();

    if(!result.ok){
      throw new Error(
        data.msg ||
        data.message ||
        "Signup failed"
      );
    }

    toast("Account তৈরি হয়েছে");

    showLogin();

  }catch(error){
    toast(error.message);
  }
}


async function logout(){

  localStorage.removeItem("friendbook_session");

  currentUser = null;

  showLogin();

  toast("Logout হয়েছে");
}


/* =========================
   APP
========================= */

function openApp(){

  $("loginPage").classList.add("hidden");
  $("signupPage").classList.add("hidden");
  $("appPage").classList.remove("hidden");

  showHome();
}


/* =========================
   HOME
========================= */

function showHome(){

  setActive("navHome");

  $("content").innerHTML = `

    <div class="card">
      <h2>🏠 FriendBook Feed</h2>

      <textarea
        id="postText"
        placeholder="আপনার মনে কী আছে?"
      ></textarea>

      <input
        id="postImage"
        type="file"
        accept="image/*"
      >

      <select id="postPrivacy">
        <option value="public">🌍 Public</option>
        <option value="friends">👥 Friends</option>
        <option value="private">🔒 Only Me</option>
      </select>

      <input
        id="postFeeling"
        type="text"
        placeholder="😊 Feeling / Activity"
      >

      <button
        class="primary"
        style="width:100%;"
        onclick="submitPost()"
      >
        📤 Post
      </button>
    </div>

    <div id="feed">
      <div class="loading">
        Feed loading...
      </div>
    </div>
  `;

  loadPosts();
}


/* =========================
   CREATE POST
========================= */

async function submitPost(){

  const text = $("postText").value.trim();
  const file = $("postImage").files[0];
  const privacy = $("postPrivacy").value;
  const feeling = $("postFeeling").value.trim();

  if(!text && !file){
    toast("কিছু লিখুন অথবা ছবি দিন");
    return;
  }

  try{

    let imageUrl = null;

    /*
      এখানে আপনার Supabase Storage bucket:
      post-images
    */

    if(file){

      const fileName =
        currentUser.id +
        "/" +
        Date.now() +
        "_" +
        file.name.replace(/\s+/g,"_");

      const upload = await fetch(
        SUPABASE_URL +
        "/storage/v1/object/post-images/" +
        fileName,
        {
          method:"POST",
          headers:{
            "apikey":SUPABASE_KEY,
            "Authorization":"Bearer "+SUPABASE_KEY,
            "Content-Type":file.type
          },
          body:file
        }
      );

      if(!upload.ok){
        const errorText = await upload.text();
        throw new Error(errorText);
      }

      imageUrl =
        SUPABASE_URL +
        "/storage/v1/object/public/post-images/" +
        fileName;
    }


    await supabaseFetch(
      "posts",
      {
        method:"POST",
        headers:{
          "Prefer":"return=minimal"
        },
        body:JSON.stringify({
          user_id:currentUser.id,
          text:text,
          image_url:imageUrl,
          privacy:privacy,
          feeling:feeling || null
        })
      }
    );

    $("postText").value = "";
    $("postImage").value = "";
    $("postFeeling").value = "";

    toast("Post হয়েছে");

    loadPosts();

  }catch(error){

    console.error(error);

    toast(
      "Post করতে সমস্যা: " +
      error.message
    );
  }
}


/* =========================
   LOAD POSTS
========================= */

async function loadPosts(){

  try{

    const posts = await supabaseFetch(
      "posts?select=*&order=created_at.desc&limit=50"
    );

    const feed = $("feed");

    if(!posts || posts.length === 0){

      feed.innerHTML = `
        <div class="card center">
          এখনো কোনো Post নেই।
        </div>
      `;

      return;
    }

    feed.innerHTML = "";

    for(const post of posts){

      let profile = null;

      try{

        const profiles = await supabaseFetch(
          encodeURIComponent("my social app") +
          "?select=*&id=eq." +
          post.user_id +
          "&limit=1"
        );

        profile = profiles?.[0];

      }catch(error){
        console.log(error);
      }

      const name =
        profile?.name ||
        "FriendBook User";

      const avatar =
        profile?.profile_photo ||
        "";

      const time =
        post.created_at
          ? new Date(post.created_at)
              .toLocaleString("bn-BD")
          : "";

      const div =
        document.createElement("div");

      div.className = "card";

      div.innerHTML = `

        <div class="post-head">

          ${
            avatar
            ?
            `<img class="avatar" src="${avatar}">`
            :
            `<div class="avatar"></div>`
          }

          <div>
            <div class="post-name">
              ${escapeHTML(name)}
            </div>

            <div class="post-time">
              ${time}
            </div>
          </div>

        </div>

        ${
          post.feeling
          ?
          `<div style="margin-top:10px;">
            😊 ${escapeHTML(post.feeling)}
          </div>`
          :
          ""
        }

        ${
          post.text
          ?
          `<div class="post-text">
            ${escapeHTML(post.text)}
          </div>`
          :
          ""
        }

        ${
          post.image_url
          ?
          `<img
             class="post-image"
             src="${post.image_url}"
             loading="lazy"
           >`
          :
          ""
        }

        <div class="actions">

          <button onclick="likePost(${post.id})">
            ❤️ Like
          </button>

          <button onclick="commentPost(${post.id})">
            💬 Comment
          </button>

          <button onclick="sharePost(${post.id})">
            ↗ Share
          </button>

        </div>
      `;

      feed.appendChild(div);
    }

  }catch(error){

    console.error(error);

    $("feed").innerHTML = `
      <div class="card">
        Feed load করতে সমস্যা হয়েছে।
        <br><br>
        ${escapeHTML(error.message)}
      </div>
    `;
  }
}


/* =========================
   LIKE
========================= */

async function likePost(postId){

  try{

    const existing = await supabaseFetch(
      `post_reactions?select=*&post_id=eq.${postId}&user_id=eq.${currentUser.id}&limit=1`
    );

    if(existing && existing.length){

      await supabaseFetch(
        `post_reactions?id=eq.${existing[0].id}`,
        {
          method:"DELETE"
        }
      );

      toast("Like removed");

    }else{

      await supabaseFetch(
        "post_reactions",
        {
          method:"POST",
          headers:{
            "Prefer":"return=minimal"
          },
          body:JSON.stringify({
            post_id:postId,
            user_id:currentUser.id,
            reaction:"like"
          })
        }
      );

      toast("Liked ❤️");
    }

    loadPosts();

  }catch(error){

    console.error(error);

    toast(
      "Like করতে সমস্যা: " +
      error.message
    );
  }
}


/* =========================
   COMMENTS
========================= */

async function commentPost(postId){

  const text =
    prompt("আপনার Comment লিখুন:");

  if(!text || !text.trim()){
    return;
  }

  try{

    await supabaseFetch(
      "comments",
      {
        method:"POST",
        headers:{
          "Prefer":"return=minimal"
        },
        body:JSON.stringify({
          post_id:postId,
          user_id:currentUser.id,
          text:text.trim()
        })
      }
    );

    toast("Comment হয়েছে");

  }catch(error){

    console.error(error);

    toast(
      "Comment করতে সমস্যা: " +
      error.message
    );
  }
}


/* =========================
   SHARE
========================= */

async function sharePost(postId){

  const url =
    location.origin +
    location.pathname +
    "?post=" +
    postId;

  try{

    if(navigator.share){

      await navigator.share({
        title:"FriendBook",
        text:"FriendBook-এর একটি Post দেখুন",
        url:url
      });

    }else{

      await navigator.clipboard.writeText(url);

      toast("Post link copied");

    }

  }catch(error){

    console.log(error);
  }
}


/* =========================
   REELS
========================= */

async function showReels(){

  setActive("navReels");

  $("content").innerHTML = `
    <div class="card">
      <h2>🎬 FriendBook Reels</h2>
    </div>

    <div id="reels">
      <div class="loading">
        Reels loading...
      </div>
    </div>
  `;

  loadReels();
}


async function loadReels(){

  try{

    const reels = await supabaseFetch(
      "reels?select=*&order=created_at.desc&limit=50"
    );

    const container = $("reels");

    if(!reels || !reels.length){

      container.innerHTML = `
        <div class="card center">
          এখনো কোনো Reel নেই।
        </div>
      `;

      return;
    }

    container.innerHTML = "";

    reels.forEach(reel=>{

      const div =
        document.createElement("div");

      div.className = "card";

      div.innerHTML = `

        <video
          src="${reel.video_url}"
          controls
          loop
          playsinline
          style="
            width:100%;
            border-radius:10px;
            background:#000;
          "
        ></video>

        ${
          reel.caption
          ?
          `<div class="post-text">
            ${escapeHTML(reel.caption)}
          </div>`
          :
          ""
        }

        ${
          reel.audio_name
          ?
          `<div>
            🎵 ${escapeHTML(reel.audio_name)}
          </div>`
          :
          ""
        }

        <div class="actions">

          <button onclick="likeReel(${reel.id})">
            ❤️ Like
          </button>

          <button onclick="commentReel(${reel.id})">
            💬 Comment
          </button>

          <button onclick="shareReel(${reel.id})">
            ↗ Share
          </button>

        </div>
      `;

      container.appendChild(div);
    });

  }catch(error){

    console.error(error);

    $("reels").innerHTML = `
      <div class="card">
        Reels load করতে সমস্যা হয়েছে।
      </div>
    `;
  }
}


async function likeReel(reelId){

  try{

    const existing = await supabaseFetch(
      `reel_likes?select=*&reel_id=eq.${reelId}&user_id=eq.${currentUser.id}&limit=1`
    );

    if(existing?.length){

      await supabaseFetch(
        `reel_likes?id=eq.${existing[0].id}`,
        {
          method:"DELETE"
        }
      );

      toast("Like removed");

    }else{

      await supabaseFetch(
        "reel_likes",
        {
          method:"POST",
          headers:{
            "Prefer":"return=minimal"
          },
          body:JSON.stringify({
            reel_id:reelId,
            user_id:currentUser.id
          })
        }
      );

      toast("Liked ❤️");
    }

    loadReels();

  }catch(error){

    toast(error.message);
  }
}


async function commentReel(reelId){

  const text =
    prompt("Reel Comment লিখুন:");

  if(!text || !text.trim()){
    return;
  }

  try{

    await supabaseFetch(
      "reel_comments",
      {
        method:"POST",
        headers:{
          "Prefer":"return=minimal"
        },
        body:JSON.stringify({
          reel_id:reelId,
          user_id:currentUser.id,
          text:text.trim()
        })
      }
    );

    toast("Comment হয়েছে");

  }catch(error){

    toast(
      "Comment করতে সমস্যা: " +
      error.message
    );
  }
}


async function shareReel(reelId){

  const url =
    location.origin +
    location.pathname +
    "?reel=" +
    reelId;

  try{

    if(navigator.share){

      await navigator.share({
        title:"FriendBook Reel",
        url:url
      });

    }else{

      await navigator.clipboard.writeText(url);

      toast("Reel link copied");
    }

  }catch(error){}
}


/* =========================
   PROFILE
========================= */

async function showProfile(){

  setActive("navProfile");

  $("content").innerHTML = `
    <div class="card center">
      <h2>👤 My FriendBook Profile</h2>

      <p>
        ${escapeHTML(currentUser?.email || "")}
      </p>

      <button class="primary"
        onclick="editProfile()">
        ✏️ Edit Profile
      </button>

      <button
        onclick="logout()"
        style="margin-left:5px;">
        Logout
      </button>
    </div>
  `;
}


function editProfile(){

  const name =
    prompt(
      "আপনার নতুন নাম লিখুন:"
    );

  if(!name || !name.trim()){
    return;
  }

  updateProfileName(name.trim());
}


async function updateProfileName(name){

  try{

    await supabaseFetch(
      encodeURIComponent("my social app") +
      "?id=eq." +
      currentUser.id,
      {
        method:"PATCH",
        headers:{
          "Prefer":"return=minimal"
        },
        body:JSON.stringify({
          name:name
        })
      }
    );

    toast("Profile updated");

    showProfile();

  }catch(error){

    toast(error.message);
  }
}


/* =========================
   SEARCH
========================= */

function showSearch(){

  setActive("navSearch");

  $("content").innerHTML = `

    <div class="card">

      <h2>🔎 Search People</h2>

      <input
        id="searchName"
        placeholder="নাম লিখুন..."
      >

      <button
        class="primary"
        onclick="searchPeople()">
        Search
      </button>

    </div>

    <div id="searchResults"></div>
  `;
}


async function searchPeople(){

  const name =
    $("searchName").value.trim();

  if(!name){
    return;
  }

  try{

    const results =
      await supabaseFetch(
        encodeURIComponent("my social app") +
        "?select=*&name=ilike.*" +
        encodeURIComponent(name) +
        "*"
      );

    const box =
      $("searchResults");

    box.innerHTML = "";

    if(!results.length){

      box.innerHTML = `
        <div class="card">
          কাউকে পাওয়া যায়নি।
        </div>
      `;

      return;
    }

    results.forEach(profile=>{

      const div =
        document.createElement("div");

      div.className = "card";

      div.innerHTML = `

        <div class="post-head">

          ${
            profile.profile_photo
            ?
            `<img
              class="avatar"
              src="${profile.profile_photo}"
            >`
            :
            `<div class="avatar"></div>`
          }

          <div style="flex:1;">
            <strong>
              ${escapeHTML(
                profile.name ||
                "FriendBook User"
              )}
            </strong>
          </div>

          ${
            profile.id !== currentUser.id
            ?
            `<button
              class="primary"
              onclick="followUser('${profile.id}')">
              Follow
            </button>`
            :
            ""
          }

        </div>
      `;

      box.appendChild(div);
    });

  }catch(error){

    toast(error.message);
  }
}


/* =========================
   FOLLOW
========================= */

async function followUser(userId){

  try{

    const existing =
      await supabaseFetch(
        `follows?select=*&follower_id=eq.${currentUser.id}&following_id=eq.${userId}&limit=1`
      );

    if(existing?.length){

      await supabaseFetch(
        `follows?id=eq.${existing[0].id}`,
        {
          method:"DELETE"
        }
      );

      toast("Unfollowed");

    }else{

      await supabaseFetch(
        "follows",
        {
          method:"POST",
          headers:{
            "Prefer":"return=minimal"
          },
          body:JSON.stringify({
            follower_id:currentUser.id,
            following_id:userId
          })
        }
      );

      toast("Following");
    }

  }catch(error){

    toast(error.message);
  }
}


/* =========================
   SETTINGS
========================= */

function showSettings(){

  setActive("navSettings");

  const dark =
    localStorage.getItem(
      "friendbook_dark"
    ) === "1";

  $("content").innerHTML = `

    <div class="card">

      <h2>⚙️ FriendBook Settings</h2>

      <button
        onclick="toggleDark()"
        style="width:100%;margin-bottom:10px;">
        🌙 Dark Mode
      </button>

      <button
        onclick="logout()"
        class="danger"
        style="width:100%;">
        🚪 Logout
      </button>

    </div>
  `;
}


function toggleDark(){

  document.body.classList.toggle("dark");

  localStorage.setItem(
    "friendbook_dark",
    document.body.classList.contains("dark")
      ? "1"
      : "0"
  );
}


/* =========================
   NAV ACTIVE
========================= */

function setActive(id){

  document.querySelectorAll(
    "nav button"
  ).forEach(btn=>{
    btn.classList.remove("active");
  });

  const button = $(id);

  if(button){
    button.classList.add("active");
  }
}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =========================
   START
========================= */

async function start(){

  if(
    localStorage.getItem(
      "friendbook_dark"
    ) === "1"
  ){
    document.body.classList.add("dark");
  }

  const saved =
    localStorage.getItem(
      "friendbook_session"
    );

  if(!saved){

    showLogin();
    return;
  }

  try{

    const session =
      JSON.parse(saved);

    if(!session.access_token){
      throw new Error();
    }

    const result =
      await fetch(
        SUPABASE_URL +
        "/auth/v1/user",
        {
          headers:{
            "apikey":SUPABASE_KEY,
            "Authorization":
              "Bearer " +
              session.access_token
          }
        }
      );

    if(!result.ok){
      throw new Error();
    }

    currentUser =
      await result.json();

    openApp();

  }catch(error){

    localStorage.removeItem(
      "friendbook_session"
    );

    showLogin();
  }
}


start();

</script>
