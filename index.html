<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Social App</title>

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1877f2">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:#f0f2f5;
  color:#1c1e21;
}

button,input,textarea,select{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* AUTH */

#authPage{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  background:linear-gradient(135deg,#1877f2,#42b72a);
}

.authBox{
  width:100%;
  max-width:420px;
  background:white;
  border-radius:18px;
  padding:25px;
  box-shadow:0 10px 35px #0003;
}

.logo{
  text-align:center;
  color:#1877f2;
  font-size:34px;
  font-weight:bold;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#666;
  margin-bottom:20px;
}

.authBox input{
  width:100%;
  padding:13px;
  margin:7px 0;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:16px;
}

.primary{
  background:#1877f2;
  color:white;
  border:0;
  border-radius:8px;
  padding:12px 18px;
  font-size:16px;
  font-weight:bold;
}

.green{
  background:#42b72a;
  color:white;
  border:0;
  border-radius:8px;
  padding:12px 18px;
  font-size:16px;
  font-weight:bold;
}

.full{
  width:100%;
  margin-top:8px;
}

.authSwitch{
  text-align:center;
  margin-top:18px;
  color:#1877f2;
  cursor:pointer;
}

/* HEADER */

#app{
  min-height:100vh;
}

.header{
  height:62px;
  background:white;
  border-bottom:1px solid #ddd;
  position:sticky;
  top:0;
  z-index:1000;
  display:flex;
  align-items:center;
  padding:0 15px;
  gap:12px;
}

.headerLogo{
  color:#1877f2;
  font-size:23px;
  font-weight:bold;
  white-space:nowrap;
}

.searchBox{
  flex:1;
  max-width:420px;
}

.searchBox input{
  width:100%;
  border:0;
  background:#f0f2f5;
  padding:11px 15px;
  border-radius:25px;
  outline:none;
}

.headerActions{
  margin-left:auto;
  display:flex;
  gap:7px;
}

.iconBtn{
  width:40px;
  height:40px;
  border:0;
  border-radius:50%;
  background:#f0f2f5;
  font-size:19px;
}

.logoutBtn{
  background:#ffe5e5;
  color:#d00;
}

/* LAYOUT */

.main{
  max-width:1200px;
  margin:auto;
  display:grid;
  grid-template-columns:230px 1fr 260px;
  gap:18px;
  padding:18px 10px;
}

.sidebar,
.rightbar{
  position:sticky;
  top:80px;
  height:max-content;
}

.sideCard{
  background:white;
  border-radius:12px;
  padding:12px;
  margin-bottom:12px;
}

.navItem{
  width:100%;
  border:0;
  background:white;
  padding:13px 10px;
  text-align:left;
  border-radius:8px;
  font-size:15px;
}

.navItem:hover{
  background:#f0f2f5;
}

.profileMini{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:10px;
}

.avatar{
  width:44px;
  height:44px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd;
}

.avatarSmall{
  width:35px;
  height:35px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd;
}

.feed{
  min-width:0;
}

/* CARDS */

.card{
  background:white;
  border-radius:12px;
  margin-bottom:14px;
  box-shadow:0 1px 2px #0001;
  overflow:hidden;
}

.cardPad{
  padding:15px;
}

.composerTop{
  display:flex;
  gap:10px;
  align-items:center;
}

.composerTop textarea{
  flex:1;
  border:0;
  background:#f0f2f5;
  border-radius:20px;
  padding:12px 15px;
  resize:none;
  outline:none;
}

.composerTools{
  display:flex;
  gap:6px;
  margin-top:10px;
  flex-wrap:wrap;
}

.toolBtn{
  border:0;
  background:#f0f2f5;
  padding:9px 12px;
  border-radius:8px;
}

.postHeader{
  padding:13px 15px;
  display:flex;
  align-items:center;
  gap:10px;
}

.postUser{
  font-weight:bold;
}

.postDate{
  color:#777;
  font-size:12px;
}

.postMenu{
  margin-left:auto;
  border:0;
  background:white;
  font-size:22px;
}

.postText{
  padding:0 15px 12px;
  white-space:pre-wrap;
  word-break:break-word;
}

.postImage{
  width:100%;
  max-height:600px;
  object-fit:cover;
  display:block;
}

.postVideo{
  width:100%;
  max-height:600px;
  display:block;
  background:#000;
}

.postStats{
  display:flex;
  justify-content:space-between;
  padding:9px 15px;
  color:#666;
  font-size:14px;
}

.postActions{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  border-top:1px solid #eee;
}

.postActions button{
  border:0;
  background:white;
  padding:11px 5px;
  font-size:14px;
}

.postActions button:hover{
  background:#f0f2f5;
}

.reactionRow{
  padding:8px 15px;
  display:flex;
  gap:5px;
  flex-wrap:wrap;
}

.reactionBtn{
  border:0;
  border-radius:20px;
  padding:6px 10px;
  background:#f0f2f5;
}

/* COMMENTS */

.commentBox{
  padding:10px 15px;
  border-top:1px solid #eee;
}

.commentInput{
  display:flex;
  gap:7px;
}

.commentInput input{
  flex:1;
  padding:9px 12px;
  border:1px solid #ddd;
  border-radius:20px;
}

.comment{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.commentBody{
  background:#f0f2f5;
  border-radius:12px;
  padding:8px 11px;
}

/* STORIES */

.storyRow{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:12px;
}

.story{
  min-width:105px;
  height:160px;
  border-radius:12px;
  overflow:hidden;
  position:relative;
  background:#1877f2;
  color:white;
  cursor:pointer;
}

.story img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.storyName{
  position:absolute;
  bottom:7px;
  left:7px;
  right:7px;
  font-size:12px;
  font-weight:bold;
  text-shadow:0 1px 4px #000;
}

/* PROFILE */

.cover{
  height:250px;
  background:#1877f2;
  position:relative;
}

.cover img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profileInfo{
  padding:15px;
  text-align:center;
}

.profileLarge{
  width:120px;
  height:120px;
  border-radius:50%;
  border:5px solid white;
  object-fit:cover;
  margin-top:-65px;
  position:relative;
  background:#ddd;
}

.profileButtons{
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}

.stats{
  display:flex;
  justify-content:center;
  gap:35px;
  margin:15px 0;
}

.stat{
  text-align:center;
}

.stat strong{
  display:block;
  font-size:20px;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:#0008;
  z-index:3000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modalBox{
  width:100%;
  max-width:550px;
  max-height:90vh;
  overflow:auto;
  background:white;
  border-radius:14px;
  padding:20px;
}

.modalHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.close{
  border:0;
  background:#eee;
  width:35px;
  height:35px;
  border-radius:50%;
  font-size:20px;
}

.formGroup{
  margin-bottom:12px;
}

.formGroup label{
  display:block;
  margin-bottom:5px;
  font-weight:bold;
}

.formGroup input,
.formGroup textarea,
.formGroup select{
  width:100%;
  padding:11px;
  border:1px solid #ddd;
  border-radius:8px;
}

.previewGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
  margin-top:10px;
}

.previewGrid img,
.previewGrid video{
  width:100%;
  height:110px;
  object-fit:cover;
}

/* CHAT */

.chatList{
  max-height:350px;
  overflow:auto;
}

.chatUser{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  border-bottom:1px solid #eee;
  cursor:pointer;
}

.chatWindow{
  height:400px;
  display:flex;
  flex-direction:column;
}

.messages{
  flex:1;
  overflow:auto;
  padding:10px;
  background:#f0f2f5;
}

.msg{
  max-width:75%;
  padding:9px 12px;
  border-radius:15px;
  margin:5px 0;
}

.msg.mine{
  margin-left:auto;
  background:#1877f2;
  color:white;
}

.msg.theirs{
  background:white;
}

.sendBox{
  display:flex;
  gap:6px;
  padding-top:10px;
}

.sendBox input{
  flex:1;
  padding:10px;
  border:1px solid #ddd;
  border-radius:20px;
}

/* SEARCH */

.searchResults{
  position:fixed;
  top:62px;
  left:50%;
  transform:translateX(-50%);
  width:min(600px,95%);
  background:white;
  z-index:1500;
  border-radius:0 0 12px 12px;
  box-shadow:0 5px 20px #0003;
  max-height:400px;
  overflow:auto;
}

.searchResult{
  display:flex;
  gap:10px;
  align-items:center;
  padding:12px;
  border-bottom:1px solid #eee;
}

/* RESPONSIVE */

@media(max-width:900px){
  .main{
    grid-template-columns:1fr;
    max-width:700px;
  }

  .sidebar,
  .rightbar{
    display:none;
  }
}

@media(max-width:600px){
  .header{
    padding:0 8px;
  }

  .headerLogo{
    font-size:18px;
  }

  .searchBox{
    max-width:none;
  }

  .headerActions .hideMobile{
    display:none;
  }

  .main{
    padding:8px 4px;
  }

  .card{
    border-radius:8px;
  }

  .postActions button{
    font-size:12px;
  }
}

/* TOAST */

#toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#222;
  color:white;
  padding:12px 18px;
  border-radius:25px;
  z-index:5000;
  display:none;
}
</style>
</head>

<body>

<!-- AUTH -->

<section id="authPage">

  <div class="authBox">

    <div class="logo">My Social App</div>

    <div class="subtitle">
      Connect with friends and share your world
    </div>

    <div id="loginForm">

      <input id="loginEmail" type="email" placeholder="Email">

      <input id="loginPassword" type="password" placeholder="Password">

      <button class="primary full" onclick="login()">
        Login
      </button>

      <div class="authSwitch" onclick="showRegister()">
        Create new account
      </div>

    </div>

    <div id="registerForm" class="hidden">

      <input id="regName" type="text" placeholder="আপনার নাম">

      <input id="regEmail" type="email" placeholder="Email">

      <input id="regPassword" type="password" placeholder="Password">

      <button class="green full" onclick="register()">
        Create Account
      </button>

      <div class="authSwitch" onclick="showLogin()">
        Already have an account? Login
      </div>

    </div>

  </div>

</section>


<!-- APP -->

<section id="app" class="hidden">

  <header class="header">

    <div class="headerLogo">
      My Social
    </div>

    <div class="searchBox">
      <input
        id="searchInput"
        placeholder="Search people..."
        oninput="searchUsers(this.value)"
      >
    </div>

    <div class="headerActions">

      <button class="iconBtn" onclick="showHome()">🏠</button>

      <button class="iconBtn hideMobile" onclick="openMessenger()">
        💬
      </button>

      <button class="iconBtn hideMobile" onclick="showNotifications()">
        🔔
      </button>

      <button class="iconBtn logoutBtn" onclick="logout()">
        ↪
      </button>

    </div>

  </header>


  <div id="searchResults" class="searchResults hidden"></div>


  <main class="main">

    <!-- LEFT -->

    <aside class="sidebar">

      <div class="sideCard">

        <div class="profileMini">

          <img id="miniAvatar" class="avatar">

          <div>
            <b id="miniName">User</b>
          </div>

        </div>

        <button class="navItem" onclick="showProfile()">
          👤 Profile
        </button>

        <button class="navItem" onclick="showHome()">
          🏠 Home
        </button>

        <button class="navItem" onclick="openMessenger()">
          💬 Messenger
        </button>

        <button class="navItem" onclick="showFriends()">
          👥 Friends
        </button>

        <button class="navItem" onclick="showNotifications()">
          🔔 Notifications
        </button>

        <button class="navItem" onclick="showReels()">
          🎬 Reels
        </button>

        <button class="navItem" onclick="showEarnings()">
          💰 Creator Earnings
        </button>

        <button
          id="adminNav"
          class="navItem hidden"
          onclick="showAdmin()"
        >
          🛡️ Admin Panel
        </button>

      </div>

    </aside>


    <!-- FEED -->

    <section id="content" class="feed">

    </section>


    <!-- RIGHT -->

    <aside class="rightbar">

      <div class="sideCard">

        <h3>My Social App</h3>

        <p style="color:#777;margin-top:8px">
          Connect, share and communicate.
        </p>

      </div>

      <div class="sideCard">

        <h3>Quick Menu</h3>

        <button class="navItem" onclick="openStoryModal()">
          ➕ Add Story
        </button>

        <button class="navItem" onclick="openPostModal()">
          📝 Create Post
        </button>

        <button class="navItem" onclick="openReelModal()">
          🎬 Upload Reel
        </button>

      </div>

    </aside>

  </main>

</section>


<!-- MODAL -->

<div id="modal" class="modal hidden">

  <div class="modalBox">

    <div class="modalHeader">

      <h2 id="modalTitle">Modal</h2>

      <button class="close" onclick="closeModal()">×</button>

    </div>

    <div id="modalBody"></div>

  </div>

</div>


<div id="toast"></div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://skereuaizdczbvjplisi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_3R2otJA1zIlsMsTYxe1ocw_NAPY5O9x";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const BUCKET = "media";

let me = null;
let myProfile = null;
let currentChatUser = null;


/* =========================================================
   START
========================================================= */

document.addEventListener("DOMContentLoaded", async () => {

  const {
    data:{
      session
    }
  } = await supabaseClient.auth.getSession();

  if(session){

    me = session.user;

    await loadProfile();

    showApp();

  }

});


supabaseClient.auth.onAuthStateChange(
  async (event, session) => {

    if(session && !me){

      me = session.user;

      await loadProfile();

      showApp();

    }

  }
);


/* =========================================================
   AUTH
========================================================= */

function showLogin(){

  document.getElementById("loginForm")
    .classList.remove("hidden");

  document.getElementById("registerForm")
    .classList.add("hidden");

}


function showRegister(){

  document.getElementById("loginForm")
    .classList.add("hidden");

  document.getElementById("registerForm")
    .classList.remove("hidden");

}


async function register(){

  const name =
    document.getElementById("regName").value.trim();

  const email =
    document.getElementById("regEmail").value.trim();

  const password =
    document.getElementById("regPassword").value;

  if(!name || !email || !password){

    toast("সব তথ্য দিন");

    return;
  }

  if(password.length < 6){

    toast("Password কমপক্ষে ৬ অক্ষরের হতে হবে");

    return;
  }

  const {
    data,
    error
  } = await supabaseClient.auth.signUp({

    email,
    password,

    options:{
      data:{
        name
      }
    }

  });

  if(error){

    toast(error.message);

    return;
  }

  if(data.user){

    const {
      error:profileError
    } = await supabaseClient
      .from("profiles")
      .upsert({

        id:data.user.id,
        name:name,
        bio:"",
        profile_photo:"",
        cover_photo:"",
        role:"user"

      });

    if(profileError){

      console.log(profileError);

    }

  }

  toast("Account তৈরি হয়েছে");

  showLogin();

}


async function login(){

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  if(!email || !password){

    toast("Email এবং Password দিন");

    return;
  }

  const {
    data,
    error
  } = await supabaseClient.auth.signInWithPassword({

    email,
    password

  });

  if(error){

    toast("Email অথবা Password ভুল");

    return;
  }

  me = data.user;

  await loadProfile();

  showApp();

}


async function logout(){

  await supabaseClient.auth.signOut();

  me = null;
  myProfile = null;

  document.getElementById("app")
    .classList.add("hidden");

  document.getElementById("authPage")
    .classList.remove("hidden");

}


/* =========================================================
   PROFILE
========================================================= */

async function loadProfile(){

  if(!me) return;

  let {
    data,
    error
  } = await supabaseClient
    .from("profiles")
    .select("*")
    .eq("id",me.id)
    .maybeSingle();

  if(error){

    console.log(error);

    return;
  }

  if(!data){

    const {
      data:newProfile
    } = await supabaseClient
      .from("profiles")
      .insert({

        id:me.id,
        name:me.user_metadata?.name || "User",
        bio:"",
        profile_photo:"",
        cover_photo:"",
        role:"user"

      })
      .select()
      .single();

    data = newProfile;

  }

  myProfile = data;

}


function showApp(){

  document.getElementById("authPage")
    .classList.add("hidden");

  document.getElementById("app")
    .classList.remove("hidden");

  updateMiniProfile();

  showHome();

}


function updateMiniProfile(){

  if(!myProfile) return;

  document.getElementById("miniName")
    .textContent = myProfile.name || "User";

  document.getElementById("miniAvatar").src =
    myProfile.profile_photo ||
    "https://ui-avatars.com/api/?name="+
    encodeURIComponent(myProfile.name || "User");

  if(myProfile.role === "admin"){

    document
      .getElementById("adminNav")
      .classList.remove("hidden");

  }

}


/* =========================================================
   HOME
========================================================= */

async function showHome(){

  const content =
    document.getElementById("content");

  content.innerHTML = `

    <div class="card">

      <div class="cardPad">

        <div class="composerTop">

          <img
            class="avatar"
            src="${
              myProfile?.profile_photo ||
              "https://ui-avatars.com/api/?name=User"
            }"
          >

          <textarea
            id="quickPostText"
            rows="1"
            placeholder="What's on your mind?"
          ></textarea>

        </div>

        <div class="composerTools">

          <button
            class="toolBtn"
            onclick="openPostModal()"
          >
            📷 Photo/Video
          </button>

          <button
            class="toolBtn"
            onclick="openStoryModal()"
          >
            🟣 Story
          </button>

          <button
            class="toolBtn"
            onclick="openReelModal()"
          >
            🎬 Reel
          </button>

          <button
            class="primary"
            onclick="quickPost()"
          >
            Post
          </button>

        </div>

      </div>

    </div>


    <div class="card">

      <h3 style="padding:12px 15px">
        Stories
      </h3>

      <div id="storiesContainer">
        Loading...
      </div>

    </div>


    <div id="feedContainer">
      Loading posts...
    </div>

  `;

  await loadStories();

  await loadFeed();

}


async function quickPost(){

  const input =
    document.getElementById("quickPostText");

  const text = input.value.trim();

  if(!text){

    toast("Post লিখুন");

    return;
  }

  const {
    error
  } = await supabaseClient
    .from("posts")
    .insert({

      user_id:me.id,
      text:text,
      image_url:"",
      privacy:"public",
      feeling:"",
      location:""

    });

  if(error){

    toast(error.message);

    return;
  }

  input.value="";

  toast("Post হয়েছে");

  await loadFeed();

}


/* =========================================================
   POSTS
========================================================= */

async function loadFeed(){

  const container =
    document.getElementById("feedContainer");

  if(!container) return;

  const {
    data:posts,
    error
  } = await supabaseClient
    .from("posts")
    .select("*")
    .order("created_at",{ascending:false})
    .limit(50);

  if(error){

    container.innerHTML =
      `<div class="card cardPad">
        ${escapeHtml(error.message)}
      </div>`;

    return;
  }

  if(!posts || posts.length===0){

    container.innerHTML = `
      <div class="card cardPad">
        এখনো কোনো Post নেই।
      </div>
    `;

    return;
  }

  const ids =
    posts.map(p=>p.user_id);

  const {
    data:profiles
  } = await supabaseClient
    .from("profiles")
    .select("*")
    .in("id",ids);

  const profileMap={};

  (profiles||[]).forEach(p=>{
    profileMap[p.id]=p;
  });

  let html="";

  for(const p of posts){

    html += await renderPost(
      p,
      profileMap[p.user_id]
    );

  }

  container.innerHTML=html;

}


async function renderPost(p,profile){

  const name =
    profile?.name || "User";

  const avatar =
    profile?.profile_photo ||
    "https://ui-avatars.com/api/?name="+
    encodeURIComponent(name);

  let media="";

  if(p.image_url){

    const urls =
      p.image_url
        .split("|||")
        .filter(Boolean);

    if(urls.length===1){

      const url=urls[0];

      if(isVideo(url)){

        media=`
          <video
            class="postVideo"
            controls
            src="${safeAttr(url)}"
          ></video>
        `;

      }else{

        media=`
          <img
            class="postImage"
            src="${safeAttr(url)}"
          >
        `;

      }

    }else if(urls.length>1){

      media=`
        <div class="previewGrid">

          ${urls.map(url=>{

            if(isVideo(url)){

              return `
                <video
                  controls
                  src="${safeAttr(url)}"
                ></video>
              `;

            }

            return `
              <img
                src="${safeAttr(url)}"
              >
            `;

          }).join("")}

        </div>
      `;

    }

  }


  const {
    count:likeCount
  } = await supabaseClient
    .from("post_reactions")
    .select("*",{count:"exact",head:true})
    .eq("post_id",p.id);

  const {
    count:commentCount
  } = await supabaseClient
    .from("comments")
    .select("*",{count:"exact",head:true})
    .eq("post_id",p.id);

  const {
    data:myReaction
  } = await supabaseClient
    .from("post_reactions")
    .select("reaction")
    .eq("post_id",p.id)
    .eq("user_id",me.id)
    .maybeSingle();

  return `

    <article class="card" id="post-${p.id}">

      <div class="postHeader">

        <img
          class="avatarSmall"
          src="${safeAttr(avatar)}"
        >

        <div>

          <div class="postUser">
            ${escapeHtml(name)}
            ${profile?.verified ? " ☑️" : ""}
          </div>

          <div class="postDate">
            ${formatDate(p.created_at)}
            ${p.privacy ? " · "+escapeHtml(p.privacy):""}
          </div>

        </div>

        <button
          class="postMenu"
          onclick="postMenu(${p.id},${p.user_id === me.id})"
        >
          ⋯
        </button>

      </div>

      ${
        p.feeling
        ? `<div class="postText">
             Feeling ${escapeHtml(p.feeling)}
           </div>`
        :""
      }

      ${
        p.location
        ? `<div class="postText">
             📍 ${escapeHtml(p.location)}
           </div>`
        :""
      }

      ${
        p.text
        ? `<div class="postText">
             ${escapeHtml(p.text)}
           </div>`
        :""
      }

      ${media}

      <div class="postStats">

        <span>
          ❤️ ${likeCount || 0}
        </span>

        <span>
          💬 ${commentCount || 0}
        </span>

      </div>

      <div class="reactionRow">

        <button
          class="reactionBtn"
          onclick="reactToPost(${p.id},'like')"
        >
          👍 Like
        </button>

        <button
          class="reactionBtn"
          onclick="reactToPost(${p.id},'love')"
        >
          ❤️ Love
        </button>

        <button
          class="reactionBtn"
          onclick="reactToPost(${p.id},'haha')"
        >
          😂 Haha
        </button>

        ${
          myReaction
          ? `<span style="padding:6px">
              Your reaction: ${escapeHtml(myReaction.reaction)}
             </span>`
          :""
        }

      </div>

      <div class="postActions">

        <button onclick="reactToPost(${p.id},'like')">
          👍 Like
        </button>

        <button onclick="toggleComments(${p.id})">
          💬 Comment
        </button>

        <button onclick="sharePost(${p.id})">
          ↗ Share
        </button>

        <button onclick="reportPost(${p.id})">
          🚩 Report
        </button>

      </div>

      <div
        id="comments-${p.id}"
        class="commentBox hidden"
      >

        <div class="commentInput">

          <input
            id="commentInput-${p.id}"
            placeholder="Write a comment..."
          >

          <button
            class="primary"
            onclick="addComment(${p.id})"
          >
            Send
          </button>

        </div>

        <div id="commentList-${p.id}"></div>

      </div>

    </article>

  `;

}

/* =========================================================
   REACTIONS
========================================================= */

async function reactToPost(postId,reaction){

  const {
    data:existing
  } = await supabaseClient
    .from("post_reactions")
    .select("*")
    .eq("post_id",postId)
    .eq("user_id",me.id)
    .maybeSingle();

  if(existing){

    if(existing.reaction===reaction){

      await supabaseClient
        .from("post_reactions")
        .delete()
        .eq("id",existing.id);

    }else{

      await supabaseClient
        .from("post_reactions")
        .update({reaction})
        .eq("id",existing.id);

    }

  }else{

    await supabaseClient
      .from("post_reactions")
      .insert({

        post_id:postId,
        user_id:me.id,
        reaction

      });

  }

  loadFeed();

}

async function toggleComments(postId){

  const box =
    document.getElementById(
      "comments-"+postId
    );

  box.classList.toggle("hidden");

  if(!box.classList.contains("hidden")){

    await loadComments(postId);

  }

}


async function loadComments(postId){

  const list =
    document.getElementById(
      "commentList-"+postId
    );

  const {
    data
  } = await supabaseClient
    .from("comments")
    .select("*")
    .eq("post_id",postId)
    .order("created_at",{ascending:true});

  if(!data || !data.length){

    list.innerHTML =
      `<p style="color:#777;margin-top:10px">
        No comments yet
      </p>`;

    return;
  }

  const ids=data.map(x=>x.user_id);

  const {
    data:profiles
  } = await supabaseClient
    .from("profiles")
    .select("*")
    .in("id",ids);

  const map={};

  (profiles||[]).forEach(x=>{
    map[x.id]=x;
  });

  list.innerHTML =
    data.map(c=>{

      const p=map[c.user_id];

      return `
        <div class="comment">

          <img
            class="avatarSmall"
            src="${
              safeAttr(
                p?.profile_photo ||
                "https://ui-avatars.com/api/?name=User"
              )
            }"
          >

          <div class="commentBody">

            <b>
              ${escapeHtml(p?.name || "User")}
            </b>

            <div>
              ${escapeHtml(c.text)}
            </div>

          </div>

        </div>
      `;

    }).join("");

}


async function addComment(postId){

  const input =
    document.getElementById(
      "commentInput-"+postId
    );

  const text=input.value.trim();

  if(!text) return;

  const {
    error
  } = await supabaseClient
    .from("comments")
    .insert({

      post_id:postId,
      user_id:me.id,
      text

    });

  if(error){

    toast(error.message);

    return;
  }

  input.value="";

  await loadComments(postId);

}

async function sharePost(postId){

  const url =

  if(navigator.share){

    try{

      await navigator.share({

        title:"My Social App",
        text:"Check this post",

      });

    }catch(e){}

  }else{

    await navigator.clipboard.writeText(url);

async function createStory(){

  const file =
    document.getElementById("storyFile").files[0];

  if(!file){

    toast("Photo বা video দিন");

    return;
  }

  const url =
    await uploadFile(file,"stories");

  if(!url) return;

  const {
    error
  } = await supabaseClient
    .from("stories")
    .insert({

      user_id:me.id,
      media_url:url,
      media_type:file.type.startsWith("video")
        ? "video"
        : "image",
      caption:
        document.getElementById("storyCaption")
          .value.trim()

    });

  if(error){

async function viewStory(storyId){

  const {
    data:story
  } = await supabaseClient
    .from("stories")
    .select("*")
    .eq("id",storyId)
    .single();

  if(!story) return;

  if(me){

    await supabaseClient
      .from("story_views")
      .upsert({

        story_id:storyId,
        viewer_id:me.id

      });

  }

  const media =
    story.media_type==="video"
    ? `
      <video
        controls
        autoplay
        style="width:100%;max-height:70vh"
        src="${safeAttr(story.media_url)}"
      ></video>
    `
    : `
      <img
        style="
          width:100%;
          max-height:70vh;
          object-fit:contain;
        "
        src="${safeAttr(story.media_url)}"
      >
    `;

  openModal(
    "Story",
    `
      ${media}

      ${
        story.caption
        ? `<p style="margin-top:10px">
             ${escapeHtml(story.caption)}
           </p>`
        :""
      }
    `
  );

}

async function loadFriendRequests(){

  const {
    data
  } = await supabaseClient
    .from("friend_requests")
    .select("*")
    .eq("receiver_id",me.id)
    .eq("status","pending")
    .order("created_at",{ascending:false});

      "Friend Requests",
      `<p>No pending requests.</p>`
    );

    .from("profiles")
    .select("*")
    .in("id",ids);

  const map={};

  (profiles||[]).forEach(p=>{
    map[p.id]=p;
  });

  openModal(
    "Friend Requests",
    data.map(r=>{

      const p=map[r.sender_id];

      return `

        <div
          style="
            display:flex;
            align-items:center;
            gap:10px;
            padding:10px 0;
            border-bottom:1px solid #eee;
          "

async function acceptFriend(requestId,senderId){

  await supabaseClient
    .from("friend_requests")
    .update({
      status:"accepted"
    })
    .eq("id",requestId);

  await supabaseClient
    .from("friends")
    .insert([

      {
        user_id:me.id,
        friend_id:senderId
      },

      {
        user_id:senderId,
        friend_id:me.id
      }

    ]);

  toast("Friend added");

  loadFriendRequests();

}

async function startChat(userId){

  currentChatUser=userId;

  if(!document.getElementById("chatArea")){

    document.getElementById("chatArea");

  area.classList.remove("hidden");

  const {

    .from("profiles")
    .select("*")
    .eq("id",userId)
    .single();

  area.innerHTML = `

    <h3>
      Chat with ${escapeHtml(user?.name || "User")}

    <div
      id="messages"
      class="messages"
      style="margin-top:10px"
    >
      Loading...
    </div>

    <div class="sendBox">

      <input
        id="messageInput"
        placeholder="Write a message..."
        onkeydown="
          if(event.key==='Enter') sendMessage()
        "
      >

      <button
        class="primary"
        onclick="sendMessage()"
      >
        Send
      </button>

    </div>

  `;

  await loadMessages();

}


async function loadMessages(){

  const box =
    document.getElementById("messages");

  if(!box) return;

  const {
    data
  } = await supabaseClient
    .from("messages")
    .select("*")
    .or(
      `and(sender_id.eq.${me.id},receiver_id.eq.${currentChatUser}),and(sender_id.eq.${currentChatUser},receiver_id.eq.${me.id})`
    )
    .order("created_at",{ascending:true});

  box.innerHTML =
    (data||[]).map(m=>`

      <div
        class="msg ${
          m.sender_id===me.id
          ? "mine"
          : "theirs"
        }"
      >

        ${escapeHtml(m.text || "")}

      </div>

    `).join("");

  box.scrollTop=box.scrollHeight;

}


async function sendMessage(){

  const input =
    document.getElementById("messageInput");

  const text=input.value.trim();

  if(!text || !currentChatUser) return;

  const {
    error
  } = await supabaseClient
    .from("messages")
    .insert({

      sender_id:me.id,
      receiver_id:currentChatUser,
      text,
      seen:false

    });

  if(error){

    toast(error.message);

    return;
  }

  input.value="";

  await loadMessages();

}

/* =========================================================
   UPLOAD
========================================================= */

async function uploadFile(file,folder){

  if(!file) return null;

  const safeName =
    file.name
      .replace(/[^a-zA-Z0-9._-]/g,"_");

  const path =
    folder+
    "/"+
    me.id+
    "/"+
    Date.now()+
    "_"+
    Math.random()
      .toString(36)
      .slice(2)+
    "_"+
    safeName;

  const {
    error
  } = await supabaseClient
    .storage
    .from(BUCKET)
    .upload(
      path,
      file,
      {
        upsert:false,
        contentType:file.type
      }
    );

  if(error){

    toast("Upload error: "+error.message);

    return null;
  }

  const {
    data
  } = supabaseClient
    .storage
    .from(BUCKET)
    .getPublicUrl(path);

  return data.publicUrl;

}


function chooseFile(accept){

  return new Promise(resolve=>{

    const input =
      document.createElement("input");

    input.type="file";
    input.accept=accept;

    input.onchange=()=>{
      resolve(input.files[0] || null);
    };

    input.click();

  });

}


function previewFiles(input,targetId){

  const box =
    document.getElementById(targetId);

  box.innerHTML="";

  [...input.files].forEach(file=>{

    const url=
      URL.createObjectURL(file);

    if(file.type.startsWith("video")){

      box.innerHTML += `
        <video
          controls
          src="${safeAttr(url)}"
        ></video>
      `;

    }else{

      box.innerHTML += `
        <img
          src="${safeAttr(url)}"
        >
      `;

    }

  });

}

/* =========================================================
   HELPERS
========================================================= */

function toast(message){

  const box =
    document.getElementById("toast");

  box.textContent=message;

  box.style.display="block";

  setTimeout(()=>{

    box.style.display="none";

  },2500);

}


function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function safeAttr(value){

  return escapeHtml(value);

}


function formatDate(date){

  if(!date) return "";

  return new Date(date)
    .toLocaleString("bn-BD",{

      dateStyle:"medium",
      timeStyle:"short"

    });

}


function isVideo(url){

  return /\.(mp4|webm|mov|m4v)(\?.*)?$/i
    .test(url);

}
