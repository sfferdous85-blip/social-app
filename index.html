<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>My Social App</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:#f0f2f5;
color:#111;
}
button,input,textarea{font:inherit}
button{cursor:pointer;border:0}

.top{
background:#1877f2;
color:white;
padding:12px;
display:flex;
align-items:center;
justify-content:space-between;
position:sticky;
top:0;
z-index:50;
}

.logo{
font-size:21px;
font-weight:bold;
}

.topBtns button{
background:transparent;
color:white;
font-size:20px;
margin-left:7px;
}

.page{
display:none;
max-width:700px;
margin:auto;
padding:12px;
}

.page.active{display:block}

.card{
background:white;
border-radius:12px;
padding:15px;
margin-bottom:12px;
box-shadow:0 1px 4px #ccc;
}

input,textarea{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:8px;
margin:6px 0;
outline:none;
}

textarea{resize:none}

.blue{
background:#1877f2;
color:white;
padding:10px 15px;
border-radius:8px;
}

.gray{
background:#e4e6eb;
padding:10px 15px;
border-radius:8px;
}

.red{
background:#e41e3f;
color:white;
padding:9px 14px;
border-radius:8px;
}

.green{
background:#42b72a;
color:white;
padding:9px 14px;
border-radius:8px;
}

.center{text-align:center}

.profileCover{
height:180px;
background:#ddd;
background-size:cover;
background-position:center;
border-radius:12px 12px 0 0;
}

.avatar{
width:100px;
height:100px;
border-radius:50%;
object-fit:cover;
border:4px solid white;
margin-top:-50px;
background:#ddd;
}

.postImg{
width:100%;
max-height:500px;
object-fit:cover;
border-radius:8px;
margin-top:8px;
}

.video{
width:100%;
max-height:500px;
border-radius:8px;
background:#000;
}

.actions{
display:flex;
gap:5px;
margin-top:10px;
}

.actions button{
flex:1;
padding:9px;
background:#e4e6eb;
border-radius:7px;
}

.comment{
background:#f0f2f5;
padding:8px;
border-radius:8px;
margin-top:5px;
}

.userRow{
display:flex;
align-items:center;
gap:10px;
padding:10px;
border-bottom:1px solid #eee;
}

.smallAvatar{
width:45px;
height:45px;
border-radius:50%;
object-fit:cover;
background:#ddd;
}

.badge{
background:red;
color:white;
font-size:11px;
padding:3px 6px;
border-radius:20px;
}

.nav{
position:fixed;
bottom:0;
left:0;
right:0;
background:white;
border-top:1px solid #ddd;
display:flex;
justify-content:space-around;
padding:8px;
z-index:60;
}

.nav button{
background:white;
font-size:12px;
}

.nav span{
display:block;
font-size:20px;
}

body{padding-bottom:65px}

/* Chat */

.chatList{
background:white;
border-radius:12px;
overflow:hidden;
}

.chatItem{
display:flex;
align-items:center;
gap:10px;
padding:12px;
border-bottom:1px solid #eee;
cursor:pointer;
}

.chatItem:hover{background:#f5f5f5}

.chatInfo{
flex:1;
}

.chatName{
font-weight:bold;
}

.lastMsg{
font-size:13px;
color:#777;
margin-top:3px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.onlineDot{
width:11px;
height:11px;
background:#31a24c;
border-radius:50%;
display:inline-block;
margin-left:4px;
}

.offlineDot{
width:11px;
height:11px;
background:#aaa;
border-radius:50%;
display:inline-block;
margin-left:4px;
}

.chatHeader{
background:white;
padding:10px;
display:flex;
align-items:center;
gap:10px;
border-radius:10px 10px 0 0;
position:sticky;
top:58px;
z-index:20;
}

.chatBack{
font-size:24px;
background:white;
}

.chatMessages{
background:#eef1f5;
padding:12px;
min-height:450px;
max-height:65vh;
overflow-y:auto;
}

.msg{
max-width:75%;
padding:9px 12px;
border-radius:16px;
margin:7px 0;
position:relative;
word-wrap:break-word;
}

.msgMine{
margin-left:auto;
background:#1877f2;
color:white;
border-bottom-right-radius:4px;
}

.msgOther{
margin-right:auto;
background:white;
border-bottom-left-radius:4px;
}

.msgTime{
font-size:9px;
opacity:.65;
margin-top:3px;
text-align:right;
}

.msgDelete{
font-size:10px;
margin-top:3px;
background:transparent;
color:inherit;
padding:0;
}

.chatInput{
background:white;
padding:8px;
display:flex;
gap:6px;
position:sticky;
bottom:0;
}

.chatInput input{
margin:0;
flex:1;
}

.chatInput button{
width:50px;
background:#1877f2;
color:white;
border-radius:8px;
}

.modal{
display:none;
position:fixed;
inset:0;
background:#0008;
z-index:100;
padding:20px;
overflow:auto;
}

.modalBox{
background:white;
max-width:500px;
margin:30px auto;
padding:18px;
border-radius:12px;
}

.close{
float:right;
font-size:22px;
background:white;
}

.hidden{display:none!important}

h2,h3{margin-top:5px}
</style>
</head>

<body>

<!-- TOP -->
<div class="top">
<div class="logo">My Social App</div>

<div class="topBtns">
<button onclick="showHome()">⌂</button>
<button onclick="showSearch()">🔍</button>
<button onclick="showChatList()">💬</button>
<button onclick="toggleNotifications()">🔔 <span id="notiBadge"></span></button>
</div>
</div>

<!-- LOGIN -->
<div id="loginPage" class="page active">
<div class="card">
<h2 class="center">Login</h2>

<input id="loginEmail" placeholder="Email">
<input id="loginPassword" type="password" placeholder="Password">

<button class="blue" style="width:100%" onclick="login()">Login</button>

<p class="center">
<button class="gray" onclick="showRegister()">Create new account</button>
</p>
</div>
</div>

<!-- REGISTER -->
<div id="registerPage" class="page">
<div class="card">
<h2 class="center">Create Account</h2>

<input id="regName" placeholder="Name">
<input id="regEmail" placeholder="Email">
<input id="regPassword" type="password" placeholder="Password">

<button class="blue" style="width:100%" onclick="register()">Register</button>

<p class="center">
<button class="gray" onclick="showLogin()">Already have account</button>
</p>
</div>
</div>

<!-- HOME -->
<div id="homePage" class="page">

<div class="card">
<textarea id="postText" placeholder="What's on your mind?"></textarea>

<input type="file" id="postPhoto" accept="image/*" onchange="previewPostPhoto()">

<img id="postPreview" class="postImg hidden">

<br>

<button class="blue" onclick="createPost()">Post</button>
</div>

<div id="feed"></div>
</div>

<!-- REELS -->
<div id="reelsPage" class="page">

<div class="card">
<h3>🎬 Create Reel</h3>

<textarea id="reelText" placeholder="Write something about your video..."></textarea>

<input type="file" id="reelVideo" accept="video/*" onchange="previewReel()">

<video id="reelPreview" class="video hidden" controls></video>

<br>

<button class="blue" onclick="createReel()">Upload Reel</button>
</div>

<div id="reelsFeed"></div>
</div>

<!-- PROFILE -->
<div id="profilePage" class="page">
<div id="myProfile"></div>
</div>

<!-- OTHER PROFILE -->
<div id="userProfilePage" class="page">
<div id="otherProfile"></div>
</div>

<!-- SEARCH -->
<div id="searchPage" class="page">

<div class="card">
<input id="searchInput" placeholder="Search people..." oninput="searchUsers()">
</div>

<div id="searchResults" class="card"></div>
</div>

<!-- FRIENDS -->
<div id="friendsPage" class="page">

<div class="card">
<h3>👥 Friends</h3>

<button class="gray" onclick="showFriends()">My Friends</button>
<button class="gray" onclick="showFriendRequests()">Requests</button>
<button class="gray" onclick="showSentRequests()">Sent</button>
</div>

<div id="friendsList"></div>
</div>

<!-- CHAT LIST -->
<div id="chatListPage" class="page">

<div class="card">
<h2>💬 Messenger</h2>
<p>আপনার বন্ধুদের সাথে চ্যাট করুন</p>
</div>

<div id="chatList" class="chatList"></div>
</div>

<!-- CHAT -->
<div id="chatPage" class="page">

<div class="chatHeader">
<button class="chatBack" onclick="showChatList()">←</button>

<img id="chatAvatar" class="smallAvatar">

<div>
<b id="chatName">Chat</b>
<div id="chatStatus" style="font-size:12px;color:#777"></div>
</div>
</div>

<div id="chatMessages" class="chatMessages"></div>

<div class="chatInput">
<input id="messageInput" placeholder="Write a message..." onkeydown="messageKey(event)">
<button onclick="sendMessage()">➤</button>
</div>

</div>

<!-- EDIT PROFILE MODAL -->
<div id="editModal" class="modal">
<div class="modalBox">

<button class="close" onclick="closeEditProfile()">×</button>

<h2>Edit Profile</h2>

<input id="editName" placeholder="Name">

<textarea id="editBio" placeholder="Bio"></textarea>

<label>Profile Photo</label>
<input type="file" id="editProfilePhoto" accept="image/*">

<label>Cover Photo</label>
<input type="file" id="editCoverPhoto" accept="image/*">

<br><br>

<button class="blue" onclick="saveProfile()">Save</button>

</div>
</div>

<!-- NOTIFICATION MODAL -->
<div id="notificationModal" class="modal">
<div class="modalBox">

<button class="close" onclick="closeNotifications()">×</button>

<h2>🔔 Notifications</h2>

<div id="notifications"></div>

</div>
</div>

<!-- NAV -->
<div class="nav">

<button onclick="showHome()">
<span>🏠</span>
Home
</button>

<button onclick="showReels()">
<span>🎬</span>
Reels
</button>

<button onclick="showChatList()">
<span>💬</span>
Chat
</button>

<button onclick="showFriends()">
<span>👥</span>
Friends
</button>

<button onclick="showProfile()">
<span>👤</span>
Profile
</button>

</div>

<script>

let users=JSON.parse(localStorage.getItem("users")||"[]");
let posts=JSON.parse(localStorage.getItem("posts")||"[]");
let reels=JSON.parse(localStorage.getItem("reels")||"[]");
let notifications=JSON.parse(localStorage.getItem("notifications")||"[]");
let messages=JSON.parse(localStorage.getItem("messages")||"[]");

let currentUserId=localStorage.getItem("currentUserId");
let activeChatUserId=null;


/* =========================
   SAVE
========================= */

function saveAll(){

localStorage.setItem("users",JSON.stringify(users));
localStorage.setItem("posts",JSON.stringify(posts));
localStorage.setItem("reels",JSON.stringify(reels));
localStorage.setItem("notifications",JSON.stringify(notifications));
localStorage.setItem("messages",JSON.stringify(messages));

}


/* =========================
   MIGRATION
========================= */

function migrate(){

users.forEach(u=>{

if(!u.bio)u.bio="";

if(!u.profilePhoto)u.profilePhoto="";

if(!u.coverPhoto)u.coverPhoto="";

if(!Array.isArray(u.followers))u.followers=[];

if(!Array.isArray(u.following))u.following=[];

if(!Array.isArray(u.friends))u.friends=[];

if(!Array.isArray(u.friendRequests))u.friendRequests=[];

if(!Array.isArray(u.sentRequests))u.sentRequests=[];

});

saveAll();

}


/* =========================
   HELPERS
========================= */

function uid(){
return Date.now()+Math.random().toString(16).slice(2);
}

function currentUser(){
return users.find(u=>u.id==currentUserId);
}

function getUser(id){
return users.find(u=>u.id==id);
}

function escapeHTML(str){

return String(str||"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

function timeText(t){

return new Date(t).toLocaleString("bn-BD",{
hour:"2-digit",
minute:"2-digit",
day:"2-digit",
month:"short"
});

}


/* =========================
   PAGE CONTROL
========================= */

function hideAllPages(){

document.querySelectorAll(".page").forEach(p=>{
p.classList.remove("active");
});

}

function showHome(){

if(!currentUserId)return;

hideAllPages();

document.getElementById("homePage").classList.add("active");

loadFeed();

}

function showReels(){

if(!currentUserId)return;

hideAllPages();

document.getElementById("reelsPage").classList.add("active");

loadReels();

}

function showProfile(){

if(!currentUserId)return;

hideAllPages();

document.getElementById("profilePage").classList.add("active");

loadProfile();

}

function showSearch(){

if(!currentUserId)return;

hideAllPages();

document.getElementById("searchPage").classList.add("active");

}

function showFriends(){

if(!currentUserId)return;

hideAllPages();

document.getElementById("friendsPage").classList.add("active");

renderFriends();

}

function showChatList(){

if(!currentUserId)return;

hideAllPages();

document.getElementById("chatListPage").classList.add("active");

renderChatList();

}


/* =========================
   AUTH
========================= */

function showRegister(){

hideAllPages();

document.getElementById("registerPage").classList.add("active");

}

function showLogin(){

hideAllPages();

document.getElementById("loginPage").classList.add("active");

}

function register(){

let name=document.getElementById("regName").value.trim();
let email=document.getElementById("regEmail").value.trim();
let password=document.getElementById("regPassword").value;

if(!name||!email||!password){

alert("সব তথ্য দিন");

return;

}

if(users.some(u=>u.email==email)){

alert("এই Email আগে থেকেই আছে");

return;

}

let u={

id:uid(),
name,
email,
password,
bio:"",
profilePhoto:"",
coverPhoto:"",
followers:[],
following:[],
friends:[],
friendRequests:[],
sentRequests:[]

};

users.push(u);

saveAll();

alert("Account তৈরি হয়েছে");

showLogin();

}

function login(){

let email=document.getElementById("loginEmail").value.trim();
let password=document.getElementById("loginPassword").value;

let u=users.find(x=>x.email==email&&x.password==password);

if(!u){

alert("Email অথবা Password ভুল");

return;

}

currentUserId=u.id;

localStorage.setItem("currentUserId",currentUserId);

openApp();

}

function logout(){

localStorage.removeItem("currentUserId");

currentUserId=null;

hideAllPages();

document.getElementById("loginPage").classList.add("active");

}


/* =========================
   PROFILE
========================= */

function loadProfile(){

let u=currentUser();

if(!u)return;

let myPosts=posts.filter(p=>p.userId==u.id);

document.getElementById("myProfile").innerHTML=`

<div class="card">

<div class="profileCover"
style="background-image:url('${u.coverPhoto||""}')"></div>

<div class="center">

<img class="avatar"
src="${u.profilePhoto||'https://via.placeholder.com/100'}">

<h2>${escapeHTML(u.name)}</h2>

<p>${escapeHTML(u.bio)}</p>

<p>
Followers: ${u.followers.length}
&nbsp;&nbsp;
Following: ${u.following.length}
&nbsp;&nbsp;
Friends: ${u.friends.length}
</p>

<button class="blue" onclick="openEditProfile()">
Edit Profile
</button>

</div>

</div>

<div class="card">
<h3>My Posts</h3>
</div>

${myPosts.map(renderPost).join("")}

`;

}

function openEditProfile(){

let u=currentUser();

document.getElementById("editName").value=u.name;

document.getElementById("editBio").value=u.bio||"";

document.getElementById("editModal").style.display="block";

}

function closeEditProfile(){

document.getElementById("editModal").style.display="none";

}

function readFile(file,callback){

if(!file){

callback("");

return;

}

let r=new FileReader();

r.onload=e=>callback(e.target.result);

r.readAsDataURL(file);

}

function saveProfile(){

let u=currentUser();

u.name=document.getElementById("editName").value.trim()||u.name;

u.bio=document.getElementById("editBio").value;

let pf=document.getElementById("editProfilePhoto").files[0];

let cf=document.getElementById("editCoverPhoto").files[0];

readFile(pf,pdata=>{

if(pdata)u.profilePhoto=pdata;

readFile(cf,cdata=>{

if(cdata)u.coverPhoto=cdata;

saveAll();

closeEditProfile();

loadProfile();

});

});

}


/* =========================
   POST
========================= */

function previewPostPhoto(){

let file=document.getElementById("postPhoto").files[0];

let img=document.getElementById("postPreview");

if(!file){

img.classList.add("hidden");

return;

}

img.src=URL.createObjectURL(file);

img.classList.remove("hidden");

}

function createPost(){

let u=currentUser();

let text=document.getElementById("postText").value.trim();

let file=document.getElementById("postPhoto").files[0];

if(!text&&!file){

alert("কিছু লিখুন অথবা ছবি দিন");

return;

}

readFile(file,data=>{

posts.unshift({

id:uid(),
userId:u.id,
name:u.name,
text,
image:data,
likes:0,
likedBy:[],
comments:[],
shares:0,
time:Date.now()

});

saveAll();

document.getElementById("postText").value="";
document.getElementById("postPhoto").value="";
document.getElementById("postPreview").classList.add("hidden");

loadFeed();

});

}

function loadFeed(){

let arr=[...posts];

document.getElementById("feed").innerHTML=

arr.map(renderPost).join("")||

`<div class="card center">কোনো পোস্ট নেই</div>`;

}

function renderPost(p){

let u=getUser(p.userId)||currentUser();

let liked=p.likedBy&&p.likedBy.includes(currentUserId);

return `

<div class="card">

<div class="userRow">

<img class="smallAvatar"
src="${u.profilePhoto||'https://via.placeholder.com/45'}">

<div>

<b>${escapeHTML(u.name)}</b>

<br>
<small>${timeText(p.time||Date.now())}</small>

</div>

</div>

<p>${escapeHTML(p.text)}</p>

${p.image?`<img class="postImg" src="${p.image}">`:""}

<div>

❤️ ${p.likes||0}
💬 ${(p.comments||[]).length}
↗️ ${p.shares||0}

</div>

<div class="actions">

<button onclick="likePost('${p.id}')">
${liked?"💔 Unlike":"❤️ Like"}
</button>

<button onclick="toggleComment('${p.id}')">
💬 Comment
</button>

<button onclick="sharePost('${p.id}')">
↗️ Share
</button>

</div>

<div id="commentBox${p.id}" class="hidden">

<input id="commentInput${p.id}"
placeholder="Write comment...">

<button class="blue"
onclick="addComment('${p.id}')">
Comment
</button>

${(p.comments||[]).map(c=>
`<div class="comment">
<b>${escapeHTML(c.name)}</b><br>
${escapeHTML(c.text)}
</div>`
).join("")}

</div>

${p.userId==currentUserId?`

<div style="margin-top:8px">
<button class="red"
onclick="deletePost('${p.id}')">
Delete
</button>
</div>

`:""}

</div>

`;

}

function likePost(id){

let p=posts.find(x=>x.id==id);

if(!p)return;

if(!Array.isArray(p.likedBy))p.likedBy=[];

let i=p.likedBy.indexOf(currentUserId);

if(i>=0){

p.likedBy.splice(i,1);

}else{

p.likedBy.push(currentUserId);

}

p.likes=p.likedBy.length;

saveAll();

loadFeed();

loadProfile();

}

function toggleComment(id){

document.getElementById("commentBox"+id)
.classList.toggle("hidden");

}

function addComment(id){

let input=document.getElementById("commentInput"+id);

let text=input.value.trim();

if(!text)return;

let p=posts.find(x=>x.id==id);

p.comments=p.comments||[];

p.comments.push({

userId:currentUserId,
name:currentUser().name,
text,
time:Date.now()

});

saveAll();

loadFeed();

}

function sharePost(id){

let p=posts.find(x=>x.id==id);

p.shares=(p.shares||0)+1;

saveAll();

if(navigator.share){

navigator.share({
title:"My Social App",
text:p.text||"Post",
url:location.href
}).catch(()=>{});

}else{

alert("Share count বেড়েছে");

}

loadFeed();

}

function deletePost(id){

if(!confirm("Post delete করবেন?"))return;

posts=posts.filter(p=>p.id!=id);

saveAll();

loadFeed();

loadProfile();

}


/* =========================
   REELS
========================= */

function previewReel(){

let file=document.getElementById("reelVideo").files[0];

let video=document.getElementById("reelPreview");

if(!file){

video.classList.add("hidden");

return;

}

video.src=URL.createObjectURL(file);

video.classList.remove("hidden");

}

function createReel(){

let u=currentUser();

let text=document.getElementById("reelText").value.trim();

let file=document.getElementById("reelVideo").files[0];

if(!file){

alert("Video নির্বাচন করুন");

return;

}

if(file.size>15*1024*1024){

alert("এই Demo-তে 15MB-এর কম ভিডিও ব্যবহার করুন");

return;

}

readFile(file,data=>{

reels.unshift({

id:uid(),
userId:u.id,
name:u.name,
text,
video:data,
likes:0,
likedBy:[],
comments:[],
shares:0,
time:Date.now()

});

saveAll();

document.getElementById("reelText").value="";
document.getElementById("reelVideo").value="";
document.getElementById("reelPreview").classList.add("hidden");

loadReels();

});

}

function loadReels(){

document.getElementById("reelsFeed").innerHTML=

reels.map(renderReel).join("")||

`<div class="card center">কোনো Reel নেই</div>`;

}

function renderReel(r){

let u=getUser(r.userId)||currentUser();

let liked=r.likedBy&&r.likedBy.includes(currentUserId);

return `

<div class="card">

<div class="userRow">

<img class="smallAvatar"
src="${u.profilePhoto||'https://via.placeholder.com/45'}">

<b>${escapeHTML(u.name)}</b>

</div>

<p>${escapeHTML(r.text)}</p>

<video class="video" controls src="${r.video}"></video>

<p>
❤️ ${r.likes||0}
💬 ${(r.comments||[]).length}
↗️ ${r.shares||0}
</p>

<div class="actions">

<button onclick="likeReel('${r.id}')">
${liked?"💔 Unlike":"❤️ Like"}
</button>

<button onclick="addReelComment('${r.id}')">
💬 Comment
</button>

<button onclick="shareReel('${r.id}')">
↗️ Share
</button>

</div>

${r.userId==currentUserId?`

<br>
<button class="red"
onclick="deleteReel('${r.id}')">
Delete Reel
</button>

`:""}

</div>

`;

}

function likeReel(id){

let r=reels.find(x=>x.id==id);

if(!r)return;

r.likedBy=r.likedBy||[];

let i=r.likedBy.indexOf(currentUserId);

if(i>=0)r.likedBy.splice(i,1);
else r.likedBy.push(currentUserId);

r.likes=r.likedBy.length;

saveAll();

loadReels();

}

function addReelComment(id){

let text=prompt("Comment লিখুন");

if(!text)return;

let r=reels.find(x=>x.id==id);

r.comments=r.comments||[];

r.comments.push({

name:currentUser().name,
userId:currentUserId,
text,
time:Date.now()

});

saveAll();

loadReels();

}

function shareReel(id){

let r=reels.find(x=>x.id==id);

r.shares=(r.shares||0)+1;

saveAll();

if(navigator.share){

navigator.share({
title:"My Social App Reel",
text:r.text||"Reel",
url:location.href
}).catch(()=>{});

}else{

alert("Share count বেড়েছে");

}

loadReels();

}

function deleteReel(id){

if(!confirm("Reel delete করবেন?"))return;

reels=reels.filter(r=>r.id!=id);

saveAll();

loadReels();

}


/* =========================
   SEARCH
========================= */

function searchUsers(){

let q=document.getElementById("searchInput")
.value.toLowerCase().trim();

let result=users.filter(u=>
u.id!=currentUserId &&
u.name.toLowerCase().includes(q)
);

document.getElementById("searchResults").innerHTML=

result.map(renderSearchUser).join("")||

"<p>কোনো user পাওয়া যায়নি</p>";

}

function renderSearchUser(u){

let me=currentUser();

let friend=me.friends.includes(u.id);

let requestSent=me.sentRequests.includes(u.id);

let requestReceived=me.friendRequests.includes(u.id);

let btn="";

if(friend){

btn=`<button class="green" onclick="openChat('${u.id}')">💬 Chat</button>`;

}else if(requestReceived){

btn=`
<button class="green"
onclick="acceptFriendRequest('${u.id}')">
Accept
</button>

<button class="red"
onclick="rejectFriendRequest('${u.id}')">
Reject
</button>
`;

}else if(requestSent){

btn=`<button class="gray">Request Sent</button>`;

}else{

btn=`
<button class="blue"
onclick="sendFriendRequest('${u.id}')">
Add Friend
</button>
`;

}

return `

<div class="userRow">

<img class="smallAvatar"
src="${u.profilePhoto||'https://via.placeholder.com/45'}">

<div style="flex:1">

<b>${escapeHTML(u.name)}</b>

<br>

<small>
${u.followers.length} Followers
</small>

</div>

${btn}

<button class="gray"
onclick="openUserProfile('${u.id}')">
Profile
</button>

</div>

`;

}

/* =========================
   FOLLOW
========================= */

function followUser(id){

let me=currentUser();
let u=getUser(id);

if(!u)return;

if(!me.following.includes(id)){

me.following.push(id);

if(!u.followers.includes(me.id)){
u.followers.push(me.id);
}

addNotification(
id,
me.name+" আপনাকে follow করেছে"
);

}

saveAll();

loadOtherProfile(id);

}


/* =========================
   FRIENDS
========================= */

function ensureFriendFields(u){

if(!Array.isArray(u.friends))u.friends=[];
if(!Array.isArray(u.friendRequests))u.friendRequests=[];
if(!Array.isArray(u.sentRequests))u.sentRequests=[];

}

function sendFriendRequest(id){

let me=currentUser();
let u=getUser(id);

ensureFriendFields(me);
ensureFriendFields(u);

if(me.friends.includes(id))return;

if(me.sentRequests.includes(id))return;

me.sentRequests.push(id);

if(!u.friendRequests.includes(me.id)){
u.friendRequests.push(me.id);
}

addNotification(
id,
me.name+" আপনাকে Friend Request পাঠিয়েছে"
);

saveAll();

alert("Friend Request পাঠানো হয়েছে");

searchUsers();

}

function acceptFriendRequest(id){

let me=currentUser();
let u=getUser(id);

ensureFriendFields(me);
ensureFriendFields(u);

me.friendRequests=me.friendRequests.filter(x=>x!=id);

u.sentRequests=u.sentRequests.filter(x=>x!=me.id);

if(!me.friends.includes(id))me.friends.push(id);

if(!u.friends.includes(me.id))u.friends.push(me.id);

addNotification(
id,
me.name+" আপনার Friend Request গ্রহণ করেছে"
);

saveAll();

showFriends();

}

function rejectFriendRequest(id){

let me=currentUser();
let u=getUser(id);

me.friendRequests=
me.friendRequests.filter(x=>x!=id);

if(u){

u.sentRequests=
u.sentRequests.filter(x=>x!=me.id);

}

saveAll();

showFriendRequests();

}

function cancelFriendRequest(id){

let me=currentUser();
let u=getUser(id);

me.sentRequests=
me.sentRequests.filter(x=>x!=id);

if(u){

u.friendRequests=
u.friendRequests.filter(x=>x!=me.id);

}

saveAll();

showSentRequests();

}

function unfriend(id){

if(!confirm("Unfriend করবেন?"))return;

let me=currentUser();
let u=getUser(id);

me.friends=me.friends.filter(x=>x!=id);

if(u){

u.friends=u.friends.filter(x=>x!=me.id);

}

saveAll();

loadOtherProfile(id);

}

`<div class="card center">আপনার কোনো Friend নেই</div>`;

/* =========================
   NOTIFICATIONS
========================= */

function addNotification(receiverId,text){

notifications.unshift({

id:uid(),
receiverId,
text,
read:false,
time:Date.now()

});

}

function toggleNotifications(){

if(!currentUserId)return;

let my=notifications.filter(n=>
n.receiverId==currentUserId
);

document.getElementById("notifications").innerHTML=

my.map(n=>`

<div class="card">

${escapeHTML(n.text)}

<br>

<small>${timeText(n.time)}</small>

</div>

`).join("")||

"<p>কোনো notification নেই</p>";

notifications.forEach(n=>{

if(n.receiverId==currentUserId)n.read=true;

});

saveAll();

document.getElementById("notificationModal")
.style.display="block";

updateNotificationBadge();

}

function closeNotifications(){

document.getElementById("notificationModal")
.style.display="none";

}

function updateNotificationBadge(){

let count=notifications.filter(n=>
n.receiverId==currentUserId&&!n.read
).length;

document.getElementById("notiBadge").textContent=
count?count:"";

}


/* =========================
   CHAT SYSTEM
========================= */

function openChat(id){

let me=currentUser();

if(!me.friends.includes(id)){

alert("শুধু Friend হলে Chat করা যাবে");

return;

}

activeChatUserId=id;

hideAllPages();

document.getElementById("chatPage")
.classList.add("active");

let u=getUser(id);

document.getElementById("chatAvatar").src=
u.profilePhoto||"https://via.placeholder.com/45";

document.getElementById("chatName").textContent=u.name;

updateChatStatus(id);

loadMessages();

}

function updateChatStatus(id){

let u=getUser(id);

if(!u)return;

let online=localStorage.getItem("online_"+id);

document.getElementById("chatStatus").innerHTML=

online?

`<span class="onlineDot"></span> Online`

:

`<span class="offlineDot"></span> Offline`;

}

function loadMessages(){

let box=document.getElementById("chatMessages");

let arr=messages.filter(m=>

(m.senderId==currentUserId &&
m.receiverId==activeChatUserId)

||

(m.senderId==activeChatUserId &&
m.receiverId==currentUserId)

);

arr.sort((a,b)=>a.time-b.time);

box.innerHTML=

arr.map(m=>{

let mine=m.senderId==currentUserId;

return `

<div class="msg ${mine?"msgMine":"msgOther"}">

<div>${escapeHTML(m.text)}</div>

<div class="msgTime">

${timeText(m.time)}

${mine?

`<br>
<button class="msgDelete"
onclick="deleteMessage('${m.id}')">
Delete
</button>`

:""}

</div>

</div>

`;

}).join("")||

`<div class="center" style="padding:40px;color:#777">
কোনো message নেই
</div>`;

box.scrollTop=box.scrollHeight;

}

function sendMessage(){

let input=document.getElementById("messageInput");

let text=input.value.trim();

if(!text)return;

if(!activeChatUserId)return;

let msg={

id:uid(),
senderId:currentUserId,
receiverId:activeChatUserId,
text,
time:Date.now()

};

messages.push(msg);

addNotification(
activeChatUserId,
currentUser().name+" আপনাকে একটি নতুন message পাঠিয়েছে"
);

saveAll();

input.value="";

loadMessages();

}

function messageKey(e){

if(e.key==="Enter"){

e.preventDefault();

sendMessage();

}

}

function deleteMessage(id){

if(!confirm("এই message delete করবেন?"))return;

messages=messages.filter(m=>m.id!=id);

saveAll();

loadMessages();

}


/* =========================
   CHAT LIST
========================= */

function renderChatList(){

let me=currentUser();

let friends=me.friends
.map(getUser)
.filter(Boolean);

let html="";

friends.forEach(u=>{

let arr=messages.filter(m=>

(m.senderId==currentUserId &&
m.receiverId==u.id)

||

(m.senderId==u.id &&
m.receiverId==currentUserId)

);

arr.sort((a,b)=>b.time-a.time);

let last=arr[0];

let online=localStorage.getItem("online_"+u.id);

html+=`

<div class="chatItem"
onclick="openChat('${u.id}')">

<img class="smallAvatar"
src="${u.profilePhoto||'https://via.placeholder.com/45'}">

<div class="chatInfo">

<div class="chatName">

${escapeHTML(u.name)}

${online?
'<span class="onlineDot"></span>':
'<span class="offlineDot"></span>'}

</div>

<div class="lastMsg">

${last?
escapeHTML(last.text):
"No messages yet"}

</div>

</div>

${last?
`<small>${timeText(last.time)}</small>`:""}

</div>

`;

});

document.getElementById("chatList").innerHTML=

html||

`<div class="card center">
আগে Friend Add করুন, তারপর Chat করতে পারবেন।
</div>`;

}


/* =========================
   ONLINE SYSTEM
========================= */

function setOnline(){

if(!currentUserId)return;

localStorage.setItem(
"online_"+currentUserId,
Date.now()
);

}

setInterval(()=>{

if(currentUserId){

localStorage.setItem(
"online_"+currentUserId,
Date.now()
);

}

},30000);

migrate();

hideAllPages();

loadFeed();

updateNotificationBadge();

setOnline();
