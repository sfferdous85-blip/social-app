<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1877f2">

<title>My Social App</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:#f0f2f5;
  color:#1c1e21;
}

body.dark{
  background:#18191a;
  color:#e4e6eb;
}

button,
input,
textarea,
select{
  font-family:inherit;
}

button{
  border:0;
  cursor:pointer;
  border-radius:7px;
  padding:10px 14px;
  font-size:14px;
}

.blue{
  background:#1877f2;
  color:white;
}

.gray{
  background:#e4e6eb;
  color:#111;
}

.danger{
  background:#e41e3f;
  color:white;
}

.green{
  background:#42b72a;
  color:white;
}

body.dark .gray{
  background:#3a3b3c;
  color:#fff;
}

input,
textarea,
select{
  border:1px solid #ccd0d5;
  border-radius:7px;
  padding:11px;
  width:100%;
  outline:none;
  background:white;
  color:#111;
}

body.dark input,
body.dark textarea,
body.dark select{
  background:#242526;
  color:#fff;
  border-color:#3e4042;
}

textarea{
  resize:vertical;
}

.hidden{
  display:none!important;
}

/* AUTH */

.auth{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.auth-box{
  width:100%;
  max-width:420px;
  background:white;
  padding:28px;
  border-radius:12px;
  box-shadow:0 4px 20px rgba(0,0,0,.12);
}

body.dark .auth-box{
  background:#242526;
}

.logo{
  text-align:center;
  color:#1877f2;
  font-size:32px;
  font-weight:bold;
  margin-bottom:20px;
}

.auth-box h2{
  text-align:center;
}

.auth-box input{
  margin-bottom:12px;
}

.auth-box button{
  width:100%;
  margin-top:5px;
}

/* APP */

#app{
  min-height:100vh;
}

.topbar{
  height:60px;
  background:white;
  border-bottom:1px solid #ddd;
  display:flex;
  align-items:center;
  padding:0 15px;
  gap:15px;
  position:sticky;
  top:0;
  z-index:100;
}

body.dark .topbar{
  background:#242526;
  border-color:#3a3b3c;
}

.top-logo{
  color:#1877f2;
  font-size:24px;
  font-weight:bold;
}

.search{
  max-width:300px;
}

.top-actions{
  margin-left:auto;
  display:flex;
  gap:7px;
}

.icon-btn{
  width:40px;
  height:40px;
  border-radius:50%;
  padding:0;
  font-size:18px;
}

.layout{
  display:grid;
  grid-template-columns:220px minmax(0,680px);
  gap:20px;
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.sidebar{
  position:sticky;
  top:80px;
  height:max-content;
}

.nav-btn{
  width:100%;
  text-align:left;
  background:transparent;
  margin-bottom:4px;
  padding:12px;
}

.nav-btn:hover{
  background:#ddd;
}

body.dark .nav-btn:hover{
  background:#3a3b3c;
}

/* CARDS */

.card{
  background:white;
  border-radius:10px;
  padding:15px;
  margin-bottom:15px;
  box-shadow:0 1px 2px rgba(0,0,0,.12);
}

body.dark .card{
  background:#242526;
}

.page-title{
  font-size:24px;
  font-weight:bold;
  margin-bottom:15px;
}

/* PROFILE */

.profile-head{
  text-align:center;
}

.avatar{
  width:90px;
  height:90px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd;
}

.avatar-small{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd;
}

/* POST */

.post-head{
  display:flex;
  align-items:center;
  gap:10px;
}

.post-user{
  font-weight:bold;
}

.post-time{
  font-size:12px;
  color:#65676b;
}

.post-text{
  margin:14px 0;
  white-space:pre-wrap;
  word-break:break-word;
}

.post-img,
.post-video{
  width:100%;
  max-height:600px;
  object-fit:contain;
  border-radius:8px;
  background:#111;
}

.post-actions{
  display:flex;
  gap:5px;
  border-top:1px solid #ddd;
  margin-top:12px;
  padding-top:10px;
}

.post-actions button{
  flex:1;
  background:transparent;
}

body.dark .post-actions{
  border-color:#3a3b3c;
}

/* STORIES */

.stories{
  display:flex;
  gap:10px;
  overflow-x:auto;
  margin-bottom:15px;
}

.story{
  min-width:110px;
  height:160px;
  border-radius:10px;
  overflow:hidden;
  position:relative;
  background:#1877f2;
  color:white;
}

.story img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.story span{
  position:absolute;
  bottom:8px;
  left:8px;
  right:8px;
  font-weight:bold;
  text-shadow:0 1px 3px #000;
}

/* REELS */

.reel{
  background:#000;
  border-radius:10px;
  overflow:hidden;
  margin-bottom:15px;
}

.reel video{
  width:100%;
  max-height:650px;
  display:block;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal-box{
  background:white;
  width:100%;
  max-width:520px;
  max-height:90vh;
  overflow:auto;
  border-radius:12px;
  padding:20px;
}

body.dark .modal-box{
  background:#242526;
}

.modal-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

/* COMMENTS */

.comment{
  padding:9px;
  background:#f0f2f5;
  border-radius:8px;
  margin:7px 0;
}

body.dark .comment{
  background:#3a3b3c;
}

/* SETTINGS */

.setting-title{
  font-size:18px;
  font-weight:bold;
}

.setting-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  padding:13px 0;
  border-bottom:1px solid #ddd;
}

body.dark .setting-row{
  border-color:#3a3b3c;
}

.setting-row:last-child{
  border-bottom:0;
}

.setting-label{
  font-weight:600;
}

.setting-desc{
  color:#65676b;
  font-size:13px;
  margin-top:4px;
}

.switch{
  width:48px;
  height:26px;
  position:relative;
}

.switch input{
  display:none;
}

.slider{
  position:absolute;
  inset:0;
  background:#ccc;
  border-radius:30px;
  cursor:pointer;
}

.slider:before{
  content:"";
  width:20px;
  height:20px;
  background:white;
  position:absolute;
  left:3px;
  top:3px;
  border-radius:50%;
  transition:.2s;
}

.switch input:checked + .slider{
  background:#1877f2;
}

.switch input:checked + .slider:before{
  transform:translateX(22px);
}

/* TOAST */

#toast{
  position:fixed;
  bottom:25px;
  left:50%;
  transform:translateX(-50%);
  background:#222;
  color:white;
  padding:12px 18px;
  border-radius:8px;
  display:none;
  z-index:2000;
}

/* MOBILE */

@media(max-width:800px){

  .layout{
    grid-template-columns:1fr;
    padding:10px;
  }

  .sidebar{
    position:static;
    display:flex;
    overflow-x:auto;
    gap:5px;
  }

  .nav-btn{
    width:auto;
    white-space:nowrap;
  }

  .search{
    display:none;
  }

  .top-logo{
    font-size:20px;
  }

}

@media(max-width:500px){

  .topbar{
    padding:0 8px;
  }

  .top-actions button:nth-child(1){
    display:none;
  }

  .card{
    border-radius:7px;
  }

}
</style>
</head>

<body>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://skereuaizdczbvjplisi.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_3R2otJA1zIlsMsTYxe1ocw_NAPY5O9x";

const sb =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   GLOBALS
===================================================== */

let user = null;
let profile = null;

let appSettings = null;
let creatorSettings = null;

let currentCommentPost = null;


/* =====================================================
   HELPERS
===================================================== */

function esc(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function toast(message){

  const box =
    document.getElementById("toast");

  box.textContent = message;

  box.style.display = "block";

  clearTimeout(window.toastTimer);

  window.toastTimer =
    setTimeout(() => {

      box.style.display = "none";

    },3000);
}


function closeModal(id){

  document
    .getElementById(id)
    .classList.add("hidden");

}


/* =====================================================
   AUTH UI
===================================================== */

function showLogin(){

  document
    .getElementById("loginBox")
    .classList.remove("hidden");

  document
    .getElementById("registerBox")
    .classList.add("hidden");

}


function showRegister(){

  document
    .getElementById("loginBox")
    .classList.add("hidden");

  document
    .getElementById("registerBox")
    .classList.remove("hidden");

}


/* =====================================================
   REGISTER
===================================================== */

async function register(){

  const name =
    document
      .getElementById("regName")
      .value.trim();

  const username =
    document
      .getElementById("regUsername")
      .value
      .trim()
      .toLowerCase();

  const email =
    document
      .getElementById("regEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("regPassword")
      .value;


  if(!name || !email || !password){

    toast("সব তথ্য পূরণ করুন");

    return;
  }


  if(password.length < 6){

    toast(
      "Password কমপক্ষে 6 characters"
    );

    return;
  }


  const {
    data,
    error
  } =
    await sb.auth.signUp({

      email,

      password,

      options:{
        data:{
          name,
          username
        }
      }

    });


  if(error){

    toast(error.message);

    return;
  }


  if(data.user){

    await sb
      .from("profiles")
      .upsert({

        id:data.user.id,

        name:name,

        username:
          username || null

      });

  }


  toast(
    "Account তৈরি হয়েছে। Email verification প্রয়োজন হতে পারে।"
  );

}


/* =====================================================
   LOGIN
===================================================== */

async function login(){

  const email =
    document
      .getElementById("loginEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("loginPassword")
      .value;


  if(!email || !password){

    toast("Email এবং Password দিন");

    return;
  }


  const {
    error
  } =
    await sb.auth.signInWithPassword({

      email,

      password

    });


  if(error){

    toast(error.message);

    return;
  }

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

  await sb.auth.signOut();

}


/* =====================================================
   PROFILE
===================================================== */

async function ensureProfile(){

  if(!user){
    return null;
  }


  try{

    let {
      data,
      error
    } =
      await sb
        .from("profiles")
        .select("*")
        .eq("id",user.id)
        .maybeSingle();


    if(error){

      console.error(
        "Profile error:",
        error
      );

      return null;
    }


    if(!data){

      const metadata =
        user.user_metadata || {};


      const result =
        await sb
          .from("profiles")
          .insert({

            id:user.id,

            name:
              metadata.name ||
              user.email?.split("@")[0] ||
              "User",

            username:
              metadata.username ||
              null

          })
          .select("*")
          .maybeSingle();


      if(result.error){

        console.error(
          result.error
        );

        return null;
      }


      data =
        result.data;
    }


    profile = data;

    return data;

  }catch(err){

    console.error(err);

    return null;
  }

}


/* =====================================================
   SETTINGS DEFAULT
===================================================== */

function defaultSettings(){

  return {

    user_id:user?.id || null,

    post_privacy:"public",

    friend_request_privacy:"everyone",

    follow_privacy:"everyone",

    online_status:true,

    theme:
      localStorage.getItem("dark") === "true"
        ? "dark"
        : "light",

    notify_like:true,

    notify_comment:true,

    notify_friend_request:true,

    notify_message:true,

    notify_follow:true

  };

}


/* =====================================================
   ENSURE SETTINGS
===================================================== */

async function ensureSettings(){

  if(!user){

    appSettings =
      defaultSettings();

    return appSettings;
  }


  const defaults =
    defaultSettings();


  try{

    const {
      data,
      error
    } =
      await sb
        .from("user_settings")
        .select("*")
        .eq("user_id",user.id)
        .maybeSingle();


    if(error){

      console.error(
        "Settings SELECT:",
        error
      );

      appSettings =
        defaults;

      return appSettings;
    }


    if(!data){

      const {
        data:newData,
        error:insertError
      } =
        await sb
          .from("user_settings")
          .insert(defaults)
          .select("*")
          .maybeSingle();


      if(insertError){

        console.error(
          "Settings INSERT:",
          insertError
        );

        appSettings =
          defaults;

        return appSettings;
      }


      appSettings = {

        ...defaults,

        ...(newData || {})

      };

    }else{

      appSettings = {

        ...defaults,

        ...data

      };

    }


    return appSettings;

  }catch(error){

    console.error(error);

    appSettings =
      defaults;

    return appSettings;
  }

}


/* =====================================================
   CREATOR SETTINGS
===================================================== */

async function ensureCreatorSettings(){

  if(!user){

    creatorSettings = {

      user_id:null,

      monetization_enabled:false,

      payout_email:""

    };

    return creatorSettings;
  }


  const defaults = {

    user_id:user.id,

    monetization_enabled:false,

    payout_email:""

  };


  try{

    const {
      data,
      error
    } =
      await sb
        .from("creator_settings")
        .select("*")
        .eq("user_id",user.id)
        .maybeSingle();


    if(error){

      console.error(
        "Creator settings:",
        error
      );

      creatorSettings =
        defaults;

      return creatorSettings;
    }


    if(!data){

      const {
        data:newData,
        error:insertError
      } =
        await sb
          .from("creator_settings")
          .insert(defaults)
          .select("*")
          .maybeSingle();


      if(insertError){

        console.error(
          insertError
        );

        creatorSettings =
          defaults;

        return creatorSettings;
      }


      creatorSettings = {

        ...defaults,

        ...(newData || {})

      };

    }else{

      creatorSettings = {

        ...defaults,

        ...data

      };

    }


    return creatorSettings;

  }catch(error){

    console.error(error);

    creatorSettings =
      defaults;

    return creatorSettings;
  }

}


/* =====================================================
   SAVE SETTING
===================================================== */

async function saveSetting(
  field,
  value
){

  if(!user){

    return;
  }


  if(!appSettings){

    appSettings =
      defaultSettings();
  }


  appSettings[field] =
    value;


  if(field === "theme"){

    if(value === "dark"){

      document.body
        .classList.add("dark");

      localStorage.setItem(
        "dark",
        "true"
      );

    }else{

      document.body
        .classList.remove("dark");

      localStorage.setItem(
        "dark",
        "false"
      );

    }

  }


  try{

    const {
      error
    } =
      await sb
        .from("user_settings")
        .upsert({

          user_id:user.id,

          [field]:value,

          updated_at:
            new Date()
              .toISOString()

        });


    if(error){

      console.error(error);

      toast(
        "Setting save হয়নি"
      );

      return;
    }


    toast("✅ Setting saved");

  }catch(error){

/* =====================================================
   CREATE POST
===================================================== */

async function createPost(){

  const text =
    document
      .getElementById("postText")
      .value
      .trim();

  const privacy =
    document
      .getElementById("postPrivacy")
      .value;

  const file =
    document
      .getElementById("postImage")
      .files[0];


  if(!text && !file){

    toast(
      "Post text অথবা photo দিন"
    );

    return;
  }


  let image_url = null;


  /*
    Image upload-এর জন্য আপনার Supabase
    Storage bucket-এর নাম "post-images"
    হতে হবে।
  */

  if(file){

    try{

      const ext =
        file.name
          .split(".")
          .pop();

      const path =
        user.id +
        "/" +
        Date.now() +
        "." +
        ext;


      const upload =
        await sb.storage
          .from("post-images")
          .upload(
            path,
            file,
            {
              upsert:false
            }
          );


      if(upload.error){

        console.error(
          upload.error
        );

        toast(
          "Photo upload হয়নি। Storage bucket check করুন।"
        );

        return;
      }


      const publicData =
        sb.storage
          .from("post-images")
          .getPublicUrl(path);


      image_url =
        publicData.data.publicUrl;

    }catch(error){

      console.error(error);

      toast(
        "Photo upload error"
      );

      return;
    }

  }


  const {
    error
  } =
    await sb
      .from("posts")
      .insert({

        user_id:user.id,

        text:text,

        image_url:image_url,

        privacy:privacy

      });


  if(error){

    console.error(error);

    toast(error.message);

    return;
  }


  document
    .getElementById("postText")
    .value = "";

  document
    .getElementById("postImage")
    .value = "";


  closeModal("postModal");

  toast("✅ Post published");

  loadHome();

}

function postHTML(p){

  const author =
    p.profiles || {};

  const avatar =
    author.avatar_url ||
    "https://via.placeholder.com/90";


  const name =
    author.name ||
    "User";


  const date =
    p.created_at
      ? new Date(
          p.created_at
        ).toLocaleString(
          "bn-BD"
        )
      : "";


  let media = "";


  if(p.image_url){

    media += `

      <img
        class="post-img"
        src="${esc(p.image_url)}"
        loading="lazy"
      >

  }


  if(p.video_url){

    media += `

      <video
        class="post-video"
        controls
        src="${esc(p.video_url)}">
      </video>

    `;

  }


  return `

    <div class="card">

      <div class="post-head">

        <img
          class="avatar-small"
          src="${esc(avatar)}"
        >

        <div>

          <div class="post-user">
            ${esc(name)}
          </div>

          <div class="post-time">
            ${esc(date)}
          </div>

        </div>

      </div>


      ${
        p.text
        ? `
          <div class="post-text">
            ${esc(p.text)}
          </div>
        `
        : ""
      }


      ${media}


      <div class="post-actions">

        <button
          onclick="
            setReaction(
              ${p.id},
              'like'
            )

          ❤️ Like
        </button>

        <button
          onclick="

            )

          💬 Comment
        </button>

            )

        <button

/* =====================================================
   DARK MODE
===================================================== */

function settingsDarkMode(){

  const checked =
    document
      .getElementById(
        "settingsDarkMode"
      )
      ?.checked;


  if(checked){

    document.body
      .classList.add("dark");

    localStorage.setItem(
      "dark",
      "true"
    );

    saveSetting(
      "theme",
      "dark"
    );

  }else{

    document.body
      .classList.remove("dark");

    localStorage.setItem(
      "dark",
      "false"
    );

    saveSetting(
      "theme",
      "light"
    );

  }

}


/* =====================================================
   PASSWORD
===================================================== */

async function openPasswordModal(){

  const password =
    prompt(
      "নতুন Password দিন:"
    );


  if(!password){
    return;
  }


  if(password.length < 6){

    toast(
      "Password কমপক্ষে 6 characters হতে হবে"
    );

    return;
  }


  const {
    error
  } =
    await sb.auth.updateUser({

      password:password

    });


  if(error){

    toast(error.message);

    return;
  }


  toast(
    "✅ Password changed"
  );

}


/* =====================================================
   DEACTIVATE
===================================================== */

async function deactivateAccount(){

  if(!confirm(
    "Account Deactivate করতে চান?"
  )){
    return;
  }


  const {
    error
  } =
    await sb
      .from("profiles")
      .update({
        is_deactivated:true
      })
      .eq(
        "id",
        user.id
      );


  if(error){

    toast(error.message);

    return;
  }


  toast(
    "Account deactivated"
  );


  await logout();

}


/* =====================================================
   DELETE ACCOUNT
===================================================== */

async function deleteAccount(){

  if(!confirm(
    "⚠️ Account permanently delete করবেন?"
  )){
    return;
  }


  if(!confirm(
    "শেষবার নিশ্চিত করুন। Account এবং data মুছে যাবে।"
  )){
    return;
  }


  const {
    error
  } =
    await sb.rpc(
      "delete_my_account"
    );


  if(error){

    console.error(error);

    toast(
      "Delete হয়নি: " +
      error.message
    );

    return;
  }


  await sb.auth.signOut();

  location.reload();

}


/* =====================================================

===================================================== */

async function logoutAllDevices(){

  if(!confirm(
    "সব device থেকে Logout করবেন?"
  )){
    return;
  }


  const {
    error
  } =
    await sb.auth.signOut({

      scope:"global"

    });


  if(error){

    toast(error.message);

    return;
  }


  location.reload();

}


/* =====================================================
   DOWNLOAD DATA
===================================================== */

async function downloadMyData(){

  const result = {

    account:{

      id:user?.id,

      email:user?.email,

      created_at:user?.created_at

    },

    profile:profile,

    settings:appSettings,

    creator_settings:
      creatorSettings

  };


  const blob =
    new Blob(
      [
        JSON.stringify(
          result,
          null,
          2
        )
      ],
      {
        type:
          "application/json"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      "a"
    );


  a.href = url;

  a.download =
    "my-social-app-data.json";


  document.body.appendChild(a);

  a.click();

  a.remove();

  URL.revokeObjectURL(url);


  toast(
    "📥 Data downloaded"
  );

}


/* =====================================================
   SEARCH
===================================================== */

async function searchUsers(){

  const q =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .trim();


  if(!q){

    return;
  }


  const main =
    document.getElementById(
      "main"
    );


  main.innerHTML = `

    <div class="page-title">
      🔎 Search
    </div>

    <div class="card">
      Searching...
    </div>

  `;


  const {
    data,
    error
  } =
    await sb
      .from("profiles")
      .select("*")
      .ilike(
        "name",
        "%" +
        q +
        "%"
      )
      .limit(30);


  if(error){

    main.innerHTML += `

      <div class="card">
        ${esc(error.message)}
      </div>

    `;

    return;
  }


  if(!data?.length){

    main.innerHTML = `

      <div class="page-title">
        🔎 Search
      </div>

      <div class="card">
        কোনো User পাওয়া যায়নি।
      </div>

    `;

    return;
  }


  main.innerHTML = `

    <div class="page-title">
      🔎 Search Results
    </div>

    ${data.map(p => `

      <div
        class="card"
        style="
          display:flex;
          align-items:center;
          gap:12px;
        "
      >

        <img
          class="avatar-small"
          src="${esc(
            p.avatar_url ||
            "https://via.placeholder.com/90"
          )}"
        >

        <div>

          <b>
            ${esc(
              p.name ||
              "User"
            )}
          </b>

          ${
            p.username
            ? `
              <div>
                @${esc(
                  p.username
                )}
              </div>
            `
            : ""
          }

        </div>


        <button
          class="blue"
          style="margin-left:auto"
          onclick="
            renderProfile(
              '${p.id}'
            )
          "
        >
          View
        </button>

      </div>

    `).join("")}

  `;

}


/* =====================================================

===================================================== */

async function openPage(page){

  if(page === "home"){

    return loadHome();

  }


  if(page === "profile"){

    return renderProfile(
      user.id
    );

  }


  if(page === "friends"){

    return renderFriends();

  }


  if(page === "messenger"){

    return renderMessenger();

  }


  if(page === "notifications"){

    return renderNotifications();

  }


  if(page === "reels"){

    return renderReels();

  }


  if(page === "saved"){

    return renderSaved();

  }


  if(page === "trending"){

    return renderTrending();

  }


  if(page === "earnings"){

    return renderEarnings();

  }


  if(page === "settings"){

    return renderSettings();

  }

}


/* =====================================================
   START APP
===================================================== */

async function startApp(){

  document
    .getElementById("auth")
    .classList.add("hidden");


  document
    .getElementById("app")
    .classList.remove("hidden");


  await ensureProfile();


  /*
    Settings error হলে App বন্ধ হবে না।
  */

  try{

    await ensureSettings();

  }catch(error){

    console.error(error);

  }


  try{

    await ensureCreatorSettings();

  }catch(error){

    console.error(error);

  }


  if(
    localStorage.getItem(
      "dark"
    ) === "true"
  ){

    document.body
      .classList.add("dark");

  }


  await loadHome();

}


/* =====================================================
   AUTH STATE
===================================================== */

sb.auth.onAuthStateChange(
  async (
    event,
    session
  ) => {

    user =
      session?.user || null;


    if(user){

      await startApp();

    }else{

      document
        .getElementById("app")
        .classList.add("hidden");

      document
        .getElementById("auth")
        .classList.remove("hidden");

      showLogin();

    }

  }
);


/* =====================================================
   INITIAL SESSION
===================================================== */

(async function(){

  const {
    data
  } =
    await sb.auth.getSession();


  user =
    data.session?.user ||
    null;


  if(user){

    await startApp();

  }else{

    document
      .getElementById("auth")
      .classList.remove("hidden");

  }

})();
