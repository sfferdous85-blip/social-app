<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#1877f2">
<title>FriendBook</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f0f2f5;
  color:#1c1e21
}
button,input,textarea,select{
  font:inherit
}
button{
  cursor:pointer
}
.topbar{
  position:sticky;
  top:0;
  z-index:100;
  height:58px;
  background:#fff;
  border-bottom:1px solid #ddd;
  display:flex;
  align-items:center;
  padding:0 12px;
  gap:10px
}
.logo{
  font-size:25px;
  font-weight:800;
  color:#1877f2
}
.search{
  flex:1;
  max-width:500px;
  background:#f0f2f5;
  border:0;
  border-radius:25px;
  padding:11px 16px;
  outline:none
}
.container{
  max-width:1200px;
  margin:auto;
  display:grid;
  grid-template-columns:240px 1fr 280px;
  gap:18px;
  padding:18px
}
.card{
  background:#fff;
  border-radius:10px;
  padding:14px;
  margin-bottom:15px;
  box-shadow:0 1px 3px #0001
}
.nav button{
  width:100%;
  border:0;
  background:transparent;
  padding:12px;
  text-align:left;
  border-radius:8px;
  margin-bottom:3px
}
.nav button:hover{
  background:#e4e6eb
}
.composer textarea{
  width:100%;
  border:0;
  background:#f0f2f5;
  border-radius:20px;
  padding:12px;
  resize:none;
  outline:none
}
.btn{
  border:0;
  border-radius:7px;
  padding:9px 14px;
  background:#1877f2;
  color:#fff;
  font-weight:600
}
.btn.gray{
  background:#e4e6eb;
  color:#050505
}
.btn.green{background:#42b72a}
.btn.red{background:#e41e3f}
.row{
  display:flex;
  gap:8px;
  align-items:center
}
.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd
}
.post-text{
  white-space:pre-wrap;
  margin:12px 0
}
.post-image{
  width:100%;
  max-height:600px;
  object-fit:cover;
  border-radius:8px
}
.reactions{
  display:flex;
  justify-content:space-between;
  padding:8px 0;
  color:#65676b
}
.actions{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  border-top:1px solid #ddd;
  border-bottom:1px solid #ddd
}
.actions button{
  border:0;
  background:transparent;
  padding:10px
}
.actions button:hover{
  background:#f0f2f5
}
.comment{
  background:#f0f2f5;
  border-radius:16px;
  padding:8px 12px;
  margin:6px 0
}
.auth{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px
}
.auth-box{
  width:100%;
  max-width:420px;
  background:#fff;
  padding:25px;
  border-radius:12px;
  box-shadow:0 5px 25px #0002
}
.auth-box input{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:7px;
  margin-bottom:10px
}
.hidden{display:none!important}

.reels{
  background:#000;
  border-radius:10px;
  overflow:hidden
}
.reel{
  position:relative;
  height:75vh;
  min-height:500px;
  background:#000;
  margin-bottom:5px
}
.reel video{
  width:100%;
  height:100%;
  object-fit:cover
}
.reel-info{
  position:absolute;
  bottom:15px;
  left:15px;
  right:70px;
  color:#fff;
  text-shadow:0 1px 3px #000
}
.reel-actions{
  position:absolute;
  right:12px;
  bottom:20px;
  display:flex;
  flex-direction:column;
  gap:10px
}
.reel-actions button{
  width:45px;
  height:45px;
  border:0;
  border-radius:50%;
  background:#fff9;
  font-size:20px
}

.bottom-nav{
  display:none;
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:58px;
  background:#fff;
  border-top:1px solid #ddd;
  z-index:200;
  grid-template-columns:repeat(5,1fr)
}
.bottom-nav button{
  border:0;
  background:#fff;
  font-size:21px
}

.story-list{
  display:flex;
  gap:10px;
  overflow-x:auto
}
.story{
  min-width:105px;
  height:160px;
  border-radius:10px;
  overflow:hidden;
  position:relative;
  background:#1877f2;
  color:#fff
}
.story img,.story video{
  width:100%;
  height:100%;
  object-fit:cover
}
.story span{
  position:absolute;
  bottom:7px;
  left:7px;
  font-weight:bold
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px
}
.item{
  border:1px solid #ddd;
  border-radius:8px;
  padding:10px
}

@media(max-width:900px){
  .container{
    grid-template-columns:1fr;
    padding:10px;
    padding-bottom:70px
  }
  .left,.right{
    display:none
  }
  .bottom-nav{
    display:grid
  }
  .topbar{
    height:54px
  }
  .logo{
    font-size:21px
  }
  .reel{
    height:calc(100vh - 110px);
    min-height:500px
  }
}
</style>
</head>

<body>

<div id="authScreen" class="auth">
  <div class="auth-box">
    <h1 style="color:#1877f2;text-align:center">FriendBook</h1>

    <input id="loginEmail" type="email" placeholder="Email">
    <input id="loginPassword" type="password" placeholder="Password">

    <button class="btn" style="width:100%" onclick="login()">
      Login
    </button>

    <hr>

    <input id="signupName" placeholder="আপনার নাম">
    <input id="signupEmail" type="email" placeholder="Email">
    <input id="signupPassword" type="password" placeholder="Password">

    <button class="btn green" style="width:100%" onclick="signup()">
      Create new account
    </button>

    <p id="authMsg"></p>
  </div>
</div>

<div id="app" class="hidden">

<header class="topbar">
  <div class="logo">FriendBook</div>
  <input id="searchInput" class="search"
         placeholder="FriendBook-এ খুঁজুন..."
         onkeydown="if(event.key==='Enter')searchAll()">
  <button class="btn gray" onclick="logout()">Logout</button>
</header>

<div class="container">

<aside class="left">
  <div class="card nav">
    <button onclick="openPage('home')">🏠 Home</button>
    <button onclick="openPage('reels')">🎬 Reels</button>
    <button onclick="openPage('stories')">⭕ Stories</button>
    <button onclick="openPage('friends')">👥 Friends</button>
    <button onclick="openPage('messages')">💬 Messenger</button>
    <button onclick="openPage('notifications')">🔔 Notifications</button>
    <button onclick="openPage('groups')">👨‍👩‍👧 Groups</button>
    <button onclick="openPage('pages')">📄 Pages</button>
    <button onclick="openPage('marketplace')">🛒 Marketplace</button>
    <button onclick="openPage('events')">📅 Events</button>
    <button onclick="openPage('creator')">📊 Creator</button>
    <button onclick="openPage('profile')">👤 Profile</button>
    <button onclick="openPage('settings')">⚙️ Settings</button>
  </div>
</aside>

<main id="main"></main>

<aside class="right">
  <div class="card">
    <h3>আপনার Profile</h3>
    <div id="sideProfile"></div>
  </div>

  <div class="card">
    <h3>Friend Suggestions</h3>
    <div id="suggestions"></div>
  </div>
</aside>

</div>

<nav class="bottom-nav">
  <button onclick="openPage('home')">🏠</button>
  <button onclick="openPage('reels')">🎬</button>
  <button onclick="openPage('friends')">👥</button>
  <button onclick="openPage('messages')">💬</button>
  <button onclick="openPage('profile')">👤</button>
</nav>

</div>

<script>
const SUPABASE_URL =
"https://skereuaizdczbvjplisi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_3R2otJA1zIlsMsTYxe1ocw_NAPY5O9x";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let me=null;
let currentPage="home";

const $=id=>document.getElementById(id);

function esc(v){
  return String(v??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function msg(t){
  alert(t);
}

async function signup(){

  const name=$("signupName").value.trim();
  const email=$("signupEmail").value.trim();
  const password=$("signupPassword").value;

  if(!name||!email||!password){
    $("authMsg").textContent="সব তথ্য দিন";
    return;
  }

  if(password.length<6){
    $("authMsg").textContent="Password কমপক্ষে ৬ অক্ষর";
    return;
  }

  const {data,error}=await db.auth.signUp({
    email,
    password,
    options:{
      data:{name}
    }
  });

  if(error){
    $("authMsg").textContent=error.message;
    return;
  }

  if(data.user){
    await db.from("fb_profiles").upsert({
      id:data.user.id,
      name,
      username:
        name.toLowerCase()
        .replace(/[^a-z0-9]/g,"")
        .slice(0,20)
        +"_"+Math.floor(Math.random()*9999),
      bio:""
    });
  }

  $("authMsg").textContent=
    "Account তৈরি হয়েছে। Email verification প্রয়োজন হতে পারে।";
}

async function login(){

  const email=$("loginEmail").value.trim();
  const password=$("loginPassword").value;

  if(!email||!password){
    $("authMsg").textContent="Email এবং Password দিন";
    return;
  }

  const {data,error}=await db.auth.signInWithPassword({
    email,
    password
  });

  if(error){
    $("authMsg").textContent=error.message;
    return;
  }

  me=data.user;
  await startApp();
}

async function logout(){

  await db.auth.signOut();

  me=null;

  $("app").classList.add("hidden");
  $("authScreen").classList.remove("hidden");
}

async function startApp(){

  if(!me)return;

  $("authScreen").classList.add("hidden");
  $("app").classList.remove("hidden");

  await ensureProfile();

  await loadSideProfile();
  await loadSuggestions();

  await openPage("home");
}

async function ensureProfile(){

  const {data}=await db
    .from("fb_profiles")
    .select("*")
    .eq("id",me.id)
    .maybeSingle();

  if(!data){

    const name=
      me.user_metadata?.name ||
      me.email?.split("@")[0] ||
      "User";

    await db.from("fb_profiles").insert({
      id:me.id,
      name,
      username:
        name.toLowerCase()
        .replace(/[^a-z0-9]/g,"")
        .slice(0,20)
        +"_"+Math.floor(Math.random()*9999),
      bio:""
    });
  }
}

async function openPage(page){

  currentPage=page;

  if(page==="home")await homePage();
  if(page==="reels")await reelsPage();
  if(page==="stories")await storiesPage();
  if(page==="friends")await friendsPage();
  if(page==="messages")await messagesPage();
  if(page==="notifications")await notificationsPage();
  if(page==="groups")await groupsPage();
  if(page==="pages")await pagesPage();
  if(page==="marketplace")await marketplacePage();
  if(page==="events")await eventsPage();
  if(page==="creator")await creatorPage();
  if(page==="profile")await profilePage();
  if(page==="settings")await settingsPage();
  if(page==="search")await searchPage();
}

async function homePage(){

  $("main").innerHTML=`

  <div class="card composer">

    <div class="row">
      <img id="composerAvatar" class="avatar">
      <b>${esc(me.email)}</b>
    </div>

    <br>

    <textarea id="postText"
      rows="3"
      placeholder="আপনার মনে কী চলছে?"></textarea>

    <br><br>

    <input id="postImage"
      type="file"
      accept="image/*">

    <br><br>

    <select id="postPrivacy">
      <option value="public">🌎 Public</option>
      <option value="friends">👥 Friends</option>
      <option value="private">🔒 Only me</option>
    </select>

    <button class="btn" onclick="createPost()">
      পোস্ট করুন
    </button>

  </div>

  <div id="feed"></div>
  `;

  await loadFeed();
}

async function createPost(){

  const text=$("postText").value.trim();
  const file=$("postImage").files[0];
  const privacy=$("postPrivacy").value;

  if(!text&&!file){
    msg("কিছু লিখুন অথবা ছবি নির্বাচন করুন");
    return;
  }

  let image_url=null;

  if(file){

    const ext=
      (file.name.split(".").pop()||"jpg").toLowerCase();

    const path=
      `${me.id}/${Date.now()}-${crypto.randomUUID()}.${ext}`;

    const {error}=await db.storage
      .from("post-images")
      .upload(path,file,{
        contentType:file.type,
        upsert:false
      });

    if(error){
      msg("ছবি Upload হয়নি: "+error.message);
      return;
    }

    const {data}=db.storage
      .from("post-images")
      .getPublicUrl(path);

    image_url=data.publicUrl;
  }

  const {error}=await db.from("fb_posts").insert({
    user_id:me.id,
    text,
    image_url,
    privacy,
    feeling:null,
    location:null
  });

  if(error){
    msg("Post failed: "+error.message);
    return;
  }

  $("postText").value="";
  $("postImage").value="";

  await loadFeed();

  msg("পোস্ট হয়েছে ✅");
}

async function loadFeed(){

  const box=$("feed");

  box.innerHTML="<div class='card'>Loading...</div>";

  const {data,error}=await db
    .from("fb_posts")
    .select("*")
    .order("created_at",{ascending:false})
    .limit(30);

  if(error){
    box.innerHTML=
      `<div class="card">Feed error: ${esc(error.message)}</div>`;
    return;
  }

  if(!data?.length){
    box.innerHTML=
      `<div class="card">এখনো কোনো পোস্ট নেই। প্রথম পোস্টটি করুন।</div>`;
    return;
  }

  let html="";

  for(const post of data){

    const {data:profile}=await db
      .from("fb_profiles")
      .select("name,profile_photo")
      .eq("id",post.user_id)
      .maybeSingle();

    const {count:likeCount}=await db
      .from("fb_post_reactions")
      .select("*",{count:"exact",head:true})
      .eq("post_id",post.id);

    const {count:commentCount}=await db
      .from("fb_comments")
      .select("*",{count:"exact",head:true})
      .eq("post_id",post.id);

    html+=`

    <article class="card">

      <div class="row">
        <img class="avatar"
          src="${esc(profile?.profile_photo||"https://placehold.co/80")}">

        <div>
          <b>${esc(profile?.name||"User")}</b>
          <div style="font-size:12px;color:#65676b">
            ${new Date(post.created_at).toLocaleString()}
          </div>
        </div>
      </div>

      ${post.text?
        `<div class="post-text">${esc(post.text)}</div>`:""}

      ${post.image_url?
        `<img class="post-image"
          src="${esc(post.image_url)}">`:""}

      <div class="reactions">
        <span>👍 ${likeCount||0}</span>
        <span>${commentCount||0} comments</span>
      </div>

      <div class="actions">
        <button onclick="reactPost(${post.id},'like')">
          👍 Like
        </button>

        <button onclick="toggleComments(${post.id})">
          💬 Comment
        </button>

        <button onclick="sharePost(${post.id})">
          ↗ Share
        </button>
      </div>

      <div id="comments-${post.id}"></div>

    </article>`;
  }

  box.innerHTML=html;
}

async function reactPost(postId,reaction){

  const {data:old}=await db
    .from("fb_post_reactions")
    .select("id")
    .eq("post_id",postId)
    .eq("user_id",me.id)
    .maybeSingle();

  if(old){

    await db.from("fb_post_reactions")
      .delete()
      .eq("id",old.id);

  }else{

    const {error}=await db
      .from("fb_post_reactions")
      .insert({
        post_id:postId,
        user_id:me.id,
        reaction
      });

    if(error){
      msg(error.message);
      return;
    }
  }

  await loadFeed();
}

async function toggleComments(postId){

  const box=$("comments-"+postId);

  if(box.innerHTML){
    box.innerHTML="";
    return;
  }

  box.innerHTML=`

  <div style="margin-top:10px">

    <div id="commentList-${postId}">
      Loading comments...
    </div>

    <div class="row">
      <input id="commentInput-${postId}"
        style="flex:1;padding:10px;border:1px solid #ddd;border-radius:20px"
        placeholder="Comment লিখুন">

      <button class="btn"
        onclick="addComment(${postId})">
        Send
      </button>
    </div>

  </div>`;

  await loadComments(postId);
}

async function loadComments(postId){

  const box=$("commentList-"+postId);

  const {data,error}=await db
    .from("fb_comments")
    .select("*")
    .eq("post_id",postId)
    .order("created_at",{ascending:true});

  if(error){
    box.innerHTML=esc(error.message);
    return;
  }

  if(!data?.length){
    box.innerHTML="<small>এখনো কোনো Comment নেই</small>";
    return;
  }

  let html="";

  for(const c of data){

    const {data:p}=await db
      .from("fb_profiles")
      .select("name")
      .eq("id",c.user_id)
      .maybeSingle();

    html+=`
      <div class="comment">
        <b>${esc(p?.name||"User")}</b>
        <div>${esc(c.text)}</div>
        <button
          class="btn gray"
          onclick="replyComment(${c.id},${postId})">
          Reply
        </button>
        <div id="reply-${c.id}"></div>
      </div>`;
  }

  box.innerHTML=html;
}

async function addComment(postId){

  const input=$("commentInput-"+postId);
  const text=input.value.trim();

  if(!text)return;

  const {error}=await db.from("fb_comments").insert({
    post_id:postId,
    user_id:me.id,
    parent_id:null,
    text
  });

  if(error){
    msg("Comment failed: "+error.message);
    return;
  }

  input.value="";

  await loadComments(postId);
  await loadFeed();
}

async function replyComment(commentId,postId){

  const box=$("reply-"+commentId);

  box.innerHTML=`
    <div class="row">
      <input id="replyInput-${commentId}"
        style="flex:1;padding:8px;border:1px solid #ddd;border-radius:18px"
        placeholder="Reply...">
      <button class="btn"
        onclick="sendReply(${commentId},${postId})">
        Send
      </button>
    </div>`;
}

async function sendReply(commentId,postId){

  const input=$("replyInput-"+commentId);
  const text=input.value.trim();

  if(!text)return;

  const {error}=await db.from("fb_comments").insert({
    post_id:postId,
    user_id:me.id,
    parent_id:commentId,
    text
  });

  if(error){
    msg(error.message);
    return;
  }

  await loadComments(postId);
}

async function sharePost(id){

  const url=location.href+"#post-"+id;

  try{
    await navigator.clipboard.writeText(url);
    msg("Post link copied ✅");
  }catch{
    msg(url);
  }
}

/* REELS */

async function reelsPage(){

  $("main").innerHTML=`

  <div class="card">

    <h2>🎬 Create Reel</h2>

    <input
      id="reelFile"
      type="file"
      accept="video/*"
      capture>

    <br><br>

    <input
      id="reelCaption"
      style="width:100%;padding:12px"
      placeholder="Reel caption">

    <input
      id="reelAudio"
      style="width:100%;padding:12px;margin-top:8px"
      placeholder="Audio name">

    <br><br>

    <button class="btn"
      onclick="publishReel()">
      🎬 Post Reel
    </button>

  </div>

  <div id="reelsFeed" class="reels"></div>
  `;

  await loadReels();
}

async function publishReel(){

  const file=$("reelFile").files[0];

  if(!file){
    msg("ভিডিও নির্বাচন করুন");
    return;
  }

  if(!file.type.startsWith("video/")){
    msg("শুধু ভিডিও নির্বাচন করুন");
    return;
  }

  const ext=
    (file.name.split(".").pop()||"mp4").toLowerCase();

  const path=
    `${me.id}/${Date.now()}-${crypto.randomUUID()}.${ext}`;

  const {error:upErr}=await db.storage
    .from("reels")
    .upload(path,file,{
      contentType:file.type,
      upsert:false
    });

  if(upErr){
    msg("Reel Upload failed: "+upErr.message);
    return;
  }

  const {data:urlData}=
    db.storage.from("reels").getPublicUrl(path);

  const {error:dbErr}=await db
    .from("fb_reels")
    .insert({
      user_id:me.id,
      video_url:urlData.publicUrl,
      caption:$("reelCaption").value.trim(),
      audio_name:$("reelAudio").value.trim(),
      views:0
    });

  if(dbErr){
    msg("Reel save failed: "+dbErr.message);
    return;

async function loadReels(){

  const box=$("reelsFeed");

  box.innerHTML=
    "<div style='color:white;padding:20px'>Loading Reels...</div>";

  const {data,error}=await db
    .from("fb_reels")
    .select("*")
    .order("created_at",{ascending:false})
    .limit(30);

  if(error){
    box.innerHTML=
      `<div style="color:white;padding:20px">
        Reel error: ${esc(error.message)}
      </div>`;
    return;
  }

  if(!data?.length){
    box.innerHTML=
      `<div style="color:white;padding:20px">
        এখনো কোনো Reel নেই।
      </div>`;
    return;
  }

  let html="";

  for(const r of data){

    const {data:p}=await db
      .from("fb_profiles")
      .select("name")
      .eq("id",r.user_id)
      .maybeSingle();

    const {count}=await db
      .from("fb_reel_reactions")
      .select("*",{count:"exact",head:true})
      .eq("reel_id",r.id);

    const {count:comments}=await db
      .from("fb_reel_comments")
      .select("*",{count:"exact",head:true})
      .eq("reel_id",r.id);

    html+=`

    <div class="reel">

      <video
        src="${esc(r.video_url)}"
        controls
        playsinline
        muted
        loop
        preload="metadata">
      </video>

      <div class="reel-info">
        <b>@${esc(p?.name||"User")}</b>

        <div>
          ${esc(r.caption||"")}
        </div>

        <small>
          👁 ${r.views||0} views
          · 👍 ${count||0}
          · 💬 ${comments||0}
        </small>
      </div>

      <div class="reel-actions">

        <button onclick="reactReel(${r.id})">
          ❤️
        </button>

        <button onclick="commentReel(${r.id})">
          💬
        </button>

        <button onclick="toggleReelSound(this)">
          🔇
        </button>

        <button onclick="shareReel('${esc(r.video_url)}')">
          ↗
        </button>

      </div>

    </div>`;
  }

  box.innerHTML=html;
}

async function reactReel(id){

  const {data:old}=await db
    .from("fb_reel_reactions")
    .select("id")
    .eq("reel_id",id)
    .eq("user_id",me.id)
    .maybeSingle();

  if(old){

    await db
      .from("fb_reel_reactions")
      .delete()
      .eq("id",old.id);

  }else{

    const {error}=await db
      .from("fb_reel_reactions")
      .insert({
        reel_id:id,
        user_id:me.id,
        reaction:"like"
      });

    if(error){
      msg(error.message);
      return;
    }
  }

  await loadReels();
}

async function commentReel(id){

  const text=prompt("Reel comment লিখুন");

  if(!text)return;

  const {error}=await db
    .from("fb_reel_comments")
    .insert({
      reel_id:id,
      user_id:me.id,
      text,
      parent_id:null
    });

  if(error){
    msg(error.message);
    return;
  }

  msg("Comment হয়েছে");
}

function toggleReelSound(button){

  const reel=button.closest(".reel");
  const video=reel.querySelector("video");

  video.muted=!video.muted;

  button.textContent=
    video.muted?"🔇":"🔊";
}

async function shareReel(url){

  try{
    await navigator.clipboard.writeText(url);
    msg("Reel link copied");
  }catch{
    msg(url);
  }
}

async function storiesPage(){

  $("main").innerHTML=`

  <div class="card">

    <h2>⭕ Create Story</h2>

    <input id="storyText"
      style="width:100%;padding:12px"
      placeholder="Text Story">

    <br><br>

    <input id="storyFile"
      type="file"
      accept="image/*,video/*">

    <br><br>

    <button class="btn"
      onclick="createStory()">
      Publish Story
    </button>

  </div>

  <div class="card">
    <h2>Stories</h2>
    <div id="storyList" class="story-list"></div>
  </div>
  `;

  await loadStories();
}

async function createStory(){

  const text=$("storyText").value.trim();
  const file=$("storyFile").files[0];

  if(!text&&!file){
    msg("Text অথবা media দিন");
    return;
  }

  let media_url=null;
  let media_type=null;

  if(file){

    const ext=
      (file.name.split(".").pop()||"jpg").toLowerCase();

    const path=
      `${me.id}/${Date.now()}-${crypto.randomUUID()}.${ext}`;

    const {error}=await db.storage
      .from("stories")
      .upload(path,file,{
        contentType:file.type
      });

    if(error){
      msg(error.message);
      return;
    }

    media_url=
      db.storage.from("stories")
      .getPublicUrl(path).data.publicUrl;

    media_type=file.type.startsWith("video")
      ?"video":"image";
  }

  const {error}=await db.from("fb_stories").insert({
    user_id:me.id,
    text,
    media_url,
    media_type,
    expires_at:
      new Date(Date.now()+86400000).toISOString()
  });

  if(error){
    msg(error.message);
    return;
  }

  msg("Story posted");
  await loadStories();
}

async function loadStories(){

  const box=$("storyList");

  const {data,error}=await db
    .from("fb_stories")
    .select("*")
    .gt("expires_at",new Date().toISOString())
    .order("created_at",{ascending:false});

  if(error){
    box.innerHTML=esc(error.message);
    return;
  }

  let html="";

  for(const s of data||[]){

    let media="";

    if(s.media_type==="video"){
      media=
        `<video src="${esc(s.media_url)}" muted></video>`;
    }else if(s.media_url){
      media=
        `<img src="${esc(s.media_url)}">`;
    }

    html+=`
      <div class="story">
        ${media}
        <span>${esc(s.text||"Story")}</span>
      </div>`;
  }

  box.innerHTML=html||
    "<p>কোনো active Story নেই</p>";
}
