<html lang="bn">
<head>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f0f2f5;
  color:#1c1e21;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0}
.hidden{display:none!important}

:root{
 --blue:#1877f2;
 --bg:#f0f2f5;
 --card:#fff;
 --text:#1c1e21;
 --muted:#65676b;
 --border:#dddfe2;
 --hover:#f2f2f2;
}

body.dark{
 --bg:#18191a;
 --card:#242526;
 --text:#e4e6eb;
 --muted:#b0b3b8;
 --border:#3e4042;
 --hover:#3a3b3c;
}

body{background:var(--bg);color:var(--text)}

.app-header{
 position:sticky;
 top:0;
 z-index:1000;
 height:60px;
 background:var(--card);
 border-bottom:1px solid var(--border);
 display:flex;
 align-items:center;
 padding:0 16px;
 gap:14px;
}

.brand{
 font-size:27px;
 font-weight:800;
 color:var(--blue);
 white-space:nowrap;
}

.header-search{
 flex:1;
 max-width:430px;
}

.header-search input{
 width:100%;
 border:0;
 outline:0;
 background:var(--bg);
 color:var(--text);
 padding:11px 16px;

}

.header-icons{
 margin-left:auto;
 display:flex;
 gap:7px;
}

.icon-btn{

 height:42px;
 border-radius:50%;

 color:var(--text);
 font-size:20px;
}

.icon-btn:hover{background:var(--hover)}

.layout{
 max-width:1400px;
 margin:auto;
 display:grid;
 grid-template-columns:250px minmax(400px,680px) 280px;
 gap:18px;
 padding:18px;
}

.left,.right{

 top:78px;
 height:max-content;
}

.menu-card,.card{
 background:var(--card);
 border-radius:12px;
 border:1px solid var(--border);

}

.menu-item{

 align-items:center;
 gap:13px;

 padding:13px;
 background:none;

 text-align:left;

 font-weight:600;

.menu-item:hover{background:var(--hover)}

.menu-icon{font-size:22px;width:28px;text-align:center}

.card{

.composer{

 gap:10px;

.avatar{

.story{

<script>

/* =====================================
   FRIENDBOOK CONFIG
===================================== */

const SUPABASE_URL =
"https://skereuaizdczbvjplisi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_3R2otJA1zIlsMsTYxe1ocw_NAPY5O9x";

let currentUser=null;
let session=null;
let feedMode="all";


/* =====================================
   HELPERS
===================================== */

function $(id){
 return document.getElementById(id);
}

function escapeHTML(v){

 if(v===null || v===undefined)return "";

 return String(v)
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");
}

function toast(msg){

 const t=$("toast");

 t.textContent=msg;
 t.style.display="block";

 setTimeout(()=>{
  t.style.display="none";
 },2500);
}

function formatCount(n){

 n=Number(n||0);

 if(n>=1000000)
  return (n/1000000).toFixed(1)+"M";

 if(n>=1000)
  return (n/1000).toFixed(1)+"K";

 return n;
}

function timeAgo(date){

 if(!date)return "";

 const seconds=
   Math.floor((Date.now()-new Date(date))/1000);

 if(seconds<60)
   return "Just now";

 if(seconds<3600)
   return Math.floor(seconds/60)+"m";

 if(seconds<86400)
   return Math.floor(seconds/3600)+"h";

 if(seconds<604800)
   return Math.floor(seconds/86400)+"d";

 return new Date(date).toLocaleDateString();
}


/* =====================================
   SUPABASE
===================================== */

async function api(path,options={}){

 const headers={
  "apikey":SUPABASE_KEY,
  "Authorization":
    "Bearer "+
    (session?.access_token || SUPABASE_KEY),
  "Content-Type":"application/json",
  ...(options.headers||{})
 };

 const res=await fetch(
   SUPABASE_URL+"/rest/v1/"+path,
   {
    ...options,
    headers
   }
 );

 const text=await res.text();

 let data=null;

 try{
  data=text?JSON.parse(text):null;
 }catch{
  data=text;
 }

 if(!res.ok){

  throw new Error(
   data?.message ||
   data?.details ||
   data?.hint ||
   data?.error ||
   text ||
   "Request failed"
  );
 }

 return data;
}


/* =====================================
   AUTH
===================================== */

function showLogin(){

 $("loginBox").classList.remove("hidden");
 $("signupBox").classList.add("hidden");
}

function showSignup(){

 $("loginBox").classList.add("hidden");
 $("signupBox").classList.remove("hidden");
}

async function login(){

 const email=
   $("loginEmail").value.trim();

 const password=
   $("loginPassword").value;

 if(!email||!password){
  toast("Email এবং Password দিন");
  return;
 }

 try{

  const res=await fetch(
   SUPABASE_URL+
   "/auth/v1/token?grant_type=password",
   {
    method:"POST",
    headers:{
     "apikey":SUPABASE_KEY,
     "Content-Type":"application/json"
    },
    body:JSON.stringify({
     email,
     password
    })
   }
  );

  const data=await res.json();

  if(!res.ok)
   throw new Error(
    data.error_description||
    data.msg||
    "Login failed"
   );

  session=data;

  currentUser=data.user;

  localStorage.setItem(
   "friendbook_session",
   JSON.stringify(data)
  );

  openApp();

 }catch(e){

  toast(e.message);
 }
}


async function signup(){

 const name=
   $("signupName").value.trim();

 const email=
   $("signupEmail").value.trim();

 const password=
   $("signupPassword").value;

 if(!name||!email||!password){
  toast("সব তথ্য দিন");
  return;
 }

 if(password.length<6){
  toast("Password কমপক্ষে ৬ অক্ষরের দিন");
  return;
 }

 try{

  const res=await fetch(
   SUPABASE_URL+
   "/auth/v1/signup",
   {
    method:"POST",
    headers:{
     "apikey":SUPABASE_KEY,
     "Content-Type":"application/json"
    },
    body:JSON.stringify({
     email,
     password,
     data:{name:name}
    })
   }
  );

  const data=await res.json();

  if(!res.ok)
   throw new Error(
    data.msg||
    data.message||
    "Signup failed"
   );

  toast(
   "Account তৈরি হয়েছে। Email verification প্রয়োজন হলে Email দেখুন।"
  );

  showLogin();

 }catch(e){

  toast(e.message);
 }
}


async function logout(){

 localStorage.removeItem(
  "friendbook_session"
 );

 session=null;
 currentUser=null;

 $("app").classList.add("hidden");
 $("authPage").classList.remove("hidden");

 showLogin();

 toast("Logout হয়েছে");
}


function openApp(){

 $("authPage").classList.add("hidden");
 $("app").classList.remove("hidden");

 showHome();
}


/* =====================================
   PROFILE
===================================== */

async function getProfile(userId){

 try{

  const rows=
   await api(
    encodeURIComponent("my social app")+
    "?select=*&id=eq."+
    userId+
    "&limit=1"
   );

  return rows?.[0]||null;

 }catch(e){

  return null;
}

async function createPost(){

 const text=
  $("postTextModal").value.trim();

 const feeling=
  $("postFeelingModal").value.trim();

 const privacy=
  $("postPrivacyModal").value;

 const file=
  $("postImageModal").files[0];

 if(!text&&!file){
  toast("কিছু লিখুন অথবা ছবি দিন");
  return;
 }

 try{

  let imageUrl=null;

  if(file){

   const path=
    currentUser.id+
    "/"+
    Date.now()+
    "_"+
    file.name.replace(/\s+/g,"_");

   const upload=await fetch(
    SUPABASE_URL+
    "/storage/v1/object/post-images/"+
    path,
    {
     method:"POST",
     headers:{
      "apikey":SUPABASE_KEY,
      "Authorization":
       "Bearer "+session.access_token,
      "Content-Type":file.type
     },
     body:file
    }
   );

   if(!upload.ok)
    throw new Error(
     await upload.text()
    );

   imageUrl=
    SUPABASE_URL+
    "/storage/v1/object/public/post-images/"+
    path;
  }

  await api(
   "posts",
   {
    method:"POST",
    headers:{
     "Prefer":"return=minimal"
    },
    body:JSON.stringify({
     user_id:currentUser.id,
     text,
     image_url:imageUrl,
     privacy,
     feeling:feeling||null
    })
   }
  );

  closeModal();

  toast("Post published 🎉");

  showHome();

 }catch(e){

  toast(e.message);
 }
}

async function loadPosts(){

 const feed=$("feed");

 if(!feed)return;

 feed.innerHTML=
  `<div class="empty">Loading...</div>`;

 try{

  let query=
   "posts?select=*&order=created_at.desc&limit=50";

  if(feedMode==="mine")
   query=
    "posts?select=*&user_id=eq."+
    currentUser.id+
    "&order=created_at.desc&limit=50";

  const posts=await api(query);

  if(!posts?.length){

   feed.innerHTML=
    `<div class="card empty">

   return;

   `<div class="card">

async function buildPost(post){

 const profile=
  await getProfile(post.user_id);

 const name=
  profile?.name||
  "FriendBook User";

 const avatar=
  profile?.profile_photo||"";

 let reactions=[];
 let comments=[];

 try{

  reactions=await api(
   "post_reactions?select=*&post_id=eq."+
   post.id
  );

 }catch{}

 try{

  comments=await api(
   "comments?select=*&post_id=eq."+
   post.id+
   "&order=created_at.asc"
  );

 }catch{}

 const myReaction=
  reactions.find(
   x=>x.user_id===currentUser.id
  );

 const card=document.createElement("div");

 card.className="card";

 card.innerHTML=`

 <div class="post-head">

  ${
   avatar
   ?
   `<img class="avatar"
     src="${escapeHTML(avatar)}">`
   :
   `<div class="avatar"></div>`
  }

  <div>

   <div class="post-user">
    ${escapeHTML(name)}
   </div>

   <div class="post-time">
    ${timeAgo(post.created_at)}
    ·
    ${post.privacy==="public"?"🌍":
      post.privacy==="friends"?"👥":"🔒"}

    ${post.edited_at?" · edited":""}
   </div>

  </div>

  ${
   post.user_id===currentUser.id
   ?
   `<button class="post-menu"
     onclick="postMenu(${post.id})">
     ⋯
    </button>`
   :""
  }

 </div>


 ${
  post.feeling
  ?
  `<div style="margin-top:10px;color:var(--muted)">
   ${escapeHTML(post.feeling)}
   </div>`
  :""
 }


 ${
  post.text
  ?
  `<div class="post-text">
   ${escapeHTML(post.text)}
   </div>`
  :""
 }


 ${
  post.image_url
  ?
  `<img class="post-image"
    src="${escapeHTML(post.image_url)}"
    loading="lazy">`
  :""
 }


 <div class="post-meta">

  <span>
   ❤️ ${formatCount(reactions.length)}
  </span>

  <span>
   💬 ${formatCount(comments.length)}
   · 👁️ ${formatCount(post.view_count||0)}
  </span>

 </div>


 <div class="post-actions">

  <div class="reaction-wrap">

   <button
    class="post-action"
    onclick="toggleReactionBox(${post.id})">
    ${myReaction?
      reactionIcon(myReaction.reaction):
      "👍"} Like
   </button>

   <div
    id="reaction-${post.id}"
    class="reaction-box hidden">

    <button onclick="react(${post.id},'like')">👍</button>
    <button onclick="react(${post.id},'love')">❤️</button>
    <button onclick="react(${post.id},'haha')">😂</button>
    <button onclick="react(${post.id},'wow')">😮</button>
    <button onclick="react(${post.id},'sad')">😢</button>
    <button onclick="react(${post.id},'angry')">😡</button>

   </div>

  </div>

  <button
   class="post-action"
   onclick="focusComment(${post.id})">
   💬 Comment
  </button>

  <button
   class="post-action"
   onclick="sharePost(${post.id})">
   ↗ Share
  </button>

  <button
   class="post-action"
   onclick="savePost(${post.id})">
   🔖 Save
  </button>

 </div>


 <div
  id="comments-${post.id}"
  class="comment-list">

  ${renderComments(comments)}

 </div>


 <div class="comment-input-row">

  <input
   id="comment-${post.id}"
   placeholder="Write a comment..."
   onkeydown="if(event.key==='Enter')addComment(${post.id})">

  <button
   onclick="addComment(${post.id})">
   Send
  </button>

 </div>

 `;

 return card;
}


function reactionIcon(type){

 return {
  like:"👍",
  love:"❤️",
  haha:"😂",
  wow:"😮",
  sad:"😢",
  angry:"😡"
 }[type]||"👍";
}


function renderComments(comments){

 if(!comments?.length)return "";

 return comments.map(c=>`

 <div class="comment">

  <div class="avatar"
   style="width:35px;height:35px">
  </div>

  <div class="comment-body">

   <div class="comment-name">
    FriendBook User
   </div>

   <div class="comment-text">
    ${escapeHTML(c.text)}
   </div>

  </div>

 </div>

 `).join("");
}

async function react(postId,reaction){

 try{

  const existing=await api(
   "post_reactions?select=*&post_id=eq."+
   postId+
   "&user_id=eq."+
   currentUser.id+
   "&limit=1"
  );

  if(existing?.length){

   if(existing[0].reaction===reaction){

    await api(
     "post_reactions?id=eq."+
     existing[0].id,
     {method:"DELETE"}
    );

   }else{

    await api(
     "post_reactions?id=eq."+
     existing[0].id,
     {
      method:"PATCH",
      headers:{
       "Prefer":"return=minimal"
      },
      body:JSON.stringify({
       reaction
      })
     }
    );
   }

  }else{

   await api(
    "post_reactions",
    {
     method:"POST",
     headers:{
      "Prefer":"return=minimal"
     },
     body:JSON.stringify({
      post_id:postId,
      user_id:currentUser.id,
      reaction
     })
    }
   );
  }

  loadPosts();

 }catch(e){

  toast(e.message);
 }
}

  box.innerHTML="";

  rows.forEach(p=>{

   const div=document.createElement("div");

   div.className="card";

   div.innerHTML=`

   <div class="search-result">

    ${
     p.profile_photo
     ?
     `<img class="avatar"
       src="${escapeHTML(p.profile_photo)}">`
     :
     `<div class="avatar"></div>`
    }

    <div style="flex:1">
     <strong>
      ${escapeHTML(p.name||"User")}
     </strong>
    </div>

    ${
     p.id!==currentUser.id
     ?
     `<button
       class="primary"
       onclick="followUser('${p.id}')">
       Follow
      </button>`
     :""
    }

   </div>

   `;

   box.appendChild(div);
  });

 }catch(e){

  toast(e.message);
 }
}


function globalSearch(event){

 if(event.key!=="Enter")return;

 const q=
  event.target.value.trim();

 if(!q)return;

 showSearchPage();

 setTimeout(()=>{

  $("searchInput").value=q;

  doSearch();

 },50);
}

async function showNotifications(){

   rows.map(n=>`

   `).join("");

 }catch(e){

  $("notifications").innerHTML=
   `<div class="empty">

}

   MODAL
===================================== */

function closeModal(event){

 if(event &&
    event.target!==$("modalBg"))
  return;

 $("modalBg").classList.add("hidden");
}


/* =====================================
   INIT
===================================== */

async function start(){

 if(
  localStorage.getItem(
   "friendbook_dark"
  )==="1"
 ){
  document.body.classList.add("dark");
 }

 const saved=
  localStorage.getItem(
   "friendbook_session"
  );

 if(!saved){

  $("authPage").classList.remove("hidden");
  $("app").classList.add("hidden");

  return;
 }

 try{

  session=JSON.parse(saved);

  const res=
   await fetch(
    SUPABASE_URL+"/auth/v1/user",
    {
     headers:{
      "apikey":SUPABASE_KEY,
      "Authorization":
       "Bearer "+session.access_token
     }
    }
   );

  if(!res.ok)
   throw new Error();

  currentUser=
   await res.json();

  openApp();

 }catch{

  localStorage.removeItem(
   "friendbook_session"
  );

  $("authPage").classList.remove("hidden");
  $("app").classList.add("hidden");
 }
}

start();

</script>
