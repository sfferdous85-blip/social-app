<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#1877f2">
<title>FriendBook</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
:root{
 --blue:#1877f2;
 --bg:#f0f2f5;
 --card:#fff;
 --text:#050505;
 --muted:#65676b;
 --border:#dddfe2;
 --danger:#e41e3f;
 --green:#31a24c;
}
body.dark{
 --bg:#18191a;
 --card:#242526;
 --text:#e4e6eb;
 --muted:#b0b3b8;
 --border:#3a3b3c;
}
body{
 margin:0;
 background:var(--bg);
 color:var(--text);
 font-family:Arial,"Noto Sans Bengali",sans-serif;
}
button,input,textarea,select{
 font:inherit;
}
button{
 border:0;
 cursor:pointer;
}
.top{
 position:sticky;
 top:0;
 z-index:100;
 height:60px;
 background:var(--card);
 border-bottom:1px solid var(--border);
 display:flex;
 align-items:center;
 gap:10px;
 padding:7px 12px;
}
.logo{
 color:var(--blue);
 font-size:25px;
 font-weight:800;
 white-space:nowrap;
}
.search{
 flex:1;
 max-width:430px;
}
.search input{
 width:100%;
 border:0;
 outline:0;
 background:var(--bg);
 color:var(--text);
 border-radius:22px;
 padding:11px 16px;
}
.top-actions{
 margin-left:auto;
 display:flex;
 gap:6px;
}
.iconbtn{
 width:42px;
 height:42px;
 border-radius:50%;
 background:var(--bg);
 color:var(--text);
}
.iconbtn:hover{background:var(--border)}
.app{
 max-width:1250px;
 margin:auto;
 display:grid;
 grid-template-columns:230px minmax(0,650px) 280px;
 gap:16px;
 padding:15px;
}
.side,.right{
 position:sticky;
 top:75px;
 height:max-content;
}
.card{
 background:var(--card);
 border:1px solid var(--border);
 border-radius:12px;
 margin-bottom:14px;
 overflow:hidden;
}
.pad{padding:14px}
.navbtn{
 width:100%;
 display:flex;
 align-items:center;
 gap:12px;
 padding:12px;
 margin-bottom:4px;
 background:transparent;
 color:var(--text);
 border-radius:10px;
 text-align:left;
}
.navbtn:hover{background:var(--bg)}
.navbtn.active{
 background:#e7f3ff;
 color:var(--blue);
 font-weight:700;
}
.dark .navbtn.active{background:#263c55}
.avatar{
 width:42px;
 height:42px;
 border-radius:50%;
 object-fit:cover;
 background:#ddd;
}
.avatar.big{
 width:85px;
 height:85px;
}
.userrow{
 display:flex;
 align-items:center;
 gap:10px;
}
.name{font-weight:700}
.muted{color:var(--muted);font-size:13px}
h2,h3{margin:5px 0 12px}
.hidden{display:none!important}
.center{text-align:center}
.form{
 display:flex;
 flex-direction:column;
 gap:10px;
}
.form input,.form textarea,.form select{
 width:100%;
 padding:12px;
 border:1px solid var(--border);
 border-radius:9px;
 background:var(--card);
 color:var(--text);
 outline:none;
}
.form textarea{min-height:90px;resize:vertical}
.btn{
 background:var(--blue);
 color:white;
 padding:10px 15px;
 border-radius:8px;
 font-weight:700;
}
.btn.gray{
 background:var(--bg);
 color:var(--text);
}
.btn.red{background:var(--danger)}
.btn.green{background:var(--green)}
.btn.small{
 padding:7px 10px;
 font-size:13px;
}
.row{
 display:flex;
 align-items:center;
 gap:8px;
 flex-wrap:wrap;
}
.space{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:8px;
}
.storybar{
 display:flex;
 gap:10px;
 overflow-x:auto;
 padding:12px;
}
.story{
 min-width:92px;
 height:145px;
 border-radius:10px;
 overflow:hidden;
 position:relative;
 background:linear-gradient(135deg,#1877f2,#8b5cf6);
 color:white;
 display:flex;
 align-items:center;
 justify-content:center;
 text-align:center;
 padding:8px;
}
.story img{
 width:100%;
 height:100%;
 object-fit:cover;
 position:absolute;
 inset:0;
}
.story span{
 position:relative;
 z-index:2;
 font-weight:bold;
 text-shadow:0 1px 3px #000;
}
.post-head{
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:12px;
}
.post-text{
 padding:0 12px 12px;
 white-space:pre-wrap;
 word-break:break-word;
}
.post-img{
 width:100%;
 max-height:520px;
 object-fit:cover;
 background:#111;
}
.post-stats{
 padding:8px 12px;
 color:var(--muted);
 border-bottom:1px solid var(--border);
}
.post-actions{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 padding:5px;
}
.post-actions button{
 background:transparent;
 color:var(--muted);
 padding:10px 4px;
 border-radius:7px;
}
.post-actions button:hover{background:var(--bg)}
.reactionbox{
 display:flex;
 gap:5px;
 flex-wrap:wrap;
 padding:10px 12px;
 border-top:1px solid var(--border);
}
.react{
 background:var(--bg);
 padding:7px 9px;
 border-radius:18px;
}
.comment{
 padding:8px 12px;
}
.commentbubble{
 background:var(--bg);
 border-radius:16px;
 padding:8px 12px;
 display:inline-block;
 max-width:90%;
}
.comment-actions{
 font-size:12px;
 color:var(--muted);
 display:flex;
 gap:12px;
 padding:3px 10px;
}
.comment-input{
 display:flex;
 gap:7px;
 padding:10px 12px;
}
.comment-input input{
 flex:1;
 border:1px solid var(--border);
 border-radius:20px;
 padding:9px 13px;
 background:var(--card);
 color:var(--text);
}
.reels{
 display:flex;
 flex-direction:column;
 gap:12px;
}
.reel{
 height:78vh;
 min-height:500px;
 background:#000;
 border-radius:12px;
 position:relative;
 overflow:hidden;
 color:#fff;
}
.reel video{
 width:100%;
 height:100%;
 object-fit:cover;
}
.reel-overlay{
 position:absolute;
 inset:auto 0 0;
 padding:18px;
 background:linear-gradient(transparent,rgba(0,0,0,.75));
}
.reel-buttons{
 position:absolute;
 right:12px;
 bottom:100px;
 display:flex;
 flex-direction:column;
 gap:10px;
}
.reel-buttons button{
 width:48px;
 height:48px;
 border-radius:50%;
 background:rgba(0,0,0,.55);
 color:#fff;
 font-size:20px;
}
.profile-cover{
 height:250px;
 background:linear-gradient(135deg,#1877f2,#7c3aed);
 overflow:hidden;
}
.profile-cover img{
 width:100%;
 height:100%;
 object-fit:cover;
}
.profile-info{
 margin-top:-45px;
 position:relative;
 padding:0 18px 18px;
}
.profile-info .avatar{
 border:5px solid var(--card);
}
.tabs{
 display:flex;
 gap:4px;
 overflow:auto;
 border-top:1px solid var(--border);
}
.tabs button{
 background:transparent;
 color:var(--text);
 padding:13px;
 white-space:nowrap;
}
.tabs button.active{
 color:var(--blue);
 border-bottom:3px solid var(--blue);
}
.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px;
}
.feature{
 padding:13px;
 border:1px solid var(--border);
 border-radius:10px;
 background:var(--card);
}
.feature b{display:block;margin-bottom:5px}
.badge{
 display:inline-block;
 padding:4px 8px;
 border-radius:12px;
 background:#e7f3ff;
 color:var(--blue);
 font-size:12px;
}
.chat{
 height:62vh;
 display:flex;
 flex-direction:column;
}
.chat-list{
 max-height:180px;
 overflow:auto;
 border-bottom:1px solid var(--border);
}
.chat-user{
 padding:10px;
 cursor:pointer;
 display:flex;
 gap:8px;
 align-items:center;
}
.chat-user:hover{background:var(--bg)}
.messages{
 flex:1;
 overflow:auto;
 padding:12px;
}
.msg{
 max-width:75%;
 padding:9px 12px;
 margin:5px 0;
 border-radius:17px;
 background:var(--bg);
}
.msg.me{
 margin-left:auto;
 background:var(--blue);
 color:#fff;
}
.chat-compose{
 display:flex;
 gap:8px;
 padding:10px;
 border-top:1px solid var(--border);
}
.chat-compose input{
 flex:1;
 padding:11px;
 border:1px solid var(--border);
 border-radius:22px;
 background:var(--card);
 color:var(--text);
}
.modal{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.6);
 z-index:500;
 display:flex;
 justify-content:center;
 align-items:center;
 padding:15px;
}
.modal-box{
 width:min(650px,100%);
 max-height:90vh;
 overflow:auto;
 background:var(--card);
 color:var(--text);
 border-radius:14px;
}
.modal-head{
 padding:14px;
 border-bottom:1px solid var(--border);
 display:flex;
 justify-content:space-between;
 align-items:center;
}
.close{
 background:transparent;
 color:var(--text);
 font-size:22px;
}
.toast{
 position:fixed;
 bottom:20px;
 left:50%;
 transform:translateX(-50%);
 background:#222;
 color:#fff;
 padding:11px 17px;
 border-radius:20px;
 z-index:999;
 display:none;
}
.login-page{
 min-height:100vh;
 display:flex;
 justify-content:center;
 align-items:center;
 padding:20px;
}
.login-box{
 width:min(420px,100%);
}
.statgrid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px;
}
.stat{
 padding:15px;
 border-radius:10px;
 background:var(--bg);
 text-align:center;
}
.stat b{
 display:block;
 font-size:24px;
 color:var(--blue);
}
.list-item{
 display:flex;
 gap:10px;
 align-items:center;
 padding:12px;
 border-bottom:1px solid var(--border);
}
.list-item:last-child{border-bottom:0}
.empty{
 padding:30px;
 text-align:center;
 color:var(--muted);
}
.tag{
 color:var(--blue);
 font-weight:bold;
}
@media(max-width:950px){
 .app{grid-template-columns:70px minmax(0,1fr)}
 .right{display:none}
 .side .navtext{display:none}
 .side{position:sticky}
 .navbtn{justify-content:center}
 .logo{font-size:21px}
}
@media(max-width:650px){
 .app{display:block;padding:8px}
 .side{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;background:var(--card);border-top:1px solid var(--border);z-index:90;padding:3px;display:flex;justify-content:space-around}
 .side .card{display:contents}
 .side .navbtn{width:auto;margin:0;padding:8px 10px}
 .side .navbtn span:first-child{font-size:20px}
 .top{height:55px}
 .search{display:none}
 .logo{margin:auto}
 .reel{height:75vh}
 .grid{grid-template-columns:1fr}
 body{padding-bottom:60px}
}
</style>
</head>

<body>

<div id="toast" class="toast"></div>

<!-- LOGIN -->
<section id="loginPage" class="login-page">
 <div class="login-box">
  <div class="card pad">
   <div class="center">
    <div class="logo">FriendBook</div>
    <p class="muted">Connect • Share • Create</p>
   </div>

   <div id="loginForm" class="form">
    <input id="loginEmail" type="email" placeholder="Email">
    <input id="loginPassword" type="password" placeholder="Password">
    <button class="btn" onclick="login()">Login</button>
    <button class="btn gray" onclick="showSignup()">Create new account</button>
   </div>

   <div id="signupForm" class="form hidden">
    <input id="signupName" placeholder="আপনার নাম">
    <input id="signupUsername" placeholder="Username">
    <input id="signupEmail" type="email" placeholder="Email">
    <input id="signupPassword" type="password" placeholder="Password">
    <button class="btn" onclick="signup()">Create account</button>
    <button class="btn gray" onclick="showLogin()">Back to login</button>
   </div>
  </div>
 </div>
</section>

<!-- APP -->
<section id="appPage" class="hidden">

<header class="top">
 <div class="logo">FriendBook</div>

 <div class="search">
  <input id="globalSearch" placeholder="🔎 Search people, posts, reels..." onkeydown="if(event.key==='Enter')searchAll()">
 </div>

 <div class="top-actions">
  <button class="iconbtn" onclick="openPage('notifications')">🔔</button>
  <button class="iconbtn" onclick="openPage('messages')">💬</button>
  <button class="iconbtn" onclick="toggleDark()">🌙</button>
  <button class="iconbtn" onclick="logout()">🚪</button>
 </div>
</header>

<div class="app">

<aside class="side">
 <div class="card pad">
  <button class="navbtn active" onclick="openPage('home',this)">🏠 <span class="navtext">Home</span></button>
  <button class="navbtn" onclick="openPage('reels',this)">🎬 <span class="navtext">Reels</span></button>
  <button class="navbtn" onclick="openPage('stories',this)">📖 <span class="navtext">Stories</span></button>
  <button class="navbtn" onclick="openPage('friends',this)">👥 <span class="navtext">Friends</span></button>
  <button class="navbtn" onclick="openPage('messages',this)">💬 <span class="navtext">Messenger</span></button>
  <button class="navbtn" onclick="openPage('groups',this)">👨‍👩‍👧 <span class="navtext">Groups</span></button>
  <button class="navbtn" onclick="openPage('pages',this)">📄 <span class="navtext">Pages</span></button>
  <button class="navbtn" onclick="openPage('marketplace',this)">🛒 <span class="navtext">Marketplace</span></button>
  <button class="navbtn" onclick="openPage('events',this)">📅 <span class="navtext">Events</span></button>
  <button class="navbtn" onclick="openPage('creator',this)">💰 <span class="navtext">Creator</span></button>
  <button class="navbtn" onclick="openPage('profile',this)">👤 <span class="navtext">Profile</span></button>
  <button class="navbtn" onclick="openPage('settings',this)">⚙️ <span class="navtext">Settings</span></button>
 </div>
</aside>

<main id="main"></main>

<aside class="right">
 <div class="card pad">
  <h3>FriendBook</h3>
  <p class="muted">আপনার জন্য সাজানো কনটেন্ট</p>
  <button class="btn small" onclick="openPage('search')">🔎 Explore</button>
 </div>

 <div class="card pad">
  <h3>Quick Actions</h3>
  <button class="navbtn" onclick="openPostModal()">📝 Create Post</button>
  <button class="navbtn" onclick="openReelModal()">🎬 Upload Reel</button>
  <button class="navbtn" onclick="openStoryModal()">📖 Add Story</button>
 </div>
</aside>

</div>
</section>

<!-- MODAL -->
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()">
 <div id="modalBox" class="modal-box"></div>
</div>

<script>
/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://skereuaizdczbvjplisi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_3R2otJA1zIlsMsTYxe1ocw_NAPY5O9x";

const sb = window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

let currentUser = null;
let currentProfile = null;
let currentChatUser = null;
let currentPage = "home";
let realtimeChannel = null;

/* =========================
   HELPERS
========================= */

const $ = id => document.getElementById(id);

function toast(text){
 const t=$("toast");
 t.textContent=text;
 t.style.display="block";
 clearTimeout(window.toastTimer);
 window.toastTimer=setTimeout(()=>t.style.display="none",2500);
}

function esc(v){
 return String(v??"")
 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;");
}

function timeAgo(date){
 if(!date)return "";
 const s=Math.floor((Date.now()-new Date(date).getTime())/1000);
 if(s<60)return "এইমাত্র";
 if(s<3600)return Math.floor(s/60)+" মিনিট আগে";
 if(s<86400)return Math.floor(s/3600)+" ঘণ্টা আগে";
 return Math.floor(s/86400)+" দিন আগে";
}

function avatar(url,name="User"){
 return url || "https://ui-avatars.com/api/?name="+encodeURIComponent(name);
}

async function safeQuery(fn){
 try{
  const r=await fn();
  if(r.error) throw r.error;
  return r.data;
 }catch(e){
  console.warn(e);
  return null;
}

}

function openModal(html){
 $("modalBox").innerHTML=html;
 $("modal").classList.remove("hidden");
}

function closeModal(){
 $("modal").classList.add("hidden");
}

function openPage(page,btn){
 currentPage=page;

 document.querySelectorAll(".navbtn").forEach(x=>x.classList.remove("active"));
 if(btn)btn.classList.add("active");

 const pages={
  home:renderHome,
  reels:renderReels,
  stories:renderStories,
  friends:renderFriends,
  messages:renderMessages,
  groups:renderGroups,
  pages:renderPages,
  marketplace:renderMarketplace,
  events:renderEvents,
  creator:renderCreator,
  profile:renderProfile,
  settings:renderSettings,
  notifications:renderNotifications,
  search:renderSearch,
  admin:renderAdmin
 };

 (pages[page]||renderHome)();
 window.scrollTo(0,0);
}

function toggleDark(){
 document.body.classList.toggle("dark");
 localStorage.setItem(
  "friendbook_dark",
  document.body.classList.contains("dark")?"1":"0"
 );
}

if(localStorage.getItem("friendbook_dark")==="1"){
 document.body.classList.add("dark");
}

/* =========================
   AUTH
========================= */

function showSignup(){
 $("loginForm").classList.add("hidden");
 $("signupForm").classList.remove("hidden");
}

function showLogin(){
 $("signupForm").classList.add("hidden");
 $("loginForm").classList.remove("hidden");
}

async function signup(){
 const name=$("signupName").value.trim();
 const username=$("signupUsername").value.trim().replace(/\s+/g,"");
 const email=$("signupEmail").value.trim();
 const password=$("signupPassword").value;

 if(!name||!email||!password){
  toast("সব তথ্য পূরণ করুন");
  return;
 }

 const {data,error}=await sb.auth.signUp({
  email,
  password
 });

 if(error){
  toast(error.message);
  return;
 }

 if(data.user){
  await safeQuery(()=>sb.from("fb_profiles").insert({
   id:data.user.id,
   name,
   username:username||null,
   bio:"",
   profile_photo:"",
   cover_photo:"",
   online:true,
   last_seen:new Date().toISOString()
  }));
 }

 toast("Account তৈরি হয়েছে। Email verification লাগতে পারে।");
 showLogin();
}

async function login(){
 const email=$("loginEmail").value.trim();
 const password=$("loginPassword").value;

 const {data,error}=await sb.auth.signInWithPassword({
  email,password
 });

 if(error){
  toast(error.message);
  return;
 }

 currentUser=data.user;
 await startApp();
}

async function logout(){
 if(currentUser){
  await safeQuery(()=>sb.from("fb_profiles")
   .update({
    online:false,
    last_seen:new Date().toISOString()
   })
   .eq("id",currentUser.id)
  );
 }

 await sb.auth.signOut();
 currentUser=null;
 currentProfile=null;
 $("appPage").classList.add("hidden");
 $("loginPage").classList.remove("hidden");
}

async function startApp(){
 $("loginPage").classList.add("hidden");
 $("appPage").classList.remove("hidden");

 const {data:{user}}=await sb.auth.getUser();
 currentUser=user;

 if(!currentUser)return;

 currentProfile=await safeQuery(()=>sb.from("fb_profiles")
  .select("*")
  .eq("id",currentUser.id)
  .maybeSingle());

 if(!currentProfile){
  currentProfile={
   id:currentUser.id,
   name:currentUser.email?.split("@")[0]||"User",
   username:"",
   bio:"",
   profile_photo:"",
   cover_photo:""
  };

  await safeQuery(()=>sb.from("fb_profiles").insert(currentProfile));
 }

 await safeQuery(()=>sb.from("fb_profiles")
  .update({
   online:true,
   last_seen:new Date().toISOString()
  })
  .eq("id",currentUser.id)
 );

 openPage("home");
 subscribeRealtime();
}

sb.auth.onAuthStateChange(async(event,session)=>{
 if(session && !currentUser){
  currentUser=session.user;
  await startApp();
 }
});

/* =========================
   REALTIME
========================= */

function subscribeRealtime(){
 try{
  if(realtimeChannel)sb.removeChannel(realtimeChannel);

  realtimeChannel=sb.channel("friendbook-live")
  .on(
   "postgres_changes",
   {event:"*",schema:"public",table:"fb_notifications"},
   ()=>{ if(currentPage==="notifications")renderNotifications(); }
  )
  .on(
   "postgres_changes",
   {event:"*",schema:"public",table:"fb_messages"},
   ()=>{ if(currentPage==="messages")renderMessages(); }
  )
  .subscribe();
 }catch(e){}
}

/* =========================
   HOME
========================= */

async function renderHome(){
 $("main").innerHTML=`
  <div class="card">
   <div class="storybar" id="storyPreview">
    <div class="empty">Stories loading...</div>
   </div>
  </div>

  <div class="card pad">
   <div class="userrow">
    <img class="avatar" src="${avatar(currentProfile?.profile_photo,currentProfile?.name)}">
    <button class="gray btn" style="flex:1;text-align:left" onclick="openPostModal()">
     ${esc(currentProfile?.name||"আপনি")} কী ভাবছেন?
    </button>
   </div>

   <div class="row" style="margin-top:12px">
    <button class="btn gray small" onclick="openPostModal()">📷 Photo</button>
    <button class="btn gray small" onclick="openPostModal()">🎥 Video</button>
    <button class="btn gray small" onclick="openPostModal()">😊 Feeling</button>
    <button class="btn gray small" onclick="openPollModal()">📊 Poll</button>
   </div>
  </div>

  <div id="feed">
   <div class="empty">Feed loading...</div>
  </div>
 `;

 loadStoryPreview();
 loadFeed();
}

async function loadStoryPreview(){

async function reactPost(postId,reaction){
 if(!currentUser)return;

 const existing=await safeQuery(()=>sb.from("fb_post_reactions")
  .select("id,reaction")
  .eq("post_id",postId)
  .eq("user_id",currentUser.id)
  .maybeSingle());

 if(existing){
  if(existing.reaction===reaction){
   await safeQuery(()=>sb.from("fb_post_reactions")
    .delete().eq("id",existing.id));
  }else{
   await safeQuery(()=>sb.from("fb_post_reactions")
    .update({reaction}).eq("id",existing.id));
  }
 }else{
  await safeQuery(()=>sb.from("fb_post_reactions").insert({
   post_id:postId,
   user_id:currentUser.id,
   reaction
  }));
 }

 await createPostNotification(postId,"like");

 toast("Reaction updated");
}

async function createPost(){
 const text=$("newPostText").value.trim();

 if(!text && !$("newPostImage").value.trim()){
  toast("Post-এ কিছু লিখুন");
  return;
 }

 const {data,error}=await sb.from("fb_posts").insert({
  user_id:currentUser.id,
  text,
  image_url:$("newPostImage").value.trim(),
  privacy:$("newPostPrivacy").value,
  feeling:$("newPostFeeling").value.trim(),
  location:$("newPostLocation").value.trim()
 }).select().single();

 if(error){
  toast(error.message);
  return;
 }

 /* Hashtag handling */
 const hashtags=[...text.matchAll(/#([a-zA-Z0-9_\u0980-\u09FF]+)/g)]
  .map(x=>x[1]);

 for(const tag of hashtags){
  let h=await safeQuery(()=>sb.from("fb_hashtags")
   .select("*")
   .eq("name",tag)
   .maybeSingle());

  if(!h){
   h=await safeQuery(()=>sb.from("fb_hashtags")
    .insert({name:tag})
    .select().single());
  }

  if(h?.id){
   await safeQuery(()=>sb.from("fb_post_hashtags").insert({
    post_id:data.id,
    hashtag_id:h.id
   }));
  }
 }

 closeModal();
 toast("Post published 🎉");
 renderHome();
}

function toggleVideoSound(video){
 video.muted=!video.muted;
 toast(video.muted?"🔇 Sound off":"🔊 Sound on");
}

function setupReelObserver(reels){
 const observer=new IntersectionObserver(entries=>{
  entries.forEach(e=>{
   const v=e.target.querySelector("video");
   if(e.isIntersecting){
    v.play().catch(()=>{});
    recordReelView(e.target.id.replace("reel-",""));
   }else{
    v.pause();
   }
  });
 },{threshold:.65});

 document.querySelectorAll(".reel").forEach(x=>observer.observe(x));
}

async function followUser(id){
 if(id===currentUser.id)return;

 const old=await safeQuery(()=>sb.from("fb_follows")
  .select("id").eq("follower_id",currentUser.id)
  .eq("following_id",id).maybeSingle());

 if(old){
  await safeQuery(()=>sb.from("fb_follows").delete().eq("id",old.id));
  toast("Unfollowed");
 }else{
  await safeQuery(()=>sb.from("fb_follows").insert({
   follower_id:currentUser.id,
   following_id:id
  }));

  await notifyUser(id,"follow","আপনাকে follow করেছে");
  toast("Following");
 }
}

async function sendFriendRequest(id){
 const old=await safeQuery(()=>sb.from("fb_friend_requests")
  .select("*")
  .eq("sender_id",currentUser.id)
  .eq("receiver_id",id)
  .maybeSingle());

 if(old){
  toast("Request already sent");
  return;
 }

 await safeQuery(()=>sb.from("fb_friend_requests").insert({
  sender_id:currentUser.id,
  receiver_id:id,
  status:"pending"
 }));

 await notifyUser(id,"friend_request","Friend request পাঠিয়েছে");
 toast("Friend request sent");
}

async function acceptFriend(id){
 const req=await safeQuery(()=>sb.from("fb_friend_requests")
  .select("*")
  .eq("id",id)
  .maybeSingle());

 if(!req)return;

 await safeQuery(()=>sb.from("fb_friend_requests")
  .update({status:"accepted"}).eq("id",id));

 await safeQuery(()=>sb.from("fb_friends").insert([
  {user_id:currentUser.id,friend_id:req.sender_id},
  {user_id:req.sender_id,friend_id:currentUser.id}
 ]));

 await notifyUser(req.sender_id,"friend_accepted","Friend request accepted");
 renderFriends();
}

async function rejectFriend(id){
 await safeQuery(()=>sb.from("fb_friend_requests")
  .update({status:"rejected"}).eq("id",id));
 renderFriends();
}

async function openChat(id){

 if(currentPage!=="messages"){
  openPage("messages");
  return;
 }

  .select("*").eq("id",id).maybeSingle());

  .select("*")
  .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${id}),and(sender_id.eq.${id},receiver_id.eq.${currentUser.id})`)
  .order("created_at",{ascending:true}));

 $("messages").innerHTML=`

 `).join("");

 await safeQuery(()=>sb.from("fb_messages")
  .update({seen:true})
  .eq("sender_id",id)
  .eq("receiver_id",currentUser.id));

 $("messages").scrollTop=$("messages").scrollHeight;

 const text=input.value.trim();

 if(!text)return;

  sender_id:currentUser.id,
  receiver_id:currentChatUser,
  text,
  seen:false
 }));

  return;
 }

 input.value="";
 await notifyUser(currentChatUser,"message","আপনার কাছে নতুন message এসেছে");
 openChat(currentChatUser);
}

   })
   .eq("id",currentUser.id));
 }
},60000);

/* =========================
   SESSION CHECK
========================= */

(async()=>{
 const {data:{session}}=await sb.auth.getSession();

 if(session){
  currentUser=session.user;
  await startApp();
 }
})();

</script>
